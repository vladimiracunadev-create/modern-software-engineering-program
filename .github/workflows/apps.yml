name: Apps

# Construye las aplicaciones de Windows y Android a partir del portal site/ y verifica cada
# artefacto abriéndolo. No publica nada: el release lo crea una persona con `gh release create`
# a partir de los artefactos de esta ejecución (docs/APPS.md).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths:
      - ".github/workflows/apps.yml"
      - "apps/**"
      - "scripts/build_apps.py"
      - "scripts/verify_apps.py"

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (exe, portable, setup, msi)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pyinstaller==6.19.0 pillow==12.2.0

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.*

      - name: Build the four Windows artifacts
        run: python scripts/build_apps.py windows --installers

      - name: Checksums
        run: python scripts/build_apps.py sums windows

      - name: Open every artifact and count its content
        run: python scripts/verify_apps.py --dir dist --require windows --report dist/verify-windows.json

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.msi
            dist/SHA256SUMS-windows.txt
            dist/verify-windows.json
          if-no-files-found: error

  android:
    name: Android (universal APK and one per ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Copy the portal into the Capacitor project
        run: python scripts/build_apps.py android-prepare

      - name: Create the Android project
        working-directory: apps/android
        run: |
          npm ci
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Enable Gradle ABI splits (arm64-v8a, armeabi-v7a, x86_64)
        run: python scripts/build_apps.py android-configure

      - name: Build the debug APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect the APK and checksums
        run: |
          python scripts/build_apps.py android-collect
          python scripts/build_apps.py sums android

      - name: Open the APK and count its content
        run: python scripts/verify_apps.py --dir dist --require android --report dist/verify-android.json

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: |
            dist/*.apk
            dist/SHA256SUMS-android.txt
            dist/verify-android.json
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} (tar.gz and deb)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pyinstaller==6.19.0 pillow==12.2.0

      - name: Build tar.gz and deb
        run: python scripts/build_apps.py linux

      - name: Checksums
        run: python scripts/build_apps.py sums linux

      - name: Open every artifact and count its content
        run: python scripts/verify_apps.py --dir dist --require linux --report dist/verify-linux-${{ matrix.arch }}.json

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/verify-linux-*.json
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (app in zip and dmg)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pyinstaller==6.19.0 pillow==12.2.0

      - name: Build the app, zip and dmg
        run: python scripts/build_apps.py macos

      - name: Checksums
        run: python scripts/build_apps.py sums macos

      - name: Open every artifact and count its content
        run: python scripts/verify_apps.py --dir dist --require macos --report dist/verify-macos-${{ matrix.arch }}.json

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/verify-macos-*.json
          if-no-files-found: error
