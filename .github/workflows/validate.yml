name: Validate

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify generated manifests
        run: python scripts/build_program_blueprint.py --check

      - name: Verify scaffolds, indices, sources and site
        run: python scripts/build_phase2.py --check

      - name: Verify phase 3 draft scope and generated publication
        run: python scripts/build_phase3.py --check

      - name: Verify phase 4 draft scope and generated publication
        run: python scripts/build_phase4.py --check

      - name: Verify professional role guides
        run: python scripts/build_role_guides.py --check

      - name: Validate class contracts
        run: python scripts/validate_class_contracts.py

      - name: Validate phase 3 integrity without false maturity claims
        run: python scripts/validate_phase3.py

      - name: Validate phase 4 integrity without false maturity claims
        run: python scripts/validate_phase4.py

      - name: Validate UTF-8 encoding
        run: python scripts/validate_encoding.py

      - name: Validate generated site and links
        run: python scripts/validate_site.py

      - name: Validate licensing and attribution contracts
        run: python scripts/validate_licensing.py

      - name: Validate repository contracts
        run: python scripts/validate_repository.py --strict

      - name: Run structural tests
        run: python -m unittest discover -s tests -v

      - name: Run Part 01 executable laboratory tests
        run: python -m unittest discover -s labs/part-01-machine-observer/tests -v

      - name: Run Part 02 cross-platform diagnostic kit tests
        run: python -m unittest discover -s labs/part-02-cross-platform-diagnostic-kit/tests -v

      - name: Run Part 03 observable request tests
        run: python -m unittest discover -s labs/part-03-observable-request/tests -v

      - name: Run Part 04 contrastable specification tests
        run: python -m unittest discover -s labs/part-04-contrastable-spec/tests -v

      - name: Smoke test Part 02 Bash adapter
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/part02-kit"
          bash labs/part-02-cross-platform-diagnostic-kit/diagnostic-kit.sh prepare --workspace "$RUNNER_TEMP/part02-kit"
          bash labs/part-02-cross-platform-diagnostic-kit/diagnostic-kit.sh inspect --workspace "$RUNNER_TEMP/part02-kit"
          bash labs/part-02-cross-platform-diagnostic-kit/diagnostic-kit.sh clean --workspace "$RUNNER_TEMP/part02-kit"

      - name: Compile Python sources
        run: python -m compileall -q scripts tests labs/part-01-machine-observer labs/part-02-cross-platform-diagnostic-kit labs/part-03-observable-request labs/part-04-contrastable-spec

  portability:
    name: Portability · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify blueprint and repository
        run: |
          python scripts/build_program_blueprint.py --check
          python scripts/build_phase2.py --check
          python scripts/build_phase3.py --check
          python scripts/build_phase4.py --check
          python scripts/build_role_guides.py --check
          python scripts/validate_class_contracts.py
          python scripts/validate_phase3.py
          python scripts/validate_phase4.py
          python scripts/validate_encoding.py
          python scripts/validate_site.py
          python scripts/validate_licensing.py
          python scripts/validate_repository.py --strict
          python -m unittest discover -s labs/part-01-machine-observer/tests -v
          python -m unittest discover -s labs/part-02-cross-platform-diagnostic-kit/tests -v
          python -m unittest discover -s labs/part-03-observable-request/tests -v
          python -m unittest discover -s labs/part-04-contrastable-spec/tests -v

      - name: Smoke test Part 02 PowerShell adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'part02-kit'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          & ./labs/part-02-cross-platform-diagnostic-kit/diagnostic-kit.ps1 prepare --workspace $work
          & ./labs/part-02-cross-platform-diagnostic-kit/diagnostic-kit.ps1 inspect --workspace $work
          & ./labs/part-02-cross-platform-diagnostic-kit/diagnostic-kit.ps1 clean --workspace $work

      - name: Smoke test Part 02 Bash adapter
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/part02-kit"
          bash labs/part-02-cross-platform-diagnostic-kit/diagnostic-kit.sh prepare --workspace "$RUNNER_TEMP/part02-kit"
          bash labs/part-02-cross-platform-diagnostic-kit/diagnostic-kit.sh inspect --workspace "$RUNNER_TEMP/part02-kit"
          bash labs/part-02-cross-platform-diagnostic-kit/diagnostic-kit.sh clean --workspace "$RUNNER_TEMP/part02-kit"

  documentation:
    name: Documentation · Markdown and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Lint Markdown with a fixed version
        run: npx --yes markdownlint-cli2@0.23.0 "**/*.md"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate navigation, UTF-8 and public licensing
        run: |
          python scripts/build_role_guides.py --check
          python scripts/validate_encoding.py
          python scripts/validate_licensing.py
          python scripts/validate_repository.py --strict

  policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Enforce pinned actions, minimal permissions and UTF-8
        run: |
          python scripts/build_phase3.py --check
          python scripts/build_phase4.py --check
          python scripts/build_role_guides.py --check
          python scripts/validate_encoding.py
          python scripts/validate_licensing.py
          python scripts/validate_repository.py --strict

  evidence:
    name: Evidence summary
    if: always()
    needs: [structure, portability, documentation, policy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish validation evidence
        shell: bash
        env:
          STRUCTURE_RESULT: ${{ needs.structure.result }}
          PORTABILITY_RESULT: ${{ needs.portability.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          {
            echo "### Programa de Ingeniería de Software Moderna"
            echo
            echo "- Partes: **$(find classes -mindepth 1 -maxdepth 1 -type d -name 'part-*' | wc -l)**"
            echo "- Clases: **$(find classes -mindepth 3 -maxdepth 3 -name README.md | wc -l)**"
            echo "- Rutas profesionales: **$(find roles -maxdepth 1 -type f -name '*.md' ! -name README.md | wc -l)**"
            echo "- Generación y contratos: **${STRUCTURE_RESULT}**"
            echo "- Portabilidad: **${PORTABILITY_RESULT}**"
            echo "- Documentación: **${DOCUMENTATION_RESULT}**"
            echo "- Política: **${POLICY_RESULT}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failure semantics
        if: ${{ needs.structure.result != 'success' || needs.portability.result != 'success' || needs.documentation.result != 'success' || needs.policy.result != 'success' }}
        run: exit 1
