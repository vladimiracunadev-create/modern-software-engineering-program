name: Validate

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify generated manifests
        run: python scripts/build_program_blueprint.py --check

      - name: Verify scaffolds, indices, sources and site
        run: python scripts/build_phase2.py --check

      - name: Verify phase 3 guided content
        run: python scripts/build_phase3.py --check

      - name: Validate class contracts
        run: python scripts/validate_class_contracts.py

      - name: Validate phase 3 maturity and evidence
        run: python scripts/validate_phase3.py

      - name: Validate UTF-8 encoding
        run: python scripts/validate_encoding.py

      - name: Validate generated site and links
        run: python scripts/validate_site.py

      - name: Validate repository contracts
        run: python scripts/validate_repository.py --strict

      - name: Run structural tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

  portability:
    name: Portability · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify blueprint and repository
        run: |
          python scripts/build_program_blueprint.py --check
          python scripts/build_phase2.py --check
          python scripts/build_phase3.py --check
          python scripts/validate_class_contracts.py
          python scripts/validate_phase3.py
          python scripts/validate_encoding.py
          python scripts/validate_site.py
          python scripts/validate_repository.py --strict

  policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Enforce pinned actions, minimal permissions and UTF-8
        run: |
          python scripts/build_phase3.py --check
          python scripts/validate_encoding.py
          python scripts/validate_repository.py --strict
