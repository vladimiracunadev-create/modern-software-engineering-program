<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 518" width="940" height="518" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La búsqueda: del puntaje manual a redes neuronales, paso a paso</title><desc id="d">Flujo de la evolución del modelo de ordenación de resultados de Airbnb según dos artículos de investigación: función de puntaje manual, árboles de decisión con gradiente (uno de los mayores saltos en reservas), una meseta, una red simple neutral, una red con optimización de NDCG, una red con árboles y factorización como entradas y una red profunda entrenada con 1.700 millones de pares, y después arquitectura de dos torres, sesgo de posición y arranque en frío.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="518" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La búsqueda: del puntaje manual a redes neuronales, paso a paso</tspan></text><rect x="20" y="60" width="140" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="90" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="90" dy="0">Puntaje</tspan></text><text x="90" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="90" dy="0">manual</tspan></text><rect x="170" y="60" width="140" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Árboles con</tspan></text><text x="240" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">gradiente</tspan></text><rect x="320" y="60" width="140" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="390" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="390" dy="0">Meseta: pruebas</tspan></text><text x="390" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="390" dy="0">neutras</tspan></text><rect x="470" y="60" width="140" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">Red simple de</tspan></text><text x="540" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">32 neuronas:</tspan></text><text x="540" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">neutral</tspan></text><rect x="620" y="60" width="140" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="690" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="690" dy="0">Red con</tspan></text><text x="690" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="690" dy="0">NDCG por pares</tspan></text><rect x="770" y="60" width="140" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="840" y="92" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">Red profunda</tspan></text><text x="840" y="108.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">(1.700 M de</tspan></text><text x="840" y="125.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">pares)</tspan></text><polyline points="160,105 170,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="310,105 320,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="460,105 470,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,105 620,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="760,105 770,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="175" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="198.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Lección documentada: el primer éxito con redes fue</tspan></text><text x="240" y="215.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">empatar con el modelo anterior; la mejora vino de</tspan></text><text x="240" y="231.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">reformular el objetivo (pares y NDCG) y de simplificar</tspan></text><text x="240" y="248.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">una complejidad que había crecido.</tspan></text><rect x="480" y="175" width="440" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="190.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Fallo instructivo: usar el identificador de cada anuncio</tspan></text><text x="700" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">como entrada sobreajustó; los anuncios tienen pocas</tspan></text><text x="700" y="223.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">reservas por unidad. Se probó un modelo con reservas y</tspan></text><text x="700" y="240.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">vistas largas: subieron las vistas y las reservas</tspan></text><text x="700" y="256.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">quedaron neutras.</tspan></text><rect x="20" y="280" width="290" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="165" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="165" dy="0">Después (2020): arquitectura de dos</tspan></text><text x="165" y="333.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="165" dy="0">torres, +0,6 % de reservas en prueba</tspan></text><text x="165" y="350.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="165" dy="0">A/B.</tspan></text><rect x="325" y="280" width="290" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Sesgo de posición: la posición como</tspan></text><text x="470" y="333.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">entrada con regularización, +0,7 % de</tspan></text><text x="470" y="350.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">reservas y +1,8 % de ingresos.</tspan></text><rect x="630" y="280" width="290" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="775" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="775" dy="0">Arranque en frío: estimar las señales</tspan></text><text x="775" y="333.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="775" dy="0">de un anuncio nuevo, +14 % de</tspan></text><text x="775" y="350.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="775" dy="0">reservas de anuncios nuevos.</tspan></text><rect x="10" y="396" width="920" height="71.8" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="418.9" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: arriba, el camino de 2018; abajo, tres mejoras del artículo de 2020 con su resultado en pruebas A/B. Dónde deja de</tspan></text><text x="470" y="435.54" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: los porcentajes son de experimentos concretos de Airbnb contra su modelo de entonces; no se transfieren, y los</tspan></text><text x="470" y="452.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">artículos no publican el valor absoluto de las reservas.</tspan></text><text x="470" y="495.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Haldar y otros, arXiv:1810.09591 (F8) y arXiv:2002.05515 (F12). Resumen propio.</tspan></text></svg>
