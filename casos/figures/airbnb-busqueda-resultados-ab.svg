<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 499" width="940" height="499" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mejoras publicadas por pruebas A/B de la búsqueda de Airbnb (cambio relativo en reservas, %)</title><desc id="d">Barras con los cambios en reservas publicados en el artículo de 2020: arquitectura de dos torres más 0,6 por ciento, sesgo de posición más 0,7 por ciento y arranque en frío más 0,38 por ciento en el total; el mismo artículo cuenta dos experimentos de precio monótono que bajaron las reservas un 1,5 y un 1,6 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="499" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mejoras publicadas por pruebas A/B de la búsqueda de Airbnb (cambio relativo en reservas, %)</tspan></text><line x1="78.62" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="307" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="247" x2="920" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="247" x2="78.62" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,2</tspan></text><line x1="78.62" y1="187" x2="920" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="187" x2="78.62" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,4</tspan></text><line x1="78.62" y1="127" x2="920" y2="127" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="127" x2="78.62" y2="127" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="131.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,6</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,8</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">Cambio relativo en reservas (%)</text><rect x="106.666" y="127" width="224.368" height="180" rx="3" fill="#087f8c"/><text x="218.85" y="121" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.85" dy="0">0,60</tspan></text><text x="218.85" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Dos torres</tspan></text><rect x="387.126" y="97" width="224.368" height="210" rx="3" fill="#087f8c"/><text x="499.31" y="91" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">0,70</tspan></text><text x="499.31" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Sesgo de posición</tspan></text><rect x="667.586" y="193" width="224.368" height="114" rx="3" fill="#087f8c"/><text x="779.77" y="187" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">0,38</tspan></text><text x="779.77" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Arranque en frío (total)</tspan></text><rect x="10" y="359" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: los cambios que salen en producción son de décimas de punto porcentual. El mismo artículo publica dos experimentos</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que empeoraron las reservas (forzar que el modelo prefiera lo más barato: menos 1,5 % y menos 1,6 %); no se dibujan porque</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las barras negativas no caben en esta escala, pero están en el texto. Dónde deja de valer: cada barra es un experimento</tspan></text><text x="470" y="433.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">distinto contra una referencia distinta y se lee solo como orden de magnitud.</tspan></text><text x="470" y="481.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Haldar y otros, «Improving Deep Learning For Airbnb Search», arXiv:2002.05515 (F12).</tspan></text></svg>
