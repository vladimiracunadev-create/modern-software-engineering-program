<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 648" width="940" height="648" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un cobro cuya respuesta se pierde: el reintento no cobra dos veces</title><desc id="d">Secuencia de un cobro con clave de idempotencia cuando la respuesta se pierde: el cliente envía el cobro, el servicio toma el contrato sobre la clave en la base maestra, llama al procesador y guarda la respuesta; la respuesta no llega al cliente, que reintenta con la misma clave y recibe la respuesta guardada sin repetir el cobro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="648" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un cobro cuya respuesta se pierde: el reintento no cobra dos veces</tspan></text><rect x="20" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Cliente</tspan></text><text x="95" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">(reserva)</tspan></text><rect x="270" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="345" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">Servicio de pagos</tspan></text><text x="345" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">(Orpheus)</tspan></text><rect x="520" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="595" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="595" dy="0">Base maestra</tspan></text><rect x="770" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="845" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845" dy="0">Procesador</tspan></text><text x="845" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845" dy="0">externo</tspan></text><line x1="95" y1="98" x2="95" y2="482" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="345" y1="98" x2="345" y2="482" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="595" y1="98" x2="595" y2="482" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="845" y1="98" x2="845" y2="482" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="95,130.76 345,130.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="123.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">1. cobro con clave K</tspan></text><polyline points="345,172.76 595,172.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="165.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">2. toma contrato (bloqueo de fila) sobre K</tspan></text><polyline points="345,214.76 845,214.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="595" y="207.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="595" dy="0">3. RPC: cobra al huésped</tspan></text><polyline points="845,256.76 345,256.76" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="595" y="249.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="595" dy="0">4. éxito</tspan></text><polyline points="345,298.76 595,298.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="291.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">5. guarda la respuesta de K</tspan></text><polyline points="345,340.76 95,340.76" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="220" y="333.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">6. la respuesta se pierde</tspan></text><polyline points="95,382.76 345,382.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="375.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">7. reintenta con la misma clave K</tspan></text><polyline points="345,424.76 595,424.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="417.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">8. lee la respuesta de K (maestra)</tspan></text><polyline points="345,466.76 95,466.76" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="220" y="459.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">9. devuelve la respuesta guardada</tspan></text><rect x="10" y="492" width="920" height="105" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="514.86" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la flecha continua es una petición y la discontinua una respuesta; el paso 6 es el fallo que se quiere cubrir. El</tspan></text><text x="470" y="531.5" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">contrato (lease) tiene caducidad: si el servicio no responde, un reintento solo procede cuando el contrato ha vencido; se</tspan></text><text x="470" y="548.14" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">recomienda que la caducidad sea mayor que el tiempo de espera del RPC. Dónde deja de valer: cubre repeticiones de la misma</tspan></text><text x="470" y="564.78" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solicitud, no un cobro lógicamente equivocado ni fraude; el cliente debe conservar la clave y no cambiar la solicitud al</tspan></text><text x="470" y="581.42" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reintentar.</tspan></text><text x="470" y="625" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Airbnb Tech Blog (F5). Secuencia propia a partir del texto.</tspan></text></svg>
