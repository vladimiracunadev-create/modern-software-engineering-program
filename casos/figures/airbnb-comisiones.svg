<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 588" width="940" height="588" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué parte de una reserva retiene Airbnb con la estructura de comisión dividida (por cada 100 dólares de subtotal)</title><desc id="d">Barras apiladas por cada 100 dólares de subtotal de reserva: con la comisión dividida, el huésped paga entre 14,1 y 16,5 de comisión y el anfitrión 3, de modo que Airbnb retiene entre 17,1 y 19,5 por cada 100 dólares de subtotal, según el caso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="588" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué parte de una reserva retiene Airbnb con la estructura de comisión dividida (por cada 100 dólares de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">subtotal)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Comisión pagada por el huésped</tspan></text><rect x="290.2" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="310.2" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310.2" dy="0">Comisión pagada por el anfitrión</tspan></text><line x1="71.08" y1="396" x2="920" y2="396" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="396" x2="71.08" y2="396" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="400.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="326" x2="920" y2="326" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="326" x2="71.08" y2="326" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="330.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="256" x2="920" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="256" x2="71.08" y2="256" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="186" x2="920" y2="186" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="186" x2="71.08" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="190.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="116" x2="920" y2="116" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="116" x2="71.08" y2="116" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="120.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="116" x2="71.08" y2="396" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Dólares por cada 100 de subtotal</text><rect x="164.461" y="198.6" width="237.698" height="197.4" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="283.31" y="301.8" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="283.31" dy="0">14,1</tspan></text><rect x="164.461" y="156.6" width="237.698" height="42" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="283.31" y="182.1" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="283.31" dy="0">3,0</tspan></text><text x="283.31" y="149.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="283.31" dy="0">17,1</tspan></text><text x="283.31" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">Comisión mínima publicada</tspan></text><rect x="588.921" y="165" width="237.698" height="231" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="707.77" y="285" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707.77" dy="0">16,5</tspan></text><rect x="588.921" y="123" width="237.698" height="42" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="707.77" y="148.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707.77" dy="0">3,0</tspan></text><text x="707.77" y="116" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.77" dy="0">19,5</tspan></text><text x="707.77" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">Comisión máxima publicada</tspan></text><rect x="10" y="448" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="472.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los rangos son los que publica la página de ayuda (huésped 14,1 % a 16,5 %; la mayoría de anfitriones 3 %, algunos más).</tspan></text><text x="470" y="489.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los totales 17,1 y 19,5 los suma el autor. Airbnb está pasando a todos los anfitriones a una comisión única y esta</tspan></text><text x="470" y="506.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estructura desaparecerá. Dónde deja de valer: excluye impuestos y tarifas del anfitrión, y el porcentaje real depende de</tspan></text><text x="470" y="522.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">factores que Airbnb no detalla.</tspan></text><text x="470" y="570.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cifras: página de ayuda de comisiones de Airbnb (consulta 2026-11-16).</tspan></text></svg>
