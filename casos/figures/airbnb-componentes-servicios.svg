<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 449" width="940" height="449" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De un monolito Rails a servicios: lo que Airbnb ha documentado</title><desc id="d">Diagrama de componentes basado en blogs de ingeniería de Airbnb: un monolito Rails original que se va troceando en servicios con interfaz definida en Thrift; búsqueda con aprendizaje profundo para ordenar resultados; y un orquestador de pagos con flujos de pasos idempotentes y reintentables apoyado en la biblioteca Orpheus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="449" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De un monolito Rails a servicios: lo que Airbnb ha documentado</tspan></text><rect x="20" y="60" width="190" height="80" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="115" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="115" dy="0">Monolito Rails</tspan></text><text x="115" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="115" dy="0">(origen)</tspan></text><rect x="270" y="60" width="200" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="370" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="370" dy="0">Servicios con IDL</tspan></text><text x="370" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="370" dy="0">Thrift (migración</tspan></text><text x="370" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="370" dy="0">desde 2017)</tspan></text><polyline points="210,100 270,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="240" y="88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">se trocea</tspan></text><rect x="530" y="60" width="190" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="625" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="625" dy="0">Búsqueda y</tspan></text><text x="625" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="625" dy="0">ranking (modelos</tspan></text><text x="625" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="625" dy="0">de aprendizaje)</tspan></text><rect x="750" y="60" width="170" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="835" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="835" dy="0">Pagos:</tspan></text><text x="835" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="835" dy="0">orquestador +</tspan></text><text x="835" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="835" dy="0">Orpheus</tspan></text><polyline points="470,90 530,90" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="370,140 370,168 835,168 835,140" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="30" y="190" width="880" height="100" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="44" y="212" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="44" dy="0">Dentro de pagos (documentado, 2019 y 2022)</tspan></text><rect x="50" y="225" width="190" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="253.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">Clave de idempotencia</tspan></text><rect x="270" y="225" width="190" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="365" y="253.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="365" dy="0">Flujo = grafo de pasos</tspan></text><rect x="490" y="225" width="200" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="590" y="253.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590" dy="0">Base maestra fragmentada</tspan></text><rect x="720" y="225" width="170" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="805" y="253.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">Datos inmutables</tspan></text><rect x="10" y="315" width="920" height="92.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="348.2" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: lo documentado es el patrón (separar en servicios, definir contratos, hacer los pasos de dinero idempotentes), no</tspan></text><text x="470" y="364.84" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el mapa completo. No se sabe cuántos servicios existen hoy, ni cómo se reparte la búsqueda por regiones. Dónde deja de</tspan></text><text x="470" y="381.48" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: los blogs son de 2017 a 2022; el orquestador actual puede haber evolucionado.</tspan></text><text x="470" y="435.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Airbnb Tech Blog (Building Services 2017; Avoiding Double Payments 2019; Rebuilding Payment Orchestration 2022); arXiv:1810.09591.</tspan></text></svg>
