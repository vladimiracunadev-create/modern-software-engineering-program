<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 515" width="940" height="515" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La confianza en capas: qué mecanismo actúa antes, durante y después de una estancia</title><desc id="d">Diagrama de las capas de confianza de Airbnb a lo largo de una reserva: antes de reservar (reseñas y valoraciones públicas, perfil y reglas), al pagar (plataforma de pagos propia desde 2008), durante la estancia (AirCover, mensajes con el anfitrión, línea de seguridad 24 horas) y después (reseñas simultáneas con ventana de 14 días); los años son los de cada mecanismo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="515" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La confianza en capas: qué actúa antes, durante y después de una estancia</tspan></text><rect x="20" y="55" width="210" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="125" y="80.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="125" dy="0">Antes de reservar</tspan></text><rect x="20" y="110" width="210" height="150" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="155.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">Reseñas y valoración del</tspan></text><text x="125" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">anuncio (visible con 3</tspan></text><text x="125" y="188.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">reseñas o más);</tspan></text><text x="125" y="205.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">descripción del anfitrión</tspan></text><text x="125" y="221.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">y reglas de la casa.</tspan></text><rect x="245" y="55" width="210" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="350" y="80.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="350" dy="0">Al pagar</tspan></text><rect x="245" y="110" width="210" height="150" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="350" y="163.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">Plataforma de pagos propia</tspan></text><text x="350" y="180.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">(2008); el cobro usa una</tspan></text><text x="350" y="196.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">clave de idempotencia para</tspan></text><text x="350" y="213.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">no repetirse.</tspan></text><rect x="470" y="55" width="210" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="575" y="80.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="575" dy="0">Durante la estancia</tspan></text><rect x="470" y="110" width="210" height="150" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="575" y="147.04" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575" dy="0">Mensajes con el anfitrión;</tspan></text><text x="575" y="163.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575" dy="0">AirCover para huéspedes</tspan></text><text x="575" y="180.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575" dy="0">(2022): reubicación o</tspan></text><text x="575" y="196.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575" dy="0">reembolso; avisar en 72</tspan></text><text x="575" y="213.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575" dy="0">horas; línea de seguridad</tspan></text><text x="575" y="230.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575" dy="0">24 horas.</tspan></text><rect x="695" y="55" width="210" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="800" y="80.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800" dy="0">Después</tspan></text><rect x="695" y="110" width="210" height="150" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="800" y="163.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800" dy="0">Reseñas de ambas partes</tspan></text><text x="800" y="180.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800" dy="0">con ventana de 14 días: se</tspan></text><text x="800" y="196.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800" dy="0">publican cuando ambas se</tspan></text><text x="800" y="213.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800" dy="0">envían o vence el plazo.</tspan></text><polyline points="230,77 245,77" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="455,77 470,77" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="680,77 695,77" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="280" width="440" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="307" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Para el anfitrión: Garantía de 1 millón de dólares (2012)</tspan></text><text x="240" y="323.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">y AirCover para anfitriones (2021); el calendario de</tspan></text><text x="240" y="340.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">liberación de pagos no se verificó aquí.</tspan></text><rect x="480" y="280" width="440" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="307" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Para la ciudad: City Portal (2020) para que los gobiernos</tspan></text><text x="700" y="323.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">locales entiendan y hagan cumplir el alquiler</tspan></text><text x="700" y="340.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">responsable.</tspan></text><rect x="10" y="376" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="398.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: de izquierda a derecha el orden de una reserva; cada columna dice qué incertidumbre reduce y qué mecanismo lo</tspan></text><text x="470" y="415.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hace. Ninguna capa basta sola: las reseñas no devuelven el dinero y la cobertura no dice cómo era la casa. Dónde deja de</tspan></text><text x="470" y="432.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: es un esquema de mecanismos públicos; Airbnb no publica el desempeño de cada capa (cuántos casos resuelve AirCover,</tspan></text><text x="470" y="448.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuántas reseñas se retiran) ni sus controles de fraude. AirCover no es un seguro, según la propia página.</tspan></text><text x="470" y="492.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Airbnb Newsroom (F1); ayuda de reseñas (F4); AirCover para huéspedes (F6). Dibujo propio.</tspan></text></svg>
