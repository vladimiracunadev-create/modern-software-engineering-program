<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Airbnb: un mercado donde la confianza entre desconocidos es el producto</title><desc id="d">Diagrama de contexto: los huéspedes buscan y pagan, los anfitriones publican y reciben el pago, Airbnb cobra una comisión, protege la transacción y gestiona reseñas; las ciudades y los reguladores fijan reglas locales sobre el alquiler de corta duración.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="476" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Airbnb: un mercado donde la confianza entre desconocidos es el producto</tspan></text><rect x="20" y="70" width="210" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="125" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">Huéspedes</tspan></text><text x="125" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">(buscan, reservan, pagan)</tspan></text><rect x="710" y="70" width="210" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="815" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="815" dy="0">Anfitriones</tspan></text><text x="815" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="815" dy="0">(publican, aceptan,</tspan></text><text x="815" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="815" dy="0">cobran)</tspan></text><rect x="335" y="55" width="270" height="110" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="97" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Airbnb</tspan></text><text x="470" y="113.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">búsqueda · pagos ·</tspan></text><text x="470" y="130.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">reseñas · soporte · AirCover</tspan></text><rect x="335" y="230" width="270" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ciudades y reguladores</tspan></text><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(registro, límites, impuestos)</tspan></text><rect x="20" y="230" width="210" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="125" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="125" dy="0">Cobertura y soporte</tspan></text><text x="125" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="125" dy="0">(AirCover, reembolsos)</tspan></text><rect x="710" y="230" width="210" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="815" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="815" dy="0">Pagos en más de</tspan></text><text x="815" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="815" dy="0">40 monedas (2019)</tspan></text><polyline points="230,110 335,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="283" y="100" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283" dy="0">reserva</tspan></text><polyline points="605,110 710,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="657" y="100" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">cobro neto</tspan></text><polyline points="470,230 470,165" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="555" y="205" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="555" dy="0">reglas locales</tspan></text><polyline points="335,150 230,245" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="605,150 710,245" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="325" width="920" height="109" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="358.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el producto no es el alojamiento sino la reducción de la incertidumbre entre dos desconocidos, y eso explica por</tspan></text><text x="470" y="374.82" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">qué la reseña, el pago retenido y la cobertura son piezas centrales. Documentado (2026): 9 millones de anuncios activos,</tspan></text><text x="470" y="391.46" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">5,5 millones de anfitriones, más de 220 países y regiones, 2.500 millones de llegadas acumuladas. Dónde deja de valer: el</tspan></text><text x="470" y="408.1" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mapa no muestra cuánto de la actividad es profesional y cuánto es ocasional.</tspan></text><text x="470" y="462" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Airbnb Newsroom, «Sobre nosotros» (actualizado mayo de 2026, consulta 2026-11-16).</tspan></text></svg>
