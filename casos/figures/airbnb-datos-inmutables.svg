<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 475" width="940" height="475" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Datos inmutables: una estancia que cambia se modela como una nueva versión del plan</title><desc id="d">Diagrama ilustrativo de datos inmutables en la orquestación de pagos de Airbnb: un plan de dinero para una estancia de tres noches es la versión 1; al añadir una noche se crea la versión 2 sin modificar la anterior; los eventos son solo de añadir; la historia completa de versiones y eventos permite auditar y reconciliar el dinero previsto y el movido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="475" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Datos inmutables: una estancia que cambia es una nueva versión del plan</tspan></text><rect x="20" y="60" width="250" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="145" y="92" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="145" dy="0">Versión 1 del plan</tspan></text><text x="145" y="108.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="145" dy="0">(estancia de 3 noches)</tspan></text><text x="145" y="125.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="145" dy="0">ninguna se modifica</tspan></text><rect x="330" y="60" width="250" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="92" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="455" dy="0">Versión 2 del plan</tspan></text><text x="455" y="108.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="455" dy="0">(se añade una noche)</tspan></text><text x="455" y="125.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="455" dy="0">nueva versión</tspan></text><rect x="640" y="60" width="280" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="780" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="780" dy="0">Versión 3...</tspan></text><text x="780" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="780" dy="0">(cualquier cambio posterior)</tspan></text><polyline points="270,105 330,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="580,105 640,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="175" width="900" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="195.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Eventos de dinero (solo se añaden): cobro previsto, cobro hecho, pago al anfitrión... el consumidor decide si un evento</tspan></text><text x="470" y="211.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">nuevo modifica uno anterior</tspan></text><rect x="20" y="240" width="440" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="275.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Historia completa: el conjunto de versiones y eventos da</tspan></text><text x="240" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">el dinero previsto y el realmente movido en cada momento.</tspan></text><rect x="480" y="240" width="440" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="275.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Qué cuesta: más datos que guardar y consultar; quien lee</tspan></text><text x="700" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">debe reconstruir el estado a partir de versiones.</tspan></text><rect x="10" y="336" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="358.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: de izquierda a derecha, las versiones nacen sin borrar las anteriores; los eventos viven debajo como registro de</tspan></text><text x="470" y="375.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">añadidos. Los datos inmutables son más fáciles de entender, auditar y reconciliar, según la fuente. Dónde deja de valer: la</tspan></text><text x="470" y="392.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">figura usa el ejemplo de la fuente (añadir una noche) con números míos; el coste de almacenamiento es análisis propio y la</tspan></text><text x="470" y="408.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fuente no publica volúmenes.</tspan></text><text x="470" y="452.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Airbnb Tech Blog (F7), sección «Data Immutability». Dibujo propio.</tspan></text></svg>
