<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema del negocio de Airbnb: valor, ingreso, actores y flujos</title><desc id="d">Diagrama del negocio de Airbnb con cinco grupos: la propuesta de valor (confianza entre desconocidos), el ingreso por comisiones sobre el valor bruto de reservas, los actores, los flujos de dinero entre huésped, anfitrión, la plataforma y los procesadores de pago, y los flujos de valor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema del negocio de Airbnb: valor, ingreso, actores y flujos</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Propuesta de valor</tspan></text><rect x="10" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: un alojamiento o experiencia con la certeza de</tspan></text><text x="235" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">que, si algo sale mal, la plataforma responde (pagos</tspan></text><text x="235" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">propios, reseñas, AirCover) (F1, F4, F6).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Ingreso</tspan></text><rect x="480" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: comisión de servicio sobre cada reserva;</tspan></text><text x="705" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">ingresos de 12.241 millones de dólares en 2025 frente a</tspan></text><text x="705" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">11.102 en 2024 (F13).</tspan></text><rect x="10" y="175.8" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="196.72" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Actores</tspan></text><rect x="10" y="217.8" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="238.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Huéspedes, anfitriones (más de 5,5 millones),</tspan></text><text x="235" y="255.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">coanfitriones, gobiernos locales, procesadores de pago,</tspan></text><text x="235" y="271.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">proveedores de soporte (unos 13.000 trabajadores de</tspan></text><text x="235" y="288.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">terceros) y Airbnb (F1, F13).</tspan></text><rect x="480" y="175.8" width="450" height="34" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="196.72" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="705" dy="0">Flujos de dinero</tspan></text><rect x="480" y="217.8" width="450" height="101" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="238.66" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: huésped → plataforma (precio más comisión del</tspan></text><text x="705" y="255.3" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">huésped en la estructura dividida); plataforma → anfitrión</tspan></text><text x="705" y="271.94" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">(precio menos comisión); plataforma → procesadores (tarifas</tspan></text><text x="705" y="288.58" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">de comerciante, la mayor parte del costo de ingresos) (F3,</tspan></text><text x="705" y="305.22" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">F13).</tspan></text><rect x="480" y="326.8" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="347.74" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: el calendario de pago al anfitrión.</tspan></text><rect x="10" y="318.2" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="235" y="339.12" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="235" dy="0">Flujos de valor</tspan></text><rect x="10" y="360.2" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="381.1" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Demanda y confianza hacia el anfitrión; capacidad ociosa y</tspan></text><text x="235" y="397.74" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">variedad hacia el huésped; impuestos recaudados y datos</tspan></text><text x="235" y="414.38" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">hacia las ciudades (F1).</tspan></text><rect x="10" y="444" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="466.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cinco grupos de lo que se ofrece a cómo circulan dinero y valor. Dónde deja de valer: los porcentajes de comisión</tspan></text><text x="470" y="483.56" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">varían por país y tipo de anfitrión; el 10-K agrega los costos de pago en la línea de costo de ingresos.</tspan></text><text x="470" y="527.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F1, F3, F4, F6 y formulario 10-K de 2025 (F13).</tspan></text></svg>
