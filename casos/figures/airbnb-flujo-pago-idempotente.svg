<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 456" width="940" height="456" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cobrar una reserva sin cobrarla dos veces</title><desc id="d">Flujo del pago idempotente descrito por Airbnb: el cliente envía una clave de idempotencia, el servidor registra la solicitud en la base maestra, ejecuta los pasos y guarda la respuesta; si hay un corte y se reintenta con la misma clave, devuelve el resultado guardado en lugar de cobrar de nuevo; leer de una réplica podría duplicar el cobro por el retraso de replicación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="456" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cobrar una reserva sin cobrarla dos veces</tspan></text><rect x="20" y="60" width="170" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">Huésped confirma</tspan></text><text x="105" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">la reserva</tspan></text><rect x="240" y="60" width="180" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="330" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="330" dy="0">Solicitud con</tspan></text><text x="330" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="330" dy="0">clave de</tspan></text><text x="330" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="330" dy="0">idempotencia</tspan></text><rect x="470" y="60" width="200" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="570" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="570" dy="0">Registro en la base</tspan></text><text x="570" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="570" dy="0">maestra y ejecución</tspan></text><text x="570" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="570" dy="0">del cobro</tspan></text><rect x="720" y="60" width="200" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="820" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="820" dy="0">Respuesta guardada</tspan></text><text x="820" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="820" dy="0">(éxito o error)</tspan></text><polyline points="190,100 240,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="420,100 470,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="670,100 720,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="240" y="200" width="180" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="330" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">Corte de red:</tspan></text><text x="330" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">el cliente reintenta</tspan></text><text x="330" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">con la misma clave</tspan></text><rect x="470" y="200" width="200" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="570" y="227" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="570" dy="0">El servidor encuentra</tspan></text><text x="570" y="243.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="570" dy="0">la clave y devuelve</tspan></text><text x="570" y="260.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="570" dy="0">la respuesta guardada</tspan></text><polyline points="330,140 330,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="430" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="430" dy="0">falla la respuesta</tspan></text><polyline points="420,240 470,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="720" y="200" width="200" height="80" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="820" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="820" dy="0">Importante: leer solo</tspan></text><text x="820" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="820" dy="0">de la base maestra,</tspan></text><text x="820" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="820" dy="0">no de una réplica</tspan></text><polyline points="670,240 720,240" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="305" width="920" height="109" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="338.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la clave convierte un cobro, que es peligroso de repetir, en una operación que se puede repetir sin cambiar el</tspan></text><text x="470" y="354.82" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resultado. El blog documenta el caso límite: con una réplica retrasada la clave podía no verse y se duplicaba el pago, por</tspan></text><text x="470" y="371.46" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">eso se lee de la base maestra. Dónde deja de valer: cubre duplicados por reintento; no protege contra un cobro lógicamente</tspan></text><text x="470" y="388.1" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">erróneo ni contra el fraude.</tspan></text><text x="470" y="442" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Avoiding Double Payments in a Distributed Payments System», Airbnb Tech Blog (2019). Valores del ejemplo: del autor.</tspan></text></svg>
