<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 389" width="940" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Airbnb: de colchones inflables a plataforma pública</title><desc id="d">Línea de tiempo de 2007 a 2026 con los hitos que Airbnb publica en su historia: primeros huéspedes en octubre de 2007, lanzamiento en marzo de 2008, nombre actual en 2009, Garantía para anfitriones en 2012, Experiencias en 2016, salida a bolsa en diciembre de 2020, AirCover en 2021 y servicios adicionales en 2025 y 2026.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="389" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Airbnb: de colchones inflables a plataforma pública</tspan></text><line x1="134" y1="83" x2="134" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="134" y1="191" x2="134" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="134" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="134" dy="0">2 007</tspan></text><line x1="256.842" y1="83" x2="256.842" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="256.842" y1="191" x2="256.842" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="256.842" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="256.842" dy="0">2 010</tspan></text><line x1="379.684" y1="83" x2="379.684" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="379.684" y1="191" x2="379.684" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="379.684" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="379.684" dy="0">2 013</tspan></text><line x1="502.526" y1="83" x2="502.526" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="502.526" y1="191" x2="502.526" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="502.526" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502.526" dy="0">2 016</tspan></text><line x1="625.368" y1="83" x2="625.368" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="625.368" y1="191" x2="625.368" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="625.368" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="625.368" dy="0">2 019</tspan></text><line x1="748.211" y1="83" x2="748.211" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="748.211" y1="191" x2="748.211" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="748.211" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.211" dy="0">2 022</tspan></text><line x1="912" y1="83" x2="912" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="191" x2="912" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2 026</tspan></text><line x1="134" y1="191" x2="912" y2="191" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="114.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="124" dy="0">Producto</tspan></text><text x="124" y="168.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="124" dy="0">Empresa</tspan></text><line x1="183.137" y1="75" x2="183.137" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="183.137" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="183.137" dy="0">Lanzamiento</tspan></text><line x1="355.116" y1="75" x2="355.116" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="355.116" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="355.116" dy="0">Garantía</tspan></text><line x1="703.168" y1="75" x2="703.168" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="703.168" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="703.168" dy="0">Bolsa</tspan></text><rect x="166.758" y="92" width="57.3263" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><rect x="224.084" y="92" width="311.2" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="379.684" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="379.684" dy="0">Alojamiento y confianza</tspan></text><rect x="535.284" y="92" width="171.979" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="621.274" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="621.274" dy="0">Experiencias</tspan></text><rect x="707.263" y="92" width="204.737" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="809.632" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="809.632" dy="0">AirCover y servicios</tspan></text><line x1="14" y1="137" x2="912" y2="137" stroke="#d5dde1" stroke-width="1"/><rect x="166.758" y="146" width="536.411" height="36" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="434.963" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="434.963" dy="0">Empresa privada</tspan></text><rect x="703.168" y="146" width="208.832" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="807.584" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807.584" dy="0">Cotiza en Nasdaq</tspan></text><text x="523" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="523" dy="0">Año</tspan></text><rect x="10" y="249" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="273.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en la página «Sobre nosotros» de Airbnb: primeros huéspedes en octubre de 2007, lanzamiento en el SXSW de marzo</tspan></text><text x="470" y="290.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 2008 con dos reservas, nombre Airbnb en marzo de 2009, Garantía para anfitriones de 1 millón de dólares en mayo de 2012,</tspan></text><text x="470" y="307.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">salida a bolsa en diciembre de 2020. Las eras del carril de producto son una síntesis del autor. Dónde deja de valer:</tspan></text><text x="470" y="323.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">simplifica; muchos productos conviven.</tspan></text><text x="470" y="371.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Airbnb Newsroom, «The Airbnb Story» (consulta 2026-11-16).</tspan></text></svg>
