<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuarto trimestre de 2025: crecimiento interanual de las magnitudes que publica Airbnb (%)</title><desc id="d">Barras con los crecimientos interanuales del cuarto trimestre de 2025: ingresos 12 por ciento, valor bruto de reservas 16 por ciento, noches y plazas reservadas 10 por ciento, y noches reservadas desde India 50 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuarto trimestre de 2025: crecimiento interanual de las magnitudes que publica Airbnb (%)</tspan></text><line x1="71.08" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="307" x2="71.08" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="259" x2="920" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="259" x2="71.08" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="211" x2="920" y2="211" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="211" x2="71.08" y2="211" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="215.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="163" x2="920" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="163" x2="71.08" y2="163" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="115" x2="920" y2="115" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="115" x2="71.08" y2="115" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="67" x2="71.08" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">50</tspan></text><line x1="71.08" y1="67" x2="71.08" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">Crecimiento interanual (%)</text><rect x="92.303" y="249.4" width="169.784" height="57.6" rx="3" fill="#087f8c"/><text x="177.195" y="243.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177.195" dy="0">12</tspan></text><text x="177.195" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">Ingresos</tspan></text><rect x="304.533" y="230.2" width="169.784" height="76.8" rx="3" fill="#087f8c"/><text x="389.425" y="224.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="389.425" dy="0">16</tspan></text><text x="389.425" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">Valor bruto de reservas</tspan></text><rect x="516.763" y="259" width="169.784" height="48" rx="3" fill="#087f8c"/><text x="601.655" y="253" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.655" dy="0">10</tspan></text><text x="601.655" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">Noches y plazas reservadas</tspan></text><rect x="728.993" y="67" width="169.784" height="240" rx="3" fill="#087f8c"/><text x="813.885" y="61" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="813.885" dy="0">50</tspan></text><text x="813.885" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">Noches desde India</tspan></text><rect x="10" y="359" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el valor bruto de reservas crece más que los ingresos y que las noches, lo que Airbnb atribuye a la demanda y al</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">precio medio diario (ADR); India es una cifra de un país de expansión que parte de una base menor. Dónde deja de valer: es</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un trimestre; el comunicado dice que la mayor parte del negocio se concentra en cinco países.</tspan></text><text x="470" y="464.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Airbnb, resultados del cuarto trimestre de 2025 (F2).</tspan></text></svg>
