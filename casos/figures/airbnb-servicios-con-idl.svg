<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 509" width="940" height="509" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Servicios con IDL: un contrato en Thrift genera servidor y clientes en varios lenguajes</title><desc id="d">Diagrama del enfoque de Airbnb de 2017 para escalar el desarrollo de servicios: se mantiene el marco Dropwizard y se añade una definición de interfaz Thrift; de ese archivo se generan el código de servidor y los clientes RPC en Java y Ruby con instrumentación estándar, y el transporte pasa de JSON sobre HTTP a Thrift sobre HTTP sin una gran reconstrucción de la infraestructura.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="509" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Servicios con IDL: un contrato en Thrift genera servidor y clientes</tspan></text><rect x="20" y="60" width="200" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="120" y="87" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120" dy="0">Archivo de interfaz</tspan></text><text x="120" y="103.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120" dy="0">(.thrift): API y</tspan></text><text x="120" y="120.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120" dy="0">esquemas</tspan></text><rect x="280" y="40" width="200" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="380" y="63.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="380" dy="0">Servidor Java generado</tspan></text><text x="380" y="79.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="380" dy="0">(Dropwizard)</tspan></text><rect x="280" y="110" width="200" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="380" y="133.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="380" dy="0">Clientes RPC generados</tspan></text><text x="380" y="149.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="380" dy="0">(Java, Ruby)</tspan></text><rect x="540" y="40" width="380" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="730" y="63.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="730" dy="0">Instrumentación estándar: métricas, contexto de</tspan></text><text x="730" y="79.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="730" dy="0">solicitud, excepciones, TLS mutuo, alertas</tspan></text><rect x="540" y="110" width="380" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="730" y="133.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="730" dy="0">Tipos extendidos (Date, DateTime) para que nadie</tspan></text><text x="730" y="149.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="730" dy="0">«disfrace» una fecha como texto</tspan></text><polyline points="220,90 280,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="220,110 280,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="480,68 540,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="480,138 540,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="190" width="440" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="213.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">Antes: REST con JSON. Sin interfaz ni esquema fuertemente</tspan></text><text x="240" y="230.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">tipados, el contrato se leía del código; clientes en Ruby</tspan></text><text x="240" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">y Java escritos a mano; cargas JSON grandes en los</tspan></text><text x="240" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">percentiles 95 y 99.</tspan></text><rect x="480" y="190" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Por qué no cambiar todo a Thrift o gRPC completos:</tspan></text><text x="700" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">exigiría una gran reconstrucción de la infraestructura y</tspan></text><text x="700" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">frenaría la productividad; se eligió una vía incremental.</tspan></text><rect x="20" y="295" width="900" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="320.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Resultado buscado: usar las mismas horas de ingeniería para construir más servicios más robustos, con compatibilidad</tspan></text><text x="470" y="336.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">hacia atrás verificada por el esquema.</tspan></text><rect x="10" y="370" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="392.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: un solo archivo es la fuente de la que se derivan servidor, clientes y tooling. Antes de la IDL, el costo de crear</tspan></text><text x="470" y="409.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">servicios llevaba a ingeniería y gestión a evitar la arquitectura orientada a servicios cuando había presión de tiempo.</tspan></text><text x="470" y="426.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde deja de valer: la figura describe la propuesta de 2017 (parte 1 de una serie); no mide cuánto se redujo el esfuerzo</tspan></text><text x="470" y="442.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ni cuántos servicios hay hoy.</tspan></text><text x="470" y="486.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Guo, Lin y Guan, «Building Services at Airbnb, Part 1», Airbnb Tech Blog, 12 de diciembre de 2017 (F9).</tspan></text></svg>
