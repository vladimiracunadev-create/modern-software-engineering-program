<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 533" width="940" height="533" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué pasa cuando cae cada componente en lo que Airbnb documenta</title><desc id="d">Diagrama de la tolerancia a fallos documentada de Airbnb en pagos: una respuesta perdida se cubre con la clave de idempotencia; un procesador caído se reintenta si el error es reintentable; una réplica con retraso se evita leyendo de la maestra; dos sistemas de pagos conviven durante la migración con trabajos de comparación; un paso falla y la orquestación lo repite; no se documentan pruebas de caos ni recuperación ante desastres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="533" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué pasa cuando cae cada componente en lo que Airbnb documenta</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Se pierde una respuesta</tspan></text><rect x="10" y="92" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: idempotencia con clave, contrato con caducidad</tspan></text><text x="235" y="129.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">y respuesta guardada (F5).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Cae un servicio externo</tspan></text><rect x="480" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: los errores de infraestructura se tratan como</tspan></text><text x="705" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">reintentables y los de validación no; el cliente reintenta</tspan></text><text x="705" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">con retroceso y variación (F5).</tspan></text><rect x="10" y="159.2" width="450" height="34" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="235" y="180.12" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="235" dy="0">Una réplica se atrasa</tspan></text><rect x="10" y="201.2" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="222.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: las tablas de idempotencia se leen y escriben</tspan></text><text x="235" y="238.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">solo en la base maestra fragmentada (F5).</tspan></text><rect x="480" y="175.8" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="705" y="196.72" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="705" dy="0">Falla un paso de un flujo</tspan></text><rect x="480" y="217.8" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="238.7" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: grafo de pasos idempotentes y reintentables;</tspan></text><text x="705" y="255.34" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">eventos con idempotencia sobre Kafka; análisis de</tspan></text><text x="705" y="271.98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">integridad transaccional (F7).</tspan></text><rect x="10" y="268.4" width="450" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="289.32" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="235" dy="0">Una migración se desvía</tspan></text><rect x="10" y="310.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="331.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: trabajos asíncronos que comparan el modelo</tspan></text><text x="235" y="347.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">nuevo y el antiguo, y una capa de traducción (F7).</tspan></text><rect x="480" y="301.6" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="322.52" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Lo que no se documenta</tspan></text><rect x="480" y="343.6" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="364.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: pruebas de caos, recuperación ante desastres,</tspan></text><text x="705" y="381.14" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">copias de seguridad, degradación de la búsqueda y de los</tspan></text><text x="705" y="397.78" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">mensajes.</tspan></text><rect x="10" y="427.4" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="450.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cada recuadro es un fallo y su defensa; el último lista lo que falta. Dónde deja de valer: solo cubre pagos; la</tspan></text><text x="470" y="466.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tolerancia a fallos de la búsqueda no está descrita.</tspan></text><text x="470" y="510.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F5, F7.</tspan></text></svg>
