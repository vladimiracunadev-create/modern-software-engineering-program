<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 431" width="940" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ventana de reseñas: ninguna parte ve la del otro antes de escribir la suya</title><desc id="d">Línea de tiempo de 14 días tras el check-out: tanto el huésped como el anfitrión pueden escribir su reseña durante la ventana; las reseñas se publican en cuanto ambos han enviado la suya o cuando termina el plazo de 14 días, lo que ocurra primero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="431" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ventana de reseñas: ninguna parte ve la del otro antes de escribir la suya</tspan></text><line x1="134" y1="83" x2="134" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="134" y1="233" x2="134" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="134" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="134" dy="0">0</tspan></text><line x1="328.5" y1="83" x2="328.5" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="328.5" y1="233" x2="328.5" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="328.5" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328.5" dy="0">4</tspan></text><line x1="523" y1="83" x2="523" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="523" y1="233" x2="523" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="523" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="523" dy="0">8</tspan></text><line x1="717.5" y1="83" x2="717.5" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="717.5" y1="233" x2="717.5" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="717.5" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717.5" dy="0">12</tspan></text><line x1="912" y1="83" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="233" x2="912" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">16</tspan></text><line x1="134" y1="233" x2="912" y2="233" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="124" dy="0">Huésped</tspan></text><text x="124" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="124" dy="0">Anfitrión</tspan></text><text x="124" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="124" dy="0">Publicación</tspan></text><line x1="134" y1="75" x2="134" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="134" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="134" dy="0">Check-out</tspan></text><line x1="814.75" y1="75" x2="814.75" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="814.75" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="814.75" dy="0">Día 14</tspan></text><rect x="134" y="92" width="680.75" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="474.375" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="474.375" dy="0">Puede escribir su reseña</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="134" y="142" width="680.75" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="474.375" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="474.375" dy="0">Puede escribir su reseña</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="134" y="192" width="680.75" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="474.375" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="474.375" dy="0">Ocultas hasta que ambos envían o vence el plazo</tspan></text><text x="523" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="523" dy="0">Días desde el check-out</tspan></text><rect x="10" y="291" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en la ayuda de Airbnb: plazo de 14 días desde el check-out; las reseñas se publican cuando ambas partes han</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">enviado la suya o cuando termina el plazo, lo que ocurra primero. Mecanismo de diseño: al no ver la reseña ajena antes de</tspan></text><text x="470" y="349.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escribir la propia se reduce la represalia. Dónde deja de valer: no elimina el sesgo de reseñas inflado; la investigación</tspan></text><text x="470" y="365.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">académica sobre reseñas en Airbnb lo discute y no se reproduce aquí.</tspan></text><text x="470" y="413.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Airbnb, ayuda «Cómo funcionan las reseñas» (artículo 13, consulta 2026-11-16).</tspan></text></svg>
