<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 499" width="940" height="499" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una página de Amazon como abanico de servicios con contrato de latencia</title><desc id="d">Diagrama de componentes documentado en el artículo de Dynamo (2007): una petición de página llega al motor de renderizado, que consulta más de 150 servicios; cada servicio tiene un contrato de latencia medido en el percentil 99,9; el carrito se apoya en un almacén clave-valor de alta disponibilidad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="499" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una página de Amazon como abanico de servicios con contrato de latencia</tspan></text><rect x="20" y="55" width="200" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120" y="85.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120" dy="0">Petición de página</tspan></text><text x="120" y="101.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120" dy="0">(navegador o app)</tspan></text><rect x="290" y="55" width="220" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="400" y="85.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="400" dy="0">Motor de renderizado</tspan></text><text x="400" y="101.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="400" dy="0">(compone la respuesta)</tspan></text><polyline points="220,90 290,90" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30" y="160" width="880" height="190" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="44" y="182" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="44" dy="0">Más de 150 servicios por página (documentado, Dynamo 2007)</tspan></text><rect x="50" y="200" width="190" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">Servicios de</tspan></text><text x="145" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">negocio (catálogo,</tspan></text><text x="145" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">precios, reseñas)</tspan></text><rect x="260" y="200" width="190" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="355" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="355" dy="0">Servicio de carrito</tspan></text><rect x="470" y="200" width="190" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="565" y="230.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="565" dy="0">Servicio de</tspan></text><text x="565" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="565" dy="0">sesiones</tspan></text><rect x="680" y="200" width="210" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="785" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="785" dy="0">Otros servicios</tspan></text><text x="785" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="785" dy="0">(composición interna:</tspan></text><text x="785" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="785" dy="0">no se sabe)</tspan></text><rect x="260" y="285" width="190" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="355" y="313.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="355" dy="0">Dynamo (clave-valor)</tspan></text><polyline points="355,270 355,285" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="400,125 400,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="520" y="148" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="520" dy="0">se pide en abanico</tspan></text><rect x="560" y="55" width="350" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="735" y="77" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="735" dy="0">Contrato (ejemplo del artículo): respuesta</tspan></text><text x="735" y="93.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="735" dy="0">en 300 ms para el 99,9 % de las peticiones</tspan></text><text x="735" y="110.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="735" dy="0">con 500 peticiones por segundo</tspan></text><rect x="10" y="365" width="920" height="92.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="398.2" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: lo importante es el abanico. Si una página espera a decenas de servicios, el percentil 99,9 de cada uno decide la</tspan></text><text x="470" y="414.84" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">latencia de la página, por eso Amazon fija contratos en la cola y no en la media. Dónde deja de valer: el artículo es de</tspan></text><text x="470" y="431.48" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2007; la lista y el número de servicios actuales no son públicos.</tspan></text><text x="470" y="485.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DeCandia et al., Dynamo, SOSP 2007 (secciones 1 y 2.2). </tspan></text></svg>
