<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 511" width="940" height="511" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Amazon: quién participa y qué intercambia</title><desc id="d">Diagrama de contexto: la tienda de Amazon conecta a compradores, vendedores externos y logística, y la misma infraestructura se ofrece como nube pública a desarrolladores y empresas; en 2025 AWS aportó el 18 por ciento de las ventas y el 57 por ciento del resultado operativo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="511" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Amazon: quién participa y qué intercambia</tspan></text><rect x="340" y="150" width="260" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="189.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Amazon</tspan></text><text x="470" y="207.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">tienda propia + marketplace</tspan></text><rect x="20" y="150" width="200" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120" y="190.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120" dy="0">Compradores</tspan></text><text x="120" y="206.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120" dy="0">(incluye miembros Prime)</tspan></text><rect x="340" y="48" width="260" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="78.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Vendedores externos</tspan></text><text x="470" y="94.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(marketplace)</tspan></text><rect x="720" y="150" width="200" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="820" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="820" dy="0">Desarrolladores y</tspan></text><text x="820" y="198.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="820" dy="0">empresas</tspan></text><text x="820" y="215.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="820" dy="0">(clientes de AWS)</tspan></text><rect x="340" y="272" width="260" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="302.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Logística:</tspan></text><text x="470" y="318.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">almacenes y entrega</tspan></text><polyline points="220,195 340,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="280" y="168" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="280" dy="0">pedidos</tspan><tspan x="280" dy="16.64">y pagos</tspan></text><polyline points="340,215 220,215" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,118 470,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="140" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560" dy="0">catálogo y stock</tspan></text><polyline points="470,240 470,272" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="570" y="262" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="570" dy="0">órdenes de envío</tspan></text><polyline points="600,195 720,195" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="660" y="168" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="660" dy="0">cómputo,</tspan><tspan x="660" dy="16.64">almacenamiento</tspan></text><rect x="10" y="360" width="920" height="109" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="393.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la flecha discontinua marca la decisión estratégica de 2006, ofrecer como servicio piezas de infraestructura que</tspan></text><text x="470" y="409.82" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la tienda ya necesitaba. En 2025 AWS fue el 18 % de las ventas ($128,7 mil millones de $716,9) y el 57 % del resultado</tspan></text><text x="470" y="426.46" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">operativo ($45,6 de $80,0). Dónde deja de valer: no dice cómo se reparte el costo compartido entre tienda y nube, dato que</tspan></text><text x="470" y="443.1" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Amazon no publica.</tspan></text><text x="470" y="497" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cifras: comunicado de resultados Q4 2025 de Amazon (consulta 2026-11-16).</tspan></text></svg>
