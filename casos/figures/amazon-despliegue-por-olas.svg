<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo llega un cambio a producción: etapas, un solo nodo y olas con tiempo de espera</title><desc id="d">Diagrama del pipeline de despliegue descrito en la Biblioteca de Constructores de Amazon: pruebas, una etapa de una sola caja en gamma, olas de regiones de tamaño creciente con tiempo de espera entre ellas y reversión automática; un cambio tarda unos cuatro o cinco días laborables en llegar a todas las regiones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo llega un cambio a producción: etapas, un solo nodo y olas con tiempo de espera</tspan></text><rect x="20" y="60" width="160" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="100" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="100" dy="0">Commit y</tspan></text><text x="100" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="100" dy="0">compilación</tspan></text><rect x="200" y="60" width="160" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280" dy="0">Pruebas</tspan></text><text x="280" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280" dy="0">unitarias e</tspan></text><text x="280" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280" dy="0">integración</tspan></text><rect x="380" y="60" width="160" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">Gamma: «una caja»</tspan></text><text x="460" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">(30-60 min)</tspan></text><rect x="560" y="60" width="160" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="640" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="640" dy="0">Producción:</tspan></text><text x="640" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="640" dy="0">ola 1 (pocas</tspan></text><text x="640" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="640" dy="0">regiones)</tspan></text><rect x="740" y="60" width="160" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="820" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="820" dy="0">Olas siguientes</tspan></text><text x="820" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="820" dy="0">(más regiones)</tspan></text><polyline points="180,105 200,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="360,105 380,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="540,105 560,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="720,105 740,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="560" y="200" width="340" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="730" y="217" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="730" dy="0">Tiempo de espera (bake time) vigilando</tspan></text><text x="730" y="233.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="730" dy="0">alarmas</tspan></text><text x="730" y="250.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="730" dy="0">y reversión automática si saltan</tspan></text><polyline points="640,150 640,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="200" width="500" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="270" y="225.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="270" dy="0">Esperas más largas en las primeras olas,</tspan></text><text x="270" y="241.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="270" dy="0">más cortas en las últimas (documentado)</tspan></text><rect x="10" y="285" width="920" height="92.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="309.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la secuencia reduce el radio de impacto de un cambio malo: el primer daño aparece en una caja o en una región</tspan></text><text x="470" y="326.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pequeña, no en todas. Según el texto, un pipeline típico completa 24 regiones o 76 zonas de disponibilidad en cuatro o</tspan></text><text x="470" y="343.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cinco días laborables. Dónde deja de valer: describe el proceso de servicios de AWS; el de otras áreas de Amazon puede</tspan></text><text x="470" y="359.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">diferir y los plazos concretos varían por equipo.</tspan></text><text x="470" y="405.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Liguori, «Automating safe, hands-off deployments», Amazon Builders&#x27; Library (2020).</tspan></text></svg>
