<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 518" width="940" height="518" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Por dentro de una ola de producción: una caja, lotes del 33 por ciento y reversión automática</title><desc id="d">Diagrama de una ola de despliegue: primero una caja que atiende como máximo el 10 por ciento de las peticiones, luego lotes de como máximo el 33 por ciento de la flota con al menos el 66 por ciento de la capacidad sana; si salta la alarma agregada, la ola se revierte automáticamente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="518" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Por dentro de una ola de producción: una caja, lotes del 33 por ciento y reversión</tspan></text><rect x="20" y="60" width="230" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="87.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Una caja (≤ 10 % del</tspan></text><text x="135" y="103.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">tráfico)</tspan></text><rect x="260" y="60" width="290" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="405" y="95.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="405" dy="0">Lote 1 (≤ 33 % de la flota)</tspan></text><rect x="560" y="60" width="330" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="725" y="95.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="725" dy="0">Resto de la flota, en más lotes</tspan></text><rect x="20" y="150" width="66" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="53" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="53" dy="0">caja 1</tspan></text><rect x="96" y="150" width="66" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="129" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="129" dy="0">caja 2</tspan></text><rect x="172" y="150" width="66" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="205" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="205" dy="0">caja 3</tspan></text><rect x="248" y="150" width="66" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="281" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="281" dy="0">caja 4</tspan></text><rect x="324" y="150" width="66" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">caja 5</tspan></text><rect x="400" y="150" width="66" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="433" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433" dy="0">caja 6</tspan></text><rect x="476" y="150" width="66" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="509" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="509" dy="0">caja 7</tspan></text><rect x="552" y="150" width="66" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="585" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="585" dy="0">caja 8</tspan></text><rect x="628" y="150" width="66" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="661" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="661" dy="0">caja 9</tspan></text><rect x="704" y="150" width="66" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="165.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">caja</tspan></text><text x="737" y="181.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">10</tspan></text><rect x="780" y="150" width="66" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="813" y="165.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813" dy="0">caja</tspan></text><text x="813" y="181.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813" dy="0">11</tspan></text><rect x="856" y="150" width="66" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="889" y="165.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="889" dy="0">caja</tspan></text><text x="889" y="181.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="889" dy="0">12</tspan></text><polyline points="60,124 60,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="205" width="440" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="229.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Capacidad sana ≥ 66 % en todo momento: todo servicio está</tspan></text><text x="240" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">dimensionado para perder una zona.</tspan></text><rect x="480" y="205" width="440" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="229.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Alarma agregada: si cualquiera de las alarmas graves del</tspan></text><text x="700" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">equipo salta, se revierte todo en la región.</tspan></text><rect x="20" y="278" width="440" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="240" y="300" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">Algunos equipos despliegan solo el 5 % a la vez, y</tspan></text><text x="240" y="316.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">revierten de 33 en 33 % para ir más rápido atrás que</tspan></text><text x="240" y="333.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">adelante.</tspan></text><rect x="480" y="278" width="440" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="308.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">Tiempo de espera (bake time) tras cada etapa: la tubería</tspan></text><text x="700" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">sigue vigilando por si el daño es lento.</tspan></text><rect x="10" y="362" width="920" height="105" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="384.86" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: arriba, de izquierda a derecha, cómo crece el alcance del cambio dentro de una ola; en la fila central, las doce</tspan></text><text x="470" y="401.5" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cajas de un ejemplo (la primera en azul verdoso, las del primer lote en dorado, el resto sin cambiar). Cada limite del 10 %</tspan></text><text x="470" y="418.14" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y del 33 % es un máximo típico, no un valor fijo. Dónde deja de valer: es el proceso de servicios de AWS descrito en 2020</tspan></text><text x="470" y="434.78" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(F9) y los tamaños de ola dependen de cada servicio; no asegura que ningún cambio malo llegue a producción, solo que su</tspan></text><text x="470" y="451.42" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">alcance sea pequeño.</tspan></text><text x="470" y="495" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Liguori, «Automating safe, hands-off deployments», Amazon Builders&#x27; Library (F9). Doce cajas: ejemplo propio.</tspan></text></svg>
