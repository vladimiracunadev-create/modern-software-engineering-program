<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 511" width="940" height="511" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo evolucionó el particionado de Dynamo: de tokens aleatorios a particiones fijas</title><desc id="d">Diagrama antes y después de las estrategias de partición de Dynamo: la estrategia 1 en producción ataba el particionado a la colocación y obligaba a escanear discos al añadir nodos; la 3, que adoptaron, usa particiones de igual tamaño y reparte tokens, con metadatos tres órdenes de magnitud menores y arranque más rápido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="511" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo evolucionó el particionado de Dynamo: de tokens aleatorios a particiones fijas</tspan></text><rect x="20" y="50" width="280" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="160" y="73.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="160" dy="0">Estrategia 1 (inicial)</tspan></text><rect x="330" y="50" width="280" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="73.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">Estrategia 2 (transitoria)</tspan></text><rect x="640" y="50" width="280" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="780" y="73.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="780" dy="0">Estrategia 3 (adoptada)</tspan></text><rect x="20" y="100" width="280" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="132" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">T tokens aleatorios por nodo; cada</tspan></text><text x="160" y="148.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">rango entre tokens es una</tspan></text><text x="160" y="165.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">partición, de tamaño variable.</tspan></text><rect x="330" y="100" width="280" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="132" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">T tokens aleatorios por nodo, pero</tspan></text><text x="470" y="148.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">el espacio se divide en Q</tspan></text><text x="470" y="165.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">particiones iguales.</tspan></text><rect x="640" y="100" width="280" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="780" y="132" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">Q particiones iguales y Q/S tokens</tspan></text><text x="780" y="148.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">por nodo (S = nodos); al entrar o</tspan></text><text x="780" y="165.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">salir un nodo se reparten tokens.</tspan></text><rect x="20" y="205" width="280" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="160" y="233.72" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">Problemas documentados: añadir un</tspan></text><text x="160" y="250.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">nodo obliga a otros a escanear su</tspan></text><text x="160" y="267" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">disco, lo que se hacía con la</tspan></text><text x="160" y="283.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">prioridad más baja; en temporada</tspan></text><text x="160" y="300.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">alta, arrancar un nodo tardó casi</tspan></text><text x="160" y="316.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">un día. Particionado y colocación</tspan></text><text x="160" y="333.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">van unidos.</tspan></text><rect x="330" y="205" width="280" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="250.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Separa el particionado de la</tspan></text><text x="470" y="267" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">colocación. Sirvió de paso</tspan></text><text x="470" y="283.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">intermedio durante la migración y</tspan></text><text x="470" y="300.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tenía la peor eficiencia de reparto</tspan></text><text x="470" y="316.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de carga de las tres.</tspan></text><rect x="640" y="205" width="280" height="150" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="780" y="242.04" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="780" dy="0">Mejor reparto de carga; metadatos</tspan></text><text x="780" y="258.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="780" dy="0">hasta tres órdenes de magnitud</tspan></text><text x="780" y="275.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="780" dy="0">menores; arranque más rápido porque</tspan></text><text x="780" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="780" dy="0">cada partición vive en un archivo</tspan></text><text x="780" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="780" dy="0">propio y se mueve como unidad;</tspan></text><text x="780" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="780" dy="0">archivado más simple.</tspan></text><polyline points="300,145 330,145" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,145 640,145" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="372" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="394.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: de izquierda a derecha el diseño separa dos decisiones que la primera versión mezclaba: cómo se parte el espacio</tspan></text><text x="470" y="411.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de claves y dónde se coloca cada parte. Es un ejemplo de una arquitectura corregida con datos de producción. Dónde deja de</tspan></text><text x="470" y="428.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: el artículo mide un sistema de 30 nodos y N=3, que es la configuración típica de entonces; no dice qué hace hoy</tspan></text><text x="470" y="444.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ningún sistema de Amazon.</tspan></text><text x="470" y="488.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DeCandia et al., Dynamo, SOSP 2007, sección 6.2 (F1). Eficiencia = carga media / carga del nodo más cargado.</tspan></text></svg>
