<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 557" width="940" height="557" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coordinar en el cliente o en el servidor: latencia de Dynamo (milisegundos)</title><desc id="d">Barras agrupadas en escala logarítmica: con la coordinación en el servidor, el percentil 99,9 es 68,9 ms en lectura y 68,5 ms en escritura y la media 3,9 y 4,02 ms; con la coordinación en el cliente baja a 30,4 ms en ambos percentiles y a 1,55 y 1,9 ms en la media.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="557" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Coordinar en el cliente o en el servidor: latencia de Dynamo (milisegundos)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Coordinación en el servidor</tspan></text><rect x="267.58" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="287.58" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="287.58" dy="0">Coordinación en el cliente</tspan></text><line x1="78.62" y1="365" x2="920" y2="365" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="365" x2="78.62" y2="365" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="230" x2="920" y2="230" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="230" x2="78.62" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="234.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">10</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="365" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 230)">Milisegundos (escala logarítmica) (escala logarítmica)</text><rect x="99.6545" y="116.84" width="82.138" height="248.16" rx="3" fill="#c0432f"/><text x="140.724" y="110.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140.724" dy="0">68,90</tspan></text><rect x="185.793" y="164.812" width="82.138" height="200.188" rx="3" fill="#087f8c"/><text x="226.862" y="158.812" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="226.862" dy="0">30,40</tspan></text><text x="183.793" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">p99,9 lectura</tspan></text><rect x="310" y="117.182" width="82.138" height="247.818" rx="3" fill="#c0432f"/><text x="351.069" y="111.182" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="351.069" dy="0">68,50</tspan></text><rect x="396.138" y="164.812" width="82.138" height="200.188" rx="3" fill="#087f8c"/><text x="437.207" y="158.812" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.207" dy="0">30,40</tspan></text><text x="394.138" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">p99,9 escritura</tspan></text><rect x="520.345" y="285.206" width="82.138" height="79.7937" rx="3" fill="#c0432f"/><text x="561.413" y="279.206" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.413" dy="0">3,90</tspan></text><rect x="606.483" y="339.305" width="82.138" height="25.6948" rx="3" fill="#087f8c"/><text x="647.552" y="333.305" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.552" dy="0">1,55</tspan></text><text x="604.482" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">Media lectura</tspan></text><rect x="730.689" y="283.429" width="82.138" height="81.5705" rx="3" fill="#c0432f"/><text x="771.758" y="277.429" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.758" dy="0">4,02</tspan></text><rect x="816.827" y="327.368" width="82.138" height="37.6317" rx="3" fill="#087f8c"/><text x="857.896" y="321.368" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.896" dy="0">1,90</tspan></text><text x="814.827" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">Media escritura</tspan></text><rect x="10" y="417" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="441.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la cola (p99,9) es unas diez a veinte veces la media y el cliente que coordina localmente se ahorra un salto de</tspan></text><text x="470" y="458.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">red: el percentil 99,9 baja unos 30 ms. Dónde deja de valer: es una medición interna de 2006 con una configuración (3,2,2)</tspan></text><text x="470" y="475.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y unos cientos de nodos homogéneos; no se traslada a ninguna otra red, otro almacén ni a DynamoDB. El precio de la mejora</tspan></text><text x="470" y="491.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es que cada cliente debe llevar la biblioteca y refrescar la vista de membresía.</tspan></text><text x="470" y="539.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DeCandia et al., Dynamo, SOSP 2007, tabla 2 (F1).</tspan></text></svg>
