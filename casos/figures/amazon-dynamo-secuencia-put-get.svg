<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 766" width="940" height="766" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dynamo paso a paso: una escritura y una lectura con N=3, W=2, R=2</title><desc id="d">Secuencia de una escritura y una lectura en Dynamo con la configuración común (3,2,2): el cliente envía put al coordinador, que genera el reloj vectorial, escribe localmente y envía a las réplicas; con dos confirmaciones responde; la lectura pide a las réplicas, espera dos respuestas, devuelve todas las versiones no relacionadas y repara las réplicas atrasadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="766" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dynamo paso a paso: una escritura y una lectura con N=3, W=2, R=2</tspan></text><rect x="20" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Cliente</tspan></text><text x="95" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">(carrito)</tspan></text><rect x="270" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="345" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">Coordinador</tspan></text><text x="345" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">(A)</tspan></text><rect x="520" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="595" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="595" dy="0">Réplica B</tspan></text><rect x="770" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="845" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845" dy="0">Réplica C</tspan></text><line x1="95" y1="98" x2="95" y2="584" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="345" y1="98" x2="345" y2="584" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="595" y1="98" x2="595" y2="584" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="845" y1="98" x2="845" y2="584" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="95,129.2 345,129.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="122.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">1. put(clave, contexto, valor)</tspan></text><rect x="353" y="152.2" width="234" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="162.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2. nuevo reloj vectorial;</tspan></text><text x="470" y="179.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escribe en local</tspan></text><polyline points="345,209.2 595,209.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="202.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">3. envía versión + reloj</tspan></text><polyline points="345,249.2 845,249.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="595" y="242.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="595" dy="0">4. envía versión + reloj</tspan></text><polyline points="595,289.2 345,289.2" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="470" y="282.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">5. confirma (con A ya son W=2)</tspan></text><polyline points="345,329.2 95,329.2" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="220" y="322.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">6. éxito: sin esperar a C</tspan></text><polyline points="95,369.2 345,369.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="362.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">7. get(clave)</tspan></text><polyline points="345,409.2 595,409.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="402.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">8. pide todas las versiones</tspan></text><polyline points="345,449.2 845,449.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="595" y="442.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="595" dy="0">9. pide todas las versiones</tspan></text><polyline points="595,489.2 345,489.2" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="470" y="482.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">10. responde (con A ya son R=2)</tspan></text><polyline points="345,529.2 95,529.2" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="220" y="522.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">11. devuelve las versiones no relacionadas</tspan></text><rect x="353" y="552.2" width="234" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="562.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">12. lectura reparadora a las</tspan></text><text x="470" y="579.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">atrasadas</tspan></text><rect x="10" y="594" width="920" height="121.6" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="616.84" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: las flechas continuas son peticiones y las discontinuas son respuestas. La escritura termina en el paso 6 con dos</tspan></text><text x="470" y="633.48" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">copias (W=2, contando al coordinador); la tercera llega después y, si falla, la repara el proceso de entropía con árboles</tspan></text><text x="470" y="650.12" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de Merkle. En la lectura (R=2), si las versiones son causalmente comparables se devuelve la más nueva; si son concurrentes,</tspan></text><text x="470" y="666.76" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se devuelven todas con su contexto y la aplicación fusiona (paso 11). Como R + W = 4 &gt; N = 3, toda lectura se solapa con la</tspan></text><text x="470" y="683.4" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">última escritura exitosa en al menos un nodo. Dónde deja de valer: con un cuórum flexible o una partición, ese solapamiento</tspan></text><text x="470" y="700.04" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no está garantizado; por eso hay versiones concurrentes.</tspan></text><text x="470" y="743.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: F1, secciones 4.4 a 4.7 y 6 (configuración común (3,2,2)); la aplicación es el servicio de carrito, ejemplo del artículo.</tspan></text></svg>
