<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 549" width="940" height="549" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo nacen y se resuelven versiones divergentes con relojes vectoriales</title><desc id="d">Evolución de un objeto en Dynamo según el ejemplo del artículo: D1 y D2 las escribe el nodo Sx; D3 la escribe Sy y D4 la escribe Sz a partir de D2 sin verse entre sí, por lo que son concurrentes; un cliente las lee, las fusiona y Sx escribe D5 con el reloj combinado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="549" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo nacen y se resuelven versiones divergentes con relojes vectoriales</tspan></text><rect x="20" y="80" width="200" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120" y="107.96" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="120" dy="0">D1</tspan></text><text x="120" y="125.88" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="120" dy="0">[(Sx, 1)]</tspan></text><rect x="260" y="80" width="200" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="360" y="107.96" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="360" dy="0">D2</tspan></text><text x="360" y="125.88" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="360" dy="0">[(Sx, 2)]</tspan></text><rect x="520" y="45" width="230" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="635" y="72.96" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="635" dy="0">D3 (escribe Sy)</tspan></text><text x="635" y="90.88" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="635" dy="0">[(Sx, 2), (Sy, 1)]</tspan></text><rect x="520" y="135" width="230" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="635" y="162.96" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="635" dy="0">D4 (escribe Sz)</tspan></text><text x="635" y="180.88" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="635" dy="0">[(Sx, 2), (Sz, 1)]</tspan></text><rect x="520" y="250" width="400" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="720" y="274" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="720" dy="0">D5 = fusión de D3 y D4 (la hace el cliente, la</tspan></text><text x="720" y="291.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="720" dy="0">escribe Sx)</tspan></text><text x="720" y="309.84" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="720" dy="0">[(Sx, 3), (Sy, 1), (Sz, 1)]</tspan></text><polyline points="220,113 260,113" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="460,100 490,100 490,78 520,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="460,126 490,126 490,168 520,168" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="750,78 880,78 880,250" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="750,168 800,168 800,250" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="165" width="440" height="140" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="240" y="205.36" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="240" dy="0">Regla de comparación: A es ancestro de B si todos los</tspan></text><text x="240" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="240" dy="0">contadores de A son menores o iguales que los de B;</tspan></text><text x="240" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="240" dy="0">entonces A se descarta. Si ninguno es ancestro del otro</tspan></text><text x="240" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="240" dy="0">(D3 y D4), son concurrentes y hay que conservar ambas y</tspan></text><text x="240" y="271.92" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="240" dy="0">fusionarlas.</tspan></text><rect x="20" y="340" width="900" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="363.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Costo: los relojes crecen con el número de nodos que escriben; Dynamo trunca los pares más antiguos al pasar un umbral,</tspan></text><text x="470" y="379.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">a cambio de perder la relación de ancestro y dar más trabajo de fusión.</tspan></text><rect x="10" y="410" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="432.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: de izquierda a derecha pasa el tiempo; el reloj entre corchetes cuenta cuántas escrituras coordinó cada nodo. D3 y</tspan></text><text x="470" y="449.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">D4 nacen de D2 sin verse (por ejemplo, durante una falla), así que ninguna sustituye a la otra. Dónde deja de valer: el</tspan></text><text x="470" y="466.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ejemplo es del artículo y ocupa un objeto con tres coordinadores; en producción la fusión es lógica de negocio de cada</tspan></text><text x="470" y="482.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">servicio (carrito: unir elementos; sesión: «gana la última»).</tspan></text><text x="470" y="526.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: F1, secciones 4.4 y 6.3 (ejemplo de la figura 3 del artículo); dibujo propio.</tspan></text></svg>
