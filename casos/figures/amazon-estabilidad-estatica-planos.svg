<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estabilidad estática: el plano de datos sigue aunque el plano de control falle</title><desc id="d">Diagrama de EC2 como plano de control (cambios: lanzar, modificar, borrar) y plano de datos (las instancias que ya corren y su red); si el plano de control falla, el plano de datos sigue sirviendo con lo que ya tiene, y los clientes diseñados así preasignan capacidad en varias zonas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estabilidad estática: el plano de datos sigue aunque el plano de control falle</tspan></text><rect x="20" y="50" width="420" height="190" rx="16" fill="#fbe4de" fill-opacity="0.45" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="8 5"/><text x="34" y="72" font-size="14" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="34" dy="0">Plano de control (hacer cambios)</tspan></text><rect x="40" y="90" width="380" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="115.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">Lanzar, parar, modificar recursos</tspan></text><rect x="40" y="144" width="380" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="169.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">Propagar el cambio a donde debe aplicarse</tspan></text><rect x="40" y="196" width="380" height="36" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="230" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="230" dy="0">Más complejo, más piezas móviles</tspan></text><rect x="500" y="50" width="420" height="190" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="514" y="72" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="514" dy="0">Plano de datos (sostener lo que ya existe)</tspan></text><rect x="520" y="90" width="380" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="710" y="115.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="710" dy="0">Instancias en ejecución y su red</tspan></text><rect x="520" y="144" width="380" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="710" y="169.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="710" dy="0">Tráfico de los clientes</tspan></text><rect x="520" y="196" width="380" height="36" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="710" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="710" dy="0">Más simple y más probado</tspan></text><polyline points="440,150 500,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">configura</tspan></text><rect x="20" y="262" width="900" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="284.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Diseño estáticamente estable: cuando el plano de control cae, el sistema no necesita llamarlo para seguir; opera con la</tspan></text><text x="470" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">configuración y la capacidad que ya tenía.</tspan></text><rect x="20" y="328" width="440" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="350" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Ejemplo: no depender de lanzar instancias nuevas en el</tspan></text><text x="240" y="366.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">momento de un fallo; tener ya la capacidad preasignada en</tspan></text><text x="240" y="383.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">cada zona.</tspan></text><rect x="480" y="328" width="440" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="358.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Costo: pagar capacidad ociosa y limitar el escalado</tspan></text><text x="700" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">automático reactivo (ver la figura anterior).</tspan></text><rect x="10" y="412" width="920" height="71.8" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="434.9" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: lo que cambia la forma de diseñar es qué se debe llamar durante el fallo. Dónde deja de valer: Amazon documenta el</tspan></text><text x="470" y="451.54" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">patrón (F7) como práctica de AWS; no publica qué porcentaje de la tienda lo cumple, y un sistema con estado fuerte (un</tspan></text><text x="470" y="468.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">saldo) no puede repartir escrituras sin coordinación.</tspan></text><text x="470" y="511.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Static stability using Availability Zones», Amazon Builders&#x27; Library (F7). Dibujo propio.</tspan></text></svg>
