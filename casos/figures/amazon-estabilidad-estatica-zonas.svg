<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 519" width="940" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánta capacidad sobrante cuesta sobrevivir a la pérdida de una zona de disponibilidad</title><desc id="d">Gráfico de líneas: para tolerar la caída de una zona con carga repartida por igual hay que sobredimensionar un 100 por ciento con 2 zonas, 50 con 3 zonas (cifra de Amazon), 33 con 4, 25 con 5 y 20 con 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="519" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánta capacidad sobrante cuesta sobrevivir a la pérdida de una zona de disponibilidad</tspan></text><line x1="78.62" y1="319" x2="910" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="215" x2="910" y2="215" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="215" x2="78.62" y2="215" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="219.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="163" x2="910" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="163" x2="78.62" y2="163" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="111" x2="910" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="111" x2="78.62" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="319" x2="96.62" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">2</tspan></text><line x1="295.465" y1="59" x2="295.465" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="295.465" y1="319" x2="295.465" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="295.465" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295.465" dy="0">3</tspan></text><line x1="494.31" y1="59" x2="494.31" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="319" x2="494.31" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">4</tspan></text><line x1="693.155" y1="59" x2="693.155" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="693.155" y1="319" x2="693.155" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="693.155" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.155" dy="0">5</tspan></text><line x1="892" y1="59" x2="892" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="319" x2="892" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">6</tspan></text><line x1="78.62" y1="319" x2="910" y2="319" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="189" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 189)">Capacidad extra sobre la carga (%)</text><text x="494.31" y="365" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Zonas de disponibilidad usadas</tspan></text><polyline points="96.62,59 295.465,189 494.31,232.42 693.155,254 892,267" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="96.62" cy="59" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="96.62" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">100 %</tspan></text><circle cx="295.465" cy="189" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="305.465" y="193.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="305.465" dy="0">50 % (Amazon)</tspan></text><circle cx="494.31" cy="232.42" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="494.31" y="221.42" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">33 %</tspan></text><circle cx="693.155" cy="254" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="693.155" y="243" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="693.155" dy="0">25 %</tspan></text><circle cx="892" cy="267" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="256" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">20 %</tspan></text><rect x="10" y="379" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la fórmula es 1/(n−1): si una de n zonas cae, las n−1 restantes deben absorber su carga. Con tres zonas, la</tspan></text><text x="470" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Biblioteca dice sobredimensionar un 50 %, de modo que cada zona opera como máximo al 66 % de lo probado. Más zonas abaratan</tspan></text><text x="470" y="437.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la tolerancia, pero añaden complejidad y latencia entre zonas. Dónde deja de valer: es un cálculo propio sobre la regla de</tspan></text><text x="470" y="453.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">F7; supone zonas iguales y carga uniforme, y no cuenta el costo de operar más zonas.</tspan></text><text x="470" y="501.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Static stability using Availability Zones», Amazon Builders&#x27; Library (F7); curva calculada por el autor.</tspan></text></svg>
