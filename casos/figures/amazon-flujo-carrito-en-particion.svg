<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 574" width="940" height="574" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El carrito durante una partición: escribir siempre y reconciliar después</title><desc id="d">Secuencia ilustrativa del mecanismo documentado en Dynamo: durante una partición de red dos réplicas aceptan escrituras distintas del mismo carrito; al sanar la partición el servicio de carrito combina las versiones, de modo que ninguna adición se pierde pero un elemento borrado puede reaparecer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="574" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El carrito durante una partición: escribir siempre y reconciliar después</tspan></text><rect x="20" y="55" width="220" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130" y="78.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130" dy="0">1. Estado común:</tspan></text><text x="130" y="94.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130" dy="0">carrito {libro}</tspan></text><rect x="20" y="150" width="220" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="130" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="130" dy="0">2a. Réplica A</tspan></text><text x="130" y="188.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="130" dy="0">recibe «añadir lápiz»</tspan></text><text x="130" y="205.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="130" dy="0">→ {libro, lápiz}</tspan></text><rect x="300" y="150" width="220" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="410" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410" dy="0">2b. Réplica B</tspan></text><text x="410" y="188.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410" dy="0">recibe «añadir taza»</tspan></text><text x="410" y="205.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410" dy="0">→ {libro, taza}</tspan></text><polyline points="130,111 130,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="240,100 410,100 410,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="600" y="150" width="310" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="755" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="755" dy="0">Partición de red: A y B no</tspan></text><text x="755" y="188.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="755" dy="0">se ven; ambas aceptan</tspan></text><text x="755" y="205.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="755" dy="0">escrituras (disponibilidad)</tspan></text><rect x="20" y="270" width="500" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="270" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="270" dy="0">3. Al sanar: dos versiones concurrentes (relojes vectoriales)</tspan></text><polyline points="130,220 130,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="410,220 410,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="360" width="500" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="270" y="391.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="270" dy="0">4. La aplicación fusiona → {libro, lápiz, taza}</tspan></text><polyline points="270,326 270,360" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="600" y="270" width="310" height="146" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="755" y="321.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="755" dy="0">Coste aceptado y documentado:</tspan></text><text x="755" y="338.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="755" dy="0">«añadir al carrito» nunca se pierde,</tspan></text><text x="755" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="755" dy="0">pero un elemento borrado</tspan></text><text x="755" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="755" dy="0">puede reaparecer</tspan></text><rect x="10" y="440" width="920" height="92.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="473.2" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la figura muestra una decisión de producto, no solo de base de datos. Se prefirió que añadir al carrito nunca</tspan></text><text x="470" y="489.84" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">falle antes que garantizar un único estado visible. Dónde deja de valer: vale para un carrito, donde fusionar tiene</tspan></text><text x="470" y="506.48" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sentido; para un saldo o un inventario la fusión no es aceptable y se necesita coordinación.</tspan></text><text x="470" y="560.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DeCandia et al., Dynamo, SOSP 2007; los elementos del carrito son un ejemplo propio.</tspan></text></svg>
