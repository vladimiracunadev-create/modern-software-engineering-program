<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 694" width="940" height="694" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware de Amazon: lo que se publica y lo que no</title><desc id="d">Diagrama del hardware que Amazon documenta públicamente: servidores de uso general y nodos homogéneos en el artículo de Dynamo, procesadores Graviton2 y almacenamiento EBS en Prime Day 2022, chips propios Trainium y Graviton en 2025 y una terminal de satélite con silicio propio; no se publican modelos de servidor, redes ni centros de datos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="694" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware de Amazon: lo que se publica y lo que no</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Servidores</tspan></text><rect x="10" y="92" width="450" height="101" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.86" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: decenas de miles de servidores en muchos</tspan></text><text x="235" y="129.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">centros de datos (Dynamo, 2007); hardware estándar de uso</tspan></text><text x="235" y="146.14" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">general con menos rendimiento de disco que servidores</tspan></text><text x="235" y="162.78" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">empresariales de gama alta; las mediciones del artículo</tspan></text><text x="235" y="179.42" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">usan unos cientos de nodos homogéneos.</tspan></text><rect x="10" y="201" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="221.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">No se sabe: modelos, fabricantes y densidad de cada</tspan></text><text x="235" y="238.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">servidor.</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Procesadores y chips propios</tspan></text><rect x="480" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: en Prime Day 2022 la huella de servidores</tspan></text><text x="705" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">creció solo un 7 % gracias al mayor uso de procesadores</tspan></text><text x="705" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Graviton2.</tspan></text><rect x="480" y="167.8" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="188.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: en 2025 Amazon dice que Trainium y Graviton</tspan></text><text x="705" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">suman más de 10 mil millones de dólares de ingreso anual</tspan></text><text x="705" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">recurrente y que Trainium2 tiene 1,4 millones de chips</tspan></text><text x="705" y="238.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">instalados (afirmación de la empresa).</tspan></text><rect x="480" y="260.2" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="281.14" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: cuántos servidores usan Graviton hoy.</tspan></text><rect x="10" y="268.2" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="289.12" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Almacenamiento y bases</tspan></text><rect x="10" y="310.2" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="331.1" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: en Prime Day 2022 se añadieron 152 petabytes</tspan></text><text x="235" y="347.74" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">de EBS; la flota atendió 11,4 billones de peticiones por</tspan></text><text x="235" y="364.38" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">día y movió 532 petabytes por día.</tspan></text><rect x="10" y="386" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="406.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: 5.326 instancias de Aurora procesaron 288 mil</tspan></text><text x="235" y="423.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">millones de transacciones y guardaron 1.849 terabytes ese</tspan></text><text x="235" y="440.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">día.</tspan></text><rect x="10" y="461.8" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="482.74" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">No se sabe: tipos de disco y de red de almacenamiento.</tspan></text><rect x="480" y="310.8" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="331.72" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Red y dispositivos</tspan></text><rect x="480" y="352.8" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="373.7" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: los centros de datos de Dynamo se conectan con</tspan></text><text x="705" y="390.34" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">enlaces de alta velocidad; la latencia entre centros afecta</tspan></text><text x="705" y="406.98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">a la respuesta (F1).</tspan></text><rect x="480" y="428.6" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="449.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: Amazon presenta en 2025 una terminal para su</tspan></text><text x="705" y="466.14" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">servicio de satélites con silicio propio y que Alexa+ llega</tspan></text><text x="705" y="482.78" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">a televisores y coches de terceros (F4).</tspan></text><rect x="480" y="504.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="525.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: topología de red, capacidad de enlace y detalle</tspan></text><text x="705" y="541.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">de los dispositivos de usuario.</tspan></text><rect x="10" y="571.6" width="920" height="71.8" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="594.5" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cada recuadro separa lo publicado de lo que no se sabe. Los datos de 2007 (Dynamo) y de 2022 (Prime Day) describen</tspan></text><text x="470" y="611.14" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">servicios de AWS, no la tienda entera. Dónde deja de valer: Amazon no publica inventario de hardware; las cifras de chips</tspan></text><text x="470" y="627.78" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">propios son afirmaciones de la empresa en un comunicado.</tspan></text><text x="470" y="671.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: DeCandia et al. 2007 (F1); Barr, 2022 (F10); comunicado Q4 2025 (F4).</tspan></text></svg>
