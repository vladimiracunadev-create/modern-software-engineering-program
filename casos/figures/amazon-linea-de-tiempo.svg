<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 389" width="940" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Evolución de Amazon: de librería en línea a plataforma de comercio y de nube</title><desc id="d">Línea de tiempo de 1994 a 2025 en dos carriles: la tienda (lanzamiento en 1995, marketplace, Prime) y la plataforma técnica (AWS desde 2002, EC2 en 2006); los ingresos pasan de 147,8 millones de dólares en 1997 a 716,9 mil millones en 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="389" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Evolución de Amazon: de librería en línea a plataforma de comercio y de nube</tspan></text><line x1="174" y1="83" x2="174" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="174" y1="191" x2="174" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="174" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="174" dy="0">1 994</tspan></text><line x1="312.375" y1="83" x2="312.375" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="312.375" y1="191" x2="312.375" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="312.375" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312.375" dy="0">2 000</tspan></text><line x1="450.75" y1="83" x2="450.75" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="450.75" y1="191" x2="450.75" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="450.75" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="450.75" dy="0">2 006</tspan></text><line x1="589.125" y1="83" x2="589.125" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="589.125" y1="191" x2="589.125" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="589.125" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="589.125" dy="0">2 012</tspan></text><line x1="727.5" y1="83" x2="727.5" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="727.5" y1="191" x2="727.5" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="727.5" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727.5" dy="0">2 018</tspan></text><line x1="912" y1="83" x2="912" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="191" x2="912" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2 026</tspan></text><line x1="174" y1="191" x2="912" y2="191" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="114.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">Tienda</tspan></text><text x="164" y="168.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">Plataforma técnica</tspan></text><line x1="197.062" y1="75" x2="197.062" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="197.062" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.062" dy="0">Lanzamiento</tspan></text><line x1="450.75" y1="75" x2="450.75" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="450.75" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.75" dy="0">EC2 (24 ago)</tspan></text><rect x="197.062" y="92" width="115.312" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="254.719" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="254.719" dy="0">Libros</tspan></text><rect x="312.375" y="92" width="115.312" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="370.031" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="370.031" dy="0">Marketplace</tspan></text><rect x="427.688" y="92" width="484.312" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="669.844" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="669.844" dy="0">Prime y logística</tspan></text><line x1="14" y1="137" x2="912" y2="137" stroke="#d5dde1" stroke-width="1"/><rect x="174" y="146" width="184.5" height="36" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="266.25" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="266.25" dy="0">Tienda</tspan></text><rect x="358.5" y="146" width="92.25" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="404.625" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="404.625" dy="0">APIs</tspan></text><rect x="450.75" y="146" width="461.25" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="681.375" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="681.375" dy="0">AWS: S3, EC2 y siguientes</tspan></text><text x="543" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="543" dy="0">Año</tspan></text><rect x="10" y="249" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="273.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Fechas: 1995 lanzamiento y 1997 salida a bolsa (fuentes secundarias; la carta de 1997 documenta 147,8 millones de ingresos</tspan></text><text x="470" y="290.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y 1,5 millones de clientes), 2006 EC2 en beta (anuncio oficial del 24 de agosto de 2006), 2025 ingresos de 716,9 mil</tspan></text><text x="470" y="307.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">millones (comunicado Q4 2025). Las eras de la tienda y de la plataforma son una síntesis del autor, no fechas oficiales.</tspan></text><text x="470" y="323.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde deja de valer: los cortes entre eras son aproximados.</tspan></text><text x="470" y="371.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: carta a accionistas 1997; anuncio de EC2 (2006); comunicado Q4 2025; Wikipedia (fechas secundarias).</tspan></text></svg>
