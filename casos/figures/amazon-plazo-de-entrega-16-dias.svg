<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 355" width="940" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la confirmación del código a producción: 16 días de media antes de las tuberías</title><desc id="d">Barras apiladas en días: antes de automatizar, un cambio tardaba 16 días de media desde que se confirmaba hasta producción: 1,5 días de escribir código, menos de una hora de compilar y desplegar y casi 14 días de espera entre pasos; el equipo piloto de las tuberías redujo ese plazo un 90 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="355" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la confirmación del código a producción: 16 días de media antes de las tuberías</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Escribir el código</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Construir y desplegar</tspan></text><rect x="406.06" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="426.06" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="426.06" dy="0">Esperas entre pasos</tspan></text><rect x="597.32" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="617.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="617.32" dy="0">Total tras el piloto</tspan></text><line x1="194" y1="77" x2="194" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="157" x2="194" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">0</tspan></text><line x1="364.425" y1="77" x2="364.425" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="364.425" y1="157" x2="364.425" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="364.425" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364.425" dy="0">5</tspan></text><line x1="534.85" y1="77" x2="534.85" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="534.85" y1="157" x2="534.85" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="534.85" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534.85" dy="0">10</tspan></text><line x1="705.275" y1="77" x2="705.275" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="705.275" y1="157" x2="705.275" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="705.275" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.275" dy="0">15</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">20</tspan></text><line x1="194" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Antes (promedio)</tspan></text><text x="184" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Equipo piloto (−90 %)</tspan></text><rect x="194" y="84" width="51.1275" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="219.564" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="219.564" dy="0">1,5</tspan></text><rect x="245.127" y="84" width="1.3634" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><rect x="246.491" y="84" width="492.869" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="492.925" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492.925" dy="0">14,5</tspan></text><rect x="739.36" y="84" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="746.36" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="746.36" dy="0">16,0</tspan></text><rect x="194" y="124" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="194" y="124" width="0" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><rect x="194" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="194" y="124" width="54.536" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="221.268" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="221.268" dy="0">1,6</tspan></text><text x="255.536" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="255.536" dy="0">1,6</tspan></text><text x="534.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="534.85" dy="0">Días de calendario</tspan></text><rect x="10" y="215" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la barra de arriba descompone los 16 días: casi todo era espera, no trabajo. Con las tuberías, el equipo que más</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ganó redujo el plazo total un 90 %, unos 1,6 días si se aplica ese porcentaje al promedio (cálculo propio). Dónde deja de</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: la descomposición es de un estudio interno anterior y de un equipo piloto, no del estado actual de Amazon; el 1,6 es</tspan></text><text x="470" y="289.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una conversión aritmética, no una medición publicada.</tspan></text><text x="470" y="337.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Going faster with continuous delivery», Amazon Builders&#x27; Library (F13); 16 × 0,1 = 1,6 días, cálculo propio.</tspan></text></svg>
