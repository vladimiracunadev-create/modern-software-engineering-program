<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 577" width="940" height="577" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reintentos en capas: la carga sobre la base de datos se multiplica</title><desc id="d">Gráfico de líneas: con tres intentos por capa y una pila de cinco capas la carga sobre la base de datos se multiplica por 243, como describe la Biblioteca de Constructores; con dos intentos por capa serían 32 veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="577" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reintentos en capas: la carga sobre la base de datos se multiplica</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">3 intentos por capa</tspan></text><rect x="207.26" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">2 intentos por capa (cálculo propio)</tspan></text><line x1="78.62" y1="377" x2="910" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="377" x2="78.62" y2="377" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="910" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="261" x2="910" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="261" x2="78.62" y2="261" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="265.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="203" x2="910" y2="203" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="203" x2="78.62" y2="203" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">150</tspan></text><line x1="78.62" y1="145" x2="910" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="145" x2="78.62" y2="145" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="149.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">250</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="377" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="377" x2="96.62" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="295.465" y1="87" x2="295.465" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="295.465" y1="377" x2="295.465" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="295.465" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295.465" dy="0">2</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="377" x2="494.31" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">3</tspan></text><line x1="693.155" y1="87" x2="693.155" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="693.155" y1="377" x2="693.155" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="693.155" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.155" dy="0">4</tspan></text><line x1="892" y1="87" x2="892" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="377" x2="892" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">5</tspan></text><line x1="78.62" y1="377" x2="910" y2="377" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="232" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 232)">Intentos que recibe la base de datos por cada petición</text><text x="494.31" y="423" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Capas de servicio apiladas, cada una con su propio reintento</tspan></text><polyline points="96.62,373.52 295.465,366.56 494.31,345.68 693.155,283.04 892,95.12" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="373.52" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="362.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">3</tspan></text><circle cx="295.465" cy="366.56" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="295.465" y="355.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="295.465" dy="0">9</tspan></text><circle cx="494.31" cy="345.68" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="494.31" y="334.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">27</tspan></text><circle cx="693.155" cy="283.04" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="693.155" y="272.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="693.155" dy="0">81</tspan></text><circle cx="892" cy="95.12" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="84.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">243</tspan></text><polyline points="96.62,374.68 295.465,372.36 494.31,367.72 693.155,358.44 892,339.88" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="369.18" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="363.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">2</tspan></text><rect x="289.965" y="366.86" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="295.465" y="361.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="295.465" dy="0">4</tspan></text><rect x="488.81" y="362.22" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="494.31" y="356.72" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">8</tspan></text><rect x="687.655" y="352.94" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="693.155" y="347.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="693.155" dy="0">16</tspan></text><rect x="886.5" y="334.38" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="328.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">32</tspan></text><rect x="10" y="437" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cada capa multiplica por el número de intentos lo que hace la inferior (3, 9, 27, 81, 243). Por eso la regla de</tspan></text><text x="470" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Amazon es reintentar en un solo punto de la pila y limitar los reintentos con un cubo de fichas local. Dónde deja de valer:</tspan></text><text x="470" y="495.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es el peor caso, cuando todos los intentos fallan; la serie de dos intentos es una extrapolación propia con la misma</tspan></text><text x="470" y="511.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fórmula, no un dato publicado.</tspan></text><text x="470" y="559.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Timeouts, retries, and backoff with jitter», Amazon Builders&#x27; Library (F6); 3^5 = 243.</tspan></text></svg>
