<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 467" width="940" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ventas y resultado operativo de Amazon en 2025 por segmento (miles de millones de dólares)</title><desc id="d">Barras horizontales agrupadas: América del Norte vendió 426,3 mil millones y ganó 29,6 de resultado operativo; Internacional vendió 161,9 y ganó 4,7; AWS vendió 128,7 y ganó 45,6, es decir, el 18 por ciento de las ventas aporta el 57 por ciento del resultado operativo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="467" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ventas y resultado operativo de Amazon en 2025 por segmento (miles de millones de dólares)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ventas</tspan></text><rect x="109.24" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">Resultado operativo</tspan></text><line x1="194" y1="77" x2="194" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="269" x2="194" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">0</tspan></text><line x1="330.34" y1="77" x2="330.34" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="330.34" y1="269" x2="330.34" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="330.34" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="330.34" dy="0">100</tspan></text><line x1="466.68" y1="77" x2="466.68" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="466.68" y1="269" x2="466.68" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="466.68" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="466.68" dy="0">200</tspan></text><line x1="603.02" y1="77" x2="603.02" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="603.02" y1="269" x2="603.02" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="603.02" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="603.02" dy="0">300</tspan></text><line x1="739.36" y1="77" x2="739.36" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="739.36" y1="269" x2="739.36" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="739.36" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="739.36" dy="0">400</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="269" x2="875.7" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">500</tspan></text><line x1="194" y1="269" x2="875.7" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">América del Norte</tspan></text><text x="184" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Internacional</tspan></text><text x="184" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">AWS</tspan></text><rect x="194" y="83" width="581.217" height="24.5" rx="3" fill="#087f8c"/><text x="782.217" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="782.217" dy="0">426,3</tspan></text><rect x="194" y="110.5" width="40.3566" height="24.5" rx="3" fill="#c0432f"/><text x="241.357" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="241.357" dy="0">29,6</tspan></text><rect x="194" y="147" width="220.734" height="24.5" rx="3" fill="#087f8c"/><text x="421.734" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="421.734" dy="0">161,9</tspan></text><rect x="194" y="174.5" width="6.40798" height="24.5" rx="3" fill="#c0432f"/><text x="207.408" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="207.408" dy="0">4,7</tspan></text><rect x="194" y="211" width="175.47" height="24.5" rx="3" fill="#087f8c"/><text x="376.47" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="376.47" dy="0">128,7</tspan></text><rect x="194" y="238.5" width="62.171" height="24.5" rx="3" fill="#c0432f"/><text x="263.171" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="263.171" dy="0">45,6</tspan></text><text x="534.85" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="534.85" dy="0">Miles de millones de dólares (2025)</tspan></text><rect x="10" y="327" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">AWS vende unas tres veces menos que la tienda de América del Norte y gana más que los otros dos segmentos juntos (45,6</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">frente a 34,3). El margen operativo por segmento sale de dividir las dos barras: AWS 35 %, América del Norte 7 %,</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Internacional 3 %. Dónde deja de valer: los segmentos reparten costos compartidos con criterios que Amazon no detalla; el</tspan></text><text x="470" y="401.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resultado total ($80,0) es el consolidado.</tspan></text><text x="470" y="449.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cifras: comunicado de resultados Q4 2025 de Amazon (consulta 2026-11-16).</tspan></text></svg>
