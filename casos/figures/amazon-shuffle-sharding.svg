<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Shuffle sharding: cada cliente recibe una combinación casi única de trabajadores</title><desc id="d">Diagrama ilustrativo con ocho trabajadores y tres clientes con dos trabajadores cada uno: si un cliente con una petición dañina agota sus dos trabajadores, otro cliente que comparte uno de ellos sigue servido por el otro y un tercero ni lo nota; con ocho trabajadores hay 28 combinaciones posibles de dos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="560" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Shuffle sharding: cada cliente recibe una combinación casi única de trabajadores</tspan></text><rect x="40" y="260" width="90" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="85" y="277.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="85" dy="0">Trabajador</tspan></text><text x="85" y="293.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="85" dy="0">1</tspan></text><rect x="152" y="260" width="90" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="197" y="277.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="197" dy="0">Trabajador</tspan></text><text x="197" y="293.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="197" dy="0">2</tspan></text><rect x="264" y="260" width="90" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="309" y="277.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="309" dy="0">Trabajador</tspan></text><text x="309" y="293.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="309" dy="0">3</tspan></text><rect x="376" y="260" width="90" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="421" y="277.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="421" dy="0">Trabajador</tspan></text><text x="421" y="293.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="421" dy="0">4</tspan></text><rect x="488" y="260" width="90" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="533" y="277.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="533" dy="0">Trabajador</tspan></text><text x="533" y="293.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="533" dy="0">5</tspan></text><rect x="600" y="260" width="90" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="645" y="277.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="645" dy="0">Trabajador</tspan></text><text x="645" y="293.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="645" dy="0">6</tspan></text><rect x="712" y="260" width="90" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="757" y="277.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="757" dy="0">Trabajador</tspan></text><text x="757" y="293.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="757" dy="0">7</tspan></text><rect x="824" y="260" width="90" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="869" y="277.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="869" dy="0">Trabajador</tspan></text><text x="869" y="293.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="869" dy="0">8</tspan></text><rect x="150" y="60" width="180" height="62" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="86.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="240" dy="0">Cliente Alfa</tspan></text><text x="240" y="102.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="240" dy="0">(petición dañina)</tspan></text><polyline points="240,122 85,260" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="240,122 197,260" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="380" y="60" width="180" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">Cliente Beta</tspan></text><polyline points="470,122 197,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,122 533,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="640" y="60" width="180" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="730" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="730" dy="0">Cliente Gamma</tspan></text><polyline points="730,122 309,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="730,122 757,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="320" width="900" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con ocho trabajadores y dos por cliente hay 28 combinaciones. Si Alfa agota 1 y 2, Beta pierde solo el 2 y sigue con el</tspan></text><text x="470" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">5; Gamma no ve nada. Un cliente que compartiera ambos trabajadores con Alfa quedaría afectado: es 1 de 28.</tspan></text><rect x="10" y="404" width="920" height="105" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="426.86" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: las flechas unen a cada cliente con sus trabajadores asignados; en rojo, los trabajadores que agota la petición</tspan></text><text x="470" y="443.5" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dañina. Sin sharding todos comparten los ocho y un solo cliente puede degradar al conjunto; con shuffle sharding, el radio</tspan></text><text x="470" y="460.14" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de impacto cae a una fracción pequeña y se reduce más aún con cientos de clientes y más trabajadores. Dónde deja de valer:</tspan></text><text x="470" y="476.78" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la figura es un modelo didáctico; funciona si los clientes reintentan hacia otro trabajador de su combinación y si la carga</tspan></text><text x="470" y="493.42" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dañina no se propaga por otra capa compartida.</tspan></text><text x="470" y="537" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Workload isolation using shuffle-sharding», Amazon Builders&#x27; Library, 5 de diciembre de 2019 (F8); el 28 es C(8,2).</tspan></text></svg>
