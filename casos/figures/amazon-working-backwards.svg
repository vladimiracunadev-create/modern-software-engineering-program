<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 504" width="940" height="504" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Trabajar hacia atrás: del cliente al producto con un comunicado de prensa y preguntas</title><desc id="d">Flujo del proceso Working Backwards descrito por Bryar y Carr: se escribe primero el comunicado de prensa de menos de una página y un FAQ de hasta cinco, se lee en silencio en una reunión de una hora, se revisa en varias rondas con la dirección y solo una minoría de documentos llega a recibir recursos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="504" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Trabajar hacia atrás: del cliente al producto con un comunicado y preguntas</tspan></text><rect x="20" y="60" width="140" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="90" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90" dy="0">1. Idea</tspan></text><text x="90" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90" dy="0">con el cliente</tspan></text><rect x="170" y="60" width="140" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="240" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">2. Comunicado</tspan></text><text x="240" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">(&lt; 1 página)</tspan></text><rect x="320" y="60" width="140" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="390" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">3. FAQ</tspan></text><text x="390" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">(≤ 5 páginas)</tspan></text><rect x="470" y="60" width="140" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="540" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="540" dy="0">4. Lectura en</tspan></text><text x="540" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="540" dy="0">silencio, 1 hora</tspan></text><rect x="620" y="60" width="140" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="690" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">5. Comentarios;</tspan></text><text x="690" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">los senior, al</tspan></text><text x="690" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">final</tspan></text><rect x="770" y="60" width="140" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="840" y="95.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">6. Revisiones</tspan></text><text x="840" y="111.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">con dirección</tspan></text><polyline points="160,100 170,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="310,100 320,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="460,100 470,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,100 620,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="760,100 770,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="170" width="440" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Documentado: es normal que un equipo escriba diez</tspan></text><text x="240" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">borradores o más y se reúna cinco veces o más con sus</tspan></text><text x="240" y="230.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">líderes.</tspan></text><rect x="480" y="170" width="440" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Documentado: la mayoría de los PR/FAQ no llega a</tspan></text><text x="700" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">lanzarse; lo describen como una función, no un fallo del</tspan></text><text x="700" y="230.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">proceso.</tspan></text><rect x="20" y="265" width="440" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Qué evita: construir primero y buscar después al cliente;</tspan></text><text x="240" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">limita la extensión para obligar a decidir qué importa.</tspan></text><rect x="480" y="265" width="440" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="287" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">Costo: semanas de escritura antes de escribir código;</tspan></text><text x="700" y="303.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">riesgo de documentos pulidos que no reflejan al cliente</tspan></text><text x="700" y="320.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">real.</tspan></text><rect x="10" y="350" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="372.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el proceso invierte el orden habitual (primero producto, luego publicidad): se escribe el lanzamiento antes de</tspan></text><text x="470" y="389.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">construir. Dónde deja de valer: la fuente es un extracto del libro de dos antiguos empleados publicado por Amazon (F11), es</tspan></text><text x="470" y="406.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">decir, autodescripción favorable; no hay datos públicos de cuántos proyectos salvó o frenó. El costo de la última caja es</tspan></text><text x="470" y="422.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">análisis propio.</tspan></text><text x="470" y="466.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «An insider look at Amazon&#x27;s culture and processes» (F11), 9 de febrero de 2021; Working Backwards se usa «desde 2004» según</tspan></text><text x="470" y="481.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el extracto.</tspan></text></svg>
