<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 504" width="940" height="504" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del requisito de hace diez años a la reparación de 2000, en ocho hitos</title><desc id="d">Eje no proporcional con ocho hitos: más de diez años antes un requisito de alineación para las primeras versiones de Ariane; 1989 el único uso real; 1992 se decide no incluir las unidades reales en la simulación; 4 de junio de 1996 el fallo; 13 de junio empieza la comisión; 19 de julio informe; 26 de marzo de 1997 se aprueba repetir Cluster; 2000 vuelan los cuatro satélites.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="504" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Del requisito de hace diez años a la reparación de 2000, en ocho hitos</tspan></text><line x1="30" y1="195" x2="910" y2="195" stroke="#32505f" stroke-width="2"/><line x1="80" y1="195" x2="80" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="80" cy="195" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="80" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="80" dy="0"></tspan></text><rect x="6" y="55" width="170" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="91" y="75.36" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">Antes de 1986:</tspan></text><text x="91" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">requisito de</tspan></text><text x="91" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">alineación</tspan></text><text x="91" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">continuada en</tspan></text><text x="91" y="141.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">versiones previas</tspan></text><line x1="191.429" y1="195" x2="191.429" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="191.429" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="191.429" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="191.429" dy="0"></tspan></text><rect x="106.429" y="235" width="170" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="191.429" y="272" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="191.429" dy="0">1989: la función se</tspan></text><text x="191.429" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="191.429" dy="0">usa una vez, en el</tspan></text><text x="191.429" y="305.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="191.429" dy="0">vuelo 33</tspan></text><line x1="302.857" y1="195" x2="302.857" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="302.857" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="302.857" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="302.857" dy="0"></tspan></text><rect x="217.857" y="55" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="302.857" y="83.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="302.857" dy="0">1992: se decide no</tspan></text><text x="302.857" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="302.857" dy="0">poner las unidades</tspan></text><text x="302.857" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="302.857" dy="0">inerciales reales en</tspan></text><text x="302.857" y="133.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="302.857" dy="0">la simulación</tspan></text><line x1="414.286" y1="195" x2="414.286" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="414.286" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="414.286" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="414.286" dy="0"></tspan></text><rect x="329.286" y="235" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="414.286" y="272" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="414.286" dy="0">4 jun 1996: vuelo</tspan></text><text x="414.286" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="414.286" dy="0">501, fallo a los 37</tspan></text><text x="414.286" y="305.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="414.286" dy="0">s</tspan></text><line x1="525.714" y1="195" x2="525.714" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="525.714" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525.714" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="525.714" dy="0"></tspan></text><rect x="440.714" y="55" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525.714" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525.714" dy="0">13 jun 1996: la</tspan></text><text x="525.714" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525.714" dy="0">comisión empieza a</tspan></text><text x="525.714" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525.714" dy="0">trabajar</tspan></text><line x1="637.143" y1="195" x2="637.143" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="637.143" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="637.143" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="637.143" dy="0"></tspan></text><rect x="552.143" y="235" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="637.143" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="637.143" dy="0">19 jul 1996: informe</tspan></text><text x="637.143" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="637.143" dy="0">de la comisión</tspan></text><line x1="748.571" y1="195" x2="748.571" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="748.571" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="748.571" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="748.571" dy="0"></tspan></text><rect x="663.571" y="55" width="170" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="748.571" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="748.571" dy="0">26 mar 1997: se</tspan></text><text x="748.571" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="748.571" dy="0">aprueba repetir la</tspan></text><text x="748.571" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="748.571" dy="0">misión Cluster</tspan></text><line x1="860" y1="195" x2="860" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="860" cy="195" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="860" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="860" dy="0"></tspan></text><rect x="764" y="235" width="170" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="849" y="263.68" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">16 jul y 9 ago 2000:</tspan></text><text x="849" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">lanzamiento de los</tspan></text><text x="849" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">cuatro satélites en</tspan></text><text x="849" y="313.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">Soyuz</tspan></text><rect x="10" y="365" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="389.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: las dos decisiones que hicieron falta (conservar la alineación, simular sin la unidad real) tienen años de</tspan></text><text x="470" y="406.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">antigüedad y cada una era razonable en su momento. Mira que todo el consecuente (informe, repetición, repuesto) ocurre en</tspan></text><text x="470" y="423.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuatro años.</tspan></text><text x="470" y="470.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartados 2.2 y 2.3; ESA, comunicado 12-1997 y ficha de</tspan></text><text x="470" y="486" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">Cluster. Espaciado uniforme, no a escala.</tspan></text></svg>
