<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 439" width="940" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mismo software, otro lanzador: lo que cambió y lo que no</title><desc id="d">Dos columnas: Ariane 4, donde la alineación continuaba tras la cuenta atrás por una razón de operación y la trayectoria no alcanzaba el límite, y Ariane 5, donde la secuencia de preparación era distinta, la alineación no servía de nada y la aceleración inicial era mucho mayor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="439" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mismo software, otro lanzador: lo que cambió y lo que no</tspan></text><rect x="10" y="51" width="451" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235.5" dy="0">Ariane 4</tspan></text><rect x="10" y="101" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">La alineación seguía activa tras el despegue para poder</tspan></text><text x="235.5" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">reiniciar la cuenta atrás sin esperar 45 minutos o más</tspan></text><rect x="10" y="156.28" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="179.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Esa función se usó una vez, en 1989, en el vuelo 33</tspan></text><rect x="10" y="204.28" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="223.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">La trayectoria de los primeros 40 s deja la variable lejos</tspan></text><text x="235.5" y="239.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">del límite</tspan></text><rect x="10" y="259.56" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="283.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Sin fallos de este tipo en vuelos reales</tspan></text><rect x="479" y="51" width="451" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="704.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="704.5" dy="0">Ariane 5</tspan></text><rect x="479" y="101" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Secuencia de preparación distinta: la función no se</tspan></text><text x="704.5" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">necesitaba</tspan></text><rect x="479" y="156.28" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Se mantuvo &#x27;por comunalidad&#x27; con un diseño que funcionaba</tspan></text><text x="704.5" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">bien</tspan></text><rect x="479" y="211.56" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Aceleración inicial alta; velocidad horizontal cinco veces</tspan></text><text x="704.5" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">más rápida</tspan></text><rect x="479" y="266.84" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="285.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Mismo programa con una trayectoria que nadie había incluido</tspan></text><text x="704.5" y="302.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">en las especificaciones</tspan></text><rect x="10" y="332.12" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="357.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: reutilizar software probado en vuelo reduce riesgo solo si el entorno de uso es el mismo. Mira la fila</tspan></text><text x="470" y="373.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">central: lo que justificaba el requisito en Ariane 4 ya no existía en Ariane 5 y el requisito se quedó.</tspan></text><text x="470" y="421.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartados 2.2 y 3.1 (m a p).</tspan></text></svg>
