<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 336" width="940" height="336" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La cadena de eventos técnicos, de la causa a la destrucción</title><desc id="d">Cadena causal en nueve pasos: requisito heredado de alineación; BH mayor de lo esperado; conversión sin protección; error de operando; parada de la unidad de reserva y de la activa; diagnóstico interpretado como datos; toberas al extremo; ruptura; autodestrucción.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="336" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La cadena de eventos técnicos, de la causa a la destrucción</tspan></text><rect x="10" y="51" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">Requisito heredado:</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">alineación 50 s tras el</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">modo de vuelo</tspan></text><rect x="250" y="51" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="350" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">Trayectoria de Ariane 5:</tspan></text><text x="350" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">BH mucho mayor</tspan></text><rect x="490" y="51" width="200" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="590" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">Conversión de 64 a 16</tspan></text><text x="590" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">bits sin protección</tspan></text><rect x="730" y="51" width="200" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Error de operando:</tspan></text><text x="830" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">excepción</tspan></text><polyline points="210,82.96 250,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,82.96 490,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,82.96 730,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="830,114.92 830,129.92 830,129.92 830,148.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="730" y="148.92" width="200" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Se paran la reserva y</tspan></text><text x="830" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">0,05 s después la activa</tspan></text><rect x="490" y="148.92" width="200" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="590" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">Diagnóstico leído como</tspan></text><text x="590" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">datos de vuelo</tspan></text><rect x="250" y="148.92" width="200" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="350" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">Toberas a fondo: ángulo</tspan></text><text x="350" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">de ataque &gt; 20°</tspan></text><rect x="10" y="148.92" width="200" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">Ruptura a H0 + 39 s y</tspan></text><text x="110" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">autodestrucción</tspan></text><polyline points="730,172.56 690,172.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="490,172.56 450,172.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="250,172.56 210,172.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="212.2" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="237.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: son ocho pasos y cada uno es una decisión o una consecuencia distinta; cortar cualquiera habría evitado la</tspan></text><text x="470" y="253.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pérdida. La comisión dice que la cadena está establecida &#x27;sin duda razonable&#x27; y que la simulación posterior la reprodujo</tspan></text><text x="470" y="270.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fielmente.</tspan></text><text x="470" y="318.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartados 2.1 y 3.1.</tspan></text></svg>
