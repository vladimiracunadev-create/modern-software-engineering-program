<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 417" width="940" height="417" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La comisión de investigación: encargo, miembros y apoyo técnico</title><desc id="d">Tres columnas: el encargo de tres puntos que recibió la comisión, sus diez miembros de cinco países y el comité técnico asesor de cinco personas, con el inicio de su trabajo el 13 de junio de 1996.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="417" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La comisión de investigación: encargo, miembros y apoyo técnico</tspan></text><rect x="10" y="51" width="294.667" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157.333" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157.333" dy="0">Encargo (tres puntos)</tspan></text><rect x="10" y="101" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Determinar las causas del fallo del</tspan></text><text x="157.333" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">lanzamiento</tspan></text><rect x="10" y="156.28" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Comprobar si las pruebas de</tspan></text><text x="157.333" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">cualificación y aceptación eran</tspan></text><text x="157.333" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">adecuadas para el problema</tspan></text><rect x="10" y="228.2" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="251.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Recomendar acciones correctivas</tspan></text><rect x="322.667" y="51" width="294.667" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Comisión: 10 miembros</tspan></text><rect x="322.667" y="101" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Presidente: J.-L. Lions, Academia de</tspan></text><text x="470" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Ciencias (Francia)</tspan></text><rect x="322.667" y="156.28" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Vicepresidente: L. Lübeck, Swedish</tspan></text><text x="470" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Space Corporation</tspan></text><rect x="322.667" y="211.56" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Ocho vocales de Francia, Alemania,</tspan></text><text x="470" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Italia y el Reino Unido: academia,</tspan></text><text x="470" y="263.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">defensa, investigación e industria</tspan></text><rect x="635.333" y="51" width="294.667" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782.667" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="782.667" dy="0">Comité técnico asesor: 5</tspan></text><rect x="635.333" y="101" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Representantes de BPD, Matra Marconi</tspan></text><text x="782.667" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Space, CNES, Aérospatiale y ESA</tspan></text><rect x="635.333" y="156.28" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="179.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Empezó el 13 de junio de 1996</tspan></text><rect x="635.333" y="204.28" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="223.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Informe público el 19 de julio y</tspan></text><text x="782.667" y="239.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">presentación el 23 de julio de 1996</tspan></text><rect x="10" y="293.48" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="318.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: una comisión independiente, con encargo escrito y miembros de fuera del proyecto, es lo que permitió</tspan></text><text x="470" y="335.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">publicar un diagnóstico técnico en seis semanas. Mira que su tercer punto pide evaluar si las pruebas eran adecuadas, no</tspan></text><text x="470" y="351.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solo qué falló.</tspan></text><text x="470" y="399.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Prólogo.</tspan></text></svg>
