<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Datos que viajaban por el bus: medida, diagnóstico y el dato que se confundió</title><desc id="d">Esquema de datos: el bus llevaba datos de actitud de la unidad inercial; al fallar, la unidad activa transmitió un patrón de bits de diagnóstico de su ordenador, que el ordenador de a bordo interpretó como datos de vuelo; el contexto del fallo se guardó en una memoria EEPROM recuperada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Datos que viajaban por el bus: medida, diagnóstico y el dato que se confundió</tspan></text><rect x="10" y="51" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="78.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Dato de actitud y velocidad</tspan></text><rect x="270" y="51" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Calculado en la unidad inercial a partir de la plataforma; viaja por el bus de datos al</tspan></text><text x="600" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">ordenador de a bordo</tspan></text><rect x="10" y="106.28" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="133.56" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Patrón de bits de diagnóstico</tspan></text><rect x="270" y="106.28" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="125.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Lo que la unidad activa envió al fallar; el informe dice que se interpretó como datos</tspan></text><text x="600" y="141.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">de vuelo (apartado 2.1, hallazgo g)</tspan></text><rect x="10" y="161.56" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="188.84" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Indicación de fallo en el bus</tspan></text><rect x="270" y="161.56" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="180.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">La especificación pedía indicar el fallo en el bus; el ordenador la usó para conmutar,</tspan></text><text x="600" y="197.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">pero la reserva ya estaba parada</tspan></text><rect x="10" y="216.84" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="244.12" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Contexto del fallo en EEPROM</tspan></text><rect x="270" y="216.84" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="235.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Se guardó y se leyó después en los restos recuperados; permitió reconstruir la</tspan></text><text x="600" y="252.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">secuencia</tspan></text><rect x="10" y="272.12" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="299.4" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Variable BH (sesgo horizontal)</tspan></text><rect x="270" y="272.12" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="291.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Valor interno de la alineación, mucho mayor de lo esperado en la trayectoria de Ariane</tspan></text><text x="600" y="307.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">5</tspan></text><rect x="10" y="327.4" width="250" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="135" y="346.36" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="135" dy="0">Datos de trayectoria de Ariane</tspan></text><text x="135" y="363" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="135" dy="0">5</tspan></text><rect x="270" y="327.4" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="346.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">No estaban en los requisitos ni en las especificaciones de la unidad inercial (apartado</tspan></text><text x="600" y="363" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">2.2 y 3.1 r)</tspan></text><rect x="10" y="390.68" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el estado correcto no faltó, faltó el dato que decía qué era cada dato. Un mensaje de diagnóstico enviado</tspan></text><text x="470" y="432.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por el mismo canal que los datos de vuelo es una forma de confusión de tipos entre sistemas. Verde: documentado; dorado:</tspan></text><text x="470" y="448.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dato que faltó.</tspan></text><text x="470" y="496.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartados 2.1, 2.2 y 3.1.</tspan></text></svg>
