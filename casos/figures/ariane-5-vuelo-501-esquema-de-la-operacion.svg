<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 254" width="940" height="254" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema de la operación: del programa de la ESA al lanzamiento comercial</title><desc id="d">Esquema de operación: los Estados miembros financian el programa a través de la ESA, el CNES dirige la base de Kourou, la industria construye lanzador y equipos, el lanzador pone en órbita cargas útiles científicas y comerciales; el vuelo 501 era el primer vuelo de cualificación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="254" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema de la operación: del programa de la ESA al lanzamiento comercial</tspan></text><rect x="10" y="51" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">Estados miembros y ESA:</tspan></text><text x="110" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">programa y financiación</tspan></text><rect x="250" y="51" width="200" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="350" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="350" dy="0">CNES y base de Kourou:</tspan></text><text x="350" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="350" dy="0">campaña y operación</tspan></text><rect x="490" y="51" width="200" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="590" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590" dy="0">Industria: lanzador,</tspan></text><text x="590" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590" dy="0">motor, unidades</tspan></text><text x="590" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590" dy="0">inerciales</tspan></text><rect x="730" y="51" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">Cargas útiles: primera,</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">la misión científica</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">Cluster</tspan></text><polyline points="210,82.96 250,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,82.96 490,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,82.96 730,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="130.92" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="155.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: es un esquema de roles; el informe no describe contratos ni importes. La ESA indica que Ariane 5 voló 117</tspan></text><text x="470" y="172.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">veces entre 1996 y 2023 (ficha de la ESA). Cifras económicas del programa: no se sabe a partir de estas fuentes.</tspan></text><text x="470" y="220.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Prólogo; ESA, ficha de Ariane 5. Roles propios sobre lo que el</tspan></text><text x="470" y="236" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">prólogo menciona.</tspan></text></svg>
