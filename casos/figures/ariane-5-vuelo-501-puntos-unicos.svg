<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 372" width="940" height="372" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Puntos únicos de fallo: lo que no tenía alternativa independiente</title><desc id="d">Mapa de dependencias: el programa de la unidad inercial es el mismo en las dos unidades, el supuesto sobre el rango de BH vale para ambas y el ordenador de a bordo no tiene otra fuente de actitud; un error sistemático las afecta a la vez.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="372" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Puntos únicos de fallo: lo que no tenía alternativa independiente</tspan></text><rect x="10" y="51" width="200" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">Programa de la unidad</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">inercial: idéntico en</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">las dos unidades</tspan></text><rect x="10" y="128.92" width="200" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">Supuesto sobre el rango</tspan></text><text x="110" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">de BH: compartido</tspan></text><rect x="10" y="190.2" width="200" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="110" y="209.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">Única fuente de actitud:</tspan></text><text x="110" y="225.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">las unidades inerciales</tspan></text><rect x="730" y="51" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Toberas movidas por un</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">dato erróneo</tspan></text><rect x="730" y="112.28" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Sin intervención humana</tspan></text><text x="830" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">en vuelo</tspan></text><rect x="280" y="51" width="370" height="200.48" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="294" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="294" dy="0">Control de vuelo</tspan></text><rect x="300" y="91" width="330" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="109.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Ordenador de a bordo sin otro sensor de</tspan></text><text x="465" y="126.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">actitud</tspan></text><rect x="300" y="148.28" width="330" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="167.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Lógica de parada del procesador ante</tspan></text><text x="465" y="183.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">excepción</tspan></text><polyline points="210,82.96 280,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="74.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">código</tspan></text><polyline points="210,152.56 280,152.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="144.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">supuesto</tspan></text><polyline points="210,213.84 280,213.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="205.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">datos</tspan></text><polyline points="650,74.64 730,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">orden</tspan></text><polyline points="650,135.92 730,135.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="127.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">efecto</tspan></text><rect x="10" y="265.48" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="290.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: un único diseño repetido dos veces es un solo punto de fallo con dos copias. Mira que todo lo rojo es</tspan></text><text x="470" y="307.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lógica: se podía haber evitado con diversidad o con confinamiento de la excepción.</tspan></text><text x="470" y="354.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartado 2.2. Mapa propio sobre lo que el informe describe.</tspan></text></svg>
