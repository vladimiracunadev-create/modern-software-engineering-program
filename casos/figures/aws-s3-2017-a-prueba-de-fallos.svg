<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 463" width="940" height="463" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</title><desc id="d">Cuatro columnas: mecanismos que existían y funcionaron (diseño tolerante a la retirada de capacidad, procedimiento, respuesta del equipo), que existían y fallaron (herramienta, panel de estado), que no existían (límite mínimo, retirada lenta, reinicio completo ensayado) y que debieron existir (análisis propio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="463" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</tspan></text><rect x="10" y="51" width="216.5" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="118.25" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="118.25" dy="0">Existía y funcionó</tspan></text><rect x="10" y="101" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Subsistemas diseñados para</tspan></text><text x="118.25" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">tolerar la retirada de</tspan></text><text x="118.25" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">mucha capacidad</tspan></text><rect x="10" y="172.92" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Procedimiento operativo</tspan></text><text x="118.25" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">establecido</tspan></text><rect x="10" y="228.2" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">El equipo restauró el</tspan></text><text x="118.25" y="263.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">índice y la ubicación</tspan></text><rect x="10" y="283.48" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="302.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Mensajes por Twitter y</tspan></text><text x="118.25" y="319.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">texto en el panel</tspan></text><rect x="244.5" y="51" width="216.5" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352.75" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="352.75" dy="0">Existía y falló</tspan></text><rect x="244.5" y="101" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Herramienta de retirada de</tspan></text><text x="352.75" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">capacidad</tspan></text><rect x="244.5" y="156.28" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Panel de estado con</tspan></text><text x="352.75" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">dependencia de S3</tspan></text><rect x="244.5" y="211.56" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Particiones en celdas: aún</tspan></text><text x="352.75" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">parciales en el índice</tspan></text><rect x="479" y="51" width="216.5" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.25" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="587.25" dy="0">No existía</tspan></text><rect x="479" y="101" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Salvaguarda de capacidad</tspan></text><text x="587.25" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">mínima por subsistema</tspan></text><rect x="479" y="156.28" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Retirada de capacidad</tspan></text><text x="587.25" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">lenta</tspan></text><rect x="479" y="211.56" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Ensayo de reinicio</tspan></text><text x="587.25" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">completo en regiones</tspan></text><text x="587.25" y="263.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">grandes</tspan></text><rect x="713.5" y="51" width="216.5" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="821.75" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="821.75" dy="0">Debió existir (análisis</tspan></text><text x="821.75" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="821.75" dy="0">propio)</tspan></text><rect x="713.5" y="108.28" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="127.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Validar la entrada contra</tspan></text><text x="821.75" y="143.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">el impacto previsto</tspan></text><rect x="713.5" y="163.56" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="182.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Retirada limitada por</tspan></text><text x="821.75" y="199.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">ritmo y por mínimo</tspan></text><rect x="713.5" y="218.84" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="237.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Ensayo periódico de</tspan></text><text x="821.75" y="254.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">reinicio a escala</tspan></text><rect x="713.5" y="274.12" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="293.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Panel de estado fuera de</tspan></text><text x="821.75" y="309.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">la región y de los</tspan></text><text x="821.75" y="326.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">servicios que informa</tspan></text><rect x="10" y="356.04" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="381" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: AWS anunció acciones sobre las tres primeras líneas de «No existía» y sobre el panel; la cuarta columna es</tspan></text><text x="470" y="397.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">análisis propio que coincide en gran parte.</tspan></text><text x="470" y="445.32" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017). Análisis propio, no conclusión de AWS.</tspan></text></svg>
