<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que AWS anunció tras el incidente</title><desc id="d">Tres columnas con las acciones del resumen: la herramienta modificada con retirada más lenta y salvaguarda de capacidad mínima, la auditoría de otras herramientas, y el índice y el panel de estado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lo que AWS anunció tras el incidente</tspan></text><rect x="10" y="51" width="294.667" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="157.333" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="157.333" dy="0">Herramienta de capacidad</tspan></text><rect x="10" y="101" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Modificada para retirar capacidad más</tspan></text><text x="157.333" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">despacio</tspan></text><rect x="10" y="156.28" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Salvaguardas para no retirar</tspan></text><text x="157.333" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">capacidad si un subsistema baja de su</tspan></text><text x="157.333" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">mínimo requerido</tspan></text><rect x="322.667" y="51" width="294.667" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">Otras herramientas</tspan></text><rect x="322.667" y="101" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Auditoría de las demás herramientas</tspan></text><text x="470" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">operativas con salvaguardas similares</tspan></text><rect x="635.333" y="51" width="294.667" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782.667" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782.667" dy="0">Recuperación y comunicación</tspan></text><rect x="635.333" y="101" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Trabajo para mejorar el tiempo de</tspan></text><text x="782.667" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">recuperación de los subsistemas clave</tspan></text><rect x="635.333" y="156.28" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Partición más pequeña del índice, que</tspan></text><text x="782.667" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">estaba prevista para más tarde, pasa</tspan></text><text x="782.667" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">a empezar de inmediato</tspan></text><rect x="635.333" y="228.2" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Consola del panel de estado en varias</tspan></text><text x="782.667" y="263.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">regiones</tspan></text><rect x="10" y="293.48" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="318.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: las acciones cubren prevención, recuperación y comunicación. No verificamos aquí su cumplimiento posterior;</tspan></text><text x="470" y="335.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">son compromisos del resumen.</tspan></text><text x="470" y="382.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017).</tspan></text></svg>
