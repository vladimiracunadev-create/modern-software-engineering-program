<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 254" width="940" height="254" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Consecuencias fechadas: de las 9:37 a las acciones anunciadas</title><desc id="d">Cadena de consecuencias: a las 9:37 se ejecuta el comando; S3 no atiende peticiones durante unas horas; a las 13:54 S3 vuelve a operar con normalidad; AWS publica un resumen con disculpa y cambios en la herramienta, el índice y el panel de estado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="254" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Consecuencias fechadas: de las 9:37 a las acciones anunciadas</tspan></text><rect x="10" y="51" width="200" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">28 feb 2017, 9:37 PST:</tspan></text><text x="110" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">se retira más capacidad</tspan></text><text x="110" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">de la prevista</tspan></text><rect x="250" y="51" width="200" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="350" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">S3 sin servir</tspan></text><text x="350" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">peticiones; EC2, EBS,</tspan></text><text x="350" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">Lambda y consola</tspan></text><text x="350" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">afectados</tspan></text><rect x="490" y="51" width="200" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="590" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">13:54: S3 opera con</tspan></text><text x="590" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">normalidad</tspan></text><rect x="730" y="51" width="200" height="80.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">Resumen de AWS con</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">disculpa y cambios en</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">herramienta, índice y</tspan></text><text x="830" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">panel</tspan></text><polyline points="210,91.28 250,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,91.28 490,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,91.28 730,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="147.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="172.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el resumen incluye una disculpa a los clientes y reconoce lo crítico del servicio. No cuantifica clientes ni</tspan></text><text x="470" y="189.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">costes; este caso no los inventa.</tspan></text><text x="470" y="236.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017).</tspan></text></svg>
