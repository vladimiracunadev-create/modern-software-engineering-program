<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 491" width="940" height="491" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cada eslabón de la cadena y el control que lo corta</title><desc id="d">Ocho pares de causa y control: entrada errónea, herramienta rápida, sin mínimo, reinicio sin ensayar, crecimiento no medido en la recuperación, índice grande, panel dependiente y comunicación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="491" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cada eslabón de la cadena y el control que lo corta</tspan></text><rect x="10" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="117.5" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">Entrada mal escrita</tspan></text><rect x="10" y="126.28" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.5" y="145.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">Validar la entrada frente</tspan></text><text x="117.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">al efecto previsto y pedir</tspan></text><text x="117.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">confirmación si es grande</tspan></text><polyline points="117.5,98.28 117.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="245" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">Herramienta que retira</tspan></text><text x="352.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">capacidad demasiado rápido</tspan></text><rect x="245" y="126.28" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352.5" y="153.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">Retirada más lenta y por</tspan></text><text x="352.5" y="170.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">tramos</tspan></text><polyline points="352.5,98.28 352.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="480" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">Sin capacidad mínima por</tspan></text><text x="587.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">subsistema</tspan></text><rect x="480" y="126.28" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587.5" y="145.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">Rechazar cualquier</tspan></text><text x="587.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">retirada que deje un</tspan></text><text x="587.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">subsistema bajo su mínimo</tspan></text><polyline points="587.5,98.28 587.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="715" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">Reinicio completo sin</tspan></text><text x="822.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">ensayar</tspan></text><rect x="715" y="126.28" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822.5" y="145.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">Ensayo periódico de</tspan></text><text x="822.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">reinicio completo a escala</tspan></text><text x="822.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">real</tspan></text><polyline points="822.5,98.28 822.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="206.2" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="117.5" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">Recuperación que crece con</tspan></text><text x="117.5" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">la región</tspan></text><rect x="10" y="281.48" width="215" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.5" y="300.44" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">Medir el tiempo de</tspan></text><text x="117.5" y="317.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">recuperación como</tspan></text><text x="117.5" y="333.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">indicador y mantenerlo</tspan></text><text x="117.5" y="350.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">bajo un tope</tspan></text><polyline points="117.5,253.48 117.5,281.48" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="245" y="206.2" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352.5" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">Índice grande sin más</tspan></text><text x="352.5" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">particiones</tspan></text><rect x="245" y="281.48" width="215" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352.5" y="308.76" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">Dividir en celdas más</tspan></text><text x="352.5" y="325.4" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">pequeñas para reducir el</tspan></text><text x="352.5" y="342.04" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">radio de impacto</tspan></text><polyline points="352.5,253.48 352.5,281.48" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="480" y="206.2" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.5" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">Panel de estado</tspan></text><text x="587.5" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">dependiente de S3</tspan></text><rect x="480" y="281.48" width="215" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587.5" y="308.76" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">Panel que funcione en</tspan></text><text x="587.5" y="325.4" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">varias regiones y fuera</tspan></text><text x="587.5" y="342.04" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">del servicio que informa</tspan></text><polyline points="587.5,253.48 587.5,281.48" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="715" y="206.2" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822.5" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">Otras herramientas con</tspan></text><text x="822.5" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">riesgo similar</tspan></text><rect x="715" y="281.48" width="215" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822.5" y="308.76" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">Auditar las demás</tspan></text><text x="822.5" y="325.4" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">herramientas con las</tspan></text><text x="822.5" y="342.04" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">mismas salvaguardas</tspan></text><polyline points="822.5,253.48 822.5,281.48" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="384.04" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="409" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: cinco de estas mejoras coinciden con lo que AWS anunció: retirada más lenta, capacidad mínima, auditoría de</tspan></text><text x="470" y="425.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">otras herramientas, más particiones del índice y panel en varias regiones. La columna inferior es análisis propio.</tspan></text><text x="470" y="473.32" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017). Análisis propio, no conclusión de AWS.</tspan></text></svg>
