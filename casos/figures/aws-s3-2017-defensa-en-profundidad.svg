<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 506" width="940" height="506" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defensa en profundidad: ocho barreras y por qué una entrada errónea afectó a toda la región</title><desc id="d">Láminas con huecos alineados: procedimiento establecido, validación de la entrada, límite de capacidad mínima, retirada gradual, particiones en celdas, reinicio ensayado, aviso y comunicación; una flecha las atraviesa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="506" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Defensa en profundidad: ocho barreras y por qué una entrada errónea afectó a toda la región</tspan></text><rect x="30" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="42" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="5.57143" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="61" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">Procedimiento</tspan></text><text x="61" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">establecido</tspan></text><text x="61" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">(se siguió)</tspan></text><rect x="146.857" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="158.857" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="122.429" y="231" width="110.857" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="177.857" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="177.857" dy="0">Validación</tspan></text><text x="177.857" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="177.857" dy="0">de la</tspan></text><text x="177.857" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="177.857" dy="0">entrada</tspan></text><text x="177.857" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="177.857" dy="0">(aceptó la</tspan></text><text x="177.857" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="177.857" dy="0">retirada)</tspan></text><rect x="263.714" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="275.714" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="239.286" y="231" width="110.857" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="294.714" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">Capacidad</tspan></text><text x="294.714" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">mínima por</tspan></text><text x="294.714" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">subsistema</tspan></text><text x="294.714" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">(no se</tspan></text><text x="294.714" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">comprobaba)</tspan></text><rect x="380.571" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="392.571" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="356.143" y="231" width="110.857" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="411.571" y="268.04" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.571" dy="0">Retirada</tspan></text><text x="411.571" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.571" dy="0">gradual (la</tspan></text><text x="411.571" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.571" dy="0">herramienta</tspan></text><text x="411.571" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.571" dy="0">era</tspan></text><text x="411.571" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.571" dy="0">demasiado</tspan></text><text x="411.571" y="351.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.571" dy="0">rápida)</tspan></text><rect x="497.429" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="509.429" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="473" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="528.429" y="259.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="528.429" dy="0">Celdas para</tspan></text><text x="528.429" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="528.429" dy="0">reducir el</tspan></text><text x="528.429" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="528.429" dy="0">radio (el</tspan></text><text x="528.429" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="528.429" dy="0">índice aún</tspan></text><text x="528.429" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="528.429" dy="0">sin</tspan></text><text x="528.429" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="528.429" dy="0">particionar</tspan></text><text x="528.429" y="359.56" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="528.429" dy="0">más)</tspan></text><rect x="614.286" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="626.286" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="589.857" y="231" width="110.857" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="645.286" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="645.286" dy="0">Reinicio</tspan></text><text x="645.286" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="645.286" dy="0">ensayado a</tspan></text><text x="645.286" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="645.286" dy="0">escala (no</tspan></text><text x="645.286" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="645.286" dy="0">desde hacía</tspan></text><text x="645.286" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="645.286" dy="0">años)</tspan></text><rect x="731.143" y="51" width="62" height="170" rx="14" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><rect x="743.143" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="706.714" y="231" width="110.857" height="150" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="762.143" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="762.143" dy="0">Respuesta</tspan></text><text x="762.143" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="762.143" dy="0">del equipo</tspan></text><text x="762.143" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="762.143" dy="0">(recuperó el</tspan></text><text x="762.143" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="762.143" dy="0">servicio)</tspan></text><rect x="848" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="860" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="823.571" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="879" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">Comunicación</tspan></text><text x="879" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">(el panel</tspan></text><text x="879" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">dependía de</tspan></text><text x="879" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">S3)</tspan></text><polyline points="10,136 930,136" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="399" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: una operación rutinaria, con procedimiento, pasó todas las comprobaciones porque ninguna limitaba cuánta</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">capacidad se retiraba. Rojo: ausente; dorado: parcial; verde: funcionó. Es una metáfora.</tspan></text><text x="470" y="488.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017). Análisis propio, no conclusión de AWS.</tspan></text></svg>
