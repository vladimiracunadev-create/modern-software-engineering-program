<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 352" width="940" height="352" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que vio la tripulación: muchas indicaciones a la vez y ninguna que nombrara a MCAS</title><desc id="d">Cadena de indicaciones en el vuelo JT610 y el anterior: sensor con sesgo de 21 grados, desacuerdo de velocidad y de altitud, luz de presión diferencial, agitador de palanca continuo y activaciones repetidas de MCAS; el aviso de desacuerdo de ángulo de ataque no estaba habilitado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="352" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lo que vio la tripulación: muchas indicaciones a la vez y ninguna que nombrara a MCAS</tspan></text><rect x="10" y="51" width="280" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="150" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">Sensor izquierdo con sesgo de 21°</tspan></text><text x="150" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">no detectado en la prueba de</tspan></text><text x="150" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">instalación</tspan></text><rect x="330" y="51" width="280" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">IAS DISAGREE y ALT DISAGREE en las</tspan></text><text x="470" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pantallas</tspan></text><rect x="650" y="51" width="280" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="790" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">Luz FEEL DIFF PRESS y agitador de</tspan></text><text x="790" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">palanca activo todo el vuelo</tspan></text><polyline points="290,82.96 330,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,82.96 650,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,114.92 790,129.92 150,129.92 150,148.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="148.92" width="280" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="150" y="192.84" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">Activaciones repetidas de MCAS</tspan></text><rect x="330" y="148.92" width="280" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="184.52" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">AOA DISAGREE: no estaba habilitado,</tspan></text><text x="470" y="201.16" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">no apareció</tspan></text><rect x="650" y="148.92" width="280" height="80.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="790" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="790" dy="0">Una tripulación cortó el</tspan></text><text x="790" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="790" dy="0">compensador y aterrizó; la</tspan></text><text x="790" y="201.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="790" dy="0">siguiente no identificó el</tspan></text><text x="790" y="217.8" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="790" dy="0">desbocamiento</tspan></text><polyline points="290,189.2 330,189.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,189.2 650,189.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="245.48" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="270.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el aviso que habría nombrado el problema, AOA DISAGREE, no se mostró, y el único que lo habría resuelto sin</tspan></text><text x="470" y="287.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">nombrarlo, cortar el compensador, no figuraba en los manuales de MCAS. Mira la quinta caja: es una ausencia, no una acción.</tspan></text><text x="470" y="334.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: KNKT, informe final JT610 (25 oct 2019). Sinopsis y apartados 3.2.</tspan></text></svg>
