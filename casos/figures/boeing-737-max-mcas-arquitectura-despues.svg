<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 319" width="940" height="319" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La arquitectura «después»: qué cambia en la ley de control y en su entorno</title><desc id="d">Cadena objetivo: dos sensores comparados, límite de autoridad y de repeticiones, aviso visible de desacuerdo, función documentada y entrenada, cierre del análisis de seguridad con pruebas de piloto y registro de mantenimiento guiado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="319" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La arquitectura «después»: qué cambia en la ley de control y en su entorno</tspan></text><rect x="10" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">Entrada de MCAS validada con dos</tspan></text><text x="150" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">sensores y rechazo de desacuerdos</tspan></text><rect x="330" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Autoridad limitada y no repetible</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">indefinidamente</tspan></text><rect x="650" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">Aviso de desacuerdo y de función</tspan></text><text x="790" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">activa siempre visibles</tspan></text><polyline points="290,74.64 330,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,74.64 650,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,98.28 790,113.28 150,113.28 150,132.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132.28" width="280" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150" y="159.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">Función en manuales y formación con</tspan></text><text x="150" y="176.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">simulación de fallo</tspan></text><rect x="330" y="132.28" width="280" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Análisis de seguridad actualizado</tspan></text><text x="470" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">con cada cambio y con pilotos en</tspan></text><text x="470" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">simulador</tspan></text><rect x="650" y="132.28" width="280" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="159.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">Mantenimiento con prueba de</tspan></text><text x="790" y="176.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">aceptación del sensor</tspan></text><polyline points="290,164.24 330,164.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,164.24 650,164.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="212.2" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="237.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: son controles de diseño, de información y de proceso; ninguno exige una tecnología nueva. Diseño didáctico</tspan></text><text x="470" y="253.8" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">apoyado en las recomendaciones del NTSB, el JATR y los informes de accidente; no describe el rediseño que aprobó la FAA.</tspan></text><text x="470" y="301.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio, no conclusión de las investigaciones.</tspan></text></svg>
