<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 323" width="940" height="323" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La autoridad de MCAS sobre el estabilizador pasó de 0,6 a 2,5 grados</title><desc id="d">Barras con la autoridad máxima de movimiento del estabilizador por activación: 0,6 grados en el diseño original y 2,5 grados tras el rediseño de marzo de 2016.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="323" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La autoridad de MCAS sobre el estabilizador pasó de 0,6 a 2,5 grados</tspan></text><line x1="274" y1="49" x2="274" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="125" x2="274" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="376.97" y1="49" x2="376.97" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="376.97" y1="125" x2="376.97" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="376.97" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="376.97" dy="0">0,5</tspan></text><line x1="479.94" y1="49" x2="479.94" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="479.94" y1="125" x2="479.94" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="479.94" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479.94" dy="0">1</tspan></text><line x1="582.91" y1="49" x2="582.91" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="582.91" y1="125" x2="582.91" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="582.91" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582.91" dy="0">1,5</tspan></text><line x1="685.88" y1="49" x2="685.88" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="685.88" y1="125" x2="685.88" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="685.88" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685.88" dy="0">2</tspan></text><line x1="788.85" y1="49" x2="788.85" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="788.85" y1="125" x2="788.85" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="788.85" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="788.85" dy="0">2,5</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="125" x2="891.82" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">3</tspan></text><line x1="274" y1="125" x2="891.82" y2="125" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Diseño original</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Tras el rediseño de marzo de 2016</tspan></text><rect x="274" y="55" width="123.564" height="26" rx="3" fill="#c0432f"/><text x="404.564" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="404.564" dy="0">0,6</tspan></text><rect x="274" y="93" width="514.85" height="26" rx="3" fill="#c0432f"/><text x="795.85" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="795.85" dy="0">2,5</tspan></text><text x="582.91" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="582.91" dy="0">Grados de movimiento del estabilizador por activación</tspan></text><rect x="10" y="183" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="207.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El informe del Comité atribuye el cambio a que, en marzo de 2016, pilotos de prueba hallaron mal manejo cerca de pérdidas a</tspan></text><text x="470" y="224.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">baja velocidad, y dice que el rediseño permitía actuar a menos velocidad. Las dos cifras vienen de un documento de Boeing</tspan></text><text x="470" y="241.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 2015 y de la descripción del rediseño que cita el informe; el KNKT y la EAIB describen el sistema tal como estaba en los</tspan></text><text x="470" y="257.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">accidentes.</tspan></text><text x="470" y="305.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Transporte de la Cámara (sep 2020).</tspan></text></svg>
