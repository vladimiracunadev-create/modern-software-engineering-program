<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defensa en profundidad: ocho barreras y los huecos que se alinearon</title><desc id="d">Láminas con huecos alineados: análisis de seguridad con supuestos de piloto, redundancia de sensores, aviso de desacuerdo, documentación y formación, prueba de instalación del sensor, informe de mantenimiento, procedimiento de emergencia y supervisión de la certificación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Defensa en profundidad: ocho barreras y los huecos que se alinearon</tspan></text><rect x="30" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="42" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="5.57143" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="61" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">Análisis de</tspan></text><text x="61" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">peligro con</tspan></text><text x="61" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">supuestos de</tspan></text><text x="61" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">piloto</tspan></text><rect x="146.857" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="158.857" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="122.429" y="231" width="110.857" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="177.857" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="177.857" dy="0">Redundancia</tspan></text><text x="177.857" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="177.857" dy="0">de sensor</tspan></text><text x="177.857" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="177.857" dy="0">para MCAS</tspan></text><text x="177.857" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="177.857" dy="0">(un solo</tspan></text><text x="177.857" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="177.857" dy="0">sensor)</tspan></text><rect x="263.714" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="275.714" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="239.286" y="231" width="110.857" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="294.714" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">Aviso de</tspan></text><text x="294.714" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">desacuerdo</tspan></text><text x="294.714" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">de AOA (no</tspan></text><text x="294.714" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">habilitado)</tspan></text><rect x="380.571" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="392.571" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="356.143" y="231" width="110.857" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="411.571" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.571" dy="0">Manuales y</tspan></text><text x="411.571" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.571" dy="0">formación</tspan></text><text x="411.571" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.571" dy="0">(sin MCAS)</tspan></text><rect x="497.429" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="509.429" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="473" y="231" width="110.857" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="528.429" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="528.429" dy="0">Prueba de</tspan></text><text x="528.429" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="528.429" dy="0">instalación</tspan></text><text x="528.429" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="528.429" dy="0">del sensor</tspan></text><text x="528.429" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="528.429" dy="0">(no detectó</tspan></text><text x="528.429" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="528.429" dy="0">21°)</tspan></text><rect x="614.286" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="626.286" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="589.857" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="645.286" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="645.286" dy="0">Informe de</tspan></text><text x="645.286" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="645.286" dy="0">vuelo y</tspan></text><text x="645.286" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="645.286" dy="0">mantenimiento</tspan></text><text x="645.286" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="645.286" dy="0">(incompleto)</tspan></text><rect x="731.143" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="743.143" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="706.714" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="762.143" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="762.143" dy="0">Procedimiento</tspan></text><text x="762.143" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="762.143" dy="0">de</tspan></text><text x="762.143" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="762.143" dy="0">desbocamiento</tspan></text><text x="762.143" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="762.143" dy="0">(se aplicó</tspan></text><text x="762.143" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="762.143" dy="0">en un vuelo)</tspan></text><rect x="848" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="860" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="823.571" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="879" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">Revisión de</tspan></text><text x="879" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">la</tspan></text><text x="879" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">certificación</tspan></text><text x="879" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">(cambios no</tspan></text><text x="879" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">actualizados)</tspan></text><polyline points="10,136 930,136" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="399" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: no faltó una barrera, fallaron varias a la vez por la misma razón: se daba por hecho que el piloto</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">resolvería. Rojo: ausente o fallida; dorado: existía y fue parcial. Es una metáfora, no una medición.</tspan></text><text x="470" y="488.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: KNKT, informe final JT610 (25 oct 2019). Fuente: JATR, informe a la FAA (oct 2019). Análisis propio, no conclusión de las</tspan></text><text x="470" y="504" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">investigaciones.</tspan></text></svg>
