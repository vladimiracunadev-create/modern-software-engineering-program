<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 417" width="940" height="417" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos formas de pensar el fallo: un fallo aislado frente a un fallo con muchas señales</title><desc id="d">Dos columnas: el modelo con el que se evaluó el peligro, un fallo de un sistema que el piloto reconoce y corrige con el procedimiento de desbocamiento, y la situación de los accidentes, con una cascada de indicaciones, activaciones repetidas y poco tiempo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="417" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos formas de pensar el fallo: un fallo aislado frente a un fallo con muchas señales</tspan></text><rect x="10" y="51" width="451" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="235.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="235.5" dy="0">Modelo de la evaluación de peligro</tspan></text><rect x="10" y="101" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Un fallo, una causa clara</tspan></text><rect x="10" y="149" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">El piloto lo reconoce por el movimiento de la rueda del</tspan></text><text x="235.5" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">compensador o la fuerza de la columna</tspan></text><rect x="10" y="204.28" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="227.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Se aplica el procedimiento de desbocamiento de memoria</tspan></text><rect x="10" y="252.28" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="275.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Clasificado como «mayor»</tspan></text><rect x="479" y="51" width="451" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="704.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="704.5" dy="0">Lo que mostraron los accidentes</tspan></text><rect x="479" y="101" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Un dato erróneo que dispara varias indicaciones a la vez</tspan></text><rect x="479" y="149" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="172.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">MCAS no figuraba en los manuales ni en la formación</tspan></text><rect x="479" y="197" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="220.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Activaciones repetidas tras cada compensación</tspan></text><rect x="479" y="245" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="268.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Poca altura y carga de trabajo alta</tspan></text><rect x="10" y="310.28" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="335.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el análisis de peligros sirve en la medida en que sus supuestos se verifican con el sistema completo y con</tspan></text><text x="470" y="351.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">personas. La clasificación «mayor» y los supuestos vienen del informe del NTSB.</tspan></text><text x="470" y="399.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: NTSB, informe de recomendaciones (sep 2019). Fuente: KNKT, informe final JT610 (25 oct 2019).</tspan></text></svg>
