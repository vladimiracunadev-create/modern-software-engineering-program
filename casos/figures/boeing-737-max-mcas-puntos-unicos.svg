<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 372" width="940" height="372" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias de un único elemento en la cadena de MCAS</title><desc id="d">Mapa de dependencias: un solo sensor por vuelo alimentaba MCAS; la alternancia de ordenador principal por vuelo, la ausencia de aviso de desacuerdo, la detención como único modo de cortar el sistema y la dependencia de la respuesta del piloto; cada una sin alternativa independiente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="372" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dependencias de un único elemento en la cadena de MCAS</tspan></text><rect x="10" y="51" width="200" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">Un solo sensor de ángulo</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">de ataque por vuelo</tspan></text><rect x="10" y="112.28" width="200" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">Aviso de desacuerdo de</tspan></text><text x="110" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">ángulo de ataque no</tspan></text><text x="110" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">habilitado</tspan></text><rect x="10" y="190.2" width="200" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="110" y="209.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">Formación y manuales sin</tspan></text><text x="110" y="225.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">MCAS</tspan></text><rect x="730" y="51" width="200" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">Corte del compensador:</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">único modo de detenerlo</tspan></text><rect x="730" y="112.28" width="200" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="830" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">Respuesta del piloto</tspan></text><text x="830" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">bajo múltiples alertas</tspan></text><rect x="280" y="51" width="370" height="200.48" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="294" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="294" dy="0">Ruta de MCAS</tspan></text><rect x="300" y="91" width="330" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Ley de control en el ordenador principal</tspan></text><rect x="300" y="141" width="330" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="465" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">Compensador del estabilizador</tspan></text><polyline points="210,74.64 280,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">lee</tspan></text><polyline points="210,144.24 280,144.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="136.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">debía avisar</tspan></text><polyline points="210,213.84 280,213.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="205.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">debía explicar</tspan></text><polyline points="650,74.64 730,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">corta</tspan></text><polyline points="650,135.92 730,135.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="127.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">decide</tspan></text><rect x="10" y="265.48" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="290.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el sistema estaba protegido por la esperanza de que el piloto reconociera y cortara; cada defensa se apoyaba</tspan></text><text x="470" y="307.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en las otras. Mira que lo rojo es una decisión de diseño y lo dorado, un supuesto de uso.</tspan></text><text x="470" y="354.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: KNKT, informe final JT610 (25 oct 2019). Análisis propio, no conclusión de las investigaciones.</tspan></text></svg>
