<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 463" width="940" height="463" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</title><desc id="d">Cuatro columnas: mecanismos que existían y funcionaron (revisión, integración continua, avisos sintéticos, terminación global), que existían y fallaron (protección de CPU, avisos de tráfico, página de estado), que no existían (garantías del motor, pruebas de CPU, despliegue escalonado para reglas) y que debieron existir (análisis propio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="463" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</tspan></text><rect x="10" y="51" width="216.5" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="118.25" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="118.25" dy="0">Existía y funcionó</tspan></text><rect x="10" y="101" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Revisión y aprobación del</tspan></text><text x="118.25" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">cambio</tspan></text><rect x="10" y="156.28" width="216.5" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="179.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">CI con pruebas funcionales</tspan></text><rect x="10" y="204.28" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="223.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Avisos sintéticos del WAF</tspan></text><text x="118.25" y="239.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">a los tres minutos</tspan></text><rect x="10" y="259.56" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="278.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Terminación global de un</tspan></text><text x="118.25" y="295.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">componente</tspan></text><rect x="244.5" y="51" width="216.5" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352.75" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="352.75" dy="0">Existía y falló</tspan></text><rect x="244.5" y="101" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Protección contra consumo</tspan></text><text x="352.75" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">excesivo de CPU</tspan></text><text x="352.75" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">(eliminada)</tspan></text><rect x="244.5" y="172.92" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Alerta de caída global de</tspan></text><text x="352.75" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">tráfico</tspan></text><rect x="244.5" y="228.2" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Actualización de la página</tspan></text><text x="352.75" y="263.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">de estado</tspan></text><rect x="244.5" y="283.48" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="302.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Acceso a herramientas</tspan></text><text x="352.75" y="319.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">internas</tspan></text><rect x="479" y="51" width="216.5" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.25" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="587.25" dy="0">No existía</tspan></text><rect x="479" y="101" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Garantías de complejidad</tspan></text><text x="587.25" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">del motor</tspan></text><rect x="479" y="156.28" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Pruebas de consumo de CPU</tspan></text><text x="587.25" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">de cada regla</tspan></text><rect x="479" y="211.56" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Despliegue escalonado para</tspan></text><text x="587.25" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">reglas no urgentes</tspan></text><rect x="479" y="266.84" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="285.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Capacidad de sacar el</tspan></text><text x="587.25" y="302.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">panel y la API del borde</tspan></text><rect x="713.5" y="51" width="216.5" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="821.75" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="821.75" dy="0">Debió existir (análisis</tspan></text><text x="821.75" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="821.75" dy="0">propio)</tspan></text><rect x="713.5" y="108.28" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="127.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Presupuesto de CPU por</tspan></text><text x="821.75" y="143.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">regla con prueba</tspan></text><text x="821.75" y="160.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">automática</tspan></text><rect x="713.5" y="180.2" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="199.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Motor con tiempo lineal</tspan></text><text x="821.75" y="215.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">garantizado</tspan></text><rect x="713.5" y="235.48" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="254.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Despliegue escalonado con</tspan></text><text x="821.75" y="271.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">modo sombra</tspan></text><rect x="713.5" y="290.76" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="309.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Reversión instantánea de</tspan></text><text x="821.75" y="326.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">un solo paso</tspan></text><rect x="10" y="356.04" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="381" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: lo que funcionó fue la respuesta; lo que faltó eran barreras de comportamiento del software. La cuarta</tspan></text><text x="470" y="397.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">columna es análisis propio y coincide en gran parte con las acciones que Cloudflare anunció.</tspan></text><text x="470" y="445.32" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019. Análisis propio, no conclusión de Cloudflare.</tspan></text></svg>
