<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 577" width="940" height="577" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: qué tuvo que coincidir para dejar sin servicio a la red</title><desc id="d">Árbol de fallas con el agotamiento de CPU global arriba y dos ramas necesarias: que una regla costosa llegara a producción, con cuatro condiciones, y que llegara a todas partes y tardara en revertirse, con cuatro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="577" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: qué tuvo que coincidir para dejar sin servicio a la red</tspan></text><rect x="270" y="51" width="400" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Agotamiento de CPU en todos los servidores HTTP del</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">mundo</tspan></text><circle cx="470" cy="122.28" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="127.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><polyline points="470,98.28 470,110.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="162.28" width="445" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="232.5" y="185.92" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="232.5" dy="0">A. Una regla de coste explosivo llega a producción</tspan></text><line x1="470" y1="134.28" x2="232.5" y2="162.28" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="232.5" cy="224.28" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232.5" y="229.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232.5" dy="0">Y</tspan></text><line x1="232.5" y1="202.28" x2="232.5" y2="214.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="246.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="269.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Expresión regular con retroceso catastrófico</tspan></text><line x1="232.5" y1="238.28" x2="232.5" y2="246.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="294.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="317.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Protección contra exceso de CPU eliminada</tspan></text><line x1="232.5" y1="286.28" x2="232.5" y2="294.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="342.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="365.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Motor sin garantías de complejidad</tspan></text><line x1="232.5" y1="334.28" x2="232.5" y2="342.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="390.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="413.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Pruebas que no miden el consumo de CPU</tspan></text><line x1="232.5" y1="382.28" x2="232.5" y2="390.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="485" y="162.28" width="445" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="707.5" y="185.92" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="707.5" dy="0">B. Llega a todo el mundo y tarda en revertirse</tspan></text><line x1="470" y1="134.28" x2="707.5" y2="162.28" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="707.5" cy="224.28" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707.5" y="229.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707.5" dy="0">Y</tspan></text><line x1="707.5" y1="202.28" x2="707.5" y2="214.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="246.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="269.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Procedimiento que permite el despliegue global</tspan></text><line x1="707.5" y1="238.28" x2="707.5" y2="246.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="294.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="317.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Distribución global en segundos por Quicksilver</tspan></text><line x1="707.5" y1="286.28" x2="707.5" y2="294.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="342.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="365.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Reversión lenta: dos compilaciones completas</tspan></text><line x1="707.5" y1="334.28" x2="707.5" y2="342.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="390.28" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="409.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Herramientas de acceso dependientes del servicio</tspan></text><text x="707.5" y="425.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">caído</tspan></text><line x1="707.5" y1="382.28" x2="707.5" y2="390.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="453.56" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="478.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: cortar cualquiera de las ocho condiciones habría evitado o limitado el incidente. Mira que A es sobre el</tspan></text><text x="470" y="495.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">defecto y B sobre el radio de impacto y la recuperación. Estructura propia sobre las condiciones que enumera el post</tspan></text><text x="470" y="511.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mortem.</tspan></text><text x="470" y="559.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019. Análisis propio, no conclusión de Cloudflare.</tspan></text></svg>
