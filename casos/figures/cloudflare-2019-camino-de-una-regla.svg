<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El camino de una regla del WAF, del código a todos los servidores del mundo</title><desc id="d">Cadena del despliegue de una regla del WAF: un ingeniero la escribe; la solicitud de cambio se aprueba y se fusiona; el sistema de integración compila y ejecuta las pruebas; el despliegue automático la envía a Quicksilver; en segundos llega a las máquinas de más de 180 ciudades.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El camino de una regla del WAF, del código a todos los servidores del mundo</tspan></text><rect x="10" y="51" width="280" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">Un ingeniero escribe o cambia la</tspan></text><text x="150" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">regla</tspan></text><rect x="330" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Pull request aprobada y fusionada</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">(13:31)</tspan></text><rect x="650" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">TeamCity compila y las pruebas</tspan></text><text x="790" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">pasan (13:37)</tspan></text><polyline points="290,74.64 330,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,74.64 650,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,98.28 790,113.28 150,113.28 150,132.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132.28" width="280" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="150" y="159.56" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="150" dy="0">Despliegue automático (13:42)</tspan></text><rect x="330" y="132.28" width="280" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Quicksilver la distribuye en</tspan></text><text x="470" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">segundos a todo el mundo</tspan></text><rect x="650" y="132.28" width="280" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="790" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">Cada servidor ejecuta la regla</tspan></text><text x="790" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">sobre el tráfico real</tspan></text><polyline points="290,155.92 330,155.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,155.92 650,155.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="195.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: todos los pasos funcionaron como se diseñaron; el defecto se coló porque ningún paso medía el consumo de CPU</tspan></text><text x="470" y="237.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de la regla. Mira que el despliegue es automático y global por diseño.</tspan></text><text x="470" y="284.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019.</tspan></text></svg>
