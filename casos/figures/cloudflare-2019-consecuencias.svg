<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 238" width="940" height="238" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Consecuencias fechadas: de los 27 minutos a las acciones del post mortem</title><desc id="d">Cadena de consecuencias: 27 minutos de errores 502 en todos los dominios con Cloudflare; WAF reactivado a las 14:52; parada de los despliegues del WAF; reintroducción de la protección; inspección de las 3 868 reglas; cambio de motor previsto para el 31 de julio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="238" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Consecuencias fechadas: de los 27 minutos a las acciones del post mortem</tspan></text><rect x="10" y="51" width="200" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">2 jul 2019: 27 minutos</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">de errores 502 en todo</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">el mundo</tspan></text><rect x="250" y="51" width="200" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="350" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="350" dy="0">14:52: WAF reactivado</tspan></text><text x="350" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="350" dy="0">tras pruebas</tspan></text><rect x="490" y="51" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">Parada de despliegues</tspan></text><text x="590" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">del WAF e inspección de</tspan></text><text x="590" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">3 868 reglas</tspan></text><rect x="730" y="51" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">Cambio de motor previsto</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">el 31 de julio;</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">procedimiento escalonado</tspan></text><polyline points="210,82.96 250,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,82.96 490,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,82.96 730,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="130.92" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="155.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el impacto fue corto y total. Cloudflare dice que era su primer incidente global en seis años. Las fuentes</tspan></text><text x="470" y="172.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">verificadas no cuantifican clientes ni pérdidas; este caso no lo inventa.</tspan></text><text x="470" y="220.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019.</tspan></text></svg>
