<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 402" width="940" height="402" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">2 de julio de 2019: una regla del cortafuegos agota la CPU en todo el mundo</title><desc id="d">Línea de tiempo en minutos desde las 13:40 UTC: a las 13:42 se despliega la regla de detección de XSS; a las 13:45 llega la primera alerta de una prueba sintética; la CPU se agota y los visitantes ven errores 502; el servicio tarda 27 minutos en volver.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="402" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">2 de julio de 2019: una regla del cortafuegos agota la CPU en todo el mundo</tspan></text><line x1="128.72" y1="83" x2="128.72" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="128.72" y1="221" x2="128.72" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="128.72" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="128.72" dy="0">0</tspan></text><line x1="334.846" y1="83" x2="334.846" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="334.846" y1="221" x2="334.846" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="334.846" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334.846" dy="0">10</tspan></text><line x1="540.973" y1="83" x2="540.973" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="540.973" y1="221" x2="540.973" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="540.973" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="540.973" dy="0">20</tspan></text><line x1="747.099" y1="83" x2="747.099" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="747.099" y1="221" x2="747.099" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="747.099" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747.099" dy="0">30</tspan></text><line x1="912" y1="83" x2="912" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="221" x2="912" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">38</tspan></text><line x1="128.72" y1="221" x2="912" y2="221" stroke="#5b7280" stroke-width="1.6"/><text x="118.72" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="118.72" dy="0">Regla de WAF</tspan></text><text x="118.72" y="156.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="118.72" dy="0">Servidores</tspan></text><text x="118.72" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="118.72" dy="0">Visitantes</tspan></text><line x1="169.945" y1="75" x2="169.945" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="169.945" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="169.945" dy="0">13:42</tspan></text><line x1="231.783" y1="75" x2="231.783" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="231.783" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231.783" dy="0">13:45</tspan></text><line x1="788.324" y1="75" x2="788.324" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="788.324" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="788.324" dy="0">~14:09</tspan></text><rect x="169.945" y="92" width="20.6126" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="190.558" y="92" width="577.154" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="479.135" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="479.135" dy="0">regla activa en toda la red</tspan></text><line x1="14" y1="129" x2="912" y2="129" stroke="#d5dde1" stroke-width="1"/><rect x="231.783" y="138" width="535.928" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="499.747" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="499.747" dy="0">CPU casi al 100 %</tspan></text><line x1="14" y1="175" x2="912" y2="175" stroke="#d5dde1" stroke-width="1"/><rect x="231.783" y="184" width="556.541" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="510.054" y="202.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="510.054" dy="0">ven errores 502</tspan></text><rect x="788.324" y="184" width="82.4505" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="520.36" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="520.36" dy="0">minutos desde las 13:40 UTC</tspan></text><rect x="10" y="279" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el post de 2019: la regla contenía una expresión regular con retroceso excesivo; el servicio estuvo caído 27</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">minutos; llevaban seis años sin una caída global. Dónde deja de valer: el fin se aproxima a las 14:09 sumando los 27</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">minutos al inicio del impacto; el post da la cronología completa.</tspan></text><text x="470" y="384.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Details of the Cloudflare outage on July 2, 2019», blog.cloudflare.com. Segmentos dibujados por el autor.</tspan></text></svg>
