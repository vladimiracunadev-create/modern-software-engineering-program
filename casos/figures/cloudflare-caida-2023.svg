<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">2 al 4 de noviembre de 2023: un fallo eléctrico en un centro de datos deja sin panel y análisis a los clientes</title><desc id="d">Línea de tiempo en horas desde las 08:50 UTC del 2 de noviembre: a las 08:50 la compañía eléctrica corta una de las acometidas del centro de datos; a las 11:44 empieza el incidente; a las 17:57 se restaura casi todo el plano de control en el centro de recuperación; a las 04:25 del 4 de noviembre termina; el tráfico de la red no se vio afectado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">2 al 4 de noviembre de 2023: un fallo eléctrico en un centro de datos deja sin panel y análisis a los</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">clientes</tspan></text><line x1="233.5" y1="102" x2="233.5" y2="240" stroke="#d5dde1" stroke-width="1"/><line x1="233.5" y1="240" x2="233.5" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="233.5" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="233.5" dy="0">0</tspan></text><line x1="410.5" y1="102" x2="410.5" y2="240" stroke="#d5dde1" stroke-width="1"/><line x1="410.5" y1="240" x2="410.5" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="410.5" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410.5" dy="0">12</tspan></text><line x1="587.5" y1="102" x2="587.5" y2="240" stroke="#d5dde1" stroke-width="1"/><line x1="587.5" y1="240" x2="587.5" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="587.5" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.5" dy="0">24</tspan></text><line x1="764.5" y1="102" x2="764.5" y2="240" stroke="#d5dde1" stroke-width="1"/><line x1="764.5" y1="240" x2="764.5" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="764.5" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="764.5" dy="0">36</tspan></text><line x1="912" y1="102" x2="912" y2="240" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="240" x2="912" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">46</tspan></text><line x1="233.5" y1="240" x2="912" y2="240" stroke="#5b7280" stroke-width="1.6"/><text x="223.5" y="129.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="223.5" dy="0">Centro de datos de Oregón</tspan></text><text x="223.5" y="175.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="223.5" dy="0">Panel, API y análisis</tspan></text><text x="223.5" y="221.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="223.5" dy="0">Tráfico de la red</tspan></text><line x1="233.5" y1="94" x2="233.5" y2="240" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="233.5" y="88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="233.5" dy="0">08:50</tspan></text><line x1="276.275" y1="94" x2="276.275" y2="240" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="279.8" y="88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="279.8" dy="0">11:44</tspan></text><line x1="367.725" y1="94" x2="367.725" y2="240" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="367.725" y="88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="367.725" dy="0">17:57</tspan></text><line x1="876.6" y1="94" x2="876.6" y2="240" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="876.6" y="88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="876.6" dy="0">04:25</tspan></text><rect x="233.5" y="111" width="44.25" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="277.75" y="111" width="604.75" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="580.125" y="129.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="580.125" dy="0">sin energía fiable</tspan></text><line x1="14" y1="148" x2="912" y2="148" stroke="#d5dde1" stroke-width="1"/><rect x="276.275" y="157" width="91.45" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="322" y="175.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322" dy="0">caídos</tspan></text><rect x="367.725" y="157" width="508.875" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="622.163" y="175.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622.163" dy="0">restauración gradual</tspan></text><line x1="14" y1="194" x2="912" y2="194" stroke="#d5dde1" stroke-width="1"/><rect x="233.5" y="203" width="649" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="558" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="558" dy="0">sin afectación</tspan></text><text x="572.75" y="284" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="572.75" dy="0">horas desde las 08:50 UTC del 2 de noviembre</tspan></text><rect x="10" y="298" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el post de 2023: el centro principal arrendado funcionó con generadores sin avisar a Cloudflare, el plano de</tspan></text><text x="470" y="339.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">control de alta disponibilidad no incluía todos los servicios y los registros no estaban en él por diseño. Dónde deja de</tspan></text><text x="470" y="356.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: la lane del centro de datos es un resumen; el post narra además una falla posterior de energía.</tspan></text><text x="470" y="403.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Post mortem on the Cloudflare Control Plane and Analytics Outage», blog.cloudflare.com. Segmentos dibujados por el autor.</tspan></text></svg>
