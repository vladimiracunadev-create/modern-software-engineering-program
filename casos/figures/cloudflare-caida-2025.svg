<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">18 de noviembre de 2025: un archivo de rasgos duplicado detiene el tráfico principal</title><desc id="d">Línea de tiempo en minutos desde las 11:00 UTC: a las 11:05 un cambio de permisos en la base de datos; a las 11:20 empieza el fallo en la red; a las 11:28 llega a los clientes; hasta las 13:05 se investiga un falso ataque; a las 14:30 el tráfico fluye en su mayoría; a las 17:06 todo funciona con normalidad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">18 de noviembre de 2025: un archivo de rasgos duplicado detiene el tráfico principal</tspan></text><line x1="217.38" y1="83" x2="217.38" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="217.38" y1="221" x2="217.38" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="217.38" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="217.38" dy="0">0</tspan></text><line x1="436.734" y1="83" x2="436.734" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="436.734" y1="221" x2="436.734" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="436.734" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="436.734" dy="0">120</tspan></text><line x1="656.087" y1="83" x2="656.087" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="656.087" y1="221" x2="656.087" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="656.087" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="656.087" dy="0">240</tspan></text><line x1="875.441" y1="83" x2="875.441" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="875.441" y1="221" x2="875.441" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="875.441" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.441" dy="0">360</tspan></text><line x1="912" y1="83" x2="912" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="221" x2="912" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">380</tspan></text><line x1="217.38" y1="221" x2="912" y2="221" stroke="#5b7280" stroke-width="1.6"/><text x="207.38" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Cambio de base de datos</tspan></text><text x="207.38" y="156.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Tráfico principal</tspan></text><text x="207.38" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Respuesta</tspan></text><line x1="226.52" y1="75" x2="226.52" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="226.52" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="226.52" dy="0">11:05</tspan></text><line x1="253.939" y1="75" x2="253.939" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="272.82" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="272.82" dy="0">11:20</tspan></text><line x1="445.873" y1="75" x2="445.873" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="445.873" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="445.873" dy="0">13:05</tspan></text><line x1="601.249" y1="75" x2="601.249" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="601.249" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.249" dy="0">14:30</tspan></text><line x1="886.409" y1="75" x2="886.409" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="886.409" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="886.409" dy="0">17:06</tspan></text><rect x="226.52" y="92" width="27.4192" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="129" x2="912" y2="129" stroke="#d5dde1" stroke-width="1"/><rect x="253.939" y="138" width="347.31" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="427.594" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427.594" dy="0">errores 5xx</tspan></text><rect x="601.249" y="138" width="285.16" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="743.829" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="743.829" dy="0">se recupera</tspan></text><line x1="14" y1="175" x2="912" y2="175" stroke="#d5dde1" stroke-width="1"/><rect x="275.874" y="184" width="169.999" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="360.874" y="202.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="360.874" dy="0">falso DDoS</tspan></text><rect x="445.873" y="184" width="155.376" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="523.561" y="202.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="523.561" dy="0">revierten</tspan></text><text x="564.69" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.69" dy="0">minutos desde las 11:00 UTC</tspan></text><rect x="10" y="279" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el post: el cambio hizo que una consulta devolviera entradas duplicadas y el archivo se duplicó; el software</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tenía un límite de tamaño menor y falló; el archivo se regeneraba cada cinco minutos, por lo que el sistema se recuperaba y</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fallaba de forma intermitente, lo que sugirió un ataque. Dónde deja de valer: los segmentos de la respuesta son</tspan></text><text x="470" y="353.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aproximaciones de la cronología del post.</tspan></text><text x="470" y="401.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Cloudflare outage on November 18, 2025», blog.cloudflare.com. Segmentos dibujados por el autor.</tspan></text></svg>
