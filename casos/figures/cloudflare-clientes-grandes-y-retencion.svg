<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clientes grandes y retención neta de dólares</title><desc id="d">Barras con clientes que pagan más de 100 000 dólares al año: 2 756, 3 497 y 4 298 al cierre de 2023, 2024 y 2025; y la retención neta de dólares del cuarto trimestre: 115, 111 y 120 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="520" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Clientes grandes y retención neta de dólares</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Clientes de más de 100 000 USD (cientos)</tspan></text><rect x="365.6" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="385.6" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="385.6" dy="0">Retención neta de dólares (%)</tspan></text><line x1="78.62" y1="345" x2="920" y2="345" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="345" x2="78.62" y2="345" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="349.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="295" x2="920" y2="295" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="295" x2="78.62" y2="295" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="299.5" font-size="13