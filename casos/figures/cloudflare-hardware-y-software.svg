<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" width="940" height="566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware y software que Cloudflare hace público</title><desc id="d">Pila: servidores propios en más de 330 ciudades; centros de datos de Oregón y Ámsterdam; software propio en Rust (Pingora), Go y otros; V8 para Workers; ClickHouse para datos; Quicksilver para configuración.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="566" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware y software que Cloudflare hace público</tspan></text><rect x="10" y="53" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Hardware</tspan></text><rect x="214" y="53" width="430" height="66" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="429" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="429" dy="0">Servidores propios en más de 330 ciudades; centros de</tspan></text><text x="429" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="429" dy="0">datos de Oregón y Ámsterdam</tspan></text><rect x="10" y="133" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="169.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Red</tspan></text><rect x="214" y="133" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="169.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Interconexión con más de 13 000 redes; anycast</tspan></text><rect x="10" y="213" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="249.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Proxy</tspan></text><rect x="214" y="213" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="249.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Pingora (Rust); antes NGINX</tspan></text><rect x="10" y="293" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Cómputo</tspan></text><rect x="214" y="293" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">V8 con aislados para Workers</tspan></text><rect x="10" y="373" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="409.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Datos</tspan></text><rect x="214" y="373" width="430" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429" y="401.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">Quicksilver (configuración), ClickHouse (análisis);</tspan></text><text x="429" y="417.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">Kyoto Tycoon antes</tspan></text><rect x="668" y="53" width="262" height="179" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799" y="137.82" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Documentado en posts de 2019 a</tspan></text><text x="799" y="154.46" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">2025 y el 10-K</tspan></text><rect x="668" y="246" width="262" height="179" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="799" y="330.82" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">No se sabe: número de servidores</tspan></text><text x="799" y="347.46" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">y de máquinas por ciudad</tspan></text><rect x="10" y="459" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="483.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El 10-K de 2025 dice que Cloudflare opera su propia red y que sus centros de datos principales están en la zona de Portland</tspan></text><text x="470" y="500.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y en Ámsterdam. Dónde deja de valer: las máquinas por ciudad no se publican en las fuentes consultadas.</tspan></text><text x="470" y="548.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de Cloudflare (blog.cloudflare.com), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
