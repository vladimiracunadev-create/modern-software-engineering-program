<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 466" width="940" height="466" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ingresos de Cloudflare, 2023 a 2025</title><desc id="d">Barras con 1 296,7 millones de dólares en 2023, 1 669,6 millones en 2024 y 2 167,9 millones en 2025; el crecimiento anual es de 29 por ciento en 2024 y 30 por ciento en 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="466" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ingresos de Cloudflare, 2023 a 2025</tspan></text><line x1="93.7" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="307" x2="93.7" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="259" x2="920" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="259" x2="93.7" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="211" x2="920" y2="211" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="211" x2="93.7" y2="211" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="215.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1000</tspan></text><line x1="93.7" y1="163" x2="920" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="163" x2="93.7" y2="163" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1500</tspan></text><line x1="93.7" y1="115" x2="920" y2="115" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="115" x2="93.7" y2="115" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2000</tspan></text><line x1="93.7" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="67" x2="93.7" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2500</tspan></text><line x1="93.7" y1="67" x2="93.7" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">millones de USD</text><rect x="121.243" y="182.517" width="220.347" height="124.483" rx="3" fill="#087f8c"/><text x="231.417" y="176.517" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231.417" dy="0">1 296,7</tspan></text><text x="231.417" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">2023</tspan></text><rect x="396.677" y="146.718" width="220.347" height="160.282" rx="3" fill="#087f8c"/><text x="506.85" y="140.718" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="506.85" dy="0">1 669,6</tspan></text><text x="506.85" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">2024</tspan></text><rect x="672.11" y="98.8816" width="220.347" height="208.118" rx="3" fill="#087f8c"/><text x="782.283" y="92.8816" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="782.283" dy="0">2 167,9</tspan></text><text x="782.283" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">2025</tspan></text><rect x="10" y="359" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cálculo propio de crecimiento: 1 669,6 sobre 1 296,7 es 28,8 % y 2 167,9 sobre 1 669,6 es 29,8 %. Dónde deja de valer: son</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ingresos de un solo segmento por suscripciones de acceso a la red y a los productos.</tspan></text><text x="470" y="448.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Cloudflare del año terminado el 31 de diciembre de 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
