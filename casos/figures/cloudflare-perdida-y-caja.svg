<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pérdida neta y flujo de caja libre de Cloudflare, 2023 a 2025</title><desc id="d">Barras agrupadas en millones de dólares: pérdida neta de 183,9; 78,8 y 102,3 millones y flujo de caja libre positivo de 119,5; 166,9 y 260,6 millones en 2023, 2024 y 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="520" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pérdida neta y flujo de caja libre de Cloudflare, 2023 a 2025</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pérdida neta</tspan></text><rect x="154.48" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Flujo de caja libre</tspan></text><line x1="78.62" y1="345" x2="920" y2="345" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="345" x2="78.62" y2="345" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="349.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="261.667" x2="920" y2="261.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="261.667" x2="78.62" y2="261.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="266.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="178.333" x2="920" y2="178.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="178.333" x2="78.62" y2="178.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="182.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="345" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">millones de USD</text><rect x="106.666" y="191.75" width="110.184" height="153.25" rx="3" fill="#c0432f"/><text x="161.758" y="185.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">183,9</tspan></text><rect x="220.85" y="245.417" width="110.184" height="99.5833" rx="3" fill="#087f8c"/><text x="275.942" y="239.417" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">119,5</tspan></text><text x="218.85" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">2023</tspan></text><rect x="387.126" y="279.333" width="110.184" height="65.6667" rx="3" fill="#c0432f"/><text x="442.218" y="273.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">78,8</tspan></text><rect x="501.31" y="205.917" width="110.184" height="139.083" rx="3" fill="#087f8c"/><text x="556.402" y="199.917" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">166,9</tspan></text><text x="499.31" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">2024</tspan></text><rect x="667.586" y="259.75" width="110.184" height="85.25" rx="3" fill="#c0432f"/><text x="722.678" y="253.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">102,3</tspan></text><rect x="781.77" y="127.833" width="110.184" height="217.167" rx="3" fill="#087f8c"/><text x="836.862" y="121.833" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">260,6</tspan></text><text x="779.77" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">2025</tspan></text><rect x="10" y="397" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="421.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La pérdida es contable (incluye remuneración en acciones y amortizaciones) y el flujo de caja libre es el que el 10-K</tspan></text><text x="470" y="438.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">define como medida no contable: 12 % del ingreso en 2025 frente a 9 % en 2023. Dónde deja de valer: dos medidas distintas;</tspan></text><text x="470" y="455.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una no sustituye a la otra.</tspan></text><text x="470" y="502.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Cloudflare del año terminado el 31 de diciembre de 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
