<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pingora frente a NGINX: conexiones reutilizables y carga repartida</title><desc id="d">Dos filas: con NGINX cada petición la atiende un solo proceso, la carga entre núcleos queda desbalanceada y el grupo de conexiones al origen es por proceso, de modo que se reutilizan poco; con Pingora, en Rust y con hilos, hay conexiones compartidas, sirve más de un billón de peticiones al día y usa un tercio de CPU y memoria.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="345" fill="#ffffff"/><rect x="10" y="14" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152" dy="0">NGINX: una petición la sirve un solo</tspan></text><text x="152" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152" dy="0">proceso</tspan></text><rect x="338" y="14" width="284" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Carga desbalanceada entre núcleos</tspan></text><polyline points="294,56 338,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="808" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">Grupo de conexiones por proceso:</tspan></text><text x="808" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">poca reutilización</tspan></text><polyline points="622,56 666,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Pingora en Rust, con hilos y</tspan></text><text x="152" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">conexiones compartidas</tspan></text><rect x="338" y="138" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Más de 1 billón de peticiones al día</tspan></text><polyline points="294,180 338,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="138" width="284" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="808" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="808" dy="0">Un tercio de la CPU y la memoria del</tspan></text><text x="808" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="808" dy="0">proxy anterior</tspan></text><polyline points="622,180 666,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,98 808,118 152,118 152,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Documentado en el post de Pingora. La reutilización de conexiones acelera el tiempo hasta el primer byte porque salta los</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">apretones de manos TCP y TLS. Dónde deja de valer: el post dice que NGINX fue excelente durante años y que sus límites</tspan></text><text x="480" y="294.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">aparecieron a esta escala; no es una crítica general.</tspan></text><text x="480" y="335.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Fuente: blog de Cloudflare (blog.cloudflare.com), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
