719.83" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="719.83" y1="239" x2="719.83" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="719.83" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="719.83" dy="0">40</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="239" x2="883.76" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">60</tspan></text><line x1="228.04" y1="239" x2="883.76" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="218.04" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="218.04" dy="0">Coste de ingresos</tspan></text><text x="218.04" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="218.04" dy="0">Ventas y marketing</tspan></text><text x="218.04" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="218.04" dy="0">Investigación y desarrollo</tspan></text><text x="218.04" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="218.04" dy="0">Administración general</tspan></text><text x="218.04" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="218.04" dy="0">Pérdida operativa</tspan></text><rect x="228.04" y="55" width="372.941" height="26" rx="3" fill="#c0432f"/><text x="607.981" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="607.981" dy="0">25,5</tspan></text><rect x="228.04" y="93" width="512.281" height="26" rx="3" fill="#c0432f"/><text x="747.321" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="747.321" dy="0">42,5</tspan></text><rect x="228.04" y="131" width="357.367" height="26" rx="3" fill="#c0432f"/><text x="592.407" y="148.5" font-size="13" text-anchor="start" font-