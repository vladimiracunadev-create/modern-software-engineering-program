<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 544" width="940" height="544" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</title><desc id="d">Cuatro columnas de mecanismos de tolerancia a fallos. Existían y funcionaron: reversión en la nube, apagado seguro de Windows, Mac y Linux sin afectación. Existían y fallaron: validador, pruebas con comodín, excepciones del intérprete, certificación. No existían: canary y anillos, control del cliente, comprobación de límites, recuperación remota. Debieron existir: señales de salud con retroceso, kernel mínimo, versión buena de respaldo, ensayo de recuperación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="544" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</tspan></text><rect x="10" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="120.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120.5" dy="0">Existían y funcionaron</tspan></text><rect x="10" y="111" width="221" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Reversión del archivo a las</tspan></text><text x="120.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">05:27 UTC</tspan></text><rect x="10" y="191" width="221" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Windows detiene el equipo:</tspan></text><text x="120.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">protege la integridad</tspan></text><rect x="10" y="271" width="221" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.5" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Equipos Mac y Linux fuera</tspan></text><text x="120.5" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">del alcance</tspan></text><rect x="243" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="353.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="353.5" dy="0">Existían y fallaron</tspan></text><rect x="243" y="111" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Content Validator con la</tspan></text><text x="353.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">hipótesis de 21 entradas</tspan></text><rect x="243" y="191" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Pruebas de 12 casos con</tspan></text><text x="353.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">comodín</tspan></text><rect x="243" y="271" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Excepciones del intérprete:</tspan></text><text x="353.5" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">no cubrían el kernel</tspan></text><rect x="243" y="351" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Certificación WHQL: no</tspan></text><text x="353.5" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">cubre cada contenido</tspan></text><rect x="476" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="586.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="586.5" dy="0">No existían (documentado)</tspan></text><rect x="476" y="111" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Canary y anillos para el</tspan></text><text x="586.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">contenido rápido</tspan></text><rect x="476" y="191" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Elección del cliente sobre</tspan></text><text x="586.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">el contenido</tspan></text><rect x="476" y="271" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Comprobación de límites en</tspan></text><text x="586.5" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">el intérprete</tspan></text><rect x="476" y="351" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Recuperación remota a</tspan></text><text x="586.5" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">escala</tspan></text><rect x="709" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="819.5" y="72.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="819.5" dy="0">Debieron existir (análisis</tspan></text><text x="819.5" y="88.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="819.5" dy="0">propio)</tspan></text><rect x="709" y="111" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Señales de salud con</tspan></text><text x="819.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">retroceso automático</tspan></text><rect x="709" y="191" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Kernel mínimo y análisis en</tspan></text><text x="819.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">modo usuario</tspan></text><rect x="709" y="271" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Versión buena de respaldo</tspan></text><text x="819.5" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">(propuesta)</tspan></text><rect x="709" y="351" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Ensayo de recuperación con</tspan></text><text x="819.5" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">claves accesibles</tspan></text><rect x="10" y="437" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las tres primeras columnas son del RCA, de la revisión preliminar y de la guía de remediación; la cuarta es opinión de este</tspan></text><text x="470" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">programa y no afirma que bastara ni que su costo fuera bajo.</tspan></text><text x="470" y="526.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: RCA y revisión preliminar de CrowdStrike (2024); análisis propio.</tspan></text></svg>
