<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 688" width="940" height="688" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: la caída masiva exige tres cosas a la vez</title><desc id="d">Árbol de fallas. El evento superior es la caída masiva de equipos Windows, con una compuerta Y de tres ramas: el defecto existe y llega al intérprete, alcanza a gran parte de la flota y el fallo ocurre en el kernel. La primera rama tiene cuatro hojas: cuenta desalineada, lectura sin límites, pruebas y validador que no lo detectaron y controles que comparten una suposición. La segunda tiene dos hojas: publicación a todos a la vez y sin control del cliente. La tercera una hoja.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="688" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: la caída masiva exige tres cosas a la vez</tspan></text><rect x="320" y="49" width="300" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="80.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Caída masiva de equipos Windows</tspan></text><line x1="470" y1="105" x2="470" y2="129" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="470" cy="141" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="146" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><line x1="155" y1="157" x2="155" y2="175" stroke="#8a9aa3" stroke-width="1.4"/><line x1="470" y1="157" x2="470" y2="175" stroke="#8a9aa3" stroke-width="1.4"/><line x1="785" y1="157" x2="785" y2="175" stroke="#8a9aa3" stroke-width="1.4"/><line x1="155" y1="157" x2="785" y2="157" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="175" width="290" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="200.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="155" dy="0">El defecto existe y llega al</tspan></text><text x="155" y="216.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="155" dy="0">intérprete</tspan></text><rect x="325" y="175" width="290" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="208.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">Alcanza a gran parte de la flota</tspan></text><rect x="640" y="175" width="290" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="208.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="785" dy="0">El fallo ocurre en el kernel</tspan></text><line x1="155" y1="235" x2="155" y2="251" stroke="#8a9aa3" stroke-width="1.4"/><line x1="470" y1="235" x2="470" y2="251" stroke="#8a9aa3" stroke-width="1.4"/><line x1="785" y1="235" x2="785" y2="251" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="155" cy="263" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="155" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="155" dy="0">Y</tspan></text><circle cx="470" cy="263" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><line x1="155" y1="275" x2="155" y2="289" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="289" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="155" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">Cuenta 21 frente a 20 sin comprobar</tspan></text><text x="155" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">(documentado)</tspan></text><rect x="10" y="359" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="155" y="391.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">Lectura sin límites (documentado)</tspan></text><rect x="10" y="429" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="155" y="453.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">Pruebas y validador no lo detectaron</tspan></text><text x="155" y="469.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">(documentado)</tspan></text><rect x="10" y="499" width="290" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="155" y="523.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="155" dy="0">Controles con una suposición común</tspan></text><text x="155" y="539.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="155" dy="0">(inferido)</tspan></text><line x1="470" y1="275" x2="470" y2="289" stroke="#8a9aa3" stroke-width="1.4"/><rect x="325" y="289" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Publicación a todos a la vez</tspan></text><text x="470" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(documentado)</tspan></text><rect x="325" y="359" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="383.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin control del cliente sobre el</tspan></text><text x="470" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">contenido (documentado)</tspan></text><line x1="785" y1="275" x2="785" y2="289" stroke="#8a9aa3" stroke-width="1.4"/><rect x="640" y="289" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Lectura inválida en kernel detiene el</tspan></text><text x="785" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">sistema (documentado)</tspan></text><rect x="10" y="581" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="605.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Para evitar el evento superior basta eliminar una de las tres ramas. La segunda (cuántos equipos) fue la que más pudo</tspan></text><text x="470" y="622.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">acotar el daño sin conocer el defecto.</tspan></text><text x="470" y="670.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
