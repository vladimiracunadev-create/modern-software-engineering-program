<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El camino de un archivo de canal: de la nube de CrowdStrike al kernel de Windows</title><desc id="d">Diagrama de dos zonas. En la nube, el sistema de configuración de contenido crea instancias de plantilla, el validador las comprueba y se publica el archivo de canal 291. En el equipo Windows del cliente, el controlador csagent.sys, que corre en modo kernel, contiene el intérprete de contenido que lee ese archivo cuando Windows notifica la creación de una tubería con nombre.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="528" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El camino de un archivo de canal: de la nube de CrowdStrike al kernel de Windows</tspan></text><rect x="10" y="45" width="300" height="250" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Nube de CrowdStrike</tspan></text><rect x="28" y="85" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="100" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Content Configuration System: los</tspan></text><text x="160" y="116.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">ingenieros de detección crean</tspan></text><text x="160" y="133.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Template Instances</tspan></text><rect x="28" y="157" width="264" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="160" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">Content Validator: comprueba cada</tspan></text><text x="160" y="188.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">instancia contra la definición</tspan></text><text x="160" y="205.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">del Template Type</tspan></text><rect x="28" y="229" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="249.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Se publica el archivo de canal</tspan></text><text x="160" y="265.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">291 (C-00000291*.sys)</tspan></text><polyline points="160,141 160,157" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="160,213 160,229" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="360" y="45" width="570" height="250" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="374" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="374" dy="0">Equipo Windows del cliente (sensor 7.11 o superior)</tspan></text><rect x="380" y="85" width="530" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="645" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="645" dy="0">Windows notifica la creación de una tubería con nombre (IPC)</tspan></text><rect x="380" y="141" width="530" height="138" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="394" y="163" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="394" dy="0">Controlador csagent.sys (modo kernel)</tspan></text><rect x="396" y="171" width="240" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="516" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="516" dy="0">Content Interpreter: lee el</tspan></text><text x="516" y="220.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="516" dy="0">archivo de canal y compara con</tspan></text><text x="516" y="237.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="516" dy="0">expresiones regulares</tspan></text><rect x="660" y="171" width="234" height="92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="777" y="212.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="777" dy="0">Template Type IPC: arma 20</tspan></text><text x="777" y="228.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="777" dy="0">entradas para el intérprete</tspan></text><polyline points="645,217 636,217" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="645,125 645,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="292,254 360,254" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="311" width="440" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230" y="343.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">Sensor Content: viaja con el sensor. El cliente decide</tspan></text><text x="230" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">qué versión instala (N, N-1 o N-2).</tspan></text><rect x="470" y="311" width="460" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="335" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Rapid Response Content: es configuración, no código, y llegó</tspan></text><text x="700" y="351.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">a todos los equipos conectados sin que el cliente eligiera</tspan></text><text x="700" y="368.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">dónde ni cuándo.</tspan></text><rect x="10" y="405" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="429.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El riesgo no estaba en el archivo en sí, sino en que un archivo de datos se interpretaba dentro del kernel y salía a toda</tspan></text><text x="470" y="446.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la flota sin una puerta intermedia. Es lectura propia sobre lo que describe el informe: el informe documenta las dos rutas</tspan></text><text x="470" y="463.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de entrega y que el control del cliente sobre el contenido rápido se añadió después.</tspan></text><text x="470" y="510.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
