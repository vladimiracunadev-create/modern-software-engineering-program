<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 558" width="940" height="558" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez capas de control: el defecto atravesó nueve y la décima solo detuvo el equipo</title><desc id="d">Diez columnas en dos filas. Cada una nombra una capa de control y qué ocurrió el 19 de julio. La compilación no comprobaba la cuenta, las pruebas usaron comodín, la prueba de esfuerzo cubrió una instancia, el validador asumió 21, la certificación cubre la versión del sensor, no había prueba de cada instancia, canary ni control del cliente, el intérprete no comprobaba límites y Windows detuvo el sistema.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="558" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diez capas de control: el defecto atravesó nueve y la décima solo detuvo el equipo</tspan></text><rect x="10" y="53" width="176" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="98" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="98" dy="0">1 Compilación</tspan></text><rect x="10" y="115" width="176" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="98" y="152" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="98" dy="0">No comprobaba que la</tspan></text><text x="98" y="168.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="98" dy="0">cuenta de campos</tspan></text><text x="98" y="185.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="98" dy="0">coincidiera</tspan></text><rect x="196" y="53" width="176" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="284" dy="0">2 Pruebas del tipo</tspan></text><rect x="196" y="115" width="176" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="284" y="152" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="284" dy="0">12 casos fijos;</tspan></text><text x="284" y="168.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="284" dy="0">comodín en el campo</tspan></text><text x="284" y="185.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="284" dy="0">21</tspan></text><rect x="382" y="53" width="176" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">3 Prueba de esfuerzo</tspan></text><rect x="382" y="115" width="176" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="160.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una instancia de</tspan></text><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">prueba, 5 de marzo</tspan></text><rect x="568" y="53" width="176" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="656" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="656" dy="0">4 Content Validator</tspan></text><rect x="568" y="115" width="176" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="656" y="160.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="656" dy="0">Evaluó suponiendo 21</tspan></text><text x="656" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="656" dy="0">entradas</tspan></text><rect x="754" y="53" width="176" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">5 Certificación WHQL</tspan></text><rect x="754" y="115" width="176" height="100" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="842" y="143.68" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="842" dy="0">Cubre la versión del</tspan></text><text x="842" y="160.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="842" dy="0">sensor con los</tspan></text><text x="842" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="842" dy="0">archivos vigentes</tspan></text><text x="842" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="842" dy="0">entonces</tspan></text><rect x="10" y="243" width="176" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="98" y="267.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="98" dy="0">6 Prueba de cada</tspan></text><text x="98" y="283.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="98" dy="0">instancia</tspan></text><rect x="10" y="305" width="176" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="98" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="98" dy="0">No se probaba contra</tspan></text><text x="98" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="98" dy="0">el intérprete real</tspan></text><rect x="196" y="243" width="176" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="275.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="284" dy="0">7 Canary y anillos</tspan></text><rect x="196" y="305" width="176" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="284" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="284" dy="0">No existían para el</tspan></text><text x="284" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="284" dy="0">contenido rápido</tspan></text><rect x="382" y="243" width="176" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="275.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">8 Control del cliente</tspan></text><rect x="382" y="305" width="176" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Regía el sensor, no</tspan></text><text x="470" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el contenido rápido</tspan></text><rect x="568" y="243" width="176" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="656" y="267.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="656" dy="0">9 Límites en el</tspan></text><text x="656" y="283.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="656" dy="0">intérprete</tspan></text><rect x="568" y="305" width="176" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="656" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="656" dy="0">No había comprobación</tspan></text><text x="656" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="656" dy="0">de índice</tspan></text><rect x="754" y="243" width="176" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="275.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">10 Windows</tspan></text><rect x="754" y="305" width="176" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="333.68" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="842" dy="0">Detuvo el equipo:</tspan></text><text x="842" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="842" dy="0">protege la</tspan></text><text x="842" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="842" dy="0">integridad, no la</tspan></text><text x="842" y="383.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="842" dy="0">disponibilidad</tspan></text><rect x="10" y="451" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="475.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Coral: el defecto pasó por esa capa. Gris: la capa existía pero no cubría este contenido (lectura propia). Las capas 6, 7,</tspan></text><text x="470" y="492.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">8 y 9 se añadieron o comprometieron después, según el análisis de causa raíz.</tspan></text><text x="470" y="540.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
