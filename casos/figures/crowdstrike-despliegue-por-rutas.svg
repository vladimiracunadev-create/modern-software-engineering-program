<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 598" width="940" height="598" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos rutas de despliegue: seis puertas para el sensor, una sola para el contenido rápido</title><desc id="d">Dos columnas. Ruta del sensor: pruebas automáticas, uso interno, adoptantes tempranos, disponibilidad general y política de versión del cliente. Ruta del contenido rápido en julio de 2024: creación, validación y publicación a todos los sensores conectados. Debajo, tres puertas que se añadieron después: canary, anillos con tiempo de observación y control del cliente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="598" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos rutas de despliegue: seis puertas para el sensor, una sola para el contenido rápido</tspan></text><rect x="10" y="45" width="450" height="420" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Ruta del sensor (Sensor Content)</tspan></text><rect x="30" y="85" width="410" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="107.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="235" dy="0">Pruebas automáticas: unitarias, integración,</tspan></text><text x="235" y="123.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="235" dy="0">rendimiento, esfuerzo</tspan></text><polyline points="235,139 235,159" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30" y="159" width="410" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="189.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="235" dy="0">Uso interno de CrowdStrike (dogfooding)</tspan></text><polyline points="235,213 235,233" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30" y="233" width="410" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="235" dy="0">Adoptantes tempranos</tspan></text><polyline points="235,287 235,307" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30" y="307" width="410" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="337.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="235" dy="0">Disponibilidad general</tspan></text><polyline points="235,361 235,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30" y="381" width="410" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="411.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="235" dy="0">Política del cliente: N, N-1 o N-2</tspan></text><rect x="480" y="45" width="450" height="420" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="494" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="494" dy="0">Ruta del contenido rápido (julio de 2024)</tspan></text><rect x="500" y="85" width="410" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="107.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Creación de la instancia en el sistema de</tspan></text><text x="705" y="123.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">configuración</tspan></text><polyline points="705,139 705,159" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="500" y="159" width="410" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="189.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="705" dy="0">Content Validator</tspan></text><polyline points="705,213 705,233" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="500" y="233" width="410" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">Publicación a todos los sensores en línea</tspan></text><rect x="500" y="307" width="410" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="6 4"/><text x="705" y="330.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="705" dy="0">Añadido después: canary</tspan></text><rect x="500" y="357" width="410" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="6 4"/><text x="705" y="380.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="705" dy="0">Añadido después: anillos con tiempo de observación</tspan></text><rect x="500" y="407" width="410" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="6 4"/><text x="705" y="430.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="705" dy="0">Añadido después: control del cliente</tspan></text><rect x="10" y="491" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="515.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Contar puertas es una lectura cualitativa: el informe no mide tiempos ni esfuerzo de cada etapa. Lo documentado es que en</tspan></text><text x="470" y="532.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">julio de 2024 el contenido rápido no tenía despliegue por etapas ni elección del cliente.</tspan></text><text x="470" y="580.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
