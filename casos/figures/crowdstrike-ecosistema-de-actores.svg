<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres actores y dos rutas: quién entrega, quién aloja el controlador y quién asume el daño</title><desc id="d">Diagrama de contexto con tres columnas. A la izquierda, CrowdStrike: sistema de configuración, contenido del sensor y contenido de respuesta rápida. En el centro, Microsoft: núcleo de Windows y certificación de controladores. A la derecha, la organización cliente: usuarios finales, equipo Windows con el sensor y equipo de seguridad. El contenido del sensor llega con la versión que elige el cliente; el contenido rápido llega a todos los sensores en línea.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres actores y dos rutas: quién entrega, quién aloja el controlador y quién asume el daño</tspan></text><rect x="10" y="45" width="300" height="262" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">CrowdStrike</tspan></text><rect x="25" y="85" width="270" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="108.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Content Configuration System y</tspan></text><text x="160" y="124.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Content Validator</tspan></text><rect x="25" y="161" width="270" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="160" y="184.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">Sensor Content: llega con la</tspan></text><text x="160" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">versión del sensor</tspan></text><rect x="25" y="237" width="270" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="160" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">Rapid Response Content:</tspan></text><text x="160" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">configuración desde la nube</tspan></text><rect x="325" y="45" width="290" height="124" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="339" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="339" dy="0">Microsoft</tspan></text><rect x="337" y="83" width="126" height="72" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="400" y="106" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="400" dy="0">Núcleo de</tspan></text><text x="400" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="400" dy="0">Windows (modo</tspan></text><text x="400" y="139.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="400" dy="0">kernel)</tspan></text><rect x="475" y="83" width="128" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="539" y="106" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="539" dy="0">WHQL y socios</tspan></text><text x="539" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="539" dy="0">del programa</tspan></text><text x="539" y="139.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="539" dy="0">MVI</tspan></text><rect x="630" y="45" width="300" height="262" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="644" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="644" dy="0">Organización cliente</tspan></text><rect x="645" y="85" width="270" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="780" y="108.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">Usuarios finales, pacientes y</tspan></text><text x="780" y="124.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">pasajeros</tspan></text><rect x="645" y="161" width="270" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="780" y="184.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="780" dy="0">Equipo Windows con sensor y</tspan></text><text x="780" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="780" dy="0">controlador</tspan></text><rect x="645" y="237" width="270" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="780" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="780" dy="0">Equipo de seguridad: política N,</tspan></text><text x="780" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="780" dy="0">N-1, N-2</tspan></text><polyline points="295,113 325,113" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="295,189 645,189" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">con la versión que elige el cliente</tspan></text><polyline points="295,265 620,265 620,209 645,209" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="455" y="257" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455" dy="0">a todos los sensores en línea</tspan></text><polyline points="780,237 780,217" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="780,161 780,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="333" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="357.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El contenido del sensor pasaba por la decisión del cliente; el rápido no. Microsoft aparece como el actor que aloja el</tspan></text><text x="470" y="374.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">controlador y certifica versiones del sensor: ahí se detiene el equipo cuando el controlador falla.</tspan></text><text x="470" y="422.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
