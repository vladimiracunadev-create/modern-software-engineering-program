<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 546" width="940" height="546" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema del negocio: quién paga, quién habilita, quién aloja y quién absorbe el daño</title><desc id="d">Esquema con la plataforma Falcon en el centro. Arriba: clientes que pagan suscripciones por equipo, Microsoft que habilita el controlador y lo certifica, AWS y centros propios que alojan la plataforma, e ingenieros de detección y servicios gestionados que producen contenido. Abajo: aseguradoras de las pérdidas de los clientes, tribunales y reguladores, y acreedores e inversores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="546" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema del negocio: quién paga, quién habilita, quién aloja y quién absorbe el daño</tspan></text><rect x="24" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="131" y="66.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">Clientes: suscripción por</tspan></text><text x="131" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">equipo; ingresos</tspan></text><text x="131" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">recurrentes de 4.200</tspan></text><text x="131" y="116.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">millones</tspan></text><rect x="250" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">Microsoft: núcleo,</tspan></text><text x="357" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">certificación y programa</tspan></text><text x="357" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">de socios</tspan></text><rect x="476" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="583" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">AWS y centros propios:</tspan></text><text x="583" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">alojan la plataforma</tspan></text><rect x="702" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="809" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">Ingenieros de detección y</tspan></text><text x="809" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">servicios gestionados</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="230.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Plataforma Falcon por suscripción</tspan></text><polyline points="131,125 334.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">pagan</tspan></text><polyline points="357,125 424.8,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">habilita</tspan></text><polyline points="583,125 515.2,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">alojan</tspan></text><polyline points="809,125 605.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">producen</tspan></text><rect x="137" y="345" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="244" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="244" dy="0">Aseguradoras: cobertura</tspan></text><text x="244" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="244" dy="0">parcial de las pérdidas de</tspan></text><text x="244" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="244" dy="0">clientes</tspan></text><rect x="363" y="345" width="214" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tribunales y reguladores:</tspan></text><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">litigios tras el incidente</tspan></text><rect x="589" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="696" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">Inversores y deuda: 750</tspan></text><text x="696" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">millones al cierre</tspan></text><polyline points="379.6,259 244,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,259 470,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="560.4,259 696,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="439" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cifras del ejercicio fiscal 2025: ingresos de 3.953,6 millones (+29 %), 95 % por suscripciones. Los flujos son una lectura</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de las secciones de negocio y del RCA; no hay contratos públicos salvo la cláusula que cita la prensa.</tspan></text><text x="470" y="528.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe anual 10-K de CrowdStrike (ejercicio fiscal 2025); esquema propio.</tspan></text></svg>
