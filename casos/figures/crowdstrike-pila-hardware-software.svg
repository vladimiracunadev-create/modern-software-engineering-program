<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" width="940" height="566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pila de un equipo afectado: del hardware x64 al intérprete que leyó mal</title><desc id="d">Cinco capas de arriba abajo: archivos de canal binarios, intérprete de contenido en C++, controlador csagent.sys y de arranque temprano, núcleo de Windows y hardware x64. A la derecha, quién gobierna cada tramo: CrowdStrike el contenido rápido, el cliente la versión del sensor y Microsoft el núcleo y la certificación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="566" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pila de un equipo afectado: del hardware x64 al intérprete que leyó mal</tspan></text><rect x="10" y="53" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Archivos de canal</tspan></text><rect x="214" y="53" width="430" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">Binarios propietarios en disco; instancias con</tspan></text><text x="429" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">expresiones regulares</tspan></text><rect x="10" y="133" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="169.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Intérprete de contenido</tspan></text><rect x="214" y="133" width="430" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="429" y="161.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="429" dy="0">Código C++ del sensor; lee por índice el arreglo de</tspan></text><text x="429" y="177.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="429" dy="0">entradas</tspan></text><rect x="10" y="213" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="241.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Controladores del</tspan></text><text x="105" y="257.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">sensor</tspan></text><rect x="214" y="213" width="430" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="241.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">csagent.sys (filtro) y controlador de arranque firmado</tspan></text><text x="429" y="257.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">como ELAM</tspan></text><rect x="10" y="293" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Núcleo de Windows</tspan></text><rect x="214" y="293" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Modo kernel: un acceso inválido detiene el sistema</tspan></text><rect x="10" y="373" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="409.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Hardware x64</tspan></text><rect x="214" y="373" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="401.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Equipos de escritorio, portátiles, cajeros y estaciones</tspan></text><text x="429" y="417.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">clínicas</tspan></text><rect x="668" y="53" width="262" height="114.667" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="799" y="105.653" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">Gobierna CrowdStrike: contenido</tspan></text><text x="799" y="122.293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">rápido, sin elección del cliente</tspan></text><rect x="668" y="181.667" width="262" height="114.667" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799" y="234.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Gobierna el cliente: versión del</tspan></text><text x="799" y="250.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">sensor N, N-1 o N-2</tspan></text><rect x="668" y="310.333" width="262" height="114.667" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="799" y="362.987" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">Gobierna Microsoft: núcleo, ELAM</tspan></text><text x="799" y="379.627" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">y certificación WHQL</tspan></text><rect x="10" y="459" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="483.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los nombres son los del RCA. Modelos de equipo, memoria y procesadores: no se sabe. Los servidores de CrowdStrike (AWS y</tspan></text><text x="470" y="500.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">colocación) tampoco tienen especificaciones públicas.</tspan></text><text x="470" y="548.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: RCA de CrowdStrike (6 ago 2024) y blog de seguridad de Microsoft (27 jul 2024); esquema propio.</tspan></text></svg>
