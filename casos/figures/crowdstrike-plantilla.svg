<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 290" width="940" height="290" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Plantilla a tiempo completo: de 7.273 a 10.118 empleados en dos años</title><desc id="d">Dos barras: 7.273 empleados a tiempo completo al 31 de enero de 2023 y 10.118 al 31 de enero de 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="290" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Plantilla a tiempo completo: de 7.273 a 10.118 empleados en dos años</tspan></text><line x1="214" y1="49" x2="214" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="125" x2="214" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="344.728" y1="49" x2="344.728" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="344.728" y1="125" x2="344.728" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="344.728" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344.728" dy="0">2 500</tspan></text><line x1="475.456" y1="49" x2="475.456" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="475.456" y1="125" x2="475.456" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="475.456" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475.456" dy="0">5 000</tspan></text><line x1="606.184" y1="49" x2="606.184" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="606.184" y1="125" x2="606.184" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="606.184" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="606.184" dy="0">7 500</tspan></text><line x1="736.912" y1="49" x2="736.912" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="736.912" y1="125" x2="736.912" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="736.912" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="736.912" dy="0">10 000</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="125" x2="867.64" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">12 500</tspan></text><line x1="214" y1="125" x2="867.64" y2="125" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">31 de enero de 2023</tspan></text><text x="204" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">31 de enero de 2025</tspan></text><rect x="214" y="55" width="380.314" height="26" rx="3" fill="#102a43"/><text x="601.314" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="601.314" dy="0">7 273</tspan></text><rect x="214" y="93" width="529.082" height="26" rx="3" fill="#102a43"/><text x="750.082" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="750.082" dy="0">10 118</tspan></text><text x="540.82" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="540.82" dy="0">empleados a tiempo completo</tspan></text><rect x="10" y="183" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="207.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cuenta empleados a tiempo completo; no incluye contratistas ni dice cuántos trabajan en el sensor o en el contenido. No hay</tspan></text><text x="470" y="224.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">organigrama público del área.</tspan></text><text x="470" y="272.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe anual 10-K de CrowdStrike (ejercicio fiscal 2025); esquema propio.</tspan></text></svg>
