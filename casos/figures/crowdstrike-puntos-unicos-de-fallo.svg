<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 498" width="940" height="498" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias del equipo del cliente: cuatro puntos únicos de fallo en una sola pila</title><desc id="d">Pila de capas. Arriba, aplicaciones de negocio y administración remota. Debajo, el núcleo de Windows, punto único de fallo. Debajo, el controlador con el intérprete, punto único de fallo. Debajo, el archivo de canal en disco, punto único de fallo. A la izquierda, la distribución desde la nube, punto único de fallo. A la derecha, la recuperación por red.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="498" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dependencias del equipo del cliente: cuatro puntos únicos de fallo en una sola pila</tspan></text><rect x="200" y="49" width="250" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="325" y="72.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="325" dy="0">Aplicaciones de negocio y</tspan></text><text x="325" y="88.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="325" dy="0">mostradores</tspan></text><rect x="470" y="49" width="260" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Administración remota del equipo</tspan></text><rect x="200" y="135" width="530" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="166.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="465" dy="0">Núcleo de Windows: un fallo en kernel detiene todo lo de arriba</tspan></text><rect x="200" y="221" width="530" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="465" dy="0">csagent.sys con el intérprete de contenido</tspan></text><rect x="200" y="307" width="530" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="338.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="465" dy="0">Archivo de canal 291 activo, sin versión buena de respaldo documentada</tspan></text><rect x="10" y="307" width="160" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="90" y="330.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="90" dy="0">Nube: distribución</tspan></text><text x="90" y="346.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="90" dy="0">única</tspan></text><rect x="760" y="221" width="170" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="845" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="845" dy="0">Recuperación:</tspan></text><text x="845" y="261.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="845" dy="0">depende de arrancar</tspan></text><text x="845" y="278.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="845" dy="0">y descargar</tspan></text><polyline points="325,135 325,105" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="600,135 600,105" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="465,221 465,191" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="465,307 465,277" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="170,335 200,335" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="760,258 730,258" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="391" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las flechas punteadas significan «si cae, arrastra». Los cuatro nodos coral son estructura, no probabilidad: que un punto</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">único exista no dice con qué frecuencia falla.</tspan></text><text x="470" y="480.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
