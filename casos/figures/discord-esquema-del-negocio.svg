<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo gana dinero Discord según lo que publica</title><desc id="d">Flujo del negocio: la comunicación es gratuita y atrae a jugadores; Nitro y los Boosts monetizan a quien quiere más; desde 2025 los Quests y el comercio social monetizan a editores y desarrolladores; no hay cifras públicas de ingresos en las fuentes consultadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="345" fill="#ffffff"/><rect x="10" y="14" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111" y="34.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Chat de texto, voz y</tspan></text><text x="111" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">vídeo gratuito: 90</tspan></text><text x="111" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">millones de usuarios</tspan></text><text x="111" y="84.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">diarios</tspan></text><rect x="256" y="14" width="202" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Nitro (2017): perfil,</tspan></text><text x="357" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">emojis y mejoras</tspan></text><polyline points="212,56 256,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="603" y="43" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">Server Boosting (2019):</tspan></text><text x="603" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">la comunidad desbloquea</tspan></text><text x="603" y="76.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">mejoras</tspan></text><polyline points="458,56 502,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="849" y="43" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">Quests y Orbs (2025):</tspan></text><text x="849" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">misiones pagadas por</tspan></text><text x="849" y="76.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">anunciantes</tspan></text><polyline points="704,56 748,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="202" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="111" y="158.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">Comercio social (2025):</tspan></text><text x="111" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">venta de objetos de</tspan></text><text x="111" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">juego en servidores</tspan></text><text x="111" y="208.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">oficiales</tspan></text><rect x="256" y="138" width="202" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="167" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">Social SDK (2025): chat</tspan></text><text x="357" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">de Discord dentro de</tspan></text><text x="357" y="200.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">juegos</tspan></text><polyline points="212,180 256,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="138" width="202" height="84" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="603" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="603" dy="0">Ingresos: no se publican</tspan></text><polyline points="458,180 502,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="138" width="202" height="84" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="849" y="167" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="849" dy="0">Costes de</tspan></text><text x="849" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="849" dy="0">infraestructura: no se</tspan></text><text x="849" y="200.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="849" dy="0">publican</tspan></text><polyline points="704,180 748,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="849,98 849,118 111,118 111,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Documentado en la línea de tiempo oficial de Discord. Inferido: que Nitro es la fuente principal de ingresos históricos, por</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">ser la más antigua y la que la empresa destaca; Discord no lo cuantifica. Cualquier cifra de ingresos que circule no se usa</tspan></text><text x="480" y="294.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">aquí por falta de fuente primaria.</tspan></text><text x="480" y="335.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Fuente: página «Acerca de Discord» (discord.com/company), consulta 2026-11-23.</tspan></text></svg>
