<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" width="940" height="492" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Peor caso al insertar en la lista de miembros de 250 000 elementos</title><desc id="d">Barras en escala logarítmica con los microsegundos del peor caso: lista ordenada ingenua 170 000, conjunto ordenado de Erlang 27 000, celdas de tamaño fijo 19 000 y estructura de celdas que crecen y se dividen 640.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="492" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Peor caso al insertar en la lista de miembros de 250 000 elementos</tspan></text><line x1="123.86" y1="317" x2="920" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="317" x2="123.86" y2="317" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="321.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">100</tspan></text><line x1="123.86" y1="254.5" x2="920" y2="254.5" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="254.5" x2="123.86" y2="254.5" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="259" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">1 000</tspan></text><line x1="123.86" y1="192" x2="920" y2="192" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="192" x2="123.86" y2="192" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">10 000</tspan></text><line x1="123.86" y1="129.5" x2="920" y2="129.5" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="129.5" x2="123.86" y2="129.5" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="134" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">100 000</tspan></text><line x1="123.86" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="67" x2="123.86" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">1 000 000</tspan></text><line x1="123.86" y1="67" x2="123.86" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 192)">microsegundos (peor caso, escala logarítmica) (escala logarítmica)</text><rect x="143.763" y="115.097" width="159.228" height="201.903" rx="3" fill="#087f8c"/><text x="223.377" y="109.097" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="223.377" dy="0">170 000</tspan></text><text x="223.377" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="223.377" dy="0">Lista ingenua</tspan></text><rect x="342.798" y="165.04" width="159.228" height="151.96" rx="3" fill="#087f8c"/><text x="422.413" y="159.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="422.413" dy="0">27 000</tspan></text><text x="422.412" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422.412" dy="0">ordsets de Erlang</tspan></text><rect x="541.833" y="174.578" width="159.228" height="142.422" rx="3" fill="#087f8c"/><text x="621.447" y="168.578" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="621.447" dy="0">19 000</tspan></text><text x="621.447" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="621.447" dy="0">Celdas fijas</tspan></text><rect x="740.869" y="266.614" width="159.228" height="50.3862" rx="3" fill="#087f8c"/><text x="820.483" y="260.614" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.483" dy="0">640</tspan></text><text x="820.483" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="820.483" dy="0">OrderedSet dinámico</tspan></text><rect x="10" y="369" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada barra es la versión de la estructura de datos para la lista de miembros; el peor caso cambia de lugar entre versiones.</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Mire la última barra: unas 266 veces más rápido que la lista ingenua (cálculo propio: 170 000 entre 640). Dónde deja de</tspan></text><text x="470" y="427.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: la estructura servía hasta 250 000 miembros y luego pasó a Rust.</tspan></text><text x="470" y="474.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Using Rust to Scale Elixir for 11 Million Concurrent Users», discord.com/blog, 2019.</tspan></text></svg>
