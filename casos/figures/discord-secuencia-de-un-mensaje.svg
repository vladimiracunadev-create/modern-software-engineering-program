<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 529" width="940" height="529" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De un mensaje enviado a su aparición en otras pantallas y en la base de datos</title><desc id="d">Secuencia de un mensaje: el cliente lo envía a la API; la API lo guarda mediante el servicio de datos en ScyllaDB; el proceso del servidor (guild) lo recibe y lo reparte a las sesiones de los usuarios conectados, que lo envían por WebSocket a sus clientes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="529" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De un mensaje enviado a su aparición en otras pantallas y en la base de datos</tspan></text><rect x="26" y="58" width="138" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Cliente</tspan></text><rect x="176" y="58" width="138" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="245" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="245" dy="0">API</tspan></text><rect x="326" y="58" width="138" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="395" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="395" dy="0">Servicio de</tspan></text><text x="395" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="395" dy="0">datos</tspan></text><rect x="476" y="58" width="138" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="545" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="545" dy="0">ScyllaDB</tspan></text><rect x="626" y="58" width="138" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="695" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="695" dy="0">Proceso guild</tspan></text><rect x="776" y="58" width="138" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="845" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845" dy="0">Sesiones</tspan></text><line x1="95" y1="104" x2="95" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="245" y1="104" x2="245" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="395" y1="104" x2="395" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="545" y1="104" x2="545" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="695" y1="104" x2="695" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="845" y1="104" x2="845" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="98,138 242,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="170" y="130" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="170" dy="0">1. envía el mensaje</tspan></text><polyline points="248,184 392,184" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="320" y="160" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="320" dy="0">2. guarda (una consulta</tspan><tspan x="320" dy="16.64">gRPC)</tspan></text><polyline points="398,230 542,230" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="206" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">3. escribe por canal y</tspan><tspan x="470" dy="16.64">ventana de tiempo</tspan></text><polyline points="248,276 692,276" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="268" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">4. publica el evento al servidor</tspan></text><polyline points="698,322 842,322" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="770" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="770" dy="0">5. reparte a cada sesión con</tspan><tspan x="770" dy="16.64">permisos</tspan></text><polyline points="842,368 98,368" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="470" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">6. WebSocket al resto de clientes</tspan></text><rect x="10" y="420" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="444.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en conjunto, no como una única secuencia oficial: la API que persiste mensajes, los servicios de datos de Rust,</tspan></text><text x="470" y="461.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ScyllaDB, el proceso por comunidad y las sesiones por usuario salen de posts distintos. Inferido: el orden exacto entre</tspan></text><text x="470" y="478.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">guardar y repartir. Dónde deja de valer: omite relays, permisos y la vía de bots.</tspan></text><text x="470" y="515.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de ingeniería de Discord (discord.com/blog), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
