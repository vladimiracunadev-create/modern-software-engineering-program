<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El trabajo de repartir un mensaje crece con el cuadrado del tamaño del servidor</title><desc id="d">Barras en escala logarítmica: si todos los conectados escriben una vez, un servidor con 1 000 personas genera 1 millón de notificaciones, uno con 10 000 genera 100 millones y uno con 100 000 genera 10 mil millones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El trabajo de repartir un mensaje crece con el cuadrado del tamaño del servidor</tspan></text><line x1="101.24" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="307" x2="101.24" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,1</tspan></text><line x1="101.24" y1="259" x2="920" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="259" x2="101.24" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="211" x2="920" y2="211" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="211" x2="101.24" y2="211" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="215.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="163" x2="920" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="163" x2="101.24" y2="163" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="115" x2="920" y2="115" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="115" x2="101.24" y2="115" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="67" x2="101.24" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="67" x2="101.24" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">millones de notificaciones (escala logarítmica)</text><rect x="128.532" y="259" width="218.336" height="48" rx="3" fill="#c0432f"/><text x="237.7" y="253" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237.7" dy="0">1</tspan></text><text x="237.7" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">1 000 conectados</tspan></text><rect x="401.452" y="163" width="218.336" height="144" rx="3" fill="#c0432f"/><text x="510.62" y="157" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="510.62" dy="0">100</tspan></text><text x="510.62" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">10 000 conectados</tspan></text><rect x="674.372" y="67" width="218.336" height="240" rx="3" fill="#c0432f"/><text x="783.54" y="61" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="783.54" dy="0">10 000</tspan></text><text x="783.54" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">100 000 conectados</tspan></text><rect x="10" y="359" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Es el cálculo del propio post: la actividad es proporcional al número de personas y el reparto de cada mensaje también, de</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modo que el trabajo crece al cuadrado. Mire la escala logarítmica: cada barra es 100 veces la anterior. Dónde deja de</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: es un modelo del peor caso en que todos hablan.</tspan></text><text x="470" y="464.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Maxjourney», discord.com/blog, 2022. Cálculo del post; escala logarítmica.</tspan></text></svg>
