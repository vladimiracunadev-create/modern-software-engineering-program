<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 509" width="940" height="509" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Temas a prueba de fallos que Dropbox documenta</title><desc id="d">Cuatro mecanismos con veredicto: durabilidad efectivamente infinita con codificación de borrado entre regiones, bloques inmutables que no se corrompen al editarse, múltiples capas de redundancia y reconstrucción de réplicas, y pruebas de la sincronización para detectar regresiones antes de llegar a producción.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="509" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Temas a prueba de fallos que Dropbox documenta</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Un disco o un servidor falla</tspan></text><polyline points="402,97.32 438,97.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="77" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="100.96" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Réplica y reparación automática</tspan></text><text x="24" y="134.64" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">La durabilidad objetivo es más de 99,9999999999 % al año.</tspan></text><rect x="20" y="156.28" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="180.24" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Una región queda fuera</tspan></text><polyline points="402,176.6 438,176.6" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="156.28" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="180.24" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Codificación de borrado entre regiones geográficas</tspan></text><text x="24" y="213.92" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El diseño tolera calamidades y desastres naturales.</tspan></text><rect x="20" y="235.56" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="259.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Un cliente se desconecta en medio de una edición</tspan></text><polyline points="402,255.88 438,255.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="235.56" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="259.52" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Registro de cambios en FileJournal; bloques inmutables</tspan></text><text x="24" y="293.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">La mutabilidad está arriba y el almacenamiento no cambia.</tspan></text><rect x="20" y="314.84" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="338.8" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Una regresión del motor de sincronización</tspan></text><polyline points="402,335.16 438,335.16" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="314.84" width="478" height="40.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="338.8" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">Pruebas automáticas de combinaciones de estados</tspan></text><text x="24" y="372.48" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Testear la sincronización es difícil por el número de combinaciones.</tspan></text><rect x="10" y="396.12" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="421.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en los posts de Magic Pocket (2016) y del motor de sincronización (2020) y en el 10-K (durabilidad de</tspan></text><text x="470" y="437.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">99,999999999 %). Dónde deja de valer: son objetivos de diseño publicados, no tasas de fallo medidas.</tspan></text><text x="470" y="481.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog técnico de Dropbox (dropbox.tech), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
