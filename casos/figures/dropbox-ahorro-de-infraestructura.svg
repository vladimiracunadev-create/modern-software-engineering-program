<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué bajó el coste de ingresos de Dropbox en 2017</title><desc id="d">Barras en millones de dólares: el coste de ingresos bajó 21,7 millones en 2017 respecto de 2016; los costes de infraestructura bajaron 35,1 millones por la optimización de infraestructura y la amortización de tecnologías 5,9 millones, mientras el personal subió 11,0 millones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué bajó el coste de ingresos de Dropbox en 2017</tspan></text><line x1="78.62" y1="297" x2="920" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="297" x2="78.62" y2="297" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">−40</tspan></text><line x1="78.62" y1="258.667" x2="920" y2="258.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="258.667" x2="78.62" y2="258.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="263.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">−30</tspan></text><line x1="78.62" y1="220.333" x2="920" y2="220.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="220.333" x2="78.62" y2="220.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="224.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">−20</tspan></text><line x1="78.62" y1="182" x2="920" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="182" x2="78.62" y2="182" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">−10</tspan></text><line x1="78.62" y1="143.667" x2="920" y2="143.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="143.667" x2="78.62" y2="143.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="148.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="105.333" x2="920" y2="105.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="105.333" x2="78.62" y2="105.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="109.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">10</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 182)">millones de USD de variación</text><rect x="106.666" y="295" width="224.368" height="2" rx="3" fill="#087f8c"/><text x="218.85" y="289" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.85" dy="0">−35,1</tspan></text><text x="218.85" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Infraestructura</tspan></text><rect x="387.126" y="295" width="224.368" height="2" rx="3" fill="#087f8c"/><text x="499.31" y="289" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">−5,9</tspan></text><text x="499.31" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Amortización de tecnología</tspan></text><rect x="667.586" y="101.5" width="224.368" height="195.5" rx="3" fill="#087f8c"/><text x="779.77" y="95.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">11,0</tspan></text><text x="779.77" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Personal (sube)</tspan></text><rect x="10" y="349" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las barras negativas son reducciones. Cálculo propio: -35,1 - 5,9 + 11,0 deja -30,0; el resto hasta los -21,7 que reporta</tspan></text><text x="470" y="390.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el prospecto corresponde a otras partidas que no se desglosan aquí. Dónde deja de valer: el prospecto solo cita las</tspan></text><text x="470" y="407.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">principales causas.</tspan></text><text x="470" y="454.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: prospecto 424B4 de Dropbox de marzo de 2018 (SEC), consulta 2026-11-23.</tspan></text></svg>
