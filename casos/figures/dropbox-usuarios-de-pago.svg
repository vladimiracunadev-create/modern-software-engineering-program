<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Usuarios de pago de Dropbox y su ingreso medio</title><desc id="d">Barras con 11 millones de usuarios de pago a fines de 2017, 18,22 millones a fines de 2024 y 18,08 millones a fines de 2025; el ingreso medio por usuario de pago fue de 140,23 dólares en 2024 y 138,91 en 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Usuarios de pago de Dropbox y su ingreso medio</tspan></text><line x1="71.08" y1="297" x2="920" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="297" x2="71.08" y2="297" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="239.5" x2="920" y2="239.5" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="239.5" x2="71.08" y2="239.5" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="244" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="182" x2="920" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="182" x2="71.08" y2="182" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="124.5" x2="920" y2="124.5" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="124.5" x2="71.08" y2="124.5" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="129" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="67" x2="71.08" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="67" x2="71.08" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 182)">millones de usuarios de pago</text><rect x="99.3773" y="170.5" width="226.379" height="126.5" rx="3" fill="#087f8c"/><text x="212.567" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">11,00</tspan></text><text x="212.567" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Fin de 2017</tspan></text><rect x="382.351" y="87.47" width="226.379" height="209.53" rx="3" fill="#087f8c"/><text x="495.54" y="81.47" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">18,22</tspan></text><text x="495.54" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Fin de 2024</tspan></text><rect x="665.324" y="89.08" width="226.379" height="207.92" rx="3" fill="#087f8c"/><text x="778.513" y="83.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">18,08</tspan></text><text x="778.513" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Fin de 2025</tspan></text><rect x="10" y="349" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El número de usuarios se estancó en los dos últimos años (baja de 0,8 %), igual que el ingreso medio, de 140,23 a 138,91</tspan></text><text x="470" y="390.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dólares. Frente a 500 millones de usuarios registrados en 2017, los de pago eran 2 %. Dónde deja de valer: «usuario de</tspan></text><text x="470" y="407.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pago» es una licencia activa; no mide personas únicas.</tspan></text><text x="470" y="454.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: prospecto de 2018 y 10-K de 2025 de Dropbox (SEC).</tspan></text></svg>
