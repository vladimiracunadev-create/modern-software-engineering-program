<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 398" width="940" height="398" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">184 días: del parche disponible al aviso público</title><desc id="d">Línea de tiempo en días desde el 7 de marzo de 2017: el parche está disponible desde el día 0 hasta que se aplica a finales de julio; la primera explotación es el día 3; el atacante está dentro del 13 de mayo al 30 de julio, 76 días; el aviso público es el 7 de septiembre, el día 184.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="398" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">184 días: del parche disponible al aviso público</tspan></text><line x1="234" y1="83" x2="234" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="234" y1="233" x2="234" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="234" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">0</tspan></text><line x1="347" y1="83" x2="347" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="347" y1="233" x2="347" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="347" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">30</tspan></text><line x1="460" y1="83" x2="460" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="460" y1="233" x2="460" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="460" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="460" dy="0">60</tspan></text><line x1="573" y1="83" x2="573" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="573" y1="233" x2="573" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="573" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573" dy="0">90</tspan></text><line x1="686" y1="83" x2="686" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="686" y1="233" x2="686" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="686" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686" dy="0">120</tspan></text><line x1="799" y1="83" x2="799" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="799" y1="233" x2="799" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="799" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">150</tspan></text><line x1="912" y1="83" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="233" x2="912" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">180</tspan></text><line x1="234" y1="233" x2="912" y2="233" stroke="#5b7280" stroke-width="1.6"/><text x="224" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">Parche sin aplicar en ACIS</tspan></text><text x="224" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">Intrusión con acceso</tspan></text><text x="224" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">Respuesta hasta el aviso</tspan></text><line x1="486.367" y1="75" x2="486.367" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="486.367" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="486.367" dy="0">13 may</tspan></text><line x1="776.4" y1="75" x2="776.4" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="776.4" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="776.4" dy="0">29 jul</tspan></text><rect x="234" y="92" width="542.4" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="505.2" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="505.2" dy="0">parche disponible pero sin aplicar a ACIS</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="486.367" y="142" width="293.8" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="633.267" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="633.267" dy="0">76 días de acceso</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="776.4" y="192" width="150.667" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="851.733" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="851.733" dy="0">39 días</tspan></text><text x="573" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="573" dy="0">Días desde el 7 de marzo de 2017</tspan></text><rect x="10" y="291" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los días salen de las fechas del informe: 7 de marzo = día 0, 13 de mayo = 67, 29 y 30 de julio = 144 y 145, 7 de</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">septiembre = 184. El certificado del monitor llevaba 19 meses vencido antes del día 144, fuera de esta escala.</tspan></text><text x="470" y="380.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018). Cronología.</tspan></text></svg>
