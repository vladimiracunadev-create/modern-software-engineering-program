<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" width="940" height="512" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</title><desc id="d">Cuatro columnas: mecanismos que existían y funcionaron (aviso de US-CERT, política de parcheo escrita, respuesta tras la detección), que existían y fallaron (distribución del aviso, escaneo, monitor de tráfico), que no existían (inventario, propietarios designados, segmentación, cifrado) y que debieron existir (análisis propio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="512" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</tspan></text><rect x="10" y="51" width="216.5" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="118.25" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="118.25" dy="0">Existía y funcionó</tspan></text><rect x="10" y="101" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Aviso de US-CERT y parche</tspan></text><text x="118.25" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">del proveedor disponibles</tspan></text><text x="118.25" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">el mismo día</tspan></text><rect x="10" y="172.92" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Política escrita con plazo</tspan></text><text x="118.25" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">de 48 horas</tspan></text><rect x="10" y="228.2" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Al renovar el certificado,</tspan></text><text x="118.25" y="263.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">se vio y se bloqueó el</tspan></text><text x="118.25" y="280.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">tráfico</tspan></text><rect x="10" y="300.12" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="319.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Investigación forense</tspan></text><text x="118.25" y="335.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">externa y aviso público</tspan></text><rect x="244.5" y="51" width="216.5" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352.75" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="352.75" dy="0">Existía y falló</tspan></text><rect x="244.5" y="101" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Correo a unas 430 personas</tspan></text><text x="352.75" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">como mecanismo de aviso</tspan></text><rect x="244.5" y="156.28" width="216.5" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="179.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Escaneo del 15 de marzo</tspan></text><rect x="244.5" y="204.28" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="223.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Monitor de tráfico con</tspan></text><text x="352.75" y="239.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">certificado vencido</tspan></text><rect x="244.5" y="259.56" width="216.5" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="283.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Seguimiento del parche</tspan></text><rect x="479" y="51" width="216.5" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.25" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="587.25" dy="0">No existía</tspan></text><rect x="479" y="101" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Inventario fiable de</tspan></text><text x="587.25" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">software por aplicación</tspan></text><rect x="479" y="156.28" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Propietarios designados de</tspan></text><text x="587.25" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">la aplicación</tspan></text><rect x="479" y="211.56" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Segmentación de bases de</tspan></text><text x="587.25" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">datos</tspan></text><rect x="479" y="266.84" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="285.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Cifrado de los datos</tspan></text><text x="587.25" y="302.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">personales hallados</tspan></text><rect x="713.5" y="51" width="216.5" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="821.75" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="821.75" dy="0">Debió existir (análisis</tspan></text><text x="821.75" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="821.75" dy="0">propio)</tspan></text><rect x="713.5" y="108.28" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="127.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Inventario de componentes</tspan></text><text x="821.75" y="143.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">con alertas por</tspan></text><text x="821.75" y="160.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">vulnerabilidad</tspan></text><rect x="713.5" y="180.2" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="199.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Dueños de cada sistema,</tspan></text><text x="821.75" y="215.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">con verificación del</tspan></text><text x="821.75" y="232.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">parche</tspan></text><rect x="713.5" y="252.12" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="271.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Alerta cuando un control</tspan></text><text x="821.75" y="287.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">de seguridad deja de</tspan></text><text x="821.75" y="304.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">funcionar</tspan></text><rect x="713.5" y="324.04" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="343" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Segmentación y cifrado de</tspan></text><text x="821.75" y="359.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">los datos personales</tspan></text><rect x="10" y="389.32" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="414.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: lo que funcionó fue la respuesta posterior a la detección; lo que faltó estaba antes. La cuarta columna es</tspan></text><text x="470" y="430.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">análisis propio.</tspan></text><text x="470" y="478.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018). Análisis propio, no conclusión del</tspan></text><text x="470" y="494" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">Comité ni de la GAO.</tspan></text></svg>
