<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 485" width="940" height="485" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">ACIS: el portal de disputas que fue la puerta de entrada</title><desc id="d">Capas de lo que consta del portal: aplicación a medida desarrollada en los años setenta, expuesta a Internet, con una versión de Apache Struts vulnerable, un dispositivo de monitoreo de su tráfico inactivo por un certificado vencido y credenciales sin cifrar en un archivo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="485" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">ACIS: el portal de disputas que fue la puerta de entrada</tspan></text><rect x="10" y="51" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="78.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Aplicación</tspan></text><rect x="270" y="51" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Portal de disputas de consumidores hecho a medida, con origen en los años setenta,</tspan></text><text x="600" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">expuesto a Internet</tspan></text><rect x="10" y="106.28" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="133.56" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Componente vulnerable</tspan></text><rect x="270" y="106.28" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="125.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Una versión de Apache Struts con la vulnerabilidad CVE-2017-5638, publicada con parche</tspan></text><text x="600" y="141.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">el 7 de marzo de 2017</tspan></text><rect x="10" y="161.56" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="188.84" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Monitoreo</tspan></text><rect x="270" y="161.56" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="180.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Un dispositivo que vigilaba el tráfico de ACIS llevaba 19 meses inactivo por un</tspan></text><text x="600" y="197.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">certificado de seguridad vencido</tspan></text><rect x="10" y="216.84" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="244.12" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Credenciales</tspan></text><rect x="270" y="216.84" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="235.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Un archivo con usuarios y contraseñas sin cifrar permitió llegar a bases de datos</tspan></text><text x="600" y="252.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">ajenas a ACIS</tspan></text><rect x="10" y="272.12" width="250" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="135" y="299.4" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="135" dy="0">Inventario del software</tspan></text><rect x="270" y="272.12" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="291.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Los responsables dijeron no saber que Struts corría en ACIS ni cuánto se usaba en la</tspan></text><text x="600" y="307.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">empresa; los testimonios sobre un inventario completo se contradicen</tspan></text><rect x="10" y="327.4" width="250" height="40" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="351.04" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">Lenguaje, servidores, red</tspan></text><rect x="270" y="327.4" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="351.04" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">No constan con detalle en las fuentes consultadas; este caso no los inventa</tspan></text><rect x="10" y="383.4" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="414.04" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: cada capa tenía una debilidad documentada. Verde: documentado; dorado: parcial; gris: no se sabe.</tspan></text><text x="470" y="467.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018). Apartados II a V.</tspan></text></svg>
