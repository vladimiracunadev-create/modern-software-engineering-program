<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que hicieron los atacantes dentro: consultas y hallazgos</title><desc id="d">Barras en escala logarítmica con la actividad en las 48 bases de datos: unas 9 000 consultas y 265 veces que localizaron datos personales sin cifrar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lo que hicieron los atacantes dentro: consultas y hallazgos</tspan></text><line x1="294" y1="49" x2="294" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="137" x2="294" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">100</tspan></text><line x1="584.85" y1="49" x2="584.85" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="584.85" y1="137" x2="584.85" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="584.85" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="584.85" dy="0">1 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="137" x2="875.7" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10 000</tspan></text><line x1="294" y1="137" x2="875.7" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Consultas a las bases de datos</tspan></text><text x="284" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Hallazgos de datos personales sin</tspan></text><text x="284" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">cifrar</tspan></text><rect x="294" y="55" width="568.391" height="32" rx="3" fill="#c0432f"/><text x="869.391" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="869.391" dy="0">9 000</tspan></text><rect x="294" y="99" width="123.101" height="32" rx="3" fill="#c0432f"/><text x="424.101" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="424.101" dy="0">265</tspan></text><text x="584.85" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Cantidad (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="195" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Son las dos cifras que da el informe del Comité sobre la actividad de los atacantes en 48 bases de datos. La escala es</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">logarítmica; no compares longitudes. No dice cuántos registros contenía cada hallazgo.</tspan></text><text x="470" y="284.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018).</tspan></text></svg>
