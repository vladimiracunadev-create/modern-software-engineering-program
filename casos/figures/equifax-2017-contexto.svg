<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 398" width="940" height="398" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un buró de crédito entre quienes aportan datos y quienes los compran</title><desc id="d">Diagrama de contexto: las entidades que aportan datos de crédito los envían a Equifax; Equifax los analiza y vende informes y servicios de verificación de identidad a prestamistas, aseguradoras, empleadores y agencias federales; los consumidores no eligen estar en la base; dentro de Equifax, un portal de disputas conectaba a Internet con bases de datos de consumidores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="398" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un buró de crédito entre quienes aportan datos y quienes los compran</tspan></text><rect x="10" y="51" width="200" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Entidades que aportan</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">datos: prestamistas,</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">aseguradoras,</tspan></text><text x="110" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">empleadores</tspan></text><rect x="10" y="145.56" width="200" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Consumidores: no eligen</tspan></text><text x="110" y="181.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">figurar ni pueden</tspan></text><text x="110" y="197.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">salirse</tspan></text><rect x="730" y="51" width="200" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Compradores:</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">prestamistas,</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">aseguradoras,</tspan></text><text x="830" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">empleadores</tspan></text><rect x="730" y="145.56" width="200" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Agencias federales:</tspan></text><text x="830" y="181.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">verificación de</tspan></text><text x="830" y="197.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">identidad</tspan></text><rect x="730" y="223.48" width="200" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="247.12" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">Reguladores y Congreso</tspan></text><rect x="280" y="51" width="370" height="226.48" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="294" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="294" dy="0">Equifax</tspan></text><rect x="300" y="91" width="330" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="109.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Bases de datos de información personal de</tspan></text><text x="465" y="126.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">consumidores</tspan></text><rect x="300" y="148.28" width="330" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="167.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Portal web de disputas de consumidores</tspan></text><text x="465" y="183.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">(ACIS)</tspan></text><rect x="300" y="205.56" width="330" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="224.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Servicios de informes y verificación de</tspan></text><text x="465" y="241.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">identidad</tspan></text><polyline points="210,91.28 280,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="83.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">aportan</tspan></text><polyline points="210,177.52 280,177.52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="169.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">figuran</tspan></text><polyline points="650,91.28 730,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="83.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">compran</tspan></text><polyline points="650,177.52 730,177.52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="169.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">verifican</tspan></text><polyline points="650,243.48 730,243.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="235.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">supervisan</tspan></text><rect x="10" y="291.48" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="316.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el negocio consiste en concentrar datos de personas que no son clientes de la empresa. Mira que el portal de</tspan></text><text x="470" y="333.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">disputas, la caja roja, era el único componente expuesto a Internet entre los tres.</tspan></text><text x="470" y="380.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018). Apartados I y II.</tspan></text></svg>
