<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 432" width="940" height="432" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién debía actuar: lo que decía la política y lo que ocurría</title><desc id="d">Dos columnas: la política de parcheo asignaba roles de propietario del negocio, del sistema y de la aplicación, y marcaba un plazo de 48 horas para parches críticos; en la práctica, no había designación explícita de propietarios de la aplicación y la alerta llegó a unas 430 personas sin una acción concreta para la mayoría.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="432" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién debía actuar: lo que decía la política y lo que ocurría</tspan></text><rect x="10" y="51" width="451" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235.5" dy="0">Lo que decía la política</tspan></text><rect x="10" y="101" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Un parche crítico se aplica en 48 horas</tspan></text><rect x="10" y="149" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Hay roles: propietario del negocio, del sistema y de la</tspan></text><text x="235.5" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">aplicación</tspan></text><rect x="10" y="204.28" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="227.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Seguridad fija las reglas; IT las ejecuta</tspan></text><rect x="10" y="252.28" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="275.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">La alerta de amenazas se distribuye por correo</tspan></text><rect x="479" y="51" width="451" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="704.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="704.5" dy="0">Lo que ocurrió</tspan></text><rect x="479" y="101" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Según un directivo, no había una designación explícita de</tspan></text><text x="704.5" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">propietarios de la aplicación ACIS</tspan></text><rect x="479" y="156.28" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">La alerta llegó a unas 430 personas; muchas la recibieron</tspan></text><text x="704.5" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">solo como información</tspan></text><rect x="479" y="211.56" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">La política dependía de que alguien conociera qué software</tspan></text><text x="704.5" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">corría en cada aplicación</tspan></text><rect x="479" y="266.84" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="290.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Equifax no sabía con certeza dónde usaba Struts</tspan></text><rect x="10" y="324.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="349.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: una política sin dueños asignados es una intención. Los testimonios del informe se citan sin nombres: lo</tspan></text><text x="470" y="366.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">relevante es el rol, no la persona.</tspan></text><text x="470" y="414.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018). Apartado V.A y V.B.</tspan></text></svg>
