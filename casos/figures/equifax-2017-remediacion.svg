<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 458" width="940" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que se hizo después, según las fuentes</title><desc id="d">Tres columnas: las 11 recomendaciones de remediación de Mandiant, que Equifax dijo haber implantado; la orden de consentimiento de junio de 2018 con ocho estados, que exige evaluación de riesgos del consejo y auditoría interna; y los cinco puntos débiles que Equifax identificó ante la GAO.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="458" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lo que se hizo después, según las fuentes</tspan></text><rect x="10" y="51" width="294.667" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="157.333" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="157.333" dy="0">Mandiant</tspan></text><rect x="10" y="101" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Once recomendaciones de remediación</tspan></text><rect x="10" y="149" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Equifax y sus directivos confirmaron</tspan></text><text x="157.333" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">que las implantó todas</tspan></text><rect x="322.667" y="51" width="294.667" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Orden de consentimiento (25 de junio</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">de 2018)</tspan></text><rect x="322.667" y="108.28" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="131.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Ocho agencias estatales</tspan></text><rect x="322.667" y="156.28" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">El consejo aprueba una evaluación de</tspan></text><text x="470" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">riesgos por escrito en 90 días</tspan></text><rect x="322.667" y="211.56" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Programa de auditoría interna formal</tspan></text><text x="470" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">en 30 días</tspan></text><rect x="635.333" y="51" width="294.667" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782.667" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="782.667" dy="0">Debilidades según Equifax ante la GAO</tspan></text><rect x="635.333" y="101" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Actualizaciones de software</tspan></text><rect x="635.333" y="149" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="172.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Configuración de software</tspan></text><rect x="635.333" y="197" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="220.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Controles de acceso</tspan></text><rect x="635.333" y="245" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="268.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Monitoreo de red</tspan></text><rect x="635.333" y="293" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="316.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Protección de límites</tspan></text><rect x="10" y="351" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="375.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: las cinco debilidades que Equifax identificó coinciden con los eslabones de la cadena; la GAO, por su parte,</tspan></text><text x="470" y="392.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">habla de cuatro factores: identificación, detección, segmentación y gobierno de datos.</tspan></text><text x="470" y="440.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018). Fuente: GAO-18-559 (30 ago 2018).</tspan></text></svg>
