<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas personas: de 143 a casi 148 millones</title><desc id="d">Barras con el total acumulado de consumidores afectados: 143 millones en la lista del 4 de septiembre de 2017, unos 145,5 millones tras añadir 2,5 millones el 2 de octubre y casi 148 millones tras añadir otros 2,4 millones el 1 de marzo de 2018.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántas personas: de 143 a casi 148 millones</tspan></text><line x1="294" y1="49" x2="294" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="163" x2="294" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="439.425" y1="49" x2="439.425" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="439.425" y1="163" x2="439.425" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="439.425" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.425" dy="0">40</tspan></text><line x1="584.85" y1="49" x2="584.85" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="584.85" y1="163" x2="584.85" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="584.85" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="584.85" dy="0">80</tspan></text><line x1="730.275" y1="49" x2="730.275" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="730.275" y1="163" x2="730.275" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="730.275" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.275" dy="0">120</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="163" x2="875.7" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">160</tspan></text><line x1="294" y1="163" x2="875.7" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Lista del 4 de septiembre de 2017</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Tras el 2 de octubre de 2017 (+2,5)</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Tras el 1 de marzo de 2018 (+2,4)</tspan></text><rect x="294" y="55" width="519.894" height="26" rx="3" fill="#c0432f"/><text x="820.894" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820.894" dy="0">143,0</tspan></text><rect x="294" y="93" width="528.983" height="26" rx="3" fill="#c0432f"/><text x="829.983" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="829.983" dy="0">145,5</tspan></text><rect x="294" y="131" width="537.709" height="26" rx="3" fill="#c0432f"/><text x="838.709" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="838.709" dy="0">147,9</tspan></text><text x="584.85" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Millones de consumidores de EE. UU. (acumulado)</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El informe del Comité da 143 millones, 2,5 millones más el 2 de octubre y 2,4 millones más el 1 de marzo de 2018, y un</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">total de 148 millones; la GAO dice «al menos 145,5 millones». La suma 147,9 es aritmética propia y el dato de 145,5</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">coincide con la GAO. Los totales incluyen solo a personas de EE. UU. con los datos que cita el informe.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018). Fuente: GAO-18-559 (30 ago 2018).</tspan></text></svg>
