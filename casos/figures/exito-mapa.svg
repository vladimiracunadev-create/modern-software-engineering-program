<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" width="960" height="592" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mapa de las plataformas exitosas: la tensión que resuelven y la teoría que la explica</title><desc id="d">Diagrama de cuatro columnas: cada una nombra una tensión de ingeniería, enlaza con flechas a las plataformas que la ilustran y señala las partes del curso que dan las herramientas para analizarla. Escala operada como producto: Netflix, Amazon, Spotify, Cloudflare, YouTube y Dropbox. Mercados y plataformas de varios lados: Uber, Mercado Libre, Airbnb, Shopify e Instagram. Interfaz y concurrencia como ventaja: Stripe, WhatsApp, Slack y Discord. Infraestructura pública de pagos: Pix.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="592" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mapa de las plataformas exitosas: la tensión que resuelven y la teoría que la explica</tspan></text><rect x="10" y="46" width="218.5" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="119.25" y="72.96" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="119.25" dy="0">Escala operada como</tspan></text><text x="119.25" y="90.88" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="119.25" dy="0">producto</tspan></text><polyline points="119.25,112 119.25,134" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="24" y="136" width="190.5" height="40" rx="10" fill