<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 688" width="940" height="688" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: pérdida de datos y 18 horas de caída exigen tres condiciones a la vez</title><desc id="d">Árbol de fallas con compuerta Y. Evento superior: pérdida de datos con unas 18 horas de caída. Ramas: una acción destructiva en producción, ausencia de un respaldo reciente utilizable y una restauración lenta. Cada rama tiene hojas documentadas en el postmortem.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="688" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: pérdida de datos y 18 horas de caída exigen tres condiciones a la vez</tspan></text><rect x="290" y="49" width="360" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="80.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Pérdida de datos y unas 18 horas de caída</tspan></text><line x1="470" y1="105" x2="470" y2="129" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="470" cy="141" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="146" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><line x1="155" y1="157" x2="785" y2="157" stroke="#8a9aa3" stroke-width="1.4"/><line x1="155" y1="157" x2="155" y2="175" stroke="#8a9aa3" stroke-width="1.4"/><line x1="470" y1="157" x2="470" y2="175" stroke="#8a9aa3" stroke-width="1.4"/><line x1="785" y1="157" x2="785" y2="175" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="175" width="290" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="208.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="155" dy="0">Acción destructiva en producción</tspan></text><rect x="325" y="175" width="290" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="208.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">Sin respaldo reciente utilizable</tspan></text><rect x="640" y="175" width="290" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="208.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="785" dy="0">Restauración lenta</tspan></text><line x1="155" y1="235" x2="155" y2="251" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="155" cy="263" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="155" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="155" dy="0">Y</tspan></text><line x1="470" y1="235" x2="470" y2="251" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="470" cy="263" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><line x1="785" y1="235" x2="785" y2="251" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="785" cy="263" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="785" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="785" dy="0">Y</tspan></text><line x1="155" y1="275" x2="155" y2="289" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="289" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="155" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">Carga alta y réplica rota</tspan></text><text x="155" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">(documentado)</tspan></text><rect x="10" y="359" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="155" y="383.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">Resincronización manual y mal</tspan></text><text x="155" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">documentada (documentado)</tspan></text><rect x="10" y="429" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="155" y="453.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">Servidores indistinguibles en el</tspan></text><text x="155" y="469.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">intérprete (documentado)</tspan></text><line x1="470" y1="275" x2="470" y2="289" stroke="#8a9aa3" stroke-width="1.4"/><rect x="325" y="289" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">pg_dump vacío por versión y por DMARC</tspan></text><text x="470" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(documentado)</tspan></text><rect x="325" y="359" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="383.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin instantáneas de Azure en bases</tspan></text><text x="470" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(documentado)</tspan></text><rect x="325" y="429" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="461.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Réplica vaciada (documentado)</tspan></text><rect x="325" y="499" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="523.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Solo la instantánea de hace unas 6</tspan></text><text x="470" y="539.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">horas (documentado)</tspan></text><line x1="785" y1="275" x2="785" y2="289" stroke="#8a9aa3" stroke-width="1.4"/><rect x="640" y="289" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Staging con discos lentos como única</tspan></text><text x="785" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">fuente (documentado)</tspan></text><rect x="640" y="359" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="383.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Sin restauración automatizada ni</tspan></text><text x="785" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">probada (documentado)</tspan></text><rect x="640" y="429" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="453.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Sin propiedad de las pruebas</tspan></text><text x="785" y="469.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">(documentado)</tspan></text><rect x="10" y="581" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="605.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Eliminar una de las tres ramas evita el evento superior. La acción destructiva fue el detonante, pero las otras dos ramas</tspan></text><text x="470" y="622.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">determinaron el daño. Sin probabilidades: el postmortem no las da.</tspan></text><text x="470" y="670.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
