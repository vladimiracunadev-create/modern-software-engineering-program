<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 464" width="940" height="464" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arquitectura de datos y respaldos: cuatro caminos de recuperación y el estado de cada uno</title><desc id="d">Diagrama de contenedores. La aplicación escribe en la base primaria db1, que replica por streaming a db2. Una instantánea LVM diaria a las 01:00 UTC alimenta el entorno de staging. Un servidor de aplicación ejecuta pg_dump y sube a Amazon S3, que estaba vacío. Los servidores NFS tienen instantáneas de Azure; las bases de datos no.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="464" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Arquitectura de datos y respaldos: cuatro caminos de recuperación y el estado de cada uno</tspan></text><rect x="360" y="49" width="220" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Aplicación GitLab</tspan></text><rect x="250" y="155" width="200" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="350" y="188.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="350" dy="0">db1: base primaria</tspan></text><rect x="500" y="155" width="200" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="600" y="180.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="600" dy="0">db2: secundaria en</tspan></text><text x="600" y="196.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="600" dy="0">espera</tspan></text><polyline points="450,185 500,185" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="475" y="175" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">WAL</tspan></text><polyline points="420,99 420,127 350,127 350,155" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="155" width="200" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="180.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">NFS: repositorios y</tspan></text><text x="110" y="196.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">wikis</tspan></text><polyline points="360,74 110,74 110,155" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="255" width="200" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="6 4"/><text x="110" y="278.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Instantánea de Azure</tspan></text><text x="110" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">cada 24 h</tspan></text><polyline points="110,215 110,255" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="730" y="155" width="200" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="830" y="185.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">Servidor de aplicación:</tspan></text><text x="830" y="201.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">pg_dump 9.2 cada 24 h</tspan></text><rect x="730" y="265" width="200" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="296.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="830" dy="0">Amazon S3: vacío</tspan></text><polyline points="830,225 830,265" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="250" y="265" width="200" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="350" y="285" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">Staging: discos de Azure</tspan></text><text x="350" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">sin almacenamiento</tspan></text><text x="350" y="318.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">premium</tspan></text><polyline points="350,215 350,265" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="362" y="245" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="362" dy="0">LVM 01:00 UTC</tspan></text><rect x="500" y="265" width="200" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="600" y="293.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="600" dy="0">Bases de datos: sin</tspan></text><text x="600" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="600" dy="0">instantáneas de Azure</tspan></text><rect x="10" y="357" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las flechas continuas son flujos de datos y las punteadas, copias de respaldo. De cuatro caminos de recuperación solo la</tspan></text><text x="470" y="398.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">instantánea LVM resultó utilizable, aunque no estaba pensada para desastres.</tspan></text><text x="470" y="446.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
