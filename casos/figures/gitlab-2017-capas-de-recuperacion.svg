<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro caminos de recuperación el 31 de enero de 2017 y por qué solo uno sirvió</title><desc id="d">Diagrama alrededor de la base de datos primaria db1 con cuatro caminos de recuperación. La réplica db2 estaba en espera pero se vació al resincronizarla. La copia lógica diaria con pg_dump hacia S3 no existía porque usaba la versión 9.2 frente a una base 9.6 y sus avisos por correo eran rechazados. Las instantáneas de Azure no estaban habilitadas para las bases de datos. La instantánea LVM diaria hacia staging sí existía y fue la única fuente utilizable, con una de las 17:20.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="476" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro caminos de recuperación el 31 de enero de 2017 y por qué solo uno sirvió</tspan></text><rect x="340" y="53" width="260" height="62" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="79.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">db1: base de datos primaria de</tspan></text><text x="470" y="95.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">GitLab.com (PostgreSQL 9.6)</tspan></text><rect x="10" y="165" width="215" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117.5" y="190.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117.5" dy="0">db2: réplica en espera</tspan></text><rect x="10" y="217" width="215" height="130" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="117.5" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">Vaciada al intentar</tspan></text><text x="117.5" y="285.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">resincronizarla: ya no</tspan></text><text x="117.5" y="302.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">podía asumir el servicio</tspan></text><polyline points="470,115 117,165" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="245" y="165" width="215" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.5" y="190.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="352.5" dy="0">pg_dump cada 24 h a S3</tspan></text><rect x="245" y="217" width="215" height="130" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352.5" y="252.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">Falló en silencio: versión</tspan></text><text x="352.5" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">9.2 frente a 9.6; los</tspan></text><text x="352.5" y="285.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">avisos por correo se</tspan></text><text x="352.5" y="302.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">rechazaron por DMARC;</tspan></text><text x="352.5" y="318.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">depósito vacío</tspan></text><polyline points="470,115 352,165" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="480" y="165" width="215" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.5" y="190.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="587.5" dy="0">Instantáneas de Azure</tspan></text><rect x="480" y="217" width="215" height="130" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.5" y="277.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">No estaban habilitadas</tspan></text><text x="587.5" y="293.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">para las bases de datos</tspan></text><polyline points="470,115 587,165" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="715" y="165" width="215" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822.5" y="190.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="822.5" dy="0">Instantánea LVM diaria</tspan></text><rect x="715" y="217" width="215" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="822.5" y="260.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="822.5" dy="0">Existía para probar</tspan></text><text x="822.5" y="277.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="822.5" dy="0">cambios en staging; la de</tspan></text><text x="822.5" y="293.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="822.5" dy="0">las 17:20 fue la única</tspan></text><text x="822.5" y="310.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="822.5" dy="0">utilizable</tspan></text><polyline points="470,115 822,165" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="369" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: el estado de cada camino y que la instantánea LVM no estaba pensada para recuperación ante desastres. Que el</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sistema dependiera de un mecanismo no diseñado para ese fin es lectura propia a partir del postmortem de GitLab.</tspan></text><text x="470" y="458.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
