<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 676" width="940" height="676" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos cadenas de cinco porqués: la técnica del postmortem, dibujada</title><desc id="d">Dos columnas. La primera responde por qué GitLab.com estuvo caído unas 18 horas: se borró el directorio de la primaria, la réplica debía reconstruirse a mano, la replicación se detuvo, subió la carga y una cuenta se programó para eliminación. La segunda responde por qué la restauración tomó más de 18 horas: se usó staging, faltaban instantáneas y respaldo lógico, el respaldo falló en silencio y nadie era responsable de probarlo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="676" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos cadenas de cinco porqués: la técnica del postmortem, dibujada</tspan></text><rect x="10" y="49" width="450" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Problema 1: GitLab.com estuvo caído unas 18 horas</tspan></text><rect x="480" y="49" width="450" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="705" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="705" dy="0">Problema 2: restaurar tomó más de 18 horas</tspan></text><rect x="10" y="113" width="450" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="235" y="143.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="235" dy="0">1 Se borró el directorio de la primaria en vez del de la</tspan></text><text x="235" y="159.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="235" dy="0">réplica</tspan></text><polyline points="235,183 235,203" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="203" width="450" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="235" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="235" dy="0">2 La réplica debía reconstruirse a mano, sin automatizar ni</tspan></text><text x="235" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="235" dy="0">documentar bien</tspan></text><polyline points="235,273 235,293" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="293" width="450" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="235" y="323.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="235" dy="0">3 La replicación se detuvo: la primaria reciclaba WAL antes</tspan></text><text x="235" y="339.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="235" dy="0">de que la réplica lo leyera</tspan></text><polyline points="235,363 235,383" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="383" width="450" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="235" y="413.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="235" dy="0">4 La carga subió por más spam y un trabajo de borrado de</tspan></text><text x="235" y="429.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="235" dy="0">una cuenta</tspan></text><polyline points="235,453 235,473" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="473" width="450" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="503.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="235" dy="0">5 Un reporte de abuso programó la eliminación; el sistema</tspan></text><text x="235" y="519.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="235" dy="0">hace fácil pasar por alto los detalles</tspan></text><rect x="480" y="113" width="450" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="143.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">1 Hubo que restaurar desde staging, en discos lentos de</tspan></text><text x="705" y="159.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">otra región</tspan></text><polyline points="705,183 705,203" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="480" y="203" width="450" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="705" dy="0">2 Faltaban instantáneas de Azure y el respaldo lógico no</tspan></text><text x="705" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="705" dy="0">funcionaba</tspan></text><polyline points="705,273 705,293" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="480" y="293" width="450" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="323.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="705" dy="0">3 El respaldo lógico falló en silencio: 9.2 frente a 9.6 y</tspan></text><text x="705" y="339.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="705" dy="0">avisos rechazados</tspan></text><polyline points="705,363 705,383" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="480" y="383" width="450" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="413.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="705" dy="0">4 El procedimiento de respaldo no se probaba con</tspan></text><text x="705" y="429.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="705" dy="0">regularidad</tspan></text><polyline points="705,453 705,473" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="480" y="473" width="450" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="705" y="511.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="705" dy="0">5 Nadie era responsable de probarlo: no había propiedad</tspan></text><rect x="10" y="569" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="593.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada caja responde «¿por qué?» a la anterior. La última caja de cada cadena es la raíz: una técnica (un reporte de abuso) y</tspan></text><text x="470" y="610.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una organizativa (la falta de propiedad). Respeta el texto del postmortem.</tspan></text><text x="470" y="658.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
