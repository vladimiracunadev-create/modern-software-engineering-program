<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 448" width="940" height="448" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se perdió y qué se conservó, según dónde vivía el dato</title><desc id="d">Cuatro carriles en horas desde las 16:00 UTC del 31 de enero. Los datos de la base anteriores a las 17:20 se restauran de la instantánea; los creados entre las 17:20 y las 23:30 se pierden; los repositorios Git y las wikis en NFS se conservan; los proyectos creados en la ventana se reconstruyen desde sus repositorios sin incidencias ni solicitudes de fusión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="448" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se perdió y qué se conservó, según dónde vivía el dato</tspan></text><line x1="284" y1="83" x2="284" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="283" x2="284" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="362.5" y1="83" x2="362.5" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="362.5" y1="283" x2="362.5" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="362.5" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362.5" dy="0">1</tspan></text><line x1="441" y1="83" x2="441" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="441" y1="283" x2="441" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="441" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="441" dy="0">2</tspan></text><line x1="519.5" y1="83" x2="519.5" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="519.5" y1="283" x2="519.5" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="519.5" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="519.5" dy="0">3</tspan></text><line x1="598" y1="83" x2="598" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="598" y1="283" x2="598" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="598" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598" dy="0">4</tspan></text><line x1="676.5" y1="83" x2="676.5" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="676.5" y1="283" x2="676.5" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="676.5" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="676.5" dy="0">5</tspan></text><line x1="755" y1="83" x2="755" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="755" y1="283" x2="755" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="755" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755" dy="0">6</tspan></text><line x1="833.5" y1="83" x2="833.5" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="833.5" y1="283" x2="833.5" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="833.5" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="833.5" dy="0">7</tspan></text><line x1="912" y1="83" x2="912" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="283" x2="912" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">8</tspan></text><line x1="284" y1="283" x2="912" y2="283" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Base: anterior a las 17:20</tspan></text><text x="274" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Base: de 17:20 a 23:30</tspan></text><text x="274" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Repositorios y wikis (NFS)</tspan></text><text x="274" y="262.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Proyectos creados en la ventana</tspan></text><line x1="388.405" y1="75" x2="388.405" y2="283" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="388.405" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="388.405" dy="0">17:20</tspan></text><line x1="872.75" y1="75" x2="872.75" y2="283" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="872.75" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="872.75" dy="0">23:30</tspan></text><rect x="284" y="92" width="104.405" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="336.202" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="336.202" dy="0">ok</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="388.405" y="142" width="484.345" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="630.577" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="630.577" dy="0">perdido</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="284" y="192" width="628" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="598" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="598" dy="0">conservados</tspan></text><line x1="14" y1="233" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><rect x="388.405" y="242" width="484.345" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="630.577" y="262.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="630.577" dy="0">reconstruidos sin incidencias</tspan></text><text x="598" y="327" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598" dy="0">horas desde las 16:00 UTC del 31 de enero de 2017</tspan></text><rect x="10" y="341" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="365.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La pérdida es de metadatos de colaboración (proyectos, incidencias, comentarios, cuentas), no de código. El cierre de la</tspan></text><text x="470" y="382.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ventana aparece como 23:30 y como 00:00 en dos lugares del mismo postmortem; aquí se usa 23:30.</tspan></text><text x="470" y="430.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017). Cantidades estimadas por la empresa: al menos 5.000 proyectos, 5.000 comentarios y unas 700 cuentas.</tspan></text></svg>
