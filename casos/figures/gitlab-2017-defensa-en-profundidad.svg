<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 616" width="940" height="616" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce capas de control: diez no cumplieron su función el 31 de enero</title><desc id="d">Doce controles en tres filas: detección de abuso, archivado de WAL, réplica, procedimiento de resincronización, distinción visual de servidores, respaldo lógico, avisos por correo, instantáneas de Azure en bases de datos, instantánea LVM diaria, instantánea LVM manual, pruebas periódicas de restauración y propiedad de la durabilidad. Cada uno indica qué hizo el 31 de enero según el postmortem.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="616" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Doce capas de control: diez no cumplieron su función el 31 de enero</tspan></text><rect x="10" y="53" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">1 Detección de abuso</tspan></text><rect x="10" y="101" width="224" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="122" y="136.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="122" dy="0">Programó la eliminación de</tspan></text><text x="122" y="152.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="122" dy="0">una cuenta legítima</tspan></text><rect x="246" y="53" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="358" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358" dy="0">2 Archivado de WAL</tspan></text><rect x="246" y="101" width="224" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="358" y="144.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="358" dy="0">No existía</tspan></text><rect x="482" y="53" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="594" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="594" dy="0">3 Réplica db2</tspan></text><rect x="482" y="101" width="224" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="594" y="136.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="594" dy="0">Se atrasó y se vació; no era</tspan></text><text x="594" y="152.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="594" dy="0">un respaldo</tspan></text><rect x="718" y="53" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="830" dy="0">4 Resincronización</tspan></text><rect x="718" y="101" width="224" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="136.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Manual, sin automatizar ni</tspan></text><text x="830" y="152.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">documentar bien</tspan></text><rect x="10" y="203" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="228.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">5 Distinguir servidores</tspan></text><rect x="10" y="251" width="224" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="122" y="286.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="122" dy="0">El intérprete no mostraba</tspan></text><text x="122" y="302.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="122" dy="0">servidor y entorno</tspan></text><rect x="246" y="203" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="358" y="228.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358" dy="0">6 Respaldo pg_dump</tspan></text><rect x="246" y="251" width="224" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="358" y="286.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="358" dy="0">Falló en silencio: 9.2</tspan></text><text x="358" y="302.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="358" dy="0">frente a 9.6</tspan></text><rect x="482" y="203" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="594" y="228.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="594" dy="0">7 Avisos por correo</tspan></text><rect x="482" y="251" width="224" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="594" y="286.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="594" dy="0">Rechazados por falta de</tspan></text><text x="594" y="302.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="594" dy="0">DMARC</tspan></text><rect x="718" y="203" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="228.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="830" dy="0">8 Azure en bases</tspan></text><rect x="718" y="251" width="224" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">No estaban habilitadas</tspan></text><rect x="10" y="353" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="378.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">9 LVM diaria</tspan></text><rect x="10" y="401" width="224" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="122" y="436.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="122" dy="0">Existía; de casi 24 horas</tspan></text><text x="122" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="122" dy="0">atrás</tspan></text><rect x="246" y="353" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="358" y="378.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358" dy="0">10 LVM manual</tspan></text><rect x="246" y="401" width="224" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358" y="436.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358" dy="0">De las 17:20; la única</tspan></text><text x="358" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358" dy="0">fuente útil</tspan></text><rect x="482" y="353" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="594" y="378.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="594" dy="0">11 Pruebas de restauración</tspan></text><rect x="482" y="401" width="224" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="594" y="444.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="594" dy="0">No se hacían con regularidad</tspan></text><rect x="718" y="353" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="378.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="830" dy="0">12 Propiedad</tspan></text><rect x="718" y="401" width="224" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="436.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Nadie era responsable de las</tspan></text><text x="830" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">pruebas</tspan></text><rect x="10" y="509" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="533.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Coral: no cumplió su función. Dorado: cumplió de forma parcial. Teal: sirvió. Diez de doce fallaron y varias comparten una</tspan></text><text x="470" y="550.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">misma suposición («otro mecanismo respaldará»), lectura de este programa.</tspan></text><text x="470" y="598.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
