<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 428" width="940" height="428" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">GitLab.com en enero de 2017: dónde vivía cada dato y quién quedó fuera del incidente</title><desc id="d">Diagrama de contexto. Dentro del servicio GitLab.com: usuarios, aplicación, base de datos PostgreSQL, servidores NFS con repositorios y wikis, entorno de staging y copias en Amazon S3. Fuera del servicio: ediciones Enterprise, GitHost y autoalojadas, que no se vieron afectadas, y el equipo de GitLab, que usa GitLab.com para desarrollar GitLab.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="428" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">GitLab.com en enero de 2017: dónde vivía cada dato y quién quedó fuera del incidente</tspan></text><rect x="10" y="45" width="640" height="250" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Servicio GitLab.com</tspan></text><rect x="28" y="85" width="190" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="123" y="100" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="123" dy="0">Usuarios:</tspan></text><text x="123" y="116.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="123" dy="0">desarrolladores,</tspan></text><text x="123" y="133.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="123" dy="0">equipos y CI</tspan></text><rect x="238" y="85" width="190" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="333" y="116.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="333" dy="0">Aplicación GitLab</tspan></text><rect x="448" y="85" width="190" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="543" y="108.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="543" dy="0">Base de datos</tspan></text><text x="543" y="124.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="543" dy="0">PostgreSQL</tspan></text><rect x="28" y="205" width="190" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="123" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123" dy="0">Servidores NFS:</tspan></text><text x="123" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123" dy="0">repositorios y wikis</tspan></text><rect x="238" y="205" width="190" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="333" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="333" dy="0">Staging: copia diaria</tspan></text><text x="333" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="333" dy="0">de la base</tspan></text><rect x="448" y="205" width="190" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="543" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="543" dy="0">Copias pg_dump en</tspan></text><text x="543" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="543" dy="0">Amazon S3</tspan></text><polyline points="218,113 238,113" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="428,113 448,113" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="270,141 270,173 123,173 123,205" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="500,141 500,173 333,173 333,205" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="590,141 590,205" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="680" y="53" width="250" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="6 4"/><text x="805" y="90" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="805" dy="0">Enterprise, GitHost y</tspan></text><text x="805" y="106.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="805" dy="0">autoalojados: no se vieron</tspan></text><text x="805" y="123.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="805" dy="0">afectados</tspan></text><rect x="680" y="185" width="250" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="805" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="805" dy="0">Equipo de GitLab: usa</tspan></text><text x="805" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="805" dy="0">GitLab.com para desarrollar</tspan></text><text x="805" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="805" dy="0">GitLab</tspan></text><rect x="10" y="321" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las flechas punteadas son copias de respaldo. La partición entre base de datos (afectada) y repositorios (a salvo) acotó el</tspan></text><text x="470" y="362.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">daño. Panorama de enero de 2017; sin cifras de usuarios porque el postmortem no las da.</tspan></text><text x="470" y="410.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
