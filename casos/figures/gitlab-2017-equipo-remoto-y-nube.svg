<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 541" width="940" height="541" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Equipo remoto y nube: sin sede operativa, con el servicio en Azure y los respaldos en S3</title><desc id="d">Esquema de relaciones con un equipo totalmente remoto en el centro. Arriba: servicio en Azure, respaldos en Amazon S3, servidores NFS con repositorios y entorno de staging. Abajo: coordinación por Slack, documento público y transmisión en vivo, y clientes de GitLab.com y de ediciones autoalojadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="541" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Equipo remoto y nube: sin sede operativa, con el servicio en Azure y los respaldos en S3</tspan></text><rect x="24" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="131" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">Servicio GitLab.com en</tspan></text><text x="131" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">Azure</tspan></text><rect x="250" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">Respaldos lógicos en</tspan></text><text x="357" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">Amazon S3</tspan></text><rect x="476" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="583" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">Servidores NFS:</tspan></text><text x="583" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">repositorios y wikis</tspan></text><rect x="702" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="809" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="809" dy="0">Staging en otra región</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="230.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Equipo remoto: sin sede operativa</tspan></text><polyline points="131,125 334.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="357,125 424.8,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="583,125 515.2,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="809,125 605.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="137" y="345" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="244" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244" dy="0">Coordinación por Slack</tspan></text><rect x="363" y="345" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Documento público y</tspan></text><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">transmisión en vivo</tspan></text><rect x="589" y="345" width="214" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="696" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="696" dy="0">Clientes de GitLab.com y</tspan></text><text x="696" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="696" dy="0">de ediciones autoalojadas</tspan></text><polyline points="379.6,259 244,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,259 470,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="560.4,259 696,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="439" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="469.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cifras de plantilla de 2021 y 2026; las de 2017 no se conocen. El postmortem no dice dónde estaba cada ingeniero.</tspan></text><text x="470" y="523" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017) y S-1 de 2021; esquema propio.</tspan></text></svg>
