<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 546" width="940" height="546" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema del negocio: el alcance del daño coincidió con el modelo alojado</title><desc id="d">Esquema con el producto GitLab en el centro. Arriba: usuarios de GitLab.com que usan el servicio alojado, clientes de ediciones Enterprise y de GitHost, usuarios de la edición comunitaria autoalojada y el equipo que desarrolla GitLab con GitLab.com. Abajo: Azure y S3 como infraestructura, y la confianza en la durabilidad como valor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="546" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema del negocio: el alcance del daño coincidió con el modelo alojado</tspan></text><rect x="137" y="51" width="214" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="244" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="244" dy="0">Usuarios de GitLab.com:</tspan></text><text x="244" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="244" dy="0">servicio alojado</tspan></text><rect x="363" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Enterprise y GitHost: sin</tspan></text><text x="470" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">afectación</tspan></text><rect x="589" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="696" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">CE autoalojada: sin</tspan></text><text x="696" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">afectación</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="230.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Producto GitLab</tspan></text><polyline points="244,125 379.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="244" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">afectados</tspan></text><polyline points="470,125 470,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="696,125 560.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="137" y="345" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="244" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="244" dy="0">Equipo de GitLab:</tspan></text><text x="244" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="244" dy="0">desarrolla con GitLab.com</tspan></text><rect x="363" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Azure y S3:</tspan></text><text x="470" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">infraestructura del</tspan></text><text x="470" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">servicio</tspan></text><rect x="589" y="345" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="696" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="696" dy="0">Confianza en la</tspan></text><text x="696" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="696" dy="0">durabilidad: parte del</tspan></text><text x="696" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="696" dy="0">valor</tspan></text><polyline points="379.6,259 244,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,259 470,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="560.4,259 696,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="439" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ingresos del S-1 de 2021: 81,2 millones (ejercicio 2020) y 152,2 millones (2021). Los de 2017 y su reparto por producto no</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se conocen.</tspan></text><text x="470" y="528.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017) y S-1 de 2021; esquema propio.</tspan></text></svg>
