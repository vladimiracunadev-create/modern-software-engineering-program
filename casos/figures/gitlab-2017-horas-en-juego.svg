<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Datos y tiempo en juego: lo que dependía de cuál respaldo se usara</title><desc id="d">Barras horizontales en horas. Restaurar la instantánea diaria habría costado casi 24 horas de datos; la instantánea manual de las 17:20, unas 6. Copiar la base desde staging a producción llevó unas 18 horas, y el servicio estuvo unas 18 horas fuera de línea.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Datos y tiempo en juego: lo que dependía de cuál respaldo se usara</tspan></text><line x1="324" y1="49" x2="324" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="225" x2="324" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="439.176" y1="49" x2="439.176" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="439.176" y1="225" x2="439.176" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="439.176" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.176" dy="0">5</tspan></text><line x1="554.352" y1="49" x2="554.352" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="554.352" y1="225" x2="554.352" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="554.352" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="554.352" dy="0">10</tspan></text><line x1="669.528" y1="49" x2="669.528" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="669.528" y1="225" x2="669.528" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="669.528" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="669.528" dy="0">15</tspan></text><line x1="784.704" y1="49" x2="784.704" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="784.704" y1="225" x2="784.704" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="784.704" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.704" dy="0">20</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="225" x2="899.88" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">25</tspan></text><line x1="324" y1="225" x2="899.88" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Datos perdidos con la instantánea diaria</tspan></text><text x="314" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Datos perdidos con la instantánea de las</tspan></text><text x="314" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">17:20</tspan></text><text x="314" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Copia de staging a producción</tspan></text><text x="314" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Servicio fuera de línea</tspan></text><rect x="324" y="55" width="552.845" height="32" rx="3" fill="#102a43"/><text x="883.845" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="883.845" dy="0">24</tspan></text><rect x="324" y="99" width="138.211" height="32" rx="3" fill="#102a43"/><text x="469.211" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="469.211" dy="0">6</tspan></text><rect x="324" y="143" width="414.634" height="32" rx="3" fill="#102a43"/><text x="745.634" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="745.634" dy="0">18</tspan></text><rect x="324" y="187" width="414.634" height="32" rx="3" fill="#102a43"/><text x="745.634" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="745.634" dy="0">18</tspan></text><text x="611.94" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="611.94" dy="0">horas (aproximadas)</tspan></text><rect x="10" y="283" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las cuatro cifras vienen del postmortem de GitLab como «casi 24 horas», «unas 6 horas», «unas 18 horas» y «unas 18 horas».</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Son órdenes de magnitud: ninguna tiene precisión de minutos. La barra de datos y la de tiempo no se suman.</tspan></text><text x="470" y="372.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017). Cifras aproximadas.</tspan></text></svg>
