<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="940" height="580" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pila de hardware: servidores de base de datos, NFS y discos de Azure donde el más barato fue el cuello de botella</title><desc id="d">Cinco capas: aplicación, servidores de base de datos db1 y db2 con volúmenes LVM, servidores NFS con repositorios, discos de Azure de staging sin almacenamiento premium y almacenamiento de objetos S3. A la derecha, las limitaciones documentadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="580" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pila de hardware: servidores de base de datos, NFS y discos de Azure donde el más barato fue el cuello de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">botella</tspan></text><rect x="10" y="72" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="108.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Aplicación</tspan></text><rect x="214" y="72" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Servidores de aplicación; allí corría pg_dump</tspan></text><rect x="10" y="152" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="188.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">db1 y db2</tspan></text><rect x="214" y="152" width="430" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="429" y="188.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="429" dy="0">Primaria y secundaria; volúmenes con instantáneas LVM</tspan></text><rect x="10" y="232" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="268.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Servidores NFS</tspan></text><rect x="214" y="232" width="430" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">Repositorios Git y wikis; instantáneas de Azure cada 24</tspan></text><text x="429" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">h</tspan></text><rect x="10" y="312" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="348.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Discos de staging</tspan></text><rect x="214" y="312" width="430" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429" y="348.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">Azure clásico sin almacenamiento premium; unos 60 Mbps</tspan></text><rect x="10" y="392" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="428.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Amazon S3</tspan></text><rect x="214" y="392" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="428.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Respaldos lógicos; el depósito estaba vacío</tspan></text><rect x="668" y="72" width="262" height="114.667" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="799" y="124.653" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="799" dy="0">max_connections en 8.000: obligó</tspan></text><text x="799" y="141.293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="799" dy="0">a bajarlo a 2.000 para reiniciar</tspan></text><rect x="668" y="200.667" width="262" height="114.667" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="799" y="253.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">Cuentas de almacenamiento de</tspan></text><text x="799" y="269.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">Azure: unos 30 TB cada una</tspan></text><rect x="668" y="329.333" width="262" height="114.667" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="799" y="381.987" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">No se sabe: núcleos, memoria y</tspan></text><text x="799" y="398.627" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">tamaño de volúmenes</tspan></text><rect x="10" y="478" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="508.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Especificaciones de hardware no públicas; los datos de la derecha son del postmortem.</tspan></text><text x="470" y="562" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017) y S-1 de 2021; esquema propio.</tspan></text></svg>
