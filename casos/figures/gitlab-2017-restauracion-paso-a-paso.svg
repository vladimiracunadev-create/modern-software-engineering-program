<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 438" width="940" height="438" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Restauración paso a paso: casi todo el tiempo se fue en una sola copia</title><desc id="d">Dos filas de cajas con los pasos de la restauración: elegir la instantánea de las 17:20; copiar el directorio de datos de staging a producción durante unas 18 horas a unos 60 Mbps; copiar en paralelo la instantánea que quizá conserva los webhooks; producción restaurada sin webhooks el 1 de febrero a las 17:00 UTC; reconstruir los webhooks desde una base de apoyo; sumar 100.000 a las secuencias; reactivar gradualmente hacia las 18:00 UTC.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="438" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Restauración paso a paso: casi todo el tiempo se fue en una sola copia</tspan></text><rect x="10" y="55" width="214" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117" y="83.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117" dy="0">1 Elegir la instantánea de</tspan></text><text x="117" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117" dy="0">las 17:20: unas 6 horas de</tspan></text><text x="117" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117" dy="0">datos perdidos y no casi</tspan></text><text x="117" y="133.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117" dy="0">24</tspan></text><rect x="245" y="55" width="214" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352" y="83.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352" dy="0">2 Copiar el directorio de</tspan></text><text x="352" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352" dy="0">datos de staging a</tspan></text><text x="352" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352" dy="0">producción: unas 18 horas</tspan></text><text x="352" y="133.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352" dy="0">a unos 60 Mbps</tspan></text><polyline points="224,105 245,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="480" y="55" width="214" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="587" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587" dy="0">3 En paralelo, copiar la</tspan></text><text x="587" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587" dy="0">instantánea que quizá aún</tspan></text><text x="587" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587" dy="0">tiene los webhooks</tspan></text><polyline points="459,105 480,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="715" y="55" width="214" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822" dy="0">4 Producción restaurada</tspan></text><text x="822" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822" dy="0">sin webhooks: 17:00 UTC</tspan></text><text x="822" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822" dy="0">del 1 de febrero</tspan></text><polyline points="694,105 715,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="822,155 822,185 117,185 117,215" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="215" width="214" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="117" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="117" dy="0">5 Base de apoyo: volcar la</tspan></text><text x="117" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="117" dy="0">tabla de webhooks e</tspan></text><text x="117" y="280.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="117" dy="0">importarla</tspan></text><rect x="245" y="215" width="214" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="352" dy="0">6 Sumar 100.000 a las</tspan></text><text x="352" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="352" dy="0">secuencias para no</tspan></text><text x="352" y="280.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="352" dy="0">reutilizar identificadores</tspan></text><polyline points="224,260 245,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="480" y="215" width="214" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587" dy="0">7 Reactivar GitLab.com de</tspan></text><text x="587" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587" dy="0">forma gradual: hacia las</tspan></text><text x="587" y="280.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587" dy="0">18:00 UTC</tspan></text><polyline points="459,260 480,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="715" y="215" width="214" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="255.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Servicio restablecido tras</tspan></text><text x="822" y="271.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">unas 18 horas</tspan></text><polyline points="694,260 715,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="331" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="355.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La caja coral concentra el tiempo; las doradas existen porque la restauración vino de una copia anterior. El postmortem no</tspan></text><text x="470" y="372.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">desglosa el tiempo de los pasos que no son la copia.</tspan></text><text x="470" y="420.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
