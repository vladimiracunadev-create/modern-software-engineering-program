<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 808" width="940" height="808" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuencia de la noche: de la réplica caída al directorio equivocado</title><desc id="d">Diagrama de secuencia con cuatro líneas de vida: ingenieros, db2, pg_basebackup y db1. A las 23:00 falla la réplica; se vacía el directorio de db2; pg_basebackup se cuelga; se sube max_wal_senders de 3 a 32; PostgreSQL no reinicia por semáforos y se baja max_connections de 8000 a 2000; strace no ayuda; hacia las 23:30 se vacía por error el directorio de datos de db1 y se eliminan unos 300 GB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="808" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Secuencia de la noche: de la réplica caída al directorio equivocado</tspan></text><rect x="5" y="45" width="190" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="100" y="70.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="100" dy="0">Ingenieros</tspan></text><line x1="100" y1="89" x2="100" y2="745" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="235" y="45" width="190" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="330" y="70.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="330" dy="0">db2: secundaria</tspan></text><line x1="330" y1="89" x2="330" y2="745" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="475" y="45" width="190" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="570" y="70.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="570" dy="0">pg_basebackup</tspan></text><line x1="570" y1="89" x2="570" y2="745" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="735" y="45" width="190" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="70.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830" dy="0">db1: primaria</tspan></text><line x1="830" y1="89" x2="830" y2="745" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="100,137 330,137" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="215" y="127" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="215" dy="0">23:00 la réplica falla: WAL reciclado</tspan></text><polyline points="100,187 330,187" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="215" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="215" dy="0">vacían el directorio de db2</tspan></text><polyline points="100,237 570,237" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="335" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="335" dy="0">lanzan pg_basebackup</tspan></text><polyline points="570,287 830,287" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="700" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">espera datos de replicación</tspan></text><polyline points="100,337 830,337" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="465" y="327" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">max_wal_senders de 3 a 32</tspan></text><rect x="730" y="357" width="200" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="830" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">no reinicia: demasiados</tspan></text><text x="830" y="393.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">semáforos con 8000</tspan></text><text x="830" y="410.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">conexiones</tspan></text><polyline points="100,449 830,449" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="465" y="439" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">max_connections de 8000 a 2000</tspan></text><polyline points="100,499 570,499" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="335" y="489" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="335" dy="0">strace: se queda en una llamada poll</tspan></text><polyline points="100,559 830,559" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="465" y="549" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">≈23:30 vacían el directorio creyendo estar en db2</tspan></text><rect x="730" y="585" width="200" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="612" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">≈300 GB eliminados; se</tspan></text><text x="830" y="628.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">interrumpe a 1 o 2</tspan></text><text x="830" y="645.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">segundos</tspan></text><rect x="230" y="605" width="200" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="330" y="633.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">ya vacía: no sirve para</tspan></text><text x="330" y="649.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">recuperar</tspan></text><rect x="10" y="701" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="725.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre las dos vaciadas hay diagnóstico razonable que no explicaba el silencio de la herramienta. Los intervalos no son</tspan></text><text x="470" y="742.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escalas de tiempo: el postmortem solo da las 23:00 y las 23:30.</tspan></text><text x="470" y="790.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
