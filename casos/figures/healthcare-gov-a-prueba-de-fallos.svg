<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 576" width="940" height="576" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A prueba de fallos: lo que existía, lo que falló y lo que debió existir</title><desc id="d">Tres columnas: mecanismos que existían (verificación independiente, revisiones de gobierno en papel, ampliación de capacidad de última hora, cartas al contratista), los que fallaron o faltaban (pruebas de extremo a extremo, plan de capacidad, criterio de salida con veto, monitoreo, apertura gradual) y los que debieron existir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="576" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A prueba de fallos: lo que existía, lo que falló y lo que debió existir</tspan></text><rect x="10" y="51" width="296" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="158" dy="0">Existían (documentado)</tspan></text><rect x="10" y="103" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="128.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Verificación independiente con</tspan></text><text x="158" y="144.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">hallazgos de septiembre</tspan></text><rect x="10" y="171" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Marco de cuatro revisiones de</tspan></text><text x="158" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">gobierno</tspan></text><rect x="10" y="239" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="264.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Ampliación urgente de capacidad en 72</tspan></text><text x="158" y="280.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">horas</tspan></text><rect x="10" y="307" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="340.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Cartas de preocupación al contratista</tspan></text><rect x="10" y="375" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="400.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Revisión de preparación operativa</tspan></text><text x="158" y="416.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">parcial</tspan></text><rect x="316" y="51" width="296" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="464" dy="0">Fallaron o faltaban (documentado)</tspan></text><rect x="316" y="103" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="128.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Pruebas de extremo a extremo</tspan></text><text x="464" y="144.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">requeridas</tspan></text><rect x="316" y="171" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Plan de capacidad y requisitos de</tspan></text><text x="464" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">hardware</tspan></text><rect x="316" y="239" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Criterio de salida con poder de veto</tspan></text><rect x="316" y="307" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="340.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Monitoreo y respuesta en tiempo real</tspan></text><rect x="316" y="375" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="408.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Apertura gradual con vuelta atrás</tspan></text><rect x="622" y="51" width="296" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="770" dy="0">Debieron existir (análisis propio)</tspan></text><rect x="622" y="103" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="136.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Criterio de salida de cinco preguntas</tspan></text><rect x="622" y="171" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="204.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Carga con margen sobre la demanda</tspan></text><rect x="622" y="239" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Apertura por cohortes y regiones</tspan></text><rect x="622" y="307" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="340.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Integrador único desde el inicio</tspan></text><rect x="622" y="375" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="408.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Canal formal para malas noticias</tspan></text><rect x="10" y="453" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="477.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: las barreras que existían medían o informaban pero ninguna tenía poder de detener el lanzamiento. La</tspan></text><text x="470" y="494.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">recuperación posterior añadió justamente lo que faltaba: un integrador, una sala de crisis y monitoreo. La columna de la</tspan></text><text x="470" y="511.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">derecha es análisis propio.</tspan></text><text x="470" y="558.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: GAO-14-694, GAO-15-238, OEI-06-14-00350 y CMS (1 de diciembre de 2013); tercera columna: análisis propio.</tspan></text></svg>
