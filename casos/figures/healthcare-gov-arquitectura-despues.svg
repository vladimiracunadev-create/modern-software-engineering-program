<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 552" width="940" height="552" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Gobierno «después»: lo que se aplicó tras el fallo y lo que faltó antes</title><desc id="d">Esquema de la recuperación documentada y de las barreras propuestas: integrador general único, sala de crisis dos veces al día, monitoreo instrumentado y sistemas de respaldo, más pruebas con congelación de código en la segunda inscripción, y criterios de salida y apertura gradual propuestos para el lanzamiento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="552" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Gobierno «después»: lo que se aplicó tras el fallo y lo que faltó antes</tspan></text><text x="14" y="63" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Aplicado tras el lanzamiento (documentado)</tspan></text><rect x="10" y="77" width="210" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="115" y="114.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="115" dy="0">Integrador general único</tspan></text><text x="115" y="130.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="115" dy="0">(QSSI)</tspan></text><rect x="240" y="77" width="210" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="345" y="114.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="345" dy="0">Sala de crisis dos veces</tspan></text><text x="345" y="130.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="345" dy="0">al día con datos</tspan></text><rect x="470" y="77" width="210" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="575" y="114.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="575" dy="0">Monitoreo instrumentado en</tspan></text><text x="575" y="130.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="575" dy="0">tiempo real</tspan></text><rect x="700" y="77" width="230" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="815" y="114.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="815" dy="0">Respaldo, más capacidad y</tspan></text><text x="815" y="130.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="815" dy="0">re-ingeniería de identidad</tspan></text><text x="14" y="193" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Segunda inscripción (documentado): calidad antes que puntualidad</tspan></text><rect x="10" y="207" width="300" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="160" y="240.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">Fecha de congelación de código el 7 de</tspan></text><text x="160" y="256.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">octubre de 2014</tspan></text><rect x="330" y="207" width="290" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="240.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Más infraestructura de prueba y</tspan></text><text x="475" y="256.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">coordinación de entornos</tspan></text><rect x="640" y="207" width="290" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="785" y="240.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">Capacidad para 250 000 usuarios</tspan></text><text x="785" y="256.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">simultáneos sin caída</tspan></text><text x="14" y="315" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Habría cambiado la decisión (análisis propio)</tspan></text><rect x="10" y="329" width="300" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="160" y="362.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="160" dy="0">Criterio de salida con veto: sin</tspan></text><text x="160" y="378.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="160" dy="0">pruebas pasadas no hay lanzamiento</tspan></text><rect x="330" y="329" width="290" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="362.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Apertura gradual por regiones con</tspan></text><text x="475" y="378.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">vuelta atrás</tspan></text><rect x="640" y="329" width="290" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="362.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Canal formal para malas noticias</tspan></text><text x="785" y="378.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">hacia la dirección</tspan></text><rect x="10" y="429" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="453.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: lo que se hizo después (arriba) fue gobierno y observabilidad, no una tecnología nueva. Abajo, tres barreras</tspan></text><text x="470" y="470.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">que habrían movido la decisión antes de abrir. La recuperación en dos meses muestra que el sistema era recuperable con otra</tspan></text><text x="470" y="487.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">gestión.</tspan></text><text x="470" y="534.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: CMS (1 de diciembre de 2013), GAO-15-238 y OEI-06-14-00350; lo rotulado «análisis propio» no es una conclusión de esas fuentes.</tspan></text></svg>
