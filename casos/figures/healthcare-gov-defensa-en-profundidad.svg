<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defensa en profundidad: ocho barreras antes del lanzamiento y por qué no frenaron</title><desc id="d">Esquema de láminas con huecos: estrategia de adquisición, revisiones de gobierno, gestión de requisitos, verificación independiente, pruebas de extremo a extremo, plan de capacidad, exigencia al contratista y monitoreo en tiempo real; ninguna detuvo la fecha de lanzamiento; la flecha roja atraviesa todos los huecos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Defensa en profundidad: ocho barreras antes del lanzamiento y por qué no frenaron</tspan></text><rect x="30" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="42" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="9" y="231" width="104" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="61" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">Estrategia</tspan></text><text x="61" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">de</tspan></text><text x="61" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">adquisición</tspan></text><text x="61" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">(no se</tspan></text><text x="61" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">elaboró)</tspan></text><rect x="143" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="155" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="122" y="231" width="104" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="174" y="268.04" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="174" dy="0">Revisiones</tspan></text><text x="174" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="174" dy="0">de gobierno</tspan></text><text x="174" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="174" dy="0">(movidas a</tspan></text><text x="174" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="174" dy="0">septiembre,</tspan></text><text x="174" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="174" dy="0">sin</tspan></text><text x="174" y="351.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="174" dy="0">aprobaciones)</tspan></text><rect x="256" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="268" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="235" y="231" width="104" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="287" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="287" dy="0">Gestión de</tspan></text><text x="287" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="287" dy="0">requisitos</tspan></text><text x="287" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="287" dy="0">(cambiantes,</tspan></text><text x="287" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="287" dy="0">sin trazar</tspan></text><text x="287" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="287" dy="0">siempre)</tspan></text><rect x="369" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="381" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="348" y="231" width="104" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="400" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="400" dy="0">Verificación</tspan></text><text x="400" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="400" dy="0">independiente</tspan></text><text x="400" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="400" dy="0">(45</tspan></text><text x="400" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="400" dy="0">críticos y</tspan></text><text x="400" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="400" dy="0">324 graves)</tspan></text><rect x="482" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="494" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="461" y="231" width="104" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="513" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">Pruebas de</tspan></text><text x="513" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">extremo a</tspan></text><text x="513" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">extremo (no</tspan></text><text x="513" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">se</tspan></text><text x="513" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">hicieron)</tspan></text><rect x="595" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="607" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="574" y="231" width="104" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="626" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">Plan de</tspan></text><text x="626" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">capacidad</tspan></text><text x="626" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">(no se</tspan></text><text x="626" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">elaboró)</tspan></text><rect x="708" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="720" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="687" y="231" width="104" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="739" y="268.04" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">Exigencia</tspan></text><text x="739" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">al</tspan></text><text x="739" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">contratista</tspan></text><text x="739" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">(cartas;</tspan></text><text x="739" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">sin retener</tspan></text><text x="739" y="351.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">honorarios)</tspan></text><rect x="821" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="833" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="800" y="231" width="104" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="852" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">Monitoreo</tspan></text><text x="852" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">en tiempo</tspan></text><text x="852" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">real</tspan></text><text x="852" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">(insuficiente)</tspan></text><polyline points="10,136 930,136" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: varias barreras existían en papel (revisiones, verificación, cartas al contratista) y no detuvieron el</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">lanzamiento, porque ninguna tenía poder de veto sobre la fecha. Rojo: ausente o insuficiente; dorado: existió con eficacia</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">parcial. La flecha es la decisión de lanzar el 1 de octubre.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en GAO-14-694, GAO-15-238 y OEI-06-14-00350; no es una conclusión de esas fuentes.</tspan></text></svg>
