<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Flujo de datos: de lo que declara el solicitante a lo que el sistema puede confirmar</title><desc id="d">Esquema de datos: la solicitud con ingresos y ciudadanía se contrasta con fuentes federales a través del centro de datos; los desacuerdos se acumulan como inconsistencias que requieren documentos; las aseguradoras suben los planes al módulo de gestión de planes y reciben las inscripciones; los pagos y la conciliación del módulo financiero estaban aplazados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Flujo de datos: de lo que declara el solicitante a lo que el sistema puede confirmar</tspan></text><rect x="10" y="51" width="190" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="105" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="105" dy="0">Solicitud: identidad,</tspan></text><text x="105" y="99.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="105" dy="0">hogar, ingresos,</tspan></text><text x="105" y="116.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="105" dy="0">ciudadanía</tspan></text><rect x="250" y="51" width="190" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="345" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">Verificación contra</tspan></text><text x="345" y="99.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">fuentes federales vía</tspan></text><text x="345" y="116.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">el centro de datos</tspan></text><rect x="490" y="51" width="200" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="590" y="91.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">Coincide: elegibilidad y</tspan></text><text x="590" y="107.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">subsidio calculados</tspan></text><rect x="490" y="171" width="200" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="590" y="194.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">No coincide:</tspan></text><text x="590" y="211.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">inconsistencia; el</tspan></text><text x="590" y="227.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">solicitante debe aportar</tspan></text><text x="590" y="244.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">documentos</tspan></text><rect x="740" y="51" width="190" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="835" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835" dy="0">Plan elegido y</tspan></text><text x="835" y="99.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835" dy="0">inscripción enviada a</tspan></text><text x="835" y="116.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835" dy="0">la aseguradora</tspan></text><rect x="10" y="171" width="190" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="105" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="105" dy="0">Aseguradoras: cargan</tspan></text><text x="105" y="219.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="105" dy="0">planes antes y reciben</tspan></text><text x="105" y="236.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="105" dy="0">las inscripciones</tspan></text><rect x="740" y="171" width="190" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="835" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="835" dy="0">Pagos y conciliación:</tspan></text><text x="835" y="219.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="835" dy="0">módulo financiero</tspan></text><text x="835" y="236.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="835" dy="0">aplazado</tspan></text><polyline points="200,96 250,96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="440,81 490,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="465" y="69" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">sí</tspan></text><polyline points="440,121 520,171" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="436" y="155" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="436" dy="0">no</tspan></text><polyline points="690,96 740,96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="835,141 835,171" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: cada «no coincide» crea trabajo humano y de documentos que no escala con el pico del primer día. A febrero</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 2014 quedaban sin resolver unos 2,6 millones de 2,9 millones de inconsistencias. Una verificación que falla cuesta mucho</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">más que una que pasa.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: GAO-14-694 (módulo financiero aplazado) y OEI-06-14-00350 (inconsistencias, febrero de 2014). Esquema de datos funcional propio.</tspan></text></svg>
