<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="940" height="580" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware y software de HealthCare.gov: lo que se sabe y lo que no es público</title><desc id="d">Pila de seis capas: aplicaciones del mercado federal con tres módulos, bases de datos relacional y NoSQL, gestión de identidad, centro de datos de servicios, infraestructura de cómputo en nube a cargo de Terremark, y red y hardware; solo se documentan las aplicaciones, la elección de bases de datos y la capacidad añadida; lenguajes, sistemas operativos y hardware concreto no constan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="580" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware y software de HealthCare.gov: lo que se sabe y lo que no es público</tspan></text><rect x="10" y="51" width="640" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="75.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">Aplicaciones: FFM de CGI Federal con elegibilidad e inscripción, gestión de planes y</tspan></text><text x="330" y="91.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">financiero; desarrollo iterativo (documentado)</tspan></text><rect x="670" y="51" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">GAO-14-694</tspan></text><rect x="10" y="117" width="640" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="141.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">Bases de datos: relacional (Oracle citada) y NoSQL de un proveedor concreto elegido</tspan></text><text x="330" y="157.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">en enero de 2012 (documentado)</tspan></text><rect x="670" y="117" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">OEI-06-14-00350</tspan></text><rect x="10" y="183" width="640" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="215.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">Identidad (EIDM) y centro de datos (Hub de QSSI) (documentado)</tspan></text><rect x="670" y="183" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="215.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">GAO-15-238</tspan></text><rect x="10" y="249" width="640" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="330" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="330" dy="0">Lenguajes, frameworks, sistemas operativos y herramientas de despliegue (no se sabe)</tspan></text><rect x="670" y="249" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">no consta</tspan></text><rect x="10" y="315" width="640" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="330" y="339.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="330" dy="0">Cómputo: entorno en nube de Terremark; máquinas virtuales; base de datos física para</tspan></text><text x="330" y="355.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="330" dy="0">identidad; servidores duplicados (parcial)</tspan></text><rect x="670" y="315" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="347.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">OEI-06-14-00350; GAO-15-238</tspan></text><rect x="10" y="381" width="640" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="330" y="413.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="330" dy="0">Hardware, red y centros de datos: modelo, ubicación y topología (no se sabe)</tspan></text><rect x="670" y="381" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="413.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">no consta</tspan></text><rect x="10" y="457" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="481.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: las auditorías describen contratos, módulos, bases de datos y capacidad, no el código ni el hardware. La</tspan></text><text x="470" y="498.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">decisión sobre la base de datos y el cómputo en la nube son los datos técnicos más concretos que hay. Aquí no se inventa</tspan></text><text x="470" y="515.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ningún lenguaje ni modelo de servidor.</tspan></text><text x="470" y="562.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: GAO-14-694, GAO-15-238 y OEI-06-14-00350. Verde: documentado; dorado: parcial; gris: no se sabe.</tspan></text></svg>
