<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo comprometido al inicio frente a lo comprometido después</title><desc id="d">Puntos huecos y rellenos con la obligación inicial y la final para tres contratos: FFM de 55,7 a 209,6 millones; centro de datos de 29,9 a 84,5; y el contrato de Accenture de 91 en enero de 2014 a más de 175 en junio de 2014.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lo comprometido al inicio frente a lo comprometido después</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Inicial</tspan></text><circle cx="122.78" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Después</tspan></text><line x1="412.3" y1="77" x2="412.3" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="412.3" y1="209" x2="412.3" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="412.3" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412.3" dy="0">0</tspan></text><line x1="492.132" y1="77" x2="492.132" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="492.132" y1="209" x2="492.132" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="492.132" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492.132" dy="0">50</tspan></text><line x1="571.964" y1="77" x2="571.964" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="571.964" y1="209" x2="571.964" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="571.964" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571.964" dy="0">100</tspan></text><line x1="651.796" y1="77" x2="651.796" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="651.796" y1="209" x2="651.796" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="651.796" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="651.796" dy="0">150</tspan></text><line x1="731.628" y1="77" x2="731.628" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="731.628" y1="209" x2="731.628" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="731.628" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="731.628" dy="0">200</tspan></text><line x1="811.46" y1="77" x2="811.46" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="811.46" y1="209" x2="811.46" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="811.46" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="811.46" dy="0">250</tspan></text><line x1="412.3" y1="209" x2="811.46" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">FFM: de septiembre de 2011 a febrero de 2014</tspan></text><text x="344" y="139" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Centro de datos: septiembre de 2011 a</tspan></text><text x="344" y="156" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">septiembre de 2013</tspan></text><text x="344" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Contrato Accenture: enero a junio de 2014</tspan></text><line x1="501.233" y1="99" x2="746.956" y2="99" stroke="#c0432f" stroke-width="4"/><circle cx="501.233" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="746.956" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="489.233" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="489.233" dy="0">55,7</tspan></text><text x="758.956" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758.956" dy="0">209,6</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×3,8</tspan></text><line x1="460.04" y1="143" x2="547.216" y2="143" stroke="#c0432f" stroke-width="4"/><circle cx="460.04" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="547.216" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="448.04" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="448.04" dy="0">29,9</tspan></text><text x="559.216" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="559.216" dy="0">84,5</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×2,8</tspan></text><line x1="557.594" y1="187" x2="691.712" y2="187" stroke="#c0432f" stroke-width="4"/><circle cx="557.594" cy="187" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="691.712" cy="187" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="545.594" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="545.594" dy="0">91</tspan></text><text x="703.712" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="703.712" dy="0">175</tspan></text><text x="926" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×1,9</tspan></text><text x="611.88" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="611.88" dy="0">Millones de dólares de EE. UU.</tspan></text><rect x="10" y="267" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los tres aumentos ocurren en tramos distintos y por razones que GAO describe: requisitos cambiantes y retrabajo (FFM y</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">centro de datos), y nuevos requisitos y mejoras (Accenture, cuyo coste pasó de 91 a más de 175 a junio de 2014, con</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">capacidades clave aún no disponibles). El factor es aritmética propia; el 175 es un «más de» de GAO.</tspan></text><text x="470" y="372.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: GAO-14-694 (julio de 2014).</tspan></text></svg>
