<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 381" width="940" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Enero de 2013 a marzo de 2014: de los plazos comprimidos al final de la primera inscripción</title><desc id="d">Línea de tiempo en meses desde enero de 2013: en marzo de 2013 CMS estima que solo 65 % del FFM y 75 % del centro de datos estarán listos en septiembre; en abril amplía la fase de diseño; en septiembre hace una revisión de preparación parcial; el 1 de octubre se lanza el sitio; el 30 de noviembre es el objetivo de estabilización; la primera inscripción termina el 31 de marzo de 2014.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="381" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Enero de 2013 a marzo de 2014: de los plazos comprimidos al final de la primera inscripción</tspan></text><line x1="214" y1="83" x2="214" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="183" x2="214" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="353.6" y1="83" x2="353.6" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="353.6" y1="183" x2="353.6" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="353.6" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="353.6" dy="0">3</tspan></text><line x1="493.2" y1="83" x2="493.2" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="493.2" y1="183" x2="493.2" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="493.2" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="493.2" dy="0">6</tspan></text><line x1="632.8" y1="83" x2="632.8" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="632.8" y1="183" x2="632.8" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="632.8" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632.8" dy="0">9</tspan></text><line x1="772.4" y1="83" x2="772.4" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="772.4" y1="183" x2="772.4" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="772.4" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772.4" dy="0">12</tspan></text><line x1="912" y1="83" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="183" x2="912" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">15</tspan></text><line x1="214" y1="183" x2="912" y2="183" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Desarrollo y gobierno</tspan></text><text x="204" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Operación y recuperación</tspan></text><line x1="307.067" y1="75" x2="307.067" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="307.067" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307.067" dy="0">Mar</tspan></text><line x1="353.6" y1="75" x2="353.6" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="353.6" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="353.6" dy="0">Abr</tspan></text><line x1="586.267" y1="75" x2="586.267" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="586.267" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="586.267" dy="0">Sep</tspan></text><line x1="632.8" y1="75" x2="632.8" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="632.8" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="632.8" dy="0">1 oct</tspan></text><line x1="725.867" y1="75" x2="725.867" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="725.867" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="725.867" dy="0">30 nov</tspan></text><rect x="214" y="92" width="418.8" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="423.4" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.4" dy="0">Requisitos aún cambiando; pruebas comprimidas</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="632.8" y="142" width="93.0667" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="679.333" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="679.333" dy="0">Crisis</tspan></text><rect x="725.867" y="142" width="186.133" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="818.933" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="818.933" dy="0">Estabilizado</tspan></text><text x="563" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="563" dy="0">Meses desde enero de 2013 (0 = 1 de enero de 2013)</tspan></text><rect x="10" y="241" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="265.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Marzo: CMS estimó que solo 65 % del FFM y 75 % del centro de datos estaría listo en septiembre. Abril: se extendió el</tspan></text><text x="470" y="282.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">diseño y se comprimieron las pruebas. Septiembre: revisión de preparación parcial, con el desarrollo aún sin terminar. 30</tspan></text><text x="470" y="299.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de noviembre: objetivo de estabilización declarado por la administración. Los límites de la fase «Crisis» y «Estabilizado»</tspan></text><text x="470" y="315.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">son aproximados.</tspan></text><text x="470" y="363.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: GAO-14-694 (julio de 2014). OEI-06-14-00350 y CMS (1 de diciembre de 2013).</tspan></text></svg>
