<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 646" width="940" height="646" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco decisiones del caso y la mejora que las habría cambiado</title><desc id="d">Cinco tarjetas con una situación documentada a la izquierda y la mejora propuesta a la derecha: congelar un alcance mínimo, dar criterios de salida de la revisión de preparación, pruebas de carga y de extremo a extremo, cadena de malas noticias y lanzamiento escalonado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="646" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco decisiones del caso y la mejora que las habría cambiado</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Requisitos todavía cambiando en mitad de 2013, con</tspan></text><text x="30" y="117.6" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">plazos fijos</tspan></text><polyline points="438,105.64 474,105.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="77" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="109.28" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Alcance mínimo congelado y lo demás en olas posteriores</tspan></text><text x="24" y="151.28" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Es la causa que GAO atribuye al aumento de coste y a la compresión de pruebas.</tspan></text><rect x="20" y="172.92" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="196.88" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Revisión de preparación parcial en septiembre de 2013,</tspan></text><text x="30" y="213.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">con el desarrollo sin terminar</tspan></text><polyline points="438,201.56 474,201.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="172.92" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="196.88" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Criterio de salida explícito: sin pruebas superadas, no</tspan></text><text x="488" y="213.52" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">hay lanzamiento</tspan></text><text x="24" y="247.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">GAO: se lanzó sin verificar que cumplía los requisitos de rendimiento.</tspan></text><rect x="20" y="268.84" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="301.12" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Demanda subestimada y sin plan de capacidad</tspan></text><polyline points="438,297.48 474,297.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="268.84" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="292.8" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Prueba de carga con un rango de demanda y capacidad</tspan></text><text x="488" y="309.44" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">elástica</tspan></text><text x="24" y="343.12" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">GAO-15-238: CMS reconoció haber subestimado la demanda.</tspan></text><rect x="20" y="364.76" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="397.04" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Sin pruebas de extremo a extremo del conjunto</tspan></text><polyline points="438,393.4 474,393.4" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="364.76" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="388.72" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Una prueba de extremo a extremo del recorrido crítico</tspan></text><text x="488" y="405.36" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">antes de abrir</tspan></text><text x="24" y="439.04" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">GAO-15-238: no se hicieron aunque estaban requeridas.</tspan></text><rect x="20" y="460.68" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="492.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Resistencia a las malas noticias y plazo inamovible</tspan></text><polyline points="438,489.32 474,489.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="460.68" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="484.64" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Lanzamiento por fases o regiones con un canal de alerta</tspan></text><text x="488" y="501.28" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">sin castigo</tspan></text><text x="24" y="534.96" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">OEI-06-14-00350: no se reconoció la magnitud de los problemas ni se cambió de plan.</tspan></text><rect x="10" y="558.6" width="920" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="589.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Análisis propio apoyado en GAO-14-694, GAO-15-238 y OEI-06-14-00350; no es una conclusión de esas fuentes.</tspan></text></svg>
