<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias y puntos únicos de fallo del recorrido del solicitante</title><desc id="d">Mapa de dependencias: todo solicitante pasa por la gestión de identidad, que dependía de una capacidad subestimada; la verificación depende del centro de datos y de fuentes ajenas; el desarrollo dependía de tres contratistas sin integrador único hasta octubre; y la fecha fija de lanzamiento no tenía alternativa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="476" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dependencias y puntos únicos de fallo del recorrido del solicitante</tspan></text><rect x="360" y="51" width="220" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">Solicitante inscrito</tspan></text><rect x="60" y="161" width="230" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="175" y="189.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="175" dy="0">Gestión de identidad: puerta</tspan></text><text x="175" y="205.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="175" dy="0">única, saturada</tspan></text><rect x="360" y="161" width="220" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="189.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Verificación: centro de</tspan></text><text x="470" y="205.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">datos y fuentes federales</tspan></text><rect x="650" y="161" width="230" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="765" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="765" dy="0">Aseguradoras: planes</tspan></text><text x="765" y="197.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="765" dy="0">cargados y probados con</tspan></text><text x="765" y="214.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="765" dy="0">retraso</tspan></text><rect x="60" y="281" width="230" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="175" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="175" dy="0">Capacidad estimada por</tspan></text><text x="175" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="175" dy="0">debajo de la demanda</tspan></text><rect x="360" y="281" width="220" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="301" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Tres contratistas;</tspan></text><text x="470" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">integrador único desde</tspan></text><text x="470" y="334.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">octubre</tspan></text><rect x="650" y="281" width="230" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="765" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="765" dy="0">Fecha fija: 1 de octubre de</tspan></text><text x="765" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="765" dy="0">2013</tspan></text><polyline points="175,161 400,111" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,161 470,111" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="765,161 540,111" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="175,281 175,227" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,281 470,227" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="765,281 765,227" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="369" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: las tres cajas de arriba son las rutas por las que se llega a una inscripción; cada una tenía debajo una</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dependencia sin holgura. La identidad era la única puerta de entrada y no tenía alternativa.</tspan></text><text x="470" y="458.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en GAO-14-694, GAO-15-238 y OEI-06-14-00350; no es una conclusión de esas fuentes.</tspan></text></svg>
