<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Octubre a diciembre de 2013, día a día: del colapso a la estabilización</title><desc id="d">Línea de tiempo en días desde el 1 de octubre de 2013: el sitio cae un sesenta por ciento del tiempo en algunas semanas de octubre; a mediados de octubre se evalúa que es arreglable y QSSI pasa a integrador; el 30 de noviembre es el objetivo de estabilización; del 15 al 24 de diciembre se amplía el plazo para elegir plan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Octubre a diciembre de 2013, día a día: del colapso a la estabilización</tspan></text><line x1="274" y1="83" x2="274" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="233" x2="274" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="378.022" y1="83" x2="378.022" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="378.022" y1="233" x2="378.022" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="378.022" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="378.022" dy="0">15</tspan></text><line x1="488.978" y1="83" x2="488.978" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="488.978" y1="233" x2="488.978" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="488.978" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="488.978" dy="0">31</tspan></text><line x1="593" y1="83" x2="593" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="593" y1="233" x2="593" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="593" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="593" dy="0">46</tspan></text><line x1="697.022" y1="83" x2="697.022" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="697.022" y1="233" x2="697.022" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="697.022" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697.022" dy="0">61</tspan></text><line x1="801.043" y1="83" x2="801.043" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="801.043" y1="233" x2="801.043" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="801.043" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="801.043" dy="0">76</tspan></text><line x1="912" y1="83" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="233" x2="912" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">92</tspan></text><line x1="274" y1="233" x2="912" y2="233" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Sitio</tspan></text><text x="264" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Gestión de la respuesta</tspan></text><text x="264" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Plazo legal para elegir plan</tspan></text><line x1="274" y1="75" x2="274" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="274" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="274" dy="0">1 oct</tspan></text><line x1="690.087" y1="75" x2="690.087" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="690.087" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="690.087" dy="0">30 nov</tspan></text><line x1="856.522" y1="75" x2="856.522" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="856.522" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.522" dy="0">24 dic</tspan></text><rect x="274" y="92" width="214.978" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="381.489" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="381.489" dy="0">octubre: caídas y errores</tspan></text><rect x="488.978" y="92" width="208.043" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="593" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="593" dy="0">noviembre: mejora</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="371.087" y="142" width="319" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="530.587" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="530.587" dy="0">QSSI integrador y sala de crisis</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="794.109" y="192" width="62.413" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="825.315" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="825.315" dy="0">15-24</tspan></text><text x="593" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593" dy="0">Días desde el 1 de octubre de 2013</tspan></text><rect x="10" y="291" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los límites son aproximados: CMS dice «mediados de octubre» para la evaluación y no fija el fin de la crisis. Dentro de</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">noviembre la disponibilidad del sistema pasó de 42,9 % a algo más del 93 % y el tiempo de respuesta del FFM, de 8 s a menos</tspan></text><text x="470" y="349.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 1 s hacia diciembre (GAO-15-238). El último día del plazo hubo 49 156 usuarios simultáneos (OIG).</tspan></text><text x="470" y="396.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: CMS (1 de diciembre de 2013), GAO-15-238 y OEI-06-14-00350.</tspan></text></svg>
