<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 642" width="940" height="642" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuencia de un solicitante el 1 de octubre de 2013 y dónde se rompía</title><desc id="d">Diagrama de secuencia con consumidor, sitio, gestión de identidad, mercado federal, centro de datos y fuentes federales: la creación de cuentas satura la gestión de identidad, las verificaciones dependen de consultas a otras agencias, y muchas inconsistencias quedaron sin resolver.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="642" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Secuencia de un solicitante el 1 de octubre de 2013 y dónde se rompía</tspan></text><rect x="25" y="51" width="140" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="95" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="95" dy="0">Consumidor</tspan></text><rect x="175" y="51" width="140" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="245" dy="0">Sitio</tspan></text><rect x="325" y="51" width="140" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="395" y="69.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="395" dy="0">Gestión de</tspan></text><text x="395" y="85.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="395" dy="0">identidad</tspan></text><rect x="475" y="51" width="140" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="545" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="545" dy="0">FFM</tspan></text><rect x="625" y="51" width="140" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="695" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="695" dy="0">Centro de datos</tspan></text><rect x="775" y="51" width="140" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="845" y="69.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="845" dy="0">Fuentes</tspan></text><text x="845" y="85.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="845" dy="0">federales</tspan></text><line x1="95" y1="97" x2="95" y2="507" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="245" y1="97" x2="245" y2="507" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="395" y1="97" x2="395" y2="507" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="545" y1="97" x2="545" y2="507" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="695" y1="97" x2="695" y2="507" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="845" y1="97" x2="845" y2="507" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="95,131 245,131" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="170" y="123" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170" dy="0">1. crea cuenta</tspan></text><polyline points="245,167 395,167" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="320" y="159" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="320" dy="0">2. registro</tspan></text><rect x="270" y="184" width="250" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="395" y="202.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="395" dy="0">3. ≈ 500 000 cuentas</tspan></text><polyline points="395,239 245,239" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="320" y="231" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="320" dy="0">4. errores</tspan></text><polyline points="245,275 545,275" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="395" y="267" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="395" dy="0">5. solicitud</tspan></text><polyline points="545,311 695,311" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="620" y="303" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="620" dy="0">6. verifica</tspan></text><polyline points="695,347 845,347" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="770" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="770" dy="0">7. consulta</tspan></text><polyline points="845,383 695,383" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="770" y="375" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="770" dy="0">8. respuesta</tspan></text><rect x="420" y="400" width="250" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="545" y="418.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">9. inconsistencias</tspan></text><polyline points="545,455 245,455" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="395" y="447" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="395" dy="0">10. planes</tspan></text><polyline points="245,491 95,491" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="170" y="483" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170" dy="0">11. elige plan</tspan></text><rect x="10" y="519" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: el cuello de botella documentado estaba al principio, en la identidad; más adelante, las verificaciones</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">dependían de consultas a otros sistemas. Los pasos 5 a 8 son el modelo funcional del recorrido; lo medido por las</tspan></text><text x="470" y="577.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">auditorías son la saturación de identidad y las inconsistencias.</tspan></text><text x="470" y="624.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: GAO-15-238 (identidad saturada) y OEI-06-14-00350 (inconsistencias). Orden de pasos: modelo propio.</tspan></text></svg>
