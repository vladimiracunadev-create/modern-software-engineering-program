<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 431" width="940" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Las últimas 72 horas: duplicar la capacidad con el lanzamiento encima</title><desc id="d">Línea de tiempo en días desde el 26 de septiembre de 2013: ese día CMS pide a su contratista de infraestructura duplicar la capacidad ya comprada; el 29 los probadores dicen que el límite de usuarios simultáneos subió mucho; el 29 y 30 un responsable técnico comunica que la capacidad ya no es un problema crítico; el 1 de octubre se lanza.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="431" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Las últimas 72 horas: duplicar la capacidad con el lanzamiento encima</tspan></text><line x1="274" y1="83" x2="274" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="233" x2="274" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="380.333" y1="83" x2="380.333" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="380.333" y1="233" x2="380.333" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="380.333" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380.333" dy="0">1</tspan></text><line x1="486.667" y1="83" x2="486.667" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="486.667" y1="233" x2="486.667" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="486.667" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.667" dy="0">2</tspan></text><line x1="593" y1="83" x2="593" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="593" y1="233" x2="593" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="593" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="593" dy="0">3</tspan></text><line x1="699.333" y1="83" x2="699.333" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="699.333" y1="233" x2="699.333" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="699.333" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="699.333" dy="0">4</tspan></text><line x1="805.667" y1="83" x2="805.667" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="805.667" y1="233" x2="805.667" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="805.667" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805.667" dy="0">5</tspan></text><line x1="912" y1="83" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="233" x2="912" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">6</tspan></text><line x1="274" y1="233" x2="912" y2="233" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Infraestructura (Terremark)</tspan></text><text x="264" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Pruebas</tspan></text><text x="264" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Decisión</tspan></text><line x1="274" y1="75" x2="274" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="274" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="274" dy="0">26 sep: pedido</tspan></text><line x1="805.667" y1="75" x2="805.667" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="805.667" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="805.667" dy="0">1 oct: lanzamiento</tspan></text><rect x="274" y="92" width="319" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="433.5" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="433.5" dy="0">duplica capacidad</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="486.667" y="142" width="212.667" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="593" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="593" dy="0">1 día de pruebas</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="593" y="192" width="212.667" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="699.333" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="699.333" dy="0">«ya no es crítico»</tspan></text><text x="593" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593" dy="0">Días desde el 26 de septiembre de 2013</tspan></text><rect x="10" y="291" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Solo son fechas documentadas el pedido del 26 de septiembre, el 29 y 30 de septiembre y el lanzamiento; la longitud de las</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">barras es indicativa. El pedido llegó a 4,5 días del lanzamiento y se dejó al menos un día de pruebas. Un directivo de</tspan></text><text x="470" y="349.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Terremark describió el esfuerzo como «duplicar todo en 72 horas»; las fuentes no dan el resultado medido de esa prueba. Lo</tspan></text><text x="470" y="365.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que consta es que, el primer día, la identidad aun así se vio desbordada (GAO-15-238).</tspan></text><text x="470" y="413.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: OEI-06-14-00350 (capítulo del lanzamiento) y GAO-15-238. Cifras de capacidad real: no se sabe.</tspan></text></svg>
