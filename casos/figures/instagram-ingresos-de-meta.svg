<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ingresos de Meta, de los que Instagram forma parte, 2023 a 2025</title><desc id="d">Barras con 134 902 millones de dólares en 2023, 164 501 en 2024 y 200 966 en 2025; la publicidad representa 196 175 millones en 2025 y la familia de aplicaciones 198 759 millones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ingresos de Meta, de los que Instagram forma parte, 2023 a 2025</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ingresos totales (millones de USD)</tspan></text><rect x="320.36" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="340.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="340.36" dy="0">Publicidad</tspan></text><line x1="108.78" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="355" x2="108.78" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">0</tspan></text><line x1="108.78" y1="303" x2="920" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="303" x2="108.78" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">50 000</tspan></text><line x1="108.78" y1="251" x2="920" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="251" x2="108.78" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100 000</tspan></text><line x1="108.78" y1="199" x2="920" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="199" x2="108.78" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">150 000</tspan></text><line x1="108.78" y1="147" x2="920" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="147" x2="108.78" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">200 000</tspan></text><line x1="108.78" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="95" x2="108.78" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">250 000</tspan></text><line x1="108.78" y1="95" x2="108.78" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">millones de USD</text><rect x="135.821" y="214.702" width="106.163" height="140.298" rx="3" fill="#087f8c"/><text x="188.902" y="208.702" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="188.902" dy="0">134 902</tspan></text><rect x="245.983" y="217.774" width="106.163" height="137.226" rx="3" fill="#102a43"/><text x="299.065" y="211.774" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="299.065" dy="0">131 948</tspan></text><text x="243.983" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="243.983" dy="0">2023</tspan></text><rect x="406.227" y="183.919" width="106.163" height="171.081" rx="3" fill="#087f8c"/><text x="459.309" y="177.919" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="459.309" dy="0">164 501</tspan></text><rect x="516.39" y="187.942" width="106.163" height="167.058" rx="3" fill="#102a43"/><text x="569.471" y="181.942" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="569.471" dy="0">160 633</tspan></text><text x="514.39" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.39" dy="0">2024</tspan></text><rect x="676.634" y="145.995" width="106.163" height="209.005" rx="3" fill="#087f8c"/><text x="729.715" y="139.995" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="729.715" dy="0">200 966</tspan></text><rect x="786.797" y="150.978" width="106.163" height="204.022" rx="3" fill="#102a43"/><text x="839.878" y="144.978" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.878" dy="0">196 175</tspan></text><text x="784.797" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.797" dy="0">2025</tspan></text><rect x="10" y="407" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Mire que la publicidad es casi todo el ingreso: 97,6 % del total en 2025 (cálculo propio). Instagram aporta a ese ingreso</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pero Meta no publica cuánto. Dónde deja de valer: es la cifra del grupo; no sirve para estimar ingresos de Instagram.</tspan></text><text x="470" y="496.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Meta Platforms del año 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
