" y="138" width="317.036" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="708.829" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="708.829" dy="0">EE. UU. y Europa</tspan></text><line x1="14" y1="175" x2="912" y2="175" stroke="#d5dde1" stroke-width="1"/><rect x="702.131" y="184" width="8.93059" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="760.18" y="184" width="8.93059" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="532.45" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="532.45" dy="0">año</tspan></text><rect x="10" y="279" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hechos con fuente: lanzamiento el 6 de octubre de 2010 (TechCrunch 2012); compra completada en agosto de 2012 (10-K de</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Facebook); 100 millones de usuarios mensuales en febrero de 2013 (TechCrunch 2013); Cinder y objetos inmortales</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(Engineering at Meta). Dónde deja de valer: las fechas de las etapas de infraestructura son aproximadas, no hay fecha</tspan></text><text x="470" y="353.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">publicada de cada cambio.</tspan></text><text x="470" y="401.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: 10-K de Facebook 2012, TechCrunch (2012 y 2013) y Engineering at Meta.</tspan></text></svg>
