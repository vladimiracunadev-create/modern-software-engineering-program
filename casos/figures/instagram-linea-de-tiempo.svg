<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Instagram de 2010 a 2026: producto, compra e infraestructura</title><desc id="d">Línea de tiempo con tres carriles: producto (lanzamiento el 6 de octubre de 2010, compra por Facebook en agosto de 2012, parte de Meta), infraestructura (pila Django con PostgreSQL hasta 2012 y Cassandra y TAO después, reparto en continentes hacia 2018) y runtime (Cinder en 2022, objetos inmortales en 2023).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Instagram de 2010 a 2026: producto, compra e infraestructura</tspan></text><line x1="152.9" y1="83" x2="152.9" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="152.9" y1="221" x2="152.9" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="152.9" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152.9" dy="0">2010</tspan></text><line x1="286.859" y1="83" x2="286.859" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="286.859" y1="221" x2="286.859" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="286.859" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="286.859" dy="0">2013</tspan></text><line x1="420.818" y1="83" x2="420.818" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="420.818" y1="221" x2="420.818" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="420.818" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="420.818" dy="0">2016</tspan></text><line x1="554.776" y1="83" x2="554.776" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="554.776" y1="221" x2="554.776" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="554.776" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="554.776" dy="0">2019</tspan></text><line x1="688.735" y1="83" x2="688.735" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="688.735" y1="221" x2="688.735" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="688.735" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="688.735" dy="0">2022</tspan></text><line x1="822.694" y1="83" x2="822.694" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="822.694" y1="221" x2="822.694" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="822.694" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822.694" dy="0">2025</tspan></text><line x1="912" y1="83" x2="912" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="221" x2="912" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2027</tspan></text><line x1="152.9" y1="221" x2="912" y2="221" stroke="#5b7280" stroke-width="1.6"/><text x="142.9" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="142.9" dy="0">Producto</tspan></text><text x="142.9" y="156.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="142.9" dy="0">Infraestructura</tspan></text><text x="142.9" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="142.9" dy="0">Runtime</tspan></text><line x1="187.283" y1="75" x2="187.283" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="187.283" y="69" font-size="13" text-anchor