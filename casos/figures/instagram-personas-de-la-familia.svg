<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 446" width="940" height="446" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Personas diarias de la familia de aplicaciones de Meta (diciembre)</title><desc id="d">Barras con 3,35 mil millones de personas activas diarias en diciembre de 2024 y 3,58 mil millones en diciembre de 2025, un aumento de 7 por ciento; la cifra cuenta personas únicas de Facebook, Instagram, Messenger y WhatsApp.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="446" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Personas diarias de la familia de aplicaciones de Meta (diciembre)</tspan></text><line x1="63.54" y1="287" x2="920" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="287" x2="63.54" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="232" x2="920" y2="232" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="232" x2="63.54" y2="232" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="236.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="177" x2="920" y2="177" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="177" x2="63.54" y2="177" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="122" x2="920" y2="122" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="122" x2="63.54" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="67" x2="63.54" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="67" x2="63.54" y2="287" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 177)">miles de millones de personas</text><rect x="106.363" y="102.75" width="342.584" height="184.25" rx="3" fill="#087f8c"/><text x="277.655" y="96.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277.655" dy="0">3,35</tspan></text><text x="277.655" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">Dic 2024</tspan></text><rect x="534.593" y="90.1" width="342.584" height="196.9" rx="3" fill="#087f8c"/><text x="705.885" y="84.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705.885" dy="0">3,58</tspan></text><text x="705.885" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">Dic 2025</tspan></text><rect x="10" y="339" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El 10-K aclara que la cifra son personas únicas estimadas, no cuentas, con técnicas de atribución entre cuentas. Dónde deja</tspan></text><text x="470" y="380.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de valer: no se puede extraer el número de usuarios de Instagram de este indicador.</tspan></text><text x="470" y="428.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Meta Platforms del año 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
