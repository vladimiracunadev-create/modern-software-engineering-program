<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 533" width="940" height="533" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De qué se compone el precio de Instagram en la contabilidad de Facebook</title><desc id="d">Barras con los componentes de la compra: 300 millones de dólares en efectivo, 221 millones en acciones ya adquiridas por los accionistas externos y 194 millones en acciones sujetas a permanencia de los empleados, que suman unos 715 millones; el precio contable de la combinación fue 521 millones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="533" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De qué se compone el precio de Instagram en la contabilidad de Facebook</tspan></text><line x1="78.62" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="307" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="227" x2="920" y2="227" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="227" x2="78.62" y2="227" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="231.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="147" x2="920" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">millones de USD</text><rect x="106.666" y="67" width="224.368" height="240" rx="3" fill="#102a43"/><text x="218.85" y="61" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.85" dy="0">300</tspan></text><text x="218.85" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Efectivo</tspan></text><rect x="387.126" y="130.2" width="224.368" height="176.8" rx="3" fill="#102a43"/><text x="499.31" y="124.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">221</tspan></text><text x="499.31" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Acciones adquiridas (no empleados)</tspan></text><rect x="667.586" y="151.8" width="224.368" height="155.2" rx="3" fill="#102a43"/><text x="779.77" y="145.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">194</tspan></text><text x="779.77" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Acciones sujetas a permanencia</tspan></text><text x="779.77" y="345" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">(empleados)</tspan></text><rect x="10" y="376" width="920" height="109.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="400.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El 10-K de 2012 da un precio de compra de 521 millones (300 en efectivo y unos 12 millones de acciones de la clase B) y,</tspan></text><text x="470" y="417.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aparte, unos 11 millones de acciones con permanencia valoradas en 194 millones que se reconocen como gasto durante tres</tspan></text><text x="470" y="434.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">años. Cálculo propio: 521 menos 300 deja 221 en acciones; 521 más 194 suman 715 millones, la cifra que la prensa de 2013</tspan></text><text x="470" y="450.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cita. Dónde deja de valer: el valor de las acciones depende de la cotización del cierre; la cifra de mil millones de abril</tspan></text><text x="470" y="467.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 2012 era un valor anunciado.</tspan></text><text x="470" y="515.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Facebook del año 2012 (SEC), consulta 2026-11-23.</tspan></text></svg>
