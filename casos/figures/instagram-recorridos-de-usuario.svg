<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 521" width="940" height="521" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro recorridos en Instagram y su caso límite</title><desc id="d">Cuatro filas de pasos: una persona que publica una foto, un creador de Reels, un negocio que vende y un usuario nuevo que se une desde otra aplicación de Meta; cada fila termina en un caso límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="521" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro recorridos en Instagram y su caso límite</tspan></text><rect x="10" y="56" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Persona</tspan></text><rect x="174" y="56" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263.25" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.25" dy="0">Abre la aplicación y</tspan></text><text x="263.25" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.25" dy="0">ve el Feed</tspan></text><rect x="366.5" y="56" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455.75" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">Saca una foto y</tspan></text><text x="455.75" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">aplica un filtro</tspan></text><polyline points="352.5,94 366.5,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="56" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="648.25" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">Publica; el servidor</tspan></text><text x="648.25" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">guarda y reparte</tspan></text><polyline points="545,94 559,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="56" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Foto que se hace</tspan></text><text x="840.75" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">viral en minutos</tspan></text><polyline points="737.5,94 751.5,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="144" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="185.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Creador</tspan></text><rect x="174" y="144" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="263.25" y="185.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="263.25" dy="0">Graba un vídeo corto</tspan></text><rect x="366.5" y="144" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455.75" y="177.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">Sube y se</tspan></text><text x="455.75" y="193.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">transcodifica</tspan></text><polyline points="352.5,182 366.5,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="144" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="648.25" y="177.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">Aparece en Reels y en</tspan></text><text x="648.25" y="193.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">Explorar</tspan></text><polyline points="545,182 559,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="144" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Audiencia mundial:</tspan></text><text x="840.75" y="185.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">lecturas desde otro</tspan></text><text x="840.75" y="202.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">continente</tspan></text><polyline points="737.5,182 751.5,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="232" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Negocio</tspan></text><rect x="174" y="232" width="178.5" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="263.25" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="263.25" dy="0">Crea un perfil de</tspan></text><text x="263.25" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="263.25" dy="0">empresa</tspan></text><rect x="366.5" y="232" width="178.5" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="455.75" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="455.75" dy="0">Muestra productos</tspan></text><polyline points="352.5,270 366.5,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="232" width="178.5" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="648.25" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="648.25" dy="0">Compra y anuncio</tspan></text><polyline points="545,270 559,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="232" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Rechazo o suspensión</tspan></text><text x="840.75" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">de la cuenta</tspan></text><polyline points="737.5,270 751.5,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="320" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="353.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Usuario de</tspan></text><text x="85" y="369.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Threads</tspan></text><rect x="174" y="320" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Se registra con la</tspan></text><text x="263.25" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">cuenta de Instagram</tspan></text><rect x="366.5" y="320" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="455.75" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">Sigue a quienes ya</tspan></text><text x="455.75" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">sigue en Instagram</tspan></text><polyline points="352.5,358 366.5,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="320" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="648.25" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">Se ejecuta el grafo</tspan></text><text x="648.25" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">de forma asíncrona</tspan></text><polyline points="545,358 559,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="320" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Cien millones de</tspan></text><text x="840.75" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">altas en cinco días</tspan></text><polyline points="737.5,358 751.5,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="412" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="436.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada fila se lee de izquierda a derecha y la caja coral es el borde. El caso del usuario de Threads viene de un post de</tspan></text><text x="470" y="453.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Engineering at Meta (2023); los demás son escenarios del curso sobre funciones que el 10-K describe (Feed, Stories, Reels,</tspan></text><text x="470" y="470.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mensajería, compras). Dónde deja de valer: no hay datos públicos de la frecuencia de cada borde.</tspan></text><text x="470" y="507.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Esquema del autor sobre el 10-K de Meta (2025) y el blog de Engineering at Meta.</tspan></text></svg>
