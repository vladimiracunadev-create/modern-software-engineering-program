<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 329" width="960" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Threads sobre la base de Instagram: cien millones de altas en cinco días</title><desc id="d">Flujo: Threads se lanza el 5 de julio de 2023 con dos días de preaviso a las áreas de infraestructura; un equipo pequeño la construyó en cinco meses de trabajo técnico; el grafo de seguidores se replica desde Instagram con trabajos asíncronos para no bloquear el alta; llega a cien millones de altas en cinco días.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="329" fill="#ffffff"/><rect x="10" y="14" width="284" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="152" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">Lanzamiento el 5 de julio de 2023</tspan></text><text x="152" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">con dos días de preaviso</tspan></text><rect x="338" y="14" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Un equipo pequeño: cinco meses de</tspan></text><text x="480" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">trabajo técnico</tspan></text><polyline points="294,56 338,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">Seguir a los mismos que en Instagram</tspan></text><polyline points="622,56 666,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">La operación costosa se ejecuta de</tspan></text><text x="152" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">forma asíncrona</tspan></text><rect x="338" y="138" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">El alta no se bloquea ni se degrada</tspan></text><polyline points="294,180 338,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="138" width="284" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="808" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="808" dy="0">Más de 100 millones de altas en</tspan></text><text x="808" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="808" dy="0">cinco días</tspan></text><polyline points="622,180 666,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,98 808,118 152,118 152,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Documentado en «How Meta built the infrastructure for Threads» (diciembre de 2023). Dónde deja de valer: es un caso de Meta</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">que se apoya en su infraestructura común; no prueba que otra empresa pueda hacerlo con dos días de aviso.</tspan></text><text x="480" y="319.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Fuente: Engineering at Meta, 19 de diciembre de 2023.</tspan></text></svg>
