<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas acciones sintieron a Knight: de 154 a 37</title><desc id="d">Barras horizontales: 154 acciones con ejecuciones erróneas de Knight; 75 en las que Knight fue más del veinte por ciento del volumen con movimientos de precio mayores del cinco por ciento; 37 de ellas con movimientos de más del diez por ciento y más del cincuenta por ciento del volumen.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántas acciones sintieron a Knight: de 154 a 37</tspan></text><line x1="324" y1="49" x2="324" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="163" x2="324" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="465.955" y1="49" x2="465.955" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="465.955" y1="163" x2="465.955" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="465.955" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465.955" dy="0">40</tspan></text><line x1="607.91" y1="49" x2="607.91" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="607.91" y1="163" x2="607.91" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="607.91" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607.91" dy="0">80</tspan></text><line x1="749.865" y1="49" x2="749.865" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="749.865" y1="163" x2="749.865" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="749.865" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.865" dy="0">120</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="163" x2="891.82" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">160</tspan></text><line x1="324" y1="163" x2="891.82" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Acciones con ejecuciones erróneas</tspan></text><text x="314" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Knight &gt; 20 % del volumen y precio &gt; 5 %</tspan></text><text x="314" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Knight &gt; 50 % del volumen y precio &gt; 10 %</tspan></text><rect x="324" y="55" width="546.527" height="26" rx="3" fill="#c0432f"/><text x="877.527" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="877.527" dy="0">154</tspan></text><rect x="324" y="93" width="266.166" height="26" rx="3" fill="#c0432f"/><text x="597.166" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="597.166" dy="0">75</tspan></text><rect x="324" y="131" width="131.308" height="26" rx="3" fill="#c0432f"/><text x="462.308" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="462.308" dy="0">37</tspan></text><text x="607.91" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">Número de acciones</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las 37 acciones del último escalón son un subconjunto de las 75 del anterior. La SEC añade que algunos participantes</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">recibieron peores precios y otros mejores: el daño al mercado no es solo de quien pierde. Cada escalón es un criterio más</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">duro, no un periodo distinto.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). Párrafos 1 y 18.</tspan></text></svg>
