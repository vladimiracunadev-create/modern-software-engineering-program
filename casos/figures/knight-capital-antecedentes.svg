<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce años de condiciones latentes antes de la mañana del 1 de agosto</title><desc id="d">Eje de tiempo no proporcional de 2003 a 2013 con los hitos documentados: 2003 Power Peg deja de usarse pero queda en los servidores; 2005 se mueve la función de cantidad acumulada sin repetir pruebas; julio de 2011 fecha desde la que los controles no estaban bien diseñados; octubre de 2011 error con datos de prueba; marzo de 2012 certificación del consejero delegado; agosto de 2012 el incidente; 2013 fusión y orden de la SEC.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="480" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Doce años de condiciones latentes antes de la mañana del 1 de agosto</tspan></text><line x1="30" y1="195" x2="910" y2="195" stroke="#32505f" stroke-width="2"/><line x1="80" y1="195" x2="80" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="80" cy="195" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="80" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="80" dy="0"></tspan></text><rect x="6" y="59" width="190" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="101" y="94" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="101" dy="0">2003: Power Peg deja de</tspan></text><text x="101" y="110.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="101" dy="0">usarse; el código queda</tspan></text><text x="101" y="127.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="101" dy="0">en producción</tspan></text><line x1="191.429" y1="195" x2="191.429" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="191.429" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="191.429" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="191.429" dy="0"></tspan></text><rect x="96.4286" y="235" width="190" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="191.429" y="270" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="191.429" dy="0">2005: se mueve la</tspan></text><text x="191.429" y="286.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="191.429" dy="0">cantidad acumulada; no</tspan></text><text x="191.429" y="303.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="191.429" dy="0">se vuelve a probar</tspan></text><line x1="302.857" y1="195" x2="302.857" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="302.857" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="302.857" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="302.857" dy="0"></tspan></text><rect x="207.857" y="59" width="190" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="302.857" y="94" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="302.857" dy="0">Jul 2011: fecha de</tspan></text><text x="302.857" y="110.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="302.857" dy="0">cumplimiento de la</tspan></text><text x="302.857" y="127.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="302.857" dy="0">regla 15c3-5</tspan></text><line x1="414.286" y1="195" x2="414.286" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="414.286" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="414.286" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="414.286" dy="0"></tspan></text><rect x="319.286" y="235" width="190" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="414.286" y="270" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="414.286" dy="0">Oct 2011: datos de</tspan></text><text x="414.286" y="286.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="414.286" dy="0">prueba en producción; ≈</tspan></text><text x="414.286" y="303.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="414.286" dy="0">7,5 M</tspan></text><line x1="525.714" y1="195" x2="525.714" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="525.714" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525.714" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="525.714" dy="0"></tspan></text><rect x="430.714" y="59" width="190" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525.714" y="102.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525.714" dy="0">Mar 2012: certificación</tspan></text><text x="525.714" y="118.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525.714" dy="0">del CEO dice «procesos»</tspan></text><line x1="637.143" y1="195" x2="637.143" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="637.143" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="637.143" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="637.143" dy="0"></tspan></text><rect x="542.143" y="235" width="190" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="637.143" y="278.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="637.143" dy="0">Ago 2012: 45 minutos,</tspan></text><text x="637.143" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="637.143" dy="0">más de 460 M</tspan></text><line x1="748.571" y1="195" x2="748.571" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="748.571" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="748.571" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="748.571" dy="0"></tspan></text><rect x="653.571" y="59" width="190" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="748.571" y="102.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="748.571" dy="0">Jul 2013: fusión con</tspan></text><text x="748.571" y="118.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="748.571" dy="0">GETCO</tspan></text><line x1="860" y1="195" x2="860" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="860" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="860" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="860" dy="0"></tspan></text><rect x="744" y="235" width="190" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="839" y="278.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="839" dy="0">Oct 2013: orden de la</tspan></text><text x="839" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="839" dy="0">SEC y multa de 12 M</tspan></text><rect x="10" y="357" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el defecto se formó en 2005 y el despliegue de 2012 solo lo activó. Los años intermedios contienen un aviso</tspan></text><text x="470" y="398.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(2011) que se cerró con un parche local. Es la forma típica de una condición latente: invisible hasta que otra condición la</tspan></text><text x="470" y="415.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">alinea.</tspan></text><text x="470" y="462.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). Párrafos 9, 11, 14, 33 y 34. Espaciado uniforme, no a escala de años.</tspan></text></svg>
