<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arquitectura «después»: cuatro controles independientes antes del mercado</title><desc id="d">Arquitectura objetivo propuesta: un canal de despliegue que verifica la versión en cada nodo; SMARS con invariante de parada; una puerta independiente justo antes de las bolsas con límites de cantidad, ritmo, precio y capital agregado; un interruptor de parada accesible a operaciones; y telemetría que convierte las señales en alertas con responsable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Arquitectura «después»: cuatro controles independientes antes del mercado</tspan></text><rect x="10" y="51" width="200" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="67.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Canal de despliegue:</tspan></text><text x="110" y="84.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">artefacto único, hash</tspan></text><text x="110" y="100.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">por nodo, segunda</tspan></text><text x="110" y="117.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">aprobación</tspan></text><rect x="250" y="51" width="190" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="345" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="345" dy="0">SMARS con invariante:</tspan></text><text x="345" y="92.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="345" dy="0">hijas ≤ cantidad de la</tspan></text><text x="345" y="109.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="345" dy="0">madre</tspan></text><rect x="480" y="51" width="220" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="590" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="590" dy="0">Puerta previa al mercado:</tspan></text><text x="590" y="92.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="590" dy="0">cantidad, ritmo, precio y</tspan></text><text x="590" y="109.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="590" dy="0">capital agregado</tspan></text><rect x="740" y="51" width="190" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="835" y="84.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835" dy="0">Bolsas y centros de</tspan></text><text x="835" y="100.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835" dy="0">negociación</tspan></text><polyline points="210,89 250,89" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="440,89 480,89" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="700,89 740,89" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="181" width="210" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="115" y="208" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="115" dy="0">Cuenta de capital agregado</tspan></text><text x="115" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="115" dy="0">en línea: límite que</tspan></text><text x="115" y="241.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="115" dy="0">bloquea, no que informa</tspan></text><rect x="260" y="181" width="210" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="365" y="216.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="365" dy="0">Interruptor de parada: un</tspan></text><text x="365" y="232.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="365" dy="0">botón con dueño, ensayado</tspan></text><rect x="510" y="181" width="210" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="615" y="208" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="615" dy="0">Telemetría: salidas frente</tspan></text><text x="615" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="615" dy="0">a entradas y versión por</tspan></text><text x="615" y="241.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="615" dy="0">nodo</tspan></text><rect x="760" y="181" width="170" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="845" y="216.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="845" dy="0">Alerta con</tspan></text><text x="845" y="232.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="845" dy="0">responsable y guion</tspan></text><polyline points="115,181 540,127" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="365,181 590,127" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><polyline points="615,181 615,127" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="720,221 760,221" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: la puerta previa no depende del código de SMARS; vigila cantidades que salen, no la intención del software.</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un error de SMARS no puede disfrazarse de orden válida si la puerta cuenta lo que cruza. Es una propuesta didáctica</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">coherente con las deficiencias de la SEC, no una descripción de lo que Knight adoptó.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en el informe de la SEC; no es una conclusión del regulador.</tspan></text></svg>
