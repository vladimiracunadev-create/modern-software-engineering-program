<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué haría una barrera de «salidas ≤ entradas»: el mismo error, con y sin tope</title><desc id="d">Modelo didáctico: cantidad acumulada de órdenes hijas enviadas como múltiplo de la cantidad de la orden madre; sin barrera crece sin límite mientras no se detenga manualmente; con una barrera que corta al llegar a una vez y media la madre se estabiliza y se emite una alerta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué haría una barrera de «salidas ≤ entradas»: el mismo error, con y sin tope</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin barrera</tspan></text><rect x="146.94" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Con barrera al 150 %</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,1</tspan></text><line x1="78.62" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="187" x2="78.62" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">10</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0</tspan></text><line x1="361.747" y1="87" x2="361.747" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="361.747" y1="387" x2="361.747" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="361.747" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="361.747" dy="0">20</tspan></text><line x1="626.873" y1="87" x2="626.873" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="626.873" y1="387" x2="626.873" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="626.873" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.873" dy="0">40</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">60</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Cantidad enviada ÷ cantidad de la madre (escala logarítmica)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Segundos desde el primer envío (modelo didáctico)</tspan></text><line x1="78.62" y1="287" x2="910" y2="287" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="84.62" y="281" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="84.62" dy="0">madre completa</tspan></text><polyline points="123.133,356.897 229.183,279.082 361.747,226.794 494.31,179.082 626.873,132.593 759.437,109.185 892,87" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="123.133" cy="356.897" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="229.183" cy="279.082" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="361.747" cy="226.794" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="494.31" cy="179.082" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="626.873" cy="132.593" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="759.437" cy="109.185" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="892" cy="87" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polyline points="123.133,356.897 229.183,279.082 255.696,269.391 892,269.391" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="117.633" y="351.397" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="223.683" y="273.582" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="250.196" y="263.891" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="886.5" y="263.891" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="295.696" y="209.391" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="295.696" dy="0">la barrera corta y avisa</tspan></text><line x1="258.256" y1="264.191" x2="287.696" y2="204.391" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los valores son ilustrativos: el modelo solo muestra la forma de las curvas. Lo documentado es que Knight no tenía ese</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">control y que enviaron millones de órdenes hijas por 212 madres. La barrera funciona porque cuenta lo que sale, no lo que</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el software cree que debe salir.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo didáctico con valores ilustrativos: no son datos medidos de Knight.</tspan></text></svg>
