<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El bucle que no se detenía: la parada dependía de una cuenta que ya no estaba donde debía</title><desc id="d">Flujo de una orden madre en el servidor con Power Peg: SMARS envía órdenes hijas; los centros devuelven ejecuciones; la función de cantidad acumulada, movida a un punto anterior del código en 2005, ya no se consulta antes de enviar la siguiente hija, de modo que el envío continúa aunque la orden madre esté completa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El bucle que no se detenía: la parada dependía de una cuenta que ya no estaba donde debía</tspan></text><rect x="10" y="51" width="200" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="84.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Orden madre llega con el</tspan></text><text x="110" y="100.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">indicador reutilizado</tspan></text><rect x="250" y="51" width="200" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="350" y="84.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="350" dy="0">SMARS envía una orden</tspan></text><text x="350" y="100.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="350" dy="0">hija</tspan></text><rect x="490" y="51" width="200" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="590" y="76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590" dy="0">El centro de negociación</tspan></text><text x="590" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590" dy="0">ejecuta y devuelve el</tspan></text><text x="590" y="109.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590" dy="0">relleno</tspan></text><rect x="730" y="51" width="200" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="830" y="76" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">Debería: sumar lo</tspan></text><text x="830" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">ejecutado y parar al</tspan></text><text x="830" y="109.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">completar la madre</tspan></text><polyline points="210,89 250,89" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,89 490,89" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,89 730,89" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="250" y="181" width="440" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="224.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En 2005 la cuenta acumulada se movió a un punto anterior</tspan></text><text x="470" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del código y Power Peg no se volvió a probar</tspan></text><rect x="730" y="181" width="200" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="216" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="830" dy="0">Aquí nadie contaba: la</tspan></text><text x="830" y="232.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="830" dy="0">hija siguiente salía</tspan></text><text x="830" y="249.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="830" dy="0">igual</tspan></text><polyline points="830,127 830,181" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><polyline points="730,229 690,229" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><polyline points="350,181 350,127" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><text x="318" y="159" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="318" dy="0">bucle</tspan></text><rect x="10" y="181" width="200" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="207.68" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">Otra parte del sistema</tspan></text><text x="110" y="224.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">sabía que la madre</tspan></text><text x="110" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">estaba completa; no se</tspan></text><text x="110" y="257.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">lo dijo a SMARS</tspan></text><rect x="10" y="297" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: el criterio de parada vivía en el código antiguo, no en el router como invariante. Con 212 órdenes madre eso</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">bastó para 4 millones de ejecuciones en unos 45 minutos. Es un fallo de acoplamiento oculto entre una función y la</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">condición que la limitaba.</tspan></text><text x="470" y="402.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). Párrafos 14, 16 y 17.</tspan></text></svg>
