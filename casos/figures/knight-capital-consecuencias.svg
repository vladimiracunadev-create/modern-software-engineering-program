<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 354" width="940" height="354" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la pérdida a la orden de la SEC: cadena de consecuencias</title><desc id="d">Cadena de seis eslabones desde el incidente de agosto de 2012: pérdida de más de 460 millones, problemas de capital neto, financiación de 400 millones en cinco días, fusión con GETCO en julio de 2013, orden de la SEC con multa de 12 millones, y consultor independiente con revisión de ciclo de desarrollo, despliegue, routers, capital e incidentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="354" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la pérdida a la orden de la SEC: cadena de consecuencias</tspan></text><text x="78" y="65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="78" dy="0">1 ago 2012</tspan></text><rect x="10" y="77" width="136" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="78" y="122.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="78" dy="0">Pérdida de más</tspan></text><text x="78" y="139" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="78" dy="0">de 460 M y</tspan></text><text x="78" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="78" dy="0">posiciones de</tspan></text><text x="78" y="172.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="78" dy="0">miles de</tspan></text><text x="78" y="188.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="78" dy="0">millones</tspan></text><polyline points="146,151 166,151" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="234" y="65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="234" dy="0">1 ago 2012</tspan></text><rect x="166" y="77" width="136" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="234" y="130.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="234" dy="0">Problemas de</tspan></text><text x="234" y="147.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="234" dy="0">capital neto y</tspan></text><text x="234" y="163.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="234" dy="0">violaciones de</tspan></text><text x="234" y="180.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="234" dy="0">Regulación SHO</tspan></text><polyline points="302,151 322,151" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="390" y="65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="390" dy="0">6 ago 2012</tspan></text><rect x="322" y="77" width="136" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="390" y="122.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">Financiación de</tspan></text><text x="390" y="139" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">400 M en</tspan></text><text x="390" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">acciones</tspan></text><text x="390" y="172.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">preferentes</tspan></text><text x="390" y="188.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">convertibles</tspan></text><polyline points="458,151 478,151" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="546" y="65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="546" dy="0">1 jul 2013</tspan></text><rect x="478" y="77" width="136" height="150" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="546" y="139" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="546" dy="0">Fusión con</tspan></text><text x="546" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="546" dy="0">GETCO: nace KCG</tspan></text><text x="546" y="172.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="546" dy="0">Holdings</tspan></text><polyline points="614,151 634,151" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="702" y="65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702" dy="0">16 oct 2013</tspan></text><rect x="634" y="77" width="136" height="150" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="702" y="122.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="702" dy="0">Orden de la</tspan></text><text x="702" y="139" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="702" dy="0">SEC: multa de</tspan></text><text x="702" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="702" dy="0">12 M, censura,</tspan></text><text x="702" y="172.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="702" dy="0">cese y</tspan></text><text x="702" y="188.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="702" dy="0">desistimiento</tspan></text><polyline points="770,151 790,151" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="858" y="65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="858" dy="0">Tras la orden</tspan></text><rect x="790" y="77" width="136" height="150" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="858" y="105.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="858" dy="0">Consultor</tspan></text><text x="858" y="122.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="858" dy="0">independiente</tspan></text><text x="858" y="139" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="858" dy="0">sobre software,</tspan></text><text x="858" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="858" dy="0">despliegue,</tspan></text><text x="858" y="172.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="858" dy="0">routers,</tspan></text><text x="858" y="188.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="858" dy="0">capital e</tspan></text><text x="858" y="205.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="858" dy="0">incidentes</tspan></text><rect x="10" y="247" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="271.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: un fallo técnico de 45 minutos tuvo efectos corporativos, financieros y regulatorios durante catorce meses.</tspan></text><text x="470" y="288.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada eslabón es documentado; la relación causal entre la pérdida y la fusión es interpretación y no figura en la orden.</tspan></text><text x="470" y="336.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). Párrafos 1, 11, 35, 50, 51 y sanciones. Financiación: comunicado de Knight del 6 de agosto de 2012.</tspan></text></svg>
