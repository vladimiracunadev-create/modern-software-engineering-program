<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 442" width="940" height="442" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde habría cortado cada control la cadena del fallo</title><desc id="d">Cadena de seis eslabones de la orden madre al capital; debajo de cada uno, el control que habría limitado el daño: segunda persona que revise el despliegue, retirada del código muerto, parada automática por desvío entre órdenes de entrada y de salida, alerta sobre los correos, límite automático de capital que bloquee el envío, y ensayo de reversión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="442" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dónde habría cortado cada control la cadena del fallo</tspan></text><rect x="10" y="51" width="140" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="80" y="84" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="80" dy="0">Despliegue a</tspan></text><text x="80" y="100.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="80" dy="0">mano en 8</tspan></text><text x="80" y="117.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="80" dy="0">servidores</tspan></text><rect x="10" y="181" width="140" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="80" y="218.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="80" dy="0">Segunda revisión</tspan></text><text x="80" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="80" dy="0">+ despliegue</tspan></text><text x="80" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="80" dy="0">automatizado y</tspan></text><text x="80" y="268.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="80" dy="0">verificado</tspan></text><polyline points="80,143 80,181" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="150,97 170,97" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="170" y="51" width="140" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="92.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">Código muerto</tspan></text><text x="240" y="108.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">sigue invocable</tspan></text><rect x="170" y="181" width="140" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="218.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Borrar el código</tspan></text><text x="240" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">y sus pruebas,</tspan></text><text x="240" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">no reutilizar</tspan></text><text x="240" y="268.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">indicadores</tspan></text><polyline points="240,143 240,181" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="310,97 330,97" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="51" width="140" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="400" y="84" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">Orden con</tspan></text><text x="400" y="100.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">indicador</tspan></text><text x="400" y="117.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">reutilizado</tspan></text><rect x="330" y="181" width="140" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="400" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="400" dy="0">Nueva bandera o</tspan></text><text x="400" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="400" dy="0">ruta para el RLP</tspan></text><polyline points="400,143 400,181" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,97 490,97" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="490" y="51" width="140" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="560" y="92.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="560" dy="0">Bucle de órdenes</tspan></text><text x="560" y="108.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="560" dy="0">hijas</tspan></text><rect x="490" y="181" width="140" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="560" y="210.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="560" dy="0">Límite de</tspan></text><text x="560" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="560" dy="0">salidas frente a</tspan></text><text x="560" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="560" dy="0">entradas;</tspan></text><text x="560" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="560" dy="0">interruptor de</tspan></text><text x="560" y="276.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="560" dy="0">parada</tspan></text><polyline points="560,143 560,181" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="630,97 650,97" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="650" y="51" width="140" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="720" y="84" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="720" dy="0">Posición</tspan></text><text x="720" y="100.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="720" dy="0">acumulada en la</tspan></text><text x="720" y="117.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="720" dy="0">cuenta 33</tspan></text><rect x="650" y="181" width="140" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="720" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="720" dy="0">Umbral de</tspan></text><text x="720" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="720" dy="0">capital que</tspan></text><text x="720" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="720" dy="0">bloquea el envío</tspan></text><polyline points="720,143 720,181" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="790,97 810,97" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="810" y="51" width="140" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="880" y="92.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="880" dy="0">Pérdida de</tspan></text><text x="880" y="108.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="880" dy="0">capital</tspan></text><rect x="810" y="181" width="140" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="880" y="218.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="880" dy="0">Plan de</tspan></text><text x="880" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="880" dy="0">reversión</tspan></text><text x="880" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="880" dy="0">ensayado y guion</tspan></text><text x="880" y="268.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="880" dy="0">de incidente</tspan></text><polyline points="880,143 880,181" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="14" y="169" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Control que habría interrumpido el eslabón</tspan></text><rect x="10" y="319" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="343.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los controles son análisis propio: la SEC señala la ausencia de cada uno de ellos como deficiencia, pero la elección</tspan></text><text x="470" y="360.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">concreta es nuestra. Cualquiera de los seis eslabones cortados antes de la apertura habría reducido el daño; los últimos</tspan></text><text x="470" y="377.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">limitan el tamaño aunque los primeros fallen.</tspan></text><text x="470" y="424.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en el informe de la SEC; no es una conclusión del regulador.</tspan></text></svg>
