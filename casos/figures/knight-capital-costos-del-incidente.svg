<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 423" width="940" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto costó el 1 de agosto: pérdida, deterioro y sanción</title><desc id="d">Barras horizontales en millones de dólares: pérdida de negociación de 457,6; costos legales y profesionales relacionados de unos 10,5 (diferencia entre 468,1 y 457,6); deterioro no monetario de fondo de comercio e intangibles de 143,0; multa de la SEC de 12 en 2013.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="423" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto costó el 1 de agosto: pérdida, deterioro y sanción</tspan></text><line x1="324" y1="49" x2="324" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="225" x2="324" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="49" x2="434.34" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="225" x2="434.34" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="434.34" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.34" dy="0">100</tspan></text><line x1="544.68" y1="49" x2="544.68" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="544.68" y1="225" x2="544.68" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="544.68" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.68" dy="0">200</tspan></text><line x1="655.02" y1="49" x2="655.02" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="655.02" y1="225" x2="655.02" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="655.02" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.02" dy="0">300</tspan></text><line x1="765.36" y1="49" x2="765.36" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="765.36" y1="225" x2="765.36" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="765.36" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.36" dy="0">400</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="225" x2="875.7" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">500</tspan></text><line x1="324" y1="225" x2="875.7" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Pérdida de negociación</tspan></text><text x="314" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Legales y profesionales (por diferencia)</tspan></text><text x="314" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Deterioro de fondo de comercio e</tspan></text><text x="314" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">intangibles</tspan></text><text x="314" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Multa de la SEC (2013)</tspan></text><rect x="324" y="55" width="504.916" height="32" rx="3" fill="#c0432f"/><text x="835.916" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="835.916" dy="0">457,6</tspan></text><rect x="324" y="99" width="11.5857" height="32" rx="3" fill="#c0432f"/><text x="342.586" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="342.586" dy="0">10,5</tspan></text><rect x="324" y="143" width="157.786" height="32" rx="3" fill="#c0432f"/><text x="488.786" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="488.786" dy="0">143,0</tspan></text><rect x="324" y="187" width="13.2408" height="32" rx="3" fill="#c0432f"/><text x="344.241" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="344.241" dy="0">12,0</tspan></text><text x="599.85" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Millones de dólares de EE. UU.</tspan></text><rect x="10" y="283" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El 10-K da 468,1 como pérdida total con costos legales y profesionales y 457,6 como pérdida de negociación; los 10,5 son la</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resta, aritmética propia. El deterioro de 143,0 es contable y no es dinero que saliera ese día. No figuran las</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reclamaciones de seguros y el 10-K no dice que hubiera recuperación. Los 400 millones de capital recaudados (de los que</tspan></text><text x="470" y="357.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">359,5 fueron netos) financiaron la continuidad, no son un costo.</tspan></text><text x="470" y="405.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Knight Capital Group, Form 10-K del ejercicio 2012 (1 de marzo de 2013). Multa: SEC, Release No. 34-70694.</tspan></text></svg>
