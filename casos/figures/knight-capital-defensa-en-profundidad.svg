<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" width="940" height="492" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defensa en profundidad: ocho barreras y por qué el riesgo las atravesó</title><desc id="d">Esquema de láminas con huecos: ocho barreras por las que debía pasar el defecto, de la revisión de despliegue al gobierno de cumplimiento; las barreras ausentes (revisión, alerta, control de salida, capital, guion) están en rojo y las parciales en dorado; una flecha atraviesa todos los huecos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="492" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Defensa en profundidad: ocho barreras y por qué el riesgo las atravesó</tspan></text><rect x="30" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="42" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="9" y="231" width="104" height="120" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="61" y="261.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">Revisión de</tspan></text><text x="61" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">segunda</tspan></text><text x="61" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">persona del</tspan></text><text x="61" y="311.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">despliegue</tspan></text><text x="61" y="327.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">(ausente)</tspan></text><rect x="143" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="155" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="122" y="231" width="104" height="120" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="174" y="261.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="174" dy="0">Retirada o</tspan></text><text x="174" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="174" dy="0">retest del</tspan></text><text x="174" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="174" dy="0">código</tspan></text><text x="174" y="311.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="174" dy="0">muerto</tspan></text><text x="174" y="327.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="174" dy="0">(ausente)</tspan></text><rect x="256" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="268" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="235" y="231" width="104" height="120" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="287" y="261.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="287" dy="0">Alerta</tspan></text><text x="287" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="287" dy="0">sobre 97</tspan></text><text x="287" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="287" dy="0">correos</tspan></text><text x="287" y="311.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="287" dy="0">(existió,</tspan></text><text x="287" y="327.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="287" dy="0">sin dueño)</tspan></text><rect x="369" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="381" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="348" y="231" width="104" height="120" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="400" y="269.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">Control de</tspan></text><text x="400" y="286.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">salida en</tspan></text><text x="400" y="302.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">SMARS</tspan></text><text x="400" y="319.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">(ausente)</tspan></text><rect x="482" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="494" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="461" y="231" width="104" height="120" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="513" y="261.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="513" dy="0">Tope de</tspan></text><text x="513" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="513" dy="0">precio del</tspan></text><text x="513" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="513" dy="0">9,5 % (no</tspan></text><text x="513" y="311.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="513" dy="0">cubría</tspan></text><text x="513" y="327.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="513" dy="0">preapertura)</tspan></text><rect x="595" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="607" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="574" y="231" width="104" height="120" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="626" y="261.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">Límite de</tspan></text><text x="626" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">capital</tspan></text><text x="626" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">agregado</tspan></text><text x="626" y="311.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">vinculado</tspan></text><text x="626" y="327.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">(ausente)</tspan></text><rect x="708" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="720" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="687" y="231" width="104" height="120" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="739" y="261.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">PMON</tspan></text><text x="739" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">observado</tspan></text><text x="739" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">por</tspan></text><text x="739" y="311.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">personas</tspan></text><text x="739" y="327.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">(tardío)</tspan></text><rect x="821" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="833" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="800" y="231" width="104" height="120" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="852" y="269.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">Guion de</tspan></text><text x="852" y="286.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">incidente y</tspan></text><text x="852" y="302.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">kill switch</tspan></text><text x="852" y="319.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">(ausente)</tspan></text><polyline points="10,136 930,136" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="369" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: ninguna barrera era perfecta, pero la clave es la alineación: no había una sola que, por sí misma, detuviera</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el daño. La flecha roja es el defecto activo. Cinco de las ocho no existían y tres existían sin eficacia real. Es análisis</tspan></text><text x="470" y="427.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">propio de la lista de deficiencias de la SEC.</tspan></text><text x="470" y="474.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en el informe de la SEC; no es una conclusión del regulador. Párrafos 15 a 27.</tspan></text></svg>
