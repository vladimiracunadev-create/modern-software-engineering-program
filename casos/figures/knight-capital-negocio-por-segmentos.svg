<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El negocio de Knight por segmentos: lo que cayó en 2012</title><desc id="d">Barras horizontales con los ingresos de 2011 y 2012 en millones de dólares por segmento: creación de mercado de 704 a 61, ventas y negociación institucional de 512 a 468, ejecución electrónica de 168 a 159 y corporativo y otros de 21 a 48.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El negocio de Knight por segmentos: lo que cayó en 2012</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">2011</tspan></text><rect x="94.16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="114.16" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="114.16" dy="0">2012</tspan></text><line x1="304" y1="77" x2="304" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="304" y1="333" x2="304" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="304" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="304" dy="0">0</tspan></text><line x1="446.925" y1="77" x2="446.925" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="446.925" y1="333" x2="446.925" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="446.925" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="446.925" dy="0">200</tspan></text><line x1="589.85" y1="77" x2="589.85" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="589.85" y1="333" x2="589.85" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="589.85" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="589.85" dy="0">400</tspan></text><line x1="732.775" y1="77" x2="732.775" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="732.775" y1="333" x2="732.775" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="732.775" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732.775" dy="0">600</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="333" x2="875.7" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">800</tspan></text><line x1="304" y1="333" x2="875.7" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="294" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Creación de mercado</tspan></text><text x="294" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Ventas y negociación institucional</tspan></text><text x="294" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Ejecución electrónica</tspan></text><text x="294" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Corporativo y otros</tspan></text><rect x="304" y="83" width="503.453" height="24.5" rx="3" fill="#102a43"/><text x="814.453" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="814.453" dy="0">704,5</tspan></text><rect x="304" y="110.5" width="43.5207" height="24.5" rx="3" fill="#c0432f"/><text x="354.521" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="354.521" dy="0">60,9</tspan></text><rect x="304" y="147" width="365.531" height="24.5" rx="3" fill="#102a43"/><text x="676.531" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="676.531" dy="0">511,5</tspan></text><rect x="304" y="174.5" width="334.73" height="24.5" rx="3" fill="#c0432f"/><text x="645.73" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="645.73" dy="0">468,4</tspan></text><rect x="304" y="211" width="119.986" height="24.5" rx="3" fill="#102a43"/><text x="430.986" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="430.986" dy="0">167,9</tspan></text><rect x="304" y="238.5" width="113.697" height="24.5" rx="3" fill="#c0432f"/><text x="424.697" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="424.697" dy="0">159,1</tspan></text><rect x="304" y="275" width="14.7213" height="24.5" rx="3" fill="#102a43"/><text x="325.721" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="325.721" dy="0">20,6</tspan></text><rect x="304" y="302.5" width="34.0876" height="24.5" rx="3" fill="#c0432f"/><text x="345.088" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="345.088" dy="0">47,7</tspan></text><text x="589.85" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="589.85" dy="0">Millones de dólares de EE. UU. (ingresos del segmento)</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los ingresos consolidados pasaron de 1 404,5 a 736,1 millones. El segmento que más cayó es el de creación de mercado, el</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que más dependía de ejecutar volumen con márgenes pequeños; el 10-K no separa cuánto de esa caída se debe al 1 de agosto y</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuánto a otros factores de 2012, así que la figura no atribuye la caída.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Knight Capital Group, Form 10-K del ejercicio 2012 (1 de marzo de 2013). Cifras redondeadas a una décima.</tspan></text></svg>
