<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 586" width="940" height="586" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuencia de la mañana del 1 de agosto de 2012, paso a paso</title><desc id="d">Diagrama de secuencia con cinco participantes: brokers, gestor de órdenes, SMARS en el octavo servidor, bolsas y el personal de Knight. Las órdenes llegan con el indicador reutilizado, SMARS envía hijas sin parar, las bolsas ejecutan, la cuenta 33 acumula, el personal ve las posiciones y, al desinstalar el código nuevo, el problema empeora.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="586" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Secuencia de la mañana del 1 de agosto de 2012, paso a paso</tspan></text><rect x="35" y="51" width="150" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="69.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="110" dy="0">Brokers (clientes</tspan></text><text x="110" y="85.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="110" dy="0">RLP)</tspan></text><rect x="215" y="51" width="150" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="290" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="290" dy="0">Gestor de órdenes</tspan></text><rect x="395" y="51" width="150" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">SMARS, servidor 8</tspan></text><rect x="575" y="51" width="150" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="650" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="650" dy="0">Bolsas</tspan></text><rect x="755" y="51" width="150" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="830" y="69.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="830" dy="0">Personal de</tspan></text><text x="830" y="85.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="830" dy="0">Knight</tspan></text><line x1="110" y1="97" x2="110" y2="451" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="290" y1="97" x2="290" y2="451" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="470" y1="97" x2="470" y2="451" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="650" y1="97" x2="650" y2="451" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="830" y1="97" x2="830" y2="451" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="110,130 290,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="200" y="122" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="200" dy="0">1. 212 órdenes madre</tspan></text><polyline points="290,164 470,164" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="380" y="156" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380" dy="0">2. pasa las madre</tspan></text><polyline points="470,198 650,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="190" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560" dy="0">3. hijas sin parar</tspan></text><polyline points="650,232 470,232" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="560" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560" dy="0">4. ejecuciones</tspan></text><polyline points="290,266 470,266" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="380" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380" dy="0">5. completa: no avisa</tspan></text><rect x="345" y="281" width="250" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">6. cuenta 33 acumula</tspan></text><rect x="684" y="315" width="250" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="809" y="333.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="809" dy="0">7. ven posiciones</tspan></text><polyline points="830,368 470,368" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="650" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650" dy="0">8. desinstalan RLP en 7 servidores</tspan></text><polyline points="470,402 650,402" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="560" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560" dy="0">9. más hijas (Power Peg)</tspan></text><polyline points="830,436 650,436" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="740" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="740" dy="0">10. parada tras ≈ 45 min</tspan></text><rect x="10" y="463" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="487.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: en toda la secuencia ningún participante tenía autoridad automática para parar a SMARS. Las personas vieron</tspan></text><text x="470" y="504.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">las posiciones pero el único medio disponible fue cambiar el software en caliente; el paso 8 muestra por qué eso es otro</tspan></text><text x="470" y="521.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cambio de producción.</tspan></text><text x="470" y="568.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). Párrafos 16, 24, 25 y 27. El orden fino de los pasos 5 a 8 es una reconstrucción; la orden no da horas.</tspan></text></svg>
