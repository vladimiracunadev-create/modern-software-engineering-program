<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 424" width="940" height="424" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho servidores de SMARS: siete con código nuevo y uno con código viejo</title><desc id="d">Diagrama de despliegue: el código nuevo del Retail Liquidity Program se copió en siete de los ocho servidores de SMARS; en el octavo siguió presente el código Power Peg, abandonado en 2003, que reutilizaba el mismo indicador de activación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="424" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocho servidores de SMARS: siete con código nuevo y uno con código viejo</tspan></text><text x="14" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Despliegue escalonado desde el 27 de julio de 2012 (un técnico, sin segunda revisión)</tspan></text><rect x="14" y="85" width="100" height="86" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="64" y="123.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="64" dy="0">Servidor 1</tspan></text><text x="64" y="139.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="64" dy="0">RLP nuevo</tspan></text><rect x="123" y="85" width="100" height="86" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="173" y="123.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="173" dy="0">Servidor 2</tspan></text><text x="173" y="139.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="173" dy="0">RLP nuevo</tspan></text><rect x="232" y="85" width="100" height="86" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="282" y="123.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="282" dy="0">Servidor 3</tspan></text><text x="282" y="139.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="282" dy="0">RLP nuevo</tspan></text><rect x="341" y="85" width="100" height="86" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="391" y="123.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="391" dy="0">Servidor 4</tspan></text><text x="391" y="139.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="391" dy="0">RLP nuevo</tspan></text><rect x="450" y="85" width="100" height="86" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="123.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">Servidor 5</tspan></text><text x="500" y="139.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">RLP nuevo</tspan></text><rect x="559" y="85" width="100" height="86" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="609" y="123.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="609" dy="0">Servidor 6</tspan></text><text x="609" y="139.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="609" dy="0">RLP nuevo</tspan></text><rect x="668" y="85" width="100" height="86" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="718" y="123.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="718" dy="0">Servidor 7</tspan></text><text x="718" y="139.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="718" dy="0">RLP nuevo</tspan></text><rect x="777" y="85" width="100" height="86" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="827" y="106.68" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="827" dy="0">Servidor 8</tspan></text><text x="827" y="123.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="827" dy="0">Power Peg</tspan></text><text x="827" y="139.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="827" dy="0">vivo, sin</tspan></text><text x="827" y="156.6" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="827" dy="0">RLP</tspan></text><text x="14" y="199" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Llega una orden con el indicador reutilizado en «sí»:</tspan></text><rect x="14" y="213" width="410" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="219" y="243.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="219" dy="0">Servidores 1–7: se activa el RLP nuevo y la orden se</tspan></text><text x="219" y="259.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="219" dy="0">procesa bien</tspan></text><rect x="450" y="213" width="470" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="685" y="243.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="685" dy="0">Servidor 8: se activa Power Peg, que ya no sabía dejar de</tspan></text><text x="685" y="259.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="685" dy="0">enviar órdenes hijas</tspan></text><polyline points="750,171 750,213" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="220,171 220,213" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="301" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: el mismo indicador significaba cosas distintas según el servidor. Una versión mezclada en producción es un</tspan></text><text x="470" y="342.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sistema distinto en cada nodo. Después, al desinstalar el código nuevo de los siete servidores correctos, también ellos</tspan></text><text x="470" y="359.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">activaron Power Peg: la reversión empeoró el problema.</tspan></text><text x="470" y="406.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). Párrafos 13–16 y 27.</tspan></text></svg>
