<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 526" width="940" height="526" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién da qué a quién: los actores del ecosistema de Mercado Libre</title><desc id="d">Diagrama de incentivos: el comprador paga y recibe con protección; el vendedor paga comisiones y obtiene alcance, cobro y envío; el anunciante paga por visibilidad; quien usa servicios financieros obtiene cuenta, tarjeta o crédito; los transportistas y las tiendas de barrio prestan logística; los reguladores fijan reglas; Mercado Libre integra todo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="526" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién da qué a quién: los actores del ecosistema de Mercado Libre</tspan></text><rect x="340" y="160" width="260" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="197" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Mercado Libre: marketplace,</tspan></text><text x="470" y="213.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">pagos, envíos, publicidad y</tspan></text><text x="470" y="230.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">crédito en una plataforma</tspan></text><rect x="10" y="56" width="250" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">Comprador: paga y recibe con</tspan></text><text x="135" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">protección ante incumplimientos</tspan></text><rect x="345" y="56" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Vendedor: paga comisiones;</tspan></text><text x="470" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">obtiene alcance, cobro y envío</tspan></text><rect x="680" y="56" width="250" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="805" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="805" dy="0">Anunciante y marcas: pagan por</tspan></text><text x="805" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="805" dy="0">visibilidad en Mercado Ads</tspan></text><rect x="10" y="300" width="250" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="330.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">Usuario fintech: billetera,</tspan></text><text x="135" y="346.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">tarjeta, ahorro o crédito</tspan></text><rect x="345" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="322" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Transportistas y tiendas de</tspan></text><text x="470" y="338.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">barrio (MELI Places): prestan</tspan></text><text x="470" y="355.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">logística</tspan></text><rect x="680" y="300" width="250" height="80" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="805" y="327" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="805" dy="0">Reguladores y bancos centrales:</tspan></text><text x="805" y="343.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="805" dy="0">pagos, lavado de activos,</tspan></text><text x="805" y="360.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="805" dy="0">competencia</tspan></text><polyline points="200,126 340,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="250" y="150" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="250" dy="0">compra</tspan></text><polyline points="470,126 470,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="520" y="148" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="520" dy="0">comisión</tspan></text><polyline points="690,126 600,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="670" y="160" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="670" dy="0">anuncios</tspan></text><polyline points="340,240 230,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="265" y="270" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="265" dy="0">crédito</tspan></text><polyline points="470,260 470,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,300 600,245" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="400" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="424.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el 10-K: el modelo cobra comisiones por valor final y tarifas fijas, envíos, publicidad y servicios fintech;</tspan></text><text x="470" y="441.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la logística combina centros propios con transportistas externos y comercios vecinales; hay un programa de protección al</tspan></text><text x="470" y="458.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comprador; los reguladores son los bancos centrales y autoridades de competencia. No se sabe cómo se negocian las tarifas</tspan></text><text x="470" y="474.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con transportistas ni con comercios.</tspan></text><text x="470" y="512.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informes anuales y comunicados de Mercado Libre y el caso publicado por Go, citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
