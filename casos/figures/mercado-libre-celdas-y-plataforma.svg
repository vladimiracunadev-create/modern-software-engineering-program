<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 487" width="940" height="487" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Celdas autónomas, API abiertas y una plataforma interna que oculta la infraestructura</title><desc id="d">Diagrama por capas: equipos organizados en celdas con su propio código, datos y hardware, que se comunican por API; una plataforma interna (Fury) entre los desarrolladores y los proveedores de nube; servicios en Go dentro de contenedores; y terceros que integran la plataforma mediante las mismas API.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="487" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Celdas autónomas, API abiertas y una plataforma interna que oculta la infraestructura</tspan></text><rect x="10" y="52" width="170" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="87.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Terceros</tspan></text><rect x="192" y="52" width="738" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="561" y="79.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="561" dy="0">Desarrolladores externos integran el marketplace y Mercado Pago con las API públicas y construyen</tspan></text><text x="561" y="95.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="561" dy="0">empresas sobre ellas</tspan></text><rect x="10" y="132" width="170" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="167.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Celdas</tspan></text><rect x="192" y="132" width="738" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="561" y="167.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="561" dy="0">Unidad funcional con su equipo, hardware, datos y código fuente; se hablan solo por API</tspan></text><rect x="10" y="212" width="170" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="247.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Servicios</tspan></text><rect x="192" y="212" width="738" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="561" y="239.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="561" dy="0">API centrales en Go sobre contenedores: de 8 a 10 millones de peticiones por minuto en una API de</tspan></text><text x="561" y="255.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="561" dy="0">usuarios</tspan></text><rect x="10" y="292" width="170" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="95" y="327.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="95" dy="0">Plataforma</tspan></text><rect x="192" y="292" width="738" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="561" y="319.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="561" dy="0">Fury: plataforma como servicio propia para construir, desplegar, monitorear y gestionar servicios</tspan></text><text x="561" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="561" dy="0">sin atarse a una nube</tspan></text><rect x="10" y="378" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="402.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo documentado procede del informe anual de 2022 (celdas, API abiertas, plataforma como servicio propia) y del caso</tspan></text><text x="470" y="419.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">publicado por Go (Fury, contenedores, cifras de tráfico). El número de celdas, los nombres de los servicios y la nube</tspan></text><text x="470" y="436.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">concreta no se publican en esas fuentes.</tspan></text><text x="470" y="473.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informes anuales y comunicados de Mercado Libre y el caso publicado por Go, citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
