<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 473" width="940" height="473" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema del negocio: cuatro corrientes de ingreso y de qué viven</title><desc id="d">Diagrama de flujos: compradores y vendedores generan comisiones y envíos; los anunciantes pagan por visibilidad; los usuarios financieros generan comisiones por pagos, intereses de crédito y venta de terminales; Mercado Libre paga logística, fondeo, pérdidas de crédito, marketing y tecnología y retiene el resultado operativo, de 3 201 millones en 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="473" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema del negocio: cuatro corrientes de ingreso y de qué viven</tspan></text><rect x="10" y="56" width="220" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120" dy="0">Compradores y vendedores:</tspan></text><text x="120" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120" dy="0">comisiones y envíos</tspan></text><rect x="10" y="130" width="220" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="120" y="157.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120" dy="0">Anunciantes: publicidad en</tspan></text><text x="120" y="173.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120" dy="0">el marketplace</tspan></text><rect x="10" y="204" width="220" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120" y="231.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120" dy="0">Usuarios fintech: pagos,</tspan></text><text x="120" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120" dy="0">tarjetas y cuotas</tspan></text><rect x="10" y="278" width="220" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="120" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120" dy="0">Quien toma crédito:</tspan></text><text x="120" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120" dy="0">intereses</tspan></text><rect x="330" y="120" width="270" height="110" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="465" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465" dy="0">Mercado Libre: 28 893 millones de</tspan></text><text x="465" y="178.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465" dy="0">ingresos netos y financieros en</tspan></text><text x="465" y="195.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465" dy="0">2025</tspan></text><rect x="700" y="56" width="230" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="815" y="79.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="815" dy="0">Costo de ingresos: 55,5 %</tspan></text><text x="815" y="95.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="815" dy="0">(envíos, fondeo, bienes)</tspan></text><rect x="700" y="122" width="230" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="815" y="145.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">Provisión por incobrables:</tspan></text><text x="815" y="161.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">10,7 %</tspan></text><rect x="700" y="188" width="230" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="815" y="211.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="815" dy="0">Marketing, tecnología y</tspan></text><text x="815" y="227.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="815" dy="0">administración: 22,7 %</tspan></text><rect x="700" y="254" width="230" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="815" y="285.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="815" dy="0">Resultado operativo: 11,1 %</tspan></text><polyline points="230,88 330,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="230,162 330,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="230,236 330,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="230,310 330,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="600,175 700,84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="600,175 700,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="600,175 700,216" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="600,175 700,282" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="364" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="388.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Porcentajes de 2025 calculados con el 10-K: costo de ingresos y gastos financieros 16 035 millones (55,5 %), provisión para</tspan></text><text x="470" y="405.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuentas dudosas 3 091 (10,7 %), marketing 3 219, desarrollo 2 269 y administración 1 078 (22,7 % en conjunto) y resultado</tspan></text><text x="470" y="422.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">operativo 3 201 (11,1 %). Las dos cajas de ingresos de abajo son la línea fintech; el 10-K no asigna costes por corriente.</tspan></text><text x="470" y="459.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Mercado Libre, Form 10-K de 2019, 2021, 2024 y 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
