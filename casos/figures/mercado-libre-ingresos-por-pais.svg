<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 355" width="940" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De dónde vienen los ingresos de Mercado Libre: 2021 y 2022 (millones de USD)</title><desc id="d">Barras apiladas al cien por ciento: Brasil aporta 55 por ciento de los ingresos en 2021 y 54 por ciento en 2022, Argentina 22 y 24 por ciento, México 17 y 18 por ciento, y el resto de los países 6 y 5 por ciento; tres países suman cerca del 95 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="355" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De dónde vienen los ingresos de Mercado Libre: 2021 y 2022 (millones de USD)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Brasil</tspan></text><rect x="109.24" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">Argentina</tspan></text><rect x="225.1" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="245.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="245.1" dy="0">México</tspan></text><rect x="318.34" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="338.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="338.34" dy="0">Otros países</tspan></text><line x1="214" y1="77" x2="214" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="157" x2="214" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="379.425" y1="77" x2="379.425" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="379.425" y1="157" x2="379.425" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="379.425" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="379.425" dy="0">25</tspan></text><line x1="544.85" y1="77" x2="544.85" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="544.85" y1="157" x2="544.85" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="544.85" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.85" dy="0">50</tspan></text><line x1="710.275" y1="77" x2="710.275" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="710.275" y1="157" x2="710.275" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="710.275" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="710.275" dy="0">75</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="214" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">2021 (ingresos 7 069)</tspan></text><text x="204" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">2022 (ingresos 10 537)</tspan></text><rect x="214" y="84" width="365.999" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="397" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">55 %</tspan></text><rect x="579.999" y="84" width="143.311" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="651.654" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="651.654" dy="0">22 %</tspan></text><rect x="723.31" y="84" width="109.706" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="778.163" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="778.163" dy="0">17 %</tspan></text><rect x="833.016" y="84" width="42.6843" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="854.358" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="854.358" dy="0">6 %</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="214" y="124" width="355.812" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="391.906" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="391.906" dy="0">54 %</tspan></text><rect x="569.812" y="124" width="156.994" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="648.309" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="648.309" dy="0">24 %</tspan></text><rect x="726.807" y="124" width="117.055" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="785.334" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="785.334" dy="0">18 %</tspan></text><rect x="843.862" y="124" width="31.8385" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="544.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.85" dy="0">% del total</tspan></text><rect x="10" y="215" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los ingresos netos totales crecieron 49 por ciento entre 2021 y 2022 y la contribución directa pasó de 18,7 a 21,6 por</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ciento de los ingresos. Por país, la contribución directa de 2022 fue de 40,5 por ciento en Argentina frente a 15,3 en</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">México. Son dólares de cada año: la inflación y el tipo de cambio afectan lo que se informa; el informe señala ambos como</tspan></text><text x="470" y="289.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">riesgos.</tspan></text><text x="470" y="337.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Mercado Libre, Form 10-K del año 2022 (resultados por segmento). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
