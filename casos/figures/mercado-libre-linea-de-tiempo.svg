<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De un mercado en línea en Argentina a un ecosistema de comercio y finanzas (1999-2025)</title><desc id="d">Línea de tiempo con dos carriles: en negocio, la empresa nace en 1999 con lanzamientos en Argentina, Brasil, México y Uruguay, es privada hasta su salida a Nasdaq en agosto de 2007 y cotiza después; en tecnología, la pila histórica de Grails y Groovy llega hasta 2015, cuando se adopta Go, y después evolucionan las celdas y la plataforma Fury.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="380" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De un mercado en línea en Argentina a un ecosistema de comercio y finanzas (1999-2025)</tspan></text><line x1="124" y1="83" x2="124" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="124" y1="199" x2="124" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="124" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="124" dy="0">1999</tspan></text><line x1="240.741" y1="83" x2="240.741" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="240.741" y1="199" x2="240.741" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="240.741" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240.741" dy="0">2003</tspan></text><line x1="357.481" y1="83" x2="357.481" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="357.481" y1="199" x2="357.481" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="357.481" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357.481" dy="0">2007</tspan></text><line x1="474.222" y1="83" x2="474.222" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="474.222" y1="199" x2="474.222" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="474.222" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="474.222" dy="0">2011</tspan></text><line x1="590.963" y1="83" x2="590.963" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="590.963" y1="199" x2="590.963" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="590.963" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590.963" dy="0">2015</tspan></text><line x1="707.704" y1="83" x2="707.704" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="707.704" y1="199" x2="707.704" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="707.704" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.704" dy="0">2019</tspan></text><line x1="824.444" y1="83" x2="824.444" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="824.444" y1="199" x2="824.444" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="824.444" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="824.444" dy="0">2023</tspan></text><line x1="912" y1="83" x2="912" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="199" x2="912" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2026</tspan></text><line x1="124" y1="199" x2="912" y2="199" stroke="#5b7280" stroke-width="1.6"/><text x="114" y="116.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="114" dy="0">Negocio</tspan></text><text x="114" y="174.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="114" dy="0">Tecnología</tspan></text><line x1="124" y1="75" x2="124" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="124" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">Argentina</tspan></text><line x1="240.741" y1="75" x2="240.741" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="240.741" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="240.741" dy="0">Mercado Pago</tspan></text><line x1="357.481" y1="75" x2="357.481" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="357.481" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357.481" dy="0">IPO</tspan></text><line x1="590.963" y1="75" x2="590.963" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="590.963" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="590.963" dy="0">Giro a Go</tspan></text><rect x="124" y="92" width="233.481" height="40" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="240.741" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="240.741" dy="0">Privada: 4 países y eBay</tspan></text><rect x="357.481" y="92" width="554.519" height="40" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="634.741" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="634.741" dy="0">Cotizada en Nasdaq</tspan></text><line x1="14" y1="141" x2="912" y2="141" stroke="#d5dde1" stroke-width="1"/><rect x="124" y="150" width="466.963" height="40" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="357.481" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357.481" dy="0">Pila Grails y Groovy sobre bases relacionales</tspan></text><rect x="590.963" y="150" width="321.037" height="40" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="751.481" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="751.481" dy="0">Go, celdas, Fury</tspan></text><text x="518" y="243" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="518" dy="0">Año</tspan></text><rect x="10" y="257" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los años salen del informe anual de 2007 (lanzamientos, eBay, Nasdaq), del de 2022 (Mercado Pago) y del caso de Go (2015).</tspan></text><text x="470" y="298.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las dos barras de tecnología son una simplificación: el informe dice «históricamente» sin fechar el inicio de la pila y el</tspan></text><text x="470" y="315.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">caso de Go no fecha el final. El año 2026 es el límite de la figura, no un hito.</tspan></text><text x="470" y="362.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informes anuales y comunicados de Mercado Libre y el caso publicado por Go, citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
