<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Moneda e inflación: tres países concentran 96 por ciento de los ingresos (2025)</title><desc id="d">Barras agrupadas por país: porcentaje de los ingresos denominado en moneda local de 52,6 en Brasil, 22,4 en México y 20,6 en Argentina; e inflación de 2025 de 4,3, 3,7 y 31,5 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="520" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Moneda e inflación: tres países concentran 96 por ciento de los ingresos (2025)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ingresos en moneda local (%)</tspan></text><rect x="275.12" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="295.12" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="295.12" dy="0">Inflación de 2025 (%)</tspan></text><line x1="71.08" y1="345" x2="920" y2="345" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="345" x2="71.08" y2="345" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="349.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="261.667" x2="920" y2="261.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="261.667" x2="71.08" y2="261.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="266.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="178.333" x2="920" y2="178.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="178.333" x2="71.08" y2="178.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="182.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="345" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">por ciento</text><rect x="99.3773" y="125.833" width="111.189" height="219.167" rx="3" fill="#102a43"/><text x="154.972" y="119.833" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.972" dy="0">52,6</tspan></text><rect x="214.567" y="327.083" width="111.189" height="17.9167" rx="3" fill="#c0432f"/><text x="270.161" y="321.083" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.161" dy="0">4,3</tspan></text><text x="212.567" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Brasil</tspan></text><rect x="382.351" y="251.667" width="111.189" height="93.3333" rx="3" fill="#102a43"/><text x="437.945" y="245.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.945" dy="0">22,4</tspan></text><rect x="497.54" y="329.583" width="111.189" height="15.4167" rx="3" fill="#c0432f"/><text x="553.135" y="323.583" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.135" dy="0">3,7</tspan></text><text x="495.54" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">México</tspan></text><rect x="665.324" y="259.167" width="111.189" height="85.8333" rx="3" fill="#102a43"/><text x="720.919" y="253.167" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.919" dy="0">20,6</tspan></text><rect x="780.513" y="213.75" width="111.189" height="131.25" rx="3" fill="#c0432f"/><text x="836.108" y="207.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.108" dy="0">31,5</tspan></text><text x="778.513" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Argentina</tspan></text><rect x="10" y="397" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="421.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Brasil, Argentina y México sumaron 95,6 por ciento de los ingresos de 2025. Argentina es el país con 31,5 por ciento de</tspan></text><text x="470" y="438.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">inflación y desde 2018 se clasifica como altamente inflacionario, por lo que su subsidiaria reporta en dólares. La barra de</tspan></text><text x="470" y="455.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Argentina muestra por qué comparar ingresos en dólares entre años engaña.</tspan></text><text x="470" y="502.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Mercado Libre, Form 10-K de 2019, 2021, 2024 y 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
