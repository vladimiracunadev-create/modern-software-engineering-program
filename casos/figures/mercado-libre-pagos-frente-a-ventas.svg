middle" font-weight="400" fill="#142231"><tspan x="345.79" dy="0">2018</tspan></text><line x1="423.82" y1="87" x2="423.82" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="423.82" y1="387" x2="423.82" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="423.82" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="423.82" dy="0">2019</tspan></text><line x1="735.94" y1="87" x2="735.94" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="735.94" y1="387" x2="735.94" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="735.94" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="735.94" dy="0">2023</tspan></text><line x1="813.97" y1="87" x2="813.97" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="813.97" y1="387" x2="813.97" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="813.97" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.97" dy="0">2024</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">2025</tspan></text><line x1="93.7" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Miles de millones de USD (escala logarítmica)</text><text x="501.85" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">Año fiscal (no se grafican 2020 a 2022)</tspan></text><polyline points="111.7,301.563 189.73,296.431 267.76,280 345.79,277.292 423.82,272.397 735.94,221.922 813.97,215.847 892,205.684" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="111.7" cy="301.563" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="111.7" y="290.563" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">7,2</tspan></text><circle cx="189.73" cy="296.431" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="189.73" y="285.431" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="189.73" dy="0">8,0</tspan></text><circle cx="267.76" cy="280" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="267.76" y="304" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="267.76" dy="0">11,7</tspan></text><circle cx="345.79" cy="277.292" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="345.79" y="301.292" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="345.79" dy="0">12,5</tspan></text><circle cx="423.82" cy="272.397" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="423.82" y="296.397" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="423.82" dy="0">14,0</tspan></text><circle cx="735.94" cy="221.922" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="735.94" y="245.922" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="735.94" dy="0">44,7</tspan></text><circle cx="813.97" cy="215.847" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="813.97" y="239.847" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="813.97" dy="0">51,5</tspan></text><circle cx="892" cy="205.684" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="229.684" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">65,0</tspan></text><polyline points="111.7,315.534 189.73,298.047 267.76,273.227 345.79,260.386 423.82,241.683 735.94,170.346 813.97,157.628 892,142.623" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="106.2" y="310.034" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="111.7" y="339.534" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">5</tspan></text><rect x="184.23" y="292.547" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="189.73" y="322.047" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="189.73" dy="0">8</tspan></text><rect x="262.26" y="267.727" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="267.76" y="262.227" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="267.76" dy="0">14</tspan></text><rect x="340.29" y="254.886" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="345.79" y="249.386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="345.79" dy="0">18</tspan></text><rect x="418.32" y="236.183" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="423.82" y="230.683" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="423.82" dy="0">28</tspan></text><rect x="730.44" y="164.846" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="735.94" y="159.346" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="735.94" dy="0">147</tspan></text><rect x="808.47" y="152.128" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="813.97" y="146.628" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="813.97" dy="0">197</tspan></text><rect x="886.5" y="137.123" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="131.623" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">278</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El volumen de pagos incluye cobros fuera del marketplace (puntos de venta, QR, billetera), por eso supera al valor vendido;</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en 2025 es 4,3 veces el GMV (277,8 frente a 65,0, cálculo propio) y en 2015 era 0,7 veces. Los años 2020 a 2022 no se</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">grafican porque no están en los 10-K citados; unir puntos no es una tasa de crecimiento.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Mercado Libre, Form 10-K de 2019, 2021, 2024 y 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
