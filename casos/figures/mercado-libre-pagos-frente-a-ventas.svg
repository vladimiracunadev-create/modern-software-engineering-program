<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los pagos crecen más que las ventas: GMV y volumen de pagos (miles de millones de USD)</title><desc id="d">Dos líneas en escala logarítmica: el valor vendido en el marketplace sube de 7,2 en 2015 a 65,0 en 2025 y el volumen de pagos de 5,2 a 277,8; desde 2017 el volumen de pagos supera al valor vendido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Los pagos crecen más que las ventas: GMV y volumen de pagos (miles de millones de USD)</tspan></text><circle cx="22" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Valor vendido en el marketplace (GMV)</tspan></text><rect x="342.98" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="362.98" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="362.98" dy="0">Volumen total de pagos (TPV)</tspan></text><line x1="93.7" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="387" x2="93.7" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/>