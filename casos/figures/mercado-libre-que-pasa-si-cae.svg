<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 525" width="940" height="525" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué pasa cuando cae cada componente de Mercado Libre: de lo pequeño a lo grande</title><desc id="d">Seis filas de falla creciente: una API lenta, un servicio de una celda, un pico estacional, una moneda que se deprecia, la nube de un proveedor y un competidor o regulador; efecto y mecanismo con rótulo de documentado, inferido o no se sabe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="525" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué pasa cuando cae cada componente de Mercado Libre: de lo pequeño a lo grande</tspan></text><rect x="10" y="56" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Una API lenta</tspan></text><rect x="330" y="56" width="600" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="630" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630" dy="0">Tiempos límite y reintentos con idempotencia (inferido); el 10-K no detalla</tspan></text><polyline points="290,82 330,82" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="118" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="147.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un servicio de una celda</tspan></text><rect x="330" y="118" width="600" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="139.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">La celda tiene su equipo, datos y código; el fallo se contiene en ella</tspan></text><text x="630" y="155.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">(documentado)</tspan></text><polyline points="290,144 330,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="180" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="209.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un pico estacional</tspan></text><rect x="330" y="180" width="600" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="201.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">Campañas y «dobles fechas» suavizan la demanda; la capacidad se dimensiona: no</tspan></text><text x="630" y="217.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">se sabe</tspan></text><polyline points="290,206 330,206" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="242" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="271.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Una moneda que se deprecia</tspan></text><rect x="330" y="242" width="600" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">Ingresos en varias monedas; Argentina reporta en dólares (documentado)</tspan></text><polyline points="290,268 330,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="304" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="333.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un proveedor de nube</tspan></text><rect x="330" y="304" width="600" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="325.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">Plataforma independiente de la nube; el 10-K declara dependencia de AWS y</tspan></text><text x="630" y="341.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">Google Cloud</tspan></text><polyline points="290,330 330,330" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="366" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="395.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un competidor o un regulador</tspan></text><rect x="330" y="366" width="600" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="387.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">Revisión de competencia en México cerrada sin medidas; licencia bancaria en</tspan></text><text x="630" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">revisión</tspan></text><polyline points="290,392 330,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="432" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="456.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el informe de 2022 (celdas), el caso de Go (Fury) y el 10-K de 2025 (temporadas, monedas, nube, competencia</tspan></text><text x="470" y="473.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y licencia). Inferido: reintentos e idempotencia. No se publica un plan de continuidad ni objetivos de disponibilidad.</tspan></text><text x="470" y="511.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informes anuales y comunicados de Mercado Libre y el caso publicado por Go, citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
