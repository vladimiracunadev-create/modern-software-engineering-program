<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 571" width="940" height="571" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco recorridos completos: de la primera interacción al caso límite</title><desc id="d">Cinco filas de pasos encadenados: comprador, vendedor que usa los centros de cumplimiento, usuario de crédito, desarrollador externo y anunciante; cada fila termina en su caso límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="571" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco recorridos completos: de la primera interacción al caso límite</tspan></text><rect x="10" y="54" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Comprador</tspan></text><rect x="174" y="54" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Busca y compara</tspan></text><rect x="366.5" y="54" width="178.5" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455.75" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">Paga con Mercado Pago</tspan></text><polyline points="352.5,86 366.5,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="54" width="178.5" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="648.25" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">Recibe por Mercado</tspan></text><text x="648.25" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">Envíos</tspan></text><polyline points="545,86 559,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="54" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: no llega o</tspan></text><text x="840.75" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">llega mal; protección</tspan></text><polyline points="737.5,86 751.5,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="130" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="165.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Vendedor</tspan></text><rect x="174" y="130" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="165.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Publica y fija precio</tspan></text><rect x="366.5" y="130" width="178.5" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455.75" y="157.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">Envía su stock a un</tspan></text><text x="455.75" y="173.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">centro</tspan></text><polyline points="352.5,162 366.5,162" fill="none" stroke="#32505f" stroke-width=