text x="455.75" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">crédito</tspan></text><polyline points="352.5,238 366.5,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="206" width="178.5" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="648.25" y="241.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">Paga en cuotas</tspan></text><polyline points="545,238 559,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="206" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: mora, con</tspan></text><text x="840.75" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">provisión de pérdidas</tspan></text><polyline points="737.5,238 751.5,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="282" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Desarrollador</tspan></text><rect x="174" y="282" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Crea una aplicación</tspan></text><rect x="366.5" y="282" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="455.75" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">Autoriza con OAuth</tspan></text><polyline points="352.5,314 366.5,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="282" width="178.5" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="648.25" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">Recibe notificaciones</tspan></text><text x="648.25" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">del pago</tspan></text><polyline points="545,314 559,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="282" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="840.75" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: notificación</tspan></text><text x="840.75" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">repetida o perdida</tspan></text><polyline points="737.5,314 751.5,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="358" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="393.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Anunciante</tspan></text><rect x="174" y="358" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="385.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Elige productos a</tspan></text><text x="263.25" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">promover</tspan></text><rect x="366.5" y="358" width="178.5" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455.75" y="385.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">Aparece en búsquedas</tspan></text><text x="455.75" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">y banners</tspan></text><polyline points="352.5,390 366.5,390" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="358" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="648.25" y="393.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">Paga por resultado</tspan></text><polyline points="545,390 559,390" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="358" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="840.75" y="385.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: saturar la</tspan></text><text x="840.75" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">página de anuncios</tspan></text><polyline points="737.5,390 751.5,390" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="14" y="448" font-size="13" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="14" dy="0">Trazo punteado: paso inferido. Cajas coral: el caso límite de cada recorrido.</tspan></text><rect x="10" y="462" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="486.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los pasos continuos salen del 10-K de 2025, del caso de Go y de la documentación pública de Mercado Pago (aplicaciones,</tspan></text><text x="470" y="503.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">preferencias, URL de retorno, notificaciones, 3DS 2.0). Los punteados son comportamiento plausible no detallado; los casos</tspan></text><text x="470" y="520.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">límite de mora, devolución y notificaciones repetidas son riesgos que el curso conecta con el 10-K.</tspan></text><text x="470" y="557.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informes anuales y comunicados de Mercado Libre y el caso publicado por Go, citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
