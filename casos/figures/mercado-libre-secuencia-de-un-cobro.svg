<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 617" width="940" height="617" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 4, secuencia: un cobro con Checkout Pro y notificación</title><desc id="d">Diagrama de secuencia entre el sitio del comercio, el comprador, Mercado Pago y el servidor del comercio: se crea la preferencia de pago, el comprador es redirigido al formulario, paga, vuelve al sitio y Mercado Pago envía una notificación que el comercio debe consultar y procesar sin duplicar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="617" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 4, secuencia: un cobro con Checkout Pro y notificación</tspan></text><rect x="47.5" y="58" width="170" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132.5" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132.5" dy="0">Sitio del comercio</tspan></text><rect x="272.5" y="58" width="170" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357.5" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="357.5" dy="0">Comprador</tspan></text><rect x="497.5" y="58" width="170" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="582.5" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="582.5" dy="0">Mercado Pago</tspan></text><rect x="722.5" y="58" width="170" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807.5" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="807.5" dy="0">Servidor del</tspan></text><text x="807.5" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="807.5" dy="0">comercio</tspan></text><line x1="132.5" y1="104" x2="132.5" y2="494" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="357.5" y1="104" x2="357.5" y2="494" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="582.5" y1="104" x2="582.5" y2="494" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="807.5" y1="104" x2="807.5" y2="494" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="135.5,150 579.5,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357.5" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="357.5" dy="0">1. Crea la preferencia de pago</tspan></text><polyline points="579.5,194 135.5,194" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357.5" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="357.5" dy="0">2. Devuelve el enlace de pago</tspan></text><polyline points="135.5,238 354.5,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="245" dy="0">3. Redirige al formulario</tspan></text><polyline points="360.5,282 579.5,282" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">4. Elige método y paga</tspan></text><polyline points="579.5,326 360.5,326" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">5. Vuelve al sitio (URL de retorno)</tspan></text><polyline points="585.5,370 804.5,370" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="695" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="695" dy="0">6. Notificación del pago</tspan></text><polyline points="804.5,414 585.5,414" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="695" y="390" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="695" dy="0">7. Consulta el estado del pago</tspan><tspan x="695" dy="16.64">(inferido)</tspan></text><polyline points="807.5,452 853.5,452 853.5,466 811.5,466" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="861.5" y="462" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="861.5" dy="0">8. Procesa una sola vez (inferido)</tspan></text><rect x="10" y="508" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="532.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en la guía pública: creación de la aplicación, preferencia de pago, redirección, URL de retorno y configuración</tspan></text><text x="470" y="549.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de notificaciones, con 3DS 2.0 y prevención de fraude. Inferido: la consulta del estado y la idempotencia del proceso, que</tspan></text><text x="470" y="566.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">son la práctica habitual y que la página consultada no detalla.</tspan></text><text x="470" y="603.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informes anuales y comunicados de Mercado Libre y el caso publicado por Go, citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
