<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánta gente dependía de estos servicios en septiembre de 2021</title><desc id="d">Barras horizontales en miles de millones de personas: 2,91 usuarios activos mensuales de Facebook, 2,81 personas activas diarias de la familia de aplicaciones y 3,58 personas activas mensuales de la familia, según el comunicado de resultados del tercer trimestre de 2021.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánta gente dependía de estos servicios en septiembre de 2021</tspan></text><line x1="364" y1="49" x2="364" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="364" y1="181" x2="364" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="364" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364" dy="0">0</tspan></text><line x1="493.94" y1="49" x2="493.94" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="493.94" y1="181" x2="493.94" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="493.94" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="493.94" dy="0">1</tspan></text><line x1="623.88" y1="49" x2="623.88" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="623.88" y1="181" x2="623.88" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="623.88" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="623.88" dy="0">2</tspan></text><line x1="753.82" y1="49" x2="753.82" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="753.82" y1="181" x2="753.82" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="753.82" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="753.82" dy="0">3</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="181" x2="883.76" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">4</tspan></text><line x1="364" y1="181" x2="883.76" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="354" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Usuarios activos mensuales de Facebook</tspan></text><text x="354" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Personas activas diarias de la familia (media</tspan></text><text x="354" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">de septiembre)</tspan></text><text x="354" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Personas activas mensuales de la familia</tspan></text><rect x="364" y="55" width="378.125" height="32" rx="3" fill="#102a43"/><text x="749.125" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="749.125" dy="0">2,91</tspan></text><rect x="364" y="99" width="365.131" height="32" rx="3" fill="#102a43"/><text x="736.131" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="736.131" dy="0">2,81</tspan></text><rect x="364" y="143" width="465.185" height="32" rx="3" fill="#102a43"/><text x="836.185" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="836.185" dy="0">3,58</tspan></text><text x="623.88" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="623.88" dy="0">Miles de millones de personas (septiembre de 2021)</tspan></text><rect x="10" y="239" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La familia incluye Facebook, Instagram, WhatsApp y Messenger. Los ingresos del tercer trimestre fueron de 29 010 millones</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de dólares; repartidos de forma uniforme por las 24 horas de los 92 días del trimestre salen unos 13,1 millones por hora, o</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">unos 79 millones en seis horas. Es aritmética ilustrativa, no una pérdida medida: Meta no publicó el ingreso perdido</tspan></text><text x="470" y="313.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(inferencia: parte de la publicidad podría desplazarse a otro momento).</tspan></text><text x="470" y="361.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Meta, comunicado de resultados del tercer trimestre de 2021 (anexo 99.1 del Form 8-K del 25 de octubre de 2021).</tspan></text></svg>
