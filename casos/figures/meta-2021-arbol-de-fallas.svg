text x="112" y="388.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="112" dy="0">conexiones</tspan></text><line x1="160" y1="253" x2="112" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="164" y="277" width="88" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="208" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="208" dy="0">Auditoría</tspan></text><text x="208" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="208" dy="0">con un</tspan></text><text x="208" y="372.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="208" dy="0">error</tspan></text><line x1="160" y1="253" x2="208" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="470" cy="241" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><line x1="470" y1="217" x2="470" y2="229" stroke="#8a9aa3" stroke-width="1.4"/><rect x="378" y="277" width="88" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="422" y="322.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="422" dy="0">El DNS</tspan></text><text x="422" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="422" dy="0">retira</tspan></text><text x="422" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="422" dy="0">sus rutas</tspan></text><text x="422" y="372.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="422" dy="0">al</tspan></text><text x="422" y="388.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="422" dy="0">aislarse</tspan></text><line x1="470" y1="253" x2="422" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="474" y="277" width="88" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="518" y="314.04" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="518" dy="0">El DNS</tspan></text><text x="518" y="330.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="518" dy="0">vive en</tspan></text><text x="518" y="347.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="518" dy="0">el borde</tspan></text><text x="518" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="518" dy="0">y depende</tspan></text><text x="518" y="380.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="518" dy="0">de la</tspan></text><text x="518" y="397.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="518" dy="0">troncal</tspan></text><line x1="470" y1="253" x2="518" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="780" cy="241" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="780" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="780" dy="0">O</tspan></text><line x1="780" y1="217" x2="780" y2="229" stroke="#8a9aa3" stroke-width="1.4"/><rect x="640" y="277" width="88" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="684" y="322.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="684" dy="0">Acceso</tspan></text><text x="684" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="684" dy="0">primario</tspan></text><text x="684" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="684" dy="0">y fuera</tspan></text><text x="684" y="372.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="684" dy="0">de banda</tspan></text><text x="684" y="388.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="684" dy="0">caídos</tspan></text><line x1="780" y1="253" x2="684" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="736" y="277" width="88" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="780" y="347.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="780" dy="0">Herramientas</tspan></text><text x="780" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="780" dy="0">sin DNS</tspan></text><line x1="780" y1="253" x2="780" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="832" y="277" width="88" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="876" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="876" dy="0">Acceso</tspan></text><text x="876" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="876" dy="0">físico</tspan></text><text x="876" y="372.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="876" dy="0">endurecido</tspan></text><line x1="780" y1="253" x2="876" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="449" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="473.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: A y B se combinan («Y»): sin la regla de retirada de rutas el fallo habría sido interno; sin el comando, no</tspan></text><text x="470" y="490.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">habría habido regla que disparar. C se compone con «O»: cualquiera de sus tres condiciones alargaba la recuperación.</tspan></text><text x="470" y="538.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en las publicaciones de Meta y Cloudflare; no es una conclusión de esas fuentes.</tspan></text></svg>
