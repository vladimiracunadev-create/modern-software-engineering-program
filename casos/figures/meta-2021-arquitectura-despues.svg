<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arquitectura «después»: cuatro cambios que separan los planos</title><desc id="d">Arquitectura objetivo propuesta: un plano de gestión independiente con red fuera de banda por otro camino y herramientas sin DNS de producción; un plano de control con un suelo global que impide retirar todos los DNS a la vez; cambios con alcance limitado y auditoría probada; y ejercicios de pérdida de la red troncal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Arquitectura «después»: cuatro cambios que separan los planos</tspan></text><rect x="10" y="51" width="450" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="93" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Gestión independiente: red fuera de banda con otro camino y</tspan></text><text x="235" y="109.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">otro proveedor, herramientas que no usan el DNS de</tspan></text><text x="235" y="126.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">producción, acceso de emergencia preautorizado</tspan></text><rect x="480" y="51" width="450" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="705" y="93" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="705" dy="0">Control con suelo global: la regla de salud no puede</tspan></text><text x="705" y="109.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="705" dy="0">retirar más de una fracción de los DNS; siempre quedan</tspan></text><text x="705" y="126.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="705" dy="0">servidores anunciando</tspan></text><rect x="10" y="191" width="450" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="235" y="233" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="235" dy="0">Cambios con alcance limitado: auditoría probada con casos</tspan></text><text x="235" y="249.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="235" dy="0">peligrosos, simulación de impacto, una región cada vez y</tspan></text><text x="235" y="266.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="235" dy="0">reversión automática</tspan></text><rect x="480" y="191" width="450" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="233" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Ensayos: pérdida total de la red troncal, recuperación sin</tspan></text><text x="705" y="249.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">DNS y reinicio escalonado, con las personas de seguridad</tspan></text><text x="705" y="266.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">física incluidas</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: ninguna mejora quita la seguridad física ni la regla de salud, las acota. Cuatro frentes: que gestionar no</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">dependa de lo gestionado, que ninguna regla local pueda apagar todo, que un comando no pueda tocar toda la red, y que se</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">haya ensayado el peor caso. Es análisis propio; Meta describió que estudiaba mejoras, sin detalle público.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en las publicaciones de Meta y Cloudflare; no es una conclusión de esas fuentes.</tspan></text></svg>
