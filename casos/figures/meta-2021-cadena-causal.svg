<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una instrucción de mantenimiento, un auditor con un fallo y un DNS que se retira por prudencia</title><desc id="d">Cadena causal de seis eslabones: un comando de mantenimiento para evaluar capacidad de la red troncal; una herramienta de auditoría con un error no lo detiene; se desconecta toda la red troncal; los centros de datos quedan aislados; los servidores DNS, al no ver los centros de datos, retiran sus anuncios BGP; internet ya no encuentra los servidores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una instrucción de mantenimiento, un auditor con un fallo y un DNS que se retira por prudencia</tspan></text><rect x="10" y="65" width="132" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="76" y="94.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="76" dy="0">Comando de</tspan></text><text x="76" y="111" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="76" dy="0">mantenimiento</tspan></text><text x="76" y="127.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="76" dy="0">que evalúa la</tspan></text><text x="76" y="144.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="76" dy="0">capacidad de la</tspan></text><text x="76" y="160.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="76" dy="0">red troncal</tspan></text><polyline points="142,124 170,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="170" y="65" width="132" height="118" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="236" y="94.36" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="236" dy="0">La herramienta</tspan></text><text x="236" y="111" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="236" dy="0">de auditoría</tspan></text><text x="236" y="127.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="236" dy="0">falla y no</tspan></text><text x="236" y="144.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="236" dy="0">detiene el</tspan></text><text x="236" y="160.92" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="236" dy="0">comando</tspan></text><polyline points="302,124 330,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="65" width="132" height="118" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="396" y="111" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="396" dy="0">Se desconecta</tspan></text><text x="396" y="127.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="396" dy="0">toda la red</tspan></text><text x="396" y="144.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="396" dy="0">troncal</tspan></text><polyline points="462,124 490,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="490" y="65" width="132" height="118" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="556" y="102.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="556" dy="0">Centros de</tspan></text><text x="556" y="119.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="556" dy="0">datos aislados</tspan></text><text x="556" y="135.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="556" dy="0">entre sí y de</tspan></text><text x="556" y="152.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="556" dy="0">internet</tspan></text><polyline points="622,124 650,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="650" y="65" width="132" height="118" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="716" y="102.68" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="716" dy="0">Los DNS se</tspan></text><text x="716" y="119.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="716" dy="0">declaran no</tspan></text><text x="716" y="135.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="716" dy="0">sanos y retiran</tspan></text><text x="716" y="152.6" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="716" dy="0">su anuncio BGP</tspan></text><polyline points="782,124 810,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="810" y="65" width="132" height="118" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="876" y="102.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="876" dy="0">Internet no</tspan></text><text x="876" y="119.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="876" dy="0">encuentra los</tspan></text><text x="876" y="135.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="876" dy="0">servidores de</tspan></text><text x="876" y="152.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="876" dy="0">Facebook</tspan></text><rect x="10" y="221" width="440" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">Decisión de diseño razonable: un DNS que no ve sus</tspan></text><text x="230" y="261.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">centros de datos deja de anunciarse para no dirigir</tspan></text><text x="230" y="278.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">usuarios a un sitio roto</tspan></text><rect x="490" y="221" width="440" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="710" y="253.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="710" dy="0">Efecto combinado: la señal de salud de cada borde era</tspan></text><text x="710" y="269.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="710" dy="0">correcta localmente y catastrófica en conjunto</tspan></text><rect x="10" y="317" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="341.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: dos mecanismos correctos por separado (una auditoría de comandos y un retiro de anuncios por salud) se</tspan></text><text x="470" y="358.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">combinaron en un fallo total. La auditoría falló por un error y el retiro de anuncios amplificó un aislamiento interno</tspan></text><text x="470" y="375.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hasta hacerlo visible a todo internet.</tspan></text><text x="470" y="422.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Meta Engineering, «More details about the October 4 outage» (5 de octubre de 2021). «Fallo» de la auditoría y retirada de BGP según la publicación.</tspan></text></svg>
