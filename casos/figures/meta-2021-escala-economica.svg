<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La escala económica: ingresos y costos del tercer trimestre de 2021</title><desc id="d">Barras horizontales en millones de dólares: ingresos de 29 010 y costo de ingresos de 5 771 en el tercer trimestre de 2021; compras de propiedad y equipo de 13 198 en los nueve primeros meses, una partida de otro periodo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La escala económica: ingresos y costos del tercer trimestre de 2021</tspan></text><line x1="344" y1="49" x2="344" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="163" x2="344" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0</tspan></text><line x1="518.547" y1="49" x2="518.547" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="518.547" y1="163" x2="518.547" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="518.547" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="518.547" dy="0">10 000</tspan></text><line x1="693.093" y1="49" x2="693.093" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="693.093" y1="163" x2="693.093" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="693.093" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.093" dy="0">20 000</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="163" x2="867.64" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">30 000</tspan></text><line x1="344" y1="163" x2="867.64" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="334" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Ingresos (tercer trimestre)</tspan></text><text x="334" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Costo de ingresos (tercer trimestre)</tspan></text><text x="334" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Compras de propiedad y equipo (nueve meses)</tspan></text><rect x="344" y="55" width="506.36" height="26" rx="3" fill="#102a43"/><text x="857.36" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="857.36" dy="0">29 010</tspan></text><rect x="344" y="93" width="100.731" height="26" rx="3" fill="#102a43"/><text x="451.731" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="451.731" dy="0">5 771</tspan></text><rect x="344" y="131" width="230.367" height="26" rx="3" fill="#102a43"/><text x="581.367" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="581.367" dy="0">13 198</tspan></text><text x="605.82" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="605.82" dy="0">Millones de dólares de EE. UU. (periodos distintos, ver etiquetas)</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La tercera barra cubre nueve meses, no un trimestre, y no se compara directamente con las otras dos. La construcción en</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">curso incluye centros de datos, equipos de red y oficinas, sin desglose. El costo del incidente no está cuantificado: las</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fuentes consultadas no lo publican.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Facebook, Inc., Form 10-Q del trimestre terminado el 30 de septiembre de 2021. Comunicado de resultados del tercer trimestre de 2021 para los ingresos.</tspan></text></svg>
