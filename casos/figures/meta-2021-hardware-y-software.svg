<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 556" width="940" height="556" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware y software de la red de Meta: lo que se sabe y lo que no es público</title><desc id="d">Pila de seis capas: aplicaciones de usuario, servidores DNS autoritativos que anuncian por BGP, routers de la red troncal con su software, herramienta de auditoría de comandos, centros de datos con millones de máquinas e instalaciones de borde; marcas, modelos, sistemas operativos y lenguajes no constan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="556" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware y software de la red de Meta: lo que se sabe y lo que no es público</tspan></text><rect x="10" y="51" width="640" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">Aplicaciones: Facebook, Instagram, WhatsApp y Messenger (documentado)</tspan></text><rect x="670" y="51" width="250" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">Meta Engineering; resultados</tspan></text><rect x="10" y="113" width="640" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">DNS autoritativo en el borde, con direcciones fijas anunciadas por BGP (documentado)</tspan></text><rect x="670" y="113" width="250" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">Meta Engineering; Cloudflare</tspan></text><rect x="10" y="175" width="640" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="205.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">Routers de la red troncal, con software actualizable (documentado)</tspan></text><rect x="670" y="175" width="250" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="205.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">Meta Engineering</tspan></text><rect x="10" y="237" width="640" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="267.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">Herramienta de auditoría de comandos, con un error (documentado)</tspan></text><rect x="670" y="237" width="250" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="267.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">Meta Engineering</tspan></text><rect x="10" y="299" width="640" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="330" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="330" dy="0">Centros de datos masivos con millones de máquinas y instalaciones de borde (parcial)</tspan></text><rect x="670" y="299" width="250" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">Meta Engineering; 10-Q</tspan></text><rect x="10" y="361" width="640" height="54" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="330" y="383.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="330" dy="0">Fabricantes, modelos, sistemas operativos, lenguajes y herramientas de despliegue (no</tspan></text><text x="330" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="330" dy="0">se sabe)</tspan></text><rect x="670" y="361" width="250" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="391.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">no consta</tspan></text><rect x="10" y="433" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="457.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: Meta describe sus componentes por función, no por marca. Para el caso basta saber qué hacían: los routers</tspan></text><text x="470" y="474.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">movían el tráfico, el DNS decidía a quién se alcanzaba y la auditoría debía frenar los comandos peligrosos. No se inventa</tspan></text><text x="470" y="491.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ningún fabricante ni versión.</tspan></text><text x="470" y="538.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Meta Engineering (5 de octubre de 2021), Cloudflare y el 10-Q. Verde: documentado; dorado: parcial; gris: no se sabe.</tspan></text></svg>
