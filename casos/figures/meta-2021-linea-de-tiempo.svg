<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 381" width="940" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">4 de octubre de 2021 (UTC): seis horas desde los primeros cambios de ruta</title><desc id="d">Línea de tiempo en horas desde las 15:00 UTC según Cloudflare: alrededor de las 15:40 se ve un pico de cambios de rutas BGP de Facebook; a las 15:58 se advierte que ya no anuncia las rutas de sus servidores DNS; hacia las 21:00 vuelve la actividad BGP, con un pico a las 21:17; a las 21:28 Facebook parece reconectado a internet.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="381" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">4 de octubre de 2021 (UTC): seis horas desde los primeros cambios de ruta</tspan></text><line x1="274" y1="83" x2="274" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="183" x2="274" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="365.143" y1="83" x2="365.143" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="365.143" y1="183" x2="365.143" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="365.143" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="365.143" dy="0">1</tspan></text><line x1="456.286" y1="83" x2="456.286" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="456.286" y1="183" x2="456.286" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="456.286" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="456.286" dy="0">2</tspan></text><line x1="547.429" y1="83" x2="547.429" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="547.429" y1="183" x2="547.429" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="547.429" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.429" dy="0">3</tspan></text><line x1="638.571" y1="83" x2="638.571" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="638.571" y1="183" x2="638.571" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="638.571" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="638.571" dy="0">4</tspan></text><line x1="729.714" y1="83" x2="729.714" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="729.714" y1="183" x2="729.714" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="729.714" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="729.714" dy="0">5</tspan></text><line x1="820.857" y1="83" x2="820.857" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="820.857" y1="183" x2="820.857" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="820.857" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="820.857" dy="0">6</tspan></text><line x1="912" y1="83" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="183" x2="912" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">7</tspan></text><line x1="274" y1="183" x2="912" y2="183" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="104" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Rutas BGP y DNS de Facebook</tspan></text><text x="264" y="121" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">ausentes</tspan></text><text x="264" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Reconexión y vuelta del DNS</tspan></text><line x1="335.066" y1="75" x2="335.066" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="335.066" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="335.066" dy="0">15:40</tspan></text><line x1="820.857" y1="75" x2="820.857" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="820.857" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.857" dy="0">21:00</tspan></text><rect x="335.066" y="92" width="485.791" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="577.961" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577.961" dy="0">Sin rutas ni DNS: unas 5 h 20 min</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="820.857" y="142" width="42.8371" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="593" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593" dy="0">Horas desde las 15:00 UTC (0 = 15:00 UTC)</tspan></text><rect x="10" y="241" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="265.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cloudflare ve el pico de cambios de ruta a las 15:40, abre una incidencia a las 15:51 y confirma a las 15:58 que Facebook</tspan></text><text x="470" y="282.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ya no anunciaba las rutas de sus DNS. La actividad BGP vuelve a las 21:00 (pico 21:17) y el DNS de facebook.com vuelve a</tspan></text><text x="470" y="299.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">responder hacia las 21:20, con Facebook reconectado a las 21:28. Meta y su informe financiero hablan de un apagón de unas</tspan></text><text x="470" y="315.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">seis horas.</tspan></text><text x="470" y="363.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Cloudflare, «Understanding how Facebook disappeared from the Internet» (4 oct 2021); Meta, Form 10-Q (25 oct 2021).</tspan></text></svg>
