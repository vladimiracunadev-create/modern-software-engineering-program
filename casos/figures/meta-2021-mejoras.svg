<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 742" width="940" height="742" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis decisiones del caso y la mejora que las habría cambiado</title><desc id="d">Seis tarjetas con una situación documentada y la mejora propuesta: probar la herramienta de auditoría con fallos inyectados, distinguir aislamiento global de fallo local en la lógica de retiro de BGP, una red fuera de banda realmente independiente, herramientas de emergencia sin DNS, acceso físico de emergencia preautorizado y ensayos del escenario de pérdida de la red troncal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="742" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis decisiones del caso y la mejora que las habría cambiado</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Un error en la herramienta de auditoría permitió el</tspan></text><text x="30" y="117.6" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">comando</tspan></text><polyline points="438,105.64 474,105.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="77" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="100.96" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Probar la auditoría con comandos peligrosos inyectados y</tspan></text><text x="488" y="117.6" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">exigir confirmación doble</tspan></text><text x="24" y="151.28" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Meta reconoce el error de la auditoría; la prueba concreta es propuesta nuestra.</tspan></text><rect x="20" y="172.92" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="196.88" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Los DNS retiran sus anuncios BGP si no ven los centros</tspan></text><text x="30" y="213.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">de datos</tspan></text><polyline points="438,201.56 474,201.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="172.92" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="196.88" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Que no todos retiren a la vez: si todos los bordes se</tspan></text><text x="488" y="213.52" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">declaran enfermos, mantener un mínimo</tspan></text><text x="24" y="247.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Una decisión local correcta puede ser global y catastrófica.</tspan></text><rect x="20" y="268.84" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="301.12" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">La red de acceso fuera de banda también cayó</tspan></text><polyline points="438,297.48 474,297.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="268.84" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="292.8" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Una vía de emergencia con otro camino, otro proveedor y</tspan></text><text x="488" y="309.44" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">sin pasar por la red troncal</tspan></text><text x="24" y="343.12" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Meta: tanto el acceso primario como el fuera de banda estaban caídos.</tspan></text><rect x="20" y="364.76" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="388.72" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">La pérdida del DNS rompió herramientas internas de</tspan></text><text x="30" y="405.36" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">diagnóstico</tspan></text><polyline points="438,393.4 474,393.4" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="364.76" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="388.72" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Herramientas de emergencia sin dependencia del DNS de</tspan></text><text x="488" y="405.36" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">producción</tspan></text><text x="24" y="439.04" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Meta describe que se rompieron las herramientas habituales.</tspan></text><rect x="20" y="460.68" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="484.64" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">El acceso físico requería activar protocolos de</tspan></text><text x="30" y="501.28" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">seguridad y tardó</tspan></text><polyline points="438,489.32 474,489.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="460.68" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="484.64" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Procedimiento de acceso de emergencia preautorizado y</tspan></text><text x="488" y="501.28" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">ensayado</tspan></text><text x="24" y="534.96" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Meta describe el tiempo extra que añadió la seguridad física.</tspan></text><rect x="20" y="556.6" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="580.56" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Nunca se había simulado la pérdida de la red troncal</tspan></text><text x="30" y="597.2" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">global</tspan></text><polyline points="438,585.24 474,585.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="556.6" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="588.88" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Añadir ese escenario a los ejercicios de tormenta</tspan></text><text x="24" y="630.88" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Meta lo dice textualmente: no lo habían simulado antes.</tspan></text><rect x="10" y="654.52" width="920" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="685.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Análisis propio apoyado en las publicaciones de Meta y Cloudflare; no es una conclusión de esas fuentes.</tspan></text></svg>
