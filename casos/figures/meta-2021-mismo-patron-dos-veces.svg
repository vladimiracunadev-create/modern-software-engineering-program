<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 496" width="940" height="496" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo patrón en dos redes: Google en 2019 y Facebook en 2021</title><desc id="d">Dos filas de cinco cajas que comparan el incidente de Google Cloud del 2 de junio de 2019 con el apagón de Facebook del 4 de octubre de 2021: un mantenimiento, un alcance mayor del previsto, un plano de control que retira rutas, herramientas de depuración afectadas y acceso físico a instalaciones seguras.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="496" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El mismo patrón en dos redes: Google en 2019 y Facebook en 2021</tspan></text><text x="95" y="63" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="95" dy="0">Mantenimiento</tspan></text><rect x="10" y="77" width="170" height="124" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="95" y="126" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="95" dy="0">Un evento de</tspan></text><text x="95" y="142.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="95" dy="0">mantenimiento en una</tspan></text><text x="95" y="159.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="95" dy="0">ubicación</tspan></text><rect x="10" y="227" width="170" height="124" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="95" y="267.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="95" dy="0">Mantenimiento</tspan></text><text x="95" y="284.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="95" dy="0">rutinario: un</tspan></text><text x="95" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="95" dy="0">comando para evaluar</tspan></text><text x="95" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="95" dy="0">capacidad</tspan></text><text x="280" y="63" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="280" dy="0">Alcance mayor del esperado</tspan></text><rect x="195" y="77" width="170" height="124" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="280" y="101.04" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="280" dy="0">Un error del</tspan></text><text x="280" y="117.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="280" dy="0">software de</tspan></text><text x="280" y="134.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="280" dy="0">mantenimiento</tspan></text><text x="280" y="150.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="280" dy="0">desprograma</tspan></text><text x="280" y="167.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="280" dy="0">clústeres en varias</tspan></text><text x="280" y="184.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="280" dy="0">ubicaciones</tspan></text><rect x="195" y="227" width="170" height="124" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="280" y="259.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="280" dy="0">Desconecta todas las</tspan></text><text x="280" y="276" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="280" dy="0">conexiones de la red</tspan></text><text x="280" y="292.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="280" dy="0">troncal; la</tspan></text><text x="280" y="309.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="280" dy="0">auditoría tiene un</tspan></text><text x="280" y="325.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="280" dy="0">error</tspan></text><text x="465" y="63" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="465" dy="0">Plano de control</tspan></text><rect x="380" y="77" width="170" height="124" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="465" y="117.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">Tras unos minutos se</tspan></text><text x="465" y="134.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">retiran las rutas</tspan></text><text x="465" y="150.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">BGP entre</tspan></text><text x="465" y="167.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">ubicaciones</tspan></text><rect x="380" y="227" width="170" height="124" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="276" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">El DNS retira sus</tspan></text><text x="465" y="292.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">anuncios BGP al</tspan></text><text x="465" y="309.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">verse aislado</tspan></text><text x="650" y="63" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="650" dy="0">Herramientas</tspan></text><rect x="565" y="77" width="170" height="124" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="650" y="109.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650" dy="0">La depuración se ve</tspan></text><text x="650" y="126" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650" dy="0">dificultada por</tspan></text><text x="650" y="142.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650" dy="0">herramientas que</tspan></text><text x="650" y="159.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650" dy="0">compiten por la red</tspan></text><text x="650" y="175.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650" dy="0">congestionada</tspan></text><rect x="565" y="227" width="170" height="124" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="650" y="259.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="650" dy="0">Herramientas</tspan></text><text x="650" y="276" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="650" dy="0">internas rotas sin</tspan></text><text x="650" y="292.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="650" dy="0">DNS; acceso primario</tspan></text><text x="650" y="309.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="650" dy="0">y fuera de banda</tspan></text><text x="650" y="325.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="650" dy="0">caídos</tspan></text><text x="835" y="63" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835" dy="0">Acceso físico y duración</tspan></text><rect x="750" y="77" width="170" height="124" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="835" y="117.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835" dy="0">Ingenieros viajan a</tspan></text><text x="835" y="134.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835" dy="0">instalaciones</tspan></text><text x="835" y="150.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835" dy="0">seguras; de 3 h 19</tspan></text><text x="835" y="167.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835" dy="0">min a 4 h 25 min</tspan></text><rect x="750" y="227" width="170" height="124" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="835" y="267.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="835" dy="0">Ingenieros en las</tspan></text><text x="835" y="284.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="835" dy="0">instalaciones, de</tspan></text><text x="835" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="835" dy="0">acceso difícil; unas</tspan></text><text x="835" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="835" dy="0">seis horas</tspan></text><text x="470" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">Arriba: Google Cloud, 2 de junio de 2019 · Abajo: Facebook, 4 de octubre de 2021</tspan></text><rect x="10" y="373" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: dos empresas con redes muy distintas y el mismo mecanismo: un cambio de mantenimiento con más alcance del</tspan></text><text x="470" y="414.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">previsto, un plano de control que dejó de anunciar rutas y una depuración dificultada porque las herramientas vivían en la</tspan></text><text x="470" y="431.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">red afectada. La fila de arriba es Google (2019).</tspan></text><text x="470" y="478.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Google Cloud, informe del incidente 19009 (2 de junio de 2019); Meta Engineering (5 de octubre de 2021). La comparación es análisis propio.</tspan></text></svg>
