<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se ve de la organización: la empresa, sus aplicaciones y su red</title><desc id="d">Esquema de la estructura pública: Facebook, Inc., con sede en Menlo Park, California, cuya familia de aplicaciones incluye Facebook, Instagram, WhatsApp y Messenger y que opera una red troncal propia que une centros de datos grandes e instalaciones de borde; los equipos de ingeniería de red, plantilla y organigrama interno no constan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se ve de la organización: la empresa, sus aplicaciones y su red</tspan></text><rect x="250" y="51" width="440" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Facebook, Inc. (hoy Meta): sede en Menlo Park,</tspan></text><text x="470" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">California; sociedad de Delaware</tspan></text><rect x="10" y="151" width="218" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="119" y="182.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="119" dy="0">Facebook</tspan></text><polyline points="470,111 119,151" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="242" y="151" width="218" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="351" y="182.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="351" dy="0">Instagram</tspan></text><polyline points="470,111 351,151" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="474" y="151" width="218" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="583" y="182.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="583" dy="0">WhatsApp</tspan></text><polyline points="470,111 583,151" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="706" y="151" width="218" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="815" y="182.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="815" dy="0">Messenger</tspan></text><polyline points="470,111 815,151" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="251" width="450" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="235" y="286.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="235" dy="0">Red troncal propia: decenas de miles de millas de fibra</tspan></text><text x="235" y="302.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="235" dy="0">entre todas las instalaciones</tspan></text><rect x="480" y="251" width="450" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="286.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">Centros de datos masivos e instalaciones pequeñas de borde</tspan></text><text x="705" y="302.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">que conectan con internet y los usuarios</tspan></text><polyline points="235,207 235,251" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="705,207 705,251" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="361" width="920" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="394.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="470" dy="0">Plantilla, organigrama de ingeniería de red, oficinas y centros de datos por país: no se sabe en las fuentes consultadas</tspan></text><rect x="10" y="443" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="467.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: lo público muestra la empresa y su infraestructura de red, no su estructura interna. Para el caso importa</tspan></text><text x="470" y="484.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que cuatro aplicaciones con 3 580 millones de personas activas al mes compartían una red troncal y un DNS.</tspan></text><text x="470" y="532.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Form 10-Q de 2021, Meta Engineering y comunicado de resultados del tercer trimestre.</tspan></text></svg>
