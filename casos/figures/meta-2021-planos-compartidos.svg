<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres planos sobre un mismo camino: datos, control y gestión</title><desc id="d">Diagrama de planos: el plano de datos con los usuarios y las aplicaciones, el plano de control con las rutas BGP y los servidores DNS, y el plano de gestión con las herramientas internas y el acceso de emergencia; los tres dependen de la misma red troncal, y el plano de gestión depende además del DNS.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="560" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres planos sobre un mismo camino: datos, control y gestión</tspan></text><rect x="10" y="51" width="910" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="465" dy="0">Plano de datos: del dispositivo al borde y, por la red troncal, al centro de datos que procesa la petición</tspan></text><rect x="10" y="151" width="910" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="189.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="465" dy="0">Plano de control: DNS autoritativo y anuncios BGP, que dicen a internet cómo llegar a Facebook</tspan></text><rect x="10" y="251" width="910" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="289.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="465" dy="0">Plano de gestión: herramientas internas, diagnóstico, acceso primario y acceso fuera de banda para operar la red</tspan></text><rect x="10" y="351" width="910" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="465" y="386.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465" dy="0">Red troncal global propia: la misma para los tres planos</tspan></text><polyline points="120,351 120,321" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="120,251 120,221" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="120,151 120,121" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,351 470,321" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,251 470,221" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,151 470,121" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="820,351 820,321" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="820,251 820,221" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="820,151 820,121" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="437" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: los tres planos compartían camino. Cuando el camino desapareció, cayeron los datos, el control (nadie</tspan></text><text x="470" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">anunciaba rutas) y también la gestión (las herramientas y el acceso). Las herramientas dependían además del DNS, que era</tspan></text><text x="470" y="495.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">parte del plano de control.</tspan></text><text x="470" y="542.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en las publicaciones de Meta y Cloudflare; no es una conclusión de esas fuentes. Hechos de Meta Engineering (5 de octubre de 2021).</tspan></text></svg>
