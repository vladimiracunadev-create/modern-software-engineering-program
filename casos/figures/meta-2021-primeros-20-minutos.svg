<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 398" width="940" height="398" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los primeros veinte minutos vistos desde fuera: de las 15:40 a las 16:10 UTC</title><desc id="d">Línea de tiempo en minutos desde las 15:30 UTC: el pico de cambios de rutas BGP de Facebook a las 15:40, el nombre facebook.com deja de resolverse en 1.1.1.1 hacia las 15:50, Cloudflare abre una incidencia interna a las 15:51 y a las 15:58 advierte que Facebook ha dejado de anunciar las rutas de sus DNS.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="398" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Los primeros veinte minutos vistos desde fuera: de las 15:40 a las 16:10 UTC</tspan></text><line x1="274" y1="83" x2="274" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="233" x2="274" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="433.5" y1="83" x2="433.5" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="433.5" y1="233" x2="433.5" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="433.5" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433.5" dy="0">10</tspan></text><line x1="593" y1="83" x2="593" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="593" y1="233" x2="593" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="593" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="593" dy="0">20</tspan></text><line x1="752.5" y1="83" x2="752.5" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="752.5" y1="233" x2="752.5" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="752.5" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752.5" dy="0">30</tspan></text><line x1="912" y1="83" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="233" x2="912" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">40</tspan></text><line x1="274" y1="233" x2="912" y2="233" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Rutas BGP de Facebook</tspan></text><text x="264" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">facebook.com en 1.1.1.1</tspan></text><text x="264" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Cloudflare</tspan></text><line x1="433.5" y1="75" x2="433.5" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="433.5" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.5" dy="0">15:40</tspan></text><line x1="608.95" y1="75" x2="608.95" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="608.95" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="608.95" dy="0">15:51</tspan></text><line x1="720.6" y1="75" x2="720.6" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="720.6" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.6" dy="0">15:58</tspan></text><rect x="433.5" y="92" width="478.5" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="672.75" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672.75" dy="0">cambios y retirada de rutas</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="274" y="142" width="319" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="433.5" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="433.5" dy="0">resuelve</tspan></text><rect x="593" y="142" width="319" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="752.5" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752.5" dy="0">SERVFAIL</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="608.95" y="192" width="111.65" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="664.775" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="664.775" dy="0">alerta</tspan></text><rect x="720.6" y="192" width="191.4" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="816.3" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="816.3" dy="0">confirma retirada</tspan></text><text x="593" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593" dy="0">Minutos desde las 15:30 UTC del 4 de octubre de 2021</tspan></text><rect x="10" y="291" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cloudflare notó el problema un minuto después del pico de cambios y lo confirmó a las 15:58. La figura es la vista externa</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(BGP y DNS); Meta no publicó la hora exacta del comando ni de su propia detección.</tspan></text><text x="470" y="380.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, «Understanding how Facebook disappeared from the Internet» (4 de octubre de 2021).</tspan></text></svg>
