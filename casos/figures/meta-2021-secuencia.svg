<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuencia de los primeros minutos: del comando a los reintentos de todo internet</title><desc id="d">Diagrama de secuencia con mantenimiento y auditoría, red troncal, DNS en el borde, internet por BGP, resolvedores públicos y usuarios: el comando desconecta la red troncal, la auditoría no lo detiene, los DNS retiran sus rutas, los resolvedores devuelven error y los usuarios y aplicaciones reintentan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Secuencia de los primeros minutos: del comando a los reintentos de todo internet</tspan></text><rect x="25" y="51" width="140" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="95" y="69.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="95" dy="0">Mantenimiento y</tspan></text><text x="95" y="85.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="95" dy="0">auditoría</tspan></text><rect x="175" y="51" width="140" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="245" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="245" dy="0">Red troncal</tspan></text><rect x="325" y="51" width="140" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="395" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="395" dy="0">DNS en el borde</tspan></text><rect x="475" y="51" width="140" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="545" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="545" dy="0">Internet (BGP)</tspan></text><rect x="625" y="51" width="140" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="695" y="69.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="695" dy="0">Resolvedores</tspan></text><text x="695" y="85.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="695" dy="0">públicos</tspan></text><rect x="775" y="51" width="140" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="845" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="845" dy="0">Usuarios y apps</tspan></text><line x1="95" y1="97" x2="95" y2="415" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="245" y1="97" x2="245" y2="415" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="395" y1="97" x2="395" y2="415" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="545" y1="97" x2="545" y2="415" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="695" y1="97" x2="695" y2="415" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="845" y1="97" x2="845" y2="415" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="95,132 245,132" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="170" y="124" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170" dy="0">1. comando</tspan></text><rect x="6" y="151" width="250" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="131" y="169.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="131" dy="0">2. auditoría con error</tspan></text><polyline points="245,208 395,208" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="320" y="200" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="320" dy="0">3. aislado</tspan></text><polyline points="395,246 545,246" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="470" y="238" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">4. retira rutas</tspan></text><polyline points="695,284 395,284" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="545" y="276" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="545" dy="0">5. consulta</tspan></text><polyline points="695,322 845,322" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="770" y="314" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="770" dy="0">6. SERVFAIL</tspan></text><polyline points="845,360 695,360" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="770" y="352" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="770" dy="0">7. reintentos</tspan></text><rect x="6" y="379" width="250" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="131" y="397.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="131" dy="0">8. herramientas y acceso caídos</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: todo ocurre en minutos y la señal más visible para el exterior (los DNS fuera de internet) es una</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">consecuencia del fallo interno, no su causa. El último paso muestra que el gestor de red ya no tenía sus propias</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">herramientas. El orden fino de los pasos es una reconstrucción de las fuentes.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Meta Engineering (5 de octubre de 2021) y Cloudflare, «Understanding how Facebook disappeared from the Internet» (4 de octubre de 2021). Orden: modelo propio.</tspan></text></svg>
