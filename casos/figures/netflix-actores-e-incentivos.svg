<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 499" width="940" height="499" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién da qué a quién: los actores del ecosistema de Netflix</title><desc id="d">Diagrama de incentivos: el miembro paga una suscripción; el anunciante paga por audiencia en el plan con anuncios; los estudios y creadores reciben licencias o contratos de producción; el proveedor de internet recibe servidores gratuitos y a cambio ahorra tránsito; los fabricantes de dispositivos instalan la aplicación; Netflix en el centro coordina.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="499" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién da qué a quién: los actores del ecosistema de Netflix</tspan></text><rect x="340" y="160" width="260" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="195" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Netflix: cobra, programa</tspan></text><text x="470" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">catálogo, opera el servicio y la</tspan></text><text x="470" y="228.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">red de entrega</tspan></text><rect x="10" y="56" width="250" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="78" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">Miembro: paga una cuota mensual</tspan></text><text x="135" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">y obtiene catálogo, perfiles y</tspan></text><text x="135" y="111.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">descargas</tspan></text><rect x="345" y="56" width="250" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="78" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Anunciante: compra audiencia en</tspan></text><text x="470" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el plan con anuncios (desde</tspan></text><text x="470" y="111.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2022)</tspan></text><rect x="680" y="56" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="805" y="78" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">Estudio y talento: cede</tspan></text><text x="805" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">licencias o produce por encargo</tspan></text><text x="805" y="111.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">y cobra por ello</tspan></text><rect x="10" y="300" width="250" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="135" y="322" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="135" dy="0">Proveedor de internet: aloja</tspan></text><text x="135" y="338.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="135" dy="0">servidores sin cargo y ahorra</tspan></text><text x="135" y="355.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="135" dy="0">tránsito</tspan></text><rect x="345" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="330.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Fabricante de dispositivos:</tspan></text><text x="470" y="346.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">instala la aplicación de origen</tspan></text><rect x="680" y="300" width="250" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="805" y="322" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="805" dy="0">Reguladores y socios de pago:</tspan></text><text x="805" y="338.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="805" dy="0">fijan reglas de cobro, datos y</tspan></text><text x="805" y="355.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="805" dy="0">contenido</tspan></text><polyline points="200,126 340,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="240" y="150" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">cuota</tspan></text><polyline points="470,126 470,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="520" y="148" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="520" dy="0">audiencia</tspan></text><polyline points="670,126 600,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="700" y="160" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">licencias y pagos</tspan></text><polyline points="340,236 230,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="262" y="262" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="262" dy="0">servidores</tspan></text><polyline points="470,256 470,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="600,236 690,300" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="390" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: la cuota, el plan con anuncios, los servidores gratuitos para ISP calificados y la colaboración con</tspan></text><text x="470" y="431.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fabricantes desde 2008. No se sabe: los términos económicos con estudios, anunciantes y socios de pago; la flecha punteada</tspan></text><text x="470" y="448.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">a reguladores y pagos solo indica que existen obligaciones, no un dato de contrato.</tspan></text><text x="470" y="485.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
