<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 429" width="940" height="429" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién habla con quién cuando alguien pulsa «Reproducir» en Netflix</title><desc id="d">Diagrama de contexto: el miembro usa un dispositivo; las llamadas de control (catálogo, perfil, licencia) van a servicios en la nube de AWS y los bytes del vídeo llegan desde servidores Open Connect colocados dentro de la red del proveedor de internet; los estudios y el pipeline de codificación abastecen esos servidores fuera de las horas pico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="429" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién habla con quién cuando alguien pulsa «Reproducir» en Netflix</tspan></text><rect x="10" y="52" width="250" height="250" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Casa del miembro</tspan></text><rect x="30" y="90" width="210" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="112.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Televisor, móvil,</tspan></text><text x="135" y="128.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">navegador o consola</tspan></text><rect x="30" y="160" width="210" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="174" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Aplicación Netflix:</tspan></text><text x="135" y="190.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">perfil, descargas,</tspan></text><text x="135" y="207.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">reproductor</tspan></text><rect x="30" y="230" width="210" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="252.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">Miembro con plan (con o</tspan></text><text x="135" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">sin anuncios)</tspan></text><rect x="300" y="52" width="300" height="118" rx="16" fill="#f7ebc8" fill-opacity="0.45" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="8 5"/><text x="314" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="314" dy="0">Red del proveedor de internet (ISP)</tspan></text><rect x="320" y="88" width="260" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="108" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Appliance Open Connect: guarda</tspan></text><text x="450" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">copias de títulos y sirve el</tspan></text><text x="450" y="141.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">vídeo</tspan></text><rect x="300" y="190" width="630" height="112" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="314" y="212" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="314" dy="0">Nube (AWS) y equipo de Netflix</tspan></text><rect x="320" y="226" width="180" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="410" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410" dy="0">API y servicios de</tspan></text><text x="410" y="260.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410" dy="0">control: catálogo,</tspan></text><text x="410" y="277.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410" dy="0">cuenta, facturación</tspan></text><rect x="520" y="226" width="190" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="615" y="252.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615" dy="0">Recomendación y</tspan></text><text x="615" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615" dy="0">telemetría de uso</tspan></text><rect x="730" y="226" width="180" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="820" y="252.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="820" dy="0">Pipeline de</tspan></text><text x="820" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="820" dy="0">codificación de vídeo</tspan></text><rect x="630" y="52" width="300" height="118" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="644" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="644" dy="0">Contenido</tspan></text><rect x="650" y="88" width="260" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="780" y="116.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">Estudios y producciones propias</tspan></text><text x="780" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">entregan el original</tspan></text><polyline points="240,187 300,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="240,258 320,258" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="820,154 820,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="730,258 580,130" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="250" y="172" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="250" dy="0">vídeo</tspan></text><text x="252" y="276" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="252" dy="0">control</tspan></text><text x="830" y="194" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="830" dy="0">original</tspan></text><text x="675" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="675" dy="0">copias previas</tspan></text><rect x="10" y="320" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo documentado es la separación de dos caminos: los servicios de control corren en AWS (carta de 2016) y el vídeo sale de</tspan></text><text x="470" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una red propia, Open Connect (informe anual de 2016). La flecha punteada resume que Open Connect se rellena con antelación;</tspan></text><text x="470" y="378.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el detalle del reparto lo publica Netflix en su sitio de Open Connect.</tspan></text><text x="470" y="415.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
