<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 395" width="940" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costos operativos de Netflix por rubro, 2023-2025 (porcentaje de los ingresos)</title><desc id="d">Barras apiladas al cien por ciento: el coste de ingresos baja de 58,5 a 51,5 por ciento de los ingresos entre 2023 y 2025; marketing, tecnología y administración se mantienen entre 4 y 8 por ciento cada uno; el resultado operativo sube de 20,6 a 29,5 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="395" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costos operativos de Netflix por rubro, 2023-2025 (porcentaje de los ingresos)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Coste de ingresos</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Marketing</tspan></text><rect x="308.04" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="328.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.04" dy="0">Tecnología y desarrollo</tspan></text><rect x="529.46" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="549.46" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="5