e" font-weight="700" fill="#ffffff"><tspan x="544.65" dy="0">8 %</tspan></text><rect x="573.964" y="124" width="58.6275" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="603.278" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="603.278" dy="0">8 %</tspan></text><rect x="632.591" y="124" width="34.3948" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="649.789" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="649.789" dy="0">4 %</tspan></text><rect x="666.986" y="124" width="208.714" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="771.343" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="771.343" dy="0">27 %</tspan></text><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="94" y="164" width="402.576" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="295.288" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="295.288" dy="0">52 %</tspan></text><rect x="496.576" y="164" width="57.0641" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="525.108" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="525.108" dy="0">7 %</tspan></text><rect x="553.64" y="164" width="58.6275" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="582.953" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582.953" dy="0">8 %</tspan></text><rect x="612.267" y="164" width="32.8314" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="628.683" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="628.683" dy="0">4 %</tspan></text><rect x="645.098" y="164" width="230.602" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="760.399" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="760.399" dy="0">30 %</tspan></text><text x="882.7" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="484.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="484.85" dy="0">% del total</tspan></text><rect x="10" y="255" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En dólares, en 2025: coste de ingresos 23 275 millones, marketing 3 301, tecnología y desarrollo 3 391, administración 1</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">888 y resultado operativo 13 327. El coste de ingresos incluye amortización de contenido (16 422 millones en 2025),</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entrega, soporte y comisiones de pago; el 10-K no separa lo que corresponde a infraestructura. Tecnología y desarrollo es</tspan></text><text x="470" y="329.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solo 7,5 por ciento de los ingresos.</tspan></text><text x="470" y="377.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Netflix, Form 10-K de 2025, de 2016 y de 2007 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
