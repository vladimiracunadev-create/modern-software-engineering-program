<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 439" width="940" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema del negocio: de dónde entra el dinero y a dónde va</title><desc id="d">Diagrama de flujos: los miembros pagan cuotas y los anunciantes pagan publicidad hacia Netflix; Netflix paga contenido a estudios y talento, entrega a Open Connect, nube y personal, y paga marketing, tecnología y administración; lo que queda es resultado operativo; el valor vuelve al miembro como catálogo y servicio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="439" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema del negocio: de dónde entra el dinero y a dónde va</tspan></text><rect x="10" y="70" width="190" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">Miembros: cuotas por</tspan></text><text x="105" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">plan</tspan></text><rect x="10" y="160" width="190" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="105" y="190.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="105" dy="0">Anunciantes: publicidad</tspan></text><text x="105" y="206.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="105" dy="0">en el plan con anuncios</tspan></text><rect x="300" y="100" width="210" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="405" y="137" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="405" dy="0">Netflix: ingresos de 45</tspan></text><text x="405" y="153.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="405" dy="0">183 millones de USD en</tspan></text><text x="405" y="170.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="405" dy="0">2025</tspan></text><rect x="620" y="56" width="310" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="775" y="77.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="775" dy="0">Coste de ingresos, sobre todo</tspan></text><text x="775" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="775" dy="0">contenido: 51,5 % de los ingresos</tspan></text><rect x="620" y="118" width="310" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="775" y="139.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="775" dy="0">Marketing, tecnología y administración:</tspan></text><text x="775" y="155.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="775" dy="0">19 %</tspan></text><rect x="620" y="180" width="310" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="775" y="201.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="775" dy="0">Entrega (Open Connect, nube): dentro</tspan></text><text x="775" y="217.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="775" dy="0">del coste de ingresos, sin cifra aparte</tspan></text><rect x="620" y="242" width="310" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="775" y="263.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="775" dy="0">Resultado operativo: 29,5 % de los</tspan></text><text x="775" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="775" dy="0">ingresos</tspan></text><polyline points="200,105 300,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="200,195 300,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="510,150 620,82" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="510,150 620,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="510,150 620,206" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="510,150 620,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="262" width="490" height="52" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="255" y="283.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="255" dy="0">Valor que vuelve: catálogo, recomendaciones, descargas y</tspan></text><text x="255" y="299.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="255" dy="0">servicio estable (documentado en la ficha de planes)</tspan></text><rect x="10" y="330" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Porcentajes de 2025 calculados con el 10-K: coste de ingresos 51,5 %, marketing 7,3 %, tecnología 7,5 %, administración 4,2</tspan></text><text x="470" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">%, resultado operativo 29,5 %. El coste de ingresos mezcla contenido, entrega y otros; el 10-K no los separa, por eso la</tspan></text><text x="470" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">caja de entrega es punteada. Los flujos a estudios y a anunciantes no tienen cifras públicas por separado.</tspan></text><text x="470" y="425.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Netflix, Form 10-K de 2025, de 2016 y de 2007 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
