<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo evolucionó la arquitectura: tres etapas, antes y después</title><desc id="d">Tres columnas que comparan etapas: 1998 a 2007 con centro de datos propio y base relacional; 2008 a 2016 con migración a la nube, servicios con interruptor y Open Connect desde 2012; 2016 en adelante con la mayor parte del cómputo en AWS, directo y publicidad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo evolucionó la arquitectura: tres etapas, antes y después</tspan></text><rect x="10" y="56" width="292" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="156" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="156" dy="0">1998-2007: centro de datos</tspan></text><rect x="10" y="112" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Base relacional vertical en un centro</tspan></text><text x="156" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">de datos propio</tspan></text><rect x="10" y="194" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="224.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">El producto es el DVD; el correo es</tspan></text><text x="156" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">el transporte</tspan></text><rect x="10" y="276" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Un fallo de base de datos paró los</tspan></text><text x="156" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">envíos tres días en 2008</tspan></text><rect x="324" y="56" width="292" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">2008-2016: migración</tspan></text><rect x="324" y="112" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Servicios que pueden fallar sin</tspan></text><text x="470" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">tumbar el sitio (Hystrix, 2011)</tspan></text><rect x="324" y="194" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="224.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Copias del estado en varias regiones</tspan></text><text x="470" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">(2013)</tspan></text><rect x="324" y="276" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Open Connect desde 2012; fin de la</tspan></text><text x="470" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">migración en enero de 2016</tspan></text><rect x="638" y="56" width="292" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="784" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="784" dy="0">2016 en adelante: nube madura</tspan></text><rect x="638" y="112" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">La mayor parte del cómputo sigue en</tspan></text><text x="784" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">AWS y no se mueve fácil (10-K)</tspan></text><rect x="638" y="194" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="224.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">Directo, juegos y publicidad añaden</tspan></text><text x="784" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">cargas nuevas</tspan></text><rect x="638" y="276" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">Desde 2025 ya no se publica el número</tspan></text><text x="784" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">de miembros</tspan></text><polyline points="302,78 324,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="616,78 638,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="368" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="392.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las tres etapas son una periodización del curso sobre hechos documentados (carta de 2016, artículos de 2011 y 2013, 10-K de</tspan></text><text x="470" y="409.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2025). Cada etapa mezcla decisiones técnicas y de negocio: el ritmo de cambio de la arquitectura siguió al del producto. No</tspan></text><text x="470" y="426.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se sabe qué sistemas concretos de la tercera etapa se han reescrito.</tspan></text><text x="470" y="463.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
