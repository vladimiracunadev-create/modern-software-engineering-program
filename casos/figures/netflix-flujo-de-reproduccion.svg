<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 389" width="940" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la pulsación a la imagen: la operación crítica separada en control y datos</title><desc id="d">Diagrama de flujo en seis pasos: el cliente pide reproducir, un servicio de control comprueba cuenta y plan, devuelve una lista de servidores Open Connect y un manifiesto, el reproductor descarga segmentos del servidor más cercano, mide el ancho de banda y cambia de calidad, y envía telemetría de vuelta a la nube.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="389" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la pulsación a la imagen: la operación crítica separada en control y datos</tspan></text><rect x="10" y="66" width="134" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">1. Cliente</tspan></text><rect x="10" y="112" width="134" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="77" dy="0">Pulsar</tspan></text><text x="77" y="174.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="77" dy="0">«Reproducir» en</tspan></text><text x="77" y="191.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="77" dy="0">un perfil</tspan></text><rect x="166" y="66" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="233" y="80.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="233" dy="0">2. Control en</tspan></text><text x="233" y="96.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="233" dy="0">AWS</tspan></text><rect x="166" y="112" width="134" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="233" y="149.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="233" dy="0">Comprobar</tspan></text><text x="233" y="166.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="233" dy="0">cuenta, plan y</tspan></text><text x="233" y="182.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="233" dy="0">derechos del</tspan></text><text x="233" y="199.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="233" dy="0">título</tspan></text><polyline points="144,85 166,85" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="322" y="66" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="389" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="389" dy="0">3. Selección</tspan></text><rect x="322" y="112" width="134" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="389" y="149.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389" dy="0">Devolver</tspan></text><text x="389" y="166.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389" dy="0">servidores</tspan></text><text x="389" y="182.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389" dy="0">candidatos y</tspan></text><text x="389" y="199.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389" dy="0">manifiesto</tspan></text><polyline points="300,85 322,85" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="66" width="134" height="38" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="545" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="545" dy="0">4. Open Connect</tspan></text><rect x="478" y="112" width="134" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="545" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="545" dy="0">Entregar</tspan></text><text x="545" y="174.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="545" dy="0">segmentos de</tspan></text><text x="545" y="191.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="545" dy="0">vídeo cifrados</tspan></text><polyline points="456,85 478,85" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="634" y="66" width="134" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="701" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="701" dy="0">5. Reproductor</tspan></text><rect x="634" y="112" width="134" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="701" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701" dy="0">Medir ancho de</tspan></text><text x="701" y="174.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701" dy="0">banda y cambiar</tspan></text><text x="701" y="191.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701" dy="0">de calidad</tspan></text><polyline points="612,85 634,85" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="790" y="66" width="134" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="857" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="857" dy="0">6. Telemetría</tspan></text><rect x="790" y="112" width="134" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="857" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Enviar eventos</tspan></text><text x="857" y="174.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">de reproducción</tspan></text><text x="857" y="191.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">a la nube</tspan></text><polyline points="768,85 790,85" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="14" y="262" font-size="13" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="14" dy="0">Trazo continuo: respaldado por fuentes citadas. Trazo punteado: inferido a partir de ellas.</tspan></text><rect x="10" y="280" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="304.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Se documenta públicamente que existen un reproductor adaptativo, un plano de control en la nube y servidores propios dentro</tspan></text><text x="470" y="321.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de los ISP. Los pasos 3, 5 y 6 se describen aquí por inferencia pedagógica: Netflix no publica el protocolo de reproducción</tspan></text><text x="470" y="338.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">completo ni los nombres de sus servicios actuales.</tspan></text><text x="470" y="375.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Esquema pedagógico: las cajas punteadas son inferencia del curso, no arquitectura confirmada por Netflix.</tspan></text></svg>
