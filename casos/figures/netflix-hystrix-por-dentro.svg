<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 397" width="940" height="397" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 3, componente: qué hace Hystrix con cada llamada a una dependencia</title><desc id="d">Diagrama de flujo de la biblioteca Hystrix: construir el comando, mirar la caché, comprobar si el circuito está abierto, comprobar si la reserva de hilos está llena, ejecutar con tiempo límite, registrar el resultado y, ante cualquier fallo, devolver la respuesta alternativa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="397" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 3, componente: qué hace Hystrix con cada llamada a una dependencia</tspan></text><rect x="10" y="62" width="130" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="75" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="75" dy="0">1. Construir</tspan></text><text x="75" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="75" dy="0">comando</tspan></text><rect x="168" y="62" width="130" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="233" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="233" dy="0">2. ¿Hay caché?</tspan></text><rect x="326" y="62" width="130" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="391" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="391" dy="0">3. ¿Circuito</tspan></text><text x="391" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="391" dy="0">abierto?</tspan></text><rect x="484" y="62" width="130" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="549" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="549" dy="0">4. ¿Reserva</tspan></text><text x="549" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="549" dy="0">llena?</tspan></text><rect x="642" y="62" width="130" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="707" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="707" dy="0">5. Ejecutar con</tspan></text><text x="707" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="707" dy="0">tiempo límite</tspan></text><rect x="800" y="62" width="130" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="865" y="95.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="865" dy="0">6. Registrar</tspan></text><text x="865" y="111.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="865" dy="0">salud</tspan></text><polyline points="140,100 168,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="298,100 326,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="456,100 484,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="614,100 642,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="772,100 800,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="326" y="190" width="604" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="628" y="215" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="628" dy="0">Alternativa (fallback): si el circuito está abierto, la reserva llena, hay un</tspan></text><text x="628" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="628" dy="0">error o vence el tiempo, se devuelve una respuesta sin red (por ejemplo, de</tspan></text><text x="628" y="248.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="628" dy="0">memoria) en vez de un error</tspan></text><polyline points="391,138 391,190" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><polyline points="549,138 549,190" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><polyline points="707,138 707,190" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="190" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="206.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Circuito abierto: tras fallos</tspan></text><text x="160" y="223.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">repetidos se deja de llamar; pasado un</tspan></text><text x="160" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">tiempo pasa una petición de prueba</tspan></text><text x="160" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">(semiabierto)</tspan></text><polyline points="865,138 865,160 155,160 155,190" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="288" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="312.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en la wiki oficial de Hystrix: el orden de los pasos, el fallback ante circuito abierto, reserva llena, error o</tspan></text><text x="470" y="329.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tiempo agotado, y el estado semiabierto que deja pasar una petición tras la ventana de espera. Los umbrales concretos de</tspan></text><text x="470" y="346.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Netflix en producción no son públicos, y esta biblioteca no prueba qué usa hoy Netflix.</tspan></text><text x="470" y="383.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
