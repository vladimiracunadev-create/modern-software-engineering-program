="596.883" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="596.883" dy="0">4,8</tspan></text><rect x="634.718" y="124" width="69.0241" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="669.23" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="669.23" dy="0">4,4</tspan></text><text x="710.742" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="710.742" dy="0">39,0</tspan></text><rect x="94" y="164" width="312.008" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="250.004" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="250.004" dy="0">20,0</tspan></text><rect x="406.008" y="164" width="226.928" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="519.471" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="519.471" dy="0">14,5</tspan></text><rect x="632.935" y="164" width="83.767" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="674.819" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="674.819" dy="0">5,4</tspan></text><rect x="716.702" y="164" width="83.7044" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="758.554" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="758.554" dy="0">5,4</tspan></text><text x="807.407" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="807.407" dy="0">45,2</tspan></text><text x="484.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="484.85" dy="0">miles de millones de USD</tspan></text><rect x="10" y="255" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Asia-Pacífico crece 21 por ciento en 2025 frente al 15 de EE. UU. y Canadá, pero este último sigue siendo la región más</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">grande. Latinoamérica crece 11 por ciento. Los ingresos incluyen el efecto de coberturas cambiarias que el 10-K desglosa.</tspan></text><text x="470" y="344.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Netflix, Form 10-K de 2025, de 2016 y de 2007 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
