<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De dónde vienen los ingresos: cuatro regiones (2023-2025, miles de millones de USD)</title><desc id="d">Barras apiladas de ingresos de streaming por región en 2023, 2024 y 2025: Estados Unidos y Canadá 14,9, 17,4 y 20,0; Europa, Oriente Medio y África 10,6, 12,4 y 14,5; Latinoamérica 4,4, 4,8 y 5,4; Asia-Pacífico 3,8, 4,4 y 5,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De dónde vienen los ingresos: cuatro regiones (2023-2025, miles de millones de USD)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">EE. UU. y Canadá</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Europa, Oriente Medio y África</tspan></text><rect x="458.84" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="478.84" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="478.84" dy="0">Latinoamérica</tspan></text><rect x="604.86" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="624.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="624.86" dy="0">As