<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos historias que se cruzan: producto y plataforma (1997-2025)</title><desc id="d">Línea de tiempo con dos carriles. En producto, el DVD por correo domina hasta 2007, el streaming nace ese año, los originales empiezan en 2013, el plan con anuncios llega en 2022 y la emisión en directo en 2023. En plataforma, un fallo de base de datos en 2008 inicia la migración a la nube, que termina en enero de 2016; Open Connect se lanza en 2012.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="380" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos historias que se cruzan: producto y plataforma (1997-2025)</tspan></text><line x1="144" y1="83" x2="144" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="144" y1="199" x2="144" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="144" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="144" dy="0">1997</tspan></text><line x1="276.414" y1="83" x2="276.414" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="276.414" y1="199" x2="276.414" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="276.414" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="276.414" dy="0">2002</tspan></text><line x1="408.828" y1="83" x2="408.828" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="408.828" y1="199" x2="408.828" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="408.828" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="408.828" dy="0">2007</tspan></text><line x1="541.241" y1="83" x2="541.241" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="541.241" y1="199" x2="541.241" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="541.241" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="541.241" dy="0">2012</tspan></text><line x1="673.655" y1="83" x2="673.655" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="673.655" y1="199" x2="673.655" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="673.655" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="673.655" dy="0">2017</tspan></text><line x1="806.069" y1="83" x2="806.069" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="806.069" y1="199" x2="806.069" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="806.069" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="806.069" dy="0">2022</tspan></text><line x1="912" y1="83" x2="912" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="199" x2="912" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2026</tspan></text><line x1="144" y1="199" x2="912" y2="199" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="116.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">Producto</tspan></text><text x="134" y="174.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">Plataforma</tspan></text><line x1="435.31" y1="75" x2="435.31" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="435.31" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="435.31" dy="0">Fallo de BD</tspan></text><line x1="541.241" y1="75" x2="541.241" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="541.241" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="541.241" dy="0">Open Connect</tspan></text><line x1="647.172" y1="75" x2="647.172" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="647.991" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.991" dy="0">Nube completa</tspan></text><rect x="170.483" y="92" width="238.345" height="40" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="289.655" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="289.655" dy="0">DVD por correo</tspan></text><rect x="408.828" y="92" width="397.241" height="40" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="607.448" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607.448" dy="0">Streaming por suscripción</tspan></text><rect x="806.069" y="92" width="105.931" height="40" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="859.034" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="859.034" dy="0">Ads, directo</tspan></text><line x1="14" y1="141" x2="912" y2="141" stroke="#d5dde1" stroke-width="1"/><rect x="435.31" y="150" width="211.862" height="40" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="541.241" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="541.241" dy="0">Migración a la nube</tspan></text><rect x="647.172" y="150" width="264.828" height="40" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="779.586" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="779.586" dy="0">Nube y OCA</tspan></text><text x="528" y="243" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="528" dy="0">Año</tspan></text><rect x="10" y="257" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los dos carriles se solapan en 2007-2016: Netflix vendió streaming mientras seguía moviendo su plataforma fuera de sus</tspan></text><text x="470" y="298.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">centros de datos. Los años salen de la cronología oficial de Netflix y de su carta de 2016; el ancho de cada barra es una</tspan></text><text x="470" y="315.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">simplificación visual, no una medida de ingresos.</tspan></text><text x="470" y="362.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
