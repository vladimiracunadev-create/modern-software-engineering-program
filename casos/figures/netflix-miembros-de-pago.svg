<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 559" width="940" height="559" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Miembros de pago de Netflix por año (millones)</title><desc id="d">Línea con ocho puntos: 1 millón en 2003, 5 en 2006, 25 en 2012, 50 en 2014, 93 en 2016, 100 en 2017, 200 en 2021 y 301,6 millones al cierre de 2024; el crecimiento no es lineal y la pendiente cambia tras 2016, cuando el servicio llegó a más de 190 países.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="559" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Miembros de pago de Netflix por año (millones)</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="284" x2="910" y2="284" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="284" x2="78.62" y2="284" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="288.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="209" x2="910" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="209" x2="78.62" y2="209" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="213.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="134" x2="910" y2="134" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="134" x2="78.62" y2="134" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="359" x2="96.62" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">2003</tspan></text><line x1="210.246" y1="59" x2="210.246" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="210.246" y1="359" x2="210.246" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="210.246" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210.246" dy="0">2006</tspan></text><line x1="323.871" y1="59" x2="323.871" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="323.871" y1="359" x2="323.871" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="323.871" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="323.871" dy="0">2009</tspan></text><line x1="437.497" y1="59" x2="437.497" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="437.497" y1="359" x2="437.497" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="437.497" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437.497" dy="0">2012</tspan></text><line x1="551.123" y1="59" x2="551.123" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="551.123" y1="359" x2="551.123" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="551.123" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="551.123" dy="0">2015</tspan></text><line x1="664.749" y1="59" x2="664.749" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="664.749" y1="359" x2="664.749" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="664.749" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="664.749" dy="0">2018</tspan></text><line x1="778.374" y1="59" x2="778.374" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="778.374" y1="359" x2="778.374" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="778.374" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.374" dy="0">2021</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">2024</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Millones de miembros</text><text x="494.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Año del hito citado o del cierre</tspan></text><line x1="588.998" y1="59" x2="588.998" y2="359" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="593.998" y="72" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="593.998" dy="0">2016: 130 países nuevos</tspan></text><polyline points="96.62,358.25 210.246,355.25 437.497,340.25 513.248,321.5 588.998,289.25 626.873,284 778.374,209 892,132.8" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="358.25" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="347.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">1</tspan></text><circle cx="210.246" cy="355.25" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="210.246" y="344.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="210.246" dy="0">5</tspan></text><circle cx="437.497" cy="340.25" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="437.497" y="329.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="437.497" dy="0">25</tspan></text><circle cx="513.248" cy="321.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="513.248" y="310.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="513.248" dy="0">50</tspan></text><circle cx="588.998" cy="289.25" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="588.998" y="278.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="588.998" dy="0">93</tspan></text><circle cx="626.873" cy="284" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="626.873" y="273" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="626.873" dy="0">100</tspan></text><circle cx="778.374" cy="209" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="778.374" y="198" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="778.374" dy="0">200</tspan></text><circle cx="892" cy="132.8" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="121.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">301,6</tspan></text><rect x="10" y="419" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las cifras de 2003 a 2021 proceden de la cronología oficial de Netflix, el 93 de 2016 de su informe anual y el 301,6 del</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cierre de 2024 de su carta a accionistas. Netflix dejó de publicar el número trimestral de miembros desde el primer</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">trimestre de 2025: no existe un dato oficial regular posterior. Los puntos no son anuales completos, por lo que la línea</tspan></text><text x="470" y="493.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">une datos dispersos.</tspan></text><text x="470" y="541.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
