<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 541" width="940" height="541" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué pasa cuando cae cada componente: de la unidad más pequeña a la más grande</title><desc id="d">Cinco filas de falla creciente: un disco de un servidor de vídeo, un servidor entero, una dependencia lenta, una instancia de servicio y una región de nube; para cada una, el efecto en el espectador y el mecanismo que lo contiene, con rótulo de documentado o inferido; la última fila, el proveedor de nube completo, no tiene mecanismo público.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="541" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué pasa cuando cae cada componente: de la unidad más pequeña a la más grande</tspan></text><rect x="10" y="56" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un disco del servidor de vídeo</tspan></text><rect x="330" y="56" width="600" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">Se desactiva solo; el servidor sigue sirviendo (documentado)</tspan></text><polyline points="290,82 330,82" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="118" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="147.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un servidor de vídeo entero</tspan></text><rect x="330" y="118" width="600" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="630" y="147.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630" dy="0">El control lo saca del reparto; el cliente usa otro candidato (inferido)</tspan></text><polyline points="290,144 330,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="180" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="209.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Una dependencia lenta</tspan></text><rect x="330" y="180" width="600" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="209.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">Tiempo límite, interruptor y respuesta alternativa (documentado)</tspan></text><polyline points="290,206 330,206" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="242" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="271.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Una instancia de servicio</tspan></text><rect x="330" y="242" width="600" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">El balanceo y el registro la reemplazan; se prueba apagándolas (documentado)</tspan></text><polyline points="290,268 330,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="304" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="333.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Una región de nube</tspan></text><rect x="330" y="304" width="600" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="333.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">El tráfico pasa a otra región con datos replicados (documentado, 2013)</tspan></text><polyline points="290,330 330,330" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="366" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="395.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">El proveedor de nube completo</tspan></text><rect x="330" y="366" width="600" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="395.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">Sin mecanismo público; el 10-K declara dependencia y dificultad de cambio</tspan></text><polyline points="290,392 330,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="432" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="456.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en: página de appliances (discos redundantes y desactivación automática), wiki de Hystrix, artículo de</tspan></text><text x="470" y="473.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">activo-activo de 2013, repositorio de Chaos Monkey y 10-K de 2025. Inferido: la salida de un servidor del reparto, porque</tspan></text><text x="470" y="490.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el control devuelve candidatos. La escala de gravedad aumenta hacia abajo.</tspan></text><text x="470" y="527.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
