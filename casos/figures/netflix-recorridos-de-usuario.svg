<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 527" width="940" height="527" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro recorridos completos: de la primera interacción al caso límite</title><desc id="d">Cuatro filas de pasos encadenados: miembro nuevo, miembro del plan con anuncios, hogar que comparte cuenta y miembro que descarga para ver sin conexión; cada fila termina en su caso límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="527" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro recorridos completos: de la primera interacción al caso límite</tspan></text><rect x="10" y="54" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="95.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Miembro nuevo</tspan></text><rect x="174" y="54" width="140" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="79" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">Descubre la app</tspan></text><text x="244" y="95.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">o el botón del</tspan></text><text x="244" y="112.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">mando</tspan></text><rect x="328" y="54" width="140" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="398" y="87.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="398" dy="0">Elige plan y</tspan></text><text x="398" y="103.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="398" dy="0">paga</tspan></text><polyline points="314,92 328,92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="482" y="54" width="140" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="95.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Crea perfiles</tspan></text><polyline points="468,92 482,92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="636" y="54" width="140" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="706" y="87.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="706" dy="0">Recibe</tspan></text><text x="706" y="103.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="706" dy="0">recomendaciones</tspan></text><polyline points="622,92 636,92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="790" y="54" width="140" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="860" y="79" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="860" dy="0">Límite: cancela</tspan></text><text x="860" y="95.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="860" dy="0">y vuelve meses</tspan></text><text x="860" y="112.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="860" dy="0">después</tspan></text><polyline points="776,92 790,92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="142" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="183.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Plan con anuncios</tspan></text><rect x="174" y="142" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Elige el plan más</tspan></text><text x="263.25" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">barato</tspan></text><rect x="366.5" y="142" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455.75" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">Ve anuncios en la</tspan></text><text x="455.75" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">reproducción</tspan></text><polyline points="352.5,180 366.5,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="142" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="648.25" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">Catálogo con</tspan></text><text x="648.25" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">licencias distintas</tspan></text><polyline points="545,180 559,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="142" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="840.75" y="167" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: título no</tspan></text><text x="840.75" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">disponible en este</tspan></text><text x="840.75" y="200.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">plan</tspan></text><polyline points="737.5,180 751.5,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="230" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="271.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Hogar compartido</tspan></text><rect x="174" y="230" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="263.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Una cuenta, varios</tspan></text><text x="263.25" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">hogares</tspan></text><rect x="366.5" y="230" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="455.75" y="263.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">Netflix detecta uso</tspan></text><text x="455.75" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">fuera del hogar</tspan></text><polyline points="352.5,268 366.5,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="230" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="648.25" y="263.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">Miembro extra de pago</tspan></text><text x="648.25" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">o perfil transferido</tspan></text><polyline points="545,268 559,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="230" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="840.75" y="263.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: viaje con la</tspan></text><text x="840.75" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">TV de otro hogar</tspan></text><polyline points="737.5,268 751.5,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="318" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="359.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Sin conexión</tspan></text><rect x="174" y="318" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="351.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Descarga un título</tspan></text><text x="263.25" y="367.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">(desde 2016)</tspan></text><rect x="366.5" y="318" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="455.75" y="351.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">Se guarda en el</tspan></text><text x="455.75" y="367.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">dispositivo</tspan></text><polyline points="352.5,356 366.5,356" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="318" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="648.25" y="359.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">Reproduce sin red</tspan></text><polyline points="545,356 559,356" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="318" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="840.75" y="351.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: la licencia</tspan></text><text x="840.75" y="367.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">de la descarga caduca</tspan></text><polyline points="737.5,356 751.5,356" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="14" y="420" font-size="13" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="14" dy="0">Trazo punteado: paso inferido o con mecanismo no publicado. Cajas coral: el caso límite de cada recorrido.</tspan></text><rect x="10" y="434" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="458.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada fila es un tipo de usuario con su propio incentivo. Los pasos continuos salen de la cronología oficial y de la carta</tspan></text><text x="470" y="475.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 2024; los punteados son el comportamiento visible al usuario, no el mecanismo interno, que no es público.</tspan></text><text x="470" y="513.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
