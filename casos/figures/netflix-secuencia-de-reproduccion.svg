<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 575" width="940" height="575" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 4, secuencia: «Reproducir» paso a paso entre cliente, nube y Open Connect</title><desc id="d">Diagrama de secuencia con cinco participantes: cliente, puerta de entrada, servicios de control, Open Connect y telemetría. El cliente pide reproducir, el control valida y devuelve una lista de servidores, el cliente descarga segmentos y envía eventos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="575" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 4, secuencia: «Reproducir» paso a paso entre cliente, nube y Open Connect</tspan></text><rect x="26" y="58" width="168" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="110" dy="0">Cliente</tspan></text><rect x="206" y="58" width="168" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="290" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="290" dy="0">Zuul (entrada)</tspan></text><rect x="386" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Servicios de control</tspan></text><rect x="566" y="58" width="168" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="650" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="650" dy="0">Open Connect</tspan></text><rect x="746" y="58" width="168" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="830" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="830" dy="0">Telemetría</tspan></text><line x1="110" y1="104" x2="110" y2="452" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="290" y1="104" x2="290" y2="452" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="470" y1="104" x2="470" y2="452" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="650" y1="104" x2="650" y2="452" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="830" y1="104" x2="830" y2="452" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="113,138 287,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="200" y="130" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="200" dy="0">1. Pide reproducir un título</tspan></text><polyline points="293,184 467,184" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="380" y="176" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="380" dy="0">2. Filtra y enruta</tspan></text><polyline points="470,224 516,224 516,238 474,238" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="524" y="234" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="524" dy="0">3. Plan, perfil y derechos (inferido)</tspan></text><polyline points="467,276 113,276" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="290" y="268" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="290" dy="0">4. Servidores y manifiesto (inferido)</tspan></text><polyline points="113,322 647,322" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="380" y="314" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="380" dy="0">5. Pide segmentos de vídeo</tspan></text><polyline points="647,368 113,368" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="380" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="380" dy="0">6. Segmentos desde el servidor cercano</tspan></text><polyline points="113,414 827,414" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="470" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">7. Eventos de reproducción (inferido)</tspan></text><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: la puerta de entrada recibe todas las peticiones y el vídeo sale de Open Connect, no de la nube de control.</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Inferido por el curso: la validación de derechos, la lista de servidores, el manifiesto y los eventos de telemetría;</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Netflix no publica el protocolo actual. Flechas punteadas: pasos inferidos.</tspan></text><text x="470" y="561.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
