<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 588" width="940" height="588" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Casos especiales documentados y cómo se resuelven</title><desc id="d">Cinco tarjetas: picos de diciembre, estafas por ingeniería social, pagos de noche, cobros recurrentes y pagos desde el extranjero; cada una con su mecanismo y veredicto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="588" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Casos especiales documentados y cómo se resuelven</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Diciembre: aguinaldo y fiestas</tspan></text><polyline points="402,97.32 438,97.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="77" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="100.96" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">El SPI funciona 24 horas y sostiene 7,1 mil millones al mes</tspan></text><text x="24" y="134.64" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El récord de un día fue de más de 313 millones de operaciones (2025).</tspan></text><rect x="20" y="156.28" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="180.24" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Estafa por ingeniería social</tspan></text><polyline points="402,176.6 438,176.6" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="156.28" width="478" height="40.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="180.24" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">MED, bloqueo cautelar y alertas de las instituciones</tspan></text><text x="24" y="213.92" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">No evita el pago voluntario; reduce el daño si se actúa rápido.</tspan></text><rect x="20" y="235.56" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="259.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Pagos de noche</tspan></text><polyline points="402,255.88 438,255.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="235.56" width="478" height="40.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="259.52" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">Límites nocturnos desde 2022</tspan></text><text x="24" y="293.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Reduce el daño de un robo de teléfono a costa de comodidad.</tspan></text><rect x="20" y="314.84" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="338.8" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Cobros recurrentes</tspan></text><polyline points="402,335.16 438,335.16" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="314.84" width="478" height="40.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="338.8" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">Pix Automático (2025) con autorización previa</tspan></text><text x="24" y="372.48" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Reemplaza el débito en cuenta de contratos bilaterales; adopción lenta por exigir desarrollo del receptor.</tspan></text><rect x="20" y="394.12" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="418.08" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Pagos de y hacia extranjeros</tspan></text><polyline points="402,414.44 438,414.44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="394.12" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="418.08" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Alianzas con instituciones de otros países</tspan></text><text x="24" y="451.76" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El Pix en sí es solo doméstico; la parte internacional va por canales tradicionales.</tspan></text><rect x="10" y="475.4" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="500.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada tarjeta enlaza un hecho citado con el mecanismo. Color: coral falla, teal se sostiene, gold depende. Dónde deja de</tspan></text><text x="470" y="517" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: son casos documentados en los informes del Banco Central, que informa de su propia política.</tspan></text><text x="470" y="560.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: documentos públicos del Banco Central do Brasil citados en el caso (consulta 2026-11-23). Esquema del autor.</tspan></text></svg>
