<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la idea al Pix: los dos años del lanzamiento</title><desc id="d">Línea de tiempo en meses desde diciembre de 2018: el Banco Central publica los requisitos fundamentales el 21 de diciembre de 2018; en octubre de 2019 comienza el desarrollo de la infraestructura; el 12 de agosto de 2020 se publica el Reglamento del Pix; el 5 de octubre empieza el registro de claves, con más de 25 millones en los primeros días; el 3 de noviembre comienza la operación restringida; el 16 de noviembre el Pix entra en operación plena.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la idea al Pix: los dos años del lanzamiento</tspan></text><line x1="104.54" y1="83" x2="104.54" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="104.54" y1="221" x2="104.54" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="104.54" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.54" dy="0">0</tspan></text><line x1="298.33" y1="83" x2="298.33" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="298.33" y1="221" x2="298.33" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="298.33" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="298.33" dy="0">6</tspan></text><line x1="492.121" y1="83" x2="492.121" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="492.121" y1="221" x2="492.121" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="492.121" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492.121" dy="0">12</tspan></text><line x1="685.911" y1="83" x2="685.911" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="685.911" y1="221" x2="685.911" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="685.911" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685.911" dy="0">18</tspan></text><line x1="879.702" y1="83" x2="879.702" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="879.702" y1="221" x2="879.702" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="879.702" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="879.702" dy="0">24</tspan></text><line x1="912" y1="83" x2="912" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="221" x2="912" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">25</tspan></text><line x1="104.54" y1="221" x2="912" y2="221" stroke="#5b7280" stroke-width="1.6"/><text x="94.54" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="94.54" dy="0">Diseño</tspan></text><text x="94.54" y="156.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="94.54" dy="0">Reglas</tspan></text><text x="94.54" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="94.54" dy="0">Operación</tspan></text><line x1="104.54" y1="75" x2="104.54" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="104.54" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="104.54" dy="0">dic 2018</tspan></text><line x1="427.524" y1="75" x2="427.524" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="427.524" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="427.524" dy="0">oct 2019</tspan></text><line x1="763.427" y1="75" x2="763.427" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="763.427" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="763.427" dy="0">ago 2020</tspan></text><line x1="863.552" y1="75" x2="863.552" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="863.552" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="863.552" dy="0">nov 2020</tspan></text><rect x="104.54" y="92" width="322.984" height="28" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="266.032" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="266.032" dy="0">Grupo de trabajo y consulta pública</tspan></text><rect x="427.524" y="92" width="322.984" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="589.016" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="589.016" dy="0">Desarrollo del SPI y del DICT</tspan></text><line x1="14" y1="129" x2="912" y2="129" stroke="#d5dde1" stroke-width="1"/><rect x="750.508" y="138" width="48.4476" height="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="798.956" y="138" width="48.4476" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="175" x2="912" y2="175" stroke="#d5dde1" stroke-width="1"/><rect x="821.564" y="184" width="19.379" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="840.944" y="184" width="22.6089" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="508.27" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="508.27" dy="0">meses desde diciembre de 2018</tspan></text><rect x="10" y="279" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el informe de gestión 2020-2022: el grupo de trabajo tuvo más de 130 participantes; los requisitos se</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aprobaron en diciembre de 2018; el desarrollo comenzó en octubre de 2019; el Reglamento (Resolución BCB nº 1) salió el 12</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de agosto de 2020 tras consulta pública. Dónde deja de valer: las posiciones en el eje son aproximadas; hay hitos de días</tspan></text><text x="470" y="353.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entre octubre y noviembre.</tspan></text><text x="470" y="401.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Banco Central do Brasil, Relatório de Gestão do Pix 2020-2022, consulta 2026-11-23.</tspan></text></svg>
