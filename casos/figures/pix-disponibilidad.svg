<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 462" width="940" height="462" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Disponibilidad del SPI frente al mínimo normativo</title><desc id="d">Barras en porcentaje: el mínimo normativo de disponibilidad es 99,90 por ciento y el índice del SPI cerró diciembre de 2025 en 99,98 por ciento; el sistema debe funcionar las 24 horas de todos los días del año.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="462" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Disponibilidad del SPI frente al mínimo normativo</tspan></text><line x1="78.62" y1="287" x2="920" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="243" x2="920" y2="243" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="243" x2="78.62" y2="243" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="247.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="199" x2="920" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="199" x2="78.62" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="155" x2="920" y2="155" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="155" x2="78.62" y2="155" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="159.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="111" x2="920" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="111" x2="78.62" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 177)">% de disponibilidad</text><rect x="120.689" y="67.22" width="336.552" height="219.78" rx="3" fill="#087f8c"/><text x="288.965" y="61.22" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="288.965" dy="0">99,90</tspan></text><text x="288.965" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Mínimo normativo</tspan></text><rect x="541.379" y="67.044" width="336.552" height="219.956" rx="3" fill="#087f8c"/><text x="709.655" y="61.044" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.655" dy="0">99,98</tspan></text><text x="709.655" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Diciembre de 2025</tspan></text><rect x="10" y="339" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Mire que la diferencia parece mínima: 0,08 puntos. Con 99,90 % se permite cerca de 8,8 horas de inactividad al año; con</tspan></text><text x="470" y="380.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">99,98 %, unas 1,8 horas (cálculo propio sobre 8 760 horas). Dónde deja de valer: el índice se calcula sobre los tres</tspan></text><text x="470" y="397.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">últimos meses.</tspan></text><text x="470" y="444.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Banco Central do Brasil, Relatório Anual do SPI 2025, consulta 2026-11-23.</tspan></text></svg>
