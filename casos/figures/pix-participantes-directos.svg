<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Participantes directos del SPI al cierre de cada año</title><desc id="d">Barras con 111 participantes directos en diciembre de 2021, 124 en 2022, 150 en 2023, 176 en 2024 y 214 en 2025; los indirectos eran 693 a fines de 2025, el 76 por ciento del total.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Participantes directos del SPI al cierre de cada año</tspan></text><line x1="78.62" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="307" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="259" x2="920" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="259" x2="78.62" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="211" x2="920" y2="211" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="211" x2="78.62" y2="211" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="215.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="163" x2="920" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="163" x2="78.62" y2="163" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">150</tspan></text><line x1="78.62" y1="115" x2="920" y2="115" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="115" x2="78.62" y2="115" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">250</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">participantes directos</text><rect x="95.4476" y="200.44" width="134.621" height="106.56" rx="3" fill="#102a43"/><text x="162.758" y="194.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162.758" dy="0">111</tspan></text><text x="162.758" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="162.758" dy="0">2021</tspan></text><rect x="263.724" y="187.96" width="134.621" height="119.04" rx="3" fill="#102a43"/><text x="331.034" y="181.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="331.034" dy="0">124</tspan></text><text x="331.034" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="331.034" dy="0">2022</tspan></text><rect x="432" y="163" width="134.621" height="144" rx="3" fill="#102a43"/><text x="499.31" y="157" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">150</tspan></text><text 