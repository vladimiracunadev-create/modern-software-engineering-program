<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" width="940" height="492" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pix interbancarios liquidados por el SPI en cada mes de diciembre</title><desc id="d">Barras en miles de millones de transacciones: 1,22 en diciembre de 2021, 2,42 en 2022, 4,21 en 2023, 5,71 en 2024 y 7,10 en 2025; el crecimiento de 2024 a 2025 fue de 24 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="492" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pix interbancarios liquidados por el SPI en cada mes de diciembre</tspan></text><line x1="63.54" y1="317" x2="920" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="317" x2="63.54" y2="317" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="321.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="254.5" x2="920" y2="254.5" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="254.5" x2="63.54" y2="254.5" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="259" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="192" x2="920" y2="192" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="192" x2="63.54" y2="192" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="129.5" x2="920" y2="129.5" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="129.5" x2="63.54" y2="129.5" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="134" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="67" x2="63.54" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">8</tspan></text><line x1="63.54" y1="67" x2="63.54" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 192)">miles de millones de transacciones</text><rect x="80.6692" y="278.875" width="137.034" height="38.125" rx="3" fill="#087f8c"/><text x="149.186" y="272.875" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149.186" dy="0">1,22</tspan></text><text x="149.186" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="149.186" dy="0">Dic 2021</tspan></text><rect x="251.961" y="241.375" width="137.034" height="75.625" rx="3" fill="#087f8c"/><text x="320.478" y="235.375" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="320.478" dy="0">2,42</tspan></text><text x="320.478" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="320.478" dy="0">Dic 2022</tspan></text><rect x="423.253" y="185.438" width="137.034" height="131.562" rx="3" fill="#087f8c"/><text x="491.77" y="179.438" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="491.77" dy="0">4,21</tspan></text><text x="491.77" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491.77" dy="0">Dic 2023</tspan></text><rect x="594.545" y="138.562" width="137.034" height="178.438" rx="3" fill="#087f8c"/><text x="663.062" y="132.562" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="663.062" dy="0">5,71</tspan></text><text x="663.062" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="663.062" dy="0">Dic 2024</tspan></text><rect x="765.837" y="95.125" width="137.034" height="221.875" rx="3" fill="#087f8c"/><text x="834.354" y="89.125" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="834.354" dy="0">7,10</tspan></text><text x="834.354" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="834.354" dy="0">Dic 2025</tspan></text><rect x="10" y="369" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Son solo los Pix entre instituciones distintas, que son los que el SPI liquida; los Pix dentro de una misma institución se</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">liquidan fuera del SPI. Diciembre supera el promedio por el aguinaldo y las fiestas. Dónde deja de valer: es un mes por</tspan></text><text x="470" y="427.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">año, no el promedio anual.</tspan></text><text x="470" y="474.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Banco Central do Brasil, Relatório Anual do SPI 2025, consulta 2026-11-23.</tspan></text></svg>
