<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántos Pix se liquidan por día según el tipo de día (2025)</title><desc id="d">Barras en millones por día: 225,03 millones en promedio los viernes, 147,61 millones los domingos y 154,35 millones los feriados; los picos horarios están entre las 10 y las 14 horas y entre las 16 y las 19, y la franja de menos actividad va de las 2 a las 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántos Pix se liquidan por día según el tipo de día (2025)</tspan></text><line x1="78.62" y1="297" x2="920" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="297" x2="78.62" y2="297" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="251" x2="920" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="251" x2="78.62" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="205" x2="920" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="205" x2="78.62" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="209.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="159" x2="920" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="159" x2="78.62" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">150</tspan></text><line x1="78.62" y1="113" x2="920" y2="113" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="113" x2="78.62" y2="113" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="117.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">250</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 182)">millones de Pix por día</text><rect x="106.666" y="89.9724" width="224.368" height="207.028" rx="3" fill="#087f8c"/><text x="218.85" y="83.9724" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.85" dy="0">225,03</tspan></text><text x="218.85" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Viernes</tspan></text><rect x="387.126" y="154.998" width="224.368" height="142.002" rx="3" fill="#087f8c"/><text x="499.31" y="148.998" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">154,35</tspan></text><text x="499.31" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Feriados</tspan></text><rect x="667.586" y="161.199" width="224.368" height="135.801" rx="3" fill="#087f8c"/><text x="779.77" y="155.199" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">147,61</tspan></text><text x="779.77" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Domingos</tspan></text><rect x="10" y="349" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hay actividad todas las horas del día: no hay momentos de inactividad. Mire que incluso el domingo, el día más bajo, mueve</tspan></text><text x="470" y="390.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">casi 148 millones. Dónde deja de valer: son promedios de Pix interbancarios; el récord de un día completo de 2025 fue</tspan></text><text x="470" y="407.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mayor.</tspan></text><text x="470" y="454.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Banco Central do Brasil, Relatório Anual do SPI 2025, consulta 2026-11-23.</tspan></text></svg>
