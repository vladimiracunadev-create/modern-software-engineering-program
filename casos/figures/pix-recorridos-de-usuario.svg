<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 521" width="940" height="521" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro recorridos en el Pix y su caso límite</title><desc id="d">Cuatro filas de pasos: una persona que paga a un amigo con una clave, un comercio que cobra con un código QR, una empresa que cobra con débito automático y una víctima de una estafa; cada fila termina en un caso límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="521" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro recorridos en el Pix y su caso límite</tspan></text><rect x="10" y="56" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Persona</tspan></text><rect x="174" y="56" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263.25" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.25" dy="0">Abre la app de su</tspan></text><text x="263.25" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.25" dy="0">institución</tspan></text><rect x="366.5" y="56" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455.75" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">Escribe la clave del</tspan></text><text x="455.75" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">receptor</tspan></text><polyline points="352.5,94 366.5,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="56" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="648.25" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">Confirma el nombre y</tspan></text><text x="648.25" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">el valor</tspan></text><polyline points="545,94 559,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="56" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Pago de noche con</tspan></text><text x="840.75" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">límite nocturno</tspan></text><polyline points="737.5,94 751.5,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="144" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="185.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Comercio</tspan></text><rect x="174" y="144" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="263.25" y="185.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="263.25" dy="0">Genera un código QR</tspan></text><rect x="366.5" y="144" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455.75" y="177.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">El cliente lo lee con</tspan></text><text x="455.75" y="193.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">su app</tspan></text><polyline points="352.5,182 366.5,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="144" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="648.25" y="185.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">Confirma y paga</tspan></text><polyline points="545,182 559,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="144" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="177.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Pago diferido o con</tspan></text><text x="840.75" y="193.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">vencimiento</tspan></text><polyline points="737.5,182 751.5,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="232" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="265.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Empresa</tspan></text><text x="85" y="281.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">recurrente</tspan></text><rect x="174" y="232" width="178.5" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="263.25" y="257" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="263.25" dy="0">Pide autorización al</tspan></text><text x="263.25" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="263.25" dy="0">pagador (Pix</tspan></text><text x="263.25" y="290.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="263.25" dy="0">Automático)</tspan></text><rect x="366.5" y="232" width="178.5" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="455.75" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="455.75" dy="0">El pagador autoriza</tspan></text><text x="455.75" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="455.75" dy="0">una vez</tspan></text><polyline points="352.5,270 366.5,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="232" width="178.5" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="648.25" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="648.25" dy="0">Se programan cobros</tspan></text><polyline points="545,270 559,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="232" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Cobro rechazado por</tspan></text><text x="840.75" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">saldo insuficiente</tspan></text><polyline points="737.5,270 751.5,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="320" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="361.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Víctima de estafa</tspan></text><rect x="174" y="320" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="361.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Es engañada y paga</tspan></text><rect x="366.5" y="320" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="455.75" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">Reclama a su</tspan></text><text x="455.75" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">institución</tspan></text><polyline points="352.5,358 366.5,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="320" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="648.25" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">Se bloquean los</tspan></text><text x="648.25" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">fondos (MED)</tspan></text><polyline points="545,358 559,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="320" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Los fondos ya</tspan></text><text x="840.75" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">salieron de la cuenta</tspan></text><polyline points="737.5,358 751.5,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="412" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="436.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada fila se lee de izquierda a derecha y la caja coral es el borde. El código QR, el Pix Automático, el límite nocturno y</tspan></text><text x="470" y="453.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el MED son funciones descritas en los informes de gestión del Banco Central; los casos límite son escenarios del curso.</tspan></text><text x="470" y="470.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde deja de valer: no mide cuántos usuarios llegan a cada borde.</tspan></text><text x="470" y="507.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Esquema del autor sobre los relatórios de gestão do Pix.</tspan></text></svg>
