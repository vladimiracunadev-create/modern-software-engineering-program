<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 529" width="940" height="529" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la orden de pago a la confirmación, con lo documentado y lo inferido</title><desc id="d">Secuencia de un Pix: el pagador inicia en su aplicación; su institución resuelve la clave en el DICT; envía la orden al SPI; el SPI liquida en las cuentas PI y avisa a ambas instituciones; la institución del receptor acredita y confirma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="529" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la orden de pago a la confirmación, con lo documentado y lo inferido</tspan></text><rect x="26" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="110" dy="0">Pagador</tspan></text><rect x="206" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="290" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290" dy="0">Institución del</tspan></text><text x="290" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290" dy="0">pagador</tspan></text><rect x="386" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">DICT</tspan></text><rect x="566" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="650" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="650" dy="0">SPI</tspan></text><rect x="746" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830" dy="0">Institución del</tspan></text><text x="830" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830" dy="0">receptor</tspan></text><line x1="110" y1="104" x2="110" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="290" y1="104" x2="290" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="470" y1="104" x2="470" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="650" y1="104" x2="650" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="830" y1="104" x2="830" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="113,138 287,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="200" y="114" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="200" dy="0">1. inicia el pago con una clave</tspan><tspan x="200" dy="16.64">o un código QR</tspan></text><polyline points="293,184 467,184" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="380" y="176" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="380" dy="0">2. consulta la clave</tspan></text><polyline points="467,230 293,230" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="380" y="206" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="380" dy="0">3. devuelve la cuenta del</tspan><tspan x="380" dy="16.64">receptor</tspan></text><polyline points="293,276 647,276" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="268" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">4. envía la orden de pago</tspan></text><polyline points="653,322 827,322" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="740" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="740" dy="0">5. liquida y comunica el</tspan><tspan x="740" dy="16.64">resultado</tspan></text><polyline points="827,368 113,368" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="470" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">6. acredita y confirma a ambos</tspan></text><rect x="10" y="420" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="444.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: el DICT resuelve claves, el SPI liquida de forma bruta en tiempo real y de modo irrevocable y las</tspan></text><text x="470" y="461.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">instituciones notifican; el Manual de Tiempos fija límites para cada paso. Inferido (trazo punteado): la forma exacta de la</tspan></text><text x="470" y="478.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">confirmación final. Dónde deja de valer: omite el canal secundario, los Pix dentro de la misma institución y el MED.</tspan></text><text x="470" y="515.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: documentos públicos del Banco Central do Brasil citados en el caso (consulta 2026-11-23). Esquema del autor.</tspan></text></svg>
