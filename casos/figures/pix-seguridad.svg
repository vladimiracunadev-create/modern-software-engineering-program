<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mecanismos de seguridad que el Pix fue sumando</title><desc id="d">Flujo de seguridad: límites de valor por tramo horario, límites nocturnos desde 2022, bloqueo cautelar de hasta 72 horas desde noviembre de 2021, el Mecanismo Especial de Devolución desde noviembre de 2021 y su autoservicio en 2025, y restricciones a las claves de usuarios con fraude confirmado desde septiembre de 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="345" fill="#ffffff"/><rect x="10" y="14" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152" dy="0">Límites de valor para personas</tspan></text><text x="152" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152" dy="0">físicas (2021-2022)</tspan></text><rect x="338" y="14" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Límites nocturnos (2022)</tspan></text><polyline points="294,56 338,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="808" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">Bloqueo cautelar: hasta 72 horas en</tspan></text><text x="808" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">el receptor (nov. 2021)</tspan></text><polyline points="622,56 666,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">MED: bloqueo y devolución tras la</tspan></text><text x="152" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">queja de la víctima (nov. 2021)</tspan></text><rect x="338" y="138" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">MED de autoservicio (2025)</tspan></text><polyline points="294,180 338,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="138" width="284" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="808" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="808" dy="0">Restricciones a claves con marca de</tspan></text><text x="808" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="808" dy="0">fraude (sept. 2025)</tspan></text><polyline points="622,180 666,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,98 808,118 152,118 152,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Documentado en los informes de gestión de 2020-2022 y 2023-2025. El MED agiliza la devolución por falla operacional o fundada</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">sospecha de fraude: los fondos se bloquean en la cuenta del estafador y se devuelven si la queja procede. Dónde deja de valer:</tspan></text><text x="480" y="294.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">no hay en estas fuentes tasas de éxito de devolución.</tspan></text><text x="480" y="335.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Fuentes: documentos públicos del Banco Central do Brasil citados en el caso (consulta 2026-11-23). Esquema del autor.</tspan></text></svg>
