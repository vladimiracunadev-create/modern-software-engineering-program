<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valor liquidado por el SPI: 2024, 2025 y el acumulado desde el lanzamiento</title><desc id="d">Barras en billones de reales: 22,12 en 2024, 29,61 en 2025 y un acumulado de 80,33 billones desde el lanzamiento; a fines de 2024 el acumulado era de 50,72 billones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="476" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Valor liquidado por el SPI: 2024, 2025 y el acumulado desde el lanzamiento</tspan></text><line x1="78.62" y1="317" x2="920" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="317" x2="78.62" y2="317" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="321.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="267" x2="920" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="217" x2="920" y2="217" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="217" x2="78.62" y2="217" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="167" x2="920" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="167" x2="78.62" y2="167" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="171.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="117" x2="920" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="117" x2="78.62" y2="117" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="121.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 192)">billones de reales (R$ 10^12)</text><rect x="99.6545" y="261.7" width="168.276" height="55.3" rx="3" fill="#102a43"/><text x="183.793" y="255.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="183.793" dy="0">22,12</tspan></text><text x="183.793" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">2024</tspan></text><rect x="310" y="242.975" width="168.276" height="74.025" rx="3" fill="#102a43"/><text x="394.138" y="236.975" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="394.138" dy="0">29,61</tspan></text><text x="394.138" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">2025</tspan></text><rect x="520.345" y="190.2" width="168.276" height="126.8" rx="3" fill="#102a43"/><text x="604.483" y="184.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="604.483" dy="0">50,72</tspan></text><text x="604.482" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">Acumulado a fines de 2024</tspan></text><rect x="730.689" y="116.175" width="168.276" height="200.825" rx="3" fill="#102a43"/><text x="814.827" y="110.175" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="814.827" dy="0">80,33</tspan></text><text x="814.827" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">Acumulado a fines de 2025</tspan></text><rect x="10" y="369" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cálculo propio: 29,61 sobre 22,12 es un crecimiento de 33,9 % del valor liquidado por el SPI; 50,72 más 29,61 son 80,33.</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde deja de valer: es solo lo liquidado por el SPI (interbancario); el Pix total de 2025 superó los 35 billones.</tspan></text><text x="470" y="458.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Banco Central do Brasil, Relatório Anual do SPI 2025, consulta 2026-11-23.</tspan></text></svg>
