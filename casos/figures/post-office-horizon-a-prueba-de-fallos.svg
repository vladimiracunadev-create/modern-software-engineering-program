<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" width="940" height="512" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</title><desc id="d">Cuatro columnas: mecanismos que existían y funcionaron (registro interno de errores, revisión posterior, tribunales), que existían y fallaron (asistencia, contrato, valoración de fiabilidad), que no existían (función de disputa, divulgación, independencia de la acusación) y que debieron existir (análisis propio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="512" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</tspan></text><rect x="10" y="51" width="216.5" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="118.25" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="118.25" dy="0">Existía y funcionó</tspan></text><rect x="10" y="101" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Registro de incidencias y</tspan></text><text x="118.25" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">errores conocidos (PEAK y</tspan></text><text x="118.25" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">KEL)</tspan></text><rect x="10" y="172.92" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Contraste con ingenieros y</tspan></text><text x="118.25" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">auditores que anotaron los</tspan></text><text x="118.25" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">hechos</tspan></text><rect x="10" y="244.84" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="263.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Revisión judicial del</tspan></text><text x="118.25" y="280.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">sistema en 2019</tspan></text><rect x="10" y="300.12" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="319.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Remisión de la CCRC al</tspan></text><text x="118.25" y="335.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">tribunal de apelación</tspan></text><rect x="244.5" y="51" width="216.5" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352.75" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="352.75" dy="0">Existía y falló</tspan></text><rect x="244.5" y="101" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Asistencia: trataba los</tspan></text><text x="352.75" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">faltantes como deuda</tspan></text><rect x="244.5" y="156.28" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Valoración interna de</tspan></text><text x="352.75" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">2010: el sistema era</tspan></text><text x="352.75" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">robusto</tspan></text><rect x="244.5" y="228.2" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Contrato y prácticas de</tspan></text><text x="352.75" y="263.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">reclamación</tspan></text><rect x="244.5" y="283.48" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="302.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Revisión de 2012: llegó</tspan></text><text x="352.75" y="319.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">tarde</tspan></text><rect x="479" y="51" width="216.5" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.25" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="587.25" dy="0">No existía</tspan></text><rect x="479" y="101" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Función de disputa en</tspan></text><text x="587.25" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Horizon</tspan></text><rect x="479" y="156.28" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Divulgación de errores</tspan></text><text x="587.25" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">conocidos a la defensa</tspan></text><rect x="479" y="211.56" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Separación entre quien</tspan></text><text x="587.25" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">reclama y quien acusa</tspan></text><rect x="479" y="266.84" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="285.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Acceso de los</tspan></text><text x="587.25" y="302.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">subpostmasters a los datos</tspan></text><text x="587.25" y="319.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">de investigación</tspan></text><rect x="713.5" y="51" width="216.5" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="821.75" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="821.75" dy="0">Debió existir (análisis</tspan></text><text x="821.75" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="821.75" dy="0">propio)</tspan></text><rect x="713.5" y="108.28" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="127.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Función de marcar un</tspan></text><text x="821.75" y="143.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">faltante como discutido y</tspan></text><text x="821.75" y="160.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">congelarlo</tspan></text><rect x="713.5" y="180.2" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="199.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Registro de modificaciones</tspan></text><text x="821.75" y="215.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">remotas visible para el</tspan></text><text x="821.75" y="232.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">usuario</tspan></text><rect x="713.5" y="252.12" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="271.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Divulgación sistemática de</tspan></text><text x="821.75" y="287.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">errores conocidos</tspan></text><rect x="713.5" y="307.4" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="326.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Revisión independiente</tspan></text><text x="821.75" y="343" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">periódica con efecto sobre</tspan></text><text x="821.75" y="359.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">las decisiones</tspan></text><rect x="10" y="389.32" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="414.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: los mecanismos que funcionaron actuaron años después; los que fallaron o no existían estaban antes. La</tspan></text><text x="470" y="430.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuarta columna es análisis propio.</tspan></text><text x="470" y="478.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Hamilton v Post Office, [2021] EWCA Crim 577. Fuente: Bates v Post Office (n.º 6), [2019] EWHC 3408 (QB). Análisis propio,</tspan></text><text x="470" y="494" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">no conclusión de los tribunales ni de la investigación.</tspan></text></svg>
