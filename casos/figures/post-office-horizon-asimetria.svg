<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 434" width="940" height="434" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién podía ver y modificar qué: la asimetría de información</title><desc id="d">Dos columnas: lo que veía y podía hacer el subpostmaster, con acceso a su propia sucursal y sin forma de disputar en el sistema, y lo que podían ver y hacer Fujitsu y el Post Office, con acceso remoto extenso, registros internos de errores y capacidad, en algunos casos, de modificar cuentas sin conocimiento del subpostmaster.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="434" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién podía ver y modificar qué: la asimetría de información</tspan></text><rect x="10" y="51" width="451" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="235.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="235.5" dy="0">Subpostmaster</tspan></text><rect x="10" y="101" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Veía las cuentas de su sucursal y los errores que el</tspan></text><text x="235.5" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">sistema le mostraba</tspan></text><rect x="10" y="156.28" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="179.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">No tenía modo de disputar un faltante en Horizon</tspan></text><rect x="10" y="204.28" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="223.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Desventaja importante de acceso a información para</tspan></text><text x="235.5" y="239.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">investigar</tspan></text><rect x="10" y="259.56" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="283.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">No conocía el contenido de los registros internos</tspan></text><rect x="479" y="51" width="451" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="704.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="704.5" dy="0">Fujitsu y Post Office</tspan></text><rect x="479" y="101" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Acceso remoto extenso a las cuentas de sucursal</tspan></text><rect x="479" y="149" width="451" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Algunas cuentas se alteraron sin que lo supiera el</tspan></text><text x="704.5" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">subpostmaster y en las cuentas aparecía como si lo hubiera</tspan></text><text x="704.5" y="201.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">hecho él</tspan></text><rect x="479" y="220.92" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="244.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Registros internos de errores conocidos (PEAK y KEL)</tspan></text><rect x="479" y="268.92" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="292.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Derecho contractual a la información de Fujitsu</tspan></text><rect x="10" y="326.92" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: un sistema en el que un lado puede reescribir el registro sin dejar rastro visible para el otro no sirve</tspan></text><text x="470" y="368.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">como prueba contra ese otro. La afirmación sobre las modificaciones es el resumen de la CCRC de los hallazgos del juez.</tspan></text><text x="470" y="416.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Hamilton v Post Office, [2021] EWCA Crim 577. Apartado 56 (xi, viii, ix).</tspan></text></svg>
