<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El Court of Appeal anuló 39 de las 42 condenas que examinó</title><desc id="d">Barras horizontales con las apelaciones de la sentencia Hamilton: 42 apelaciones remitidas por la CCRC, 39 estimadas con las condenas anuladas y 3 desestimadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El Court of Appeal anuló 39 de las 42 condenas que examinó</tspan></text><line x1="294" y1="49" x2="294" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="163" x2="294" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="415.176" y1="49" x2="415.176" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="415.176" y1="163" x2="415.176" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="415.176" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="415.176" dy="0">10</tspan></text><line x1="536.352" y1="49" x2="536.352" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="536.352" y1="163" x2="536.352" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="536.352" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="536.352" dy="0">20</tspan></text><line x1="657.528" y1="49" x2="657.528" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="657.528" y1="163" x2="657.528" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="657.528" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657.528" dy="0">30</tspan></text><line x1="778.704" y1="49" x2="778.704" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="778.704" y1="163" x2="778.704" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="778.704" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.704" dy="0">40</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="163" x2="899.88" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">50</tspan></text><line x1="294" y1="163" x2="899.88" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Apelaciones remitidas por la CCRC</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Estimadas: condenas anuladas</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Desestimadas</tspan></text><rect x="294" y="55" width="508.939" height="26" rx="3" fill="#087f8c"/><text x="809.939" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="809.939" dy="0">42</tspan></text><rect x="294" y="93" width="472.586" height="26" rx="3" fill="#087f8c"/><text x="773.586" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="773.586" dy="0">39</tspan></text><rect x="294" y="131" width="36.3528" height="26" rx="3" fill="#087f8c"/><text x="337.353" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="337.353" dy="0">3</tspan></text><text x="596.94" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="596.94" dy="0">Número de apelaciones</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las 42 son un subconjunto de los casos de la red: es el grupo que la CCRC remitió al tribunal, no el total de personas</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">procesadas. El Act de 2024 anula, además, las condenas de Inglaterra, Gales e Irlanda del Norte del ámbito de la ley que no</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hubieran sido consideradas por el Court of Appeal.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Hamilton v Post Office, [2021] EWCA Crim 577. Apartado 447; Fuente: Post Office (Horizon System) Offences Act 2024.</tspan></text></svg>
