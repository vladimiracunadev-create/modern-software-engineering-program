<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 459" width="940" height="459" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defectos reconocidos y cómo se vieron en las sucursales</title><desc id="d">Capas con ejemplos de defectos que consideró el tribunal: el error de Callendar Square, descubierto en 2005 y admitido después por el Post Office, que causó discrepancias en las cuentas; el error de Dalmellington; los desajustes entre recibos y pagos; y el mínimo de 11 errores aceptados por el experto del Post Office.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="459" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Defectos reconocidos y cómo se vieron en las sucursales</tspan></text><rect x="10" y="51" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="78.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Callendar Square</tspan></text><rect x="270" y="51" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Descubierto en 2005 en una sucursal; admitido por el Post Office como error; causó</tspan></text><text x="600" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">discrepancias en las cuentas (en un caso, un faltante de 6 414,46 libras)</tspan></text><rect x="10" y="106.28" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="133.56" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Dalmellington</tspan></text><rect x="270" y="106.28" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="125.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">El tribunal lo compara con la experiencia de un subpostmaster experimentado que</tspan></text><text x="600" y="141.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">transfirió 2 000 libras entre terminales y vio desaparecer esa suma</tspan></text><rect x="10" y="161.56" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="188.84" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Desajuste de recibos y pagos</tspan></text><rect x="270" y="161.56" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="180.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Uno de los efectos que figuran en un cuadro de 30 sucursales analizado en el juicio,</tspan></text><text x="600" y="197.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">junto con otros como pantallas congeladas y problemas de declaraciones</tspan></text><rect x="10" y="216.84" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="235.8" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Cifra mínima aceptada por el</tspan></text><text x="135" y="252.44" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">experto del Post Office</tspan></text><rect x="270" y="216.84" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="244.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Once errores distintos; el tribunal aceptó más, siguiendo al experto de los demandantes</tspan></text><rect x="10" y="272.12" width="250" height="47.28" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="291.08" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">Origen exacto de cada incidente</tspan></text><text x="135" y="307.72" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">individual</tspan></text><rect x="270" y="272.12" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="291.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">El tribunal advierte que el método de un experto no permitía atribuir cada incidente a</tspan></text><text x="600" y="307.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">un error concreto; no se sabe la causa de muchos casos</tspan></text><rect x="10" y="335.4" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="360.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: no es una lista de todos los defectos de Horizon, sino ejemplos que el tribunal examinó. Verde: documentado</tspan></text><text x="470" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en la sentencia; gris: no se sabe. Mira la última fila: la ausencia de una causa por incidente no implica que no la</tspan></text><text x="470" y="393.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hubiera.</tspan></text><text x="470" y="441.32" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Bates v Post Office (n.º 6), [2019] EWHC 3408 (QB). Apartados 404 y 925 a 930.</tspan></text></svg>
