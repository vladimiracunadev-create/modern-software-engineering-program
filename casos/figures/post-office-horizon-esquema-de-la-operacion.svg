<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 271" width="940" height="271" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema de la operación: del contrato a la cuenta de la sucursal</title><desc id="d">Esquema de la operación: el Post Office contrata a subpostmasters para atender sucursales; Horizon registra las transacciones y las cuentas; el Post Office reclama los faltantes; los subpostmasters los cubren o son cesados; en una parte de los casos, el Post Office perseguía penalmente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="271" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema de la operación: del contrato a la cuenta de la sucursal</tspan></text><rect x="10" y="51" width="200" height="80.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">Contrato entre el Post</tspan></text><text x="110" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">Office y cada</tspan></text><text x="110" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">subpostmaster</tspan></text><rect x="250" y="51" width="200" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="350" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">Atención de la sucursal</tspan></text><text x="350" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">y transacciones en</tspan></text><text x="350" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">Horizon</tspan></text><rect x="490" y="51" width="200" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="590" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">Cuentas de la sucursal:</tspan></text><text x="590" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">Horizon como fuente de</tspan></text><text x="590" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">verdad</tspan></text><rect x="730" y="51" width="200" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Reclamación del faltante</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">o cese; en algunos</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">casos, procesamiento</tspan></text><text x="830" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">penal</tspan></text><polyline points="210,91.28 250,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,91.28 490,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,91.28 730,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="147.56" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="172.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: la economía de la red depende de que las cuentas sean correctas; el coste de un sistema incorrecto lo</tspan></text><text x="470" y="189.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">soportaba quien tenía menos medios de comprobarlo. El volumen de pérdidas reclamadas en la High Court fue de unos 18</tspan></text><text x="470" y="205.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">millones de libras.</tspan></text><text x="470" y="253.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Hamilton v Post Office, [2021] EWCA Crim 577. Apartados 20 a 22.</tspan></text></svg>
