<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 395" width="940" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se ha examinado y quién lo ha hecho: cuatro tipos de fuente pública</title><desc id="d">Tres columnas: la High Court examinó el sistema en 2019, el Court of Appeal anuló condenas en 2021 y el Parlamento legisló en 2024; la investigación pública estatutaria publicó el volumen 1 de su informe final en julio de 2025, centrado en el impacto humano y la reparación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="395" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se ha examinado y quién lo ha hecho: cuatro tipos de fuente pública</tspan></text><rect x="10" y="51" width="294.667" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="157.333" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="157.333" dy="0">Tribunales</tspan></text><rect x="10" y="101" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">High Court, 16 de diciembre de 2019:</tspan></text><text x="157.333" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Bates v Post Office (n.º 6), sobre el</tspan></text><text x="157.333" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">funcionamiento de Horizon</tspan></text><rect x="10" y="172.92" width="294.667" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Court of Appeal (Criminal Division),</tspan></text><text x="157.333" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">23 de abril de 2021: Hamilton v Post</tspan></text><text x="157.333" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Office, sobre 42 apelaciones</tspan></text><text x="157.333" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">remitidas por la CCRC</tspan></text><rect x="322.667" y="51" width="294.667" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Parlamento</tspan></text><rect x="322.667" y="101" width="294.667" height="97.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Post Office (Horizon System) Offences</tspan></text><text x="470" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Act 2024, sancionada el 24 de mayo de</tspan></text><text x="470" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">2024: anula las condenas incluidas en</tspan></text><text x="470" y="169.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">su ámbito y regula la eliminación de</tspan></text><text x="470" y="186.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">amonestaciones</tspan></text><rect x="635.333" y="51" width="294.667" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782.667" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="782.667" dy="0">Investigación pública</tspan></text><rect x="635.333" y="101" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Informe final, volumen 1: 8 de julio</tspan></text><text x="782.667" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">de 2025, sobre el impacto humano y la</tspan></text><text x="782.667" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">reparación</tspan></text><rect x="635.333" y="172.92" width="294.667" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Quedan por publicar los demás</tspan></text><text x="782.667" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">volúmenes: el resultado técnico y de</tspan></text><text x="782.667" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">gobierno no se conoce todavía en este</tspan></text><text x="782.667" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">caso</tspan></text><rect x="10" y="271.48" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="296.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: los tribunales establecieron lo que se puede afirmar sobre el sistema y los procesos; la investigación</tspan></text><text x="470" y="313.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pública aún no ha publicado su examen del desarrollo y de la gobernanza. Mira la tercera columna: este caso no inventa lo</tspan></text><text x="470" y="329.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que esa investigación todavía no ha dicho.</tspan></text><text x="470" y="377.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: judgments de Bates (2019) y Hamilton (2021); Act 2024; Post Office Horizon IT Inquiry.</tspan></text></svg>
