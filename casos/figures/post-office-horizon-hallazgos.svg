<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 553" width="940" height="553" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete de los once hallazgos del juez, según la CCRC, que fundaron la apelación</title><desc id="d">Capas con siete hallazgos del juez de la High Court, tal como los resumió la CCRC y los recoge el tribunal de apelación: Legacy Horizon no era robusto; había riesgo de inexactitud en las cuentas; existía evidencia independiente; el Post Office no reveló la fiabilidad real; la investigación era pobre; los subpostmasters estaban en desventaja; el acceso remoto era extenso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="553" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Siete de los once hallazgos del juez, según la CCRC, que fundaron la apelación</tspan></text><rect x="10" y="51" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="78.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Fiabilidad</tspan></text><rect x="270" y="51" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Legacy Horizon no era robusto en absoluto; HNG-X algo más, pero con un número</tspan></text><text x="600" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">significativo de errores</tspan></text><rect x="10" y="106.28" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="133.56" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Riesgo de inexactitud</tspan></text><rect x="270" y="106.28" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="125.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Había un riesgo significativo y material de inexactitud en las cuentas por errores y</tspan></text><text x="600" y="141.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">defectos; los faltantes pudieron deberse a Horizon entre 2000 y 2010 y después</tspan></text><rect x="10" y="161.56" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="188.84" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Evidencia independiente</tspan></text><rect x="270" y="161.56" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="180.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Los ingenieros de Royal Mail y los auditores del Post Office respaldaban la versión de</tspan></text><text x="600" y="197.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">los subpostmasters</tspan></text><rect x="10" y="216.84" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="244.12" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Divulgación</tspan></text><rect x="270" y="216.84" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="235.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">El Post Office no reveló a los subpostmasters la situación completa y exacta sobre la</tspan></text><text x="600" y="252.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">fiabilidad del sistema</tspan></text><rect x="10" y="272.12" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="299.4" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Investigación</tspan></text><rect x="270" y="272.12" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="291.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">La posición por defecto era que el subpostmaster debía ser el responsable; el nivel de</tspan></text><text x="600" y="307.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">investigación era pobre</tspan></text><rect x="10" y="327.4" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="354.68" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Capacidad de defensa</tspan></text><rect x="270" y="327.4" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="346.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Los subpostmasters estaban en clara desventaja de acceso a la información y no podían</tspan></text><text x="600" y="363" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">disputar faltantes en Horizon</tspan></text><rect x="10" y="382.68" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="409.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Acceso remoto</tspan></text><rect x="270" y="382.68" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Extenso; algunas cuentas se modificaron sin conocimiento del subpostmaster y aparecían</tspan></text><text x="600" y="418.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">como acciones suyas</tspan></text><rect x="10" y="445.96" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="470.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: son hallazgos del juez resumidos por la CCRC, no del autor de este caso. Mira que solo uno trata del</tspan></text><text x="470" y="487.56" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">software; los otros seis son de proceso, información y gobierno.</tspan></text><text x="470" y="535.24" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Hamilton v Post Office, [2021] EWCA Crim 577. Apartados 56 y 57.</tspan></text></svg>
