<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 428" width="940" height="428" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se sabe de la pila técnica de Horizon</title><desc id="d">Capas de la pila técnica de Horizon: terminales de mostrador; versión original llamada Legacy Horizon; Horizon Online, con las variantes HNG-X y HNG-A; registro de incidencias de Fujitsu; lenguaje, bases de datos y arquitectura interna no se publican en las fuentes consultadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="428" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se sabe de la pila técnica de Horizon</tspan></text><rect x="10" y="51" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="78.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Mostrador</tspan></text><rect x="270" y="51" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Terminales en unas 11 500 sucursales y seis millones de transacciones diarias según un</tspan></text><text x="600" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">comunicado del Post Office de 2015, citado en la sentencia</tspan></text><rect x="10" y="106.28" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="129.92" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Versiones</tspan></text><rect x="270" y="106.28" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="129.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Legacy Horizon (2000-2010) y Horizon Online (HNG-X desde 2010 y HNG-A después)</tspan></text><rect x="10" y="154.28" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="177.92" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Registros de errores</tspan></text><rect x="270" y="154.28" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="177.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">PEAK por incidencia y KEL por error conocido, mantenidos por Fujitsu</tspan></text><rect x="10" y="202.28" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="229.56" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Origen</tspan></text><rect x="270" y="202.28" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="221.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Proyecto Pathway (1996-1999), de ICL con el Post Office y la Agencia de Prestaciones,</tspan></text><text x="600" y="237.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">que se retiró y dio paso a Horizon</tspan></text><rect x="10" y="257.56" width="250" height="47.28" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="276.52" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">Lenguaje, base de datos, centro</tspan></text><text x="135" y="293.16" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">de datos, arquitectura de red</tspan></text><rect x="270" y="257.56" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="284.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">No constan con detalle en las fuentes consultadas; este caso no los inventa</tspan></text><rect x="10" y="320.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="345.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el nivel de detalle público alcanza para entender el problema, no para auditar el sistema. Verde:</tspan></text><text x="470" y="362.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">documentado; gris: no se sabe.</tspan></text><text x="470" y="410.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Bates v Post Office (n.º 6), [2019] EWHC 3408 (QB). Apartados 299 y 519.</tspan></text></svg>
