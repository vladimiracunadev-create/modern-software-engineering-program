<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 439" width="940" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué aprender y qué no generalizar</title><desc id="d">Dos columnas: lo que se transfiere, como dar a los usuarios una vía de disputa y un registro de cambios, divulgar errores conocidos y separar a quien reclama de quien acusa, y lo que no se generaliza, como culpar a una tecnología o dar por resuelto lo que la investigación aún no ha dicho.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="439" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué aprender y qué no generalizar</tspan></text><rect x="10" y="51" width="451" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235.5" dy="0">Se transfiere</tspan></text><rect x="10" y="101" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Un sistema que produce cuentas necesita un camino para</tspan></text><text x="235.5" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">disputarlas</tspan></text><rect x="10" y="156.28" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Los registros internos de errores conocidos deben llegar a</tspan></text><text x="235.5" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">quien puede verse afectado</tspan></text><rect x="10" y="211.56" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Cuando un lado puede modificar datos, el otro debe poder</tspan></text><text x="235.5" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">verlo</tspan></text><rect x="10" y="266.84" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="290.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Quien reclama no debe ser quien decide acusar</tspan></text><rect x="479" y="51" width="451" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="704.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="704.5" dy="0">No se generaliza</tspan></text><rect x="479" y="101" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">No prueba que el software de contabilidad sea peligroso:</tspan></text><text x="704.5" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">prueba que sin controles de proceso es peligroso</tspan></text><rect x="479" y="156.28" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">No es el fallo de una persona; es de varios sistemas e</tspan></text><text x="704.5" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">incentivos</tspan></text><rect x="479" y="211.56" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">El informe final de la investigación está incompleto:</tspan></text><text x="704.5" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">faltan volúmenes</tspan></text><rect x="479" y="266.84" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="285.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Las cifras y fechas son de este caso y de la ley de Reino</tspan></text><text x="704.5" y="302.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Unido</tspan></text><rect x="10" y="332.12" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="357.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el aprendizaje es de ingeniería de sistemas sociotécnicos, de gobierno y de ética. Mira la columna derecha:</tspan></text><text x="470" y="373.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el caso se usa mal cuando se reduce a un villano o a un error de código.</tspan></text><text x="470" y="421.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio, no conclusión de los tribunales ni de la investigación.</tspan></text></svg>
