<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde se guardaban los errores conocidos y por qué no llegaban a los acusados</title><desc id="d">Cadena de los registros internos de Fujitsu: cuando un subpostmaster llamaba a la asistencia y el caso pasaba a la sección técnica se creaba un documento llamado PEAK; los PEAK alimentaban un registro de errores conocidos llamado KEL; el Post Office tenía derecho contractual a esa información; en los procesos contra los 42 apelantes no consta que se divulgara ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dónde se guardaban los errores conocidos y por qué no llegaban a los acusados</tspan></text><rect x="10" y="51" width="280" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">Llamada del subpostmaster a la</tspan></text><text x="150" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">asistencia</tspan></text><rect x="330" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Fujitsu crea un registro de</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">incidencia (PEAK)</tspan></text><rect x="650" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">Los PEAK alimentan el registro de</tspan></text><text x="790" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">errores conocidos (KEL)</tspan></text><polyline points="290,74.64 330,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,74.64 650,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,98.28 790,113.28 150,113.28 150,132.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132.28" width="280" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="150" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="150" dy="0">El Post Office tiene derecho</tspan></text><text x="150" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="150" dy="0">contractual a esa información</tspan></text><rect x="330" y="132.28" width="280" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="151.24" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">En los 42 procesos de la apelación</tspan></text><text x="470" y="167.88" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">no consta divulgación</tspan></text><polyline points="290,155.92 330,155.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="195.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el conocimiento de que el sistema tenía defectos existía en un registro interno del proveedor y no llegó a</tspan></text><text x="470" y="237.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">quien se defendía. Mira la última caja: es una ausencia de divulgación, no una conclusión sobre intenciones.</tspan></text><text x="470" y="284.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Hamilton v Post Office, [2021] EWCA Crim 577. Apartados 17 y 18.</tspan></text></svg>
