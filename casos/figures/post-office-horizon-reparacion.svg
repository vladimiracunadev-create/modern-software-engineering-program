<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 393" width="940" height="393" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los esquemas de reparación que cita la investigación</title><desc id="d">Tres columnas: el Horizon Shortfall Scheme para quienes perdieron dinero por faltantes, el esquema de la orden de litigio colectivo y el esquema de condenas anuladas, con el cierre del primero el 27 de noviembre de 2025 y la fusión del esquema de condenas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="393" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Los esquemas de reparación que cita la investigación</tspan></text><rect x="10" y="51" width="294.667" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="157.333" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="157.333" dy="0">Horizon Shortfall Scheme</tspan></text><rect x="10" y="101" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Para quienes cubrieron faltantes</tspan></text><rect x="10" y="149" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Oferta de suma fija o evaluación</tspan></text><text x="157.333" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">individual</tspan></text><rect x="10" y="204.28" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="223.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">No se admitieron reclamaciones tras</tspan></text><text x="157.333" y="239.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">la medianoche del 27 de noviembre de</tspan></text><text x="157.333" y="256.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">2025</tspan></text><rect x="322.667" y="51" width="294.667" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Esquema de la orden de litigio</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">colectivo</tspan></text><rect x="322.667" y="108.28" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="131.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Para quienes litigaron colectivamente</tspan></text><rect x="322.667" y="156.28" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">La investigación recomienda ampliar</tspan></text><text x="470" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">derechos de alegación oral y el</tspan></text><text x="470" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">principio de mejor oferta</tspan></text><rect x="635.333" y="51" width="294.667" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="782.667" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="782.667" dy="0">Condenas</tspan></text><rect x="635.333" y="101" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Esquema de condenas anuladas</tspan></text><rect x="635.333" y="149" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">En marzo de 2025 se anunció su fusión</tspan></text><text x="782.667" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">con el esquema de reparación de</tspan></text><text x="782.667" y="201.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">condenas de Horizon</tspan></text><rect x="10" y="286.2" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="311.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: reparar es un proceso que también necesita diseño; el volumen 1 emite 19 recomendaciones sobre definición de</tspan></text><text x="470" y="327.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reparación plena y justa, asesoramiento legal, plazos y organismo administrador. Los importes pagados no se citan aquí.</tspan></text><text x="470" y="375.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Post Office Horizon IT Inquiry, informe final, vol. 1 (jul 2025).</tspan></text></svg>
