<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="940" height="410" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué significa «robusto»: dos definiciones que se discutieron en el juicio</title><desc id="d">Dos columnas con las definiciones de robustez de los dos expertos: el de los demandantes la define como capacidad de un sistema de funcionar correctamente en cualquier escenario, con tratamiento eficaz de errores; el del Post Office como objetivo de ingeniería frente a riesgos concretos, que no significa ser perfecto sino abordar los riesgos de la imperfección.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="410" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué significa «robusto»: dos definiciones que se discutieron en el juicio</tspan></text><rect x="10" y="51" width="451" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="235.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="235.5" dy="0">Experto de los demandantes</tspan></text><rect x="10" y="101" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Capacidad de resistir y superar condiciones adversas</tspan></text><rect x="10" y="149" width="451" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">El sistema debe funcionar correctamente en cualquier</tspan></text><text x="235.5" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">escenario, incluidas entradas inválidas, con tratamiento</tspan></text><text x="235.5" y="201.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">eficaz de errores</tspan></text><rect x="10" y="220.92" width="451" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="239.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Horizon no era robusto: muchos errores, fallos de</tspan></text><text x="235.5" y="256.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">mecanismos de integridad, discrepancias que no se</tspan></text><text x="235.5" y="273.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">detectaban y procesos manuales para modificar datos</tspan></text><rect x="479" y="51" width="451" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="704.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="704.5" dy="0">Experto del Post Office</tspan></text><rect x="479" y="101" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Robustez frente a riesgos concretos: fallos de hardware, de</tspan></text><text x="704.5" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">comunicaciones, errores de usuario, fraude</tspan></text><rect x="479" y="156.28" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">No significa ser perfecto: significa abordar los riesgos de</tspan></text><text x="704.5" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">la imperfección</tspan></text><rect x="479" y="211.56" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">El nivel de robustez pudo variar a lo largo de la vida del</tspan></text><text x="704.5" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">sistema</tspan></text><rect x="10" y="302.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="327.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el desacuerdo no era sobre si había errores, que ambos aceptaron, sino sobre cuánto importaban. El juez</tspan></text><text x="470" y="344.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">prefirió el enfoque de quien partió de incidentes concretos; esa valoración es suya, no de este caso.</tspan></text><text x="470" y="392.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Bates v Post Office (n.º 6), [2019] EWHC 3408 (QB). Apartados 40 a 42 y 925.</tspan></text></svg>
