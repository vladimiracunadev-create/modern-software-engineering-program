<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 618" width="940" height="618" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: el cierre a los siete meses exigió tres condiciones a la vez</title><desc id="d">Árbol de fallas con compuerta Y. Evento superior: cierre del servicio a los siete meses del lanzamiento. Ramas: la demanda de pago fue insuficiente, el capital necesario para llegar a escala no estaba disponible y no hubo un cambio de rumbo a tiempo. Cada rama tiene causas documentadas e interpretaciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="618" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: el cierre a los siete meses exigió tres condiciones a la vez</tspan></text><rect x="290" y="49" width="360" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="80.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Cierre del servicio a los siete meses</tspan></text><line x1="470" y1="105" x2="470" y2="129" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="470" cy="141" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="146" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><line x1="155" y1="157" x2="785" y2="157" stroke="#8a9aa3" stroke-width="1.4"/><line x1="155" y1="157" x2="155" y2="175" stroke="#8a9aa3" stroke-width="1.4"/><line x1="470" y1="157" x2="470" y2="175" stroke="#8a9aa3" stroke-width="1.4"/><line x1="785" y1="157" x2="785" y2="175" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="175" width="290" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="208.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="155" dy="0">La demanda de pago fue insuficiente</tspan></text><rect x="325" y="175" width="290" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="208.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">No había capital para llegar a escala</tspan></text><rect x="640" y="175" width="290" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="208.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="785" dy="0">No hubo cambio de rumbo a tiempo</tspan></text><line x1="155" y1="235" x2="155" y2="251" stroke="#8a9aa3" stroke-width="1.4"/><line x1="470" y1="235" x2="470" y2="251" stroke="#8a9aa3" stroke-width="1.4"/><line x1="785" y1="235" x2="785" y2="251" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="155" cy="263" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="155" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="155" dy="0">O</tspan></text><circle cx="470" cy="263" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><circle cx="785" cy="263" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="785" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="785" dy="0">O</tspan></text><line x1="155" y1="275" x2="155" y2="289" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="289" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="155" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">Conversión baja o en disputa</tspan></text><text x="155" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">(estimaciones de terceros)</tspan></text><rect x="10" y="359" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="155" y="383.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">Oferta gratuita de vídeo corto</tspan></text><text x="155" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">(documentado)</tspan></text><rect x="10" y="429" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="155" y="453.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">Uso en movimiento reducido por el</tspan></text><text x="155" y="469.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">confinamiento (documentado)</tspan></text><line x1="470" y1="275" x2="470" y2="289" stroke="#8a9aa3" stroke-width="1.4"/><rect x="325" y="289" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Necesidad de más capital pronto,</tspan></text><text x="470" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">según Whitman (documentado)</tspan></text><rect x="325" y="359" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="383.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos que no respaldaban una nueva</tspan></text><text x="470" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ronda (documentado)</tspan></text><line x1="785" y1="275" x2="785" y2="289" stroke="#8a9aa3" stroke-width="1.4"/><rect x="640" y="289" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Experimentos del verano sin cambiar</tspan></text><text x="785" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">la respuesta (documentado)</tspan></text><rect x="640" y="359" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="383.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Televisor solo el 20 de octubre</tspan></text><text x="785" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">(documentado)</tspan></text><rect x="640" y="429" width="290" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="785" y="453.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">Compromiso de capital previo muy</tspan></text><text x="785" y="469.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">grande (interpretación)</tspan></text><rect x="10" y="511" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="535.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">O: basta una causa; Y: hacen falta todas. Es un modelo lógico simplificado, sin probabilidades ni datos internos. Evitar</tspan></text><text x="470" y="552.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una de las tres ramas principales habría evitado el cierre en ese plazo, según el modelo.</tspan></text><text x="470" y="600.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Deadline, Variety, NBC News y The Verge (2020); esquema propio.</tspan></text></svg>
