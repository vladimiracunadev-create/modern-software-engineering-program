<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 468" width="940" height="468" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Propuesta: capital por tramos, cada uno liberado por un hito de evidencia y con una salida si no se cumple</title><desc id="d">Cuatro etapas en fila: hipótesis y prueba barata, piloto con una cohorte, lanzamiento por segmento y escala. Cada una tiene un hito de evidencia que libera el siguiente tramo y una flecha de salida hacia abandono o cambio si no se cumple. Es una propuesta de este programa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="468" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Propuesta: capital por tramos, cada uno liberado por un hito de evidencia y con una salida si no se cumple</tspan></text><rect x="10" y="53" width="214" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="117" dy="0">1 Hipótesis y prueba</tspan></text><text x="117" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="117" dy="0">barata</tspan></text><rect x="10" y="113" width="214" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="145" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="117" dy="0">Hito: uso y disposición a</tspan></text><text x="117" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="117" dy="0">pagar medidos con una</tspan></text><text x="117" y="178.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="117" dy="0">cohorte pequeña</tspan></text><rect x="10" y="207" width="214" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="117" y="230.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="117" dy="0">Tramo pequeño</tspan></text><polyline points="117,247 117,277" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="245" y="53" width="214" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="352" dy="0">2 Piloto con una cohorte</tspan></text><rect x="245" y="113" width="214" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="145" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">Hito: conversión y</tspan></text><text x="352" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">retención por encima del</tspan></text><text x="352" y="178.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">umbral pactado</tspan></text><rect x="245" y="207" width="214" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352" y="230.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="352" dy="0">Tramo moderado</tspan></text><polyline points="224,81 245,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="352,247 352,277" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="480" y="53" width="214" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="587" dy="0">3 Lanzamiento por segmento</tspan></text><rect x="480" y="113" width="214" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="153.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">Hito: costo por suscriptor</tspan></text><text x="587" y="169.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">por debajo del límite</tspan></text><rect x="480" y="207" width="214" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="587" y="230.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587" dy="0">Tramo mayor</tspan></text><polyline points="459,81 480,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="587,247 587,277" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="715" y="53" width="214" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="822" dy="0">4 Escala</tspan></text><rect x="715" y="113" width="214" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="153.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Hito: retención sostenida</tspan></text><text x="822" y="169.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">a los 90 días</tspan></text><rect x="715" y="207" width="214" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="822" y="230.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="822" dy="0">Resto del capital</tspan></text><polyline points="694,81 715,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="822,247 822,277" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="277" width="920" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">Si el hito no se cumple: cambiar de modelo, devolver el capital restante o parar, según criterios firmados antes de gastar</tspan></text><rect x="10" y="361" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="385.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La proporción de capital por tramo es ilustrativa. Propuesta de este programa: no afirma que los inversores la habrían</tspan></text><text x="470" y="402.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aceptado ni que el resultado habría cambiado.</tspan></text><text x="470" y="450.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis propio apoyado en las clases SE-130 y SE-141 del curso.</tspan></text></svg>
