<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 442" width="940" height="442" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De 1.750 millones recaudados a unos 350 en caja: el uso del capital y lo que se devolvió</title><desc id="d">Cuatro barras horizontales en millones de dólares. Capital recaudado: unos 1.750. Uso del capital por diferencia: unos 1.400 consumidos y unos 350 en caja al anunciar el cierre. Efectivo a devolver a los inversores: unos 350. Derechos vendidos a Roku: menos de 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="442" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De 1.750 millones recaudados a unos 350 en caja: el uso del capital y lo que se devolvió</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Recaudado</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Consumido por diferencia</tspan></text><rect x="360.82" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="380.82" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="380.82" dy="0">En caja al cierre</tspan></text><rect x="537" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="557" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="557" dy="0">Efectivo a devolver</tspan></text><rect x="16" y="69" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Derechos a Roku (tope)</tspan></text><line x1="294" y1="101" x2="294" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="261" x2="294" y2="266" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="282" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="439.425" y1="101" x2="439.425" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="439.425" y1="261" x2="439.425" y2="266" stroke="#5b7280" stroke-width="1.4"/><text x="439.425" y="282" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.425" dy="0">500</tspan></text><line x1="584.85" y1="101" x2="584.85" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="584.85" y1="261" x2="584.85" y2="266" stroke="#5b7280" stroke-width="1.4"/><text x="584.85" y="282" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="584.85" dy="0">1 000</tspan></text><line x1="730.275" y1="101" x2="730.275" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="730.275" y1="261" x2="730.275" y2="266" stroke="#5b7280" stroke-width="1.4"/><text x="730.275" y="282" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.275" dy="0">1 500</tspan></text><line x1="875.7" y1="101" x2="875.7" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="261" x2="875.7" y2="266" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="282" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2 000</tspan></text><line x1="294" y1="261" x2="875.7" y2="261" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="125.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Capital recaudado</tspan></text><text x="284" y="165.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Uso del capital (cálculo propio)</tspan></text><text x="284" y="205.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Efectivo a devolver</tspan></text><text x="284" y="245.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Derechos a Roku (tope)</tspan></text><rect x="294" y="108" width="508.988" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="548.494" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="548.494" dy="0">1 750</tspan></text><rect x="802.988" y="108" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="802.988" y="108" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="802.988" y="108" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="802.988" y="108" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="809.988" y="125.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="809.988" dy="0">1 750</tspan></text><rect x="294" y="148" width="0" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="148" width="407.19" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="497.595" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497.595" dy="0">1 400</tspan></text><rect x="701.19" y="148" width="101.798" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="752.089" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752.089" dy="0">350</tspan></text><rect x="802.988" y="148" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="802.988" y="148" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="809.988" y="165.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="809.988" dy="0">1 750</tspan></text><rect x="294" y="188" width="0" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="188" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="188" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="188" width="101.798" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="344.899" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="344.899" dy="0">350</tspan></text><rect x="395.798" y="188" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="402.798" y="205.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="402.798" dy="0">350</tspan></text><rect x="294" y="228" width="0" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="228" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="228" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="228" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="228" width="29.085" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="330.085" y="245.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="330.085" dy="0">100</tspan></text><text x="584.85" y="305" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">millones de dólares</tspan></text><rect x="10" y="319" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="343.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo consumido es la diferencia entre dos cifras de prensa y no una cifra contable: no distingue contenido, marketing y</tspan></text><text x="470" y="360.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">operación. Las dos últimas barras vienen de fuentes distintas y no se suman; la de Roku es un tope («significativamente</tspan></text><text x="470" y="377.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">menos» de 100 millones) y su destino no es público.</tspan></text><text x="470" y="424.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Deadline (21 oct 2020), Variety (1 dic 2020) y The Verge (8 ene 2021, citando al WSJ).</tspan></text></svg>
