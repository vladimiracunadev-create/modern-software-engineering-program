<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Frente a Disney+: uno o dos órdenes de magnitud menos en registros y en suscriptores</title><desc id="d">Dos grupos de barras en millones con eje logarítmico. Registros en los primeros tres días: unos 9,5 de Disney+ y unos 0,91 de Quibi. Suscriptores de pago o hogares suscriptores en 2020: más de 50 de Disney y 1,1 de Quibi en el segundo trimestre.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Frente a Disney+: uno o dos órdenes de magnitud menos en registros y en suscriptores</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Disney+</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Quibi</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,5</tspan></text><line x1="78.62" y1="332.856" x2="920" y2="332.856" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="332.856" x2="78.62" y2="332.856" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="337.356" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="235" x2="78.62" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">5</tspan></text><line x1="78.62" y1="192.856" x2="920" y2="192.856" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="192.856" x2="78.62" y2="192.856" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="197.356" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">10</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">millones (escala logarítmica)</text><rect x="120.689" y="195.974" width="166.276" height="179.026" rx="3" fill="#102a43"/><text x="203.827" y="189.974" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="203.827" dy="0">9,50</tspan></text><rect x="290.965" y="338.59" width="166.276" height="36.41" rx="3" fill="#c0432f"/><text x="374.103" y="332.59" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374.103" dy="0">0,91</tspan></text><text x="288.965" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Registros en los tres primeros días</tspan></text><rect x="541.379" y="95" width="166.276" height="280" rx="3" fill="#102a43"/><text x="624.517" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="624.517" dy="0">50,00</tspan></text><rect x="711.655" y="327.061" width="166.276" height="47.9392" rx="3" fill="#c0432f"/><text x="794.793" y="321.061" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.793" dy="0">1,10</tspan></text><text x="709.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Suscriptores de pago u hogares, 2020</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las dos medidas no son iguales (registros frente a suscriptores o hogares), las fuentes son estimaciones de terceros</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(Sensor Tower y Kantar) y la cifra de Disney es de abril de 2020. La figura compara órdenes de magnitud, no calidad ni</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">gustos.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: The Verge (8 jul 2020, Sensor Tower) y Variety (1 dic 2020, Kantar).</tspan></text></svg>
