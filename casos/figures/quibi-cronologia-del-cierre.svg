<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 483" width="940" height="483" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del 30 de septiembre al 8 de enero: tres semanas de búsqueda, un anuncio, el cierre y la venta de los derechos</title><desc id="d">Línea de tiempo en días desde el 30 de septiembre de 2020. Tres semanas de búsqueda de socios y compradores hasta el anuncio del 21 de octubre, día 21. La decisión de devolver el efectivo hacia el 7 de octubre, día 7. El servicio se cierra el 1 de diciembre, día 62, y los derechos se venden a Roku el 8 de enero, día 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="483" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Del 30 de septiembre al 8 de enero: tres semanas de búsqueda, un anuncio, el cierre y la venta de los</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">derechos</tspan></text><line x1="304" y1="102" x2="304" y2="302" stroke="#d5dde1" stroke-width="1"/><line x1="304" y1="302" x2="304" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="304" y="323" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="304" dy="0">0</tspan></text><line x1="405.333" y1="102" x2="405.333" y2="302" stroke="#d5dde1" stroke-width="1"/><line x1="405.333" y1="302" x2="405.333" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="405.333" y="323" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="405.333" dy="0">20</tspan></text><line x1="506.667" y1="102" x2="506.667" y2="302" stroke="#d5dde1" stroke-width="1"/><line x1="506.667" y1="302" x2="506.667" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="506.667" y="323" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.667" dy="0">40</tspan></text><line x1="608" y1="102" x2="608" y2="302" stroke="#d5dde1" stroke-width="1"/><line x1="608" y1="302" x2="608" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="608" y="323" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="608" dy="0">60</tspan></text><line x1="709.333" y1="102" x2="709.333" y2="302" stroke="#d5dde1" stroke-width="1"/><line x1="709.333" y1="302" x2="709.333" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="709.333" y="323" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.333" dy="0">80</tspan></text><line x1="810.667" y1="102" x2="810.667" y2="302" stroke="#d5dde1" stroke-width="1"/><line x1="810.667" y1="302" x2="810.667" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="810.667" y="323" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="810.667" dy="0">100</tspan></text><line x1="912" y1="102" x2="912" y2="302" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="302" x2="912" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="323" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">120</tspan></text><line x1="304" y1="302" x2="912" y2="302" stroke="#5b7280" stroke-width="1.6"/><text x="294" y="131.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">Búsqueda de socios y compradores</tspan></text><text x="294" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">Decisión de devolver el efectivo</tspan></text><text x="294" y="231.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">Servicio y plantilla</tspan></text><text x="294" y="281.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">Activos y litigios</tspan></text><line x1="410.4" y1="94" x2="410.4" y2="302" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="410.4" y="88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="410.4" dy="0">21 oct: anuncio</tspan></text><line x1="618.133" y1="94" x2="618.133" y2="302" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="618.133" y="88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="618.133" dy="0">1 dic: cierre</tspan></text><line x1="810.667" y1="94" x2="810.667" y2="302" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="810.667" y="88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="810.667" dy="0">8 ene: Roku</tspan></text><rect x="304" y="111" width="106.4" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="357.2" y="131.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357.2" dy="0">tres semanas</tspan></text><line x1="14" y1="152" x2="912" y2="152" stroke="#d5dde1" stroke-width="1"/><rect x="334.4" y="161" width="76" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="372.4" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372.4" dy="0">decisión</tspan></text><line x1="14" y1="202" x2="912" y2="202" stroke="#d5dde1" stroke-width="1"/><rect x="410.4" y="211" width="207.733" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="514.267" y="231.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="514.267" dy="0">desmontaje</tspan></text><line x1="14" y1="252" x2="912" y2="252" stroke="#d5dde1" stroke-width="1"/><rect x="618.133" y="261" width="192.533" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="714.4" y="281.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="714.4" dy="0">venta a Roku</tspan></text><text x="608" y="346" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="608" dy="0">días desde el 30 de septiembre de 2020</tspan></text><rect x="10" y="360" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El día 0 es tres semanas antes del anuncio, según Katzenberg. La fecha de la decisión es una aproximación a partir de «un</tspan></text><text x="470" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">par de semanas» que dijo Whitman. Roku compró más de 75 programas por menos de 100 millones; la disputa con Eko seguía</tspan></text><text x="470" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">abierta.</tspan></text><text x="470" y="465.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Deadline (21 oct 2020), The Verge (22 oct 2020 y 8 ene 2021) y Variety (1 dic 2020).</tspan></text></svg>
