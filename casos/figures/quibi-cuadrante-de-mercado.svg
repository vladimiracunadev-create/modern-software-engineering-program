<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 498" width="940" height="498" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuadrante de mercado: Quibi apostó por el único hueco donde el espectador tenía que pagar por lo corto</title><desc id="d">Cuadrante con dos ejes. Horizontal: contenido largo a la izquierda y corto a la derecha. Vertical: gratuito arriba y de pago abajo. Arriba a la derecha, vídeo corto gratuito como TikTok, YouTube e Instagram. Abajo a la izquierda, servicios de pago de formato largo como Netflix, Disney+, HBO Max y Peacock. Abajo a la derecha, Quibi con producciones premium. A la derecha, Go90 de Verizon, cerrado en 2018, de vídeo corto con anuncios.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="498" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuadrante de mercado: Quibi apostó por el único hueco donde el espectador tenía que pagar por lo corto</tspan></text><rect x="60" y="55" width="420" height="150" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="480" y="55" width="420" height="150" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="60" y="205" width="420" height="150" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="480" y="205" width="420" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="270" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="270" dy="0">Gratuito y largo</tspan></text><text x="690" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="690" dy="0">Gratuito y corto</tspan></text><text x="270" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="270" dy="0">De pago y largo</tspan></text><text x="690" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="690" dy="0">De pago y corto</tspan></text><rect x="80" y="97" width="380" height="88" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="270" y="136.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="270" dy="0">Televisión abierta y vídeo bajo demanda con</tspan></text><text x="270" y="152.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="270" dy="0">anuncios (fuera del caso)</tspan></text><rect x="500" y="97" width="190" height="88" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="595" y="136.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="595" dy="0">TikTok, YouTube,</tspan></text><text x="595" y="152.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="595" dy="0">Instagram y Snapchat</tspan></text><rect x="710" y="97" width="170" height="88" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="795" y="136.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">Go90 de Verizon:</tspan></text><text x="795" y="152.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">cerrado en 2018</tspan></text><rect x="80" y="247" width="380" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="270" y="286.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="270" dy="0">Netflix, Disney+, HBO Max y Peacock: catálogos</tspan></text><text x="270" y="302.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="270" dy="0">largos y marcas conocidas</tspan></text><rect x="500" y="247" width="380" height="88" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="690" y="286.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="690" dy="0">Quibi: episodios de diez minutos o menos,</tspan></text><text x="690" y="302.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="690" dy="0">producciones con talento, solo teléfono al inicio</tspan></text><text x="60" y="373" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="60" dy="0">contenido largo</tspan></text><text x="900" y="373" font-size="13" text-anchor="end" font-weight="400" fill="#5b7280"><tspan x="900" dy="0">contenido corto</tspan></text><rect x="10" y="391" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El cuadrante inferior derecho obliga a pagar por lo que el superior derecho ofrece sin costo. Go90 es el antecedente que</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Variety recordó en 2018. Mapa cualitativo, no una medición de cuota de mercado.</tspan></text><text x="470" y="480.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Variety (2018 y 2020), The Verge (2020) y NBC News (2020); esquema propio.</tspan></text></svg>
