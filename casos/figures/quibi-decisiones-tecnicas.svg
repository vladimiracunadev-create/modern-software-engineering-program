<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 610" width="940" height="610" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro decisiones técnicas documentadas: la restricción, la decisión y lo que la fuente dice que ocurrió</title><desc id="d">Cuatro filas de tres cajas unidas por flechas. Solo teléfono: se priorizaron otras tareas de ingeniería y las aplicaciones de televisor llegaron el 20 de octubre. Turnstyle: dos versiones de vídeo según la patente y una disputa con Eko. Capturas de pantalla: la gestión de derechos digitales bloqueaba las capturas y se desarrolló un método propio. Televisor: AirPlay y Chromecast en junio y aplicaciones nativas el 20 de octubre.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="610" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro decisiones técnicas documentadas: la restricción, la decisión y lo que la fuente dice que ocurrió</tspan></text><rect x="10" y="49" width="296" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="158" y="69.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="158" dy="0">Restricción que la motivó</tspan></text><rect x="326" y="49" width="296" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="474" y="69.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="474" dy="0">Decisión</tspan></text><rect x="642" y="49" width="296" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="790" y="69.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="790" dy="0">Lo que dice la fuente</tspan></text><rect x="10" y="97" width="296" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="158" y="132.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">Caso de uso en movimiento y</tspan></text><text x="158" y="148.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">prioridades de ingeniería</tspan></text><rect x="326" y="97" width="296" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="474" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="474" dy="0">Solo teléfono al inicio</tspan></text><rect x="642" y="97" width="288" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="786" y="124" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="786" dy="0">Aplicación nativa de televisor el 20</tspan></text><text x="786" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="786" dy="0">de octubre, un día antes del anuncio</tspan></text><text x="786" y="157.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="786" dy="0">del cierre</tspan></text><polyline points="306,137 326,137" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="622,137 642,137" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="197" width="296" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="158" y="232.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">Una experiencia propia al girar el</tspan></text><text x="158" y="248.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">teléfono</tspan></text><rect x="326" y="197" width="296" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="474" y="232.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="474" dy="0">Turnstyle: dos versiones de vídeo</tspan></text><text x="474" y="248.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="474" dy="0">según la patente</tspan></text><rect x="642" y="197" width="288" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="786" y="232.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="786" dy="0">Disputa con Eko: patente y secretos</tspan></text><text x="786" y="248.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="786" dy="0">industriales; Quibi lo niega</tspan></text><polyline points="306,237 326,237" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="622,237 642,237" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="297" width="296" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="158" y="332.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">Gestión de derechos digitales que</tspan></text><text x="158" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">bloquea capturas</tspan></text><rect x="326" y="297" width="296" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="474" y="332.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="474" dy="0">Método propio: pulsar, mantener y</tspan></text><text x="474" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="474" dy="0">deslizar</tspan></text><rect x="642" y="297" width="288" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="786" y="332.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="786" dy="0">Anunciado en julio de 2020 por el</tspan></text><text x="786" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="786" dy="0">director de producto</tspan></text><polyline points="306,337 326,337" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="622,337 642,337" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="397" width="296" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="158" y="440.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">El uso real era en casa</tspan></text><rect x="326" y="397" width="296" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="474" y="432.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="474" dy="0">AirPlay y Chromecast, y después</tspan></text><text x="474" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="474" dy="0">aplicaciones nativas</tspan></text><rect x="642" y="397" width="288" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="786" y="432.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="786" dy="0">Acceso por etapas; las fuentes</tspan></text><text x="786" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="786" dy="0">difieren en la fecha de la primera</tspan></text><polyline points="306,437 326,437" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="622,437 642,437" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="503" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="527.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dorado: consecuencia o dato de la fuente sin juicio; coral: costo o disputa señalados por la fuente. Whitman habló de</tspan></text><text x="470" y="544.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">AirPlay y Chromecast «a las pocas semanas»; Variety las sitúa en junio. No hay documentación técnica pública.</tspan></text><text x="470" y="592.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Deadline (21 oct 2020), The Verge (11 mar 2020), Engadget (24 jul 2020), Variety (1 dic 2020); esquema propio.</tspan></text></svg>
