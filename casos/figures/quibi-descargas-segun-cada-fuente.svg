<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Descargas acumuladas según cada fuente: la discrepancia crece con el tiempo</title><desc id="d">Dos líneas por días desde el lanzamiento. Sensor Tower: 0,3 millones el primer día, 2,6 el primer mes y 4,5 en julio. Quibi: 0,6 millones de usuarios nuevos la primera semana, 3,5 de descargas el primer mes y más de 5,6 en julio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Descargas acumuladas según cada fuente: la discrepancia crece con el tiempo</tspan></text><circle cx="22" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sensor Tower</tspan></text><rect x="154.48" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Quibi</tspan></text><line x1="63.54" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="387" x2="63.54" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="287" x2="63.54" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="187" x2="63.54" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="87" x2="63.54" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="87" x2="63.54" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="81.54" y1="87" x2="81.54" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="81.54" y1="387" x2="81.54" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="81.54" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81.54" dy="0">0</tspan></text><line x1="342.979" y1="87" x2="342.979" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="342.979" y1="387" x2="342.979" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="342.979" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342.979" dy="0">30</tspan></text><line x1="604.417" y1="87" x2="604.417" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="604.417" y1="387" x2="604.417" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="604.417" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.417" dy="0">60</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">93</tspan></text><line x1="63.54" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">millones</text><text x="486.77" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="486.77" dy="0">días desde el 6 de abril de 2020</tspan></text><polyline points="90.2546,372 342.979,257 892,162" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="90.2546" cy="372" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="90.2546" y="396" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="90.2546" dy="0">0,3</tspan></text><circle cx="342.979" cy="257" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="342.979" y="281" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="342.979" dy="0">2,6</tspan></text><circle cx="892" cy="162" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="186" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">4,5</tspan></text><polyline points="142.542,357 342.979,212 892,107" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="137.042" y="351.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="142.542" y="346" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="142.542" dy="0">0,6</tspan></text><rect x="337.479" y="206.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="342.979" y="201" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="342.979" dy="0">3,5</tspan></text><rect x="886.5" y="101.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">5,6</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los puntos son hitos informados por cada fuente, no una serie continua. El de la primera semana de Quibi son usuarios</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">nuevos y el de Sensor Tower, descargas del primer día; no son la misma medida. A los 93 días Quibi dice más de 5,6 millones</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y Sensor Tower estima 4,5.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: TechCrunch (7 abr 2020), Deadline (21 oct 2020), NBC News (22 oct 2020) y The Verge (8 jul 2020).</tspan></text></svg>
