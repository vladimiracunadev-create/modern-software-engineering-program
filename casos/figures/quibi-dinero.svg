<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El dinero de Quibi en cuatro cifras publicadas</title><desc id="d">Barras horizontales en millones de dólares. Capital recaudado, unos 1.750; gasto que la empresa esperaba haber acumulado hacia el tercer trimestre de 2020, unos 1.000; efectivo restante en el anuncio del cierre, unos 350; precio de los derechos que compró Roku, menos de 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El dinero de Quibi en cuatro cifras publicadas</tspan></text><line x1="324" y1="49" x2="324" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="225" x2="324" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="461.925" y1="49" x2="461.925" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="461.925" y1="225" x2="461.925" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="461.925" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.925" dy="0">500</tspan></text><line x1="599.85" y1="49" x2="599.85" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="599.85" y1="225" x2="599.85" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="599.85" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="599.85" dy="0">1 000</tspan></text><line x1="737.775" y1="49" x2="737.775" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="737.775" y1="225" x2="737.775" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="737.775" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737.775" dy="0">1 500</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="225" x2="875.7" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2 000</tspan></text><line x1="324" y1="225" x2="875.7" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Capital recaudado</tspan></text><text x="314" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Gasto esperado al tercer trimestre de</tspan></text><text x="314" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">2020</tspan></text><text x="314" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Efectivo restante al anunciar el cierre</tspan></text><text x="314" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Roku por los derechos (tope)</tspan></text><rect x="324" y="55" width="482.738" height="32" rx="3" fill="#102a43"/><text x="813.738" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="813.738" dy="0">1 750</tspan></text><rect x="324" y="99" width="275.85" height="32" rx="3" fill="#102a43"/><text x="606.85" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="606.85" dy="0">1 000</tspan></text><rect x="324" y="143" width="96.5475" height="32" rx="3" fill="#102a43"/><text x="427.548" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="427.548" dy="0">350</tspan></text><rect x="324" y="187" width="27.585" height="32" rx="3" fill="#102a43"/><text x="358.585" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="358.585" dy="0">100</tspan></text><text x="599.85" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">millones de dólares (aproximados)</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La última barra es un tope, no un precio: las fuentes dicen que Roku pagó menos de 100 millones. La cifra de gasto es una</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">expectativa informada por prensa en junio de 2020, no un resultado contable. El efectivo remanente se devolvió a</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">inversionistas.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: NBC News y Variety (2020), Deadline (21 oct 2020), The Verge (2021). Cifras aproximadas y redondeadas.</tspan></text></svg>
