<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 458" width="940" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El embudo con las cifras públicas: una estimación de terceros y una objeción sin cifra</title><desc id="d">A la izquierda, embudo de la cohorte inicial según Sensor Tower: unos 910.000 registros en los primeros días de abril de 2020 y unos 72.000 usuarios de pago tras los tres meses de prueba, cerca del 8 por ciento. A la derecha, la posición de Quibi: el número de suscriptores de pago de esa estimación es incorrecto en un orden de magnitud, sin publicar su propia cifra.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="458" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El embudo con las cifras públicas: una estimación de terceros y una objeción sin cifra</tspan></text><rect x="10" y="45" width="560" height="280" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Estimación de Sensor Tower (julio de 2020)</tspan></text><polygon points="40,95.0 540,95.0 440,175.0 140,175.0" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="290" y="141" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="290" dy="0">unos 910.000 registros en los primeros días</tspan></text><polygon points="140,195.0 440,195.0 380,275.0 200,275.0" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="290" y="241" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="290" dy="0">unos 72.000 de pago tras 90 días</tspan></text><text x="290" y="303" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="290" dy="0">conversión estimada: cerca del 8 %</tspan></text><rect x="590" y="45" width="340" height="280" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="604" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="604" dy="0">Posición de Quibi</tspan></text><rect x="606" y="89" width="308" height="88" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="760" y="128.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="760" dy="0">El número de suscriptores de pago es</tspan></text><text x="760" y="144.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="760" dy="0">incorrecto en un orden de magnitud</tspan></text><rect x="606" y="195" width="308" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="760" y="234.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="760" dy="0">Cifra propia de suscriptores de pago:</tspan></text><text x="760" y="250.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="760" dy="0">no publicada</tspan></text><polyline points="570,235 606,235" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="351" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="375.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las dos columnas no se pueden comparar: una tiene números y la otra, una objeción. Disney+ convirtió, según la misma</tspan></text><text x="470" y="392.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fuente, un 11 % de unos 9,5 millones de registros iniciales. La estimación cubre solo los primeros días de abril.</tspan></text><text x="470" y="440.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: The Verge (8 jul 2020), con datos de Sensor Tower; esquema propio.</tspan></text></svg>
