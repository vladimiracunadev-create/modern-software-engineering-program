<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 608" width="940" height="608" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lienzo del producto con datos públicos: tres supuestos sostenían los nueve bloques</title><desc id="d">Lienzo de modelo de negocio de nueve bloques resumido con datos públicos: segmentos, propuesta de valor, canales, relación, ingresos, recursos, actividades, costos y socios. Tres supuestos, uso en movimiento, solo teléfono y pago por contenido premium breve, aparecen marcados como los que el caso examina.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="608" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lienzo del producto con datos públicos: tres supuestos sostenían los nueve bloques</tspan></text><rect x="10" y="53" width="296" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="158" y="88.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">Segmentos: espectador en movimiento,</tspan></text><text x="158" y="104.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">anunciantes, creadores</tspan></text><rect x="322" y="53" width="296" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="88.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Propuesta: episodios de diez minutos</tspan></text><text x="470" y="104.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">o menos con talento reconocido</tspan></text><rect x="634" y="53" width="296" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782" y="88.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="782" dy="0">Canales: tiendas de aplicaciones;</tspan></text><text x="782" y="104.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="782" dy="0">luego AirPlay, Chromecast y televisor</tspan></text><rect x="10" y="149" width="296" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="158" y="184.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">Relación: suscripción de dos planes y</tspan></text><text x="158" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">publicidad</tspan></text><rect x="322" y="149" width="296" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="184.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Ingresos: 4,99 con anuncios; 7,99 sin</tspan></text><text x="470" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">ellos; publicidad</tspan></text><rect x="634" y="149" width="296" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="184.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Socios: estudios inversores, operador</tspan></text><text x="782" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">móvil y anunciantes</tspan></text><rect x="10" y="245" width="296" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="158" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">Recursos: producciones, talento y la</tspan></text><text x="158" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">función Turnstyle</tspan></text><rect x="322" y="245" width="296" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Actividades: producción, marketing y</tspan></text><text x="470" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">desarrollo de la aplicación</tspan></text><rect x="634" y="245" width="296" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Costos: contenido (hasta 6 millones</tspan></text><text x="782" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">por hora) y marketing</tspan></text><rect x="10" y="355" width="920" height="120" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="377" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Los tres supuestos que sostenían el modelo (el caso los examina)</tspan></text><rect x="26" y="389" width="280" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="166" y="417.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="166" dy="0">1 El uso en movimiento es frecuente</tspan></text><text x="166" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="166" dy="0">y valioso</tspan></text><rect x="326" y="389" width="280" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="466" y="425.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="466" dy="0">2 Basta el teléfono, sin televisor</tspan></text><rect x="626" y="389" width="280" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="766" y="417.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="766" dy="0">3 Se paga por contenido premium</tspan></text><text x="766" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="766" dy="0">breve frente a lo gratuito</tspan></text><rect x="10" y="501" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="525.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Reconstrucción de este programa a partir de la prensa: Quibi no publicó su lienzo y no se infieren cifras internas. Las</tspan></text><text x="470" y="542.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tres cajas coral eran verificables con experimentos baratos antes de comprometer el gasto.</tspan></text><text x="470" y="590.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Variety, TechCrunch, Deadline y The Verge (2018 a 2021); esquema propio.</tspan></text></svg>
