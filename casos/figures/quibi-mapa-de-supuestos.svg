<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 498" width="940" height="498" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mapa de supuestos: los más importantes eran los que menos evidencia tenían antes de lanzar</title><desc id="d">Cuadrante con dos ejes: importancia para el negocio, de abajo hacia arriba, y evidencia disponible antes del lanzamiento, de izquierda a derecha. Uso en movimiento y disposición a pagar por contenido corto premium están arriba a la izquierda. Que bastara el teléfono está en el centro con evidencia contraria posterior. El inventario publicitario vendido está a la derecha como evidencia a favor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="498" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mapa de supuestos: los más importantes eran los que menos evidencia tenían antes de lanzar</tspan></text><rect x="70" y="55" width="420" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="490" y="55" width="420" height="150" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="70" y="205" width="420" height="150" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="490" y="205" width="420" height="150" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="280" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="280" dy="0">Probar primero: muy importante y poca evidencia</tspan></text><text x="700" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="700" dy="0">Seguir con vigilancia</tspan></text><text x="280" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="280" dy="0">Probar si es barato</tspan></text><text x="700" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="700" dy="0">Dar por buenos</tspan></text><rect x="100" y="101" width="180" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="190" y="136.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="190" dy="0">Uso en movimiento</tspan></text><text x="190" y="152.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="190" dy="0">frecuente y valioso</tspan></text><rect x="296" y="101" width="180" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="386" y="128" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="386" dy="0">Se paga por lo corto</tspan></text><text x="386" y="144.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="386" dy="0">premium frente a lo</tspan></text><text x="386" y="161.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="386" dy="0">gratuito</tspan></text><rect x="506" y="101" width="190" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="601" y="128" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="601" dy="0">Basta el teléfono, sin</tspan></text><text x="601" y="144.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="601" dy="0">televisor: evidencia</tspan></text><text x="601" y="161.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="601" dy="0">contraria posterior</tspan></text><rect x="726" y="101" width="170" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="811" y="128" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="811" dy="0">Calidad de los</tspan></text><text x="811" y="144.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="811" dy="0">títulos: valoración</tspan></text><text x="811" y="161.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="811" dy="0">disputada</tspan></text><rect x="726" y="251" width="170" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="811" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="811" dy="0">Interés de</tspan></text><text x="811" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="811" dy="0">anunciantes: 150</tspan></text><text x="811" y="311.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="811" dy="0">millones vendidos</tspan></text><rect x="100" y="251" width="380" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="290" y="286.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="290" dy="0">Que una función propia (Turnstyle) diferencie al</tspan></text><text x="290" y="302.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="290" dy="0">producto</tspan></text><text x="70" y="375" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="70" dy="0">poca evidencia</tspan></text><text x="910" y="375" font-size="13" text-anchor="end" font-weight="400" fill="#5b7280"><tspan x="910" dy="0">mucha evidencia</tspan></text><rect x="10" y="391" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ubicación según valoración de este programa a partir de lo público; Quibi pudo tener estudios internos que moverían puntos.</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El eje vertical es la importancia para que el negocio funcione, de menos abajo a más arriba.</tspan></text><text x="470" y="480.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Variety, TechCrunch, Deadline y NBC News (2018 a 2020); esquema propio.</tspan></text></svg>
