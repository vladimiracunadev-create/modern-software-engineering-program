<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La apuesta de Quibi y el mundo en que llegó</title><desc id="d">Dos columnas. A la izquierda, la premisa: la gente en movimiento, entre las siete de la mañana y las siete de la noche, quiere episodios de diez minutos o menos de calidad de cine en el teléfono, por suscripción. A la derecha, abril de 2020: confinamiento, personas en casa con televisor y varios servicios nuevos de streaming compitiendo, además de aplicaciones de video corto gratuitas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La apuesta de Quibi y el mundo en que llegó</tspan></text><rect x="10" y="51" width="440" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="230" y="74.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="230" dy="0">Premisa (2018-2019)</tspan></text><rect x="490" y="51" width="440" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="710" y="74.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="710" dy="0">Abril de 2020</tspan></text><rect x="10" y="107" width="440" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230" y="132.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">Uso previsto: en movimiento, de 7 de la mañana a 7 de la</tspan></text><text x="230" y="148.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">noche</tspan></text><rect x="490" y="107" width="440" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="710" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="710" dy="0">Confinamiento: la audiencia en movimiento estaba en casa</tspan></text><polyline points="450,137 490,137" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="183" width="440" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">Episodios de 10 minutos o menos, con talento reconocido</tspan></text><rect x="490" y="183" width="440" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="710" y="208.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="710" dy="0">El televisor, a un paso y con otros servicios nuevos que</tspan></text><text x="710" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="710" dy="0">competían</tspan></text><polyline points="450,213 490,213" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="259" width="440" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230" y="284.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">Solo teléfono: sin aplicaciones para televisor en el</tspan></text><text x="230" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">lanzamiento</tspan></text><rect x="490" y="259" width="440" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="710" y="284.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="710" dy="0">Disney+, HBO Max y Peacock con catálogos que ya tenían</tspan></text><text x="710" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="710" dy="0">público</tspan></text><polyline points="450,289 490,289" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="335" width="440" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230" y="360.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">Suscripción: 4,99 USD con anuncios o 7,99 USD sin</tspan></text><text x="230" y="376.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">anuncios</tspan></text><rect x="490" y="335" width="440" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="710" y="368.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="710" dy="0">TikTok, Instagram y YouTube ofrecen video corto sin pagar</tspan></text><polyline points="450,365 490,365" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: la premisa según Whitman y Katzenberg y el contexto de abril de 2020 según la prensa citada. Lo que la prensa</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y los propios directivos no pueden afirmar es cuánto de la distancia entre premisa y realidad se debió a la pandemia:</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Katzenberg reconoció que atribuirlo todo a la pandemia no era justo.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: prensa especializada citada en el caso; esquema propio.</tspan></text></svg>
