<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 546" width="940" height="546" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete puertas de decisión: qué se sabe públicamente de cada una</title><desc id="d">Siete puertas en dos filas. Investigación de la hipótesis y prototipo o prueba pequeña: se desconoce. Lanzamiento escalonado: considerado y descartado por los responsables. Medición de conversión antes de comprometer capital: la prueba de 90 días retrasó el dato hasta julio. Criterios de abandono escritos: se desconocen. Capital por tramos: no, capital grande desde 2018. Preventa de publicidad: 150 millones vendidos antes del lanzamiento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="546" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Siete puertas de decisión: qué se sabe públicamente de cada una</tspan></text><rect x="10" y="53" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="86.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">1 Investigación de la</tspan></text><text x="122" y="102.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">hipótesis</tspan></text><rect x="10" y="133" width="224" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="122" y="173.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="122" dy="0">No se sabe: no hay</tspan></text><text x="122" y="189.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="122" dy="0">documentos públicos</tspan></text><rect x="246" y="53" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="358" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358" dy="0">2 Prototipo o prueba pequeña</tspan></text><rect x="246" y="133" width="224" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="358" y="173.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="358" dy="0">No se sabe: no hay</tspan></text><text x="358" y="189.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="358" dy="0">documentos públicos</tspan></text><rect x="482" y="53" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="594" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="594" dy="0">3 Lanzamiento escalonado</tspan></text><rect x="482" y="133" width="224" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="594" y="165" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="594" dy="0">Considerado y descartado,</tspan></text><text x="594" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="594" dy="0">según Whitman, para crear</tspan></text><text x="594" y="198.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="594" dy="0">una categoría</tspan></text><rect x="718" y="53" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="86.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="830" dy="0">4 Medir conversión antes de</tspan></text><text x="830" y="102.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="830" dy="0">comprometer capital</tspan></text><rect x="718" y="133" width="224" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="173.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">La prueba de 90 días llevó</tspan></text><text x="830" y="189.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">el dato a julio</tspan></text><rect x="10" y="243" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="276.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">5 Criterios de abandono</tspan></text><text x="122" y="292.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">escritos</tspan></text><rect x="10" y="323" width="224" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="122" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="122" dy="0">No se sabe; la salida se</tspan></text><text x="122" y="371.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="122" dy="0">decidió con los datos del</tspan></text><text x="122" y="388.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="122" dy="0">verano</tspan></text><rect x="246" y="243" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="358" y="284.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358" dy="0">6 Capital por tramos</tspan></text><rect x="246" y="323" width="224" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="358" y="363.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="358" dy="0">Capital grande desde 2018:</tspan></text><text x="358" y="379.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="358" dy="0">1.000 millones anunciados</tspan></text><rect x="482" y="243" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="594" y="284.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="594" dy="0">7 Preventa de publicidad</tspan></text><rect x="482" y="323" width="224" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="594" y="363.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="594" dy="0">Unos 150 millones vendidos</tspan></text><text x="594" y="379.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="594" dy="0">antes del lanzamiento</tspan></text><rect x="10" y="439" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Teal: hay evidencia pública de que existió. Coral: hay evidencia pública de que no existió o se decidió no hacerlo. Gris:</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no se sabe. Que una puerta no sea pública no significa que faltara.</tspan></text><text x="470" y="528.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Deadline (21 oct 2020), TechCrunch (2019), The Verge (8 jul 2020); esquema propio.</tspan></text></svg>
