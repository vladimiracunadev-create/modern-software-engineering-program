<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 398" width="940" height="398" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El dato que decidía el negocio llegó cuando ya había pasado más de un tercio de la vida del servicio</title><desc id="d">Línea de tiempo en días desde el 6 de abril de 2020. La cohorte de lanzamiento tiene una prueba gratuita de 90 días hasta el 5 de julio, día 90. Las altas de mayo y junio tienen pruebas de 14 días. El primer cobro posible es el día 90 y el cierre del servicio el día 239.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="398" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El dato que decidía el negocio llegó cuando ya había pasado más de un tercio de la vida del servicio</tspan></text><line x1="254" y1="83" x2="254" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="233" x2="254" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="385.6" y1="83" x2="385.6" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="385.6" y1="233" x2="385.6" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="385.6" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="385.6" dy="0">50</tspan></text><line x1="517.2" y1="83" x2="517.2" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="517.2" y1="233" x2="517.2" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="517.2" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517.2" dy="0">100</tspan></text><line x1="648.8" y1="83" x2="648.8" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="648.8" y1="233" x2="648.8" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="648.8" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.8" dy="0">150</tspan></text><line x1="780.4" y1="83" x2="780.4" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="780.4" y1="233" x2="780.4" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="780.4" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780.4" dy="0">200</tspan></text><line x1="912" y1="83" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="233" x2="912" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">250</tspan></text><line x1="254" y1="233" x2="912" y2="233" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Cohorte de lanzamiento</tspan></text><text x="244" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Altas de mayo y junio</tspan></text><text x="244" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Servicio abierto</tspan></text><line x1="490.88" y1="75" x2="490.88" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="490.88" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="490.88" dy="0">5 jul: cobro</tspan></text><line x1="883.048" y1="75" x2="883.048" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="883.048" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="883.048" dy="0">1 dic</tspan></text><rect x="254" y="92" width="236.88" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="372.44" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372.44" dy="0">prueba gratuita de 90 días</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="319.8" y="142" width="157.92" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="398.76" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="398.76" dy="0">pruebas de 14 días</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="254" y="192" width="629.048" height="32" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="568.524" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="568.524" dy="0">de abril a diciembre</tspan></text><text x="583" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="583" dy="0">días desde el 6 de abril de 2020</tspan></text><rect x="10" y="291" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El primer cobro de la cohorte de lanzamiento es cálculo propio (90 días después del 6 de abril). Las pruebas de 14 días se</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">introdujeron en mayo y junio según la propia empresa; no se sabe cuántos usuarios convirtieron o cancelaron antes.</tspan></text><text x="470" y="380.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: TechCrunch (7 abr 2020), Deadline (21 oct 2020) y The Verge (8 jul y 22 oct 2020).</tspan></text></svg>
