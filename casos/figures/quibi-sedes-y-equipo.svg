<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 541" width="940" height="541" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sede y entorno: una empresa de unas 200 personas que orquestaba a estudios, tiendas y socios</title><desc id="d">Esquema de relaciones con Quibi en Los Ángeles en el centro. Arriba: estudios y bancos inversores, creadores y estudios que producían series, un operador móvil socio y anunciantes. Abajo: tiendas de aplicaciones, fabricantes de dispositivos de televisor y Roku como comprador de los derechos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="541" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sede y entorno: una empresa de unas 200 personas que orquestaba a estudios, tiendas y socios</tspan></text><rect x="24" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="131" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">Estudios y bancos</tspan></text><text x="131" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">inversores</tspan></text><rect x="250" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">Creadores y estudios:</tspan></text><text x="357" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">producen las series</tspan></text><rect x="476" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="583" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">Operador móvil socio</tspan></text><rect x="702" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="809" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">Anunciantes: inventario</tspan></text><text x="809" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">del primer año vendido</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="221.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Quibi: Los Ángeles, unas 200 personas al</tspan></text><text x="470" y="239.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">cierre</tspan></text><polyline points="131,125 334.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="357,125 424.8,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="583,125 515.2,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="809,125 605.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="137" y="345" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="244" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244" dy="0">Tiendas de aplicaciones</tspan></text><rect x="363" y="345" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Dispositivos de televisor:</tspan></text><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">AirPlay, Chromecast y apps</tspan></text><rect x="589" y="345" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="696" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="696" dy="0">Roku: compra los derechos</tspan></text><text x="696" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="696" dy="0">en 2021</tspan></text><polyline points="379.6,259 244,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,259 470,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="560.4,259 696,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="439" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="469.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">No es un organigrama ni un mapa. Estructura interna, oficinas fuera de Los Ángeles y plantilla de 2018 y 2019: no se sabe.</tspan></text><text x="470" y="523" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: prensa especializada citada en el caso (2018 a 2021); esquema propio.</tspan></text></svg>
