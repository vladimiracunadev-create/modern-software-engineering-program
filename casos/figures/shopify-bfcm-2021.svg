<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 562" width="940" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Viernes Negro y Cyber Monday de 2021: lo que Shopify midió</title><desc id="d">Esquema de cifras: más de 32 millones de peticiones por minuto en los servidores de aplicación y más de 34 millones en los balanceadores; 145 millones de correos; 42 mil millones de llamadas de API y 13 mil millones de webhooks; más de 11 millones de consultas por segundo en MySQL; una venta relámpago consumió más del 20 por ciento de la capacidad total.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="562" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Viernes Negro y Cyber Monday de 2021: lo que Shopify midió</tspan></text><rect x="137" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="244" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244" dy="0">Servidores de aplicación:</tspan></text><text x="244" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244" dy="0">más de 32 M de peticiones</tspan></text><text x="244" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244" dy="0">por minuto</tspan></text><rect x="363" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Balanceadores: más de 34 M</tspan></text><text x="470" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">de peticiones por minuto</tspan></text><rect x="589" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="696" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="696" dy="0">MySQL: más de 11 M de</tspan></text><text x="696" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="696" dy="0">consultas por segundo</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="230.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">BFCM 2021: pico de cuatro días</tspan></text><polyline points="244,125 379.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="244" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">pico</tspan></text><polyline points="470,125 470,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">pico</tspan></text><polyline points="696,125 560.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="696" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">flota</tspan></text><rect x="137" y="345" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="244" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="244" dy="0">API: 42 mil M de llamadas</tspan></text><text x="244" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="244" dy="0">y 13 mil M de webhooks</tspan></text><rect x="363" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Correos: casi 145 M</tspan></text><rect x="589" y="345" width="214" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="696" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="696" dy="0">Una venta relámpago usó</tspan></text><text x="696" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="696" dy="0">más del 20 % de la</tspan></text><text x="696" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="696" dy="0">capacidad</tspan></text><polyline points="379.6,259 244,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="244" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">en 4 días</tspan></text><polyline points="470,259 470,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">enviados</tspan></text><polyline points="560.4,259 696,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="696" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">caso límite</tspan></text><rect x="10" y="439" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el post del CTO de enero de 2022. Cálculo propio: 32 millones de peticiones por minuto son unas 533 000 por</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">segundo. Dónde deja de valer: son cifras de un fin de semana de 2021; el récord de 2025 de 5,1 millones de dólares de</tspan></text><text x="470" y="497.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ventas por minuto se cita en otro post.</tspan></text><text x="470" y="544.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de ingeniería de Shopify (shopify.engineering), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
