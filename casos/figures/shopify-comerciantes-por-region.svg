<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde están los comerciantes de Shopify (31 de diciembre de 2025)</title><desc id="d">Barras horizontales: 44 por ciento en Estados Unidos, 31 por ciento en Europa, Oriente Medio y África, 16 por ciento en Asia Pacífico, Australia y China, 5 por ciento en Canadá y 5 por ciento en América Latina.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dónde están los comerciantes de Shopify (31 de diciembre de 2025)</tspan></text><line x1="273.28" y1="49" x2="273.28" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="273.28" y1="239" x2="273.28" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="273.28" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="273.28" dy="0">0</tspan></text><line x1="398.6" y1="49" x2="398.6" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="398.6" y1="239" x2="398.6" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="398.6" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="398.6" dy="0">10</tspan></text><line x1="523.92" y1="49" x2="523.92" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="523.92" y1="239" x2="523.92" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="523.92" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="523.92" dy="0">20</tspan></text><line x1="649.24" y1="49" x2="649.24" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="649.24" y1="239" x2="649.24" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="649.24" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="649.24" dy="0">30</tspan></text><line x1="774.56" y1="49" x2="774.56" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="774.56" y1="239" x2="774.56" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="774.56" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="774.56" dy="0">40</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="239" x2="899.88" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">50</tspan></text><line x1="273.28" y1="239" x2="899.88" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="263.28" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="263.28" dy="0">Estados Unidos</tspan></text><text x="263.28" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="263.28" dy="0">Europa, Oriente Medio y África</tspan></text><text x="263.28" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="263.28" dy="0">Asia Pacífico, Australia y China</tspan></text><text x="263.28" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="263.28" dy="0">Canadá</tspan></text><text x="263.28" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="263.28" dy="0">América Latina</tspan></text><rect x="273.28" y="55" width="551.408" height="26" rx="3" fill="#087f8c"/><text x="831.688" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="831.688" dy="0">44</tspan></text><rect x="273.28" y="93" width="388.492" height="26" rx="3" fill="#087f8c"/><text x="668.772" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="668.772" dy="0">31</tspan></text><rect x="273.28" y="131" width="200.512" height="26" rx="3" fill="#087f8c"/><text x="480.792" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="480.792" dy="0">16</tspan></text><rect x="273.28" y="169" width="62.66" height="26" rx="3" fill="#087f8c"/><text x="342.94" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="342.94" dy="0">5</tspan></text><rect x="273.28" y="207" width="62.66" height="26" rx="3" fill="#087f8c"/><text x="342.94" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="342.94" dy="0">5</tspan></text><text x="586.58" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="586.58" dy="0">% de comerciantes</tspan></text><rect x="10" y="297" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El 10-K habla de «millones de comerciantes» en más de 175 países y no da el número exacto. Dónde deja de valer: es el</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reparto de comerciantes, no de ventas; las regiones con más comerciantes no son necesariamente las de más GMV.</tspan></text><text x="470" y="386.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Shopify Inc. del año terminado el 31 de diciembre de 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
