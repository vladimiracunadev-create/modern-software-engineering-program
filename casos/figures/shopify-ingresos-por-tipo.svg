<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 516" width="940" height="516" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ingresos de Shopify por tipo, 2023 a 2025</title><desc id="d">Barras apiladas en millones de dólares: soluciones de suscripción 1 837, 2 350 y 2 752 millones, y soluciones para comerciantes 5 223, 6 530 y 8 804 millones; el total pasa de 7 060 a 8 880 y a 11 556 millones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="516" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ingresos de Shopify por tipo, 2023 a 2025</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Soluciones de suscripción</tspan></text><rect x="252.5" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Soluciones para comerciantes</tspan></text><line x1="101.24" y1="357" x2="920" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="357" x2="101.24" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="361.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="305" x2="101.24" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="309.5" font-size="13"