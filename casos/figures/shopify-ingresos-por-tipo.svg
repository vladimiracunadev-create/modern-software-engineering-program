7" dy="0">5 223</tspan></text><text x="237.7" y="203.152" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237.7" dy="0">7 060</tspan></text><text x="237.7" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">2023</tspan></text><rect x="434.202" y="308.12" width="152.835" height="48.88" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="510.62" y="337.06" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="510.62" dy="0">2350</tspan></text><rect x="434.202" y="172.296" width="152.835" height="135.824" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="510.62" y="244.708" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="510.62" dy="0">6 530</tspan></text><text x="510.62" y="165.296" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="510.62" dy="0">8 880</tspan></text><text x="510.62" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">2024</tspan></text><rect x="707.122" y="299.758" width="152.835" height="57.2416" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="783.54" y="332.879" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="783.54" dy="0">2752</tspan></text><rect x="707.122" y="116.635" width="152.835" height="183.123" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="783.54" y="212.697" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="783.54" dy="0">8 804</tspan></text><text x="783.54" y="109.635" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="783.54" dy="0">11 556</tspan></text><text x="783.54" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">2025</tspan></text><rect x="10" y="409" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las soluciones para comerciantes (sobre todo comisiones de pago) pesan 76 % del ingreso de 2025 frente a 74 % en 2023.</tspan></text><text x="470" y="450.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde deja de valer: el ingreso de pagos arrastra un coste de ingresos alto (ver el reparto del ingreso).</tspan></text><text x="470" y="498.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Shopify Inc. del año terminado el 31 de diciembre de 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
