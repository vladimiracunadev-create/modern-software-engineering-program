ht="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="707.666" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707.666" dy="0">Pods y monolito modular</tspan></text><line x1="14" y1="175" x2="912" y2="175" stroke="#d5dde1" stroke-width="1"/><rect x="605.499" y="184" width="34.0557" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="738.316" y="184" width="3.40557" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="874.539" y="184" width="3.40557" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="520.36" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="520.36" dy="0">año</tspan></text><rect x="10" y="279" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hechos con fuente: constitución el 28 de septiembre de 2004 e IPO el 27 de mayo de 2015 (10-K); fragmentación y pods (posts</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 2018); BFCM 2021 (post de 2022); GMV 2025 (10-K). Dónde deja de valer: los marcadores rojos de la última línea son hitos</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de escala, no un periodo.</tspan></text><text x="470" y="384.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: 10-K de 2025 y blog de ingeniería de Shopify.</tspan></text></svg>
