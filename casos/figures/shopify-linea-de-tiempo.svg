<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 402" width="940" height="402" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Shopify de 2004 a 2026: empresa, arquitectura y escala</title><desc id="d">Línea de tiempo con tres carriles: empresa (constitución en 2004, oferta pública en 2015), arquitectura (fragmentación hacia 2014-2015, pods desde 2016, monolito modular 2017-2020) y escala (600 mil comerciantes y 80 mil peticiones por segundo en 2018, GMV de 378 mil millones en 2025).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="402" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Shopify de 2004 a 2026: empresa, arquitectura y escala</tspan></text><line x1="128.72" y1="83" x2="128.72" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="128.72" y1="221" x2="128.72" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="128.72" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="128.72" dy="0">2004</tspan></text><line x1="264.943" y1="83" x2="264.943" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="264.943" y1="221" x2="264.943" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="264.943" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="264.943" dy="0">2008</tspan></text><line x1="401.165" y1="83" x2="401.165" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="401.165" y1="221" x2="401.165" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="401.165" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="401.165" dy="0">2012</tspan></text><line x1="537.388" y1="83" x2="537.388" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="537.388" y1="221" x2="537.388" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="537.388" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537.388" dy="0">2016</tspan></text><line x1="673.61" y1="83" x2="673.61" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="673.61" y1="221" x2="673.61" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="673.61" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="673.61" dy="0">2020</tspan></text><line x1="809.833" y1="83" x2="809.833" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="809.833" y1="221" x2="809.833" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="809.833" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809.833" dy="0">2024</tspan></text><line x1="912" y1="83" x2="912" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="221" x2="912" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2027</tspan></text><line x1="128.72" y1="221" x2="912" y2="221" stroke="#5b7280" stroke-width="1.6"/><text x="118.72" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="118.72" dy="0">Empresa</tspan></text><text x="118.72" y="156.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="118.72" dy="0">Arquitectura</tspan></text><text x="118.72" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="118.72" dy="0">Escala</tspan></text><line x1="152.559" y1="75" x2="152.559" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="152.559" y="69" font-size="13" text-anchor="middle" font-weight="700" fill=