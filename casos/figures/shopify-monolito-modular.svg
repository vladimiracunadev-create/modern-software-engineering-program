<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 221" width="960" height="221" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Monolito modular: componentes con dueño y contratos</title><desc id="d">Cuatro cajas: un monolito de más de 2,8 millones de líneas de Ruby y 500 000 confirmaciones; un equipo investiga hacer componentes con contratos; los componentes tienen dueño y excepciones asignadas; el aprendizaje principal es que el cambio es un problema de personas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="221" fill="#ffffff"/><rect x="10" y="14" width="202" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="111" y="43" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">Monolito de Rails: más</tspan></text><text x="111" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">de 2,8 millones de</tspan></text><text x="111" y="76.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">líneas y 500 000 commits</tspan></text><rect x="256" y="14" width="202" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357" y="34.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Meta: que cada</tspan></text><text x="357" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">desarrollador sienta que</tspan></text><text x="357" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">trabaja en una app</tspan></text><text x="357" y="84.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">pequeña</tspan></text><polyline points="212,56 256,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603" y="43" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Componentes con dueño,</tspan></text><text x="603" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">contratos y excepciones</tspan></text><text x="603" y="76.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">triadas por componente</tspan></text><polyline points="458,56 502,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="849" y="43" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">Aprendizaje: el cambio</tspan></text><text x="849" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">de arquitectura es un</tspan></text><text x="849" y="76.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">problema de personas</tspan></text><polyline points="704,56 748,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="112" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="136.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Documentado en «Under Deconstruction: The State of Shopify&#x27;s Monolith» (septiembre de 2020). El post dice que los detalles</tspan></text><text x="480" y="153.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">cambiaron casi todos pero se mantienen las ideas originales. Dónde deja de valer: es el estado de 2020; el CTO describe en</tspan></text><text x="480" y="170.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">2022 un patrón de arquitectura distinto para partes del monolito.</tspan></text><text x="480" y="211.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Fuente: blog de ingeniería de Shopify (shopify.engineering), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
