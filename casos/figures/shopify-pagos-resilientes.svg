<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 452" width="940" height="452" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Principios de pagos resilientes que el equipo de Shopify publicó</title><desc id="d">Cuatro columnas con diez consejos agrupados: límites de espera, protección contra fallos, exactamente una vez y operación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="452" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Principios de pagos resilientes que el equipo de Shopify publicó</tspan></text><rect x="10" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="120.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120.5" dy="0">Esperar poco</tspan></text><rect x="10" y="111" width="221" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="120.5" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120.5" dy="0">Timeouts bajos: un segundo</tspan></text><text x="120.5" y="162.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120.5" dy="0">para abrir y cinco para</tspan></text><text x="120.5" y="179.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120.5" dy="0">leer como punto de partida</tspan></text><rect x="10" y="217" width="221" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="120.5" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120.5" dy="0">Monitorear para ajustar los</tspan></text><text x="120.5" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120.5" dy="0">valores</tspan></text><rect x="243" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="353.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="353.5" dy="0">Contener fallos</tspan></text><rect x="243" y="111" width="221" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="154.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Circuit breakers: dejar de</tspan></text><text x="353.5" y="170.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">llamar a quien falla</tspan></text><rect x="243" y="217" width="221" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="268.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Entender capacidad y colas</tspan></text><rect x="476" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="586.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="586.5" dy="0">Una sola vez</tspan></text><rect x="476" y="111" width="221" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="586.5" y="154.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="586.5" dy="0">Claves de idempotencia en</tspan></text><text x="586.5" y="170.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="586.5" dy="0">pagos y reembolsos</tspan></text><rect x="476" y="217" width="221" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="586.5" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="586.5" dy="0">Un id de correlación para</tspan></text><text x="586.5" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="586.5" dy="0">encontrar todos los logs</tspan></text><rect x="709" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="819.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="819.5" dy="0">Operar</tspan></text><rect x="709" y="111" width="221" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="819.5" y="154.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="819.5" dy="0">Ser consistente en la forma</tspan></text><text x="819.5" y="170.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="819.5" dy="0">de hacer las cosas</tspan></text><rect x="709" y="217" width="221" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="819.5" y="252" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="819.5" dy="0">Practicar la respuesta a</tspan></text><text x="819.5" y="268.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="819.5" dy="0">incidentes y organizar el</tspan></text><text x="819.5" y="285.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="819.5" dy="0">equipo</tspan></text><rect x="10" y="329" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="353.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en «10 Tips for Building Resilient Payment Systems» (julio de 2022): los títulos de los diez consejos son</tspan></text><text x="470" y="370.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">timeouts, circuit breakers, capacidad, monitoreo, ejecución, idempotencia, consistencia, incorporación, respuesta y</tspan></text><text x="470" y="387.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">organización. Dónde deja de valer: son recomendaciones de un autor, no una política oficial.</tspan></text><text x="470" y="434.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de ingeniería de Shopify (shopify.engineering), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
