<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reservas de inventario: de Redis a MySQL con una fila por unidad</title><desc id="d">Dos filas: con Redis una clave de cantidad por artículo se descontaba y reponía; las reservas y el libro de inventario vivían en dos sistemas; con MySQL se reserva una fila por unidad con SKIP LOCKED y claves compuestas, dentro de la misma base transaccional.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="345" fill="#ffffff"/><rect x="10" y="14" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152" dy="0">Antes: una clave de cantidad por</tspan></text><text x="152" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152" dy="0">artículo en Redis</tspan></text><rect x="338" y="14" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">DECR al reservar, INCR al liberar</tspan></text><polyline points="294,56 338,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="808" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">Dos sistemas: reservas y libro de</tspan></text><text x="808" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">inventario</tspan></text><polyline points="622,56 666,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Después: una fila por unidad en</tspan></text><text x="152" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">MySQL 8</tspan></text><rect x="338" y="138" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">SKIP LOCKED evita esperar por filas</tspan></text><text x="480" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">bloqueadas</tspan></text><polyline points="294,180 338,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="138" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">Garantías ACID entre reservas y</tspan></text><text x="808" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">libro</tspan></text><polyline points="622,180 666,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,98 808,118 152,118 152,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Documentado en «We replaced Redis with MySQL for inventory reservations» (mayo de 2026): un solo registro con una columna de</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">cantidad no soportaba la contención. Dónde deja de valer: el propio post dice que el cuello de botella real no era el que</tspan></text><text x="480" y="294.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">medían; las cifras de rendimiento no se reproducen aquí.</tspan></text><text x="480" y="335.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Fuente: blog de ingeniería de Shopify (shopify.engineering), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
