<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 529" width="940" height="529" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la URL de una tienda al pod que la sirve</title><desc id="d">Secuencia de una petición: el balanceador con Sorting Hat consulta la tabla de rutas, añade una cabecera con el pod, la aplicación usa esa cabecera para hablar solo con los almacenes de ese pod y devuelve la respuesta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="529" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la URL de una tienda al pod que la sirve</tspan></text><rect x="47.5" y="58" width="170" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132.5" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132.5" dy="0">Comprador</tspan></text><rect x="272.5" y="58" width="170" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357.5" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357.5" dy="0">Balanceador +</tspan></text><text x="357.5" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357.5" dy="0">Sorting Hat</tspan></text><rect x="497.5" y="58" width="170" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582.5" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582.5" dy="0">Servidor de</tspan></text><text x="582.5" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582.5" dy="0">aplicación</tspan></text><rect x="722.5" y="58" width="170" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807.5" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807.5" dy="0">Almacenes del pod</tspan></text><line x1="132.5" y1="104" x2="132.5" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="357.5" y1="104" x2="357.5" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="582.5" y1="104" x2="582.5" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="807.5" y1="104" x2="807.5" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="135.5,138 354.5,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="130" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="245" dy="0">1. pide coolcucumbers.com</tspan></text><polyline points="357.5,178 403.5,178 403.5,192 361.5,192" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="411.5" y="188" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="411.5" dy="0">2. busca la tienda en la tabla de rutas</tspan></text><polyline points="360.5,230 579.5,230" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">3. reenvía con la cabecera del pod 42</tspan></text><polyline points="585.5,276 804.5,276" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="695" y="252" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="695" dy="0">4. consulta solo MySQL, Redis y</tspan><tspan x="695" dy="16.64">Memcached del pod 42</tspan></text><polyline points="804.5,322 585.5,322" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="695" y="314" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="695" dy="0">5. devuelve los datos de la tienda</tspan></text><polyline points="579.5,368 135.5,368" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="357.5" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="357.5" dy="0">6. respuesta HTML o JSON</tspan></text><rect x="10" y="420" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="444.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el post de pods (2018) y en el de equilibrio de fragmentos (2021, ejemplo de «Pod 42»). Los servidores de</tspan></text><text x="470" y="461.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aplicación son compartidos y la capacidad es de toda la plataforma, pero cada petición toca un solo pod. Dónde deja de</tspan></text><text x="470" y="478.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: omite caché de borde, autenticación y el camino de pago.</tspan></text><text x="470" y="515.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de ingeniería de Shopify (shopify.engineering), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
