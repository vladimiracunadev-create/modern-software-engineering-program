<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Utilidad neta de Shopify, 2023 a 2025</title><desc id="d">Barras con utilidad neta de 132 millones en 2023, 2 019 millones en 2024 y 1 231 millones en 2025; 2023 incluye un deterioro de 1 340 millones por la venta del negocio de logística.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Utilidad neta de Shopify, 2023 a 2025</tspan></text><line x1="93.7" y1="297" x2="920" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="297" x2="93.7" y2="297" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="251" x2="920" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="251" x2="93.7" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="205" x2="920" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="205" x2="93.7" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="209.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1000</tspan></text><line x1="93.7" y1="159" x2="920" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="159" x2="93.7" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1500</tspan></text><line x1="93.7" y1="113" x2="920" y2="113" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="113" x2="93.7" y2="113" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="117.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2000</tspan></text><line x1="93.7" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="67" x2="93.7" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2500</tspan></text><line x1="93.7" y1="67" x2="93.7" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 182)">millones de USD</text><rect x="121.243" y="284.856" width="220.347" height="12.144" rx="3" fill="#102a43"/><text x="231.417" y="278.856" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231.417" dy="0">132</tspan></text><text x="231.417" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">2023</tspan></text><rect x="396.677" y="111.252" width="220.347" height="185.748" rx="3" fill="#102a43"/><text x="506.85" y="105.252" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="506.85" dy="0">2019</tspan></text><text x="506.85" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">2024</tspan></text><rect x="672.11" y="183.748" width="220.347" height="113.252" rx="3" fill="#102a43"/><text x="782.283" y="177.748" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="782.283" dy="0">1231</tspan></text><text x="782.283" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">2025</tspan></text><rect x="10" y="349" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Mire 2023: un deterioro de 1 340 millones por la venta de los negocios de logística comprimió la utilidad; en 2024 y 2025</tspan></text><text x="470" y="390.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hay además ganancias o pérdidas por inversiones que el 10-K lista aparte. Dónde deja de valer: la utilidad neta mezcla</tspan></text><text x="470" y="407.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">operación y resultados de inversiones.</tspan></text><text x="470" y="454.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Shopify Inc. del año terminado el 31 de diciembre de 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
