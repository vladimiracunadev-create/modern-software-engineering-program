<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 402" width="940" height="402" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">4 de enero de 2021: la red de AWS se satura y el nivel web no puede crecer</title><desc id="d">Línea de tiempo en minutos desde las 6:50 hora del Pacífico: errores crecientes antes de las 7:00, saturación del nivel web a las 7:00, intento de añadir 1 200 servidores entre las 7:01 y las 7:15, restauración del servicio de aprovisionamiento hacia las 8:15, Slack degradado pero activo a las 9:15 y red normal a las 10:40.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="402" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">4 de enero de 2021: la red de AWS se satura y el nivel web no puede crecer</tspan></text><line x1="112.6" y1="83" x2="112.6" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="112.6" y1="221" x2="112.6" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="112.6" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="112.6" dy="0">0</tspan></text><line x1="312.45" y1="83" x2="312.45" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="312.45" y1="221" x2="312.45" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="312.45" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312.45" dy="0">60</tspan></text><line x1="512.3" y1="83" x2="512.3" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="512.3" y1="221" x2="512.3" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="512.3" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512.3" dy="0">120</tspan></text><line x1="712.15" y1="83" x2="712.15" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="712.15" y1="221" x2="712.15" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="712.15" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712.15" dy="0">180</tspan></text><line x1="912" y1="83" x2="912" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="221" x2="912" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">240</tspan></text><line x1="112.6" y1="221" x2="912" y2="221" stroke="#5b7280" stroke-width="1.6"/><text x="102.6" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="102.6" dy="0">Usuarios</tspan></text><text x="102.6" y="156.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="102.6" dy="0">Nivel web</tspan></text><text x="102.6" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="102.6" dy="0">Red de AWS</tspan></text><line x1="145.908" y1="75" x2="145.908" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="145.908" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="145.908" dy="0">7:00</tspan></text><line x1="395.721" y1="75" x2="395.721" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="395.721" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="395.721" dy="0">8:15</tspan></text><line x1="595.571" y1="75" x2="595.571" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="595.571" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="595.571" dy="0">9:15</tspan></text><line x1="878.692" y1="75" x2="878.692" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="878.692" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="878.692" dy="0">10:40</tspan></text><rect x="112.6" y="92" width="33.3083" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="145.908" y="92" width="449.663" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="370.74" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="370.74" dy="0">Slack no disponible o muy degradado</tspan></text><rect x="595.571" y="92" width="283.121" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="737.131" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737.131" dy="0">degradado, no caído</tspan></text><line x1="14" y1="129" x2="912" y2="129" stroke="#d5dde1" stroke-width="1"/><rect x="145.908" y="138" width="49.9625" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="195.871" y="138" width="199.85" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="295.796" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="295.796" dy="0">sin aprovisionar</tspan></text><rect x="395.721" y="138" width="199.85" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="495.646" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="495.646" dy="0">se recupera</tspan></text><line x1="14" y1="175" x2="912" y2="175" stroke="#d5dde1" stroke-width="1"/><rect x="112.6" y="184" width="766.092" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="495.646" y="202.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="495.646" dy="0">pasarela de tránsito saturada, con pérdida de paquetes</tspan></text><text x="512.3" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="512.3" dy="0">minutos desde las 6:50 (hora del Pacífico)</tspan></text><rect x="10" y="279" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las horas son las del post. El detonante fue una pasarela de tránsito de AWS que no escaló tras la semana de vacaciones; el</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">agravante, un servicio de aprovisionamiento que llegó a los límites de archivos abiertos y de cuota de AWS. Dónde deja de</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: los segmentos de la lane del nivel web son aproximaciones del dibujo a partir de las horas citadas.</tspan></text><text x="470" y="384.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Slack&#x27;s Outage on January 4th 2021», slack.engineering. Segmentos dibujados por el autor.</tspan></text></svg>
