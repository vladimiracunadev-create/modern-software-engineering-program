<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 546" width="940" height="546" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Zonas de disponibilidad como celdas que se pueden drenar</title><desc id="d">Cuatro columnas: el problema (un fallo gris en una zona de disponibilidad), los objetivos del botón de drenaje (retirar tráfico en menos de 5 minutos, sin errores visibles, incremental y sin depender de la zona enferma), la dificultad (cuatro lenguajes y varios mecanismos de descubrimiento) y el resultado (una zona se trata como una celda).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="546" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Zonas de disponibilidad como celdas que se pueden drenar</tspan></text><rect x="10" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="120.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120.5" dy="0">Problema</tspan></text><rect x="10" y="111" width="221" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="120.5" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="120.5" dy="0">30 de junio de 2021: un</tspan></text><text x="120.5" y="160.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="120.5" dy="0">enlace de red falla de</tspan></text><text x="120.5" y="177.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="120.5" dy="0">forma intermitente</tspan></text><rect x="10" y="213" width="221" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="120.5" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="120.5" dy="0">Una petición se abre en</tspan></text><text x="120.5" y="262.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="120.5" dy="0">cientos de llamadas; cada</tspan></text><text x="120.5" y="279.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="120.5" dy="0">zona ve algo distinto</tspan></text><rect x="243" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="353.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="353.5" dy="0">Objetivos</tspan></text><rect x="243" y="111" width="221" height="92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="353.5" y="152.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="353.5" dy="0">Retirar tráfico de una zona</tspan></text><text x="353.5" y="168.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="353.5" dy="0">en menos de 5 minutos</tspan></text><rect x="243" y="213" width="221" height="92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="353.5" y="254.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="353.5" dy="0">Sin errores visibles;</tspan></text><text x="353.5" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="353.5" dy="0">incremental, desde 1 %</tspan></text><rect x="243" y="315" width="221" height="92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="353.5" y="356.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="353.5" dy="0">No depender de recursos de</tspan></text><text x="353.5" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="353.5" dy="0">la zona drenada</tspan></text><rect x="476" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="586.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="586.5" dy="0">Dificultad</tspan></text><rect x="476" y="111" width="221" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="586.5" y="152.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="586.5" dy="0">Servicios en Hack, Go, Java</tspan></text><text x="586.5" y="168.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="586.5" dy="0">y C++</tspan></text><rect x="476" y="213" width="221" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="586.5" y="254.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="586.5" dy="0">Envoy xDS, Consul y DNS</tspan></text><text x="586.5" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="586.5" dy="0">como descubrimiento</tspan></text><rect x="476" y="315" width="221" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="586.5" y="356.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="586.5" dy="0">Vitess exige un único</tspan></text><text x="586.5" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="586.5" dy="0">primario por fragmento</tspan></text><rect x="709" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="819.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="819.5" dy="0">Resultado</tspan></text><rect x="709" y="111" width="221" height="92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="819.5" y="152.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="819.5" dy="0">Cada zona es una celda que</tspan></text><text x="819.5" y="168.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="819.5" dy="0">se puede drenar</tspan></text><rect x="709" y="213" width="221" height="92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="819.5" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="819.5" dy="0">Decisión humana asistida</tspan></text><text x="819.5" y="262.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="819.5" dy="0">por un botón, no</tspan></text><text x="819.5" y="279.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="819.5" dy="0">autocuración</tspan></text><rect x="10" y="423" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="447.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en «Slack&#x27;s Migration to a Cellular Architecture». El SLA de 99,99 % deja menos de una hora al año de</tspan></text><text x="470" y="464.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">indisponibilidad total, de ahí el objetivo de 5 minutos. Dónde deja de valer: el post explica el diseño, no cuántas veces</tspan></text><text x="470" y="481.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se ha usado el drenaje.</tspan></text><text x="470" y="528.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de ingeniería de Slack (slack.engineering), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
