<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 462" width="940" height="462" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clientes que pagan más de 100 000 dólares al año</title><desc id="d">Barras con 575 clientes en enero de 2019, 893 en enero de 2020 y 1 183 en enero de 2021: la base de clientes grandes se duplica en dos años.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="462" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Clientes que pagan más de 100 000 dólares al año</tspan></text><line x1="93.7" y1="287" x2="920" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="287" x2="93.7" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="243" x2="920" y2="243" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="243" x2="93.7" y2="243" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="247.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">250</tspan></text><line x1="93.7" y1="199" x2="920" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="199" x2="93.7" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="155" x2="920" y2="155" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="155" x2="93.7" y2="155" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="159.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">750</tspan></text><line x1="93.7" y1="111" x2="920" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="111" x2="93.7" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="67" x2="93.7" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 250</tspan></text><line x1="93.7" y1="67" x2="93.7" y2="287" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 177)">clientes</text><rect x="121.243" y="185.8" width="220.347" height="101.2" rx="3" fill="#102a43"/><text x="231.417" y="179.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231.417" dy="0">575</tspan></text><text x="231.417" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">31 ene 2019</tspan></text><rect x="396.677" y="129.832" width="220.347" height="157.168" rx="3" fill="#102a43"/><text x="506.85" y="123.832" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="506.85" dy="0">893</tspan></text><text x="506.85" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">31 ene 2020</tspan></text><rect x="672.11" y="78.792" width="220.347" height="208.208" rx="3" fill="#102a43"/><text x="782.283" y="72.792" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="782.283" dy="0">1 183</tspan></text><text x="782.283" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">31 ene 2021</tspan></text><rect x="10" y="339" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Este es el indicador que Slack usa para medir la capacidad de escalar hacia organizaciones grandes. Mire el crecimiento de</tspan></text><text x="470" y="380.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">106 % en dos años frente al 77 % de la base total de clientes de pago. Dónde deja de valer: no dice cuánto aporta cada</tspan></text><text x="470" y="397.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cliente grande al ingreso total.</tspan></text><text x="470" y="444.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Slack Technologies, año fiscal terminado el 31 de enero de 2021 (SEC).</tspan></text></svg>
