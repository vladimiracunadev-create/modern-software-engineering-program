<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 562" width="940" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Slack en el centro de un ecosistema de equipos, aplicaciones y nube</title><desc id="d">Diagrama de contexto: Slack conecta a las personas de una organización, a las aplicaciones y automatizaciones que publican mensajes, a los administradores y compradores, al proveedor de nube AWS donde corre el núcleo, a los clientes de otras organizaciones mediante canales compartidos y a Salesforce, que lo adquirió en 2021.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="562" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Slack en el centro de un ecosistema de equipos, aplicaciones y nube</tspan></text><rect x="24" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="131" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">Personas de una</tspan></text><text x="131" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">organización: mensajes,</tspan></text><text x="131" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">canales, llamadas</tspan></text><rect x="250" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Aplicaciones, bots y</tspan></text><text x="357" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">automatizaciones que</tspan></text><text x="357" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">publican y leen</tspan></text><rect x="476" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="583" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">Administradores y</tspan></text><text x="583" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">compradores: planes,</tspan></text><text x="583" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">identidad, retención</tspan></text><rect x="702" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="809" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="809" dy="0">Otras organizaciones:</tspan></text><text x="809" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="809" dy="0">canales compartidos (Slack</tspan></text><text x="809" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="809" dy="0">Connect)</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="230.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Slack: mensajería por canales</tspan></text><polyline points="131,125 334.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">usan</tspan></text><polyline points="357,125 424.8,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">integran</tspan></text><polyline points="583,125 515.2,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">contratan</tspan></text><polyline points="809,125 605.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">se conectan</tspan></text><rect x="24" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="131" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">AWS: región us-east-1 para</tspan></text><text x="131" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">el núcleo y red de borde</tspan></text><text x="131" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">global</tspan></text><rect x="250" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">Salesforce: matriz desde</tspan></text><text x="357" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">julio de 2021</tspan></text><rect x="476" y="345" width="214" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="583" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="583" dy="0">Autoridades y reguladores:</tspan></text><text x="583" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="583" dy="0">residencia de datos,</tspan></text><text x="583" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="583" dy="0">privacidad</tspan></text><rect x="702" y="345" width="214" height="74" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="809" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="809" dy="0">Competidores: otras suites</tspan></text><text x="809" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="809" dy="0">y mensajería de empresa</tspan></text><polyline points="334.4,259 131,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">aloja</tspan></text><polyline points="424.8,259 357,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">adquirió</tspan></text><polyline points="515.2,259 583,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">exigen</tspan></text><polyline points="605.6,259 809,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">disputan</tspan></text><rect x="10" y="439" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: el 10-K define a Slack como plataforma de mensajería basada en canales, nombra a AWS como proveedor de nube y</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">describe la fusión con Salesforce. La relación con competidores y reguladores se cita en los factores de riesgo del mismo</tspan></text><text x="470" y="497.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">informe. Dónde deja de valer: no muestra volúmenes ni contratos.</tspan></text><text x="470" y="544.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Slack Technologies, año fiscal terminado el 31 de enero de 2021 (SEC).</tspan></text></svg>
