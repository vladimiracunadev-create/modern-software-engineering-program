<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del MySQL particionado por equipo a Vitess</title><desc id="d">Dos etapas: al principio tres clústeres MySQL (fragmentos por identificador de equipo, metadatos y todo lo demás) gestionados por la aplicación; desde 2017 Vitess sobre MySQL con keyspaces, que ofrece enrutado, copias y resharding.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="345" fill="#ffffff"/><rect x="10" y="14" width="202" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="111" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">Stack LAMP: MySQL desde</tspan></text><text x="111" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">el primer día</tspan></text><rect x="256" y="14" width="202" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="43" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">Fragmentos por equipo:</tspan></text><text x="357" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">todos los datos de un</tspan></text><text x="357" y="76.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">equipo juntos</tspan></text><polyline points="212,56 256,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="603" y="43" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="603" dy="0">Clúster de metadatos y</tspan></text><text x="603" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="603" dy="0">clúster de «todo lo</tspan></text><text x="603" y="76.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="603" dy="0">demás»</tspan></text><polyline points="458,56 502,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="849" y="43" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">La aplicación monolítica</tspan></text><text x="849" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">decide a qué fragmento</tspan></text><text x="849" y="76.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">ir</tspan></text><polyline points="704,56 748,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="202" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="111" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">2017: comienza la</tspan></text><text x="111" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">migración a Vitess</tspan></text><rect x="256" y="138" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Keyspaces con distintas</tspan></text><text x="357" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">claves de fragmentación</tspan></text><polyline points="212,180 256,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="138" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603" y="167" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Vitess sirve 99 % de la</tspan></text><text x="603" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">carga de consultas</tspan></text><text x="603" y="200.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">(2020)</tspan></text><polyline points="458,180 502,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="138" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">Habilita Slack Connect y</tspan></text><text x="849" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">residencia de datos</tspan></text><polyline points="704,180 748,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="849,98 849,118 111,118 111,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Documentado en el post «Scaling Datastores at Slack with Vitess» (diciembre de 2020). Dónde deja de valer: la clave de</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">fragmentación por equipo funcionó mientras ningún equipo fue mayor que un fragmento; las funciones entre equipos (Slack</tspan></text><text x="480" y="294.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Connect) forzaron otra forma de particionar.</tspan></text><text x="480" y="335.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Fuente: blog de ingeniería de Slack (slack.engineering), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
