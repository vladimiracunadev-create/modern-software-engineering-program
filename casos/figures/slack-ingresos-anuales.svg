<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ingresos anuales de Slack, años fiscales 2017 a 2021</title><desc id="d">Barras de ingresos en millones de dólares: 105 en el año fiscal 2017, 221 en 2018, 401 en 2019, 630 en 2020 y 903 en 2021; el ritmo de crecimiento baja de más del 100 por ciento a un 43 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ingresos anuales de Slack, años fiscales 2017 a 2021</tspan></text><line x1="93.7" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="307" x2="93.7" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="259" x2="920" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="259" x2="93.7" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">200</tspan></text><line x1="93.7" y1="211" x2="920" y2="211" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="211" x2="93.7" y2="211" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="215.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">400</tspan></text><line x1="93.7" y1="163" x2="920" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="163" x2="93.7" y2="163" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">600</tspan></text><line x1="93.7" y1="115" x2="920" y2="115" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="115" x2="93.7" y2="115" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">800</tspan></text><line x1="93.7" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="67" x2="93.7" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1000</tspan></text><line x1="93.7" y1="67" x2="93.7" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">millones de USD</text><rect x="110.226" y="281.752" width="132.208" height="25.248" rx="3" fill="#087f8c"/><text x="176.33" y="275.752" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="176.33" dy="0">105</tspan></text><text x="176.33" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="176.33" dy="0">FY2017</tspan></text><rect x="275.486" y="254.08" width="132.208" height="52.92" rx="3" fill="#087f8c"/><text x="341.59" y="248.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="341.59" dy="0">220</tspan></text><text x="341.59" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="341.59" dy="0">FY2018</tspan></text><rect x="440.746" y="210.856" width="132.208" height="96.144" rx="3" fill="#087f8c"/><text x="506.85" y="204.856" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="506.85" dy="0">401</tspan></text><text x="506.85" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">FY2019</tspan></text><rect x="606.006" y="155.704" width="132.208" height="151.296" rx="3" fill="#087f8c"/><text x="672.11" y="149.704" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="672.11" dy="0">630</tspan></text><text x="672.11" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672.11" dy="0">FY2020</tspan></text><rect x="771.266" y="90.376" width="132.208" height="216.624" rx="3" fill="#087f8c"/><text x="837.37" y="84.376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="837.37" dy="0">903</tspan></text><text x="837.37" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837.37" dy="0">FY2021</tspan></text><rect x="10" y="359" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada barra es un año fiscal que termina el 31 de enero. Mire la relación entre barras vecinas: de 2017 a 2018 los ingresos</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se duplican (110 %), de 2020 a 2021 crecen 43 %. Dónde deja de valer: son ingresos contables de un solo segmento; no</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">separan suscripciones de otros ingresos.</tspan></text><text x="470" y="464.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Slack Technologies, año fiscal terminado el 31 de enero de 2021 (SEC).</tspan></text></svg>
