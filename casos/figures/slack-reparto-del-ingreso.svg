<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo se reparte cada dólar de ingreso en el año fiscal 2021</title><desc id="d">Barras horizontales del gasto como porcentaje del ingreso de 902,6 millones de dólares: coste de ingresos 13 por ciento, investigación y desarrollo 42 por ciento, ventas y marketing 51 por ciento y administración 24 por ciento; el total supera el 100 por ciento y por eso hay pérdida operativa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo se reparte cada dólar de ingreso en el año fiscal 2021</tspan></text><line x1="228.04" y1="49" x2="228.04" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="228.04" y1="201" x2="228.04" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="228.04" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="228.04" dy="0">0</tspan></text><line x1="446.613" y1="49" x2="446.613" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="446.613" y1="201" x2="446.613" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="446.613" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="446.613" dy="0">20</tspan></text><line x1="665.187" y1="49" x2="665.187" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="665.187" y1="201" x2="665.187" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="665.187" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="665.187" dy="0">40</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="201" x2="883.76" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">60</tspan></text><line x1="228.04" y1="201" x2="883.76" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="218.04" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="218.04" dy="0">Coste de ingresos</tspan></text><text x="218.04" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="218.04" dy="0">Investigación y desarrollo</tspan></text><text x="218.04" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="218.04" dy="0">Ventas y marketing</tspan></text><text x="218.04" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="218.04" dy="0">Administración general</tspan></text><rect x="228.04" y="55" width="147.537" height="26" rx="3" fill="#c0432f"/><text x="382.577" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="382.577" dy="0">13,5</tspan></text><rect x="228.04" y="93" width="462.283" height="26" rx="3" fill="#c0432f"/><text x="697.323" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="697.323" dy="0">42,3</tspan></text><rect x="228.04" y="131" width="557.362" height="26" rx="3" fill="#c0432f"/><text x="792.402" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="792.402" dy="0">51,0</tspan></text><rect x="228.04" y="169" width="267.752" height="26" rx="3" fill="#c0432f"/><text x="502.792" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="502.792" dy="0">24,5</tspan></text><text x="555.9" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="555.9" dy="0">% del ingreso FY2021</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cálculo propio a partir de las cifras del 10-K: 121,7; 382,1; 460,7 y 221,1 millones sobre 902,6. La suma es 131 % del</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ingreso: el margen bruto de 86,5 % existe, pero los gastos de operación lo superan. Dónde deja de valer: incluye</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">remuneración en acciones, que no es caja.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Slack Technologies, año fiscal terminado el 31 de enero de 2021 (SEC).</tspan></text></svg>
