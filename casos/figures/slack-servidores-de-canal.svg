<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 562" width="940" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Servidores de canal: reparto por hash y reemplazo rápido</title><desc id="d">Esquema de reparto: el identificador de canal pasa por un hash consistente que lo asigna a un servidor de canal; los servidores de canal tienen estado en memoria y cada uno atiende alrededor de 16 millones de canales en hora punta; los gestores del anillo detectan un servidor enfermo y lo reemplazan en menos de 20 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="562" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Servidores de canal: reparto por hash y reemplazo rápido</tspan></text><rect x="137" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="244" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244" dy="0">Canal, usuario, equipo,</tspan></text><text x="244" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244" dy="0">archivo o huddle: todos</tspan></text><text x="244" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244" dy="0">tienen identificador</tspan></text><rect x="363" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Servidor de canal: estado</tspan></text><text x="470" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y algo de historial en</tspan></text><text x="470" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">memoria</tspan></text><rect x="589" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="696" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">Gestores del anillo</tspan></text><text x="696" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">(CHARMs): sustituyen un</tspan></text><text x="696" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">servidor malo</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="221.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Anillo de hash consistente de servidores</tspan></text><text x="470" y="239.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">de canal</tspan></text><polyline points="244,125 379.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="244" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">se hashea</tspan></text><polyline points="470,125 470,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">atiende ~16 M canales</tspan></text><polyline points="696,125 560.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="696" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">&lt;20 s</tspan></text><rect x="137" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">Consul: el resto de</tspan></text><text x="244" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">servicios descubre la</tspan></text><text x="244" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">configuración</tspan></text><rect x="363" y="345" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un equipo reparte sus</tspan></text><text x="470" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">canales entre todos los</tspan></text><text x="470" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">servidores</tspan></text><rect x="589" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="696" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">Pasarela: se suscribe a</tspan></text><text x="696" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">los servidores que alojan</tspan></text><text x="696" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">sus canales</tspan></text><polyline points="379.6,259 244,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="244" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">publica</tspan></text><polyline points="470,259 470,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">dispersión</tspan></text><polyline points="560.4,259 696,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="696" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">suscribe</tspan></text><rect x="10" y="439" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: cifras de 16 millones de canales por servidor en hora punta y reemplazo en menos de 20 segundos. La</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consecuencia de diseño es que la caída de un servidor afecta una fracción pequeña de cada equipo durante segundos. Dónde</tspan></text><text x="470" y="497.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">deja de valer: el número es del post de ingeniería, sin fecha de medición precisa.</tspan></text><text x="470" y="544.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de ingeniería de Slack (slack.engineering), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
