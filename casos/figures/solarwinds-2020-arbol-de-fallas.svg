<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 553" width="940" height="553" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: qué tuvo que coincidir para que miles de clientes instalaran código malicioso</title><desc id="d">Árbol de fallas con la instalación del código malicioso por los clientes arriba y dos ramas necesarias: que el atacante insertara código en las compilaciones, con tres condiciones, y que nadie lo detectara en el camino, con cuatro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="553" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: qué tuvo que coincidir para que miles de clientes instalaran código malicioso</tspan></text><rect x="270" y="51" width="400" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Clientes instalan una actualización con código</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">malicioso</tspan></text><circle cx="470" cy="122.28" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="127.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><polyline points="470,98.28 470,110.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="162.28" width="445" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="232.5" y="185.92" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="232.5" dy="0">A. El atacante inserta código en la compilación</tspan></text><line x1="470" y1="134.28" x2="232.5" y2="162.28" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="232.5" cy="224.28" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232.5" y="229.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232.5" dy="0">Y</tspan></text><line x1="232.5" y1="202.28" x2="232.5" y2="214.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="246.28" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="265.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Acceso a los sistemas del proveedor desde</tspan></text><text x="232.5" y="281.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">septiembre de 2019</tspan></text><line x1="232.5" y1="238.28" x2="232.5" y2="246.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="301.56" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="325.2" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Acceso al entorno de compilación</tspan></text><line x1="232.5" y1="293.56" x2="232.5" y2="301.56" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="349.56" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="368.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Un código de inyección que evita llamar la</tspan></text><text x="232.5" y="385.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">atención del equipo</tspan></text><line x1="232.5" y1="341.56" x2="232.5" y2="349.56" stroke="#8a9aa3" stroke-width="1.4"/><rect x="485" y="162.28" width="445" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="707.5" y="185.92" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="707.5" dy="0">B. Nadie lo detecta ni lo detiene antes</tspan></text><line x1="470" y1="134.28" x2="707.5" y2="162.28" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="707.5" cy="224.28" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707.5" y="229.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707.5" dy="0">Y</tspan></text><line x1="707.5" y1="202.28" x2="707.5" y2="214.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="246.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="269.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">La intrusión no se detecta durante meses</tspan></text><line x1="707.5" y1="238.28" x2="707.5" y2="246.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="294.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="317.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">El código no está en el repositorio de fuentes</tspan></text><line x1="707.5" y1="286.28" x2="707.5" y2="294.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="342.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="365.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">La firma legítima lo avala</tspan></text><line x1="707.5" y1="334.28" x2="707.5" y2="342.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="390.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="413.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Los clientes no pueden verificar el contenido</tspan></text><line x1="707.5" y1="382.28" x2="707.5" y2="390.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="446.28" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: cortar cualquier condición habría detenido o limitado el daño. Mira que A depende del proveedor y B de la</tspan></text><text x="470" y="487.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">verificación independiente. Estructura propia sobre lo documentado.</tspan></text><text x="470" y="535.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SolarWinds, aviso de seguridad y blog (ene 2021). Análisis propio, no conclusión de las fuentes.</tspan></text></svg>
