<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 238" width="940" height="238" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Consecuencias fechadas: del aviso a la atribución y el cierre de la directiva</title><desc id="d">Cadena de consecuencias: directiva de emergencia el 13 de diciembre de 2020; declaración conjunta del FBI, CISA y ODNI el 16 de diciembre; alerta de CISA con otros vectores de acceso en enero de 2021; atribución a la SVR rusa el 15 de abril de 2021; CISA cierra la directiva en 2026 por cumplida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="238" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Consecuencias fechadas: del aviso a la atribución y el cierre de la directiva</tspan></text><rect x="10" y="51" width="200" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">13 dic 2020: directiva</tspan></text><text x="110" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">de emergencia 21-01</tspan></text><rect x="250" y="51" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="350" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="350" dy="0">16 dic 2020: grupo de</tspan></text><text x="350" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="350" dy="0">coordinación de FBI,</tspan></text><text x="350" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="350" dy="0">CISA y ODNI</tspan></text><rect x="490" y="51" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">6 ene 2021: CISA añade</tspan></text><text x="590" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">otros vectores de acceso</tspan></text><rect x="730" y="51" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">15 abr 2021: atribución</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">a la SVR; la directiva</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">se cierra en 2026</tspan></text><polyline points="210,82.96 250,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,82.96 490,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,82.96 730,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="130.92" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="155.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: la respuesta fue rápida y coordinada y, a la vez, larga: la directiva se cerró años después, cuando CISA</tspan></text><text x="470" y="172.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consideró cumplidos sus propósitos. No se cuantifican costes porque las fuentes verificadas no los dan.</tspan></text><text x="470" y="220.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: CISA, directiva de emergencia ED 21-01 (13 dic 2020). Fuente: CISA, alerta AA20-352A (actualizada 2021).</tspan></text></svg>
