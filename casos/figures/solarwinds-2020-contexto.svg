<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 389" width="940" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una actualización de confianza entre un proveedor y miles de redes</title><desc id="d">Diagrama de contexto: SolarWinds construye y firma el software de gestión de redes Orion; los clientes, entre ellos agencias federales y empresas privadas, instalan las actualizaciones firmadas; Orion monitoriza equipos de la red del cliente; un atacante insertó código en las compilaciones del proveedor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="389" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una actualización de confianza entre un proveedor y miles de redes</tspan></text><rect x="10" y="51" width="200" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">SolarWinds: desarrolla,</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">construye y firma Orion</tspan></text><rect x="10" y="112.28" width="200" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">Atacante: actor de una</tspan></text><text x="110" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">nación estatal según el</tspan></text><text x="110" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">gobierno de EE. UU.</tspan></text><rect x="730" y="51" width="200" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Clientes: agencias</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">federales,</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">infraestructura crítica,</tspan></text><text x="830" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">empresas</tspan></text><rect x="730" y="145.56" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Equipos y redes</tspan></text><text x="830" y="181.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">monitorizados por Orion</tspan></text><rect x="730" y="206.84" width="200" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="225.8" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">CISA, FBI y ODNI:</tspan></text><text x="830" y="242.44" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">respuesta coordinada</tspan></text><rect x="280" y="51" width="370" height="217.12" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="294" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="294" dy="0">Cadena de entrega de Orion</tspan></text><rect x="300" y="91" width="330" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Entorno de compilación del proveedor</tspan></text><rect x="300" y="141" width="330" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="159.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Actualización firmada con el certificado</tspan></text><text x="465" y="176.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">legítimo</tspan></text><rect x="300" y="198.28" width="330" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="221.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Instalación en el cliente</tspan></text><polyline points="210,74.64 280,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">construye</tspan></text><polyline points="210,144.24 280,144.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="136.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">inserta</tspan></text><polyline points="650,91.28 730,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="83.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">instalan</tspan></text><polyline points="650,169.2 730,169.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="161.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">monitoriza</tspan></text><polyline points="650,230.48 730,230.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="222.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">responden</tspan></text><rect x="10" y="282.12" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el cliente confiaba en la firma del proveedor; el atacante no tuvo que romper esa confianza, la usó. Mira la</tspan></text><text x="470" y="323.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">caja roja: el punto de entrada fue el entorno de compilación, no la red del cliente.</tspan></text><text x="470" y="371.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: CISA, directiva de emergencia ED 21-01 (13 dic 2020). Fuente: SolarWinds, aviso de seguridad y blog (ene 2021).</tspan></text></svg>
