<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 254" width="940" height="254" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Por qué tardó en verse: tres decisiones de diseño del atacante</title><desc id="d">Cadena de evasión: la puerta trasera espera de 12 a 14 días tras la instalación antes de actuar; el tráfico imita al legítimo y pasa por servidores en EE. UU.; el código de inyección se diseñó para no despertar sospechas de los equipos de compilación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="254" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Por qué tardó en verse: tres decisiones de diseño del atacante</tspan></text><rect x="10" y="51" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="110" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">Espera de 12 a 14 días</tspan></text><text x="110" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">tras la instalación</tspan></text><rect x="250" y="51" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="350" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">Tráfico que imita al</tspan></text><text x="350" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">legítimo, por servidores</tspan></text><text x="350" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">en EE. UU.</tspan></text><rect x="490" y="51" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">Inyección diseñada para</tspan></text><text x="590" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">no alertar a los equipos</tspan></text><text x="590" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">de compilación</tspan></text><rect x="730" y="51" width="200" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Resultado: unos diez</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">meses sin ser detectado</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">como ataque</tspan></text><polyline points="210,82.96 250,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,82.96 490,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,82.96 730,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="130.92" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="155.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: las defensas basadas en comportamiento y en tráfico se eluden si el atacante imita lo normal; por eso la</tspan></text><text x="470" y="172.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">prevención en la cadena de entrega pesa tanto. Los 12 a 14 días son los que describe Microsoft para una versión de la</tspan></text><text x="470" y="189.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">puerta trasera.</tspan></text><text x="470" y="236.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Microsoft, análisis técnico (dic 2020). Fuente: SolarWinds, aviso de seguridad y blog (ene 2021).</tspan></text></svg>
