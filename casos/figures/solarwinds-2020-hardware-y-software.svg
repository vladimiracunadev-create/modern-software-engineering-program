<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se sabe de la pila técnica</title><desc id="d">Capas de la pila técnica: plataforma Orion de monitoreo, biblioteca comprometida firmada, puerta trasera SUNBURST con espera y comunicación imitando tráfico legítimo, cargas de segunda fase; lenguajes y herramientas de compilación no se detallan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="500" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se sabe de la pila técnica</tspan></text><rect x="10" y="51" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Producto</tspan></text><rect x="270" y="51" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="74.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Orion Platform, software de gestión y monitoreo de redes de SolarWinds</tspan></text><rect x="10" y="99" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="126.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Componente comprometido</tspan></text><rect x="270" y="99" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="117.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">SolarWinds.Orion.Core.BusinessLayer.dll, con una versión maliciosa firmada con el</tspan></text><text x="600" y="134.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">certificado legítimo</tspan></text><rect x="10" y="154.28" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="181.56" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Puerta trasera</tspan></text><rect x="270" y="154.28" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="173.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">SUNBURST: espera de 12 a 14 días, comunicación que imita tráfico legítimo, entrega de</tspan></text><text x="600" y="189.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">cargas de segunda fase</tspan></text><rect x="10" y="209.56" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="233.2" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Segunda fase</tspan></text><rect x="270" y="209.56" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="233.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Herramientas como Cobalt Strike, según el análisis de Microsoft</tspan></text><rect x="10" y="257.56" width="250" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="135" y="284.84" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="135" dy="0">Entorno de compilación</tspan></text><rect x="270" y="257.56" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="276.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Se halló un código de inyección que insertaba SUNBURST; la arquitectura de la</tspan></text><text x="600" y="293.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">compilación no se publica</tspan></text><rect x="10" y="312.84" width="250" height="63.92" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="331.8" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">Lenguajes, repositorios y</tspan></text><text x="135" y="348.44" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">sistemas de integración</tspan></text><text x="135" y="365.08" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">continua</tspan></text><rect x="270" y="312.84" width="660" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="348.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">No constan con detalle en las fuentes consultadas</tspan></text><rect x="10" y="392.76" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="417.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: lo documentado alcanza para detectar y limpiar, no para reconstruir el sistema. Verde: documentado; dorado:</tspan></text><text x="470" y="434.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">parcial; gris: no se sabe.</tspan></text><text x="470" y="482.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Microsoft, análisis técnico (dic 2020). Fuente: SolarWinds, aviso de seguridad y blog (ene 2021).</tspan></text></svg>
