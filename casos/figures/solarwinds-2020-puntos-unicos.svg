<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 389" width="940" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias de un único elemento en la cadena de entrega</title><desc id="d">Mapa de dependencias: el entorno de compilación como único lugar donde se genera el binario, el certificado de firma como único aval, la confianza del cliente en el canal del proveedor y la ausencia de verificación independiente del contenido; cada una sin alternativa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="389" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dependencias de un único elemento en la cadena de entrega</tspan></text><rect x="10" y="51" width="200" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">Un entorno de</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">compilación</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">comprometible</tspan></text><rect x="10" y="128.92" width="200" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">Un certificado de firma</tspan></text><text x="110" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">como único aval</tspan></text><rect x="10" y="190.2" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="110" y="209.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">Un canal de</tspan></text><text x="110" y="225.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">actualización de</tspan></text><text x="110" y="242.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">confianza</tspan></text><rect x="730" y="51" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Cliente: instala y</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">confía</tspan></text><rect x="730" y="112.28" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Orion con acceso amplio</tspan></text><text x="830" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">a la red del cliente</tspan></text><rect x="280" y="51" width="370" height="217.12" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="294" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="294" dy="0">Entrega de Orion</tspan></text><rect x="300" y="91" width="330" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Binario único generado por el proveedor</tspan></text><rect x="300" y="141" width="330" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="159.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Sin comprobación independiente del</tspan></text><text x="465" y="176.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">contenido</tspan></text><polyline points="210,82.96 280,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="74.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">origen</tspan></text><polyline points="210,152.56 280,152.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="144.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">aval</tspan></text><polyline points="210,222.16 280,222.16" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="214.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">canal</tspan></text><polyline points="650,74.64 730,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">instala</tspan></text><polyline points="650,135.92 730,135.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="127.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">acceso</tspan></text><rect x="10" y="282.12" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: la seguridad de miles de clientes dependía de la integridad de un solo entorno. Rojo: punto único de fallo</tspan></text><text x="470" y="323.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con efecto directo; dorado: dependencia de confianza. Lectura propia.</tspan></text><text x="470" y="371.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SolarWinds, aviso de seguridad y blog (ene 2021). Análisis propio, no conclusión de las fuentes.</tspan></text></svg>
