<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 491" width="940" height="491" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cada eslabón de la cadena y el control que lo corta</title><desc id="d">Ocho pares de causa y control: reasignación superada, procesos manuales, falta de estado fiable de tripulaciones, avisos tardíos, centro de llamadas desbordado, reembolsos con errores, señales previas ignoradas y recuperación lenta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="491" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cada eslabón de la cadena y el control que lo corta</tspan></text><rect x="10" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="117.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">Software de reasignación</tspan></text><text x="117.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">superado por el volumen</tspan></text><rect x="10" y="126.28" width="215" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.5" y="145.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">Pruebas de carga con</tspan></text><text x="117.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">escenarios de tormenta y</tspan></text><text x="117.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">de miles de cambios por</tspan></text><text x="117.5" y="195.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">hora</tspan></text><polyline points="117.5,98.28 117.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="245" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">Procesos manuales que no</tspan></text><text x="352.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">escalan</tspan></text><rect x="245" y="126.28" width="215" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352.5" y="145.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">Automatizar la</tspan></text><text x="352.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">comunicación con</tspan></text><text x="352.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">tripulaciones y un canal</tspan></text><text x="352.5" y="195.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">de contingencia</tspan></text><polyline points="352.5,98.28 352.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="480" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">Sin vista fiable de</tspan></text><text x="587.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">tripulaciones</tspan></text><rect x="480" y="126.28" width="215" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587.5" y="153.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">Estado único y verificable</tspan></text><text x="587.5" y="170.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">de cada tripulación,</tspan></text><text x="587.5" y="186.84" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">visible para despacho</tspan></text><polyline points="587.5,98.28 587.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="715" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">Avisos de estado tardíos o</tspan></text><text x="822.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">inexactos</tspan></text><rect x="715" y="126.28" width="215" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822.5" y="153.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">Avisos automáticos desde</tspan></text><text x="822.5" y="170.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">la fuente de verdad, con</tspan></text><text x="822.5" y="186.84" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">comprobación de entrega</tspan></text><polyline points="822.5,98.28 822.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="222.84" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="117.5" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">Centro de llamadas</tspan></text><text x="117.5" y="258.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">desbordado</tspan></text><rect x="10" y="298.12" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.5" y="317.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">Capacidad elástica y</tspan></text><text x="117.5" y="333.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">autoservicio en la web</tspan></text><text x="117.5" y="350.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">para reubicar y reembolsar</tspan></text><polyline points="117.5,270.12 117.5,298.12" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="245" y="222.84" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352.5" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">Sitio de reembolsos con</tspan></text><text x="352.5" y="258.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">errores</tspan></text><rect x="245" y="298.12" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352.5" y="317.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">Validación visible de cada</tspan></text><text x="352.5" y="333.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">solicitud y confirmación</tspan></text><text x="352.5" y="350.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">al cliente</tspan></text><polyline points="352.5,270.12 352.5,298.12" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="480" y="222.84" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.5" y="250.12" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">Señales previas ignoradas</tspan></text><rect x="480" y="298.12" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587.5" y="317.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">Registro de fallos pasados</tspan></text><text x="587.5" y="333.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">con dueño y plazo, y</tspan></text><text x="587.5" y="350.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">revisión externa</tspan></text><polyline points="587.5,270.12 587.5,298.12" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="715" y="222.84" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822.5" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">Recuperación que tardó una</tspan></text><text x="822.5" y="258.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">semana</tspan></text><rect x="715" y="298.12" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822.5" y="317.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">Ejercicios de colapso y</tspan></text><text x="822.5" y="333.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">reglas para cancelar y</tspan></text><text x="822.5" y="350.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">estabilizar la red</tspan></text><polyline points="822.5,270.12 822.5,298.12" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="384.04" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="409" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: algunos de estos controles coinciden con lo que Southwest dijo estar haciendo: actualizar el software de</tspan></text><text x="470" y="425.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">reasignación, un equipo nuevo en el centro de mando y mejores teléfonos. La columna inferior es análisis propio.</tspan></text><text x="470" y="473.32" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: CNN y AP sobre la audiencia del Senado (9 feb 2023). Análisis propio, no conclusión del DOT ni del Senado.</tspan></text></svg>
