<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 306" width="940" height="306" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La escala del colapso: vuelos cancelados y pasajeros afectados</title><desc id="d">Barras horizontales con las dos cifras del DOT: unos 16 900 vuelos cancelados y más de dos millones de pasajeros afectados, en miles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="306" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La escala del colapso: vuelos cancelados y pasajeros afectados</tspan></text><line x1="244" y1="49" x2="244" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="244" y1="125" x2="244" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="244" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">10</tspan></text><line x1="449.193" y1="49" x2="449.193" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="449.193" y1="125" x2="449.193" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="449.193" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="449.193" dy="0">100</tspan></text><line x1="654.387" y1="49" x2="654.387" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="654.387" y1="125" x2="654.387" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="654.387" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="654.387" dy="0">1 000</tspan></text><line x1="859.58" y1="49" x2="859.58" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="125" x2="859.58" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">10 000</tspan></text><line x1="244" y1="125" x2="859.58" y2="125" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Vuelos cancelados</tspan></text><text x="234" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Pasajeros afectados</tspan></text><rect x="244" y="55" width="46.7608" height="26" rx="3" fill="#c0432f"/><text x="297.761" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="297.761" dy="0">16,9</tspan></text><rect x="244" y="93" width="472.156" height="26" rx="3" fill="#c0432f"/><text x="723.156" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="723.156" dy="0">2 000,0</tspan></text><text x="551.79" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="551.79" dy="0">Miles (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="183" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="207.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El DOT habla de 16 900 vuelos y de más de dos millones de pasajeros; CNN dice «más de 16 700» vuelos y AP «casi 17 000»:</tspan></text><text x="470" y="224.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las fuentes difieren en la cifra exacta. La escala es logarítmica porque son magnitudes de unidades distintas; no compares</tspan></text><text x="470" y="241.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">longitudes.</tspan></text><text x="470" y="288.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DOT, comunicado del 18 de diciembre de 2023. CNN y AP.</tspan></text></svg>
