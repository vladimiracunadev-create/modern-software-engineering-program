<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 526" width="940" height="526" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Características de la infraestructura de Spotify: nube, escala y costo</title><desc id="d">Diagrama de la infraestructura de Spotify: nube pública de Google desde 2016; unas 2.500 máquinas virtuales y unos 15 microservicios en la entrega de eventos; 500 tipos de evento y más de 350 terabytes diarios en bruto en 2019; costos declarados como altos sin cifras; y regiones y zonas no publicadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="526" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Características de la infraestructura de Spotify: nube, escala y costo</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Modelo</tspan></text><rect x="10" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: nube pública de Google, con una vía de</tspan></text><text x="235" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">servicios y una de datos (F4); decisión de no estar en el</tspan></text><text x="235" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">negocio de los centros de datos (F4).</tspan></text><rect x="10" y="167.8" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="188.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">No se sabe: qué parte, si alguna, sigue en infraestructura</tspan></text><text x="235" y="205.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">propia.</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Escala</tspan></text><rect x="480" y="92" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: en 2019, más de 500 tipos de evento, 350</tspan></text><text x="705" y="129.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">terabytes diarios en bruto y picos de más de 8 millones de</tspan></text><text x="705" y="146.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">eventos por segundo; en 2021, cerca de 70 terabytes</tspan></text><text x="705" y="162.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">comprimidos diarios y más de 600 tipos (F5, F5-bis).</tspan></text><rect x="480" y="184.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: en 2016, más de 2 mil millones de listas y más</tspan></text><text x="705" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">de 30 millones de canciones (F4).</tspan></text><rect x="10" y="235" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="255.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Costos</tspan></text><rect x="10" y="277" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="297.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: «los sistemas grandes cuestan mucho dinero»:</tspan></text><text x="235" y="314.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">decidieron abstraer el costo de los equipos y luego hacer</tspan></text><text x="235" y="331.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">ciclos de ahorro (F5).</tspan></text><rect x="10" y="352.8" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="373.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">No se sabe: gasto de nube en euros: no se publica; solo se</tspan></text><text x="235" y="390.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">conoce el margen bruto de 33,1 % de un trimestre (F2).</tspan></text><rect x="480" y="251.6" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="272.52" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Regiones y redes</tspan></text><rect x="480" y="293.6" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="314.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: regiones, zonas de disponibilidad y topología</tspan></text><text x="705" y="331.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">de red de los servicios de audio.</tspan></text><rect x="480" y="352.8" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="373.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: servicios de red del proveedor para transferir</tspan></text><text x="705" y="390.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">petabytes (F4).</tspan></text><rect x="10" y="420" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="442.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: modelo, escala, costos y regiones; las dos últimas columnas casi no tienen dato público. Dónde deja de valer: las</tspan></text><text x="470" y="459.56" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cifras de eventos son de datos de analítica y no de audio.</tspan></text><text x="470" y="503.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F2, F4, F5, F5-bis.</tspan></text></svg>
