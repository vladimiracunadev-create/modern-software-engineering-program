<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Spotify como mercado de dos lados con un tercero que cobra</title><desc id="d">Diagrama de contexto: los oyentes pagan una suscripción o ven anuncios; los anunciantes pagan por la audiencia gratuita; Spotify reparte una parte mayoritaria de lo que ingresa a titulares de derechos (sellos, editores, artistas independientes y creadores de podcasts).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Spotify como mercado de dos lados con un tercero que cobra</tspan></text><rect x="20" y="70" width="220" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130" dy="0">Oyentes</tspan></text><text x="130" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130" dy="0">Gratis (con anuncios)</tspan></text><text x="130" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130" dy="0">o Premium</tspan></text><rect x="20" y="215" width="220" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="130" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="130" dy="0">Anunciantes</tspan></text><text x="130" y="253.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="130" dy="0">(audiencia del nivel</tspan></text><text x="130" y="270.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="130" dy="0">gratis)</tspan></text><rect x="360" y="130" width="220" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="167" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Spotify</tspan></text><text x="470" y="183.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">catálogo, recomendación,</tspan></text><text x="470" y="200.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">reproducción</tspan></text><rect x="700" y="70" width="220" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="810" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="810" dy="0">Titulares de derechos</tspan></text><text x="810" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="810" dy="0">(sellos, editores,</tspan></text><text x="810" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="810" dy="0">artistas independientes)</tspan></text><rect x="700" y="215" width="220" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="810" y="245.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="810" dy="0">Creadores de podcasts</tspan></text><text x="810" y="261.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="810" dy="0">y audiolibros</tspan></text><polyline points="240,110 360,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="285" y="118" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="285" dy="0">suscripción</tspan></text><polyline points="240,250 360,205" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="285" y="252" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="285" dy="0">campañas</tspan></text><polyline points="580,160 700,115" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="655" y="118" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655" dy="0">regalías</tspan></text><polyline points="700,250 580,205" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="650" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650" dy="0">contenido</tspan></text><rect x="10" y="310" width="920" height="125.6" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="343.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: Spotify no vende música, vende acceso y descubrimiento, y paga la música a terceros. Documentado: en 2025 los</tspan></text><text x="470" y="359.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pagos acumulados a titulares de derechos rondaban los 70 mil millones de dólares y más del 60 % de los suscriptores nuevos</tspan></text><text x="470" y="376.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">empezó en el nivel gratuito (Loud &amp; Clear). Inferido: el margen bruto del 33,1 % del trimestre implica que dos tercios de</tspan></text><text x="470" y="393.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cada euro ingresado se van en costos del ingreso, entre ellos las regalías. Dónde deja de valer: no hay desglose público</tspan></text><text x="470" y="409.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por tipo de contrato.</tspan></text><text x="470" y="463.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Spotify Loud &amp; Clear (2026); comunicado Q4 2025. Esquema del autor.</tspan></text></svg>
