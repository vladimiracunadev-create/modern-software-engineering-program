<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 326" width="940" height="326" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué pasó con cada 100 euros de ingreso de Spotify en los nueve primeros meses de 2025</title><desc id="d">Barra apilada al 100 por ciento con los nueve meses de 2025: costo de ingresos 68,4 por ciento, investigación y desarrollo 8,7, ventas y marketing 8,1, administración 2,9 y resultado operativo 11,8 por ciento de los 12.655 millones de euros de ingreso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="326" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué pasó con cada 100 euros de ingreso de Spotify en los nueve primeros meses de 2025</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Costo de ingresos</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Investigación y desarrollo</tspan></text><rect x="436.22" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="456.22" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="456.22" dy="0">Ventas y marketing</tspan></text><rect x="619.94" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="639.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="639.94" dy="0">Administración</tspan></text><rect x="16" y="69" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Resultado operativo</tspan></text><line x1="124" y1="101" x2="124" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="124" y1="145" x2="124" y2="150" stroke="#5b7280" stroke-width="1.4"/><text x="124" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="124" dy="0">0</tspan></text><line x1="311.925" y1="101" x2="311.925" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="311.925" y1="145" x2="311.925" y2="150" stroke="#5b7280" stroke-width="1.4"/><text x="311.925" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="311.925" dy="0">25</tspan></text><line x1="499.85" y1="101" x2="499.85" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="499.85" y1="145" x2="499.85" y2="150" stroke="#5b7280" stroke-width="1.4"/><text x="499.85" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.85" dy="0">50</tspan></text><line x1="687.775" y1="101" x2="687.775" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="687.775" y1="145" x2="687.775" y2="150" stroke="#5b7280" stroke-width="1.4"/><text x="687.775" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687.775" dy="0">75</tspan></text><line x1="875.7" y1="101" x2="875.7" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="145" x2="875.7" y2="150" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="124" y1="145" x2="875.7" y2="145" stroke="#5b7280" stroke-width="1.6"/><text x="114" y="119" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114" dy="0">Nueve meses</tspan></text><text x="114" y="136" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114" dy="0">de 2025</tspan></text><rect x="124" y="108" width="514.28" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="381.14" y="127.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="381.14" dy="0">68 %</tspan></text><rect x="638.28" y="108" width="65.5176" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="671.039" y="127.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="671.039" dy="0">9 %</tspan></text><rect x="703.798" y="108" width="61.0032" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="734.3" y="127.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="734.3" dy="0">8 %</tspan></text><rect x="764.801" y="108" width="21.9778" height="30" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><rect x="786.779" y="108" width="88.921" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="831.24" y="127.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="831.24" dy="0">12 %</tspan></text><text x="882.7" y="127.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="499.85" y="189" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="499.85" dy="0">% del total</tspan></text><rect x="10" y="203" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="227.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: dos terceras partes del ingreso se van en el costo de ingresos, que incluye regalías y distribución; el resultado</tspan></text><text x="470" y="244.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">operativo es el 11,8 % de 12.655 millones de euros. Dónde deja de valer: son nueve meses, no el año; el formulario 6-K no</tspan></text><text x="470" y="261.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">separa las regalías del resto del costo de ingresos en estas líneas.</tspan></text><text x="470" y="308.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Spotify, formulario 6-K del tercer trimestre de 2025, estados financieros intermedios (F14).</tspan></text></svg>
