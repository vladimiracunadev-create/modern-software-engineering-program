<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema del negocio de Spotify: valor, ingreso, actores y flujos</title><desc id="d">Diagrama del negocio de Spotify con cinco grupos: la propuesta de valor, las dos fuentes de ingreso (suscripción Premium y publicidad del nivel gratuito), los actores, los flujos de dinero con un fondo de regalías de unos dos tercios, y los flujos de valor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema del negocio de Spotify: valor, ingreso, actores y flujos</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Propuesta de valor</tspan></text><rect x="10" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: acceso inmediato a un catálogo enorme, con un</tspan></text><text x="235" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">nivel gratuito financiado por anuncios y una suscripción</tspan></text><text x="235" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">sin anuncios (F1, F3).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Ingreso (nueve meses de 2025, millones de euros)</tspan></text><rect x="480" y="92" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: Premium 11.337 y Ad-Supported 1.318, total</tspan></text><text x="705" y="129.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">12.655 (F14).</tspan></text><rect x="10" y="175.8" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="196.72" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Actores</tspan></text><rect x="10" y="217.8" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="238.7" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Oyentes del nivel gratuito y Premium, anunciantes,</tspan></text><text x="235" y="255.34" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">titulares de derechos (sellos y editoras), artistas,</tspan></text><text x="235" y="271.98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">creadores de podcasts y de audiolibros, y Spotify (F1, F3).</tspan></text><rect x="480" y="159.2" width="450" height="34" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="180.12" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="705" dy="0">Flujos de dinero</tspan></text><rect x="480" y="201.2" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="222.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: Premium paga suscripción; anunciantes pagan</tspan></text><text x="705" y="238.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">por la audiencia gratuita; unos dos tercios del ingreso van</tspan></text><text x="705" y="255.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">al fondo de regalías y de allí a titulares de derechos</tspan></text><text x="705" y="272" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">(F3).</tspan></text><rect x="480" y="293.6" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="314.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: el costo de ingresos incluye regalías y</tspan></text><text x="705" y="331.14" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">distribución, costos de procesamiento de pagos y costos de</tspan></text><text x="705" y="347.78" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">contenido de podcasts (F14).</tspan></text><rect x="10" y="301.6" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="235" y="322.52" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="235" dy="0">Flujos de valor</tspan></text><rect x="10" y="343.6" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="364.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Música y audio a la carta hacia el oyente; descubrimiento y</tspan></text><text x="235" y="381.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">pago hacia el artista; audiencia hacia el anunciante;</tspan></text><text x="235" y="397.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">embudo del nivel gratuito hacia Premium (más del 60 % de</tspan></text><text x="235" y="414.4" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">los suscriptores nuevos) (F3).</tspan></text><rect x="10" y="444" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="466.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cinco grupos desde lo que se ofrece hasta cómo circulan dinero y valor. Dónde deja de valer: los dos tercios son</tspan></text><text x="470" y="483.56" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una cifra redondeada de la empresa; los contratos con cada sello no son públicos.</tspan></text><text x="470" y="527.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F1, F3 y formulario 6-K del tercer trimestre de 2025 (F14).</tspan></text></svg>
