<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Entrega de eventos: priorizar que el sistema siga vivo sobre que cada dato llegue puntual</title><desc id="d">Flujo documentado de la entrega de eventos de Spotify: cada tipo de evento tiene su propio flujo y sus particiones horarias; un tipo ruidoso o bloqueado no detiene a los demás, y la partición de una hora se cierra solo cuando está completa, ahí aplica el principio liveness over lateness.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Entrega de eventos: priorizar que el sistema siga vivo sobre que cada dato llegue puntual</tspan></text><rect x="20" y="55" width="160" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="100" y="77" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="100" dy="0">Evento del</tspan></text><text x="100" y="93.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="100" dy="0">cliente (p. ej.</tspan></text><text x="100" y="110.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="100" dy="0">una reproducción)</tspan></text><rect x="230" y="55" width="170" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="315" y="85.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="315" dy="0">Flujo propio por</tspan></text><text x="315" y="101.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="315" dy="0">tipo de evento</tspan></text><rect x="450" y="55" width="220" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="560" y="85.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="560" dy="0">Partición horaria</tspan></text><text x="560" y="101.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="560" dy="0">(p. ej. 13:00–14:00 UTC)</tspan></text><rect x="720" y="55" width="200" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="820" y="85.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="820" dy="0">Cerrada e</tspan></text><text x="820" y="101.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="820" dy="0">inmutable → ETL</tspan></text><polyline points="180,90 230,90" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="400,90 450,90" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="670,90 720,90" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="230" y="175" width="170" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="315" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="315" dy="0">Tipo roto o</tspan></text><text x="315" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="315" dy="0">bloqueado</tspan></text><rect x="450" y="175" width="220" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="560" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="560" dy="0">Sus particiones</tspan></text><text x="560" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="560" dy="0">quedan abiertas</tspan></text><polyline points="315,125 315,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="400,210 450,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="720" y="175" width="200" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="820" y="205.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="820" dy="0">Los demás tipos</tspan></text><text x="820" y="221.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="820" dy="0">siguen entregándose</tspan></text><polyline points="670,210 720,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="270" width="920" height="109" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el aislamiento por tipo convierte un fallo global en uno acotado. Documentado en el blog de 2019: más de 500 tipos</tspan></text><text x="470" y="319.82" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de evento, más de 350 TB de datos brutos al día, hasta 8 millones de eventos por segundo en picos y 500 mil millones de</tspan></text><text x="470" y="336.46" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">eventos diarios en el primer trimestre de 2019. Dónde deja de valer: el coste es que un dato puede llegar tarde o</tspan></text><text x="470" y="353.1" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">incompleto; sirve para analítica, no para saldos ni para derechos.</tspan></text><text x="470" y="407" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Spotify&#x27;s Event Delivery: Life in the Cloud», Spotify Engineering (2019).</tspan></text></svg>
