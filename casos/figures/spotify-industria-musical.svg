<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mercado de la música grabada: del máximo de 1999 al piso de 2014 y la recuperación</title><desc id="d">Barras con tres cifras de la industria publicadas por Spotify: 24 mil millones de dólares en el máximo de 1999, 13 mil millones en 2014 y 31,7 mil millones en la cifra más reciente que cita, de IFPI.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El mercado de la música grabada: del máximo de 1999 al piso de 2014 y la recuperación</tspan></text><line x1="71.08" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="307" x2="71.08" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="247" x2="920" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="247" x2="71.08" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="187" x2="920" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="187" x2="71.08" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="127" x2="920" y2="127" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="127" x2="71.08" y2="127" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="131.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="67" x2="71.08" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="67" x2="71.08" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">Miles de millones de dólares</text><rect x="99.3773" y="163" width="226.379" height="144" rx="3" fill="#087f8c"/><text x="212.567" y="157" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">24,0</tspan></text><text x="212.567" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">1999 (máximo)</tspan></text><rect x="382.351" y="229" width="226.379" height="78" rx="3" fill="#087f8c"/><text x="495.54" y="223" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">13,0</tspan></text><text x="495.54" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">2014 (piso)</tspan></text><rect x="665.324" y="116.8" width="226.379" height="190.2" rx="3" fill="#087f8c"/><text x="778.513" y="110.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">31,7</tspan></text><text x="778.513" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Hoy (cifra IFPI citada por Spotify)</tspan></text><rect x="10" y="359" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la piratería y el desplome precedieron a Spotify (2008) y la recuperación posterior coincide con el streaming; la</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">figura no prueba causalidad, la afirma Spotify. Dónde deja de valer: son datos de la industria interpretados por Spotify,</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que el propio sitio rotula como su interpretación; la tercera cifra no lleva año en la fuente y por eso se rotula «hoy».</tspan></text><text x="470" y="464.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Spotify, Loud &amp; Clear (F3), que cita a IFPI; interpretación de Spotify.</tspan></text></svg>
