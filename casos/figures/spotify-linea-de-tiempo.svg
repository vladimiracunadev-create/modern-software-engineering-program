<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 389" width="940" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Spotify: de startup sueca a plataforma de audio</title><desc id="d">Línea de tiempo de 2006 a 2025: fundación en Estocolmo en 2006, lanzamiento en octubre de 2008 en varios mercados europeos, lanzamiento en Estados Unidos en 2011, migración a Google Cloud desde 2016, salida a bolsa por cotización directa en 2018, audiolibros en 2022 y 751 millones de usuarios activos mensuales a fines de 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="389" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Spotify: de startup sueca a plataforma de audio</tspan></text><line x1="154" y1="83" x2="154" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="154" y1="191" x2="154" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="154" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154" dy="0">2 006</tspan></text><line x1="305.6" y1="83" x2="305.6" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="305.6" y1="191" x2="305.6" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="305.6" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="305.6" dy="0">2 010</tspan></text><line x1="457.2" y1="83" x2="457.2" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="457.2" y1="191" x2="457.2" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="457.2" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457.2" dy="0">2 014</tspan></text><line x1="608.8" y1="83" x2="608.8" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="608.8" y1="191" x2="608.8" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="608.8" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="608.8" dy="0">2 018</tspan></text><line x1="760.4" y1="83" x2="760.4" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="760.4" y1="191" x2="760.4" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="760.4" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="760.4" dy="0">2 022</tspan></text><line x1="912" y1="83" x2="912" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="191" x2="912" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2 026</tspan></text><line x1="154" y1="191" x2="912" y2="191" stroke="#5b7280" stroke-width="1.6"/><text x="144" y="114.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">Producto</tspan></text><text x="144" y="168.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">Plataforma</tspan></text><line x1="154" y1="75" x2="154" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="154" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154" dy="0">Fundación</tspan></text><line x1="229.8" y1="75" x2="229.8" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="240.6" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="240.6" dy="0">Lanzamiento</tspan></text><line x1="608.8" y1="75" x2="608.8" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="608.8" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="608.8" dy="0">Bolsa</tspan></text><rect x="229.8" y="92" width="265.3" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="362.45" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362.45" dy="0">Música en streaming</tspan></text><rect x="495.1" y="92" width="265.3" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="627.75" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627.75" dy="0">Podcasts y descubrimiento</tspan></text><rect x="760.4" y="92" width="151.6" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="836.2" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="836.2" dy="0">Audiolibros</tspan></text><line x1="14" y1="137" x2="912" y2="137" stroke="#d5dde1" stroke-width="1"/><rect x="229.8" y="146" width="303.2" height="36" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="381.4" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="381.4" dy="0">Centros de datos propios</tspan></text><rect x="533" y="146" width="379" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="722.5" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722.5" dy="0">Google Cloud (datos y servicios)</tspan></text><text x="533" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="533" dy="0">Año</tspan></text><rect x="10" y="249" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="273.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: lanzamiento en 2008 y audiolibros en 2022 (Spotify Newsroom); decisión de ir a Google Cloud en febrero de 2016</tspan></text><text x="470" y="290.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(Google Cloud). Fuente secundaria sin verificar con una primaria: fundación en abril de 2006 y cotización directa en 2018.</tspan></text><text x="470" y="307.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las eras de producto son una síntesis del autor. Dónde deja de valer: la migración a la nube duró años y no hubo un corte</tspan></text><text x="470" y="323.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">único en 2016.</tspan></text><text x="470" y="371.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Spotify Newsroom (Acerca de); Google Cloud (2016); Wikipedia (fechas secundarias).</tspan></text></svg>
