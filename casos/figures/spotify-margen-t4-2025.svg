<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 552" width="940" height="552" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuarto trimestre de 2025: qué queda de cada 100 euros de ingreso</title><desc id="d">Barra apilada al 100 por ciento: con un margen bruto del 33,1 por ciento, 66,9 de cada 100 euros se van en costo de ingresos; de los 33,1 restantes, el resultado operativo de 701 millones sobre unos 4.500 millones de ingresos equivale a unos 15,6 euros y los demás gastos operativos a unos 17,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="552" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuarto trimestre de 2025: qué queda de cada 100 euros de ingreso</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Costo de ingresos</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Otros gastos operativos (aprox.)</tspan></text><rect x="481.46" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="501.46" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="501.46" dy="0">Resultado operativo (aprox.)</tspan></text><line x1="78.62" y1="377" x2="920" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="377" x2="78.62" y2="377" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="307" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="237" x2="920" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="237" x2="78.62" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="167" x2="920" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="167" x2="78.62" y2="167" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="171.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="97" x2="920" y2="97" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="97" x2="78.62" y2="97" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="97" x2="78.62" y2="377" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">% del total</text><rect x="263.724" y="189.68" width="471.173" height="187.32" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="499.31" y="287.84" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="499.31" dy="0">67 %</tspan></text><rect x="263.724" y="140.68" width="471.173" height="49" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="499.31" y="169.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="499.31" dy="0">18 %</tspan></text><rect x="263.724" y="97" width="471.173" height="43.68" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="499.31" y="123.34" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="499.31" dy="0">16 %</tspan></text><text x="499.31" y="90" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">100 %</tspan></text><text x="499.31" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Ingresos T4 2025</tspan></text><rect x="10" y="429" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="453.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: ingresos de 4.500 millones de euros (redondeado), margen bruto 33,1 % y resultado operativo de 701 millones.</tspan></text><text x="470" y="470.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Calculado por el autor: 701 / 4.500 = 15,6 %, y 33,1 − 15,6 = 17,5 %, que son gastos de operación; al partir de un ingreso</tspan></text><text x="470" y="487.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">redondeado el reparto es aproximado. Dónde deja de valer: no separa regalías de otros costos del ingreso.</tspan></text><text x="470" y="534.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cifras: comunicado de resultados Q4 2025 de Spotify (consulta 2026-11-16).</tspan></text></svg>
