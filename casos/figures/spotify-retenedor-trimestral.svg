<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un trimestre con retenedor: medir el efecto compuesto de todo lo que se lanzó</title><desc id="d">Diagrama de un ciclo trimestral de reserva (holdback) en la experimentación de Spotify: al inicio se crea un grupo de usuarios exento de los experimentos del dominio; durante el trimestre los experimentos nunca lo asignan; al cierre se ejecuta una prueba en la que ese grupo recibe la experiencia combinada de todo lo lanzado, y luego se libera.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un trimestre con retenedor: medir el efecto compuesto de lo lanzado</tspan></text><rect x="20" y="60" width="200" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120" y="87" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="120" dy="0">Inicio del trimestre:</tspan></text><text x="120" y="103.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="120" dy="0">se crea el grupo</tspan></text><text x="120" y="120.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="120" dy="0">retenido</tspan></text><rect x="260" y="60" width="300" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="410" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">Durante el trimestre: los experimentos</tspan></text><text x="410" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">del dominio nunca asignan a esos</tspan></text><text x="410" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">usuarios</tspan></text><rect x="600" y="60" width="320" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="760" y="87" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="760" dy="0">Cierre: una sola prueba da a ese grupo la</tspan></text><text x="760" y="103.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="760" dy="0">experiencia combinada de todos los</tspan></text><text x="760" y="120.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="760" dy="0">cambios exitosos</tspan></text><polyline points="220,100 260,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="560,100 600,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="600" y="170" width="320" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="760" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="760" dy="0">Se libera el grupo y entra de nuevo en</tspan></text><text x="760" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="760" dy="0">los experimentos</tspan></text><polyline points="760,140 760,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="170" width="440" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Qué resuelve: cada experimento mide su efecto aislado; el</tspan></text><text x="240" y="223.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">retenedor mide el efecto acumulado y a largo plazo de lo</tspan></text><text x="240" y="240.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">que el equipo decidió lanzar.</tspan></text><rect x="20" y="285" width="440" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="322" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">Costo: un grupo de usuarios no recibe mejoras durante un</tspan></text><text x="240" y="338.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">trimestre y su tamaño debe bastar para detectar el efecto</tspan></text><text x="240" y="355.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">compuesto.</tspan></text><rect x="480" y="240" width="440" height="145" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="291.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Exclusividad: algunos experimentos se excluyen mutuamente</tspan></text><text x="700" y="307.82" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">porque pueden interactuar; por ahora solo lo son los de</tspan></text><text x="700" y="324.46" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">un mismo dominio, y Spotify planea desacoplar la</tspan></text><text x="700" y="341.1" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">exclusividad del dominio.</tspan></text><rect x="10" y="400" width="920" height="71.8" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="422.9" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: de izquierda a derecha, el ciclo del grupo retenido. Dónde deja de valer: la práctica es de un dominio del</tspan></text><text x="470" y="439.54" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">producto y de la plataforma de 2020; Spotify no publica la proporción retenida ni los resultados de los cierres</tspan></text><text x="470" y="456.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">trimestrales, y el costo del recuadro rojo es análisis propio.</tspan></text><text x="470" y="499.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Spotify Engineering, «Spotify&#x27;s New Experimentation Platform (Part 2)», noviembre de 2020 (F13). Dibujo propio.</tspan></text></svg>
