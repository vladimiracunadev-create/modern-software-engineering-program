<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 568" width="940" height="568" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Software de Spotify que sus propias fuentes documentan</title><desc id="d">Diagrama del software documentado de Spotify: Pub/Sub, Cloud Storage, BigQuery, Dataproc, Dataflow y Cloud SQL en la entrega de eventos; Java, Scala con Scio y una biblioteca de Python de 2007; Avro para esquemas; Puppet, Docker y el orquestador interno Helios; Backstage y PlanOut en las herramientas internas; Kafka y Hadoop en el sistema anterior.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="568" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Software de Spotify que sus propias fuentes documentan</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Datos y mensajería</tspan></text><rect x="10" y="92" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: Pub/Sub, Cloud Storage, Dataflow, Dataproc,</tspan></text><text x="235" y="129.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">BigQuery y Cloud SQL (F5); en 2016 adoptó además Cloud</tspan></text><text x="235" y="146.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Datastore y Cloud Bigtable y se alejó de Hadoop, MapReduce</tspan></text><text x="235" y="162.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">y Hive (F4).</tspan></text><rect x="10" y="184.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: el sistema anterior de eventos usaba Kafka y</tspan></text><text x="235" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">se apagó en febrero de 2017 (F5).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Lenguajes y formatos</tspan></text><rect x="480" y="92" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: Java para los clientes de Pub/Sub; Scala con</tspan></text><text x="705" y="129.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Scio sobre Beam y Dataflow en 2021; biblioteca de Python de</tspan></text><text x="705" y="146.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">2007 para convertir TSV a Avro; Avro para esquemas</tspan></text><text x="705" y="162.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">compatibles hacia atrás (F5, F5-bis).</tspan></text><rect x="480" y="184.4" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="205.34" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: lenguajes de los servicios de audio.</tspan></text><rect x="10" y="251.6" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="272.52" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Orquestación y entrega</tspan></text><rect x="10" y="293.6" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="314.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: Puppet instalaba dependencias como Docker y</tspan></text><text x="235" y="331.14" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Helios, el orquestador de contenedores interno, en cada</tspan></text><text x="235" y="347.78" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">máquina virtual (F5).</tspan></text><rect x="10" y="369.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="390.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: pruebas de integración de extremo a extremo,</tspan></text><text x="235" y="406.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">entorno de preparación y máquinas canario (F5).</tspan></text><rect x="480" y="235" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="255.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Herramientas de código abierto</tspan></text><rect x="480" y="277" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="297.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: Backstage es un marco de código abierto de la</tspan></text><text x="705" y="314.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">CNCF en incubación (F8).</tspan></text><rect x="480" y="336.2" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="357.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: la plataforma de experimentación usa PlanOut y</tspan></text><text x="705" y="373.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">SQL para métricas (F6).</tspan></text><rect x="480" y="395.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="416.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: Scio y bibliotecas propias de Pub/Sub se</tspan></text><text x="705" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">mencionan como extensiones propias (F5).</tspan></text><rect x="10" y="462.6" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="485.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: se agrupan por función; cada ítem lleva su fuente. Dónde deja de valer: son blogs de 2016 a 2021; no describen el</tspan></text><text x="470" y="502.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reproductor, la búsqueda ni la recomendación.</tspan></text><text x="470" y="545.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F4, F5, F5-bis, F6, F8.</tspan></text></svg>
