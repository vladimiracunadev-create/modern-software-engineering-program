<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 533" width="940" height="533" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué pasa cuando cae cada componente en lo que Spotify documenta</title><desc id="d">Diagrama de la tolerancia a fallos documentada de Spotify: un tipo de evento roto no frena a los demás; un cliente móvil sin conexión reenvía; el receptor caído espera en el cliente; la migración corrió ambos sistemas en paralelo; los despliegues usan canarios; el verificador de salud propio corrigió un fallo de reemplazo de máquinas; no se documentan pruebas de caos ni recuperación ante desastres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="533" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué pasa cuando cae cada componente en lo que Spotify documenta</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Un tipo de evento falla</tspan></text><rect x="10" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: aislamiento por tipo y vitalidad sobre</tspan></text><text x="235" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">tardanza: las particiones abiertas no bloquean a los demás</tspan></text><text x="235" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">tipos (F5).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">El receptor cae</tspan></text><rect x="480" y="92" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: los eventos esperan en el cliente y se</tspan></text><text x="705" y="129.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">reenvían con una política de reintento (F5-bis).</tspan></text><rect x="10" y="175.8" width="450" height="34" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="235" y="196.72" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="235" dy="0">Una máquina se reemplaza mal</tspan></text><rect x="10" y="217.8" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="238.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: el verificador de salud por defecto</tspan></text><text x="235" y="255.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">reemplazaba una máquina por otra con el mismo nombre y la</tspan></text><text x="235" y="271.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">infraestructura de configuración la rechazaba; escribieron</tspan></text><text x="235" y="288.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">el suyo (F5).</tspan></text><rect x="480" y="159.2" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="705" y="180.12" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="705" dy="0">Un cambio llega a producción</tspan></text><rect x="480" y="201.2" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="222.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: pruebas de extremo a extremo, entorno de</tspan></text><text x="705" y="238.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">preparación y canarios (F5).</tspan></text><rect x="10" y="318.2" width="450" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="339.12" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="235" dy="0">Una migración sale mal</tspan></text><rect x="10" y="360.2" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="381.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: ambos sistemas corrieron en paralelo para</tspan></text><text x="235" y="397.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">comparar completitud y se apagó el antiguo después (F5).</tspan></text><rect x="480" y="268.4" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="289.32" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Lo que no se documenta</tspan></text><rect x="480" y="310.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="331.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: pruebas de caos, recuperación ante desastres,</tspan></text><text x="705" y="347.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">copias de seguridad y degradación elegante del reproductor.</tspan></text><rect x="10" y="427.4" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="450.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cada recuadro es un fallo y su defensa. Dónde deja de valer: solo cubre la plataforma de datos y las herramientas,</tspan></text><text x="470" y="466.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no el audio.</tspan></text><text x="470" y="510.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F5, F5-bis.</tspan></text></svg>
