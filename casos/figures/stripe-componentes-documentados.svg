<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 439" width="940" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Piezas de Stripe documentadas en su ingeniería y sus docs</title><desc id="d">Diagrama de componentes: clientes de la API con una clave de idempotencia y una versión fija por cuenta; capa de límites de tasa y de descarte de carga; servicios de producto; una base de documentos propia (DocDB, sobre MongoDB) con más de 2.000 shards y más de 5 millones de consultas por segundo; y webhooks hacia el comercio con reintentos de hasta tres días.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="439" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Piezas de Stripe documentadas en su ingeniería y sus docs</tspan></text><rect x="20" y="60" width="170" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">Clientes de la API</tspan></text><text x="105" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">(clave de</tspan></text><text x="105" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">idempotencia)</tspan></text><rect x="240" y="60" width="200" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="340" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="340" dy="0">Límites de tasa y</tspan></text><text x="340" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="340" dy="0">descarte de carga</tspan></text><text x="340" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="340" dy="0">(4 tipos)</tspan></text><rect x="490" y="60" width="200" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="590" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">Servicios de producto</tspan></text><text x="590" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">(versión de API</tspan></text><text x="590" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">fijada por cuenta)</tspan></text><rect x="740" y="60" width="180" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">DocDB (MongoDB</tspan></text><text x="830" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">propio): 2.000+</tspan></text><text x="830" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">shards</tspan></text><polyline points="190,100 240,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="440,100 490,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,100 740,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="490" y="200" width="200" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">Eventos y webhooks</tspan></text><text x="590" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">(reintento hasta</tspan></text><text x="590" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">3 días)</tspan></text><rect x="20" y="200" width="170" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">Stripe.js y Elements</tspan></text><text x="105" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">(tokenizan la</tspan></text><text x="105" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">tarjeta)</tspan></text><rect x="240" y="200" width="200" height="80" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="340" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="340" dy="0">Detalles internos de</tspan></text><text x="340" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="340" dy="0">red y despliegue:</tspan></text><text x="340" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="340" dy="0">no se sabe</tspan></text><polyline points="590,140 590,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="105,200 105,140" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="740" y="200" width="180" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="830" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">Comercio recibe el</tspan></text><text x="830" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">evento (firmado)</tspan></text><polyline points="690,240 740,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="305" width="920" height="92.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="338.2" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la columna vertebral documentada es contrato estable (versionado por fecha), seguridad ante duplicados</tspan></text><text x="470" y="354.84" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(idempotencia) y protección de la capacidad (límites). No se sabe cómo se despliega ni cómo se conecta con cada red de</tspan></text><text x="470" y="371.48" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pagos. Dónde deja de valer: DocDB y los límites se describen en posts de 2017 a 2024; el estado actual puede diferir.</tspan></text><text x="470" y="425.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: blog de Stripe (idempotencia, límites de tasa, versionado 2017; DocDB 2024); docs de webhooks y de versionado.</tspan></text></svg>
