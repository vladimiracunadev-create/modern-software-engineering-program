<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" width="940" height="512" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Connect: una plataforma cobra a compradores y paga a sus vendedores, y Stripe mantiene las cuentas</title><desc id="d">Diagrama del flujo de dinero de una plataforma o marketplace con Stripe Connect: el comprador paga, la plataforma cobra con Stripe, Stripe retiene la comisión de la plataforma y paga automáticamente la parte que corresponde a cada vendedor mediante cuentas conectadas, cada una con capacidades y requisitos de verificación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="512" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Connect: la plataforma cobra y Stripe paga a cada vendedor</tspan></text><rect x="20" y="70" width="170" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105" y="108.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="105" dy="0">Comprador</tspan></text><rect x="230" y="70" width="200" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="330" y="99.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="330" dy="0">Plataforma (tu</tspan></text><text x="330" y="117.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="330" dy="0">marketplace)</tspan></text><rect x="470" y="70" width="180" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="560" y="99.96" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="560" dy="0">Stripe</tspan></text><text x="560" y="117.88" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="560" dy="0">(cobra y reparte)</tspan></text><rect x="690" y="40" width="230" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="805" y="63.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">Cuenta conectada A</tspan></text><text x="805" y="79.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">(vendedor)</tspan></text><rect x="690" y="110" width="230" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="805" y="133.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">Cuenta conectada B</tspan></text><text x="805" y="149.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">(vendedor)</tspan></text><polyline points="190,105 230,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="210" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">paga</tspan></text><polyline points="430,105 470,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="650,90 690,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="650,120 690,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="190" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="213.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Cuentas conectadas: la API de cuentas v2 crea una</tspan></text><text x="240" y="230.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">identidad unificada por cuenta con una o varias</tspan></text><text x="240" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">configuraciones (comerciante, cliente) y capacidades que</tspan></text><text x="240" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">se activan según la verificación.</tspan></text><rect x="480" y="190" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Qué ofrece Connect: aceptar pagos, pagar a las cuentas, y</tspan></text><text x="700" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">productos financieros integrados (tesorería, tarjetas,</tspan></text><text x="700" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">financiación) para plataformas de software.</tspan></text><rect x="20" y="295" width="440" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="322" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">Costo y límite: la plataforma asume la relación con el</tspan></text><text x="240" y="338.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">vendedor (soporte, disputas); Stripe no deja que las</tspan></text><text x="240" y="355.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">tarifas de disputa se trasladen a las cuentas conectadas.</tspan></text><rect x="480" y="295" width="440" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="322" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">Límites técnicos publicados: 30 cuentas conectadas</tspan></text><text x="700" y="338.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">creadas por segundo en modo real (5 en el entorno de</tspan></text><text x="700" y="355.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">pruebas).</tspan></text><rect x="10" y="390" width="920" height="71.8" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="412.9" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: de izquierda a derecha, el dinero del comprador pasa por la plataforma y Stripe lo reparte entre las cuentas</tspan></text><text x="470" y="429.54" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">conectadas. Dónde deja de valer: es un esquema de la documentación; no se publica cómo se liquida ni los plazos, y las</tspan></text><text x="470" y="446.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuentas v1 y v2 coexisten. No se sabe cuántas plataformas usan Connect.</tspan></text><text x="470" y="489.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Stripe Docs, «Connect» (F15) y «Rate limits» (F17); precios (F9). Dibujo propio.</tspan></text></svg>
