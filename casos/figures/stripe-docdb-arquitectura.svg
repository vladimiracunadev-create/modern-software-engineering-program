<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 547" width="940" height="547" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">DocDB: aplicaciones, proxies, servicio de metadatos de fragmentos y miles de fragmentos</title><desc id="d">Diagrama de la infraestructura de bases de datos de Stripe: las aplicaciones acceden a través de proxies escritos en Go que aplican control de admisión y de acceso; un servicio de metadatos asigna fragmentos de datos a las bases; cada base física es un conjunto de réplicas con nodo primario y secundarios; los cambios van por captura de datos a Kafka y de ahí a un almacén de objetos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="547" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">DocDB: aplicaciones, proxies, metadatos de fragmentos y miles de fragmentos</tspan></text><rect x="20" y="60" width="180" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="87" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="110" dy="0">Aplicaciones de</tspan></text><text x="110" y="103.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="110" dy="0">producto (usan una</tspan></text><text x="110" y="120.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="110" dy="0">base lógica)</tspan></text><rect x="240" y="60" width="190" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="335" y="78.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="335" dy="0">Proxies de base de</tspan></text><text x="335" y="95.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="335" dy="0">datos (en Go):</tspan></text><text x="335" y="111.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="335" dy="0">analizan, enrutan,</tspan></text><text x="335" y="128.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="335" dy="0">combinan</tspan></text><rect x="470" y="60" width="200" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="570" y="78.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="570" dy="0">Servicio de metadatos:</tspan></text><text x="570" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="570" dy="0">asigna cada fragmento de</tspan></text><text x="570" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="570" dy="0">datos a un fragmento de</tspan></text><text x="570" y="128.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="570" dy="0">base</tspan></text><rect x="710" y="60" width="210" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="815" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="815" dy="0">Plano de control: crea</tspan></text><text x="815" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="815" dy="0">bases lógicas y</tspan></text><text x="815" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="815" dy="0">colecciones</tspan></text><polyline points="200,100 240,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="430,100 470,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="170" width="640" height="130" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="34" y="192" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="34" dy="0">Más de 2.000 fragmentos (réplicas: un primario y varios secundarios)</tspan></text><rect x="40" y="205" width="130" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="105" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="105" dy="0">Fragmento 1</tspan></text><text x="105" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="105" dy="0">(base física)</tspan></text><rect x="190" y="205" width="130" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="255" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255" dy="0">Fragmento 2</tspan></text><text x="255" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255" dy="0">(base física)</tspan></text><rect x="340" y="205" width="130" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="405" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="405" dy="0">Fragmento 3</tspan></text><text x="405" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="405" dy="0">(base física)</tspan></text><rect x="490" y="205" width="130" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="555" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="555" dy="0">Fragmento 4</tspan></text><text x="555" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="555" dy="0">(base física)</tspan></text><polyline points="335,140 335,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="690" y="170" width="230" height="130" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="805" y="205.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="805" dy="0">CDC: el registro de</tspan></text><text x="805" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="805" dy="0">operaciones de cada</tspan></text><text x="805" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="805" dy="0">fragmento va a Kafka y se</tspan></text><text x="805" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="805" dy="0">archiva en un almacén de</tspan></text><text x="805" y="271.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="805" dy="0">objetos</tspan></text><polyline points="660,235 690,235" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="315" width="440" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="333.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Requisitos que no cubría una oferta existente:</tspan></text><text x="240" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">disponibilidad y durabilidad máximas, funciones mínimas</tspan></text><text x="240" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">expuestas, fragmentación horizontal, multiinquilino con</tspan></text><text x="240" y="383.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">cuotas y autorización fuerte.</tspan></text><rect x="480" y="315" width="440" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">Elección de base: MongoDB en 2011 por productividad del</tspan></text><text x="700" y="358.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">desarrollador frente a bases relacionales; no existía</tspan></text><text x="700" y="375.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">Atlas, así que se construyó una flota propia en la nube.</tspan></text><rect x="10" y="410" width="920" height="71.8" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="432.9" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la consulta entra por un proxy que decide a qué fragmentos ir gracias al servicio de metadatos y devuelve el</tspan></text><text x="470" y="449.54" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resultado combinado; debajo, los fragmentos, y a la derecha, el flujo de cambios. Dónde deja de valer: la descripción es de</tspan></text><text x="470" y="466.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2024; no se publica la topología de regiones ni cómo se despliega por zonas de disponibilidad.</tspan></text><text x="470" y="509.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Morzaria y Narkhede, «How Stripe&#x27;s document databases supported 99.999% uptime with zero-downtime data migrations», 6 de</tspan></text><text x="470" y="524.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">junio de 2024 (F8).</tspan></text></svg>
