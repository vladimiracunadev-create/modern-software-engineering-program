<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 399" width="940" height="399" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La escala de DocDB en 2024: cuatro magnitudes publicadas (escala logarítmica)</title><desc id="d">Barras horizontales en escala logarítmica con cuatro cantidades que Stripe publica de DocDB: más de 5 millones de consultas por segundo, más de 10.000 formas de consulta distintas, más de 5.000 colecciones y más de 2.000 fragmentos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="399" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La escala de DocDB en 2024: cuatro magnitudes publicadas (escala logarítmica)</tspan></text><line x1="274" y1="49" x2="274" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="201" x2="274" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">1 000</tspan></text><line x1="422.41" y1="49" x2="422.41" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="422.41" y1="201" x2="422.41" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="422.41" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422.41" dy="0">10 000</tspan></text><line x1="570.82" y1="49" x2="570.82" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="570.82" y1="201" x2="570.82" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="570.82" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="570.82" dy="0">100 000</tspan></text><line x1="719.23" y1="49" x2="719.23" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="719.23" y1="201" x2="719.23" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="719.23" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="719.23" dy="0">1 000 000</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="201" x2="867.64" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">10 000 000</tspan></text><line x1="274" y1="201" x2="867.64" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Consultas por segundo</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Formas de consulta distintas</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Colecciones</tspan></text><text x="264" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Fragmentos de base de datos</tspan></text><rect x="274" y="55" width="548.964" height="26" rx="3" fill="#102a43"/><text x="829.964" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="829.964" dy="0">5 M</tspan></text><rect x="274" y="93" width="148.41" height="26" rx="3" fill="#102a43"/><text x="429.41" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="429.41" dy="0">10 000</tspan></text><rect x="274" y="131" width="103.734" height="26" rx="3" fill="#102a43"/><text x="384.734" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="384.734" dy="0">5 000</tspan></text><rect x="274" y="169" width="44.6759" height="26" rx="3" fill="#102a43"/><text x="325.676" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="325.676" dy="0">2 000</tspan></text><text x="570.82" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="570.82" dy="0">Cantidad (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="259" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: las unidades no son comparables entre sí; la escala logarítmica solo permite ver el orden de magnitud de cada una.</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los datos son de más de 5.000 colecciones sobre petabytes de datos financieros. Dónde deja de valer: son cotas inferiores</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(«más de») de un momento de 2024 y no dicen cuántos datos hay por fragmento; en 2023 se redujo el número de fragmentos en</tspan></text><text x="470" y="333.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cerca de tres cuartas partes al agrupar bases infrautilizadas con 1,5 petabytes.</tspan></text><text x="470" y="381.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Morzaria y Narkhede, Stripe Blog, 6 de junio de 2024 (F8).</tspan></text></svg>
