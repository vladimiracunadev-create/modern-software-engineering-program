<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema del negocio de Stripe: valor, ingreso, actores y flujos</title><desc id="d">Diagrama del negocio de Stripe con cinco grupos: la propuesta de valor (cobrar con una API), el ingreso por comisión sobre el volumen de pagos y por productos de suscripción, los actores, los flujos de dinero entre cliente final, comercio, Stripe, redes y emisores, y los flujos de valor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema del negocio de Stripe: valor, ingreso, actores y flujos</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Propuesta de valor</tspan></text><rect x="10" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: infraestructura financiera programable que</tspan></text><text x="235" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">hace más fácil y barato empezar y escalar un negocio;</tspan></text><text x="235" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">integración por API (F1).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Ingreso</tspan></text><rect x="480" y="92" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: comisión por transacción exitosa (2,9 % + 30</tspan></text><text x="705" y="129.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">centavos con tarjeta nacional), más productos de pago por</tspan></text><text x="705" y="146.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">uso como Billing y Tax; la suite de ingresos recurrentes va</tspan></text><text x="705" y="162.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">camino de 1.000 millones de dólares anuales (F9, F2).</tspan></text><rect x="480" y="184.4" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="205.34" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: ingresos totales.</tspan></text><rect x="10" y="175.8" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="196.72" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Actores</tspan></text><rect x="10" y="217.8" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="238.7" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Cliente final, comercio, plataformas y sus vendedores,</tspan></text><text x="235" y="255.34" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">redes de tarjetas, bancos emisores y adquirentes,</tspan></text><text x="235" y="271.98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">reguladores y Stripe (F1, F15).</tspan></text><rect x="480" y="235" width="450" height="34" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="255.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="705" dy="0">Flujos de dinero</tspan></text><rect x="480" y="277" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="297.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Cliente final → comercio por medio de Stripe; Stripe →</tspan></text><text x="705" y="314.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">redes y emisores (comisión de intercambio, que el modelo</tspan></text><text x="705" y="331.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">«IC+» separa); Stripe → comercio (neto de comisión);</tspan></text><text x="705" y="347.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">plataforma → cuentas conectadas (F9, F15).</tspan></text><rect x="480" y="369.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="390.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: cuánto retiene Stripe tras los costos de</tspan></text><text x="705" y="406.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">intercambio ni su margen.</tspan></text><rect x="10" y="301.6" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="235" y="322.52" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="235" dy="0">Flujos de valor</tspan></text><rect x="10" y="343.6" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="364.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Cumplimiento (PCI, autenticación fuerte), tokenización y</tspan></text><text x="235" y="381.14" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">protección contra fraude hacia el comercio; datos de pago y</tspan></text><text x="235" y="397.78" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">conversión hacia Stripe (F13, F3).</tspan></text><rect x="10" y="436.6" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="459.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cinco grupos desde lo que se ofrece hasta cómo circulan dinero y valor. Dónde deja de valer: Stripe es privada y</tspan></text><text x="470" y="476.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no publica estados financieros; los flujos son los que la documentación describe.</tspan></text><text x="470" y="519.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F1, F2, F3, F9, F13, F15.</tspan></text></svg>
