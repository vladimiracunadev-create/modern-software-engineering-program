<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 446" width="940" height="446" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un cobro de extremo a extremo: tokenizar, crear la intención, confirmar y escuchar el resultado</title><desc id="d">Flujo documentado de un cobro con Stripe: el navegador tokeniza la tarjeta con Elements, el servidor del comercio crea un PaymentIntent con clave de idempotencia, el cliente confirma y, si se exige, completa la autenticación; Stripe emite eventos por webhook que el comercio procesa una sola vez registrando los identificadores de evento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="446" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un cobro de extremo a extremo: tokenizar, crear la intención, confirmar y escuchar el resultado</tspan></text><rect x="20" y="60" width="160" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="100" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="100" dy="0">1. Cliente teclea</tspan></text><text x="100" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="100" dy="0">en un Element</tspan></text><text x="100" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="100" dy="0">(se tokeniza)</tspan></text><rect x="200" y="60" width="160" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="280" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="280" dy="0">2. Servidor crea</tspan></text><text x="280" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="280" dy="0">PaymentIntent</tspan></text><text x="280" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="280" dy="0">(Idempotency-Key)</tspan></text><rect x="380" y="60" width="160" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="460" y="75.36" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="460" dy="0">3. Cliente</tspan></text><text x="460" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="460" dy="0">confirma;</tspan></text><text x="460" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="460" dy="0">autenticación</tspan></text><text x="460" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="460" dy="0">fuerte</tspan></text><text x="460" y="141.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="460" dy="0">si se exige</tspan></text><rect x="560" y="60" width="160" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="640" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="640" dy="0">4. Stripe autoriza</tspan></text><text x="640" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="640" dy="0">con la red y el</tspan></text><text x="640" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="640" dy="0">emisor</tspan></text><rect x="740" y="60" width="160" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="820" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">5. Webhook al</tspan></text><text x="820" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">comercio (evento</tspan></text><text x="820" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">firmado)</tspan></text><polyline points="180,105 200,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="360,105 380,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="540,105 560,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="720,105 740,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="200" y="200" width="160" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="280" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="280" dy="0">Reintento con la</tspan></text><text x="280" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="280" dy="0">misma clave: sin</tspan></text><text x="280" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="280" dy="0">doble cobro</tspan></text><polyline points="280,150 280,200" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="740" y="200" width="160" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="820" y="222" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="820" dy="0">Procesar una sola</tspan></text><text x="820" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="820" dy="0">vez: guardar el</tspan></text><text x="820" y="255.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="820" dy="0">id del evento</tspan></text><polyline points="820,150 820,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="380" y="200" width="340" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="550" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="550" dy="0">Si el webhook falla, Stripe reintenta hasta</tspan></text><text x="550" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="550" dy="0">tres días con espera exponencial (modo</tspan></text><text x="550" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="550" dy="0">real)</tspan></text><rect x="10" y="295" width="920" height="109" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="328.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: hay dos mecanismos de seguridad contra duplicados, uno en cada sentido: la clave de idempotencia protege la</tspan></text><text x="470" y="344.82" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">petición del comercio hacia Stripe y el registro de identificadores protege el evento de Stripe hacia el comercio. Dónde</tspan></text><text x="470" y="361.46" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">deja de valer: los eventos pueden llegar desordenados, por lo que no deben usarse como secuencia estricta; aquí se ha</tspan></text><text x="470" y="378.1" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">simplificado el flujo de pagos que requiere redirecciones.</tspan></text><text x="470" y="432" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: docs.stripe.com (payment intents, webhooks, idempotent requests); blog de Stripe sobre idempotencia (2017).</tspan></text></svg>
