<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 663" width="940" height="663" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una clave de idempotencia ante una respuesta perdida: el servidor devuelve el resultado guardado</title><desc id="d">Secuencia de un cobro con la cabecera Idempotency-Key cuando la respuesta se pierde: el servidor ejecuta el cobro y guarda el resultado; la conexión se corta antes de que el cliente lo reciba; el cliente reintenta con la misma clave y los mismos parámetros, y el servidor devuelve el resultado guardado sin cobrar otra vez.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="663" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una clave de idempotencia ante una respuesta perdida</tspan></text><rect x="20" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Cliente</tspan></text><text x="95" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">(comercio)</tspan></text><rect x="270" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="345" y="62" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">API de Stripe</tspan></text><text x="345" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">(capa de</tspan></text><text x="345" y="95.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">idempotencia)</tspan></text><rect x="520" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="595" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="595" dy="0">Almacén de</tspan></text><text x="595" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="595" dy="0">resultados</tspan></text><rect x="770" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="845" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845" dy="0">Red de tarjetas</tspan></text><text x="845" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845" dy="0">y emisor</tspan></text><line x1="95" y1="98" x2="95" y2="482" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="345" y1="98" x2="345" y2="482" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="595" y1="98" x2="595" y2="482" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="845" y1="98" x2="845" y2="482" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="95,130.76 345,130.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="123.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">1. POST con Idempotency-Key = K</tspan></text><polyline points="345,172.76 595,172.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="165.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">2. ¿existe K? no: registra K</tspan></text><polyline points="345,214.76 845,214.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="595" y="207.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="595" dy="0">3. ejecuta el cobro</tspan></text><polyline points="845,256.76 345,256.76" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="595" y="249.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="595" dy="0">4. aprobado</tspan></text><polyline points="345,298.76 595,298.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="291.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">5. guarda el resultado de K</tspan></text><polyline points="345,340.76 95,340.76" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="220" y="333.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">6. conexión cortada: el cliente no ve la respuesta</tspan></text><polyline points="95,382.76 345,382.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="375.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">7. reintenta con la misma K y parámetros</tspan></text><polyline points="345,424.76 595,424.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="417.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">8. compara parámetros y busca K</tspan></text><polyline points="345,466.76 95,466.76" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="220" y="459.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">9. devuelve el resultado guardado</tspan></text><rect x="10" y="492" width="920" height="105" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="514.86" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: las flechas continuas son peticiones y las discontinuas respuestas; el paso 6 es el fallo ambiguo (el cliente no</tspan></text><text x="470" y="531.5" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sabe si el cobro ocurrió). Si en el paso 7 los parámetros difieren de los de la petición original, la capa de idempotencia</tspan></text><text x="470" y="548.14" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">devuelve un error para evitar un uso erróneo. Dónde deja de valer: la descripción de los pasos internos 2, 5 y 8 es una</tspan></text><text x="470" y="564.78" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lectura de lo que la documentación dice que ocurre; no se sabe cómo está implementado el almacén. Evita cobros duplicados</tspan></text><text x="470" y="581.42" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por reintento, no cobros equivocados.</tspan></text><text x="470" y="625" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Leach, «Designing robust and predictable APIs with idempotency» (F4); Stripe Docs, «Idempotent requests» (F10). Secuencia</tspan></text><text x="470" y="640" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">propia.</tspan></text></svg>
