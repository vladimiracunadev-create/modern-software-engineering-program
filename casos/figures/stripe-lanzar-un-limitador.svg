<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 508" width="940" height="508" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo lanzar un limitador sin romper a nadie: los seis cuidados que Stripe recomienda</title><desc id="d">Flujo de buenas prácticas de lanzamiento de un limitador de tasa según Stripe: engancharlo al middleware de forma que un error del limitador o de Redis no afecte a las peticiones (fallar abierto), devolver 429 o 503 con mensajes accionables, tener interruptores para apagarlo, alertas y métricas, y lanzarlo en modo oscuro para ver qué bloquearía antes de bloquear.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="508" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo lanzar un limitador sin romper a nadie: seis cuidados</tspan></text><rect x="20" y="60" width="140" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="90" y="88.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90" dy="0">1. Enganchar con</tspan></text><text x="90" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90" dy="0">seguridad: si</tspan></text><text x="90" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90" dy="0">falla,</tspan></text><text x="90" y="138.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90" dy="0">fallar abierto</tspan></text><rect x="170" y="60" width="140" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="80.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">2. Errores</tspan></text><text x="240" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">claros:</tspan></text><text x="240" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">429 o 503 y</tspan></text><text x="240" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">mensaje</tspan></text><text x="240" y="146.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">accionable</tspan></text><rect x="320" y="60" width="140" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="390" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">3. Interruptores</tspan></text><text x="390" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">para apagarlo</tspan></text><text x="390" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">(banderas)</tspan></text><rect x="470" y="60" width="140" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="88.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">4. Alertas y</tspan></text><text x="540" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">métricas de</tspan></text><text x="540" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">cuántas</tspan></text><text x="540" y="138.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">veces se activa</tspan></text><rect x="620" y="60" width="140" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="690" y="88.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="690" dy="0">5. Lanzar en</tspan></text><text x="690" y="105.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="690" dy="0">modo</tspan></text><text x="690" y="121.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="690" dy="0">oscuro: ver qué</tspan></text><text x="690" y="138.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="690" dy="0">bloquearía</tspan></text><rect x="770" y="60" width="140" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="840" y="80.36" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">6. Ajustar</tspan></text><text x="840" y="97" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">umbrales;</tspan></text><text x="840" y="113.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">trabajar con</tspan></text><text x="840" y="130.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">usuarios</tspan></text><text x="840" y="146.92" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">afectados</tspan></text><polyline points="160,110 170,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="310,110 320,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="460,110 470,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,110 620,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="760,110 770,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="185" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="208.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Implementación: algoritmo de cubo de fichas con un</tspan></text><text x="240" y="225.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">anfitrión centralizado; cada usuario tiene su cubo; cada</tspan></text><text x="240" y="241.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">petición toma una ficha y el cubo se rellena poco a poco;</tspan></text><text x="240" y="258.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">con el cubo vacío se rechaza. Se usa Redis.</tspan></text><rect x="480" y="185" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="217" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Mismo comportamiento en modo de pruebas y en modo real:</tspan></text><text x="700" y="233.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">los scripts no encuentran efectos distintos al pasar a</tspan></text><text x="700" y="250.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">producción.</tspan></text><rect x="20" y="290" width="440" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">Costo: el limitador es un componente más que puede</tspan></text><text x="240" y="333.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">fallar; por eso se diseña para fallar abierto y con</tspan></text><text x="240" y="350.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">interruptores.</tspan></text><rect x="480" y="290" width="440" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">Orden recomendado: empezar por el limitador de tasa de</tspan></text><text x="700" y="333.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">peticiones y añadir los otros tres con el tiempo, según</tspan></text><text x="700" y="350.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">la necesidad.</tspan></text><rect x="10" y="386" width="920" height="71.8" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="408.9" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: de izquierda a derecha, el orden de un lanzamiento seguro; los recuadros de abajo dicen cómo funciona y qué</tspan></text><text x="470" y="425.54" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuesta. Dónde deja de valer: es la práctica descrita en 2017; no se publica cómo está implementado hoy ni cuántas</tspan></text><text x="470" y="442.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">peticiones rechaza.</tspan></text><text x="470" y="485.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Tarjan, «Scaling your API with rate limiters» (F5), secciones «Building rate limiters in practice» y «Conclusion».</tspan></text></svg>
