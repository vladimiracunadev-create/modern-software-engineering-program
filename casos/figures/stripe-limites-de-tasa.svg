<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 511" width="940" height="511" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Límites de tasa publicados en la documentación de Stripe (peticiones por segundo)</title><desc id="d">Barras horizontales con los límites de tasa de la documentación: 100 peticiones por segundo globales en modo real, 25 en el entorno de pruebas, 25 por punto final, 20 para lectura y para escritura de archivos, 15 creaciones de pagos a cuentas y 30 creaciones de cuentas conectadas en modo real.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="511" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Límites de tasa publicados en la documentación de Stripe (peticiones por segundo)</tspan></text><line x1="284" y1="49" x2="284" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="313" x2="284" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="405.564" y1="49" x2="405.564" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="405.564" y1="313" x2="405.564" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="405.564" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="405.564" dy="0">20</tspan></text><line x1="527.128" y1="49" x2="527.128" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="527.128" y1="313" x2="527.128" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="527.128" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527.128" dy="0">40</tspan></text><line x1="648.692" y1="49" x2="648.692" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="648.692" y1="313" x2="648.692" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="648.692" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.692" dy="0">60</tspan></text><line x1="770.256" y1="49" x2="770.256" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="770.256" y1="313" x2="770.256" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="770.256" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="770.256" dy="0">80</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="313" x2="891.82" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">100</tspan></text><line x1="284" y1="313" x2="891.82" y2="313" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Global, modo real</tspan></text><text x="274" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Global, entorno de pruebas</tspan></text><text x="274" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Cada punto final (salvo</tspan></text><text x="274" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">excepciones)</tspan></text><text x="274" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Archivos, lectura y escritura</tspan></text><text x="274" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Pagos a cuentas, creación</tspan></text><text x="274" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Cuentas conectadas, creación (real)</tspan></text><rect x="284" y="55" width="607.82" height="32" rx="3" fill="#087f8c"/><text x="898.82" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="284" y="99" width="151.955" height="32" rx="3" fill="#087f8c"/><text x="442.955" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442.955" dy="0">25</tspan></text><rect x="284" y="143" width="151.955" height="32" rx="3" fill="#087f8c"/><text x="442.955" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442.955" dy="0">25</tspan></text><rect x="284" y="187" width="121.564" height="32" rx="3" fill="#087f8c"/><text x="412.564" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="412.564" dy="0">20</tspan></text><rect x="284" y="231" width="91.173" height="32" rx="3" fill="#087f8c"/><text x="382.173" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="382.173" dy="0">15</tspan></text><rect x="284" y="275" width="182.346" height="32" rx="3" fill="#087f8c"/><text x="473.346" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="473.346" dy="0">30</tspan></text><text x="587.91" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="587.91" dy="0">Peticiones por segundo</tspan></text><rect x="10" y="371" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="395.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el límite global es cuatro veces el de cada punto final y el entorno de pruebas se limita a un cuarto del modo</tspan></text><text x="470" y="412.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">real; así un script descontrolado en pruebas no daña a otros. La documentación añade límites de otra forma (1.000</tspan></text><text x="470" y="429.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">actualizaciones por intención de pago por hora; 10 facturas nuevas por suscripción por minuto). Dónde deja de valer: son</tspan></text><text x="470" y="445.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">límites por cuenta y pueden cambiar; una cuenta con acuerdo especial puede tener otros.</tspan></text><text x="470" y="493.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Stripe Docs, «Rate limits» (F17), consulta del 2026-11-16.</tspan></text></svg>
