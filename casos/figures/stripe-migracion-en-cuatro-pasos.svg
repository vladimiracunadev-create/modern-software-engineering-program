<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Migración en línea en cuatro pasos: el caso de cientos de millones de suscripciones</title><desc id="d">Diagrama de los cuatro pasos del patrón de migración en línea de Stripe con la migración de suscripciones: escribir en la tabla vieja y la nueva y rellenar los datos antiguos desde un proceso offline en Hadoop, cambiar las lecturas verificadas con experimentos de comparación, cambiar las escrituras y eliminar los datos antiguos; con un segundo por objeto tomaría más de tres años migrar cien millones secuencialmente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="528" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Migración en línea en cuatro pasos: cientos de millones de suscripciones</tspan></text><rect x="20" y="60" width="210" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="125" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">1. Escritura doble</tspan></text><text x="125" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">en tabla vieja y</tspan></text><text x="125" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">tabla nueva</tspan></text><rect x="20" y="165" width="210" height="130" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="208.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">Rellenar lo antiguo desde</tspan></text><text x="125" y="225.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">un proceso offline</tspan></text><text x="125" y="241.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">(MapReduce) para no cargar</tspan></text><text x="125" y="258.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">la base de producción.</tspan></text><rect x="245" y="60" width="210" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="350" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">2. Cambiar las</tspan></text><text x="350" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">lecturas a la</tspan></text><text x="350" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">tabla nueva</tspan></text><rect x="245" y="165" width="210" height="130" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="350" y="217" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">Verificar con experimentos</tspan></text><text x="350" y="233.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">que leen ambas y alertan</tspan></text><text x="350" y="250.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">si difieren (Scientist).</tspan></text><rect x="470" y="60" width="210" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="575" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="575" dy="0">3. Cambiar las</tspan></text><text x="575" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="575" dy="0">escrituras: primero</tspan></text><text x="575" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="575" dy="0">la nueva</tspan></text><rect x="470" y="165" width="210" height="130" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="575" y="208.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575" dy="0">El refactor más difícil:</tspan></text><text x="575" y="225.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575" dy="0">miles de líneas en varios</tspan></text><text x="575" y="241.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575" dy="0">servicios, en trozos muy</tspan></text><text x="575" y="258.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575" dy="0">pequeños.</tspan></text><rect x="695" y="60" width="210" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="800" y="92" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800" dy="0">4. Borrar lo</tspan></text><text x="800" y="108.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800" dy="0">antiguo y apagar</tspan></text><text x="800" y="125.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800" dy="0">la ruta vieja</tspan></text><rect x="695" y="165" width="210" height="130" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="800" y="208.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800" dy="0">La tabla nueva es la</tspan></text><text x="800" y="225.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800" dy="0">fuente de verdad; se vacía</tspan></text><text x="800" y="241.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800" dy="0">el campo antiguo de forma</tspan></text><text x="800" y="258.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800" dy="0">perezosa.</tspan></text><polyline points="230,105 245,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="455,105 470,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="680,105 695,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="310" width="440" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="328.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">Por qué importa el método: a un segundo por objeto, 100</tspan></text><text x="240" y="345.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">millones de objetos tardarían más de tres años en</tspan></text><text x="240" y="361.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">secuencia; hay que paralelizar y hacerlo sin ventana de</tspan></text><text x="240" y="378.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">mantenimiento.</tspan></text><rect x="480" y="310" width="440" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="337" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">Principios: pasos incrementales (nunca más de unos</tspan></text><text x="700" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">cientos de líneas a la vez), transparencia y</tspan></text><text x="700" y="370.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">observabilidad en cada paso.</tspan></text><rect x="10" y="406" width="920" height="71.8" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="428.9" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: arriba, los cuatro pasos; debajo, qué se hizo en cada uno. La cuenta de tres años es aritmética de la propia</tspan></text><text x="470" y="445.54" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fuente: 10^8 segundos son unos 3,2 años. Dónde deja de valer: es una migración de datos de la facturación de suscripciones,</tspan></text><text x="470" y="462.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 2017; el patrón es general pero cada paso tiene riesgos propios, y la fuente no cuenta qué incidencias aparecieron.</tspan></text><text x="470" y="505.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Xu, «Online migrations at scale», Stripe Blog, 2 de febrero de 2017 (F7).</tspan></text></svg>
