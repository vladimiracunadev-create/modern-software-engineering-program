<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 518" width="940" height="518" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La plataforma de movimiento de datos: seis pasos para mover un fragmento sin parar el servicio</title><desc id="d">Flujo de los seis pasos de la plataforma de movimiento de datos de Stripe: registrar la intención de migración, importar en bloque los datos desde una instantánea, replicar de forma asíncrona las escrituras desde el instante de la instantánea, comprobar la corrección, conmutar el tráfico y cancelar el registro de la migración; la replicación es bidireccional para poder volver atrás.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="518" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Plataforma de movimiento de datos: seis pasos sin parar el servicio</tspan></text><rect x="20" y="60" width="140" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="90" y="88.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90" dy="0">1. Registrar la</tspan></text><text x="90" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90" dy="0">migración y</tspan></text><text x="90" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90" dy="0">crear</tspan></text><text x="90" y="138.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90" dy="0">índices</tspan></text><rect x="170" y="60" width="140" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="88.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">2. Importar en</tspan></text><text x="240" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">bloque</tspan></text><text x="240" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">una instantánea</tspan></text><text x="240" y="138.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">en T</tspan></text><rect x="320" y="60" width="140" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="390" y="88.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">3. Replicar</tspan></text><text x="390" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">escrituras</tspan></text><text x="390" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">desde T (CDC,</tspan></text><text x="390" y="138.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">bidireccional)</tspan></text><rect x="470" y="60" width="140" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">4. Comprobar</tspan></text><text x="540" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">corrección con</tspan></text><text x="540" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">instantáneas</tspan></text><rect x="620" y="60" width="140" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="690" y="88.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="690" dy="0">5. Conmutar el</tspan></text><text x="690" y="105.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="690" dy="0">tráfico</tspan></text><text x="690" y="121.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="690" dy="0">(compuerta</tspan></text><text x="690" y="138.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="690" dy="0">por versión)</tspan></text><rect x="770" y="60" width="140" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="840" y="88.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="840" dy="0">6. Cerrar el</tspan></text><text x="840" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="840" dy="0">registro</tspan></text><text x="840" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="840" dy="0">y borrar del</tspan></text><text x="840" y="138.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="840" dy="0">origen</tspan></text><polyline points="160,110 170,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="310,110 320,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="460,110 470,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,110 620,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="760,110 770,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="185" width="440" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="205.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Truco de rendimiento: el volcado en bloque era lento;</tspan></text><text x="240" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">ordenar los datos por los atributos de índice más comunes</tspan></text><text x="240" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">(la base usa un árbol B) y escribirlos en orden mejoró la</tspan></text><text x="240" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">proximidad de las escrituras y subió el rendimiento diez</tspan></text><text x="240" y="271.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">veces.</tspan></text><rect x="480" y="185" width="440" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="213.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">Por qué la replicación es bidireccional y marcada:</tspan></text><text x="700" y="230.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">permite volver al origen si surge un problema tras la</tspan></text><text x="700" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">conmutación; las escrituras replicadas se etiquetan para</tspan></text><text x="700" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">evitar ciclos.</tspan></text><rect x="20" y="300" width="440" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="318.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Usos: dividir fragmentos al subir el tráfico, agrupar</tspan></text><text x="240" y="335.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">miles de bases infrautilizadas (1,5 petabytes en 2023,</tspan></text><text x="240" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">menos fragmentos en cerca de tres cuartas partes) y</tspan></text><text x="240" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">actualizar la versión de la base de una vez.</tspan></text><rect x="480" y="300" width="440" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="327" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Requisitos que dirigen el diseño: consistencia y</tspan></text><text x="700" y="343.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">completitud, disponibilidad, granularidad, y ningún</tspan></text><text x="700" y="360.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">impacto en el fragmento de origen.</tspan></text><rect x="10" y="396" width="920" height="71.8" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="418.9" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: de izquierda a derecha los pasos; los recuadros de abajo explican el truco de rendimiento, la reversibilidad, los</tspan></text><text x="470" y="435.54" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">usos y los requisitos. Dónde deja de valer: es una infraestructura construida para una flota de miles de fragmentos; no es</tspan></text><text x="470" y="452.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una receta para una base de datos pequeña.</tspan></text><text x="470" y="495.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Morzaria y Narkhede (F8). Resumen propio.</tspan></text></svg>
