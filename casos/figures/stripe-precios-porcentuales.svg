<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Las tarifas porcentuales de la lista de precios de Stripe (porcentaje del importe)</title><desc id="d">Barras horizontales con las tarifas porcentuales de la página de precios: tarjeta nacional 2,9 por ciento más 30 centavos, recargo de 0,5 por ciento por tarjeta tecleada a mano, 1,5 por ciento por tarjeta internacional, 1 por ciento por conversión de moneda, Billing 0,7 por ciento del volumen, débito ACH 0,8 por ciento con tope de 5 dólares, Tax 0,5 por ciento por transacción, pagos con stablecoins 1,5 por ciento y Instant Payouts 1,5 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Las tarifas porcentuales de la lista de precios de Stripe (porcentaje del importe)</tspan></text><line x1="294" y1="49" x2="294" y2="391" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="391" x2="294" y2="396" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="493.273" y1="49" x2="493.273" y2="391" stroke="#d5dde1" stroke-width="1"/><line x1="493.273" y1="391" x2="493.273" y2="396" stroke="#5b7280" stroke-width="1.4"/><text x="493.273" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="493.273" dy="0">1</tspan></text><line x1="692.547" y1="49" x2="692.547" y2="391" stroke="#d5dde1" stroke-width="1"/><line x1="692.547" y1="391" x2="692.547" y2="396" stroke="#5b7280" stroke-width="1.4"/><text x="692.547" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692.547" dy="0">2</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="391" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="391" x2="891.82" y2="396" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">3</tspan></text><line x1="294" y1="391" x2="891.82" y2="391" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Tarjeta nacional (más 30 centavos)</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Tarjeta internacional (recargo)</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Pagos con stablecoins</tspan></text><text x="284" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Instant Payouts (mín. 50 centavos)</tspan></text><text x="284" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Conversión de moneda (recargo)</tspan></text><text x="284" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">ACH débito (tope 5 dólares)</tspan></text><text x="284" y="300.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Billing (volumen)</tspan></text><text x="284" y="338.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Tarjeta tecleada a mano (recargo)</tspan></text><text x="284" y="376.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Tax, por transacción</tspan></text><rect x="294" y="55" width="577.893" height="26" rx="3" fill="#087f8c"/><text x="878.893" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="878.893" dy="0">2,9</tspan></text><rect x="294" y="93" width="298.91" height="26" rx="3" fill="#087f8c"/><text x="599.91" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="599.91" dy="0">1,5</tspan></text><rect x="294" y="131" width="298.91" height="26" rx="3" fill="#087f8c"/><text x="599.91" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="599.91" dy="0">1,5</tspan></text><rect x="294" y="169" width="298.91" height="26" rx="3" fill="#087f8c"/><text x="599.91" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="599.91" dy="0">1,5</tspan></text><rect x="294" y="207" width="199.273" height="26" rx="3" fill="#087f8c"/><text x="500.273" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="500.273" dy="0">1,0</tspan></text><rect x="294" y="245" width="159.419" height="26" rx="3" fill="#087f8c"/><text x="460.419" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="460.419" dy="0">0,8</tspan></text><rect x="294" y="283" width="139.491" height="26" rx="3" fill="#087f8c"/><text x="440.491" y="300.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="440.491" dy="0">0,7</tspan></text><rect x="294" y="321" width="99.6367" height="26" rx="3" fill="#087f8c"/><text x="400.637" y="338.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="400.637" dy="0">0,5</tspan></text><rect x="294" y="359" width="99.6367" height="26" rx="3" fill="#087f8c"/><text x="400.637" y="376.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="400.637" dy="0">0,5</tspan></text><text x="592.91" y="435" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592.91" dy="0">Porcentaje del importe</tspan></text><rect x="10" y="449" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="473.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la tarjeta nacional es la tarifa más alta de la lista y los demás conceptos son recargos o servicios aparte, que</tspan></text><text x="470" y="490.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se suman. Hay tarifas fijas que no caben en la escala (30 centavos por transacción, 15 dólares por disputa recibida). Dónde</tspan></text><text x="470" y="507.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">deja de valer: son tarifas estándar de una lista consultada en 2026; los precios por país y los acuerdos personalizados</tspan></text><text x="470" y="523.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(IC+) son otros; y un recargo se suma a la tarifa base, no la sustituye.</tspan></text><text x="470" y="571.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: stripe.com/pricing (F9), consulta del 2026-11-16.</tspan></text></svg>
