<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 505" width="940" height="505" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El camino de un número de tarjeta: del componente tokenizado a la bóveda de datos de tarjeta</title><desc id="d">Diagrama del manejo de datos de tarjeta en Stripe: el cliente teclea el número en un componente de interfaz que lo envía a Stripe sin pasar por el servidor del comercio; los números se tokenizan en una bóveda aislada, cifrados con AES-256 con claves en otras máquinas; ningún servidor interno ve el número en claro y solo se envía a proveedores de una lista estática; todo el tráfico entre servidores usa TLS mutuo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="505" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El camino de un número de tarjeta: del componente a la bóveda</tspan></text><rect x="20" y="60" width="190" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="115" y="87" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="115" dy="0">Cliente final teclea la</tspan></text><text x="115" y="103.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="115" dy="0">tarjeta en un</tspan></text><text x="115" y="120.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="115" dy="0">componente (Elements)</tspan></text><rect x="250" y="60" width="200" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="350" y="78.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="350" dy="0">Stripe recibe el número</tspan></text><text x="350" y="95.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="350" dy="0">directo; el servidor del</tspan></text><text x="350" y="111.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="350" dy="0">comercio solo ve un</tspan></text><text x="350" y="128.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="350" dy="0">token</tspan></text><rect x="490" y="60" width="200" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="590" y="78.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">Bóveda de datos de</tspan></text><text x="590" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">tarjeta (aislada; acceso</tspan></text><text x="590" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">a pocos ingenieros,</tspan></text><text x="590" y="128.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">revisado cada trimestre)</tspan></text><rect x="730" y="60" width="190" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="825" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="825" dy="0">Proveedor de servicios</tspan></text><text x="825" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="825" dy="0">en una lista de</tspan></text><text x="825" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="825" dy="0">permitidos</tspan></text><polyline points="210,100 250,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,100 490,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,100 730,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="165" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="188.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Cifrado en reposo con AES-256; las claves de descifrado</tspan></text><text x="240" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">se guardan en máquinas distintas; los números se</tspan></text><text x="240" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">tokenizan internamente para aislarlos del resto de la</tspan></text><text x="240" y="238.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">infraestructura.</tspan></text><rect x="480" y="165" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Ningún servidor o proceso interno obtiene el número en</tspan></text><text x="700" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">claro; pueden pedir que se envíe a un proveedor de la</tspan></text><text x="700" y="230.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">lista estática.</tspan></text><rect x="20" y="270" width="440" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Transporte: HTTPS obligatorio, HSTS, TLS 1.2 como mínimo</tspan></text><text x="240" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">y TLS mutuo en toda la comunicación entre servidores.</tspan></text><rect x="480" y="270" width="440" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">Cumplimiento: certificado PCI de proveedor de servicios</tspan></text><text x="700" y="313.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">de nivel 1; informes SOC 1, 2 y 3; ayuda a completar el</tspan></text><text x="700" y="330.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">formulario de autoevaluación según la integración.</tspan></text><rect x="10" y="366" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="388.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el número viaja de izquierda a derecha y en ningún punto toca el servidor del comercio ni el de Stripe en claro;</tspan></text><text x="470" y="405.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lo que cruza el sistema es un token. Dónde deja de valer: son afirmaciones de la documentación de seguridad de Stripe; no</tspan></text><text x="470" y="422.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se publican auditorías ni incidentes, y la bóveda aislada no es visible desde fuera. Un comercio que no usa componentes de</tspan></text><text x="470" y="438.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Stripe tiene un alcance de PCI mayor.</tspan></text><text x="470" y="482.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Stripe Docs, «Security at Stripe» (F13) y «Elements» (F14). Dibujo propio.</tspan></text></svg>
