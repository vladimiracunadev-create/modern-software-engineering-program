8" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Costo efectivo (% del monto)</text><text x="490.54" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Monto del cobro (USD) (escala logarítmica)</tspan></text><polyline points="89.08,210 248.837,264 369.688,282 490.54,291 650.297,296.4 771.148,298.2 892,299.1" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="89.08" cy="210" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="89.08" y="199" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">5,9 %</tspan></text><circle cx="248.837" cy="264" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="369.688" cy="282" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="490.54" cy="291" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="650.297" cy="296.4" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="771.148" cy="298.2" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="892" cy="299.1" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="323.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">2,9 %</tspan></text><polyline points="89.08,165 248.837,219 369.688,237 490.54,246 650.297,251.4 771.148,253.2 892,254.1" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="159.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="89.08" y="154" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5"