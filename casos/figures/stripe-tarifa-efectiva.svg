95,229.05" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="213.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">5,4 %</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cálculo del autor con la tarifa pública estándar para tarjetas (2,9 % + 30 ¢ nacional, +1,5 % internacional, +1 % si hay</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">conversión). La parte fija domina los montos pequeños y el porcentaje converge al 2,9 % en los grandes. Dónde deja de</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: los acuerdos personalizados (IC+, descuentos por volumen) y otros métodos de pago tienen otras tarifas, y el precio</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">varía por país y cambia con el tiempo.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: stripe.com/pricing, tarifa estándar (consulta 2026-11-16). Cálculo propio.</tspan></text></svg>
