<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo efectivo de la tarifa estándar de Stripe según el monto cobrado</title><desc id="d">Líneas de costo efectivo en porcentaje frente al monto del cobro, con eje horizontal logarítmico: con tarjeta nacional una venta de 10 dólares paga 5,9 por ciento y una de 1.000 dólares paga 2,9; con tarjeta internacional se suma 1,5 puntos y con conversión de moneda otro punto, de modo que la tarifa fija de 30 centavos pesa mucho en los montos pequeños.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo efectivo de la tarifa estándar de Stripe según el monto cobrado</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Tarjeta nacional (2,9 % + 30 ¢)</tspan></text><rect x="297.74" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="317.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="317.74" dy="0">Internacional (+1,5 %)</tspan></text><polygon points="517.62,44.1 524.22,56.4 511.02,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="531.62" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="531.62" dy="0">Internacional con conversión (+1 