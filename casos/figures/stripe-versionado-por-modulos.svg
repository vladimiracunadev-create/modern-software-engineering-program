<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 519" width="940" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo responde la API a cada versión: se formatea en la versión actual y se retrocede módulo a módulo</title><desc id="d">Diagrama del mecanismo de versionado de Stripe: la respuesta se construye en la versión más reciente y luego se aplican en orden inverso los módulos de cambio de versión hasta llegar a la versión objetivo, que sale de la cabecera Stripe-Version, de la versión de una aplicación OAuth o de la versión fijada de la cuenta en su primera petición.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="519" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo responde la API a cada versión: se retrocede módulo a módulo</tspan></text><rect x="20" y="55" width="200" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="120" y="90.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120" dy="0">Respuesta construida en</tspan></text><text x="120" y="106.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120" dy="0">la versión actual</tspan></text><rect x="260" y="55" width="190" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="355" y="82" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="355" dy="0">Módulo de cambio</tspan></text><text x="355" y="98.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="355" dy="0">2017-05-25</tspan></text><text x="355" y="115.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="355" dy="0">(retrocede)</tspan></text><rect x="480" y="55" width="190" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="575" y="90.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="575" dy="0">Módulo 2017-04-06</tspan></text><text x="575" y="106.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="575" dy="0">(retrocede)</tspan></text><rect x="700" y="55" width="220" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="810" y="90.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="810" dy="0">...hasta la versión</tspan></text><text x="810" y="106.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="810" dy="0">objetivo del cliente</tspan></text><polyline points="220,95 260,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,95 480,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="670,95 700,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="160" width="290" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="165" y="180.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">La versión objetivo sale de: 1) la</tspan></text><text x="165" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">cabecera Stripe-Version, 2) la</tspan></text><text x="165" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">versión de la aplicación OAuth, o 3)</tspan></text><text x="165" y="230.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">la versión fijada de la cuenta en su</tspan></text><text x="165" y="246.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">primera petición.</tspan></text><rect x="325" y="160" width="290" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="188.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Cada módulo declara documentación,</tspan></text><text x="470" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">una transformación y los recursos que</tspan></text><text x="470" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">toca; el registro de cambios y la</tspan></text><text x="470" y="238.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">documentación se generan de ahí.</tspan></text><rect x="630" y="160" width="290" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="775" y="188.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="775" dy="0">Cambios con efectos laterales: la</tspan></text><text x="775" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="775" dy="0">transformación es nula y se comprueba</tspan></text><text x="775" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="775" dy="0">en otras partes del código; son más</tspan></text><text x="775" y="238.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="775" dy="0">difíciles de mantener y se evitan.</tspan></text><rect x="20" y="275" width="440" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="298.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Versiones rodantes con fecha (2017-05-24): cada una es</tspan></text><text x="240" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">incompatible hacia atrás pero con pocos cambios, para que</tspan></text><text x="240" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">actualizarse sea incremental; no hay una gran «v2» que</tspan></text><text x="240" y="348.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">obligue a reintegrar todo.</tspan></text><rect x="480" y="275" width="440" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="298.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">Reglas de compatibilidad: los campos presentes siguen</tspan></text><text x="700" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">presentes y conservan nombre y tipo; añadir un campo o un</tspan></text><text x="700" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">punto final es seguro; cambiar un booleano por un estado,</tspan></text><text x="700" y="348.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">como en 2014, rompe a los clientes.</tspan></text><rect x="10" y="380" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="402.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la respuesta viaja hacia el pasado por una cadena de transformaciones y el desarrollador que construye un producto</tspan></text><text x="470" y="419.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">nuevo apenas piensa en las versiones viejas. Dónde deja de valer: el código del artículo es de 2017 y es Ruby; Stripe dice</tspan></text><text x="470" y="436.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que mantiene compatibilidad con todas las versiones desde 2011 pero no publica cuántos módulos hay ni su costo de</tspan></text><text x="470" y="452.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mantenimiento.</tspan></text><text x="470" y="496.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leach, «APIs as infrastructure: future-proofing Stripe with versioning», Stripe Blog, 5 de agosto de 2017 (F6).</tspan></text></svg>
