<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Volumen total de pagos procesado por Stripe (billones de dólares, 10^12)</title><desc id="d">Barras con el volumen de pagos que pasa por Stripe: 1,0 billones de dólares en 2023, 1,4 en 2024 (38 por ciento más) y 1,9 en 2025 (34 por ciento más); cada año se añaden cantidades mayores en términos absolutos aunque el porcentaje baje.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Volumen total de pagos procesado por Stripe (billones de dólares, 10^12)</tspan></text><line x1="78.62" y1="347" x2="920" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="347" x2="78.62" y2="347" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="351.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="277" x2="920" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="277" x2="78.62" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="281.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,5</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="137" x2="920" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="137" x2="78.62" y2="137" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1,5</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">2</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 207)">Billones de dólares (10^12)</text><rect x="106.666" y="207" width="224.368" height="140" rx="3" fill="#087f8c"/><text x="218.85" y="201" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.85" dy="0">1,0</tspan></text><text x="218.85" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">2023</tspan></text><rect x="387.126" y="151" width="224.368" height="196" rx="3" fill="#087f8c"/><text x="499.31" y="145" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">1,4</tspan></text><text x="499.31" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">2024</tspan></text><rect x="667.586" y="81" width="224.368" height="266" rx="3" fill="#087f8c"/><text x="779.77" y="75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">1,9</tspan></text><text x="779.77" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">2025</tspan></text><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El crecimiento porcentual baja (38 % y 34 %) pero el aumento absoluto sube de 0,4 a 0,5 billones, y en 2025 equivale a</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cerca del 1,6 % del PIB mundial según Stripe. Dónde deja de valer: es volumen bruto, no ingreso; Stripe no publica</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ingresos, y la cifra de 2023 viene de un blog de ingeniería, no de una carta anual.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Stripe Newsroom 2024 y 2025; blog de ingeniería de Stripe (6-jun-2024).</tspan></text></svg>
