<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 634" width="940" height="634" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: una sobredosis exige tres condiciones a la vez</title><desc id="d">Árbol de fallas. El evento superior es una sobredosis a un paciente y requiere, con compuerta Y, tres ramas: el haz se enciende en una configuración peligrosa, la máquina no detecta la sobredosis y el procedimiento permite continuar. La primera rama es una compuerta O con tres hojas: carrera de edición, contador de un byte y ausencia de interlocks de hardware. La segunda tiene dos hojas y la tercera tres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="634" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: una sobredosis exige tres condiciones a la vez</tspan></text><rect x="320" y="49" width="300" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="80.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Sobredosis a un paciente</tspan></text><line x1="470" y1="105" x2="470" y2="129" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="470" cy="141" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="146" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><line x1="155" y1="157" x2="785" y2="157" stroke="#8a9aa3" stroke-width="1.4"/><line x1="155" y1="157" x2="155" y2="175" stroke="#8a9aa3" stroke-width="1.4"/><line x1="470" y1="157" x2="470" y2="175" stroke="#8a9aa3" stroke-width="1.4"/><line x1="785" y1="157" x2="785" y2="175" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="175" width="290" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="200.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="155" dy="0">El haz se enciende en una</tspan></text><text x="155" y="216.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="155" dy="0">configuración peligrosa</tspan></text><rect x="325" y="175" width="290" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="208.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">La máquina no detecta la sobredosis</tspan></text><rect x="640" y="175" width="290" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="208.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="785" dy="0">El procedimiento permite continuar</tspan></text><line x1="155" y1="235" x2="155" y2="251" stroke="#8a9aa3" stroke-width="1.4"/><line x1="470" y1="235" x2="470" y2="251" stroke="#8a9aa3" stroke-width="1.4"/><line x1="785" y1="235" x2="785" y2="251" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="155" cy="263" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="155" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="155" dy="0">O</tspan></text><circle cx="470" cy="263" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><circle cx="785" cy="263" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="785" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="785" dy="0">O</tspan></text><line x1="155" y1="275" x2="155" y2="289" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="289" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="155" y="321.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">Carrera de edición (documentado)</tspan></text><rect x="10" y="359" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="155" y="391.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">Contador de un byte (documentado)</tspan></text><rect x="10" y="429" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="155" y="453.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">Sin interlocks de hardware</tspan></text><text x="155" y="469.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="155" dy="0">independientes (documentado)</tspan></text><line x1="470" y1="275" x2="470" y2="289" stroke="#8a9aa3" stroke-width="1.4"/><rect x="325" y="289" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cámaras saturadas muestran dosis baja</tspan></text><text x="470" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(documentado)</tspan></text><rect x="325" y="359" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="375" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin registro de auditoría ni</tspan></text><text x="470" y="391.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">verificación independiente</tspan></text><text x="470" y="408.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(documentado)</tspan></text><line x1="785" y1="275" x2="785" y2="289" stroke="#8a9aa3" stroke-width="1.4"/><rect x="640" y="289" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Pausa con tecla P como rutina</tspan></text><text x="785" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">(documentado)</tspan></text><rect x="640" y="359" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="391.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Mensajes sin explicar (documentado)</tspan></text><rect x="640" y="429" width="290" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="453.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Causa atribuida a otro componente sin</tspan></text><text x="785" y="469.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">evidencia (documentado)</tspan></text><rect x="10" y="511" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="535.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En las ramas de los lados basta una causa (compuerta O); en la central hacen falta las dos (compuerta Y). Eliminar una de</tspan></text><text x="470" y="552.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las tres ramas principales evita el evento superior. Sin probabilidades: el artículo critica justamente las cifras sin</tspan></text><text x="470" y="569.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">método.</tspan></text><text x="470" y="616.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
