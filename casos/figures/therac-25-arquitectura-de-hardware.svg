<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 558" width="940" height="558" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware en dos salas: lo que el operador veía y lo que ocurría detrás del blindaje</title><desc id="d">Dos zonas separadas por un blindaje. En la sala de control, el operador, un terminal VT100 y el computador PDP-11/23 de 32 KB. En la sala de tratamiento, el acelerador, los imanes de barrido, la plataforma giratoria con tres microinterruptores, las cámaras de ionización, el paciente y el sistema de interlocks de hardware. Entre ambas, solo un monitor de vídeo y un intercomunicador.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="558" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware en dos salas: lo que el operador veía y lo que ocurría detrás del blindaje</tspan></text><rect x="10" y="45" width="300" height="290" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Sala de control</tspan></text><rect x="26" y="85" width="268" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="116.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Operador</tspan></text><rect x="26" y="161" width="268" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="192.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Terminal VT100</tspan></text><rect x="26" y="241" width="268" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="160" y="271.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">Computador PDP-11/23 con 32 KB:</tspan></text><text x="160" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">lee sensores y comanda actuadores</tspan></text><polyline points="160,141 160,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="160,217 160,241" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="326" y="55" width="40" height="270" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="346" y="351" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="346" dy="0">blindaje</tspan></text><rect x="382" y="45" width="548" height="290" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="396" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="396" dy="0">Sala de tratamiento</tspan></text><rect x="398" y="85" width="252" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="524" y="113.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524" dy="0">Acelerador: electrones de 5 a</tspan></text><text x="524" y="129.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524" dy="0">25 MeV</tspan></text><rect x="665" y="85" width="252" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="791" y="121.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="791" dy="0">Imanes de barrido y de flexión</tspan></text><rect x="398" y="165" width="252" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="524" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="524" dy="0">Plataforma giratoria con tres</tspan></text><text x="524" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="524" dy="0">microinterruptores</tspan></text><rect x="665" y="165" width="252" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="791" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="791" dy="0">Cámaras de ionización que miden</tspan></text><text x="791" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="791" dy="0">el haz</tspan></text><rect x="398" y="245" width="252" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="524" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524" dy="0">Paciente sobre la mesa</tspan></text><rect x="665" y="245" width="252" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="791" y="273.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="791" dy="0">Interlocks de hardware: retiran</tspan></text><text x="791" y="289.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="791" dy="0">la alimentación ante una falla</tspan></text><polyline points="310,269 382,269" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="346" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="346" dy="0">órdenes</tspan></text><polyline points="382,301 310,301" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="346" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="346" dy="0">lecturas</tspan></text><rect x="10" y="371" width="920" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="402.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre las salas: un monitor de vídeo y un intercomunicador. Ninguna vista del estado interno de la máquina.</tspan></text><rect x="10" y="451" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="475.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los bloques teal son los que decidían qué haz recibía el paciente y cuánto se medía. El computador era el único enlace</tspan></text><text x="470" y="492.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entre lo que el operador pedía y lo que ocurría en la sala.</tspan></text><text x="470" y="540.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
