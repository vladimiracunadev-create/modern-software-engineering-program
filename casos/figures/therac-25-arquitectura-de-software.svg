<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 588" width="940" height="588" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arquitectura de software: tareas que solo hablan por variables compartidas</title><desc id="d">Planificador que lanza tareas cada 0,1 segundos. Tareas críticas: monitor de tratamiento, servos y ama de llaves. Tareas no críticas: procesador de teclado, pantalla, suma de verificación y otras. Servicios de interrupción. En la franja inferior, las variables compartidas sin sincronización real: fase del monitor, desplazamiento de modo y energía, marca de entrada completa y contador de verificación del colimador.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="588" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Arquitectura de software: tareas que solo hablan por variables compartidas</tspan></text><rect x="10" y="51" width="920" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Planificador expropiativo en ensamblador de PDP-11: lanza las tareas cada 0,1 segundos; primero las críticas</tspan></text><rect x="10" y="121" width="300" height="200" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="143" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Tareas críticas</tspan></text><rect x="24" y="153" width="272" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="160" y="180.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">Monitor de tratamiento: ocho fases</tspan></text><rect x="24" y="209" width="272" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="160" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">Servos: haz, dosis, imanes</tspan></text><rect x="24" y="265" width="272" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="160" y="282.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">Ama de llaves: interlocks y</tspan></text><text x="160" y="298.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">límites</tspan></text><rect x="330" y="121" width="300" height="200" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="344" y="143" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="344" dy="0">Tareas no críticas</tspan></text><rect x="344" y="153" width="272" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="172.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Procesador de teclado de la</tspan></text><text x="480" y="188.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">consola</tspan></text><rect x="344" y="209" width="272" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="228.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Pantalla, suma de verificación,</tspan></text><text x="480" y="244.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">snapshot</tspan></text><rect x="344" y="265" width="272" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Control manual y calibración</tspan></text><rect x="650" y="121" width="280" height="200" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="664" y="143" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="664" dy="0">Servicios de interrupción</tspan></text><rect x="664" y="153" width="252" height="156" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="790" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">Reloj, barrido, teclados,</tspan></text><text x="790" y="234.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">pantalla, impresora, arranque y</tspan></text><text x="790" y="251.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">trampas de desbordamiento</tspan></text><rect x="10" y="341" width="920" height="118" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="363" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="24" dy="0">Variables compartidas: sin sincronización real entre quien escribe y quien lee</tspan></text><rect x="24" y="381" width="214" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="131" y="416.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="131" dy="0">Tphase: fase del monitor</tspan></text><rect x="250" y="381" width="214" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="357" y="408.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="357" dy="0">MEOS: modo y energía, 2</tspan></text><text x="357" y="424.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="357" dy="0">bytes</tspan></text><rect x="476" y="381" width="214" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="583" y="416.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">Marca de entrada completa</tspan></text><rect x="702" y="381" width="214" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="809" y="408.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="809" dy="0">Class3: 1 byte,</tspan></text><text x="809" y="424.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="809" dy="0">verificación del colimador</tspan></text><polyline points="160,321 160,341" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="480,321 480,341" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="790,321 790,341" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="481" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="505.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los nombres son los que usa el artículo; el código de AECL no es público y la figura simplifica. Las dos cajas coral de la</tspan></text><text x="470" y="522.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">franja inferior son las variables implicadas en los accidentes de Tyler y de Yakima de 1987.</tspan></text><text x="470" y="570.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
