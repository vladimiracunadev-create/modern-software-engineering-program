<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién podía saber qué: el fabricante recibía cada historia y ningún centro conocía las otras</title><desc id="d">Diagrama de actores y canales. Cuatro hospitales envían llamadas y cartas al fabricante. El fabricante informa a la FDA tras Tyler y la FDA declara el defecto. La asociación de físicos y las reuniones de usuarios conectan a los centros con el fabricante. Los hospitales no tenían obligación de notificar al regulador ni canal para compartir incidentes entre sí.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién podía saber qué: el fabricante recibía cada historia y ningún centro conocía las otras</tspan></text><rect x="10" y="51" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="117" dy="0">Marietta, 1985</tspan></text><line x1="117" y1="101" x2="117" y2="131" stroke="#32505f" stroke-width="1.4"/><rect x="242" y="51" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="349" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="349" dy="0">Hamilton, 1985</tspan></text><line x1="349" y1="101" x2="349" y2="131" stroke="#32505f" stroke-width="1.4"/><rect x="474" y="51" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="581" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="581" dy="0">Yakima, 1985 y 1987</tspan></text><line x1="581" y1="101" x2="581" y2="131" stroke="#32505f" stroke-width="1.4"/><rect x="706" y="51" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="813" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813" dy="0">Tyler, 1986</tspan></text><line x1="813" y1="101" x2="813" y2="131" stroke="#32505f" stroke-width="1.4"/><line x1="117" y1="131" x2="817" y2="131" stroke="#32505f" stroke-width="1.4"/><polyline points="437,131 437,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="450" y="157" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="450" dy="0">llamadas y cartas</tspan></text><rect x="310" y="175" width="250" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="435" y="202.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="435" dy="0">AECL, el fabricante: ve cada</tspan></text><text x="435" y="218.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="435" dy="0">incidente por separado</tspan></text><rect x="10" y="175" width="200" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="202.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Asociación de físicos y</tspan></text><text x="110" y="218.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">reuniones de usuarios</tspan></text><polyline points="210,207 310,207" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="260" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="260" dy="0">desde 1986</tspan></text><rect x="700" y="175" width="230" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="815" y="210.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="815" dy="0">FDA de EE. UU.</tspan></text><polyline points="560,195 700,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="630" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630" dy="0">15 abr 1986</tspan></text><polyline points="700,223 560,223" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="630" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630" dy="0">2 may 1986</tspan></text><rect x="700" y="285" width="230" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="815" y="308.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="815" dy="0">Autoridad sanitaria de</tspan></text><text x="815" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="815" dy="0">Canadá</tspan></text><polyline points="437,239 437,313 700,313" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="285" width="330" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="175" y="308.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="175" dy="0">Entre hospitales no había canal: se</tspan></text><text x="175" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="175" dy="0">enteraban por conversaciones informales</tspan></text><rect x="10" y="365" width="920" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="396.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">No existía obligación de notificar incidentes del hospital al fabricante ni a la FDA hasta la enmienda legal de 1990</tspan></text><rect x="10" y="443" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="467.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las flechas sólidas son flujos documentados; las punteadas, flujos que faltaban o llegaron tarde. El fabricante era el</tspan></text><text x="470" y="484.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">único que veía varias historias a la vez y respondió a los centros que no conocía otros incidentes.</tspan></text><text x="470" y="532.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
