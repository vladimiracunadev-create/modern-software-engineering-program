<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 488" width="940" height="488" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De una barrera de software a capas independientes entre la orden y el haz</title><desc id="d">Dos recorridos entre la orden del operador y el haz. Antes, una sola barrera: las comprobaciones de software, que podían fallar por una condición de carrera. Después del plan correctivo de 1987, capas separadas: interlock y potenciómetro de la plataforma giratoria, circuito de hardware que corta tras un pulso alto sin pasar por el software, suspensión obligatoria ante fallos de dosimetría con reingreso de parámetros, mensajes comprensibles y pedal de hombre muerto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="488" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De una barrera de software a capas independientes entre la orden y el haz</tspan></text><text x="14" y="63" font-size="14" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="14" dy="0">Antes (versión de los accidentes)</tspan></text><rect x="10" y="75" width="200" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="107.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Orden del operador</tspan></text><rect x="270" y="75" width="400" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="99.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Software: la única barrera. Un fallo lo cruza sin</tspan></text><text x="470" y="115.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">que nada lo detenga.</tspan></text><rect x="730" y="75" width="200" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="107.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Haz sobre el paciente</tspan></text><polyline points="210,104 270,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="670,104 730,104" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><text x="14" y="167" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="14" dy="0">Después (plan correctivo final, 21 de julio de 1987)</tspan></text><rect x="10" y="179" width="150" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="85" y="213.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="85" dy="0">Orden del</tspan></text><text x="85" y="229.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="85" dy="0">operador</tspan></text><rect x="196" y="179" width="176" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="284" y="213.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="284" dy="0">Software con más</tspan></text><text x="284" y="229.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="284" dy="0">comprobaciones</tspan></text><polyline points="160,218 196,218" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="392" y="179" width="176" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="205" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Interlock y</tspan></text><text x="480" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">potenciómetro de la</tspan></text><text x="480" y="238.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">plataforma</tspan></text><polyline points="368,218 392,218" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="588" y="179" width="176" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="676" y="205" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="676" dy="0">Circuito que corta</tspan></text><text x="676" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="676" dy="0">tras un pulso alto,</tspan></text><text x="676" y="238.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="676" dy="0">sin software</tspan></text><polyline points="564,218 588,218" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="784" y="179" width="146" height="78" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="213.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="857" dy="0">Haz sobre el</tspan></text><text x="857" y="229.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="857" dy="0">paciente</tspan></text><polyline points="772,218 784,218" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="277" width="300" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Fallos de dosimetría: suspensión;</tspan></text><text x="160" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">reingreso de parámetros</tspan></text><rect x="328" y="277" width="300" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="478" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478" dy="0">Mensajes comprensibles en lugar de</tspan></text><text x="478" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478" dy="0">«Malfunction 54»</tspan></text><rect x="646" y="277" width="284" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="788" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="788" dy="0">Pedal de hombre muerto para</tspan></text><text x="788" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="788" dy="0">movimientos</tspan></text><rect x="10" y="365" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="389.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las capas listadas son las del plan correctivo final según el artículo; que cada una sea suficiente es una valoración de</tspan></text><text x="470" y="406.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los autores y de la FDA. La enseñanza para el curso es de arquitectura: ningún camino al daño debe depender de un único</tspan></text><text x="470" y="423.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">componente, y menos de uno que no se pueda verificar con pruebas.</tspan></text><text x="470" y="470.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
