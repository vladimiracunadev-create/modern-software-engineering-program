<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 464" width="940" height="464" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un contador de un byte: una de cada 256 pasadas la comprobación del colimador no se ejecutaba</title><desc id="d">Fila de casillas que representan pasadas por la rutina de preparación. Las pasadas 1 a 255 dejan la variable Class3 distinta de cero y activan la comprobación del colimador. En la pasada 256 el contador vuelve a cero y la comprobación se omite. Si el operador confirma en ese instante, el haz de 25 MeV se enciende con el colimador en posición de luz de campo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="464" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un contador de un byte: una de cada 256 pasadas la comprobación del colimador no se ejecutaba</tspan></text><rect x="10" y="53" width="100" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="60" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="60" dy="0">1</tspan></text><rect x="125" y="53" width="100" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="175" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="175" dy="0">2</tspan></text><rect x="240" y="53" width="100" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="290" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="290" dy="0">3</tspan></text><rect x="355" y="53" width="100" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="405" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="405" dy="0">4</tspan></text><rect x="470" y="53" width="100" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="520" dy="0">…</tspan></text><rect x="585" y="53" width="100" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="635" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="635" dy="0">254</tspan></text><rect x="700" y="53" width="100" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="750" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="750" dy="0">255</tspan></text><rect x="815" y="53" width="100" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="865" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="865" dy="0">256 = 0</tspan></text><text x="480" y="127" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Pasadas por la rutina de preparación; Class3 se incrementa en cada una</tspan></text><rect x="10" y="155" width="440" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230" y="185.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">Class3 distinta de cero: Lmtchk llama a Chkcol y se</tspan></text><text x="230" y="201.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">comprueba la posición del colimador</tspan></text><rect x="490" y="155" width="440" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="710" y="185.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="710" dy="0">Class3 igual a cero: se omite Chkcol; la falta de luz de</tspan></text><text x="710" y="201.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="710" dy="0">campo no se detecta</tspan></text><polyline points="230,103 230,155" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="710,103 710,155" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="490" y="255" width="440" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="710" y="288.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="710" dy="0">Si el operador pulsa la tecla de ajuste en esa pasada:</tspan></text><text x="710" y="304.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="710" dy="0">haz de 25 MeV sin blanco ni barrido</tspan></text><polyline points="710,225 710,255" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="255" width="440" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="230" y="288.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="230" dy="0">Corrección de AECL: asignar a Class3 un valor fijo</tspan></text><text x="230" y="304.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="230" dy="0">distinto de cero en cada pasada, en vez de incrementarla</tspan></text><rect x="10" y="357" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La comprobación no falló: no se ejecutó. La preparación se ejecuta varios cientos de veces por puesta a punto; la</tspan></text><text x="470" y="398.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">probabilidad de coincidir con la pasada 256 no se puede estimar con los datos del artículo.</tspan></text><text x="470" y="446.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
