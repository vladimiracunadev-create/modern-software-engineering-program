<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 568" width="940" height="568" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Veinticinco meses entre el primer accidente y el plan correctivo final</title><desc id="d">Línea de tiempo en meses desde enero de 1985. Seis accidentes: Marietta en junio de 1985, Hamilton en julio de 1985, Yakima en diciembre de 1985, Tyler en marzo y abril de 1986 y Yakima en enero de 1987. AECL presenta el primer plan de acción correctiva el 13 de junio de 1986 y el quinto y último el 21 de julio de 1987. El uso rutinario se suspende de febrero a agosto de 1987.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="568" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Veinticinco meses entre el primer accidente y el plan correctivo final</tspan></text><line x1="234" y1="83" x2="234" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="234" y1="387" x2="234" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="234" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">0</tspan></text><line x1="347" y1="83" x2="347" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="347" y1="387" x2="347" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="347" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">6</tspan></text><line x1="460" y1="83" x2="460" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="460" y1="387" x2="460" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="460" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="460" dy="0">12</tspan></text><line x1="573" y1="83" x2="573" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="573" y1="387" x2="573" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="573" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573" dy="0">18</tspan></text><line x1="686" y1="83" x2="686" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="686" y1="387" x2="686" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="686" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686" dy="0">24</tspan></text><line x1="799" y1="83" x2="799" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="799" y1="387" x2="799" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="799" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">30</tspan></text><line x1="912" y1="83" x2="912" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="387" x2="912" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">36</tspan></text><line x1="234" y1="387" x2="912" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="224" y="106.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">1 Marietta, 3 jun 1985</tspan></text><text x="224" y="144.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">2 Hamilton, 26 jul 1985</tspan></text><text x="224" y="182.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">3 Yakima, dic 1985</tspan></text><text x="224" y="220.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">4 Tyler, 21 mar 1986</tspan></text><text x="224" y="258.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">5 Tyler, 11 abr 1986</tspan></text><text x="224" y="296.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">6 Yakima, 17 ene 1987</tspan></text><text x="224" y="334.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">Plan correctivo de AECL</tspan></text><text x="224" y="372.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">Uso rutinario suspendido</tspan></text><line x1="535.898" y1="75" x2="535.898" y2="387" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="535.898" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="535.898" dy="0">2 may 1986: FDA declara el defecto</tspan></text><line x1="811.618" y1="75" x2="811.618" y2="387" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="811.618" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="811.618" dy="0">21 jul 1987: plan final</tspan></text><rect x="329.485" y="92" width="9.98167" height="20" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="121" x2="912" y2="121" stroke="#d5dde1" stroke-width="1"/><rect x="362.632" y="130" width="10.735" height="20" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="159" x2="912" y2="159" stroke="#d5dde1" stroke-width="1"/><rect x="446.817" y="168" width="11.3" height="20" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="197" x2="912" y2="197" stroke="#d5dde1" stroke-width="1"/><rect x="510.285" y="206" width="9.98167" height="20" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="235" x2="912" y2="235" stroke="#d5dde1" stroke-width="1"/><rect x="522.715" y="244" width="10.735" height="20" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="273" x2="912" y2="273" stroke="#d5dde1" stroke-width="1"/><rect x="695.982" y="282" width="10.735" height="20" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="311" x2="912" y2="311" stroke="#d5dde1" stroke-width="1"/><rect x="561.7" y="320" width="249.918" height="20" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="686.659" y="334.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="686.659" dy="0">cinco revisiones del plan</tspan></text><line x1="14" y1="349" x2="912" y2="349" stroke="#d5dde1" stroke-width="1"/><rect x="716.698" y="358" width="129.385" height="20" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="781.391" y="372.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="781.391" dy="0">hasta ago 1987</tspan></text><text x="573" y="431" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="573" dy="0">meses desde enero de 1985 (12 = enero de 1986, 24 = enero de 1987)</tspan></text><rect x="10" y="445" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="469.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada marca coral es un accidente con una sobredosis masiva documentada. Que pasaran meses y varios accidentes antes de que</tspan></text><text x="470" y="486.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se reconociera un defecto de la máquina es lo que Leveson y Turner vinculan a la falta de seguimiento de incidentes</tspan></text><text x="470" y="503.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(interpretación de los autores). Los meses son cálculo propio a partir de las fechas del artículo.</tspan></text><text x="470" y="550.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner (1993). La fecha de Yakima 1985 es aproximada: el artículo la sitúa en diciembre.</tspan></text></svg>
