<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 736" width="940" height="736" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Once barreras entre un error de diseño y un paciente: casi ninguna cumplió su papel</title><desc id="d">Once barreras en tres filas: análisis de peligros, interlocks de hardware, diseño de software, pruebas, mensajes de error, dosimetría, observación del operador, procedimiento ante pausas, investigación de incidentes, vigilancia del regulador y el plan final de 1987. Cada barrera indica si existió y si funcionó según Leveson y Turner.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="736" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Once barreras entre un error de diseño y un paciente: casi ninguna cumplió su papel</tspan></text><rect x="10" y="53" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">1 Análisis de peligros, 1983</tspan></text><rect x="10" y="115" width="224" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="122" y="152" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="122" dy="0">Excluyó el software;</tspan></text><text x="122" y="168.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="122" dy="0">probabilidades sin</tspan></text><text x="122" y="185.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="122" dy="0">justificación</tspan></text><rect x="246" y="53" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="358" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358" dy="0">2 Interlocks de hardware</tspan></text><rect x="246" y="115" width="224" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="358" y="160.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="358" dy="0">Sustituidos en parte por</tspan></text><text x="358" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="358" dy="0">comprobaciones de software</tspan></text><rect x="482" y="53" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="594" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="594" dy="0">3 Diseño del software</tspan></text><rect x="482" y="115" width="224" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="594" y="160.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="594" dy="0">Variables compartidas sin</tspan></text><text x="594" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="594" dy="0">sincronización</tspan></text><rect x="718" y="53" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="830" dy="0">4 Pruebas</tspan></text><rect x="718" y="115" width="224" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="160.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Casi solo de sistema; sin</tspan></text><text x="830" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">plan de pruebas documentado</tspan></text><rect x="10" y="243" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="275.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">5 Mensajes de error</tspan></text><rect x="10" y="305" width="224" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="122" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="122" dy="0">Malfunction y un número que</tspan></text><text x="122" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="122" dy="0">el manual no explicaba</tspan></text><rect x="246" y="243" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="358" y="275.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358" dy="0">6 Dosimetría</tspan></text><rect x="246" y="305" width="224" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="358" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="358" dy="0">Cámaras saturadas mostraron</tspan></text><text x="358" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="358" dy="0">una dosis baja</tspan></text><rect x="482" y="243" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="594" y="275.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="594" dy="0">7 Observación del operador</tspan></text><rect x="482" y="305" width="224" height="100" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="594" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="594" dy="0">Solo vídeo e</tspan></text><text x="594" y="358.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="594" dy="0">intercomunicador; el</tspan></text><text x="594" y="375.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="594" dy="0">paciente era la señal</tspan></text><rect x="718" y="243" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="275.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="830" dy="0">8 Procedimiento ante pausas</tspan></text><rect x="718" y="305" width="224" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Pulsar P y continuar era lo</tspan></text><text x="830" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">habitual</tspan></text><rect x="10" y="433" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="457.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">9 Investigación de</tspan></text><text x="122" y="473.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">incidentes</tspan></text><rect x="10" y="495" width="224" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="122" y="540.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="122" dy="0">Sin seguimiento; respuesta</tspan></text><text x="122" y="556.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="122" dy="0">de que era imposible</tspan></text><rect x="246" y="433" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="358" y="465.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358" dy="0">10 Vigilancia del regulador</tspan></text><rect x="246" y="495" width="224" height="100" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="358" y="540.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="358" dy="0">Sin aviso obligatorio de los</tspan></text><text x="358" y="556.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="358" dy="0">hospitales hasta 1990</tspan></text><rect x="482" y="433" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="594" y="465.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="594" dy="0">11 Plan final de 1987</tspan></text><rect x="482" y="495" width="224" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="594" y="540.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="594" dy="0">Hardware independiente,</tspan></text><text x="594" y="556.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="594" dy="0">suspensión y mensajes claros</tspan></text><rect x="10" y="629" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="653.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Coral: no existió o no funcionó. Gris: existía pero no cubría este riesgo (valoración de Leveson y Turner). Teal: añadida</tspan></text><text x="470" y="670.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por el plan final de julio de 1987. Que fallaran por razones distintas es lo que impide atribuir el caso a una sola causa.</tspan></text><text x="470" y="718.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
