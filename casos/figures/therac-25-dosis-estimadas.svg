<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 628" width="940" height="628" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dosis estimadas en cinco accidentes frente a una sesión típica de unos 200 rad</title><desc id="d">Rangos en escala logarítmica de las dosis estimadas en cinco accidentes, en rad, con dos líneas de referencia en 200 y 1.000. Marietta, de 15.000 a 20.000; Hamilton, de 13.000 a 17.000; Tyler en marzo, de 16.500 a 25.000 según simulaciones; Tyler en abril, de más de 4.000 medidos en el hospital a unos 25.000 medidos por AECL; Yakima 1987, de 8.000 a 10.000 tras dos intentos. Una sesión típica ronda los 200 rad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="628" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dosis estimadas en cinco accidentes frente a una sesión típica de unos 200 rad</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mínimo estimado</tspan></text><polygon points="183.1,44.1 189.7,56.4 176.5,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">máximo estimado</tspan></text><line x1="180.96" y1="77" x2="180.96" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="180.96" y1="447" x2="180.96" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="180.96" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="180.96" dy="0">100</tspan></text><line x1="417.307" y1="77" x2="417.307" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="417.307" y1="447" x2="417.307" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="417.307" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417.307" dy="0">1 000</tspan></text><line x1="653.653" y1="77" x2="653.653" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="653.653" y1="447" x2="653.653" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="653.653" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="653.653" dy="0">10 000</tspan></text><line x1="890" y1="77" x2="890" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="447" x2="890" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">100 000</tspan></text><line x1="180.96" y1="447" x2="890" y2="447" stroke="#5b7280" stroke-width="1.6"/><text x="150.96" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150.96" dy="0">Marietta, 1985</tspan></text><text x="150.96" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150.96" dy="0">Hamilton, 1985</tspan></text><text x="150.96" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150.96" dy="0">Tyler, mar 1986</tspan></text><text x="150.96" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150.96" dy="0">Tyler, abr 1986</tspan></text><text x="150.96" y="414.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150.96" dy="0">Yakima, ene 1987</tspan></text><line x1="695.272" y1="114" x2="724.801" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="688.272" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="695.272" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="695.272" dy="0">15 000</tspan></text><polygon points="724.801,105.95 732.501,120.3 717.101,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="724.801" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="724.801" dy="0">20 000</tspan></text><line x1="680.583" y1="188" x2="708.119" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="673.583" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="680.583" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="680.583" dy="0">13 000</tspan></text><polygon points="708.119,179.95 715.819,194.3 700.419,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="708.119" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="708.119" dy="0">17 000</tspan></text><line x1="705.055" y1="262" x2="747.705" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="698.055" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="705.055" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705.055" dy="0">16 500</tspan></text><polygon points="747.705,253.95 755.405,268.3 740.005,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="747.705" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="747.705" dy="0">25 000</tspan></text><line x1="559.602" y1="336" x2="747.705" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="552.602" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="559.602" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="559.602" dy="0">4 000</tspan></text><polygon points="747.705,327.95 755.405,342.3 740.005,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="747.705" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="747.705" dy="0">25 000</tspan></text><line x1="630.749" y1="410" x2="653.653" y2="410" stroke="#8a9aa3" stroke-width="5"/><rect x="623.749" y="403" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="630.749" y="394" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="630.749" dy="0">8 000</tspan></text><polygon points="653.653,401.95 661.353,416.3 645.953,416.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="653.653" y="439" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="653.653" dy="0">10 000</tspan></text><line x1="252.107" y1="77" x2="252.107" y2="447" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="257.107" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="257.107" dy="0">≈200 rad</tspan></text><line x1="417.307" y1="77" x2="417.307" y2="447" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="422.307" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="422.307" dy="0">1.000 rad</tspan></text><text x="535.48" y="491" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="535.48" dy="0">rad (dosis localizada) (escala logarítmica)</tspan></text><rect x="10" y="505" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="529.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Son estimaciones posteriores y localizadas; no son lecturas de la máquina, que no detectó la sobredosis. Los 1.000 rad que</tspan></text><text x="470" y="546.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se citan como potencialmente letales lo son para el cuerpo entero; aquí la dosis se concentró en una zona pequeña. Se</tspan></text><text x="470" y="563.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">muestra el orden de magnitud, no una dosis exacta.</tspan></text><text x="470" y="610.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner (1993). Las dosis exactas no pueden determinarse; varían entre simulaciones de distintos centros.</tspan></text></svg>
