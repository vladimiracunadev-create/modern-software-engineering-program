<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 546" width="940" height="546" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema del negocio: quién compra, quién opera, quién calibra y quién vigila</title><desc id="d">Esquema con el tratamiento al paciente en el centro. Arriba: el hospital que compra y opera, el fabricante que diseña, instala y da soporte, los físicos y técnicos que calibran y operan, y el regulador que vigila. Abajo: la asociación de físicos que propone estándares, y precios, ventas y costos que no son públicos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="546" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema del negocio: quién compra, quién opera, quién calibra y quién vigila</tspan></text><rect x="137" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">Hospital: compra y opera</tspan></text><text x="244" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">el equipo</tspan></text><rect x="363" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Fabricante: diseña,</tspan></text><text x="470" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">instala y da soporte</tspan></text><rect x="589" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="696" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">Físicos y técnicos:</tspan></text><text x="696" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">calibran y operan</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="230.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Tratamiento al paciente</tspan></text><polyline points="244,125 379.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="244" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">compra</tspan></text><polyline points="470,125 470,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">diseña</tspan></text><polyline points="696,125 560.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="696" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">operan</tspan></text><rect x="137" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">Regulador: vigila y exige</tspan></text><text x="244" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">correcciones</tspan></text><rect x="363" y="345" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Asociación de físicos:</tspan></text><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">estándares de usuario</tspan></text><rect x="589" y="345" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="696" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="696" dy="0">Precios, ventas y costos:</tspan></text><text x="696" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="696" dy="0">no se sabe</tspan></text><polyline points="379.6,259 244,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="244" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">vigila</tspan></text><polyline points="470,259 470,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="560.4,259 696,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="439" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Roles según el artículo. No hay datos públicos de precios, ventas ni márgenes y no se estiman. Las flechas son relaciones,</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no contratos.</tspan></text><text x="470" y="528.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
