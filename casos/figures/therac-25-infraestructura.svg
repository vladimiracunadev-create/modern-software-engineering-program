<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 428" width="940" height="428" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Infraestructura: once máquinas aisladas, unidas solo por teléfono, carta y reuniones</title><desc id="d">Cuatro hospitales con su máquina y su sala de control, aislados entre sí. Hacia el fabricante van llamadas y cartas; hacia el regulador, informes del fabricante. No hay un nodo central de telemetría ni registro de auditoría en la máquina; la existencia de red no está documentada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="428" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Infraestructura: once máquinas aisladas, unidas solo por teléfono, carta y reuniones</tspan></text><rect x="10" y="51" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="79.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="117" dy="0">Marietta: máquina y sala</tspan></text><text x="117" y="95.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="117" dy="0">de control</tspan></text><polyline points="117,117 117,155" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="242" y="51" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="349" y="79.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="349" dy="0">Hamilton: máquina y sala</tspan></text><text x="349" y="95.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="349" dy="0">de control</tspan></text><polyline points="349,117 349,155" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="474" y="51" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="581" y="79.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="581" dy="0">Yakima: máquina y sala de</tspan></text><text x="581" y="95.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="581" dy="0">control</tspan></text><polyline points="581,117 581,155" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="706" y="51" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="813" y="79.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813" dy="0">Tyler: máquina y sala de</tspan></text><text x="813" y="95.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813" dy="0">control</tspan></text><polyline points="813,117 813,155" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="155" width="920" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Llamadas, cartas y reuniones de usuarios: canales humanos, no de datos</tspan></text><polyline points="470,201 470,235" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="235" width="280" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="260.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">AECL: ve cada incidente por</tspan></text><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">separado</tspan></text><polyline points="610,265 700,265" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="700" y="235" width="230" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="815" y="268.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="815" dy="0">FDA y autoridades de Canadá</tspan></text><rect x="10" y="235" width="300" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="160" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">Sin registro de auditoría ni</tspan></text><text x="160" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">telemetría central documentados</tspan></text><rect x="10" y="321" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las flechas punteadas son comunicaciones informales entre cada hospital y el fabricante. La existencia de una red entre</tspan></text><text x="470" y="362.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">máquinas y fabricante no consta: no se sabe.</tspan></text><text x="470" y="410.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
