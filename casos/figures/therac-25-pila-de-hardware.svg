<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" width="940" height="566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pila de hardware: del terminal del operador al acelerador, con el computador en medio</title><desc id="d">Cinco capas de arriba abajo: terminal VT100 y operador; computador PDP-11/23 de 32 KB; controladores y sensores; plataforma giratoria con microinterruptores y cámaras de ionización; y acelerador con imanes. A la derecha, qué barrera dependía de cada tramo antes y después del plan final de 1987.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="566" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pila de hardware: del terminal del operador al acelerador, con el computador en medio</tspan></text><rect x="10" y="53" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="81.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Operador y terminal</tspan></text><text x="105" y="97.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">VT100</tspan></text><rect x="214" y="53" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Sala de control; ve al paciente por vídeo y voz</tspan></text><rect x="10" y="133" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="169.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Computador PDP-11/23</tspan></text><rect x="214" y="133" width="430" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429" y="169.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">32 KB; lee sensores y comanda actuadores</tspan></text><rect x="10" y="213" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="241.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Controladores y</tspan></text><text x="105" y="257.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">sensores</tspan></text><rect x="214" y="213" width="430" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="241.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">Servos, imanes y tres microinterruptores de la</tspan></text><text x="429" y="257.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">plataforma</tspan></text><rect x="10" y="293" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Plataforma y cámaras</tspan></text><rect x="214" y="293" width="430" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">Posición de blanco, aplanador y cámaras de ionización</tspan></text><rect x="10" y="373" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="409.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Acelerador y imanes</tspan></text><rect x="214" y="373" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="409.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Electrones de 5 a 25 MeV; fotones de 25 MeV</tspan></text><rect x="668" y="53" width="262" height="114.667" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="799" y="97.3333" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="799" dy="0">Antes: comprobaciones de software</tspan></text><text x="799" y="113.973" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="799" dy="0">sustituyeron a interlocks</tspan></text><text x="799" y="130.613" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="799" dy="0">electromecánicos</tspan></text><rect x="668" y="181.667" width="262" height="114.667" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Después: potenciómetro, interlock</tspan></text><text x="799" y="242.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">de la plataforma y apagado tras</tspan></text><text x="799" y="259.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">un pulso alto sin software</tspan></text><rect x="668" y="310.333" width="262" height="114.667" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="799" y="354.667" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">No se sabe: fabricantes de cada</tspan></text><text x="799" y="371.307" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">componente y especificaciones</tspan></text><text x="799" y="387.947" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">eléctricas</tspan></text><rect x="10" y="459" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="483.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Esquema funcional reconstruido del artículo; no es un plano. Memoria de 32 KB documentada; el resto de especificaciones, no</tspan></text><text x="470" y="500.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">públicas.</tspan></text><text x="470" y="548.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
