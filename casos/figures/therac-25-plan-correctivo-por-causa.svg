<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 604" width="940" height="604" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del plan final de 1987 a las causas: qué medida corta qué eslabón</title><desc id="d">Dos columnas unidas por flechas. A la izquierda, siete causas documentadas: software como única barrera, edición rápida, contador de un byte, dosimetría saturada, pausas normalizadas, mensajes crípticos, ausencia de registro y notificación. A la derecha, seis medidas del plan final: circuito de hardware de un pulso, interlock y potenciómetro de la plataforma, límite de teclas de edición, suspensión con reingreso de parámetros, mensajes claros y otros cambios de software. Las flechas asocian cada causa con las medidas que la cortan; la última causa no recibe flecha.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="604" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Del plan final de 1987 a las causas: qué medida corta qué eslabón</tspan></text><rect x="10" y="51" width="330" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="175" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="175" dy="0">Software como única barrera</tspan></text><rect x="10" y="113" width="330" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="175" y="134.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="175" dy="0">Edición rápida deja parámetros</tspan></text><text x="175" y="150.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="175" dy="0">inconsistentes</tspan></text><rect x="10" y="175" width="330" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="175" y="204.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="175" dy="0">Contador de un byte omite la comprobación</tspan></text><rect x="10" y="237" width="330" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="175" y="266.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="175" dy="0">Dosimetría saturada: dosis aparente baja</tspan></text><rect x="10" y="299" width="330" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="175" y="328.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="175" dy="0">Pausas normalizadas</tspan></text><rect x="10" y="361" width="330" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="175" y="390.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="175" dy="0">Mensajes crípticos</tspan></text><rect x="10" y="423" width="330" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="175" y="452.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="175" dy="0">Sin registro de auditoría ni notificación</tspan></text><rect x="600" y="51" width="330" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="765" y="72.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="765" dy="0">Circuito de hardware: corta tras un pulso</tspan></text><text x="765" y="88.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="765" dy="0">alto</tspan></text><rect x="600" y="113" width="330" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="765" y="142.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="765" dy="0">Interlock y potenciómetro de la plataforma</tspan></text><rect x="600" y="175" width="330" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="765" y="204.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="765" dy="0">Teclas de edición limitadas</tspan></text><rect x="600" y="237" width="330" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="765" y="258.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="765" dy="0">Fallos de dosimetría suspenden; reingreso</tspan></text><text x="765" y="274.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="765" dy="0">de parámetros</tspan></text><rect x="600" y="299" width="330" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="765" y="328.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="765" dy="0">Mensajes claros y manuales</tspan></text><rect x="600" y="361" width="330" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="765" y="390.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="765" dy="0">Otros 23 cambios de software</tspan></text><polyline points="340,77 600,77" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="340,77 600,139" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="340,139 600,201" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="340,201 600,387" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="340,263 600,77" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="340,263 600,263" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="340,325 600,263" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="340,387 600,325" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="497" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="521.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La causa sin flecha, el registro de auditoría y la notificación, se atendió por otras vías: la reunión de usuarios pidió el</tspan></text><text x="470" y="538.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">registro y el fabricante alegó límites de memoria; la notificación obligatoria llegó con la ley de 1990.</tspan></text><text x="470" y="586.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
