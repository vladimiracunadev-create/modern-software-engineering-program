<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres bits, tres posiciones legales: lo que el software debía comprobar y un interlock podía imponer</title><desc id="d">Las ocho combinaciones de tres microinterruptores de la plataforma giratoria. Solo tres son posiciones legales: electrones, rayos X y luz de campo. Las otras cinco, incluida la de ningún interruptor pulsado, son posiciones intermedias o inválidas en las que el plan final impide el haz.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres bits, tres posiciones legales: lo que el software debía comprobar y un interlock podía imponer</tspan></text><text x="60" y="63" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="60" dy="0">Electrones</tspan></text><text x="160" y="63" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160" dy="0">Rayos X</tspan></text><text x="260" y="63" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="260" dy="0">Luz de campo</tspan></text><circle cx="60" cy="103.0" r="13" fill="#ffffff" stroke="#102a43" stroke-width="2"/><circle cx="160" cy="103.0" r="13" fill="#ffffff" stroke="#102a43" stroke-width="2"/><circle cx="260" cy="103.0" r="13" fill="#ffffff" stroke="#102a43" stroke-width="2"/><rect x="350" y="85" width="400" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="550" y="107.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Ningún interruptor: posición intermedia</tspan></text><circle cx="60" cy="149.0" r="13" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="160" cy="149.0" r="13" fill="#ffffff" stroke="#102a43" stroke-width="2"/><circle cx="260" cy="149.0" r="13" fill="#ffffff" stroke="#102a43" stroke-width="2"/><rect x="350" y="131" width="400" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="550" y="153.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="550" dy="0">Electrones: posición legal</tspan></text><circle cx="60" cy="195.0" r="13" fill="#ffffff" stroke="#102a43" stroke-width="2"/><circle cx="160" cy="195.0" r="13" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="260" cy="195.0" r="13" fill="#ffffff" stroke="#102a43" stroke-width="2"/><rect x="350" y="177" width="400" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="550" y="199.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="550" dy="0">Rayos X: posición legal</tspan></text><circle cx="60" cy="241.0" r="13" fill="#ffffff" stroke="#102a43" stroke-width="2"/><circle cx="160" cy="241.0" r="13" fill="#ffffff" stroke="#102a43" stroke-width="2"/><circle cx="260" cy="241.0" r="13" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="350" y="223" width="400" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="550" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="550" dy="0">Luz de campo: sin haz esperado</tspan></text><circle cx="60" cy="287.0" r="13" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="160" cy="287.0" r="13" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="260" cy="287.0" r="13" fill="#ffffff" stroke="#102a43" stroke-width="2"/><rect x="350" y="269" width="400" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="550" y="291.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Dos pulsados: inválida</tspan></text><circle cx="60" cy="333.0" r="13" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="160" cy="333.0" r="13" fill="#ffffff" stroke="#102a43" stroke-width="2"/><circle cx="260" cy="333.0" r="13" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="350" y="315" width="400" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="550" y="337.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Dos pulsados: inválida</tspan></text><circle cx="60" cy="379.0" r="13" fill="#ffffff" stroke="#102a43" stroke-width="2"/><circle cx="160" cy="379.0" r="13" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="260" cy="379.0" r="13" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="350" y="361" width="400" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="550" y="383.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Dos pulsados: inválida</tspan></text><circle cx="60" cy="425.0" r="13" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="160" cy="425.0" r="13" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="260" cy="425.0" r="13" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="350" y="407" width="400" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="550" y="429.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Tres pulsados: inválida</tspan></text><rect x="770" y="85" width="160" height="120" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="850" y="107.04" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="850" dy="0">Plan final:</tspan></text><text x="850" y="123.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="850" dy="0">interlock de</tspan></text><text x="850" y="140.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="850" dy="0">hardware y</tspan></text><text x="850" y="156.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="850" dy="0">potenciómetro que</tspan></text><text x="850" y="173.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="850" dy="0">muestra la posición</tspan></text><text x="850" y="190.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="850" dy="0">exacta</tspan></text><rect x="770" y="225" width="160" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="850" y="253.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="850" dy="0">Sin haz si la</tspan></text><text x="850" y="270.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="850" dy="0">plataforma está en</tspan></text><text x="850" y="286.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="850" dy="0">luz de campo o</tspan></text><text x="850" y="303.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="850" dy="0">entre posiciones</tspan></text><rect x="10" y="471" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="495.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Círculo lleno: microinterruptor pulsado. Cinco de ocho combinaciones deben rechazarse. Es un esquema del principio y no un</tspan></text><text x="470" y="512.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mapa mecánico: las combinaciones físicamente posibles dependen del diseño real.</tspan></text><text x="470" y="560.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
