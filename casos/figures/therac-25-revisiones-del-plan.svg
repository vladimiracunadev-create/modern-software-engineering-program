<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 456" width="940" height="456" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Catorce meses y cinco revisiones: de la declaración de defecto al plan final</title><desc id="d">Línea de tiempo en meses desde el 1 de mayo de 1986 hasta agosto de 1987 con carriles para el fabricante, el regulador, el uso restringido y el segundo accidente de Yakima. El fabricante presenta el plan en junio de 1986 y revisiones en noviembre, diciembre, marzo, mayo y julio de 1987. El regulador responde en julio, octubre, diciembre, abril y mayo. El uso queda restringido de febrero a agosto de 1987.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="456" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Catorce meses y cinco revisiones: de la declaración de defecto al plan final</tspan></text><line x1="224" y1="83" x2="224" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="275" x2="224" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="310" y1="83" x2="310" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="310" y1="275" x2="310" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="310" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">2</tspan></text><line x1="396" y1="83" x2="396" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="396" y1="275" x2="396" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="396" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="396" dy="0">4</tspan></text><line x1="482" y1="83" x2="482" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="482" y1="275" x2="482" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="482" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">6</tspan></text><line x1="568" y1="83" x2="568" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="568" y1="275" x2="568" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="568" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="568" dy="0">8</tspan></text><line x1="654" y1="83" x2="654" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="654" y1="275" x2="654" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="654" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="654" dy="0">10</tspan></text><line x1="740" y1="83" x2="740" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="740" y1="275" x2="740" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="740" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="740" dy="0">12</tspan></text><line x1="826" y1="83" x2="826" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="826" y1="275" x2="826" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="826" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="826" dy="0">14</tspan></text><line x1="912" y1="83" x2="912" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="275" x2="912" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">16</tspan></text><line x1="224" y1="275" x2="912" y2="275" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="111.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">Fabricante: planes</tspan></text><text x="214" y="159.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">Regulador: respuestas</tspan></text><text x="214" y="207.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">Uso restringido</tspan></text><text x="214" y="255.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">Accidente</tspan></text><line x1="224" y1="75" x2="224" y2="275" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="224" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="224" dy="0">2 may 1986: defecto</tspan></text><line x1="856.1" y1="75" x2="856.1" y2="275" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="856.1" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.1" dy="0">21 jul 1987</tspan></text><rect x="284.2" y="92" width="12.9" height="30" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="499.2" y="92" width="12.9" height="30" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="555.1" y="92" width="12.9" height="30" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="658.3" y="92" width="12.9" height="30" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="740" y="92" width="12.9" height="30" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="856.1" y="92" width="12.9" height="30" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="131" x2="912" y2="131" stroke="#d5dde1" stroke-width="1"/><rect x="340.1" y="140" width="12.9" height="30" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="477.7" y="140" width="12.9" height="30" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="537.9" y="140" width="12.9" height="30" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="709.9" y="140" width="12.9" height="30" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="774.4" y="140" width="12.9" height="30" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="179" x2="912" y2="179" stroke="#d5dde1" stroke-width="1"/><rect x="641.1" y="188" width="270.9" height="30" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="776.55" y="207.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="776.55" dy="0">restricción del uso rutinario</tspan></text><line x1="14" y1="227" x2="912" y2="227" stroke="#d5dde1" stroke-width="1"/><rect x="593.8" y="236" width="12.9" height="30" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="568" y="319" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="568" dy="0">meses desde el 1 de mayo de 1986</tspan></text><rect x="10" y="333" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="357.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada marca del fabricante es un envío del plan (junio de 1986 y revisiones 1 a 5 en las fechas del artículo); cada marca</tspan></text><text x="470" y="374.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del regulador, una respuesta pidiendo más información. La barra coral va de febrero a agosto de 1987. Meses: cálculo</tspan></text><text x="470" y="391.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">propio.</tspan></text><text x="470" y="438.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; fechas del artículo.</tspan></text></svg>
