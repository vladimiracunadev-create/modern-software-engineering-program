<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 464" width="940" height="464" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La edición dentro de la ventana de 8 segundos que el software no vigilaba</title><desc id="d">Línea de tiempo esquemática de 0 a 10 segundos. El software ajusta los imanes durante unos 8 segundos. La rutina Ptime comprueba si hay ediciones solo en su primera ejecución y luego borra la bandera. Si el operador teclea el modo, sube el cursor, cambia el modo y vuelve a la línea de comandos dentro de esos 8 segundos, la entrada de datos termina sin detectar el cambio y el haz queda ajustado con parámetros inconsistentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="464" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La edición dentro de la ventana de 8 segundos que el software no vigilaba</tspan></text><line x1="274" y1="83" x2="274" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="283" x2="274" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="401.6" y1="83" x2="401.6" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="401.6" y1="283" x2="401.6" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="401.6" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="401.6" dy="0">2</tspan></text><line x1="529.2" y1="83" x2="529.2" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="529.2" y1="283" x2="529.2" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="529.2" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="529.2" dy="0">4</tspan></text><line x1="656.8" y1="83" x2="656.8" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="656.8" y1="283" x2="656.8" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="656.8" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="656.8" dy="0">6</tspan></text><line x1="784.4" y1="83" x2="784.4" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="784.4" y1="283" x2="784.4" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="784.4" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.4" dy="0">8</tspan></text><line x1="912" y1="83" x2="912" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="283" x2="912" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">10</tspan></text><line x1="274" y1="283" x2="912" y2="283" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Software: ajuste de imanes</tspan></text><text x="264" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Ptime: ¿hay ediciones?</tspan></text><text x="264" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Operador</tspan></text><text x="264" y="262.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Resultado</tspan></text><line x1="784.4" y1="75" x2="784.4" y2="283" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="784.4" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784.4" dy="0">fin del ajuste</tspan></text><rect x="274" y="92" width="510.4" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="529.2" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="529.2" dy="0">Magnet y Ptime ajustan los imanes (unos 8 s)</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="274" y="142" width="63.8" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="337.8" y="142" width="446.6" height="32" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="561.1" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="561.1" dy="0">no vuelve a mirar</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="274" y="192" width="127.6" height="32" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="337.8" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337.8" dy="0">teclea x</tspan></text><rect x="401.6" y="192" width="255.2" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="529.2" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="529.2" dy="0">sube y cambia a e</tspan></text><rect x="656.8" y="192" width="63.8" height="32" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="688.7" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="688.7" dy="0">vuelve</tspan></text><line x1="14" y1="233" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><rect x="784.4" y="242" width="127.6" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="848.2" y="262.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="848.2" dy="0">inconsistente</tspan></text><text x="593" y="327" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593" dy="0">segundos desde que se completa la entrada de datos (esquemático)</tspan></text><rect x="10" y="341" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="365.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: unos 8 segundos de ajuste, una comprobación de ediciones solo en la primera pasada y que un operador</tspan></text><text x="470" y="382.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">experimentado, al editar rápido, producía Malfunction 54 con sobredosis. Esquemático: el reparto del tiempo del operador no</tspan></text><text x="470" y="399.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es una medición.</tspan></text><text x="470" y="446.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner (1993), descripción del código de entrada de datos de AECL. Los tramos del operador son ilustrativos.</tspan></text></svg>
