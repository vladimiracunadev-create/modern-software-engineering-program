<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A prueba de fallos: lo que existía, lo que falló y lo que debió existir</title><desc id="d">Tres columnas: mecanismos que existían (estructura de incidentes Bronze, Silver y Gold, playbooks de 48 horas, migración por etapas de algunos servicios, programa de reparación), los que fallaron o faltaban (retorno a Lloyds, prueba activo-activo, diligencia del proveedor, capacidad de quejas) y los que debieron existir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="560" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A prueba de fallos: lo que existía, lo que falló y lo que debió existir</tspan></text><rect x="10" y="51" width="296" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="158" dy="0">Existían (documentado)</tspan></text><rect x="10" y="103" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="128.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Estructura de incidentes Bronze,</tspan></text><text x="158" y="144.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Silver y Gold</tspan></text><rect x="10" y="171" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="204.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Playbooks para las primeras 48 horas</tspan></text><rect x="10" y="239" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="264.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Servicios migrados antes por etapas</tspan></text><text x="158" y="280.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">(según TSB)</tspan></text><rect x="10" y="307" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="340.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Plan maestro y replan</tspan></text><rect x="10" y="375" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="400.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Programa «Putting Things Right» desde</tspan></text><text x="158" y="416.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">mayo de 2018</tspan></text><rect x="316" y="51" width="296" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="464" dy="0">Fallaron o faltaban (documentado)</tspan></text><rect x="316" y="103" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="128.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Vuelta atrás a la plataforma de</tspan></text><text x="464" y="144.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Lloyds</tspan></text><rect x="316" y="171" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Prueba de configuración activo-activo</tspan></text><text x="464" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">completa</tspan></text><rect x="316" y="239" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="264.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Diligencia formal del proveedor y de</tspan></text><text x="464" y="280.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">sus terceros</tspan></text><rect x="316" y="307" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="340.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Capacidad de contacto y de quejas</tspan></text><rect x="316" y="375" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="408.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Ejercicios de incidente de semanas</tspan></text><rect x="622" y="51" width="296" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="770" dy="0">Debieron existir (análisis propio)</tspan></text><rect x="622" y="103" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="128.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Migración por oleadas con retorno</tspan></text><text x="770" y="144.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">ensayado</tspan></text><rect x="622" y="171" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Criterio de salida con evidencia por</tspan></text><text x="770" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">irreversibilidad</tspan></text><rect x="622" y="239" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Reconciliación de datos por oleada</tspan></text><rect x="622" y="307" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="340.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Ejercicios conjuntos con el proveedor</tspan></text><rect x="622" y="375" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="400.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Plan de escalado de quejas desde el</tspan></text><text x="770" y="416.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">inicio</tspan></text><rect x="10" y="453" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="477.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: había estructuras de incidente y de plan, pero dimensionadas para horas o días y sin la posibilidad de</tspan></text><text x="470" y="494.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">volver atrás. La columna de la derecha es análisis propio.</tspan></text><text x="470" y="542.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: FCA, Final Notice, párrafos 2.10 a 2.32 y TSB (2019); tercera columna: análisis propio.</tspan></text></svg>
