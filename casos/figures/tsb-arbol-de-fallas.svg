<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 536" width="940" height="536" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: qué tuvo que coincidir para ocho meses de crisis</title><desc id="d">Árbol de fallas con el evento principal arriba, clientes sin servicio normal hasta diciembre de 2018, y tres ramas: la plataforma falla, se migra pese a riesgos no resueltos y no hay recuperación posible; cada rama con sus condiciones documentadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="536" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: qué tuvo que coincidir para ocho meses de crisis</tspan></text><rect x="300" y="51" width="340" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="72.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Servicio degradado del 22 de abril al 10 de</tspan></text><text x="470" y="88.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">diciembre de 2018</tspan></text><circle cx="470" cy="127" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="132" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><polyline points="470,103 470,115" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="470" y1="139" x2="160" y2="161" stroke="#8a9aa3" stroke-width="1.4"/><line x1="470" y1="139" x2="470" y2="161" stroke="#8a9aa3" stroke-width="1.4"/><line x1="470" y1="139" x2="780" y2="161" stroke="#8a9aa3" stroke-width="1.4"/><rect x="30" y="161" width="260" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="160" y="192.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="160" dy="0">A. La plataforma falla</tspan></text><rect x="340" y="161" width="260" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="184.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">B. Se migra con riesgo sin</tspan></text><text x="470" y="200.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">resolver</tspan></text><rect x="650" y="161" width="260" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="780" y="192.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="780" dy="0">C. No hay vuelta ni recuperación</tspan></text><circle cx="160" cy="241" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="160" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="160" dy="0">O</tspan></text><line x1="160" y1="217" x2="160" y2="229" stroke="#8a9aa3" stroke-width="1.4"/><rect x="20" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="64" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="64" dy="0">Configuración</tspan></text><line x1="160" y1="253" x2="64" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="116" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="160" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">Capacidad</tspan></text><line x1="160" y1="253" x2="160" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="212" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="256" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="256" dy="0">Código</tspan></text><line x1="160" y1="253" x2="256" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="470" cy="241" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><line x1="470" y1="217" x2="470" y2="229" stroke="#8a9aa3" stroke-width="1.4"/><rect x="330" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="374" y="337.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="374" dy="0">Fecha</tspan></text><text x="374" y="353.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="374" dy="0">pública</tspan></text><line x1="470" y1="253" x2="374" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="426" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="329" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Pruebas</tspan></text><text x="470" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hasta el</tspan></text><text x="470" y="362.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">día antes</tspan></text><line x1="470" y1="253" x2="470" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="522" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="566" y="320.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="566" dy="0">Proveedor</tspan></text><text x="566" y="337.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="566" dy="0">sin</tspan></text><text x="566" y="353.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="566" dy="0">diligencia</tspan></text><text x="566" y="370.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="566" dy="0">formal</tspan></text><line x1="470" y1="253" x2="566" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="780" cy="241" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="780" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="780" dy="0">O</tspan></text><line x1="780" y1="217" x2="780" y2="229" stroke="#8a9aa3" stroke-width="1.4"/><rect x="640" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="684" y="329" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="684" dy="0">Sin</tspan></text><text x="684" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="684" dy="0">retorno a</tspan></text><text x="684" y="362.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="684" dy="0">Lloyds</tspan></text><line x1="780" y1="253" x2="684" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="736" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="780" y="337.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="780" dy="0">Planes de</tspan></text><text x="780" y="353.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="780" dy="0">48 horas</tspan></text><line x1="780" y1="253" x2="780" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="832" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="876" y="329" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="876" dy="0">Quejas</tspan></text><text x="876" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="876" dy="0">sin</tspan></text><text x="876" y="362.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="876" dy="0">capacidad</tspan></text><line x1="780" y1="253" x2="876" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="429" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="453.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: «Y» en la cima: hacían falta las tres ramas, y la ausencia de vuelta atrás (C) es lo que convierte un fallo</tspan></text><text x="470" y="470.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">técnico en una crisis de meses. Cortar B (decidir con evidencia) o C (poder volver) habría evitado o acotado el incidente.</tspan></text><text x="470" y="518.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en el Final Notice de la FCA; no es una conclusión del regulador. Hechos de los párrafos 2.9 a 2.31; la estructura lógica es propia.</tspan></text></svg>
