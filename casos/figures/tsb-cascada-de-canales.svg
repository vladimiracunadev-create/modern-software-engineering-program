<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La cascada: cada canal que falló empujó a los clientes al siguiente</title><desc id="d">Cadena de cinco pasos: fallos en la banca por internet y móvil llevan a los clientes al teléfono; el teléfono se satura y también falla por otros problemas de tecnología; los clientes acuden a las sucursales, donde los servicios eran lentos por fallos de tecnología; y las quejas desbordan la capacidad de gestión durante casi doce meses.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La cascada: cada canal que falló empujó a los clientes al siguiente</tspan></text><rect x="10" y="71" width="160" height="104" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="90" y="118.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="90" dy="0">Fallos en internet</tspan></text><text x="90" y="134.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="90" dy="0">y móvil</tspan></text><polyline points="170,123 200,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="200" y="71" width="160" height="104" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="280" y="118.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="280" dy="0">Los clientes llaman</tspan></text><text x="280" y="134.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="280" dy="0">por teléfono</tspan></text><polyline points="360,123 390,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="390" y="71" width="160" height="104" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="118.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">Teléfono saturado y</tspan></text><text x="470" y="134.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">con fallos propios</tspan></text><polyline points="550,123 580,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="580" y="71" width="160" height="104" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="660" y="110" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="660" dy="0">Colas en sucursales</tspan></text><text x="660" y="126.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="660" dy="0">con servicios</tspan></text><text x="660" y="143.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="660" dy="0">lentos</tspan></text><polyline points="740,123 770,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="770" y="71" width="160" height="104" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="850" y="110" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="850" dy="0">225 492 quejas;</tspan></text><text x="850" y="126.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="850" dy="0">casi 12 meses para</tspan></text><text x="850" y="143.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="850" dy="0">resolverlas</tspan></text><rect x="10" y="211" width="420" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="220" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="220" dy="0">Cada paso aumentaba la carga del siguiente: la demanda</tspan></text><text x="220" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="220" dy="0">se trasladaba, no se resolvía</tspan></text><rect x="470" y="211" width="460" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">El plan de crisis cubría las primeras 48 horas y ejercicios</tspan></text><text x="700" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">de unos pocos días; muchos incidentes duraron semanas</tspan></text><rect x="10" y="297" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: un fallo en un canal aparece como carga en los demás. La capacidad de teléfono y sucursales estaba</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dimensionada, según el regulador, por debajo del volumen que provocó el incidente.</tspan></text><text x="470" y="386.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: FCA, Final Notice a TSB Bank plc (20 de diciembre de 2022). Párrafos 2.6, 2.29 a 2.31.</tspan></text></svg>
