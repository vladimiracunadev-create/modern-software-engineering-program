<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contenedores: de los canales del cliente a la plataforma y sus proveedores</title><desc id="d">Diagrama de contenedores: los clientes usan cuatro canales (internet y móvil, teléfono, sucursales y tarjetas) que dependen de la plataforma Proteo4UK construida y operada por SABIS, que a su vez se apoya en 85 terceros; hasta abril de 2018 los canales dependían de la plataforma de Lloyds, a la que ya no se podía volver tras migrar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Contenedores: de los canales del cliente a la plataforma y sus proveedores</tspan></text><rect x="10" y="81" width="140" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="80" y="111.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="80" dy="0">5,2 millones de</tspan></text><text x="80" y="127.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="80" dy="0">clientes</tspan></text><rect x="180" y="51" width="420" height="130" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="194" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="194" dy="0">Canales de TSB</tspan></text><rect x="196" y="87" width="90" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="241" y="120.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="241" dy="0">Internet</tspan></text><text x="241" y="136.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="241" dy="0">y móvil</tspan></text><rect x="294" y="87" width="90" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="339" y="128.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="339" dy="0">Teléfono</tspan></text><rect x="392" y="87" width="90" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="437" y="128.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="437" dy="0">Sucursales</tspan></text><rect x="490" y="87" width="100" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="540" y="120.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="540" dy="0">Pagos y</tspan></text><text x="540" y="136.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="540" dy="0">tarjetas</tspan></text><rect x="640" y="57" width="290" height="118" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="785" y="103" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="785" dy="0">Plataforma Proteo4UK: diseñada,</tspan></text><text x="785" y="119.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="785" dy="0">construida, probada y operada por</tspan></text><text x="785" y="136.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="785" dy="0">SABIS (filial de Sabadell)</tspan></text><rect x="640" y="211" width="290" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="785" y="241.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">85 terceros de SABIS: para TSB,</tspan></text><text x="785" y="257.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">cuartas partes</tspan></text><rect x="180" y="211" width="420" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="390" y="241.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="390" dy="0">Plataforma de Lloyds: hasta el 22 de abril de 2018;</tspan></text><text x="390" y="257.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="390" dy="0">después, sin vuelta atrás</tspan></text><polyline points="150,116 180,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="600,116 640,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="785,175 785,211" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="390,211 390,181" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="307" width="300" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="333.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Contrato con Lloyds: uso posible hasta</tspan></text><text x="160" y="349.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">julio de 2024</tspan></text><rect x="330" y="307" width="300" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="333.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">SABIS aportaba el diseño, la migración</tspan></text><text x="480" y="349.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">de datos y la operación</tspan></text><rect x="650" y="307" width="280" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="790" y="333.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">Gobierno: consejo de TSB y comité</tspan></text><text x="790" y="349.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">ejecutivo</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: los cuatro canales colgaban de una sola plataforma nueva y de un solo proveedor con cadena de 85</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">subcontratistas. Tras la migración, la plataforma anterior dejó de ser una opción, y el único recurso era que SABIS</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">arreglara los incidentes.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: FCA, Final Notice a TSB Bank plc (20 de diciembre de 2022). Párrafos 2.1 a 2.5, 2.22 y 2.27. Esquema propio.</tspan></text></svg>
