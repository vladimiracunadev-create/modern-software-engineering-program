<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defensa en profundidad: ocho barreras antes del 22 de abril de 2018</title><desc id="d">Esquema de láminas con huecos: planificación, pruebas, documentación de diseño, evaluación del proveedor, confirmaciones de terceros críticos, revisión del consejo, continuidad e incidentes, y capacidad de atención de quejas; ninguna impidió migrar con riesgos no resueltos; una flecha las atraviesa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Defensa en profundidad: ocho barreras antes del 22 de abril de 2018</tspan></text><rect x="30" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="42" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="9" y="231" width="104" height="170" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="61" y="269.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">Planificación</tspan></text><text x="61" y="286.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">(plan</tspan></text><text x="61" y="303" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">maestro y</tspan></text><text x="61" y="319.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">replan, sin</tspan></text><text x="61" y="336.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">«izquierda</tspan></text><text x="61" y="352.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">a derecha»</tspan></text><text x="61" y="369.56" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">suficiente)</tspan></text><rect x="143" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="155" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="122" y="231" width="104" height="170" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="174" y="278.04" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="174" dy="0">Pruebas</tspan></text><text x="174" y="294.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="174" dy="0">(comprimidas,</tspan></text><text x="174" y="311.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="174" dy="0">en</tspan></text><text x="174" y="327.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="174" dy="0">paralelo;</tspan></text><text x="174" y="344.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="174" dy="0">fin el día</tspan></text><text x="174" y="361.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="174" dy="0">antes)</tspan></text><rect x="256" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="268" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="235" y="231" width="104" height="170" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="287" y="286.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="287" dy="0">Prueba</tspan></text><text x="287" y="303" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="287" dy="0">activo-activo</tspan></text><text x="287" y="319.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="287" dy="0">(reducida</tspan></text><text x="287" y="336.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="287" dy="0">en febrero</tspan></text><text x="287" y="352.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="287" dy="0">de 2018)</tspan></text><rect x="369" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="381" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="348" y="231" width="104" height="170" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="400" y="286.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="400" dy="0">Documentación</tspan></text><text x="400" y="303" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="400" dy="0">de diseño</tspan></text><text x="400" y="319.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="400" dy="0">(sustituida</tspan></text><text x="400" y="336.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="400" dy="0">por</tspan></text><text x="400" y="352.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="400" dy="0">configuración)</tspan></text><rect x="482" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="494" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="461" y="231" width="104" height="170" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="513" y="269.72" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">Evaluación</tspan></text><text x="513" y="286.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">del</tspan></text><text x="513" y="303" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">proveedor</tspan></text><text x="513" y="319.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">(sin</tspan></text><text x="513" y="336.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">diligencia</tspan></text><text x="513" y="352.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">formal</tspan></text><text x="513" y="369.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">inicial)</tspan></text><rect x="595" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="607" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="574" y="231" width="104" height="170" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="626" y="294.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="626" dy="0">Confirmaciones</tspan></text><text x="626" y="311.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="626" dy="0">de terceros</tspan></text><text x="626" y="327.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="626" dy="0">(con tareas</tspan></text><text x="626" y="344.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="626" dy="0">pendientes)</tspan></text><rect x="708" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="720" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="687" y="231" width="104" height="170" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="739" y="286.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">Revisión</tspan></text><text x="739" y="303" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">del consejo</tspan></text><text x="739" y="319.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">(limitaciones</tspan></text><text x="739" y="336.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">no</tspan></text><text x="739" y="352.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">discutidas)</tspan></text><rect x="821" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="833" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="800" y="231" width="104" height="170" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="852" y="286.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">Continuidad</tspan></text><text x="852" y="303" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">(planes de</tspan></text><text x="852" y="319.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">48 horas,</tspan></text><text x="852" y="336.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">ejercicios</tspan></text><text x="852" y="352.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">de días)</tspan></text><polyline points="10,136 930,136" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: las barreras existían, pero cada una estaba debilitada por la presión de la fecha: pruebas que se solapan,</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">documentación sustituida, confirmaciones con salvedades. Rojo: no se hizo o se redujo; dorado: se hizo con eficacia</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">parcial. La flecha es la decisión de migrar.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en el Final Notice de la FCA; no es una conclusión del regulador. Hechos: párrafos 2.10 a 2.31.</tspan></text></svg>
