<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias y puntos únicos de fallo después de migrar</title><desc id="d">Mapa de dependencias: la operación de TSB depende de un solo proveedor principal, que depende de 85 terceros, sin plataforma de vuelta; arriba el cliente, y debajo la dependencia de documentación de configuración en vez de diseño, la confirmación de cuatro terceros críticos, la carta del proveedor y la fecha pública.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dependencias y puntos únicos de fallo después de migrar</tspan></text><rect x="360" y="51" width="220" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">Cliente de TSB</tspan></text><rect x="60" y="151" width="240" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="180" y="179.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="180" dy="0">Proveedor principal: SABIS</tspan></text><text x="180" y="195.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="180" dy="0">(único)</tspan></text><rect x="360" y="151" width="220" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="179.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">Sin retorno a la plataforma</tspan></text><text x="470" y="195.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">de Lloyds</tspan></text><rect x="650" y="151" width="240" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="179.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">85 terceros de SABIS,</tspan></text><text x="770" y="195.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">visibilidad limitada</tspan></text><rect x="60" y="261" width="240" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="180" y="289.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="180" dy="0">Configuración en lugar de</tspan></text><text x="180" y="305.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="180" dy="0">diseño</tspan></text><rect x="360" y="261" width="220" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="289.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Carta del proveedor y</tspan></text><text x="470" y="305.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuatro terceros críticos</tspan></text><rect x="650" y="261" width="240" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="297.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Fecha pública de migración</tspan></text><polyline points="180,151 400,107" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,151 470,107" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="770,151 540,107" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="180,261 180,217" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,261 470,217" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="770,261 770,217" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="349" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: las cajas rojas son puntos únicos con efecto directo sobre el cliente; las doradas, las garantías que debían</tspan></text><text x="470" y="390.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sostenerlos. La carta de preparación y las confirmaciones de terceros eran en parte declaraciones de intención o tenían</tspan></text><text x="470" y="407.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tareas pendientes, no hechos.</tspan></text><text x="470" y="454.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en el Final Notice de la FCA; no es una conclusión del regulador. Hechos: párrafos 2.19 a 2.25.</tspan></text></svg>
