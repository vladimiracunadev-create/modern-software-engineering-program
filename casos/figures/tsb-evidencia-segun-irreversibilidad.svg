<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 466" width="940" height="466" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La evidencia que exige un cambio crece con su irreversibilidad</title><desc id="d">Escalera de tres peldaños: un cambio reversible exige una prueba y un retorno simple; un cambio parcialmente reversible exige pruebas de carga, ensayos con datos reales y criterios de salida; un cambio irreversible como migrar sin vuelta atrás exige además diligencia del proveedor, ensayos completos de incidente y decisión informada del consejo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="466" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La evidencia que exige un cambio crece con su irreversibilidad</tspan></text><rect x="10" y="231" width="290" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="155" y="271.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="155" dy="0">Reversible (un servicio, con retorno</tspan></text><text x="155" y="287.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="155" dy="0">inmediato): prueba y plan de vuelta</tspan></text><rect x="320" y="151" width="290" height="170" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="223" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="465" dy="0">Parcialmente reversible (una oleada):</tspan></text><text x="465" y="239.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="465" dy="0">carga, datos reales, activo-activo y</tspan></text><text x="465" y="256.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="465" dy="0">criterios de salida</tspan></text><rect x="630" y="71" width="300" height="250" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="780" y="158.04" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="780" dy="0">Irreversible (migración total sin</tspan></text><text x="780" y="174.68" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="780" dy="0">retorno): todo lo anterior, diligencia</tspan></text><text x="780" y="191.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="780" dy="0">formal del proveedor y sus</tspan></text><text x="780" y="207.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="780" dy="0">subcontratistas, incidentes de semanas</tspan></text><text x="780" y="224.6" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="780" dy="0">y decisión del consejo con riesgos</tspan></text><text x="780" y="241.24" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="780" dy="0">escritos</tspan></text><polyline points="300,276 320,276" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,236 630,236" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="14" y="61" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Más irreversible → más evidencia exigida</tspan></text><rect x="10" y="343" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="367.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: La migración estaba en el peldaño más alto; la evidencia que describe el Final Notice (pruebas hasta el día</tspan></text><text x="470" y="384.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">antes, una prueba clave reducida, un proveedor sin diligencia formal) se parece más a la de un peldaño inferior. Es una</tspan></text><text x="470" y="401.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">regla de diseño propia, no un criterio del regulador.</tspan></text><text x="470" y="448.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en el Final Notice de la FCA; no es una conclusión del regulador.</tspan></text></svg>
