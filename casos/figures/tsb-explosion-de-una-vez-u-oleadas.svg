<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántos clientes ven un error nuevo el primer día: de una vez y por oleadas</title><desc id="d">Modelo didáctico: con la migración de una vez, el cien por cien de los 5,2 millones de clientes queda expuesto al primer error de la plataforma; con diez oleadas iguales y vuelta atrás probada, solo el diez por ciento, unos 520 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántos clientes ven un error nuevo el primer día: de una vez y por oleadas</tspan></text><line x1="344" y1="49" x2="344" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="181" x2="344" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0</tspan></text><line x1="433.96" y1="49" x2="433.96" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="433.96" y1="181" x2="433.96" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="433.96" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433.96" dy="0">1</tspan></text><line x1="523.92" y1="49" x2="523.92" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="523.92" y1="181" x2="523.92" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="523.92" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="523.92" dy="0">2</tspan></text><line x1="613.88" y1="49" x2="613.88" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="613.88" y1="181" x2="613.88" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="613.88" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="613.88" dy="0">3</tspan></text><line x1="703.84" y1="49" x2="703.84" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="703.84" y1="181" x2="703.84" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="703.84" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="703.84" dy="0">4</tspan></text><line x1="793.8" y1="49" x2="793.8" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="793.8" y1="181" x2="793.8" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="793.8" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="793.8" dy="0">5</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="181" x2="883.76" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">6</tspan></text><line x1="344" y1="181" x2="883.76" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="334" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Migración de una vez (como en abril de</tspan></text><text x="334" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">2018)</tspan></text><text x="334" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Cinco oleadas iguales</tspan></text><text x="334" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Diez oleadas iguales</tspan></text><rect x="344" y="55" width="467.792" height="32" rx="3" fill="#c0432f"/><text x="818.792" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="818.792" dy="0">5,20</tspan></text><rect x="344" y="99" width="93.5584" height="32" rx="3" fill="#c0432f"/><text x="444.558" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="444.558" dy="0">1,04</tspan></text><rect x="344" y="143" width="46.7792" height="32" rx="3" fill="#c0432f"/><text x="397.779" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="397.779" dy="0">0,52</tspan></text><text x="613.88" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="613.88" dy="0">Millones de clientes expuestos (5,2 millones en total)</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El modelo supone oleadas del mismo tamaño y un error visible en la primera; solo muestra el orden de magnitud de la</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">exposición. La FCA documenta que el evento único afectó a todas las sucursales y a una proporción significativa de los 5,2</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">millones de clientes. Las oleadas tienen un coste propio de coexistencia y de datos duplicados que no se mide aquí.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo didáctico con valores ilustrativos. Fuente del total: FCA/PRA, comunicado del 20 de diciembre de 2022.</tspan></text></svg>
