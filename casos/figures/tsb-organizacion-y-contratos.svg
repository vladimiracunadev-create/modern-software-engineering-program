<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 572" width="940" height="572" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién contrataba con quién: propietario, banco, proveedor y regulador</title><desc id="d">Esquema de organizaciones y contratos: Banco Sabadell como propietario de TSB, el grupo holding y el banco TSB con su consejo y su comité ejecutivo, el proveedor SABIS con 85 terceros bajo contratos de servicios, Lloyds como proveedor anterior, y la FCA y la PRA como reguladores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="572" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién contrataba con quién: propietario, banco, proveedor y regulador</tspan></text><rect x="310" y="51" width="320" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="74.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Banco Sabadell: propietario desde julio</tspan></text><text x="470" y="90.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">de 2015</tspan></text><rect x="310" y="135" width="320" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="158.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">TSB Banking Group plc: holding; su</tspan></text><text x="470" y="174.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">consejo y el del banco</tspan></text><rect x="310" y="219" width="320" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="242.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">TSB Bank plc: banco minorista; comité</tspan></text><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">ejecutivo (BEC)</tspan></text><polyline points="470,107 470,135" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,191 470,219" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="135" width="250" height="80" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="162" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="135" dy="0">Lloyds Banking Group:</tspan></text><text x="135" y="178.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="135" dy="0">plataforma anterior; contrato</tspan></text><text x="135" y="195.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="135" dy="0">hasta julio de 2024</tspan></text><rect x="680" y="135" width="250" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="805" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="805" dy="0">SABIS (Sabadell Information</tspan></text><text x="805" y="178.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="805" dy="0">Systems): diseña, construye,</tspan></text><text x="805" y="195.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="805" dy="0">prueba, migra y opera</tspan></text><polyline points="310,247 135,215" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="630,247 805,215" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="243" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560" dy="0">contrato de servicios</tspan></text><rect x="680" y="271" width="250" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="805" y="296.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="805" dy="0">85 terceros de SABIS (cuartas</tspan></text><text x="805" y="312.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="805" dy="0">partes para TSB)</tspan></text><polyline points="805,215 805,271" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="301" width="450" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="332.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="235" dy="0">FCA y PRA: reguladores que sancionaron en diciembre de 2022</tspan></text><rect x="480" y="371" width="450" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="394.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">5,2 millones de clientes (junio de 2014: banco escindido de</tspan></text><text x="705" y="410.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Lloyds)</tspan></text><rect x="10" y="449" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="473.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el banco era una pieza de un grupo en el que el diseño, la construcción y la operación de la plataforma</tspan></text><text x="470" y="490.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estaban en un proveedor del mismo propietario, con una cadena de subcontratistas debajo. El Final Notice destaca que el</tspan></text><text x="470" y="507.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consejo debía supervisar ese proveedor como un tercero.</tspan></text><text x="470" y="554.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: FCA, Final Notice, párrafos 2.1 a 2.4, 2.18 y 2.22 y definiciones. Plantilla, oficinas y organigrama interno: no se sabe.</tspan></text></svg>
