<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 516" width="940" height="516" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién da qué a quién: los actores del mercado de Uber</title><desc id="d">Diagrama de incentivos: quien pide un viaje o un pedido paga un precio fijo por adelantado; el conductor o repartidor cobra según tiempo y distancia reales; el comercio vende por la plataforma; Uber cobra la diferencia como ingreso y soporta el riesgo de precio; las ciudades y reguladores fijan reglas; los competidores presionan precios e incentivos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="516" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién da qué a quién: los actores del mercado de Uber</tspan></text><rect x="340" y="160" width="260" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="195" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Uber: empareja, fija el precio,</tspan></text><text x="470" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">cobra, cubre el riesgo de precio</tspan></text><text x="470" y="228.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">y opera la plataforma</tspan></text><rect x="10" y="56" width="250" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="78" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">Quien pide: ve un precio fijo</tspan></text><text x="135" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">por adelantado y paga por el</tspan></text><text x="135" y="111.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">servicio</tspan></text><rect x="345" y="56" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Conductor o repartidor: cobra</tspan></text><text x="470" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">por tiempo y distancia reales</tspan></text><rect x="680" y="56" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="805" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">Comercio o restaurante: vende</tspan></text><text x="805" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">por la plataforma (Delivery)</tspan></text><rect x="10" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="135" y="330.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Empresas clientes y cargadores:</tspan></text><text x="135" y="346.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">movilidad y envíos (Freight)</tspan></text><rect x="345" y="300" width="250" height="80" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="318.68" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Ciudades y reguladores:</tspan></text><text x="470" y="335.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">licencias, seguros,</tspan></text><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">clasificación laboral, tarifas</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">máximas</tspan></text><rect x="680" y="300" width="250" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="805" y="330.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="805" dy="0">Competidores: obligan a ofrecer</tspan></text><text x="805" y="346.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="805" dy="0">incentivos y bajar precios</tspan></text><polyline points="200,126 340,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="235" y="150" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">precio fijo</tspan></text><polyline points="470,126 470,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="505" y="148" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505" dy="0">viaje</tspan></text><polyline points="670,126 600,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="660" y="160" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="660" dy="0">pedido</tspan></text><polyline points="340,236 230,300" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,256 470,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,300 600,236" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="390" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el 10-K de 2025: el usuario recibe un precio fijo por adelantado mientras a quien conduce se le paga por el</tspan></text><text x="470" y="431.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tiempo y la distancia reales, que Uber reconoce la diferencia, que hay regulación fragmentada de licencias, seguros y</tspan></text><text x="470" y="448.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">clasificación de conductores, y que los competidores recurren a incentivos. No se sabe cómo se negocia con comercios ni con</tspan></text><text x="470" y="464.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">empresas clientes.</tspan></text><text x="470" y="502.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
