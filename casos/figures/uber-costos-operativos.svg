<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costos operativos de Uber por rubro, 2023-2025 (porcentaje de los ingresos)</title><desc id="d">Barras apiladas al cien por ciento: el coste de ingresos se mantiene cerca de 60 por ciento de los ingresos; ventas y marketing baja de 11,7 a 9,4 por ciento, investigación y desarrollo de 8,5 a 6,5, y el resultado operativo sube de 3,0 a 6,4 y a 10,7 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costos operativos de Uber por rubro, 2023-2025 (porcentaje de los ingresos)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Coste de ingresos</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Ventas y marketing</tspan></text><rect x="375.9" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="395.9" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="395.9" dy="0">Investigación y desarrollo</tspan></text><rect x="16" y="69" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" d