<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 451" width="940" height="451" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 6, datos: tres generaciones de almacenamiento y qué corrigió cada una</title><desc id="d">Diagrama de tres generaciones: un monolito sobre Postgres con amplificación de escritura, replicación verbosa y actualizaciones difíciles; MySQL con Schemaless y Cassandra con la regla del último que escribe en 2014; y Spanner con transacciones y un mecanismo propio de ejecución posterior a la confirmación desde 2021.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="451" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 6, datos: tres generaciones de almacenamiento y qué corrigió cada una</tspan></text><rect x="10" y="56" width="292" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="156" y="84.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="156" dy="0">Monolito: Postgres</tspan></text><rect x="10" y="118" width="292" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="144.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Escrituras amplificadas: un campo</tspan></text><text x="156" y="160.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">cambia varios índices</tspan></text><rect x="10" y="190" width="292" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="216.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Replicación física verbosa entre</tspan></text><text x="156" y="232.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">centros de datos</tspan></text><rect x="10" y="262" width="292" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="288.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Actualizar de versión exigía horas de</tspan></text><text x="156" y="304.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">parada</tspan></text><rect x="324" y="56" width="292" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="75.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">2014-2016: MySQL, Schemaless,</tspan></text><text x="470" y="93.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Cassandra</tspan></text><rect x="324" y="118" width="292" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Schemaless: particionado sobre MySQL</tspan></text><rect x="324" y="190" width="292" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="216.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Cassandra y Redis en cumplimiento,</tspan></text><text x="470" y="232.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">disponibilidad antes que consistencia</tspan></text><rect x="324" y="262" width="292" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="288.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Sin atomicidad: reconciliar fallos a</tspan></text><text x="470" y="304.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">mano</tspan></text><rect x="638" y="56" width="292" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="784" y="84.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="784" dy="0">2021: Spanner</tspan></text><rect x="638" y="118" width="292" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="144.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">Consistencia fuerte y transacciones</tspan></text><text x="784" y="160.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">entre filas y regiones</tspan></text><rect x="638" y="190" width="292" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="216.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">LATE: ejecución posterior a la</tspan></text><text x="784" y="232.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">confirmación, al menos una vez</tspan></text><rect x="638" y="262" width="292" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="296.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">Primera base NewSQL de Uber</tspan></text><polyline points="302,80 324,80" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="616,80 638,80" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="342" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en los artículos de 2016 (Postgres a MySQL) y 2021 (plataforma de cumplimiento): los problemas de Postgres, el</tspan></text><text x="470" y="383.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">diseño de 2014 y el motivo del cambio a Spanner. El orden de las columnas es el orden conceptual de la historia, no una</tspan></text><text x="470" y="400.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cronología exacta: Schemaless y la plataforma de 2014 coexistieron.</tspan></text><text x="470" y="437.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
