<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 468" width="940" height="468" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema del negocio: el dinero de un viaje, de quien paga a quien conduce</title><desc id="d">Diagrama de flujos: quien pide paga un precio fijo; la plataforma recibe las reservas brutas, paga a conductores y repartidores e incentivos a usuarios, cubre seguro, pagos y soporte, y retiene el resultado; en 2025 las reservas fueron de 193 454 millones y los ingresos de 52 017 millones, con un resultado operativo de 5 565 millones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="468" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema del negocio: el dinero de un viaje, de quien paga a quien conduce</tspan></text><rect x="10" y="70" width="200" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Quien pide: paga el</tspan></text><text x="110" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">precio fijo (reservas</tspan></text><text x="110" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">brutas)</tspan></text><rect x="10" y="170" width="200" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="110" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">Comercio o cargador:</tspan></text><text x="110" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">paga comisión o tarifa</tspan></text><rect x="310" y="110" width="250" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="435" y="147" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="435" dy="0">Uber: reservas brutas de 193</tspan></text><text x="435" y="163.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="435" dy="0">454 millones y ingresos de 52</tspan></text><text x="435" y="180.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="435" dy="0">017 millones en 2025</tspan></text><rect x="660" y="56" width="270" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="77.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">Pagos a quienes conducen o</tspan></text><text x="795" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">reparten, e incentivos</tspan></text><rect x="660" y="118" width="270" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="139.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">Seguro, pagos, soporte, tecnología</tspan></text><text x="795" y="155.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">y personal</tspan></text><rect x="660" y="180" width="270" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="201.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">Costes corporativos e</tspan></text><text x="795" y="217.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">investigación de plataforma</tspan></text><rect x="660" y="242" width="270" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="795" y="263.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">Resultado operativo: 5 565</tspan></text><text x="795" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">millones (10,7 %)</tspan></text><polyline points="210,110 310,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="210,210 310,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="560,160 660,82" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="560,160 660,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="560,160 660,206" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="560,160 660,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="270" width="560" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="290" y="293.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="290" dy="0">Valor que vuelve: certeza de llegada y de precio para quien pide, trabajo</tspan></text><text x="290" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="290" dy="0">flexible para quien conduce, ventas para el comercio</tspan></text><rect x="10" y="342" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el 10-K de 2025: la distinción entre reservas e ingresos, que los pagos a conductores se contabilizan como</tspan></text><text x="470" y="383.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">coste de ingresos o se descuentan del ingreso según el mercado, los costes directos e incentivos, y que «otros» incluye</tspan></text><text x="470" y="400.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">seguro de viaje, comisiones de pago y soporte. Las proporciones entre las cajas de la derecha no se muestran a escala: ver</tspan></text><text x="470" y="416.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la figura de costos.</tspan></text><text x="470" y="454.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Uber, Form 10-K de 2020, 2023 y 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
