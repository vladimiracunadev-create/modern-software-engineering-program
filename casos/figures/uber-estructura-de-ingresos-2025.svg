<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se queda Uber de cada dólar de ingreso en 2025: movilidad y reparto</title><desc id="d">Barras apiladas al cien por ciento: en movilidad, 29 por ciento de los ingresos son costes directos de los participantes, 44 por ciento otros costes y 27 por ciento resultado ajustado del segmento; en reparto, 41, 38 y 21 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se queda Uber de cada dólar de ingreso en 2025: movilidad y reparto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Costes directos de participantes e incentivos</tspan></text><rect x="403.3" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="423.3" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="423.3" dy="0">Otros costes (seguro, pagos, soporte, tecnología, personal)</tspan></text><rect x="16" y="69" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Resultado ajustado del segmento</tspan></text><line x1="114" y1="101" x2="114" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="114" y1="181" x2="114" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="114" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="114" dy="0">0</tspan></text><line x1="304.425" y1="101" x2="304.425" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="304.425" y1="181" x2="304.425" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="304.425" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="304.425" dy="0">25</tspan></text><line x1="494.85" y1="101" x2="494.85" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="494.85" y1="181" x2="494.85" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="494.85" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.85" dy="0">50</tspan></text><line x1="685.275" y1="101" x2="685.275" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="685.275" y1="181" x2="685.275" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="685.275" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685.275" dy="0">75</tspan></text><line x1="875.7" y1="101" x2="875.7" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="181" x2="875.7" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="114" y1="181" x2="875.7" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="104" y="125.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="104" dy="0">Movilidad</tspan></text><text x="104" y="165.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="104" dy="0">Reparto</tspan></text><rect x="114" y="108" width="223.178" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="225.589" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="225.589" dy="0">29 %</tspan></text><rect x="337.178" y="108" width="335.91" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="505.133" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="505.133" dy="0">44 %</tspan></text><rect x="673.088" y="108" width="202.612" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="774.394" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="774.394" dy="0">27 %</tspan></text><text x="882.7" y="125.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="114" y="148" width="313.372" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="270.686" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="270.686" dy="0">41 %</tspan></text><rect x="427.372" y="148" width="290.498" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="572.621" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572.621" dy="0">38 %</tspan></text><rect x="717.87" y="148" width="157.83" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="796.785" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="796.785" dy="0">21 %</tspan></text><text x="882.7" y="165.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="494.85" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.85" dy="0">% del total</tspan></text><rect x="10" y="239" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los costes directos son lo que se paga a quienes conducen o reparten y los incentivos a usuarios; «otros» incluye seguro de</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">viaje, comisiones de tarjetas y bancos, soporte y tecnología, y el personal sin remuneración en acciones. Carga queda</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fuera: sus costes directos son 90 por ciento de sus ingresos y su resultado es levemente negativo. Cálculo propio con el</tspan></text><text x="470" y="313.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">10-K de 2025.</tspan></text><text x="470" y="361.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Uber, Form 10-K de 2020, 2023 y 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
