<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo evolucionó la arquitectura: del monolito a dominios</title><desc id="d">Tres columnas: monolito en Python con Postgres en la etapa inicial; microservicios desde 2012-2013 con Schemaless, Ringpop y Cassandra; dominios, capas y puertas de entrada en 2020 con una plataforma de cumplimiento nueva sobre Spanner en 2021.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo evolucionó la arquitectura: del monolito a dominios</tspan></text><rect x="10" y="56" width="292" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="156" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="156" dy="0">2010-2012: monolito</tspan></text><rect x="10" y="112" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Backend monolítico en Python con</tspan></text><text x="156" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Postgres</tspan></text><rect x="10" y="194" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="224.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">El problema parecía operativo, no</tspan></text><text x="156" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">técnico</tspan></text><rect x="10" y="276" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Lanzamiento en San Francisco, 31 de</tspan></text><text x="156" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">mayo de 2010</tspan></text><rect x="324" y="56" width="292" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">2012-2019: microservicios</tspan></text><rect x="324" y="112" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Adopción de microservicios hacia</tspan></text><text x="470" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">2012-2013</tspan></text><rect x="324" y="194" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="224.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Schemaless, Ringpop y Cassandra para</tspan></text><text x="470" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">escala y disponibilidad</tspan></text><rect x="324" y="276" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="314.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">H3 (2018) y Cadence (2017, abierto)</tspan></text><rect x="638" y="56" width="292" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="784" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="784" dy="0">2020-2021: dominios y consistencia</tspan></text><rect x="638" y="112" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">DOMA: dominios, capas, puertas y</tspan></text><text x="784" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">extensiones (2020)</tspan></text><rect x="638" y="194" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="224.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">Unos 2 200 microservicios críticos y</tspan></text><text x="784" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">su complejidad</tspan></text><rect x="638" y="276" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">Cumplimiento nuevo sobre Spanner</tspan></text><text x="784" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">(2021)</tspan></text><polyline points="302,78 324,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="616,78 638,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="368" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="392.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Etapas del curso sobre hechos citados (relato de 2010, artículos de ingeniería de 2016 a 2021). Las fronteras son</tspan></text><text x="470" y="409.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aproximadas: Uber dice «alrededor de 2012-2013» para los microservicios y no fecha cada corte. No se sabe qué parte de lo</tspan></text><text x="470" y="426.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">descrito sigue vigente.</tspan></text><text x="470" y="463.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
