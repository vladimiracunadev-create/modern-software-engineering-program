"484.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="484.85" dy="0">miles de millones de USD</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El resultado ajustado por segmento en 2025 fue 7 899 millones en movilidad (27 por ciento de sus ingresos), 3 572 en</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reparto (21 por ciento) y menos 33 en carga (cálculo propio con el 10-K). La carga es la línea que no crece ni gana. La</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">suma de los segmentos no incluye los costes corporativos de 2 708 millones en 2025.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Uber, Form 10-K de 2020, 2023 y 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
