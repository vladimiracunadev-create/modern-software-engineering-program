ron 14 por ciento porque las reservas de movilidad cayeron 46 por ciento</tspan></text><text x="470" y="525.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mientras el reparto casi se duplicó. Las cifras de 2016 y 2017 proceden de los datos seleccionados del 10-K de 2020.</tspan></text><text x="470" y="572.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Uber, Form 10-K de 2020, 2023 y 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
