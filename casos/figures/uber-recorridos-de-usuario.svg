<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 571" width="940" height="571" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco recorridos completos: de la primera interacción al caso límite</title><desc id="d">Cinco filas de pasos encadenados: quien pide un viaje, quien pide comida, el conductor, el comercio y el cargador de Freight; cada fila termina en su caso límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="571" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco recorridos completos: de la primera interacción al caso límite</tspan></text><rect x="10" y="54" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Pasajero</tspan></text><rect x="174" y="54" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Pide origen y destino</tspan></text><rect x="366.5" y="54" width="178.5" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455.75" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">Ve un precio fijo por</tspan></text><text x="455.75" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">adelantado</tspan></text><polyline points="352.5,86 366.5,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="54" width="178.5" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="648.25" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">Se empareja con un</tspan></text><text x="648.25" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">conductor</tspan></text><polyline points="545,86 559,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="54" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: nadie cerca o</tspan></text><text x="840.75" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">precio capado por ley</tspan></text><polyline points="737.5,86 751.5,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="130" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="165.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Quien pide comida</tspan></text><rect x="174" y="130" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="157.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Elige comercio y</tspan></text><text x="263.25" y="173.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">pedido</tspan></text><rect x="366.5" y="130" width="178.5" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455.75" y="165.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">Se busca repartidor</tspan></text><polyline points="352.5,162 366.5,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="130" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="648.25" y="157.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">Tres partes</tspan></text><text x="648.25" y="173.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">coordinadas</tspan></text><polyline points="545,162 559,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="130" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="840.75" y="149" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: el comercio</tspan></text><text x="840.75" y="165.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">rechaza o el reparto</tspan></text><text x="840.75" y="182.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">se retrasa</tspan></text><polyline points="737.5,162 751.5,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="206" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="241.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Conductor</tspan></text><rect x="174" y="206" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Se conecta y recibe</tspan></text><text x="263.25" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">ofertas</tspan></text><rect x="366.5" y="206" width="178.5" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455.75" y="241.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">Acepta y recoge</tspan></text><polyline points="352.5,238 366.5,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="206" width="178.5" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="648.25" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">Cobra por tiempo y</tspan></text><text x="648.25" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">distancia</tspan></text><polyline points="545,238 559,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="206" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: clasificación</tspan></text><text x="840.75" y="241.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">laboral y salario</tspan></text><text x="840.75" y="258.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">mínimo</tspan></text><polyline points="737.5,238 751.5,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="282" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Comercio</tspan></text><rect x="174" y="282" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="263.25" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Se registra en</tspan></text><text x="263.25" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Delivery</tspan></text><rect x="366.5" y="282" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="455.75" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">Recibe pedidos</tspan></text><polyline points="352.5,314 366.5,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="282" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="648.25" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">Prepara y entrega al</tspan></text><text x="648.25" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">repartidor</tspan></text><polyline points="545,314 559,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="282" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="840.75" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: pico de</tspan></text><text x="840.75" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">pedidos sin cocina</tspan></text><polyline points="737.5,314 751.5,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="358" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="385.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Cargador</tspan></text><text x="85" y="401.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">(Freight)</tspan></text><rect x="174" y="358" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="263.25" y="393.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Publica una carga</tspan></text><rect x="366.5" y="358" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="455.75" y="385.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">Se asigna un</tspan></text><text x="455.75" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">transportista</tspan></text><polyline points="352.5,390 366.5,390" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="358" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="648.25" y="393.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">Seguimiento del envío</tspan></text><polyline points="545,390 559,390" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="358" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="385.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: la línea</tspan></text><text x="840.75" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">sigue sin ganancias</tspan></text><polyline points="737.5,390 751.5,390" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="14" y="448" font-size="13" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="14" dy="0">Trazo punteado: paso inferido. Cajas coral: el caso límite de cada recorrido.</tspan></text><rect x="10" y="462" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="486.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los pasos continuos salen del 10-K de 2025 (precio fijo por adelantado, pago por tiempo y distancia, Prop. 22, tarifas</tspan></text><text x="470" y="503.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">máximas) y de los artículos de ingeniería (emparejamiento, mercado de tres lados). Los punteados son comportamiento visible</tspan></text><text x="470" y="520.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">o plausible, no mecanismo publicado; el resultado negativo de Freight es el dato del 10-K.</tspan></text><text x="470" y="557.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
