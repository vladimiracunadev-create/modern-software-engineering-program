<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 529" width="940" height="529" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 4, secuencia: por qué el modelo de mejor esfuerzo se sobrescribía (modelo didáctico)</title><desc id="d">Diagrama de secuencia didáctico de dos escrituras concurrentes sobre un mismo viaje durante una conmutación de región: dos trabajadores creen ser el dueño, ambos escriben, gana la última escritura y se pierde un cambio; el nuevo diseño transaccional rechaza la segunda.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="529" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 4, secuencia: por qué el modelo de mejor esfuerzo se sobrescribía (modelo didáctico)</tspan></text><rect x="47.5" y="58" width="170" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132.5" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132.5" dy="0">Trabajador A (dueño</tspan></text><text x="132.5" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132.5" dy="0">antiguo)</tspan></text><rect x="272.5" y="58" width="170" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="357.5" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="357.5" dy="0">Almacén antiguo</tspan></text><text x="357.5" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="357.5" dy="0">(último gana)</tspan></text><rect x="497.5" y="58" width="170" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582.5" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="582.5" dy="0">Trabajador B (dueño</tspan></text><text x="582.5" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="582.5" dy="0">nuevo)</tspan></text><rect x="722.5" y="58" width="170" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807.5" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807.5" dy="0">Almacén nuevo</tspan></text><text x="807.5" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807.5" dy="0">(transaccional)</tspan></text><line x1="132.5" y1="104" x2="132.5" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="357.5" y1="104" x2="357.5" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="582.5" y1="104" x2="582.5" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="807.5" y1="104" x2="807.5" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="135.5,150 354.5,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="245" dy="0">1. Escribe estado «aceptado»</tspan></text><polyline points="579.5,194 360.5,194" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">2. Escribe estado «cancelado»</tspan></text><polyline points="357.5,232 403.5,232 403.5,246 361.5,246" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="411.5" y="242" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="411.5" dy="0">3. Gana la última escritura; se pierde la otra</tspan></text><polyline points="135.5,282 804.5,282" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">4. Escribe estado «aceptado»</tspan></text><polyline points="585.5,326 804.5,326" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="695" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="695" dy="0">5. Escribe estado «cancelado»</tspan></text><polyline points="807.5,364 853.5,364 853.5,378 811.5,378" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="861.5" y="374" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="861.5" dy="0">6. Una sola transacción gana; la otra se rechaza</tspan></text><rect x="10" y="420" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="444.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Documentado: durante despliegues o conmutaciones de región podían producirse escrituras concurrentes con la regla del</tspan></text><text x="470" y="461.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">último que escribe, lo que obligaba a reconciliar, y el rediseño usa un almacén con transacciones. Los dos escenarios</tspan></text><text x="470" y="478.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">dibujados son un modelo didáctico del mecanismo, no un incidente real descrito por Uber.</tspan></text><text x="470" y="515.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Esquema pedagógico: las cajas punteadas son inferencia del curso, no arquitectura confirmada por Uber.</tspan></text></svg>
