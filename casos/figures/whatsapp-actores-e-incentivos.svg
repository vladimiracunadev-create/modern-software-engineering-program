<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 499" width="940" height="499" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién da qué a quién: los actores del ecosistema de WhatsApp</title><desc id="d">Diagrama de incentivos: la persona usa gratis un servicio cifrado; la empresa pequeña usa la aplicación Business; la empresa grande y el desarrollador usan la Cloud API de Meta y pagan por mensajes; Meta aloja y opera; las tiendas de aplicaciones distribuyen; los reguladores fijan reglas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="499" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién da qué a quién: los actores del ecosistema de WhatsApp</tspan></text><rect x="340" y="150" width="260" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="187" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">WhatsApp dentro de Meta: opera</tspan></text><text x="470" y="203.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">los servidores de conexión,</tspan></text><text x="470" y="220.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">claves y mensajes pendientes</tspan></text><rect x="10" y="56" width="250" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="78" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">Persona: manda mensajes y</tspan></text><text x="135" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">llamadas gratis, con cifrado</tspan></text><text x="135" y="111.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">por defecto</tspan></text><rect x="345" y="56" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="78" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Grupo y comunidad: varias</tspan></text><text x="470" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">personas comparten un mismo</tspan></text><text x="470" y="111.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">canal</tspan></text><rect x="680" y="56" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="805" y="78" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">Empresa pequeña: atiende</tspan></text><text x="805" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">clientes con la aplicación</tspan></text><text x="805" y="111.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805" dy="0">Business</tspan></text><rect x="10" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="135" y="322" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Tiendas de aplicaciones y</tspan></text><text x="135" y="338.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">fabricantes: distribuyen e</tspan></text><text x="135" y="355.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">instalan el cliente</tspan></text><rect x="345" y="300" width="250" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="470" y="322" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Reguladores y fuerzas de</tspan></text><text x="470" y="338.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">seguridad: reglas de datos,</tspan></text><text x="470" y="355.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">competencia y contenido</tspan></text><rect x="680" y="300" width="250" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="805" y="322" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="805" dy="0">Empresa grande y desarrollador:</tspan></text><text x="805" y="338.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="805" dy="0">usan la Cloud API de Meta y</tspan></text><text x="805" y="355.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="805" dy="0">pagan por mensajes</tspan></text><polyline points="200,126 340,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,126 470,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="750,126 600,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="340,232 230,300" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,250 470,300" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="600,232 700,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="262" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">pago por mensajes</tspan></text><rect x="10" y="390" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: gratuidad para personas, Business y Cloud API, y que Meta incluye en «otros ingresos» el pago por mensajería</tspan></text><text x="470" y="431.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de WhatsApp. Inferido: el papel de las tiendas, los fabricantes y los reguladores; las flechas punteadas indican relaciones</tspan></text><text x="470" y="448.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que existen pero que las fuentes consultadas no detallan.</tspan></text><text x="470" y="485.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
