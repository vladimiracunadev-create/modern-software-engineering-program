<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 601" width="940" height="601" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alternativas descartadas: cuatro bifurcaciones y su coste probable (análisis propio)</title><desc id="d">Cuatro filas de decisión con la opción elegida y la alternativa: Erlang sobre FreeBSD frente a una pila más convencional; cifrado de extremo a extremo por defecto frente a cifrado en tránsito; cuota anual frente a publicidad; el teléfono como fuente de verdad frente a varios dispositivos independientes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="601" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Alternativas descartadas: cuatro bifurcaciones y su coste probable (análisis propio)</tspan></text><rect x="10" y="56" width="110" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="65" y="107.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="65" dy="0">Servidor</tspan></text><rect x="134" y="56" width="262" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="265" y="91" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="265" dy="0">Elegida: Erlang sobre FreeBSD</tspan></text><text x="265" y="107.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="265" dy="0">(hasta 2,8 millones de conexiones</tspan></text><text x="265" y="124.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="265" dy="0">por servidor en 2012)</tspan></text><rect x="412" y="56" width="250" height="96" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="537" y="91" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">Alternativa: una pila</tspan></text><text x="537" y="107.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">convencional con un hilo por</tspan></text><text x="537" y="124.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">conexión</tspan></text><rect x="678" y="56" width="252" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="804" y="91" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">Muchos más servidores para la</tspan></text><text x="804" y="107.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">misma base; más coste y más</tspan></text><text x="804" y="124.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">piezas que fallan</tspan></text><polyline points="396,104 412,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="662,104 678,104" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="164" width="110" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="65" y="215.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="65" dy="0">Privacidad</tspan></text><rect x="134" y="164" width="262" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="265" y="207.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="265" dy="0">Elegida: cifrado de extremo a</tspan></text><text x="265" y="223.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="265" dy="0">extremo por defecto (2016)</tspan></text><rect x="412" y="164" width="250" height="96" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="537" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">Alternativa: cifrado solo en</tspan></text><text x="537" y="215.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">tránsito y texto legible en el</tspan></text><text x="537" y="232.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">servidor</tspan></text><rect x="678" y="164" width="252" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="804" y="190.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">Servidor con acceso al texto:</tspan></text><text x="804" y="207.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">más funciones de servidor, más</tspan></text><text x="804" y="223.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">superficie de abuso y de</tspan></text><text x="804" y="240.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">exigencias legales</tspan></text><polyline points="396,212 412,212" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="662,212 678,212" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="272" width="110" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="65" y="323.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="65" dy="0">Ingreso</tspan></text><rect x="134" y="272" width="262" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="265" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="265" dy="0">Elegida: cuota anual y luego</tspan></text><text x="265" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="265" dy="0">gratis con negocios (2012, 2016)</tspan></text><rect x="412" y="272" width="250" height="96" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="537" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">Alternativa: publicidad basada</tspan></text><text x="537" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">en datos de la conversación</tspan></text><rect x="678" y="272" width="252" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="804" y="307" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">Contradice la promesa pública;</tspan></text><text x="804" y="323.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">el cifrado deja pocas señales</tspan></text><text x="804" y="340.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">para segmentar</tspan></text><polyline points="396,320 412,320" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="662,320 678,320" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="380" width="110" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="65" y="431.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="65" dy="0">Dispositivos</tspan></text><rect x="134" y="380" width="262" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="265" y="423.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="265" dy="0">Elegida: claves por dispositivo y</tspan></text><text x="265" y="439.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="265" dy="0">reparto en el cliente (2021)</tspan></text><rect x="412" y="380" width="250" height="96" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="537" y="423.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">Alternativa: seguir con el</tspan></text><text x="537" y="439.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">teléfono como fuente de verdad</tspan></text><rect x="678" y="380" width="252" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="804" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">Menos trabajo para el emisor</tspan></text><text x="804" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">pero el teléfono sigue siendo</tspan></text><text x="804" y="448.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">un punto único de fallo</tspan></text><polyline points="396,428 412,428" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="662,428 678,428" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="492" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="516.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Es un análisis propio, no un hecho: WhatsApp no publica qué alternativas evaluó. Lo documentado es la opción elegida y su</tspan></text><text x="470" y="533.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">motivo declarado; los costes de las alternativas son hipótesis razonadas con la teoría del curso para entrenar el</tspan></text><text x="470" y="550.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">razonamiento.</tspan></text><text x="470" y="587.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Esquema pedagógico: las cajas punteadas son inferencia del curso, no arquitectura confirmada por WhatsApp.</tspan></text></svg>
