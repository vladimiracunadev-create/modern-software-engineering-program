<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 556" width="940" height="556" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Conexiones simultáneas por servidor en la charla de Rick Reed (2012)</title><desc id="d">Barras con cuatro valores: unas 200 mil conexiones por servidor al inicio, el primer cuello de botella apareció cerca de 425 mil, tras la primera ronda de correcciones se llegó a un millón y un mes después a dos millones, un aumento de diez veces sobre el punto de partida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="556" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Conexiones simultáneas por servidor en la charla de Rick Reed (2012)</tspan></text><line x1="93.7" y1="347" x2="920" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="347" x2="93.7" y2="347" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="351.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="277" x2="920" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="277" x2="93.7" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="281.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="207" x2="93.7" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="137" x2="920" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="137" x2="93.7" y2="137" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 500</tspan></text><line x1="93.7" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="67" x2="93.7" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="67" x2="93.7" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 207)">Miles de conexiones por servidor</text><rect x="114.357" y="319" width="165.26" height="28" rx="3" fill="#087f8c"/><text x="196.987" y="313" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="196.987" dy="0">200</tspan></text><text x="196.987" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.987" dy="0">Carga inicial</tspan></text><rect x="320.933" y="287.5" width="165.26" height="59.5" rx="3" fill="#087f8c"/><text x="403.562" y="281.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="403.562" dy="0">425</tspan></text><text x="403.562" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.562" dy="0">Primer cuello de botella</tspan></text><rect x="527.507" y="207" width="165.26" height="140" rx="3" fill="#087f8c"/><text x="610.137" y="201" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="610.137" dy="0">1 000</tspan></text><text x="610.137" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">Primera ronda de</tspan></text><text x="610.137" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">correcciones</tspan></text><rect x="734.082" y="67" width="165.26" height="280" rx="3" fill="#087f8c"/><text x="816.712" y="61" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="816.712" dy="0">2 000</tspan></text><text x="816.712" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">Un mes después</tspan></text><rect x="10" y="416" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="440.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La mejora no vino de máquinas mayores sino de quitar contención: según la charla, de 200 mil a 2 millones todo fueron</tspan></text><text x="470" y="457.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">correcciones de contención, algunas en la máquina virtual de Erlang y otras en el reparto del trabajo. Los valores son los</tspan></text><text x="470" y="474.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de la presentación; el segundo es «alrededor de» 425 mil y el tercero «un millón». No se sabe cuántas conexiones sostiene</tspan></text><text x="470" y="490.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hoy un servidor.</tspan></text><text x="470" y="538.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: R. Reed, «Scaling to Millions of Simultaneous Connections», Erlang Factory SF, 30 de marzo de 2012.</tspan></text></svg>
