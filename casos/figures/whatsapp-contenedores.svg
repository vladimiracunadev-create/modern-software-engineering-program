<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 468" width="940" height="468" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 2, contenedores: del teléfono al servidor de chat y a las claves</title><desc id="d">Diagrama de contenedores: el cliente se conecta con un canal cifrado a un servicio de conexiones llamado ChatD; detrás hay un directorio de claves públicas, colas de mensajes pendientes, un almacén de adjuntos cifrados, la bóveda de claves de respaldo con módulos de seguridad de hardware y la Cloud API de Meta para empresas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="468" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 2, contenedores: del teléfono al servidor de chat y a las claves</tspan></text><rect x="10" y="70" width="190" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">Teléfono: fuente de las</tspan></text><text x="105" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">claves privadas y del</tspan></text><text x="105" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">historial</tspan></text><rect x="10" y="160" width="190" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105" y="178.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">Hasta cuatro</tspan></text><text x="105" y="195.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">dispositivos</tspan></text><text x="105" y="211.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">vinculados, con claves</tspan></text><text x="105" y="228.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">propias</tspan></text><rect x="230" y="52" width="520" height="270" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="244" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="244" dy="0">Servidores de WhatsApp (Meta)</tspan></text><rect x="248" y="90" width="160" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="328" y="120.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328" dy="0">ChatD: conexiones y</tspan></text><text x="328" y="136.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328" dy="0">autenticación</tspan></text><rect x="426" y="90" width="160" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="506" y="112" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506" dy="0">Directorio de</tspan></text><text x="506" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506" dy="0">claves públicas y</tspan></text><text x="506" y="145.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506" dy="0">prellaves</tspan></text><rect x="604" y="90" width="130" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="669" y="112" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="669" dy="0">Cola de</tspan></text><text x="669" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="669" dy="0">mensajes</tspan></text><text x="669" y="145.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="669" dy="0">pendientes</tspan></text><rect x="248" y="180" width="160" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="328" y="210.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328" dy="0">Almacén de adjuntos</tspan></text><text x="328" y="226.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328" dy="0">cifrados</tspan></text><rect x="426" y="180" width="160" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="506" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="506" dy="0">Bóveda de claves de</tspan></text><text x="506" y="218.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="506" dy="0">respaldo (HSM,</tspan></text><text x="506" y="235.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="506" dy="0">varios centros)</tspan></text><rect x="604" y="180" width="130" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="669" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="669" dy="0">Telemetría y</tspan></text><text x="669" y="218.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="669" dy="0">abuso (no</tspan></text><text x="669" y="235.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="669" dy="0">publicado)</tspan></text><rect x="248" y="262" width="486" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="491" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491" dy="0">Canal cifrado entre cliente y servidor con Noise Pipes</tspan></text><rect x="770" y="52" width="160" height="270" rx="16" fill="#f7ebc8" fill-opacity="0.45" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="8 5"/><text x="784" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="784" dy="0">Empresas</tspan></text><rect x="782" y="90" width="136" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="850" y="118.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="850" dy="0">Cloud API de</tspan></text><text x="850" y="135.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="850" dy="0">Meta: programa</tspan></text><text x="850" y="151.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="850" dy="0">mensajes y</tspan></text><text x="850" y="168.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="850" dy="0">llamadas</tspan></text><rect x="782" y="206" width="136" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="850" y="229.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="850" dy="0">Aplicación</tspan></text><text x="850" y="246.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="850" dy="0">Business en un</tspan></text><text x="850" y="262.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="850" dy="0">dispositivo</tspan></text><text x="850" y="279.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="850" dy="0">propio</tspan></text><polyline points="200,105 248,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="200,195 248,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="408,125 426,125" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="586,125 604,125" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="750,140 782,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="342" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: ChatD como servicio de conexiones y de autenticación, el canal Noise Pipes, la bóveda de claves con módulos de</tspan></text><text x="470" y="383.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">seguridad de hardware en varios centros de datos, los adjuntos en un almacén y la Cloud API como producto de Meta.</tspan></text><text x="470" y="400.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Inferido: la cola de mensajes pendientes y los detalles de telemetría; no se sabe cuántos servidores ni qué base de datos</tspan></text><text x="470" y="416.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se usa hoy.</tspan></text><text x="470" y="454.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
