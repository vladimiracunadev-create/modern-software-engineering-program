<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 396" width="940" height="396" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una cuenta, un número de teléfono y mensajes cifrados de extremo a extremo</title><desc id="d">Diagrama de contexto: dos personas con la aplicación en el teléfono intercambian mensajes cifrados a través de los servidores de WhatsApp, que no ven el contenido; las empresas hablan con los clientes por la misma red mediante la API de empresas; Meta aloja la infraestructura y los dispositivos vinculados se añaden al teléfono principal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="396" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una cuenta, un número de teléfono y mensajes cifrados de extremo a extremo</tspan></text><rect x="10" y="52" width="250" height="200" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Persona A</tspan></text><rect x="30" y="90" width="210" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="116.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Teléfono con la app:</tspan></text><text x="135" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">cuenta ligada a un número</tspan></text><rect x="30" y="166" width="210" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="194.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">Hasta cuatro dispositivos</tspan></text><text x="135" y="210.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">vinculados sin teléfono</tspan></text><rect x="690" y="52" width="240" height="200" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="704" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="704" dy="0">Persona B o grupo</tspan></text><rect x="710" y="90" width="200" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="810" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="810" dy="0">Teléfono con la app</tspan></text><rect x="710" y="166" width="200" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="810" y="194.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="810" dy="0">Empresa que atiende</tspan></text><text x="810" y="210.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="810" dy="0">clientes por la API</tspan></text><rect x="300" y="52" width="350" height="200" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="314" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="314" dy="0">Servidores (infraestructura de Meta)</tspan></text><rect x="320" y="90" width="310" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="475" y="116.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">Conexión persistente, cola de mensajes</tspan></text><text x="475" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">y directorio de claves públicas</tspan></text><rect x="320" y="166" width="310" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="475" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">Almacén de adjuntos cifrados: el emisor</tspan></text><text x="475" y="202.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">sube el archivo y envía la clave en el</tspan></text><text x="475" y="219.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">mensaje</tspan></text><polyline points="240,121 320,121" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="630,121 710,121" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="280" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="280" dy="0">cifrado</tspan></text><text x="670" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="670" dy="0">cifrado</tspan></text><rect x="10" y="270" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo documentado: el cifrado de extremo a extremo con el protocolo Signal es el valor por defecto desde abril de 2016, los</tspan></text><text x="470" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">servidores guardan claves públicas y no el contenido, y desde 2021 hay dispositivos vinculados que funcionan sin el</tspan></text><text x="470" y="328.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">teléfono. Los adjuntos grandes se cifran en el dispositivo y se suben a un almacén de blobs; la clave viaja dentro del</tspan></text><text x="470" y="344.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mensaje cifrado (libro blanco).</tspan></text><text x="470" y="382.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
