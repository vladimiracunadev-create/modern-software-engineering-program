ect x="551.752" y="188" width="323.948" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="713.726" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="713.726" dy="0">41 %</tspan></text><text x="882.7" y="205.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="484.85" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="484.85" dy="0">% del total</tspan></text><rect x="10" y="279" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">WhatsApp no tiene estado de resultados propio: es parte de la familia de aplicaciones, que invirtió 96 290 millones de USD</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en 2025 en plantilla, centros de datos e infraestructura técnica. El 10-K de Meta dice que diseñó y construyó sus propios</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">centros de datos y partes clave de su infraestructura, y que una parte sustancial la proveen terceros. No se sabe el coste</tspan></text><text x="470" y="353.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de servir a WhatsApp ni su plantilla.</tspan></text><text x="470" y="401.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Meta Platforms, Form 10-K de 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
