<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 469" width="940" height="469" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema del negocio: quién paga, quién recibe y por dónde pasa el valor</title><desc id="d">Diagrama de flujos: las personas usan WhatsApp sin pagar y generan el valor de la red; las empresas pagan por mensajería de la Cloud API; los anunciantes pueden comprar anuncios que aparecen en varias aplicaciones de Meta, entre ellas WhatsApp; Meta aloja y opera y recibe ingresos como otros ingresos de la familia de aplicaciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="469" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema del negocio: quién paga, quién recibe y por dónde pasa el valor</tspan></text><rect x="10" y="70" width="220" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120" dy="0">Personas: usan mensajes y</tspan></text><text x="120" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120" dy="0">llamadas sin pagar</tspan></text><rect x="10" y="170" width="220" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="120" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120" dy="0">Empresas: pagan por</tspan></text><text x="120" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120" dy="0">mensajería (Cloud API y</tspan></text><text x="120" y="230.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120" dy="0">Business)</tspan></text><rect x="10" y="270" width="220" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="120" y="292" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120" dy="0">Anunciantes: compran</tspan></text><text x="120" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120" dy="0">anuncios que pueden</tspan></text><text x="120" y="325.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="120" dy="0">aparecer en WhatsApp</tspan></text><rect x="340" y="120" width="250" height="110" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="465" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465" dy="0">WhatsApp dentro de Meta:</tspan></text><text x="465" y="178.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465" dy="0">servidores, claves, mensajes</tspan></text><text x="465" y="195.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465" dy="0">pendientes y producto</tspan></text><rect x="690" y="70" width="240" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="810" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="810" dy="0">Otros ingresos de la familia</tspan></text><text x="810" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="810" dy="0">de aplicaciones: 2 584</tspan></text><text x="810" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="810" dy="0">millones en 2025</tspan></text><rect x="690" y="170" width="240" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="810" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="810" dy="0">Publicidad de Meta: 196 175</tspan></text><text x="810" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="810" dy="0">millones en 2025, casi todo en</tspan></text><text x="810" y="230.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="810" dy="0">Facebook e Instagram</tspan></text><rect x="690" y="270" width="240" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="810" y="300.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="810" dy="0">Valor que vuelve: contacto con</tspan></text><text x="810" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="810" dy="0">cualquiera, sin cuota</tspan></text><polyline points="230,110 340,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="270" y="118" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="270" dy="0">valor de red</tspan></text><polyline points="230,210 340,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="270" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="270" dy="0">pago por mensaje</tspan></text><polyline points="230,305 340,215" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="590,150 690,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="590,190 690,210" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="590,225 690,305" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="360" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: gratuidad para personas, productos para empresas, que el pago por mensajería de WhatsApp está dentro de «otros</tspan></text><text x="470" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ingresos» y que los anuncios pueden aparecer en WhatsApp. Las flechas punteadas son relaciones sin cifra pública; Meta no</tspan></text><text x="470" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">separa el ingreso de WhatsApp y dice que sustancialmente todos sus ingresos proceden de publicidad en Facebook e Instagram.</tspan></text><text x="470" y="455.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Meta Platforms, Form 10-K de 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
