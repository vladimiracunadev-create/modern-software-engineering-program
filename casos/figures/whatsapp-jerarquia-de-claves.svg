<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 445" width="940" height="445" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 6, datos: la jerarquía de claves que usa un mensaje</title><desc id="d">Diagrama de la jerarquía de claves: la clave de identidad de larga duración firma la prellave firmada de duración media y respalda las prellaves de un solo uso; con ellas se acuerda una clave raíz de 32 bytes que genera claves de cadena de 32 bytes que generan claves de mensaje de 80 bytes divididas en AES-256, HMAC-SHA256 y vector inicial.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="445" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 6, datos: la jerarquía de claves que usa un mensaje</tspan></text><rect x="10" y="56" width="290" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="155" y="86.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="155" dy="0">Clave de identidad (Curve25519):</tspan></text><text x="155" y="102.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="155" dy="0">larga duración, se genera al instalar</tspan></text><rect x="325" y="56" width="290" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Prellave firmada: duración media,</tspan></text><text x="470" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">firmada por la identidad y rotada</tspan></text><rect x="640" y="56" width="290" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">Prellaves de un solo uso: una cola</tspan></text><text x="785" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">que se repone</tspan></text><polyline points="300,91 325,91" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="615,91 640,91" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="160" width="290" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="155" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">Clave raíz (32 bytes): nace del</tspan></text><text x="155" y="198.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">acuerdo inicial entre las claves</tspan></text><text x="155" y="215.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">públicas</tspan></text><rect x="325" y="160" width="290" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="190.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Clave de cadena (32 bytes): se</tspan></text><text x="470" y="206.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">renueva con cada mensaje</tspan></text><rect x="640" y="160" width="290" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="785" y="190.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785" dy="0">Clave de mensaje (80 bytes): se usa</tspan></text><text x="785" y="206.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785" dy="0">una vez y se descarta</tspan></text><polyline points="155,126 155,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="165" y="148" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="165" dy="0">acuerdo inicial con las claves públicas del otro</tspan></text><polyline points="300,195 325,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="615,195 640,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="640" y="258" width="90" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="685" y="281.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="685" dy="0">32 bytes</tspan></text><text x="685" y="297.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="685" dy="0">AES-256</tspan></text><rect x="740" y="258" width="90" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="785" y="281.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">32 bytes</tspan></text><text x="785" y="297.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">HMAC</tspan></text><rect x="840" y="258" width="90" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="885" y="281.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="885" dy="0">16 bytes</tspan></text><text x="885" y="297.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="885" dy="0">IV</tspan></text><polyline points="785,230 785,258" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="258" width="605" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="312.5" y="281.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="312.5" dy="0">Por qué importa: cada mensaje usa una clave distinta, por lo que robar las</tspan></text><text x="312.5" y="297.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="312.5" dy="0">claves de hoy no abre los mensajes ya enviados ni los de otros dispositivos</tspan></text><rect x="10" y="336" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el libro blanco de cifrado de WhatsApp y en las especificaciones públicas del protocolo Signal: tipos de</tspan></text><text x="470" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">claves, tamaños y la propiedad de que las claves efímeras impiden descifrar mensajes pasados. No muestra el algoritmo de</tspan></text><text x="470" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">renovación de la cadena, que está en las especificaciones, ni el comportamiento del servidor.</tspan></text><text x="470" y="431.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
