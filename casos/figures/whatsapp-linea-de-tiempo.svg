<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De dos fundadores a más de tres mil millones de personas (2009-2025)</title><desc id="d">Línea de tiempo con dos carriles: en producto, WhatsApp es independiente de 2009 a 2014 y forma parte de Facebook, hoy Meta, desde 2014; en seguridad y arquitectura, el cifrado completo llega en 2016 y el soporte de varios dispositivos en 2021. Hitos: dos millones de conexiones por servidor en 2012, compra anunciada el 19 de febrero de 2014 y dos mil millones de usuarios el 12 de febrero de 2020.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="380" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De dos fundadores a más de tres mil millones de personas (2009-2025)</tspan></text><line x1="134" y1="83" x2="134" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="134" y1="199" x2="134" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="134" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="134" dy="0">2009</tspan></text><line x1="271.294" y1="83" x2="271.294" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="271.294" y1="199" x2="271.294" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="271.294" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="271.294" dy="0">2012</tspan></text><line x1="408.588" y1="83" x2="408.588" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="408.588" y1="199" x2="408.588" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="408.588" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="408.588" dy="0">2015</tspan></text><line x1="545.882" y1="83" x2="545.882" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="545.882" y1="199" x2="545.882" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="545.882" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="545.882" dy="0">2018</tspan></text><line x1="683.176" y1="83" x2="683.176" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="683.176" y1="199" x2="683.176" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="683.176" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="683.176" dy="0">2021</tspan></text><line x1="820.471" y1="83" x2="820.471" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="820.471" y1="199" x2="820.471" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="820.471" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="820.471" dy="0">2024</tspan></text><line x1="912" y1="83" x2="912" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="199" x2="912" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2026</tspan></text><line x1="134" y1="199" x2="912" y2="199" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="116.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="124" dy="0">Propiedad</tspan></text><text x="124" y="174.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="124" dy="0">Plataforma</tspan></text><line x1="271.294" y1="75" x2="271.294" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="271.294" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="271.294" dy="0">2M conexiones</tspan></text><line x1="362.824" y1="75" x2="362.824" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="362.824" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="362.824" dy="0">Compra</tspan></text><line x1="637.412" y1="75" x2="637.412" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="637.412" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637.412" dy="0">2 000 M</tspan></text><rect x="134" y="92" width="228.824" height="40" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="248.412" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="248.412" dy="0">Independiente</tspan></text><rect x="362.824" y="92" width="549.176" height="40" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="637.412" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637.412" dy="0">Dentro de Facebook y Meta</tspan></text><line x1="14" y1="141" x2="912" y2="141" stroke="#d5dde1" stroke-width="1"/><rect x="271.294" y="150" width="183.059" height="40" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="362.824" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362.824" dy="0">Escala de conexiones</tspan></text><rect x="454.353" y="150" width="228.824" height="40" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="568.765" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="568.765" dy="0">Cifrado total</tspan></text><rect x="683.176" y="150" width="228.824" height="40" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="797.588" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797.588" dy="0">Varios dispositivos</tspan></text><text x="523" y="243" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="523" dy="0">Año</tspan></text><rect x="10" y="257" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los carriles son etapas, no fases excluyentes: la escala de conexiones se siguió trabajando después de 2016. Los años</tspan></text><text x="470" y="298.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">proceden de la propia WhatsApp y de Meta; los límites de cada barra son aproximaciones visuales. El año 2009 lo citan</tspan></text><text x="470" y="315.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fuentes secundarias; ninguna fuente primaria consultada lo confirma, así que debe leerse como dato no verificado.</tspan></text><text x="470" y="362.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
