<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 471" width="940" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Piezas que el equipo de WhatsApp describió para sostener millones de conexiones</title><desc id="d">Pila de cuatro capas: aplicación cliente, servidores Erlang sobre FreeBSD con una conexión por usuario, partición del trabajo entre procesos y herramientas de medición de contención; cada capa lleva una cifra o ajuste concreto publicados en la charla de 2012.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="471" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Piezas que el equipo de WhatsApp describió para sostener millones de conexiones</tspan></text><rect x="10" y="52" width="170" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="87.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Cliente</tspan></text><rect x="192" y="52" width="738" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="561" y="79.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="561" dy="0">Aplicación en el teléfono con claves propias y sesiones Signal; desde 2021 también dispositivos</tspan></text><text x="561" y="95.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="561" dy="0">vinculados</tspan></text><rect x="10" y="132" width="170" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="167.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Servidor</tspan></text><rect x="192" y="132" width="738" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="561" y="159.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="561" dy="0">Máquina estándar de 24 CPU lógicas y 100 GB de RAM; FreeBSD 8.3 y OTP R14B03; objetivo de un</tspan></text><text x="561" y="175.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="561" dy="0">millón de conexiones</tspan></text><rect x="10" y="212" width="170" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="247.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Erlang/BEAM</tspan></text><rect x="192" y="212" width="738" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="561" y="247.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="561" dy="0">Procesos ligeros por conexión; parches a la máquina virtual para quitar contención de cerrojos</tspan></text><rect x="10" y="292" width="170" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="327.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Medición</tspan></text><rect x="192" y="292" width="738" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="561" y="319.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="561" dy="0">Contadores de cerrojos, métricas de colas, cargas sintéticas, cargas duplicadas y desviadas desde</tspan></text><text x="561" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="561" dy="0">producción</tspan></text><rect x="10" y="378" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="402.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las capas se leen de la charla de Rick Reed (marzo de 2012) y del blog de la empresa de enero de 2012. Que esa pila siga</tspan></text><text x="470" y="419.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">igual hoy no está documentado: en 2014 WhatsApp se unió a Facebook y la infraestructura puede haber cambiado.</tspan></text><text x="470" y="457.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
