<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 541" width="940" height="541" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué pasa cuando cae cada componente de WhatsApp: de lo pequeño a lo grande</title><desc id="d">Seis filas de falla creciente: un proceso interno, un servidor sobrecargado, el teléfono receptor desconectado, un centro de datos de la bóveda de claves, un dispositivo vinculado y el servicio de claves completo; efecto y mecanismo con rótulo de documentado, inferido o no se sabe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="541" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué pasa cuando cae cada componente de WhatsApp: de lo pequeño a lo grande</tspan></text><rect x="10" y="56" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un proceso interno de un servidor</tspan></text><rect x="330" y="56" width="600" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="630" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630" dy="0">Aislamiento de procesos de Erlang (inferido); no se detalla en las fuentes</tspan></text><polyline points="290,82 330,82" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="118" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="147.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un servidor sobrecargado</tspan></text><rect x="330" y="118" width="600" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="139.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">Objetivo de 2012: resistir fallos y picos; cargas reales para ensayarlo</tspan></text><text x="630" y="155.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">(documentado)</tspan></text><polyline points="290,144 330,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="180" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="209.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">El receptor desconectado</tspan></text><rect x="330" y="180" width="600" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="630" y="209.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630" dy="0">El mensaje cifrado espera en el servidor hasta que se conecte (inferido)</tspan></text><polyline points="290,206 330,206" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="242" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="271.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un teléfono principal sin batería</tspan></text><rect x="330" y="242" width="600" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">Los dispositivos vinculados funcionan sin él desde 2021 (documentado)</tspan></text><polyline points="290,268 330,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="304" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="325.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un centro de datos de la bóveda de</tspan></text><text x="150" y="341.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">claves</tspan></text><rect x="330" y="304" width="600" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="333.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">La bóveda se distribuye en varios centros de datos (documentado)</tspan></text><polyline points="290,330 330,330" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="366" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="395.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Todo el servicio de WhatsApp</tspan></text><rect x="330" y="366" width="600" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="395.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">No se sabe: sin recuperación ante desastres pública ni objetivos de tiempo</tspan></text><polyline points="290,392 330,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="432" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="456.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en la charla de 2012, el artículo de dispositivos múltiples y el de copias cifradas; inferido el aislamiento de</tspan></text><text x="470" y="473.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">procesos y la cola de mensajes, que son consecuencias de Erlang y del diseño asíncrono. No se publica un plan de</tspan></text><text x="470" y="490.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">continuidad ni cifras de disponibilidad.</tspan></text><text x="470" y="527.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
