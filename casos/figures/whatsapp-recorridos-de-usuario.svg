<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 571" width="940" height="571" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco recorridos completos: de la instalación al caso límite</title><desc id="d">Cinco filas de pasos encadenados: persona nueva, grupo, empresa pequeña con la aplicación Business, empresa grande con Cloud API y persona con varios dispositivos; cada fila termina en su caso límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="571" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco recorridos completos: de la instalación al caso límite</tspan></text><rect x="10" y="54" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Persona nueva</tspan></text><rect x="174" y="54" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Instala y se registra</tspan></text><text x="263.25" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">con su teléfono</tspan></text><rect x="366.5" y="54" width="178.5" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455.75" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">Se publican sus</tspan></text><text x="455.75" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">claves públicas</tspan></text><polyline points="352.5,86 366.5,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="54" width="178.5" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="648.25" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">Primer mensaje:</tspan></text><text x="648.25" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">sesión cifrada</tspan></text><polyline points="545,86 559,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="54" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: el contacto</tspan></text><text x="840.75" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">no tiene la app</tspan></text><polyline points="737.5,86 751.5,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="130" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="165.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Grupo</tspan></text><rect x="174" y="130" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="157.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Crea el grupo y añade</tspan></text><text x="263.25" y="173.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">miembros</tspan></text><rect x="366.5" y="130" width="178.5" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455.75" y="157.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">Clave de remitente a</tspan></text><text x="455.75" y="173.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">cada miembro</tspan></text><polyline points="352.5,162 366.5,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="130" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="648.25" y="157.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">Un solo cifrado por</tspan></text><text x="648.25" y="173.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">mensaje</tspan></text><polyline points="545,162 559,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="130" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="149" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: sale un</tspan></text><text x="840.75" y="165.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">miembro; se renueva</tspan></text><text x="840.75" y="182.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">la clave</tspan></text><polyline points="737.5,162 751.5,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="206" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="241.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Empresa pequeña</tspan></text><rect x="174" y="206" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Instala la app</tspan></text><text x="263.25" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Business</tspan></text><rect x="366.5" y="206" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="455.75" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">Atiende desde un</tspan></text><text x="455.75" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">dispositivo suyo</tspan></text><polyline points="352.5,238 366.5,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="206" width="178.5" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="648.25" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">Cifrado de extremo a</tspan></text><text x="648.25" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">extremo</tspan></text><polyline points="545,238 559,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="206" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="840.75" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: un solo</tspan></text><text x="840.75" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">empleado no basta</tspan></text><polyline points="737.5,238 751.5,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="282" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Empresa grande</tspan></text><rect x="174" y="282" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Se integra con la</tspan></text><text x="263.25" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Cloud API</tspan></text><rect x="366.5" y="282" width="178.5" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455.75" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">Meta recibe y entrega</tspan></text><text x="455.75" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">mensajes</tspan></text><polyline points="352.5,314 366.5,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="282" width="178.5" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="648.25" y="301" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">Sin cifrado extremo a</tspan></text><text x="648.25" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">extremo (definición</tspan></text><text x="648.25" y="334.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">oficial)</tspan></text><polyline points="545,314 559,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="282" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: aviso al</tspan></text><text x="840.75" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">usuario en el chat</tspan></text><polyline points="737.5,314 751.5,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="358" width="150" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="385.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Varios</tspan></text><text x="85" y="401.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">dispositivos</tspan></text><rect x="174" y="358" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="385.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Vincula con un código</tspan></text><text x="263.25" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">QR</tspan></text><rect x="366.5" y="358" width="178.5" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455.75" y="385.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">Cada dispositivo, sus</tspan></text><text x="455.75" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">claves</tspan></text><polyline points="352.5,390 366.5,390" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="358" width="178.5" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="648.25" y="385.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">Se cifra una vez por</tspan></text><text x="648.25" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">dispositivo</tspan></text><polyline points="545,390 559,390" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="358" width="178.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Límite: se quita un</tspan></text><text x="840.75" y="393.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">dispositivo y se</tspan></text><text x="840.75" y="410.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">renuevan claves</tspan></text><polyline points="737.5,390 751.5,390" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="14" y="448" font-size="13" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="14" dy="0">Trazo punteado: dato inferido. Cajas coral: el caso límite de cada recorrido.</tspan></text><rect x="10" y="462" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="486.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada fila es un tipo de usuario con su propio incentivo. Los pasos salen del libro blanco de cifrado, del artículo sobre</tspan></text><text x="470" y="503.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">varios dispositivos y de la definición oficial de cifrado de extremo a extremo con la Cloud API; el límite de la empresa</tspan></text><text x="470" y="520.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pequeña es inferido.</tspan></text><text x="470" y="557.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
