<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 605" width="940" height="605" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 4, secuencia: un adjunto grande y un mensaje a un grupo</title><desc id="d">Diagrama de secuencia: el emisor cifra el archivo con una clave efímera, lo sube a un almacén de adjuntos, envía al grupo un mensaje cifrado con la clave de remitente que lleva el puntero y las claves del adjunto, y cada miembro descarga y descifra el archivo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="605" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 4, secuencia: un adjunto grande y un mensaje a un grupo</tspan></text><rect x="85" y="58" width="170" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="170" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="170" dy="0">Emisor</tspan></text><rect x="385" y="58" width="170" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Servidor y almacén</tspan></text><rect x="685" y="58" width="170" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="770" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="770" dy="0">Miembro del grupo</tspan></text><line x1="170" y1="104" x2="170" y2="482" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="470" y1="104" x2="470" y2="482" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="770" y1="104" x2="770" y2="482" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="170,132 216,132 216,146 174,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="224" y="142" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="224" dy="0">1. Cifra el archivo con AES-256 y HMAC</tspan></text><polyline points="173,182 467,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="320" y="174" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="320" dy="0">2. Sube el archivo cifrado</tspan></text><polyline points="467,226 173,226" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="320" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="320" dy="0">3. Devuelve un puntero al archivo</tspan></text><polyline points="173,270 467,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="320" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="320" dy="0">4. Mensaje con puntero y claves, cifrado con la</tspan><tspan x="320" dy="16.64">clave de remitente</tspan></text><polyline points="473,314 767,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="620" y="306" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="620" dy="0">5. Reparte el mensaje cifrado una sola vez</tspan></text><polyline points="770,352 816,352 816,366 774,366" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="824" y="362" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="824" dy="0">6. Descifra el mensaje con la clave de remitente</tspan></text><polyline points="767,402 473,402" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="620" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="620" dy="0">7. Descarga el archivo cifrado</tspan></text><polyline points="770,440 816,440 816,454 774,454" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="824" y="450" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="824" dy="0">8. Descifra y comprueba el MAC</tspan></text><rect x="10" y="496" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="520.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: cifrado local del adjunto con clave efímera de 32 bytes y verificación con HMAC, almacén de blobs, mensaje con</tspan></text><text x="470" y="537.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">claves y puntero, y la clave de remitente repartida por sesiones individuales para que el mensaje de grupo se cifre una</tspan></text><text x="470" y="554.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sola vez. Inferido: el momento exacto en que se devuelve el puntero.</tspan></text><text x="470" y="591.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
