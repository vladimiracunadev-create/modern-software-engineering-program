<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 649" width="940" height="649" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 4, secuencia: el primer mensaje a alguien que está desconectado</title><desc id="d">Diagrama de secuencia entre el teléfono emisor, el servidor y el teléfono receptor: el emisor pide las claves públicas del receptor, cifra localmente, envía el texto cifrado, el servidor lo guarda hasta que el receptor se conecte y se lo entrega, y el receptor confirma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="649" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 4, secuencia: el primer mensaje a alguien que está desconectado</tspan></text><rect x="85" y="58" width="170" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="170" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="170" dy="0">Teléfono emisor</tspan></text><rect x="385" y="58" width="170" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Servidor de WhatsApp</tspan></text><rect x="685" y="58" width="170" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="770" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="770" dy="0">Teléfono receptor</tspan></text><line x1="170" y1="104" x2="170" y2="526" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="470" y1="104" x2="470" y2="526" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="770" y1="104" x2="770" y2="526" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="173,138 467,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="320" y="130" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="320" dy="0">1. Pide claves públicas del receptor</tspan></text><polyline points="467,182 173,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="320" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="320" dy="0">2. Identidad, prellave firmada y una de un solo</tspan><tspan x="320" dy="16.64">uso</tspan></text><polyline points="170,220 216,220 216,234 174,234" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="224" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="224" dy="0">3. Calcula la clave y cifra el texto</tspan></text><polyline points="173,270 467,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="320" y="262" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="320" dy="0">4. Envía el texto cifrado</tspan></text><polyline points="470,308 516,308 516,322 474,322" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="524" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="524" dy="0">5. Guarda hasta que conecte (inferido)</tspan></text><polyline points="767,358 473,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="620" y="350" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="620" dy="0">6. Se conecta y autentica</tspan></text><polyline points="473,402 767,402" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="620" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="620" dy="0">7. Entrega el texto cifrado</tspan></text><polyline points="770,440 816,440 816,454 774,454" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="824" y="450" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="824" dy="0">8. Descifra con sus claves privadas</tspan></text><polyline points="767,490 473,490" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="620" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="620" dy="0">9. Confirma la recepción (inferido)</tspan></text><rect x="10" y="540" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="564.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: las tres clases de claves públicas, el acuerdo inicial asíncrono del protocolo Signal, que el servidor no</tspan></text><text x="470" y="581.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tiene acceso al texto y el canal cifrado de conexión. Inferido: el guardado temporal y las confirmaciones de entrega que</tspan></text><text x="470" y="598.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">muestra la aplicación. No se sabe cuánto tiempo guarda el servidor un mensaje pendiente.</tspan></text><text x="470" y="635.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
