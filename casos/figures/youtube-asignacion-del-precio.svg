<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A qué se asignó el precio contable de YouTube</title><desc id="d">Barras en miles de dólares con la asignación del precio de 1 194 millones: fondo de comercio 1 134 687, marca y contratos 153 000, patentes y tecnología 24 000, pasivos netos asumidos menos 45 027 e impuestos diferidos menos 72 240.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A qué se asignó el precio contable de YouTube</tspan></text><line x1="212.96" y1="49" x2="212.96" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="212.96" y1="239" x2="212.96" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="212.96" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.96" dy="0">−250 000</tspan></text><line x1="318.043" y1="49" x2="318.043" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="318.043" y1="239" x2="318.043" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="318.043" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="318.043" dy="0">0</tspan></text><line x1="423.127" y1="49" x2="423.127" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="423.127" y1="239" x2="423.127" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="423.127" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="423.127" dy="0">250 000</tspan></text><line x1="528.21" y1="49" x2="528.21" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="528.21" y1="239" x2="528.21" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="528.21" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="528.21" dy="0">500 000</tspan></text><line x1="633.293" y1="49" x2="633.293" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="633.293" y1="239" x2="633.293" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="633.293" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="633.293" dy="0">750 000</tspan></text><line x1="738.377" y1="49" x2="738.377" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="738.377" y1="239" x2="738.377" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="738.377" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="738.377" dy="0">1 000 000</tspan></text><line x1="843.46" y1="49" x2="843.46" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="843.46" y1="239" x2="843.46" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="843.46" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="843.46" dy="0">1 250 000</tspan></text><line x1="212.96" y1="239" x2="843.46" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="202.96" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="202.96" dy="0">Fondo de comercio</tspan></text><text x="202.96" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="202.96" dy="0">Marca, contratos y otros</tspan></text><text x="202.96" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="202.96" dy="0">Patentes y tecnología</tspan></text><text x="202.96" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="202.96" dy="0">Pasivos netos asumidos</tspan></text><text x="202.96" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="202.96" dy="0">Impuestos diferidos</tspan></text><rect x="212.96" y="55" width="582.03" height="26" rx="3" fill="#087f8c"/><text x="801.99" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="801.99" dy="0">1 134 687</tspan></text><rect x="212.96" y="93" width="169.394" height="26" rx="3" fill="#087f8c"/><text x="389.354" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="389.354" dy="0">153 000</tspan></text><rect x="212.96" y="131" width="115.171" height="26" rx="3" fill="#087f8c"/><text x="335.131" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="335.131" dy="0">24 000</tspan></text><rect x="212.96" y="169" width="2" height="26" rx="3" fill="#087f8c"/><text x="221.96" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="221.96" dy="0">−45 027</tspan></text><rect x="212.96" y="207" width="2" height="26" rx="3" fill="#087f8c"/><text x="221.96" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="221.96" dy="0">−72 240</tspan></text><text x="528.21" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="528.21" dy="0">miles de USD</tspan></text><rect x="10" y="297" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cálculo propio: el fondo de comercio es 95 % del precio (1 134 687 sobre 1 194 420). Es decir, Google pagó por la audiencia</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y el equipo, no por tecnología identificable: las patentes y la tecnología desarrollada valían 24 millones. Dónde deja de</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: el reparto contable no mide el valor estratégico.</tspan></text><text x="470" y="402.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Google del año 2006 (SEC) y comunicado de Google del 9 de octubre de 2006, consulta 2026-11-23.</tspan></text></svg>
