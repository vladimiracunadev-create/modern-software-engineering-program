<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 486" width="940" height="486" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware y software que YouTube hace público</title><desc id="d">Pila: centros de datos de Google; aceleradores de vídeo propios (VCU) y TPU de Alphabet; MySQL con Vitess; modelos de aprendizaje profundo para recomendar; Content ID para identificar obras.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="486" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware y software que YouTube hace público</tspan></text><rect x="10" y="53" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Hardware</tspan></text><rect x="214" y="53" width="430" height="66" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="429" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="429" dy="0">Centros de datos de Google; unidades de codificación de</tspan></text><text x="429" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="429" dy="0">vídeo propias; TPU de Alphabet</tspan></text><rect x="10" y="133" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="169.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Datos</tspan></text><rect x="214" y="133" width="430" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429" y="161.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">MySQL servido por Vitess, un proyecto abierto nacido en</tspan></text><text x="429" y="177.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">YouTube</tspan></text><rect x="10" y="213" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="249.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Vídeo</tspan></text><rect x="214" y="213" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="249.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Transcodificación acelerada por hardware</tspan></text><rect x="10" y="293" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="321.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Recomendación y</tspan></text><text x="105" y="337.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">derechos</tspan></text><rect x="214" y="293" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="321.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Aprendizaje profundo para recomendar; Content ID para</tspan></text><text x="429" y="337.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">identificar obras con archivos de referencia</tspan></text><rect x="668" y="53" width="262" height="139" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799" y="126.14" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Documentado entre 2010 y 2025</tspan></text><rect x="668" y="206" width="262" height="139" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="799" y="262.5" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">No se sabe: tamaño de la flota,</tspan></text><text x="799" y="279.14" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">red de entrega y almacenamiento</tspan></text><text x="799" y="295.78" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">de vídeo</tspan></text><rect x="10" y="379" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El 10-K de 2025 describe los TPU propios de Alphabet y sus centros de datos; los trabajos de Google Research describen la</tspan></text><text x="470" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">VCU y la recomendación. Dónde deja de valer: el uso concreto de TPU por YouTube no se detalla en las fuentes consultadas.</tspan></text><text x="470" y="468.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: documentación de Vitess, publicaciones de Google Research y ayuda de YouTube (consulta 2026-11-23). Esquema del autor.</tspan></text></svg>
