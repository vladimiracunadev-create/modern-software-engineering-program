<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cadena causal de la ingeniería continua</title><desc id="d">Cinco etapas: escala, coordinación difícil, prácticas de control, integración frecuente y operación continua. Para cada una se muestra la señal de control y lo que no garantiza. Un riesgo nuevo reabre el ciclo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="60" y="70" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="60" dy="0">Causa o práctica</tspan></text><text x="60" y="190" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="60" dy="0">Señal de control</tspan></text><text x="60" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="60" dy="0">No garantiza</tspan></text><rect x="125" y="40" width="152" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="201" y="65.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="201" dy="0">Escala y</tspan></text><text x="201" y="81.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="201" dy="0">dependencias</tspan></text><rect x="125" y="150" width="152" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="201" y="168.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="201" dy="0">Número de</tspan></text><text x="201" y="185.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="201" dy="0">interfaces y de</tspan></text><text x="201" y="201.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="201" dy="0">personas que deben</tspan></text><text x="201" y="218.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="201" dy="0">alinearse</tspan></text><rect x="125" y="270" width="152" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="201" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="201" dy="0">Más líneas no son</tspan></text><text x="201" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="201" dy="0">más valor</tspan></text><polyline points="277,70 291,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="201,100 201,150" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="201,230 201,270" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="291" y="40" width="152" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="65.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">Coordinación y</tspan></text><text x="367" y="81.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">feedback tardío</tspan></text><rect x="291" y="150" width="152" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="367" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="367" dy="0">Defectos hallados</tspan></text><text x="367" y="193.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="367" dy="0">lejos del cambio</tspan></text><text x="367" y="210.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="367" dy="0">que los causó</tspan></text><rect x="291" y="270" width="152" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="367" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="367" dy="0">Reunirse más no es</tspan></text><text x="367" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="367" dy="0">entender más</tspan></text><polyline points="443,70 457,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="367,100 367,150" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="367,230 367,270" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="457" y="40" width="152" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="533" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="533" dy="0">Modularidad,</tspan></text><text x="533" y="73.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="533" dy="0">revisión y</tspan></text><text x="533" y="90.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="533" dy="0">versiones</tspan></text><rect x="457" y="150" width="152" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="533" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="533" dy="0">Cambios revisables</tspan></text><text x="533" y="193.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="533" dy="0">y reversibles por</tspan></text><text x="533" y="210.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="533" dy="0">separado</tspan></text><rect x="457" y="270" width="152" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="533" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="533" dy="0">No prueba que la</tspan></text><text x="533" y="313.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="533" dy="0">decisión fuera</tspan></text><text x="533" y="330.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="533" dy="0">correcta</tspan></text><polyline points="609,70 623,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="533,100 533,150" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="533,230 533,270" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="623" y="40" width="152" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="699" y="65.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="699" dy="0">Integración y</tspan></text><text x="699" y="81.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="699" dy="0">entrega frecuentes</tspan></text><rect x="623" y="150" width="152" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="699" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="699" dy="0">Fallo cercano al</tspan></text><text x="699" y="193.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="699" dy="0">cambio, lote</tspan></text><text x="699" y="210.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="699" dy="0">pequeño</tspan></text><rect x="623" y="270" width="152" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="699" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="699" dy="0">No garantiza</tspan></text><text x="699" y="313.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="699" dy="0">adopción ni</tspan></text><text x="699" y="330.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="699" dy="0">recuperación</tspan></text><polyline points="775,70 789,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="699,100 699,150" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="699,230 699,270" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="789" y="40" width="152" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="865" y="65.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="865" dy="0">Operación</tspan></text><text x="865" y="81.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="865" dy="0">observable</tspan></text><rect x="789" y="150" width="152" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="865" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="865" dy="0">Ruta reconstruible</tspan></text><text x="865" y="193.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="865" dy="0">de una decisión o</tspan></text><text x="865" y="210.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="865" dy="0">un rechazo</tspan></text><rect x="789" y="270" width="152" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="865" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="865" dy="0">No explica</tspan></text><text x="865" y="313.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="865" dy="0">causalidad por sí</tspan></text><text x="865" y="330.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="865" dy="0">sola</tspan></text><polyline points="865,100 865,150" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="865,230 865,270" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="125" y="385" width="812" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="531" y="409.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="531" dy="0">Riesgo nuevo: cambiar más rápido permite dañar más rápido. Reabre el ciclo y exige gradualidad, telemetría y</tspan></text><text x="531" y="425.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="531" dy="0">recuperación; cada respuesta desplaza el cuello de botella, no lo elimina.</tspan></text><polyline points="937,414 950,414 950,70 937,70" fill="none" stroke="#a8761a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/></svg>
