<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Red de colaboración durante el incidente de matrículas duplicadas</title><desc id="d">Un nodo central, el incidente, rodeado de siete roles. Cada rol indica qué aporta o decide; operación puede detener nuevas confirmaciones si se cruza un umbral acordado y el líder conserva la línea temporal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="520" fill="#ffffff"/><rect x="375" y="224" width="210" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="256.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">Incidente: matrículas</tspan></text><text x="480" y="274.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">duplicadas</tspan></text><polyline points="480,160.6 480,109.9" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="380" y="31" width="200" height="72" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="45.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Líder del incidente</tspan></text><text x="480" y="62.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">mantiene la línea</tspan></text><text x="480" y="78.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">temporal y la imagen</tspan></text><text x="480" y="95.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">compartida</tspan></text><polyline points="570.38,198.778 666.076,167.167" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="645.823" y="104.419" width="200" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="745.823" y="127.419" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="745.823" dy="0">Soporte</tspan></text><text x="745.823" y="144.059" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="745.823" dy="0">clasifica reclamos y</tspan></text><text x="745.823" y="160.699" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="745.823" dy="0">comunica el impacto</tspan></text><polyline points="592.702,284.564 712.033,295.845" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="711.475" y="269.392" width="200" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="811.475" y="292.392" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="811.475" dy="0">Desarrollo</tspan></text><text x="811.475" y="309.032" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="811.475" dy="0">compara el cambio</tspan></text><text x="811.475" y="325.672" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="811.475" dy="0">reciente (timeout)</tspan></text><polyline points="530.157,353.358 583.264,399.037" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="527.52" y="401.689" width="200" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="627.52" y="424.689" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="627.52" dy="0">Datos</tspan></text><text x="627.52" y="441.329" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="627.52" dy="0">diseña la reconciliación</tspan></text><text x="627.52" y="457.969" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="627.52" dy="0">de escrituras</tspan></text><polyline points="429.843,353.358 376.736,399.037" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="232.48" y="401.689" width="200" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="332.48" y="424.689" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="332.48" dy="0">Seguridad</tspan></text><text x="332.48" y="441.329" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="332.48" dy="0">separa abuso de</tspan></text><text x="332.48" y="457.969" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="332.48" dy="0">reintento legítimo</tspan></text><polyline points="367.298,284.564 247.967,295.845" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="48.5245" y="269.392" width="200" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="148.525" y="292.392" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="148.525" dy="0">Producto</tspan></text><text x="148.525" y="309.032" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="148.525" dy="0">decide la experiencia de</tspan></text><text x="148.525" y="325.672" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="148.525" dy="0">reparación</tspan></text><polyline points="389.62,198.778 293.924,167.167" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="114.177" y="104.419" width="200" height="72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="214.177" y="127.419" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="214.177" dy="0">Operación</tspan></text><text x="214.177" y="144.059" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="214.177" dy="0">puede detener nuevas</tspan></text><text x="214.177" y="160.699" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="214.177" dy="0">confirmaciones al umbral</tspan></text><text x="480" y="508" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Decisión final: registra evidencia y voces disidentes. Un líder coordina; no necesita diagnosticar todo.</tspan></text></svg>
