<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuándo entra la especialidad cambia lo que se puede corregir</title><desc id="d">Línea de tiempo con cuatro hitos: idea, diseño fijado, construcción y liberación. Si seguridad entra solo como aprobación final, el diseño ya depende de supuestos costosos; si participa al modelar amenazas, ajusta el flujo antes de fijarlo. La altura cualitativa de las barras indica lo costoso de cambiar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><line x1="60" y1="150" x2="880" y2="150" stroke="#32505f" stroke-width="2"/><circle cx="110" cy="150" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="155" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="110" dy="0">1</tspan></text><text x="110" y="184" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="110" dy="0">Idea</tspan></text><circle cx="330" cy="150" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="330" y="155" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="330" dy="0">2</tspan></text><text x="330" y="184" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="330" dy="0">Diseño fijado</tspan></text><circle cx="550" cy="150" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="550" y="155" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="550" dy="0">3</tspan></text><text x="550" y="184" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="550" dy="0">Construcción</tspan></text><circle cx="770" cy="150" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="770" y="155" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="770" dy="0">4</tspan></text><text x="770" y="184" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="770" dy="0">Liberación</tspan></text><rect x="86" y="106" width="48" height="20" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><rect x="306" y="76" width="48" height="50" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><rect x="526" y="36" width="48" height="90" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><rect x="746" y="-4" width="48" height="130" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="110" y="22" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="110" dy="0">Costo cualitativo de cambiar un supuesto (sube con cada hito)</tspan></text><rect x="40" y="220" width="400" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="255" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">B · Seguridad modela amenazas con el diseño: el</tspan></text><text x="240" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">flujo se ajusta antes de fijarse. Su juicio cambia</tspan></text><text x="240" y="288.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">la decisión.</tspan></text><polyline points="330,192 330,220" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="500" y="220" width="400" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="255" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">A · Seguridad entra al final: aprueba o rechaza lo</tspan></text><text x="700" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">ya construido. Si detecta un patrón de abuso, el</tspan></text><text x="700" y="288.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">rediseño toca un flujo implementado.</tspan></text><polyline points="770,192 770,220" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="40" y="340" width="860" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="365.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Soporte y operación cierran el bucle: si resuelven un error a mano sin registrarlo, ingeniería pierde la evidencia</tspan></text><text x="470" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que corregiría el diseño.</tspan></text></svg>
