<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mismo p95, causas distintas: el desglose discrimina</title><desc id="d">Barras horizontales apiladas con datos sintéticos. Antes: 220 ms. Después, tres escenarios que suman 480 ms: pool de conexiones agotado, consulta más costosa o proveedor de identidad lento. La métrica total no distingue entre ellos; el desglose por tramo sí.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="40" y="28" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="40" dy="0">Tiempo por tramo (ms, datos sintéticos). Cada color tiene etiqueta; el ancho también codifica el valor.</tspan></text><text x="40" y="68" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="40" dy="0">Antes (220 ms)</tspan></text><rect x="40" y="76" width="46" height="36" rx="2" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="63" y="97.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="63" dy="0">40</tspan></text><rect x="86" y="76" width="23" height="36" rx="2" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="97.5" y="97.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="97.5" dy="0">20</tspan></text><rect x="109" y="76" width="103.5" height="36" rx="2" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="160.75" y="97.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160.75" dy="0">90</tspan></text><rect x="212.5" y="76" width="69" height="36" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="247" y="97.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="247" dy="0">60</tspan></text><rect x="281.5" y="76" width="11.5" height="36" rx="2" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="40" y="146" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="40" dy="0">Escenario A: pool agotado (480 ms)</tspan></text><rect x="40" y="154" width="46" height="36" rx="2" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="63" y="175.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="63" dy="0">40</tspan></text><rect x="86" y="154" width="322" height="36" rx="2" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="247" y="175.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="247" dy="0">280</tspan></text><rect x="408" y="154" width="103.5" height="36" rx="2" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="459.75" y="175.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="459.75" dy="0">90</tspan></text><rect x="511.5" y="154" width="69" height="36" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="546" y="175.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="546" dy="0">60</tspan></text><rect x="580.5" y="154" width="11.5" height="36" rx="2" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="40" y="224" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="40" dy="0">Escenario B: consulta costosa (480 ms)</tspan></text><rect x="40" y="232" width="46" height="36" rx="2" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="63" y="253.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="63" dy="0">40</tspan></text><rect x="86" y="232" width="23" height="36" rx="2" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="97.5" y="253.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="97.5" dy="0">20</tspan></text><rect x="109" y="232" width="402.5" height="36" rx="2" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="310.25" y="253.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="310.25" dy="0">350</tspan></text><rect x="511.5" y="232" width="69" height="36" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="546" y="253.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="546" dy="0">60</tspan></text><rect x="580.5" y="232" width="11.5" height="36" rx="2" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="40" y="302" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="40" dy="0">Escenario C: identidad lenta (480 ms)</tspan></text><rect x="40" y="310" width="46" height="36" rx="2" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="63" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="63" dy="0">40</tspan></text><rect x="86" y="310" width="23" height="36" rx="2" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="97.5" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="97.5" dy="0">20</tspan></text><rect x="109" y="310" width="103.5" height="36" rx="2" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="160.75" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160.75" dy="0">90</tspan></text><rect x="212.5" y="310" width="368" height="36" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="396.5" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="396.5" dy="0">320</tspan></text><rect x="580.5" y="310" width="11.5" height="36" rx="2" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><rect x="40" y="400" width="22" height="16" rx="2" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="68" y="413" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="68" dy="0">Aplicación</tspan></text><rect x="226" y="400" width="22" height="16" rx="2" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="254" y="413" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="254" dy="0">Espera de pool</tspan></text><rect x="412" y="400" width="22" height="16" rx="2" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="440" y="413" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="440" dy="0">Base de datos</tspan></text><rect x="598" y="400" width="22" height="16" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="626" y="413" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="626" dy="0">Identidad externa</tspan></text><rect x="784" y="400" width="22" height="16" rx="2" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="812" y="413" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="812" dy="0">Red</tspan></text><text x="480" y="448" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Una hipótesis útil predice qué tramo crece: así una sola medición puede debilitar a tres explicaciones.</tspan></text></svg>
