<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De «la API estuvo lenta» a cuatro tipos de enunciado</title><desc id="d">Una afirmación vaga se descompone en observación, inferencia, hipótesis y supuesto, con una pregunta de prueba para cada una: quien discrepa puede aceptar la observación y discutir la inferencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="460" fill="#ffffff"/><rect x="20" y="20" width="280" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="160" y="49.96" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="160" dy="0">«La API estuvo lenta por la base</tspan></text><text x="160" y="67.88" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="160" dy="0">de datos»: mezcla hecho y causa</tspan></text><polyline points="95,90 95,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="120" width="150" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="158.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Observación</tspan></text><rect x="176" y="120" width="430" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="391" y="150.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="391" dy="0">p95 subió de 220 a 480 ms durante 15 minutos en la</tspan></text><text x="391" y="166.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="391" dy="0">región A, tras el despliegue X.</tspan></text><rect x="612" y="120" width="310" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="150.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">¿Otra persona aceptaría el dato con el</tspan></text><text x="767" y="166.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">método declarado?</tspan></text><rect x="20" y="202" width="150" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="240.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Inferencia</tspan></text><rect x="176" y="202" width="430" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="391" y="240.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="391" dy="0">La dependencia Y contribuyó a la demora.</tspan></text><rect x="612" y="202" width="310" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="232.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">¿Qué explicación conecta datos y</tspan></text><text x="767" y="248.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">conclusión? ¿Hay rivales?</tspan></text><rect x="20" y="284" width="150" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="322.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Hipótesis</tspan></text><rect x="176" y="284" width="430" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="391" y="322.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="391" dy="0">Si Y es la causa dominante, aislarla reducirá la cola.</tspan></text><rect x="612" y="284" width="310" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="314.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">¿Qué resultado la refutaría? ¿Se</tspan></text><text x="767" y="330.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">escribió antes de medir?</tspan></text><rect x="20" y="366" width="150" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="404.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Supuesto</tspan></text><rect x="176" y="366" width="430" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="391" y="404.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="391" dy="0">La carga de prueba es representativa del tráfico real.</tspan></text><rect x="612" y="366" width="310" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="396.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">¿Qué pasa con la decisión si el</tspan></text><text x="767" y="412.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">supuesto es falso?</tspan></text><text x="616" y="108" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="616" dy="0">Pregunta de control</tspan></text><text x="180" y="108" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="180" dy="0">Ejemplo</tspan></text><text x="470" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">El registro permite aceptar la observación y disputar la inferencia sin negar los datos.</tspan></text></svg>
