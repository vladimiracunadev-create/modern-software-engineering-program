<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Métricas verdes en dos capas, abandono en la tercera</title><desc id="d">Tres columnas: calidad interna, producto en ejecución y calidad en uso. Para cada una se muestra lo que el tablero mide y lo que no observa. Las dos primeras capas muestran valores aceptables mientras la tercera muestra abandono; la idempotencia de la confirmación no se observa en ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><rect x="30" y="24" width="270" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="165" y="50.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="165" dy="0">Calidad interna</tspan></text><text x="165" y="96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="165" dy="0">El tablero muestra</tspan></text><rect x="30" y="106" width="270" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="165" y="143.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="165" dy="0">Cobertura 90 %, linter limpio,</tspan></text><text x="165" y="159.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="165" dy="0">baja complejidad</tspan></text><text x="165" y="218" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="165" dy="0">No observa</tspan></text><rect x="30" y="228" width="270" height="84" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="165" y="257" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="165" dy="0">No observa si las aserciones</tspan></text><text x="165" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="165" dy="0">prueban la regla ni si hay</tspan></text><text x="165" y="290.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="165" dy="0">idempotencia</tspan></text><polyline points="300,148 330,148" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="315" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="315" dy="0">¿evidencia?</tspan></text><rect x="330" y="24" width="270" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="465" y="50.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465" dy="0">Producto en ejecución</tspan></text><text x="465" y="96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="465" dy="0">El tablero muestra</tspan></text><rect x="330" y="106" width="270" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="143.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">p95 de la API por debajo del</tspan></text><text x="465" y="159.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">objetivo</tspan></text><text x="465" y="218" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="465" dy="0">No observa</tspan></text><rect x="330" y="228" width="270" height="84" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="465" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="465" dy="0">No observa reintentos con la misma</tspan></text><text x="465" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="465" dy="0">clave ni estados contradictorios</tspan></text><polyline points="600,148 630,148" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="615" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615" dy="0">¿evidencia?</tspan></text><rect x="630" y="24" width="270" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="765" y="50.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="765" dy="0">Calidad en uso</tspan></text><text x="765" y="96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="765" dy="0">El tablero muestra</tspan></text><rect x="630" y="106" width="270" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="765" y="143.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="765" dy="0">Abandono del flujo y llamadas a</tspan></text><text x="765" y="159.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="765" dy="0">soporte</tspan></text><text x="765" y="218" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="765" dy="0">No observa</tspan></text><rect x="630" y="228" width="270" height="84" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="765" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="765" dy="0">Es la señal que sí muestra el</tspan></text><text x="765" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="765" dy="0">daño; llega tarde y sin causa</tspan></text><rect x="30" y="340" width="870" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="370.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Cada flecha es una hipótesis: código legible facilita cambiar, pero no asegura que la persona complete su tarea.</tspan></text><text x="465" y="386.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Hace falta un escenario que una las tres capas.</tspan></text><text x="465" y="442" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">Los valores son ilustrativos del caso Campus Abierto; no son mediciones.</tspan></text></svg>
