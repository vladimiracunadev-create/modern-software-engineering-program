<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Restricciones filtran, preferencias ordenan, supuestos se revisan</title><desc id="d">Embudo de decisión: seis opciones iniciales, tres tras aplicar las restricciones duras y una decisión tras comparar con preferencias. A un lado, el fallo de declarar todas las preferencias como duras.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><rect x="40" y="30" width="520" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="300" y="56.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="300" dy="0">Seis opciones iniciales (incluye «no hacer nada» y alternativas poco</tspan></text><text x="300" y="72.96" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="300" dy="0">obvias)</tspan></text><polyline points="300,92 300,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="122" width="520" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="300" y="147.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="300" dy="0">Filtro: restricciones duras (con fuente, vigencia y autoridad)</tspan></text><polyline points="300,166 300,196" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="90" y="196" width="420" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="300" y="222.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="300" dy="0">Tres opciones viables: confirmación síncrona central ·</tspan></text><text x="300" y="238.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="300" dy="0">reserva temporal · aceptación asincrónica</tspan></text><polyline points="300,258 300,288" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="288" width="520" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="300" y="313.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="300" dy="0">Comparación: preferencias graduadas, sensibilidad y evidencia</tspan></text><polyline points="300,332 300,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="110" y="362" width="380" height="62" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="300" y="388.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="300" dy="0">Decisión: reserva temporal, con propietario,</tspan></text><text x="300" y="404.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="300" dy="0">fecha y disparadores de revisión</tspan></text><rect x="600" y="30" width="320" height="200" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="760" y="100.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">Fallo: si cada deseo se declara</tspan></text><text x="760" y="117" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">«innegociable», el filtro deja una sola</tspan></text><text x="760" y="133.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">opción —la elegida de antemano— y la</tspan></text><text x="760" y="150.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">comparación se vuelve teatro. Revalida la</tspan></text><text x="760" y="166.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">fuente de cada restricción.</tspan></text><rect x="600" y="250" width="320" height="174" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="760" y="307.36" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">Supuestos: completan información</tspan></text><text x="760" y="324" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">faltante. Cada uno lleva una condición de</tspan></text><text x="760" y="340.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">revisión, por ejemplo «si el proveedor</tspan></text><text x="760" y="357.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">cambia su contrato, se reabre la</tspan></text><text x="760" y="373.92" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">decisión».</tspan></text></svg>
