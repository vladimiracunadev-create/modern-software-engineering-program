<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la barrera detectada a la alternativa y su señal</title><desc id="d">Tabla de cinco barreras detectadas en la matrícula solo digital, el diseño que las atiende y la señal con su guardrail. Todas conservan resultado, plazo comparable, privacidad y derecho a recuperación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="480" fill="#ffffff"/><rect x="10" y="12" width="245" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132.5" y="35.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132.5" dy="0">Barrera detectada</tspan></text><rect x="290" y="12" width="370" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="475" y="35.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="475" dy="0">Diseño alternativo</tspan></text><rect x="690" y="12" width="260" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="820" y="35.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820" dy="0">Señal y guardrail</tspan></text><rect x="10" y="60" width="245" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="132.5" y="84.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="132.5" dy="0">Dispositivo compartido o</tspan></text><text x="132.5" y="100.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="132.5" dy="0">antiguo</tspan></text><rect x="290" y="60" width="370" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">HTML liviano, reanudación sin pérdida de datos</tspan></text><rect x="690" y="60" width="260" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="820" y="84.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">Finalización por tipo de</tspan></text><text x="820" y="100.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">dispositivo; carga de soporte</tspan></text><polyline points="255,89 290,89" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="660,89 690,89" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="126" width="245" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="132.5" y="150.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="132.5" dy="0">Conectividad baja o</tspan></text><text x="132.5" y="166.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="132.5" dy="0">intermitente</tspan></text><rect x="290" y="126" width="370" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="150.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">Documentos mínimos, imágenes comprimidas, estado</tspan></text><text x="475" y="166.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">consultable</tspan></text><rect x="690" y="126" width="260" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="820" y="150.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">Abandono por franja de</tspan></text><text x="820" y="166.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">conectividad; reintentos</tspan></text><polyline points="255,155 290,155" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="660,155 690,155" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="192" width="245" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="132.5" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="132.5" dy="0">Tecnología asistiva</tspan></text><rect x="290" y="192" width="370" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="216.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">Teclado completo, texto alternativo, pruebas de</tspan></text><text x="475" y="232.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">tarea con la tecnología</tspan></text><rect x="690" y="192" width="260" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="820" y="216.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">Tareas completadas con</tspan></text><text x="820" y="232.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">tecnología asistiva</tspan></text><polyline points="255,221 290,221" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="660,221 690,221" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="258" width="245" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="132.5" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="132.5" dy="0">Necesidad de privacidad</tspan></text><rect x="290" y="258" width="370" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="282.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">Confirmación por canal elegible, sin exponer</tspan></text><text x="475" y="298.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">historial ni notificaciones</tspan></text><rect x="690" y="258" width="260" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="820" y="282.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">Solicitudes de cambio de canal;</tspan></text><text x="820" y="298.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">incidentes de exposición</tspan></text><polyline points="255,287 290,287" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="660,287 690,287" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="324" width="245" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="132.5" y="356.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="132.5" dy="0">Guardia nocturna concentrada</tspan></text><rect x="290" y="324" width="370" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="348.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">Automatización, rotación y límites de carga para</tspan></text><text x="475" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">el equipo</tspan></text><rect x="690" y="324" width="260" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="820" y="348.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">Interrupciones por persona;</tspan></text><text x="820" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">rotación del equipo</tspan></text><polyline points="255,353 290,353" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="660,353 690,353" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="396" width="940" height="72" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="427.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Invariantes de toda alternativa: el mismo resultado esencial, un plazo comparable, privacidad y derecho a recuperación. Una</tspan></text><text x="480" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">ruta lenta o estigmatizante no cuenta como alternativa.</tspan></text></svg>
