<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Priorizar gaps por consecuencia y costo de obtener evidencia</title><desc id="d">Cuadrícula de dos por dos: consecuencia alta o baja frente a costo bajo o alto de conseguir la evidencia. Si repetir una solicitud duplica el cobro, la consecuencia es alta y se investiga primero; el color del tablero interno es un desconocido irrelevante.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="460" fill="#ffffff"/><text x="450" y="22" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450" dy="0">Consecuencia si el desconocido resulta adverso</tspan></text><text x="285" y="52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="285" dy="0">Alta</tspan></text><text x="615" y="52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="615" dy="0">Baja</tspan></text><text x="46" y="170" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="46" dy="0">Costo bajo</tspan></text><text x="46" y="330" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="46" dy="0">Costo alto</tspan></text><rect x="110" y="66" width="350" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="285" y="128" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="285" dy="0">Investiga primero: «¿repetir la solicitud</tspan></text><text x="285" y="144.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="285" dy="0">duplica el cobro?». Alta consecuencia y una</tspan></text><text x="285" y="161.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="285" dy="0">prueba basta.</tspan></text><rect x="470" y="66" width="350" height="150" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="645" y="136.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="645" dy="0">Resuelve si es barato: confirma la versión de</tspan></text><text x="645" y="152.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="645" dy="0">una dependencia no crítica.</tspan></text><rect x="110" y="226" width="350" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="285" y="288" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="285" dy="0">Planifica: evaluar el comportamiento ante una</tspan></text><text x="285" y="304.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="285" dy="0">caída regional exige un ensayo costoso, pero</tspan></text><text x="285" y="321.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="285" dy="0">la consecuencia lo justifica.</tspan></text><rect x="470" y="226" width="350" height="150" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="645" y="288" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="645" dy="0">No persigas: «no sé el color del tablero</tspan></text><text x="645" y="304.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="645" dy="0">interno». Es desconocido, no relevante para</tspan></text><text x="645" y="321.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="645" dy="0">ninguna decisión.</tspan></text><rect x="110" y="392" width="710" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="465" y="413.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">Un gap es una pregunta necesaria que la evidencia disponible no responde; no cualquier</tspan></text><text x="465" y="429.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">ausencia de documentación.</tspan></text></svg>
