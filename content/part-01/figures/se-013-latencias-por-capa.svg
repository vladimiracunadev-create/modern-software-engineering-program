<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Órdenes de magnitud de la latencia, en escala logarítmica</title><desc id="d">Barras horizontales en escala logarítmica con latencias típicas aproximadas: registro, caché L1, memoria principal, SSD, red del mismo centro de datos, disco giratorio y red intercontinental. Cada escalón es de uno o varios órdenes de magnitud.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="460" fill="#ffffff"/><text x="20" y="24" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Latencia típica (orden de magnitud; varía por modelo y carga)</tspan></text><text x="240" y="68" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="240" dy="0">Registro</tspan></text><rect x="250" y="48" width="29.5815" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="287.582" y="68" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="287.582" dy="0">≈ 0,3 ns</tspan></text><text x="240" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="240" dy="0">Caché L1</tspan></text><rect x="250" y="92" width="62" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="112" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="320" dy="0">≈ 1 ns</tspan></text><text x="240" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="240" dy="0">Caché L3</tspan></text><rect x="250" y="136" width="142.664" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="400.664" y="156" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="400.664" dy="0">≈ 20 ns</tspan></text><text x="240" y="200" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="240" dy="0">Memoria principal</tspan></text><rect x="250" y="180" width="186" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="444" y="200" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="444" dy="0">≈ 100 ns</tspan></text><text x="240" y="244" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="240" dy="0">SSD (lectura aleatoria)</tspan></text><rect x="250" y="224" width="372" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="244" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="630" dy="0">≈ 100 µs</tspan></text><text x="240" y="288" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="240" dy="0">Red, mismo centro de datos</tspan></text><rect x="250" y="268" width="415.336" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="673.336" y="288" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="673.336" dy="0">≈ 0,5 ms</tspan></text><text x="240" y="332" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="240" dy="0">Disco giratorio (búsqueda)</tspan></text><rect x="250" y="312" width="477.336" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="735.336" y="332" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="735.336" dy="0">≈ 5 ms</tspan></text><text x="240" y="376" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="240" dy="0">Red entre continentes</tspan></text><rect x="250" y="356" width="558" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="816" y="376" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="816" dy="0">≈ 100 ms</tspan></text><text x="470" y="438" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">La escala es logarítmica: cada unidad de longitud multiplica por diez. Una espera de red de ~100 ms equivale a ~10⁹ accesos a caché L1.</tspan></text></svg>
