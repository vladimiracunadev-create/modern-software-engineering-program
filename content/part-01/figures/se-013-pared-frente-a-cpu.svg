<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de pared frente a tiempo de CPU en dos programas</title><desc id="d">Gráfico de barras con una medición real: dormir 0,5 segundos consume 0,5 s de pared y 0,0 s de CPU; un bucle de cálculo consume 0,26 s de pared y 0,27 s de CPU. El mismo síntoma, tardar, tiene causas distintas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><line x1="80" y1="320" x2="560" y2="320" stroke="#32505f" stroke-width="1.8"/><line x1="80" y1="40" x2="80" y2="320" stroke="#32505f" stroke-width="1.8"/><text x="72" y="48" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="72" dy="0">segundos</tspan></text><rect x="130" y="120" width="60" height="200" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="196" y="318" width="60" height="2" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="160" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160" dy="0">0.5</tspan></text><text x="226" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="226" dy="0">0</tspan></text><text x="193" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="193" dy="0">Dormir 0,5 s</tspan><tspan x="193" dy="16.64">(espera)</tspan></text><rect x="350" y="216" width="60" height="104" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="416" y="213.6" width="60" height="106.4" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="380" y="208" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="380" dy="0">0.26</tspan></text><text x="446" y="205.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="446" dy="0">0.266</tspan></text><text x="413" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="413" dy="0">Bucle de cálculo</tspan><tspan x="413" dy="16.64">(3 millones de pasos)</tspan></text><rect x="590" y="60" width="290" height="40" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="735" y="85" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="735" dy="0">Tiempo de pared (perf_counter)</tspan></text><rect x="590" y="108" width="290" height="40" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="735" y="133" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="735" dy="0">Tiempo de CPU (process_time)</tspan></text><rect x="590" y="170" width="290" height="130" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="735" y="213.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="735" dy="0">Si la CPU no trabaja mientras el</tspan></text><text x="735" y="230.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="735" dy="0">reloj corre, el proceso espera: I/O,</tspan></text><text x="735" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="735" dy="0">red, bloqueo o reposo. Acelerar la</tspan></text><text x="735" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="735" dy="0">CPU no ataca esa causa.</tspan></text><text x="450" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Una ejecución en CPython 3.12.9, Windows, AMD64. Repite varias veces: los valores varían entre máquinas y corridas.</tspan></text></svg>
