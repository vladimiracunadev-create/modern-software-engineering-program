an></text><circle cx="209.792" cy="139.792" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="209.792" y="144.792" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="209.792" dy="0"></tspan></text><text x="236.662" y="171.662" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="236.662" dy="0">14</tspan></text><text x="182.922" y="117.922" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182.922" dy="0">-2</tspan></text><text x="259.289" y="193.289" font-size="11" text-anchor="middle" font-weight="400" fill="#32505f"><tspan x="259.289" dy="0">1110</tspan></text><circle cx="264.944" cy="102.94" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="264.944" y="107.94" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="264.944" dy="0"></tspan></text><text x="279.486" y="143.048" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="279.486" dy="0">15</tspan></text><text x="250.402" y="72.8331" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="250.402" dy="0">-1</tspan></text><text x="291.732" y="171.612" font-size="11" text-anchor="middle" font-weight="400" fill="#32505f"><tspan x="291.732" dy="0">1111</tspan></text><text x="330" y="256" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="330" dy="0">patrón de 4 bits</tspan></text><text x="330" y="276" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="330" dy="0">dentro: sin signo</tspan></text><text x="330" y="296" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="330" dy="0">fuera: con signo</tspan></text><rect x="620" y="70" width="300" height="120" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="770" y="108.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="770" dy="0">Sumar 1 a 0111 