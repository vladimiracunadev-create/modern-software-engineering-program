<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo entero de 32 bits en memoria, según el orden de bytes</title><desc id="d">El valor 1 serializado en cuatro bytes. En big-endian queda 00 00 00 01; en little-endian queda 01 00 00 00. Si un lector asume el orden contrario, 1 se interpreta como 16 777 216.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><text x="20" y="26" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Valor: 1 = 0x00000001 (32 bits)</tspan></text><text x="330" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="330" dy="0">dirección +0</tspan></text><text x="450" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450" dy="0">dirección +1</tspan></text><text x="570" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="570" dy="0">dirección +2</tspan></text><text x="690" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="690" dy="0">dirección +3</tspan></text><text x="20" y="112" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">big-endian</tspan></text><text x="20" y="132" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="20" dy="0">(el más significativo primero)</tspan></text><text x="20" y="212" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">little-endian</tspan></text><text x="20" y="232" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="20" dy="0">(el menos significativo primero)</tspan></text><rect x="272" y="82" width="116" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="114.6" font-size="20" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">00</tspan></text><rect x="272" y="182" width="116" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="330" y="214.6" font-size="20" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="330" dy="0">01</tspan></text><rect x="392" y="82" width="116" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="114.6" font-size="20" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="450" dy="0">00</tspan></text><rect x="392" y="182" width="116" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="214.6" font-size="20" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="450" dy="0">00</tspan></text><rect x="512" y="82" width="116" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="570" y="114.6" font-size="20" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="570" dy="0">00</tspan></text><rect x="512" y="182" width="116" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="570" y="214.6" font-size="20" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="570" dy="0">00</tspan></text><rect x="632" y="82" width="116" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690" y="114.6" font-size="20" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="690" dy="0">01</tspan></text><rect x="632" y="182" width="116" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="690" y="214.6" font-size="20" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="690" dy="0">00</tspan></text><polyline points="510,240 510,290" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="60" y="292" width="820" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="322.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">Lectura cruzada: bytes escritos en little-endian (01 00 00 00) leídos como big-endian dan 0x01000000 = 16 777</tspan></text><text x="470" y="338.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">216. Ningún byte se perdió: se perdió el contrato.</tspan></text><text x="470" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">El orden se fija en el contrato del formato (por ejemplo, orden de red = big-endian), no se detecta en cada extremo.</tspan></text></svg>
