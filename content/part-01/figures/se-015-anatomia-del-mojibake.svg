<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Anatomía del mojibake y su reparación paso a paso</title><desc id="d">Fila superior: la letra í se codifica en UTF-8 como C3 AD; si esos bytes se decodifican como Windows-1252 aparece Ã y un guion blando invisible; si ese texto se guarda de nuevo en UTF-8 los bytes pasan a C3 83 C2 AD. Fila inferior: la reparación invierte exactamente esa cadena.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="20" y="26" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Cómo se rompe (una vez por cada capa de error)</tspan></text><rect x="14" y="44" width="218" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="123" y="74.48" font-size="16" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="123" dy="0">í</tspan></text><rect x="14" y="100" width="218" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="123" y="138.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="123" dy="0">texto correcto, punto</tspan></text><text x="123" y="154.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="123" dy="0">U+00ED</tspan></text><polyline points="232,70 250,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="250" y="44" width="218" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="359" y="74.48" font-size="16" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="359" dy="0">C3 AD</tspan></text><rect x="250" y="100" width="218" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="359" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="359" dy="0">bytes UTF-8 correctos</tspan></text><polyline points="468,70 486,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="486" y="44" width="218" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="595" y="74.48" font-size="16" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="595" dy="0">Ã + U+00AD</tspan></text><rect x="486" y="100" width="218" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="595" y="121.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595" dy="0">mal decodificado como</tspan></text><text x="595" y="138.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595" dy="0">Windows-1252 (el segundo</tspan></text><text x="595" y="154.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595" dy="0">carácter es un guion</tspan></text><text x="595" y="171.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595" dy="0">blando, invisible)</tspan></text><polyline points="704,70 722,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="44" width="218" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="831" y="74.48" font-size="16" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="831" dy="0">C3 83 C2 AD</tspan></text><rect x="722" y="100" width="218" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="831" y="138.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="831" dy="0">guardado de nuevo en UTF-8:</tspan></text><text x="831" y="154.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="831" dy="0">segunda capa de error</tspan></text><text x="20" y="236" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Cómo se repara (se invierte la cadena y se valida)</tspan></text><rect x="14" y="254" width="218" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="123" y="283.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="123" dy="0">Texto mal decodificado</tspan></text><rect x="14" y="310" width="218" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="123" y="344.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123" dy="0">Ã seguido de U+00AD</tspan></text><text x="123" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123" dy="0">(invisible)</tspan></text><polyline points="232,280 250,280" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="250" y="254" width="218" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="359" y="283.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="359" dy="0">encode(&#x27;cp1252&#x27;)</tspan></text><rect x="250" y="310" width="218" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="359" y="344.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="359" dy="0">recupera los bytes</tspan></text><text x="359" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="359" dy="0">originales C3 AD</tspan></text><polyline points="468,280 486,280" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="486" y="254" width="218" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="595" y="283.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="595" dy="0">decode(&#x27;utf-8&#x27;)</tspan></text><rect x="486" y="310" width="218" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="595" y="344.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="595" dy="0">recupera «í» con el</tspan></text><text x="595" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="595" dy="0">contrato correcto</tspan></text><polyline points="704,280 722,280" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="254" width="218" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="831" y="283.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="831" dy="0">Validar</tspan></text><rect x="722" y="310" width="218" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="831" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="831" dy="0">ida y vuelta sobre una</tspan></text><text x="831" y="352.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="831" dy="0">muestra; conservar el</tspan></text><text x="831" y="369.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="831" dy="0">original</tspan></text><rect x="14" y="408" width="932" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="435.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un reemplazo visual de «Ã­» por «í» no repara la causa y puede dañar texto legítimo. Se reconstruye la cadena con evidencia.</tspan></text></svg>
