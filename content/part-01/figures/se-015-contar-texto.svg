<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres textos que se ven iguales y se miden distinto</title><desc id="d">Tabla de tres textos: «José» en forma compuesta, «José» en forma descompuesta y el emoji de familia. Para cada uno se cuentan grafemas, puntos de código, bytes UTF-8 y unidades UTF-16: las cuatro cuentas difieren.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><rect x="10" y="12" width="235" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="127.5" y="37.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="127.5" dy="0">Texto</tspan></text><rect x="250" y="12" width="185" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="342.5" y="29.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="342.5" dy="0">Grafemas (lo que se</tspan></text><text x="342.5" y="45.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="342.5" dy="0">ve)</tspan></text><rect x="440" y="12" width="175" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527.5" y="37.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527.5" dy="0">Puntos de código</tspan></text><rect x="620" y="12" width="155" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697.5" y="37.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697.5" dy="0">Bytes UTF-8</tspan></text><rect x="780" y="12" width="150" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="855" y="37.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="855" dy="0">Unidades UTF-16</tspan></text><rect x="10" y="64" width="235" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="127.5" y="99.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="127.5" dy="0">«José» compuesto (NFC)</tspan></text><rect x="250" y="64" width="185" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342.5" y="101.6" font-size="20" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="342.5" dy="0">4</tspan></text><rect x="440" y="64" width="175" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="527.5" y="101.6" font-size="20" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="527.5" dy="0">4</tspan></text><rect x="620" y="64" width="155" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="697.5" y="101.6" font-size="20" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="697.5" dy="0">5</tspan></text><rect x="780" y="64" width="150" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="855" y="101.6" font-size="20" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855" dy="0">4</tspan></text><rect x="10" y="136" width="235" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="127.5" y="163.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="127.5" dy="0">«José» descompuesto (NFD): e</tspan></text><text x="127.5" y="179.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="127.5" dy="0">+ acento</tspan></text><rect x="250" y="136" width="185" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342.5" y="173.6" font-size="20" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="342.5" dy="0">4</tspan></text><rect x="440" y="136" width="175" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="527.5" y="173.6" font-size="20" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="527.5" dy="0">5</tspan></text><rect x="620" y="136" width="155" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="697.5" y="173.6" font-size="20" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="697.5" dy="0">6</tspan></text><rect x="780" y="136" width="150" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="855" y="173.6" font-size="20" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855" dy="0">5</tspan></text><rect x="10" y="208" width="235" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="127.5" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="127.5" dy="0">Emoji familia: 3 personas</tspan></text><text x="127.5" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="127.5" dy="0">unidas</tspan></text><rect x="250" y="208" width="185" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342.5" y="245.6" font-size="20" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="342.5" dy="0">1</tspan></text><rect x="440" y="208" width="175" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="527.5" y="245.6" font-size="20" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="527.5" dy="0">5</tspan></text><rect x="620" y="208" width="155" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="697.5" y="245.6" font-size="20" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="697.5" dy="0">18</tspan></text><rect x="780" y="208" width="150" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="855" y="245.6" font-size="20" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855" dy="0">8</tspan></text><rect x="10" y="292" width="920" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">len() en Python cuenta puntos de código. NFC y NFD son iguales para una persona y distintas para una comparación de bytes;</tspan></text><text x="470" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">por eso se normaliza antes de comparar.</tspan></text><text x="470" y="380" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Conteos verificados con Python 3.12 (len, encode, normalize). El conteo de grafemas sigue las reglas de Unicode para el texto mostrado.</tspan></text></svg>
