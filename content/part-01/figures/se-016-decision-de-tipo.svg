<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Elegir la representación por invariantes del dominio</title><desc id="d">Árbol de decisión: dinero con reglas decimales exactas usa enteros escalados o Decimal; identificadores y contadores usan enteros con ancho declarado; mediciones usan float con tolerancia y validación de valores especiales; proporciones exactas pueden usar Fraction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><rect x="300" y="10" width="340" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="27.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">¿Qué invariantes debe conservar el</tspan></text><text x="470" y="45.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">valor?</tspan></text><polyline points="470,56 470,80 122,80 122,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="100" width="216" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="140.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Reglas decimales exactas</tspan></text><text x="122" y="156.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">(dinero, tarifas)</tspan></text><rect x="14" y="200" width="216" height="120" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="122" y="238.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122" dy="0">Entero en la unidad</tspan></text><text x="122" y="255.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122" dy="0">mínima, o Decimal con</tspan></text><text x="122" y="271.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122" dy="0">escala y redondeo</tspan></text><text x="122" y="288.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122" dy="0">declarados</tspan></text><polyline points="470,56 470,80 354,80 354,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="246" y="100" width="216" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="354" y="148.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="354" dy="0">Identificador o contador</tspan></text><rect x="246" y="200" width="216" height="120" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="354" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="354" dy="0">Entero con ancho y signo</tspan></text><text x="354" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="354" dy="0">del contrato; valida rango</tspan></text><text x="354" y="280.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="354" dy="0">antes de serializar</tspan></text><polyline points="470,56 470,80 586,80 586,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="100" width="216" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="586" y="148.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="586" dy="0">Medición con incertidumbre</tspan></text><rect x="478" y="200" width="216" height="120" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="586" y="238.68" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="586" dy="0">float + tolerancia</tspan></text><text x="586" y="255.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="586" dy="0">relativa y absoluta;</tspan></text><text x="586" y="271.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="586" dy="0">valida NaN, infinito y</tspan></text><text x="586" y="288.6" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="586" dy="0">cero con signo</tspan></text><polyline points="470,56 470,80 818,80 818,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="710" y="100" width="216" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="818" y="148.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="818" dy="0">Razón exacta entre enteros</tspan></text><rect x="710" y="200" width="216" height="120" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="818" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="818" dy="0">Fraction (racionales</tspan></text><text x="818" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="818" dy="0">exactos) si el costo es</tspan></text><text x="818" y="280.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="818" dy="0">aceptable</tspan></text><rect x="14" y="344" width="912" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="367.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Float no es «incorrecto»: es el tipo adecuado para muchas mediciones. Lo incorrecto es usarlo por costumbre donde el</tspan></text><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">dominio exige decimales exactos.</tspan></text><rect x="14" y="410" width="912" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="435.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Decimal no vuelve exacta una medición incierta ni elimina overflow o costo: la representación sigue a la invariante.</tspan></text></svg>
