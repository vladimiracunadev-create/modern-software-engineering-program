<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Error al sumar 0,1 repetidamente frente a una suma compensada</title><desc id="d">Gráfico de barras con valores calculados por el generador: el error absoluto de sumar 0,1 con un bucle simple crece con el número de sumas, y math.fsum lo mantiene en cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="460" fill="#ffffff"/><text x="20" y="26" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Error absoluto = |suma con bucle simple − valor exacto|</tspan></text><text x="20" y="78" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">10 sumas</tspan></text><rect x="160" y="56" width="26.1859" height="34" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="194.186" y="79" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="194.186" dy="0">1.11e-16</tspan></text><text x="160" y="112" font-size="12" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">math.fsum: error 0</tspan></text><text x="20" y="158" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">1 000 sumas</tspan></text><rect x="160" y="136" width="247.547" height="34" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="415.547" y="159" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="415.547" dy="0">1.41e-12</tspan></text><text x="160" y="192" font-size="12" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">math.fsum: error 0</tspan></text><text x="20" y="238" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">100 000 sumas</tspan></text><rect x="160" y="216" width="470.213" height="34" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="638.213" y="239" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="638.213" dy="0">1.88e-8</tspan></text><text x="160" y="272" font-size="12" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">math.fsum: error 0</tspan></text><text x="20" y="318" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">1 000 000 sumas</tspan></text><rect x="160" y="296" width="570" height="34" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="738" y="319" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="738" dy="0">1.33e-6</tspan></text><text x="160" y="352" font-size="12" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">math.fsum: error 0</tspan></text><rect x="20" y="376" width="900" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="401.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Longitud de la barra en escala logarítmica. Cada suma redondea; los errores se acumulan. Reordenar o compensar (fsum)</tspan></text><text x="470" y="417.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">cambia el resultado: no existe «la» suma correcta de floats, sino una política.</tspan></text></svg>
