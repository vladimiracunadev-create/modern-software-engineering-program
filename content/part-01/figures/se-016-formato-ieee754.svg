<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los 64 bits de 0,1 en IEEE 754 de doble precisión</title><desc id="d">Un double se reparte en 1 bit de signo, 11 de exponente y 52 de fracción. El valor 0,1 se guarda como 0x3FB999999999999A: signo 0, exponente 1019 (2 elevado a -4) y fracción 0x999999999999A. Es el double más cercano a 0,1, no 0,1 exacto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><rect x="20" y="60" width="90" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="65" y="85.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="65" dy="0">signo</tspan></text><text x="65" y="101.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="65" dy="0">1 bit</tspan></text><rect x="110" y="60" width="220" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="220" y="85.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="220" dy="0">exponente</tspan></text><text x="220" y="101.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="220" dy="0">11 bits</tspan></text><rect x="330" y="60" width="600" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="85.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">fracción (significando)</tspan></text><text x="630" y="101.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">52 bits</tspan></text><rect x="20" y="130" width="90" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="65" y="160.04" font-size="18" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="65" dy="0">0</tspan></text><rect x="110" y="130" width="220" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="220" y="159.48" font-size="16" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="220" dy="0">0x3FB = 1019</tspan></text><rect x="330" y="130" width="600" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="630" y="159.48" font-size="16" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="630" dy="0">0x999999999999A</tspan></text><text x="480" y="36" font-size="15" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="480" dy="0">0,1 almacenado: 0x3FB999999999999A</tspan></text><rect x="20" y="204" width="910" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="475" y="234.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="475" dy="0">Valor = (−1)^signo × (1 + fracción/2⁵²) × 2^(exponente − 1023) = 1,6000000000000000888… × 2⁻⁴ =</tspan></text><text x="475" y="250.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="475" dy="0">0,1000000000000000055511151231257827… (el double más cercano).</tspan></text><rect x="20" y="292" width="440" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Por eso float.hex() muestra 0x1.999999999999ap-4 y</tspan></text><text x="240" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">as_integer_ratio() da 3602879701896397 / 2⁵⁵.</tspan></text><rect x="480" y="292" width="450" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="705" dy="0">La salida corta «0.1» es una representación decimal</tspan></text><text x="705" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="705" dy="0">conveniente; los bits guardados no son exactamente 0,1.</tspan></text></svg>
