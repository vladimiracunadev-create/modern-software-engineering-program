<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Segmentación (pipeline) de cinco etapas con una dependencia carga-uso</title><desc id="d">Diagrama de ciclos para cuatro instrucciones: dos cargas, una suma que depende de la segunda carga y un almacenamiento. La suma espera un ciclo, de modo que las cuatro instrucciones terminan en nueve ciclos en lugar de ocho.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><text x="20" y="28" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Etapas: IF = obtener, ID = decodificar, EX = ejecutar, MEM = memoria, WB = escribir el resultado</tspan></text><text x="289" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="289" dy="0">ciclo 1</tspan></text><text x="367" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="367" dy="0">ciclo 2</tspan></text><text x="445" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="445" dy="0">ciclo 3</tspan></text><text x="523" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="523" dy="0">ciclo 4</tspan></text><text x="601" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601" dy="0">ciclo 5</tspan></text><text x="679" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="679" dy="0">ciclo 6</tspan></text><text x="757" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="757" dy="0">ciclo 7</tspan></text><text x="835" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835" dy="0">ciclo 8</tspan></text><text x="913" y="62" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="913" dy="0">ciclo 9</tspan></text><rect x="10" y="74" width="232" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="126" y="102.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="126" dy="0">1 LOAD r1, [a]</tspan></text><rect x="252" y="74" width="74" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289" y="102.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289" dy="0">IF</tspan></text><rect x="330" y="74" width="74" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="367" y="102.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="367" dy="0">ID</tspan></text><rect x="408" y="74" width="74" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="445" y="102.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="445" dy="0">EX</tspan></text><rect x="486" y="74" width="74" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="523" y="102.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="523" dy="0">MEM</tspan></text><rect x="564" y="74" width="74" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="601" y="102.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="601" dy="0">WB</tspan></text><rect x="10" y="136" width="232" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="126" y="164.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="126" dy="0">2 LOAD r2, [b]</tspan></text><rect x="330" y="136" width="74" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="367" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="367" dy="0">IF</tspan></text><rect x="408" y="136" width="74" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="445" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="445" dy="0">ID</tspan></text><rect x="486" y="136" width="74" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="523" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="523" dy="0">EX</tspan></text><rect x="564" y="136" width="74" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="601" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="601" dy="0">MEM</tspan></text><rect x="642" y="136" width="74" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="679" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="679" dy="0">WB</tspan></text><rect x="10" y="198" width="232" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="126" y="226.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="126" dy="0">3 ADD r3, r1, r2</tspan></text><rect x="408" y="198" width="74" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="445" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">IF</tspan></text><rect x="486" y="198" width="74" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="523" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="523" dy="0">ID</tspan></text><rect x="564" y="198" width="74" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="601" y="226.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="601" dy="0">ID*</tspan></text><rect x="642" y="198" width="74" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="679" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="679" dy="0">EX</tspan></text><rect x="720" y="198" width="74" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="757" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="757" dy="0">MEM</tspan></text><rect x="798" y="198" width="74" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="835" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="835" dy="0">WB</tspan></text><rect x="10" y="260" width="232" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="126" y="288.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="126" dy="0">4 STORE [c], r3</tspan></text><rect x="486" y="260" width="74" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="523" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="523" dy="0">IF</tspan></text><rect x="564" y="260" width="74" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="601" y="288.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="601" dy="0">IF*</tspan></text><rect x="642" y="260" width="74" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="679" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="679" dy="0">ID</tspan></text><rect x="720" y="260" width="74" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">EX</tspan></text><rect x="798" y="260" width="74" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="835" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835" dy="0">MEM</tspan></text><rect x="876" y="260" width="74" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="913" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="913" dy="0">WB</tspan></text><rect x="10" y="330" width="462" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="241" y="354.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="241" dy="0">ID* e IF* = espera (burbuja): la suma necesita r2, que la</tspan></text><text x="241" y="370.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="241" dy="0">segunda carga entrega al final de MEM.</tspan></text><rect x="488" y="330" width="462" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="719" y="354.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="719" dy="0">Modelo didáctico clásico. Las CPU reales son más complejas:</tspan></text><text x="719" y="370.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="719" dy="0">varias unidades, reordenamiento y predicción de saltos.</tspan></text></svg>
