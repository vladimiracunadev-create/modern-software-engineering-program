<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El costo de pedir durabilidad: 200 escrituras de 100 bytes</title><desc id="d">Barras en escala logarítmica con una medición real: con búfer 1,86 milisegundos, con flush en cada escritura 1,26, y con fsync en cada escritura 218 milisegundos, unos 1 090 microsegundos por escritura.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="430" fill="#ffffff"/><text x="20" y="30" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Tiempo total para 200 escrituras (escala logarítmica)</tspan></text><text x="250" y="84" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Con búfer (fsync al final)</tspan></text><rect x="260" y="62" width="59.6464" height="34" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="327.646" y="85" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="327.646" dy="0">1,86 ms (≈ 9,3 µs por escritura)</tspan></text><text x="250" y="172" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">flush() tras cada escritura</tspan></text><rect x="260" y="150" width="41.0408" height="34" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="309.041" y="173" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="309.041" dy="0">1,26 ms (≈ 6,3 µs por escritura)</tspan></text><text x="250" y="260" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">fsync() tras cada escritura</tspan></text><rect x="260" y="238" width="287.285" height="34" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="555.285" y="261" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="555.285" dy="0">218,25 ms (≈ 1091,3 µs por escritura)</tspan></text><rect x="20" y="330" width="860" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="365.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">fsync pide al sistema que persista los datos en el dispositivo: cuesta del orden de cien veces más que entregarlos</tspan></text><text x="450" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">al sistema. Por eso se agrupa: se decide qué fallo se tolera y cuántas escrituras se pueden perder.</tspan></text><text x="450" y="424" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Mediana de 5 repeticiones en un SSD, CPython 3.12.9 en Windows; flush y búfer quedan dentro del ruido.</tspan></text></svg>
