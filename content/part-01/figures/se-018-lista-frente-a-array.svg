<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una misma colección de un millón de enteros, tres representaciones</title><desc id="d">Barras horizontales con la memoria medida por tracemalloc: una lista de Python con un millón de enteros usa unos 40 megabytes, un array de enteros de 64 bits usa unos 8,2 y un bytearray de un millón de bytes usa 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="400" fill="#ffffff"/><text x="20" y="30" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Memoria asignada por la estructura (megabytes, medida con tracemalloc)</tspan></text><text x="220" y="84" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">list de int (un millón)</tspan></text><rect x="230" y="62" width="479.88" height="34" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="717.88" y="85" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="717.88" dy="0">40.0 MB</tspan></text><text x="230" y="118" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="230" dy="0">8 bytes de puntero + objeto int de 28 bytes por elemento</tspan></text><text x="220" y="180" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">array(&#x27;q&#x27;) (un millón)</tspan></text><rect x="230" y="158" width="98.16" height="34" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="336.16" y="181" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="336.16" dy="0">8.2 MB</tspan></text><text x="230" y="214" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="230" dy="0">8 bytes por elemento, contiguos</tspan></text><text x="220" y="276" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">bytearray (un millón)</tspan></text><rect x="230" y="254" width="12" height="34" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="250" y="277" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="250" dy="0">1.0 MB</tspan></text><text x="230" y="310" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="230" dy="0">1 byte por elemento, contiguos</tspan></text><rect x="20" y="350" width="860" height="40" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="450" y="365.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">La representación decide el conjunto de trabajo: lo que no cabe en un nivel de la jerarquía se paga en el</tspan></text><text x="450" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">siguiente.</tspan></text></svg>
