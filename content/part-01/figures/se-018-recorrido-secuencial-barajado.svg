<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Recorrer una lista en orden o barajado: tiempo por acceso según el tamaño</title><desc id="d">Gráfico de líneas con una medición real en CPython 3.12.9: el tiempo por acceso en orden secuencial se mantiene cerca de 40 a 45 nanosegundos, mientras en orden barajado sube de 46 a 310 nanosegundos al crecer la lista de mil a cuatro millones de elementos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><line x1="90" y1="340" x2="620" y2="340" stroke="#32505f" stroke-width="1.8"/><line x1="90" y1="60" x2="90" y2="340" stroke="#32505f" stroke-width="1.8"/><text x="80" y="66" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="80" dy="0">ns por acceso</tspan></text><polyline points="140,308.327 260,306.042 380,304.861 500,304.861 620,304.467" fill="none" stroke="#087f8c" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="140,303.679 260,286.818 380,167.927 500,121.285 620,96.0727" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><circle cx="140" cy="308.327" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="140" y="313.327" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="140" dy="0"></tspan></text><rect x="132" y="295.679" width="16" height="16" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="140" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">1 024</tspan></text><text x="140" y="334.327" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140" dy="0">40.2</tspan></text><text x="140" y="287.679" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140" dy="0">46.1</tspan></text><circle cx="260" cy="306.042" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="260" y="311.042" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="260" dy="0"></tspan></text><rect x="252" y="278.818" width="16" height="16" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="260" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="260" dy="0">16 384</tspan></text><text x="260" y="332.042" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="260" dy="0">43.1</tspan></text><text x="260" y="270.818" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="260" dy="0">67.5</tspan></text><circle cx="380" cy="304.861" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="380" y="309.861" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="380" dy="0"></tspan></text><rect x="372" y="159.927" width="16" height="16" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="380" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380" dy="0">262 144</tspan></text><text x="380" y="330.861" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="380" dy="0">44.6</tspan></text><text x="380" y="151.927" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="380" dy="0">218.4</tspan></text><circle cx="500" cy="304.861" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="309.861" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="500" dy="0"></tspan></text><rect x="492" y="113.285" width="16" height="16" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="500" dy="0">1 048 576</tspan></text><text x="500" y="330.861" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="500" dy="0">44.6</tspan></text><text x="500" y="105.285" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="500" dy="0">277.6</tspan></text><circle cx="620" cy="304.467" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="620" y="309.467" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="620" dy="0"></tspan></text><rect x="612" y="88.0727" width="16" height="16" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="620" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="620" dy="0">4 194 304</tspan></text><text x="620" y="330.467" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="620" dy="0">45.1</tspan></text><text x="620" y="80.0727" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="620" dy="0">309.6</tspan></text><text x="360" y="384" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360" dy="0">elementos de la lista</tspan></text><rect x="650" y="60" width="270" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="785" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785" dy="0">Círculos y línea continua: orden</tspan></text><text x="785" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785" dy="0">secuencial.</tspan></text><rect x="650" y="124" width="270" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="147.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Cuadrados y línea discontinua:</tspan></text><text x="785" y="163.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">orden barajado.</tspan></text><rect x="650" y="188" width="270" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="785" y="225.04" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">Con 4 194 304 elementos el</tspan></text><text x="785" y="241.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">barajado es unas 6,9 veces más</tspan></text><text x="785" y="258.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">lento por acceso, aunque hace la</tspan></text><text x="785" y="274.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">misma suma. Es compatible con</tspan></text><text x="785" y="291.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">efectos de localidad; el script no</tspan></text><text x="785" y="308.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">mide las cachés.</tspan></text><text x="470" y="440" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Mediana de 5 repeticiones, semilla 7, CPython 3.12.9 en Windows. La sobrecarga del intérprete diluye el efecto en tamaños pequeños.</tspan></text></svg>
