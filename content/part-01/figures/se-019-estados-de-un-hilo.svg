<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estados de un hilo y las transiciones que los provocan</title><desc id="d">Diagrama de estados: nuevo pasa a listo; listo y ejecutando se alternan por asignación de CPU y expropiación; ejecutando pasa a bloqueado al esperar un evento y vuelve a listo cuando ocurre; ejecutando termina.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="20" y="150" width="120" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="80" y="181.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="80" dy="0">Nuevo</tspan></text><rect x="230" y="150" width="130" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="295" y="181.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="295" dy="0">Listo</tspan></text><rect x="470" y="150" width="150" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="545" y="181.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="545" dy="0">Ejecutando</tspan></text><rect x="470" y="320" width="150" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="545" y="351.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="545" dy="0">Bloqueado</tspan></text><rect x="760" y="150" width="140" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="830" y="181.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="830" dy="0">Terminado</tspan></text><polyline points="140,178 230,178" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="185" y="168" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="185" dy="0">se crea</tspan></text><polyline points="360,166 470,166" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="415" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="415" dy="0">el planificador asigna CPU</tspan></text><polyline points="470,196 360,196" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="415" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="415" dy="0">cuota agotada: expropiación</tspan></text><polyline points="620,178 760,178" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="168" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">termina o falla</tspan></text><polyline points="545,206 545,320" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="266" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="560" dy="0">espera I/O, bloqueo o sleep</tspan></text><polyline points="470,348 295,348 295,206" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="380" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380" dy="0">ocurre el evento</tspan></text><rect x="20" y="262" width="250" height="150" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="145" y="299.04" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="145" dy="0">Un hilo bloqueado no consume</tspan></text><text x="145" y="315.68" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="145" dy="0">CPU: el reloj de pared corre,</tspan></text><text x="145" y="332.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="145" dy="0">el de CPU no. Un hilo listo sí</tspan></text><text x="145" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="145" dy="0">quiere CPU y espera turno; esa</tspan></text><text x="145" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="145" dy="0">espera también cuenta como</tspan></text><text x="145" y="382.24" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="145" dy="0">tiempo de pared.</tspan></text><rect x="680" y="262" width="240" height="136" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="800" y="308.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="800" dy="0">Un cambio de contexto guarda</tspan></text><text x="800" y="325.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="800" dy="0">el estado de un hilo y carga</tspan></text><text x="800" y="341.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="800" dy="0">el de otro. Tiene costo y</tspan></text><text x="800" y="358.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="800" dy="0">desordena las cachés.</tspan></text></svg>
