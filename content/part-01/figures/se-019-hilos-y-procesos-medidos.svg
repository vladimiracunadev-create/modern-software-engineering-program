<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hilos y procesos medidos en CPython 3.12: la carga decide</title><desc id="d">Tres grupos de barras con una medición real: en tareas de espera cuatro hilos reducen 1,0 s a 0,25 s; en cálculo largo, dos hilos casi no ayudan (4,57 a 4,10 s) y dos procesos lo reducen a 2,88 s; en cálculo corto los procesos pierden por su costo de arranque.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="20" y="36" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">4 tareas de espera (0,25 s cada una)</tspan></text><text x="190" y="66" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="190" dy="0">secuencial</tspan></text><rect x="200" y="48" width="90.09" height="26" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="298.09" y="67" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="298.09" dy="0">1.001 s</tspan></text><text x="190" y="98" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="190" dy="0">4 hilos</tspan></text><rect x="200" y="80" width="22.68" height="26" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230.68" y="99" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="230.68" dy="0">0.252 s</tspan></text><text x="20" y="150" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">2 tareas de cálculo corto (≈ 0,2 s)</tspan></text><text x="190" y="180" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="190" dy="0">secuencial</tspan></text><rect x="200" y="162" width="37.8" height="26" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="245.8" y="181" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="245.8" dy="0">0.42 s</tspan></text><text x="190" y="212" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="190" dy="0">2 hilos</tspan></text><rect x="200" y="194" width="38.7" height="26" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="246.7" y="213" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="246.7" dy="0">0.43 s</tspan></text><text x="190" y="244" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="190" dy="0">2 procesos</tspan></text><rect x="200" y="226" width="48.06" height="26" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="256.06" y="245" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="256.06" dy="0">0.534 s</tspan></text><text x="20" y="296" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">2 tareas de cálculo largo (≈ 2,3 s)</tspan></text><text x="190" y="326" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="190" dy="0">secuencial</tspan></text><rect x="200" y="308" width="410.94" height="26" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="618.94" y="327" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="618.94" dy="0">4.566 s</tspan></text><text x="190" y="358" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="190" dy="0">2 hilos</tspan></text><rect x="200" y="340" width="369.09" height="26" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="577.09" y="359" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="577.09" dy="0">4.101 s</tspan></text><text x="190" y="390" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="190" dy="0">2 procesos</tspan></text><rect x="200" y="372" width="259.2" height="26" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="467.2" y="391" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="467.2" dy="0">2.88 s</tspan></text><rect x="700" y="40" width="240" height="190" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="820" y="97.04" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">Los hilos de CPython 3.12</tspan></text><text x="820" y="113.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">comparten un bloqueo global</tspan></text><text x="820" y="130.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">del intérprete: el cálculo en</tspan></text><text x="820" y="146.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">bytecode no se ejecuta en</tspan></text><text x="820" y="163.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">paralelo, pero la espera sí se</tspan></text><text x="820" y="180.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">solapa.</tspan></text><rect x="700" y="246" width="240" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="820" y="291.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="820" dy="0">Un proceso nuevo cuesta unos</tspan></text><text x="820" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="820" dy="0">240 ms al arrancar en Windows</tspan></text><text x="820" y="324.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="820" dy="0">(medido); un hilo, unos 175</tspan></text><text x="820" y="341.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="820" dy="0">µs. El trabajo debe</tspan></text><text x="820" y="357.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="820" dy="0">compensarlo.</tspan></text><text x="480" y="452" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Mediana de 2 a 3 repeticiones, 8 CPU lógicas, CPython 3.12.9 en Windows. Los valores cambian con el equipo y la versión.</tspan></text></svg>
