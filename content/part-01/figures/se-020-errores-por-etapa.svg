<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">En qué etapa aparece cada tipo de error</title><desc id="d">Tres etapas: analizar y compilar, cargar y enlazar, ejecutar. Un error de sintaxis aparece antes de ejecutar nada aunque esté en una rama inalcanzable; un módulo inexistente falla al importarlo; un nombre indefinido falla al ejecutar la línea, no al definir la función.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="20" y="30" width="296" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="168" y="56.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="168" dy="0">Analizar y compilar</tspan></text><rect x="20" y="86" width="296" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="168" y="115.2" font-size="15" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="168" dy="0">SyntaxError</tspan></text><rect x="20" y="144" width="296" height="130" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="168" y="196" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="168" dy="0">compile() de un archivo con «x = = 1»</tspan></text><text x="168" y="212.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="168" dy="0">dentro de if False falla antes de</tspan></text><text x="168" y="229.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="168" dy="0">ejecutar nada.</tspan></text><polyline points="316,53 328,53" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="328" y="30" width="296" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="476" y="56.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="476" dy="0">Cargar y enlazar</tspan></text><rect x="328" y="86" width="296" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="476" y="115.2" font-size="15" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="476" dy="0">ModuleNotFoundError</tspan></text><rect x="328" y="144" width="296" height="130" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="476" y="196" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="476" dy="0">El nombre se resuelve al importar. Un</tspan></text><text x="476" y="212.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="476" dy="0">.pyc de otra versión se descarta y se</tspan></text><text x="476" y="229.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="476" dy="0">regenera.</tspan></text><polyline points="624,53 636,53" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="636" y="30" width="296" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="784" y="56.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784" dy="0">Ejecutar</tspan></text><rect x="636" y="86" width="296" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="784" y="115.2" font-size="15" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="784" dy="0">NameError</tspan></text><rect x="636" y="144" width="296" height="130" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="196" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">def f(): return nombre_inexistente</tspan></text><text x="784" y="212.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">compila sin error; falla solo cuando</tspan></text><text x="784" y="229.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">se llama a f().</tspan></text><rect x="20" y="296" width="920" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="319.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">La etapa del error indica dónde buscar: sintaxis y estructura, resolución de dependencias y versiones, o datos y estado en</tspan></text><text x="480" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">ejecución.</tspan></text><rect x="20" y="362" width="920" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="385.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Un error que «no aparece» en las pruebas puede estar en una rama no ejecutada: compilar el archivo no valida lo que no se</tspan></text><text x="480" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">corre.</tspan></text></svg>
