<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Conteo de referencias y un ciclo que solo recupera el recolector de ciclos</title><desc id="d">Tres paneles. A: dos objetos que se referencian mutuamente tienen conteo 2 cada uno (un nombre y el otro objeto). B: al borrar los nombres cada conteo baja a 1 pero ya nadie alcanza el ciclo. C: gc.collect() detecta los dos objetos inalcanzables y los libera.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="160" y="28" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160" dy="0">A · Con nombres</tspan></text><rect x="40" y="120" width="100" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="90" y="143.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="90" dy="0">objeto A</tspan></text><text x="90" y="159.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="90" dy="0">conteo = 2</tspan></text><rect x="190" y="120" width="100" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="143.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="240" dy="0">objeto B</tspan></text><text x="240" y="159.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="240" dy="0">conteo = 2</tspan></text><polyline points="140,138 190,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="190,160 140,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="50" width="100" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="90" y="70.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="90" dy="0">nombre a</tspan></text><rect x="190" y="50" width="100" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="70.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">nombre b</tspan></text><polyline points="90,84 90,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="240,84 240,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="200" width="290" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="165" y="243.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">Cada objeto es alcanzable desde un</tspan></text><text x="165" y="259.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">nombre y desde el otro objeto.</tspan></text><text x="470" y="28" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">B · Tras del a, b</tspan></text><rect x="350" y="120" width="100" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="400" y="143.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="400" dy="0">objeto A</tspan></text><text x="400" y="159.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="400" dy="0">conteo = 1</tspan></text><rect x="500" y="120" width="100" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="550" y="143.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="550" dy="0">objeto B</tspan></text><text x="550" y="159.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="550" dy="0">conteo = 1</tspan></text><polyline points="450,138 500,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="500,160 450,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="475" y="76" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">sin nombres que apunten al ciclo</tspan></text><rect x="330" y="200" width="290" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="475" y="226.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">Los conteos no llegan a cero, pero el</tspan></text><text x="475" y="243.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">ciclo ya no es alcanzable desde</tspan></text><text x="475" y="259.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">ninguna raíz: es memoria perdida para</tspan></text><text x="475" y="276.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">el programa.</tspan></text><text x="780" y="28" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="780" dy="0">C · Tras gc.collect()</tspan></text><rect x="660" y="120" width="250" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="785" y="151.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="785" dy="0">memoria liberada</tspan></text><rect x="640" y="200" width="290" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">En una ejecución de ejemplo</tspan></text><text x="785" y="251.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">gc.collect() devolvió 2: los dos</tspan></text><text x="785" y="268.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">objetos del ciclo.</tspan></text><rect x="20" y="320" width="920" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="343.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">El conteo de referencias libera al instante cuando llega a cero; no basta para ciclos. CPython añade un recolector</tspan></text><text x="480" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">generacional que se activa por umbrales (en 3.12, (700, 10, 10)).</tspan></text><rect x="20" y="386" width="920" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="409.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El recolector prueba inalcanzabilidad, no «utilidad»: una referencia olvidada conserva un objeto legítimamente, y eso no es</tspan></text><text x="480" y="425.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">un fallo del recolector.</tspan></text></svg>
