<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Marcos de la pila y objetos del heap: vidas distintas</title><desc id="d">Pila con tres marcos (principal, resumir, analizar) cuyas variables apuntan a objetos del heap. Al retornar analizar su marco desaparece, pero el diccionario que creó sigue vivo porque una lista global lo referencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><text x="20" y="26" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Pila de llamadas (vida = la de la llamada)</tspan></text><rect x="20" y="60" width="300" height="72" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="34" y="86" font-size="13" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="34" dy="0">marco: analizar(linea)</tspan></text><text x="34" y="110" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="34" dy="0">linea · evento</tspan></text><rect x="20" y="142" width="300" height="72" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="34" y="168" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="34" dy="0">marco: resumir(valores)</tspan></text><text x="34" y="192" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="34" dy="0">valores · total</tspan></text><rect x="20" y="224" width="300" height="72" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="34" y="250" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="34" dy="0">marco: principal()</tspan></text><text x="34" y="274" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="34" dy="0">eventos_global</tspan></text><text x="520" y="26" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="520" dy="0">Heap (vida = mientras sea alcanzable)</tspan></text><rect x="520" y="60" width="180" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="610" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="610" dy="0">dict evento #1</tspan></text><rect x="520" y="142" width="180" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="610" y="173.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="610" dy="0">dict evento #2</tspan></text><rect x="760" y="224" width="160" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="840" y="255.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="840" dy="0">list eventos_global</tspan></text><polyline points="320,96 520,90" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="420" y="84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="420" dy="0">evento</tspan></text><polyline points="760,252 700,180" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="760,244 700,100" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="320,262 760,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="540" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="540" dy="0">referencia global</tspan></text><rect x="20" y="320" width="440" height="110" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="240" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="240" dy="0">Cuando analizar() retorna, su marco desaparece y el</tspan></text><text x="240" y="378.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="240" dy="0">nombre «evento» deja de existir. El objeto, en cambio,</tspan></text><text x="240" y="395.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="240" dy="0">vive en el heap: sigue alcanzable desde la lista global.</tspan></text><rect x="480" y="320" width="440" height="110" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="353.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">La memoria crece por referencias que se conservan, no por</tspan></text><text x="700" y="370.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">un fallo del recolector. Para liberar, se elimina la</tspan></text><text x="700" y="386.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">referencia (o se procesa en flujo); forzar gc.collect()</tspan></text><text x="700" y="403.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">no cambia la alcanzabilidad.</tspan></text></svg>
