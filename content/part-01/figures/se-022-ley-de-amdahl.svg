<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Límite de acelerar una fracción del trabajo (ley de Amdahl)</title><desc id="d">Gráfico de líneas: si una fracción p del tiempo se acelera por un factor s, el beneficio total es 1 sobre (1 menos p más p dividido s). Con s infinito el máximo para p = 0,2 es 1,25; para p = 0,9 es 10. Con s = 10 los valores son 1,22 y 5,26.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><line x1="90" y1="330" x2="570" y2="330" stroke="#32505f" stroke-width="1.8"/><line x1="90" y1="70" x2="90" y2="330" stroke="#32505f" stroke-width="1.8"/><text x="98" y="62" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="98" dy="0">aceleración total</tspan></text><polyline points="130,300 215,290 300,270 385,210 470,90 555,90" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><polyline points="130,300.732 215,292.5 300,277.826 385,244.286 470,203.684 555,164.483" fill="none" stroke="#087f8c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="130" y="350" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="130" dy="0">0.2</tspan></text><text x="130" y="320.732" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="130" dy="0">1,22</tspan></text><text x="130" y="290" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="130" dy="0">1,25</tspan></text><text x="215" y="350" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="215" dy="0">0.4</tspan></text><text x="215" y="312.5" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="215" dy="0">1,56</tspan></text><text x="215" y="280" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="215" dy="0">1,67</tspan></text><text x="300" y="350" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300" dy="0">0.6</tspan></text><text x="300" y="297.826" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="300" dy="0">2,17</tspan></text><text x="300" y="260" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="300" dy="0">2,50</tspan></text><text x="385" y="350" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="385" dy="0">0.8</tspan></text><text x="385" y="264.286" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="385" dy="0">3,57</tspan></text><text x="385" y="200" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="385" dy="0">5,00</tspan></text><text x="470" y="350" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">0.9</tspan></text><text x="470" y="223.684" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">5,26</tspan></text><text x="470" y="80" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">10</tspan></text><text x="555" y="350" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="555" dy="0">0.95</tspan></text><text x="555" y="184.483" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="555" dy="0">6,90</tspan></text><text x="555" y="80" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="555" dy="0">20</tspan></text><text x="330" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="330" dy="0">fracción p del tiempo que se acelera</tspan></text><text x="559" y="66" font-size="11" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="559" dy="0">20 (recortado)</tspan></text><rect x="600" y="70" width="320" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="760" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">Línea continua roja: s infinito (se</tspan></text><text x="760" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">elimina esa parte).</tspan></text><rect x="600" y="152" width="320" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="760" y="182.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="760" dy="0">Línea discontinua azul: s = 10 (esa parte</tspan></text><text x="760" y="198.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="760" dy="0">diez veces más rápida).</tspan></text><rect x="600" y="234" width="320" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="760" y="277.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="760" dy="0">Acelerar una fracción del 20 % nunca da</tspan></text><text x="760" y="294.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="760" dy="0">más de 1,25 veces, aunque se elimine.</tspan></text><text x="760" y="310.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="760" dy="0">Primero se perfila para saber dónde está</tspan></text><text x="760" y="327.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="760" dy="0">el tiempo.</tspan></text><text x="470" y="440" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo directo de la fórmula; no es una medición. El gráfico recorta el eje en 10.</tspan></text></svg>
