<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Protocolo de reproducción con limpieza segura</title><desc id="d">Seis pasos: preparar, ejecutar, capturar, verificar invariantes, limpiar con vista previa y revisión cruzada que reproduce tres hallazgos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="14" y="24" width="146" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="87" y="49.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="87" dy="0">1 Preparar</tspan></text><rect x="14" y="74" width="146" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="87" y="109.32" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="87" dy="0">Directorio</tspan></text><text x="87" y="124.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="87" dy="0">work/SE-023,</tspan></text><text x="87" y="140.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="87" dy="0">versiones y</tspan></text><text x="87" y="155.4" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="87" dy="0">entrada fija</tspan></text><polyline points="160,46 170,46" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="170" y="24" width="146" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="243" y="49.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="243" dy="0">2 Ejecutar</tspan></text><rect x="170" y="74" width="146" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="243" y="117" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="243" dy="0">Un comando</tspan></text><text x="243" y="132.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="243" dy="0">documentado, sin</tspan></text><text x="243" y="147.72" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="243" dy="0">privilegios</tspan></text><polyline points="316,46 326,46" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="326" y="24" width="146" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="399" y="49.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="399" dy="0">3 Capturar</tspan></text><rect x="326" y="74" width="146" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="399" y="124.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="399" dy="0">Salida, tiempos y</tspan></text><text x="399" y="140.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="399" dy="0">pico en archivos</tspan></text><polyline points="472,46 482,46" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="482" y="24" width="146" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="555" y="49.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="555" dy="0">4 Verificar</tspan></text><rect x="482" y="74" width="146" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="555" y="117" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="555" dy="0">Hash de salida</tspan></text><text x="555" y="132.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="555" dy="0">igual antes de</tspan></text><text x="555" y="147.72" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="555" dy="0">comparar recursos</tspan></text><polyline points="628,46 638,46" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="638" y="24" width="146" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="711" y="49.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="711" dy="0">5 Limpiar</tspan></text><rect x="638" y="74" width="146" height="110" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="711" y="117" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="711" dy="0">dry-run y luego</tspan></text><text x="711" y="132.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="711" dy="0">borrar solo dentro</tspan></text><text x="711" y="147.72" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="711" dy="0">del directorio</tspan></text><polyline points="784,46 794,46" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="794" y="24" width="146" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="49.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">6 Revisar</tspan></text><rect x="794" y="74" width="146" height="110" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="117" font-size="12" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="867" dy="0">Otra persona</tspan></text><text x="867" y="132.36" font-size="12" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="867" dy="0">reproduce tres</tspan></text><text x="867" y="147.72" font-size="12" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="867" dy="0">hallazgos</tspan></text><rect x="14" y="210" width="930" height="130" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="479" y="262" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="479" dy="0">Guarda de limpieza: resolver la ruta y comprobar que está dentro de work/SE-023 antes de borrar, por ejemplo «destino =</tspan></text><text x="479" y="278.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="479" dy="0">Path(ruta).resolve(); if not destino.is_relative_to(base.resolve()): abortar». Una limpieza que acepta rutas amplias puede</tspan></text><text x="479" y="295.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="479" dy="0">borrar mucho más de lo previsto.</tspan></text><rect x="14" y="356" width="930" height="94" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="479" y="398.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">Reproducible significa que otra persona obtiene el mismo hash y una tendencia equivalente siguiendo solo el README; si</tspan></text><text x="479" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">necesita preguntar, falta información (versión, tamaño, semilla o comando).</tspan></text></svg>
