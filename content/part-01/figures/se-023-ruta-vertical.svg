<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ruta vertical de un evento sintético con los valores de una ejecución real</title><desc id="d">Seis capas con el instrumento, el valor observado en una ejecución de ejemplo y lo que ese valor no demuestra: texto y bytes, entrada canónica, traducción, ejecución, memoria y sistema.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><rect x="10" y="10" width="155" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="87.5" y="32.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="87.5" dy="0">Capa</tspan></text><rect x="170" y="10" width="155" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247.5" y="32.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247.5" dy="0">Instrumento</tspan></text><rect x="330" y="10" width="355" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507.5" y="32.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507.5" dy="0">Observado (ejecución de ejemplo)</tspan></text><rect x="690" y="10" width="255" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817.5" y="32.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817.5" dy="0">No demuestra</tspan></text><rect x="10" y="56" width="155" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="87.5" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="87.5" dy="0">Texto y bytes</tspan></text><rect x="170" y="56" width="155" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247.5" y="81.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247.5" dy="0">len, encode,</tspan></text><text x="247.5" y="97.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247.5" dy="0">unicodedata</tspan></text><rect x="330" y="56" width="355" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507.5" y="81.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507.5" dy="0">16 puntos de código; 20 bytes UTF-8; ya está en</tspan></text><text x="507.5" y="97.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507.5" dy="0">forma NFC</tspan></text><rect x="690" y="56" width="255" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817.5" y="81.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817.5" dy="0">Cómo lo ve una persona en otra</tspan></text><text x="817.5" y="97.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817.5" dy="0">fuente o idioma</tspan></text><rect x="10" y="124" width="155" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="87.5" y="157.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="87.5" dy="0">Entrada canónica</tspan></text><rect x="170" y="124" width="155" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247.5" y="157.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247.5" dy="0">json, hashlib</tspan></text><rect x="330" y="124" width="355" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507.5" y="157.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507.5" dy="0">SHA-256 (16 primeros hex): 7e24a88c96bab208</tspan></text><rect x="690" y="124" width="255" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817.5" y="149.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817.5" dy="0">Que otra serialización dé el mismo</tspan></text><text x="817.5" y="165.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817.5" dy="0">hash</tspan></text><rect x="10" y="192" width="155" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="87.5" y="225.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="87.5" dy="0">Traducción</tspan></text><rect x="170" y="192" width="155" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247.5" y="225.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247.5" dy="0">ast, dis</tspan></text><rect x="330" y="192" width="355" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507.5" y="217.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507.5" dy="0">AST de resumir: 21 nodos; bytecode: 15</tspan></text><text x="507.5" y="233.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507.5" dy="0">instrucciones (CPython 3.12.9)</tspan></text><rect x="690" y="192" width="255" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817.5" y="217.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817.5" dy="0">Cuántas instrucciones nativas se</tspan></text><text x="817.5" y="233.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817.5" dy="0">ejecutan</tspan></text><rect x="10" y="260" width="155" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="87.5" y="293.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="87.5" dy="0">Ejecución</tspan></text><rect x="170" y="260" width="155" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247.5" y="293.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247.5" dy="0">time</tspan></text><rect x="330" y="260" width="355" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507.5" y="285.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507.5" dy="0">100 000 vueltas, resultado 4 999 950 000; pared</tspan></text><text x="507.5" y="301.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507.5" dy="0">0,086 s, CPU 0,094 s</tspan></text><rect x="690" y="260" width="255" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817.5" y="285.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817.5" dy="0">Dónde se va el tiempo con</tspan></text><text x="817.5" y="301.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817.5" dy="0">precisión</tspan></text><rect x="10" y="328" width="155" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="87.5" y="361.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="87.5" dy="0">Memoria</tspan></text><rect x="170" y="328" width="155" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247.5" y="361.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247.5" dy="0">tracemalloc</tspan></text><rect x="330" y="328" width="355" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507.5" y="361.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507.5" dy="0">Pico de 216 bytes en Python</tspan></text><rect x="690" y="328" width="255" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817.5" y="353.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817.5" dy="0">Memoria nativa ni consumo total</tspan></text><text x="817.5" y="369.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817.5" dy="0">del proceso</tspan></text><rect x="10" y="396" width="155" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="87.5" y="429.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="87.5" dy="0">Sistema</tspan></text><rect x="170" y="396" width="155" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247.5" y="429.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247.5" dy="0">platform</tspan></text><rect x="330" y="396" width="355" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507.5" y="429.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507.5" dy="0">Etiqueta AMD64</tspan></text><rect x="690" y="396" width="255" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817.5" y="429.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817.5" dy="0">Modelo de CPU, cachés o frecuencia</tspan></text><text x="480" y="480" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Una captura sin pregunta es una colección; la ruta convierte cada valor en evidencia de una transición y de su límite.</tspan></text></svg>
