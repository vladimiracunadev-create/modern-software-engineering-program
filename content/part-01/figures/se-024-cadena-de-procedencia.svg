<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cadena de procedencia del informe</title><desc id="d">Del código y los datos crudos a la tabla derivada, el informe, la revisión y el commit identificable. La tabla se genera desde los datos crudos y no a mano.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="14" y="24" width="176" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="49.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Código y pruebas</tspan></text><rect x="14" y="74" width="176" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="102" y="119.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="102" dy="0">src/ y tests/ de</tspan></text><text x="102" y="135.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="102" dy="0">equivalencia</tspan></text><polyline points="190,46 202,46" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="202" y="24" width="176" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="290" y="49.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290" dy="0">Datos crudos</tspan></text><rect x="202" y="74" width="176" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="290" y="119.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="290" dy="0">data/raw.csv: una fila</tspan></text><text x="290" y="135.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="290" dy="0">por repetición</tspan></text><polyline points="378,46 390,46" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="390" y="24" width="176" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="478" y="49.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="478" dy="0">Tabla derivada</tspan></text><rect x="390" y="74" width="176" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="478" y="119.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="478" dy="0">Generada por script</tspan></text><text x="478" y="135.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="478" dy="0">desde raw.csv</tspan></text><polyline points="566,46 578,46" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="578" y="24" width="176" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="666" y="49.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="666" dy="0">Informe</tspan></text><rect x="578" y="74" width="176" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="666" y="119.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="666" dy="0">Método, resultados,</tspan></text><text x="666" y="135.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="666" dy="0">discusión y límites</tspan></text><polyline points="754,46 766,46" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="766" y="24" width="176" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="854" y="49.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="854" dy="0">Revisión</tspan></text><rect x="766" y="74" width="176" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="854" y="112" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="854" dy="0">Otra persona reproduce</tspan></text><text x="854" y="127.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="854" dy="0">y objeta; se conserva</tspan></text><text x="854" y="142.72" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="854" dy="0">el desacuerdo</tspan></text><rect x="14" y="200" width="930" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="479" y="240.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">Registro de procedencia: commit, versión de Python, plataforma expuesta, entrada y semilla, comandos, orden, repeticiones,</tspan></text><text x="479" y="256.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">salida y limpieza. Los datos crudos se conservan; los resúmenes se derivan.</tspan></text><rect x="14" y="306" width="930" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="479" y="337.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="479" dy="0">Discusión en tres frases: observamos X; bajo estos supuestos inferimos Y; no medimos Z.</tspan></text><rect x="14" y="372" width="930" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="479" y="395.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479" dy="0">Un resultado inconcluso es válido si el método permite comprender por qué. Aprobar no es coincidir: es poder inspeccionar la</tspan></text><text x="479" y="411.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479" dy="0">cadena.</tspan></text></svg>
