<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De una pregunta vaga a una pregunta contrastable</title><desc id="d">Cinco pasos que añaden carga, métrica, umbral y entorno a la pregunta «qué es más rápido»: la pregunta final fija qué se mide, con qué datos, con qué decisión y en qué runtime.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><rect x="20" y="20" width="260" height="58" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="52.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">«¿Qué es más rápido?»</tspan></text><rect x="290" y="20" width="630" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="605" y="52.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="605" dy="0">No dice qué carga, qué métrica ni para qué decisión</tspan></text><polyline points="150,78 150,90" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="90" width="260" height="58" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">+ Carga</tspan></text><rect x="290" y="90" width="630" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="605" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="605" dy="0">Archivos UTF-8 de 10 000 a 400 000 líneas, semilla fija</tspan></text><polyline points="150,148 150,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="160" width="260" height="58" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="192.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">+ Métricas</tspan></text><rect x="290" y="160" width="630" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="605" y="192.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="605" dy="0">Pico de memoria de Python y latencia de pared (mediana y rango)</tspan></text><polyline points="150,218 150,230" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="230" width="260" height="58" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="262.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">+ Umbral y decisión</tspan></text><rect x="290" y="230" width="630" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="605" y="262.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="605" dy="0">La latencia no debe subir más de un 10 %; si cumple, se adopta flujo</tspan></text><polyline points="150,288 150,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="300" width="260" height="58" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="332.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">+ Entorno</tspan></text><rect x="290" y="300" width="630" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="605" y="332.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="605" dy="0">CPython 3.12.9 en este equipo; sin afirmar nada sobre otros</tspan></text><rect x="20" y="382" width="900" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="415.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="470" dy="0">Pregunta final: para archivos UTF-8 de 10 000 a 400 000 líneas, ¿procesar en flujo reduce el pico de memoria de Python</tspan></text><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="470" dy="0">sin aumentar más de un 10 % la latencia de pared en CPython 3.12.9? El umbral se justifica por el contexto de uso.</tspan></text></svg>
