<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos sistemas, mismo programa: lo que informa cada uno</title><desc id="d">Tabla con valores reales observados con el mismo script de Python en Windows 11 y en Ubuntu 24.04 bajo WSL2: sistema, versión, arquitectura, separadores, fin de línea, nombre del sistema de módulos y proceso de inicio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="520" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Dato</tspan></text><rect x="270" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Windows 11 (CPython 3.12.9)</tspan></text><rect x="610" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Linux en WSL2 (CPython 3.12.3)</tspan></text><rect x="10" y="56" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">platform.system()</tspan></text><rect x="270" y="56" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">Windows</tspan></text><rect x="610" y="56" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Linux</tspan></text><rect x="10" y="112" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Versión informada</tspan></text><rect x="270" y="112" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">release 11; 10.0.26300</tspan></text><rect x="610" y="112" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">kernel 6.18.58.1-microsoft-standard-WSL2</tspan></text><rect x="10" y="168" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">platform.machine()</tspan></text><rect x="270" y="168" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">AMD64</tspan></text><rect x="610" y="168" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">x86_64</tspan></text><rect x="10" y="224" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Separador de rutas / de PATH</tspan></text><rect x="270" y="224" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">«\» y «;»</tspan></text><rect x="610" y="224" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">«/» y «:»</tspan></text><rect x="10" y="280" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="308.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Fin de línea (os.linesep)</tspan></text><rect x="270" y="280" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">\r\n</tspan></text><rect x="610" y="280" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">\n</tspan></text><rect x="10" y="336" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="364.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">os.name</tspan></text><rect x="270" y="336" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="364.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">nt</tspan></text><rect x="610" y="336" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="364.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">posix</tspan></text><rect x="10" y="392" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="420.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Proceso 1 / virtualización</tspan></text><rect x="270" y="392" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="420.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">No aplicable</tspan></text><rect x="610" y="392" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="420.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">systemd; systemd-detect-virt = wsl</tspan></text><rect x="10" y="458" width="940" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="477.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Mismo hardware, distinta plataforma efectiva: «AMD64» y «x86_64» nombran la misma ISA, y «Linux» aquí corre dentro de una</tspan></text><text x="480" y="493.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">máquina virtual ligera.</tspan></text></svg>
