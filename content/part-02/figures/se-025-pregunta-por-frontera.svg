<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" width="960" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una pregunta diagnóstica por frontera</title><desc id="d">Cinco capas apiladas de la aplicación al hardware. De cada capa sale una pregunta que permite ubicar un fallo y una evidencia que la discrimina.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="472" fill="#ffffff"/><text x="115" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="115" dy="0">Capa (de arriba abajo)</tspan></text><text x="401" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="401" dy="0">Pregunta que ubica el fallo</tspan></text><text x="766" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="766" dy="0">Evidencia que la discrimina</tspan></text><rect x="10" y="38" width="210" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="69.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">Aplicación</tspan></text><rect x="256" y="38" width="290" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="401" y="69.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="401" dy="0">¿Construyó bien la petición?</tspan></text><rect x="582" y="38" width="368" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="766" y="61.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="766" dy="0">Argumentos, excepción y traza del propio</tspan></text><text x="766" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="766" dy="0">programa</tspan></text><polyline points="220,66 256,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="546,66 582,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="115,94 115,112" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="112" width="210" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">Biblioteca o runtime</tspan></text><rect x="256" y="112" width="290" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="401" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="401" dy="0">¿Existe la función en esta versión?</tspan></text><rect x="582" y="112" width="368" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="766" y="135.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="766" dy="0">Versión del runtime; ImportError o</tspan></text><text x="766" y="151.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="766" dy="0">AttributeError</tspan></text><polyline points="220,140 256,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="546,140 582,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="115,168 115,186" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="186" width="210" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">API del sistema</tspan></text><rect x="256" y="186" width="290" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="401" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="401" dy="0">¿Existe en esta plataforma?</tspan></text><rect x="582" y="186" width="368" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="766" y="209.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="766" dy="0">Código de error del sistema (por ejemplo,</tspan></text><text x="766" y="225.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="766" dy="0">WinError 1314)</tspan></text><polyline points="220,214 256,214" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="546,214 582,214" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="115,242 115,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="260" width="210" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="291.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">Kernel</tspan></text><rect x="256" y="260" width="290" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="401" y="291.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="401" dy="0">¿Lo autorizó y pudo cumplirlo?</tspan></text><rect x="582" y="260" width="368" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="766" y="283.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="766" dy="0">Permission denied, política, registro del</tspan></text><text x="766" y="299.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="766" dy="0">sistema</tspan></text><polyline points="220,288 256,288" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="546,288 582,288" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="115,316 115,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="334" width="210" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="365.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">Controlador y recurso</tspan></text><rect x="256" y="334" width="290" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="401" y="365.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="401" dy="0">¿El dispositivo pudo atenderlo?</tspan></text><rect x="582" y="334" width="368" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="766" y="357.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="766" dy="0">Errores de E/S, estado del dispositivo,</tspan></text><text x="766" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="766" dy="0">registros</tspan></text><polyline points="220,362 256,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="546,362 582,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="404" width="940" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="434.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Versión, arquitectura y política pueden alterar varias fronteras: se registra el contexto antes de culpar una capa.</tspan></text></svg>
