<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres mensajes de error reales y la capa que señalan</title><desc id="d">Tabla de tres errores observados: un script con finales de línea de Windows en Linux, un script sin bit de ejecución y la creación de un enlace simbólico sin privilegio en Windows. Cada uno se asigna a una capa y a una prueba que lo discrimina.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="490" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Mensaje observado</tspan></text><rect x="340" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Capa</tspan></text><rect x="600" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Prueba que lo discrimina</tspan></text><rect x="10" y="56" width="324" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="99.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">/usr/bin/env: ‘bash\r’: No such file or</tspan></text><text x="172" y="115.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">directory</tspan></text><rect x="340" y="56" width="254" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="99.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Formato del script e intérprete</tspan></text><text x="467" y="115.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">(shebang)</tspan></text><rect x="600" y="56" width="344" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="91" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">`file script.sh` informa «with CRLF line</tspan></text><text x="772" y="107.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">terminators»; al convertir los finales,</tspan></text><text x="772" y="124.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">funciona</tspan></text><rect x="10" y="158" width="324" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="209.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Permission denied al ejecutar ./script.sh</tspan></text><rect x="340" y="158" width="254" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="201.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Política del sistema de archivos</tspan></text><text x="467" y="217.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">(bit de ejecución)</tspan></text><rect x="600" y="158" width="344" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="201.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">`bash script.sh` funciona: el contenido es</tspan></text><text x="772" y="217.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">válido y falta el permiso</tspan></text><rect x="10" y="260" width="324" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="303.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">OSError: [WinError 1314] Un privilegio</tspan></text><text x="172" y="319.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">requerido no es retenido por el cliente</tspan></text><rect x="340" y="260" width="254" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="295" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">API y política de Windows</tspan></text><text x="467" y="311.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">(privilegio de enlaces</tspan></text><text x="467" y="328.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">simbólicos)</tspan></text><rect x="600" y="260" width="344" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="303.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">El mismo código funciona en ext4 de WSL; el</tspan></text><text x="772" y="319.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">fallo depende del privilegio, no del código</tspan></text><rect x="10" y="372" width="940" height="100" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="417.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Cada mensaje nombra un síntoma, no un sistema operativo entero. «Es un problema de Windows» o «en Linux sí funciona» no</tspan></text><text x="480" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">explica nada: la prueba de la tercera columna sí separa las hipótesis.</tspan></text></svg>
