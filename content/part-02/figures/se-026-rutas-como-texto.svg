" y="170.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">3 partes; ancla UNC</tspan></text><rect x="10" y="208" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="246.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">/mnt/c/Users/ana/datos/informe.txt</tspan></text><rect x="340" y="208" width="144" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="246.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">PurePosixPath</tspan></text><rect x="490" y="208" width="264" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="246.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">root=&#x27;/&#x27;; sin unidad</tspan></text><rect x="760" y="208" width="184" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="238.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">7 partes; nombre</tspan></text><text x="852" y="254.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">&#x27;informe.txt&#x27;</tspan></text><rect x="10" y="284" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="322.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">C:\Users\ana\datos\informe.txt</tspan></text><rect x="340" y="284" width="144" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="322.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">PurePosixPath</tspan></text><rect x="490" y="284" width="264" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="322.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">root=&#x27;&#x27;; sin ancla</tspan></text><rect x="760" y="284" width="184" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="314.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">1 parte: todo es un</tspan></text><text x="852" y="330.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">nombre</tspan></text><rect x="10" y="366" width="940" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="391.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">El separador, la raíz y la unidad pertenecen a la interpretación, no al texto. Construir rutas con pathlib o os.path y no con</tspan></text><text x="480" y="407.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">concatenación evita que una ruta de un sistema se lea con las reglas de otro.</tspan></text><text x="480" y="460" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Valores obtenidos con pathlib de Python 3.12 (rutas puras: no tocan el disco).</tspan></text></svg>
