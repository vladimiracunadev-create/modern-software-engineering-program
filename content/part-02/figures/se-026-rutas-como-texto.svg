<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma ruta como texto: cómo la leen pathlib de Windows y de POSIX</title><desc id="d">Cuatro rutas que pathlib descompone en partes, mostradas como fichas: una ruta de unidad de Windows, una ruta UNC, una ruta POSIX y una ruta de Windows leída como POSIX, que se interpreta como una sola ficha, un nombre de archivo único.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><text x="160" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="160" dy="0">Ruta como texto</tspan></text><text x="406" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="406" dy="0">Leída con</tspan></text><text x="510" y="24" font-size="13" text-anchor="start" font-weight="700" fill="#32505f"><tspan x="510" dy="0">Partes que obtiene pathlib</tspan></text><rect x="10" y="38" width="300" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="69.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">C:\Users\ana\datos\informe.txt</tspan></text><rect x="336" y="38" width="140" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="406" y="69.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="406" dy="0">PureWindowsPath</tspan></text><polyline points="310,66 336,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="476,66 502,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="42" width="42.32" height="32" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="523.16" y="61.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="523.16" dy="0">C:\</tspan></text><rect x="550.32" y="42" width="57.2" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="578.92" y="61.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="578.92" dy="0">Users</tspan></text><rect x="613.52" y="42" width="42.32" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="634.68" y="61.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="634.68" dy="0">ana</tspan></text><rect x="661.84" y="42" width="57.2" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690.44" y="61.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="690.44" dy="0">datos</tspan></text><rect x="725.04" y="42" width="101.84" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="775.96" y="61.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="775.96" dy="0">informe.txt</tspan></text><text x="502" y="90" font-size="11" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="502" dy="0">drive=&#x27;C:&#x27; root=&#x27;\\&#x27;; 5 partes; nombre &#x27;informe.txt&#x27;</tspan></text><rect x="10" y="122" width="300" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="153.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">\\servidor\compartido\datos\informe.txt</tspan></text><rect x="336" y="122" width="140" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="406" y="153.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="406" dy="0">PureWindowsPath</tspan></text><polyline points="310,150 336,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="476,150 502,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="126" width="183.68" height="32" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="593.84" y="145.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="593.84" dy="0">\\servidor\compartido\</tspan></text><rect x="691.68" y="126" width="57.2" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="720.28" y="145.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="720.28" dy="0">datos</tspan></text><rect x="754.88" y="126" width="101.84" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="805.8" y="145.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="805.8" dy="0">informe.txt</tspan></text><text x="502" y="174" font-size="11" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="502" dy="0">drive=&#x27;\\\\servidor\\compartido&#x27;; 3 partes; ancla UNC</tspan></text><rect x="10" y="206" width="300" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="237.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">/mnt/c/Users/ana/datos/informe.txt</tspan></text><rect x="336" y="206" width="140" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="406" y="237.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="406" dy="0">PurePosixPath</tspan></text><polyline points="310,234 336,234" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="476,234 502,234" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="210" width="27.44" height="32" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="515.72" y="229.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="515.72" dy="0">/</tspan></text><rect x="535.44" y="210" width="42.32" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="556.6" y="229.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="556.6" dy="0">mnt</tspan></text><rect x="583.76" y="210" width="27.44" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="597.48" y="229.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="597.48" dy="0">c</tspan></text><rect x="617.2" y="210" width="57.2" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="645.8" y="229.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="645.8" dy="0">Users</tspan></text><rect x="680.4" y="210" width="42.32" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="701.56" y="229.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="701.56" dy="0">ana</tspan></text><rect x="728.72" y="210" width="57.2" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="757.32" y="229.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="757.32" dy="0">datos</tspan></text><rect x="791.92" y="210" width="101.84" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="842.84" y="229.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="842.84" dy="0">informe.txt</tspan></text><text x="502" y="258" font-size="11" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="502" dy="0">root=&#x27;/&#x27;; sin unidad; 7 partes; nombre &#x27;informe.txt&#x27;</tspan></text><rect x="10" y="290" width="300" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="321.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">C:\Users\ana\datos\informe.txt</tspan></text><rect x="336" y="290" width="140" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="406" y="321.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="406" dy="0">PurePosixPath</tspan></text><polyline points="310,318 336,318" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="476,318 502,318" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="294" width="243.2" height="32" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="623.6" y="313.36" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="623.6" dy="0">C:\Users\ana\datos\informe.txt</tspan></text><text x="502" y="342" font-size="11" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="502" dy="0">root=&#x27;&#x27;; sin ancla; 1 parte: todo es un nombre</tspan></text><rect x="10" y="378" width="940" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="403.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">El separador, la raíz y la unidad pertenecen a la interpretación, no al texto. Construir rutas con pathlib o os.path y no con</tspan></text><text x="480" y="419.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">concatenación evita que una ruta de un sistema se lea con las reglas de otro.</tspan></text><text x="480" y="460" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Valores obtenidos con pathlib de Python 3.12 (rutas puras: no tocan el disco).</tspan></text></svg>
