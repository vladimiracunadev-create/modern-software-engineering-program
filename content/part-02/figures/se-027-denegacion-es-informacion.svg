<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una denegación es información: dos intentos observados</title><desc id="d">Dos intentos reales como usuario sin privilegios: leer /etc/shadow, que tiene modo 640 y propietario root, produce Permission denied; sudo sin contraseña interactiva informa que se requiere una contraseña. La evidencia indica la capa y evita elevar sin necesidad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="460" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Intento</tspan></text><rect x="220" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">Resultado observado</tspan></text><rect x="560" y="12" width="384" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Lectura correcta</tspan></text><rect x="10" y="56" width="204" height="94" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="106.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">cat /etc/shadow</tspan></text><rect x="220" y="56" width="334" height="94" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="98.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">cat: /etc/shadow: Permission denied (modo</tspan></text><text x="387" y="114.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">640, propietario root)</tspan></text><rect x="560" y="56" width="384" height="94" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="98.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">El kernel aplicó el control de acceso: el archivo</tspan></text><text x="752" y="114.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">existe y la identidad no tiene el permiso</tspan></text><rect x="10" y="156" width="204" height="94" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="206.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">sudo -n true</tspan></text><rect x="220" y="156" width="334" height="94" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">sudo: a password is required</tspan></text><rect x="560" y="156" width="384" height="94" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="198.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">La elevación requiere una autenticación que este</tspan></text><text x="752" y="214.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">contexto no ofrece; no es una falla del comando</tspan></text><rect x="10" y="256" width="204" height="94" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="306.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">id (uid 1000)</tspan></text><rect x="220" y="256" width="334" height="94" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="298.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">El usuario pertenece a varios grupos y no a</tspan></text><text x="387" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">root</tspan></text><rect x="560" y="256" width="384" height="94" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="298.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Identidad no equivale a autoridad: los grupos y</tspan></text><text x="752" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">la política deciden qué puede hacerse</tspan></text><rect x="10" y="368" width="940" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="398.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Elevar privilegios para «ver si funciona» es una intervención con riesgo y no una prueba. La respuesta correcta empieza por</tspan></text><text x="480" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">identificar sujeto, acción, objeto y política.</tspan></text></svg>
