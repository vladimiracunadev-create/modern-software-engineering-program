<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Apagado ordenado frente a terminación forzada</title><desc id="d">Dos caminos: SIGTERM llega a un manejador que limpia y sale con código 0, mientras SIGKILL termina el proceso sin dejarle ejecutar código y deja su código en -9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="460" fill="#ffffff"/><rect x="20" y="20" width="200" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="120" y="48.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120" dy="0">Proceso padre</tspan></text><rect x="20" y="150" width="200" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120" y="178.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="120" dy="0">SIGTERM (terminate)</tspan></text><rect x="20" y="300" width="200" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="120" y="328.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="120" dy="0">SIGKILL</tspan></text><polyline points="120,70 120,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="60,70 60,300" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="300" y="150" width="300" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="170.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">Manejador del proceso hijo: limpia</tspan></text><text x="450" y="186.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">recursos</tspan></text><polyline points="220,175 300,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="660" y="150" width="260" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="170.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="790" dy="0">Sale con código 0 y escribe</tspan></text><text x="790" y="186.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="790" dy="0">«limpiando»</tspan></text><polyline points="600,175 660,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="300" width="300" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="320.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">El núcleo termina el proceso: ningún</tspan></text><text x="450" y="336.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">código del hijo se ejecuta</tspan></text><polyline points="220,325 300,325" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="660" y="300" width="260" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="790" y="328.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="790" dy="0">Código -9; recursos sin liberar</tspan></text><polyline points="600,325 660,325" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="380" width="900" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="405.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Se pide cerrar con SIGTERM, se espera un plazo y solo entonces se fuerza con SIGKILL. Un proceso que ignora SIGTERM</tspan></text><text x="470" y="421.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">depende del plazo y de la política del supervisor.</tspan></text></svg>
