<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 537" width="960" height="537" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo termina un proceso: códigos de salida observados en Windows y Linux</title><desc id="d">Seis formas de terminar un proceso observadas desde Python. Tres dan el mismo resultado en ambos sistemas (sys.exit(3), una excepción sin tratar y el tiempo agotado de subprocess.run) y tres divergen: terminate() da 1 en Windows y -15 en Linux, SIGKILL solo existe como señal en Linux (-9) y un manejador de SIGTERM limpia y sale con 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="537" fill="#ffffff"/><rect x="380" y="12" width="281" height="28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520.5" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="520.5" dy="0">Windows</tspan></text><rect x="669" y="12" width="281" height="28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="809.5" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="809.5" dy="0">Linux (WSL2)</tspan></text><rect x="10" y="48" width="330" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="175" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175" dy="0">sys.exit(3)</tspan></text><rect x="375" y="43" width="580" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="340,74 375,74" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="380" y="48" width="570" height="52" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="665" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="665" dy="0">3</tspan></text><rect x="10" y="118" width="330" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="175" y="147.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175" dy="0">Excepción sin tratar</tspan></text><rect x="375" y="113" width="580" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="340,144 375,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="380" y="118" width="570" height="52" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="665" y="147.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="665" dy="0">1</tspan></text><rect x="10" y="188" width="330" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="175" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175" dy="0">terminate() sin manejador</tspan></text><rect x="375" y="183" width="580" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="340,214 375,214" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="380" y="188" width="281" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520.5" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520.5" dy="0">1 (TerminateProcess)</tspan></text><rect x="669" y="188" width="281" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="809.5" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="809.5" dy="0">-15 (señal SIGTERM)</tspan></text><rect x="10" y="258" width="330" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="175" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175" dy="0">kill / SIGKILL</tspan></text><rect x="375" y="253" width="580" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="340,284 375,284" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="380" y="258" width="281" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520.5" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520.5" dy="0">No aplicable como señal</tspan></text><rect x="669" y="258" width="281" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="809.5" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="809.5" dy="0">-9 (no se puede interceptar)</tspan></text><rect x="10" y="328" width="330" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="175" y="357.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175" dy="0">SIGTERM con manejador que limpia</tspan></text><rect x="375" y="323" width="580" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="340,354 375,354" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="380" y="328" width="281" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520.5" y="357.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520.5" dy="0">No aplicable</tspan></text><rect x="669" y="328" width="281" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="809.5" y="357.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="809.5" dy="0">0 y escribe «limpiando»</tspan></text><rect x="10" y="398" width="330" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="175" y="419.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175" dy="0">subprocess.run(timeout=1) sobre un proceso</tspan></text><text x="175" y="435.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175" dy="0">de 10 s</tspan></text><rect x="375" y="393" width="580" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="340,424 375,424" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="380" y="398" width="570" height="52" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="665" y="427.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="665" dy="0">TimeoutExpired</tspan></text><rect x="10" y="464" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="488.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">En POSIX un código negativo en Python significa «terminado por la señal N»; en Windows no existe ese canal y todo es un</tspan></text><text x="480" y="505.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">entero.</tspan></text></svg>
