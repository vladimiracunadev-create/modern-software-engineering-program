<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Entrada, salida y error son canales distintos</title><desc id="d">Un comando que escribe «salida» en stdout y «error» en stderr: con ambos redirigidos a archivos, el archivo de salida contiene 7 bytes y el de error 6 bytes; descartar stderr deja solo la salida en pantalla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="20" y="150" width="180" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="183.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="110" dy="0">Comando</tspan></text><rect x="300" y="70" width="260" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="430" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="430" dy="0">stdout (canal 1): resultados</tspan></text><text x="430" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="430" dy="0">«salida» → 7 bytes</tspan></text><rect x="300" y="230" width="260" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="430" y="255.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">stderr (canal 2): diagnóstico</tspan></text><text x="430" y="271.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">«error» → 6 bytes</tspan></text><polyline points="200,170 300,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="200,190 300,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="640" y="70" width="280" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="780" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">&gt; salida.txt (archivo de 7 bytes)</tspan></text><rect x="640" y="230" width="280" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="780" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">2&gt; error.txt (archivo de 6 bytes)</tspan></text><polyline points="560,100 640,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="560,260 640,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="320" width="900" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="345.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Los datos van por stdout y los mensajes por stderr: así un pipeline transmite resultados sin mezclarlos con</tspan></text><text x="470" y="361.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">diagnósticos. Que stderr tenga texto no implica un fallo fatal; el código de salida lo indica.</tspan></text></svg>
