<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Errores en dos shells: lo que se observó</title><desc id="d">Tabla: en PowerShell 5.1 un error no terminante deja $? en falso y sigue; con -ErrorAction Stop se lanza ItemNotFoundException que se captura; un programa nativo deja su código en $LASTEXITCODE; con Set-StrictMode una variable no definida es un error. En Bash, $? guarda el código del último comando y set -e detiene el script.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Situación</tspan></text><rect x="220" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="417" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417" dy="0">PowerShell 5.1</tspan></text><rect x="620" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Bash</tspan></text><rect x="10" y="56" width="204" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="97.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Falla un comando</tspan></text><rect x="220" y="56" width="394" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="97.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">Error no terminante: $? = False y el script continúa</tspan></text><rect x="620" y="56" width="324" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="89.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">$? = código distinto de 0 y el script</tspan></text><text x="782" y="105.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">continúa</tspan></text><rect x="10" y="138" width="204" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="179.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Hacer que el fallo detenga</tspan></text><rect x="220" y="138" width="394" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="171.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">-ErrorAction Stop → excepción ItemNotFoundException que</tspan></text><text x="417" y="187.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">try/catch captura</tspan></text><rect x="620" y="138" width="324" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="179.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">set -e (con sus excepciones documentadas)</tspan></text><rect x="10" y="220" width="204" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="253.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Programa nativo con código</tspan></text><text x="112" y="269.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">5</tspan></text><rect x="220" y="220" width="394" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="261.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">$LASTEXITCODE = 5 y $? = False</tspan></text><rect x="620" y="220" width="324" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="261.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">$? = 5</tspan></text><rect x="10" y="302" width="204" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="343.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Variable no definida</tspan></text><rect x="220" y="302" width="394" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="335.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">Set-StrictMode: error «no se puede recuperar porque no</tspan></text><text x="417" y="351.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">se ha establecido»</tspan></text><rect x="620" y="302" width="324" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="343.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Expande a vacío salvo set -u</tspan></text><rect x="10" y="398" width="940" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="421.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cada shell tiene varios canales de error. Un contrato común define qué es un fallo (código de salida y mensaje estructurado) y</tspan></text><text x="480" y="437.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">cada adaptador lo traduce.</tspan></text></svg>
