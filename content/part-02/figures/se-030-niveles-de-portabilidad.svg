<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Niveles de portabilidad de un script</title><desc id="d">Cuatro niveles de portabilidad, de lo más estrecho a lo más amplio: un script de Bash, un script POSIX sh, un script de PowerShell, y un núcleo en un lenguaje con adaptadores finos, con lo que cada nivel exige de la plataforma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><rect x="10" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Nivel</tspan></text><rect x="240" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="417" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417" dy="0">Qué exige de la plataforma</tspan></text><rect x="600" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Qué no garantiza</tspan></text><rect x="10" y="56" width="224" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Bash</tspan></text><rect x="240" y="56" width="354" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">Que Bash esté instalado y sea compatible</tspan></text><rect x="600" y="56" width="344" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Que exista en Windows sin una capa adicional</tspan></text><rect x="10" y="132" width="224" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="170.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">POSIX sh</tspan></text><rect x="240" y="132" width="354" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="162.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">Un intérprete que cumpla la especificación</tspan></text><text x="417" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">POSIX</tspan></text><rect x="600" y="132" width="344" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="162.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Que las herramientas externas (sed, date) se</tspan></text><text x="772" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">comporten igual</tspan></text><rect x="10" y="208" width="224" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="246.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">PowerShell</tspan></text><rect x="240" y="208" width="354" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">PowerShell 5.1 en Windows o PowerShell 7</tspan></text><text x="417" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">multiplataforma</tspan></text><rect x="600" y="208" width="344" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Que 5.1 y 7 tengan los mismos módulos y</tspan></text><text x="772" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">comportamientos</tspan></text><rect x="10" y="284" width="224" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="314.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Núcleo común + adaptadores</tspan></text><text x="122" y="330.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">finos</tspan></text><rect x="240" y="284" width="354" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="314.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">Un runtime (por ejemplo, Python 3.11+) y un</tspan></text><text x="417" y="330.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">adaptador por shell</tspan></text><rect x="600" y="284" width="344" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="314.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Que el adaptador exprese cada diferencia: se</tspan></text><text x="772" y="330.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">prueba en cada plataforma</tspan></text><rect x="10" y="372" width="920" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="395.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Copiar el mismo script a tres sistemas solo desplaza el fallo; definir la intención común y probar cada adaptador lo hace</tspan></text><text x="470" y="411.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">visible.</tspan></text></svg>
