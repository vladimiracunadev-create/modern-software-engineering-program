<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" width="960" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Niveles de portabilidad de un script</title><desc id="d">Cuatro niveles de portabilidad, de lo más estrecho a lo más amplio: un script de Bash, un script POSIX sh, un script de PowerShell y un núcleo en un lenguaje con adaptadores finos; de cada nivel salen lo que exige de la plataforma y lo que no garantiza.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="435" fill="#ffffff"/><text x="115" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="115" dy="0">Nivel (de lo estrecho a lo amplio)</tspan></text><text x="421" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="421" dy="0">Qué exige de la plataforma</tspan></text><text x="786" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="786" dy="0">Qué no garantiza</tspan></text><rect x="10" y="38" width="210" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="73.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">Bash</tspan></text><rect x="256" y="38" width="330" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="421" y="73.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="421" dy="0">Que Bash esté instalado y sea compatible</tspan></text><rect x="622" y="38" width="328" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="786" y="65.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">Que exista en Windows sin una capa</tspan></text><text x="786" y="81.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">adicional</tspan></text><polyline points="220,70 256,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="586,70 622,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="115,102 115,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="120" width="210" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">POSIX sh</tspan></text><rect x="256" y="120" width="330" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="421" y="147.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="421" dy="0">Un intérprete que cumpla la especificación</tspan></text><text x="421" y="163.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="421" dy="0">POSIX</tspan></text><rect x="622" y="120" width="328" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="786" y="147.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">Que las herramientas externas (sed, date)</tspan></text><text x="786" y="163.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">se comporten igual</tspan></text><polyline points="220,152 256,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="586,152 622,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="115,184 115,202" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="202" width="210" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="237.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">PowerShell</tspan></text><rect x="256" y="202" width="330" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="421" y="229.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="421" dy="0">PowerShell 5.1 en Windows o PowerShell 7</tspan></text><text x="421" y="245.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="421" dy="0">multiplataforma</tspan></text><rect x="622" y="202" width="328" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="786" y="229.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">Que 5.1 y 7 tengan los mismos módulos y</tspan></text><text x="786" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">comportamientos</tspan></text><polyline points="220,234 256,234" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="586,234 622,234" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="115,266 115,284" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="284" width="210" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="311.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">Núcleo común + adaptadores</tspan></text><text x="115" y="327.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">finos</tspan></text><rect x="256" y="284" width="330" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="421" y="311.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="421" dy="0">Un runtime (por ejemplo, Python 3.11+) y</tspan></text><text x="421" y="327.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="421" dy="0">un adaptador por shell</tspan></text><rect x="622" y="284" width="328" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="786" y="311.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">Que el adaptador exprese cada diferencia:</tspan></text><text x="786" y="327.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">se prueba en cada plataforma</tspan></text><polyline points="220,316 256,316" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="586,316 622,316" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="362" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="386.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Copiar el mismo script a tres sistemas solo desplaza el fallo; definir la intención común y probar cada adaptador lo hace</tspan></text><text x="480" y="403.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">visible.</tspan></text></svg>
