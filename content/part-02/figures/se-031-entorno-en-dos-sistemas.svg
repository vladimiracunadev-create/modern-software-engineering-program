<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Variables de entorno en Windows y en Linux</title><desc id="d">Tabla con resultados reales: buscar una variable con distinto uso de mayúsculas la encuentra en Windows y no en Linux; un proceso hijo hereda la variable en ambos; los valores son siempre texto y asignar un entero lanza TypeError.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Prueba</tspan></text><rect x="390" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Windows</tspan></text><rect x="670" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Linux (WSL2)</tspan></text><rect x="10" y="56" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Buscar «mi_var» tras fijar «MI_VAR»</tspan></text><rect x="390" y="56" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">&#x27;valor&#x27; (no distingue mayúsculas)</tspan></text><rect x="670" y="56" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">None (distingue mayúsculas)</tspan></text><rect x="10" y="122" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Un proceso hijo lee la variable</tspan></text><rect x="390" y="122" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">&#x27;valor&#x27; (la hereda)</tspan></text><rect x="670" y="122" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">&#x27;valor&#x27; (la hereda)</tspan></text><rect x="10" y="188" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="221.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Tipo de «PUERTO» = 8080</tspan></text><rect x="390" y="188" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">str</tspan></text><rect x="670" y="188" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">str</tspan></text><rect x="10" y="254" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">os.environ[&#x27;N&#x27;] = 5</tspan></text><rect x="390" y="254" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">TypeError</tspan></text><rect x="670" y="254" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">TypeError</tspan></text><rect x="10" y="332" width="940" height="100" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">El entorno es una lista de pares texto-texto que se hereda; no tiene tipos ni esquema. Un programa que lo usa convierte y</tspan></text><text x="480" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">valida explícitamente (por ejemplo, un puerto debe ser un entero entre 1 y 65535) y no depende de mayúsculas para distinguir</tspan></text><text x="480" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">variables si debe funcionar en ambos sistemas.</tspan></text></svg>
