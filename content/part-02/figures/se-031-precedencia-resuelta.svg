<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Precedencia de configuración: tres resoluciones reales</title><desc id="d">Tabla con la función de precedencia argumento, entorno, archivo y valor por omisión aplicada a tres casos: sin argumento gana el entorno, con argumento gana el argumento y sin nada gana el valor por omisión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Argumento</tspan></text><rect x="160" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Entorno</tspan></text><rect x="310" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Archivo</tspan></text><rect x="460" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Por omisión</tspan></text><rect x="610" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Resultado (fuente, valor)</tspan></text><rect x="10" y="56" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="89.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">—</tspan></text><rect x="160" y="56" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="232" dy="0">8081</tspan></text><rect x="310" y="56" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">8082</tspan></text><rect x="460" y="56" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">8080</tspan></text><rect x="610" y="56" width="334" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="777" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="777" dy="0">entorno, 8081</tspan></text><rect x="10" y="122" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="155.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">9000</tspan></text><rect x="160" y="122" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="155.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="232" dy="0">8081</tspan></text><rect x="310" y="122" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="155.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">8082</tspan></text><rect x="460" y="122" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="155.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">8080</tspan></text><rect x="610" y="122" width="334" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="777" y="155.92" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="777" dy="0">argumento, 9000</tspan></text><rect x="10" y="188" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="221.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">—</tspan></text><rect x="160" y="188" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="221.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="232" dy="0">—</tspan></text><rect x="310" y="188" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="221.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">—</tspan></text><rect x="460" y="188" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="221.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">8080</tspan></text><rect x="610" y="188" width="334" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="777" y="221.92" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="777" dy="0">default, 8080</tspan></text><rect x="10" y="262" width="940" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El orden es determinista y se registra: la ficha de configuración efectiva dice de dónde viene cada valor. Cambiar el orden</tspan></text><text x="480" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">entre ejecuciones (o entre adaptadores) cambia el comportamiento sin cambiar el código.</tspan></text><rect x="10" y="350" width="940" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="383.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">En el laboratorio, `profile` se resuelve con argumento, DIAG_PROFILE, settings.json y valor predeterminado, y el reporte</tspan></text><text x="480" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">conserva la fuente elegida.</tspan></text></svg>
