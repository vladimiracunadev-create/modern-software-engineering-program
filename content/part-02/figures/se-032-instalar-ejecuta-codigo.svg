<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 389" width="960" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Instalar puede ejecutar código: lo que se observa y lo que se documenta</title><desc id="d">Tres mecanismos de instalación con su evidencia y su consecuencia: una observación real (624 archivos de scripts de mantenedor preinst, postinst, prerm o postrm en /var/lib/dpkg/info de este Ubuntu) y dos afirmaciones documentadas, que las fuentes de Python pueden ejecutar código al construirse y que las ruedas no ejecutan código de instalación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="389" fill="#ffffff"/><text x="135" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="135" dy="0">Mecanismo</tspan></text><text x="466" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="466" dy="0">Evidencia (observado o documentado)</tspan></text><text x="811" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="811" dy="0">Consecuencia</tspan></text><rect x="10" y="38" width="250" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="71.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Scripts de mantenedor de</tspan></text><text x="135" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">paquetes .deb</tspan></text><rect x="296" y="38" width="340" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="466" y="63" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="466" dy="0">Observado: 624 archivos</tspan></text><text x="466" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="466" dy="0">preinst/postinst/prerm/postrm en el sistema</tspan></text><text x="466" y="96.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="466" dy="0">de prueba</tspan></text><rect x="672" y="38" width="278" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="63" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">Instalar un paquete del sistema</tspan></text><text x="811" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">ejecuta código con privilegios de</tspan></text><text x="811" y="96.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">administrador</tspan></text><polyline points="260,76 296,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,76 672,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132" width="250" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="165.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Distribución fuente de Python</tspan></text><text x="135" y="181.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">(sdist)</tspan></text><rect x="296" y="132" width="340" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="466" y="165.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="466" dy="0">Documentado: la construcción puede ejecutar</tspan></text><text x="466" y="181.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="466" dy="0">código del paquete</tspan></text><rect x="672" y="132" width="278" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">Instalar desde una fuente es</tspan></text><text x="811" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">ejecutar código de un tercero en tu</tspan></text><text x="811" y="190.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">equipo</tspan></text><polyline points="260,170 296,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,170 672,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="226" width="250" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="267.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Rueda de Python (wheel)</tspan></text><rect x="296" y="226" width="340" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="466" y="251" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="466" dy="0">Documentado: formato de archivos ya</tspan></text><text x="466" y="267.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="466" dy="0">construidos, sin paso de ejecución de</tspan></text><text x="466" y="284.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="466" dy="0">instalación</tspan></text><rect x="672" y="226" width="278" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="251" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">Reduce la superficie, pero el</tspan></text><text x="811" y="267.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">código del paquete sigue</tspan></text><text x="811" y="284.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">ejecutándose al importarlo</tspan></text><polyline points="260,264 296,264" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,264 672,264" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="316" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">La confianza se decide antes de instalar: procedencia del repositorio, firma, alcance (sistema o usuario) y un plan de</tspan></text><text x="480" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">reversión.</tspan></text></svg>
