<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 517" width="960" height="517" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un paquete visto desde el gestor del sistema: coreutils en Ubuntu 24.04</title><desc id="d">Cinco campos reales que dpkg y apt informan para el paquete coreutils, cada uno con su valor y lo que comunica: mantenedor Ubuntu Developers, versión instalada 9.4-3ubuntu6 en amd64, versión candidata 9.4-3ubuntu6.3 de noble-updates, dependencias previas como libacl1 y libc6, y verificación de archivos sin diferencias.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="517" fill="#ffffff"/><text x="125" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="125" dy="0">Campo</tspan></text><text x="441" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="441" dy="0">Valor observado</tspan></text><text x="796" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="796" dy="0">Qué informa</tspan></text><rect x="10" y="38" width="230" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="73.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">Package / Maintainer</tspan></text><rect x="276" y="38" width="330" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="441" y="73.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="441" dy="0">coreutils / Ubuntu Developers</tspan></text><rect x="642" y="38" width="308" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="65.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">Quién empaqueta y se responsabiliza del</tspan></text><text x="796" y="81.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">paquete en esta distribución</tspan></text><polyline points="240,70 276,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,70 642,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="120" width="230" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">Version / Architecture</tspan></text><rect x="276" y="120" width="330" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="441" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="441" dy="0">9.4-3ubuntu6 / amd64</tspan></text><rect x="642" y="120" width="308" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="147.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">La versión del paquete (no solo del</tspan></text><text x="796" y="163.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">programa) y el contrato binario</tspan></text><polyline points="240,152 276,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,152 642,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="202" width="230" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="237.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">Candidate (apt policy)</tspan></text><rect x="276" y="202" width="330" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="441" y="237.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="441" dy="0">9.4-3ubuntu6.3 desde noble-updates</tspan></text><rect x="642" y="202" width="308" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="229.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">Hay una actualización disponible;</tspan></text><text x="796" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">instalada no es lo mismo que candidata</tspan></text><polyline points="240,234 276,234" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,234 642,234" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="284" width="230" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="319.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">PreDepends</tspan></text><rect x="276" y="284" width="330" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="441" y="311.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="441" dy="0">libacl1, libattr1, libc6, libgmp10,</tspan></text><text x="441" y="327.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="441" dy="0">libselinux1</tspan></text><rect x="642" y="284" width="308" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="311.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">Lo que debe estar presente antes de</tspan></text><text x="796" y="327.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">instalar: el árbol de dependencias</tspan></text><polyline points="240,316 276,316" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,316 642,316" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="366" width="230" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">dpkg --verify coreutils</tspan></text><rect x="276" y="366" width="330" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="441" y="401.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="441" dy="0">Sin salida; código 0</tspan></text><rect x="642" y="366" width="308" height="64" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="393.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">Los archivos coinciden con las sumas de</tspan></text><text x="796" y="409.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">verificación registradas</tspan></text><polyline points="240,398 276,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,398 642,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="444" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un gestor de paquetes es una base de datos de versiones, relaciones y sumas de verificación; instalar es modificarla de forma</tspan></text><text x="480" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">controlada.</tspan></text></svg>
