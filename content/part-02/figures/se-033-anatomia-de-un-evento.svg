<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Anatomía de un evento del Registro de eventos de Windows</title><desc id="d">Tres eventos reales del registro Application en orden cronológico, cada uno con su hora de creación, identificador, nivel y proveedor: 8302 de System-Restore a las 11:25:41 y dos eventos 8224 de VSS, 12 segundos y 12 minutos y 7 segundos después. El registro es circular.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="420" fill="#ffffff"/><text x="480" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="480" dy="0">Registro Application, de más antiguo a más reciente</tspan></text><rect x="14" y="38" width="236" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="61.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Hora: 13/11/2026 11:25:41</tspan></text><rect x="14" y="88" width="236" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="132" y="108.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="132" dy="0">Identificador: 8302</tspan></text><rect x="14" y="130" width="236" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="132" y="150.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="132" dy="0">Nivel: Información</tspan></text><rect x="14" y="172" width="236" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="132" y="192.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="132" dy="0">Proveedor:</tspan></text><text x="132" y="208.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="132" dy="0">Microsoft-Windows-System-Restore</tspan></text><polyline points="250,58 330,58" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="290" y="50" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="290" dy="0">+12 s</tspan></text><rect x="330" y="38" width="236" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="448" y="61.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="448" dy="0">Hora: 13/11/2026 11:25:53</tspan></text><rect x="330" y="88" width="236" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="448" y="108.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="448" dy="0">Identificador: 8224</tspan></text><rect x="330" y="130" width="236" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="448" y="150.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="448" dy="0">Nivel: Información</tspan></text><rect x="330" y="172" width="236" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="448" y="200.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="448" dy="0">Proveedor: VSS</tspan></text><polyline points="566,58 646,58" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="606" y="50" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="606" dy="0">+12 min 7 s</tspan></text><rect x="646" y="38" width="236" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="764" y="61.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="764" dy="0">Hora: 13/11/2026 11:38:00</tspan></text><rect x="646" y="88" width="236" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="764" y="108.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="764" dy="0">Identificador: 8224</tspan></text><rect x="646" y="130" width="236" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="764" y="150.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="764" dy="0">Nivel: Información</tspan></text><rect x="646" y="172" width="236" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="764" y="200.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="764" dy="0">Proveedor: VSS</tspan></text><rect x="10" y="246" width="940" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="279.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un evento útil tiene estructura: cuándo (con zona horaria), quién lo emitió (proveedor), qué es (identificador) y cuánta</tspan></text><text x="480" y="295.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">importancia tiene (nivel). El texto libre es el último recurso.</tspan></text><rect x="10" y="334" width="940" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="359.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El modo del registro es circular: los eventos antiguos se sobrescriben. La evidencia de un incidente se exporta antes de que</tspan></text><text x="480" y="375.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">se pierda.</tspan></text></svg>
