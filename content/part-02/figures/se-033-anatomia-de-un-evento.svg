<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Anatomía de un evento del Registro de eventos de Windows</title><desc id="d">Tabla con los campos de tres eventos reales del registro Application: hora de creación, identificador, nivel y proveedor. El registro es circular.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><rect x="10" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="127" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="127" dy="0">Hora (local)</tspan></text><rect x="250" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="297" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="297" dy="0">Id</tspan></text><rect x="350" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Nivel</tspan></text><rect x="550" y="12" width="384" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Proveedor</tspan></text><rect x="10" y="56" width="234" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="86.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">13/11/2026 11:38:00</tspan></text><rect x="250" y="56" width="94" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">8224</tspan></text><rect x="350" y="56" width="194" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Información</tspan></text><rect x="550" y="56" width="384" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">VSS</tspan></text><rect x="10" y="116" width="234" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="146.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">13/11/2026 11:25:53</tspan></text><rect x="250" y="116" width="94" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">8224</tspan></text><rect x="350" y="116" width="194" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Información</tspan></text><rect x="550" y="116" width="384" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">VSS</tspan></text><rect x="10" y="176" width="234" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="206.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">13/11/2026 11:25:41</tspan></text><rect x="250" y="176" width="94" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">8302</tspan></text><rect x="350" y="176" width="194" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Información</tspan></text><rect x="550" y="176" width="384" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Microsoft-Windows-System-Restore</tspan></text><rect x="10" y="250" width="920" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un evento útil tiene estructura: cuándo (con zona horaria), quién lo emitió (proveedor), qué es (identificador) y cuánta</tspan></text><text x="470" y="299.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">importancia tiene (nivel). El texto libre es el último recurso.</tspan></text><rect x="10" y="338" width="920" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="363.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El modo del registro es circular: los eventos antiguos se sobrescriben. La evidencia de un incidente se exporta antes de</tspan></text><text x="470" y="379.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">que se pierda.</tspan></text></svg>
