<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma hora, dos escrituras: local con desfase y UTC</title><desc id="d">Una entrada del journal con la marca 2026-11-13T11:38:54-03:00 y la hora en UTC 14:38:54 son el mismo instante. Sin el desfase, dos registros de equipos distintos no se pueden ordenar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="20" y="40" width="400" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="220" y="69.96" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="220" dy="0">Journal (hora local con desfase)</tspan></text><text x="220" y="87.88" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="220" dy="0">2026-11-13T11:38:54-03:00</tspan></text><rect x="520" y="40" width="400" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="720" y="69.96" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="720" dy="0">date -u (UTC)</tspan></text><text x="720" y="87.88" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="720" dy="0">2026-11-13T14:38:54Z</tspan></text><polyline points="420,75 520,75" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="69" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">mismo instante</tspan></text><rect x="20" y="150" width="900" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="180.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">11:38:54 en -03:00 equivale a 14:38:54 en UTC (11 + 3 = 14). Los formatos ISO 8601 con desfase o con Z permiten ordenar</tspan></text><text x="470" y="196.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">eventos de distintos orígenes.</tspan></text><rect x="20" y="236" width="900" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="266.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Un reloj de pared puede ajustarse hacia atrás; para medir duraciones se usa un reloj monotónico (en la prueba, 0,203 s</tspan></text><text x="470" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">en ambos relojes: no hubo ajuste).</tspan></text><rect x="20" y="320" width="900" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="343.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El orden de llegada de líneas de registro no es el orden de ocurrencia: se ordena por marca de tiempo y se declara la</tspan></text><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sincronización.</tspan></text></svg>
