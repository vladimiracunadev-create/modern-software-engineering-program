<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Máquina virtual, contenedor y proceso aislado: qué comparten</title><desc id="d">Tres pilas de capas para tres mecanismos: la máquina virtual (WSL2, Hyper-V) trae un kernel propio, mientras el contenedor (Docker, Podman) y el proceso con unshare comparten el kernel del anfitrión; cada pila indica qué aísla y qué costo o riesgo tiene.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><rect x="14" y="14" width="300" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="164" y="39.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="164" dy="0">Máquina virtual (WSL2, Hyper-V)</tspan></text><rect x="14" y="78" width="300" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="116.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="164" dy="0">Aísla: hardware virtual completo</tspan></text><rect x="14" y="168" width="300" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="164" y="199.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="164" dy="0">Kernel propio por máquina</tspan></text><rect x="14" y="244" width="300" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="164" y="273" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="164" dy="0">Costo y riesgo: arranque y memoria</tspan></text><text x="164" y="289.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="164" dy="0">mayores; frontera fuerte mediada por</tspan></text><text x="164" y="306.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="164" dy="0">el hipervisor</tspan></text><polyline points="164,58 164,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="164,148 164,168" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="164,224 164,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="14" width="300" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="39.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">Contenedor (Docker, Podman)</tspan></text><rect x="330" y="78" width="300" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="108.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Aísla: procesos, red, sistema de</tspan></text><text x="480" y="124.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">archivos y recursos</tspan></text><rect x="330" y="168" width="300" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="199.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="480" dy="0">Kernel del anfitrión, compartido</tspan></text><rect x="330" y="244" width="300" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="281.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Costo y riesgo: arranque rápido; una</tspan></text><text x="480" y="297.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">falla del kernel afecta a todos</tspan></text><polyline points="480,58 480,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="480,148 480,168" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="480,224 480,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="646" y="14" width="300" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="796" y="39.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="796" dy="0">Proceso con unshare</tspan></text><rect x="646" y="78" width="300" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="796" y="108.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="796" dy="0">Aísla: los espacios de nombres</tspan></text><text x="796" y="124.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="796" dy="0">elegidos</tspan></text><rect x="646" y="168" width="300" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="796" y="199.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="796" dy="0">Kernel del anfitrión, compartido</tspan></text><rect x="646" y="244" width="300" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="796" y="273" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="796" dy="0">Costo y riesgo: sin imagen ni red de</tspan></text><text x="796" y="289.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="796" dy="0">forma automática; un bloque de</tspan></text><text x="796" y="306.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="796" dy="0">construcción</tspan></text><polyline points="796,58 796,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="796,148 796,168" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="796,224 796,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="352" width="930" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="479" y="382.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="479" dy="0">«Un contenedor es una VM pequeña» es falso: no tiene kernel propio. Aislar no elimina la confianza: el anfitrión y el kernel</tspan></text><text x="479" y="398.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="479" dy="0">siguen siendo parte del límite.</tspan></text></svg>
