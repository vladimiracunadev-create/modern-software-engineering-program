<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reducir incertidumbre por capas: hipótesis, prueba y resultado esperado</title><desc id="d">Cuatro hipótesis para el script que falla; de cada una sale una prueba barata y dos desenlaces posibles: el resultado que la confirma y el que la descarta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><text x="115" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="115" dy="0">Hipótesis</tspan></text><text x="375" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="375" dy="0">Prueba barata</tspan></text><text x="627" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="627" dy="0">La confirma si</tspan></text><text x="842" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="842" dy="0">La descarta si</tspan></text><rect x="10" y="38" width="210" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="74.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="115" dy="0">El intérprete no existe</tspan></text><rect x="250" y="38" width="250" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="375" y="74.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="375" dy="0">command -v bash</tspan></text><rect x="526" y="33" width="424" height="76" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="532" y="38" width="205" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="634.5" y="74.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="634.5" dy="0">No imprime una ruta</tspan></text><rect x="743" y="38" width="202" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="844" y="74.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="844" dy="0">Imprime /usr/bin/bash</tspan></text><polyline points="220,71 250,71" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="500,71 526,71" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="122" width="210" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="115" dy="0">El shebang está mal escrito</tspan></text><rect x="250" y="122" width="250" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="375" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="375" dy="0">head -1 script.sh | cat -A</tspan></text><rect x="526" y="117" width="424" height="76" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="532" y="122" width="205" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="634.5" y="150.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="634.5" dy="0">Muestra un nombre distinto</tspan></text><text x="634.5" y="166.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="634.5" dy="0">de bash</tspan></text><rect x="743" y="122" width="202" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="844" y="150.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="844" dy="0">Muestra bash seguido de ^M</tspan></text><text x="844" y="166.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="844" dy="0">(el nombre es correcto)</tspan></text><polyline points="220,155 250,155" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="500,155 526,155" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="206" width="210" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="242.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="115" dy="0">Finales de línea de Windows</tspan></text><rect x="250" y="206" width="250" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="375" y="242.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="375" dy="0">file script.sh</tspan></text><rect x="526" y="201" width="424" height="76" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="532" y="206" width="205" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="634.5" y="234.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="634.5" dy="0">Informa CRLF line</tspan></text><text x="634.5" y="250.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="634.5" dy="0">terminators</tspan></text><rect x="743" y="206" width="202" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="844" y="242.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="844" dy="0">Informa solo ASCII text</tspan></text><polyline points="220,239 250,239" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="500,239 526,239" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="290" width="210" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="326.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="115" dy="0">Falta el bit de ejecución</tspan></text><rect x="250" y="290" width="250" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="375" y="326.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="375" dy="0">ls -l script.sh; bash script.sh</tspan></text><rect x="526" y="285" width="424" height="76" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="532" y="290" width="205" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="634.5" y="318.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="634.5" dy="0">bash script.sh funciona y</tspan></text><text x="634.5" y="334.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="634.5" dy="0">./script.sh falla</tspan></text><rect x="743" y="290" width="202" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="844" y="318.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="844" dy="0">Ambos fallan de la misma</tspan></text><text x="844" y="334.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="844" dy="0">forma</tspan></text><polyline points="220,323 250,323" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="500,323 526,323" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="376" width="940" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Se prueba primero lo más barato y lo que más discrimina; cada prueba debe poder refutar una hipótesis.</tspan></text></svg>
