<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 293" width="940" height="293" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Matriz de verificación: diez pruebas en dos plataformas</title><desc id="d">Barras horizontales con la duración de las diez pruebas del laboratorio, todas aprobadas: 0,257 segundos en Windows 11 con Python 3.12.9 y 1,710 segundos en Ubuntu 24.04 bajo WSL2 con Python 3.12.3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="293" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Matriz de verificación: diez pruebas en dos plataformas</tspan></text><line x1="243.12" y1="49" x2="243.12" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="243.12" y1="125" x2="243.12" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="243.12" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="243.12" dy="0">0</tspan></text><line x1="401.265" y1="49" x2="401.265" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="401.265" y1="125" x2="401.265" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="401.265" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="401.265" dy="0">0,5</tspan></text><line x1="559.41" y1="49" x2="559.41" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="559.41" y1="125" x2="559.41" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="559.41" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="559.41" dy="0">1</tspan></text><line x1="717.555" y1="49" x2="717.555" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="717.555" y1="125" x2="717.555" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="717.555" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717.555" dy="0">1,5</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="125" x2="875.7" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2</tspan></text><line x1="243.12" y1="125" x2="875.7" y2="125" stroke="#5b7280" stroke-width="1.6"/><text x="233.12" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="233.12" dy="0">Windows 11 · Python 3.12.9</tspan></text><text x="233.12" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="233.12" dy="0">Linux (WSL2) · Python 3.12.3</tspan></text><rect x="243.12" y="55" width="81.2865" height="26" rx="3" fill="#087f8c"/><text x="331.407" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="331.407" dy="0">0,257</tspan></text><rect x="243.12" y="93" width="540.856" height="26" rx="3" fill="#087f8c"/><text x="790.976" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="790.976" dy="0">1,710</tspan></text><text x="559.41" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="559.41" dy="0">segundos</tspan></text><rect x="10" y="183" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="207.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las diez pruebas cubren idempotencia de prepare, esquema y minimización de inspect, precedencia argumento &gt; entorno &gt;</tspan></text><text x="470" y="224.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">archivo &gt; default, secreto centinela redactado, corrupción → degraded y repair, clean acotado a lo propio y un workspace</tspan></text><text x="470" y="241.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ausente que nunca se crea; pasan en las dos plataformas. Una ejecución local no sustituye a la matriz de CI (Linux, Windows</tspan></text><text x="470" y="257.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y macOS): solo la matriz remota en verde demuestra compatibilidad.</tspan></text></svg>
