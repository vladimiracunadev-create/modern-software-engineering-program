<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una petición HTTPS a example.com descompuesta en fases (mediana de cinco)</title><desc id="d">Barras con una medición real: resolver el nombre tarda unos 9 ms desde caché, el handshake TCP unos 131 ms, TLS unos 146 ms y la espera de la respuesta unos 144 ms; el total ronda 430 ms. Cada fase cuesta aproximadamente un viaje de ida y vuelta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Fases acumuladas de curl -w (milisegundos)</tspan></text><text x="260" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">DNS (aplicación)</tspan></text><rect x="270" y="44" width="19.8" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="297.8" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="297.8" dy="0">9 ms</tspan></text><text x="260" y="113" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">TCP: SYN, SYN-ACK, ACK</tspan></text><rect x="270" y="92" width="288.2" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="566.2" y="113" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="566.2" dy="0">131 ms</tspan></text><text x="260" y="161" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">TLS 1.3: un viaje de ida y vuelta</tspan></text><rect x="270" y="140" width="321.2" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="599.2" y="161" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="599.2" dy="0">146 ms</tspan></text><text x="260" y="209" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">HTTP: solicitud y primer byte</tspan></text><rect x="270" y="188" width="316.8" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="594.8" y="209" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="594.8" dy="0">144 ms</tspan></text><rect x="20" y="252" width="900" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="282.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Ping al mismo destino: mínimo 129 ms, media 146 ms, máximo 176 ms, sin pérdida. Las tres fases de red duran cerca de un</tspan></text><text x="470" y="298.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">RTT cada una: tres viajes de ida y vuelta hacen unos 430 ms.</tspan></text><rect x="20" y="334" width="900" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="357.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La fase que se alarga indica la capa: DNS lento apunta al resolvedor, TCP lento a la ruta, TLS lento a la negociación, y</tspan></text><text x="470" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«espera» a la aplicación o al intermediario.</tspan></text><text x="470" y="416" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con curl, Python y ping desde un equipo concreto; los valores cambian con la red y la hora.</tspan></text></svg>
