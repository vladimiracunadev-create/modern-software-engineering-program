<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 389" width="960" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuando las capas «filtran»: tres observaciones reales</title><desc id="d">Tres fugas de capa observadas, cada una con la capa que parece responder y lo que ocurre en realidad: el servidor responde como cloudflare con Age 3521 (un intermediario sirve una copia de caché), alt-svc anuncia h3 (otro transporte) y un ping que responde no demuestra que el servicio funcione.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="389" fill="#ffffff"/><text x="140" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="140" dy="0">Observación</tspan></text><text x="436" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="436" dy="0">Qué capa parece responder</tspan></text><text x="776" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="776" dy="0">Qué ocurre en realidad</tspan></text><rect x="10" y="38" width="260" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">Server: cloudflare; Age: 3521</tspan></text><rect x="306" y="38" width="260" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="436" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="436" dy="0">Parece responder: el origen del</tspan></text><text x="436" y="87.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="436" dy="0">sitio</tspan></text><rect x="602" y="38" width="348" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="71.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Un intermediario (CDN) termina TLS y sirve</tspan></text><text x="776" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">una copia con 3521 s de antigüedad</tspan></text><polyline points="270,76 306,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,76 602,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132" width="260" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">alt-svc: h3=&quot;:443&quot;</tspan></text><rect x="306" y="132" width="260" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="436" y="165.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="436" dy="0">Parece responder: HTTP/1.1 sobre</tspan></text><text x="436" y="181.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="436" dy="0">TCP</tspan></text><rect x="602" y="132" width="348" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="165.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">El servidor ofrece HTTP/3 sobre QUIC (UDP)</tspan></text><text x="776" y="181.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">para próximas conexiones</tspan></text><polyline points="270,170 306,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,170 602,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="226" width="260" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="267.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">ping responde (TTL 56, 146 ms)</tspan></text><rect x="306" y="226" width="260" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="436" y="259.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="436" dy="0">Parece responder: el servicio</tspan></text><text x="436" y="275.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="436" dy="0">funciona</tspan></text><rect x="602" y="226" width="348" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="251" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Solo hay respuesta ICMP bajo esa ruta y</tspan></text><text x="776" y="267.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">política; DNS, puerto, TLS y HTTP no se</tspan></text><text x="776" y="284.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">probaron</tspan></text><polyline points="270,264 306,264" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,264 602,264" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="316" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Una conclusión sobre una capa necesita evidencia de esa capa: el contenido de la respuesta no prueba quién la generó, ni el</tspan></text><text x="480" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">éxito de una capa inferior prueba las superiores.</tspan></text></svg>
