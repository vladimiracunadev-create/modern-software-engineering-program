<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 507" width="960" height="507" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los modelos OSI y TCP/IP aplicados a una petición observada</title><desc id="d">Cinco capas apiladas de la aplicación al enlace; de cada una salen la evidencia real observada en una petición a example.com (estado HTTP 200, handshake TLS 1.3, conexión TCP, TTL 56 de IP y MTU 1500 del enlace) y lo que esa evidencia no demuestra.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="507" fill="#ffffff"/><text x="120" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="120" dy="0">Capa OSI (y su capa TCP/IP)</tspan></text><text x="446" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="446" dy="0">Evidencia observada</tspan></text><text x="806" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="806" dy="0">No demuestra</tspan></text><rect x="10" y="38" width="220" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="64.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">7 Aplicación (TCP/IP:</tspan></text><text x="120" y="80.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">Aplicación)</tspan></text><rect x="266" y="38" width="360" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446" y="72.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="446" dy="0">HTTP/1.1 200 OK; Content-Type text/html; 577 bytes</tspan></text><rect x="662" y="38" width="288" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="806" y="64.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="806" dy="0">Que el contenido sea el correcto para</tspan></text><text x="806" y="80.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="806" dy="0">la persona</tspan></text><polyline points="230,69 266,69" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="626,69 662,69" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="120,100 120,118" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="118" width="220" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="144.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">6 Presentación / 5 Sesión</tspan></text><text x="120" y="160.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">(TCP/IP: Aplicación)</tspan></text><rect x="266" y="118" width="360" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446" y="144.68" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="446" dy="0">TLS 1.3 con TLS_AES_256_GCM_SHA384; certificado</tspan></text><text x="446" y="160.04" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="446" dy="0">para example.com</tspan></text><rect x="662" y="118" width="288" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="806" y="144.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="806" dy="0">Que el servidor sea quien dice más allá</tspan></text><text x="806" y="160.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="806" dy="0">del nombre</tspan></text><polyline points="230,149 266,149" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="626,149 662,149" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="120,180 120,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="198" width="220" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="224.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">4 Transporte (TCP/IP:</tspan></text><text x="120" y="240.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">Transporte)</tspan></text><rect x="266" y="198" width="360" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446" y="232.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="446" dy="0">Conexión TCP al puerto 443 establecida en ≈131 ms</tspan></text><rect x="662" y="198" width="288" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="806" y="224.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="806" dy="0">Que la aplicación esté sana (solo que</tspan></text><text x="806" y="240.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="806" dy="0">el puerto escucha)</tspan></text><polyline points="230,229 266,229" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="626,229 662,229" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="120,260 120,278" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="278" width="220" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="312.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">3 Red (TCP/IP: Internet)</tspan></text><rect x="266" y="278" width="360" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446" y="312.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="446" dy="0">ping: TTL = 56 y RTT medio de 146 ms</tspan></text><rect x="662" y="278" width="288" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="806" y="304.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="806" dy="0">El número exacto de saltos: el TTL</tspan></text><text x="806" y="320.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="806" dy="0">inicial es desconocido</tspan></text><polyline points="230,309 266,309" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="626,309 662,309" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="120,340 120,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="358" width="220" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="384.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">2 Enlace / 1 Física (TCP/IP:</tspan></text><text x="120" y="400.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">Acceso a red)</tspan></text><rect x="266" y="358" width="360" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446" y="384.68" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="446" dy="0">MTU de 1500 en la interfaz; el límite de 1472</tspan></text><text x="446" y="400.04" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="446" dy="0">bytes de datos con DF activado</tspan></text><rect x="662" y="358" width="288" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="806" y="392.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="806" dy="0">Qué medio (cable, Wi-Fi) usa cada tramo</tspan></text><polyline points="230,389 266,389" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="626,389 662,389" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="434" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="458.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Los modelos son herramientas para ubicar una observación; una capa «ve» solo lo que su contrato le muestra, y varias capas</tspan></text><text x="480" y="475.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">pueden estar a cargo de componentes distintos.</tspan></text></svg>
