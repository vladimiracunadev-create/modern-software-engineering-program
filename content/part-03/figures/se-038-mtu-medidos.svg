<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 331" width="940" height="331" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">MTU medidos: la interfaz local, el enlace y la ruta</title><desc id="d">Barras horizontales en escala logarítmica con los MTU observados dentro de WSL2: 65 536 bytes en loopback y 1500 en eth0, más el límite de ruta de 1500 comprobado con ping y DF desde Windows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="331" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">MTU medidos: la interfaz local, el enlace y la ruta</tspan></text><line x1="197.88" y1="49" x2="197.88" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="197.88" y1="163" x2="197.88" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="197.88" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="197.88" dy="0">1 000</tspan></text><line x1="532.76" y1="49" x2="532.76" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="532.76" y1="163" x2="532.76" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="532.76" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532.76" dy="0">10 000</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="163" x2="867.64" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100 000</tspan></text><line x1="197.88" y1="163" x2="867.64" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="187.88" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="187.88" dy="0">Loopback (lo)</tspan></text><text x="187.88" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="187.88" dy="0">Interfaz eth0 de WSL2</tspan></text><text x="187.88" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="187.88" dy="0">Ruta hasta example.com</tspan></text><rect x="197.88" y="55" width="608.303" height="26" rx="3" fill="#087f8c"/><text x="813.183" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="813.183" dy="0">65 536</tspan></text><rect x="197.88" y="93" width="58.9694" height="26" rx="3" fill="#087f8c"/><text x="263.849" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="263.849" dy="0">1 500</tspan></text><rect x="197.88" y="131" width="58.9694" height="26" rx="3" fill="#087f8c"/><text x="263.849" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="263.849" dy="0">1 500</tspan></text><text x="532.76" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="532.76" dy="0">bytes (escala logarítmica)</tspan></text><rect x="10" y="221" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El loopback no sale a ningún medio: su límite es de software. En eth0 (ip -o link) el 1500 es el valor típico de Ethernet,</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y en la ruta se obtuvo porque ping -f -l 1472 funciona y 1473 no, así que ningún tramo reduce el MTU por debajo de 1500. El</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">MTU efectivo de una ruta es el mínimo de todos sus tramos: se descubre con una prueba (PMTU) y no se deduce de la interfaz</tspan></text><text x="470" y="295.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">local.</tspan></text></svg>
