<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clasificar direcciones: lo que informa el módulo ipaddress</title><desc id="d">Tabla de seis direcciones con el resultado de is_private: 10.1.2.3, 172.20.0.1 y 192.168.1.1 son privadas; 100.64.0.1 (espacio compartido de CGNAT) y 8.8.8.8 no lo son; 192.0.2.5 (documentación) se informa como privada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Dirección</tspan></text><rect x="210" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="277" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="277" dy="0">is_private</tspan></text><rect x="350" y="12" width="584" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Qué es realmente</tspan></text><rect x="10" y="56" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">10.1.2.3</tspan></text><rect x="210" y="56" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">Sí</tspan></text><rect x="350" y="56" width="584" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">Espacio privado de la RFC 1918</tspan></text><rect x="10" y="112" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">172.20.0.1</tspan></text><rect x="210" y="112" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">Sí</tspan></text><rect x="350" y="112" width="584" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">Dentro de 172.16.0.0/12 (RFC 1918)</tspan></text><rect x="10" y="168" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">192.168.1.1</tspan></text><rect x="210" y="168" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">Sí</tspan></text><rect x="350" y="168" width="584" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">Espacio privado de la RFC 1918</tspan></text><rect x="10" y="224" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">100.64.0.1</tspan></text><rect x="210" y="224" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">No</tspan></text><rect x="350" y="224" width="584" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">Espacio compartido de CGNAT (100.64.0.0/10): ni privado ni público</tspan></text><rect x="10" y="280" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="308.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">8.8.8.8</tspan></text><rect x="210" y="280" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">No</tspan></text><rect x="350" y="280" width="584" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">Dirección pública</tspan></text><rect x="10" y="336" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="364.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">192.0.2.5</tspan></text><rect x="210" y="336" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="364.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">Sí</tspan></text><rect x="350" y="336" width="584" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="364.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">Rango reservado para documentación (RFC 5737), no una red real</tspan></text><rect x="10" y="380" width="920" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="395.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«Privada» no significa «de mi red»: una misma dirección privada existe en millones de redes, y CGNAT rompe la suposición de que «no</tspan></text><text x="470" y="411.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">privada» es pública y única.</tspan></text></svg>
