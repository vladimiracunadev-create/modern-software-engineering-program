<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Aritmética de subredes calculada con ipaddress</title><desc id="d">Tabla con resultados reales: 192.0.2.0/24 tiene 254 direcciones de host y 192.0.2.64/26 tiene 62, entre .64 y .127; 192.0.2.70 pertenece a la /26 y 192.0.2.200 no; un /64 de IPv6 contiene 18 446 744 073 709 551 616 direcciones y 2001:0db8:...:0001 se comprime como 2001:db8::1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Consulta</tspan></text><rect x="340" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Resultado</tspan></text><rect x="600" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Cómo se calcula</tspan></text><rect x="10" y="56" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Hosts de 192.0.2.0/24</tspan></text><rect x="340" y="56" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">254</tspan></text><rect x="600" y="56" width="334" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="80.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">2^(32-24) = 256 direcciones, menos red y</tspan></text><text x="767" y="96.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">difusión</tspan></text><rect x="10" y="120" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Hosts de 192.0.2.64/26</tspan></text><rect x="340" y="120" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">62 (de .64 a .127)</tspan></text><rect x="600" y="120" width="334" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">2^(32-26) = 64 direcciones, menos 2</tspan></text><rect x="10" y="184" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">¿192.0.2.70 está en la /26? ¿y 192.0.2.200?</tspan></text><rect x="340" y="184" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Sí / No</tspan></text><rect x="600" y="184" width="334" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Comparar el prefijo de 26 bits</tspan></text><rect x="10" y="248" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="280.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Direcciones de un /64 de IPv6</tspan></text><rect x="340" y="248" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">18 446 744 073 709 551 616</tspan></text><rect x="600" y="248" width="334" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">2^(128-64)</tspan></text><rect x="10" y="312" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="344.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">2001:0db8:0000:...:0001 comprimida</tspan></text><rect x="340" y="312" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">2001:db8::1</tspan></text><rect x="600" y="312" width="334" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Se omiten ceros iniciales y un tramo de ceros</tspan></text><rect x="10" y="378" width="920" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="398.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La máscara decide qué es «local». Un error de un bit en el prefijo cambia el conjunto de direcciones alcanzables sin pasar</tspan></text><text x="470" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por el gateway.</tspan></text></svg>
