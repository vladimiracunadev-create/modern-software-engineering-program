<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estados TCP observados con ss durante una conexión local</title><desc id="d">Cuatro momentos observados en Linux: solo LISTEN; luego ESTAB en ambos extremos; cuando el cliente cierra primero, el servidor queda en CLOSE-WAIT y el cliente en FIN-WAIT-2; al cerrar el servidor queda un TIME-WAIT.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><rect x="14" y="20" width="222" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="125" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="125" dy="0">1 Escuchando</tspan></text><rect x="14" y="72" width="222" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="125" y="115.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="125" dy="0">LISTEN</tspan></text><polyline points="236,42 250,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="250" y="20" width="222" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="361" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="361" dy="0">2 Conectado</tspan></text><rect x="250" y="72" width="222" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="361" y="115.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="361" dy="0">ESTAB · ESTAB · LISTEN</tspan></text><polyline points="472,42 486,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="486" y="20" width="222" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">3 El cliente cerró</tspan></text><rect x="486" y="72" width="222" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="597" y="107.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="597" dy="0">CLOSE-WAIT · FIN-WAIT-2 ·</tspan></text><text x="597" y="123.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="597" dy="0">LISTEN</tspan></text><polyline points="708,42 722,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="20" width="222" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="833" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="833" dy="0">4 Ambos cerraron</tspan></text><rect x="722" y="72" width="222" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="833" y="115.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="833" dy="0">TIME-WAIT · LISTEN</tspan></text><rect x="14" y="176" width="930" height="78" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="479" y="210.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">CLOSE-WAIT en el servidor significa que el otro extremo cerró y la aplicación aún no cerró su lado: acumular CLOSE-WAIT</tspan></text><text x="479" y="226.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">indica conexiones que la aplicación no cierra.</tspan></text><rect x="14" y="266" width="930" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="479" y="304.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479" dy="0">TIME-WAIT lo mantiene quien cierra primero durante un tiempo para absorber paquetes tardíos; no es un error ni una fuga.</tspan></text><text x="480" y="366" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Observado con ss -tan en Ubuntu 24.04 (WSL2) sobre sockets locales; no se capturaron paquetes.</tspan></text></svg>
