<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 454" width="960" height="454" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">TCP no conserva fronteras de mensaje; UDP sí</title><desc id="d">Cuatro pruebas con su resultado y su lectura: dos envíos TCP de 4 y 6 bytes se leyeron juntos como AAAABBBBBB, mientras dos datagramas UDP se leyeron por separado; enviar un datagrama a un puerto cerrado no da error al emisor, y la lectura posterior produjo ConnectionResetError en Windows y un timeout en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="454" fill="#ffffff"/><text x="165" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="165" dy="0">Prueba</tspan></text><text x="501" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="501" dy="0">Resultado observado</tspan></text><text x="816" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="816" dy="0">Lectura</tspan></text><rect x="10" y="38" width="310" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="165" y="68.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">TCP: send(4 bytes) y send(6 bytes), una</tspan></text><text x="165" y="84.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">lectura</tspan></text><rect x="356" y="38" width="290" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="501" y="76.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="501" dy="0">«AAAABBBBBB» (10 bytes)</tspan></text><rect x="682" y="38" width="268" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="816" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">El flujo no tiene fronteras: la</tspan></text><text x="816" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">aplicación necesita longitud o</tspan></text><text x="816" y="93.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">delimitador</tspan></text><polyline points="320,73 356,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="646,73 682,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="126" width="310" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="165" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">UDP: dos datagramas, dos lecturas</tspan></text><rect x="356" y="126" width="290" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="501" y="164.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="501" dy="0">«AAAA» y «BBBBBB»</tspan></text><rect x="682" y="126" width="268" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="816" y="156.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">Cada datagrama conserva su</tspan></text><text x="816" y="172.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">frontera</tspan></text><polyline points="320,161 356,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="646,161 682,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="214" width="310" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="165" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">UDP: sendto a un puerto cerrado</tspan></text><rect x="356" y="214" width="290" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="501" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="501" dy="0">Devuelve 1 byte; sin error</tspan></text><rect x="682" y="214" width="268" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="816" y="244.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">El emisor no sabe si llegó: no hay</tspan></text><text x="816" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">confirmación</tspan></text><polyline points="320,249 356,249" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="646,249 682,249" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="302" width="310" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="165" y="340.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">UDP: lectura tras ese envío</tspan></text><rect x="356" y="302" width="290" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="501" y="332.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="501" dy="0">Windows: ConnectionResetError; Linux:</tspan></text><text x="501" y="348.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="501" dy="0">TimeoutError</tspan></text><rect x="682" y="302" width="268" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="816" y="332.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">El aviso de ICMP se entrega</tspan></text><text x="816" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">distinto por plataforma</tspan></text><polyline points="320,337 356,337" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="646,337 682,337" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="386" width="940" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="416.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El comportamiento de errores asíncronos de UDP no es portable: una aplicación no debe depender de él para detectar pérdida.</tspan></text></svg>
