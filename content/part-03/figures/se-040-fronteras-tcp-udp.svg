<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">TCP no conserva fronteras de mensaje; UDP sí</title><desc id="d">Tabla con resultados reales: dos envíos TCP de 4 y 6 bytes se leyeron juntos como AAAABBBBBB, mientras dos datagramas UDP se leyeron por separado; enviar un datagrama a un puerto cerrado no da error al emisor, y la lectura posterior produjo ConnectionResetError en Windows y un timeout en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Prueba</tspan></text><rect x="320" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Resultado observado</tspan></text><rect x="610" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Lectura</tspan></text><rect x="10" y="56" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="86.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">TCP: send(4 bytes) y send(6 bytes), una</tspan></text><text x="162" y="102.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">lectura</tspan></text><rect x="320" y="56" width="284" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="94.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">«AAAABBBBBB» (10 bytes)</tspan></text><rect x="610" y="56" width="334" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="86.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">El flujo no tiene fronteras: la aplicación</tspan></text><text x="777" y="102.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">necesita longitud o delimitador</tspan></text><rect x="10" y="132" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="170.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">UDP: dos datagramas, dos lecturas</tspan></text><rect x="320" y="132" width="284" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="170.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">«AAAA» y «BBBBBB»</tspan></text><rect x="610" y="132" width="334" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="170.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Cada datagrama conserva su frontera</tspan></text><rect x="10" y="208" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="246.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">UDP: sendto a un puerto cerrado</tspan></text><rect x="320" y="208" width="284" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="246.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">Devuelve 1 byte; sin error</tspan></text><rect x="610" y="208" width="334" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="238.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">El emisor no sabe si llegó: no hay</tspan></text><text x="777" y="254.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">confirmación</tspan></text><rect x="10" y="284" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="322.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">UDP: lectura tras ese envío</tspan></text><rect x="320" y="284" width="284" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="314.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">Windows: ConnectionResetError; Linux:</tspan></text><text x="462" y="330.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">TimeoutError</tspan></text><rect x="610" y="284" width="334" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="314.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">El aviso de ICMP se entrega distinto por</tspan></text><text x="777" y="330.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">plataforma</tspan></text><rect x="10" y="386" width="940" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="411.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El comportamiento de errores asíncronos de UDP no es portable: una aplicación no debe depender de él para detectar pérdida.</tspan></text></svg>
