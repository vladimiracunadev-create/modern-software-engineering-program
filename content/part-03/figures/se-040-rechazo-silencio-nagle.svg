<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rechazo, silencio y la espera de Nagle: tres mediciones</title><desc id="d">Panel 1: conectar a un puerto local cerrado produce ConnectionRefusedError en 0,06 ms en Linux y un TimeoutError de 2 s en Windows; un destino sin ruta produce timeout de 2 s. Panel 2: reutilizar una conexión HTTP en Linux tarda 44,1 ms por petición con dos escrituras, y 0,34 ms con TCP_NODELAY o una sola escritura.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><text x="20" y="26" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">1 · Conectar con un puerto cerrado o sin ruta (timeout de 2 s)</tspan></text><rect x="20" y="40" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="62.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Destino</tspan></text><rect x="320" y="40" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="62.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Linux (WSL2)</tspan></text><rect x="650" y="40" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="62.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Windows</tspan></text><rect x="20" y="84" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="112.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Puerto local cerrado</tspan></text><rect x="320" y="84" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="112.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">ConnectionRefusedError en 0,06 ms (RST)</tspan></text><rect x="650" y="84" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="112.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">TimeoutError tras 2000 ms</tspan></text><rect x="20" y="140" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="168.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">192.0.2.1:80 (sin ruta)</tspan></text><rect x="320" y="140" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="168.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">TimeoutError tras 2,0 s</tspan></text><rect x="650" y="140" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="168.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">TimeoutError tras 2,0 s</tspan></text><text x="20" y="220" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">2 · Una petición por conexión reutilizada (ms por petición, 60 repeticiones)</tspan></text><text x="270" y="257" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Linux: dos escrituras</tspan></text><rect x="280" y="236" width="264.72" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="552.72" y="257" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="552.72" dy="0">44,12 ms</tspan></text><text x="270" y="297" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Linux: TCP_NODELAY</tspan></text><rect x="280" y="276" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="292" y="297" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="292" dy="0">0,34 ms</tspan></text><text x="270" y="337" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Linux: una escritura con búfer</tspan></text><rect x="280" y="316" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="292" y="337" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="292" dy="0">0,31 ms</tspan></text><text x="270" y="377" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Windows: dos escrituras</tspan></text><rect x="280" y="356" width="4" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="292" y="377" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="292" dy="0">0,60 ms</tspan></text><rect x="20" y="410" width="920" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="436.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">En Linux, el algoritmo de Nagle retiene el segundo envío hasta recibir el ACK retrasado del primero (unos 40 ms). Se evita</tspan></text><text x="480" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">escribiendo cabeceras y cuerpo juntos o con TCP_NODELAY.</tspan></text></svg>
