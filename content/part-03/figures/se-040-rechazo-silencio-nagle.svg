<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rechazo, silencio y la espera de Nagle: tres mediciones</title><desc id="d">Panel 1: conectar a un puerto local cerrado produce ConnectionRefusedError en 0,06 ms en Linux y un TimeoutError de 2 s en Windows; un destino sin ruta produce timeout de 2 s en ambos. Panel 2: reutilizar una conexión HTTP en Linux tarda 44,1 ms por petición con dos escrituras, y 0,34 ms con TCP_NODELAY o una sola escritura.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><text x="20" y="26" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">1 · Conectar con un puerto cerrado o sin ruta (timeout de 2 s)</tspan></text><rect x="380" y="36" width="270" height="28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="515" y="53.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="515" dy="0">Linux (WSL2)</tspan></text><rect x="658" y="36" width="282" height="28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="799" y="53.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="799" dy="0">Windows</tspan></text><rect x="20" y="74" width="300" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="170" y="102.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="170" dy="0">Puerto local cerrado</tspan></text><rect x="370" y="69" width="580" height="60" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="320,99 370,99" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="380" y="74" width="270" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="515" y="94.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="515" dy="0">ConnectionRefusedError en 0,06 ms</tspan></text><text x="515" y="110.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="515" dy="0">(RST)</tspan></text><rect x="658" y="74" width="282" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="799" y="102.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">TimeoutError tras 2000 ms</tspan></text><rect x="20" y="138" width="300" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="170" y="166.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="170" dy="0">192.0.2.1:80 (sin ruta)</tspan></text><rect x="370" y="133" width="580" height="60" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="320,163 370,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="380" y="138" width="560" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="660" y="166.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="660" dy="0">TimeoutError tras 2,0 s en ambos</tspan></text><text x="20" y="220" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">2 · Una petición por conexión reutilizada (ms por petición, 60 repeticiones)</tspan></text><text x="270" y="257" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Linux: dos escrituras</tspan></text><rect x="280" y="236" width="264.72" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="552.72" y="257" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="552.72" dy="0">44,12 ms</tspan></text><text x="270" y="297" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Linux: TCP_NODELAY</tspan></text><rect x="280" y="276" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="292" y="297" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="292" dy="0">0,34 ms</tspan></text><text x="270" y="337" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Linux: una escritura con búfer</tspan></text><rect x="280" y="316" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="292" y="337" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="292" dy="0">0,31 ms</tspan></text><text x="270" y="377" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Windows: dos escrituras</tspan></text><rect x="280" y="356" width="4" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="292" y="377" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="292" dy="0">0,60 ms</tspan></text><rect x="20" y="410" width="920" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="436.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">En Linux, el algoritmo de Nagle retiene el segundo envío hasta recibir el ACK retrasado del primero (unos 40 ms). Se evita</tspan></text><text x="480" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">escribiendo cabeceras y cuerpo juntos o con TCP_NODELAY.</tspan></text></svg>
