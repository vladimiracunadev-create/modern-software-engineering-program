<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo nombre, dos entornos, respuestas distintas</title><desc id="d">Tabla con resultados reales de getaddrinfo: example.com devolvió 2 direcciones IPv4 en Windows y 4 direcciones (IPv4 e IPv6) en Linux; localhost devolvió 2 direcciones en Windows y 1 en Linux; un nombre inexistente produjo el código 11001 en Windows y -2 en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Consulta</tspan></text><rect x="310" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Windows</tspan></text><rect x="630" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Linux (WSL2)</tspan></text><rect x="10" y="56" width="294" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="96.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">example.com (puerto 443)</tspan></text><rect x="310" y="56" width="314" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="96.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">2 direcciones, solo IPv4</tspan></text><rect x="630" y="56" width="314" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="96.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">4 direcciones: IPv4 e IPv6</tspan></text><rect x="10" y="136" width="294" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="176.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">localhost</tspan></text><rect x="310" y="136" width="314" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">2 direcciones: IPv4 e IPv6</tspan></text><rect x="630" y="136" width="314" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1 dirección: IPv4</tspan></text><rect x="10" y="216" width="294" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="256.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">no-existe.invalid</tspan></text><rect x="310" y="216" width="314" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="256.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Errno 11001: getaddrinfo failed</tspan></text><rect x="630" y="216" width="314" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="256.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Errno -2: Name or service not known</tspan></text><rect x="10" y="330" width="920" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="365.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La resolución es una función del entorno: familias de direcciones, caché, resolvedor y códigos de error difieren. Un</tspan></text><text x="470" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">diagnóstico declara dónde se resolvió y con qué herramienta.</tspan></text></svg>
