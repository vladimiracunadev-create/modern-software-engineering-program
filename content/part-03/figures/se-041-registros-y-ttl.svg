ze="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">La ausencia también se guarda en caché (RFC</tspan></text><text x="767" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">2308)</tspan></text><rect x="10" y="392" width="920" height="36" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="413.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El TTL que ves es el tiempo restante en la caché del resolvedor, no el TTL configurado en la zona.</tspan></text></svg>
