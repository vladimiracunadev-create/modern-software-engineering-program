<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 578" width="960" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Métodos y estados: lo que respondió el servidor</title><desc id="d">Siete peticiones con el estado que respondió el servidor y su lectura: GET 200 con 577 bytes, HEAD 200 sin cuerpo, POST y OPTIONS 405, una ruta inexistente 404, una petición condicional con If-Modified-Since 304, y un 503 con Retry-After de 1 segundo en un servidor local.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="578" fill="#ffffff"/><text x="140" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="140" dy="0">Petición</tspan></text><text x="401" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="401" dy="0">Estado</tspan></text><text x="741" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="741" dy="0">Lectura</tspan></text><rect x="10" y="38" width="260" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="66.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">GET /</tspan></text><rect x="306" y="38" width="190" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="401" y="66.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="401" dy="0">200 (577 B)</tspan></text><rect x="532" y="38" width="418" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="741" y="66.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="741" dy="0">Representación del recurso</tspan></text><polyline points="270,63 306,63" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="496,63 532,63" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="106" width="260" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">HEAD /</tspan></text><rect x="306" y="106" width="190" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="401" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="401" dy="0">200 (0 B de cuerpo)</tspan></text><rect x="532" y="106" width="418" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="741" y="126.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="741" dy="0">Mismas cabeceras, sin cuerpo: sirve para comprobar</tspan></text><text x="741" y="142.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="741" dy="0">existencia y tamaño</tspan></text><polyline points="270,131 306,131" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="496,131 532,131" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="174" width="260" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="202.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">POST /</tspan></text><rect x="306" y="174" width="190" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="401" y="202.36" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="401" dy="0">405</tspan></text><rect x="532" y="174" width="418" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="741" y="202.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="741" dy="0">El método existe pero este recurso no lo admite</tspan></text><polyline points="270,199 306,199" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="496,199 532,199" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="242" width="260" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="270.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">OPTIONS /</tspan></text><rect x="306" y="242" width="190" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="401" y="270.36" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="401" dy="0">405</tspan></text><rect x="532" y="242" width="418" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="741" y="270.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="741" dy="0">El servidor no anuncia métodos con OPTIONS</tspan></text><polyline points="270,267 306,267" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="496,267 532,267" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="310" width="260" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="338.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">GET /no-existe</tspan></text><rect x="306" y="310" width="190" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="401" y="338.36" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="401" dy="0">404</tspan></text><rect x="532" y="310" width="418" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="741" y="338.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="741" dy="0">No hay recurso en esa ruta</tspan></text><polyline points="270,335 306,335" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="496,335 532,335" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="378" width="260" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="406.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">GET / con If-Modified-Since</tspan></text><rect x="306" y="378" width="190" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="401" y="406.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="401" dy="0">304</tspan></text><rect x="532" y="378" width="418" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="741" y="398.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="741" dy="0">No modificado: no se retransmite el cuerpo (ahorro de 577</tspan></text><text x="741" y="414.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="741" dy="0">B)</tspan></text><polyline points="270,403 306,403" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="496,403 532,403" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="446" width="260" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="474.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">GET /503 (servidor local)</tspan></text><rect x="306" y="446" width="190" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="401" y="474.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="401" dy="0">503 + Retry-After: 1</tspan></text><rect x="532" y="446" width="418" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="741" y="466.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="741" dy="0">Indisponibilidad temporal con una pista de cuándo</tspan></text><text x="741" y="482.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="741" dy="0">reintentar</tspan></text><polyline points="270,471 306,471" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="496,471 532,471" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="510" width="940" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="540.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El número de estado es una decisión del servidor sobre el recurso, no un reflejo del éxito del negocio.</tspan></text></svg>
