<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Métodos y estados: lo que respondió el servidor</title><desc id="d">Tabla con resultados reales: GET 200 con 577 bytes, HEAD 200 sin cuerpo, POST y OPTIONS 405, una ruta inexistente 404, una petición condicional con If-Modified-Since 304, y un 503 con Retry-After de 1 segundo en un servidor local.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Petición</tspan></text><rect x="270" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">Estado</tspan></text><rect x="460" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">Lectura</tspan></text><rect x="10" y="56" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">GET /</tspan></text><rect x="270" y="56" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">200 (577 B)</tspan></text><rect x="460" y="56" width="474" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Representación del recurso</tspan></text><rect x="10" y="112" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">HEAD /</tspan></text><rect x="270" y="112" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">200 (0 B de cuerpo)</tspan></text><rect x="460" y="112" width="474" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="132.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Mismas cabeceras, sin cuerpo: sirve para comprobar existencia y</tspan></text><text x="697" y="148.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">tamaño</tspan></text><rect x="10" y="168" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">POST /</tspan></text><rect x="270" y="168" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">405</tspan></text><rect x="460" y="168" width="474" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">El método existe pero este recurso no lo admite</tspan></text><rect x="10" y="224" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">OPTIONS /</tspan></text><rect x="270" y="224" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">405</tspan></text><rect x="460" y="224" width="474" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">El servidor no anuncia métodos con OPTIONS</tspan></text><rect x="10" y="280" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">GET /no-existe</tspan></text><rect x="270" y="280" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">404</tspan></text><rect x="460" y="280" width="474" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">No hay recurso en esa ruta</tspan></text><rect x="10" y="336" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="364.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">GET / con If-Modified-Since</tspan></text><rect x="270" y="336" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="364.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">304</tspan></text><rect x="460" y="336" width="474" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="364.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">No modificado: no se retransmite el cuerpo (ahorro de 577 B)</tspan></text><rect x="10" y="392" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="420.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">GET /503 (servidor local)</tspan></text><rect x="270" y="392" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="420.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">503 + Retry-After: 1</tspan></text><rect x="460" y="392" width="474" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="420.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Indisponibilidad temporal con una pista de cuándo reintentar</tspan></text><rect x="10" y="430" width="940" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="450.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El número de estado es una decisión del servidor sobre el recurso, no un reflejo del éxito del negocio.</tspan></text></svg>
