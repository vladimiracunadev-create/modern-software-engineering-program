<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que muestra una conexión TLS real a example.com</title><desc id="d">Tabla con los datos observados: TLS 1.3 con TLS_AES_256_GCM_SHA384, certificado con CN example.com y nombres alternativos example.com y *.example.com, emisor SSL Corporation, validez del 26 de septiembre al 25 de diciembre de 2026 (90 días), cadena de tres certificados más la raíz.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Dato</tspan></text><rect x="200" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="407" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407" dy="0">Valor observado</tspan></text><rect x="620" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Qué demuestra</tspan></text><rect x="10" y="56" width="184" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="94.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Versión y cifrado</tspan></text><rect x="200" y="56" width="414" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="94.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">TLS 1.3 · TLS_AES_256_GCM_SHA384</tspan></text><rect x="620" y="56" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="86.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">La sesión usa cifrado autenticado y claves</tspan></text><text x="782" y="102.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">efímeras</tspan></text><rect x="10" y="132" width="184" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="170.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Nombre del certificado</tspan></text><rect x="200" y="132" width="414" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="170.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">CN = example.com; SAN: example.com, *.example.com</tspan></text><rect x="620" y="132" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="162.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">El nombre que el cliente verifica es el de la</tspan></text><text x="782" y="178.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">SAN, no solo el CN</tspan></text><rect x="10" y="208" width="184" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="246.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Validez</tspan></text><rect x="200" y="208" width="414" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="246.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">26 sep 2026 → 25 dic 2026 (90 días)</tspan></text><rect x="620" y="208" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="238.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Los certificados modernos son de vida corta;</tspan></text><text x="782" y="254.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">hay que renovarlos</tspan></text><rect x="10" y="284" width="184" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="322.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Cadena presentada</tspan></text><rect x="200" y="284" width="414" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="314.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">hoja → Cloudflare TLS Issuing ECC CA 3 → SSL.com TLS</tspan></text><text x="407" y="330.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">Transit ECC CA R2 → raíz SSL.com TLS ECC Root CA 2022</tspan></text><rect x="620" y="284" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="314.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Confianza por cadena hasta una raíz que el</tspan></text><text x="782" y="330.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">cliente ya tiene</tspan></text><rect x="10" y="360" width="184" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="398.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Handshake</tspan></text><rect x="200" y="360" width="414" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="398.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">≈145 ms (un viaje de ida y vuelta)</tspan></text><rect x="620" y="360" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="398.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">TLS 1.3 completa la negociación en un RTT</tspan></text><rect x="10" y="420" width="940" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="443.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El certificado prueba que el servidor controla el nombre, no que sea digno de confianza ni que su contenido sea correcto.</tspan></text></svg>
