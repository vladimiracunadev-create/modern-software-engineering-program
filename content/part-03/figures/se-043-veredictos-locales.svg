<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 459" width="960" height="459" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro veredictos locales con un certificado de laboratorio</title><desc id="d">Cuatro intentos reales contra un servidor TLS local con certificado autofirmado, cada uno con su veredicto: sin confianza falla con self-signed certificate (código 18); con la CA del laboratorio funciona con TLS 1.3 y ALPN h2 en 3 ms; con otro nombre falla con Hostname mismatch (código 62); con la verificación desactivada funciona, pero sin protección.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="459" fill="#ffffff"/><text x="135" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="135" dy="0">Intento</tspan></text><text x="446" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="446" dy="0">Veredicto</tspan></text><text x="791" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="791" dy="0">Lectura</tspan></text><rect x="10" y="38" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Sin confiar en el certificado</tspan></text><rect x="296" y="38" width="300" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="446" y="68.68" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="446" dy="0">Falla: self-signed certificate (código</tspan></text><text x="446" y="84.04" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="446" dy="0">18)</tspan></text><rect x="632" y="38" width="318" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">La cadena no llega a una raíz de confianza</tspan></text><polyline points="260,73 296,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,73 632,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="126" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Confiando en la CA del laboratorio</tspan></text><rect x="296" y="126" width="300" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446" y="164.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="446" dy="0">Funciona: TLS 1.3 · ALPN h2 · 3,0 ms</tspan></text><rect x="632" y="126" width="318" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Confianza explícita y nombre correcto</tspan></text><polyline points="260,161 296,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,161 632,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="214" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Nombre «otro.example»</tspan></text><rect x="296" y="214" width="300" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="446" y="244.68" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="446" dy="0">Falla: Hostname mismatch, el certificado</tspan></text><text x="446" y="260.04" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="446" dy="0">no es válido para ese nombre (código 62)</tspan></text><rect x="632" y="214" width="318" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="244.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">La cadena es válida pero el nombre no</tspan></text><text x="791" y="260.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">coincide</tspan></text><polyline points="260,249 296,249" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,249 632,249" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="302" width="250" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="340.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Verificación desactivada</tspan></text><rect x="296" y="302" width="300" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="446" y="332.68" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="446" dy="0">Funciona sin verificar: TLS 1.3 (sin</tspan></text><text x="446" y="348.04" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="446" dy="0">ALPN)</tspan></text><rect x="632" y="302" width="318" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="332.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Cifra pero no autentica: cualquiera puede</tspan></text><text x="791" y="348.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">suplantar al servidor</tspan></text><polyline points="260,337 296,337" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,337 632,337" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="386" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="410.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Desactivar la verificación «para que funcione» elimina la propiedad que TLS ofrece frente a un atacante activo. Se corrige la</tspan></text><text x="480" y="427.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">confianza o el nombre, no la prueba.</tspan></text></svg>
