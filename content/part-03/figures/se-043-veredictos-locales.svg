<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro veredictos locales con un certificado de laboratorio</title><desc id="d">Tabla con cuatro intentos reales contra un servidor TLS local con certificado autofirmado: sin confianza falla con self-signed certificate (código 18); con la CA del laboratorio funciona con TLS 1.3 y ALPN h2 en 3 ms; con otro nombre falla con Hostname mismatch (código 62); con la verificación desactivada funciona, pero sin protección.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Intento</tspan></text><rect x="260" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">Resultado</tspan></text><rect x="600" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Código</tspan></text><rect x="690" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Lectura</tspan></text><rect x="10" y="56" width="244" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="92.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Sin confiar en el certificado</tspan></text><rect x="260" y="56" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">self-signed certificate</tspan></text><rect x="600" y="56" width="84" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">18</tspan></text><rect x="690" y="56" width="254" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="84.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">La cadena no llega a una raíz de</tspan></text><text x="817" y="100.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">confianza</tspan></text><rect x="10" y="128" width="244" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="156.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Confiando en la CA del</tspan></text><text x="132" y="172.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">laboratorio</tspan></text><rect x="260" y="128" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">OK · TLS 1.3 · ALPN h2 · 3,0 ms</tspan></text><rect x="600" y="128" width="84" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">—</tspan></text><rect x="690" y="128" width="254" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="156.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Confianza explícita y nombre</tspan></text><text x="817" y="172.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">correcto</tspan></text><rect x="10" y="200" width="244" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Nombre «otro.example»</tspan></text><rect x="260" y="200" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="228.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">Hostname mismatch: el certificado no es válido</tspan></text><text x="427" y="244.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">para ese nombre</tspan></text><rect x="600" y="200" width="84" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">62</tspan></text><rect x="690" y="200" width="254" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="228.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">La cadena es válida pero el nombre</tspan></text><text x="817" y="244.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">no coincide</tspan></text><rect x="10" y="272" width="244" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Verificación desactivada</tspan></text><rect x="260" y="272" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">OK · TLS 1.3 (sin ALPN)</tspan></text><rect x="600" y="272" width="84" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">—</tspan></text><rect x="690" y="272" width="254" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="293" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Cifra pero no autentica:</tspan></text><text x="817" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">cualquiera puede suplantar al</tspan></text><text x="817" y="323.72" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">servidor</tspan></text><rect x="10" y="376" width="940" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="399.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Desactivar la verificación «para que funcione» elimina la propiedad que TLS ofrece frente a un atacante activo. Se corrige la</tspan></text><text x="480" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">confianza o el nombre, no la prueba.</tspan></text></svg>
