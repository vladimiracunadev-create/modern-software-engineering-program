<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se observa y qué queda oculto detrás de una CDN</title><desc id="d">Cuatro observaciones desde el cliente (Server cloudflare, Age 3521, alt-svc h3, un certificado de una CA intermedia, el RTT al nodo y la antigüedad de la respuesta) frente a lo que queda al otro lado de la frontera de la CDN: el origen, su certificado, el nodo de borde y la última validación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><text x="225" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="225" dy="0">Observable desde el cliente</tspan></text><text x="735" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="735" dy="0">No observable</tspan></text><line x1="480" y1="36" x2="480" y2="340" stroke="#c0432f" stroke-width="2" stroke-dasharray="5 4"/><text x="480" y="358" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="480" dy="0">frontera de la CDN</tspan></text><rect x="10" y="44" width="430" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="225" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="225" dy="0">Server: cloudflare · Age: 3521 s · alt-svc: h3</tspan></text><rect x="520" y="44" width="430" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="735" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="735" dy="0">Qué servidor de origen existe y en qué región</tspan></text><polyline points="440,74 520,74" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="122" width="430" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="225" y="147.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="225" dy="0">Un certificado de 90 días para example.com emitido por</tspan></text><text x="225" y="163.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="225" dy="0">una CA intermedia</tspan></text><rect x="520" y="122" width="430" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="735" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="735" dy="0">Si el tráfico hacia el origen también va cifrado</tspan></text><polyline points="440,152 520,152" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="200" width="430" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="225" y="233.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="225" dy="0">RTT medio de 146 ms hasta el nodo que responde</tspan></text><rect x="520" y="200" width="430" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="735" y="233.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="735" dy="0">En qué nodo de borde cayó la petición</tspan></text><polyline points="440,230 520,230" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="278" width="430" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="225" y="311.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="225" dy="0">La respuesta tenía 3521 s de antigüedad</tspan></text><rect x="520" y="278" width="430" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="735" y="311.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="735" dy="0">Cuándo fue la última validación con el origen</tspan></text><polyline points="440,308 520,308" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="376" width="940" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="401.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una CDN es un intermediario: reduce latencia y carga, pero añade capas en las que pueden fallar la caché, el certificado o las</tspan></text><text x="480" y="417.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">cabeceras. Diagnosticar exige conocer cuál respondió.</tspan></text></svg>
