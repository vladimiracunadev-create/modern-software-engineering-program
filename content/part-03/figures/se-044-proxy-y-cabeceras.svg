<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién puede afirmar la IP del cliente: origen directo frente a proxy</title><desc id="d">Tabla con una prueba local: una petición con X-Forwarded-For falso 203.0.113.99 enviada directamente al origen se acepta tal cual; enviada a través del proxy, el proxy sustituye la cabecera por la IP real 127.0.0.1, conserva el identificador de petición abc-123 y añade Via.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Camino</tspan></text><rect x="260" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">X-Forwarded-For que ve el origen</tspan></text><rect x="590" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">X-Request-Id</tspan></text><rect x="780" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Via</tspan></text><rect x="10" y="56" width="244" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="102.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Cliente → origen (directo)</tspan></text><rect x="260" y="56" width="324" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="102.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">203.0.113.99 (falsificado por el cliente)</tspan></text><rect x="590" y="56" width="184" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="102.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">—</tspan></text><rect x="780" y="56" width="164" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="102.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">—</tspan></text><rect x="10" y="148" width="244" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="194.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Cliente → proxy → origen</tspan></text><rect x="260" y="148" width="324" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="186.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">127.0.0.1 (la dirección real vista por el</tspan></text><text x="422" y="202.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">proxy)</tspan></text><rect x="590" y="148" width="184" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="194.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">abc-123 (propagado)</tspan></text><rect x="780" y="148" width="164" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="194.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">1.1 proxy-local</tspan></text><rect x="10" y="260" width="940" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Una cabecera reenviada solo es confiable si la fija un componente de confianza y el origen rechaza o sobrescribe lo que llega</tspan></text><text x="480" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">de fuera de esa frontera.</tspan></text><rect x="10" y="350" width="940" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="378.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La política: el borde descarta las cabeceras entrantes de identidad, fija las suyas y el origen solo acepta conexiones del</tspan></text><text x="480" y="394.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">proxy.</tspan></text></svg>
