<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ciclo de vida de un socket y tiempos límite</title><desc id="d">Fases de un socket: crear, conectar o escuchar, intercambiar datos con framing, cerrar con una política y esperar con un tiempo límite; una lectura con timeout de 0,1 s contra un servidor lento lanzó TimeoutError a los 0,1 s.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><rect x="14" y="20" width="216" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Crear y conectar</tspan></text><rect x="14" y="72" width="216" height="120" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="122" y="127.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122" dy="0">connect con timeout de</tspan></text><text x="122" y="143.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122" dy="0">conexión</tspan></text><polyline points="230,42 244,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="244" y="20" width="216" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="352" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352" dy="0">Intercambiar</tspan></text><rect x="244" y="72" width="216" height="120" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352" y="120" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="352" dy="0">framing: longitud o</tspan></text><text x="352" y="135.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="352" dy="0">delimitador; el flujo no</tspan></text><text x="352" y="150.72" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="352" dy="0">tiene fronteras</tspan></text><polyline points="460,42 474,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="474" y="20" width="216" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Esperar</tspan></text><rect x="474" y="72" width="216" height="120" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="582" y="127.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="582" dy="0">timeout de lectura: 0,1 s →</tspan></text><text x="582" y="143.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="582" dy="0">TimeoutError a los 0,1 s</tspan></text><polyline points="690,42 704,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="704" y="20" width="216" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Cerrar</tspan></text><rect x="704" y="72" width="216" height="120" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="812" y="127.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="812" dy="0">shutdown o close; el otro</tspan></text><text x="812" y="143.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="812" dy="0">lado observa FIN y CLOSE-WAIT</tspan></text><rect x="14" y="216" width="920" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="474" y="246.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="474" dy="0">Tres tiempos distintos: conexión, lectura y plazo total. Un timeout dice cuánto se esperó, no si el servidor ejecutó la</tspan></text><text x="474" y="262.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="474" dy="0">operación.</tspan></text><rect x="14" y="298" width="920" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="474" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="474" dy="0">Una conexión en CLOSE-WAIT acumulada es un cierre que la aplicación no completó.</tspan></text></svg>
