<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 424" width="940" height="424" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reutilizar la conexión: cuánto ahorra y cuándo no</title><desc id="d">Barras horizontales en escala logarítmica con mediciones en loopback: en Windows abrir una conexión por petición tardó 1,396 ms y reutilizarla 0,366 ms (3,8 veces menos); en Linux la reutilización tardó 44,12 ms con dos escrituras por respuesta y 0,31 ms con una sola.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="424" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reutilizar la conexión: cuánto ahorra y cuándo no</tspan></text><line x1="288.36" y1="49" x2="288.36" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="288.36" y1="239" x2="288.36" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="288.36" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.36" dy="0">0,1</tspan></text><line x1="484.14" y1="49" x2="484.14" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="484.14" y1="239" x2="484.14" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="484.14" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="484.14" dy="0">1</tspan></text><line x1="679.92" y1="49" x2="679.92" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="679.92" y1="239" x2="679.92" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="679.92" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="679.92" dy="0">10</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="239" x2="875.7" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="288.36" y1="239" x2="875.7" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="278.36" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="278.36" dy="0">Windows: una conexión por petición</tspan></text><text x="278.36" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="278.36" dy="0">Windows: conexión reutilizada</tspan></text><text x="278.36" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="278.36" dy="0">Linux: reutilizada, dos escrituras</tspan></text><text x="278.36" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="278.36" dy="0">Linux: reutilizada, una escritura</tspan></text><text x="278.36" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="278.36" dy="0">Linux: reutilizada, TCP_NODELAY</tspan></text><rect x="288.36" y="55" width="224.146" height="26" rx="3" fill="#087f8c"/><text x="519.506" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="519.506" dy="0">1,396</tspan></text><rect x="288.36" y="93" width="110.318" height="26" rx="3" fill="#087f8c"/><text x="405.678" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="405.678" dy="0">0,366</tspan></text><rect x="288.36" y="131" width="517.767" height="26" rx="3" fill="#087f8c"/><text x="813.127" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="813.127" dy="0">44,12</tspan></text><rect x="288.36" y="169" width="96.1988" height="26" rx="3" fill="#087f8c"/><text x="391.559" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="391.559" dy="0">0,31</tspan></text><rect x="288.36" y="207" width="104.053" height="26" rx="3" fill="#087f8c"/><text x="399.413" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="399.413" dy="0">0,34</tspan></text><text x="582.03" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="582.03" dy="0">ms por petición (escala logarítmica)</tspan></text><rect x="10" y="297" width="920" height="109.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En Windows, abrir una conexión por petición incluye el handshake TCP en cada una y reutilizarla ahorra el handshake y el</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">arranque lento (3,8 veces menos). En Linux, con cabeceras y cuerpo en dos escrituras, Nagle y el ACK retrasado añaden ≈ 40</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ms por petición; con una sola escritura o TCP_NODELAY la espera desaparece y la reutilización vuelve a ayudar. Reutilizar</tspan></text><text x="470" y="371.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">conexiones es casi siempre una ventaja, pero un detalle del envío puede anularla: se mide con tu servidor real antes de</tspan></text><text x="470" y="388.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">generalizar.</tspan></text></svg>
