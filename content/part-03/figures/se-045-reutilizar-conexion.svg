<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reutilizar la conexión: cuánto ahorra y cuándo no</title><desc id="d">Tabla con mediciones en loopback: en Windows abrir una conexión por petición tardó 1,396 ms y reutilizarla 0,366 ms (3,8 veces menos); en Linux la reutilización tardó 44,1 ms con dos escrituras por respuesta y 0,31 ms con una sola.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Medición</tspan></text><rect x="340" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Resultado</tspan></text><rect x="560" y="12" width="384" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Windows: una conexión por petición</tspan></text><rect x="340" y="56" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">1,396 ms</tspan></text><rect x="560" y="56" width="384" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Incluye el handshake TCP en cada petición</tspan></text><rect x="10" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Windows: conexión reutilizada</tspan></text><rect x="340" y="126" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">0,366 ms (3,8 veces menos)</tspan></text><rect x="560" y="126" width="384" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">El ahorro del handshake y del arranque lento</tspan></text><rect x="10" y="196" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="223.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Linux: reutilizada, cabeceras y cuerpo en dos</tspan></text><text x="172" y="239.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">escrituras</tspan></text><rect x="340" y="196" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">44,12 ms</tspan></text><rect x="560" y="196" width="384" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Nagle + ACK retrasado: ≈ 40 ms de espera por petición</tspan></text><rect x="10" y="266" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="293.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Linux: reutilizada, una sola escritura o</tspan></text><text x="172" y="309.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">TCP_NODELAY</tspan></text><rect x="340" y="266" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="301.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">0,31 ms / 0,34 ms</tspan></text><rect x="560" y="266" width="384" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="301.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Sin espera: la reutilización vuelve a ayudar</tspan></text><rect x="10" y="352" width="920" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="379.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Reutilizar conexiones es casi siempre una ventaja, pero un detalle del envío puede anularla. Se mide con tu servidor real</tspan></text><text x="470" y="395.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">antes de generalizar.</tspan></text></svg>
