<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 454" width="960" height="454" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde se observa: cada punto de vista ve algo distinto</title><desc id="d">Cuatro puntos de observación, cada uno con lo que ve y lo que no ve: el cliente (curl -w), el servidor (registros), el sistema operativo (ss) y la red (captura de paquetes, no ejecutada aquí); el color del centro indica si se midió, se simuló en el laboratorio o no se ejecutó.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="454" fill="#ffffff"/><text x="145" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="145" dy="0">Punto de observación</tspan></text><text x="451" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="451" dy="0">Qué ve</tspan></text><text x="786" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="786" dy="0">Qué no ve</tspan></text><rect x="10" y="38" width="270" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="68.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">Cliente (curl -w, temporizadores) ·</tspan></text><text x="145" y="84.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">medido</tspan></text><rect x="316" y="38" width="270" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="451" y="76.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="451" dy="0">Ve las fases: DNS, TCP, TLS, espera</tspan></text><rect x="622" y="38" width="328" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="786" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">No ve qué ocurrió en el servidor</tspan></text><polyline points="280,73 316,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="586,73 622,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="126" width="270" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="156.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">Servidor (registros con request ID) ·</tspan></text><text x="145" y="172.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">laboratorio local</tspan></text><rect x="316" y="126" width="270" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="451" y="156.68" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="451" dy="0">Ve cuándo llegó y cuánto tardó el</tspan></text><text x="451" y="172.04" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="451" dy="0">procesamiento</tspan></text><rect x="622" y="126" width="328" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="786" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">No ve lo que pasó antes de llegar</tspan></text><polyline points="280,161 316,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="586,161 622,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="214" width="270" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">Sistema operativo (ss -tan) · medido</tspan></text><rect x="316" y="214" width="270" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="451" y="244.68" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="451" dy="0">Ve los estados de conexión: ESTAB,</tspan></text><text x="451" y="260.04" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="451" dy="0">CLOSE-WAIT, TIME-WAIT</tspan></text><rect x="622" y="214" width="328" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="786" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">No ve el contenido ni los tiempos de red</tspan></text><polyline points="280,249 316,249" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="586,249 622,249" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="302" width="270" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="332.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">Red (captura de paquetes) · no</tspan></text><text x="145" y="348.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">ejecutado</tspan></text><rect x="316" y="302" width="270" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="451" y="332.68" font-size="12" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="451" dy="0">Vería segmentos, retransmisiones y</tspan></text><text x="451" y="348.04" font-size="12" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="451" dy="0">ventanas</tspan></text><rect x="622" y="302" width="328" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="786" y="332.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">No ve el resultado de negocio; exige permisos</tspan></text><text x="786" y="348.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="786" dy="0">y cuida la privacidad</tspan></text><polyline points="280,337 316,337" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="586,337 622,337" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="386" width="940" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="416.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una captura no era necesaria para este diagnóstico; cuando lo es, se limita interfaz, destino, tiempo y campos.</tspan></text></svg>
