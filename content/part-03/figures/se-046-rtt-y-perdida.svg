<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ida y vuelta y pérdida: ping y pruebas dirigidas</title><desc id="d">Tabla con diez pings reales a example.com: sin pérdida, RTT mínimo 129 ms, medio 146 ms y máximo 176 ms; con la bandera DF, los paquetes de 1372 y 1472 bytes pasaron en 143 y 164 ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Prueba</tspan></text><rect x="270" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Resultado</tspan></text><rect x="650" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Lectura</tspan></text><rect x="10" y="56" width="254" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="95.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">ping × 10 (ICMP)</tspan></text><rect x="270" y="56" width="374" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="87.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">0 % perdidos · mín 129 ms · media 146 ms · máx 176</tspan></text><text x="457" y="103.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">ms</tspan></text><rect x="650" y="56" width="294" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="87.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">El RTT varía unos 47 ms entre mínimo y</tspan></text><text x="797" y="103.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">máximo</tspan></text><rect x="10" y="134" width="254" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="173.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">ping con DF, 1372 y 1472 B</tspan></text><rect x="270" y="134" width="374" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="173.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">143 ms y 164 ms</tspan></text><rect x="650" y="134" width="294" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="165.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">El tamaño no cambia la latencia de forma</tspan></text><text x="797" y="181.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">notable en este rango</tspan></text><rect x="10" y="212" width="254" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="243.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Ruta sin respuesta (modelo del</tspan></text><text x="137" y="259.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">laboratorio)</tspan></text><rect x="270" y="212" width="374" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="251.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Timeout de conexión</tspan></text><rect x="650" y="212" width="294" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="243.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Sin respuesta no distingue pérdida,</tspan></text><text x="797" y="259.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">filtrado o ruta rota</tspan></text><rect x="10" y="320" width="920" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="347.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ICMP puede recibir un trato distinto del tráfico de aplicación: el RTT de ping orienta, pero la latencia de la aplicación</tspan></text><text x="470" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se mide con la aplicación.</tspan></text></svg>
