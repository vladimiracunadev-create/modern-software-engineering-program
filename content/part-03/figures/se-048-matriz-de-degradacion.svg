<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 389" width="960" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Matriz sana, degradada y recuperada</title><desc id="d">Tres estados del servicio, cada uno con su señal, la respuesta del cliente y la evidencia: sano, degradado con reintento que se recupera y fallido con mensaje por fase.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="389" fill="#ffffff"/><text x="155" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="155" dy="0">Estado y señal</tspan></text><text x="466" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="466" dy="0">Respuesta del cliente</tspan></text><text x="791" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="791" dy="0">Evidencia</tspan></text><rect x="10" y="38" width="290" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">Sano. Señal: 200 en el primer intento</tspan></text><rect x="336" y="38" width="260" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="466" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="466" dy="0">Sin reintento</tspan></text><rect x="632" y="38" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">healthy: dns → connect → http</tspan></text><polyline points="300,76 336,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,76 632,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132" width="290" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="165.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">Degradado y recuperado. Señal: 503 o</tspan></text><text x="155" y="181.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">pérdida transitoria</tspan></text><rect x="336" y="132" width="260" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="466" y="173.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="466" dy="0">Reintento acotado con retroceso</tspan></text><rect x="632" y="132" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="165.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">http_503 y transient_loss: 2 intentos,</tspan></text><text x="791" y="181.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">recovered</tspan></text><polyline points="300,170 336,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,170 632,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="226" width="290" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="259.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">Fallido por fase. Señal: DNS,</tspan></text><text x="155" y="275.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">rechazo, nombre TLS o plazo</tspan></text><rect x="336" y="226" width="260" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="466" y="259.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="466" dy="0">Sin reintento ciego; mensaje con</tspan></text><text x="466" y="275.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="466" dy="0">fase y código</tspan></text><rect x="632" y="226" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="259.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">dns_failure, connection_refused,</tspan></text><text x="791" y="275.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">tls_name_mismatch, latency_timeout</tspan></text><polyline points="300,264 336,264" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,264 632,264" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="316" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cada estado tiene una señal medible y una respuesta definida: sin esa matriz, el comportamiento ante fallos se decide en</tspan></text><text x="480" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">producción y a las 3 de la madrugada.</tspan></text></svg>
