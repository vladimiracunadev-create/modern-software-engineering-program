<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 498" width="940" height="498" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto discrimina cada prueba entre las tres hipótesis y cuánto cuesta</title><desc id="d">Barras horizontales con el costo de cada prueba y cuántos resultados distintos produce bajo las hipótesis dns, tls y http: resolve cuesta 1 y da 2 resultados distintos, handshake cuesta 2 y da 3, request cuesta 3 y da 2, production-capture cuesta 1 y da 1 porque devuelve unknown bajo todas y no está autorizada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="498" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto discrimina cada prueba entre las tres hipótesis y cuánto cuesta</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Costo de la prueba</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Resultados distintos entre las 3 hipótesis</tspan></text><line x1="264" y1="77" x2="264" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="264" y1="333" x2="264" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="264" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="264" dy="0">0</tspan></text><line x1="478.647" y1="77" x2="478.647" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="478.647" y1="333" x2="478.647" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="478.647" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478.647" dy="0">1</tspan></text><line x1="693.293" y1="77" x2="693.293" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="693.293" y1="333" x2="693.293" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="693.293" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.293" dy="0">2</tspan></text><line x1="907.94" y1="77" x2="907.94" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="333" x2="907.94" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">3</tspan></text><line x1="264" y1="333" x2="907.94" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="254" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">resolve</tspan></text><text x="254" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">handshake</tspan></text><text x="254" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">request</tspan></text><text x="254" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">production-capture (no</tspan></text><text x="254" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">autorizada)</tspan></text><rect x="264" y="83" width="214.647" height="24.5" rx="3" fill="#102a43"/><text x="485.647" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="485.647" dy="0">1</tspan></text><rect x="264" y="110.5" width="429.293" height="24.5" rx="3" fill="#087f8c"/><text x="700.293" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="700.293" dy="0">2</tspan></text><rect x="264" y="147" width="429.293" height="24.5" rx="3" fill="#102a43"/><text x="700.293" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="700.293" dy="0">2</tspan></text><rect x="264" y="174.5" width="643.94" height="24.5" rx="3" fill="#087f8c"/><text x="914.94" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="264" y="211" width="643.94" height="24.5" rx="3" fill="#102a43"/><text x="914.94" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="264" y="238.5" width="429.293" height="24.5" rx="3" fill="#087f8c"/><text x="700.293" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="700.293" dy="0">2</tspan></text><rect x="264" y="275" width="214.647" height="24.5" rx="3" fill="#102a43"/><text x="485.647" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="485.647" dy="0">1</tspan></text><rect x="264" y="302.5" width="214.647" height="24.5" rx="3" fill="#087f8c"/><text x="485.647" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="485.647" dy="0">1</tspan></text><text x="585.97" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="585.97" dy="0">Unidades de costo o resultados distintos</tspan></text><rect x="10" y="391" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada celda del modelo es una predicción que puede refutarse. Una prueba que da el mismo resultado bajo todas las hipótesis,</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">como production-capture con «unknown», no discrimina ni está permitida.</tspan></text><text x="470" y="480.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
