<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 367" width="940" height="367" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuantificadores sobre dominios finitos y la verdad vacía</title><desc id="d">Diagrama de tres expresiones y su resultado: all sobre una lista vacía es True, any sobre una lista vacía es False y las leyes de De Morgan se verificaron en las cuatro filas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="367" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuantificadores sobre dominios finitos y la verdad vacía</tspan></text><text x="124" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="124" dy="0">Expresión</tspan></text><text x="363" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="363" dy="0">Resultado</tspan></text><text x="682" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="682" dy="0">Lectura</tspan></text><rect x="14" y="71" width="220" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="102.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">all([])</tspan></text><polyline points="238,98.64 264,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="71" width="190" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="363" y="102.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="363" dy="0">True</tspan></text><polyline points="462,98.64 488,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="492" y="71" width="380" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">Verdad vacía: «todo elemento cumple» es verdadero</tspan></text><text x="682" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">si no hay elementos</tspan></text><rect x="14" y="138.28" width="220" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="164.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">any([])</tspan></text><polyline points="238,161.28 264,161.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="138.28" width="190" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="363" y="164.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="363" dy="0">False</tspan></text><polyline points="462,161.28 488,161.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="492" y="138.28" width="380" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="164.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">No existe ningún elemento que cumpla</tspan></text><rect x="14" y="196.28" width="220" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="222.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">¬(a ∧ b) ≡ ¬a ∨ ¬b</tspan></text><polyline points="238,219.28 264,219.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="196.28" width="190" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="363" y="222.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="363" dy="0">True en las 4 filas</tspan></text><polyline points="462,219.28 488,219.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="492" y="196.28" width="380" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="222.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">Ley de De Morgan verificada</tspan></text><rect x="10" y="260.28" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="285.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una regla «todas las pruebas autorizadas pasan» se cumple si no hay ninguna prueba: la verdad vacía puede ocultar un</tspan></text><text x="470" y="301.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">conjunto vacío. Se comprueba además que el conjunto no sea vacío.</tspan></text><text x="470" y="349.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
