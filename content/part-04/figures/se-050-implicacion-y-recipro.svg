<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 416" width="940" height="416" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La implicación solo es falsa cuando p es verdadera y q falsa, y su recíproca no es equivalente</title><desc id="d">Diagrama de las cuatro combinaciones de p y q que llevan al valor de p implica q: verdadero en tres y falso solo cuando p es verdadera y q falsa; la contrapositiva es equivalente en las cuatro filas y la recíproca difiere en las filas con p y q distintos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="416" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La implicación solo es falsa cuando p es verdadera y q falsa, y su recíproca no es equivalente</tspan></text><text x="139" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="139" dy="0">Premisa</tspan></text><text x="423" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="423" dy="0">Conclusión</tspan></text><text x="732" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="732" dy="0">Valor de p → q</tspan></text><rect x="14" y="71" width="250" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="139" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="139" dy="0">p falso</tspan></text><polyline points="268,94 294,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="298" y="71" width="250" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="423" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="423" dy="0">q falso</tspan></text><polyline points="552,94 578,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="582" y="71" width="300" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="732" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="732" dy="0">p → q verdadero</tspan></text><rect x="14" y="129" width="250" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="139" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="139" dy="0">p falso</tspan></text><polyline points="268,152 294,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="298" y="129" width="250" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="423" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="423" dy="0">q verdadero</tspan></text><polyline points="552,152 578,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="582" y="129" width="300" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="732" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="732" dy="0">p → q verdadero</tspan></text><rect x="14" y="187" width="250" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="139" y="213.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="139" dy="0">p verdadero</tspan></text><polyline points="268,210 294,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="298" y="187" width="250" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="423" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="423" dy="0">q falso</tspan></text><polyline points="552,210 578,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="582" y="187" width="300" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="732" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="732" dy="0">p → q FALSO</tspan></text><rect x="14" y="245" width="250" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="139" y="271.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="139" dy="0">p verdadero</tspan></text><polyline points="268,268 294,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="298" y="245" width="250" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="423" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="423" dy="0">q verdadero</tspan></text><polyline points="552,268 578,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="582" y="245" width="300" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="732" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="732" dy="0">p → q verdadero</tspan></text><rect x="10" y="309" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="333.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Contrapositiva (¬q → ¬p): equivalente en las 4 filas, verificado. Recíproca (q → p): no equivalente, difiere en «falso,</tspan></text><text x="470" y="350.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">verdadero» y «verdadero, falso». Por eso «si hay un fallo de DNS, no resuelve» no permite concluir lo contrario.</tspan></text><text x="470" y="398.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
