<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 526" width="940" height="526" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pares alcanzables del cierre transitivo de una cadena de n nodos</title><desc id="d">Línea en escala logarítmica con los pares alcanzables n por n menos 1 entre 2: 45 con 10 nodos, 190 con 20, 4 950 con 100 y 499 500 con 1 000; cada vez que n se multiplica por 10 los pares se multiplican por unos 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="526" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pares alcanzables del cierre transitivo de una cadena de n nodos</tspan></text><line x1="123.86" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="359" x2="123.86" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">10</tspan></text><line x1="123.86" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="299" x2="123.86" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">100</tspan></text><line x1="123.86" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="239" x2="123.86" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">1 000</tspan></text><line x1="123.86" y1="179" x2="910" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="179" x2="123.86" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">10 000</tspan></text><line x1="123.86" y1="119" x2="910" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="119" x2="123.86" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">100 000</tspan></text><line x1="123.86" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="59" x2="123.86" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">1 000 000</tspan></text><line x1="123.86" y1="59" x2="123.86" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="141.86" y1="59" x2="141.86" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="141.86" y1="359" x2="141.86" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="141.86" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="141.86" dy="0">10</tspan></text><line x1="254.767" y1="59" x2="254.767" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="254.767" y1="359" x2="254.767" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="254.767" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254.767" dy="0">20</tspan></text><line x1="516.93" y1="59" x2="516.93" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="516.93" y1="359" x2="516.93" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="516.93" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="516.93" dy="0">100</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1 000</tspan></text><line x1="123.86" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Pares alcanzables (escala logarítmica)</text><text x="516.93" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="516.93" dy="0">Nodos n en cadena (escala logarítmica)</tspan></text><polyline points="141.86,319.807 254.767,282.275 516.93,197.324 892,77.0879" fill="none" stroke="#946512" stroke-width="2.4"/><circle cx="141.86" cy="319.807" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="141.86" y="308.807" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="141.86" dy="0">45</tspan></text><circle cx="254.767" cy="282.275" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="254.767" y="271.275" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="254.767" dy="0">190</tspan></text><circle cx="516.93" cy="197.324" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="516.93" y="186.324" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="516.93" dy="0">4 950</tspan></text><circle cx="892" cy="77.0879" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="66.0879" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">499 500</tspan></text><rect x="10" y="419" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La información derivable (quién depende de quién, directa o indirectamente) puede ser mucho mayor que la declarada: para</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consultas frecuentes se calcula una vez y se guarda. El crecimiento es cuadrático.</tspan></text><text x="470" y="508.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
