<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias como grafo: orden topológico y ciclo</title><desc id="d">Un grafo de dependencias app depende de lib y util, lib depende de util tiene el orden topológico util, lib, app; con un ciclo a, b, c, a, graphlib lanza CycleError y señala el ciclo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="20" y="40" width="400" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220" y="84.96" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="220" dy="0">Grafo acíclico: app → {lib, util}; lib → util</tspan></text><text x="220" y="102.88" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="220" dy="0">Orden de construcción: util, lib, app</tspan></text><rect x="520" y="40" width="400" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="720" y="84.96" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="720" dy="0">Grafo con ciclo: a → b → c → a</tspan></text><text x="720" y="102.88" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="720" dy="0">graphlib.CycleError: ciclo [&#x27;a&#x27;, &#x27;c&#x27;, &#x27;b&#x27;, &#x27;a&#x27;]</tspan></text><rect x="20" y="170" width="900" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="200.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Un orden de construcción existe si y solo si el grafo no tiene ciclos. La herramienta no «resuelve» el ciclo: lo informa</tspan></text><text x="470" y="216.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">con el camino.</tspan></text><rect x="20" y="252" width="900" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="282.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un ciclo de dependencias es un defecto de diseño que se rompe extrayendo un componente común o invirtiendo una</tspan></text><text x="470" y="298.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dependencia.</tspan></text></svg>
