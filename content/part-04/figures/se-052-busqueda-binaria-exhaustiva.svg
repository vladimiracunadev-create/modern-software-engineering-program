<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Búsqueda binaria: comprobación exhaustiva con y sin error</title><desc id="d">Se probaron 3234 casos con todos los arreglos ordenados de longitud hasta 6 con valores de 0 a 4 y valores de búsqueda de -1 a 5: la versión correcta cometió 0 fallos y la versión con hi = mid cometió 1181, incluidos casos donde no termina.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="10" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152" dy="0">Versión</tspan></text><rect x="300" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357" dy="0">Casos</tspan></text><rect x="420" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Fallos</tspan></text><rect x="540" y="12" width="384" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="732" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="732" dy="0">Qué ocurre</tspan></text><rect x="10" y="56" width="284" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="92.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">hi = mid − 1 (correcta)</tspan></text><rect x="300" y="56" width="114" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">3234</tspan></text><rect x="420" y="56" width="114" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="477" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="477" dy="0">0</tspan></text><rect x="540" y="56" width="384" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Termina y devuelve la posición o −1</tspan></text><rect x="10" y="128" width="284" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="164.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">hi = mid (error)</tspan></text><rect x="300" y="128" width="114" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">3234</tspan></text><rect x="420" y="128" width="114" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="477" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="477" dy="0">1181</tspan></text><rect x="540" y="128" width="384" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="156.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Puede no terminar: lo detecta un límite de</tspan></text><text x="732" y="172.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">vueltas</tspan></text><rect x="10" y="250" width="920" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En un dominio pequeño se prueba todo: pocos valores bastan para exponer el error de borde. Un invariante (0 ≤ lo ≤ hi + 1 ≤</tspan></text><text x="470" y="299.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">n) más una medida que decrece (hi − lo) explican por qué la versión correcta termina.</tspan></text><text x="470" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
