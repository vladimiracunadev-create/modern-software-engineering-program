<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contratos del laboratorio: qué se exige y qué ocurre cuando se viola</title><desc id="d">Diagrama de tres contratos del laboratorio: la precondición exige que el presupuesto cubra el costo y su violación hace fallar la selección con un error; el invariante exige que los candidatos sean un subconjunto de las hipótesis; la poscondición exige informar las observaciones contradictorias.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Contratos del laboratorio: qué se exige y qué ocurre cuando se viola</tspan></text><text x="109" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="109" dy="0">Tipo</tspan></text><text x="420" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="420" dy="0">Contrato del laboratorio</tspan></text><text x="781" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="781" dy="0">Si se viola</tspan></text><rect x="14" y="71" width="190" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="109" y="102.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="109" dy="0">Precondición</tspan></text><polyline points="208,98.64 226,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="230" y="71" width="380" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="420" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="420" dy="0">El presupuesto cubre el costo de la prueba</tspan></text><text x="420" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="420" dy="0">elegida</tspan></text><polyline points="614,98.64 632,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="636" y="71" width="290" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="781" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="781" dy="0">La selección falla con un error</tspan></text><text x="781" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="781" dy="0">explícito</tspan></text><rect x="14" y="138.28" width="190" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="109" y="169.56" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="109" dy="0">Invariante</tspan></text><polyline points="208,165.92 226,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="230" y="138.28" width="380" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="420" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="420" dy="0">Los candidatos restantes son un subconjunto de</tspan></text><text x="420" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="420" dy="0">las hipótesis</tspan></text><polyline points="614,165.92 632,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="636" y="138.28" width="290" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="781" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="781" dy="0">No puede crecer: una observación solo</tspan></text><text x="781" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="781" dy="0">descarta</tspan></text><rect x="14" y="205.56" width="190" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="109" y="236.84" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="109" dy="0">Poscondición</tspan></text><polyline points="208,233.2 226,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="230" y="205.56" width="380" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="420" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="420" dy="0">Observaciones contradictorias se informan en</tspan></text><text x="420" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="420" dy="0">lugar de ocultarse</tspan></text><polyline points="614,233.2 632,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="636" y="205.56" width="290" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="781" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="781" dy="0">La ejecución falla en voz alta con el</tspan></text><text x="781" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="781" dy="0">conflicto</tspan></text><rect x="10" y="278.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un contrato convierte «debería funcionar» en una frase comprobable: quién debe qué, antes, durante y después. Violarlo es</tspan></text><text x="470" y="320.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un defecto del llamador (precondición) o de la implementación (poscondición).</tspan></text><text x="470" y="368.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
