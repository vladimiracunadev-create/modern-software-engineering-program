<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contratos del laboratorio: precondición, invariante y poscondición</title><desc id="d">Tabla de tres contratos del laboratorio de la Parte 04: el presupuesto es una precondición, las pruebas elegidas son un subconjunto de las autorizadas (invariante) y una observación contradictoria falla de forma visible.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Tipo</tspan></text><rect x="200" y="12" width="404" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Contrato del laboratorio</tspan></text><rect x="610" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Qué pasa si se viola</tspan></text><rect x="10" y="56" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="101.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Precondición</tspan></text><rect x="200" y="56" width="404" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="101.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">El presupuesto cubre el costo de la prueba elegida</tspan></text><rect x="610" y="56" width="314" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="101.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">La selección falla con un error explícito</tspan></text><rect x="10" y="146" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Invariante</tspan></text><rect x="200" y="146" width="404" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="183.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">Los candidatos restantes son un subconjunto de las</tspan></text><text x="402" y="199.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">hipótesis</tspan></text><rect x="610" y="146" width="314" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="183.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">No puede crecer: una observación solo</tspan></text><text x="767" y="199.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">descarta</tspan></text><rect x="10" y="236" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Poscondición</tspan></text><rect x="200" y="236" width="404" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="273.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">Observaciones contradictorias se informan en lugar de</tspan></text><text x="402" y="289.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">ocultarse</tspan></text><rect x="610" y="236" width="314" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="273.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">La ejecución falla en voz alta con el</tspan></text><text x="767" y="289.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">conflicto</tspan></text><rect x="10" y="330" width="920" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="360.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un contrato convierte «debería funcionar» en una frase comprobable: quién debe qué, antes, durante y después. Violarlo es</tspan></text><text x="470" y="376.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un defecto del llamador (precondición) o de la implementación (poscondición).</tspan></text></svg>
