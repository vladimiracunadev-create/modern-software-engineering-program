<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Recursión ingenua frente a memoización: fib(27)</title><desc id="d">Calcular fib(27) con la definición recursiva directa hace 635 621 llamadas y tarda 0,097 segundos; con memoización hace 28 cálculos únicos y tarda 21 microsegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Cálculo de fib(27) = 196 418</tspan></text><rect x="10" y="44" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="67.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Versión</tspan></text><rect x="390" y="44" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="67.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Llamadas / cálculos</tspan></text><rect x="670" y="44" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="67.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Tiempo</tspan></text><rect x="10" y="88" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="121.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Recursiva directa</tspan></text><rect x="390" y="88" width="274" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="527" y="121.92" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="527" dy="0">635 621</tspan></text><rect x="670" y="88" width="254" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="121.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">0,097 s</tspan></text><rect x="10" y="154" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="187.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Con memoización (lru_cache)</tspan></text><rect x="390" y="154" width="274" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="527" y="187.92" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="527" dy="0">28 cálculos únicos</tspan></text><rect x="670" y="154" width="254" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="187.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">0,000021 s</tspan></text><rect x="10" y="220" width="920" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las llamadas se solapan: los mismos subproblemas se recalculan exponencialmente. La memoización los resuelve una vez cada</tspan></text><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">uno: la estructura de la recursión es la misma, la complejidad cambia de exponencial a lineal.</tspan></text><text x="470" y="350" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
