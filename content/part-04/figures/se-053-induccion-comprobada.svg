<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Inducción: caso base, paso y comprobación</title><desc id="d">Para demostrar que la suma de 0 a n es n por n más 1 entre 2: caso base n igual a 0, paso inductivo de n a n más 1, y comprobación computacional para n de 0 a 1999 sin excepciones. La comprobación no sustituye la demostración.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><rect x="10" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Paso</tspan></text><rect x="240" y="12" width="684" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Contenido</tspan></text><rect x="10" y="56" width="224" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="86.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Caso base</tspan></text><rect x="240" y="56" width="684" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">n = 0: la suma es 0 y 0·1/2 = 0</tspan></text><rect x="10" y="116" width="224" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="146.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Hipótesis inductiva</tspan></text><rect x="240" y="116" width="684" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">Se cumple para n: Σ = n(n+1)/2</tspan></text><rect x="10" y="176" width="224" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="206.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Paso</tspan></text><rect x="240" y="176" width="684" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">Σ hasta n+1 = n(n+1)/2 + (n+1) = (n+1)(n+2)/2</tspan></text><rect x="10" y="236" width="224" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="266.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Comprobación</tspan></text><rect x="240" y="236" width="684" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="266.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">Verificada para n = 0 … 1999: sin contraejemplos</tspan></text><rect x="10" y="296" width="920" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="336.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Probar muchos casos no demuestra la propiedad: solo la inducción cubre todos los n. A la inversa, una demostración puede</tspan></text><text x="470" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">contener un error: por eso se contrasta con casos.</tspan></text></svg>
