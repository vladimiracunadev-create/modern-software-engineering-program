<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 243" width="940" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Inducción: caso base, hipótesis, paso y comprobación para la suma de 0 a n</title><desc id="d">Diagrama de cuatro pasos para demostrar que la suma de 0 a n es n por n más 1 entre 2: el caso base n igual a 0, la hipótesis inductiva para n, el paso de n a n más 1 y la comprobación computacional para n de 0 a 1999 sin contraejemplos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="243" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Inducción: caso base, hipótesis, paso y comprobación para la suma de 0 a n</tspan></text><text x="115.25" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="115.25" dy="0">1 · Caso base</tspan></text><rect x="14" y="67" width="202.5" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="115.25" y="90.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="115.25" dy="0">n = 0: la suma es 0 y</tspan></text><text x="115.25" y="107.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="115.25" dy="0">0·1/2 = 0</tspan></text><polyline points="220.5,95.64 246.5,95.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="351.75" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="351.75" dy="0">2 · Hipótesis</tspan></text><rect x="250.5" y="67" width="202.5" height="57.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="351.75" y="90.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="351.75" dy="0">Se cumple para n: Σ =</tspan></text><text x="351.75" y="107.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="351.75" dy="0">n(n+1)/2</tspan></text><polyline points="457,95.64 483,95.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="588.25" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="588.25" dy="0">3 · Paso</tspan></text><rect x="487" y="67" width="202.5" height="57.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="588.25" y="90.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="588.25" dy="0">Σ hasta n+1 = n(n+1)/2 +</tspan></text><text x="588.25" y="107.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="588.25" dy="0">(n+1) = (n+1)(n+2)/2</tspan></text><polyline points="693.5,95.64 719.5,95.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="824.75" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="824.75" dy="0">4 · Comprobación</tspan></text><rect x="723.5" y="67" width="202.5" height="57.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="824.75" y="90.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="824.75" dy="0">Verificada para n = 0 …</tspan></text><text x="824.75" y="107.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="824.75" dy="0">1999: sin contraejemplos</tspan></text><rect x="10" y="136.28" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Probar muchos casos no demuestra la propiedad: solo la inducción cubre todos los n. A la inversa, una demostración puede</tspan></text><text x="470" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">contener un error: por eso se contrasta con casos.</tspan></text><text x="470" y="225.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
