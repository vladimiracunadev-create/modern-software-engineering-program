<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La recursión tiene profundidad finita</title><desc id="d">Con el límite por defecto de 1000, una función recursiva simple alcanzó una profundidad máxima de 999 antes de lanzar RecursionError; json.loads sobre una estructura anidada 100000 veces también lanzó RecursionError.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Prueba</tspan></text><rect x="370" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Resultado</tspan></text><rect x="560" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Lectura</tspan></text><rect x="10" y="56" width="354" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="90.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">sys.getrecursionlimit()</tspan></text><rect x="370" y="56" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">1000</tspan></text><rect x="560" y="56" width="364" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Límite por defecto del intérprete</tspan></text><rect x="10" y="124" width="354" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="150.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Profundidad alcanzada por una recursión</tspan></text><text x="187" y="166.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">simple</tspan></text><rect x="370" y="124" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">999</tspan></text><rect x="560" y="124" width="364" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Quedan marcos para el propio manejo del error</tspan></text><rect x="10" y="192" width="354" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="226.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">json.loads con 100 000 niveles de anidación</tspan></text><rect x="370" y="192" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">RecursionError</tspan></text><rect x="560" y="192" width="364" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Una entrada hostil puede agotar la pila</tspan></text><rect x="10" y="290" width="920" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="325.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una definición recursiva correcta puede fallar por profundidad. Entradas de tamaño no acotado (JSON, árboles, expresiones)</tspan></text><text x="470" y="341.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">exigen límites de profundidad o una versión iterativa con pila explícita.</tspan></text></svg>
