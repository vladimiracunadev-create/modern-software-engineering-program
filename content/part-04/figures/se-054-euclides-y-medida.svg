<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Algoritmo de Euclides: terminación por una medida que decrece</title><desc id="d">El máximo común divisor de 1071 y 462 es 21 y se obtiene en 3 pasos; para dos números de Fibonacci consecutivos, 987 y 610, se obtiene 1 en 14 pasos, el peor caso. La medida b decrece estrictamente en cada paso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Entrada</tspan></text><rect x="430" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Resultado</tspan></text><rect x="660" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Pasos</tspan></text><rect x="10" y="56" width="414" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="89.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">gcd(1071, 462)</tspan></text><rect x="430" y="56" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">21</tspan></text><rect x="660" y="56" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">3</tspan></text><rect x="10" y="122" width="414" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="155.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">gcd(987, 610): Fibonacci consecutivos</tspan></text><rect x="430" y="122" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="155.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">1</tspan></text><rect x="660" y="122" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="155.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">14 (peor caso)</tspan></text><rect x="10" y="220" width="920" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Correctitud: gcd(a, b) = gcd(b, a mod b). Terminación: b disminuye en cada paso y no puede bajar de 0. Costo: proporcional</tspan></text><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">al logaritmo de la entrada; el peor caso son números de Fibonacci consecutivos.</tspan></text></svg>
