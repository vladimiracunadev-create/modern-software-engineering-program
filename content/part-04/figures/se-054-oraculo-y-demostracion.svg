<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 318" width="940" height="318" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probar contra un oráculo y lo que no demuestra</title><desc id="d">Diagrama de dos tipos de evidencia: 2000 casos aleatorios en que la burbuja coincidió con sorted aportan confianza en esos casos pero no garantía para todos los arreglos; un argumento de invariante prueba para toda entrada si es correcto, pero no que el código lo implemente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="318" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probar contra un oráculo y lo que no demuestra</tspan></text><text x="159" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="159" dy="0">Evidencia</tspan></text><text x="470" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="470" dy="0">Qué aporta</tspan></text><text x="781" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="781" dy="0">Qué no aporta</tspan></text><rect x="14" y="71" width="290" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="159" y="93.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="159" dy="0">2000 casos aleatorios: burbuja =</tspan></text><text x="159" y="110.6" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="159" dy="0">sorted</tspan></text><polyline points="308,98.64 326,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="71" width="280" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Confianza en esos casos y en su</tspan></text><text x="470" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">distribución</tspan></text><polyline points="614,98.64 632,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="636" y="71" width="290" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="781" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="781" dy="0">Garantía para todos los arreglos ni</tspan></text><text x="781" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="781" dy="0">para tamaños grandes</tspan></text><rect x="14" y="138.28" width="290" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="159" y="161.24" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="159" dy="0">Argumento de invariante (cola</tspan></text><text x="159" y="177.88" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="159" dy="0">ordenada)</tspan></text><polyline points="308,165.92 326,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="138.28" width="280" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Prueba para toda entrada si es</tspan></text><text x="470" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">correcto</tspan></text><polyline points="614,165.92 632,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="636" y="138.28" width="290" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="781" y="169.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="781" dy="0">Que el código implemente el argumento</tspan></text><rect x="10" y="211.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="236.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Pruebas y demostraciones se complementan: una exhibe fallos concretos y la otra cubre todos los casos. Un contraejemplo</tspan></text><text x="470" y="253.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">invalida el algoritmo; la ausencia de contraejemplos no lo valida.</tspan></text><text x="470" y="300.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
