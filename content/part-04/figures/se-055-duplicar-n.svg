<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo mediano de cuatro operaciones al duplicar n y la razón entre n = 8000 y n = 4000</title><desc id="d">Líneas en escala logarítmica con las medianas por operación para n igual a 2000, 4000 y 8000: la búsqueda lineal pasa de 2,96 a 11,74 ms (razón 1,99), la búsqueda por hash se mantiene en 0,020 ms (0,99), la ordenación pasa de 0,22 a 1,01 ms (2,10) y el doble bucle sobre n/4 de 9,64 a 171,63 ms (4,30).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tiempo mediano de cuatro operaciones al duplicar n y la razón entre n = 8000 y n = 4000</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Doble bucle sobre n/4 (razón 4,30)</tspan></text><rect x="320.36" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="340.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="340.36" dy="0">Búsqueda lineal (1,99)</tspan></text><polygon points="540.24,44.1 546.84,56.4 533.64,56.4" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="554.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="554.24" dy="0">Ordenación (2,10)</tspan></text><polygon points=