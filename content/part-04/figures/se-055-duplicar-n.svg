<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Duplicar n: la razón de tiempos revela el crecimiento</title><desc id="d">Tabla con medianas medidas para n igual a 4000 y 8000: la búsqueda lineal pasa de 5,9 a 11,7 ms (razón 1,99), la búsqueda por hash se mantiene en 0,02 ms (razón 0,99), la ordenación pasa de 0,48 a 1,01 ms (razón 2,10) y el doble bucle de 5,9 a 171,6 ms (razón 4,30 sobre n/4).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Operación</tspan></text><rect x="310" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">n = 2000</tspan></text><rect x="430" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">n = 4000</tspan></text><rect x="550" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="612" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">n = 8000</tspan></text><rect x="680" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Razón 8000/4000</tspan></text><rect x="820" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">Crecimiento</tspan></text><rect x="10" y="56" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="90.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Búsqueda lineal (in en lista)</tspan></text><rect x="310" y="56" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">2,96 ms</tspan></text><rect x="430" y="56" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">5,89 ms</tspan></text><rect x="550" y="56" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">11,74 ms</tspan></text><rect x="680" y="56" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">1,99</tspan></text><rect x="820" y="56" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">≈ n</tspan></text><rect x="10" y="124" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Búsqueda por hash (in en set)</tspan></text><rect x="310" y="124" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">0,020 ms</tspan></text><rect x="430" y="124" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">0,020 ms</tspan></text><rect x="550" y="124" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">0,020 ms</tspan></text><rect x="680" y="124" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0,99</tspan></text><rect x="820" y="124" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">≈ 1</tspan></text><rect x="10" y="192" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="226.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Ordenación (sorted)</tspan></text><rect x="310" y="192" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">0,22 ms</tspan></text><rect x="430" y="192" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">0,48 ms</tspan></text><rect x="550" y="192" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">1,01 ms</tspan></text><rect x="680" y="192" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">2,10</tspan></text><rect x="820" y="192" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">≈ n log n</tspan></text><rect x="10" y="260" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Doble bucle sobre n/4</tspan></text><rect x="310" y="260" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">9,64 ms</tspan></text><rect x="430" y="260" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">39,89 ms</tspan></text><rect x="550" y="260" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">171,63 ms</tspan></text><rect x="680" y="260" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">4,30</tspan></text><rect x="820" y="260" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">≈ n²</tspan></text><rect x="10" y="330" width="940" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="360.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Si duplicar n multiplica el tiempo por ≈2, el crecimiento es lineal; por ≈4, cuadrático; por ≈1, constante. La razón se mide,</tspan></text><text x="480" y="376.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">no se supone.</tspan></text><text x="480" y="424" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
