<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Teoría y medición: dos fuentes que deben coincidir</title><desc id="d">Tabla que contrasta la razón teórica esperada al duplicar n con la razón medida: lineal 2 frente a 1,99, hash 1 frente a 0,99, n log n un poco más de 2 frente a 2,10 y cuadrático 4 frente a 4,30.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Operación</tspan></text><rect x="310" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Razón teórica al duplicar n</tspan></text><rect x="650" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Razón medida</tspan></text><rect x="10" y="56" width="294" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="86.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Lineal</tspan></text><rect x="310" y="56" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="86.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">2</tspan></text><rect x="650" y="56" width="274" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="86.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1,99</tspan></text><rect x="10" y="116" width="294" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="146.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Hash</tspan></text><rect x="310" y="116" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="146.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">1</tspan></text><rect x="650" y="116" width="274" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="146.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">0,99</tspan></text><rect x="10" y="176" width="294" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="206.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">n log n</tspan></text><rect x="310" y="176" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="206.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">2 + pequeño (≈2,1)</tspan></text><rect x="650" y="176" width="274" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="206.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">2,10</tspan></text><rect x="10" y="236" width="294" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="266.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Cuadrática</tspan></text><rect x="310" y="236" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="266.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">4</tspan></text><rect x="650" y="236" width="274" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="266.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">4,30</tspan></text><rect x="10" y="290" width="920" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="323.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cuando la medición discrepa mucho de la teoría hay un error de análisis, de medición o un efecto de caché o del intérprete;</tspan></text><text x="470" y="339.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ninguna de las dos fuentes sustituye a la otra.</tspan></text></svg>
