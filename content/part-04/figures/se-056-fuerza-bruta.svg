<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La fuerza bruta crece factorialmente</title><desc id="d">El tiempo de resolver el viajante por fuerza bruta pasó de 0,002 s con 7 ciudades a 0,012 s con 8 y 0,110 s con 9: cada ciudad adicional multiplica el tiempo por 6 a 9, coherente con las permutaciones (n−1)!.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Ciudades n</tspan></text><rect x="270" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Permutaciones (n−1)!</tspan></text><rect x="610" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Tiempo</tspan></text><rect x="10" y="56" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="86.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">7</tspan></text><rect x="270" y="56" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">720</tspan></text><rect x="610" y="56" width="314" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0,002 s</tspan></text><rect x="10" y="116" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="146.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">8</tspan></text><rect x="270" y="116" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">5 040</tspan></text><rect x="610" y="116" width="314" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0,012 s</tspan></text><rect x="10" y="176" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="206.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">9</tspan></text><rect x="270" y="176" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">40 320</tspan></text><rect x="610" y="176" width="314" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0,110 s</tspan></text><rect x="10" y="236" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="266.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">12 (extrapolado)</tspan></text><rect x="270" y="236" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="266.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">39 916 800</tspan></text><rect x="610" y="236" width="314" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="266.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">≈ horas con este método</tspan></text><rect x="10" y="300" width="920" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="333.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un algoritmo exacto de crecimiento factorial se vuelve inviable muy pronto; por eso existen heurísticas y aproximaciones,</tspan></text><text x="470" y="349.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con sus garantías y límites declarados.</tspan></text></svg>
