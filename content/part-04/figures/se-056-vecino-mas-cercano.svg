<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Vecino más cercano frente al óptimo en 100 instancias de 8 ciudades: razón del recorrido</title><desc id="d">Barras horizontales con la razón entre el recorrido de la heurística del vecino más cercano y el óptimo, en 100 instancias aleatorias de 8 ciudades: 1,000 en el mejor caso, 1,086 de media y 1,318 en el peor caso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Vecino más cercano frente al óptimo en 100 instancias de 8 ciudades: razón del recorrido</tspan></text><line x1="214" y1="49" x2="214" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="163" x2="214" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="434.567" y1="49" x2="434.567" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="434.567" y1="163" x2="434.567" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="434.567" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.567" dy="0">0,5</tspan></text><line x1="655.133" y1="49" x2="655.133" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="655.133" y1="163" x2="655.133" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="655.133" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.133" dy="0">1</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="163" x2="875.7" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1,5</tspan></text><line x1="214" y1="163" x2="875.7" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Mejor caso</tspan></text><text x="204" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Razón media</tspan></text><text x="204" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Peor caso observado</tspan></text><rect x="214" y="55" width="441.133" height="26" rx="3" fill="#946512"/><text x="662.133" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="662.133" dy="0">1,000</tspan></text><rect x="214" y="93" width="479.071" height="26" rx="3" fill="#946512"/><text x="700.071" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="700.071" dy="0">1,086</tspan></text><rect x="214" y="131" width="581.414" height="26" rx="3" fill="#946512"/><text x="802.414" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802.414" dy="0">1,318</tspan></text><line x1="655.133" y1="49" x2="655.133" y2="163" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="660.133" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="660.133" dy="0">Óptimo</tspan></text><text x="544.85" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.85" dy="0">Razón al óptimo</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La heurística es rápida y, en promedio, razonable; en el peor caso observado es un 32 % peor. No hay garantía general: se</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">conoce la razón en la muestra, no el máximo en todos los casos. Semilla 5; el óptimo se calculó por fuerza bruta (7!</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">permutaciones por instancia).</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
