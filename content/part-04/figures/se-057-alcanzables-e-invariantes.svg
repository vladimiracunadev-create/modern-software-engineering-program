<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 358" width="940" height="358" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estados alcanzables e invariantes del pedido: preguntas y respuestas de la exploración</title><desc id="d">Diagrama de tres preguntas sobre el pedido y su respuesta: desde nuevo se alcanzan los 6 estados, no se llega a entregado sin pasar por pagado y enviado, y no se puede devolver un pedido cancelado porque no hay transición desde cancelado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="358" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estados alcanzables e invariantes del pedido: preguntas y respuestas de la exploración</tspan></text><text x="274" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="274" dy="0">Pregunta sobre el modelo</tspan></text><text x="744" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="744" dy="0">Respuesta de la exploración</tspan></text><rect x="14" y="71" width="520" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="274" dy="0">¿Cuántos estados son alcanzables desde «nuevo»?</tspan></text><polyline points="538,94 570,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="574" y="71" width="340" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="744" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="744" dy="0">6 de 6</tspan></text><rect x="14" y="129" width="520" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="274" dy="0">¿Se puede llegar a «entregado» sin pasar por «pagado»?</tspan></text><polyline points="538,152 570,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="574" y="129" width="340" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="744" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="744" dy="0">No: hay que pasar por pagado y enviado</tspan></text><rect x="14" y="187" width="520" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="213.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="274" dy="0">¿Se puede devolver un pedido cancelado?</tspan></text><polyline points="538,210 570,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="574" y="187" width="340" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="744" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="744" dy="0">No: no hay transición desde cancelado</tspan></text><rect x="10" y="251" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="275.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un invariante como «entregado implica pagado» se verifica recorriendo los estados alcanzables; si algún estado lo viola, el</tspan></text><text x="470" y="292.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modelo (o la regla) está mal.</tspan></text><text x="470" y="340.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
