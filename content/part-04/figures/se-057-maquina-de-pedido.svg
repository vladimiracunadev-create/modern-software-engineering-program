<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Máquina de estados de un pedido</title><desc id="d">Seis estados (nuevo, pagado, enviado, entregado, cancelado, devuelto) y cinco eventos definen 30 pares estado-evento, de los cuales 6 son transiciones legales y 24 son ilegales y deben rechazarse.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Estado</tspan></text><rect x="210" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Evento</tspan></text><rect x="410" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Siguiente estado</tspan></text><rect x="10" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">nuevo</tspan></text><rect x="210" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">pagar</tspan></text><rect x="410" y="56" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">pagado</tspan></text><rect x="10" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">nuevo</tspan></text><rect x="210" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">cancelar</tspan></text><rect x="410" y="102" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">cancelado</tspan></text><rect x="10" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">pagado</tspan></text><rect x="210" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">enviar</tspan></text><rect x="410" y="148" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">enviado</tspan></text><rect x="10" y="194" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">pagado</tspan></text><rect x="210" y="194" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">cancelar</tspan></text><rect x="410" y="194" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">cancelado</tspan></text><rect x="10" y="240" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">enviado</tspan></text><rect x="210" y="240" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">entregar</tspan></text><rect x="410" y="240" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">entregado</tspan></text><rect x="10" y="286" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">enviado</tspan></text><rect x="210" y="286" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">devolver</tspan></text><rect x="410" y="286" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">devuelto</tspan></text><rect x="680" y="12" width="270" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="815" y="72.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="815" dy="0">6 estados × 5 eventos = 30 pares;</tspan></text><text x="815" y="88.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="815" dy="0">6 legales; 24 ilegales.</tspan></text><rect x="680" y="150" width="270" height="160" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="815" y="208.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">Un evento ilegal (por ejemplo,</tspan></text><text x="815" y="225.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">enviar un pedido nuevo) se rechaza</tspan></text><text x="815" y="241.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">de forma explícita: no se ignora</tspan></text><text x="815" y="258.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">ni cambia el estado.</tspan></text><rect x="10" y="340" width="940" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="371.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">El modelo hace visible lo que antes era implícito: qué está permitido en cada estado y qué no.</tspan></text></svg>
