<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Máquina de estados de un pedido</title><desc id="d">Seis estados (nuevo, pagado, enviado, entregado, cancelado, devuelto) y cinco eventos definen 30 pares estado-evento, de los cuales 6 son transiciones legales y 24 son ilegales y deben rechazarse.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis estados y las seis transiciones legales</tspan></text><rect x="20" y="60" width="150" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="89.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">nuevo</tspan></text><rect x="290" y="60" width="150" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="365" y="89.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="365" dy="0">pagado</tspan></text><rect x="560" y="60" width="150" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="635" y="89.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="635" dy="0">enviado</tspan></text><rect x="800" y="60" width="150" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="875" y="89.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="875" dy="0">entregado</tspan></text><rect x="150" y="190" width="150" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="225" y="219.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="225" dy="0">cancelado</tspan></text><rect x="560" y="190" width="150" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="635" y="219.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="635" dy="0">devuelto</tspan></text><polyline points="174,86 286,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="230" y="80" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">pagar</tspan></text><polyline points="444,86 556,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="500" y="80" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="500" dy="0">enviar</tspan></text><polyline points="714,86 796,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="755" y="80" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755" dy="0">entregar</tspan></text><polyline points="95,116 95,216 146,216" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="60" y="170" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="60" dy="0">cancelar</tspan></text><polyline points="365,116 365,150 225,150 225,186" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="300" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300" dy="0">cancelar</tspan></text><polyline points="635,116 635,186" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="668" y="156" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="668" dy="0">devolver</tspan></text><rect x="740" y="160" width="210" height="98" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="845" y="196" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="845" dy="0">6 estados × 5 eventos = 30</tspan></text><text x="845" y="212.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="845" dy="0">pares: 6 legales y 24</tspan></text><text x="845" y="229.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="845" dy="0">ilegales.</tspan></text><rect x="10" y="290" width="940" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="321.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Un evento ilegal (por ejemplo, enviar un pedido nuevo) se rechaza de forma explícita: no se ignora ni cambia el estado.</tspan></text><rect x="10" y="358" width="940" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="389.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">El modelo hace visible lo que antes era implícito: qué está permitido en cada estado y qué no.</tspan></text></svg>
