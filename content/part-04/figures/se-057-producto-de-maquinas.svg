<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Explosión de estados al combinar máquinas</title><desc id="d">Combinar máquinas independientes multiplica sus estados: 6 por 5 son 30, 6 por 5 por 4 son 120 y 6 por 5 por 4 por 4 por 3 son 1440; un sistema de cinco componentes pequeños ya tiene más de mil estados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="454" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="237" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="237" dy="0">Máquinas combinadas</tspan></text><rect x="470" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">Estados del producto</tspan></text><rect x="10" y="56" width="454" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="237" y="88.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237" dy="0">6 × 5</tspan></text><rect x="470" y="56" width="394" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="88.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">30</tspan></text><rect x="10" y="120" width="454" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="237" y="152.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237" dy="0">6 × 5 × 4</tspan></text><rect x="470" y="120" width="394" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="152.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">120</tspan></text><rect x="10" y="184" width="454" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="237" y="216.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237" dy="0">6 × 5 × 4 × 4 × 3</tspan></text><rect x="470" y="184" width="394" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="216.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">1 440</tspan></text><rect x="10" y="220" width="920" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Razonar sobre el producto a mano es inviable: se modelan los componentes por separado, se declaran las interacciones y se</tspan></text><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">explora el espacio de estados con una herramienta (verificación de modelos).</tspan></text></svg>
