<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pruebas necesarias para localizar un cambio defectuoso por bisección</title><desc id="d">Barras horizontales con las pruebas de la bisección: 10 pruebas entre 1 024 cambios para hallar un defecto en el cambio 700, y 20 pruebas entre un millón para hallar uno en el cambio 123 456; cada prueba descarta la mitad de los candidatos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pruebas necesarias para localizar un cambio defectuoso por bisección</tspan></text><line x1="324" y1="49" x2="324" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="137" x2="324" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="467.97" y1="49" x2="467.97" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="467.97" y1="137" x2="467.97" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="467.97" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467.97" dy="0">5</tspan></text><line x1="611.94" y1="49" x2="611.94" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="611.94" y1="137" x2="611.94" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="611.94" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="611.94" dy="0">10</tspan></text><line x1="755.91" y1="49" x2="755.91" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="755.91" y1="137" x2="755.91" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="755.91" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.91" dy="0">15</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="137" x2="899.88" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">20</tspan></text><line x1="324" y1="137" x2="899.88" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">1 024 cambios (defecto en el 700)</tspan></text><text x="314" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">1 000 000 de cambios (defecto en el 123</tspan></text><text x="314" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">456)</tspan></text><rect x="324" y="55" width="287.94" height="32" rx="3" fill="#087f8c"/><text x="618.94" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="618.94" dy="0">10</tspan></text><rect x="324" y="99" width="575.88" height="32" rx="3" fill="#087f8c"/><text x="906.88" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><text x="611.94" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="611.94" dy="0">Pruebas</tspan></text><rect x="10" y="195" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La bisección (git bisect) exige una prueba determinista y la suposición de monotonía: todo cambio anterior al defecto es</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sano y todo cambio posterior lo contiene. Si la prueba es intermitente, el resultado no es fiable.</tspan></text><text x="470" y="284.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
