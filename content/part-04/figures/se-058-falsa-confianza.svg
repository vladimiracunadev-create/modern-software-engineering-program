<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 286" width="940" height="286" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Con el defecto presente (p = 0,1), qué ocurre en cinco corridas seguidas</title><desc id="d">Barra apilada horizontal con la probabilidad de lo que ocurre en cinco corridas si el defecto está presente con p igual a 0,1: pasan las cinco con probabilidad 0,9 elevado a 5, es decir 0,59, y se observa al menos una falla con probabilidad 1 menos 0,59, es decir 0,41.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="286" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Con el defecto presente (p = 0,1), qué ocurre en cinco corridas seguidas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pasan las cinco: 0,9^5 = 0,59</tspan></text><rect x="282.66" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Al menos una falla: 1 − 0,59 = 0,41</tspan></text><line x1="214" y1="77" x2="214" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="121" x2="214" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="346.34" y1="77" x2="346.34" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="346.34" y1="121" x2="346.34" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="346.34" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="346.34" dy="0">20</tspan></text><line x1="478.68" y1="77" x2="478.68" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="478.68" y1="121" x2="478.68" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="478.68" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478.68" dy="0">40</tspan></text><line x1="611.02" y1="77" x2="611.02" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="611.02" y1="121" x2="611.02" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="611.02" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="611.02" dy="0">60</tspan></text><line x1="743.36" y1="77" x2="743.36" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="743.36" y1="121" x2="743.36" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="743.36" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="743.36" dy="0">80</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="121" x2="875.7" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="214" y1="121" x2="875.7" y2="121" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Defecto presente, cinco</tspan></text><text x="204" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">corridas</tspan></text><rect x="214" y="84" width="390.403" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="409.202" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="409.202" dy="0">59</tspan></text><rect x="604.403" y="84" width="271.297" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="740.052" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="740.052" dy="0">41</tspan></text><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100</tspan></text><text x="544.85" y="165" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.85" dy="0">Probabilidad (%)</tspan></text><rect x="10" y="179" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="203.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con un 59 % de probabilidad, «lo corregí porque ahora pasa cinco veces» es una conclusión que falla más de la mitad de las</tspan></text><text x="470" y="220.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">veces. Se registra la hipótesis, la predicción y el número de corridas planificado antes de concluir.</tspan></text><text x="470" y="268.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
