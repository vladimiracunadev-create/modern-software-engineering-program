<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 526" width="940" height="526" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Corridas necesarias para ver con 95 % de confianza un fallo intermitente</title><desc id="d">Línea en escala logarítmica con las corridas necesarias según la probabilidad de fallo por corrida: 5 si vale 0,5; 29 si vale 0,1 y 299 si vale 0,01, con la fórmula techo de ln 0,05 entre ln de 1 menos p; una simulación con p igual a 0,1 y 29 corridas lo observó en 95,2 % de 10 000 intentos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="526" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Corridas necesarias para ver con 95 % de confianza un fallo intermitente</tspan></text><line x1="93.7" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="359" x2="93.7" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="259" x2="910" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="259" x2="93.7" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="159" x2="910" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="159" x2="93.7" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="59" x2="93.7" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="59" x2="93.7" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="59" x2="111.7" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="359" x2="111.7" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">0,01</tspan></text><line x1="570.978" y1="59" x2="570.978" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="570.978" y1="359" x2="570.978" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="570.978" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="570.978" dy="0">0,1</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0,5</tspan></text><line x1="93.7" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Corridas para verlo con 95 % (escala logarítmica)</text><text x="501.85" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">Probabilidad de fallo por corrida (escala logarítmica)</tspan></text><polyline points="892,289.103 570.978,212.76 111.7,111.433" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="892" cy="289.103" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="278.103" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">5</tspan></text><circle cx="570.978" cy="212.76" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="570.978" y="201.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="570.978" dy="0">29</tspan></text><circle cx="111.7" cy="111.433" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="111.7" y="100.433" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">299</tspan></text><rect x="10" y="419" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación (10 000 intentos, p = 0,1, 29 corridas): el fallo apareció en el 95,2 %, coherente con la fórmula. Un fallo raro</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">exige muchas corridas: «no lo reproduje» con pocas corridas no es evidencia de que no exista.</tspan></text><text x="470" y="508.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
