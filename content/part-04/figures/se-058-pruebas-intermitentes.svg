<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="940" height="410" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pruebas intermitentes: cuántas repeticiones para reproducir un fallo</title><desc id="d">Para reproducir con 95 % de confianza un fallo que ocurre en una fracción p de las ejecuciones se necesitan 5 corridas si p vale 0,5; 29 si vale 0,1 y 299 si vale 0,01; una simulación con p igual a 0,1 y 29 corridas lo observó en 95,2 % de los intentos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="410" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Probabilidad de fallo por corrida</tspan></text><rect x="340" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Corridas para verlo con 95 %</tspan></text><rect x="630" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Fórmula</tspan></text><rect x="10" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0,5</tspan></text><rect x="340" y="56" width="284" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">5</tspan></text><rect x="630" y="56" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">⌈ln(0,05) / ln(1 − p)⌉</tspan></text><rect x="10" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0,1</tspan></text><rect x="340" y="118" width="284" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">29</tspan></text><rect x="630" y="118" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">⌈ln(0,05) / ln(1 − p)⌉</tspan></text><rect x="10" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0,01</tspan></text><rect x="340" y="180" width="284" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">299</tspan></text><rect x="630" y="180" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">⌈ln(0,05) / ln(1 − p)⌉</tspan></text><rect x="10" y="250" width="920" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="291.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Simulación (10 000 intentos, p = 0,1, 29 corridas): el fallo apareció en el 95,2 %, coherente con la fórmula.</tspan></text><rect x="10" y="338" width="920" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="369.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un fallo raro exige muchas corridas: «no lo reproduje» con pocas corridas no es evidencia de que no exista.</tspan></text></svg>
