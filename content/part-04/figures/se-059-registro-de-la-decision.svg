<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Preguntas abiertas y registro de la decisión</title><desc id="d">Al encontrar una contradicción se registran preguntas abiertas, las opciones, quién decide y el plazo; no se escoge en silencio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Elemento del registro</tspan></text><rect x="270" y="12" width="654" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Contenido</tspan></text><rect x="10" y="56" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Contradicción</tspan></text><rect x="270" y="56" width="654" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">Los tres requisitos no tienen solución conjunta (0 de 4 configuraciones)</tspan></text><rect x="10" y="118" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Opciones</tspan></text><rect x="270" y="118" width="654" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">Relajar la búsqueda en servidor, relajar e2e o cambiar el alcance</tspan></text><rect x="10" y="180" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Quién decide</tspan></text><rect x="270" y="180" width="654" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">Propietario del producto con asesoría de seguridad; las personas afectadas se consultan</tspan></text><rect x="10" y="242" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Preguntas abiertas</tspan></text><rect x="270" y="242" width="654" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">¿Qué dato necesita realmente buscarse? ¿Con qué latencia? ¿Qué riesgo se acepta?</tspan></text><rect x="10" y="300" width="920" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="333.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una contradicción no resuelta que se oculta reaparece como un defecto en producción; una que se registra es una decisión</tspan></text><text x="470" y="349.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">revisable.</tspan></text></svg>
