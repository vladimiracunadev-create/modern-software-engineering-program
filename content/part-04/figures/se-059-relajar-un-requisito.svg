<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 309" width="940" height="309" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Relajar un requisito: qué configuraciones quedan y qué cuesta a la persona usuaria</title><desc id="d">Diagrama de dos relajaciones posibles: al relajar la búsqueda en el servidor queda una única configuración válida, cifrado extremo a extremo con el índice en el cliente, a costa de más datos locales y más tiempo; al relajar el cifrado quedan más de una, pero el servidor puede leer los datos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="309" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Relajar un requisito: qué configuraciones quedan y qué cuesta a la persona usuaria</tspan></text><text x="139" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="139" dy="0">Requisito relajado</tspan></text><text x="425" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="425" dy="0">Configuraciones válidas</tspan></text><text x="741" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="741" dy="0">Costo para la persona usuaria</tspan></text><rect x="14" y="71" width="250" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="139" y="102.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="139" dy="0">Búsqueda en el servidor</tspan></text><polyline points="268,98.64 286,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="290" y="71" width="270" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="425" y="102.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="425" dy="0">1: e2e + índice en el cliente</tspan></text><polyline points="564,98.64 582,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="586" y="71" width="310" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="741" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="741" dy="0">La búsqueda ocurre en el dispositivo:</tspan></text><text x="741" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="741" dy="0">más datos locales, más tiempo</tspan></text><rect x="14" y="138.28" width="250" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="139" y="164.92" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="139" dy="0">Cifrado extremo a extremo</tspan></text><polyline points="268,161.28 286,161.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="290" y="138.28" width="270" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="425" y="164.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="425" dy="0">Más de una</tspan></text><polyline points="564,161.28 582,161.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="586" y="138.28" width="310" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="741" y="164.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="741" dy="0">El servidor puede leer los datos</tspan></text><rect x="10" y="202.28" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="227.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El análisis no decide por la persona: muestra qué se gana y qué se pierde con cada relajación, y deja la decisión a quien</tspan></text><text x="470" y="243.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tenga autoridad y a quienes resultan afectados.</tspan></text><text x="470" y="291.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
