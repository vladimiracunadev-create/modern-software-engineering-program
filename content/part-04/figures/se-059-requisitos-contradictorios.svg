<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 366" width="940" height="366" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Requisitos que cumple cada configuración: ninguna cumple los tres</title><desc id="d">Barras horizontales con cuántos de los tres requisitos (cifrado extremo a extremo, búsqueda en el servidor y sin índice en claro en el servidor) cumple cada una de las cuatro configuraciones: e2e con índice en servidor cumple 2, e2e con índice en cliente cumple 2, transporte con índice en servidor cumple 2 y transporte con índice en cliente cumple 1; ninguna llega a 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="366" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Requisitos que cumple cada configuración: ninguna cumple los tres</tspan></text><line x1="264" y1="49" x2="264" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="264" y1="201" x2="264" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="264" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="264" dy="0">0</tspan></text><line x1="478.647" y1="49" x2="478.647" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="478.647" y1="201" x2="478.647" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="478.647" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478.647" dy="0">1</tspan></text><line x1="693.293" y1="49" x2="693.293" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="693.293" y1="201" x2="693.293" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="693.293" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.293" dy="0">2</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="201" x2="907.94" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">3</tspan></text><line x1="264" y1="201" x2="907.94" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="254" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">e2e + índice en servidor</tspan></text><text x="254" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">e2e + índice en cliente</tspan></text><text x="254" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">transporte + índice en servidor</tspan></text><text x="254" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">transporte + índice en cliente</tspan></text><rect x="264" y="55" width="429.293" height="26" rx="3" fill="#102a43"/><text x="700.293" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="700.293" dy="0">2</tspan></text><rect x="264" y="93" width="429.293" height="26" rx="3" fill="#102a43"/><text x="700.293" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="700.293" dy="0">2</tspan></text><rect x="264" y="131" width="429.293" height="26" rx="3" fill="#102a43"/><text x="700.293" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="700.293" dy="0">2</tspan></text><rect x="264" y="169" width="214.647" height="26" rx="3" fill="#102a43"/><text x="485.647" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="485.647" dy="0">1</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="201" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="912.94" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="912.94" dy="0">Los tres requisitos</tspan></text><text x="585.97" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="585.97" dy="0">Requisitos cumplidos de 3</tspan></text><rect x="10" y="259" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ninguna de las 4 configuraciones satisface los tres requisitos: la contradicción es del conjunto, no de la implementación.</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Se detecta enumerando el espacio pequeño antes de construir nada.</tspan></text><text x="470" y="348.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
