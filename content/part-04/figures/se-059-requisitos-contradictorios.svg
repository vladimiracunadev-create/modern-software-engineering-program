<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres requisitos que juntos no tienen solución</title><desc id="d">Tabla con tres requisitos: cifrado extremo a extremo, búsqueda en el servidor e «índice en servidor requiere texto en claro». De las 4 configuraciones posibles (cifrado e2e o de transporte, índice en servidor o en cliente), ninguna satisface los tres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><rect x="10" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152" dy="0">Configuración</tspan></text><rect x="300" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">Cifrado e2e</tspan></text><rect x="430" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Búsqueda en servidor</tspan></text><rect x="620" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Sin índice en claro en</tspan></text><text x="722" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">servidor</tspan></text><rect x="830" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="887" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">¿Cumple los</tspan></text><text x="887" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">3?</tspan></text><rect x="10" y="56" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">e2e + índice en servidor</tspan></text><rect x="300" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">sí</tspan></text><rect x="430" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">sí</tspan></text><rect x="620" y="56" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">no</tspan></text><rect x="830" y="56" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">no</tspan></text><rect x="10" y="114" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">e2e + índice en cliente</tspan></text><rect x="300" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">sí</tspan></text><rect x="430" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">no</tspan></text><rect x="620" y="114" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">sí</tspan></text><rect x="830" y="114" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">no</tspan></text><rect x="10" y="172" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">transporte + índice en servidor</tspan></text><rect x="300" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">no</tspan></text><rect x="430" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">sí</tspan></text><rect x="620" y="172" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">sí</tspan></text><rect x="830" y="172" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">no</tspan></text><rect x="10" y="230" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">transporte + índice en cliente</tspan></text><rect x="300" y="230" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">no</tspan></text><rect x="430" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">no</tspan></text><rect x="620" y="230" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">sí</tspan></text><rect x="830" y="230" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">no</tspan></text><rect x="10" y="310" width="940" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="345.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Ninguna de las 4 configuraciones satisface los tres requisitos: la contradicción es del conjunto, no de la implementación. Se</tspan></text><text x="480" y="361.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">detecta enumerando el espacio pequeño antes de construir nada.</tspan></text></svg>
