<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que la evidencia sostiene y lo que no</title><desc id="d">Tres límites declarados por el laboratorio: el resultado es correcto solo respecto de las hipótesis y resultados declarados, la heurística codiciosa no es óptima global y una medición de tiempo no sustituye el análisis de crecimiento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="10" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152" dy="0">Afirmación</tspan></text><rect x="300" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Evidencia que la sostiene</tspan></text><rect x="620" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Lo que no demuestra</tspan></text><rect x="10" y="56" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="101.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">La selección converge a una hipótesis</tspan></text><rect x="300" y="56" width="314" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="101.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Trece pruebas y el caso de referencia</tspan></text><rect x="620" y="56" width="304" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="93.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Que las hipótesis cubran todas las causas</tspan></text><text x="772" y="109.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">reales</tspan></text><rect x="10" y="146" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">La próxima prueba es una buena elección</tspan></text><rect x="300" y="146" width="314" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="183.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Una puntuación por costo y poder de</tspan></text><text x="457" y="199.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">descarte</tspan></text><rect x="620" y="146" width="304" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Que la secuencia sea globalmente óptima</tspan></text><rect x="10" y="236" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">El procedimiento es eficiente</tspan></text><rect x="300" y="236" width="314" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Conteos de operaciones y medición</tspan></text><rect x="620" y="236" width="304" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="273.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Que otro entorno o tamaño mantenga la</tspan></text><text x="772" y="289.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">proporción</tspan></text><rect x="10" y="340" width="920" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="370.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cambiar un resultado esperado para que una implementación pase invalida la evidencia: un contraejemplo obliga a revisar la</tspan></text><text x="470" y="386.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">regla, el modelo o el alcance.</tspan></text></svg>
