<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que la evidencia sostiene y lo que no demuestra</title><desc id="d">Diagrama de tres afirmaciones del laboratorio con la evidencia que las sostiene y lo que esa evidencia no demuestra: la convergencia a una hipótesis no prueba que las hipótesis cubran todas las causas, la buena elección de la próxima prueba no prueba una secuencia óptima y la eficiencia medida no prueba que otro entorno mantenga la proporción.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lo que la evidencia sostiene y lo que no demuestra</tspan></text><text x="154" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="154" dy="0">Afirmación</tspan></text><text x="460" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="460" dy="0">Evidencia que la sostiene</tspan></text><text x="766" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="766" dy="0">Lo que no demuestra</tspan></text><rect x="14" y="71" width="280" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="154" y="93.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="154" dy="0">La selección converge a una</tspan></text><text x="154" y="110.6" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="154" dy="0">hipótesis</tspan></text><polyline points="298,98.64 316,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="320" y="71" width="280" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">Trece pruebas y el caso de</tspan></text><text x="460" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">referencia</tspan></text><polyline points="604,98.64 622,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="71" width="280" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="766" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="766" dy="0">Que las hipótesis cubran todas las</tspan></text><text x="766" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="766" dy="0">causas reales</tspan></text><rect x="14" y="138.28" width="280" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="154" y="161.24" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="154" dy="0">La próxima prueba es una buena</tspan></text><text x="154" y="177.88" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="154" dy="0">elección</tspan></text><polyline points="298,165.92 316,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="320" y="138.28" width="280" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">Una puntuación por costo y poder de</tspan></text><text x="460" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">descarte</tspan></text><polyline points="604,165.92 622,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="138.28" width="280" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="766" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="766" dy="0">Que la secuencia sea globalmente</tspan></text><text x="766" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="766" dy="0">óptima</tspan></text><rect x="14" y="205.56" width="280" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="154" y="236.84" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="154" dy="0">El procedimiento es eficiente</tspan></text><polyline points="298,233.2 316,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="320" y="205.56" width="280" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460" y="236.84" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">Conteos de operaciones y medición</tspan></text><polyline points="604,233.2 622,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="205.56" width="280" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="766" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="766" dy="0">Que otro entorno o tamaño mantenga</tspan></text><text x="766" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="766" dy="0">la proporción</tspan></text><rect x="10" y="278.84" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="303.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cambiar un resultado esperado para que una implementación pase invalida la evidencia: un contraejemplo obliga a revisar la</tspan></text><text x="470" y="320.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">regla, el modelo o el alcance.</tspan></text><text x="470" y="368.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
