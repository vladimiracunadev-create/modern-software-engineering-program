<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="940" height="260" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Resolución del caso de referencia, paso a paso</title><desc id="d">Diagrama de tres pasos del caso de referencia: resolve da ok y deja tls y http como candidatos con costo 1; handshake da fail y deja solo tls con costo acumulado 3; el estado final es resolved, con 3 de 5 unidades gastadas y presupuesto restante 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="260" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Resolución del caso de referencia, paso a paso</tspan></text><text x="154.667" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="154.667" dy="0">Paso 1 · resolve</tspan></text><rect x="14" y="67" width="281.333" height="73.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="154.667" y="99.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154.667" dy="0">Resultado ok. Candidatos: tls,</tspan></text><text x="154.667" y="115.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154.667" dy="0">http. Costo acumulado 1</tspan></text><polyline points="299.333,103.96 325.333,103.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="470" dy="0">Paso 2 · handshake</tspan></text><rect x="329.333" y="67" width="281.333" height="73.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="99.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Resultado fail. Candidatos: tls.</tspan></text><text x="470" y="115.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Costo acumulado 3</tspan></text><polyline points="614.667,103.96 640.667,103.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="785.333" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="785.333" dy="0">Estado final</tspan></text><rect x="644.667" y="67" width="281.333" height="73.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="785.333" y="90.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785.333" dy="0">resolved · candidatos [tls] ·</tspan></text><text x="785.333" y="107.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785.333" dy="0">gastado 3 de 5 · restante 2 ·</tspan></text><text x="785.333" y="124.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785.333" dy="0">próxima prueba: ninguna</tspan></text><rect x="10" y="152.92" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«Resuelto» significa que, dentro del modelo, solo queda una hipótesis compatible con las observaciones. No significa que el</tspan></text><text x="470" y="194.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mundo real esté completo ni que las premisas sean verdaderas.</tspan></text><text x="470" y="242.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
