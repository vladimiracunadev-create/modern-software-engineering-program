<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Resolución del caso de referencia, paso a paso</title><desc id="d">Con la especificación y las observaciones de referencia: resolve da ok y deja tls y http como candidatos con costo 1; handshake da fail y deja solo tls con costo acumulado 3; el estado es resolved, con presupuesto restante 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="10" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="57" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="57" dy="0">Paso</tspan></text><rect x="110" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Prueba</tspan></text><rect x="330" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="407" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407" dy="0">Resultado</tspan></text><rect x="490" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">Candidatos restantes</tspan></text><rect x="750" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Costo acumulado</tspan></text><rect x="10" y="56" width="94" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="57" y="89.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="57" dy="0">1</tspan></text><rect x="110" y="56" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="217" dy="0">resolve</tspan></text><rect x="330" y="56" width="154" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">ok</tspan></text><rect x="490" y="56" width="254" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">tls, http</tspan></text><rect x="750" y="56" width="174" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">1</tspan></text><rect x="10" y="122" width="94" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="57" y="155.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="57" dy="0">2</tspan></text><rect x="110" y="122" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="155.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="217" dy="0">handshake</tspan></text><rect x="330" y="122" width="154" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="155.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">fail</tspan></text><rect x="490" y="122" width="254" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="155.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">tls</tspan></text><rect x="750" y="122" width="174" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="155.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">3</tspan></text><rect x="10" y="190" width="920" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="223.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Estado final: resolved · candidatos: [tls] · gastado 3 de 5 · presupuesto restante 2 · próxima prueba: ninguna.</tspan></text><rect x="10" y="262" width="920" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="302.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«Resuelto» significa que, dentro del modelo, solo queda una hipótesis compatible con las observaciones. No significa que el</tspan></text><text x="470" y="318.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mundo real esté completo ni que las premisas sean verdaderas.</tspan></text></svg>
