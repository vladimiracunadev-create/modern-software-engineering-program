<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Las trece pruebas del laboratorio repartidas por el contrato que protegen</title><desc id="d">Barras horizontales con las pruebas por grupo: especificación 3, razonamiento 3, selección y observación 4 y evidencia 3, en total 13; pasaron en Windows 11 en 0,167 s y en Linux en 0,245 s.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Las trece pruebas del laboratorio repartidas por el contrato que protegen</tspan></text><line x1="354" y1="49" x2="354" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="225" x2="354" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="492.485" y1="49" x2="492.485" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="492.485" y1="225" x2="492.485" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="492.485" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492.485" dy="0">1</tspan></text><line x1="630.97" y1="49" x2="630.97" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="630.97" y1="225" x2="630.97" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="630.97" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630.97" dy="0">2</tspan></text><line x1="769.455" y1="49" x2="769.455" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="769.455" y1="225" x2="769.455" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="769.455" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="769.455" dy="0">3</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="225" x2="907.94" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">4</tspan></text><line x1="354" y1="225" x2="907.94" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Especificación (datos válidos y conflictos</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">explícitos)</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Razonamiento (lógica, terminación y estados)</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Selección y observación (invariantes y</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">precondiciones)</tspan></text><text x="344" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Evidencia (trazabilidad y límites)</tspan></text><rect x="354" y="55" width="415.455" height="32" rx="3" fill="#087f8c"/><text x="776.455" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="776.455" dy="0">3</tspan></text><rect x="354" y="99" width="415.455" height="32" rx="3" fill="#087f8c"/><text x="776.455" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="776.455" dy="0">3</tspan></text><rect x="354" y="143" width="553.94" height="32" rx="3" fill="#087f8c"/><text x="914.94" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">4</tspan></text><rect x="354" y="187" width="415.455" height="32" rx="3" fill="#087f8c"/><text x="776.455" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="776.455" dy="0">3</tspan></text><text x="630.97" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">Pruebas de 13</tspan></text><rect x="10" y="283" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">13 pruebas: Windows 11 (Python 3.12.9) 0,167 s; Linux (WSL2, Python 3.12.3) 0,245 s. Cada grupo protege un contrato</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">distinto y la clase lista las trece en su tabla.</tspan></text><text x="470" y="372.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
