<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cadena de if y tabla de umbrales: mismo resultado, distinto costo</title><desc id="d">Una clasificación de latencia en cuatro tramos se implementó con if/elif y con bisect sobre una tabla; coincidieron en 1000 muestras con frontera. Costo por llamada en Windows: cadena con 1500 ms 104.7 ns, con 50 ms 74.0 ns, tabla 126.4 ns; en Linux 65.3, 49.4 y 98.2 ns.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="460" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Windows (ns por llamada, mejor de 5 repeticiones)</tspan></text><text x="260" y="61" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">if/elif, valor 50</tspan></text><rect x="270" y="40" width="310.8" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="588.8" y="61" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="588.8" dy="0">74.0</tspan></text><text x="260" y="103" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">if/elif, valor 1500</tspan></text><rect x="270" y="82" width="439.74" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="717.74" y="103" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="717.74" dy="0">104.7</tspan></text><text x="260" y="145" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">tabla + bisect, 1500</tspan></text><rect x="270" y="124" width="530.88" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="808.88" y="145" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="808.88" dy="0">126.4</tspan></text><text x="20" y="178" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Linux / WSL2 (ns por llamada)</tspan></text><text x="260" y="211" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">if/elif, valor 50</tspan></text><rect x="270" y="190" width="207.48" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485.48" y="211" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="485.48" dy="0">49.4</tspan></text><text x="260" y="253" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">if/elif, valor 1500</tspan></text><rect x="270" y="232" width="274.26" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="552.26" y="253" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="552.26" dy="0">65.3</tspan></text><text x="260" y="295" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">tabla + bisect, 1500</tspan></text><rect x="270" y="274" width="412.44" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="690.44" y="295" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="690.44" dy="0">98.2</tspan></text><rect x="10" y="318" width="940" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="339.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Con 4 tramos la cadena es más rápida y más legible. La diferencia es de decenas de nanosegundos: irrelevante frente a una</tspan></text><text x="480" y="356.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">llamada de red. La tabla vale cuando los tramos son muchos o vienen de configuración, y cada frontera se prueba (100 → fast,</tspan></text><text x="480" y="373.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">101 → ok).</tspan></text><rect x="10" y="395.92" width="940" height="50.72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="416.96" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Los números dependen del equipo y de la carga; úsalos para comparar órdenes de magnitud, no como constantes. Cambiar &lt;= por &lt; en la</tspan></text><text x="480" y="432.32" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">frontera 100 cambia la clase de 100 de fast a ok: solo una prueba de frontera lo detecta.</tspan></text></svg>
