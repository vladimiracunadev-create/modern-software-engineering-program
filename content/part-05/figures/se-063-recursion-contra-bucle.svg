<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="960" height="448" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Suma de 1 a 900 con recursión y con bucle, y el límite de pila</title><desc id="d">Sumar 1..900 recursivamente tarda 148.8 microsegundos en Windows y 164.0 en Linux; con un bucle 39.4 y 36.3. El límite de recursión es 1000 y la profundidad alcanzada fue 998; sum_rec(5000) lanza RecursionError.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="448" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Microsegundos por llamada (n = 900)</tspan></text><text x="220" y="63" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">recursión · Windows</tspan></text><rect x="230" y="42" width="505.92" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="743.92" y="63" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="743.92" dy="0">148.8</tspan></text><text x="220" y="107" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">bucle · Windows</tspan></text><rect x="230" y="86" width="133.96" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="371.96" y="107" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="371.96" dy="0">39.4</tspan></text><text x="220" y="151" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">recursión · Linux</tspan></text><rect x="230" y="130" width="557.6" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="795.6" y="151" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="795.6" dy="0">164.0</tspan></text><text x="220" y="195" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">bucle · Linux</tspan></text><rect x="230" y="174" width="123.42" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="361.42" y="195" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="361.42" dy="0">36.3</tspan></text><rect x="10" y="232" width="254" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="253.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Medida</tspan></text><rect x="270" y="232" width="164" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="352" y="253.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352" dy="0">Valor</tspan></text><rect x="440" y="232" width="504" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="253.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Lectura</tspan></text><rect x="10" y="274" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="297.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">sys.getrecursionlimit()</tspan></text><rect x="270" y="274" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="297.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">1000</tspan></text><rect x="440" y="274" width="504" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="297.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">profundidad máxima alcanzada: 998 (quedan marcos de intérprete)</tspan></text><rect x="10" y="320" width="254" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="350.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">sum_rec(5000)</tspan></text><rect x="270" y="320" width="164" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="350.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">RecursionError</tspan></text><rect x="440" y="320" width="504" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="341.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">maximum recursion depth exceeded: el fallo es controlable, no un</tspan></text><text x="692" y="358.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">cierre del proceso</tspan></text><rect x="10" y="381.28" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="403.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Recorrer una estructura profunda de datos externos con recursión convierte el tamaño de la entrada en un riesgo. El</tspan></text><text x="480" y="419.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">laboratorio itera y acota el número de pasos.</tspan></text></svg>
