<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 351" width="960" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alcance, cierres y paso de argumentos: cuatro comportamientos medidos</title><desc id="d">Un contador global vale 2 tras dos llamadas; un cierre con nonlocal devuelve 1 y luego 2; leer zz antes de asignarlo en la función lanza UnboundLocalError; pasar una lista y reasignar el parámetro no cambia la lista, mientras que mutarla sí: queda [1, 9].</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="351" fill="#ffffff"/><rect x="10" y="14" width="324" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Fragmento</tspan></text><rect x="340" y="14" width="164" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Resultado medido</tspan></text><rect x="510" y="14" width="434" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Regla</tspan></text><rect x="10" y="56" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">global cnt; cnt += 1 (dos veces)</tspan></text><rect x="340" y="56" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">2</tspan></text><rect x="510" y="56" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">global declara que el nombre vive en el módulo</tspan></text><rect x="10" y="102" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="132.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">nonlocal n; n += 1 en un cierre</tspan></text><rect x="340" y="102" width="164" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="132.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">1, luego 2</tspan></text><rect x="510" y="102" width="434" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="123.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">el estado vive en la celda del cierre:</tspan></text><text x="727" y="140.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">closure[0].cell_contents = 2</tspan></text><rect x="10" y="161.28" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="191.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">print(zz); zz = 1 dentro de f</tspan></text><rect x="340" y="161.28" width="164" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="191.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">UnboundLocalError</tspan></text><rect x="510" y="161.28" width="434" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="183.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">asignar en la función hace local el nombre en todo el</tspan></text><text x="727" y="199.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">cuerpo</tspan></text><rect x="10" y="220.56" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="250.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">mut(L) → L.append(9); rebind(L) → L = [0]</tspan></text><rect x="340" y="220.56" width="164" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="250.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">L queda [1, 9]</tspan></text><rect x="510" y="220.56" width="434" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="242.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">se pasa una referencia al objeto: mutar afecta,</tspan></text><text x="727" y="259.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">reasignar no</tspan></text><rect x="10" y="283.84" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="305.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Resolución de nombres: local → envolvente → global → incorporado (LEGB). Una función que depende de un global es difícil de</tspan></text><text x="480" y="322.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">probar: sus pruebas tienen que preparar y limpiar ese estado.</tspan></text></svg>
