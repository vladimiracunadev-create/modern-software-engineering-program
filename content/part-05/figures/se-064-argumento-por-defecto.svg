<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" width="960" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El argumento por defecto mutable se crea una sola vez</title><desc id="d">Con def bad(item, acc=[]) tres llamadas devuelven [1, 2, 3] porque comparten la misma lista; con acc=None y una lista nueva dentro, cada llamada devuelve su propia lista. La lista vive en bad.__defaults__.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="395" fill="#ffffff"/><rect x="20" y="20" width="420" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="230" y="55.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">def bad(item, acc=[]):</tspan></text><text x="230" y="71.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">acc.append(item); return acc</tspan></text><rect x="520" y="20" width="420" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="730" y="47" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="730" dy="0">def good(item, acc=None):</tspan></text><text x="730" y="63.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="730" dy="0">acc = [] if acc is None else acc</tspan></text><text x="730" y="80.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="730" dy="0">acc.append(item); return acc</tspan></text><rect x="10" y="118" width="174" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="97" y="139.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="97" dy="0">Llamadas</tspan></text><rect x="190" y="118" width="424" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="139.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Resultado medido</tspan></text><rect x="620" y="118" width="324" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="139.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Evidencia</tspan></text><rect x="10" y="160" width="174" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="190.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">bad(1), bad(2)</tspan></text><rect x="190" y="160" width="424" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="190.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">[1, 2, 3] (la misma lista; tras la tercera llamada)</tspan></text><rect x="620" y="160" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="181.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">bad.__defaults__[0] is lista devuelta →</tspan></text><text x="782" y="198.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">True</tspan></text><rect x="10" y="219.28" width="174" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="242.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">good(1), good(2)</tspan></text><rect x="190" y="219.28" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="242.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">[1] y [2]</tspan></text><rect x="620" y="219.28" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="242.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">cada llamada crea su lista</tspan></text><rect x="10" y="269.28" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="291.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Python evalúa los valores por defecto al definir la función, no en cada llamada. Un valor mutable por defecto es estado global</tspan></text><text x="480" y="307.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">oculto.</tspan></text><rect x="10" y="330.56" width="940" height="50.72" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="351.6" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Firma observada con inspect: (a, b=2, /, c=3, *, d). Pasar cuatro posicionales produce TypeError: «takes from 1 to 3 positional</tspan></text><text x="480" y="366.96" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">arguments but 4 were given».</tspan></text></svg>
