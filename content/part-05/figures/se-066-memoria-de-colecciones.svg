<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Memoria de las colecciones: vacías y con 100 enteros</title><desc id="d">Con 100 enteros una lista ocupa 856 bytes, una tupla 840, un conjunto 8408 y un diccionario 4688; vacíos ocupan 56, 40, 216 y 64. sys.getsizeof no incluye los objetos contenidos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Bytes con 100 elementos (sys.getsizeof)</tspan></text><text x="150" y="63" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">lista</tspan></text><rect x="160" y="42" width="68.48" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236.48" y="63" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="236.48" dy="0">856 B</tspan></text><text x="150" y="103" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">tupla</tspan></text><rect x="160" y="82" width="67.2" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235.2" y="103" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="235.2" dy="0">840 B</tspan></text><text x="150" y="143" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">diccionario</tspan></text><rect x="160" y="122" width="375.04" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="543.04" y="143" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="543.04" dy="0">4 688 B</tspan></text><text x="150" y="183" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">conjunto</tspan></text><rect x="160" y="162" width="672.64" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.64" y="183" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="840.64" dy="0">8 408 B</tspan></text><rect x="10" y="214" width="324" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="235.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Vacías</tspan></text><rect x="340" y="214" width="224" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="235.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Bytes</tspan></text><rect x="570" y="214" width="374" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="235.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Nota</tspan></text><rect x="10" y="256" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="279.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">lista · tupla · conjunto · diccionario</tspan></text><rect x="340" y="256" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="279.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">56 · 40 · 216 · 64 B</tspan></text><rect x="570" y="256" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="279.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">estructura vacía</tspan></text><rect x="10" y="304" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El conjunto compra consulta casi constante con unas diez veces la memoria de una lista. Para un registro de tres campos, una</tspan></text><text x="480" y="342.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">tupla o un dataclass son más compactos que un diccionario.</tspan></text><rect x="10" y="365.28" width="940" height="50.72" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="386.32" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">getsizeof mide el contenedor, no los 100 enteros que referencia. Los tamaños son de CPython 3.12 de 64 bits; otra versión o</tspan></text><text x="480" y="401.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">implementación da otros números.</tspan></text></svg>
