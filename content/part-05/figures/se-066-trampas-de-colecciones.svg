<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" width="960" height="456" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis trampas de las colecciones, todas medidas</title><desc id="d">[[0]*2]*2 comparte la fila y tras escribir da [[9, 0], [9, 0]]; la copia superficial de un diccionario comparte las listas internas; 1, 1.0 y True son la misma clave; nan crea dos claves; una lista no es hashable ni dentro de una tupla; sorted es estable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="456" fill="#ffffff"/><rect x="10" y="14" width="304" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Fragmento</tspan></text><rect x="320" y="14" width="234" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Resultado medido</tspan></text><rect x="560" y="14" width="384" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Causa</tspan></text><rect x="10" y="56" width="304" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="86.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">a = [[0]*2]*2; a[0][0] = 9</tspan></text><rect x="320" y="56" width="234" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">[[9, 0], [9, 0]]</tspan></text><rect x="560" y="56" width="384" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">dos filas son el mismo objeto; con comprensión:</tspan></text><text x="752" y="94.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">[[9, 0], [0, 0]]</tspan></text><rect x="10" y="115.28" width="304" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="145.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">dict(orig) y luego orig[&#x27;k&#x27;].append(2)</tspan></text><rect x="320" y="115.28" width="234" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="145.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">la copia también cambia</tspan></text><rect x="560" y="115.28" width="384" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="137.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">copia superficial; copy.deepcopy conserva el</tspan></text><text x="752" y="153.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">original</tspan></text><rect x="10" y="174.56" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="198.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">{1: &#x27;a&#x27;, 1.0: &#x27;b&#x27;, True: &#x27;c&#x27;}</tspan></text><rect x="320" y="174.56" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="198.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">{1: &#x27;c&#x27;}</tspan></text><rect x="560" y="174.56" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="198.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">1 == 1.0 == True y hash igual: una sola clave</tspan></text><rect x="10" y="220.56" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="244.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">{float(&#x27;nan&#x27;): 1, float(&#x27;nan&#x27;): 2}</tspan></text><rect x="320" y="220.56" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="244.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">2 claves</tspan></text><rect x="560" y="220.56" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="244.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">nan != nan: dos claves no iguales</tspan></text><rect x="10" y="266.56" width="304" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="296.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">{[1]: 1} y hash((1, [2]))</tspan></text><rect x="320" y="266.56" width="234" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="288.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">TypeError: unhashable type:</tspan></text><text x="437" y="305.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">&#x27;list&#x27;</tspan></text><rect x="560" y="266.56" width="384" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="296.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">solo lo inmutable (en profundidad) es hashable</tspan></text><rect x="10" y="325.84" width="304" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="356.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">sorted(recs, key=segundo)</tspan></text><rect x="320" y="325.84" width="234" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="356.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">[(&#x27;c&#x27;,1),(&#x27;b&#x27;,2),(&#x27;a&#x27;,2)]</tspan></text><rect x="560" y="325.84" width="384" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="347.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">ordenamiento estable: b y a conservan su orden</tspan></text><text x="752" y="364.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">relativo</tspan></text><rect x="10" y="389.12" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="411.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Además sorted([&#x27;b&#x27;, &#x27;B&#x27;, &#x27;a&#x27;]) = [&#x27;B&#x27;, &#x27;a&#x27;, &#x27;b&#x27;]: el orden es por punto de código, no alfabético. Una comparación «natural»</tspan></text><text x="480" y="427.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">exige una clave explícita.</tspan></text></svg>
