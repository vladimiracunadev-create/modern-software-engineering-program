<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo acumulado de importar el paquete (python -X importtime)</title><desc id="d">Tiempos acumulados de importación en milisegundos: diagnostic_cli.domain 48.0 en Windows y 78.8 en Linux, el paquete diagnostic_cli 52.5 y 115.5, parsing 0.7 y 12.7, engine 3.1 y 15.5, y diagnostic_cli.cli 68.5 y 173.7. Incluyen módulos de la biblioteca estándar como dataclasses o argparse.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="356" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Milisegundos acumulados (una ejecución por plataforma)</tspan></text><text x="210" y="63" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">domain · Windows</tspan></text><rect x="220" y="42" width="163.2" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="391.2" y="63" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="391.2" dy="0">48.0</tspan></text><text x="210" y="103" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">cli · Windows</tspan></text><rect x="220" y="82" width="232.9" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460.9" y="103" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="460.9" dy="0">68.5</tspan></text><text x="210" y="143" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">domain · Linux</tspan></text><rect x="220" y="122" width="267.92" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495.92" y="143" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="495.92" dy="0">78.8</tspan></text><text x="210" y="183" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">cli · Linux</tspan></text><rect x="220" y="162" width="590.58" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="818.58" y="183" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="818.58" dy="0">173.7</tspan></text><rect x="10" y="214" width="940" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="235.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El acumulado de domain.py es casi todo costo de la biblioteca estándar que importa (dataclasses, enum, typing): el módulo</tspan></text><text x="480" y="252.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">propio apenas pesa. En Linux los archivos estaban en un disco de Windows montado en WSL2 (/mnt/c), mucho más lento: las barras</tspan></text><text x="480" y="269.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">de Linux no miden Linux nativo.</tspan></text><rect x="10" y="291.92" width="940" height="50.72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="312.96" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Una sola ejecución en frío por plataforma: sirve para ordenar módulos, no para fijar un presupuesto. Importar perezosamente solo vale si</tspan></text><text x="480" y="328.32" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">el arranque está medido como problema.</tspan></text></svg>
