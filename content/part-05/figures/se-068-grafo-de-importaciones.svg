<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" width="960" height="446" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias de importación del paquete diagnostic_cli (leídas con ast)</title><desc id="d">El análisis con ast muestra que domain.py no importa ningún módulo local; engine.py y parsing.py importan solo domain; cli.py importa engine y parsing; __init__.py reexporta domain y engine; __main__.py importa cli. Líneas: domain 82, engine 109, parsing 110, cli 59, __init__ 16, __main__ 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="446" fill="#ffffff"/><rect x="380" y="20" width="200" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="37" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="480" dy="0">domain.py</tspan></text><text x="480" y="53.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="480" dy="0">82 líneas · 0</tspan></text><text x="480" y="70.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="480" dy="0">importaciones locales</tspan></text><rect x="110" y="150" width="200" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="210" y="175.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="210" dy="0">engine.py</tspan></text><text x="210" y="191.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="210" dy="0">109 líneas → domain</tspan></text><rect x="650" y="150" width="200" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="750" y="175.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="750" dy="0">parsing.py</tspan></text><text x="750" y="191.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="750" dy="0">110 líneas → domain</tspan></text><rect x="380" y="270" width="200" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="287" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="480" dy="0">cli.py</tspan></text><text x="480" y="303.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="480" dy="0">59 líneas → engine,</tspan></text><text x="480" y="320.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="480" dy="0">parsing</tspan></text><rect x="380" y="380" width="200" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="397.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">__main__.py · 3 líneas →</tspan></text><text x="480" y="413.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">cli</tspan></text><rect x="20" y="20" width="220" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="130" y="45.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="130" dy="0">__init__.py · 16 líneas</tspan></text><text x="130" y="61.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="130" dy="0">reexporta domain y engine</tspan></text><polyline points="210,150 400,80" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="750,150 560,80" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="400,270 260,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="560,270 700,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="480,380 480,330" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="240,50 380,50" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="640" y="270" width="300" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="790" y="307.04" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">Las flechas apuntan hacia lo que se</tspan></text><text x="790" y="323.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">importa. Ninguna flecha sale de</tspan></text><text x="790" y="340.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">domain: el núcleo no conoce argparse,</tspan></text><text x="790" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">archivos ni JSON. Un ciclo (por</tspan></text><text x="790" y="373.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">ejemplo domain → cli) rompería esa</tspan></text><text x="790" y="390.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">propiedad.</tspan></text></svg>
