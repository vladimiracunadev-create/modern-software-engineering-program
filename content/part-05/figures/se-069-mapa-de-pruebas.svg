<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" width="960" height="446" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Las 15 pruebas del laboratorio y el contrato que protege cada una</title><desc id="d">La suite del laboratorio ejecuta 15 pruebas: 14 aprobadas y una omitida por falta de rustc. Tarda 0.047 segundos de pruebas y 0.42 s de reloj en Windows, 0.263 y 1.03 s en Linux. Cada contrato (tipos externos, esquema, inmutabilidad, rechazos del dominio, JSONL, terminal, paquete, transferencia) tiene al menos una prueba.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="446" fill="#ffffff"/><rect x="10" y="14" width="254" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Contrato</tspan></text><rect x="270" y="14" width="674" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Pruebas (nombre abreviado)</tspan></text><rect x="10" y="56" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">tipos y esquema externos</tspan></text><rect x="270" y="56" width="674" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">rechaza_presupuesto_booleano · rechaza_mapa_incompleto</tspan></text><rect x="10" y="102" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">estado y resultado</tspan></text><rect x="270" y="102" width="674" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">apply_observation_sin_mutar · resultado_imposible · candidatos_monótonos</tspan></text><rect x="10" y="148" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">rechazos del dominio</tspan></text><rect x="270" y="148" width="674" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">prueba_no_autorizada · observación_duplicada</tspan></text><rect x="10" y="194" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">flujo</tspan></text><rect x="270" y="194" width="674" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">flujo_vacío_inconcluso · línea_malformada_con_ubicación</tspan></text><rect x="10" y="240" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">terminal</tspan></text><rect x="270" y="240" width="674" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">salida_separada_de_diagnósticos · JSON_inválido · observaciones_ausentes · contradicción</tspan></text><rect x="10" y="286" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">paquete y transferencia</tspan></text><rect x="270" y="286" width="674" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">metadatos_del_paquete · puerto_Rust (omitida sin rustc)</tspan></text><rect x="10" y="336" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="357.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Resultado: Ran 15 tests, OK (skipped=1). Tiempo de pruebas 0.047 s (Windows) y 0.263 s (Linux sobre /mnt/c); reloj incluyendo</tspan></text><text x="480" y="374.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">el arranque del intérprete: 0.42 s y 1.03 s.</tspan></text><rect x="10" y="397.28" width="940" height="35.36" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="418.32" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Que cada contrato tenga una prueba no dice si la prueba detecta un defecto en ese contrato. Eso lo mide la figura siguiente.</tspan></text></svg>
