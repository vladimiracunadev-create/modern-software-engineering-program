text x="707" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">parse_rejects_boolean_budget…</tspan></text><rect x="10" y="194" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">status siempre «resolved»</tspan></text><rect x="340" y="194" width="124" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="402" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="402" dy="0">detectado</tspan></text><rect x="470" y="194" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">empty_stream_is_inconclusive…</tspan></text><rect x="10" y="240" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">gasto &gt; presupuesto → &gt;=</tspan></text><rect x="340" y="240" width="124" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="402" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="402" dy="0">SOBREVIVE</tspan></text><rect x="470" y="240" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">ninguna prueba toca la frontera exacta</tspan></text><rect x="10" y="286" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">MAX_INPUT_BYTES ×10</tspan></text><rect x="340" y="286" width="124" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="402" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="402" dy="0">SOBREVIVE</tspan></text><rect x="470" y="286" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">ninguna prueba supera el límite de 1 MB</tspan></text><rect x="10" y="332" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="353.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">elegir por información sin dividir por</tspan></text><text x="172" y="370.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">costo</tspan></text><rect x="340" y="332" width="124" height="53.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="402" y="362.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="402" dy="0">SOBREVIVE</tspan></text><rect x="470" y="332" width="474" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="362.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">el caso del laboratorio da la misma elección</tspan></text><rect x="10" y="391.28" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="414.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">EXIT_DOMAIN_REFUSAL = 3 en vez de 4</tspan></text><rect x="340" y="391.28" width="124" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="402" y="414.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="402" dy="0">SOBREVIVE</tspan></text><rect x="470" y="391.28" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="414.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">las pruebas comparan con la constante, no con el número</tspan></text><rect x="10" y="437.28" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="460.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">hipótesis duplicadas aceptadas</tspan></text><rect x="340" y="437.28" width="124" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="402" y="460.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="402" dy="0">SOBREVIVE</tspan></text><rect x="470" y="437.28" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="460.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">no hay prueba de duplicado en el esquema</tspan></text><rect x="10" y="483.28" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="506.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">cota de pasos + 99</tspan></text><rect x="340" y="483.28" width="124" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="402" y="506.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="402" dy="0">SOBREVIVE</tspan></text><rect x="470" y="483.28" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="506.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">ver siguiente figura: es equivalente</tspan></text><rect x="10" y="531.28" width="940" height="36.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="553.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cobertura de líneas alta no implica protección: seis de diez defectos plausibles pasaron una suite en verde.</tspan></text></svg>
