<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 429" width="960" height="429" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Métricas leídas con ast sobre el paquete del laboratorio</title><desc id="d">El paquete tiene 379 líneas y 19 funciones, todas con retorno anotado y ninguna con docstring; la media es 11.0 líneas por función. parse_spec es la mayor: 48 líneas y complejidad aproximada 26. Hay 9 líneas de más de 100 caracteres y 2 comentarios, ambos explican una causa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="429" fill="#ffffff"/><rect x="10" y="14" width="294" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Función</tspan></text><rect x="310" y="14" width="84" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="352" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352" dy="0">Líneas</tspan></text><rect x="400" y="14" width="154" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Complejidad aprox.</tspan></text><rect x="560" y="14" width="384" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Qué mezcla</tspan></text><rect x="10" y="56" width="294" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="86.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">parse_spec (parsing.py)</tspan></text><rect x="310" y="56" width="84" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">48</tspan></text><rect x="400" y="56" width="154" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">26</tspan></text><rect x="560" y="56" width="384" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">valida decisión, presupuesto, hipótesis y cada</tspan></text><text x="752" y="94.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">prueba en una función</tspan></text><rect x="10" y="115.28" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="138.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">apply_observation (engine.py)</tspan></text><rect x="310" y="115.28" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="138.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">20</tspan></text><rect x="400" y="115.28" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="138.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">8</tspan></text><rect x="560" y="115.28" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="138.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">cinco rechazos y una transformación</tspan></text><rect x="10" y="161.28" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="184.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">main (cli.py)</tspan></text><rect x="310" y="161.28" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="184.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">31</tspan></text><rect x="400" y="161.28" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="184.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">7</tspan></text><rect x="560" y="161.28" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="184.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">orquesta archivos, errores y códigos de salida</tspan></text><rect x="10" y="207.28" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="230.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">run_diagnosis (engine.py)</tspan></text><rect x="310" y="207.28" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="230.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">33</tspan></text><rect x="400" y="207.28" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="230.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">7</tspan></text><rect x="560" y="207.28" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="230.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">bucle de observaciones y construcción del informe</tspan></text><rect x="10" y="253.28" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="276.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">load_json_document (parsing.py)</tspan></text><rect x="310" y="253.28" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="276.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">12</tspan></text><rect x="400" y="253.28" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="276.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">6</tspan></text><rect x="560" y="253.28" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="276.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">tamaño, codificación y JSON</tspan></text><rect x="10" y="303.28" width="940" height="50.72" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="324.32" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Complejidad aproximada = 1 + número de if, for, while, except, operadores booleanos, expresiones condicionales y comprensiones. Es un</tspan></text><text x="480" y="339.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">indicador para decidir dónde mirar, no un umbral universal.</tspan></text><rect x="10" y="362" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Los dos comentarios del paquete explican un porqué (bool hereda de int; ASCII escapado por codepages); ninguno repite el</tspan></text><text x="480" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">código. Ninguna función tiene docstring: la intención vive en los nombres y en los tipos.</tspan></text></svg>
