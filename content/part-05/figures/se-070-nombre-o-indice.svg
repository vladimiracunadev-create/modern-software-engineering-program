<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 459" width="960" height="459" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un nombre frente a un índice: claridad y costo medidos</title><desc id="d">Leer r[1] de una tupla cuesta 29.8 nanosegundos en Windows y 20.5 en Linux; leer p.cost de un dataclass 21.7 y 15.0. El nombre es más legible y no más lento. En el paquete solo hay 78 nombres distintos y los de una o dos letras son T, OK y _.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="459" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Nanosegundos por lectura</tspan></text><text x="200" y="63" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">r[1] · Windows</tspan></text><rect x="210" y="42" width="268.2" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="486.2" y="63" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="486.2" dy="0">29.8</tspan></text><text x="200" y="103" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">p.cost · Windows</tspan></text><rect x="210" y="82" width="195.3" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="413.3" y="103" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="413.3" dy="0">21.7</tspan></text><text x="200" y="143" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">r[1] · Linux</tspan></text><rect x="210" y="122" width="184.5" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="402.5" y="143" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="402.5" dy="0">20.5</tspan></text><text x="200" y="183" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">p.cost · Linux</tspan></text><rect x="210" y="162" width="135" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="353" y="183" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353" dy="0">15.0</tspan></text><rect x="10" y="214" width="374" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="235.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Lectura</tspan></text><rect x="390" y="214" width="554" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="235.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">Lo que obliga a saber</tspan></text><rect x="10" y="256" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="279.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">r = (&#x27;resolve&#x27;, 1, True); r[1]</tspan></text><rect x="390" y="256" width="554" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="279.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">¿qué es 1? exige abrir la definición</tspan></text><rect x="10" y="302" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="325.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">probe.cost</tspan></text><rect x="390" y="302" width="554" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="325.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">unidad y rol visibles en el sitio de uso</tspan></text><rect x="10" y="350" width="940" height="36.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="371.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">En el paquete, 78 nombres distintos y solo T (variable de tipo), OK (miembro de Enum) y _ miden una o dos letras.</tspan></text><rect x="10" y="394.64" width="940" height="50.72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="415.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Las diferencias de nanosegundos son ruido operativo: la razón para nombrar no es la velocidad. Un buen nombre también puede mentir: si</tspan></text><text x="480" y="431.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">cost deja de ser un entero, el nombre sigue prometiendo lo anterior.</tspan></text></svg>
