<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 562" width="960" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arranque y entrega: lo que cuesta ejecutar la CLI y lo que declara el paquete</title><desc id="d">Mediana de siete ejecuciones: python -c pass tarda 142 ms en Windows y 21 en Linux; python -I -S -c pass 53 y 11; la CLI completa con el caso del laboratorio 236 ms en Windows y 224 en Linux (en Linux los archivos estaban en un disco de Windows montado). pyproject.toml declara el paquete msep-diagnostic-cli, Python 3.11 o posterior, setuptools 68 o posterior y el comando diagnostic-cli.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="562" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Milisegundos de reloj (mediana de 7)</tspan></text><text x="260" y="63" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">intérprete vacío · Windows</tspan></text><rect x="270" y="42" width="312.4" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590.4" y="63" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="590.4" dy="0">142</tspan></text><text x="260" y="99" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">-I -S vacío · Windows</tspan></text><rect x="270" y="78" width="116.6" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="394.6" y="99" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="394.6" dy="0">53</tspan></text><text x="260" y="135" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">CLI completa · Windows</tspan></text><rect x="270" y="114" width="519.2" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="797.2" y="135" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="797.2" dy="0">236</tspan></text><text x="260" y="171" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">intérprete vacío · Linux</tspan></text><rect x="270" y="150" width="46.2" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="324.2" y="171" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="324.2" dy="0">21</tspan></text><text x="260" y="207" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">-I -S vacío · Linux</tspan></text><rect x="270" y="186" width="24.2" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="302.2" y="207" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="302.2" dy="0">11</tspan></text><text x="260" y="243" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">CLI completa · Linux*</tspan></text><rect x="270" y="222" width="492.8" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="770.8" y="243" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="770.8" dy="0">224</tspan></text><rect x="10" y="270" width="294" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="291.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">pyproject.toml</tspan></text><rect x="310" y="270" width="634" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="627" y="291.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">Valor leído</tspan></text><rect x="10" y="312" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="335.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">nombre del paquete</tspan></text><rect x="310" y="312" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">msep-diagnostic-cli</tspan></text><rect x="10" y="358" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="381.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Python mínimo</tspan></text><rect x="310" y="358" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">&gt;=3.11</tspan></text><rect x="10" y="404" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="427.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">comando</tspan></text><rect x="310" y="404" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="427.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">diagnostic-cli → diagnostic_cli.cli:entrypoint</tspan></text><rect x="10" y="450" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="473.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">backend de construcción</tspan></text><rect x="310" y="450" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="473.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">setuptools&gt;=68 (setuptools.build_meta)</tspan></text><rect x="10" y="498" width="940" height="50.72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="519.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">*Linux leyó el código desde /mnt/c (WSL2 sobre el disco de Windows): el 224 ms incluye ese costo y no representa Linux nativo. El</tspan></text><text x="480" y="534.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">paquete no se construyó, instaló ni publicó en esta práctica; solo se leyeron sus metadatos.</tspan></text></svg>
