<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 381" width="960" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo se comportan los límites de entrada (1 MB) al probarlos de verdad</title><desc id="d">Un JSONL con 1.2 millones de líneas en blanco terminó con código 3 y input_too_large en la línea 1000001; una especificación de 1.1 MB terminó con 3; 40000 observaciones válidas repetidas terminaron con 4 por duplicado antes de alcanzar el límite. Con el límite multiplicado por diez, ninguna de las 15 pruebas originales falló.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="381" fill="#ffffff"/><rect x="10" y="14" width="294" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Entrada</tspan></text><rect x="310" y="14" width="84" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="352" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352" dy="0">Código</tspan></text><rect x="400" y="14" width="264" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Resultado</tspan></text><rect x="670" y="14" width="274" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Lectura</tspan></text><rect x="10" y="56" width="294" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="77.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1.2 millones de líneas en blanco (≈</tspan></text><text x="157" y="94.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1.2 MB)</tspan></text><rect x="310" y="56" width="84" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">3</tspan></text><rect x="400" y="56" width="264" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">input_too_large, línea 1000001</tspan></text><rect x="670" y="56" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">el contador de bytes incluye</tspan></text><text x="807" y="94.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">líneas vacías</tspan></text><rect x="10" y="115.28" width="294" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="137.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">especificación JSON con 1.1 MB de</tspan></text><text x="157" y="153.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">espacios</tspan></text><rect x="310" y="115.28" width="84" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="145.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">3</tspan></text><rect x="400" y="115.28" width="264" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="137.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">input_too_large (por tamaño del</tspan></text><text x="532" y="153.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">archivo)</tspan></text><rect x="670" y="115.28" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="137.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">se comprueba stat().st_size antes</tspan></text><text x="807" y="153.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">de leer</tspan></text><rect x="10" y="174.56" width="294" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="196.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">40 000 líneas válidas repetidas (≈</tspan></text><text x="157" y="213.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1.4 MB)</tspan></text><rect x="310" y="174.56" width="84" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="204.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">4</tspan></text><rect x="400" y="174.56" width="264" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="204.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">duplicate_observation (resolve)</tspan></text><rect x="670" y="174.56" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="196.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">el dominio rechaza antes que el</tspan></text><text x="807" y="213.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">límite de bytes</tspan></text><rect x="10" y="233.84" width="294" height="69.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="272.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">mutar MAX_INPUT_BYTES a 10 MB</tspan></text><rect x="310" y="233.84" width="84" height="69.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="255.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">(suite</tspan></text><text x="352" y="272.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">en</tspan></text><text x="352" y="289.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">verde)</tspan></text><rect x="400" y="233.84" width="264" height="69.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="272.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">sobrevive hasta añadir una prueba</tspan></text><rect x="670" y="233.84" width="274" height="69.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="264.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">ver SE-069: la regla no tenía</tspan></text><text x="807" y="280.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">prueba</tspan></text><rect x="10" y="313.76" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="335.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un límite que ninguna prueba cruza es una afirmación sin evidencia. Medir también el tiempo: 1.2 MB de líneas en blanco se</tspan></text><text x="480" y="352.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">rechazaron en unos 424 ms de reloj total en Windows, arranque del intérprete incluido.</tspan></text></svg>
