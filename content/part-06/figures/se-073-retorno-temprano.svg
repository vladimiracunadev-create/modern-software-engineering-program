<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un retorno temprano deja el estado a medias; copiar y confirmar lo evita</title><desc id="d">Dos columnas: en la versión mutante, score pasa de 2 a 5 y la función devuelve rechazo, de modo que el estado queda modificado aunque se rechazó; en la versión que copia y confirma, el rechazo devuelve el estado original sin cambios.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><text x="240" y="30" font-size="15" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="240" dy="0">Versión que muta en sitio</tspan></text><text x="720" y="30" font-size="15" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720" dy="0">Versión que copia y confirma</tspan></text><rect x="40" y="44" width="400" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="72.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Antes: {score: 2}</tspan></text><rect x="40" y="120" width="400" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="148.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">state[score] += 3 → score = 5</tspan></text><rect x="40" y="196" width="400" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">if rechazo: return «rechazo» (sin registrar next)</tspan></text><rect x="40" y="272" width="400" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="303.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="240" dy="0">Después: {score: 5} ← rechazado, pero modificado</tspan></text><rect x="520" y="44" width="400" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="720" y="72.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="720" dy="0">Antes: {score: 2}</tspan></text><rect x="520" y="120" width="400" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="720" y="148.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="720" dy="0">nuevo = dict(state); nuevo[score] += 3</tspan></text><rect x="520" y="196" width="400" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="720" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="720" dy="0">if rechazo: return «rechazo», state (original)</tspan></text><rect x="520" y="272" width="400" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="720" y="303.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="720" dy="0">Después: {score: 2} ← rechazo sin efecto</tspan></text><polyline points="240,94 240,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="240,170 240,196" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="240,246 240,272" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="720,94 720,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="720,170 720,196" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="720,246 720,272" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="340" width="880" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="363.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Ejecutado: el primer caso devuelve «rechazo» con {score: 5}; el segundo devuelve «rechazo» y conserva {score: 2}.</tspan></text></svg>
