<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres sorpresas de estado mutable observadas en Python</title><desc id="d">Tabla con tres observaciones: el orden de dos reglas que modifican la misma prioridad produce 9 o 5 según el orden; un argumento por defecto mutable acumula [1], [1, 2], [1, 2, 3]; y un atributo marcado con guion bajo se puede dejar en -100 porque la privacidad es solo una convención.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Observación</tspan></text><rect x="340" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">Resultado ejecutado</tspan></text><rect x="660" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Causa</tspan></text><rect x="10" y="56" width="324" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="99.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Dos reglas sobre la misma prioridad (+2 y</tspan></text><text x="172" y="115.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">×3), partiendo de 1</tspan></text><rect x="340" y="56" width="314" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="107.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">r1 luego r2 = 9; r2 luego r1 = 5</tspan></text><rect x="660" y="56" width="284" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="91" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">La secuencia es parte de la</tspan></text><text x="802" y="107.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">semántica: las operaciones no</tspan></text><text x="802" y="124.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">conmutan</tspan></text><rect x="10" y="158" width="324" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="209.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">def f(x, acc=[]) llamada tres veces</tspan></text><rect x="340" y="158" width="314" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="201.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">[1], luego [1, 2], luego [1, 2, 3] (el</tspan></text><text x="497" y="217.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">mismo objeto)</tspan></text><rect x="660" y="158" width="284" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="201.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">El valor por defecto se crea una</tspan></text><text x="802" y="217.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">vez, al definir la función</tspan></text><rect x="10" y="260" width="324" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="303.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Atributo _bal de una cuenta con property</tspan></text><text x="172" y="319.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">sin setter</tspan></text><rect x="340" y="260" width="314" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="311.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">a.bal = 99 falla; a._bal = -100 funciona</tspan></text><rect x="660" y="260" width="284" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="295" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">El guion bajo es convención, no</tspan></text><text x="802" y="311.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">barrera: la invariante debe vivir en</tspan></text><text x="802" y="328.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">un método</tspan></text><rect x="10" y="344" width="940" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="367.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cada sorpresa desaparece al hacer explícito quién posee el estado y cuándo cambia.</tspan></text></svg>
