<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres sorpresas de estado mutable observadas en Python, de la observación a su causa</title><desc id="d">Diagrama de tres observaciones y su causa: el orden de dos reglas que modifican la misma prioridad produce 9 o 5; un argumento por defecto mutable acumula las listas 1; 1 y 2; 1, 2 y 3; y un atributo con guion bajo se puede dejar en -100 porque la privacidad es solo una convención.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres sorpresas de estado mutable observadas en Python, de la observación a su causa</tspan></text><text x="159" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="159" dy="0">Observación</tspan></text><text x="465" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="465" dy="0">Resultado ejecutado</tspan></text><text x="771" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="771" dy="0">Causa</tspan></text><rect x="14" y="71" width="290" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="102.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">Dos reglas sobre la misma prioridad</tspan></text><text x="159" y="118.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">(+2 y ×3), partiendo de 1</tspan></text><polyline points="308,106.96 326,106.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="71" width="270" height="71.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">r1 luego r2 = 9; r2 luego r1 = 5</tspan></text><polyline points="604,106.96 622,106.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="71" width="290" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="771" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">La secuencia es parte de la</tspan></text><text x="771" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">semántica: las operaciones no</tspan></text><text x="771" y="127.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">conmutan</tspan></text><rect x="14" y="154.92" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="186.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">def f(x, acc=[]) llamada tres veces</tspan></text><polyline points="308,182.56 326,182.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="154.92" width="270" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">[1], luego [1, 2], luego [1, 2,</tspan></text><text x="465" y="194.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">3]: el mismo objeto</tspan></text><polyline points="604,182.56 622,182.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="154.92" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="771" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">El valor por defecto se crea una vez,</tspan></text><text x="771" y="194.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">al definir la función</tspan></text><rect x="14" y="222.2" width="290" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="253.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">Atributo _bal de una cuenta con</tspan></text><text x="159" y="270.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">property sin setter</tspan></text><polyline points="308,258.16 326,258.16" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="222.2" width="270" height="71.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="253.48" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">a.bal = 99 falla; a._bal = -100</tspan></text><text x="465" y="270.12" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">funciona</tspan></text><polyline points="604,258.16 622,258.16" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="222.2" width="290" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="771" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">El guion bajo es convención, no</tspan></text><text x="771" y="261.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">barrera: la invariante debe vivir en</tspan></text><text x="771" y="278.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">un método</tspan></text><rect x="10" y="312.12" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="342.76" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada sorpresa desaparece al hacer explícito quién posee el estado y cuándo cambia.</tspan></text><text x="470" y="396.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
