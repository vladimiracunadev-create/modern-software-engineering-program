<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Efectos ocultos en funciones: caché de una función con efecto y paso de objetos</title><desc id="d">Tabla con tres observaciones: al envolver con lru_cache una función que registra un efecto, tres llamadas producen un solo efecto; una función que añade a la lista recibida modifica la lista del llamador mientras reasignar el parámetro no; y una función pura se puede memoizar sin cambiar su significado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="420" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Experimento</tspan></text><rect x="340" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Resultado ejecutado</tspan></text><rect x="600" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Consecuencia para el diseño</tspan></text><rect x="10" y="56" width="324" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">impure(x) agrega a una lista y devuelve x</tspan></text><text x="172" y="105.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">+ 1; envuelta con lru_cache; tres</tspan></text><text x="172" y="122.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">llamadas con 1</tspan></text><rect x="340" y="56" width="254" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="97.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">1 efecto registrado en 3</tspan></text><text x="467" y="113.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">llamadas</tspan></text><rect x="600" y="56" width="344" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="89" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Memoizar una función con efecto cambia el</tspan></text><text x="772" y="105.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">comportamiento; solo es válido si la función</tspan></text><text x="772" y="122.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">es pura</tspan></text><rect x="10" y="154" width="324" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="203.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">mut(l): l.append(1) y rebind(l): l = [9]</tspan></text><rect x="340" y="154" width="254" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="195.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Tras ambas, la lista del</tspan></text><text x="467" y="211.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">llamador es [1]</tspan></text><rect x="600" y="154" width="344" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Los argumentos pasan por referencia al</tspan></text><text x="772" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">objeto: mutar se ve, reasignar el nombre</tspan></text><text x="772" y="220.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">local no</tspan></text><rect x="10" y="252" width="324" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">pure(x) = x + 1 con la misma envoltura</tspan></text><rect x="340" y="252" width="254" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Mismo resultado con y sin caché</tspan></text><rect x="600" y="252" width="344" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="293.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">La pureza es lo que permite sustituir una</tspan></text><text x="772" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">llamada por su resultado</tspan></text><rect x="10" y="366" width="940" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="389.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un contrato de procedimiento debe declarar si lee, escribe o solo calcula.</tspan></text></svg>
