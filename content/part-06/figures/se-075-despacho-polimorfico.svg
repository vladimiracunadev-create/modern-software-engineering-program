<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Despacho polimórfico frente a una cadena de condiciones</title><desc id="d">Barras en nanosegundos por objeto: en Windows el despacho por método tarda unos 135 ns y la condición por tipo unos 110 ns; en Linux unos 108 ns frente a 78 ns. El polimorfismo cuesta entre 22 % y 38 % más por llamada en este microbenchmark.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="380" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Nanosegundos por objeto (mil objetos de dos clases, mediana)</tspan></text><text x="210" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">Windows, método</tspan></text><rect x="220" y="44" width="405.3" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="633.3" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="633.3" dy="0">135 ns</tspan></text><text x="210" y="111" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">Windows, if por tipo</tspan></text><rect x="220" y="90" width="331.2" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="559.2" y="111" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="559.2" dy="0">110 ns</tspan></text><text x="210" y="157" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">Linux, método</tspan></text><rect x="220" y="136" width="324" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="552" y="157" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="552" dy="0">108 ns</tspan></text><text x="210" y="203" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">Linux, if por tipo</tspan></text><rect x="220" y="182" width="234.6" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="462.6" y="203" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="462.6" dy="0">78 ns</tspan></text><rect x="20" y="240" width="900" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="275.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El costo por llamada es pequeño y aparece a escala de millones. A cambio, añadir una tercera clase no modifica el bucle,</tspan></text><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mientras que la cadena de condiciones debe editarse en cada lugar donde se pregunta por el tipo.</tspan></text><text x="470" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
