<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro comportamientos funcionales que sorprenden en Python</title><desc id="d">Tabla: las lambdas creadas en un bucle ven la variable final y devuelven [2, 2, 2], mientras que fijar el valor con un argumento por defecto da [0, 1, 2]; una tupla puede contener una lista mutable; la composición no es conmutativa: componer inc y dbl da 8 y dbl e inc da 7; y reduce sobre una lista vacía sin valor inicial falla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Experimento</tspan></text><rect x="310" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Resultado ejecutado</tspan></text><rect x="640" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Qué enseña</tspan></text><rect x="10" y="56" width="294" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="95.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">[lambda: i for i in range(3)]</tspan></text><rect x="310" y="56" width="324" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="95.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">[2, 2, 2]; con lambda i=i: i → [0, 1, 2]</tspan></text><rect x="640" y="56" width="304" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="87.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Un cierre captura la variable, no su valor</tspan></text><text x="792" y="103.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">en ese instante</tspan></text><rect x="10" y="134" width="294" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="173.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">t = (1, [2]); t[1].append(3)</tspan></text><rect x="310" y="134" width="324" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="173.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">(1, [2, 3]); t[0] = 9 falla</tspan></text><rect x="640" y="134" width="304" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="165.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Inmutabilidad superficial: la tupla</tspan></text><text x="792" y="181.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">protege sus referencias, no los objetos</tspan></text><rect x="10" y="212" width="294" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="243.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">compose(inc, dbl)(3) y compose(dbl,</tspan></text><text x="157" y="259.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">inc)(3)</tspan></text><rect x="310" y="212" width="324" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="251.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">8 y 7</tspan></text><rect x="640" y="212" width="304" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="243.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Composición asociativa, no conmutativa: el</tspan></text><text x="792" y="259.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">orden es significado</tspan></text><rect x="10" y="290" width="294" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="329.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">reduce(suma, []) sin valor inicial</tspan></text><rect x="310" y="290" width="324" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">TypeError</tspan></text><rect x="640" y="290" width="304" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="321.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Una operación sin elemento neutro necesita</tspan></text><text x="792" y="337.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">un caso vacío explícito</tspan></text></svg>
