<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro comportamientos funcionales que sorprenden en Python</title><desc id="d">Diagrama de cuatro experimentos: las lambdas creadas en un bucle ven la variable final y devuelven 2, 2 y 2, mientras que fijar el valor con un argumento por defecto da 0, 1 y 2; una tupla puede contener una lista mutable; la composición no es conmutativa: componer inc y dbl da 8 y dbl e inc da 7; y reduce sobre una lista vacía sin valor inicial falla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro comportamientos funcionales que sorprenden en Python</tspan></text><text x="159" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="159" dy="0">Experimento</tspan></text><text x="465" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="465" dy="0">Resultado ejecutado</tspan></text><text x="771" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="771" dy="0">Qué enseña</tspan></text><rect x="14" y="71" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="102.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">[lambda: i for i in range(3)]</tspan></text><polyline points="308,98.64 326,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="71" width="270" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">[2, 2, 2]; con lambda i=i: i → [0,</tspan></text><text x="465" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">1, 2]</tspan></text><polyline points="604,98.64 622,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="71" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="771" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">Un cierre captura la variable, no su</tspan></text><text x="771" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">valor en ese instante</tspan></text><rect x="14" y="138.28" width="290" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="177.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">t = (1, [2]); t[1].append(3)</tspan></text><polyline points="308,174.24 326,174.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="138.28" width="270" height="71.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">(1, [2, 3]); t[0] = 9 falla</tspan></text><polyline points="604,174.24 622,174.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="138.28" width="290" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="771" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">Inmutabilidad superficial: la tupla</tspan></text><text x="771" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">protege sus referencias, no los</tspan></text><text x="771" y="194.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">objetos</tspan></text><rect x="14" y="222.2" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="245.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">compose(inc, dbl)(3) y compose(dbl,</tspan></text><text x="159" y="261.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">inc)(3)</tspan></text><polyline points="308,249.84 326,249.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="222.2" width="270" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="253.48" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">8 y 7</tspan></text><polyline points="604,249.84 622,249.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="222.2" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="771" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">Composición asociativa, no</tspan></text><text x="771" y="261.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">conmutativa: el orden es significado</tspan></text><rect x="14" y="289.48" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="320.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">reduce(suma, []) sin valor inicial</tspan></text><polyline points="308,317.12 326,317.12" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="289.48" width="270" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="320.76" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">TypeError</tspan></text><polyline points="604,317.12 622,317.12" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="289.48" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="771" y="312.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">Una operación sin elemento neutro</tspan></text><text x="771" y="329.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">necesita un caso vacío explícito</tspan></text><rect x="10" y="362.76" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="387.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada sorpresa nace de una regla del lenguaje que se aplica sin avisar: la captura por variable, la inmutabilidad</tspan></text><text x="470" y="404.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">superficial, el orden de la composición y el caso vacío.</tspan></text><text x="470" y="452.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
