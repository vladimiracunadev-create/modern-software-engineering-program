<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El precio de no mutar: actualizar un elemento copiando frente a hacerlo en sitio</title><desc id="d">Tabla con dos mediciones: cambiar un elemento de una lista de 10000 copiando tarda unos 98 microsegundos frente a unos 81 nanosegundos en sitio, unas 1200 veces más; y calcular fib(25) con memoización hace 26 cálculos y 23 aciertos en vez de recomputar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Operación</tspan></text><rect x="370" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Windows</tspan></text><rect x="520" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Linux</tspan></text><rect x="660" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Lectura</tspan></text><rect x="10" y="56" width="354" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="82.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Actualizar un elemento de 10000 copiando (lst[:k]</tspan></text><text x="187" y="98.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">+ [x] + lst[k+1:])</tspan></text><rect x="370" y="56" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">98 291 ns</tspan></text><rect x="520" y="56" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">94 720 ns</tspan></text><rect x="660" y="56" width="284" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Cuesta O(n) por actualización</tspan></text><rect x="10" y="124" width="354" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Actualizar el mismo elemento en sitio</tspan></text><rect x="370" y="124" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">81 ns</tspan></text><rect x="520" y="124" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">56 ns</tspan></text><rect x="660" y="124" width="284" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="150.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Cuesta O(1) pero destruye el valor</tspan></text><text x="802" y="166.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">anterior</tspan></text><rect x="10" y="192" width="354" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="226.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">fib(25) sin memoización</tspan></text><rect x="370" y="192" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">27,2 ms</tspan></text><rect x="520" y="192" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">—</tspan></text><rect x="660" y="192" width="284" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Recomputa subproblemas</tspan></text><rect x="10" y="260" width="354" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">fib(25) con lru_cache</tspan></text><rect x="370" y="260" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="286.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">26 fallos, 23</tspan></text><text x="442" y="302.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">aciertos</tspan></text><rect x="520" y="260" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">igual</tspan></text><rect x="660" y="260" width="284" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Solo es válido porque fib es pura</tspan></text><rect x="10" y="332" width="940" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="353.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Las estructuras persistentes comparten partes en vez de copiar todo; Python no las trae en su biblioteca estándar, así que copiar tiene</tspan></text><text x="480" y="369.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">un costo real que debe medirse.</tspan></text></svg>
