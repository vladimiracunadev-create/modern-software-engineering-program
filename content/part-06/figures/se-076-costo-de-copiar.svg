<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El precio de no mutar: actualizar un elemento de una lista de 10 000 copiando frente a hacerlo en sitio</title><desc id="d">Barras agrupadas en escala logarítmica con el costo de cambiar un elemento de una lista de 10000: copiando tarda unos 98 291 nanosegundos en Windows y 94 720 en Linux; en sitio, 81 y 56, unas 1 200 veces menos. Calcular fib(25) con memoización hace 26 cálculos y 23 aciertos en vez de recomputar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El precio de no mutar: actualizar un elemento de una lista de 10 000 copiando frente a hacerlo en sitio</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Linux</tspan></text><line x1="284" y1="77" x2="284" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="205" x2="284" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">10</tspan></text><line x1="429.91" y1="77" x2="429.91" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="429.91" y1="205" x2="429.91" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="429.91" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429.91" dy="0">100</tspan></text><line x1="575.82" y1="77" x2="575.82" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="575.82" y1="205" x2="575.82" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="575.82" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575.82" dy="0">1 000</tspan></text><line x1="721.73" y1="77" x2="721.73" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="721.73" y1="205" x2="721.73" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="721.73" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="721.73" dy="0">10 000</tspan></text><line x1="867.64" y1="77" x2="867.64" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="205" x2="867.64" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100 000</tspan></text><line x1="284" y1="205" x2="867.64" y2="205" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Copiando: lst[:k] + [x] + lst[k+1:]</tspan></text><text x="274" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">En sitio</tspan></text><rect x="284" y="83" width="582.548" height="24.5" rx="3" fill="#946512"/><text x="873.548" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="873.548" dy="0">98 291</tspan></text><rect x="284" y="110.5" width="580.203" height="24.5" rx="3" fill="#087f8c"/><text x="871.203" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="871.203" dy="0">94 720</tspan></text><rect x="284" y="147" width="132.557" height="24.5" rx="3" fill="#946512"/><text x="423.557" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="423.557" dy="0">81</tspan></text><rect x="284" y="174.5" width="109.168" height="24.5" rx="3" fill="#087f8c"/><text x="400.168" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="400.168" dy="0">56</tspan></text><text x="575.82" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="575.82" dy="0">Nanosegundos por actualización (escala logarítmica)</tspan></text><rect x="10" y="263" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Copiar cuesta O(n) por actualización y en sitio O(1), pero destruye el valor anterior. fib(25) sin memoización tardó 27,2</tspan></text><text x="470" y="304.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ms en Windows; con lru_cache hizo 26 fallos y 23 aciertos, válido solo porque fib es pura. Las estructuras persistentes</tspan></text><text x="470" y="321.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">comparten partes; Python no las trae en la biblioteca estándar, así que copiar tiene un costo real que debe medirse.</tspan></text><text x="470" y="368.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
