<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Filtrar cien mil números de tres maneras</title><desc id="d">Barras en nanosegundos por elemento: la comprensión de listas tarda 93 ns en Windows y 56 ns en Linux, el bucle con append 98 y 72, y map con filter y lambdas 219 y 227, unas 2,4 y 4 veces más que la comprensión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Nanosegundos por elemento (cien mil elementos, mediana)</tspan></text><text x="260" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Win · comprensión</tspan></text><rect x="270" y="44" width="139.5" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="417.5" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="417.5" dy="0">93 ns</tspan></text><text x="260" y="111" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Win · bucle y append</tspan></text><rect x="270" y="90" width="146.4" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="424.4" y="111" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="424.4" dy="0">98 ns</tspan></text><text x="260" y="157" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Win · map + filter + lambda</tspan></text><rect x="270" y="136" width="329.1" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="607.1" y="157" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="607.1" dy="0">219 ns</tspan></text><text x="260" y="203" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Linux · comprensión</tspan></text><rect x="270" y="182" width="83.85" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="361.85" y="203" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="361.85" dy="0">56 ns</tspan></text><text x="260" y="249" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Linux · bucle y append</tspan></text><rect x="270" y="228" width="107.7" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="385.7" y="249" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="385.7" dy="0">72 ns</tspan></text><text x="260" y="295" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Linux · map + filter + lambda</tspan></text><rect x="270" y="274" width="340.8" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="618.8" y="295" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="618.8" dy="0">227 ns</tspan></text><rect x="20" y="328" width="900" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="349.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ser funcional no significa usar map y lambda: en CPython la comprensión es la forma declarativa más rápida; las lambdas añaden una</tspan></text><text x="470" y="365.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">llamada por elemento.</tspan></text></svg>
