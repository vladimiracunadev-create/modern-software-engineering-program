<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reglas como datos: cuántas se activan a la vez y qué decide el orden</title><desc id="d">Con tres reglas y diez mil observaciones sintéticas, ninguna observación queda sin regla, 7511 activan una regla y 2489 activan dos. Para una observación con latencia 900 y no autorizada, usar la primera coincidencia da R1, usar la prioridad da R2 y la lista invertida da R2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Coincidencias por observación (10 000 sintéticas)</tspan></text><text x="220" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">0 reglas</tspan></text><rect x="230" y="44" width="4" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="242" dy="0">0</tspan></text><text x="220" y="109" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">1 regla</tspan></text><rect x="230" y="88" width="600.88" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="838.88" y="109" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="838.88" dy="0">7511</tspan></text><text x="220" y="153" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">2 reglas (conflicto)</tspan></text><rect x="230" y="132" width="199.12" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="437.12" y="153" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="437.12" dy="0">2489</tspan></text><rect x="20" y="196" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="218.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Política de resolución</tspan></text><rect x="450" y="196" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="218.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">Resultado para 900 ms, no autorizado</tspan></text><rect x="20" y="240" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="266.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Primera coincidencia, orden R1, R2, R3</tspan></text><rect x="450" y="240" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="266.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">R1 (inspect-transport)</tspan></text><rect x="20" y="292" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="318.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Mayor prioridad (R2 = 2)</tspan></text><rect x="450" y="292" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="318.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">R2 (deny)</tspan></text><rect x="20" y="344" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="370.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Primera coincidencia, orden invertido</tspan></text><rect x="450" y="344" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="370.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">R2 (deny)</tspan></text><rect x="20" y="360" width="900" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El resultado depende de la política de conflictos, que es parte de la regla aunque no figure en ella. Sin definirla, dos</tspan></text><text x="470" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">revisores leen programas distintos.</tspan></text></svg>
