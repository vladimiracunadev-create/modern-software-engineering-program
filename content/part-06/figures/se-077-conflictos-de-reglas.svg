<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reglas como datos: cuántas reglas se activan a la vez en 10 000 observaciones sintéticas</title><desc id="d">Barras con las observaciones según las reglas que activan: ninguna observación queda sin regla, 7511 activan una regla y 2489 activan dos. Para una observación con latencia 900 y no autorizada, usar la primera coincidencia da R1, usar la prioridad da R2 y la lista invertida da R2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reglas como datos: cuántas reglas se activan a la vez en 10 000 observaciones sintéticas</tspan></text><line x1="194" y1="49" x2="194" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="163" x2="194" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">0</tspan></text><line x1="364.425" y1="49" x2="364.425" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="364.425" y1="163" x2="364.425" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="364.425" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364.425" dy="0">2 000</tspan></text><line x1="534.85" y1="49" x2="534.85" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="534.85" y1="163" x2="534.85" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="534.85" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534.85" dy="0">4 000</tspan></text><line x1="705.275" y1="49" x2="705.275" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="705.275" y1="163" x2="705.275" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="705.275" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.275" dy="0">6 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="163" x2="875.7" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">8 000</tspan></text><line x1="194" y1="163" x2="875.7" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">0 reglas</tspan></text><text x="184" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">1 regla</tspan></text><text x="184" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">2 reglas (conflicto)</tspan></text><rect x="194" y="55" width="2" height="26" rx="3" fill="#946512"/><text x="203" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="203" dy="0">0</tspan></text><rect x="194" y="93" width="640.031" height="26" rx="3" fill="#946512"/><text x="841.031" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="841.031" dy="0">7 511</tspan></text><rect x="194" y="131" width="212.094" height="26" rx="3" fill="#946512"/><text x="413.094" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="413.094" dy="0">2 489</tspan></text><text x="534.85" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="534.85" dy="0">Observaciones de 10 000</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Para 900 ms y no autorizado: la primera coincidencia con el orden R1, R2, R3 da R1 (inspect-transport); la mayor prioridad</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(R2 = 2) da R2 (deny); la primera coincidencia con el orden invertido da R2 (deny). El resultado depende de la política de</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">conflictos, que es parte de la regla aunque no figure en ella.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
