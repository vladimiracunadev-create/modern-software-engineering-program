<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una consulta declarativa y el plan que elige el motor</title><desc id="d">Barras en milisegundos para contar observaciones con latencia mayor que 800 y autorizadas en 200000 filas: sin índice el plan es SCAN y tarda unos 31 ms en Windows; con un índice sobre la latencia el plan es SEARCH USING INDEX y tarda unos 103 ms, es decir más lento, con el mismo resultado de 60000 filas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Milisegundos por consulta (SQLite 3.45, 200000 filas, mediana)</tspan></text><text x="240" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">Win · SCAN obs</tspan></text><rect x="250" y="44" width="81.12" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="339.12" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="339.12" dy="0">31 ms</tspan></text><text x="240" y="111" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">Win · SEARCH con índice</tspan></text><rect x="250" y="90" width="268.84" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="526.84" y="111" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="526.84" dy="0">103 ms</tspan></text><text x="240" y="157" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">Linux · SCAN obs</tspan></text><rect x="250" y="136" width="48.88" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="306.88" y="157" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="306.88" dy="0">19 ms</tspan></text><text x="240" y="203" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">Linux · SEARCH con índice</tspan></text><rect x="250" y="182" width="205.92" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="463.92" y="203" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="463.92" dy="0">79 ms</tspan></text><rect x="20" y="240" width="900" height="82" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="276.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El predicado latency &gt; 800 selecciona el 60 % de las filas; recorrer un índice y saltar a cada fila cuesta más que leer</tspan></text><text x="470" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la tabla de corrido. Declarar qué se quiere no garantiza el mejor camino: el plan se verifica con EXPLAIN QUERY PLAN.</tspan></text><rect x="20" y="336" width="900" height="36" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="357.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">La consulta no cambió entre las dos mediciones: solo cambió el plan.</tspan></text></svg>
