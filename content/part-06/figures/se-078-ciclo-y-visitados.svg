<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un ciclo en los hechos: recursión sin memoria y recorrido con visitados</title><desc id="d">Un grafo a, b, c con aristas a hacia b, b hacia c y c hacia a. La definición recursiva ingenua del ancestro sobre una consulta sin solución recorre el ciclo hasta RecursionError; un recorrido con conjunto de visitados responde falso para el destino z y verdadero para c.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><rect x="60" y="60" width="70" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="95" y="87.2" font-size="15" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="95" dy="0">a</tspan></text><rect x="260" y="60" width="70" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="295" y="87.2" font-size="15" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="295" dy="0">b</tspan></text><rect x="160" y="200" width="70" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="195" y="227.2" font-size="15" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="195" dy="0">c</tspan></text><polyline points="130,83 260,83" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="295,106 210,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="160,223 95,106" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="400" y="40" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="62.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Estrategia</tspan></text><rect x="630" y="40" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="62.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">ancestro(a, z)</tspan></text><rect x="790" y="40" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="62.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">ancestro(a, c)</tspan></text><rect x="400" y="84" width="224" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="126.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">Recursión directa sin memoria</tspan></text><rect x="630" y="84" width="154" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="111" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">RecursionError</tspan></text><text x="707" y="126.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">(profundidad &gt;</tspan></text><text x="707" y="141.72" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">1000)</tspan></text><rect x="790" y="84" width="124" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="126.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">no medido</tspan></text><rect x="400" y="168" width="224" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="202.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">Recorrido con conjunto de</tspan></text><text x="512" y="218.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">visitados</tspan></text><rect x="630" y="168" width="154" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="210.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">False</tspan></text><rect x="790" y="168" width="124" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="210.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">True</tspan></text><rect x="20" y="292" width="900" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El tabling de SWI-Prolog resuelve esto de forma declarativa memorizando subobjetivos; aquí se reproduce el efecto con un</tspan></text><text x="470" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">conjunto de visitados.</tspan></text><rect x="20" y="358" width="900" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Prolog no se ejecutó (no estaba instalado): el comportamiento del tabling se cita de la documentación.</tspan></text></svg>
