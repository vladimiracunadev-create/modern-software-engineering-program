<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El orden de las metas no cambia la respuesta pero sí el trabajo</title><desc id="d">Con 300 hechos padre(pN, pN+1) y tres metas encadenadas, el orden que empieza por la meta con la constante final llega a la misma respuesta p297 con 903 inferencias, mientras el orden que empieza sin restricciones necesita 180600, unas 200 veces más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="380" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Comparaciones de unificación hasta obtener todas las soluciones</tspan></text><text x="260" y="71" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Metas con la constante primero</tspan></text><rect x="270" y="50" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="282" y="71" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="282" dy="0">903</tspan></text><text x="260" y="127" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Metas sin restricción primero</tspan></text><rect x="270" y="106" width="541.8" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="819.8" y="127" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="819.8" dy="0">180 600</tspan></text><rect x="20" y="180" width="900" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="218.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Respuesta idéntica en ambos órdenes: [p297]. La lógica fija el significado; el orden de búsqueda decide el costo.</tspan></text><rect x="20" y="266" width="900" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="296.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En Prolog el motor intenta las metas de izquierda a derecha y las cláusulas de arriba abajo, así que escribir mal el</tspan></text><text x="470" y="312.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">orden no cambia lo verdadero, pero puede hacer inviable consultarlo.</tspan></text></svg>
