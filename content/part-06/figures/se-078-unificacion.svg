<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Unificación: tres casos ejecutados con un unificador mínimo</title><desc id="d">Tabla de tres casos: f(a,2) con f(1,b) unifica con a=1 y b=2; f(1) con f(2) falla; y X con f(X) es aceptado porque el unificador mínimo no hace la comprobación de ocurrencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><rect x="10" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Términos</tspan></text><rect x="240" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">Resultado ejecutado</tspan></text><rect x="540" y="12" width="404" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Lectura</tspan></text><rect x="10" y="56" width="224" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="105.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">f(A, 2) = f(1, B)</tspan></text><rect x="240" y="56" width="294" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="105.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">Éxito: A = 1 y B = 2</tspan></text><rect x="540" y="56" width="404" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="97.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Las variables se ligan en ambos sentidos: no hay</tspan></text><text x="742" y="113.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">entrada y salida fijas</tspan></text><rect x="10" y="154" width="224" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="203.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">f(1) = f(2)</tspan></text><rect x="240" y="154" width="294" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">Fallo (None)</tspan></text><rect x="540" y="154" width="404" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="195.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Dos constantes distintas no unifican; la búsqueda</tspan></text><text x="742" y="211.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">retrocede</tspan></text><rect x="10" y="252" width="224" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">X = f(X)</tspan></text><rect x="240" y="252" width="294" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="293.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">Aceptado sin comprobación de</tspan></text><text x="387" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">ocurrencia</tspan></text><rect x="540" y="252" width="404" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="293.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Crea una estructura infinita; Prolog estándar lo</tspan></text><text x="742" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">permite salvo que se use unify_with_occurs_check</tspan></text><rect x="10" y="350" width="940" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="373.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El unificador de este experimento es una herramienta didáctica, no el motor de un Prolog real.</tspan></text></svg>
