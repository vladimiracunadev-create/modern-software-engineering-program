<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 397" width="940" height="397" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Unificación: tres casos ejecutados con un unificador mínimo</title><desc id="d">Diagrama de tres casos: f(a,2) con f(1,b) unifica con a=1 y b=2; f(1) con f(2) falla; y X con f(X) es aceptado porque el unificador mínimo no hace la comprobación de ocurrencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="397" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Unificación: tres casos ejecutados con un unificador mínimo</tspan></text><text x="129" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="129" dy="0">Términos</tspan></text><text x="415" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="415" dy="0">Resultado ejecutado</tspan></text><text x="751" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="751" dy="0">Lectura</tspan></text><rect x="14" y="71" width="230" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="129" y="102.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="129" dy="0">f(A, 2) = f(1, B)</tspan></text><polyline points="248,98.64 266,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="71" width="290" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="415" y="102.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="415" dy="0">Éxito: A = 1 y B = 2</tspan></text><polyline points="564,98.64 582,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="586" y="71" width="330" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="751" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">Las variables se ligan en ambos sentidos:</tspan></text><text x="751" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">no hay entrada y salida fijas</tspan></text><rect x="14" y="138.28" width="230" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="129" y="169.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="129" dy="0">f(1) = f(2)</tspan></text><polyline points="248,165.92 266,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="138.28" width="290" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="415" y="169.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="415" dy="0">Fallo (None)</tspan></text><polyline points="564,165.92 582,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="586" y="138.28" width="330" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="751" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">Dos constantes distintas no unifican; la</tspan></text><text x="751" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">búsqueda retrocede</tspan></text><rect x="14" y="205.56" width="230" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="129" y="245.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="129" dy="0">X = f(X)</tspan></text><polyline points="248,241.52 266,241.52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="205.56" width="290" height="71.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="415" y="236.84" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="415" dy="0">Aceptado sin comprobación de</tspan></text><text x="415" y="253.48" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="415" dy="0">ocurrencia</tspan></text><polyline points="564,241.52 582,241.52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="586" y="205.56" width="330" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="751" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">Crea una estructura infinita; Prolog</tspan></text><text x="751" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">estándar lo permite salvo con</tspan></text><text x="751" y="261.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">unify_with_occurs_check</tspan></text><rect x="10" y="295.48" width="920" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="326.12" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El unificador de este experimento es una herramienta didáctica, no el motor de un Prolog real.</tspan></text><text x="470" y="379.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
