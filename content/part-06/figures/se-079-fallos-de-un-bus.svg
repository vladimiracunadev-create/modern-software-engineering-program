<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro fallos típicos de un bus de eventos ejecutados</title><desc id="d">Tabla: si el segundo de tres manejadores lanza una excepción el tercero nunca corre; un manejador que emite el mismo evento llega a profundidad 5; sin identificador de evento una entrega duplicada suma 13 en vez de 8; y una excepción dentro de una tarea no esperada queda guardada en la tarea sin interrumpir al resto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Experimento</tspan></text><rect x="330" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Resultado ejecutado</tspan></text><rect x="610" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Lectura</tspan></text><rect x="10" y="56" width="314" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="90.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Tres manejadores; el segundo lanza</tspan></text><text x="167" y="106.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">RuntimeError</tspan></text><rect x="330" y="56" width="274" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="90.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">El registro quedó [h1]; h3 nunca</tspan></text><text x="467" y="106.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">corrió</tspan></text><rect x="610" y="56" width="334" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="90.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Un despachador síncrono ligado a sus</tspan></text><text x="777" y="106.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">manejadores propaga el fallo al emisor</tspan></text><rect x="10" y="140" width="314" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="182.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Un manejador de «y» vuelve a emitir «y»</tspan></text><rect x="330" y="140" width="274" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="182.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Profundidad máxima de 5</tspan></text><rect x="610" y="140" width="334" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="174.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Sin límite ni cola, la reentrada es recursión</tspan></text><text x="777" y="190.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">disfrazada</tspan></text><rect x="10" y="224" width="314" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="258.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Eventos e1 (5), e1 (5), e2 (3) entregados</tspan></text><text x="167" y="274.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">dos veces el primero</tspan></text><rect x="330" y="224" width="274" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="266.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Suma 13 sin id; 8 con id de evento</tspan></text><rect x="610" y="224" width="334" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="258.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Con entrega «al menos una vez» el consumidor</tspan></text><text x="777" y="274.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">debe ser idempotente</tspan></text><rect x="10" y="308" width="314" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="342.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Tarea creada con create_task que lanza</tspan></text><text x="167" y="358.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">ValueError y nadie la espera</tspan></text><rect x="330" y="308" width="274" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="342.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">La tarea terminó con la excepción</tspan></text><text x="467" y="358.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">guardada</tspan></text><rect x="610" y="308" width="334" height="78" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="342.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Si nadie la consulta, el error aparece tarde o</tspan></text><text x="777" y="358.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">nunca como un aviso</tspan></text></svg>
