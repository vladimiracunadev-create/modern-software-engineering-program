<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un manejador bloqueante detiene todos los eventos del mismo bucle</title><desc id="d">Barras: un temporizador configurado para 10 ms tiene un intervalo mediano de 11,9 ms en Windows y 10,2 ms en Linux, pero cuando otro manejador bloquea 300 ms el intervalo máximo observado es de 300,6 ms en Windows y 310,5 ms en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="340" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Milisegundos entre ticks consecutivos (objetivo: 10 ms)</tspan></text><text x="180" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Win · mediana</tspan></text><rect x="190" y="44" width="26.18" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224.18" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="224.18" dy="0">11,9 ms</tspan></text><text x="180" y="111" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Win · máximo</tspan></text><rect x="190" y="90" width="661.32" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="859.32" y="111" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="859.32" dy="0">300,6 ms</tspan></text><text x="180" y="157" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Linux · mediana</tspan></text><rect x="190" y="136" width="22.44" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.44" y="157" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="220.44" dy="0">10,2 ms</tspan></text><text x="180" y="203" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Linux · máximo</tspan></text><rect x="190" y="182" width="683.1" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="881.1" y="203" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="881.1" dy="0">310,5 ms</tspan></text><rect x="20" y="238" width="900" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="270.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El bucle de eventos es un solo hilo que alterna entre manejadores. Un time.sleep(0.3) dentro de un manejador no cede el</tspan></text><text x="470" y="286.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">control: durante 300 ms no hubo ningún otro evento atendido.</tspan></text></svg>
