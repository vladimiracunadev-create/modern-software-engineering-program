<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Orden en que el bucle de eventos de asyncio atiende lo que se programó</title><desc id="d">Secuencia observada: primero el código síncrono que sigue a la programación, luego las dos devoluciones de llamada call_soon en el orden en que se registraron, después la tarea creada con create_task y por último la devolución de call_later con retardo cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="340" fill="#ffffff"/><text x="20" y="28" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Registro en el código: call_soon(1), call_later(0), call_soon(2), create_task, y una línea síncrona</tspan></text><rect x="20" y="90" width="170" height="78" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="105" y="116" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="105" dy="0">línea síncrona</tspan></text><text x="105" y="132.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="105" dy="0">posterior a</tspan></text><text x="105" y="149.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="105" dy="0">programar</tspan></text><circle cx="105" cy="78" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">1</tspan></text><polyline points="190,129 206,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="206" y="90" width="170" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="291" y="132.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="291" dy="0">call_soon(1)</tspan></text><circle cx="291" cy="78" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="291" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="291" dy="0">2</tspan></text><polyline points="376,129 392,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="392" y="90" width="170" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="477" y="132.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="477" dy="0">call_soon(2)</tspan></text><circle cx="477" cy="78" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">3</tspan></text><polyline points="562,129 578,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="578" y="90" width="170" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="663" y="124.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="663" dy="0">tarea</tspan></text><text x="663" y="140.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="663" dy="0">(create_task)</tspan></text><circle cx="663" cy="78" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="663" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="663" dy="0">4</tspan></text><polyline points="748,129 764,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="764" y="90" width="170" height="78" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="849" y="132.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="849" dy="0">call_later(0)</tspan></text><circle cx="849" cy="78" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="849" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="849" dy="0">5</tspan></text><rect x="20" y="190" width="920" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="216.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">call_later(0) se registró en segundo lugar pero corre al final: los temporizadores pasan por un montículo y se mueven a la</tspan></text><text x="480" y="232.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">cola de listos solo en la iteración siguiente.</tspan></text><rect x="20" y="266" width="920" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="285.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El orden es el observado en CPython 3.12; la documentación solo promete que call_soon respeta el orden de registro entre</tspan></text><text x="480" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">sí.</tspan></text></svg>
