<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="940" height="350" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contrapresión: una cola acotada limita lo que espera, una ilimitada no</title><desc id="d">Barras del tamaño máximo observado de la cola cuando un productor envía 500 elementos a un consumidor lento: con cola ilimitada llegó a 500 y con cola de capacidad 10 nunca pasó de 10; el tiempo total fue casi igual, 0,77 y 0,79 s en Windows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="350" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Elementos en espera como máximo (productor rápido, consumidor de 1 ms por elemento)</tspan></text><text x="230" y="67" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Cola ilimitada</tspan></text><rect x="240" y="46" width="600" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="848" y="67" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="848" dy="0">500</tspan></text><text x="230" y="119" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Cola con maxsize = 10</tspan></text><rect x="240" y="98" width="12" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="260" y="119" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="260" dy="0">10</tspan></text><rect x="20" y="170" width="900" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="202.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Tiempo total: 0,77 s con cola ilimitada y 0,79 s con capacidad 10 (Windows); 0,57 s y 0,58 s en Linux. El límite no hizo</tspan></text><text x="470" y="218.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">más lento el sistema: solo hizo esperar al productor.</tspan></text><rect x="20" y="258" width="900" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="283.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con tasas reales distintas la cola ilimitada crece sin tope hasta agotar la memoria. Aquí el consumidor terminó, pero la</tspan></text><text x="470" y="299.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cola ilimitada no avisó de nada.</tspan></text></svg>
