<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un flujo perezoso evita materializar los elementos</title><desc id="d">Barras: producir un millón de elementos en una lista alcanza un pico de 39 496 KiB, mientras que consumirlos con un generador tiene un pico cercano a cero. Pedir cinco números pares de un generador de un millón solo produjo nueve elementos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="360" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Pico de memoria al sumar 1 000 000 de elementos (tracemalloc)</tspan></text><text x="180" y="67" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Lista completa</tspan></text><rect x="190" y="46" width="533.196" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="731.196" y="67" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="731.196" dy="0">39 496 KiB</tspan></text><text x="180" y="119" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Generador</tspan></text><rect x="190" y="98" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="202" y="119" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="202" dy="0">≈ 0 KiB</tspan></text><rect x="20" y="170" width="900" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="200.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Pidiendo los primeros 5 pares de un origen de 1 000 000: elementos producidos = 9. El flujo hace trabajo solo bajo</tspan></text><text x="470" y="216.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">demanda; el productor no se adelanta.</tspan></text><rect x="20" y="254" width="900" height="62" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un generador se agota: la segunda lectura de [0, 1, 2] devolvió [] vacía. Un flujo «frío» se vuelve a ejecutar al</tspan></text><text x="470" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">suscribirse otra vez y repite su efecto.</tspan></text><text x="470" y="346" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
