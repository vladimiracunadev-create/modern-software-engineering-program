<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Semántica de flujos observada: agotamiento, error final y debounce</title><desc id="d">Tabla: un generador agotado devuelve vacío, un error termina el flujo después de entregar 1 y 2 sin llegar a 3, y un debounce de 100 ms sobre eventos en 0, 10, 20, 400, 410 y 900 ms emite solo los de 20, 410 y 900.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Experimento</tspan></text><rect x="340" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Resultado ejecutado</tspan></text><rect x="640" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Contrato que implica</tspan></text><rect x="10" y="56" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="94.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">list(g) dos veces sobre el mismo generador</tspan></text><rect x="340" y="56" width="294" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="94.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">[0, 1, 2] y luego []</tspan></text><rect x="640" y="56" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="86.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Un flujo caliente o un generador no se</tspan></text><text x="792" y="102.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">rebobinan</tspan></text><rect x="10" y="132" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="162.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Flujo que entrega 1 y 2 y lanza ValueError</tspan></text><text x="172" y="178.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">antes de 3</tspan></text><rect x="340" y="132" width="294" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="162.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Se recibieron [1, 2]; error «fin con</tspan></text><text x="487" y="178.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">error»</tspan></text><rect x="640" y="132" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="162.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Error y finalización son terminales: no</tspan></text><text x="792" y="178.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">hay elementos después</tspan></text><rect x="10" y="208" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="238.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Debounce de 100 ms sobre 0, 10, 20, 400, 410,</tspan></text><text x="172" y="254.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">900</tspan></text><rect x="340" y="208" width="294" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="246.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Emite 20, 410 y 900</tspan></text><rect x="640" y="208" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="238.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Un operador de tiempo cambia la</tspan></text><text x="792" y="254.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">cardinalidad de salida</tspan></text><rect x="10" y="284" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="314.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Suscribirse dos veces a un flujo frío con</tspan></text><text x="172" y="330.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">efecto</tspan></text><rect x="340" y="284" width="294" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="322.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">El efecto se ejecutó dos veces</tspan></text><rect x="640" y="284" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="314.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Frío: cada suscripción empieza de nuevo;</tspan></text><text x="792" y="330.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">caliente: comparten</tspan></text><rect x="10" y="372" width="940" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="395.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El contrato de ReactiveX fija que tras un error o una finalización no hay más notificaciones.</tspan></text></svg>
