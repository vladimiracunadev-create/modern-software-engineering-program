<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 448" width="940" height="448" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Semántica de flujos observada: agotamiento, error final, debounce y flujos fríos</title><desc id="d">Diagrama de cuatro experimentos: un generador agotado devuelve vacío, un error termina el flujo después de entregar 1 y 2 sin llegar a 3, un debounce de 100 ms sobre eventos en 0, 10, 20, 400, 410 y 900 ms emite solo los de 20, 410 y 900, y suscribirse dos veces a un flujo frío ejecuta el efecto dos veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="448" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Semántica de flujos observada: agotamiento, error final, debounce y flujos fríos</tspan></text><text x="159" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="159" dy="0">Experimento</tspan></text><text x="460" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="460" dy="0">Resultado ejecutado</tspan></text><text x="766" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="766" dy="0">Contrato que implica</tspan></text><rect x="14" y="71" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="93.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">list(g) dos veces sobre el mismo</tspan></text><text x="159" y="110.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">generador</tspan></text><polyline points="308,98.64 326,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="71" width="260" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="102.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">[0, 1, 2] y luego []</tspan></text><polyline points="594,98.64 612,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="616" y="71" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="766" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">Un flujo caliente o un generador no se</tspan></text><text x="766" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">rebobinan</tspan></text><rect x="14" y="138.28" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="161.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">Flujo que entrega 1 y 2 y lanza</tspan></text><text x="159" y="177.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">ValueError antes de 3</tspan></text><polyline points="308,165.92 326,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="138.28" width="260" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Se recibieron [1, 2]; error «fin</tspan></text><text x="460" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">con error»</tspan></text><polyline points="594,165.92 612,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="616" y="138.28" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="766" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">Error y finalización son terminales:</tspan></text><text x="766" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">no hay elementos después</tspan></text><rect x="14" y="205.56" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="228.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">Debounce de 100 ms sobre 0, 10, 20,</tspan></text><text x="159" y="245.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">400, 410, 900</tspan></text><polyline points="308,233.2 326,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="205.56" width="260" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460" y="236.84" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">Emite 20, 410 y 900</tspan></text><polyline points="594,233.2 612,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="616" y="205.56" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="766" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">Un operador de tiempo cambia la</tspan></text><text x="766" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">cardinalidad de salida</tspan></text><rect x="14" y="272.84" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="295.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">Suscribirse dos veces a un flujo frío</tspan></text><text x="159" y="312.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">con efecto</tspan></text><polyline points="308,300.48 326,300.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="272.84" width="260" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="304.12" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">El efecto se ejecutó dos veces</tspan></text><polyline points="594,300.48 612,300.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="616" y="272.84" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="766" y="295.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">Frío: cada suscripción empieza de</tspan></text><text x="766" y="312.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">nuevo; caliente: comparten</tspan></text><rect x="10" y="346.12" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="376.76" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El contrato de ReactiveX fija que tras un error o una finalización no hay más notificaciones.</tspan></text><text x="470" y="430.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
