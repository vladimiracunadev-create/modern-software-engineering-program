<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Actores como buzones: orden, bloqueo mutuo y buzón sin límite</title><desc id="d">Diagrama de tres experimentos: un actor con buzón recibió 4 emisores por 50000 mensajes y su estado fue 200000 sin cerrojos; dos hilos que toman dos cerrojos en orden opuesto con espera acotada terminaron con A fallando y B teniendo éxito; y un buzón sin límite aceptó un millón de mensajes sin rechazar ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Actores como buzones: orden, bloqueo mutuo y buzón sin límite</tspan></text><text x="164" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="164" dy="0">Experimento</tspan></text><text x="460" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="460" dy="0">Resultado ejecutado</tspan></text><text x="761" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="761" dy="0">Lectura</tspan></text><rect x="14" y="71" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="93.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">Actor: un hilo dueño del estado y un</tspan></text><text x="164" y="110.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">buzón; 4 emisores × 50 000 mensajes</tspan></text><polyline points="318,98.64 336,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="340" y="71" width="240" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460" y="102.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">Estado final = 200 000</tspan></text><polyline points="584,98.64 602,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="606" y="71" width="310" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="761" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="761" dy="0">El estado tiene un solo escritor; la</tspan></text><text x="761" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="761" dy="0">sincronización está en la cola</tspan></text><rect x="14" y="138.28" width="300" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="169.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">Dos cerrojos tomados en orden opuesto</tspan></text><text x="164" y="186.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">por A y B, con timeout de 0,3 s</tspan></text><polyline points="318,174.24 336,174.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="340" y="138.28" width="240" height="71.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">A no obtuvo el segundo; B sí</tspan></text><polyline points="584,174.24 602,174.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="606" y="138.28" width="310" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="761" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="761" dy="0">Sin timeout habría bloqueo mutuo; el</tspan></text><text x="761" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="761" dy="0">timeout lo convierte en fallo</tspan></text><text x="761" y="194.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="761" dy="0">observable</tspan></text><rect x="14" y="222.2" width="300" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="253.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">Buzón sin límite: poner un millón de</tspan></text><text x="164" y="270.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">mensajes</tspan></text><polyline points="318,258.16 336,258.16" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="340" y="222.2" width="240" height="71.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="253.48" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Aceptó todos; qsize = 1 000</tspan></text><text x="460" y="270.12" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">000</tspan></text><polyline points="584,258.16 602,258.16" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="606" y="222.2" width="310" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="761" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="761" dy="0">Sin límite de buzón no hay</tspan></text><text x="761" y="261.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="761" dy="0">contrapresión: el productor no se</tspan></text><text x="761" y="278.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="761" dy="0">entera</tspan></text><rect x="10" y="312.12" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="337.08" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los actores evitan los datos compartidos, no los fallos: el orden entre emisores distintos no está garantizado y el buzón</tspan></text><text x="470" y="353.72" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">es un recurso finito.</tspan></text><text x="470" y="401.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
