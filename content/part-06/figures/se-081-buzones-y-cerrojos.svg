<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Actores como buzones: orden, bloqueo mutuo y buzón sin límite</title><desc id="d">Tabla: un actor con buzón recibió 4 emisores por 50000 mensajes y su estado fue 200000 sin cerrojos; dos hilos que toman dos cerrojos en orden opuesto con espera acotada terminaron con A fallando y B teniendo éxito; y un buzón sin límite aceptó un millón de mensajes sin rechazar ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><rect x="10" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177" dy="0">Experimento</tspan></text><rect x="350" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Resultado ejecutado</tspan></text><rect x="620" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Lectura</tspan></text><rect x="10" y="56" width="334" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="95.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Actor: un hilo dueño del estado y un buzón; 4</tspan></text><text x="177" y="111.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">emisores × 50 000 mensajes</tspan></text><rect x="350" y="56" width="264" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="103.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">Estado final = 200 000</tspan></text><rect x="620" y="56" width="324" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="95.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">El estado tiene un solo escritor; la</tspan></text><text x="782" y="111.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">sincronización está en la cola</tspan></text><rect x="10" y="150" width="334" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="189.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Dos cerrojos tomados en orden opuesto por A y</tspan></text><text x="177" y="205.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">B, con timeout de 0,3 s</tspan></text><rect x="350" y="150" width="264" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="197.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">A no obtuvo el segundo; B sí</tspan></text><rect x="620" y="150" width="324" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="189.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Sin timeout habría bloqueo mutuo; el timeout</tspan></text><text x="782" y="205.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">lo convierte en fallo observable</tspan></text><rect x="10" y="244" width="334" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="291.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Buzón sin límite: poner un millón de mensajes</tspan></text><rect x="350" y="244" width="264" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="291.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">Aceptó todos; qsize = 1 000 000</tspan></text><rect x="620" y="244" width="324" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="283.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Sin límite de buzón no hay contrapresión: el</tspan></text><text x="782" y="299.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">productor no se entera</tspan></text><rect x="10" y="332" width="940" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="355.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Los actores evitan los datos compartidos, no los fallos: el orden entre emisores distintos no está garantizado y el buzón es</tspan></text><text x="480" y="371.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">un recurso finito.</tspan></text></svg>
