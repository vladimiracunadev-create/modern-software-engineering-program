<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una condición de carrera que a veces no aparece</title><desc id="d">Cuatro hilos incrementan un contador 200000 veces cada uno. Sin ceder el hilo el resultado fue 800000 en ambos sistemas; cediendo el hilo cada 50 iteraciones fue cerca de 200800, y cediendo en cada iteración 200064; con un cerrojo 800000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="420" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Valor final del contador (esperado: 800 000)</tspan></text><text x="250" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Sin ceder el hilo</tspan></text><rect x="260" y="44" width="440" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="708" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="708" dy="0">800 000</tspan></text><text x="250" y="111" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Ceder cada 50 iteraciones</tspan></text><rect x="260" y="90" width="110.44" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="378.44" y="111" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="378.44" dy="0">200 800</tspan></text><text x="250" y="157" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Ceder en cada iteración</tspan></text><rect x="260" y="136" width="110.035" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="378.035" y="157" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="378.035" dy="0">200 064</tspan></text><text x="250" y="203" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Con cerrojo (Lock)</tspan></text><rect x="260" y="182" width="440" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="708" y="203" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="708" dy="0">800 000</tspan></text><rect x="20" y="248" width="900" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La versión sin ceder el hilo «funcionó» en 3.12 porque el intérprete cambia de hilo cada 5 ms y el bucle es corto: la</tspan></text><text x="470" y="293.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ausencia de fallo no era corrección. Cuando el cambio de hilo cayó entre la lectura y la escritura, se perdieron tres</tspan></text><text x="470" y="310.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuartas partes de las actualizaciones.</tspan></text><rect x="20" y="346" width="900" height="54" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="368.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Resultados iguales en Windows (3.12.9) y Linux (3.12.3). El costo del cerrojo no se midió de forma comparable y no se</tspan></text><text x="470" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">afirma.</tspan></text></svg>
