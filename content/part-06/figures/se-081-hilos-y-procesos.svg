<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Trabajo de CPU: un hilo, cuatro hilos y cuatro procesos</title><desc id="d">Barras en segundos para cuatro tareas de CPU iguales: en Windows una tarea tarda 0,55 s, cuatro hilos 2,09 s y cuatro procesos 1,34 s; en Linux 0,35 s, 1,38 s y 0,50 s. Los hilos no aceleran el cálculo en CPython por el bloqueo global del intérprete.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Segundos totales (tarea de 2 millones de multiplicaciones; 8 CPU lógicas)</tspan></text><text x="210" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">Win · una tarea</tspan></text><rect x="220" y="44" width="104.5" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332.5" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="332.5" dy="0">0,55 s</tspan></text><text x="210" y="109" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">Win · 4 hilos</tspan></text><rect x="220" y="88" width="397.1" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="625.1" y="109" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="625.1" dy="0">2,09 s</tspan></text><text x="210" y="153" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">Win · 4 procesos</tspan></text><rect x="220" y="132" width="254.6" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="482.6" y="153" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="482.6" dy="0">1,34 s</tspan></text><text x="210" y="197" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">Linux · una tarea</tspan></text><rect x="220" y="176" width="66.5" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="294.5" y="197" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="294.5" dy="0">0,35 s</tspan></text><text x="210" y="241" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">Linux · 4 hilos</tspan></text><rect x="220" y="220" width="262.2" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490.2" y="241" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="490.2" dy="0">1,38 s</tspan></text><text x="210" y="285" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">Linux · 4 procesos</tspan></text><rect x="220" y="264" width="95" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="323" y="285" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0,50 s</tspan></text><rect x="20" y="318" width="900" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cuatro hilos tardaron casi cuatro veces lo que una tarea (2,09 s frente a 0,55 s): ninguna ganancia sobre hacerlas en</tspan></text><text x="470" y="354.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">serie. Los hilos de CPython sirven para esperar E/S, no para repartir cálculo. Los procesos en Windows pagan el arranque</tspan></text><text x="470" y="371.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con «spawn».</tspan></text></svg>
