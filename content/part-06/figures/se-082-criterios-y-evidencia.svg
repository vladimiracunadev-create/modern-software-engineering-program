<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 496" width="940" height="496" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué evidencia respalda cada criterio de selección de paradigma</title><desc id="d">Diagrama de cinco criterios con su evidencia: costo de ejecución, superficie de cambio y equivalencia de comportamiento medidos; legibilidad como juicio sin medir y ajuste al modelo del dominio como inferencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="496" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué evidencia respalda cada criterio de selección de paradigma</tspan></text><text x="149" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="149" dy="0">Criterio</tspan></text><text x="524" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="524" dy="0">Cómo se obtuvo aquí</tspan></text><text x="829" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="829" dy="0">Estado</tspan></text><rect x="14" y="71" width="270" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="149" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149" dy="0">Costo de ejecutar</tspan></text><polyline points="288,94 310,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="314" y="71" width="420" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="524" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524" dy="0">timeit, mediana de cinco repeticiones, dos sistemas</tspan></text><polyline points="738,94 760,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="764" y="71" width="130" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="829" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="829" dy="0">Medido</tspan></text><rect x="14" y="129" width="270" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="149" y="160.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149" dy="0">Superficie de cambio</tspan></text><polyline points="288,156.64 310,156.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="314" y="129" width="420" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="524" y="151.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524" dy="0">difflib entre la versión 1 y la 2 de cada</tspan></text><text x="524" y="168.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524" dy="0">implementación</tspan></text><polyline points="738,156.64 760,156.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="764" y="129" width="130" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="829" y="160.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="829" dy="0">Medido</tspan></text><rect x="14" y="196.28" width="270" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="149" y="227.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149" dy="0">Equivalencia de comportamiento</tspan></text><polyline points="288,223.92 310,223.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="314" y="196.28" width="420" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="524" y="219.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524" dy="0">14 casos fijos más 20 000 entradas aleatorias, 0</tspan></text><text x="524" y="235.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524" dy="0">desacuerdos</tspan></text><polyline points="738,223.92 760,223.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="764" y="196.28" width="130" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="829" y="227.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="829" dy="0">Medido</tspan></text><rect x="14" y="263.56" width="270" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="149" y="290.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149" dy="0">Legibilidad para un equipo</tspan></text><polyline points="288,286.56 310,286.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="314" y="263.56" width="420" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="524" y="290.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524" dy="0">Juicio sobre el equipo y su formación</tspan></text><polyline points="738,286.56 760,286.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="764" y="263.56" width="130" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="829" y="290.2" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="829" dy="0">No medido</tspan></text><rect x="14" y="321.56" width="270" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="149" y="352.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149" dy="0">Ajuste al modelo del dominio</tspan></text><polyline points="288,349.2 310,349.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="314" y="321.56" width="420" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="524" y="344.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524" dy="0">Depende de si el problema se expresa mejor como</tspan></text><text x="524" y="361.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524" dy="0">reglas, flujo o estado</tspan></text><polyline points="738,349.2 760,349.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="764" y="321.56" width="130" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="829" y="352.84" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="829" dy="0">Inferencia</tspan></text><rect x="10" y="394.84" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="425.48" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una selección responsable separa lo medido de lo supuesto y deja los supuestos visibles para revisarlos.</tspan></text><text x="470" y="478.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
