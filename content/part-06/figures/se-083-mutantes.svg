<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 442" width="940" height="442" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutantes de la versión imperativa: cuántos casos del contrato detecta cada uno</title><desc id="d">Barras horizontales con los casos que detectan cada uno de seis mutantes: cambiar mayor por mayor o igual lo detecta 1 caso, el de latencia 800; quitar la autorización, 3 casos no autorizados; invalidar menos de -5, 1 caso; permitir booleanos, 1 caso; invertir el orden de autorización y latencia, 2 casos; y mover el umbral a 900, 2 casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="442" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mutantes de la versión imperativa: cuántos casos del contrato detecta cada uno</tspan></text><line x1="294" y1="49" x2="294" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="277" x2="294" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="498.647" y1="49" x2="498.647" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="498.647" y1="277" x2="498.647" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="498.647" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498.647" dy="0">1</tspan></text><line x1="703.293" y1="49" x2="703.293" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="703.293" y1="277" x2="703.293" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="703.293" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="703.293" dy="0">2</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="277" x2="907.94" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">3</tspan></text><line x1="294" y1="277" x2="907.94" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">&gt; 800 por &gt;= 800</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Sin chequeo de autorización</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Invalidez: latencia &lt; 0 pasa a &lt; -5</tspan></text><text x="284" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Aceptar booleanos como latencia</tspan></text><text x="284" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Orden: latencia antes de autorización</tspan></text><text x="284" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Umbral 800 pasa a 900</tspan></text><rect x="294" y="55" width="204.647" height="26" rx="3" fill="#087f8c"/><text x="505.647" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="505.647" dy="0">1</tspan></text><rect x="294" y="93" width="613.94" height="26" rx="3" fill="#087f8c"/><text x="914.94" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="294" y="131" width="204.647" height="26" rx="3" fill="#087f8c"/><text x="505.647" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="505.647" dy="0">1</tspan></text><rect x="294" y="169" width="204.647" height="26" rx="3" fill="#087f8c"/><text x="505.647" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="505.647" dy="0">1</tspan></text><rect x="294" y="207" width="409.293" height="26" rx="3" fill="#087f8c"/><text x="710.293" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="710.293" dy="0">2</tspan></text><rect x="294" y="245" width="409.293" height="26" rx="3" fill="#087f8c"/><text x="710.293" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="710.293" dy="0">2</tspan></text><text x="600.97" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="600.97" dy="0">Casos que detectan el mutante</tspan></text><rect x="10" y="335" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un solo caso delata tres mutantes: el valor límite exacto (800), el caso inválido cercano (−1) y el caso con True. Un</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">camino feliz nunca detecta la falta de autorización, y el orden de las reglas es semántica.</tspan></text><text x="470" y="424.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
