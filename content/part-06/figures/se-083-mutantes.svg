<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutantes de la versión imperativa y qué caso los detecta</title><desc id="d">Tabla de seis mutantes: cambiar mayor por mayor o igual lo detecta solo el caso de latencia 800; quitar la autorización los casos no autorizados; invalidar menos de -5 el caso -1; permitir booleanos el caso True; invertir autorización y latencia los casos 3 y 12; y mover el umbral a 900 los casos feliz y 801.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Mutante</tspan></text><rect x="310" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Casos que lo detectan</tspan></text><rect x="630" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Lección</tspan></text><rect x="10" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">&gt; 800 por &gt;= 800</tspan></text><rect x="310" y="56" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Solo el caso de latencia 800</tspan></text><rect x="630" y="56" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="77.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El valor límite exacto es el único que lo</tspan></text><text x="787" y="93.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">delata</tspan></text><rect x="10" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Sin chequeo de autorización</tspan></text><rect x="310" y="114" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Tres casos con authorized = false</tspan></text><rect x="630" y="114" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Un camino feliz nunca lo detecta</tspan></text><rect x="10" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Invalidez: latencia &lt; 0 pasa a &lt; -5</tspan></text><rect x="310" y="172" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Solo el caso -1</tspan></text><rect x="630" y="172" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Sin un caso inválido cercano, el error pasa</tspan></text><rect x="10" y="230" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Aceptar booleanos como latencia</tspan></text><rect x="310" y="230" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Solo el caso True</tspan></text><rect x="630" y="230" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="251.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Python trata True como entero; solo un caso</tspan></text><text x="787" y="267.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">lo delata</tspan></text><rect x="10" y="288" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Orden: latencia antes de autorización</tspan></text><rect x="310" y="288" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="309.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Casos 900 no autorizado y 5000 no</tspan></text><text x="467" y="325.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">autorizado</tspan></text><rect x="630" y="288" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El orden de las reglas es semántica</tspan></text><rect x="10" y="346" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="375.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Umbral 800 pasa a 900</tspan></text><rect x="310" y="346" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Caso 900 y caso 801</tspan></text><rect x="630" y="346" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Un caso feliz bien elegido ya lo detecta</tspan></text></svg>
