<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estructura del informe de comparación: afirmación, evidencia y límite</title><desc id="d">Diagrama de tres afirmaciones con su evidencia y lo que no prueban: equivalencia en los casos probados, costo de cambio medido por diferencia de líneas y costo de ejecución medido en un microbenchmark.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="380" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estructura del informe de comparación: afirmación, evidencia y límite</tspan></text><text x="159" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="159" dy="0">Afirmación del informe</tspan></text><text x="465" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="465" dy="0">Evidencia que la sostiene</tspan></text><text x="771" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="771" dy="0">Lo que no prueba</tspan></text><rect x="14" y="71" width="290" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="159" y="93.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="159" dy="0">Las cinco versiones son equivalentes</tspan></text><text x="159" y="110.6" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="159" dy="0">sobre el dominio probado</tspan></text><polyline points="308,98.64 326,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="71" width="270" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">14 casos fijos y 20 000 entradas</tspan></text><text x="465" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">aleatorias, 0 desacuerdos</tspan></text><polyline points="604,98.64 622,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="71" width="290" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="771" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="771" dy="0">Equivalencia sobre entradas fuera del</tspan></text><text x="771" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="771" dy="0">generador, incluidos tipos exóticos</tspan></text><rect x="14" y="138.28" width="290" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="159" y="161.24" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="159" dy="0">La regla nueva cuesta menos líneas en</tspan></text><text x="159" y="177.88" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="159" dy="0">el funcional y el declarativo</tspan></text><polyline points="308,165.92 326,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="138.28" width="270" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Diferencia de líneas entre versión</tspan></text><text x="465" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">1 y 2</tspan></text><polyline points="604,165.92 622,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="138.28" width="290" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="771" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="771" dy="0">Que el equipo entienda mejor esas</tspan></text><text x="771" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="771" dy="0">formas</tspan></text><rect x="14" y="205.56" width="290" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="159" y="228.52" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="159" dy="0">El imperativo es el más rápido y el</tspan></text><text x="159" y="245.16" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="159" dy="0">lógico el más lento</tspan></text><polyline points="308,233.2 326,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="205.56" width="270" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">timeit en dos sistemas, mismo</tspan></text><text x="465" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">orden</tspan></text><polyline points="604,233.2 622,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="205.56" width="290" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="771" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="771" dy="0">Que la diferencia importe para la</tspan></text><text x="771" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="771" dy="0">carga real</tspan></text><rect x="10" y="278.84" width="920" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="309.48" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada afirmación del informe enlaza un artefacto reproducible; las que no lo tienen se marcan como juicio.</tspan></text><text x="470" y="362.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
