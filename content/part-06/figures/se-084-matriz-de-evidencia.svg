<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 487" width="940" height="487" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Matriz de evidencia común: qué se ejecutó y en qué sistema</title><desc id="d">Diagrama de cinco comprobaciones: contrato común de 14 casos en cinco implementaciones, 20000 entradas aleatorias con 0 desacuerdos, versión 2 con 16 de 16 casos y costo medido, ejecutadas en Windows y Linux; Prolog real, Erlang, Rust y Rx no se ejecutaron.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="487" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Matriz de evidencia común: qué se ejecutó y en qué sistema</tspan></text><text x="179" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="179" dy="0">Comprobación</tspan></text><text x="459" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="459" dy="0">Resultado</tspan></text><text x="649" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="649" dy="0">Windows 3.12.9</tspan></text><text x="829" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="829" dy="0">Linux 3.12.3</tspan></text><rect x="14" y="71" width="330" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="179" y="93.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="179" dy="0">Contrato: 14 casos fijos × 5</tspan></text><text x="179" y="110.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="179" dy="0">implementaciones</tspan></text><polyline points="348,98.64 370,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="374" y="71" width="170" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="459" y="102.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="459" dy="0">70 de 70</tspan></text><polyline points="548,98.64 570,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="574" y="71" width="150" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="649" y="102.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="649" dy="0">Ejecutado</tspan></text><polyline points="728,98.64 750,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="754" y="71" width="150" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="829" y="102.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="829" dy="0">Ejecutado</tspan></text><rect x="14" y="138.28" width="330" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="179" y="161.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="179" dy="0">Prueba diferencial: 20 000 entradas</tspan></text><text x="179" y="177.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="179" dy="0">aleatorias</tspan></text><polyline points="348,165.92 370,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="374" y="138.28" width="170" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="459" y="169.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="459" dy="0">0 desacuerdos</tspan></text><polyline points="548,165.92 570,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="574" y="138.28" width="150" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="649" y="169.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="649" dy="0">Ejecutado</tspan></text><polyline points="728,165.92 750,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="754" y="138.28" width="150" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="829" y="169.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="829" dy="0">Ejecutado</tspan></text><rect x="14" y="205.56" width="330" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="179" y="232.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="179" dy="0">Versión 2 con R4: 16 casos × 5</tspan></text><polyline points="348,228.56 370,228.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="374" y="205.56" width="170" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="459" y="232.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="459" dy="0">80 de 80</tspan></text><polyline points="548,228.56 570,228.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="574" y="205.56" width="150" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="649" y="232.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="649" dy="0">Ejecutado</tspan></text><polyline points="728,228.56 750,228.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="754" y="205.56" width="150" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="829" y="232.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="829" dy="0">Ejecutado</tspan></text><rect x="14" y="263.56" width="330" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="179" y="290.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="179" dy="0">Costo por decisión (timeit)</tspan></text><polyline points="348,286.56 370,286.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="374" y="263.56" width="170" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="459" y="290.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="459" dy="0">700 a 17 818 ns</tspan></text><polyline points="548,286.56 570,286.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="574" y="263.56" width="150" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="649" y="290.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="649" dy="0">Ejecutado</tspan></text><polyline points="728,286.56 750,286.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="754" y="263.56" width="150" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="829" y="290.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="829" dy="0">Ejecutado</tspan></text><rect x="14" y="321.56" width="330" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="179" y="348.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="179" dy="0">Prolog real, Erlang, Rust, Rx</tspan></text><polyline points="348,344.56 370,344.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="374" y="321.56" width="170" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="459" y="348.2" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="459" dy="0">—</tspan></text><polyline points="548,344.56 570,344.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="574" y="321.56" width="150" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="649" y="348.2" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="649" dy="0">No ejecutado</tspan></text><polyline points="728,344.56 750,344.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="754" y="321.56" width="150" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="829" y="348.2" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="829" dy="0">No ejecutado</tspan></text><rect x="10" y="385.56" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="416.2" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los lenguajes que no estaban instalados se declaran como no ejecutados, no se dan por equivalentes.</tspan></text><text x="470" y="469.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
