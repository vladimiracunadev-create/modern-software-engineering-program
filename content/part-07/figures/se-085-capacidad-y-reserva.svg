<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 477" width="930" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una lista reserva más capacidad de la que usa</title><desc id="d">Tabla de los puntos de redimensionado de list.append: con 1, 5, 9, 17, 33, 65 y 109 elementos el tamaño en bytes salta a 88, 120, 184, 248, 376, 664 y 1080, con capacidades de 4 a 128 ranuras; 128 appends producen doce redimensionados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="477" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Longitud al crecer</tspan></text><rect x="270" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">sys.getsizeof</tspan></text><rect x="540" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Capacidad implícita</tspan></text><rect x="10" y="56" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">1</tspan></text><rect x="270" y="56" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">88 B</tspan></text><rect x="540" y="56" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">4 ranuras</tspan></text><rect x="10" y="102" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">5</tspan></text><rect x="270" y="102" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">120 B</tspan></text><rect x="540" y="102" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">8 ranuras</tspan></text><rect x="10" y="148" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">9</tspan></text><rect x="270" y="148" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">184 B</tspan></text><rect x="540" y="148" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">16 ranuras</tspan></text><rect x="10" y="194" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">17</tspan></text><rect x="270" y="194" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">248 B</tspan></text><rect x="540" y="194" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">24 ranuras</tspan></text><rect x="10" y="240" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">33</tspan></text><rect x="270" y="240" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">376 B</tspan></text><rect x="540" y="240" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">40 ranuras</tspan></text><rect x="10" y="286" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">65</tspan></text><rect x="270" y="286" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">664 B</tspan></text><rect x="540" y="286" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">76 ranuras</tspan></text><rect x="10" y="332" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">109</tspan></text><rect x="270" y="332" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">1 080 B</tspan></text><rect x="540" y="332" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">128 ranuras</tspan></text><rect x="10" y="382" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="406.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">128 llamadas a append provocaron solo 12 redimensionados. Un millón de enteros ocupa 8,0 MB en la lista, 36,0 MB contando</tspan></text><text x="465" y="423.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">los objetos int y 8,18 MB en array(&#x27;q&#x27;): la lista guarda referencias, el arreglo guarda los valores.</tspan></text><text x="465" y="463.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
