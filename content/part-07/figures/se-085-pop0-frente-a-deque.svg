<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 467" width="940" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Vaciar una cola de n elementos: list.pop(0) frente a deque.popleft()</title><desc id="d">Barras con el tiempo de vaciar una cola de 10 000 a 80 000 elementos: la lista tarda 12, 45, 234 y 999 milisegundos y el deque 0,68, 1,55, 3,08 y 5,92 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="467" fill="#ffffff"/><text x="270" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">list.pop(0)  n=10 000</tspan></text><rect x="280" y="16" width="6.005" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="294.005" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="294.005" dy="0">12.01 ms</tspan></text><text x="270" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">deque.popleft()  n=10 000</tspan></text><rect x="280" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="292" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="292" dy="0">0.68 ms</tspan></text><text x="270" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">list.pop(0)  n=20 000</tspan></text><rect x="280" y="104" width="22.56" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="310.56" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="310.56" dy="0">45.12 ms</tspan></text><text x="270" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">deque.popleft()  n=20 000</tspan></text><rect x="280" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="292" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="292" dy="0">1.55 ms</tspan></text><text x="270" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">list.pop(0)  n=40 000</tspan></text><rect x="280" y="192" width="116.77" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="404.77" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="404.77" dy="0">233.54 ms</tspan></text><text x="270" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">deque.popleft()  n=40 000</tspan></text><rect x="280" y="236" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="292" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="292" dy="0">3.08 ms</tspan></text><text x="270" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">list.pop(0)  n=80 000</tspan></text><rect x="280" y="280" width="499.325" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="787.325" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="787.325" dy="0">998.65 ms</tspan></text><text x="270" y="343.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">deque.popleft()  n=80 000</tspan></text><rect x="280" y="324" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="292" y="343.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="292" dy="0">5.92 ms</tspan></text><rect x="10" y="372" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Al duplicar n la lista multiplica su tiempo por 3,8, 5,2 y 4,3 (crecimiento cuadrático); el deque lo multiplica por 2,3,</tspan></text><text x="470" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2,0 y 1,9 (casi lineal). Con n = 80 000 la diferencia es de 169 veces.</tspan></text><text x="470" y="453.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
