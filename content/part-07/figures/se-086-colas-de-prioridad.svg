<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres maneras de implementar una cola de prioridad</title><desc id="d">Líneas en doble escala logarítmica con el tiempo de insertar y extraer n elementos entre 2000 y 16000: el montículo binario pasa de 0,6 a 11,2 milisegundos, la lista ordenada con bisect.insort de 2,9 a 59,4 y buscar el mínimo con min y remove de 43,6 a 3746; esta última es la más empinada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres maneras de implementar una cola de prioridad</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">heapq (montículo)</tspan></text><rect x="192.18" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">bisect.insort + pop</tspan></text><polygon points="389.44,44.1 396.04,56.4 382.84,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="403.44" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="403.44" dy="0">min() + remove()</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="387" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,1</tspan></text><line x1="101.24" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="327" x2="101.24" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="267" x2="101.24" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="207" x2="101.24" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="147" x2="101.24" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="87" x2="101.24" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="87" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="87" x2="119.24" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="387" x2="119.24" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">2 000</tspan></text><line x1="376.827" y1="87" x2="376.827" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="376.827" y1="387" x2="376.827" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="376.827" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="376.827" dy="0">4 000</tspan></text><line x1="634.413" y1="87" x2="634.413" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="634.413" y1="387" x2="634.413" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="634.413" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="634.413" dy="0">8 000</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">16 000</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Tiempo (ms) (escala logarítmica)</text><text x="505.62" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">n elementos (escala logarítmica)</tspan></text><polyline points="119.24,340.311 376.827,318.232 634.413,296.691 892,264.047" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="119.24" cy="340.311" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="119.24" y="329.311" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">0,6</tspan></text><circle cx="376.827" cy="318.232" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="376.827" y="307.232" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="376.827" dy="0">1,4</tspan></text><circle cx="634.413" cy="296.691" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="634.413" y="285.691" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="634.413" dy="0">3,2</tspan></text><circle cx="892" cy="264.047" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="253.047" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">11,2</tspan></text><polyline points="119.24,299.256 376.827,288.992 634.413,253.327 892,220.573" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="113.74" y="293.756" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="119.24" y="288.256" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">2,9</tspan></text><rect x="371.327" y="283.492" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="376.827" y="277.992" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="376.827" dy="0">4,3</tspan></text><rect x="628.913" y="247.827" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="634.413" y="242.327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="634.413" dy="0">16,9</tspan></text><rect x="886.5" y="215.073" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="209.573" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">59,4</tspan></text><polyline points="119.24,228.631 376.827,189.678 634.413,151.752 892,112.583" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="119.24,222.306 125.29,233.581 113.19,233.581" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="119.24" y="217.631" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">43,6</tspan></text><polygon points="376.827,183.353 382.877,194.628 370.777,194.628" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="376.827" y="178.678" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="376.827" dy="0">194,4</tspan></text><polygon points="634.413,145.427 640.463,156.702 628.363,156.702" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="634.413" y="140.752" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="634.413" dy="0">833,3</tspan></text><polygon points="892,106.258 898.05,117.533 885.95,117.533" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="101.583" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">3 746,4</tspan></text><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Al duplicar n, min()+remove() multiplica su tiempo por 4,5, 4,3 y 4,5 (cuadrático). El montículo no mantiene orden total:</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solo garantiza el mínimo en la raíz, y por eso es más barato que ordenar en cada inserción.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
