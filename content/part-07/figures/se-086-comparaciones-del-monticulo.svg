<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comparaciones del montículo: n inserciones y n extracciones</title><desc id="d">Barras agrupadas con el número de comparaciones contadas para n entre 1000 y 8000: n inserciones cuestan unas 2,2 n comparaciones (2212 a 18 300) y n extracciones 8703 a 93 390, entre 0,87 y 0,90 veces n por el logaritmo de n; extraer pesa cuatro o cinco veces más que insertar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Comparaciones del montículo: n inserciones y n extracciones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Insertar n</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Extraer n</tspan></text><line x1="108.78" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="375" x2="108.78" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">0</tspan></text><line x1="108.78" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="319" x2="108.78" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">20 000</tspan></text><line x1="108.78" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="263" x2="108.78" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">40 000</tspan></text><line x1="108.78" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="207" x2="108.78" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">60 000</tspan></text><line x1="108.78" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="151" x2="108.78" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">80 000</tspan></text><line x1="108.78" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="95" x2="108.78" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100 000</tspan></text><line x1="108.78" y1="95" x2="108.78" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">comparaciones</text><rect x="129.06" y="368.806" width="79.122" height="6.1936" rx="3" fill="#087f8c"/><text x="168.621" y="362.806" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="168.621" dy="0">2 212</tspan></text><rect x="212.183" y="350.632" width="79.122" height="24.3684" rx="3" fill="#c0432f"/><text x="251.744" y="344.632" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="251.744" dy="0">8 703</tspan></text><text x="210.183" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210.183" dy="0">n = 1 000</tspan></text><rect x="331.865" y="362.442" width="79.122" height="12.558" rx="3" fill="#087f8c"/><text x="371.427" y="356.442" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="371.427" dy="0">4 485</tspan></text><rect x="414.988" y="320.842" width="79.122" height="54.1576" rx="3" fill="#c0432f"/><text x="454.548" y="314.842" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="454.548" dy="0">19 342</tspan></text><text x="412.988" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412.988" dy="0">n = 2 000</tspan></text><rect x="534.67" y="349.75" width="79.122" height="25.2504" rx="3" fill="#087f8c"/><text x="574.231" y="343.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="574.231" dy="0">9 018</tspan></text><rect x="617.793" y="255.535" width="79.122" height="119.465" rx="3" fill="#c0432f"/><text x="657.354" y="249.535" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="657.354" dy="0">42 666</tspan></text><text x="615.793" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615.793" dy="0">n = 4 000</tspan></text><rect x="737.475" y="323.76" width="79.122" height="51.24" rx="3" fill="#087f8c"/><text x="777.036" y="317.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="777.036" dy="0">18 300</tspan></text><rect x="820.597" y="113.508" width="79.122" height="261.492" rx="3" fill="#c0432f"/><text x="860.158" y="107.508" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="860.158" dy="0">93 390</tspan></text><text x="818.597" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="818.597" dy="0">n = 8 000</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Extraer / (n·log₂ n) vale 0,87, 0,88, 0,89 y 0,90. Insertar es casi lineal (cada elemento sube pocos niveles en promedio);</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">extraer es n·log n porque cada elemento nuevo en la raíz baja por la altura del árbol. La recursión de 5 000 niveles falla</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">con RecursionError (límite 1 000), mientras que una pila explícita procesó 1 000 000 de pasos sin problema.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Comparaciones contadas con __lt__ sobre datos aleatorios con semilla fija; no dependen del equipo.</tspan></text></svg>
