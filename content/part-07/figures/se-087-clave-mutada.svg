<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="940" height="410" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutar una clave después de insertarla deja la entrada inalcanzable</title><desc id="d">Se inserta la clave K(1) en un diccionario y luego se cambia su valor a 2. Buscar K(2) da False, buscar K(1) da False, el diccionario sigue teniendo un elemento y la iteración todavía devuelve la clave: la entrada existe pero no se puede encontrar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="410" fill="#ffffff"/><rect x="10" y="14" width="280" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150" y="43.96" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">1. d = {K(1): &#x27;x&#x27;}</tspan></text><text x="150" y="61.88" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">el hash 1 elige la ranura</tspan></text><polyline points="290,49 330,49" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="14" width="280" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="43.96" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">2. k.v = 2</tspan></text><text x="470" y="61.88" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la clave cambia, la ranura no</tspan></text><polyline points="610,49 650,49" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="650" y="14" width="270" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="785" y="52.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="785" dy="0">3. buscar</tspan></text><rect x="10" y="120" width="290" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="155" y="152.96" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="155" dy="0">K(2) in d → False</tspan></text><text x="155" y="170.88" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="155" dy="0">hash 2 apunta a otra ranura</tspan></text><rect x="325" y="120" width="290" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="144" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">K(1) in d → False</tspan></text><text x="470" y="161.92" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la ranura tiene una clave que ya</tspan></text><text x="470" y="179.84" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no es igual</tspan></text><rect x="640" y="120" width="280" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="780" y="152.96" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="780" dy="0">len(d) = 1 y for k in d la</tspan></text><text x="780" y="170.88" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="780" dy="0">devuelve</tspan></text><rect x="10" y="220" width="910" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="465" y="250.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="465" dy="0">Las colecciones por hash exigen que el hash y la igualdad de una clave no cambien mientras la clave esté dentro. Por eso</tspan></text><text x="465" y="266.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="465" dy="0">list, dict y set no son hashables (TypeError: unhashable type: &#x27;list&#x27;).</tspan></text><rect x="10" y="306" width="910" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Tras borrar 99 990 de 100 000 entradas, el tamaño del diccionario siguió en 5,24 MB: un dict no devuelve memoria al</tspan></text><text x="465" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">borrar.</tspan></text><text x="470" y="392" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
