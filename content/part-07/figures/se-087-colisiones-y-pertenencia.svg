<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 483" width="940" height="483" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Buscar n claves con un hash constante y con un hash razonable</title><desc id="d">Barras con el tiempo de buscar n claves en un diccionario: con un __hash__ constante tarda 16, 60, 228 y 960 milisegundos para 500, 1000, 2000 y 4000 claves, y con hash(valor) 0,39, 0,27, 0,53 y 3,48 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="483" fill="#ffffff"/><text x="240" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">__hash__ = 1, n=500</tspan></text><rect x="250" y="16" width="8.8055" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="266.805" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="266.805" dy="0">16.01 ms</tspan></text><text x="240" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">hash(valor), n=500</tspan></text><rect x="250" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="262" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="262" dy="0">0.39 ms</tspan></text><text x="240" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">__hash__ = 1, n=1000</tspan></text><rect x="250" y="104" width="33.242" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="291.242" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="291.242" dy="0">60.44 ms</tspan></text><text x="240" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">hash(valor), n=1000</tspan></text><rect x="250" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="262" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="262" dy="0">0.27 ms</tspan></text><text x="240" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">__hash__ = 1, n=2000</tspan></text><rect x="250" y="192" width="125.246" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="383.246" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="383.246" dy="0">227.72 ms</tspan></text><text x="240" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">hash(valor), n=2000</tspan></text><rect x="250" y="236" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="262" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="262" dy="0">0.53 ms</tspan></text><text x="240" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">__hash__ = 1, n=4000</tspan></text><rect x="250" y="280" width="528.149" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="786.149" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="786.149" dy="0">960.27 ms</tspan></text><text x="240" y="343.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">hash(valor), n=4000</tspan></text><rect x="250" y="324" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="262" y="343.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="262" dy="0">3.48 ms</tspan></text><rect x="10" y="372" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con hash constante, duplicar n multiplica el tiempo por 3,8, 3,8 y 4,2: cada búsqueda compara con todas las claves</tspan></text><text x="470" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">anteriores. Probar 500 pertenencias en una lista de 20 000 elementos tardó 93,7 ms y en un set 0,027 ms (3 500 veces menos)</tspan></text><text x="470" y="430.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">a costa de 4,2 MB frente a 0,8 MB por cada 100 000 enteros.</tspan></text><text x="470" y="469.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
