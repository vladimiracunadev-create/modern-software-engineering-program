<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 621" width="940" height="621" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hash e igualdad: cinco sorpresas medidas</title><desc id="d">Cinco comprobaciones de hash e igualdad como tarjetas con su resultado: un set de cadenas cambia de orden con cinco de seis semillas, uno de enteros no cambia, hash de menos uno y menos dos coinciden, uno, uno punto cero y True son la misma clave, y NaN solo se encuentra con el mismo objeto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="621" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hash e igualdad: cinco sorpresas medidas</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Orden de un set de 5 cadenas con 6 valores de</tspan></text><text x="30" y="117.6" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">PYTHONHASHSEED</tspan></text><polyline points="402,105.64 438,105.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="77" width="478" height="57.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="109.28" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">5 órdenes distintos</tspan></text><text x="24" y="151.28" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El hash de str se aleatoriza por proceso.</tspan></text><rect x="20" y="172.92" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="196.88" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Orden de un set de enteros con 3 valores de</tspan></text><text x="30" y="213.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">PYTHONHASHSEED</tspan></text><polyline points="402,201.56 438,201.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="172.92" width="478" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="205.2" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">1 solo orden</tspan></text><text x="24" y="247.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El hash de int no se aleatoriza.</tspan></text><rect x="20" y="268.84" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="292.8" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">hash(-1) y hash(-2)</tspan></text><polyline points="402,289.16 438,289.16" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="268.84" width="478" height="40.64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="292.8" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">ambos −2</tspan></text><text x="24" y="326.48" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">−1 está reservado como error en C: hay colisión.</tspan></text><rect x="20" y="348.12" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="372.08" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">{1: &#x27;a&#x27;, 1.0: &#x27;b&#x27;, True: &#x27;c&#x27;}</tspan></text><polyline points="402,368.44 438,368.44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="348.12" width="478" height="40.64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="372.08" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">1 clave</tspan></text><text x="24" y="405.76" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">1 == 1.0 == True y tienen el mismo hash.</tspan></text><rect x="20" y="427.4" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="451.36" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">float(&#x27;nan&#x27;) in {nan: 1}</tspan></text><polyline points="402,447.72 438,447.72" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="427.4" width="478" height="40.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="451.36" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">True con el mismo objeto; False con otro nan</tspan></text><text x="24" y="485.04" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">NaN no es igual a sí mismo: la identidad rescata la búsqueda.</tspan></text><rect x="10" y="508.68" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="533.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ordenar por iteración de un set de cadenas no es reproducible entre procesos. Los diccionarios, en cambio, conservan el</tspan></text><text x="470" y="550.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">orden de inserción desde Python 3.7: tras borrar «b» y reinsertarla queda al final («acdeb»).</tspan></text><text x="470" y="593.96" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
