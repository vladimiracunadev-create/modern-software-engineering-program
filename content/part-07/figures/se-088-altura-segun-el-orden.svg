<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 335" width="940" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Altura de un árbol según el orden de inserción</title><desc id="d">Tabla de alturas y comparaciones acumuladas de un árbol binario de búsqueda sin balanceo: con claves ordenadas la altura es n (255, 1000, 4000) y las comparaciones suman 32 385, 499 500 y 7 998 000; con claves aleatorias la altura es 17, 26 y 30; un árbol AVL da 8, 10 y 12.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="335" fill="#ffffff"/><rect x="10" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="57" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="57" dy="0">n</tspan></text><rect x="110" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">BST ordenado: altura /</tspan></text><text x="247" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">comparaciones</tspan></text><rect x="390" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">BST aleatorio: altura /</tspan></text><text x="522" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">comparaciones</tspan></text><rect x="660" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">AVL ordenado:</tspan></text><text x="742" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">altura</tspan></text><rect x="830" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="877" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">log₂ n</tspan></text><rect x="10" y="56" width="94" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="57" y="86.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="57" dy="0">255</tspan></text><rect x="110" y="56" width="274" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247" dy="0">255 / 32 385</tspan></text><rect x="390" y="56" width="264" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">17 / 2 104</tspan></text><rect x="660" y="56" width="164" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">8</tspan></text><rect x="830" y="56" width="94" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">8,0</tspan></text><rect x="10" y="116" width="94" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="57" y="146.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="57" dy="0">1 000</tspan></text><rect x="110" y="116" width="274" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247" dy="0">1 000 / 499 500</tspan></text><rect x="390" y="116" width="264" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">26 / 11 562</tspan></text><rect x="660" y="116" width="164" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">10</tspan></text><rect x="830" y="116" width="94" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">10,0</tspan></text><rect x="10" y="176" width="94" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="57" y="206.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="57" dy="0">4 000</tspan></text><rect x="110" y="176" width="274" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="206.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247" dy="0">4 000 / 7 998 000</tspan></text><rect x="390" y="176" width="264" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="206.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">30 / 56 801</tspan></text><rect x="660" y="176" width="164" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="206.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">12</tspan></text><rect x="830" y="176" width="94" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="206.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">12,0</tspan></text><rect x="10" y="240" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un BST es una lista enlazada cuando se alimenta en orden. Un AVL con 100 000 claves ordenadas llegó a altura 17 (cota</tspan></text><text x="470" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">teórica 23,9) a cambio de 99 983 rotaciones.</tspan></text><text x="470" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Alturas y comparaciones calculadas con semilla fija; no dependen del equipo.</tspan></text></svg>
