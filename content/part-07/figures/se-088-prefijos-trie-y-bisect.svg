<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contar palabras con un prefijo: tres estructuras</title><desc id="d">Barras agrupadas en escala logarítmica con el tiempo de contar 39 palabras con el prefijo abc entre 28 785: recorrer todo tarda 6374 microsegundos en Windows y 3370 en Linux, el trie 30,9 y 28,9, y la lista ordenada con bisect 1,1 y 0,9; el trie ocupa 15,3 MB frente a 1,6 MB de la lista.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Contar palabras con un prefijo: tres estructuras</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Linux (WSL2)</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,1</tspan></text><line x1="101.24" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="319" x2="101.24" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="263" x2="101.24" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="207" x2="101.24" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="151" x2="101.24" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">µs (escala logarítmica)</text><rect x="128.532" y="105.953" width="107.168" height="269.047" rx="3" fill="#087f8c"/><text x="182.116" y="99.9529" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182.116" dy="0">6 374</tspan></text><rect x="239.7" y="121.453" width="107.168" height="253.547" rx="3" fill="#c0432f"/><text x="293.284" y="115.453" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="293.284" dy="0">3 370</tspan></text><text x="237.7" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">Recorrer los 28 785 textos</tspan></text><text x="237.7" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">(startswith)</tspan></text><rect x="401.452" y="235.562" width="107.168" height="139.438" rx="3" fill="#087f8c"/><text x="455.036" y="229.562" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="455.036" dy="0">30,9</tspan></text><rect x="512.62" y="237.19" width="107.168" height="137.81" rx="3" fill="#c0432f"/><text x="566.204" y="231.19" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.204" dy="0">28,9</tspan></text><text x="510.62" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">Trie de diccionarios anidados</tspan></text><rect x="674.372" y="316.682" width="107.168" height="58.318" rx="3" fill="#087f8c"/><text x="727.956" y="310.682" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="727.956" dy="0">1,1</tspan></text><rect x="785.54" y="321.562" width="107.168" height="53.4376" rx="3" fill="#c0432f"/><text x="839.124" y="315.562" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.124" dy="0">0,9</tspan></text><text x="783.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">Lista ordenada + bisect</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El trie tuvo 82 553 nodos para 190 043 caracteres (43 %) y ocupó 15,3 MB frente a 1,6 MB de la lista, 9,6 veces más</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">memoria. En CPython, bisect sobre una lista ordenada ganó al trie para contar prefijos; el trie conserva su valor cuando</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">hace falta recorrer o completar por carácter.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
