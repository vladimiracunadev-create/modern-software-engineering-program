<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 427" width="940" height="427" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La altura manda: recursión, balanceo e invariante</title><desc id="d">Tabla con cuatro resultados: la inserción recursiva en un árbol de claves ordenadas falla con RecursionError, la iterativa funciona pero es cuadrática, un árbol AVL de 100 000 claves ordenadas tiene altura 17 y un montículo satisface el invariante padre menor o igual que hijo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="427" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Caso</tspan></text><rect x="370" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Resultado</tspan></text><rect x="590" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Lectura</tspan></text><rect x="10" y="56" width="354" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="82.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Inserción recursiva en BST, 1 500 claves</tspan></text><text x="187" y="98.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">ordenadas, límite 1 000</tspan></text><rect x="370" y="56" width="214" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">RecursionError</tspan></text><rect x="590" y="56" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="82.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">La altura del árbol consume la pila de</tspan></text><text x="757" y="98.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">llamadas</tspan></text><rect x="10" y="124" width="354" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="150.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Misma inserción con bucle iterativo, 4 000 claves</tspan></text><text x="187" y="166.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">ordenadas</tspan></text><rect x="370" y="124" width="214" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">Funciona (altura 4 000)</tspan></text><rect x="590" y="124" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="150.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Correcta pero cuadrática: 7 998 000</tspan></text><text x="757" y="166.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">comparaciones</tspan></text><rect x="10" y="192" width="354" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="226.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">AVL, 100 000 claves ordenadas</tspan></text><rect x="370" y="192" width="214" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">Altura 17</tspan></text><rect x="590" y="192" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Cota 1,44·log₂(n+2) = 23,9; 99 983 rotaciones</tspan></text><rect x="10" y="260" width="354" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Montículo de 31 elementos tras heapify</tspan></text><rect x="370" y="260" width="214" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">Invariante cumplido</tspan></text><rect x="590" y="260" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">padre ≤ hijo en los 30 pares; índices (i−1)//2</tspan></text><rect x="10" y="332" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La altura no es un detalle de implementación: determina el costo de cada operación y el riesgo de agotar la pila. Un árbol</tspan></text><text x="470" y="373.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">correcto en pruebas con datos aleatorios puede romperse con datos ordenados.</tspan></text><text x="470" y="413.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
