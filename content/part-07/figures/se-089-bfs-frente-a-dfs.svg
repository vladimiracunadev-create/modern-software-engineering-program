<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 317" width="950" height="317" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rejilla: BFS encuentra el camino más corto, DFS encuentra uno cualquiera</title><desc id="d">Tabla sobre rejillas de 20, 40 y 80 de lado: la búsqueda en anchura devuelve distancias 38, 78 y 158, que son las óptimas, y visita todos los nodos; la búsqueda en profundidad devuelve caminos de 190, 780 y 3160 pasos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="317" fill="#ffffff"/><rect x="10" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="67" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="67" dy="0">Rejilla</tspan></text><rect x="130" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Nodos / aristas</tspan></text><rect x="320" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">BFS: distancia</tspan></text><rect x="540" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">DFS: largo del camino</tspan></text><rect x="750" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">DFS: nodos visitados</tspan></text><rect x="10" y="56" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="67" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="67" dy="0">20 × 20</tspan></text><rect x="130" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">400 / 760</tspan></text><rect x="320" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">38 (óptimo 38)</tspan></text><rect x="540" y="56" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">190</tspan></text><rect x="750" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">229</tspan></text><rect x="10" y="110" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="67" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="67" dy="0">40 × 40</tspan></text><rect x="130" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">1 600 / 3 120</tspan></text><rect x="320" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">78 (óptimo 78)</tspan></text><rect x="540" y="110" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">780</tspan></text><rect x="750" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">859</tspan></text><rect x="10" y="164" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="67" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="67" dy="0">80 × 80</tspan></text><rect x="130" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">6 400 / 12 640</tspan></text><rect x="320" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">158 (óptimo 158)</tspan></text><rect x="540" y="164" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">3 160</tspan></text><rect x="750" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">3 319</tspan></text><rect x="10" y="222" width="930" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">El camino que halla DFS es 5, 10 y 20 veces más largo que el óptimo. BFS cuesta V visitas en el peor caso; elegir entre</tspan></text><text x="475" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">ambos es elegir qué propiedad se necesita: mínima cantidad de aristas o simple alcanzabilidad.</tspan></text><text x="475" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Cuentas deterministas sobre rejillas sin obstáculos; no dependen del equipo.</tspan></text></svg>
