<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Representación del grafo y costo del recorrido</title><desc id="d">Línea en doble escala logarítmica con el tiempo de un recorrido BFS completo en rejillas de 4900, 19 800 y 79 600 aristas: 3,6, 12,4 y 39,2 milisegundos, de modo que al cuadruplicar las aristas el tiempo se multiplica por 3,5 y 3,2, como predice O(V+E).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Representación del grafo y costo del recorrido</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="209" x2="910" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="209" x2="78.62" y2="209" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="213.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">10</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="359" x2="96.62" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">4 900 (50 × 50)</tspan></text><line x1="495.04" y1="59" x2="495.04" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="495.04" y1="359" x2="495.04" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="495.04" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.04" dy="0">19 800 (100 × 100)</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">79 600 (200 × 200)</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Tiempo del BFS completo (ms) (escala logarítmica)</text><text x="494.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Aristas del grafo (escala logarítmica)</tspan></text><polyline points="96.62,275.555 495.04,194.987 892,120.007" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="275.555" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="264.555" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">3,6 ms</tspan></text><circle cx="495.04" cy="194.987" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="495.04" y="183.987" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="495.04" dy="0">12,4 ms</tspan></text><circle cx="892" cy="120.007" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="109.007" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">39,2 ms</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Para 2 000 nodos y 7 993 aristas, la lista de adyacencia ocupa ≈ 360 KB y dar los vecinos de un nodo tarda 0,3 µs; la</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">matriz (bytearray por fila, 4 000 000 de celdas) ocupa ≈ 4,1 MB y tarda 135,9 µs. La matriz paga V² celdas aunque el grafo</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sea disperso (0,4 % de ocupación).</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
