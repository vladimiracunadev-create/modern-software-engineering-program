<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">sorted() sobre datos aleatorios, ordenados e invertidos</title><desc id="d">Barras agrupadas con el tiempo de sorted con 100 000 y 200 000 flotantes: aleatorios 22,9 y 55,5 milisegundos, ya ordenados 1,87 y 5,19, invertidos 2,31 y 5,91; los datos con tramos ordenados son unas diez veces más rápidos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">sorted() sobre datos aleatorios, ordenados e invertidos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aleatoria</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Ya ordenada</tspan></text><rect x="262.8" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="282.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="282.8" dy="0">Invertida</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="281.667" x2="71.08" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="188.333" x2="71.08" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">ms</text><rect x="113.526" y="268.133" width="110.523" height="106.867" rx="3" fill="#c0432f"/><text x="168.787" y="262.133" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="168.787" dy="0">22,9</tspan></text><rect x="228.049" y="366.273" width="110.523" height="8.72667" rx="3" fill="#087f8c"/><text x="283.31" y="360.273" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="283.31" dy="0">1,87</tspan></text><rect x="342.571" y="364.22" width="110.523" height="10.78" rx="3" fill="#946512"/><text x="397.833" y="358.22" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="397.833" dy="0">2,31</tspan></text><text x="283.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">n = 100 000</tspan></text><rect x="537.986" y="116" width="110.523" height="259" rx="3" fill="#c0432f"/><text x="593.247" y="110" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="593.247" dy="0">55,5</tspan></text><rect x="652.509" y="350.78" width="110.523" height="24.22" rx="3" fill="#087f8c"/><text x="707.77" y="344.78" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.77" dy="0">5,19</tspan></text><rect x="767.031" y="347.42" width="110.523" height="27.58" rx="3" fill="#946512"/><text x="822.293" y="341.42" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="822.293" dy="0">5,91</tspan></text><text x="707.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">n = 200 000</tspan></text><rect x="10" y="427" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Timsort detecta tramos ya ordenados («runs») y los mezcla: los datos ordenados o invertidos fueron 12 y 10 veces más</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">rápidos. La búsqueda binaria necesitó 10, 20 y 30 pasos para 10³, 10⁶ y 10⁹ elementos. Mediana de 100 000 números:</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sorted()[n//2] tardó 22,3 ms, un quickselect en Python puro 40,8 ms (promedio 2,3 pasadas por elemento) y</tspan></text><text x="470" y="501.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">heapq.nsmallest(1) 1,32 ms para el mínimo.</tspan></text><text x="470" y="549.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
