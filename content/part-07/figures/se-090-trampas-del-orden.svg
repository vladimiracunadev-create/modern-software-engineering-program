<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 526" width="940" height="526" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro comportamientos de sorted() que conviene conocer</title><desc id="d">Cuatro resultados de sorted como tarjetas: la ordenación es estable, una lista con NaN queda sin ordenar, mezclar enteros y cadenas lanza TypeError y las cadenas se ordenan por punto de código de modo que Árbol queda después de zeta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="526" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro comportamientos de sorted() que conviene conocer</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">sorted(registros, key=prioridad)</tspan></text><polyline points="402,97.32 438,97.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="77" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="100.96" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">[&#x27;c&#x27;,&#x27;e&#x27;,&#x27;b&#x27;,&#x27;a&#x27;,&#x27;d&#x27;]</tspan></text><text x="24" y="134.64" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Estable: los empates conservan el orden de llegada.</tspan></text><rect x="20" y="156.28" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="180.24" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">sorted([3.0, nan, 1.0, 2.0])</tspan></text><polyline points="402,176.6 438,176.6" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="156.28" width="478" height="40.64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="180.24" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">[3.0, nan, 1.0, 2.0]</tspan></text><text x="24" y="213.92" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">NaN rompe el orden total: no ordena nada.</tspan></text><rect x="20" y="235.56" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="259.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">sorted([1, &#x27;a&#x27;])</tspan></text><polyline points="402,255.88 438,255.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="235.56" width="478" height="40.64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="259.52" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">TypeError</tspan></text><text x="24" y="293.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">No hay orden entre str e int.</tspan></text><rect x="20" y="314.84" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="338.8" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">sorted([&#x27;Zebra&#x27;,&#x27;apple&#x27;,&#x27;Árbol&#x27;,&#x27;zeta&#x27;])</tspan></text><polyline points="402,335.16 438,335.16" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="314.84" width="478" height="40.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="338.8" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">[&#x27;Zebra&#x27;,&#x27;apple&#x27;,&#x27;zeta&#x27;,&#x27;Árbol&#x27;]</tspan></text><text x="24" y="372.48" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Orden por punto de código, no alfabético del idioma.</tspan></text><rect x="10" y="396.12" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="421.08" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un comparador que no define un orden total (NaN, prioridades inconsistentes) no produce un error: produce un resultado</tspan></text><text x="470" y="437.72" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">arbitrario. La estabilidad permite ordenar por varias claves aplicando sorts sucesivos de la clave menos a la más</tspan></text><text x="470" y="454.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">significativa.</tspan></text><text x="470" y="498.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados deterministas de CPython 3.12; no dependen del equipo.</tspan></text></svg>
