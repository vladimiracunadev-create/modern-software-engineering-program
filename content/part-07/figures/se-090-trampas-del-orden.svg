<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 419" width="950" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro comportamientos de sorted() que conviene conocer</title><desc id="d">Tabla de cuatro resultados: la ordenación es estable, una lista con NaN queda sin ordenar, mezclar enteros y cadenas lanza TypeError y las cadenas se ordenan por punto de código de modo que Árbol queda después de zeta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="419" fill="#ffffff"/><rect x="10" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177" dy="0">Expresión</tspan></text><rect x="350" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Resultado</tspan></text><rect x="620" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Lectura</tspan></text><rect x="10" y="56" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">sorted(registros, key=prioridad)</tspan></text><rect x="350" y="56" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">[&#x27;c&#x27;,&#x27;e&#x27;,&#x27;b&#x27;,&#x27;a&#x27;,&#x27;d&#x27;]</tspan></text><rect x="620" y="56" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="79.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Estable: los empates conservan el orden de</tspan></text><text x="777" y="95.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">llegada</tspan></text><rect x="10" y="118" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">sorted([3.0, nan, 1.0, 2.0])</tspan></text><rect x="350" y="118" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">[3.0, nan, 1.0, 2.0]</tspan></text><rect x="620" y="118" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">NaN rompe el orden total: no ordena nada</tspan></text><rect x="10" y="180" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">sorted([1, &#x27;a&#x27;])</tspan></text><rect x="350" y="180" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">TypeError</tspan></text><rect x="620" y="180" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">No hay orden entre str e int</tspan></text><rect x="10" y="242" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">sorted([&#x27;Zebra&#x27;,&#x27;apple&#x27;,&#x27;Árbol&#x27;,&#x27;zeta&#x27;])</tspan></text><rect x="350" y="242" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">[&#x27;Zebra&#x27;,&#x27;apple&#x27;,&#x27;zeta&#x27;,&#x27;Árbol&#x27;]</tspan></text><rect x="620" y="242" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="265.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Orden por punto de código, no alfabético</tspan></text><text x="777" y="281.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">del idioma</tspan></text><rect x="10" y="308" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Un comparador que no define un orden total (NaN, prioridades inconsistentes) no produce un error: produce un resultado</tspan></text><text x="475" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">arbitrario. La estabilidad permite ordenar por varias claves aplicando sorts sucesivos de la clave menos a la más</tspan></text><text x="475" y="366.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">significativa.</tspan></text><text x="475" y="405.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Resultados deterministas de CPython 3.12; no dependen del equipo.</tspan></text></svg>
