<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 407" width="940" height="407" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Voraz que sí y voraz que no: intervalos y mochila</title><desc id="d">Barras apiladas al 100 % con los casos en que el criterio voraz fue óptimo y subóptimo: ordenar intervalos por hora de fin fue óptimo en 400 de 400 casos y por hora de inicio en 338 de 400; en la mochila 0/1 el criterio valor por peso fue subóptimo en 228 de 1000 casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="407" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Voraz que sí y voraz que no: intervalos y mochila</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Óptimos</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Subóptimos</tspan></text><line x1="324" y1="77" x2="324" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="209" x2="324" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="461.925" y1="77" x2="461.925" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="461.925" y1="209" x2="461.925" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="461.925" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.925" dy="0">25</tspan></text><line x1="599.85" y1="77" x2="599.85" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="599.85" y1="209" x2="599.85" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="599.85" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="599.85" dy="0">50</tspan></text><line x1="737.775" y1="77" x2="737.775" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="737.775" y1="209" x2="737.775" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="737.775" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737.775" dy="0">75</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="209" x2="875.7" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="324" y1="209" x2="875.7" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Intervalos: ordenar por fin (400 casos)</tspan></text><text x="314" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Intervalos: ordenar por inicio (400</tspan></text><text x="314" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">casos)</tspan></text><text x="314" y="183" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Mochila 0/1: mayor valor/peso (1 000</tspan></text><text x="314" y="200" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">casos)</tspan></text><rect x="324" y="84" width="551.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="599.85" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="599.85" dy="0">100 %</tspan></text><rect x="875.7" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="324" y="128" width="466.187" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="557.093" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557.093" dy="0">84 %</tspan></text><rect x="790.187" y="128" width="85.5135" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="832.943" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832.943" dy="0">16 %</tspan></text><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="324" y="172" width="425.912" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="536.956" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="536.956" dy="0">77 %</tspan></text><rect x="749.912" y="172" width="125.788" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="812.806" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.806" dy="0">23 %</tspan></text><text x="882.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="599.85" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">% del total</tspan></text><rect x="10" y="267" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En la mochila el peor caso llegó a 0,556 del óptimo; con pesos 10, 20 y 30, valores 60, 100 y 120 y capacidad 50, el voraz</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">da 160 y el óptimo 220 (el contraejemplo clásico). El mismo problema (intervalos) tiene un criterio voraz correcto y otro</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">incorrecto: la elección del criterio es la parte difícil. Se detecta contrastando con fuerza bruta en instancias pequeñas,</tspan></text><text x="470" y="341.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sin sustituir la demostración.</tspan></text><text x="470" y="389.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuentas deterministas con semilla fija; no dependen del equipo.</tspan></text></svg>
