<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 419" width="950" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Voraz que sí y voraz que no: intervalos y mochila</title><desc id="d">Tabla: ordenar intervalos por hora de fin fue óptimo en 400 de 400 casos y por hora de inicio solo en 338; para la mochila 0/1 el criterio valor por peso fue subóptimo en 228 de 1000 casos, con un peor caso de 0,556 del óptimo, y en el ejemplo clásico dio 160 frente a 220.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="419" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Problema y criterio</tspan></text><rect x="430" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Resultado</tspan></text><rect x="720" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Lectura</tspan></text><rect x="10" y="56" width="414" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Intervalos: ordenar por fin (400 casos aleatorios)</tspan></text><rect x="430" y="56" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">400 de 400 óptimos</tspan></text><rect x="720" y="56" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Elección voraz demostrable</tspan></text><rect x="10" y="122" width="414" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Intervalos: ordenar por inicio (los mismos 400)</tspan></text><rect x="430" y="122" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">338 de 400 óptimos</tspan></text><rect x="720" y="122" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">62 casos con resultado peor</tspan></text><rect x="10" y="188" width="414" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Mochila 0/1: mayor valor/peso, 1 000 casos</tspan></text><rect x="430" y="188" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">228 subóptimos; peor razón 0,556</tspan></text><rect x="720" y="188" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">No es voraz-correcto</tspan></text><rect x="10" y="254" width="414" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="279.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Mochila: pesos 10, 20, 30; valores 60, 100, 120; capacidad</tspan></text><text x="217" y="295.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">50</tspan></text><rect x="430" y="254" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">voraz 160; óptimo 220</tspan></text><rect x="720" y="254" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">El contraejemplo clásico</tspan></text><rect x="10" y="324" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">El mismo problema (intervalos) tiene un criterio voraz correcto y otro incorrecto: la elección del criterio es la parte</tspan></text><text x="475" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">difícil. Se detecta contrastando con fuerza bruta en instancias pequeñas, sin sustituir la demostración.</tspan></text><text x="475" y="405.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Cuentas deterministas con semilla fija; no dependen del equipo.</tspan></text></svg>
