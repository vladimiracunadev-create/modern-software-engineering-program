<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 485" width="950" height="485" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cambio mínimo: voraz frente a programación dinámica</title><desc id="d">Tabla: para el sistema 1, 5, 10, 25 y objetivo 63 voraz y dinámica dan 6 monedas; para 1, 3, 4 y objetivo 6 el voraz da 3 y la dinámica 2; 442 de 2000 sistemas aleatorios de monedas hicieron que el voraz no fuera óptimo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="485" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Sistema de monedas</tspan></text><rect x="320" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Voraz</tspan></text><rect x="570" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Programación dinámica</tspan></text><rect x="760" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Lectura</tspan></text><rect x="10" y="56" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">{1, 5, 10, 25}, objetivo 63</tspan></text><rect x="320" y="56" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">6 monedas</tspan></text><rect x="570" y="56" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">6 monedas</tspan></text><rect x="760" y="56" width="174" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="81.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Coinciden: sistema</tspan></text><text x="847" y="97.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">«canónico»</tspan></text><rect x="10" y="122" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">{1, 3, 4}, objetivo 6</tspan></text><rect x="320" y="122" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">3 monedas (4+1+1)</tspan></text><rect x="570" y="122" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">2 monedas (3+3)</tspan></text><rect x="760" y="122" width="174" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">El voraz falla</tspan></text><rect x="10" y="188" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">{1, 5, 12, 25}</tspan></text><rect x="320" y="188" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">falla para algún objetivo &lt; 200</tspan></text><rect x="570" y="188" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">—</tspan></text><rect x="760" y="188" width="174" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">No canónico</tspan></text><rect x="10" y="254" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">{1, 7, 10}</tspan></text><rect x="320" y="254" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">falla para algún objetivo &lt; 200</tspan></text><rect x="570" y="254" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">—</tspan></text><rect x="760" y="254" width="174" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">No canónico</tspan></text><rect x="10" y="320" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="345.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">2 000 sistemas aleatorios con objetivos</tspan></text><text x="162" y="361.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">1–60</tspan></text><rect x="320" y="320" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="345.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">442 resultados distintos del</tspan></text><text x="442" y="361.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">óptimo</tspan></text><rect x="570" y="320" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">—</tspan></text><rect x="760" y="320" width="174" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">22 % de los casos</tspan></text><rect x="10" y="390" width="930" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">El voraz es correcto solo si la estructura del problema lo garantiza (propiedad de elección voraz). No basta con que</tspan></text><text x="475" y="431.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">funcione en el ejemplo de monedas conocido: hay que demostrarlo o refutarlo con casos.</tspan></text><text x="475" y="471.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Cuentas deterministas con semilla fija; no dependen del equipo.</tspan></text></svg>
