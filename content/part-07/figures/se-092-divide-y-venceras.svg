<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 327" width="950" height="327" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Divide y vencerás: mezcla, subarreglo máximo y particiones desiguales</title><desc id="d">Tabla: la ordenación por mezcla usó 8678, 120 398 y 1 536 147 comparaciones con profundidad 10, 14 y 17 para 1000, 10 000 y 100 000 elementos, cerca de n log2 n; el subarreglo de suma máxima por divide y vencerás tardó 6,22 ms frente a 0,62 ms de Kadane, y una partición de uno en uno agotó la pila.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="327" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">n</tspan></text><rect x="160" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="292" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="292" dy="0">Comparaciones de mezcla</tspan></text><rect x="430" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">n·log₂ n</tspan></text><rect x="670" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Profundidad de recursión</tspan></text><rect x="10" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">1 000</tspan></text><rect x="160" y="56" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">8 678</tspan></text><rect x="430" y="56" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">9 966</tspan></text><rect x="670" y="56" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">10</tspan></text><rect x="10" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">10 000</tspan></text><rect x="160" y="108" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">120 398</tspan></text><rect x="430" y="108" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">132 877</tspan></text><rect x="670" y="108" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">14</tspan></text><rect x="10" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">100 000</tspan></text><rect x="160" y="160" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">1 536 147</tspan></text><rect x="430" y="160" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">1 660 964</tspan></text><rect x="670" y="160" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">17</tspan></text><rect x="10" y="216" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Dividir en mitades da profundidad log n; dividir quitando un elemento da profundidad n (RecursionError con 2 000). Para el</tspan></text><text x="475" y="257.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">subarreglo máximo, 500 de 500 casos coincidieron entre divide y vencerás, Kadane y fuerza bruta, y Kadane fue 10 veces más</tspan></text><text x="475" y="274.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">rápido: el esquema no siempre es el mejor algoritmo.</tspan></text><text x="475" y="313.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
