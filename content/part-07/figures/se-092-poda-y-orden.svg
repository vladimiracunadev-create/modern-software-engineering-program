<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 584" width="940" height="584" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Podar y ordenar las decisiones</title><desc id="d">Barras agrupadas en escala logarítmica con los nodos visitados antes y después de mejorar la búsqueda: la suma de subconjunto pasa de 450 869 sin poda a 4441 con poda, con las mismas 277 soluciones; para la primera solución, 8 reinas pasa de 114 a 15 nodos y 16 reinas de 10 053 a 26 al empezar por el centro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="584" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Podar y ordenar las decisiones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin poda / columnas en orden 0, 1, 2…</tspan></text><rect x="342.98" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="362.98" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="362.98" dy="0">Con poda / empezando por el centro</tspan></text><line x1="123.86" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="375" x2="123.86" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">10</tspan></text><line x1="123.86" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="319" x2="123.86" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">100</tspan></text><line x1="123.86" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="263" x2="123.86" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">1 000</tspan></text><line x1="123.86" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="207" x2="123.86" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">10 000</tspan></text><line x1="123.86" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="151" x2="123.86" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">100 000</tspan></text><line x1="123.86" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="95" x2="123.86" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">1 000 000</tspan></text><line x1="123.86" y1="95" x2="123.86" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">nodos visitados (escala logarítmica)</text><rect x="150.398" y="114.373" width="104.152" height="260.627" rx="3" fill="#c0432f"/><text x="202.474" y="108.373" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="202.474" dy="0">450 869</tspan></text><rect x="258.55" y="226.741" width="104.152" height="148.259" rx="3" fill="#087f8c"/><text x="310.626" y="220.741" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310.626" dy="0">4 441</tspan></text><text x="256.55" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="256.55" dy="0">Suma de subconjunto, 18 números,</tspan></text><text x="256.55" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="256.55" dy="0">objetivo 100</tspan></text><rect x="415.778" y="315.813" width="104.152" height="59.1867" rx="3" fill="#c0432f"/><text x="467.854" y="309.813" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="467.854" dy="0">114</tspan></text><rect x="523.93" y="365.139" width="104.152" height="9.86111" rx="3" fill="#087f8c"/><text x="576.006" y="359.139" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="576.006" dy="0">15</tspan></text><text x="521.93" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="521.93" dy="0">8 reinas, primera solución</tspan></text><rect x="681.158" y="206.871" width="104.152" height="168.129" rx="3" fill="#c0432f"/><text x="733.234" y="200.871" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="733.234" dy="0">10 053</tspan></text><rect x="789.31" y="351.761" width="104.152" height="23.2385" rx="3" fill="#087f8c"/><text x="841.386" y="345.761" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.386" dy="0">26</tspan></text><text x="787.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787.31" dy="0">16 reinas, primera solución</tspan></text><line x1="123.86" y1="110.704" x2="920" y2="110.704" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="104.704" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">Árbol completo 2¹⁹ − 1</tspan></text><rect x="10" y="444" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En reinas, las columnas 0..7 y 7..0 visitan los mismos nodos (114 y 114; 10 053 y 10 053). La poda válida elimina solo</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ramas que no pueden contener soluciones; el orden de las decisiones no cambia qué existe, cambia qué se encuentra primero.</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Si una poda elimina una solución real, el conteo de soluciones difiere del de la fuerza bruta: esa comparación es la</tspan></text><text x="470" y="518.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">prueba.</tspan></text><text x="470" y="566.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuentas deterministas con semilla fija; no dependen del equipo.</tspan></text></svg>
