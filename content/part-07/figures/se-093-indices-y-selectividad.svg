<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un índice ayuda según cuántas filas selecciona la consulta</title><desc id="d">Barras agrupadas en escala logarítmica con el tiempo de cuatro consultas con y sin índice: buscar un correo exacto pasa de 21,6 a 0,0059 milisegundos, una condición que selecciona 1511 filas de 21,04 a 1,02, una que selecciona el 90 por ciento apenas cambia de 207,1 a 196,9 y la conjunción de dos palabras de 9,55 a 0,008.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un índice ayuda según cuántas filas selecciona la consulta</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Recorrido completo</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Con índice</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,001</tspan></text><line x1="93.7" y1="328.333" x2="920" y2="328.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="328.333" x2="93.7" y2="328.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="332.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,01</tspan></text><line x1="93.7" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="281.667" x2="93.7" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,1</tspan></text><line x1="93.7" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="235" x2="93.7" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="188.333" x2="93.7" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="141.667" x2="920" y2="141.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="141.667" x2="93.7" y2="141.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="146.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">ms (escala logarítmica)</text><rect x="114.357" y="172.725" width="80.63" height="202.275" rx="3" fill="#c0432f"/><text x="154.672" y="166.725" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.672" dy="0">21,6</tspan></text><rect x="198.987" y="339.027" width="80.63" height="35.9731" rx="3" fill="#087f8c"/><text x="239.302" y="333.027" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="239.302" dy="0">0,0059</tspan></text><text x="196.987" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.987" dy="0">email = ? (300 000 filas)</tspan></text><rect x="320.933" y="173.258" width="80.63" height="201.742" rx="3" fill="#c0432f"/><text x="361.248" y="167.258" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="361.248" dy="0">21,04</tspan></text><rect x="405.562" y="234.599" width="80.63" height="140.401" rx="3" fill="#087f8c"/><text x="445.877" y="228.599" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="445.877" dy="0">1,02</tspan></text><text x="403.562" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.562" dy="0">score &lt; 5 (1 511 filas)</tspan></text><rect x="527.507" y="126.912" width="80.63" height="248.088" rx="3" fill="#c0432f"/><text x="567.822" y="120.912" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="567.822" dy="0">207,1</tspan></text><rect x="612.137" y="127.935" width="80.63" height="247.065" rx="3" fill="#087f8c"/><text x="652.452" y="121.935" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652.452" dy="0">196,9</tspan></text><text x="610.137" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">score &lt; 900 (90 % de las</tspan></text><text x="610.137" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">filas)</tspan></text><rect x="734.082" y="189.267" width="80.63" height="185.733" rx="3" fill="#c0432f"/><text x="774.398" y="183.267" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="774.398" dy="0">9,55</tspan></text><rect x="818.712" y="332.856" width="80.63" height="42.1442" rx="3" fill="#087f8c"/><text x="859.027" y="326.856" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.027" dy="0">0,008</tspan></text><text x="816.712" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">Dos palabras en 20 000</tspan></text><text x="816.712" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">documentos</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Planes: SCAN t sin índice y SEARCH t USING COVERING INDEX ix_email (email=?) con índice (≈ 3 700 veces menos). La</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">conjunción se resolvió con listas invertidas (595 725 entradas) y 8 coincidencias. EXPLAIN QUERY PLAN muestra la decisión</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del planificador. El índice cuesta espacio y trabajo en cada escritura; sin selectividad no compensa la lectura.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
