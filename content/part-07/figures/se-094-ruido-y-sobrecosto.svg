<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 495" width="940" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que contamina una medición</title><desc id="d">Puntos unidos en escala logarítmica con el valor de referencia y el medido con distorsión: quince repeticiones del mismo ordenamiento variaron de 35 000 a 62 100 microsegundos, cProfile pasó de 9900 a 26 900 y tracemalloc a 105 500, calcular 2 a la 20 con variables costó 149,1 nanosegundos frente a 14,2 con literales, y buscar un ausente en una lista tardó 957,6 microsegundos frente a 0,2 para el primero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="495" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lo que contamina una medición</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Referencia o mínimo</tspan></text><circle cx="213.26" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Con la distorsión</tspan></text><line x1="328.42" y1="77" x2="328.42" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="328.42" y1="297" x2="328.42" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="328.42" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328.42" dy="0">0,01</tspan></text><line x1="381.748" y1="77" x2="381.748" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="381.748" y1="297" x2="381.748" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="381.748" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="381.748" dy="0">0,1</tspan></text><line x1="435.075" y1="77" x2="435.075" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="435.075" y1="297" x2="435.075" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="435.075" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435.075" dy="0">1</tspan></text><line x1="488.403" y1="77" x2="488.403" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="488.403" y1="297" x2="488.403" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="488.403" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="488.403" dy="0">10</tspan></text><line x1="541.73" y1="77" x2="541.73" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="541.73" y1="297" x2="541.73" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="541.73" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="541.73" dy="0">100</tspan></text><line x1="595.058" y1="77" x2="595.058" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="595.058" y1="297" x2="595.058" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="595.058" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595.058" dy="0">1 000</tspan></text><line x1="648.385" y1="77" x2="648.385" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="648.385" y1="297" x2="648.385" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="648.385" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.385" dy="0">10 000</tspan></text><line x1="701.713" y1="77" x2="701.713" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="701.713" y1="297" x2="701.713" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="701.713" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701.713" dy="0">100 000</tspan></text><line x1="755.04" y1="77" x2="755.04" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="755.04" y1="297" x2="755.04" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="755.04" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.04" dy="0">1 000 000</tspan></text><line x1="328.42" y1="297" x2="755.04" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="95" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">15 repeticiones: mínimo →</tspan></text><text x="244" y="112" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">máximo</tspan></text><text x="244" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Con cProfile</tspan></text><text x="244" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Con tracemalloc</tspan></text><text x="244" y="235.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">2**20: literales → variables</tspan></text><text x="244" y="279.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">0 in lista: primero → ausente</tspan></text><line x1="677.399" y1="99" x2="690.679" y2="99" stroke="#c0432f" stroke-width="4"/><circle cx="677.399" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="690.679" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="665.399" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="665.399" dy="0">35 000</tspan></text><text x="702.679" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="702.679" dy="0">62 100</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">CV 20,5 %</tspan></text><line x1="648.152" y1="143" x2="671.303" y2="143" stroke="#c0432f" stroke-width="4"/><circle cx="648.152" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="671.303" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="636.152" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="636.152" dy="0">9 900</tspan></text><text x="683.303" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="683.303" dy="0">26 900</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×2,7</tspan></text><line x1="648.152" y1="187" x2="702.952" y2="187" stroke="#c0432f" stroke-width="4"/><circle cx="648.152" cy="187" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="702.952" cy="187" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="636.152" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="636.152" dy="0">9 900</tspan></text><text x="714.952" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="714.952" dy="0">105 500</tspan></text><text x="926" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×10,7</tspan></text><line x1="336.541" y1="231" x2="390.999" y2="231" stroke="#c0432f" stroke-width="4"/><circle cx="336.541" cy="231" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="390.999" cy="231" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="324.541" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324.541" dy="0">0,0142</tspan></text><text x="402.999" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="402.999" dy="0">0,1491</tspan></text><text x="926" y="235.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×10</tspan></text><line x1="397.801" y1="275" x2="594.054" y2="275" stroke="#c0432f" stroke-width="4"/><circle cx="397.801" cy="275" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="594.054" cy="275" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="385.801" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="385.801" dy="0">0,2</tspan></text><text x="606.054" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="606.054" dy="0">957,6</tspan></text><text x="926" y="279.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×4 800</tspan></text><text x="541.73" y="341" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="541.73" dy="0">µs (escala logarítmica)</tspan></text><rect x="10" y="355" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="379.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El mismo trabajo con cProfile pasó de 9,9 a 26,9 ms (sobrecosto ×2,7 y distorsión por función) y con tracemalloc a 105,5 ms</tspan></text><text x="470" y="396.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(×10,7); en la lista, el del medio tardó 453,7 µs. Los literales se pliegan en compilación (14,2 ns frente a 149,1 ns): se</tspan></text><text x="470" y="413.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">midió otra cosa. Para comparar alternativas se usa el mínimo o la mediana de muchas repeticiones sobre entradas</tspan></text><text x="470" y="429.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">representativas, y se declara cuál. Un perfilador responde «dónde», no «cuánto» absoluto.</tspan></text><text x="470" y="477.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
