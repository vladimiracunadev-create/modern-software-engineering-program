<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 485" width="950" height="485" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que contamina una medición</title><desc id="d">Tabla: quince repeticiones del mismo ordenamiento variaron entre 35,0 y 62,1 milisegundos; cProfile multiplicó el tiempo por 2,7 y tracemalloc por 10,7; calcular 2 a la 20 con literales fue 10 veces más barato por plegado de constantes; y buscar el primer, el del medio o un ausente en una lista cambia el tiempo de 0,2 a 957,6 microsegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="485" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Qué se midió</tspan></text><rect x="340" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Resultado</tspan></text><rect x="670" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">15 repeticiones de sorted(random.sample(50</tspan></text><text x="172" y="97.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">000))</tspan></text><rect x="340" y="56" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">mínimo 35,0 · mediana 39,0 · máximo 62,1 ms</tspan></text><rect x="670" y="56" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Coef. de variación 20,5 %</tspan></text><rect x="10" y="122" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Mismo trabajo con cProfile</tspan></text><rect x="340" y="122" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">9,9 ms → 26,9 ms</tspan></text><rect x="670" y="122" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="147.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Sobrecosto ×2,7 y distorsión por</tspan></text><text x="802" y="163.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">función</tspan></text><rect x="10" y="188" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Mismo trabajo con tracemalloc</tspan></text><rect x="340" y="188" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">9,9 ms → 105,5 ms</tspan></text><rect x="670" y="188" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Sobrecosto ×10,7</tspan></text><rect x="10" y="254" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">2**20 con literales frente a variables</tspan></text><rect x="340" y="254" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">14,2 ns frente a 149,1 ns</tspan></text><rect x="670" y="254" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="279.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">El plegado de constantes midió otra</tspan></text><text x="802" y="295.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">cosa</tspan></text><rect x="10" y="320" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="345.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0 in lista de 100 000: primero, medio,</tspan></text><text x="172" y="361.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">ausente</tspan></text><rect x="340" y="320" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0,2 µs · 453,7 µs · 957,6 µs</tspan></text><rect x="670" y="320" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="345.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">El caso medido cambia el resultado</tspan></text><text x="802" y="361.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">×4 800</tspan></text><rect x="10" y="390" width="930" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Para comparar alternativas se usa el mínimo o la mediana de muchas repeticiones sobre entradas representativas, y se declara</tspan></text><text x="475" y="431.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">cuál. Un perfilador responde «dónde», no «cuánto» absoluto.</tspan></text><text x="475" y="471.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
