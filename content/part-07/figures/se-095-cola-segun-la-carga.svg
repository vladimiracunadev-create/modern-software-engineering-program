<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 307" width="940" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Misma estructura, dos cargas: la lista como cola</title><desc id="d">Barras de 40 000 operaciones: con carga equilibrada la lista tarda 4,4 milisegundos y el deque 3,8, y la cola queda con 78 elementos; con 70 por ciento de entradas la lista tarda 21,6 y el deque 3,7, y la cola queda con 16 024 elementos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="307" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Equilibrada, list.pop(0)</tspan></text><rect x="340" y="16" width="96.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="444.8" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="444.8" dy="0">4,4 ms</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Equilibrada, deque.popleft()</tspan></text><rect x="340" y="60" width="83.6" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="431.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="431.6" dy="0">3,8 ms</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Con más entradas, list.pop(0)</tspan></text><rect x="340" y="104" width="475.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="823.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="823.2" dy="0">21,6 ms</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Con más entradas, deque.popleft()</tspan></text><rect x="340" y="148" width="81.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429.4" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="429.4" dy="0">3,7 ms</tspan></text><rect x="10" y="196" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La lista funcionó aceptablemente mientras la cola se mantuvo corta (78 elementos al final). Con una cola que crece (16 024</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">elementos), pop(0) costó 5,8 veces más. La recomendación depende de la longitud típica de la cola, que se mide en</tspan></text><text x="470" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">producción.</tspan></text><text x="470" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
