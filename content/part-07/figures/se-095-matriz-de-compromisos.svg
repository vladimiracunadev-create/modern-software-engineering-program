<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 531" width="940" height="531" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Matriz de compromisos medida: operación dominante frente a estructura</title><desc id="d">Barras horizontales con lo que cuesta la alternativa frente al mejor candidato de cada carga: la lista ordenada cuesta 4,5 veces el montículo en la cola de prioridad (50,0 frente a 11,2 milisegundos), la lista 192 veces el set en 2000 pertenencias (315,2 frente a 1,64), el recorrido 648 veces bisect en el conteo por rango (1036 frente a 1,6 microsegundos) y el set 5,2 veces la lista en memoria (4,19 frente a 0,80 MB).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="531" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Matriz de compromisos medida: operación dominante frente a estructura</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mejor candidato (referencia = ×1)</tspan></text><rect x="312.82" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="332.82" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="332.82" dy="0">Alternativa</tspan></text><line x1="404" y1="77" x2="404" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="404" y1="333" x2="404" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="404" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="404" dy="0">1</tspan></text><line x1="563.92" y1="77" x2="563.92" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="563.92" y1="333" x2="563.92" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="563.92" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="563.92" dy="0">10</tspan></text><line x1="723.84" y1="77" x2="723.84" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="723.84" y1="333" x2="723.84" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="723.84" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="723.84" dy="0">100</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="333" x2="883.76" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">1 000</tspan></text><line x1="404" y1="333" x2="883.76" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="394" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">Cola de prioridad, 20 000 elementos: montículo 11,2</tspan></text><text x="394" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">ms · lista ordenada 50,0 ms</tspan></text><text x="394" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">2 000 pertenencias sobre 20 000 claves: set 1,64 ms</tspan></text><text x="394" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">· lista 315,2 ms</tspan></text><text x="394" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">Conteo en un rango de 20 000 claves ordenadas:</tspan></text><text x="394" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">bisect 1,6 µs · recorrido 1 036 µs</tspan></text><text x="394" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">Memoria por 100 000 enteros: lista 0,80 MB · set</tspan></text><text x="394" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">4,19 MB · dict 5,24 MB</tspan></text><rect x="404" y="83" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="413" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="413" dy="0">×1,0</tspan></text><rect x="404" y="110.5" width="103.842" height="24.5" rx="3" fill="#946512"/><text x="514.842" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="514.842" dy="0">×4,5</tspan></text><rect x="404" y="147" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="413" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="413" dy="0">×1,0</tspan></text><rect x="404" y="174.5" width="365.218" height="24.5" rx="3" fill="#946512"/><text x="776.218" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="776.218" dy="0">×192</tspan></text><rect x="404" y="211" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="413" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="413" dy="0">×1,0</tspan></text><rect x="404" y="238.5" width="449.573" height="24.5" rx="3" fill="#946512"/><text x="860.573" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="860.573" dy="0">×648</tspan></text><rect x="404" y="275" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="413" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="413" dy="0">×1,0</tspan></text><rect x="404" y="302.5" width="115.035" height="24.5" rx="3" fill="#946512"/><text x="526.035" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="526.035" dy="0">×5,2</tspan></text><text x="643.88" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="643.88" dy="0">veces el costo del mejor candidato (escala logarítmica)</tspan></text><rect x="10" y="391" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Razones calculadas con las medidas de las etiquetas. El dict ocupa 6,5 veces la lista en la última carga. Con</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">min()+remove() sobre 5 000 elementos la cola de prioridad tardó 310,9 ms. Cada carga tiene un ganador distinto, y el que</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">gana en tiempo suele perder en memoria. Una recomendación única sin la operación dominante no es defendible; con ella se</tspan></text><text x="470" y="465.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escribe en una línea.</tspan></text><text x="470" y="513.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
