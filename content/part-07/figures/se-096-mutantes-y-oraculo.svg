<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 495" width="950" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis mutantes de una secuencia ordenada: ejemplos frente a oráculo diferencial</title><desc id="d">Tabla de seis defectos inyectados: las pruebas de ejemplo solo detectan dos (agregar al final y rango cerrado); el oráculo diferencial con 200 semillas de 60 pasos detecta cinco entre 97,5 y 100 por ciento y no detecta el sexto, que es equivalente para enteros.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="495" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Mutante</tspan></text><rect x="360" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">¿Pasan los ejemplos?</tspan></text><rect x="550" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Detectado por el oráculo</tspan></text><rect x="760" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Pasos medianos hasta</tspan></text><text x="847" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">fallar</tspan></text><rect x="10" y="56" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">add_end: agrega al final sin ordenar</tspan></text><rect x="360" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">No (falla)</tspan></text><rect x="550" y="56" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">100 %</tspan></text><rect x="760" y="56" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">6</tspan></text><rect x="10" y="110" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">closed_hi: el rango incluye el extremo superior</tspan></text><rect x="360" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">No (falla)</tspan></text><rect x="550" y="110" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">98,5 %</tspan></text><rect x="760" y="110" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">20</tspan></text><rect x="10" y="164" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">remove_all: borra todos los duplicados</tspan></text><rect x="360" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Sí (pasa)</tspan></text><rect x="550" y="164" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">99,0 %</tspan></text><rect x="760" y="164" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">29</tspan></text><rect x="10" y="218" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="237.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">raise_missing: lanza KeyError al borrar un</tspan></text><text x="182" y="253.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">ausente</tspan></text><rect x="360" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Sí (pasa)</tspan></text><rect x="550" y="218" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">98,5 %</tspan></text><rect x="760" y="218" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">4</tspan></text><rect x="10" y="272" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="299.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">neg_range: devuelve negativo si lo &gt; hi</tspan></text><rect x="360" y="272" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Sí (pasa)</tspan></text><rect x="550" y="272" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">97,5 %</tspan></text><rect x="760" y="272" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">15</tspan></text><rect x="10" y="326" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="353.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">left_dups: inserta duplicados a la izquierda</tspan></text><rect x="360" y="326" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Sí (pasa)</tspan></text><rect x="550" y="326" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">0 %</tspan></text><rect x="760" y="326" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">—</tspan></text><rect x="10" y="384" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="408.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Los ejemplos escritos a mano dejaron pasar cuatro de seis defectos. left_dups no se detecta porque, para enteros iguales,</tspan></text><text x="475" y="425.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">insertar a izquierda o derecha es indistinguible: es un mutante equivalente, y solo una prueba con identidad (registros) lo</tspan></text><text x="475" y="442.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">revelaría.</tspan></text><text x="475" y="481.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Cuentas deterministas con semilla fija; no dependen del equipo.</tspan></text></svg>
