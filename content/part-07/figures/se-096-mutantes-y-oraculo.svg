<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 642" width="940" height="642" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis mutantes de una secuencia ordenada: ejemplos frente a oráculo diferencial</title><desc id="d">Barras horizontales con el porcentaje de detección de seis defectos inyectados: las pruebas de ejemplo solo detectan dos (agregar al final y rango cerrado), y el oráculo diferencial con 200 semillas de 60 pasos detecta cinco entre 97,5 y 100 por ciento y no detecta left_dups, que es equivalente para enteros.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="642" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis mutantes de una secuencia ordenada: ejemplos frente a oráculo diferencial</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pruebas de ejemplo: detecta (100 %) o pasa (0 %)</tspan></text><rect x="425.92" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="445.92" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="445.92" dy="0">Oráculo diferencial (% de 200 semillas)</tspan></text><line x1="354" y1="77" x2="354" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="461" x2="354" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="459.952" y1="77" x2="459.952" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="459.952" y1="461" x2="459.952" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="459.952" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="459.952" dy="0">20</tspan></text><line x1="565.904" y1="77" x2="565.904" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="565.904" y1="461" x2="565.904" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="565.904" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="565.904" dy="0">40</tspan></text><line x1="671.856" y1="77" x2="671.856" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="671.856" y1="461" x2="671.856" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="671.856" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="671.856" dy="0">60</tspan></text><line x1="777.808" y1="77" x2="777.808" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="777.808" y1="461" x2="777.808" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="777.808" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777.808" dy="0">80</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="461" x2="883.76" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="354" y1="461" x2="883.76" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">add_end: agrega al final sin ordenar (mediana</tspan></text><text x="344" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">6 pasos)</tspan></text><text x="344" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">closed_hi: el rango incluye el extremo</tspan></text><text x="344" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">superior (20)</tspan></text><text x="344" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">remove_all: borra todos los duplicados (29)</tspan></text><text x="344" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">raise_missing: lanza KeyError al borrar un</tspan></text><text x="344" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">ausente (4)</tspan></text><text x="344" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">neg_range: devuelve negativo si lo &gt; hi (15)</tspan></text><text x="344" y="425" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">left_dups: inserta duplicados a la izquierda</tspan></text><text x="344" y="442" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(—)</tspan></text><rect x="354" y="83" width="529.76" height="24.5" rx="3" fill="#946512"/><text x="890.76" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="890.76" dy="0">100</tspan></text><rect x="354" y="110.5" width="529.76" height="24.5" rx="3" fill="#087f8c"/><text x="890.76" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="890.76" dy="0">100</tspan></text><rect x="354" y="147" width="529.76" height="24.5" rx="3" fill="#946512"/><text x="890.76" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="890.76" dy="0">100</tspan></text><rect x="354" y="174.5" width="521.814" height="24.5" rx="3" fill="#087f8c"/><text x="882.814" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.814" dy="0">98,5</tspan></text><rect x="354" y="211" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="238.5" width="524.462" height="24.5" rx="3" fill="#087f8c"/><text x="885.462" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="885.462" dy="0">99,0</tspan></text><rect x="354" y="275" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="302.5" width="521.814" height="24.5" rx="3" fill="#087f8c"/><text x="882.814" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.814" dy="0">98,5</tspan></text><rect x="354" y="339" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="366.5" width="516.516" height="24.5" rx="3" fill="#087f8c"/><text x="877.516" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="877.516" dy="0">97,5</tspan></text><rect x="354" y="403" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="430.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><text x="618.88" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="618.88" dy="0">% de detección</tspan></text><rect x="10" y="519" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los ejemplos escritos a mano dejaron pasar cuatro de seis defectos. left_dups no se detecta porque, para enteros iguales,</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">insertar a izquierda o derecha es indistinguible: es un mutante equivalente, y solo una prueba con identidad (registros) lo</tspan></text><text x="470" y="577.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">revelaría. Entre paréntesis, los pasos medianos hasta fallar.</tspan></text><text x="470" y="624.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuentas deterministas con semilla fija; no dependen del equipo.</tspan></text></svg>
