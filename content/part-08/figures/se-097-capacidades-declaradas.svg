<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 444" width="940" height="444" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Protocolo no es capacidad</title><desc id="d">Diagrama del intercambio initialize entre el editor y ruff server: el servidor declara en su respuesta cinco grupos de capacidades, entre ellas sincronización de texto, diagnósticos, acciones de código, formato y hover, y no declara completado ni definición.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="444" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Protocolo no es capacidad</tspan></text><rect x="14" y="115" width="150" height="120" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="89" y="170.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="89" dy="0">Editor</tspan></text><text x="89" y="186.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="89" dy="0">pide initialize</tspan></text><rect x="250" y="49" width="676" height="270" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="264" y="71" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="264" dy="0">Respuesta de initialize: 10 capacidades declaradas</tspan></text><polyline points="164,175 248,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="206" y="163" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="206" dy="0">initialize</tspan></text><polyline points="248,205 164,205" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="83" width="300" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="418" y="106.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="418" dy="0">textDocumentSync</tspan></text><text x="418" y="122.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="418" dy="0">didOpen y didChange</tspan></text><rect x="580" y="83" width="330" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="745" y="106.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="745" dy="0">diagnosticProvider</tspan></text><text x="745" y="122.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="745" dy="0">diagnósticos publicados</tspan></text><rect x="268" y="149" width="300" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="418" y="171" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="418" dy="0">codeActionProvider ·</tspan></text><text x="418" y="187.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="418" dy="0">documentFormattingProvider</tspan></text><text x="418" y="204.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="418" dy="0">correcciones y formato</tspan></text><rect x="580" y="149" width="330" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="745" y="179.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="745" dy="0">hoverProvider</tspan></text><text x="745" y="195.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="745" dy="0">información al pasar el cursor</tspan></text><rect x="268" y="235" width="642" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="589" y="263.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="589" dy="0">completionProvider · definitionProvider: no declaradas</tspan></text><text x="589" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="589" dy="0">este servidor no completa ni navega; el completado lo ofrece otro servidor o falta</tspan></text><rect x="10" y="337" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="361.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hablar LSP no equivale a ofrecer todas las funciones. Si el editor muestra completado, lo ofrece otro servidor; si no lo</tspan></text><text x="470" y="378.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">muestra, no es un fallo del protocolo sino una capacidad ausente.</tspan></text><text x="470" y="426.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
