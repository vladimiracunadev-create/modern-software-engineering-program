<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Editar código roto y mantener la latencia</title><desc id="d">Tabla que muestra que ast.parse y tokenize se detienen en el primer error del código roto, que analizar 59999 líneas con ast.parse tarda 432 ms y que una actualización incremental en el servidor tarda 5 ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Prueba</tspan></text><rect x="330" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Resultado</tspan></text><rect x="550" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="732" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="732" dy="0">Lectura</tspan></text><rect x="10" y="56" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">ast.parse del código roto</tspan></text><rect x="330" y="56" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">SyntaxError en la línea 1</tspan></text><rect x="550" y="56" width="364" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">&#x27;(&#x27; was never closed: se detiene en el primer error</tspan></text><rect x="10" y="118" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">tokenize del mismo código</tspan></text><rect x="330" y="118" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">TokenError</tspan></text><rect x="550" y="118" width="364" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="141.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">El analizador léxico también se detiene antes del</tspan></text><text x="732" y="157.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">final</tspan></text><rect x="10" y="180" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">ast.parse de 59 999 líneas válidas</tspan></text><rect x="330" y="180" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">432 ms</tspan></text><rect x="550" y="180" width="364" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="203.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Reanalizar el archivo completo en cada pulsación no</tspan></text><text x="732" y="219.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">es viable</tspan></text><rect x="10" y="242" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">didChange de ruff en un archivo pequeño</tspan></text><rect x="330" y="242" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">5 ms</tspan></text><rect x="550" y="242" width="364" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">El servidor mantiene el documento en memoria</tspan></text><rect x="10" y="308" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Un editor trabaja casi siempre con código incompleto. Por eso los servidores usan analizadores tolerantes a errores y</tspan></text><text x="465" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">actualizaciones incrementales; la biblioteca estándar es un compilador, no un servicio interactivo.</tspan></text><text x="465" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
