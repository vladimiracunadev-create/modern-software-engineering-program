<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 356" width="940" height="356" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Editar código roto y mantener la latencia</title><desc id="d">Diagrama de lo que ocurre al editar código roto con un paréntesis sin cerrar: ast.parse lanza SyntaxError en la línea 1 y tokenize TokenError, los dos se detienen en el primer error; reanalizar 59999 líneas válidas con ast.parse tarda 432 ms, mientras ruff server mantiene el documento en memoria y actualiza en 5 ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="356" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Editar código roto y mantener la latencia</tspan></text><rect x="14" y="107" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="137.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Código roto en el editor</tspan></text><text x="139" y="153.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">un «(» sin cerrar</tspan></text><rect x="334" y="49" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">ast.parse: SyntaxError en la línea 1</tspan></text><text x="630" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">se detiene en el primer error; reanalizar 59 999 líneas válidas cuesta 432 ms</tspan></text><polyline points="264,142 299,142 299,76 334,76" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="115" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="137.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">tokenize: TokenError</tspan></text><text x="630" y="153.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">el analizador léxico también se detiene antes del final</tspan></text><polyline points="264,142 299,142 299,142 334,142" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="181" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Servidor de ruff: didChange en 5 ms</tspan></text><text x="630" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">mantiene el documento en memoria y actualiza sin reanalizar todo</tspan></text><polyline points="264,142 299,142 299,208 334,208" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="249" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="273.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un editor trabaja casi siempre con código incompleto. Por eso los servidores usan analizadores tolerantes a errores y</tspan></text><text x="470" y="290.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">actualizaciones incrementales; la biblioteca estándar es un compilador, no un servicio interactivo.</tspan></text><text x="470" y="338.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
