<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 328" width="940" height="328" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un intercambio LSP real con ruff server</title><desc id="d">Barras horizontales con el tiempo de cada mensaje de un intercambio real con ruff server: initialize tarda 240 milisegundos, el primer análisis tras didOpen 351 y la actualización tras didChange 5; el arranque y el primer análisis pesan decenas de veces más que una edición.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="328" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un intercambio LSP real con ruff server</tspan></text><line x1="294" y1="49" x2="294" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="163" x2="294" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="443.455" y1="49" x2="443.455" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="443.455" y1="163" x2="443.455" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="443.455" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="443.455" dy="0">100</tspan></text><line x1="592.91" y1="49" x2="592.91" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="592.91" y1="163" x2="592.91" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="592.91" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592.91" dy="0">200</tspan></text><line x1="742.365" y1="49" x2="742.365" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="742.365" y1="163" x2="742.365" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="742.365" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742.365" dy="0">300</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="163" x2="891.82" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">400</tspan></text><line x1="294" y1="163" x2="891.82" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">initialize → respuesta</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">didOpen → publishDiagnostics</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">didChange → publishDiagnostics</tspan></text><rect x="294" y="55" width="358.692" height="26" rx="3" fill="#087f8c"/><text x="659.692" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="659.692" dy="0">240</tspan></text><rect x="294" y="93" width="524.587" height="26" rx="3" fill="#087f8c"/><text x="825.587" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="825.587" dy="0">351</tspan></text><rect x="294" y="131" width="7.47275" height="26" rx="3" fill="#087f8c"/><text x="308.473" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="308.473" dy="0">5</tspan></text><text x="592.91" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592.91" dy="0">Tiempo hasta la respuesta (ms)</tspan></text><rect x="10" y="221" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El primer análisis es mucho más lento que las ediciones siguientes (351 ms frente a 5 ms): el editor no recibe diagnósticos</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con la misma latencia en el arranque que durante la edición.</tspan></text><text x="470" y="310.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
