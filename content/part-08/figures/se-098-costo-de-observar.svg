<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 291" width="940" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de observar la ejecución</title><desc id="d">Barras con el tiempo de 300 000 llamadas a una función: sin trazado 43,7 ms, con sys.monitoring 84,9 ms (1,9 veces), con settrace de llamadas 174,7 ms (4,0 veces, 300 001 eventos) y con settrace de líneas 422,6 ms (9,7 veces, 1 500 005 eventos).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="291" fill="#ffffff"/><text x="280" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Sin trazado</tspan></text><rect x="290" y="16" width="30.59" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="328.59" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="328.59" dy="0">43,7 ms</tspan></text><text x="280" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">sys.monitoring (PY_START)</tspan></text><rect x="290" y="60" width="59.43" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357.43" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="357.43" dy="0">84,9 ms · 1,9×</tspan></text><text x="280" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">settrace, eventos de llamada</tspan></text><rect x="290" y="104" width="122.29" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="420.29" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="420.29" dy="0">174,7 ms · 4,0×</tspan></text><text x="280" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">settrace, eventos de línea</tspan></text><rect x="290" y="148" width="295.82" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="593.82" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="593.82" dy="0">422,6 ms · 9,7×</tspan></text><rect x="10" y="196" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Observar cambia lo observado: un fallo que depende de tiempos puede desaparecer bajo el depurador. Los eventos medidos</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fueron 300 001 de llamada y 1 500 005 de línea para 300 000 llamadas.</tspan></text><text x="470" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
