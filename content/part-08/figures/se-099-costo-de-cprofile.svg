<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 203" width="940" height="203" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El perfilador determinista altera la carga</title><desc id="d">Barras con el tiempo de una carga con 1 200 018 llamadas: 27,4 milisegundos sin perfilar y 132,5 milisegundos con cProfile, 4,8 veces más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="203" fill="#ffffff"/><text x="250" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Carga sin perfilar</tspan></text><rect x="260" y="16" width="60.28" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="328.28" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="328.28" dy="0">27,4 ms</tspan></text><text x="250" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Con cProfile</tspan></text><rect x="260" y="60" width="291.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="559.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="559.5" dy="0">132,5 ms · 4,8×</tspan></text><rect x="10" y="108" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cProfile registró 1 200 018 llamadas. Su costo se paga por llamada: reparte el tiempo entre funciones pequeñas con un sesgo</tspan></text><text x="470" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hacia las que se llaman más veces. El perfil indica dónde mirar, no cuánto vale cada función sin la herramienta.</tspan></text><text x="470" y="189.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
