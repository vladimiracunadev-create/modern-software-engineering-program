<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 366" width="940" height="366" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un perfil por muestreo con poca perturbación</title><desc id="d">Barras horizontales con las muestras de la pila del hilo principal tomadas cada milisegundo: 21 en el generador, 7 en helper y una en cold y otra en wait; el muestreo añade solo un 7 por ciento al tiempo (205 ms frente a 192 ms).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="366" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un perfil por muestreo con poca perturbación</tspan></text><line x1="154" y1="49" x2="154" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="154" y1="201" x2="154" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="154" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154" dy="0">0</tspan></text><line x1="303.176" y1="49" x2="303.176" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="303.176" y1="201" x2="303.176" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="303.176" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="303.176" dy="0">5</tspan></text><line x1="452.352" y1="49" x2="452.352" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="452.352" y1="201" x2="452.352" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="452.352" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452.352" dy="0">10</tspan></text><line x1="601.528" y1="49" x2="601.528" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="601.528" y1="201" x2="601.528" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="601.528" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.528" dy="0">15</tspan></text><line x1="750.704" y1="49" x2="750.704" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="750.704" y1="201" x2="750.704" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="750.704" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="750.704" dy="0">20</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="201" x2="899.88" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">25</tspan></text><line x1="154" y1="201" x2="899.88" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="144" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">&lt;genexpr&gt;</tspan></text><text x="144" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">helper</tspan></text><text x="144" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">cold</tspan></text><text x="144" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">wait</tspan></text><rect x="154" y="55" width="626.539" height="26" rx="3" fill="#087f8c"/><text x="787.539" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="787.539" dy="0">21</tspan></text><rect x="154" y="93" width="208.846" height="26" rx="3" fill="#087f8c"/><text x="369.846" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="369.846" dy="0">7</tspan></text><rect x="154" y="131" width="29.8352" height="26" rx="3" fill="#087f8c"/><text x="190.835" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="190.835" dy="0">1</tspan></text><rect x="154" y="169" width="29.8352" height="26" rx="3" fill="#087f8c"/><text x="190.835" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="190.835" dy="0">1</tspan></text><text x="526.94" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="526.94" dy="0">Muestras de la pila (30 en total)</tspan></text><rect x="10" y="259" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 30 muestras en total la precisión es baja: el muestreo señala dónde se gasta el tiempo con un margen amplio. Perturba</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mucho menos (+7 % frente a 4,8×), a cambio de menos detalle y de funciones rápidas que pueden no aparecer.</tspan></text><text x="470" y="348.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
