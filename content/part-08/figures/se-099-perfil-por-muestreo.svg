<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 387" width="930" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un perfil por muestreo con poca perturbación</title><desc id="d">Tabla del resultado de muestrear la pila del hilo principal cada milisegundo: 21 muestras en el generador, 7 en helper y una en cold y wait; el tiempo con muestreo fue 205 ms frente a 192 ms sin muestrear.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="387" fill="#ffffff"/><rect x="10" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="127" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="127" dy="0">Función observada</tspan></text><rect x="250" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="322" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322" dy="0">Muestras</tspan></text><rect x="400" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="657" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">Lectura</tspan></text><rect x="10" y="56" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">&lt;genexpr&gt;</tspan></text><rect x="250" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">21</tspan></text><rect x="400" y="56" width="514" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">Es donde estaba la ejecución la mayor parte del tiempo</tspan></text><rect x="10" y="114" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">helper</tspan></text><rect x="250" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">7</tspan></text><rect x="400" y="114" width="514" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">La función llamada desde el generador</tspan></text><rect x="10" y="172" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">cold · wait</tspan></text><rect x="250" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">1 y 1</tspan></text><rect x="400" y="172" width="514" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">Casi sin muestras: no es el cuello de botella</tspan></text><rect x="10" y="230" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">Tiempo con muestreo</tspan></text><rect x="250" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">205 ms</tspan></text><rect x="400" y="230" width="514" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">Frente a 192 ms sin muestrear: +7 %</tspan></text><rect x="10" y="292" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Con 30 muestras en total la precisión es baja: el muestreo señala dónde se gasta el tiempo con un margen amplio. Perturba</tspan></text><text x="465" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">mucho menos (+7 % frente a 4,8×), a cambio de menos detalle y de funciones rápidas que pueden no aparecer.</tspan></text><text x="465" y="373.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
