<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 392" width="940" height="392" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Formato, reglas y configuración</title><desc id="d">Diagrama de la configuración de ruff: de 59 familias de reglas solo E y F están activas por defecto; la regla B006 del argumento mutable existe pero no está activa y no da aviso; aplicar black dos veces da la misma salida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="392" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Formato, reglas y configuración</tspan></text><rect x="14" y="49" width="640" height="214" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="28" y="71" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="28" dy="0">ruff: 59 familias de reglas, cada una se activa por separado</tspan></text><rect x="34" y="85" width="290" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="179" y="115.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="179" dy="0">E y F: activas por defecto</tspan></text><text x="179" y="131.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="179" dy="0">estilo básico y errores de nombres</tspan></text><rect x="344" y="85" width="290" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="489" y="115.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="489" dy="0">Resto de familias</tspan></text><text x="489" y="131.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="489" dy="0">se eligen en la configuración</tspan></text><rect x="34" y="171" width="600" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="334" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="334" dy="0">B006 (argumento mutable por defecto): existe pero no está activa</tspan></text><text x="334" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="334" dy="0">con el conjunto por defecto el código con ese defecto no recibe aviso</tspan></text><rect x="680" y="85" width="246" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="803" y="122" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="803" dy="0">black aplicado dos veces</tspan></text><text x="803" y="138.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="803" dy="0">misma salida: el formateo es</tspan></text><text x="803" y="155.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="803" dy="0">idempotente</tspan></text><polyline points="803,185 803,205" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="680" y="205" width="246" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="803" y="229.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="803" dy="0">La configuración se versiona</tspan></text><text x="803" y="245.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="803" dy="0">con el código</tspan></text><rect x="10" y="285" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La configuración es parte del resultado: el mismo código pasa o falla según las reglas activas. Por eso el conjunto de</tspan></text><text x="470" y="326.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reglas se versiona junto con el código.</tspan></text><text x="470" y="374.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
