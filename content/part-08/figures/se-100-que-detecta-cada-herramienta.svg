<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 551" width="930" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué detecta cada herramienta</title><desc id="d">Matriz de seis fragmentos con lo que detectan ruff y mypy y lo que ocurre al ejecutar: ruff detecta F401 y F821, mypy detecta el argumento mal tipado y los demás defectos solo aparecen al ejecutar o con reglas no activas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="551" fill="#ffffff"/><rect x="10" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152" dy="0">Fragmento</tspan></text><rect x="300" y="12" width="64" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">ruff</tspan></text><rect x="370" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Errores de</tspan></text><text x="422" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">mypy</tspan></text><rect x="480" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Ejecución</tspan></text><rect x="580" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Lectura</tspan></text><rect x="10" y="56" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Importación sin usar</tspan></text><rect x="300" y="56" width="64" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">F401</tspan></text><rect x="370" y="56" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0</tspan></text><rect x="480" y="56" width="94" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">ok</tspan></text><rect x="580" y="56" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Lo ve el linter</tspan></text><rect x="10" y="122" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="147.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Nombre no definido (en función no</tspan></text><text x="152" y="163.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">llamada)</tspan></text><rect x="300" y="122" width="64" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">F821</tspan></text><rect x="370" y="122" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0</tspan></text><rect x="480" y="122" width="94" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">ok</tspan></text><rect x="580" y="122" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Falla solo si la función se ejecuta</tspan></text><rect x="10" y="188" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">`f(&#x27;a&#x27;)` con `x: int`</tspan></text><rect x="300" y="188" width="64" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">—</tspan></text><rect x="370" y="188" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">1</tspan></text><rect x="480" y="188" width="94" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">ok</tspan></text><rect x="580" y="188" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="213.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Lo ve el verificador; las anotaciones no se</tspan></text><text x="747" y="229.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">aplican en ejecución</tspan></text><rect x="10" y="254" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">`x: Any` y `x + 1` con una cadena</tspan></text><rect x="300" y="254" width="64" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">—</tspan></text><rect x="370" y="254" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0</tspan></text><rect x="480" y="254" width="94" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">TypeError</tspan></text><rect x="580" y="254" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">`Any` apaga la verificación</tspan></text><rect x="10" y="320" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="353.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">`d[&#x27;k&#x27;]` sobre un dict vacío</tspan></text><rect x="300" y="320" width="64" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">—</tspan></text><rect x="370" y="320" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0</tspan></text><rect x="480" y="320" width="94" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">KeyError</tspan></text><rect x="580" y="320" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Solo la ejecución lo revela</tspan></text><rect x="10" y="386" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="419.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Argumento mutable por defecto</tspan></text><rect x="300" y="386" width="64" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="419.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">—</tspan></text><rect x="370" y="386" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="419.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0</tspan></text><rect x="480" y="386" width="94" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="419.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">ok</tspan></text><rect x="580" y="386" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="419.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">No lo marca el conjunto de reglas por defecto</tspan></text><rect x="10" y="456" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="480.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Ninguna herramienta cubre todo: el linter, el verificador de tipos y la ejecución detectan clases distintas de defectos.</tspan></text><text x="465" y="497.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Un conjunto de reglas por defecto no incluye todas las reglas relevantes.</tspan></text><text x="465" y="537.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
