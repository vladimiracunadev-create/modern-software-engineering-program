<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 495" width="940" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué detecta cada herramienta</title><desc id="d">Mapa de calor con lo que detecta cada herramienta en seis fragmentos: ruff detecta la importación sin usar y el nombre no definido; mypy solo el argumento mal tipado; la ejecución solo el TypeError con Any y el KeyError; el argumento mutable por defecto no lo detecta ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="495" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué detecta cada herramienta</tspan></text><text x="633" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="633" dy="0">¿La herramienta lo detecta?</tspan></text><text x="441.667" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="441.667" dy="0">ruff</tspan></text><text x="633" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="633" dy="0">mypy</tspan></text><text x="824.333" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="824.333" dy="0">Ejecución</tspan></text><text x="336" y="119.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Importación sin usar</tspan></text><text x="336" y="161.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Nombre no definido (función no llamada)</tspan></text><text x="336" y="203.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">f(&#x27;a&#x27;) con x: int</tspan></text><text x="336" y="245.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">x: Any y x + 1 con una cadena</tspan></text><text x="336" y="287.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">d[&#x27;k&#x27;] sobre un dict vacío</tspan></text><text x="336" y="329.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Argumento mutable por defecto</tspan></text><rect x="347.5" y="95.5" width="188.333" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="441.667" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="441.667" dy="0">detecta</tspan></text><rect x="538.833" y="95.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="633" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="633" dy="0">no lo ve</tspan></text><rect x="730.167" y="95.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="824.333" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="824.333" dy="0">no lo ve</tspan></text><rect x="347.5" y="137.5" width="188.333" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="441.667" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="441.667" dy="0">detecta</tspan></text><rect x="538.833" y="137.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="633" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="633" dy="0">no lo ve</tspan></text><rect x="730.167" y="137.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="824.333" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="824.333" dy="0">no lo ve</tspan></text><rect x="347.5" y="179.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="441.667" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="441.667" dy="0">no lo ve</tspan></text><rect x="538.833" y="179.5" width="188.333" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="633" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="633" dy="0">detecta</tspan></text><rect x="730.167" y="179.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="824.333" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="824.333" dy="0">no lo ve</tspan></text><rect x="347.5" y="221.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="441.667" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="441.667" dy="0">no lo ve</tspan></text><rect x="538.833" y="221.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="633" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="633" dy="0">no lo ve</tspan></text><rect x="730.167" y="221.5" width="188.333" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="824.333" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="824.333" dy="0">detecta</tspan></text><rect x="347.5" y="263.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="441.667" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="441.667" dy="0">no lo ve</tspan></text><rect x="538.833" y="263.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="633" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="633" dy="0">no lo ve</tspan></text><rect x="730.167" y="263.5" width="188.333" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="824.333" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="824.333" dy="0">detecta</tspan></text><rect x="347.5" y="305.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="441.667" y="329.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="441.667" dy="0">no lo ve</tspan></text><rect x="538.833" y="305.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="633" y="329.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="633" dy="0">no lo ve</tspan></text><rect x="730.167" y="305.5" width="188.333" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="824.333" y="329.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="824.333" dy="0">no lo ve</tspan></text><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">Fragmento</text><text x="346" y="372" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="346" dy="0">no lo ve</tspan></text><rect x="414.32" y="360" width="30.5" height="14" fill="#dff1ee"/><rect x="444.32" y="360" width="30.5" height="14" fill="#c0e1e0"/><rect x="474.32" y="360" width="30.5" height="14" fill="#a2d0d2"/><rect x="504.32" y="360" width="30.5" height="14" fill="#83c0c4"/><rect x="534.32" y="360" width="30.5" height="14" fill="#64b0b6"/><rect x="564.32" y="360" width="30.5" height="14" fill="#45a0a8"/><rect x="594.32" y="360" width="30.5" height="14" fill="#278f9a"/><rect x="624.32" y="360" width="30.5" height="14" fill="#087f8c"/><text x="662.32" y="372" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="662.32" dy="0">detecta</tspan></text><text x="723.1" y="372" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="723.1" dy="0">más oscuro = mayor (detección)</tspan></text><rect x="10" y="388" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="412.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ninguna herramienta cubre todo: el linter, el verificador de tipos y la ejecución detectan clases distintas de defectos. Un</tspan></text><text x="470" y="429.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">conjunto de reglas por defecto no incluye todas las reglas relevantes.</tspan></text><text x="470" y="477.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
