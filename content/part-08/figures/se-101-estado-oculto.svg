<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 279" width="930" height="279" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El estado oculto de un cuaderno</title><desc id="d">Tabla con la misma secuencia de celdas ejecutada en orden y fuera de orden: en orden las salidas son 11 y 22 y con la segunda celda ejecutada dos veces son 11, 21 y 42.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="279" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Secuencia de ejecución</tspan></text><rect x="320" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Celda 2</tspan></text><rect x="450" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Celda 3</tspan></text><rect x="560" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Lectura</tspan></text><rect x="10" y="56" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Orden 1, 2, 3 (de arriba abajo)</tspan></text><rect x="320" y="56" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">11</tspan></text><rect x="450" y="56" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">22</tspan></text><rect x="560" y="56" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">El resultado coincide con el texto del cuaderno</tspan></text><rect x="10" y="118" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="141.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Se ejecuta la celda 2 dos veces y luego la</tspan></text><text x="162" y="157.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">3</tspan></text><rect x="320" y="118" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">11 → 21</tspan></text><rect x="450" y="118" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">42</tspan></text><rect x="560" y="118" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">El mismo cuaderno produce otra salida</tspan></text><rect x="10" y="184" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="208.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">El kernel conserva variables entre celdas. Ejecutar la celda 2 dos veces cambió el valor de x y el resultado final pasó de</tspan></text><text x="465" y="225.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">22 a 42 sin que el texto del cuaderno cambiara. Un cuaderno reproducible se ejecuta completo desde un kernel nuevo.</tspan></text><text x="465" y="265.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
