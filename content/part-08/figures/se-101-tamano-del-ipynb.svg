<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 203" width="940" height="203" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué guarda un archivo .ipynb</title><desc id="d">Barras con el tamaño de un cuaderno de tres celdas: 587 bytes sin ejecutar y 1838 bytes tras ejecutarlo; la diferencia genera 61 líneas de cambio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="203" fill="#ffffff"/><text x="280" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Cuaderno sin ejecutar</tspan></text><rect x="290" y="16" width="105.66" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="403.66" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="403.66" dy="0">587 bytes</tspan></text><text x="280" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Tras ejecutar tres celdas</tspan></text><rect x="290" y="60" width="330.84" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="628.84" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="628.84" dy="0">1 838 bytes · 3,1×</tspan></text><rect x="10" y="108" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ejecutar el cuaderno añadió salidas y números de ejecución: el diff creció en 61 líneas por código idéntico. Para revisar</tspan></text><text x="470" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cambios se limpian las salidas antes de confirmar o se usan herramientas de comparación de cuadernos.</tspan></text><text x="470" y="189.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
