<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 291" width="940" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto tarda en arrancar un intérprete vacío</title><desc id="d">Barras con la mediana de siete arranques de un intérprete que no hace nada: 127 ms en Windows con arranque normal y 63 ms con las opciones -I y -S; 31 ms y 19 ms en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="291" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Windows, arranque normal</tspan></text><rect x="310" y="16" width="304.8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="622.8" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="622.8" dy="0">127 ms</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Windows, -I -S</tspan></text><rect x="310" y="60" width="151.2" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="469.2" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="469.2" dy="0">63 ms</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Linux (WSL2), arranque normal</tspan></text><rect x="310" y="104" width="74.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="392.4" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392.4" dy="0">31 ms</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Linux (WSL2), -I -S</tspan></text><rect x="310" y="148" width="45.6" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="363.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363.6" dy="0">19 ms</tspan></text><rect x="10" y="196" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada módulo que carga el arranque suma tiempo (66 líneas de importación en Windows). El mismo intérprete y la misma versión</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no tienen el mismo costo en dos sistemas; el runtime también es parte del entorno.</tspan></text><text x="470" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
