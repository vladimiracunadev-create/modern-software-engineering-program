<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué Python se ejecuta</title><desc id="d">Tabla de tres formas de listar intérpretes en la misma máquina: where encontró tres candidatos, el lanzador py listó tres versiones y uv listó cuatro; sys.executable identifica el que realmente se ejecuta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Consulta</tspan></text><rect x="320" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Resultado</tspan></text><rect x="480" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">Lectura</tspan></text><rect x="10" y="56" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">`where python`</tspan></text><rect x="320" y="56" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">3 candidatos</tspan></text><rect x="480" y="56" width="434" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Varios ejecutables cumplen el nombre; gana el primero en PATH</tspan></text><rect x="10" y="118" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">`py -0`</tspan></text><rect x="320" y="118" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">3 entradas</tspan></text><rect x="480" y="118" width="434" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="141.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">El lanzador lista versiones registradas, incluida una de 32</tspan></text><text x="697" y="157.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">bits</tspan></text><rect x="10" y="180" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">`uv python list --only-installed`</tspan></text><rect x="320" y="180" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">4 entradas</tspan></text><rect x="480" y="180" width="434" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Otra herramienta ve un conjunto distinto</tspan></text><rect x="10" y="242" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">`sys.executable`</tspan></text><rect x="320" y="242" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Uno</tspan></text><rect x="480" y="242" width="434" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">El intérprete que ejecutó el script</tspan></text><rect x="10" y="308" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">«python» no identifica un intérprete: depende de PATH, del lanzador y de la herramienta. La evidencia es `sys.executable`</tspan></text><text x="465" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">y `sys.version` dentro del propio proceso.</tspan></text><text x="465" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
