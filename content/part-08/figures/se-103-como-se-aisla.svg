<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 424" width="940" height="424" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo se aísla un entorno</title><desc id="d">Diagrama de cómo se aísla un entorno virtual: pyvenv.cfg con cinco claves lo enlaza con el intérprete base; dentro del entorno sys.prefix difiere de sys.base_prefix y sys.path tiene 7 rutas frente a 16 del intérprete global.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="424" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo se aísla un entorno</tspan></text><rect x="14" y="49" width="560" height="246" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="28" y="71" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="28" dy="0">Entorno virtual</tspan></text><rect x="34" y="85" width="520" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294" y="112.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="294" dy="0">pyvenv.cfg: cinco claves</tspan></text><text x="294" y="128.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="294" dy="0">home · include-system-site-packages · version · executable · command</tspan></text><rect x="34" y="161" width="520" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294" y="184.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="294" dy="0">sys.prefix == sys.base_prefix → False</tspan></text><text x="294" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="294" dy="0">así se detecta que se ejecuta dentro de un venv</tspan></text><rect x="34" y="227" width="520" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294" y="258.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="294" dy="0">sys.path: 7 rutas</tspan></text><rect x="700" y="85" width="226" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="813" y="110" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="813" dy="0">Intérprete base compartido</tspan></text><text x="813" y="126.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="813" dy="0">el entorno solo cambia dónde</tspan></text><text x="813" y="143.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="813" dy="0">se instala</tspan></text><rect x="700" y="227" width="226" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="813" y="250.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="813" dy="0">sys.path: 16 rutas</tspan></text><text x="813" y="266.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="813" dy="0">intérprete global</tspan></text><polyline points="554,117 700,117" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="627" y="107" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">home</tspan></text><rect x="10" y="317" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="341.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El aislamiento no es un contenedor: es una configuración de rutas. El entorno comparte el intérprete base y el sistema</tspan></text><text x="470" y="358.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">operativo; solo cambia dónde se buscan e instalan los paquetes.</tspan></text><text x="470" y="406.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
