<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Crear un entorno virtual cuesta lo que se instala</title><desc id="d">Barras horizontales en escala logarítmica con el tiempo de crear un entorno virtual: con pip tarda 11 344 ms en Windows y 6 376 ms en Linux; sin pip 180 ms en Windows y 118 en Linux; uv venv en Windows 278 ms; casi todo el costo es pip.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Crear un entorno virtual cuesta lo que se instala</tspan></text><line x1="274" y1="49" x2="274" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="239" x2="274" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">10</tspan></text><line x1="422.41" y1="49" x2="422.41" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="422.41" y1="239" x2="422.41" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="422.41" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422.41" dy="0">100</tspan></text><line x1="570.82" y1="49" x2="570.82" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="570.82" y1="239" x2="570.82" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="570.82" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="570.82" dy="0">1 000</tspan></text><line x1="719.23" y1="49" x2="719.23" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="719.23" y1="239" x2="719.23" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="719.23" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="719.23" dy="0">10 000</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="239" x2="867.64" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100 000</tspan></text><line x1="274" y1="239" x2="867.64" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Windows · venv con pip</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Windows · venv --without-pip</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Windows · uv venv</tspan></text><text x="264" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Linux · venv con pip</tspan></text><text x="264" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Linux · venv --without-pip</tspan></text><rect x="274" y="55" width="453.358" height="26" rx="3" fill="#946512"/><text x="734.358" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="734.358" dy="0">11 344</tspan></text><rect x="274" y="93" width="186.295" height="26" rx="3" fill="#946512"/><text x="467.295" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="467.295" dy="0">180</tspan></text><rect x="274" y="131" width="214.311" height="26" rx="3" fill="#946512"/><text x="495.311" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="495.311" dy="0">278</tspan></text><rect x="274" y="169" width="416.223" height="26" rx="3" fill="#946512"/><text x="697.223" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="697.223" dy="0">6 376</tspan></text><rect x="274" y="207" width="159.078" height="26" rx="3" fill="#946512"/><text x="440.078" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="440.078" dy="0">118</tspan></text><text x="570.82" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="570.82" dy="0">Tiempo de creación (ms) (escala logarítmica)</tspan></text><rect x="10" y="297" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Casi todo el costo del entorno es pip: 860 archivos frente a 7. En Linux el intérprete del entorno es un enlace simbólico;</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en Windows se copia un ejecutable lanzador.</tspan></text><text x="470" y="386.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
