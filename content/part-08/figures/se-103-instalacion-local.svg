<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Instalar sin contaminar el sistema</title><desc id="d">Tabla de una instalación local: demo_pkg no se puede importar en el intérprete global, se importa dentro del entorno con versión 1.0.0, pip list muestra dos paquetes y pip freeze de dos entornos nuevos es idéntico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Comprobación</tspan></text><rect x="340" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="417" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417" dy="0">Resultado</tspan></text><rect x="500" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">`import demo_pkg` en el intérprete global</tspan></text><rect x="340" y="56" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">Falla</tspan></text><rect x="500" y="56" width="414" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">El paquete no está instalado allí</tspan></text><rect x="10" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">`import demo_pkg` dentro del entorno</tspan></text><rect x="340" y="118" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">1.0.0</tspan></text><rect x="500" y="118" width="414" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="141.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">Instalado con `--no-index --no-deps` desde un archivo</tspan></text><text x="707" y="157.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">local</tspan></text><rect x="10" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">`pip list` dentro del entorno</tspan></text><rect x="340" y="180" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">2 paquetes</tspan></text><rect x="500" y="180" width="414" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">pip y demo-pkg; nada más</tspan></text><rect x="10" y="242" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">`pip freeze` de dos entornos nuevos</tspan></text><rect x="340" y="242" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">Idéntico</tspan></text><rect x="500" y="242" width="414" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">Misma rueda instalada produce el mismo estado</tspan></text><rect x="10" y="308" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Se instaló una rueda construida localmente, sin red. La reproducibilidad del entorno depende de poder instalar los mismos</tspan></text><text x="465" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">archivos exactos, no de la versión escrita en un archivo de requisitos.</tspan></text><text x="465" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
