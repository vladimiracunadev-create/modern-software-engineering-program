<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 356" width="940" height="356" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Instalar sin contaminar el sistema</title><desc id="d">Diagrama de la instalación local de una rueda: demo_pkg no se importa en el intérprete global; dentro del entorno se importa con versión 1.0.0 y pip list muestra dos paquetes; dos entornos nuevos con la misma rueda dan el mismo pip freeze.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="356" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Instalar sin contaminar el sistema</tspan></text><rect x="14" y="98.72" width="250" height="86.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="120.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Rueda demo_pkg 1.0.0</tspan></text><text x="139" y="137.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">instalada con --no-index</tspan></text><text x="139" y="153.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">--no-deps desde un archivo</tspan></text><text x="139" y="170.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">local</tspan></text><rect x="334" y="49" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Intérprete global: import falla</tspan></text><text x="630" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">el paquete no está instalado allí</tspan></text><polyline points="264,142 299,142 299,76 334,76" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="115" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="137.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Entorno: import → 1.0.0</tspan></text><text x="630" y="153.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">pip list: 2 paquetes, pip y demo-pkg; nada más</tspan></text><polyline points="264,142 299,142 299,142 334,142" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="181" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Dos entornos nuevos: pip freeze idéntico</tspan></text><text x="630" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">la misma rueda produce el mismo estado</tspan></text><polyline points="264,142 299,142 299,208 334,208" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="249" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="273.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Se instaló una rueda construida localmente, sin red. La reproducibilidad del entorno depende de poder instalar los mismos</tspan></text><text x="470" y="290.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">archivos exactos, no de la versión escrita en un archivo de requisitos.</tspan></text><text x="470" y="338.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
