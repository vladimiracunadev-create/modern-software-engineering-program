<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se verificó y qué no</title><desc id="d">Tabla de lo comprobado sobre contenedores de desarrollo: el cliente de Docker 29.9.2 está instalado, el motor no estaba disponible, por lo que no se ejecutó ningún contenedor, y la configuración de ejemplo declara cinco claves.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Elemento</tspan></text><rect x="260" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="342" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="342" dy="0">Estado</tspan></text><rect x="430" y="12" width="484" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Lectura</tspan></text><rect x="10" y="56" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Cliente de Docker</tspan></text><rect x="260" y="56" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">29.9.2</tspan></text><rect x="430" y="56" width="484" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Instalado y accesible desde el terminal</tspan></text><rect x="10" y="118" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Servidor (motor)</tspan></text><rect x="260" y="118" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">No disponible</tspan></text><rect x="430" y="118" width="484" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Falló la conexión con el motor: no se ejecutó ningún contenedor</tspan></text><rect x="10" y="180" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Archivo `devcontainer.json`</tspan></text><rect x="260" y="180" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">5 claves</tspan></text><rect x="430" y="180" width="484" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">name · image · features · postCreateCommand · customizations</tspan></text><rect x="10" y="242" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Imagen base</tspan></text><rect x="260" y="242" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">No descargada</tspan></text><rect x="430" y="242" width="484" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">No se hicieron peticiones a registros externos</tspan></text><rect x="10" y="308" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Esta clase se apoya en documentación y en la estructura de la configuración: no se midió el arranque de un contenedor. Es</tspan></text><text x="465" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">un límite declarado, no un resultado.</tspan></text><text x="465" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Estado del equipo de medición: cliente instalado, motor sin conexión.</tspan></text></svg>
