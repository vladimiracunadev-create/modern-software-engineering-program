<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 485" width="930" height="485" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se midió con el motor en marcha</title><desc id="d">Tabla de lo medido con Docker 29.9.2: docker info en 1327 ms, una imagen de 9383 bytes y una capa construida desde scratch en 4325 y 1221 ms, dos construcciones con identificadores distintos, creación del contenedor en 314 ms y copia del archivo en 373 ms; la ejecución de un proceso no se midió.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="485" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Elemento</tspan></text><rect x="280" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Valor medido</tspan></text><rect x="490" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">Lectura</tspan></text><rect x="10" y="56" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Cliente y motor de Docker</tspan></text><rect x="280" y="56" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">29.9.2 · linux · overlayfs</tspan></text><rect x="490" y="56" width="424" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="81.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">`docker info` respondió en 1 327 ms: el motor estaba en</tspan></text><text x="702" y="97.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">marcha</tspan></text><rect x="10" y="122" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Imagen construida desde `scratch`</tspan></text><rect x="280" y="122" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">9 383 bytes · 1 capa</tspan></text><rect x="490" y="122" width="424" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="147.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">Un solo archivo copiado; primera construcción 4 325 ms,</tspan></text><text x="702" y="163.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">segunda 1 221 ms</tspan></text><rect x="10" y="188" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Dos construcciones con `--no-cache`</tspan></text><rect x="280" y="188" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">IDs distintos</tspan></text><rect x="490" y="188" width="424" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">ddb3953a1aea frente a 244e4937f237 con el mismo contexto</tspan></text><rect x="10" y="254" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">`docker create` + `docker cp`</tspan></text><rect x="280" y="254" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">314 ms · 373 ms</tspan></text><rect x="490" y="254" width="424" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">Se creó el contenedor y se leyó el archivo sin ejecutar nada</tspan></text><rect x="10" y="320" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="353.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Ejecutar un proceso en el contenedor</tspan></text><rect x="280" y="320" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">No medido</tspan></text><rect x="490" y="320" width="424" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">No se descargó ninguna imagen base de un registro externo</tspan></text><rect x="10" y="390" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Todo se hizo sin red: la imagen parte de `scratch` y no hay proceso que ejecutar. El arranque de un contenedor con un</tspan></text><text x="465" y="431.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">sistema base real queda sin medir, y se declara como límite.</tspan></text><text x="465" y="471.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con Docker 29.9.2 sobre Windows 11 (motor Linux, 8 CPU).</tspan></text></svg>
