<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se midió con el motor en marcha</title><desc id="d">Barras horizontales con los tiempos medidos con el motor de Docker 29.9.2 en marcha: docker info 1 327 ms, primera construcción de la imagen desde scratch 4 325 ms, segunda 1 221 ms, docker create 314 ms y docker cp 373 ms; la ejecución de un proceso no se midió.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se midió con el motor en marcha</tspan></text><line x1="294" y1="49" x2="294" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="239" x2="294" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="410.34" y1="49" x2="410.34" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="410.34" y1="239" x2="410.34" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="410.34" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410.34" dy="0">1 000</tspan></text><line x1="526.68" y1="49" x2="526.68" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="526.68" y1="239" x2="526.68" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="526.68" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="526.68" dy="0">2 000</tspan></text><line x1="643.02" y1="49" x2="643.02" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="643.02" y1="239" x2="643.02" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="643.02" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="643.02" dy="0">3 000</tspan></text><line x1="759.36" y1="49" x2="759.36" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="759.36" y1="239" x2="759.36" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="759.36" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.36" dy="0">4 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="239" x2="875.7" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5 000</tspan></text><line x1="294" y1="239" x2="875.7" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">docker info</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Construcción de la imagen, 1.ª vez</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Construcción de la imagen, 2.ª vez</tspan></text><text x="284" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">docker create</tspan></text><text x="284" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">docker cp</tspan></text><rect x="294" y="55" width="154.383" height="26" rx="3" fill="#087f8c"/><text x="455.383" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="455.383" dy="0">1 327</tspan></text><rect x="294" y="93" width="503.171" height="26" rx="3" fill="#087f8c"/><text x="804.171" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="804.171" dy="0">4 325</tspan></text><rect x="294" y="131" width="142.051" height="26" rx="3" fill="#087f8c"/><text x="443.051" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="443.051" dy="0">1 221</tspan></text><rect x="294" y="169" width="36.5308" height="26" rx="3" fill="#087f8c"/><text x="337.531" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="337.531" dy="0">314</tspan></text><rect x="294" y="207" width="43.3948" height="26" rx="3" fill="#087f8c"/><text x="344.395" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="344.395" dy="0">373</tspan></text><text x="584.85" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Tiempo medido (ms)</tspan></text><rect x="10" y="297" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Todo se hizo sin red: la imagen parte de `scratch` y no hay proceso que ejecutar. El arranque de un contenedor con un</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sistema base real queda sin medir, y se declara como límite.</tspan></text><text x="470" y="386.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con Docker 29.9.2 sobre Windows 11 (motor Linux, 8 CPU).</tspan></text></svg>
