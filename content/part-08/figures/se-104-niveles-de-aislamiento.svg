<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 341" width="930" height="341" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Niveles de aislamiento</title><desc id="d">Tabla de niveles de aislamiento: un entorno virtual se crea en 180 a 278 ms y comparte el intérprete y el sistema; crear un contenedor tomó 314 ms y la máquina virtual no se midió.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="341" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Nivel</tspan></text><rect x="270" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">Costo medido</tspan></text><rect x="480" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">Qué aísla</tspan></text><rect x="10" y="56" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Entorno virtual</tspan></text><rect x="270" y="56" width="204" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">180–278 ms</tspan></text><rect x="480" y="56" width="434" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Aísla paquetes; comparte intérprete y sistema</tspan></text><rect x="10" y="118" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Contenedor (`docker create`)</tspan></text><rect x="270" y="118" width="204" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">314 ms</tspan></text><rect x="480" y="118" width="434" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Aísla también el sistema de archivos y las herramientas</tspan></text><rect x="10" y="180" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Máquina virtual</tspan></text><rect x="270" y="180" width="204" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">No medido</tspan></text><rect x="480" y="180" width="434" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Aísla el kernel; más pesada</tspan></text><rect x="10" y="246" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Más aislamiento no es mejor por defecto: cuesta tiempo y recursos. Se elige el nivel que cubre el riesgo (dependencias,</tspan></text><text x="465" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">herramientas o sistema operativo) y se declara el resto.</tspan></text><text x="465" y="327.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">El costo de la máquina virtual no se midió; 314 ms es crear, no arrancar, un contenedor.</tspan></text></svg>
