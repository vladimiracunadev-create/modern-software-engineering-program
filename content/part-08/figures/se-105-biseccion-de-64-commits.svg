<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 329" width="930" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Buscar el cambio culpable</title><desc id="d">Tabla de una bisección automática en una historia de 64 commits: el defecto se introdujo en el commit 41 y git bisect run lo encontró en 6 pasos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="329" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Elemento</tspan></text><rect x="260" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="352" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352" dy="0">Resultado</tspan></text><rect x="450" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">Lectura</tspan></text><rect x="10" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Historia</tspan></text><rect x="260" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">64 commits</tspan></text><rect x="450" y="56" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">El defecto se introduce en el commit 41</tspan></text><rect x="10" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">`git bisect run`</tspan></text><rect x="260" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">6 pasos</tspan></text><rect x="450" y="114" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">log₂ 64 = 6: cada paso descarta la mitad</tspan></text><rect x="10" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Commit señalado</tspan></text><rect x="260" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">c41</tspan></text><rect x="450" y="172" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">Coincide con el cambio introducido a propósito</tspan></text><rect x="10" y="234" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">La bisección da el primer commit en que falla la prueba, no la causa. Asume que antes funcionaba y después falla siempre;</tspan></text><text x="465" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">un defecto intermitente o dos defectos distintos la engañan.</tspan></text><text x="465" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
