<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" width="940" height="310" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Buscar el cambio culpable</title><desc id="d">Línea de tiempo de una historia de 64 commits: la prueba pasa hasta el commit 40 y falla desde el 41, donde se introdujo el defecto a propósito; git bisect run señala el commit 41 en 6 pasos porque cada paso descarta la mitad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="310" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Buscar el cambio culpable</tspan></text><line x1="224" y1="83" x2="224" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="145" x2="224" y2="150" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="396" y1="83" x2="396" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="396" y1="145" x2="396" y2="150" stroke="#5b7280" stroke-width="1.4"/><text x="396" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="396" dy="0">16</tspan></text><line x1="568" y1="83" x2="568" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="568" y1="145" x2="568" y2="150" stroke="#5b7280" stroke-width="1.4"/><text x="568" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="568" dy="0">32</tspan></text><line x1="654" y1="83" x2="654" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="654" y1="145" x2="654" y2="150" stroke="#5b7280" stroke-width="1.4"/><text x="654" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="654" dy="0">40</tspan></text><line x1="740" y1="83" x2="740" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="740" y1="145" x2="740" y2="150" stroke="#5b7280" stroke-width="1.4"/><text x="740" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="740" dy="0">48</tspan></text><line x1="912" y1="83" x2="912" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="145" x2="912" y2="150" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">64</tspan></text><line x1="224" y1="145" x2="912" y2="145" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">Historia de 64 commits</tspan></text><line x1="654" y1="75" x2="654" y2="145" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="654" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="654" dy="0">c41: primer commit que falla · 6 pasos</tspan></text><rect x="224" y="92" width="430" height="44" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="439" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="439" dy="0">la prueba pasa</tspan></text><rect x="654" y="92" width="258" height="44" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="783" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="783" dy="0">la prueba falla</tspan></text><text x="568" y="189" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="568" dy="0">Commit (1 a 64)</tspan></text><rect x="10" y="203" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="227.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La bisección da el primer commit en que falla la prueba, no la causa. Asume que antes funcionaba y después falla siempre;</tspan></text><text x="470" y="244.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un defecto intermitente o dos defectos distintos la engañan.</tspan></text><text x="470" y="292.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
