<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 247" width="940" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas pruebas necesita cada estrategia</title><desc id="d">Barras con las pruebas necesarias: 403 eliminando un carácter cada vez, 24 con ddmin y 6 para bisecar 64 commits.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="247" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Eliminar un carácter cada vez</tspan></text><rect x="300" y="16" width="806" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1114" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1114" dy="0">403 pruebas</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">ddmin (reducción por trozos)</tspan></text><rect x="300" y="60" width="48" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="356" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="356" dy="0">24 pruebas</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Bisección de 64 commits</tspan></text><rect x="300" y="104" width="12" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="320" dy="0">6 pruebas</tspan></text><rect x="10" y="152" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Elegir la estrategia cambia el costo en órdenes de magnitud. El conteo de pruebas es reproducible; el tiempo de cada prueba</tspan></text><text x="470" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">depende de lo que se ejecute.</tspan></text><text x="470" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
