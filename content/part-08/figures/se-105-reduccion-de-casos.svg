<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 329" width="930" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reducir un caso hasta lo esencial</title><desc id="d">Tabla de una reducción automática: una entrada de 403 caracteres que falla se redujo a los tres caracteres ab[ con 24 pruebas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="329" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Magnitud</tspan></text><rect x="260" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">Valor</tspan></text><rect x="490" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">Lectura</tspan></text><rect x="10" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Entrada que falla</tspan></text><rect x="260" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">403 caracteres</tspan></text><rect x="490" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">Contiene un `[` sin cerrar tras «ab»</tspan></text><rect x="10" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Caso mínimo</tspan></text><rect x="260" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">`ab[` (3 caracteres)</tspan></text><rect x="490" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">Reducción del 99,3 %</tspan></text><rect x="10" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Pruebas ejecutadas</tspan></text><rect x="260" y="172" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">24</tspan></text><rect x="490" y="172" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">Frente a 403 pruebas de un carácter cada una</tspan></text><rect x="10" y="234" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">La reducción no entiende el defecto: solo elimina trozos mientras el fallo persista. Funciona si la prueba es</tspan></text><text x="465" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">determinista; con una prueba intermitente puede quedarse con un caso que no es mínimo.</tspan></text><text x="465" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
