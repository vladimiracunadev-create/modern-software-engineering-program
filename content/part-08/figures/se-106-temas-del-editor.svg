<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Temas del editor y accesibilidad</title><desc id="d">Barras horizontales con la razón de contraste de colores de comentarios en temas del editor: 5,00 en el tema oscuro, 5,14 en el claro y 5,25 el rojo sobre negro, los tres sobre el umbral AA de 4,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Temas del editor y accesibilidad</tspan></text><line x1="294" y1="49" x2="294" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="181" x2="294" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="490.587" y1="49" x2="490.587" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="490.587" y1="181" x2="490.587" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="490.587" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.587" dy="0">2</tspan></text><line x1="687.173" y1="49" x2="687.173" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="687.173" y1="181" x2="687.173" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="687.173" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687.173" dy="0">4</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="181" x2="883.76" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">6</tspan></text><line x1="294" y1="181" x2="883.76" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Comentario #6a9955 sobre #1e1e1e</tspan></text><text x="284" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">(oscuro)</tspan></text><text x="284" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Comentario #008000 sobre blanco</tspan></text><text x="284" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">(claro)</tspan></text><text x="284" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Rojo #ff0000 sobre negro</tspan></text><rect x="294" y="55" width="491.467" height="32" rx="3" fill="#087f8c"/><text x="792.467" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="792.467" dy="0">5,00</tspan></text><rect x="294" y="99" width="505.228" height="32" rx="3" fill="#087f8c"/><text x="806.228" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="806.228" dy="0">5,14</tspan></text><rect x="294" y="143" width="516.04" height="32" rx="3" fill="#087f8c"/><text x="817.04" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="817.04" dy="0">5,25</tspan></text><line x1="736.32" y1="49" x2="736.32" y2="181" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="741.32" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="741.32" dy="0">AA: 4,5</tspan></text><text x="588.88" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="588.88" dy="0">Razón de contraste (WCAG)</tspan></text><rect x="10" y="239" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cumplir el contraste no basta: el color no debe ser el único modo de distinguir un error. El editor debe ofrecer también un</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">símbolo o un texto.</tspan></text><text x="470" y="328.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Calculado con la fórmula de luminancia relativa de WCAG 2.2.</tspan></text></svg>
