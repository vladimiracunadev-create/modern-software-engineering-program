<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 407" width="940" height="407" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cada técnica tiene su condición</title><desc id="d">Diagrama de la condición de cada técnica de diagnóstico: la reducción funciona con pruebas deterministas y falla con fallos intermitentes; la bisección funciona con un solo cambio culpable y la confunden dos defectos; el depurador muestra el estado en un instante pero perturba los tiempos hasta 9,7 veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="407" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cada técnica tiene su condición</tspan></text><rect x="14" y="51" width="170" height="72" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="99" y="90.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="99" dy="0">Reducción</tspan></text><polyline points="184,87 246,87" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="246" y="51" width="330" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="82.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="411" dy="0">Cuándo funciona</tspan></text><text x="411" y="98.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411" dy="0">funciona con pruebas deterministas</tspan></text><polyline points="576,87 626,87" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="626" y="51" width="300" height="72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="776" y="82.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="776" dy="0">Cuándo falla</tspan></text><text x="776" y="98.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="776" dy="0">falla con fallos intermitentes</tspan></text><rect x="14" y="135" width="170" height="72" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="99" y="174.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="99" dy="0">Bisección</tspan></text><polyline points="184,171 246,171" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="246" y="135" width="330" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="166.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="411" dy="0">Cuándo funciona</tspan></text><text x="411" y="182.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411" dy="0">funciona con un solo cambio culpable</tspan></text><polyline points="576,171 626,171" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="626" y="135" width="300" height="72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="776" y="158" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="776" dy="0">Cuándo falla</tspan></text><text x="776" y="174.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="776" dy="0">dos defectos o interacciones la</tspan></text><text x="776" y="191.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="776" dy="0">confunden</tspan></text><rect x="14" y="219" width="170" height="72" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="99" y="258.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="99" dy="0">Depurador</tspan></text><polyline points="184,255 246,255" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="246" y="219" width="330" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="250.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="411" dy="0">Cuándo funciona</tspan></text><text x="411" y="266.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411" dy="0">muestra el estado en un instante</tspan></text><polyline points="576,255 626,255" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="626" y="219" width="300" height="72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="776" y="250.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="776" dy="0">Cuándo falla</tspan></text><text x="776" y="266.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="776" dy="0">perturba tiempos (hasta 9,7× de costo)</tspan></text><rect x="10" y="305" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Elegir mal la técnica produce conclusiones falsas con aspecto de evidencia. Antes de aplicarla se comprueba su condición.</tspan></text><text x="470" y="389" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
