<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 445" width="930" height="445" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagnosticar un fallo desconocido: la secuencia</title><desc id="d">Tabla de cinco pasos con datos medidos: reproducir con una prueba determinista, reducir 403 caracteres a 3 en 24 pruebas, bisecar 64 commits en 6 pasos, observar el estado con pdb y verificar con una prueba nueva.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="445" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Paso</tspan></text><rect x="200" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">Dato medido</tspan></text><rect x="530" y="12" width="384" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Por qué importa</tspan></text><rect x="10" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">1. Reproducir</tspan></text><rect x="200" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">Prueba determinista que falla</tspan></text><rect x="530" y="56" width="384" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Sin ella, ninguna técnica posterior es fiable</tspan></text><rect x="10" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">2. Reducir</tspan></text><rect x="200" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">403 → 3 caracteres en 24 pruebas</tspan></text><rect x="530" y="114" width="384" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">El caso mínimo apunta al mecanismo</tspan></text><rect x="10" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">3. Localizar</tspan></text><rect x="200" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">6 pasos para 64 commits</tspan></text><rect x="530" y="172" width="384" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Encuentra el cambio, no la causa</tspan></text><rect x="10" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">4. Observar</tspan></text><rect x="200" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">pdb: b = 10 y a = 5 en la línea 3</tspan></text><rect x="530" y="230" width="384" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Confirma o refuta la hipótesis</tspan></text><rect x="10" y="288" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">5. Verificar</tspan></text><rect x="200" y="288" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">Nueva prueba, falla antes y pasa después</tspan></text><rect x="530" y="288" width="384" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Evita declarar resuelto lo que solo dejó de verse</tspan></text><rect x="10" y="350" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Cada paso reduce el espacio de búsqueda y deja un registro. El orden no es rígido, pero saltarse la reproducción deja el</tspan></text><text x="465" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">resto sin base.</tspan></text><text x="465" y="431.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
