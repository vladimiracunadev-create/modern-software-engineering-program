<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 384" width="940" height="384" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reproducir el entorno no es reproducir los bytes</title><desc id="d">Diagrama de dos construcciones de la misma rueda con el mismo código: la primera da el hash b384a5f15d7d y la segunda 762d3c781a63, distintos porque las marcas de tiempo entran en la rueda; instalar la misma rueda en dos entornos da el mismo pip freeze.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="384" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reproducir el entorno no es reproducir los bytes</tspan></text><rect x="14" y="65" width="220" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="124" y="90.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="124" dy="0">Mismo código</tspan></text><text x="124" y="106.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="124" dy="0">sin cambios</tspan></text><rect x="330" y="49" width="596" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="628" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="628" dy="0">Primera construcción: b384a5f15d7d</tspan></text><rect x="330" y="101" width="596" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="628" y="126.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="628" dy="0">Segunda construcción: 762d3c781a63</tspan></text><polyline points="234,95 282,95 282,71 330,71" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="234,95 282,95 282,123 330,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="628" y="163" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="628" dy="0">SHA-256 abreviado: distintos aunque el código no cambió</tspan></text><rect x="14" y="195" width="220" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="124" y="220.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="124" dy="0">Misma rueda</tspan></text><text x="124" y="236.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="124" dy="0">instalada en dos entornos</tspan></text><rect x="330" y="195" width="596" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="628" y="220.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="628" dy="0">pip freeze idéntico</tspan></text><text x="628" y="236.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="628" dy="0">instalar la misma rueda reproduce el estado</tspan></text><polyline points="234,225 330,225" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="277" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dos construcciones del mismo código dieron archivos distintos (las marcas de tiempo entran en la rueda). Por eso se fija el</tspan></text><text x="470" y="318.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">archivo que se instala por su hash, y no se reconstruye en cada entorno.</tspan></text><text x="470" y="366.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
