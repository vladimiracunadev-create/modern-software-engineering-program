<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 341" width="930" height="341" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reproducir el entorno no es reproducir los bytes</title><desc id="d">Tabla de dos construcciones de la misma rueda con hashes distintos, b384a5f15d7d y 762d3c781a63, aunque el código no cambió, mientras que dos entornos con la misma rueda producen el mismo pip freeze.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="341" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Comprobación</tspan></text><rect x="360" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Resultado</tspan></text><rect x="550" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="732" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="732" dy="0">Lectura</tspan></text><rect x="10" y="56" width="344" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Primera construcción de la rueda</tspan></text><rect x="360" y="56" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">b384a5f15d7d</tspan></text><rect x="550" y="56" width="364" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">SHA-256 abreviado</tspan></text><rect x="10" y="118" width="344" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Segunda construcción, mismo código</tspan></text><rect x="360" y="118" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">762d3c781a63</tspan></text><rect x="550" y="118" width="364" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Distinto aunque el código no cambió</tspan></text><rect x="10" y="180" width="344" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">`pip freeze` en dos entornos</tspan></text><rect x="360" y="180" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Idéntico</tspan></text><rect x="550" y="180" width="364" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Instalar la misma rueda reproduce el estado</tspan></text><rect x="10" y="246" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Dos construcciones del mismo código dieron archivos distintos (las marcas de tiempo entran en la rueda). Por eso se fija</tspan></text><text x="465" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">el archivo que se instala por su hash, y no se reconstruye en cada entorno.</tspan></text><text x="465" y="327.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
