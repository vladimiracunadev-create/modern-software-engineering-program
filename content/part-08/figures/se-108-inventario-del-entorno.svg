<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 273" width="940" height="273" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Inventario de un entorno autocontenido</title><desc id="d">Cadena de cuatro elementos de un entorno autocontenido: intérprete CPython 3.12.9 en Windows y 3.12.3 en Linux, entorno virtual de 7 archivos sin pip y 860 con pip, una rueda local como dependencia y pip freeze idéntico en dos entornos como verificación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="273" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Inventario de un entorno autocontenido</tspan></text><rect x="14" y="49" width="201" height="103.2" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="114.5" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="114.5" dy="0">Intérprete</tspan></text><text x="114.5" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114.5" dy="0">CPython 3.12.9 (Windows)</tspan></text><text x="114.5" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114.5" dy="0">· 3.12.3 (Linux): se</tspan></text><text x="114.5" y="120.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114.5" dy="0">fija con la versión</tspan></text><text x="114.5" y="137.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114.5" dy="0">exacta</tspan></text><polyline points="215,100.6 251,100.6" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="251" y="49" width="201" height="103.2" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="351.5" y="79.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="351.5" dy="0">Entorno virtual</tspan></text><text x="351.5" y="95.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="351.5" dy="0">7 archivos sin pip · 860</tspan></text><text x="351.5" y="112.56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="351.5" dy="0">con pip: se crea desde</tspan></text><text x="351.5" y="129.2" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="351.5" dy="0">cero con un comando</tspan></text><polyline points="452,100.6 488,100.6" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="488" y="49" width="201" height="103.2" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="588.5" y="79.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="588.5" dy="0">Dependencias</tspan></text><text x="588.5" y="95.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="588.5" dy="0">una rueda local: se</tspan></text><text x="588.5" y="112.56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="588.5" dy="0">instala con --no-index</tspan></text><text x="588.5" y="129.2" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="588.5" dy="0">--no-deps</tspan></text><polyline points="689,100.6 725,100.6" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="725" y="49" width="201" height="103.2" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="825.5" y="79.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="825.5" dy="0">Verificación</tspan></text><text x="825.5" y="95.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="825.5" dy="0">pip freeze idéntico en</tspan></text><text x="825.5" y="112.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="825.5" dy="0">dos entornos: se compara</tspan></text><text x="825.5" y="129.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="825.5" dy="0">el estado</tspan></text><rect x="10" y="166.2" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="191.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un entorno autocontenido es el que se puede reconstruir desde el repositorio y comprobar. Cada pieza debe tener su</tspan></text><text x="470" y="207.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comprobación; lo que solo se asume queda como riesgo.</tspan></text><text x="470" y="255.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
