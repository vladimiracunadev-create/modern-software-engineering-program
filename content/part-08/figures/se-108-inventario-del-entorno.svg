<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Inventario de un entorno autocontenido</title><desc id="d">Tabla del inventario de un entorno autocontenido: intérprete con versión exacta, entorno virtual de 7 archivos sin pip y 860 con pip, dependencias desde una rueda local y verificación con pip freeze idéntico en dos entornos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Elemento</tspan></text><rect x="200" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">Valor medido</tspan></text><rect x="580" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Cómo se fija</tspan></text><rect x="10" y="56" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Intérprete</tspan></text><rect x="200" y="56" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">CPython 3.12.9 (Windows) · 3.12.3 (Linux)</tspan></text><rect x="580" y="56" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Se fija con la versión exacta</tspan></text><rect x="10" y="118" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Entorno virtual</tspan></text><rect x="200" y="118" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">7 archivos sin pip · 860 con pip</tspan></text><rect x="580" y="118" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Se crea desde cero con un comando</tspan></text><rect x="10" y="180" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Dependencias</tspan></text><rect x="200" y="180" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">Una rueda local</tspan></text><rect x="580" y="180" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Se instala con `--no-index --no-deps`</tspan></text><rect x="10" y="242" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Verificación</tspan></text><rect x="200" y="242" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">`pip freeze` idéntico en dos entornos</tspan></text><rect x="580" y="242" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Se compara el estado, no se asume</tspan></text><rect x="10" y="308" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Un entorno autocontenido es el que se puede reconstruir desde el repositorio y comprobar. Cada fila debe tener su</tspan></text><text x="465" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">comprobación; lo que solo se asume queda como riesgo.</tspan></text><text x="465" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
