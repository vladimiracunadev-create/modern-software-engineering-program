<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 483" width="950" height="483" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de importar: módulos nuevos y tiempo, en un intérprete limpio</title><desc id="d">Tabla con módulos nuevos cargados y milisegundos de import en un intérprete limpio con la opción -S: json carga 24 módulos en 33,6 ms en Windows y 18,8 en Linux; asyncio carga 126 y 111 módulos en 303,3 y 92,8 ms. Un intérprete limpio parte con 25 módulos en Windows y 23 en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="483" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Import</tspan></text><rect x="160" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="282" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="282" dy="0">Windows: módulos / mejor de 3</tspan></text><rect x="410" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Linux: módulos / mejor de 3</tspan></text><rect x="660" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Qué se arrastra</tspan></text><rect x="10" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">json</tspan></text><rect x="160" y="56" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">24 / 33,6 ms</tspan></text><rect x="410" y="56" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">24 / 18,8 ms</tspan></text><rect x="660" y="56" width="274" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Casi nada que cargar</tspan></text><rect x="10" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">argparse</tspan></text><rect x="160" y="108" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">29 / 36,6 ms</tspan></text><rect x="410" y="108" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">28 / 22,6 ms</tspan></text><rect x="660" y="108" width="274" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Construye la CLI sin red ni disco</tspan></text><rect x="10" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">logging</tspan></text><rect x="160" y="160" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">42 / 53,5 ms</tspan></text><rect x="410" y="160" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">41 / 31,1 ms</tspan></text><rect x="660" y="160" width="274" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Arrastra threading, traceback, string</tspan></text><rect x="10" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">http.server</tspan></text><rect x="160" y="212" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">91 / 263,7 ms</tspan></text><rect x="410" y="212" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">90 / 68,9 ms</tspan></text><rect x="660" y="212" width="274" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Carga http, socketserver, email...</tspan></text><rect x="10" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">unittest</tspan></text><rect x="160" y="264" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">67 / 265,6 ms</tspan></text><rect x="410" y="264" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">65 / 54,4 ms</tspan></text><rect x="660" y="264" width="274" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Descubrimiento, aserciones, señales</tspan></text><rect x="10" y="316" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="342.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">asyncio</tspan></text><rect x="160" y="316" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">126 / 303,3 ms</tspan></text><rect x="410" y="316" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">111 / 92,8 ms</tspan></text><rect x="660" y="316" width="274" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="334.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Un runtime dentro de la biblioteca</tspan></text><text x="797" y="350.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">estándar</tspan></text><rect x="10" y="372" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Importar asyncio costó 9,0 veces lo de json en Windows y 4,9 en Linux. Una biblioteca que importa un runtime completo en su</tspan></text><text x="475" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">__init__ lo cobra a cada consumidor, lo use o no. Además, un módulo con open() en el momento de importar produjo un evento</tspan></text><text x="475" y="430.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">de auditoría de apertura más que uno sin efectos (3 frente a 2 en Windows, 5 frente a 4 en Linux).</tspan></text><text x="475" y="469.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
