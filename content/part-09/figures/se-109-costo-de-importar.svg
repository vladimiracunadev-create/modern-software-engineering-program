<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 607" width="940" height="607" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de importar: más módulos cargados, más milisegundos</title><desc id="d">Dispersión de seis módulos de la biblioteca estándar: en el eje horizontal los módulos nuevos que carga cada import en un intérprete limpio y en el vertical el mejor de tres tiempos en milisegundos. En Windows el tiempo sube de 33,6 ms con json y 24 módulos a 303,3 ms con asyncio y 126 módulos; en Linux sube de 18,8 a 92,8 ms. A igual número de módulos Windows tarda entre 1,8 y 3,8 veces más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="607" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo de importar: más módulos cargados, más milisegundos</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows (3.12.9)</tspan></text><rect x="184.64" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Linux (3.12.3)</tspan></text><line x1="93.7" y1="407" x2="910" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="407" x2="93.7" y2="407" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="247" x2="910" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="247" x2="93.7" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="87" x2="93.7" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="87" x2="93.7" y2="407" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="87" x2="111.7" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="407" x2="111.7" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">0</tspan></text><line x1="241.75" y1="87" x2="241.75" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="241.75" y1="407" x2="241.75" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="241.75" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="241.75" dy="0">25</tspan></text><line x1="371.8" y1="87" x2="371.8" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="371.8" y1="407" x2="371.8" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="371.8" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="371.8" dy="0">50</tspan></text><line x1="501.85" y1="87" x2="501.85" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="501.85" y1="407" x2="501.85" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="501.85" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="501.85" dy="0">75</tspan></text><line x1="631.9" y1="87" x2="631.9" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="631.9" y1="407" x2="631.9" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="631.9" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="631.9" dy="0">100</tspan></text><line x1="761.95" y1="87" x2="761.95" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="761.95" y1="407" x2="761.95" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="761.95" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="761.95" dy="0">125</tspan></text><line x1="892" y1="87" x2="892" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="407" x2="892" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">150</tspan></text><line x1="93.7" y1="407" x2="910" y2="407" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 247)">ms, mejor de 3 arranques (escala logarítmica)</text><text x="501.85" y="453" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">módulos nuevos cargados por el import (intérprete limpio con -S)</tspan></text><circle cx="236.548" cy="322.786" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="226.548" y="327.286" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="226.548" dy="0">json</tspan></text><circle cx="262.558" cy="316.843" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="262.558" y="305.843" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="262.558" dy="0">argparse</tspan></text><circle cx="330.184" cy="290.463" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="330.184" y="279.463" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="330.184" dy="0">logging</tspan></text><circle cx="460.234" cy="179.124" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="450.234" y="183.624" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.234" dy="0">unittest</tspan></text><circle cx="585.082" cy="179.622" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="595.082" y="184.122" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="595.082" dy="0">http.server</tspan></text><circle cx="767.152" cy="169.9" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="767.152" y="158.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="767.152" dy="0">asyncio</tspan></text><rect x="231.048" y="357.635" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="226.548" y="367.635" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="226.548" dy="0">json</tspan></text><rect x="251.856" y="344.843" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="257.356" y="374.343" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="257.356" dy="0">argparse</tspan></text><rect x="319.482" y="322.658" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="324.982" y="352.158" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="324.982" dy="0">logging</tspan></text><rect x="444.33" y="283.804" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="449.83" y="313.304" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="449.83" dy="0">unittest</tspan></text><rect x="574.38" y="267.385" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="589.88" y="277.385" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="589.88" dy="0">http.server</tspan></text><rect x="683.622" y="246.692" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="689.122" y="276.192" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="689.122" dy="0">asyncio</tspan></text><rect x="10" y="467" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El número de módulos es estable entre plataformas (24 frente a 24 en json, 126 frente a 111 en asyncio); el tiempo no:</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">asyncio costó 9,0 veces lo de json en Windows y 4,9 en Linux. Un import con open() en el cuerpo produjo un evento de</tspan></text><text x="470" y="525.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">auditoría de apertura más (3 frente a 2 en Windows, 5 frente a 4 en Linux). Un intérprete limpio parte con 25 módulos en</tspan></text><text x="470" y="541.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Windows y 23 en Linux.</tspan></text><text x="470" y="589.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
