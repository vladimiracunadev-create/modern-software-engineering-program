<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un SDK que oculta el timeout oculta también el peor caso</title><desc id="d">Barras horizontales con el tiempo hasta que la llamada termina contra un servidor local que tarda 2 segundos: sin timeout la llamada espera los 2,00 s completos; con timeout=0,3 lanza TimeoutError a los 0,47 s en Windows y a los 0,37 s en Linux, cerca del plazo pedido. El timeout por defecto del socket es None, sin límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un SDK que oculta el timeout oculta también el peor caso</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Linux (WSL2)</tspan></text><line x1="254" y1="77" x2="254" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="205" x2="254" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="411.44" y1="77" x2="411.44" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="411.44" y1="205" x2="411.44" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="411.44" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="411.44" dy="0">0,5</tspan></text><line x1="568.88" y1="77" x2="568.88" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="568.88" y1="205" x2="568.88" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="568.88" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="568.88" dy="0">1</tspan></text><line x1="726.32" y1="77" x2="726.32" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="726.32" y1="205" x2="726.32" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="726.32" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="726.32" dy="0">1,5</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="205" x2="883.76" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">2</tspan></text><line x1="254" y1="205" x2="883.76" y2="205" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Sin timeout (urlopen por</tspan></text><text x="244" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">defecto)</tspan></text><text x="244" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Con timeout=0,3 s</tspan></text><rect x="254" y="83" width="629.76" height="24.5" rx="3" fill="#c0432f"/><text x="890.76" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="890.76" dy="0">2,00</tspan></text><rect x="254" y="110.5" width="629.76" height="24.5" rx="3" fill="#087f8c"/><text x="890.76" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="890.76" dy="0">2,00</tspan></text><rect x="254" y="147" width="147.994" height="24.5" rx="3" fill="#c0432f"/><text x="408.994" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="408.994" dy="0">0,47</tspan></text><rect x="254" y="174.5" width="116.506" height="24.5" rx="3" fill="#087f8c"/><text x="377.506" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="377.506" dy="0">0,37</tspan></text><text x="568.88" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="568.88" dy="0">s hasta que la llamada termina</tspan></text><rect x="10" y="263" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El valor por defecto de la biblioteca estándar es «esperar sin límite» (socket.getdefaulttimeout() es None). Un SDK que</tspan></text><text x="470" y="304.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">envuelve la llamada sin exponer timeout hereda ese peor caso: con un servidor que nunca contestara, la espera no terminaría</tspan></text><text x="470" y="321.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(no se midió; se deduce del valor None). El SDK debe fijar un timeout razonable y dejar que el consumidor lo cambie.</tspan></text><text x="470" y="368.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
