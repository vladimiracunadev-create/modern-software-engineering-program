<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 357" width="970" height="357" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un SDK que oculta el timeout oculta también el peor caso</title><desc id="d">Tabla con un servidor local en el bucle de retorno que tarda 2 segundos: sin timeout la llamada espera 2,00 segundos; con timeout de 0,3 segundos lanza TimeoutError tras 0,47 segundos en Windows y 0,37 en Linux; el timeout por defecto de los sockets es None.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="357" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Llamada</tspan></text><rect x="440" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">Windows</tspan></text><rect x="700" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Linux (WSL2)</tspan></text><rect x="10" y="56" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">urlopen(url) sin timeout, servidor local que responde en 2 s</tspan></text><rect x="440" y="56" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">Espera 2,00 s y devuelve</tspan></text><rect x="700" y="56" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Espera 2,00 s y devuelve</tspan></text><rect x="10" y="118" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">urlopen(url, timeout=0.3) contra el mismo servidor</tspan></text><rect x="440" y="118" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">TimeoutError tras 0,47 s</tspan></text><rect x="700" y="118" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">TimeoutError tras 0,37 s</tspan></text><rect x="10" y="180" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">socket.getdefaulttimeout()</tspan></text><rect x="440" y="180" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">None (sin límite)</tspan></text><rect x="700" y="180" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">None (sin límite)</tspan></text><rect x="10" y="246" width="950" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">El valor por defecto de la biblioteca estándar es «esperar sin límite». Un SDK que envuelve la llamada sin exponer timeout</tspan></text><text x="485" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">hereda ese peor caso: con un servidor que nunca contestara, la espera no terminaría (no se midió; se deduce del valor None). El</tspan></text><text x="485" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">SDK debe fijar un timeout razonable y dejar que el consumidor lo cambie.</tspan></text><text x="485" y="343.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
