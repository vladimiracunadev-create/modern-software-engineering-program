<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="940" height="410" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Misma firma, otro contrato: lo que SemVer no puede ver</title><desc id="d">Dos pares de funciones con la firma idéntica según inspect.signature. get_ids v1 devuelve las claves en orden de inserción, b y a; v2 las devuelve ordenadas, a y b. parse v1 lanza ValueError con el texto empty input y v2 con el texto input is empty; un consumidor que comparaba el texto exacto deja de reconocer el error.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="410" fill="#ffffff"/><rect x="10" y="14" width="440" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="230" y="37.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="230" dy="0">Orden del resultado</tspan></text><rect x="480" y="14" width="440" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="700" y="37.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="700" dy="0">Texto del error</tspan></text><rect x="10" y="70" width="210" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="115" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="115" dy="0">v1: get_ids({&#x27;b&#x27;:1,&#x27;a&#x27;:2})</tspan></text><text x="115" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="115" dy="0">→ [&#x27;b&#x27;, &#x27;a&#x27;]</tspan></text><rect x="240" y="70" width="210" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="345" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="345" dy="0">v2: sorted(d)</tspan></text><text x="345" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="345" dy="0">→ [&#x27;a&#x27;, &#x27;b&#x27;]</tspan></text><rect x="480" y="70" width="210" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="585" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="585" dy="0">v1: ValueError</tspan></text><text x="585" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="585" dy="0">«empty input»</tspan></text><rect x="710" y="70" width="210" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="815" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">v2: ValueError</tspan></text><text x="815" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">«input is empty»</tspan></text><rect x="10" y="170" width="440" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="230" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="230" dy="0">inspect.signature(v1) == inspect.signature(v2) → True</tspan></text><rect x="480" y="170" width="440" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="195.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">El consumidor que hacía str(e) == &#x27;empty input&#x27; pasa de</tspan></text><text x="700" y="211.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">True a False</tspan></text><rect x="10" y="250" width="910" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="465" y="272" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="465" dy="0">Las dos versiones podrían publicarse como parche y ninguna herramienta que compare firmas lo notaría. La compatibilidad es</tspan></text><text x="465" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="465" dy="0">una propiedad del comportamiento que los consumidores usan, y la única forma de vigilarlo es con pruebas de contrato</tspan></text><text x="465" y="305.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="465" dy="0">escritas desde su punto de vista (ley de Hyrum).</tspan></text><text x="470" y="346" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; sin dependencia del sistema operativo.</tspan></text><text x="470" y="372" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44" font-style="italic"><tspan x="470" dy="0">Hyrum&#x27;s Law: con suficientes usuarios, cualquier comportamiento observable será usado por alguien.</tspan></text></svg>
