<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un lockfile con hashes: pip acepta el artefacto, no el nombre</title><desc id="d">Árbol de decisión de pip con la opción require-hashes: un requisito sin versión fijada con == se rechaza con salida 1; uno fijado cuyo hash no coincide se rechaza con salida 1 y muestra Expected y Got; uno fijado con el hash correcto se acepta con salida 0. Sin la opción y sin fijar, una versión nueva del índice se instala sin aviso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un lockfile con hashes: pip acepta el artefacto, no el nombre</tspan></text><rect x="10" y="65" width="200" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="90.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="110" dy="0">pip install</tspan></text><text x="110" y="106.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="110" dy="0">--require-hashes</tspan></text><rect x="280" y="65" width="190" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="375" y="90.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="375" dy="0">¿el requisito está</tspan></text><text x="375" y="106.96" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="375" dy="0">fijado con ==?</tspan></text><rect x="540" y="65" width="190" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="635" y="90.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="635" dy="0">¿el SHA-256 de la rueda</tspan></text><text x="635" y="106.96" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="635" dy="0">coincide?</tspan></text><polyline points="210,95 280,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,95 540,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="505" y="85" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505" dy="0">sí</tspan></text><rect x="780" y="65" width="150" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="855" y="82" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="855" dy="0">Salida 0: «Would</tspan></text><text x="855" y="98.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="855" dy="0">install</tspan></text><text x="855" y="115.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="855" dy="0">coreX-3.0»</tspan></text><polyline points="730,95 780,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="755" y="85" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755" dy="0">sí</tspan></text><rect x="280" y="185" width="240" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="400" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">Salida 1: «all requirements</tspan></text><text x="400" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">must have their versions</tspan></text><text x="400" y="243.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">pinned with ==»</tspan></text><polyline points="375,125 375,185" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="390" y="157" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="390" dy="0">no</tspan></text><rect x="560" y="185" width="370" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="745" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="745" dy="0">Salida 1: «THESE PACKAGES DO NOT MATCH THE</tspan></text><text x="745" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="745" dy="0">HASHES»; Expected y Got muestran dos SHA-256</tspan></text><text x="745" y="243.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="745" dy="0">distintos (un byte alterado)</tspan></text><polyline points="635,125 700,185" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="149" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="690" dy="0">no</tspan></text><rect x="10" y="185" width="230" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="125" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="125" dy="0">Sin --require-hashes y sin</tspan></text><text x="125" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="125" dy="0">fijar, con coreX 3.1 en el</tspan></text><text x="125" y="243.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="125" dy="0">índice: instala coreX 3.1</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El hash vincula la instalación a unos bytes concretos, no a un nombre y una versión. No prueba que esos bytes sean seguros:</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solo que son los mismos que alguien revisó. La reproducibilidad no está en la orden sino en el archivo de fijación.</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Resultados idénticos en Windows y Linux.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
