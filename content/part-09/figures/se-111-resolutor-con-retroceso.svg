<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 495" width="970" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Resolver dependencias es buscar, y a veces no hay solución</title><desc id="d">Tabla de cinco casos de un resolutor de juguete sobre un índice de cuatro paquetes: sin retroceso no hay solución; con retroceso se encuentra libA 1.0, libB 2.0, core 1.0 tras evaluar 15 candidatos; un índice sin combinación válida termina sin solución; graphlib ordena core, libA, libB, app y detecta el ciclo app, core, libA, app.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="495" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Estrategia o caso</tspan></text><rect x="340" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Resultado</tspan></text><rect x="610" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="82.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Elegir siempre la versión más nueva y no</tspan></text><text x="172" y="98.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">retroceder</tspan></text><rect x="340" y="56" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Sin solución</tspan></text><rect x="610" y="56" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="82.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">6 candidatos evaluados, 3 retrocesos: libA 2.0</tspan></text><text x="782" y="98.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">exige core ≥ 2 y libB exige core &lt; 2</tspan></text><rect x="10" y="124" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="150.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Elegir la más nueva y retroceder ante el</tspan></text><text x="172" y="166.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">conflicto</tspan></text><rect x="340" y="124" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="150.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">app 1.0, libA 1.0, libB 2.0, core</tspan></text><text x="472" y="166.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">1.0</tspan></text><rect x="610" y="124" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="150.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">15 candidatos evaluados, 3 retrocesos: baja libA</tspan></text><text x="782" y="166.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">hasta que core &lt; 2 sirve a ambos</tspan></text><rect x="10" y="192" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="226.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Índice sin ninguna combinación válida</tspan></text><rect x="340" y="192" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Sin solución</tspan></text><rect x="610" y="192" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="218.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">6 candidatos evaluados, 3 retrocesos: el</tspan></text><text x="782" y="234.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">resolutor termina y lo declara</tspan></text><rect x="10" y="260" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Orden de instalación del resultado (graphlib)</tspan></text><rect x="340" y="260" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">core, libA, libB, app</tspan></text><rect x="610" y="260" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Las dependencias antes que quien las usa</tspan></text><rect x="10" y="328" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="362.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Dependencia circular app → core → libA → app</tspan></text><rect x="340" y="328" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="362.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">CycleError</tspan></text><rect x="610" y="328" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="362.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Camino: app, core, libA, app</tspan></text><rect x="10" y="400" width="950" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="424.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">El conflicto es real: libA 2.0 pide core ≥ 2 y libB pide core &lt; 2. La versión más nueva de cada paquete no es una solución; la</tspan></text><text x="485" y="441.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">solución es un conjunto compatible. Los conteos son del resolutor de juguete, no de pip.</tspan></text><text x="485" y="481.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Cuentas deterministas, idénticas en Windows (3.12.9) y Linux (3.12.3).</tspan></text></svg>
