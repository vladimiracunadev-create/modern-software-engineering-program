<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 642" width="940" height="642" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Resolver dependencias es buscar, y a veces no hay solución</title><desc id="d">Diagrama del conflicto de un índice de cuatro paquetes: app depende de libA y libB; libA 2.0 exige core de versión 2 o mayor y libB exige core menor que 2, de modo que la versión más nueva de cada uno no es una solución. Con retroceso el resolutor evalúa 15 candidatos y llega a app 1.0, libA 1.0, libB 2.0 y core 1.0; un índice sin combinación válida termina sin solución y graphlib ordena core, libA, libB, app o detecta el ciclo app, core, libA, app.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="642" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Resolver dependencias es buscar, y a veces no hay solución</tspan></text><rect x="380" y="51" width="180" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="77.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">app</tspan></text><rect x="150" y="131" width="230" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="265" y="156.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="265" dy="0">libA 2.0</tspan></text><rect x="560" y="131" width="230" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="675" y="156.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="675" dy="0">libB</tspan></text><rect x="150" y="195" width="230" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="265" y="220.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="265" dy="0">pide core ≥ 2</tspan></text><rect x="560" y="195" width="230" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="675" y="220.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="675" dy="0">pide core &lt; 2</tspan></text><polyline points="440,95 265,131" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="500,95 675,131" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="265,175 265,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="675,175 675,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="265" width="280" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="286.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">core: ninguna versión cumple las</tspan></text><text x="470" y="302.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">dos a la vez</tspan></text><polyline points="265,239 390,265" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><polyline points="675,239 550,265" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="345" width="300" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="160" y="388.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">Siempre la más nueva: sin solución (6</tspan></text><text x="160" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">candidatos evaluados, 3 retrocesos)</tspan></text><rect x="320" y="345" width="300" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Con retroceso: app 1.0, libA 1.0, libB</tspan></text><text x="470" y="396.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">2.0, core 1.0 (15 candidatos, 3</tspan></text><text x="470" y="413.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">retrocesos)</tspan></text><rect x="630" y="345" width="300" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="780" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="780" dy="0">Índice sin ninguna combinación válida:</tspan></text><text x="780" y="396.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="780" dy="0">termina y lo declara (6 candidatos, 3</tspan></text><text x="780" y="413.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="780" dy="0">retrocesos)</tspan></text><rect x="10" y="457" width="450" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="235" y="482.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="235" dy="0">graphlib ordena la instalación: core, libA, libB, app</tspan></text><text x="235" y="498.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="235" dy="0">(dependencias primero)</tspan></text><rect x="480" y="457" width="450" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="490.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="705" dy="0">Dependencia circular app → core → libA → app: CycleError</tspan></text><rect x="10" y="535" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="559.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El conflicto es real: la versión más nueva de cada paquete no es una solución; la solución es un conjunto compatible, y a</tspan></text><text x="470" y="576.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">veces no existe. Los conteos son del resolutor de juguete, no de pip.</tspan></text><text x="470" y="624.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuentas deterministas, idénticas en Windows (3.12.9) y Linux (3.12.3).</tspan></text></svg>
