<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 395" width="970" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Etiquetas de compatibilidad: qué ruedas acepta cada intérprete</title><desc id="d">Tabla con las etiquetas de rueda que acepta el intérprete: 42 en Windows con la primera cp312-cp312-win_amd64, y 1067 en Linux con la primera cp312-cp312-manylinux_2_39_x86_64; en ambos la última es py30-none-any y la rueda de Python puro se llama py3-none-any.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="395" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Dato</tspan></text><rect x="340" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Windows (3.12.9)</tspan></text><rect x="640" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Linux bajo WSL2 (3.12.3)</tspan></text><rect x="10" y="56" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cantidad de etiquetas aceptadas</tspan></text><rect x="340" y="56" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">42</tspan></text><rect x="640" y="56" width="314" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">1 067</tspan></text><rect x="10" y="112" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Primera (la más específica)</tspan></text><rect x="340" y="112" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">cp312-cp312-win_amd64</tspan></text><rect x="640" y="112" width="314" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">cp312-cp312-manylinux_2_39_x86_64</tspan></text><rect x="10" y="168" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Última (la menos específica)</tspan></text><rect x="340" y="168" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">py30-none-any</tspan></text><rect x="640" y="168" width="314" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">py30-none-any</tspan></text><rect x="10" y="224" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="244.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Rueda de Python puro construida en el</tspan></text><text x="172" y="260.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">experimento</tspan></text><rect x="340" y="224" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">capkit-1.0.0-py3-none-any.whl</tspan></text><rect x="640" y="224" width="314" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">capkit-1.0.0-py3-none-any.whl</tspan></text><rect x="10" y="284" width="950" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Una rueda py3-none-any sirve en las dos plataformas; una rueda con extensión compilada necesita una etiqueta de la lista. Linux</tspan></text><text x="485" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">acepta tantas etiquetas porque cuenta cada versión de la biblioteca C compatible (manylinux_2_39 hacia abajo). Una rueda con</tspan></text><text x="485" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">etiqueta win_amd64 no se instala en Linux ni a la inversa.</tspan></text><text x="485" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
