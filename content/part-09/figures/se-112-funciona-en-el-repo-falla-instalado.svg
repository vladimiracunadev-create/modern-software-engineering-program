<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 448" width="940" height="448" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Funciona en el repositorio, falla instalado: el archivo de datos que no viajó</title><desc id="d">Diagrama de dos ruedas del mismo código: sin package-data la rueda pesa 1353 bytes en Windows y 1351 en Linux y no contiene data/rules.json, de modo que load_rules funciona desde el árbol de fuentes pero lanza FileNotFoundError una vez instalada; con package-data la rueda pesa 1536 y 1533 bytes, incluye el archivo y funciona en los dos lugares.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="448" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Funciona en el repositorio, falla instalado: el archivo de datos que no viajó</tspan></text><rect x="10" y="99" width="170" height="150" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="160" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Mismo código fuente</tspan></text><text x="95" y="177.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">y mismo</tspan></text><text x="95" y="195.84" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">load_rules()</tspan></text><text x="465" y="65" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="465" dy="0">pyproject.toml decide qué archivos empaqueta el constructor</tspan></text><rect x="250" y="91" width="220" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="360" y="126.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="360" dy="0">Sin package-data</tspan></text><rect x="250" y="181" width="220" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="360" y="207.96" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="360" dy="0">package-data =</tspan></text><text x="360" y="225.88" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="360" dy="0">data/*.json</tspan></text><polyline points="180,145 250,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="180,205 250,213" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="530" y="91" width="230" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="645" y="110" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="645" dy="0">Rueda: 1353 B (Windows) ·</tspan></text><text x="645" y="126.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="645" dy="0">1351 B (Linux). Sin</tspan></text><text x="645" y="143.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="645" dy="0">data/rules.json</tspan></text><rect x="530" y="181" width="230" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="645" y="200" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="645" dy="0">Rueda: 1536 B (Windows) ·</tspan></text><text x="645" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="645" dy="0">1533 B (Linux). Con</tspan></text><text x="645" y="233.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="645" dy="0">data/rules.json</tspan></text><polyline points="470,123 530,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,213 530,213" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="800" y="91" width="130" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="865" y="118.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="865" dy="0">Instalada:</tspan></text><text x="865" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="865" dy="0">FileNotFoundError</tspan></text><rect x="800" y="181" width="130" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="865" y="208.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="865" dy="0">Instalada:</tspan></text><text x="865" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="865" dy="0">{&#x27;v&#x27;: 1}</tspan></text><polyline points="760,123 800,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="760,213 800,213" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="267" width="920" height="40" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="282.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Desde el árbol de fuentes, las dos ruedas devuelven {&#x27;v&#x27;: 1}: el repositorio tiene el archivo, así que ninguna prueba que</tspan></text><text x="470" y="298.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">corra ahí puede ver la diferencia.</tspan></text><rect x="10" y="325" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="349.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El código no cambió entre las dos ramas: cambió qué archivos empaquetó el constructor. Solo una instalación limpia lo</tspan></text><text x="470" y="366.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">muestra. El paquete sub/ no tiene __init__.py y aun así se empaquetó, porque la configuración de pyproject.toml permite</tspan></text><text x="470" y="383.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">paquetes de espacio de nombres por defecto.</tspan></text><text x="470" y="430.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
