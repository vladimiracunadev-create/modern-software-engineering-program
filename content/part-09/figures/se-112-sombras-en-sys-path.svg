<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 535" width="970" height="535" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién gana en sys.path: sombras y paquetes de espacio de nombres</title><desc id="d">Tabla de cinco comprobaciones: un json.py local tapa a la biblioteca estándar y json.dumps devuelve FAKE; con la opción -I se importa la estándar; random.py local se ejecuta con python -c; python -m json.tool falla; un directorio sin __init__.py se importa como paquete de espacio de nombres con __file__ None.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="535" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Comprobación</tspan></text><rect x="320" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Resultado</tspan></text><rect x="660" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Causa</tspan></text><rect x="10" y="56" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="86.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">python main.py con un json.py local junto</tspan></text><text x="162" y="102.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">a main.py</tspan></text><rect x="320" y="56" width="334" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="94.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">json.py local; json.dumps({}) devuelve «FAKE»</tspan></text><rect x="660" y="56" width="294" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="86.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Un archivo propio tapa a la biblioteca</tspan></text><text x="807" y="102.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">estándar</tspan></text><rect x="10" y="132" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="170.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">El mismo programa con python -I</tspan></text><rect x="320" y="132" width="334" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="162.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">__init__.py de la biblioteca estándar;</tspan></text><text x="487" y="178.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">json.dumps({}) devuelve «{}»</tspan></text><rect x="660" y="132" width="294" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="162.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">El modo aislado quita el directorio del</tspan></text><text x="807" y="178.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">script y del usuario de sys.path</tspan></text><rect x="10" y="208" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="238.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">python -c «import random» en un directorio</tspan></text><text x="162" y="254.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">con random.py</tspan></text><rect x="320" y="208" width="334" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="246.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Ejecuta el random.py local</tspan></text><rect x="660" y="208" width="294" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="238.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Con -c, el directorio actual va primero</tspan></text><text x="807" y="254.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">en sys.path</tspan></text><rect x="10" y="284" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="322.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">python -m json.tool con un json.py local</tspan></text><rect x="320" y="284" width="334" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="322.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Error: no se puede encontrar json.tool</tspan></text><rect x="660" y="284" width="294" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="314.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">El json.py local se encontró antes y no</tspan></text><text x="807" y="330.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">es un paquete</tspan></text><rect x="10" y="360" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="398.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">import capkit.sub.mod sin sub/__init__.py</tspan></text><rect x="320" y="360" width="334" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="390.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Funciona; sub.__file__ es None y __path__ es</tspan></text><text x="487" y="406.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">un _NamespacePath</tspan></text><rect x="660" y="360" width="294" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="390.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Paquete de espacio de nombres: sin</tspan></text><text x="807" y="406.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">__init__.py</tspan></text><rect x="10" y="440" width="950" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="464.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Mismo resultado en Windows y Linux. Nombrar un módulo como uno de la biblioteca estándar (json, random, email, test) rompe</tspan></text><text x="485" y="481.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">programas ajenos al proyecto sin dar un error de nombre; el fallo aparece lejos del archivo mal nombrado.</tspan></text><text x="485" y="521.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
