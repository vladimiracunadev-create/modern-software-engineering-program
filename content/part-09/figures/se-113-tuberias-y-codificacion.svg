<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 502" width="940" height="502" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tuberías y codificación: la misma CLI, dos comportamientos</title><desc id="d">Diagrama de tres etapas de una CLI con la salida redirigida, en Windows y en Linux. Codificación: Windows falla con UnicodeEncodeError (códec charmap) al imprimir un carácter fuera de la página de códigos y Linux escribe UTF-8; con PYTHONUTF8=1 ambos funcionan. Saltos de línea: CRLF en Windows y LF en Linux. Cierre de la tubería: salida 120 con OSError en Windows y salida 1 con BrokenPipeError en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="502" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tuberías y codificación: la misma CLI, dos comportamientos</tspan></text><rect x="10" y="53" width="277.333" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="148.667" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="148.667" dy="0">1. Codificar print(&#x27;señal ✓&#x27;)</tspan></text><rect x="331.333" y="53" width="277.333" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">2. Escribir los saltos de línea</tspan></text><rect x="652.667" y="53" width="277.333" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="791.333" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="791.333" dy="0">3. El lector cierra la tubería</tspan></text><rect x="10" y="105" width="277.333" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="148.667" y="134" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="148.667" dy="0">Windows: Salida 1:</tspan></text><text x="148.667" y="150.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="148.667" dy="0">UnicodeEncodeError, el códec</tspan></text><text x="148.667" y="167.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="148.667" dy="0">«charmap» no codifica ✓</tspan></text><rect x="331.333" y="105" width="277.333" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="150.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Windows: 61 0D 0A 62 0D 0A (CRLF)</tspan></text><polyline points="287.333,147 331.333,147" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="652.667" y="105" width="277.333" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="791.333" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="791.333" dy="0">Windows: Salida 120: OSError,</tspan></text><text x="791.333" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="791.333" dy="0">Invalid argument</tspan></text><polyline points="608.667,147 652.667,147" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="217" width="277.333" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="148.667" y="262.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="148.667" dy="0">Linux (WSL2): Salida 0: bytes UTF-8</tspan></text><rect x="331.333" y="217" width="277.333" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="262.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Linux (WSL2): 61 0A 62 0A (LF)</tspan></text><polyline points="287.333,259 331.333,259" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="652.667" y="217" width="277.333" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="791.333" y="254.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="791.333" dy="0">Linux (WSL2): Salida 1:</tspan></text><text x="791.333" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="791.333" dy="0">BrokenPipeError</tspan></text><polyline points="608.667,259 652.667,259" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="333" width="920" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con PYTHONUTF8=1 la primera etapa da salida 0 y «señal ✓» en ambos sistemas. stdout (datos) y stderr (diagnóstico) quedaron</tspan></text><text x="470" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">separados en ambos.</tspan></text><rect x="10" y="395" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="419.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una CLI que escribe a una tubería debe fijar la codificación (reconfigure(encoding=&#x27;utf-8&#x27;)), los saltos de línea si</tspan></text><text x="470" y="436.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">compara archivos, y tratar el cierre de la tubería como terminación normal.</tspan></text><text x="470" y="484.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
