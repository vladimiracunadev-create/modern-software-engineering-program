<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 511" width="970" height="511" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tuberías y codificación: la misma CLI, dos comportamientos</title><desc id="d">Tabla de cinco comprobaciones con la salida redirigida: imprimir un carácter fuera de la página de códigos falla en Windows con UnicodeEncodeError y funciona en Linux; con PYTHONUTF8 funciona en ambos; los saltos de línea son CRLF en Windows y LF en Linux; cerrar la tubería da la salida 120 y OSError en Windows y la salida 1 con BrokenPipeError en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="511" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Comprobación</tspan></text><rect x="340" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">Windows</tspan></text><rect x="680" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Linux (WSL2)</tspan></text><rect x="10" y="56" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="90.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">print(&#x27;señal ✓&#x27;) con la salida redirigida</tspan></text><rect x="340" y="56" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="82.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">Salida 1: UnicodeEncodeError, el códec</tspan></text><text x="507" y="98.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">«charmap» no codifica ✓</tspan></text><rect x="680" y="56" width="274" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Salida 0: bytes UTF-8</tspan></text><rect x="10" y="124" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Lo mismo con PYTHONUTF8=1</tspan></text><rect x="340" y="124" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">Salida 0: «señal ✓»</tspan></text><rect x="680" y="124" width="274" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Salida 0: «señal ✓»</tspan></text><rect x="10" y="192" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="226.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Bytes de print(&#x27;a&#x27;); print(&#x27;b&#x27;) redirigido</tspan></text><rect x="340" y="192" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">61 0D 0A 62 0D 0A (CRLF)</tspan></text><rect x="680" y="192" width="274" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">61 0A 62 0A (LF)</tspan></text><rect x="10" y="260" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="286.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cerrar la tubería con el productor aún</tspan></text><text x="172" y="302.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">escribiendo</tspan></text><rect x="340" y="260" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">Salida 120: OSError, Invalid argument</tspan></text><rect x="680" y="260" width="274" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Salida 1: BrokenPipeError</tspan></text><rect x="10" y="328" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="362.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">print en stdout y aviso en stderr</tspan></text><rect x="340" y="328" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="362.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">Separados: datos y aviso</tspan></text><rect x="680" y="328" width="274" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="362.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Separados: datos y aviso</tspan></text><rect x="10" y="400" width="950" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="424.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Una CLI que escribe a una tubería debe fijar la codificación (reconfigure(encoding=&#x27;utf-8&#x27;)), los saltos de línea si compara</tspan></text><text x="485" y="441.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">archivos, y tratar el cierre de la tubería como terminación normal. Separar stdout (datos) de stderr (diagnóstico) funcionó</tspan></text><text x="485" y="458.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">igual en ambos.</tspan></text><text x="485" y="497.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
