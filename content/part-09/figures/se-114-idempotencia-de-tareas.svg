<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 467" width="970" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres ejecuciones seguidas de seis tareas</title><desc id="d">Tabla de seis tareas ejecutadas tres veces: añadir una línea deja el archivo en 9, 18 y 27 bytes; asegurar la línea lo deja en 9 bytes cada vez; mkdir sin exist_ok falla con FileExistsError desde la segunda vez; fijar un valor es idempotente y incrementar un contador no lo es.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="467" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Tarea</tspan></text><rect x="260" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="317" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="317" dy="0">1.ª</tspan></text><rect x="380" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">2.ª</tspan></text><rect x="550" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">3.ª</tspan></text><rect x="720" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Veredicto</tspan></text><rect x="10" y="56" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Añadir una línea al archivo</tspan></text><rect x="260" y="56" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">9 B</tspan></text><rect x="380" y="56" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">18 B</tspan></text><rect x="550" y="56" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">27 B</tspan></text><rect x="720" y="56" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Crece en cada ejecución</tspan></text><rect x="10" y="108" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Asegurar que la línea exista</tspan></text><rect x="260" y="108" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">9 B</tspan></text><rect x="380" y="108" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">9 B</tspan></text><rect x="550" y="108" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">9 B</tspan></text><rect x="720" y="108" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Idempotente</tspan></text><rect x="10" y="160" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">mkdir sin exist_ok</tspan></text><rect x="260" y="160" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">crea</tspan></text><rect x="380" y="160" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">FileExistsError</tspan></text><rect x="550" y="160" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">FileExistsError</tspan></text><rect x="720" y="160" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Falla al repetir</tspan></text><rect x="10" y="212" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">mkdir con exist_ok=True</tspan></text><rect x="260" y="212" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">crea</tspan></text><rect x="380" y="212" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">sin cambios</tspan></text><rect x="550" y="212" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">sin cambios</tspan></text><rect x="720" y="212" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Idempotente</tspan></text><rect x="10" y="264" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Incrementar un contador</tspan></text><rect x="260" y="264" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">1</tspan></text><rect x="380" y="264" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">2</tspan></text><rect x="550" y="264" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">3</tspan></text><rect x="720" y="264" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="282.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Cambia el estado en cada</tspan></text><text x="837" y="298.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">ejecución</tspan></text><rect x="10" y="316" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="342.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Fijar un valor (= 1)</tspan></text><rect x="260" y="316" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">1</tspan></text><rect x="380" y="316" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">1</tspan></text><rect x="550" y="316" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">1</tspan></text><rect x="720" y="316" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Idempotente</tspan></text><rect x="10" y="372" width="950" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Idempotente no significa «no hace nada la segunda vez» sino «el estado final es el mismo». Una tarea que declara el estado</tspan></text><text x="485" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">deseado (asegurar, fijar) se puede repetir tras un fallo; una que describe un cambio (añadir, incrementar) no.</tspan></text><text x="485" y="453.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Cuentas deterministas, idénticas en Windows (3.12.9) y Linux (3.12.3).</tspan></text></svg>
