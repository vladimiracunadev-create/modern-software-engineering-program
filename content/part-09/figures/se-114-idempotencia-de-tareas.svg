<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 635" width="940" height="635" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Repetir una tarea tres veces: el estado crece o se queda quieto</title><desc id="d">Barras agrupadas con el estado tras cada una de tres ejecuciones, dividido por el estado de la primera: añadir una línea al archivo (9, 18 y 27 bytes) e incrementar un contador (1, 2 y 3) crecen 1, 2 y 3 veces; asegurar la línea (9 bytes) y fijar un valor (1) se quedan en 1 en las tres. Son las tareas idempotentes frente a las que cambian el estado en cada ejecución.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="635" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Repetir una tarea tres veces: el estado crece o se queda quieto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">1.ª ejecución</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">2.ª ejecución</tspan></text><rect x="308.04" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="328.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.04" dy="0">3.ª ejecución</tspan></text><line x1="284" y1="77" x2="284" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="437" x2="284" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="491.98" y1="77" x2="491.98" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="491.98" y1="437" x2="491.98" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="491.98" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491.98" dy="0">1</tspan></text><line x1="699.96" y1="77" x2="699.96" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="699.96" y1="437" x2="699.96" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="699.96" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="699.96" dy="0">2</tspan></text><line x1="907.94" y1="77" x2="907.94" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="437" x2="907.94" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">3</tspan></text><line x1="284" y1="437" x2="907.94" y2="437" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Añadir una línea (9, 18, 27 B)</tspan></text><text x="274" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Asegurar la línea (9, 9, 9 B)</tspan></text><text x="274" y="306.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Incrementar un contador (1, 2, 3)</tspan></text><text x="274" y="396.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Fijar un valor = 1 (1, 1, 1)</tspan></text><rect x="284" y="83" width="207.98" height="24" rx="3" fill="#6b7c86"/><text x="498.98" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498.98" dy="0">1</tspan></text><rect x="284" y="110" width="415.96" height="24" rx="3" fill="#946512"/><text x="706.96" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="706.96" dy="0">2</tspan></text><rect x="284" y="137" width="623.94" height="24" rx="3" fill="#c0432f"/><text x="914.94" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="284" y="173" width="207.98" height="24" rx="3" fill="#6b7c86"/><text x="498.98" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498.98" dy="0">1</tspan></text><rect x="284" y="200" width="207.98" height="24" rx="3" fill="#946512"/><text x="498.98" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498.98" dy="0">1</tspan></text><rect x="284" y="227" width="207.98" height="24" rx="3" fill="#c0432f"/><text x="498.98" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498.98" dy="0">1</tspan></text><rect x="284" y="263" width="207.98" height="24" rx="3" fill="#6b7c86"/><text x="498.98" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498.98" dy="0">1</tspan></text><rect x="284" y="290" width="415.96" height="24" rx="3" fill="#946512"/><text x="706.96" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="706.96" dy="0">2</tspan></text><rect x="284" y="317" width="623.94" height="24" rx="3" fill="#c0432f"/><text x="914.94" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="284" y="353" width="207.98" height="24" rx="3" fill="#6b7c86"/><text x="498.98" y="369.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498.98" dy="0">1</tspan></text><rect x="284" y="380" width="207.98" height="24" rx="3" fill="#946512"/><text x="498.98" y="396.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498.98" dy="0">1</tspan></text><rect x="284" y="407" width="207.98" height="24" rx="3" fill="#c0432f"/><text x="498.98" y="423.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498.98" dy="0">1</tspan></text><text x="595.97" y="481" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="595.97" dy="0">estado ÷ estado de la 1.ª ejecución</tspan></text><rect x="10" y="495" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="519.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Idempotente no significa «no hace nada la segunda vez» sino «el estado final es el mismo». mkdir sin exist_ok crea la</tspan></text><text x="470" y="536.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">primera vez y falla con FileExistsError en la segunda y la tercera; con exist_ok=True crea y luego no cambia nada. Una</tspan></text><text x="470" y="553.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">tarea que declara el estado deseado (asegurar, fijar) se puede repetir tras un fallo; una que describe un cambio (añadir,</tspan></text><text x="470" y="569.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">incrementar) no.</tspan></text><text x="470" y="617.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuentas deterministas, idénticas en Windows (3.12.9) y Linux (3.12.3).</tspan></text></svg>
