<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 411" width="970" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Orden de carga y versión de la API del anfitrión</title><desc id="d">Tabla de cuatro comprobaciones: el mismo código y los mismos plugins devuelven el orden alfabético en Windows y plug5, plug3, plug4, plug0, plug1, plug2 en Linux; componer dos transformaciones en orden distinto da 13 o 16; con la API del anfitrión en la versión 2, un plugin que declara 1 o 3 se rechaza y uno que declara 2 o 2.5 se acepta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="411" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Comprobación</tspan></text><rect x="360" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">Windows</tspan></text><rect x="660" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Linux (WSL2)</tspan></text><rect x="10" y="56" width="344" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="80.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Orden devuelto por entry_points para plug0 …</tspan></text><text x="182" y="96.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">plug5</tspan></text><rect x="360" y="56" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">plug0, plug1, plug2, plug3, plug4, plug5</tspan></text><rect x="660" y="56" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">plug5, plug3, plug4, plug0, plug1, plug2</tspan></text><rect x="10" y="120" width="344" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Componer por 2 y luego sumar 3, con x = 5</tspan></text><rect x="360" y="120" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">13</tspan></text><rect x="660" y="120" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">13</tspan></text><rect x="10" y="184" width="344" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Componer sumar 3 y luego por 2, con x = 5</tspan></text><rect x="360" y="184" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">16</tspan></text><rect x="660" y="184" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">16</tspan></text><rect x="10" y="248" width="344" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="272.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">API del anfitrión = 2; el plugin declara 1, 2,</tspan></text><text x="182" y="288.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">2.5 o 3</tspan></text><rect x="360" y="248" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">Acepta 2 y 2.5; rechaza 1 y 3</tspan></text><rect x="660" y="248" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Acepta 2 y 2.5; rechaza 1 y 3</tspan></text><rect x="10" y="316" width="950" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Nada en el contrato de entry_points garantiza un orden. Si el resultado depende del orden, el anfitrión debe ordenar</tspan></text><text x="485" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">explícitamente (por prioridad y nombre) y rechazar plugins cuyo versión mayor de API no conozca.</tspan></text><text x="485" y="397.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 y 3.12.3; plugins creados como distribuciones sintéticas en un directorio temporal.</tspan></text></svg>
