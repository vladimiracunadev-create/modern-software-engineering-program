<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Leer un atributo: simple, __slots__, property y __getattr__ dinámico</title><desc id="d">Barras con el tiempo por lectura incluida la llamada de una función: en Windows 64, 90, 112 y 202 nanosegundos para atributo simple, slots, property y getattr; en Linux 47, 66, 99 y 186. Crear 500 clases tarda 3,3 ms con type, 29,4 con namedtuple y 230,7 con make_dataclass en Windows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="500" fill="#ffffff"/><text x="270" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Windows: atributo simple</tspan></text><rect x="280" y="16" width="154.32" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442.32" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442.32" dy="0">64 ns</tspan></text><text x="270" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Windows: __slots__</tspan></text><rect x="280" y="60" width="215.52" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="503.52" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="503.52" dy="0">90 ns</tspan></text><text x="270" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Windows: property</tspan></text><rect x="280" y="104" width="269.52" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="557.52" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="557.52" dy="0">112 ns</tspan></text><text x="270" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Windows: __getattr__</tspan></text><rect x="280" y="148" width="483.84" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="771.84" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="771.84" dy="0">202 ns</tspan></text><text x="270" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Linux: atributo simple</tspan></text><rect x="280" y="192" width="112.08" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="400.08" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="400.08" dy="0">47 ns</tspan></text><text x="270" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Linux: __slots__</tspan></text><rect x="280" y="236" width="158.16" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446.16" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="446.16" dy="0">66 ns</tspan></text><text x="270" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Linux: property</tspan></text><rect x="280" y="280" width="236.64" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="524.64" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="524.64" dy="0">99 ns</tspan></text><text x="270" y="343.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Linux: __getattr__</tspan></text><rect x="280" y="324" width="445.68" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="733.68" y="343.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="733.68" dy="0">186 ns</tspan></text><rect x="10" y="372" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada medida incluye el costo de llamar a la función que lee el atributo (~50 ns), así que solo importan las diferencias:</tspan></text><text x="470" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">__getattr__ triplicó o cuadruplicó la lectura. La diferencia entre simple y __slots__ está dentro del ruido. Crear 500</tspan></text><text x="470" y="430.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">clases: type() 3,3 ms, namedtuple 29,4 ms y make_dataclass 230,7 ms en Windows (3,0, 27,9 y 207,8 en Linux): generar clases</tspan></text><text x="470" y="446.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en tiempo de importación se paga en cada arranque.</tspan></text><text x="470" y="486.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
