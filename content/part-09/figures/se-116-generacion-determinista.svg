<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 491" width="970" height="491" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Generación determinista y detección de deriva</title><desc id="d">Tabla de cinco comprobaciones sobre un generador de clases: dos generaciones con el mismo esquema dan el mismo SHA-256 en Windows y Linux; cambiar el orden de las claves no cambia el resultado; una marca de tiempo lo vuelve distinto en cada ejecución; una edición manual se detecta regenerando y comparando; ast.parse valida la sintaxis con 43 nodos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="491" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Comprobación</tspan></text><rect x="340" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Resultado</tspan></text><rect x="640" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Generar dos veces con el mismo esquema</tspan></text><rect x="340" y="56" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Mismo SHA-256 (729294cd8c…)</tspan></text><rect x="640" y="56" width="314" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Idéntico en Windows y Linux</tspan></text><rect x="10" y="120" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cambiar el orden de las claves del esquema</tspan></text><rect x="340" y="120" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Mismo SHA-256</tspan></text><rect x="640" y="120" width="314" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">El generador ordena antes de escribir</tspan></text><rect x="10" y="184" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Añadir una marca de tiempo al encabezado</tspan></text><rect x="340" y="184" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">SHA-256 distinto cada vez</tspan></text><rect x="640" y="184" width="314" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Un generador con reloj no es reproducible</tspan></text><rect x="10" y="248" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="280.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Editar a mano la clase generada</tspan></text><rect x="340" y="248" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">El SHA-256 difiere de lo regenerado</tspan></text><rect x="640" y="248" width="314" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Regenerar y comparar detecta la deriva</tspan></text><rect x="10" y="312" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="344.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">ast.parse sobre la salida</tspan></text><rect x="340" y="312" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Válido: 43 nodos</tspan></text><rect x="640" y="312" width="314" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Se valida sintaxis sin ejecutar</tspan></text><rect x="10" y="380" width="950" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">La verificación en CI es regenerar y comparar con git diff: si difiere, alguien editó lo generado o cambió el esquema sin</tspan></text><text x="485" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">regenerar. Un generador que depende del reloj, del orden de un diccionario sin ordenar o de la ruta absoluta rompe esa</tspan></text><text x="485" y="438.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">verificación.</tspan></text><text x="485" y="477.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
