="1.6"/><text x="197" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">HTML (.html)</tspan></text><rect x="390" y="194" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">522</tspan></text><rect x="670" y="194" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0</tspan></text><rect x="10" y="240" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">YAML (.yaml y .yml)</tspan></text><rect x="390" y="240" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">365</tspan></text><rect x="670" y="240" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0</tspan></text><rect x="10" y="286" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Python (.py)</tspan></text><rect x="390" y="286" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">62</tspan></text><rect x="670" y="286" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0</tspan></text><rect x="10" y="336" width="950" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">La licencia está declarada por la raíz (LICENSE, LICENSE-CONTENT.md, NOTICE, THIRD_PARTY_NOTICES.md, ASSET_LICENSES.md,</tspan></text><text x="485" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">DATA_LICENSES.md), no archivo por archivo. REUSE pide una declaración inequívoca por archivo, por cabecera o por archivo de</tspan></text><text x="485" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">mapeo; esa propiedad no se cumple hoy y no se ejecutó la herramienta reuse, solo se buscó la cadena y los directorios. Conteo</tspan></text><text x="485" y="410.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">del árbol de trabajo al medir (3 194 archivos versionados).</tspan></text><text x="485" y="450.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con git ls-files en Windows; los conteos crecen con cada commit.</tspan></text></svg>
