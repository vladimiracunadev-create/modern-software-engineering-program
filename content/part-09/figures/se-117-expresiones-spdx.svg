pan x="485" dy="0">una expresión sea válida no dice si las licencias son compatibles entre sí ni si se puede redistribuir: eso es una decisión</tspan></text><text x="485" y="598.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">legal que esta clase no resuelve.</tspan></text><text x="485" y="637.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Validador escrito para la clase (24 identificadores); resultados deterministas, idénticos en Windows y Linux. No es asesoría legal.</tspan></text></svg>
