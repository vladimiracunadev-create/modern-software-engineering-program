<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 351" width="940" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo declaran su licencia 355 distribuciones instaladas</title><desc id="d">Barras con 355 distribuciones instaladas en un entorno Python 3.12.9 de Windows: 111 declaran License-Expression con identificador SPDX, 175 usan un texto corto en License, 34 solo un clasificador, 33 pegan un texto largo y 2 no declaran licencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="351" fill="#ffffff"/><text x="250" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">License-Expression (SPDX)</tspan></text><rect x="260" y="16" width="266.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="534.4" dy="0">111 (31,3 %)</tspan></text><text x="250" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">License: texto corto</tspan></text><rect x="260" y="60" width="420" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="688" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="688" dy="0">175 (49,3 %)</tspan></text><text x="250" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Solo clasificador</tspan></text><rect x="260" y="104" width="81.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="349.6" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="349.6" dy="0">34 (9,6 %)</tspan></text><text x="250" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">License: texto largo</tspan></text><rect x="260" y="148" width="79.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="347.2" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="347.2" dy="0">33 (9,3 %)</tspan></text><text x="250" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Sin dato de licencia</tspan></text><rect x="260" y="192" width="4.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="272.8" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="272.8" dy="0">2 (0,6 %)</tspan></text><rect x="10" y="240" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">De los 175 textos cortos, 110 (63 %) coincidían con un identificador de una lista reducida de 24 IDs SPDX; ejemplos que no</tspan></text><text x="470" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">coincidían: «Apache 2.0», «3-Clause BSD License», «Apache Software License». Solo el campo License-Expression (PEP 639) es</tspan></text><text x="470" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una expresión formal que una máquina puede validar sin adivinar.</tspan></text><text x="470" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en un solo entorno de Windows (355 distribuciones); no se midió Linux. La lista de identificadores es mínima: un validador real usa la lista completa de SPDX.</tspan></text></svg>
