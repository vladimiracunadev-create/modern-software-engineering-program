<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 459" width="980" height="459" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién ve el aviso de obsolescencia</title><desc id="d">Tabla de cuatro ejecuciones de una función obsoleta: llamada desde el script principal muestra el aviso; desde un módulo de la aplicación no muestra nada con la configuración por defecto; con -W default el aviso aparece; con -W error la salida es 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="459" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Ejecución</tspan></text><rect x="320" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">Salida</tspan></text><rect x="410" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Resultado</tspan></text><rect x="630" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Lectura</tspan></text><rect x="10" y="56" width="304" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="84.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Llamada a una función obsoleta desde el</tspan></text><text x="162" y="100.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">script principal</tspan></text><rect x="320" y="56" width="84" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">0</tspan></text><rect x="410" y="56" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">Aviso visible</tspan></text><rect x="630" y="56" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Se ve sin configurar nada</tspan></text><rect x="10" y="128" width="304" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="156.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">La misma llamada desde un módulo de la</tspan></text><text x="162" y="172.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">aplicación</tspan></text><rect x="320" y="128" width="84" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">0</tspan></text><rect x="410" y="128" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">Silencio</tspan></text><rect x="630" y="128" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="156.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Filtro por defecto: DeprecationWarning solo se</tspan></text><text x="797" y="172.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">muestra en __main__</tspan></text><rect x="10" y="200" width="304" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Con -W default</tspan></text><rect x="320" y="200" width="84" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">0</tspan></text><rect x="410" y="200" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">Aviso visible</tspan></text><rect x="630" y="200" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">El consumidor lo activa</tspan></text><rect x="10" y="272" width="304" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Con -W error::DeprecationWarning</tspan></text><rect x="320" y="272" width="84" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">1</tspan></text><rect x="410" y="272" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="300.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">DeprecationWarning como</tspan></text><text x="517" y="316.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">error</tspan></text><rect x="630" y="272" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="300.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">La integración continua puede exigir cero</tspan></text><text x="797" y="316.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">avisos</tspan></text><rect x="10" y="348" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Con stacklevel=2 el aviso apunta al código del consumidor, no al interior del SDK. Un aviso que nadie ve no cumple la función de</tspan></text><text x="490" y="389.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">avisar: el SDK debe documentar el plazo y la alternativa y verificar con -W error en su propia integración continua. Idéntico en</tspan></text><text x="490" y="406.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Windows y Linux.</tspan></text><text x="490" y="445.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
