<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 307" width="1020" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántos de los siete defectos detecta cada capa</title><desc id="d">Barras con los defectos detectados de siete: las pruebas unitarias detectan 0 en Windows y 1 en Linux; la inspección de la rueda 5 en Windows y 6 en Linux; el humo en entorno limpio 5 en ambos; la combinación de inspección y humo 6 en Windows y 7 en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="307" fill="#ffffff"/><text x="280" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Pruebas unitarias en el árbol</tspan></text><rect x="290" y="16" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="302" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="302" dy="0">0 de 7 (Windows) · 1 de 7 (Linux)</tspan></text><text x="280" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Inspección de la rueda</tspan></text><rect x="290" y="60" width="275" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="573" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="573" dy="0">5 de 7 (Windows) · 6 de 7 (Linux)</tspan></text><text x="280" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Humo en entorno limpio</tspan></text><rect x="290" y="104" width="275" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="573" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="573" dy="0">5 de 7 (ambos)</tspan></text><text x="280" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Inspección + humo</tspan></text><rect x="290" y="148" width="330" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="628" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="628" dy="0">6 de 7 (Windows) · 7 de 7 (Linux)</tspan></text><rect x="10" y="196" width="1000" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="510" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">La diferencia entre plataformas no está en el código sino en la cadena de herramientas: setuptools 84.0.0 incluyó py.typed por sí solo</tspan></text><text x="510" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">y setuptools 68.1.2 no. El mismo pyproject.toml produjo ruedas distintas, así que el backend de construcción debe fijarse en</tspan></text><text x="510" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">build-system.requires.</tspan></text><text x="510" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
