<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 403" width="970" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué contiene la rueda según la configuración</title><desc id="d">Tabla con el tamaño de cuatro ruedas: la base mide 2048 bytes en Windows y 2043 en Linux; sin package-data mide 1867 y 1710; sin py.typed 2048 y 1891; incluyendo todos los paquetes con include igual a asterisco mide 2473 y 2472 y añade la carpeta de pruebas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="403" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Variante</tspan></text><rect x="340" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Windows</tspan></text><rect x="460" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Linux (WSL2)</tspan></text><rect x="590" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Qué cambia en el contenido</tspan></text><rect x="10" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Base: paquete, CLI, py.typed y datos</tspan></text><rect x="340" y="56" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">2 048 B</tspan></text><rect x="460" y="56" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">2 043 B</tspan></text><rect x="590" y="56" width="364" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">9 entradas, incluida RECORD</tspan></text><rect x="10" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">D1: sin package-data</tspan></text><rect x="340" y="118" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">1 867 B</tspan></text><rect x="460" y="118" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">1 710 B</tspan></text><rect x="590" y="118" width="364" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Sin data/rules.json (y sin py.typed en Linux)</tspan></text><rect x="10" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">D3: sin py.typed en package-data</tspan></text><rect x="340" y="180" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">2 048 B</tspan></text><rect x="460" y="180" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">1 891 B</tspan></text><rect x="590" y="180" width="364" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Windows lo sigue incluyendo; Linux no</tspan></text><rect x="10" y="242" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">D6: include = «*»</tspan></text><rect x="340" y="242" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">2 473 B</tspan></text><rect x="460" y="242" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">2 472 B</tspan></text><rect x="590" y="242" width="364" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Añade tests/__init__.py y test_capkit.py</tspan></text><rect x="10" y="308" width="950" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">El tamaño es una señal barata: un cambio inesperado entre dos construcciones obliga a mirar qué entró o salió. Se compara el</tspan></text><text x="485" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">listado de la rueda (zipfile.namelist) con una lista esperada y se falla si difiere.</tspan></text><text x="485" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
