<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 531" width="940" height="531" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué contiene la rueda según la configuración</title><desc id="d">Barras horizontales con el tamaño en bytes de cuatro ruedas en Windows y Linux: la base mide 2048 y 2043; sin package-data mide 1867 y 1710 y pierde data/rules.json; sin py.typed mide 2048 y 1891 (Windows lo sigue incluyendo); con include igual a asterisco mide 2473 y 2472 y añade la carpeta de pruebas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="531" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué contiene la rueda según la configuración</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows (setuptools 84.0.0)</tspan></text><rect x="267.58" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="287.58" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="287.58" dy="0">Linux (setuptools 68.1.2)</tspan></text><line x1="274" y1="77" x2="274" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="333" x2="274" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="77" x2="394.34" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="333" x2="394.34" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">500</tspan></text><line x1="514.68" y1="77" x2="514.68" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="333" x2="514.68" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">1 000</tspan></text><line x1="635.02" y1="77" x2="635.02" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="333" x2="635.02" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">1 500</tspan></text><line x1="755.36" y1="77" x2="755.36" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="333" x2="755.36" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">2 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="333" x2="875.7" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2 500</tspan></text><line x1="274" y1="333" x2="875.7" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Base: paquete, CLI, py.typed y</tspan></text><text x="264" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">datos</tspan></text><text x="264" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">D1: sin package-data</tspan></text><text x="264" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">D3: sin py.typed en package-data</tspan></text><text x="264" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">D6: include = «*»</tspan></text><rect x="274" y="83" width="492.913" height="24.5" rx="3" fill="#c0432f"/><text x="773.913" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="773.913" dy="0">2 048</tspan></text><rect x="274" y="110.5" width="491.709" height="24.5" rx="3" fill="#087f8c"/><text x="772.709" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="772.709" dy="0">2 043</tspan></text><rect x="274" y="147" width="449.35" height="24.5" rx="3" fill="#c0432f"/><text x="730.35" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="730.35" dy="0">1 867</tspan></text><rect x="274" y="174.5" width="411.563" height="24.5" rx="3" fill="#087f8c"/><text x="692.563" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="692.563" dy="0">1 710</tspan></text><rect x="274" y="211" width="492.913" height="24.5" rx="3" fill="#c0432f"/><text x="773.913" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="773.913" dy="0">2 048</tspan></text><rect x="274" y="238.5" width="455.126" height="24.5" rx="3" fill="#087f8c"/><text x="736.126" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="736.126" dy="0">1 891</tspan></text><rect x="274" y="275" width="595.202" height="24.5" rx="3" fill="#c0432f"/><text x="876.202" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="876.202" dy="0">2 473</tspan></text><rect x="274" y="302.5" width="594.961" height="24.5" rx="3" fill="#087f8c"/><text x="875.961" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="875.961" dy="0">2 472</tspan></text><text x="574.85" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">bytes de la rueda</tspan></text><rect x="10" y="391" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El tamaño es una señal barata: un cambio inesperado entre dos construcciones obliga a mirar qué entró o salió. Base: 9</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entradas, incluida RECORD. D1 pierde data/rules.json (y py.typed en Linux); D3 pierde py.typed solo en Linux; D6 añade</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tests/__init__.py y test_capkit.py. Se compara el listado de la rueda (zipfile.namelist) con una lista esperada y se falla</tspan></text><text x="470" y="465.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">si difiere.</tspan></text><text x="470" y="513.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
