ct x="540" y="336" width="204" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">5</tspan></text><rect x="750" y="336" width="204" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">5</tspan></text><rect x="10" y="376" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="396.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">M9 limit pasa de None a 2</tspan></text><rect x="390" y="376" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="396.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">REVISAR</tspan></text><rect x="540" y="376" width="204" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="396.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">2</tspan></text><rect x="750" y="376" width="204" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="396.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">2</tspan></text><rect x="10" y="416" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="436.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">M10 policy pasa a obligatorio</tspan></text><rect x="390" y="416" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="436.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">MAJOR</tspan></text><rect x="540" y="416" width="204" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="436.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">5</tspan></text><rect x="750" y="416" width="204" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="436.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">5</tspan></text><rect x="10" y="456" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="476.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">M11 cambiar el texto del error</tspan></text><rect x="390" y="456" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="476.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">—</tspan></text><rect x="540" y="456" width="204" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="476.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">0</tspan></text><rect x="750" y="456" width="204" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="476.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0</tspan></text><rect x="10" y="496" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="516.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">M12 mover choose_next a un nombre privado</tspan></text><rect x="390" y="496" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="516.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">MAJOR</tspan></text><rect x="540" y="496" width="204" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="516.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">1</tspan></text><rect x="750" y="496" width="204" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="516.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">1</tspan></text><rect x="10" y="540" width="950" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="564.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Solo la comparación vio M3, M7 y el control M1; solo las pruebas vieron M4 y M8; ambas vieron cinco; ninguna vio M11 (un texto</tspan></text><text x="485" y="581.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">de error) y, con fixtures compartidas, tampoco M5: la primera prueba ordenó la lista y la prueba de no mutación leyó la lista</tspan></text><text x="485" y="598.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">ya ordenada.</tspan></text><text x="485" y="637.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Cuentas deterministas sobre un SDK de 12 líneas; idénticas en Windows (3.12.9) y Linux (3.12.3).</tspan></text></svg>
