<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 651" width="970" height="651" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce cambios a un SDK: ¿los ve la comparación de API o las pruebas de contrato?</title><desc id="d">Tabla de doce mutantes de un SDK de ejemplo: la comparación de superficie de API detecta renombres, eliminaciones, cambios de herencia y de obligatoriedad pero no los cambios de comportamiento; las ocho pruebas de contrato detectan los cambios de comportamiento pero no los renombres usados por posición ni la constante; el cambio de texto de error no lo detecta ninguno; ordenar la entrada en sitio solo lo detectan las pruebas con fixtures frescas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="651" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Mutante</tspan></text><rect x="390" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Comparación de</tspan></text><text x="462" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">API</tspan></text><rect x="540" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x