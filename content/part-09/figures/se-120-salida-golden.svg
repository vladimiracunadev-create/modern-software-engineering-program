<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 443" width="970" height="443" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Salida de la CLI como archivo de referencia: los bytes, no el texto</title><desc id="d">Tabla con la salida de una CLI de dos líneas, una de ellas JSON con ñ: en Windows por defecto son 43 bytes con 2 saltos CRLF y un SHA-256 distinto; fijando salto de línea y UTF-8 son 42 bytes con 0 CRLF y el mismo SHA-256 que Linux, 526a8c1a6a2b.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="443" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Configuración</tspan></text><rect x="320" y="12" width="64" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="352" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352" dy="0">Bytes</tspan></text><rect x="390" y="12" width="64" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">CRLF</tspan></text><rect x="460" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">SHA-256 (12 primeros)</tspan></text><rect x="640" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Lectura</tspan></text><rect x="10" y="56" width="304" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="90.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Windows, salida por defecto</tspan></text><rect x="320" y="56" width="64" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">43</tspan></text><rect x="390" y="56" width="64" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">2</tspan></text><rect x="460" y="56" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">86ca59242a63</tspan></text><rect x="640" y="56" width="314" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="82.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Los saltos de línea son CRLF y la ñ ocupa 1</tspan></text><text x="797" y="98.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">byte (cp1252)</tspan></text><rect x="10" y="124" width="304" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="150.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Windows con reconfigure(newline=&#x27;\n&#x27;,</tspan></text><text x="162" y="166.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">encoding=&#x27;utf-8&#x27;)</tspan></text><rect x="320" y="124" width="64" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">42</tspan></text><rect x="390" y="124" width="64" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0</tspan></text><rect x="460" y="124" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">526a8c1a6a2b</tspan></text><rect x="640" y="124" width="314" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Igual que Linux</tspan></text><rect x="10" y="192" width="304" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="226.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Linux, salida por defecto</tspan></text><rect x="320" y="192" width="64" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">42</tspan></text><rect x="390" y="192" width="64" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0</tspan></text><rect x="460" y="192" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">526a8c1a6a2b</tspan></text><rect x="640" y="192" width="314" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">LF y UTF-8</tspan></text><rect x="10" y="260" width="304" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Linux con reconfigure</tspan></text><rect x="320" y="260" width="64" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">42</tspan></text><rect x="390" y="260" width="64" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0</tspan></text><rect x="460" y="260" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">526a8c1a6a2b</tspan></text><rect x="640" y="260" width="314" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Sin cambios</tspan></text><rect x="10" y="332" width="950" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Comparar con un archivo de referencia (golden) sin fijar codificación y salto de línea hace que la misma prueba pase en Linux y</tspan></text><text x="485" y="373.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">falle en Windows. Para la CLI de un SDK, el contrato incluye los bytes de la salida --json: se fijan en el programa, no en la</tspan></text><text x="485" y="390.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">prueba.</tspan></text><text x="485" y="429.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
