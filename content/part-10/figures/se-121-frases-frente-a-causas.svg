<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 379" width="1000" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">600 tickets sintéticos: contar frases frente a contar causas</title><desc id="d">Barras de 600 tickets: la frase más repetida, no encuentro dónde entregar, suma 188; las cinco frases que describen la expiración de sesión suman 65, 64, 63, 55 y 53 y juntas 300 tickets, la causa más frecuente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="379" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">«no encuentro dónde entregar»</tspan></text><rect x="340" y="16" width="601.6" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="949.6" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="949.6" dy="0">188</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">«se cerró sola»</tspan></text><rect x="340" y="60" width="208" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="556" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="556" dy="0">65</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">«perdí mi respuesta»</tspan></text><rect x="340" y="104" width="204.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="552.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="552.8" dy="0">64</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">«no guardó mi avance»</tspan></text><rect x="340" y="148" width="201.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="549.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="549.6" dy="0">63</tspan></text><text x="330" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">«me enteré tarde» / «no vi la fecha»</tspan></text><rect x="340" y="192" width="358.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="706.4" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="706.4" dy="0">56 + 56</tspan></text><text x="330" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">«tuve que volver a entrar» + «me saca»</tspan></text><rect x="340" y="236" width="345.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="693.6" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="693.6" dy="0">55 + 53</tspan></text><rect x="10" y="284" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Por frase gana «no encuentro dónde entregar» (188). Al agrupar las cinco frases de la expiración de sesión (65 + 64 + 63 + 55 + 53)</tspan></text><text x="500" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">la causa C1 suma 300: más que la causa C2 (188) y C3 (112). Contar palabras reordena la lista.</tspan></text><text x="500" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
