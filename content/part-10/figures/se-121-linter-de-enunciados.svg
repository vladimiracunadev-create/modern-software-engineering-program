<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 501" width="940" height="501" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter de enunciados de problema: 8 de 8 en los ejemplos, fallo en el caso nuevo</title><desc id="d">Mapa de calor binario de seis enunciados: la regla detecta solución embebida, actor y consecuencia y acepta o rechaza; acierta los ocho enunciados con los que se escribió y falla con vendedoras pierden pedidos, que no está en su lista de actores y rechaza por error.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="501" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Linter de enunciados de problema: 8 de 8 en los ejemplos, fallo en el caso nuevo</tspan></text><text x="398.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.5" dy="0">Solución embebida</tspan></text><text x="547.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.5" dy="0">Actor</tspan></text><text x="696.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696.5" dy="0">Consecuencia</tspan></text><text x="845.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="845.5" dy="0">La regla acepta</tspan></text><text x="314" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Dashboard para docentes</tspan></text><text x="314" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">40 min por abrir cada archivo</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Usuarios insatisfechos</tspan></text><text x="314" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Familias abandonan el registro</tspan></text><text x="314" y="274.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Pierden avance al expirar (nuevo)</tspan></text><text x="314" y="318.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Vendedoras pierden pedidos (nuevo)</tspan></text><rect x="325.5" y="73.5" width="146" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="398.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="398.5" dy="0">sí</tspan></text><rect x="474.5" y="73.5" width="146" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="547.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547.5" dy="0">sí</tspan></text><rect x="623.5" y="73.5" width="146" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="696.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696.5" dy="0">no</tspan></text><rect x="772.5" y="73.5" width="146" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="845.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="845.5" dy="0">no</tspan></text><rect x="325.5" y="117.5" width="146" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="398.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.5" dy="0">no</tspan></text><rect x="474.5" y="117.5" width="146" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="547.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547.5" dy="0">sí</tspan></text><rect x="623.5" y="117.5" width="146" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="696.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="696.5" dy="0">sí</tspan></text><rect x="772.5" y="117.5" width="146" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="845.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845.5" dy="0">sí</tspan></text><rect x="325.5" y="161.5" width="146" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="398.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.5" dy="0">no</tspan></text><rect x="474.5" y="161.5" width="146" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="547.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.5" dy="0">no</tspan></text><rect x="623.5" y="161.5" width="146" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="696.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696.5" dy="0">no</tspan></text><rect x="772.5" y="161.5" width="146" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="845.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="845.5" dy="0">no</tspan></text><rect x="325.5" y="205.5" width="146" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="398.5" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.5" dy="0">no</tspan></text><rect x="474.5" y="205.5" width="146" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="547.5" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547.5" dy="0">sí</tspan></text><rect x="623.5" y="205.5" width="146" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="696.5" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="696.5" dy="0">sí</tspan></text><rect x="772.5" y="205.5" width="146" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="845.5" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845.5" dy="0">sí</tspan></text><rect x="325.5" y="249.5" width="146" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="398.5" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.5" dy="0">no</tspan></text><rect x="474.5" y="249.5" width="146" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="547.5" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547.5" dy="0">sí</tspan></text><rect x="623.5" y="249.5" width="146" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="696.5" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="696.5" dy="0">sí</tspan></text><rect x="772.5" y="249.5" width="146" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="845.5" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845.5" dy="0">sí</tspan></text><rect x="325.5" y="293.5" width="146" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="398.5" y="318.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.5" dy="0">no</tspan></text><rect x="474.5" y="293.5" width="146" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="547.5" y="318.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.5" dy="0">no</tspan></text><rect x="623.5" y="293.5" width="146" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="696.5" y="318.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="696.5" dy="0">sí</tspan></text><rect x="772.5" y="293.5" width="146" height="41" rx="4" fill="#d9e2ec" stroke="#102a43" stroke-width="3"/><text x="845.5" y="318.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="845.5" dy="0">no</tspan></text><text x="324" y="362" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="324" dy="0">no</tspan></text><rect x="347.08" y="350" width="30.5" height="14" fill="#d9e2ec"/><rect x="377.08" y="350" width="30.5" height="14" fill="#bcc8d4"/><rect x="407.08" y="350" width="30.5" height="14" fill="#a0adbc"/><rect x="437.08" y="350" width="30.5" height="14" fill="#8393a4"/><rect x="467.08" y="350" width="30.5" height="14" fill="#66798b"/><rect x="497.08" y="350" width="30.5" height="14" fill="#495f73"/><rect x="527.08" y="350" width="30.5" height="14" fill="#2d445b"/><rect x="557.08" y="350" width="30.5" height="14" fill="#102a43"/><text x="595.08" y="362" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="595.08" dy="0">sí</tspan></text><text x="618.16" y="362" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="618.16" dy="0">más oscuro = mayor (Presente = 1, ausente = 0)</tspan></text><rect x="10" y="378" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="402.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las expresiones regulares se escribieron mirando los ocho primeros enunciados, por eso aciertan 8/8. Con un actor que no</tspan></text><text x="470" y="419.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">figuraba en la lista («vendedoras») la regla rechaza un buen enunciado (celda resaltada: debía aceptar). Un linter detecta</tspan></text><text x="470" y="436.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">síntomas de enunciado vago; no demuestra que el problema sea real.</tspan></text><text x="470" y="483.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
