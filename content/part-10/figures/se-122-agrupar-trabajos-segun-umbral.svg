<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 502" width="940" height="502" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Agrupar enunciados de trabajo por similitud léxica: el umbral decide cuántos trabajos hay</title><desc id="d">Línea con el número de grupos en que se reparten nueve enunciados de trabajo según el umbral de similitud Jaccard: cinco grupos con 0,20 y nueve con 0,34 y con 0,50, frente a los cuatro trabajos que lee una persona.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="502" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Agrupar enunciados de trabajo por similitud léxica: el umbral decide cuántos trabajos hay</tspan></text><line x1="71.08" y1="319" x2="910" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="319" x2="71.08" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="267" x2="71.08" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">2</tspan></text><line x1="71.08" y1="215" x2="910" y2="215" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="215" x2="71.08" y2="215" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="219.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">4</tspan></text><line x1="71.08" y1="163" x2="910" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="163" x2="71.08" y2="163" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">6</tspan></text><line x1="71.08" y1="111" x2="910" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="111" x2="71.08" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">8</tspan></text><line x1="71.08" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="59" x2="71.08" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="59" x2="71.08" y2="319" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="59" x2="89.08" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="319" x2="89.08" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">0,20</tspan></text><line x1="463.776" y1="59" x2="463.776" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="463.776" y1="319" x2="463.776" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="463.776" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463.776" dy="0">0,34</tspan></text><line x1="892" y1="59" x2="892" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="319" x2="892" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0,50</tspan></text><line x1="71.08" y1="319" x2="910" y2="319" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="189" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 189)">Grupos de trabajo</text><text x="490.54" y="365" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Umbral Jaccard</tspan></text><line x1="71.08" y1="215" x2="910" y2="215" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="77.08" y="209" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="77.08" dy="0">cuatro trabajos según la lectura humana</tspan></text><polyline points="89.08,189 463.776,85 892,85" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="89.08" cy="189" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="99.08" y="193.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="99.08" dy="0">5 grupos</tspan></text><circle cx="463.776" cy="85" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="463.776" y="74" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="463.776" dy="0">9 grupos</tspan></text><circle cx="892" cy="85" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="74" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">9 grupos</tspan></text><rect x="10" y="379" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con 0,20 los tamaños son 4 + 2 + 1 + 1 + 1 (agrupa «enviar/subir/entregar la tarea» y separa «saber si llegó»); con 0,34 y</tspan></text><text x="470" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">0,50 son nueve grupos de uno: la similitud léxica no ve que «entregar» y «enviar» son lo mismo. Agrupar trabajos es una</tspan></text><text x="470" y="437.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">decisión de investigación, no un cálculo.</tspan></text><text x="470" y="484.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
