<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 335" width="960" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas personas se parecen al «usuario promedio» al sumar dimensiones</title><desc id="d">Barras con el porcentaje de 4063 personas sintéticas que quedan dentro de 0,3 desviaciones típicas de la mediana en todas las dimensiones: 22,5 por ciento con una, 4,5 con dos, 0,96 con tres, 0,05 con cinco y ninguna con ocho.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="335" fill="#ffffff"/><text x="190" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">1 dimensión</tspan></text><rect x="200" y="16" width="450.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="658.8" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="658.8" dy="0">22,5 %</tspan></text><text x="190" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">2 dimensiones</tspan></text><rect x="200" y="60" width="90" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="298" dy="0">4,5 %</tspan></text><text x="190" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">3 dimensiones</tspan></text><rect x="200" y="104" width="19.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="227.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="227.2" dy="0">0,96 %</tspan></text><text x="190" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">5 dimensiones</tspan></text><rect x="200" y="148" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="212" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="212" dy="0">0,05 % (2 personas de 4 063)</tspan></text><text x="190" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">8 dimensiones</tspan></text><rect x="200" y="192" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="212" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="212" dy="0">0 de 4 063</tspan></text><rect x="10" y="240" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Población simulada normal e independiente, tolerancia ±0,3 desviaciones típicas. La fracción teórica es 0,2358^d: 23,6 %, 5,6</tspan></text><text x="480" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">%, 1,3 %, 0,07 % y 0,001 %. El promedio de cada dimensión no describe a casi nadie en conjunto.</tspan></text><text x="480" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
