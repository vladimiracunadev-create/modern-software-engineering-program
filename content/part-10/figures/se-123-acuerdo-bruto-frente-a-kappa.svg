<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 247" width="1000" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos codificadoras con 5 % de error: el acuerdo bruto casi no cambia, kappa se desploma</title><desc id="d">Barras con el acuerdo bruto entre dos codificadoras simuladas: 93,5 por ciento con un tema del 50 por ciento (kappa 0,87), 91,2 con uno del 10 (kappa 0,60) y 90,2 con uno del 3 (kappa 0,29).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="247" fill="#ffffff"/><text x="260" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Tema frecuente (50 %)</tspan></text><rect x="270" y="16" width="448.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="726.8" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="726.8" dy="0">acuerdo 93,5 % · κ 0,87</tspan></text><text x="260" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Tema ocasional (10 %)</tspan></text><rect x="270" y="60" width="437.76" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="715.76" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="715.76" dy="0">acuerdo 91,2 % · κ 0,60</tspan></text><text x="260" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Tema raro (3 %)</tspan></text><rect x="270" y="104" width="432.96" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="710.96" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="710.96" dy="0">acuerdo 90,2 % · κ 0,29</tspan></text><rect x="10" y="152" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">400 fragmentos sintéticos, cada codificadora se equivoca el 5 % de las veces. El acuerdo bruto parece sano en los tres casos; kappa</tspan></text><text x="500" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">descuenta el acuerdo por azar y cae a 0,29 cuando el código es raro.</tspan></text><text x="500" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
