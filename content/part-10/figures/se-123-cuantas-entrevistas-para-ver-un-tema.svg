<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de oír un tema al menos una vez según cuántas entrevistas se hagan</title><desc id="d">Líneas con la probabilidad simulada de observar un tema de prevalencia 5, 10 o 30 por ciento en 5, 8, 20 y 30 entrevistas: con 30 entrevistas 78,9, 96,1 y 100 por ciento; para un 90 por ciento de seguridad hacen falta 45, 22 y 7 entrevistas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de oír un tema al menos una vez según cuántas entrevistas se hagan</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Tema de 5 %</tspan></text><rect x="146.94" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Tema de 10 %</tspan></text><polygon points="291.42,44.1 298.02,56.4 284.82,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="305.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="305.42" dy="0">Tema de 30 %</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">5</tspan></text><line x1="192.066" y1="87" x2="192.066" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="192.066" y1="387" x2="192.066" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="192.066" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="192.066" dy="0">8</tspan></text><line x1="573.848" y1="87" x2="573.848" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="573.848" y1="387" x2="573.848" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="573.848" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573.848" dy="0">20</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">30</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Probabilidad de oír el tema (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Entrevistas realizadas</tspan></text><line x1="78.62" y1="117" x2="910" y2="117" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="84.62" y="111" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="84.62" dy="0">90 %</tspan></text><polyline points="96.62,318 192.066,284.4 573.848,194.1 892,150.3" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="318" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="192.066" cy="284.4" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="573.848" cy="194.1" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="892" cy="150.3" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="139.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">78,9</tspan></text><polyline points="96.62,262.8 192.066,215.4 573.848,122.7 892,98.7" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="257.3" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="186.566" y="209.9" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="568.348" y="117.2" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="886.5" y="93.2" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="122.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">96,1</tspan></text><polyline points="96.62,137.7 192.066,104.1 573.848,87 892,87" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="96.62,131.375 102.67,142.65 90.57,142.65" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="192.066,97.775 198.116,109.05 186.016,109.05" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="573.848,80.675 579.898,91.95 567.798,91.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="892,80.675 898.05,91.95 885.95,91.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">100</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cinco entrevistas casi garantizan ver un tema que afecta al 30 % y dejan un 59 % de probabilidad de no ver uno que afecta</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">al 10 %. «No salió en las entrevistas» no es lo mismo que «no existe». Entrevistas necesarias para un 90 %: 45, 22 y 7.</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Simulación de 20 000 repeticiones; coincide con 1 − (1 − p)ⁿ.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
