<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" width="1000" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de al menos un falso positivo cuando todas las hipótesis son falsas</title><desc id="d">Barras con la probabilidad de encontrar al menos un resultado significativo al 5 por ciento si se contrastan 1, 5, 10 o 20 hipótesis nulas: 5,0, 22,6, 40,1 y 64,2 por ciento; con corrección de Bonferroni sobre 20, 4,8 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="335" fill="#ffffff"/><text x="230" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">1 hipótesis</tspan></text><rect x="240" y="16" width="32.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="280.5" dy="0">5,0 %</tspan></text><text x="230" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">5 hipótesis</tspan></text><rect x="240" y="60" width="146.9" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="394.9" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="394.9" dy="0">22,6 %</tspan></text><text x="230" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">10 hipótesis</tspan></text><rect x="240" y="104" width="260.65" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="508.65" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="508.65" dy="0">40,1 %</tspan></text><text x="230" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">20 hipótesis</tspan></text><rect x="240" y="148" width="417.3" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="665.3" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="665.3" dy="0">64,2 % (simulado 64,0 %)</tspan></text><text x="230" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">20 con Bonferroni</tspan></text><rect x="240" y="192" width="31.2" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="279.2" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="279.2" dy="0">4,8 % (simulado)</tspan></text><rect x="10" y="240" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">20 000 repeticiones. Revisar veinte métricas «a ver cuál sale» produce un hallazgo falso dos de cada tres veces. La corrección de</tspan></text><text x="500" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Bonferroni lo devuelve al 5 %, a costa de exigir evidencia más fuerte por hipótesis.</tspan></text><text x="500" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
