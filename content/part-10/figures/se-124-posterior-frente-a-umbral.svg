<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma tasa observada del 20 %: cuánta confianza da de superar el umbral del 15 %</title><desc id="d">Línea con la probabilidad posterior (a priori Beta(1,1)) de que la tasa real supere el 15 por ciento cuando se observa un 20 por ciento: 0,80 con 20 personas, 0,85 con 40, 0,93 con 100 y 0,98 con 200; solo desde 100 personas pasa del 0,90 exigido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La misma tasa observada del 20 %: cuánta confianza da de superar el umbral del 15 %</tspan></text><line x1="78.62" y1="339" x2="910" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="339" x2="78.62" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="343.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,6</tspan></text><line x1="78.62" y1="269" x2="910" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="269" x2="78.62" y2="269" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="273.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,7</tspan></text><line x1="78.62" y1="199" x2="910" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="199" x2="78.62" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,8</tspan></text><line x1="78.62" y1="129" x2="910" y2="129" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="129" x2="78.62" y2="129" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="133.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,9</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="339" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="339" x2="96.62" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">20</tspan></text><line x1="336.053" y1="59" x2="336.053" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="336.053" y1="339" x2="336.053" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="336.053" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="336.053" dy="0">40</tspan></text><line x1="652.567" y1="59" x2="652.567" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="652.567" y1="339" x2="652.567" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="652.567" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652.567" dy="0">100</tspan></text><line x1="892" y1="59" x2="892" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="339" x2="892" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">200</tspan></text><line x1="78.62" y1="339" x2="910" y2="339" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 199)">Probabilidad posterior</text><text x="494.31" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Personas observadas (misma tasa del 20 %) (escala logarítmica)</tspan></text><line x1="78.62" y1="129" x2="910" y2="129" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="84.62" y="123" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="84.62" dy="0">probabilidad exigida 0,90</tspan></text><polyline points="96.62,199 336.053,164 652.567,108 892,73" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="199" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="188" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">4 de 20</tspan></text><circle cx="336.053" cy="164" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="336.053" y="153" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="336.053" dy="0">8 de 40</tspan></text><circle cx="652.567" cy="108" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="652.567" y="97" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="652.567" dy="0">20 de 100</tspan></text><circle cx="892" cy="73" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="97" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">40 de 200</tspan></text><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El eje vertical empieza en 0,6 para ver la separación. Una hipótesis que dice «más del 15 %» no se confirma con 4 de 20,</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aunque 20 % parezca mayor que 15 %. Fijar antes el umbral y la probabilidad exigida (por ejemplo 0,90) obliga a definir</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuántas personas se necesitan.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
