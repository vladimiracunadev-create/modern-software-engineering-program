<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" width="1000" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto mueve cada supuesto el resultado de un embudo de cinco pasos</title><desc id="d">Barras ordenadas del cambio en puntos porcentuales del resultado final al mover un supuesto de su mínimo a su máximo: interés 0,61, activación 0,57, retención 0,47, registro 0,43 y alcance 0,28; el resultado base es 0,425 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="335" fill="#ffffff"/><text x="250" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Interés (5 %–30 %)</tspan></text><rect x="260" y="16" width="394.55" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="662.55" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="662.55" dy="0">0,61 pp · razón 6,0</tspan></text><text x="250" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Activación (10 %–50 %)</tspan></text><rect x="260" y="60" width="368.55" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="636.55" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="636.55" dy="0">0,57 pp · razón 5,0</tspan></text><text x="250" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Retención (20 %–70 %)</tspan></text><rect x="260" y="104" width="306.8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="574.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="574.8" dy="0">0,47 pp · razón 3,5</tspan></text><text x="250" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Registro (20 %–60 %)</tspan></text><rect x="260" y="148" width="276.25" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="544.25" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="544.25" dy="0">0,43 pp · razón 3,0</tspan></text><text x="250" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Alcance (30 %–60 %)</tspan></text><rect x="260" y="192" width="183.95" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="451.95" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="451.95" dy="0">0,28 pp · razón 2,0</tspan></text><rect x="10" y="240" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Resultado base 0,425 %. Con todos los supuestos sorteados a la vez, el intervalo p5–p95 va de 0,075 % a 1,117 % (razón 15). El</tspan></text><text x="500" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">supuesto que más mueve el resultado es el que primero hay que contrastar, no el que más cómodo resulta medir.</tspan></text><text x="500" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
