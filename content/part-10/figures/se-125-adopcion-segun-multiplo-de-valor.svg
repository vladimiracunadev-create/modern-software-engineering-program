<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" width="1000" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Adopción simulada si cada persona sobrevalora lo que ya usa por un factor de 3</title><desc id="d">Barras con el porcentaje de adopción simulado según el múltiplo de valor de la propuesta frente a la alternativa actual: 6,3 por ciento con 1 vez, 16,2 con 1,5, 28,5 con 2, 50,2 con 3, 76,4 con 5 y 94,0 con 9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="395" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Valor nuevo = 1,0× el actual</tspan></text><rect x="300" y="16" width="34.65" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="342.65" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="342.65" dy="0">6,3 %</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">1,5×</tspan></text><rect x="300" y="60" width="89.1" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="397.1" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="397.1" dy="0">16,2 %</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">2,0×</tspan></text><rect x="300" y="104" width="156.75" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="464.75" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="464.75" dy="0">28,5 %</tspan></text><text x="290" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">3,0×</tspan></text><rect x="300" y="148" width="276.1" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="584.1" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="584.1" dy="0">50,2 %</tspan></text><text x="290" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">5,0×</tspan></text><rect x="300" y="192" width="420.2" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="728.2" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="728.2" dy="0">76,4 %</tspan></text><text x="290" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">9,0×</tspan></text><rect x="300" y="236" width="517" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="825" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="825" dy="0">94,0 %</tspan></text><rect x="10" y="284" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Modelo, no medición: valores percibidos lognormales independientes y un sesgo de apego de 3× a lo actual. Ser «el doble de bueno»</tspan></text><text x="500" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">alcanza a menos del 30 % de la población; el modelo está inspirado en el argumento de Gourville y no prueba cuánto pesa el apego en</tspan></text><text x="500" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">un producto concreto.</tspan></text><text x="500" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Simulación con semilla fija; los parámetros son supuestos, no datos de mercado.</tspan></text></svg>
