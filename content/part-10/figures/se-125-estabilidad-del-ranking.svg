<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 307" width="960" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Con qué frecuencia una encuesta recupera los tres resultados más desatendidos</title><desc id="d">Barras con el porcentaje de 400 encuestas simuladas que identifican correctamente los tres principales resultados deseados: 51,2 por ciento con 10 personas, 75,8 con 30, 96,2 con 100 y 100 con 300.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="307" fill="#ffffff"/><text x="200" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">n = 10 personas</tspan></text><rect x="210" y="16" width="307.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="525.2" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="525.2" dy="0">51,2 %</tspan></text><text x="200" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">n = 30</tspan></text><rect x="210" y="60" width="454.8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="672.8" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="672.8" dy="0">75,8 %</tspan></text><text x="200" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">n = 100</tspan></text><rect x="210" y="104" width="577.2" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="795.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="795.2" dy="0">96,2 %</tspan></text><text x="200" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">n = 300</tspan></text><rect x="210" y="148" width="600" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="818" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="818" dy="0">100 %</tspan></text><rect x="10" y="196" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Ocho resultados con importancia y satisfacción verdaderas conocidas; escalas 1–5 con desviación 1. Con 10 personas el top-3</tspan></text><text x="480" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">correcto sale la mitad de las veces; el tau de Kendall sube de 0,72 a 0,92 al pasar de 10 a 300. Un ranking de resultados es</tspan></text><text x="480" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">una estimación, no un hecho.</tspan></text><text x="480" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
