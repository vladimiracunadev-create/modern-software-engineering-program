<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 219" width="1000" height="219" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Semanas para detectar la misma mejora de 5 puntos según el indicador elegido</title><desc id="d">Barras con el promedio de semanas hasta detectar un cambio de cinco puntos con prueba unilateral al 5 por ciento: 7,5 semanas con el indicador rápido de activación y 12,9 con el indicador lento de retención.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="219" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Rápido: activación 40→45 % (80/sem.)</tspan></text><rect x="340" y="16" width="300" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="648" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="648" dy="0">7,5 semanas</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Lento: retención a 90 d, 12→17 % (20/sem.)</tspan></text><rect x="340" y="60" width="516" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="864" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="864" dy="0">12,9 semanas</tspan></text><rect x="10" y="108" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Promedio de 600 simulaciones, tope de 60 semanas. Además la retención a 90 días solo puede medirse 13 semanas después de empezar a</tspan></text><text x="500" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">observar la cohorte: el calendario real se alarga. Los indicadores adelantados responden antes pero pueden desviarse del resultado</tspan></text><text x="500" y="166.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">que importa.</tspan></text><text x="500" y="205.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
