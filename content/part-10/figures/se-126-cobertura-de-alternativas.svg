<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 447" width="800" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué trabajos cubre cada alternativa existente (incluida no hacer nada)</title><desc id="d">Tabla de cobertura de siete trabajos por seis alternativas: la plataforma actual y el editor local cubren tres cada una, correo, hoja de cálculo y mensajería dos, y no hacer nada ninguno; el mínimo conjunto que cubre todo es correo, hoja de cálculo y editor local.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="800" height="447" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Alternativa</tspan></text><rect x="310" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Trabajos que cubre</tspan></text><rect x="590" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="687" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">Cobertura</tspan></text><rect x="10" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Plataforma actual</tspan></text><rect x="310" y="56" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">J1, J4, J5</tspan></text><rect x="590" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">3 de 7</tspan></text><rect x="10" y="102" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Editor local</tspan></text><rect x="310" y="102" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">J2, J6, J7</tspan></text><rect x="590" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">3 de 7</tspan></text><rect x="10" y="148" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Correo</tspan></text><rect x="310" y="148" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">J1, J5</tspan></text><rect x="590" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">2 de 7</tspan></text><rect x="10" y="194" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Hoja de cálculo</tspan></text><rect x="310" y="194" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">J3, J4</tspan></text><rect x="590" y="194" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">2 de 7</tspan></text><rect x="10" y="240" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Mensajería</tspan></text><rect x="310" y="240" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">J1, J3</tspan></text><rect x="590" y="240" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">2 de 7</tspan></text><rect x="10" y="286" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">No hacer nada</tspan></text><rect x="310" y="286" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">—</tspan></text><rect x="590" y="286" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">0 de 7</tspan></text><rect x="10" y="336" width="780" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="400" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="400" dy="0">Ninguna alternativa cubre todo; el mínimo conjunto que lo hace es correo + hoja de cálculo + editor</tspan></text><text x="400" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="400" dy="0">local: la persona usuaria ya cose tres herramientas. Esa costura, y no una lista de funciones, es el</tspan></text><text x="400" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="400" dy="0">espacio donde una propuesta puede competir.</tspan></text><text x="400" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
