<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos estimaciones del mercado con rangos triangulares y 20 000 sorteos</title><desc id="d">Intervalos en escala logarítmica con los percentiles 5, 50 y 95: arriba-abajo da 6223, 18399 y 45102 personas y abajo-arriba 11354, 50773 y 189593 dólares al año, con razones p95 sobre p5 de 7,2 y 16,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos estimaciones del mercado con rangos triangulares y 20 000 sorteos</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p5</tspan></text><polygon points="85.08,44.1 91.68,56.4 78.48,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="99.08" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="99.08" dy="0">p50</tspan></text><polygon points="155.7,43.5 163.2,51 155.7,58.5 148.2,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="169.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="169.7" dy="0">p95</tspan></text><line x1="237.38" y1="77" x2="237.38" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="237.38" y1="225" x2="237.38" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="237.38" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.38" dy="0">1 000</tspan></text><line x1="454.92" y1="77" x2="454.92" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="454.92" y1="225" x2="454.92" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="454.92" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="454.92" dy="0">10 000</tspan></text><line x1="672.46" y1="77" x2="672.46" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="672.46" y1="225" x2="672.46" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="672.46" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672.46" dy="0">100 000</tspan></text><line x1="890" y1="77" x2="890" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="225" x2="890" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">1 000 000</tspan></text><line x1="237.38" y1="225" x2="890" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="207.38" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Arriba-abajo (personas)</tspan></text><text x="207.38" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Abajo-arriba (USD/año)</tspan></text><line x1="410.107" y1="114" x2="597.234" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="403.107" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="410.107" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="410.107" dy="0">6 223</tspan></text><polygon points="512.523,105.95 520.223,120.3 504.823,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="512.523" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512.523" dy="0">18 399</tspan></text><polygon points="597.234,105.25 605.984,114 597.234,122.75 588.484,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="597.234" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597.234" dy="0">45 102</tspan></text><line x1="466.917" y1="188" x2="732.897" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="459.917" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="466.917" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="466.917" dy="0">11 354</tspan></text><polygon points="608.423,179.95 616.123,194.3 600.723,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="608.423" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="608.423" dy="0">50 773</tspan></text><polygon points="732.897,179.25 741.647,188 732.897,196.75 724.147,188" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="732.897" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="732.897" dy="0">189 593</tspan></text><text x="563.69" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="563.69" dy="0">Personas o USD por año (según la fila) (escala logarítmica)</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las unidades de las filas son distintas (personas, dinero) y no deben compararse entre sí. Lo comparable es la anchura:</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">p95/p5 vale 7,2 arriba-abajo y 16,7 abajo-arriba, porque este método multiplica tres incertidumbres. El «1 % de un mercado</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">grande» oculta justo esa anchura.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Rangos asumidos por el autor para ilustrar el método; no provienen de ningún mercado real.</tspan></text></svg>
