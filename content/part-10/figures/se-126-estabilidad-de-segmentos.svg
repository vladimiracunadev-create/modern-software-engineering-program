<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estabilidad de k-means entre dos semillas: datos con tres grupos reales frente a ruido uniforme</title><desc id="d">Barras agrupadas del índice de Rand entre dos ejecuciones con semillas distintas: con k igual a 3 los datos estructurados dan 0,964 y el ruido 0,806, pero con k igual a 4, 5 y 6 el ruido es tan estable como los datos con estructura, e incluso más con k igual a 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estabilidad de k-means entre dos semillas: datos con tres grupos reales frente a ruido uniforme</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Datos con 3 grupos reales</tspan></text><rect x="252.5" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Ruido uniforme</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,2</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,4</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,6</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,8</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Índice de Rand entre semillas</text><rect x="95.4476" y="177.32" width="65.3104" height="197.68" rx="3" fill="#087f8c"/><text x="128.103" y="171.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="128.103" dy="0">0,706</tspan></text><rect x="164.758" y="189.36" width="65.3104" height="185.64" rx="3" fill="#c0432f"/><text x="197.413" y="183.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.413" dy="0">0,663</tspan></text><text x="162.758" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="162.758" dy="0">k = 2</tspan></text><rect x="263.724" y="105.08" width="65.3104" height="269.92" rx="3" fill="#087f8c"/><text x="296.379" y="99.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="296.379" dy="0">0,964</tspan></text><rect x="333.034" y="149.32" width="65.3104" height="225.68" rx="3" fill="#c0432f"/><text x="365.689" y="143.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="365.689" dy="0">0,806</tspan></text><text x="331.034" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="331.034" dy="0">k = 3</tspan></text><rect x="432" y="111.24" width="65.3104" height="263.76" rx="3" fill="#087f8c"/><text x="464.655" y="105.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="464.655" dy="0">0,942</tspan></text><rect x="501.31" y="104.24" width="65.3104" height="270.76" rx="3" fill="#c0432f"/><text x="533.965" y="98.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="533.965" dy="0">0,967</tspan></text><text x="499.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">k = 4</tspan></text><rect x="600.276" y="123.84" width="65.3104" height="251.16" rx="3" fill="#087f8c"/><text x="632.931" y="117.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="632.931" dy="0">0,897</tspan></text><rect x="669.586" y="122.44" width="65.3104" height="252.56" rx="3" fill="#c0432f"/><text x="702.241" y="116.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.241" dy="0">0,902</tspan></text><text x="667.586" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.586" dy="0">k = 5</tspan></text><rect x="768.552" y="126.08" width="65.3104" height="248.92" rx="3" fill="#087f8c"/><text x="801.207" y="120.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="801.207" dy="0">0,889</tspan></text><rect x="837.862" y="128.88" width="65.3104" height="246.12" rx="3" fill="#c0432f"/><text x="870.517" y="122.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870.517" dy="0">0,879</tspan></text><text x="835.862" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.862" dy="0">k = 6</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Solo con k = 3 los datos estructurados son claramente más estables que el ruido; con k = 4 el ruido es más estable (0,967</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">frente a 0,942). Que un algoritmo devuelva segmentos estables no prueba que existan segmentos. La estabilidad es necesaria,</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">no suficiente.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
