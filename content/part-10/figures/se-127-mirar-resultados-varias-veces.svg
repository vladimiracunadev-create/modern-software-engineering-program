<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 351" width="1000" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Falsos positivos en pruebas A/A cuando se detiene al primer resultado «significativo»</title><desc id="d">Barras con el porcentaje de pruebas A/A, sin diferencia real, que declaran un efecto significativo al 5 por ciento si se mira varias veces: 4,7 por ciento con una mirada, 8,0 con dos, 13,0 con cinco, 21,1 con diez y 25,4 con veinte.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="351" fill="#ffffff"/><text x="240" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">1 mirada (al final)</tspan></text><rect x="250" y="16" width="117.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="375.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="375.5" dy="0">4,7 %</tspan></text><text x="240" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">2 miradas</tspan></text><rect x="250" y="60" width="200" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="458" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="458" dy="0">8,0 %</tspan></text><text x="240" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">5 miradas</tspan></text><rect x="250" y="104" width="325" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="583" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="583" dy="0">13,0 %</tspan></text><text x="240" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">10 miradas</tspan></text><rect x="250" y="148" width="527.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785.5" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="785.5" dy="0">21,1 %</tspan></text><text x="240" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">20 miradas</tspan></text><rect x="250" y="192" width="635" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="893" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="893" dy="0">25,4 %</tspan></text><rect x="10" y="240" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">2 000 pruebas por fila, 2 000 personas por brazo repartidas entre las miradas, ambas ramas con la misma conversión del 10 %.</tspan></text><text x="500" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Detener cuando «sale significativo» infla el error hasta una de cada cuatro pruebas; la solución es fijar antes el tamaño o usar</tspan></text><text x="500" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">métodos secuenciales.</tspan></text><text x="500" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
