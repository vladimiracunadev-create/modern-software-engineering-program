<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 355" width="900" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Personas por brazo para detectar una diferencia con 80 % de potencia y 5 % de error</title><desc id="d">Tabla de tamaños de muestra por brazo: pasar de 10 a 12 por ciento exige 3841 personas por brazo, de 10 a 15 exige 686, de 10 a 20 exige 199 y de 40 a 45 exige 1534; con 500 personas la potencia simulada del primer caso es solo 17,3 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="355" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Cambio a detectar</tspan></text><rect x="210" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">n por brazo</tspan></text><rect x="370" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="627" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">Potencia simulada (4 000 repeticiones)</tspan></text><rect x="10" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">10 % → 12 %</tspan></text><rect x="210" y="56" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">3 841</tspan></text><rect x="370" y="56" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">81,2 % con n = 3 841 · 17,3 % con 500 · 9,4 % con 200</tspan></text><rect x="10" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">10 % → 15 %</tspan></text><rect x="210" y="106" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">686</tspan></text><rect x="370" y="106" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">—</tspan></text><rect x="10" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">10 % → 20 %</tspan></text><rect x="210" y="156" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">199</tspan></text><rect x="370" y="156" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">—</tspan></text><rect x="10" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">40 % → 45 %</tspan></text><rect x="210" y="206" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">1 534</tspan></text><rect x="370" y="206" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">—</tspan></text><rect x="10" y="260" width="880" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Con 500 personas por brazo, un experimento que busca pasar del 10 % al 12 % detecta el efecto una de cada seis veces:</tspan></text><text x="450" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">no sirve para decidir aunque se ejecute bien. Un prototipo con 30 personas solo puede ver efectos enormes.</tspan></text><text x="450" y="341.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
