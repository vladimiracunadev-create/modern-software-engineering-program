<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Personas por brazo para detectar una diferencia con 80 % de potencia y 5 % de error</title><desc id="d">Barras horizontales con las personas por brazo necesarias: pasar de 10 a 12 por ciento exige 3841, de 10 a 15 exige 686, de 10 a 20 exige 199 y de 40 a 45 exige 1534; con 500 personas la potencia simulada del primer caso es solo 17,3 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Personas por brazo para detectar una diferencia con 80 % de potencia y 5 % de error</tspan></text><line x1="184" y1="49" x2="184" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="184" y1="201" x2="184" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="184" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="184" dy="0">0</tspan></text><line x1="356.925" y1="49" x2="356.925" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="356.925" y1="201" x2="356.925" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="356.925" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="356.925" dy="0">1 000</tspan></text><line x1="529.85" y1="49" x2="529.85" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="529.85" y1="201" x2="529.85" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="529.85" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="529.85" dy="0">2 000</tspan></text><line x1="702.775" y1="49" x2="702.775" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="702.775" y1="201" x2="702.775" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="702.775" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702.775" dy="0">3 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="201" x2="875.7" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">4 000</tspan></text><line x1="184" y1="201" x2="875.7" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="174" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">10 % → 12 %</tspan></text><text x="174" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">10 % → 15 %</tspan></text><text x="174" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">10 % → 20 %</tspan></text><text x="174" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">40 % → 45 %</tspan></text><rect x="184" y="55" width="664.205" height="26" rx="3" fill="#102a43"/><text x="855.205" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="855.205" dy="0">3 841</tspan></text><rect x="184" y="93" width="118.627" height="26" rx="3" fill="#102a43"/><text x="309.627" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="309.627" dy="0">686</tspan></text><rect x="184" y="131" width="34.4121" height="26" rx="3" fill="#102a43"/><text x="225.412" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="225.412" dy="0">199</tspan></text><rect x="184" y="169" width="265.267" height="26" rx="3" fill="#102a43"/><text x="456.267" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="456.267" dy="0">1 534</tspan></text><text x="529.85" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="529.85" dy="0">Personas por brazo</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Potencia simulada del primer caso (4 000 repeticiones): 81,2 % con n = 3 841, 17,3 % con 500 y 9,4 % con 200. Con 500</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">personas por brazo un experimento que busca pasar del 10 % al 12 % detecta el efecto una de cada seis veces: no sirve para</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">decidir aunque se ejecute bien. Un prototipo con 30 personas solo puede ver efectos enormes.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
