<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste total del retraso de cuatro trabajos según el criterio de orden</title><desc id="d">Barras horizontales con el coste de retraso acumulado de cuatro trabajos: el orden WSJF D, C, A, B cuesta 119 y es el óptimo de las 24 permutaciones; más corto primero cuesta 122, mayor valor primero 126 y el peor orden 238.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Coste total del retraso de cuatro trabajos según el criterio de orden</tspan></text><line x1="274" y1="49" x2="274" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="201" x2="274" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="397.564" y1="49" x2="397.564" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="397.564" y1="201" x2="397.564" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="397.564" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397.564" dy="0">50</tspan></text><line x1="521.128" y1="49" x2="521.128" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="521.128" y1="201" x2="521.128" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="521.128" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="521.128" dy="0">100</tspan></text><line x1="644.692" y1="49" x2="644.692" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="644.692" y1="201" x2="644.692" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="644.692" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="644.692" dy="0">150</tspan></text><line x1="768.256" y1="49" x2="768.256" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="768.256" y1="201" x2="768.256" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="768.256" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="768.256" dy="0">200</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="201" x2="891.82" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">250</tspan></text><line x1="274" y1="201" x2="891.82" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">WSJF (D, C, A, B)</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Más corto primero (C, D, A, B)</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Mayor valor primero (D, A, C, B)</tspan></text><text x="264" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Peor de las 24 (B, A, C, D)</tspan></text><rect x="274" y="55" width="294.082" height="26" rx="3" fill="#102a43"/><text x="575.082" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="575.082" dy="0">119</tspan></text><rect x="274" y="93" width="301.496" height="26" rx="3" fill="#102a43"/><text x="582.496" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="582.496" dy="0">122</tspan></text><rect x="274" y="131" width="311.381" height="26" rx="3" fill="#102a43"/><text x="592.381" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="592.381" dy="0">126</tspan></text><rect x="274" y="169" width="588.165" height="26" rx="3" fill="#102a43"/><text x="869.165" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="869.165" dy="0">238</tspan></text><text x="582.91" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="582.91" dy="0">Coste total de retraso</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Trabajos (coste de retraso por semana, duración): A (8, 3), B (3, 4), C (5, 1), D (13, 2). Priorizar por valor solo, sin</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mirar duración, cuesta 6 % más que el óptimo; el peor orden cuesta el doble. Con duraciones inciertas el óptimo también lo</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo exacto sobre las 24 permutaciones; no depende del equipo.</tspan></text></svg>
