="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Integración con calendario</tspan></text><rect x="340" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">800</tspan></text><rect x="490" y="240" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0,6 %</tspan></text><rect x="660" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">0,0 %</tspan></text><rect x="10" y="286" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Rediseño de navegación</tspan></text><rect x="340" y="286" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">750</tspan></text><rect x="490" y="286" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0,4 %</tspan></text><rect x="660" y="286" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">0,0 %</tspan></text><rect x="10" y="336" width="800" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="410" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">El orden base se sostiene para los tres primeros, pero el «primero» cambia en cuatro de cada diez</tspan></text><text x="410" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">simulaciones. RICE con todas las entradas estimadas oculta ese margen. Concordancia con valor/esfuerzo sin</tspan></text><text x="410" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">confianza: tau 0,80; con alcance solo: 0,53.</tspan></text><text x="410" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
