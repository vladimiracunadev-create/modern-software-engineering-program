<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 363" width="800" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valor neto de aprender antes de construir (construir ahora vale −5; no hacer nada vale 0)</title><desc id="d">Tabla del valor esperado de hacer una prueba previa a construir: con coste 5 y precisión 0,90 vale 11,3; con coste 10 y precisión 0,80 vale 1,6; con coste 15 y precisión 0,70 es negativo, −8,1, y con coste 25 y precisión 0,90 también, −8,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="800" height="363" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Coste de la prueba</tspan></text><rect x="270" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Precisión de la prueba</tspan></text><rect x="530" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="657" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">Valor esperado neto</tspan></text><rect x="10" y="56" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">5</tspan></text><rect x="270" y="56" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">0,90</tspan></text><rect x="530" y="56" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">+11,3</tspan></text><rect x="10" y="104" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="128.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">10</tspan></text><rect x="270" y="104" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">0,80</tspan></text><rect x="530" y="104" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">+1,6</tspan></text><rect x="10" y="152" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="176.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">15</tspan></text><rect x="270" y="152" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">0,70</tspan></text><rect x="530" y="152" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">−8,1</tspan></text><rect x="10" y="200" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="224.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">25</tspan></text><rect x="270" y="200" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">0,90</tspan></text><rect x="530" y="200" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">−8,7</tspan></text><rect x="10" y="252" width="780" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="400" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="400" dy="0">Parámetros: probabilidad de éxito 35 %, ganancia 100, coste de construir 40. Construir sin aprender vale</tspan></text><text x="400" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="400" dy="0">−5. Una prueba barata y fiable convierte una apuesta negativa en positiva; una prueba cara o poco fiable</tspan></text><text x="400" y="310.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="400" dy="0">destruye el valor. Aprender también cuesta.</tspan></text><text x="400" y="349.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">Cálculo exacto; los números son un modelo ilustrativo.</tspan></text></svg>
