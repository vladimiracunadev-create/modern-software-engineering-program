<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 401" width="920" height="401" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas personas hacen falta para decidir entre «no éxito» (5 %) y «viable» (15 %)</title><desc id="d">Tabla de 2000 simulaciones por fila: con 30 personas se concluye no éxito solo el 21,4 por ciento de las veces cuando la tasa real es 5 y viable el 68,2 cuando es 15; con 120 personas, 84,3 y 95,3; con 240, 99,2 y 99,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="401" fill="#ffffff"/><rect x="10" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="77" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="77" dy="0">n</tspan></text><rect x="150" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="337" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337" dy="0">Concluye «no éxito» (tasa real 5 %)</tspan></text><rect x="530" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Concluye «viable» (tasa real 15 %)</tspan></text><rect x="10" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">30</tspan></text><rect x="150" y="56" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">21,4 %</tspan></text><rect x="530" y="56" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">68,2 %</tspan></text><rect x="10" y="102" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">60</tspan></text><rect x="150" y="102" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">63,7 %</tspan></text><rect x="530" y="102" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">81,3 %</tspan></text><rect x="10" y="148" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">120</tspan></text><rect x="150" y="148" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">84,3 %</tspan></text><rect x="530" y="148" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">95,3 %</tspan></text><rect x="10" y="194" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">240</tspan></text><rect x="150" y="194" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">99,2 %</tspan></text><rect x="530" y="194" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">99,8 %</tspan></text><rect x="10" y="240" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">480</tspan></text><rect x="150" y="240" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">100 %</tspan></text><rect x="530" y="240" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">100 %</tspan></text><rect x="10" y="290" width="900" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">Criterio: «no éxito» si el límite superior del intervalo de Wilson al 90 % queda bajo 12 %; «viable» si el inferior</tspan></text><text x="460" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">supera 6 %. Con 30 personas la mayoría de las pruebas queda en la zona gris: el resultado correcto es «no se puede</tspan></text><text x="460" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">decidir todavía», y debe estar previsto.</tspan></text><text x="460" y="387.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
