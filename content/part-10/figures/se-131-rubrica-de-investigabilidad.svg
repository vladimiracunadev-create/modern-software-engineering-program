<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 411" width="900" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rúbrica de investigabilidad: regla automática frente a etiqueta manual</title><desc id="d">Tabla: con los doce enunciados de ajuste, la regla coincide con las etiquetas manuales en el 100 por ciento y kappa vale 1; con tres casos nuevos, la regla rechaza uno que la persona acepta, vendedoras pierden pedidos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="411" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Enunciados</tspan></text><rect x="510" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Coincidencia</tspan></text><rect x="740" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Resultado</tspan></text><rect x="10" y="56" width="494" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">12 enunciados con los que se escribió la regla</tspan></text><rect x="510" y="56" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">100 %</tspan></text><rect x="740" y="56" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">κ = 1,00</tspan></text><rect x="10" y="120" width="494" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="144.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Caso nuevo: «Las vendedoras pierden pedidos cuando el teléfono se</tspan></text><text x="257" y="160.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">queda sin red»</tspan></text><rect x="510" y="120" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">Regla: no · Persona: sí</tspan></text><rect x="740" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Desacuerdo</tspan></text><rect x="10" y="184" width="494" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Caso nuevo: «Hay que repensar el flujo de pagos»</tspan></text><rect x="510" y="184" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">Regla: no · Persona: no</tspan></text><rect x="740" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Acuerdo</tspan></text><rect x="10" y="248" width="494" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="280.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Caso nuevo: «Los alumnos no entienden las notas»</tspan></text><rect x="510" y="248" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">Regla: no · Persona: no</tspan></text><rect x="740" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Acuerdo</tspan></text><rect x="10" y="316" width="880" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Las etiquetas manuales son de una sola persona (el autor): sin segunda persona no hay acuerdo entre codificadores,</tspan></text><text x="450" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">solo coherencia propia. Un kappa de 1 sobre los ejemplos de ajuste no predice el comportamiento con casos nuevos.</tspan></text><text x="450" y="397.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
