<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rúbrica de investigabilidad: regla automática frente a etiqueta manual</title><desc id="d">Barras apiladas horizontales con la coincidencia entre la regla y la etiqueta manual: los doce enunciados de ajuste coinciden todos, con kappa igual a 1, y de tres casos nuevos coinciden dos y discrepa uno, vendedoras pierden pedidos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Rúbrica de investigabilidad: regla automática frente a etiqueta manual</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Coinciden</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Discrepan</tspan></text><line x1="284" y1="77" x2="284" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="165" x2="284" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="402.34" y1="77" x2="402.34" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="402.34" y1="165" x2="402.34" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="402.34" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402.34" dy="0">2,5</tspan></text><line x1="520.68" y1="77" x2="520.68" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="520.68" y1="165" x2="520.68" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="520.68" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="520.68" dy="0">5</tspan></text><line x1="639.02" y1="77" x2="639.02" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="639.02" y1="165" x2="639.02" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="639.02" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="639.02" dy="0">7,5</tspan></text><line x1="757.36" y1="77" x2="757.36" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="757.36" y1="165" x2="757.36" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="757.36" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757.36" dy="0">10</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">12,5</tspan></text><line x1="284" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Enunciados con los que se escribió</tspan></text><text x="274" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">la regla</tspan></text><text x="274" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Casos nuevos</tspan></text><rect x="284" y="84" width="568.032" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="568.016" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="568.016" dy="0">12</tspan></text><rect x="852.032" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="859.032" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="859.032" dy="0">12</tspan></text><rect x="284" y="128" width="94.672" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="331.336" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="331.336" dy="0">2</tspan></text><rect x="378.672" y="128" width="47.336" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="402.34" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402.34" dy="0">1</tspan></text><text x="433.008" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="433.008" dy="0">3</tspan></text><text x="579.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="579.85" dy="0">Enunciados</tspan></text><rect x="10" y="223" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Discrepa «Las vendedoras pierden pedidos cuando el teléfono se queda sin red» (regla: no; persona: sí). Las etiquetas</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">manuales son de una sola persona (el autor): sin segunda persona no hay acuerdo entre codificadores, solo coherencia</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">propia. Un kappa de 1 sobre los ejemplos de ajuste no predice el comportamiento con casos nuevos.</tspan></text><text x="470" y="328.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
