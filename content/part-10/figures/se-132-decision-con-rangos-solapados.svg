<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 249" width="940" height="249" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos opciones con beneficios inciertos: ¿alcanza la mediana para decidir?</title><desc id="d">Gráfico de intervalos: la opción A va de 10 a 60 con mediana 30,4 y la opción B de 0 a 70 con mediana 32,6; en 20 000 sorteos A supera a B el 47,1 por ciento de las veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="249" fill="#ffffff"/><text x="260" y="40" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Opción A (beneficio, miles)</tspan></text><rect x="351.333" y="24" width="406.667" height="24" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><line x1="517.253" y1="18" x2="517.253" y2="54" stroke="#142231" stroke-width="3"/><text x="517.253" y="68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.253" dy="0">mediana 30,4</tspan></text><text x="347.333" y="41" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="347.333" dy="0">10</tspan></text><text x="762" y="41" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="762" dy="0">60</tspan></text><text x="260" y="94" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Opción B (beneficio, miles)</tspan></text><rect x="270" y="78" width="569.333" height="24" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><line x1="535.147" y1="72" x2="535.147" y2="108" stroke="#142231" stroke-width="3"/><text x="535.147" y="122" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="535.147" dy="0">mediana 32,6</tspan></text><text x="266" y="95" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="266" dy="0">0</tspan></text><text x="843.333" y="95" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="843.333" dy="0">70</tspan></text><line x1="270" y1="126" x2="880" y2="126" stroke="#8a9aa3" stroke-width="1.4"/><text x="880" y="144" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="880" dy="0">0 … 75 miles</tspan></text><rect x="10" y="154" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">P(A mejor que B) = 47,1 %: es una moneda al aire. B tiene la mediana más alta y también el peor extremo (0). Cuando los</tspan></text><text x="470" y="195.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">rangos se solapan así, el brief debe proponer aprender más o elegir la opción reversible, no declarar un ganador.</tspan></text><text x="470" y="235.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
