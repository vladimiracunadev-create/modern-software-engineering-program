<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mismas señales, tres ponderaciones, tres órdenes distintos</title><desc id="d">Barras agrupadas con la puntuación de tres opciones bajo tres ponderaciones de las mismas señales: pesar igual da primero aviso de sesión con 12; comportamiento y compromiso por tres da primero recuperar borradores con 22; compromiso por cinco da primero panel docente con 20.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mismas señales, tres ponderaciones, tres órdenes distintos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aviso de sesión</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Recuperar borradores</tspan></text><rect x="375.9" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="395.9" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="395.9" dy="0">Panel docente</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="319" x2="71.08" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="263" x2="71.08" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="207" x2="71.08" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="151" x2="71.08" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">25</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Puntuación</text><rect x="99.3773" y="240.6" width="72.7929" height="134.4" rx="3" fill="#946512"/><text x="135.774" y="234.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135.774" dy="0">12</tspan></text><rect x="176.17" y="263" width="72.7929" height="112" rx="3" fill="#087f8c"/><text x="212.567" y="257" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">10</tspan></text><rect x="252.963" y="296.6" width="72.7929" height="78.4" rx="3" fill="#102a43"/><text x="289.36" y="290.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="289.36" dy="0">7</tspan></text><text x="212.567" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Todas las señales valen igual</tspan></text><rect x="382.351" y="173.4" width="72.7929" height="201.6" rx="3" fill="#946512"/><text x="418.747" y="167.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="418.747" dy="0">18</tspan></text><rect x="459.144" y="128.6" width="72.7929" height="246.4" rx="3" fill="#087f8c"/><text x="495.54" y="122.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">22</tspan></text><rect x="535.936" y="207" width="72.7929" height="168" rx="3" fill="#102a43"/><text x="572.333" y="201" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="572.333" dy="0">15</tspan></text><text x="495.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Comportamiento y compromiso ×3</tspan></text><rect x="665.324" y="207" width="72.7929" height="168" rx="3" fill="#946512"/><text x="701.72" y="201" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="701.72" dy="0">15</tspan></text><rect x="742.117" y="162.2" width="72.7929" height="212.8" rx="3" fill="#087f8c"/><text x="778.513" y="156.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">19</tspan></text><rect x="818.91" y="151" width="72.7929" height="224" rx="3" fill="#102a43"/><text x="855.306" y="145" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855.306" dy="0">20</tspan></text><text x="778.513" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Compromiso ×5, comportamiento ×2</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Señales (dijeron, hicieron, se comprometieron): aviso de sesión (9, 3, 0), recuperar borradores (4, 5, 1), panel docente</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(3, 1, 3). El orden depende más del peso que del dato; el brief debe declarar el peso y mostrar que la conclusión se</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sostiene bajo varios.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo exacto con señales sintéticas; los pesos son supuestos del autor.</tspan></text></svg>
