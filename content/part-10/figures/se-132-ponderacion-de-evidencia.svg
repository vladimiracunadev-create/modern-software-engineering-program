<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 345" width="920" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mismas señales, tres ponderaciones, tres órdenes distintos</title><desc id="d">Tabla: con las mismas señales de tres opciones, pesar igual da primero aviso de sesión con 12; pesar comportamiento y compromiso por tres da primero recuperar borradores con 22; pesar el compromiso por cinco da primero panel docente con 20.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="345" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Ponderación</tspan></text><rect x="280" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Primero</tspan></text><rect x="490" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Segundo</tspan></text><rect x="710" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Tercero</tspan></text><rect x="10" y="56" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Todas las señales valen igual</tspan></text><rect x="280" y="56" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">Aviso de sesión (12)</tspan></text><rect x="490" y="56" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">Recuperar borradores (10)</tspan></text><rect x="710" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Panel docente (7)</tspan></text><rect x="10" y="114" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Comportamiento y compromiso ×3</tspan></text><rect x="280" y="114" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">Recuperar borradores (22)</tspan></text><rect x="490" y="114" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">Aviso de sesión (18)</tspan></text><rect x="710" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Panel docente (15)</tspan></text><rect x="10" y="172" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Compromiso ×5, comportamiento ×2</tspan></text><rect x="280" y="172" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">Panel docente (20)</tspan></text><rect x="490" y="172" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">Recuperar borradores (19)</tspan></text><rect x="710" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Aviso de sesión (15)</tspan></text><rect x="10" y="234" width="900" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">Señales (dijeron, hicieron, se comprometieron): aviso de sesión (9, 3, 0), recuperar borradores (4, 5, 1), panel docente</tspan></text><text x="460" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">(3, 1, 3). El orden depende más del peso que del dato; el brief debe declarar el peso y mostrar que la conclusión se</tspan></text><text x="460" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">sostiene bajo varios.</tspan></text><text x="460" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Cálculo exacto con señales sintéticas; los pesos son supuestos del autor.</tspan></text></svg>
