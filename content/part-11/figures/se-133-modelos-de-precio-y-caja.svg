"0">Caja acumulada (unidades monetarias ficticias)</tspan></text><rect x="10" y="375" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Mismos centros (150–1 500 alumnos, moda 400), mismos costos (0,6 por alumno, 50 por centro, 12 000 fijos al mes). Cambia</tspan></text><text x="470" y="416.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solo cómo se cobra: el precio plano deja de cubrir a los centros grandes y el gratuito paga el servicio de todos con la</tspan></text><text x="470" y="433.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">conversión de unos pocos. Unidades monetarias ficticias.</tspan></text><text x="470" y="480.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
