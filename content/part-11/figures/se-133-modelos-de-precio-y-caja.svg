<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 498" width="940" height="498" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres modelos de precio sobre los mismos centros: de la caja mínima a la caja al mes 36</title><desc id="d">Mancuernas con la caja mínima y la caja al mes 36 de seis simulaciones: el precio por alumno sube de −17 516 a +1 287 537 con abandono de 2 por ciento y de −21 094 a +755 245 con 5; el precio plano termina en +21 759 o en −61 514; el gratuito con 10 por ciento de conversión termina en −657 924 y con 52 por ciento en +30 208.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="498" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres modelos de precio sobre los mismos centros: de la caja mínima a la caja al mes 36</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Caja mínima</tspan></text><circle cx="152.94" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Caja al mes 36</tspan></text><line x1="444.54" y1="77" x2="444.54" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="444.54" y1="317" x2="444.54" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="444.54" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="444.54" dy="0">−1 00