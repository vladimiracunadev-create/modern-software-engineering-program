<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 307" width="940" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de terminar dentro de la suma de las medianas</title><desc id="d">Barras con la probabilidad de que el total real no supere la suma de las medianas: 32,1 por ciento con cinco tareas, 11,7 con veinte tareas independientes, 43,7 con veinte tareas correlacionadas y 26,1 con veinte tareas de menor dispersión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="307" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">5 tareas, σ 0,6, independientes</tspan></text><rect x="340" y="16" width="192.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540.6" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="540.6" dy="0">32,1 %</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">20 tareas, σ 0,6, independientes</tspan></text><rect x="340" y="60" width="70.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="418.2" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="418.2" dy="0">11,7 %</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">20 tareas, σ 0,6, correlación 0,5</tspan></text><rect x="340" y="104" width="262.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="610.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="610.2" dy="0">43,7 %</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">20 tareas, σ 0,3, independientes</tspan></text><rect x="340" y="148" width="156.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="504.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="504.6" dy="0">26,1 %</tspan></text><rect x="10" y="196" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con 20 tareas de mediana 5 días (suma 100), el total tiene mediana 118,5, percentil 80 de 134,3 y percentil 95 de 150,8.</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sumar medianas no da una mediana: promete un plazo que se cumple una de cada ocho veces. Con correlación 0,5 la</tspan></text><text x="470" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">probabilidad sube, pero el percentil 95 salta a 224,3.</tspan></text><text x="470" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
