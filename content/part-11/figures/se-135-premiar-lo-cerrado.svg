<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 317" width="1010" height="317" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Premiar lo cerrado: el número sube y lo resuelto baja</title><desc id="d">Tabla de diez agentes durante doce semanas: con la meta de tickets cerrados se cierran 760 tickets y se resuelven 512, y el 41,2 por ciento de lo cerrado se reabre; con la meta de resueltos sin reabrir se cierran 600 y se resuelven 560, con 5,7 por ciento de reapertura.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="317" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Situación</tspan></text><rect x="430" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Cerrados</tspan></text><rect x="620" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="712" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712" dy="0">Resueltos (no</tspan></text><text x="712" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712" dy="0">reabiertos)</tspan></text><rect x="810" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="902" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="902" dy="0">Reabiertos de lo</tspan></text><text x="902" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="902" dy="0">cerrado</tspan></text><rect x="10" y="56" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Semana 4, antes de anunciar la meta</tspan></text><rect x="430" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">50</tspan></text><rect x="620" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">45</tspan></text><rect x="810" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">10 %</tspan></text><rect x="10" y="110" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Semanas 5 a 12, meta «tickets cerrados»</tspan></text><rect x="430" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">760 en 12 semanas</tspan></text><rect x="620" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">512</tspan></text><rect x="810" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">41,2 %</tspan></text><rect x="10" y="164" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Semanas 5 a 12, meta «resueltos sin reabrir»</tspan></text><rect x="430" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">600 en 12 semanas</tspan></text><rect x="620" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">560</tspan></text><rect x="810" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">5,7 %</tspan></text><rect x="10" y="222" width="990" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="505" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">La métrica premiada subió 26,7 % (600 a 760) y el resultado que importa bajó 8,6 % (560 a 512). Es un modelo con supuestos del autor</tspan></text><text x="505" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">(cerrar rápido eleva de 5 a 7 los cierres por agente y la reapertura de 8 % a 45 %): muestra el mecanismo, no mide a ningún equipo.</tspan></text><text x="505" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
