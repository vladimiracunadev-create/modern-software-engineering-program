<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intervalo de Wilson de la retención a 30 días según el tamaño de la cohorte</title><desc id="d">Intervalos de Wilson de la retención a 30 días: con 50 personas va de 22,4 a 47,8 por ciento, con 200 de 27,8 a 40,8, con 1 000 de 31,1 a 37,0 y con 5 000 de 32,7 a 35,3; la retención real es 34,2 y la cuenta ingenua que incluye a quienes no cumplieron 30 días da 27,0, fuera de los dos intervalos mayores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Intervalo de Wilson de la retención a 30 días según el tamaño de la cohorte</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">inferior</tspan></text><polygon points="130.32,44.1 136.92,56.4 123.72,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">superior</tspan></text><line x1="174" y1="77" x2="174" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="174" y1="373" x2="174" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="174" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="174" dy="0">0</tspan></text><line x1="317.2" y1="77" x2="317.2" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="317.2" y1="373" x2="317.2" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="317.2" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317.2" dy="0">10</tspan></text><line x1="460.4" y1="77" x2="460.4" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="460.4" y1="373" x2="460.4" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="460.4" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="460.4" dy="0">20</tspan></text><line x1="603.6" y1="77" x2="603.6" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="603.6" y1="373" x2="603.6" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="603.6" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="603.6" dy="0">30</tspan></text><line x1="746.8" y1="77" x2="746.8" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="746.8" y1="373" x2="746.8" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="746.8" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="746.8" dy="0">40</tspan></text><line x1="890" y1="77" x2="890" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="373" x2="890" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">50</tspan></text><line x1="174" y1="373" x2="890" y2="373" stroke="#5b7280" stroke-width="1.6"/><text x="144" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">n = 50</tspan></text><text x="144" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">n = 200</tspan></text><text x="144" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">n = 1 000</tspan></text><text x="144" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">n = 5 000</tspan></text><line x1="494.768" y1="114" x2="858.496" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="487.768" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="494.768" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="494.768" dy="0">22,4</tspan></text><polygon points="858.496,105.95 866.196,120.3 850.796,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="858.496" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="858.496" dy="0">47,8</tspan></text><line x1="572.096" y1="188" x2="758.256" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="565.096" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="572.096" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="572.096" dy="0">27,8</tspan></text><polygon points="758.256,179.95 765.956,194.3 750.556,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="758.256" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="758.256" dy="0">40,8</tspan></text><line x1="619.352" y1="262" x2="703.84" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="612.352" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="619.352" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="619.352" dy="0">31,1</tspan></text><polygon points="703.84,253.95 711.54,268.3 696.14,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="703.84" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="703.84" dy="0">37,0</tspan></text><line x1="642.264" y1="336" x2="679.496" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="635.264" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="642.264" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642.264" dy="0">32,7</tspan></text><polygon points="679.496,327.95 687.196,342.3 671.796,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="679.496" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="679.496" dy="0">35,3</tspan></text><line x1="663.744" y1="77" x2="663.744" y2="373" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="668.744" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="668.744" dy="0">real 34,2 %</tspan></text><line x1="560.64" y1="77" x2="560.64" y2="373" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="565.64" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="565.64" dy="0">ingenua 27,0 %</tspan></text><text x="532" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="532" dy="0">Retención a 30 días (%)</tspan></text><rect x="10" y="431" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="455.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Se simularon 3 000 personas registradas a lo largo de 60 días; la devolución a 30 días tiene probabilidad real 0,34. Las</tspan></text><text x="470" y="472.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cohortes recientes parecen peores solo porque aún no pasó el tiempo. Un intervalo estrecho no corrige un sesgo de medición:</tspan></text><text x="470" y="489.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">solo mide el azar de muestrear.</tspan></text><text x="470" y="536.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
