<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 642" width="940" height="642" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cada campo de telemetría estrecha el grupo hasta señalar a una persona (10 000 dispositivos)</title><desc id="d">Barras horizontales con el porcentaje de dispositivos únicos y de dispositivos en grupos de menos de cinco al sumar campos: con sistema operativo y versión ninguno es único; con idioma regional 0,3 y 3,4 por ciento; con resolución 9,8 y 42,9; con zona horaria 38,3 y 71,1; y con el identificador del centro 99,4 y 100,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="642" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cada campo de telemetría estrecha el grupo hasta señalar a una persona (10 000 dispositivos)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Únicos</tspan></text><rect x="109.24" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">En grupos con menos de 5</tspan></text><line x1="294" y1="77" x2="294" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="461" x2="294" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="410.34" y1="77" x2="410.34" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="410.34" y1="461" x2="410.34" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="410.34" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410.34" dy="0">20</tspan></text><line x1="526.68" y1="77" x2="526.68" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="526.68" y1="461" x2="526.68" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="526.68" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="526.68" dy="0">40</tspan></text><line x1="643.02" y1="77" x2="643.02" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="643.02" y1="461" x2="643.02" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="643.02" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="643.02" dy="0">60</tspan></text><line x1="759.36" y1="77" x2="759.36" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="759.36" y1="461" x2="759.36" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="759.36" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.36" dy="0">80</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="461" x2="875.7" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="294" y1="461" x2="875.7" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Sistema operativo (6 grupos)</tspan></text><text x="284" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">+ versión de la aplicación (72)</tspan></text><text x="284" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">+ idioma regional (489)</tspan></text><text x="284" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">+ resolución de pantalla (2 580)</tspan></text><text x="284" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">+ zona horaria (5 575)</tspan></text><text x="284" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">+ identificador del centro (9 969)</tspan></text><rect x="294" y="83" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="303" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0,0</tspan></text><rect x="294" y="110.5" width="2" height="24.5" rx="3" fill="#946512"/><text x="303" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0,0</tspan></text><rect x="294" y="147" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="303" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0,0</tspan></text><rect x="294" y="174.5" width="2" height="24.5" rx="3" fill="#946512"/><text x="303" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0,0</tspan></text><rect x="294" y="211" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="303" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0,3</tspan></text><rect x="294" y="238.5" width="19.7778" height="24.5" rx="3" fill="#946512"/><text x="320.778" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="320.778" dy="0">3,4</tspan></text><rect x="294" y="275" width="57.0066" height="24.5" rx="3" fill="#c0432f"/><text x="358.007" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="358.007" dy="0">9,8</tspan></text><rect x="294" y="302.5" width="249.549" height="24.5" rx="3" fill="#946512"/><text x="550.549" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="550.549" dy="0">42,9</tspan></text><rect x="294" y="339" width="222.791" height="24.5" rx="3" fill="#c0432f"/><text x="523.791" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="523.791" dy="0">38,3</tspan></text><rect x="294" y="366.5" width="413.589" height="24.5" rx="3" fill="#946512"/><text x="714.589" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="714.589" dy="0">71,1</tspan></text><rect x="294" y="403" width="578.21" height="24.5" rx="3" fill="#c0432f"/><text x="879.21" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="879.21" dy="0">99,4</tspan></text><rect x="294" y="430.5" width="581.7" height="24.5" rx="3" fill="#946512"/><text x="882.7" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><text x="584.85" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Dispositivos (%)</tspan></text><rect x="10" y="519" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ningún campo es un dato personal por sí solo. La combinación sí lo es en la práctica. Quitar el centro y la zona horaria</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">deja sistema operativo + idioma: 42 grupos y 0 % en grupos de menos de 5. El diseño del evento decide qué campos se</tspan></text><text x="470" y="577.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">recogen; el consentimiento no los vuelve inocuos.</tspan></text><text x="470" y="624.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
