<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 611" width="860" height="611" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Control de consentimiento: 3 pruebas del camino feliz frente a 9 pruebas dirigidas</title><desc id="d">Tabla de once mutantes de un rastreador con consentimiento: las tres primeras pruebas matan 2 y las nueve pruebas completas matan 10; el undécimo es equivalente y ninguna prueba puede distinguirlo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="860" height="611" fill="#ffffff"/><rect x="10" y="12" width="534" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="277" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="277" dy="0">Mutante</tspan></text><rect x="550" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">3 pruebas</tspan></text><rect x="700" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">9 pruebas</tspan></text><rect x="10" y="56" width="534" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="76.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277" dy="0">M1 el estado denegado envía</tspan></text><rect x="550" y="56" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">mata</tspan></text><rect x="700" y="56" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">mata</tspan></text><rect x="10" y="96" width="534" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="116.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277" dy="0">M2 el estado desconocido envía de inmediato</tspan></text><rect x="550" y="96" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="116.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">mata</tspan></text><rect x="700" y="96" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="116.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">mata</tspan></text><rect x="10" y="136" width="534" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="156.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277" dy="0">M3 negar no vacía el búfer</tspan></text><rect x="550" y="136" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="156.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">sobrevive</tspan></text><rect x="700" y="136" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="156.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">mata</tspan></text><rect x="10" y="176" width="534" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277" dy="0">M4 retirar el consentimiento no frena el envío</tspan></text><rect x="550" y="176" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">sobrevive</tspan></text><rect x="700" y="176" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">mata</tspan></text><rect x="10" y="216" width="534" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277" dy="0">M5 deja pasar el correo</tspan></text><rect x="550" y="216" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">sobrevive</tspan></text><rect x="700" y="216" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">mata</tspan></text><rect x="10" y="256" width="534" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="276.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277" dy="0">M6 acepta eventos no declarados</tspan></text><rect x="550" y="256" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="276.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">sobrevive</tspan></text><rect x="700" y="256" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="276.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">mata</tspan></text><rect x="10" y="296" width="534" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="316.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277" dy="0">M7 búfer sin tope</tspan></text><rect x="550" y="296" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">sobrevive</tspan></text><rect x="700" y="296" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">mata</tspan></text><rect x="10" y="336" width="534" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="356.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277" dy="0">M8 al conceder no vacía el búfer</tspan></text><rect x="550" y="336" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">sobrevive</tspan></text><rect x="700" y="336" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">mata</tspan></text><rect x="10" y="376" width="534" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="396.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277" dy="0">M9 invierte el orden al vaciar</tspan></text><rect x="550" y="376" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="396.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">sobrevive</tspan></text><rect x="700" y="376" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="396.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">mata</tspan></text><rect x="10" y="416" width="534" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="436.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277" dy="0">M10 conserva user_id</tspan></text><rect x="550" y="416" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="436.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">sobrevive</tspan></text><rect x="700" y="416" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="436.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">mata</tspan></text><rect x="10" y="456" width="534" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="476.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277" dy="0">M11 borra una variable sin uso (equivalente)</tspan></text><rect x="550" y="456" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="476.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">sobrevive</tspan></text><rect x="700" y="456" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="476.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">sobrevive</tspan></text><rect x="10" y="500" width="840" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="430" y="524.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="430" dy="0">Puntaje de mutación: 2 de 11 con las pruebas del camino feliz y 10 de 11 con las completas. El mutante</tspan></text><text x="430" y="541.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="430" dy="0">equivalente sobrevive con razón: el código resultante se comporta igual. Un 100 % no se espera; hay que revisar</tspan></text><text x="430" y="558.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="430" dy="0">cada superviviente y decidir.</tspan></text><text x="430" y="597.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Código y pruebas reales ejecutados; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
