<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 263" width="940" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sesgo de la métrica medida solo con quienes aceptan</title><desc id="d">Barras con el sesgo relativo de las entregas semanales por persona estimadas solo con quienes consienten: 15,7 por ciento de sobreestimación si consiente el 42 por ciento, 9,8 con 54 y 5,1 con 67.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="263" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Consiente 42 % de las personas</tspan></text><rect x="310" y="16" width="219.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="537.8" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="537.8" dy="0">+15,7 %</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Consiente 54 %</tspan></text><rect x="310" y="60" width="137.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455.2" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="455.2" dy="0">+9,8 %</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Consiente 67 %</tspan></text><rect x="310" y="104" width="71.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="389.4" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="389.4" dy="0">+5,1 %</tspan></text><rect x="10" y="152" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La probabilidad de aceptar crece con el compromiso, de modo que quienes aceptan usan más el producto. Reponderar por el</tspan></text><text x="470" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">plan (una variable que sí se conoce) deja el sesgo casi igual (15,7 / 9,7 / 5,0 %): corrige lo que explica el plan, no el</tspan></text><text x="470" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">compromiso. Más consentimiento reduce el sesgo, pero no lo elimina.</tspan></text><text x="470" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
