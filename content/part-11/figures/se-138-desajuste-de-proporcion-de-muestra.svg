<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 307" width="940" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Con qué frecuencia el control de proporciones detecta una asignación rota</title><desc id="d">Barras con la fracción de 1000 experimentos en que el control de proporción de muestra da alarma: 0,2 por ciento si se pierde el 0,5 por ciento del grupo tratado, 0,9 con 1, 10,7 con 2 y 95,8 con 5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="307" fill="#ffffff"/><text x="320" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Pérdida de 0,5 % del grupo tratado</tspan></text><rect x="330" y="16" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="342" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="342" dy="0">0,2 %</tspan></text><text x="320" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Pérdida de 1 %</tspan></text><rect x="330" y="60" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="342" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="342" dy="0">0,9 %</tspan></text><text x="320" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Pérdida de 2 %</tspan></text><rect x="330" y="104" width="38.52" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="376.52" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="376.52" dy="0">10,7 %</tspan></text><text x="320" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Pérdida de 5 %</tspan></text><rect x="330" y="148" width="344.88" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="682.88" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="682.88" dy="0">95,8 %</tspan></text><rect x="10" y="196" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 10 000 personas y asignación correcta, el control (p &lt; 0,001) dio 0 alarmas falsas en 1 000 experimentos. Pero una</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pérdida de 2 % pasa inadvertida el 89 % de las veces, y eliminar al 3 % menos comprometido del grupo tratado ya desplaza la</tspan></text><text x="470" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">diferencia 0,046 desviaciones típicas, del orden de un efecto real pequeño.</tspan></text><text x="470" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
