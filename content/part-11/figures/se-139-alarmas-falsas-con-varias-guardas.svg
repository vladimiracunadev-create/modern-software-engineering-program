<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 411" width="990" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alarmas falsas al vigilar varias guardas en un experimento sin diferencia</title><desc id="d">Tabla de 1000 experimentos sin diferencia real: con una guarda, 4,7 por ciento dan alarma; con diez, 41,4; con veinte, 65,2. Dividir el umbral entre el número de guardas devuelve la tasa a cerca de 5 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="411" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Número de guardas</tspan></text><rect x="200" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="342" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="342" dy="0">Alguna alarma con α = 0,05 cada</tspan></text><text x="342" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="342" dy="0">una</tspan></text><rect x="490" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Teoría 1 − 0,95^K</tspan></text><rect x="720" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Alguna alarma con α = 0,05/K</tspan></text><rect x="10" y="56" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">1</tspan></text><rect x="200" y="56" width="284" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">4,7 %</tspan></text><rect x="490" y="56" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">5,0 %</tspan></text><rect x="720" y="56" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">4,7 %</tspan></text><rect x="10" y="104" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="128.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">3</tspan></text><rect x="200" y="104" width="284" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">15,8 %</tspan></text><rect x="490" y="104" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">14,3 %</tspan></text><rect x="720" y="104" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">5,1 %</tspan></text><rect x="10" y="152" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="176.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">5</tspan></text><rect x="200" y="152" width="284" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">22,1 %</tspan></text><rect x="490" y="152" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">22,6 %</tspan></text><rect x="720" y="152" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">5,1 %</tspan></text><rect x="10" y="200" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="224.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">10</tspan></text><rect x="200" y="200" width="284" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">41,4 %</tspan></text><rect x="490" y="200" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">40,1 %</tspan></text><rect x="720" y="200" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">5,1 %</tspan></text><rect x="10" y="248" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="272.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">20</tspan></text><rect x="200" y="248" width="284" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">65,2 %</tspan></text><rect x="490" y="248" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">64,2 %</tspan></text><rect x="720" y="248" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">5,3 %</tspan></text><rect x="10" y="300" width="970" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">La corrección tiene un precio: con 800 personas por brazo y un daño real de 0,15 desviaciones, la potencia baja de 85,4 % (α =</tspan></text><text x="495" y="341.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">0,05) a 59,0 % (α = 0,005). Vigilar mucho sin corregir produce alarmas inútiles; corregir sin aumentar la muestra deja pasar daños</tspan></text><text x="495" y="358.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">reales.</tspan></text><text x="495" y="397.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
