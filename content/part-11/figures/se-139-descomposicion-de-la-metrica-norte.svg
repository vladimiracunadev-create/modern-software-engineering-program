<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 323" width="990" height="323" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Métrica norte = alcance × frecuencia × éxito: quién explica el cambio</title><desc id="d">Tabla: la métrica norte pasa de 22 568 a 26 220 (+16,2 por ciento); el alcance explica 93,2 por ciento del cambio en escala logarítmica, la frecuencia resta 21,9 y el éxito suma 28,7. Por sustitución secuencial, la contribución de cada factor depende del orden y varía dentro de un rango.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="323" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Factor</tspan></text><rect x="330" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Cambio</tspan></text><rect x="560" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Parte del cambio</tspan></text><text x="652" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">(logaritmos)</tspan></text><rect x="750" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Contribución por</tspan></text><text x="862" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">sustitución (6 órdenes)</tspan></text><rect x="10" y="56" width="314" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Alcance (centros o estudiantes activos)</tspan></text><rect x="330" y="56" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">8 000 a 9 200 (+15,0 %)</tspan></text><rect x="560" y="56" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">93,2 %</tspan></text><rect x="750" y="56" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">3 276 a 3 534</tspan></text><rect x="10" y="112" width="314" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Frecuencia (entregas por activo)</tspan></text><rect x="330" y="112" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">3,1 a 3,0 (−3,2 %)</tspan></text><rect x="560" y="112" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">−21,9 %</tspan></text><rect x="750" y="112" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">−874 a −728</tspan></text><rect x="10" y="168" width="314" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Éxito (entregas aceptadas)</tspan></text><rect x="330" y="168" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">0,91 a 0,95 (+4,4 %)</tspan></text><rect x="560" y="168" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">28,7 %</tspan></text><rect x="750" y="168" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">960 a 1 141</tspan></text><rect x="10" y="228" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="252.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Total: 22 568 a 26 220. La descomposición logarítmica suma 100 % sin depender del orden; la sustitución secuencial da rangos. Con</tspan></text><text x="495" y="269.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">3 % de error en cada lectura, el factor principal cambia en 8,5 % de los casos: es robusto aquí, pero no en cambios pequeños.</tspan></text><text x="495" y="309.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Cálculo determinista y simulación de ruido con semilla fija.</tspan></text></svg>
