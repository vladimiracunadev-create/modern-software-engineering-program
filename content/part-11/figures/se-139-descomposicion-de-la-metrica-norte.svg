<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Métrica norte = alcance × frecuencia × éxito: parte del cambio que explica cada factor</title><desc id="d">Barras con la parte del cambio de la métrica norte (de 22 568 a 26 220, más 16,2 por ciento) que explica cada factor en logaritmos: el alcance 93,2 por ciento, la frecuencia menos 21,9 y el éxito 28,7; suman 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Métrica norte = alcance × frecuencia × éxito: parte del cambio que explica cada factor</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin aporte (0)</tspan></text><circle cx="175.56" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Parte que explica</tspan></text><line x1="272.3" y1="77" x2="272.3" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="272.3" y1="197" x2="272.3" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="272.3" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="272.3" dy="0">−25</tspan></text><line x1="389.38" y1="77" x2="389.38" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="389.38" y1="197" x2="389.38" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="389.38" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.38" dy="0">0</tspan></text><line x1="506.46" y1="77" x2="506.46" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="506.46" y1="197" x2="506.46" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="506.46" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.46" dy="0">25</tspan></text><line x1="623.54" y1="77" x2="623.54" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="623.54" y1="197" x2="623.54" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="623.54" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="623.54" dy="0">50</tspan></text><line x1="740.62" y1="77" x2="740.62" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="740.62" y1="197" x2="740.62" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="740.62" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="740.62" dy="0">75</tspan></text><line x1="857.7" y1="77" x2="857.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="857.7" y1="197" x2="857.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="857.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857.7" dy="0">100</tspan></text><line x1="272.3" y1="197" x2="857.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Alcance (+15,0 %)</tspan></text><text x="204" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Frecuencia (−3,2 %)</tspan></text><text x="204" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Éxito (+4,4 %)</tspan></text><line x1="389.38" y1="97" x2="825.854" y2="97" stroke="#087f8c" stroke-width="4"/><circle cx="389.38" cy="97" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="825.854" cy="97" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="377.38" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="377.38" dy="0">0,0</tspan></text><text x="837.854" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="837.854" dy="0">93,2</tspan></text><line x1="389.38" y1="137" x2="286.818" y2="137" stroke="#c0432f" stroke-width="4"/><circle cx="389.38" cy="137" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="286.818" cy="137" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="401.38" y="141.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="401.38" dy="0">0,0</tspan></text><text x="274.818" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274.818" dy="0">−21,9</tspan></text><line x1="389.38" y1="177" x2="523.788" y2="177" stroke="#087f8c" stroke-width="4"/><circle cx="389.38" cy="177" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="523.788" cy="177" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="377.38" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="377.38" dy="0">0,0</tspan></text><text x="535.788" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="535.788" dy="0">28,7</tspan></text><text x="565" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="565" dy="0">Parte del cambio (% del cambio total, en logaritmos)</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Total: 22 568 a 26 220. La descomposición logarítmica suma 100 % sin depender del orden; la sustitución secuencial da</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">rangos. Con 3 % de error en cada lectura, el factor principal cambia en 8,5 % de los casos: es robusto aquí, pero no en</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cambios pequeños.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo determinista y simulación de ruido con semilla fija.</tspan></text></svg>
