x="762" dy="0">Costo medio si la demanda cae</tspan></text><text x="762" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">40 %</tspan></text><rect x="10" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">0 (todo a demanda)</tspan></text><rect x="270" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">1 257</tspan></text><rect x="460" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">1 859</tspan></text><rect x="630" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">754</tspan></text><rect x="10" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">60</tspan></text><rect x="270" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">1 011</tspan></text><rect x="460" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">1 607</tspan></text><rect x="630" y="106" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">573</tspan></text><rect x="10" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">90 (mejor en promedio)</tspan></text><rect x="270" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">946</tspan></text><rect x="460" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">1 481</tspan></text><rect x="630" y="156" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">—</tspan></text><rect x="10" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">100</tspan></text><rect x="270" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">955</tspan></text><rect x="460" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">1 441</tspan></text><rect x="630" y="206" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">791</tspan></text><rect x="10" y="256" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">140</tspan></text><rect x="270" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">1 136</tspan></text><rect x="460" y="256" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">1 366</tspan></text><rect x="630" y="256" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">—</tspan></text><rect x="10" y="310" width="890" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">Precio a demanda 1,0 y comprometido 0,65 por unidad pagado siempre (utilización de equilibrio 65 %). Comprometer cerca</tspan></text><text x="455" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">de la demanda esperada ahorra 25 %; comprometer de más sube el costo medio, y una caída persistente anula el ahorro. Es</tspan></text><text x="455" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">un modelo con trayectoria aleatoria simple; no representa a ningún proveedor.</tspan></text><text x="455" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">10 000 trayectorias con semilla fija; precios ficticios.</tspan></text></svg>
