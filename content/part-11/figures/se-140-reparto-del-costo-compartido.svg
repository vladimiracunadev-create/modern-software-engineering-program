<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres reglas para repartir un costo compartido de 850</title><desc id="d">Barras agrupadas con lo que paga cada centro (cargas 40, 35 y 120) con tres reglas, junto a su costo si estuviera solo: el reparto igualitario cobra 283 a cada uno, el proporcional 174, 153 y 523, y el valor de Shapley 150, 150 y 550.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres reglas para repartir un costo compartido de 850</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Costo si estuviera solo</tspan></text><rect x="237.42" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Igualitario</tspan></text><rect x="368.36" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="388.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="388.36" dy="0">Proporcional</tspan></text><rect x="506.84" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="526.84" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="526.84" dy="0">Shapley</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="319" x2="93.7" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">200</tspan></text><line x1="93.7" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="263" x2="93.7" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">400</tspan></text><line x1="93.7" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="207" x2="93.7" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">600</tspan></text><line x1="93.7" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="151" x2="93.7" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">800</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Costo asignado (unidades ficticias)</text><rect x="121.243" y="249" width="52.0867" height="126" rx="3" fill="#6b7c86"/><text x="147.287" y="243" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147.287" dy="0">450</tspan></text><rect x="177.33" y="295.76" width="52.0867" height="79.24" rx="3" fill="#946512"/><text x="203.373" y="289.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="203.373" dy="0">283</tspan></text><rect x="233.417" y="326.28" width="52.0867" height="48.72" rx="3" fill="#c0432f"/><text x="259.46" y="320.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="259.46" dy="0">174</tspan></text><rect x="289.503" y="333" width="52.0867" height="42" rx="3" fill="#087f8c"/><text x="315.547" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="315.547" dy="0">150</tspan></text><text x="231.417" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Centro A (carga 40)</tspan></text><rect x="396.677" y="249" width="52.0867" height="126" rx="3" fill="#6b7c86"/><text x="422.72" y="243" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="422.72" dy="0">450</tspan></text><rect x="452.763" y="295.76" width="52.0867" height="79.24" rx="3" fill="#946512"/><text x="478.807" y="289.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="478.807" dy="0">283</tspan></text><rect x="508.85" y="332.16" width="52.0867" height="42.84" rx="3" fill="#c0432f"/><text x="534.893" y="326.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="534.893" dy="0">153</tspan></text><rect x="564.937" y="333" width="52.0867" height="42" rx="3" fill="#087f8c"/><text x="590.98" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="590.98" dy="0">150</tspan></text><text x="506.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Centro B (carga 35)</tspan></text><rect x="672.11" y="137" width="52.0867" height="238" rx="3" fill="#6b7c86"/><text x="698.153" y="131" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="698.153" dy="0">850</tspan></text><rect x="728.197" y="295.76" width="52.0867" height="79.24" rx="3" fill="#946512"/><text x="754.24" y="289.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="754.24" dy="0">283</tspan></text><rect x="784.283" y="228.56" width="52.0867" height="146.44" rx="3" fill="#c0432f"/><text x="810.327" y="222.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="810.327" dy="0">523</tspan></text><rect x="840.37" y="221" width="52.0867" height="154" rx="3" fill="#087f8c"/><text x="866.413" y="215" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="866.413" dy="0">550</tspan></text><text x="782.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Centro C (carga 120)</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El costo es escalonado: 50 de base y 400 por cada tramo de 100 unidades. A y B caben juntos en un tramo; el proporcional</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cobra 174 y 153 aunque sus cargas no cambian el costo; Shapley cobra lo mismo a ambos. Con tres centros hay 6 órdenes de</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">llegada, con quince hay más de 1,3 billones: el cálculo exacto no escala.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo exacto con tres participantes; cifras ficticias.</tspan></text></svg>
