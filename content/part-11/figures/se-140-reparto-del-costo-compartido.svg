<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 339" width="1020" height="339" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres reglas para repartir un costo compartido de 850</title><desc id="d">Tabla: tres centros con cargas de 40, 35 y 120 comparten una capacidad que cuesta 850; el reparto igualitario cobra 283 a cada uno, el proporcional 174, 153 y 523, y el valor de Shapley 150, 150 y 550.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="339" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Centro (carga)</tspan></text><rect x="210" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="312" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="312" dy="0">Costo si estuviera solo</tspan></text><rect x="420" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Reparto igualitario</tspan></text><rect x="610" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="712" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712" dy="0">Reparto proporcional</tspan></text><rect x="820" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="912" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="912" dy="0">Valor de Shapley</tspan></text><rect x="10" y="56" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">A (40)</tspan></text><rect x="210" y="56" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">450</tspan></text><rect x="420" y="56" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">283</tspan></text><rect x="610" y="56" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">174</tspan></text><rect x="820" y="56" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">150</tspan></text><rect x="10" y="112" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">B (35)</tspan></text><rect x="210" y="112" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">450</tspan></text><rect x="420" y="112" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">283</tspan></text><rect x="610" y="112" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">153</tspan></text><rect x="820" y="112" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">150</tspan></text><rect x="10" y="168" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">C (120)</tspan></text><rect x="210" y="168" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">850</tspan></text><rect x="420" y="168" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">283</tspan></text><rect x="610" y="168" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">523</tspan></text><rect x="820" y="168" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">550</tspan></text><rect x="10" y="228" width="1000" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="252.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">El costo es escalonado: 50 de base y 400 por cada tramo de 100 unidades. A y B caben juntos en un tramo; el proporcional cobra 174 y</tspan></text><text x="510" y="269.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">153 aunque sus cargas no cambian el costo; Shapley cobra lo mismo a ambos. Con tres centros hay 6 órdenes de llegada, con quince hay</tspan></text><text x="510" y="286.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">más de 1,3 billones: el cálculo exacto no escala.</tspan></text><text x="510" y="325.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Cálculo exacto con tres participantes; cifras ficticias.</tspan></text></svg>
