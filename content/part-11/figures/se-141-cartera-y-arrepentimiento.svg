<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 332" width="940" height="332" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Retorno neto de la cartera óptima en 400 sorteos de retornos</title><desc id="d">Intervalo con el retorno neto de la cartera óptima por valor esperado (I04, I05, I06 e I10; costo 100 y retorno esperado 211,5): el percentil 5 es 56,1, la mediana 112,0 y el percentil 95 176,6, y en ningún sorteo es negativo; sin embargo esa cartera es la mejor solo en 7,5 por ciento de los sorteos y su arrepentimiento medio es 36,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="332" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Retorno neto de la cartera óptima en 400 sorteos de retornos</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p5</tspan></text><polygon points="85.08,44.1 91.68,56.4 78.48,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="99.08" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="99.08" dy="0">mediana</tspan></text><polygon points="185.86,43.5 193.36,51 185.86,58.5 178.36,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="199.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="199.86" dy="0">p95</tspan></text><line x1="284" y1="77" x2="284" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="151" x2="284" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="435.5" y1="77" x2="435.5" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="435.5" y1="151" x2="435.5" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="435.5" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435.5" dy="0">50</tspan></text><line x1="587" y1="77" x2="587" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="587" y1="151" x2="587" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="587" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">100</tspan></text><line x1="738.5" y1="77" x2="738.5" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="738.5" y1="151" x2="738.5" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="738.5" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="738.5" dy="0">150</tspan></text><line x1="890" y1="77" x2="890" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="151" x2="890" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">200</tspan></text><line x1="284" y1="151" x2="890" y2="151" stroke="#5b7280" stroke-width="1.6"/><text x="254" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Cartera óptima (400 sorteos)</tspan></text><line x1="453.983" y1="114" x2="819.098" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="446.983" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="453.983" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="453.983" dy="0">56,1</tspan></text><polygon points="623.36,105.95 631.06,120.3 615.66,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="623.36" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="623.36" dy="0">112,0</tspan></text><polygon points="819.098,105.25 827.848,114 819.098,122.75 810.348,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="819.098" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819.098" dy="0">176,6</tspan></text><line x1="284" y1="77" x2="284" y2="151" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="289" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="289" dy="0">retorno neto = 0</tspan></text><text x="587" y="195" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="587" dy="0">Retorno neto (unidades ficticias)</tspan></text><rect x="10" y="209" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="233.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Por cuatro iniciativas con retorno alto, la cartera es buena casi siempre, pero no es «la mejor»: había 748 combinaciones</tspan></text><text x="470" y="250.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">factibles dentro del presupuesto. Pedir la cartera óptima y comprobar el arrepentimiento son preguntas distintas; la</tspan></text><text x="470" y="267.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">segunda es la que importa para decidir.</tspan></text><text x="470" y="314.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
