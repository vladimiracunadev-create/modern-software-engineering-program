<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuenciar con dependencias: valor presente del mejor, el voraz y el peor orden válido</title><desc id="d">Barras horizontales con el valor presente a 24 meses de tres órdenes de siete iniciativas: el mejor vale 551,5; el voraz por valor sobre duración vale 539,5 (2,2 por ciento menos) y el peor 514,3 (6,7 por ciento menos); solo 63 de 5 040 órdenes respetan las dependencias.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Secuenciar con dependencias: valor presente del mejor, el voraz y el peor orden válido</tspan></text><line x1="274" y1="49" x2="274" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="163" x2="274" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="474.567" y1="49" x2="474.567" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="474.567" y1="163" x2="474.567" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="474.567" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="474.567" dy="0">200</tspan></text><line x1="675.133" y1="49" x2="675.133" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="675.133" y1="163" x2="675.133" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="675.133" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675.133" dy="0">400</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="163" x2="875.7" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">600</tspan></text><line x1="274" y1="163" x2="875.7" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Mejor: A B C D G E F</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Voraz: E F A B C D G (−2,2 %)</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Peor: C A E F B D G (−6,7 %)</tspan></text><rect x="274" y="55" width="553.063" height="26" rx="3" fill="#087f8c"/><text x="834.063" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="834.063" dy="0">551,5</tspan></text><rect x="274" y="93" width="541.029" height="26" rx="3" fill="#087f8c"/><text x="822.029" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="822.029" dy="0">539,5</tspan></text><rect x="274" y="131" width="515.757" height="26" rx="3" fill="#087f8c"/><text x="796.757" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="796.757" dy="0">514,3</tspan></text><text x="574.85" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Valor presente (unidades ficticias)</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El voraz empieza por E y F (valor por mes alto) y retrasa A, B y D, que desbloquean la iniciativa más valiosa. Elegir por</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valor propio ignora lo que una iniciativa habilita; con pocas dependencias el error es pequeño, y con muchas puede ser</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mayor. Tasa de descuento 1 % al mes.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Enumeración exhaustiva con valores ficticios.</tspan></text></svg>
