<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Personas afectadas por un defecto: todo de golpe o por etapas (200 000 personas)</title><desc id="d">Barras en escala logarítmica con las personas afectadas por un defecto: con 5 por ciento de tasa, 9 952 si se despliega de golpe y 87 por etapas; con 1 por ciento, 1 995 y 102; con 0,2 por ciento, 392 y 98.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Personas afectadas por un defecto: todo de golpe o por etapas (200 000 personas)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Todo de golpe</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Por etapas</tspan></text><line x1="314" y1="77" x2="314" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="269" x2="314" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">10</tspan></text><line x1="501.233" y1="77" x2="501.233" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="501.233" y1="269" x2="501.233" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="501.233" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="501.233" dy="0">100</tspan></text><line x1="688.467" y1="77" x2="688.467" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="688.467" y1="269" x2="688.467" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="688.467" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="688.467" dy="0">1 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="269" x2="875.7" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10 000</tspan></text><line x1="314" y1="269" x2="875.7" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Defecto de 5 % (se detecta en la etapa</tspan></text><text x="304" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">de 1 %)</tspan></text><text x="304" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Defecto de 1 % (etapa de 5 %)</tspan></text><text x="304" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Defecto de 0,2 % (etapa de 25 %)</tspan></text><rect x="314" y="83" width="561.309" height="24.5" rx="3" fill="#c0432f"/><text x="882.309" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.309" dy="0">9 952</tspan></text><rect x="314" y="110.5" width="175.909" height="24.5" rx="3" fill="#087f8c"/><text x="496.909" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="496.909" dy="0">87</tspan></text><rect x="314" y="147" width="430.626" height="24.5" rx="3" fill="#c0432f"/><text x="751.626" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="751.626" dy="0">1 995</tspan></text><rect x="314" y="174.5" width="188.844" height="24.5" rx="3" fill="#087f8c"/><text x="509.844" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="509.844" dy="0">102</tspan></text><rect x="314" y="211" width="298.316" height="24.5" rx="3" fill="#c0432f"/><text x="619.316" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="619.316" dy="0">392</tspan></text><rect x="314" y="238.5" width="185.591" height="24.5" rx="3" fill="#087f8c"/><text x="506.591" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="506.591" dy="0">98</tspan></text><text x="594.85" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="594.85" dy="0">Personas afectadas (escala logarítmica)</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Etapas de 1, 5, 25 y 100 %; se detecta al reunir al menos 10 reportes, y 15 % de las personas afectadas reporta. Cuanto más</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">raro es el defecto, más tarde se ve y más importa la última etapa; con 0,05 % se esperan unos 4 reportes en la etapa de 25</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">% y el umbral de 10 no se alcanza hasta el 100 % (cuenta esperada, no simulada).</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
