<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 458" width="940" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Migraciones de base de datos: filas idénticas tras ida y vuelta (10 000 filas)</title><desc id="d">Barras horizontales con el porcentaje de filas idénticas tras aplicar y deshacer seis migraciones: añadir una columna, renombrar y partir el nombre devuelven 100 por ciento; pasar el precio a centavos devuelve 9,5; borrar una columna y sustituir el correo por su hash, 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="458" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Migraciones de base de datos: filas idénticas tras ida y vuelta (10 000 filas)</tspan></text><line x1="254" y1="49" x2="254" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="277" x2="254" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="378.34" y1="49" x2="378.34" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="378.34" y1="277" x2="378.34" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="378.34" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="378.34" dy="0">20</tspan></text><line x1="502.68" y1="49" x2="502.68" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="502.68" y1="277" x2="502.68" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="502.68" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502.68" dy="0">40</tspan></text><line x1="627.02" y1="49" x2="627.02" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="627.02" y1="277" x2="627.02" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="627.02" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627.02" dy="0">60</tspan></text><line x1="751.36" y1="49" x2="751.36" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="751.36" y1="277" x2="751.36" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="751.36" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751.36" dy="0">80</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="277" x2="875.7" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="254" y1="277" x2="875.7" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Añadir una columna y quitarla</tspan></text><text x="244" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Renombrar una columna</tspan></text><text x="244" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Partir el nombre y reunirlo</tspan></text><text x="244" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Precio decimal a centavos</tspan></text><text x="244" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Borrar y recrear una columna</tspan></text><text x="244" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Correo por su hash</tspan></text><rect x="254" y="55" width="621.7" height="26" rx="3" fill="#087f8c"/><text x="882.7" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="254" y="93" width="621.7" height="26" rx="3" fill="#087f8c"/><text x="882.7" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="254" y="131" width="621.7" height="26" rx="3" fill="#087f8c"/><text x="882.7" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="254" y="169" width="59.0615" height="26" rx="3" fill="#087f8c"/><text x="320.062" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="320.062" dy="0">9,5</tspan></text><rect x="254" y="207" width="2" height="26" rx="3" fill="#087f8c"/><text x="263" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="263" dy="0">0,0</tspan></text><rect x="254" y="245" width="2" height="26" rx="3" fill="#087f8c"/><text x="263" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="263" dy="0">0,0</tspan></text><text x="564.85" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">Filas idénticas tras ida y vuelta (%)</tspan></text><rect x="10" y="335" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Que el script «down» exista no hace reversible la migración: la reversibilidad se mide comparando datos antes y después. La</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">partición del nombre recupera el texto pero la información que se creó (nombre y apellido) era errónea en 28,8 % de las</tspan></text><text x="470" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">filas. SQLite 3.45.3 en Windows y 3.45.1 en Ubuntu; mismos resultados.</tspan></text><text x="470" y="440.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos (correos .test); código real con sqlite3 de la biblioteca estándar.</tspan></text></svg>
