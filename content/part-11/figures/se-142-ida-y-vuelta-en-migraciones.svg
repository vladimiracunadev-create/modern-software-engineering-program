<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 531" width="960" height="531" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Migraciones de base de datos: qué vuelve al deshacerse</title><desc id="d">Tabla de seis migraciones sobre 10 000 filas en SQLite: añadir y quitar una columna, renombrar y partir un nombre devuelven todas las filas; pasar el precio a centavos devuelve 9,5 por ciento; borrar una columna y sustituir un correo por su hash no devuelven ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="531" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Migración y vuelta</tspan></text><rect x="390" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">Filas idénticas tras ida y</tspan></text><text x="497" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">vuelta</tspan></text><rect x="610" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Lectura</tspan></text><rect x="10" y="56" width="374" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="86.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Añadir una columna nula y quitarla</tspan></text><rect x="390" y="56" width="214" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">10 000 de 10 000</tspan></text><rect x="610" y="56" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">reversible</tspan></text><rect x="10" y="116" width="374" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="146.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Renombrar una columna y devolverla</tspan></text><rect x="390" y="116" width="214" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">10 000 de 10 000</tspan></text><rect x="610" y="116" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">reversible</tspan></text><rect x="10" y="176" width="374" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="206.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Partir el nombre en dos y reunirlo</tspan></text><rect x="390" y="176" width="214" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="206.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">10 000 de 10 000</tspan></text><rect x="610" y="176" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="198.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">vuelve el texto, pero 28,8 % de los nombres de</tspan></text><text x="777" y="214.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">pila quedó partido mal</tspan></text><rect x="10" y="236" width="374" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="266.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Precio decimal a centavos enteros y vuelta</tspan></text><rect x="390" y="236" width="214" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="266.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">953 de 10 000 (9,5 %)</tspan></text><rect x="610" y="236" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="266.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">pérdida de precisión</tspan></text><rect x="10" y="296" width="374" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="326.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Borrar una columna y recrearla</tspan></text><rect x="390" y="296" width="214" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="326.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">0 de 10 000</tspan></text><rect x="610" y="296" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="326.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">datos perdidos</tspan></text><rect x="10" y="356" width="374" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="386.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Sustituir el correo por su hash</tspan></text><rect x="390" y="356" width="214" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="386.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">0 de 10 000</tspan></text><rect x="610" y="356" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="386.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">no se puede deshacer</tspan></text><rect x="10" y="420" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="444.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Que el script «down» exista no hace reversible la migración: la reversibilidad se mide comparando datos antes y después. La</tspan></text><text x="480" y="461.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">partición del nombre recupera el texto pero la información que se creó (nombre y apellido) era errónea en 28,8 % de las filas.</tspan></text><text x="480" y="478.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">SQLite 3.45.3 en Windows y 3.45.1 en Ubuntu; mismos resultados.</tspan></text><text x="480" y="517.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos (correos .test); código real con sqlite3 de la biblioteca estándar.</tspan></text></svg>
