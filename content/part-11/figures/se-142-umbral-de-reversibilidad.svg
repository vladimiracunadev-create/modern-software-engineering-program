<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" width="960" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuándo conviene probar con vuelta atrás en lugar de comprometerse</title><desc id="d">Tabla: si equivocarse cuesta 100 en una decisión irreversible, 20 al revertirla y probar cuesta 4, la decisión reversible gana cuando la probabilidad de equivocarse supera 5 por ciento: con 2 por ciento conviene comprometerse y con 10 por ciento conviene probar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="395" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Probabilidad de</tspan></text><text x="112" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">equivocarse</tspan></text><rect x="220" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="337" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337" dy="0">Pérdida esperada si es</tspan></text><text x="337" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337" dy="0">irreversible</tspan></text><rect x="460" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Pérdida esperada si es</tspan></text><text x="597" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">reversible (4 + 20·p)</tspan></text><rect x="740" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Conviene</tspan></text><rect x="10" y="56" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">2 %</tspan></text><rect x="220" y="56" width="234" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">2,0</tspan></text><rect x="460" y="56" width="274" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">4,4</tspan></text><rect x="740" y="56" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">irreversible</tspan></text><rect x="10" y="112" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">5 %</tspan></text><rect x="220" y="112" width="234" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">5,0</tspan></text><rect x="460" y="112" width="274" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">4,9</tspan></text><rect x="740" y="112" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">cruce (≈ 5,0 %)</tspan></text><rect x="10" y="168" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">10 %</tspan></text><rect x="220" y="168" width="234" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">9,9</tspan></text><rect x="460" y="168" width="274" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">6,0</tspan></text><rect x="740" y="168" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">reversible</tspan></text><rect x="10" y="224" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">30 %</tspan></text><rect x="220" y="224" width="234" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">30,3</tspan></text><rect x="460" y="224" width="274" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">9,9</tspan></text><rect x="740" y="224" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">reversible</tspan></text><rect x="10" y="284" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Umbral p* = costo de probar / (pérdida irreversible − costo de revertir) = 4 / (100 − 20) = 5,0 %. Con costo de revertir 5 es</tspan></text><text x="480" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">4,2 % y con 50 es 8,0 %. Los tres números son supuestos; la lección es que la probabilidad de equivocarse decide, y casi nunca</tspan></text><text x="480" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">se conoce con precisión.</tspan></text><text x="480" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación de 40 000 casos por fila, semilla fija.</tspan></text></svg>
