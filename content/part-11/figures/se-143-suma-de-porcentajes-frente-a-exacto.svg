<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres factores que suben lo mismo: cambio exacto frente a suma de porcentajes</title><desc id="d">Líneas con el cambio del padre cuando los tres factores de un producto suben el mismo porcentaje: el cambio exacto es 6,12 con 2 por ciento y 237,50 con 50, y la suma de los porcentajes da 6 y 150, es decir 98,0 y 63,2 por ciento del cambio real.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres factores que suben lo mismo: cambio exacto frente a suma de porcentajes</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cambio exacto del padre</tspan></text><rect x="237.42" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Suma de los porcentajes</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">150</tspan></text><line x1="78.62" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">250</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">2</tspan></text><line x1="146.331" y1="87" x2="146.331" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="146.331" y1="387" x2="146.331" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="146.331" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="146.331" dy="0">5</tspan></text><line x1="229.183" y1="87" x2="229.183" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="229.183" y1="387" x2="229.183" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="229.183" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="229.183" dy="0">10</tspan></text><line x1="394.887" y1="87" x2="394.887" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="394.887" y1="387" x2="394.887" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="394.887" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.887" dy="0">20</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">50</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Cambio del padre (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Subida de cada uno de los tres factores (%)</tspan></text><polyline points="96.62,379.656 146.331,368.088 229.183,347.28 394.887,299.64 892,102" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="379.656" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="146.331" cy="368.088" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="229.183" cy="347.28" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="394.887" cy="299.64" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="892" cy="102" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="91" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">237,5</tspan></text><polyline points="96.62,379.8 146.331,369 229.183,351 394.887,315 892,207" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="374.3" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="140.831" y="363.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="223.683" y="345.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="389.387" y="309.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="886.5" y="201.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="196" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">150</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con signos mezclados la suma engaña más: +50 % y −30 % dan +5 % exacto y +20 % por suma. Y cuando el cambio total es casi</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cero, las participaciones logarítmicas explotan (+831 % y −731 %): no se informan participaciones de un cambio de 5 %. Una</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">atribución sin orden ni aviso de límites se convierte en relato.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo determinista.</tspan></text></svg>
