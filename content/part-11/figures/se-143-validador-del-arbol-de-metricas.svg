<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 585" width="920" height="585" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador del árbol de métricas: 12 de 16 mutaciones</title><desc id="d">Tabla de 16 mutaciones de un árbol de cuatro hojas: el validador detecta las 12 de estructura, referencias, completitud, aritmética y nombre de vanidad, y deja pasar las 4 semánticas: unidad cambiada, fuente irrelevante, responsable colectivo y valores alterados de forma coherente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="585" fill="#ffffff"/><rect x="10" y="12" width="594" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Tipo de defecto</tspan></text><rect x="610" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">Detectadas</tspan></text><rect x="760" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Resultado</tspan></text><rect x="10" y="56" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Estructura: ciclo, huérfano, nombre duplicado, dos raíces</tspan></text><rect x="610" y="56" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">4 de 4</tspan></text><rect x="760" y="56" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">detecta</tspan></text><rect x="10" y="102" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Referencias: fórmula que usa un nodo inexistente</tspan></text><rect x="610" y="102" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">1 de 1</tspan></text><rect x="760" y="102" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">detecta</tspan></text><rect x="10" y="148" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Completitud: sin responsable, sin fuente, sin decisión, sin métrica contraria</tspan></text><rect x="610" y="148" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">4 de 4</tspan></text><rect x="760" y="148" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">detecta</tspan></text><rect x="10" y="194" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Aritmética: operador cambiado, valor de hoja alterado 30 %</tspan></text><rect x="610" y="194" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">2 de 2</tspan></text><rect x="760" y="194" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">detecta</tspan></text><rect x="10" y="240" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Nombre de métrica de vanidad</tspan></text><rect x="610" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">1 de 1</tspan></text><rect x="760" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">detecta</tspan></text><rect x="10" y="286" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Unidad cambiada (semanal a mensual)</tspan></text><rect x="610" y="286" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0 de 1</tspan></text><rect x="760" y="286" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">sobrevive</tspan></text><rect x="10" y="332" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Fuente irrelevante para la métrica</tspan></text><rect x="610" y="332" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0 de 1</tspan></text><rect x="760" y="332" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">sobrevive</tspan></text><rect x="10" y="378" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="401.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Responsable colectivo («el equipo»)</tspan></text><rect x="610" y="378" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0 de 1</tspan></text><rect x="760" y="378" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">sobrevive</tspan></text><rect x="10" y="424" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="447.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Hoja y raíz alteradas de forma coherente</tspan></text><rect x="610" y="424" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0 de 1</tspan></text><rect x="760" y="424" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">sobrevive</tspan></text><rect x="10" y="474" width="900" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="498.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Con casos nuevos: un árbol aditivo y uno con cociente pasan; un cociente con divisor cero se rechaza como fórmula</tspan></text><text x="460" y="515.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">inválida; una fórmula con constante que no cuadra se rechaza. El validador comprueba forma y aritmética; no sabe si</tspan></text><text x="460" y="532.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">«entregas por estudiante» está medida con la misma unidad que el padre.</tspan></text><text x="460" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Código real ejecutado; idéntico en Windows y Ubuntu (WSL2).</tspan></text></svg>
