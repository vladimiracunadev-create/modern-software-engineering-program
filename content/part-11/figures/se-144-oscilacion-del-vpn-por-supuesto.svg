<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 439" width="940" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto mueve cada supuesto el valor presente neto (miles, percentil 10 a 90)</title><desc id="d">Barras con la oscilación del valor presente neto al llevar cada supuesto de su percentil 10 al 90 con los demás en su valor central: alumnos por centro 1367 mil, precio por alumno 966, centros nuevos por mes 519, costo de servir 401, costos fijos 234, abandono 191 y construcción 158.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="439" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Alumnos por centro</tspan></text><rect x="310" y="16" width="300.74" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="618.74" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="618.74" dy="0">1 367</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Precio por alumno</tspan></text><rect x="310" y="60" width="212.52" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="530.52" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="530.52" dy="0">966</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Centros nuevos por mes</tspan></text><rect x="310" y="104" width="114.18" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="432.18" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="432.18" dy="0">519</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Costo de servir por alumno</tspan></text><rect x="310" y="148" width="88.22" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="406.22" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="406.22" dy="0">401</tspan></text><text x="300" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Costos fijos mensuales</tspan></text><rect x="310" y="192" width="51.48" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="369.48" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="369.48" dy="0">234</tspan></text><text x="300" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Abandono mensual</tspan></text><rect x="310" y="236" width="42.02" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="360.02" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="360.02" dy="0">191</tspan></text><text x="300" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Costo de construcción</tspan></text><rect x="310" y="280" width="34.76" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352.76" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352.76" dy="0">158</tspan></text><rect x="10" y="328" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El valor presente neto es 34 mil con valores centrales; en 20 000 sorteos la mediana es 459 mil, el intervalo del 5 al 95</tspan></text><text x="470" y="369.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por ciento va de −470 mil a 2 962 mil y la probabilidad de un valor positivo es 72,9 %. El supuesto que menos se investiga</tspan></text><text x="470" y="386.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(tamaño de los centros) es el que más mueve el caso; la construcción, que domina la conversación, es el que menos.</tspan></text><text x="470" y="425.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
