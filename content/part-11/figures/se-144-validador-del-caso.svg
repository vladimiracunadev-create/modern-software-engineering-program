"700" fill="#142231"><tspan x="766.36" dy="0">4</tspan></text><rect x="294" y="216" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="216" width="116.34" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="352.17" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352.17" dy="0">1</tspan></text><text x="417.34" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="417.34" dy="0">1</tspan></text><rect x="294" y="260" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="260" width="116.34" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="352.17" y="279.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352.17" dy="0">1</tspan></text><text x="417.34" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="417.34" dy="0">1</tspan></text><rect x="294" y="304" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="304" width="116.34" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="352.17" y="323.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352.17" dy="0">1</tspan></text><text x="417.34" y="323.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="417.34" dy="0">1</tspan></text><rect x="294" y="348" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="348" width="116.34" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="352.17" y="367.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352.17" dy="0">1</tspan></text><text x="417.34" y="367.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="417.34" dy="0">1</tspan></text><text x="584.85" y="429" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Mutaciones</tspan></text><rect x="10" y="443" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="467.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Es el mismo reparto que el de un brief: la forma se comprueba, la verdad no. Para los cuatro supervivientes hace falta una</tspan></text><text x="470" y="484.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">segunda persona que recalcule el modelo y compare cada afirmación con su evidencia. El validador es una puerta de entrada a</tspan></text><text x="470" y="501.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">esa revisión, no su sustituto.</tspan></text><text x="470" y="548.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código real ejecutado; idéntico en Windows y Ubuntu (WSL2).</tspan></text></svg>
