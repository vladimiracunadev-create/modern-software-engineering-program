<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 467" width="1000" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cobertura de 40 requisitos sintéticos según la técnica de elicitación</title><desc id="d">Barras de cobertura media de 40 requisitos, 8 de ellos tácitos, con 1, 2, 4 y 8 entrevistas: solo entrevistas llegan a 17,7, 32,9, 55,2 y 77,2 por ciento; con tres observaciones añadidas, a 32,1, 47,1, 68,5 y 90,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="467" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">1 entrevista, solo entrevistas</tspan></text><rect x="340" y="16" width="88.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="436.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="436.5" dy="0">17.7 %</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">1 entrevista + 3 observaciones</tspan></text><rect x="340" y="60" width="160.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="508.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="508.5" dy="0">32.1 %</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">2 entrevistas, solo entrevistas</tspan></text><rect x="340" y="104" width="164.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="512.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="512.5" dy="0">32.9 %</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">2 entrevistas + 3 observaciones</tspan></text><rect x="340" y="148" width="235.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="583.5" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="583.5" dy="0">47.1 %</tspan></text><text x="330" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">4 entrevistas, solo entrevistas</tspan></text><rect x="340" y="192" width="276" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="624" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="624" dy="0">55.2 %</tspan></text><text x="330" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">4 entrevistas + 3 observaciones</tspan></text><rect x="340" y="236" width="342.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690.5" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="690.5" dy="0">68.5 %</tspan></text><text x="330" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">8 entrevistas, solo entrevistas</tspan></text><rect x="340" y="280" width="386" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="734" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="734" dy="0">77.2 %</tspan></text><text x="330" y="343.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">8 entrevistas + 3 observaciones</tspan></text><rect x="340" y="324" width="451.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799.5" y="343.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="799.5" dy="0">90.3 %</tspan></text><rect x="10" y="372" width="980" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">Con ocho entrevistas la cobertura se detiene en 77,2 % porque los 8 requisitos tácitos casi nunca se enuncian (5 % de probabilidad</tspan></text><text x="500" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">por persona que los conoce). Tres sesiones de observación suben el techo a 90,3 %.</tspan></text><text x="500" y="453.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
