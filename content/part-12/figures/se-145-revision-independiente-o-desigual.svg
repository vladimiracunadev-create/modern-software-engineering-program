471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El modelo independiente usa la probabilidad media (0,391) para todos los defectos. Cuando algunos son difíciles para todos,</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los revisores adicionales repiten los mismos aciertos: con seis personas la simulación se queda 17,8 puntos por debajo</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(diferencias: 0,1; −7,1; −12,7; −15,8; −17,5; −17,8).</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
