<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Revisar con más personas: modelo independiente frente a defectos de dificultad desigual</title><desc id="d">Líneas con la fracción de 30 defectos hallada por 1 a 6 revisores: el modelo de independencia sube a 39,1, 62,9, 77,4, 86,2, 91,6 y 94,9 por ciento y la simulación con dificultad desigual solo a 39,2, 55,8, 64,7, 70,4, 74,1 y 77,1; la brecha llega a 17,8 puntos con seis revisores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Revisar con más personas: modelo independiente frente a defectos de dificultad desigual</tspan></text><circle cx="22" cy="51" r="6" fill="#946512" stroke="#946512" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Predicción 1−(1−p)^k (independiente)</tspan></text><rect x="335.44" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="355.44" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="355.44" dy="0">Simulación con dificultad desigual (5 000 corridas)</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspa