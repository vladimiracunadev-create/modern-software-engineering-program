40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0</tspan></text><rect x="10" y="290" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El día calendario local de Santiago midió 24 h en 363 días, 25 h en uno y 23 h en otro. «Hasta la medianoche» y «dentro de 24</tspan></text><text x="480" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">horas» no son el mismo plazo esos dos días; el requisito debe fijar zona y regla.</tspan></text><text x="480" y="371.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Calculado con zoneinfo (CPython 3.12.9 en Windows y 3.12.3 en Ubuntu); el resultado depende de la versión de la base de zonas.</tspan></text></svg>
