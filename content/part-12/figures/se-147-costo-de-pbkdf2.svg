<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 307" width="940" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de PBKDF2-HMAC-SHA-256 al verificar una contraseña (Windows 11, una corrida)</title><desc id="d">Barras con el tiempo de una derivación PBKDF2 con SHA-256: 0,9 milisegundos con mil iteraciones, 8,4 con diez mil, 99,6 con cien mil y 570 con seiscientas mil; en Ubuntu fueron 0,7, 10,4, 85,8 y 544.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="307" fill="#ffffff"/><text x="250" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">1 000 iteraciones</tspan></text><rect x="260" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="272" dy="0">0,9 ms</tspan></text><text x="250" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">10 000 iteraciones</tspan></text><rect x="260" y="60" width="7.14" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="275.14" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="275.14" dy="0">8,4 ms</tspan></text><text x="250" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">100 000 iteraciones</tspan></text><rect x="260" y="104" width="84.66" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352.66" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352.66" dy="0">99,6 ms</tspan></text><text x="250" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">600 000 iteraciones</tspan></text><rect x="260" y="148" width="484.755" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="752.755" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="752.755" dy="0">570 ms</tspan></text><rect x="10" y="196" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El valor de 600 000 iteraciones que recomienda OWASP para este algoritmo cuesta unos 570 ms por intento en este equipo; un</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">requisito de «login en menos de 300 ms» y otro de «seguir la guía de OWASP» no pueden cumplirse a la vez sin cambiar</tspan></text><text x="470" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">algoritmo, hardware o umbral.</tspan></text><text x="470" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tiempos medidos con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu (WSL2); dependen del equipo y se leen como razones.</tspan></text></svg>
