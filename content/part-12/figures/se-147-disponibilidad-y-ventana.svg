<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 478" width="940" height="478" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Disponibilidad: cuánta caída permite cada objetivo y cómo se compone</title><desc id="d">Barras horizontales con los minutos de caída permitidos por mes de 30 días: 432 con 99 por ciento, 216 con 99,5, 43,2 con 99,9, 21,6 con 99,95 y 4,3 con 99,99, y unos 130 minutos para tres servicios en serie de 99,9 por ciento que dan 99,70 por ciento conjunto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="478" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Disponibilidad: cuánta caída permite cada objetivo y cómo se compone</tspan></text><line x1="324" y1="49" x2="324" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="313" x2="324" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="435.952" y1="49" x2="435.952" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="435.952" y1="313" x2="435.952" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="435.952" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435.952" dy="0">100</tspan></text><line x1="547.904" y1="49" x2="547.904" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="547.904" y1="313" x2="547.904" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="547.904" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.904" dy="0">200</tspan></text><line x1="659.856" y1="49" x2="659.856" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="659.856" y1="313" x2="659.856" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="659.856" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="659.856" dy="0">300</tspan></text><line x1="771.808" y1="49" x2="771.808" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="771.808" y1="313" x2="771.808" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="771.808" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.808" dy="0">400</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="313" x2="883.76" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">500</tspan></text><line x1="324" y1="313" x2="883.76" y2="313" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">99 % (87,6 h al año)</tspan></text><text x="314" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">99,5 % (43,8 h al año)</tspan></text><text x="314" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">99,9 % (8,76 h al año)</tspan></text><text x="314" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">99,95 % (4,38 h al año)</tspan></text><text x="314" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">99,99 % (0,88 h al año)</tspan></text><text x="314" y="287" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">3 servicios en serie de 99,9 % (99,70 %</tspan></text><text x="314" y="304" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">conjunto)</tspan></text><rect x="324" y="55" width="483.633" height="32" rx="3" fill="#087f8c"/><text x="814.633" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="814.633" dy="0">432</tspan></text><rect x="324" y="99" width="241.816" height="32" rx="3" fill="#087f8c"/><text x="572.816" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="572.816" dy="0">216</tspan></text><rect x="324" y="143" width="48.3633" height="32" rx="3" fill="#087f8c"/><text x="379.363" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="379.363" dy="0">43,2</tspan></text><rect x="324" y="187" width="24.1816" height="32" rx="3" fill="#087f8c"/><text x="355.182" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="355.182" dy="0">21,6</tspan></text><rect x="324" y="231" width="4.81394" height="32" rx="3" fill="#087f8c"/><text x="335.814" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="335.814" dy="0">4,3</tspan></text><rect x="324" y="275" width="145.538" height="32" rx="3" fill="#087f8c"/><text x="476.538" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="476.538" dy="0">130</tspan></text><text x="603.88" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603.88" dy="0">minutos de caída por mes de 30 días</tspan></text><rect x="10" y="371" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="395.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con los mismos incidentes simulados (semilla 1473), 85,8 % de los meses cumplió 99,9 % mensual, pero 99,8 % de los años</tspan></text><text x="470" y="412.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cumplió 99,9 % anual. El objetivo no es completo sin su ventana de medición.</tspan></text><text x="470" y="460.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
