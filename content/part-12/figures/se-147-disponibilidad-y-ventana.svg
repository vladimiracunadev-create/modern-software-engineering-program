<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 419" width="930" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Disponibilidad: cuánta caída permite cada objetivo y cómo se compone</title><desc id="d">Tabla de tiempo de caída permitido por mes de 30 días y por año según el objetivo de disponibilidad, de 99 a 99,99 por ciento, más el caso de tres servicios en serie de 99,9 por ciento que dan 99,70 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="419" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Objetivo</tspan></text><rect x="320" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Caída permitida por mes (30 días)</tspan></text><rect x="650" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Caída permitida por año</tspan></text><rect x="10" y="56" width="304" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">99 %</tspan></text><rect x="320" y="56" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">432 min</tspan></text><rect x="650" y="56" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">87,6 h</tspan></text><rect x="10" y="100" width="304" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">99,5 %</tspan></text><rect x="320" y="100" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">216 min</tspan></text><rect x="650" y="100" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">43,8 h</tspan></text><rect x="10" y="144" width="304" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="166.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">99,9 %</tspan></text><rect x="320" y="144" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">43,2 min</tspan></text><rect x="650" y="144" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">8,76 h</tspan></text><rect x="10" y="188" width="304" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="210.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">99,95 %</tspan></text><rect x="320" y="188" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">21,6 min</tspan></text><rect x="650" y="188" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">4,38 h</tspan></text><rect x="10" y="232" width="304" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="254.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">99,99 %</tspan></text><rect x="320" y="232" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">4,3 min</tspan></text><rect x="650" y="232" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">0,88 h</tspan></text><rect x="10" y="276" width="304" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="298.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">3 servicios en serie de 99,9 %</tspan></text><rect x="320" y="276" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">≈ 130 min</tspan></text><rect x="650" y="276" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">99,70 % conjunto</tspan></text><rect x="10" y="324" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Con los mismos incidentes simulados (semilla 1473), 85,8 % de los meses cumplió 99,9 % mensual, pero 99,8 % de los años</tspan></text><text x="465" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">cumplió 99,9 % anual. El objetivo no es completo sin su ventana de medición.</tspan></text><text x="465" y="405.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
