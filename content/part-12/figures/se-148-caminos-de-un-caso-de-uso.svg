<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 415" width="930" height="415" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escenarios de un caso de uso de entrega: de 1 flujo a 16 caminos con 7 alternativas</title><desc id="d">Tabla acumulada del caso de uso entregar una tarea: al añadir cuatro puntos de decisión con siete alternativas, el número de caminos completos pasa de 1 a 3, 7, 15 y 16.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="415" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Decisión añadida</tspan></text><rect x="570" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Alternativas</tspan></text><rect x="720" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Caminos completos</tspan></text><rect x="10" y="56" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Solo el flujo principal (8 pasos)</tspan></text><rect x="570" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">—</tspan></text><rect x="720" y="56" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1</tspan></text><rect x="10" y="108" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="126.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Tras añadir «guardar»: sesión expirada (vuelve), almacenamiento caído</tspan></text><text x="287" y="142.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">(termina)</tspan></text><rect x="570" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">2</tspan></text><rect x="720" y="108" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">3</tspan></text><rect x="10" y="160" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Tras añadir «revisar plazo»: en gracia (vuelve), vencido (termina)</tspan></text><rect x="570" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">2</tspan></text><rect x="720" y="160" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">7</tspan></text><rect x="10" y="212" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="230.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Tras añadir «validar tamaño»: comprimible (vuelve), demasiado grande</tspan></text><text x="287" y="246.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">(termina)</tspan></text><rect x="570" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">2</tspan></text><rect x="720" y="212" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">15</tspan></text><rect x="10" y="264" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="290.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Tras añadir «validar formato»: no admitido (termina)</tspan></text><rect x="570" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">1</tspan></text><rect x="720" y="264" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">16</tspan></text><rect x="10" y="320" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Las alternativas que vuelven al flujo multiplican los caminos; las que terminan solo los suman. Cubrir cada alternativa</tspan></text><text x="465" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">una vez exige 5 escenarios; cubrir todas las combinaciones exige 16. El requisito debe decir cuál se promete.</tspan></text><text x="465" y="401.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
