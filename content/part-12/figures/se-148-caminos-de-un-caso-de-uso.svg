<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 584" width="940" height="584" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escenarios de un caso de uso de entrega: de 1 flujo a 16 caminos con 7 alternativas</title><desc id="d">Barras agrupadas con los caminos completos del caso de uso entregar una tarea al añadir cuatro puntos de decisión con siete alternativas: 1, 3, 7, 15 y 16 caminos, con 0, 2, 2, 2 y 1 alternativas añadidas en cada paso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="584" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Escenarios de un caso de uso de entrega: de 1 flujo a 16 caminos con 7 alternativas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Alternativas añadidas en el paso</tspan></text><rect x="305.28" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="325.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="325.28" dy="0">Caminos completos acumulados</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="305" x2="71.08" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="235" x2="71.08" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="165" x2="71.08" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">cantidad</text><rect x="88.0584" y="373" width="65.9136" height="2" rx="3" fill="#946512"/><text x="121.015" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="121.015" dy="0">0</tspan></text><rect x="157.972" y="361" width="65.9136" height="14" rx="3" fill="#087f8c"/><text x="190.929" y="355" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="190.929" dy="0">1</tspan></text><text x="155.972" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155.972" dy="0">Solo el flujo</tspan></text><text x="155.972" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155.972" dy="0">principal (8 pasos)</tspan></text><rect x="257.842" y="347" width="65.9136" height="28" rx="3" fill="#946512"/><text x="290.799" y="341" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="290.799" dy="0">2</tspan></text><rect x="327.756" y="333" width="65.9136" height="42" rx="3" fill="#087f8c"/><text x="360.713" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="360.713" dy="0">3</tspan></text><text x="325.756" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="325.756" dy="0">+ «guardar»</tspan></text><rect x="427.626" y="347" width="65.9136" height="28" rx="3" fill="#946512"/><text x="460.583" y="341" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="460.583" dy="0">2</tspan></text><rect x="497.54" y="277" width="65.9136" height="98" rx="3" fill="#087f8c"/><text x="530.497" y="271" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530.497" dy="0">7</tspan></text><text x="495.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">+ «revisar plazo»</tspan></text><rect x="597.41" y="347" width="65.9136" height="28" rx="3" fill="#946512"/><text x="630.367" y="341" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="630.367" dy="0">2</tspan></text><rect x="667.324" y="165" width="65.9136" height="210" rx="3" fill="#087f8c"/><text x="700.281" y="159" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.281" dy="0">15</tspan></text><text x="665.324" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="665.324" dy="0">+ «validar tamaño»</tspan></text><rect x="767.194" y="361" width="65.9136" height="14" rx="3" fill="#946512"/><text x="800.151" y="355" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="800.151" dy="0">1</tspan></text><rect x="837.108" y="151" width="65.9136" height="224" rx="3" fill="#087f8c"/><text x="870.065" y="145" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870.065" dy="0">16</tspan></text><text x="835.108" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.108" dy="0">+ «validar formato»</tspan></text><rect x="10" y="444" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Guardar: sesión expirada (vuelve) y almacenamiento caído (termina). Revisar plazo: en gracia (vuelve) y vencido (termina).</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Validar tamaño: comprimible (vuelve) y demasiado grande (termina). Validar formato: no admitido (termina). Las alternativas</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que vuelven al flujo multiplican los caminos; las que terminan solo los suman. Cubrir cada alternativa una vez exige 5</tspan></text><text x="470" y="518.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escenarios; cubrir todas las combinaciones exige 16.</tspan></text><text x="470" y="566.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
