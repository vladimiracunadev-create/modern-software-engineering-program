<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 291" width="940" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutantes de una regla de validación de archivos detectados por cada suite de ejemplos</title><desc id="d">Barras con 10 mutantes de una validación de subida de archivos: un ejemplo feliz detecta 0, cuatro clases de equivalencia detectan 4 y trece casos con fronteras detectan los 10, igual que 240 casos del dominio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="291" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">1 ejemplo feliz</tspan></text><rect x="310" y="16" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="322" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">0 de 10</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">4 clases de equivalencia</tspan></text><rect x="310" y="60" width="160" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="478" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="478" dy="0">4 de 10</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">13 casos con fronteras</tspan></text><rect x="310" y="104" width="400" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="718" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="718" dy="0">10 de 10</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">240 casos del dominio</tspan></text><rect x="310" y="148" width="400" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="718" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="718" dy="0">10 de 10</tspan></text><rect x="10" y="196" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un ejemplo que pasa no prueba nada sobre los límites. Los 6 mutantes que sobreviven a las clases de equivalencia son</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">errores de «≤» frente a «&lt;», de 10 frente a 11 MB o de mayúsculas en la extensión: solo los ejemplos de frontera los matan.</tspan></text><text x="470" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
