<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Redondear una nota a entero: dos implementaciones razonables, tres notas de 61 que difieren</title><desc id="d">Puntos unidos con el redondeo de seis notas por dos implementaciones: con 2,5, 4,5 y 6,5 la función round de Python da 2, 4 y 6 y la regla de mitad hacia arriba da 3, 5 y 7, y con 1,5, 3,5 y 5,5 coinciden en 2, 4 y 6; de las 61 notas de 1,0 a 7,0 con un decimal difieren 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Redondear una nota a entero: dos implementaciones razonables, tres notas de 61 que difieren</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">round de Python</tspan></text><circle cx="183.1" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Mitad hacia arriba</tspan></text><line x1="82.24" y1="77" x2="82.24" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="82.24" y1="317" x2="82.24" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="82.24" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="82.24" dy="0">0</tspan></text><line x1="266.56" y1="77" x2="266.56" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="266.56" y1="317" x2="266.56" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="266.56" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="266.56" dy="0">2</tspan></text><line x1="450.88" y1="77" x2="450.88" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="450.88" y1="317" x2="450.88" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="450.88" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="450.88" dy="0">4</tspan></text><line x1="635.2" y1="77" x2="635.2" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="635.2" y1="317" x2="635.2" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="635.2" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.2" dy="0">6</tspan></text><line x1="819.52" y1="77" x2="819.52" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="819.52" y1="317" x2="819.52" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="819.52" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.52" dy="0">8</tspan></text><line x1="82.24" y1="317" x2="819.52" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="46.18" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="46.18" dy="0">2,5</tspan></text><text x="46.18" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="46.18" dy="0">4,5</tspan></text><text x="46.18" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="46.18" dy="0">6,5</tspan></text><text x="46.18" y="221.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="46.18" dy="0">1,5</tspan></text><text x="46.18" y="261.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="46.18" dy="0">3,5</tspan></text><text x="46.18" y="301.5" font-size="13" text-anchor="end" font-weight="700" 