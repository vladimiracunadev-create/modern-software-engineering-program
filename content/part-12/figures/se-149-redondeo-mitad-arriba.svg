" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="450.88" dy="0">nota redondeada</tspan></text><rect x="10" y="375" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un criterio de aceptación con ejemplos como 6,4 → 6 y 6,6 → 7 lo cumplen ambas implementaciones. Solo un ejemplo en el</tspan></text><text x="470" y="416.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">empate (6,5) distingue la regla. Entre 61 notas, 3 dependen de ese ejemplo.</tspan></text><text x="470" y="464.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Calculado con round y decimal.ROUND_HALF_UP; idéntico en Windows y Ubuntu.</tspan></text></svg>
