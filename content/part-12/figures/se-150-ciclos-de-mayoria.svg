<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Decidir por mayoría entre alternativas: ciclos y reglas que discrepan</title><desc id="d">Barras horizontales con la frecuencia de ciclos de mayoría y desacuerdos: 5,56 por ciento de los perfiles con 3 votantes y 3 alternativas tienen ciclo, pluralidad y Borda discrepan en 25 por ciento, con 5 votantes el ciclo es 6,87 por ciento y con 4 alternativas el 13,99 por ciento no tiene ganador de Condorcet.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Decidir por mayoría entre alternativas: ciclos y reglas que discrepan</tspan></text><line x1="364" y1="49" x2="364" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="364" y1="225" x2="364" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="364" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364" dy="0">0</tspan></text><line x1="466.34" y1="49" x2="466.34" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="466.34" y1="225" x2="466.34" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="466.34" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="466.34" dy="0">5</tspan></text><line x1="568.68" y1="49" x2="568.68" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="568.68" y1="225" x2="568.68" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="568.68" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="568.68" dy="0">10</tspan></text><line x1="671.02" y1="49" x2="671.02" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="671.02" y1="225" x2="671.02" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="671.02" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="671.02" dy="0">15</tspan></text><line x1="773.36" y1="49" x2="773.36" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="773.36" y1="225" x2="773.36" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="773.36" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="773.36" dy="0">20</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="225" x2="875.7" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">25</tspan></text><line x1="364" y1="225" x2="875.7" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="354" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">3 votantes, 3 alternativas: ciclo de mayoría</tspan></text><text x="354" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">(12 de 216)</tspan></text><text x="354" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">3 votantes, 3 alternativas: pluralidad y Borda</tspan></text><text x="354" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">eligen distinto (54 de 216)</tspan></text><text x="354" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">5 votantes, 3 alternativas: ciclo (100 000</tspan></text><text x="354" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">perfiles)</tspan></text><text x="354" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">5 votantes, 4 alternativas: sin ganador de</tspan></text><text x="354" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Condorcet (100 000 perfiles)</tspan></text><rect x="364" y="55" width="113.802" height="32" rx="3" fill="#c0432f"/><text x="484.802" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="484.802" dy="0">5,56</tspan></text><rect x="364" y="99" width="511.7" height="32" rx="3" fill="#c0432f"/><text x="882.7" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">25,00</tspan></text><rect x="364" y="143" width="140.615" height="32" rx="3" fill="#c0432f"/><text x="511.615" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="511.615" dy="0">6,87</tspan></text><rect x="364" y="187" width="286.347" height="32" rx="3" fill="#c0432f"/><text x="657.347" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="657.347" dy="0">13,99</tspan></text><text x="619.85" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="619.85" dy="0">% de los perfiles</tspan></text><rect x="10" y="283" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Que A venza a B, B a C y C a A no es un error de cómputo: es una propiedad de las preferencias agregadas. Una negociación</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">que pide «lo que apoye la mayoría» puede no tener respuesta, o tener una distinta según el método.</tspan></text><text x="470" y="372.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Perfiles de preferencias sintéticos con todas las permutaciones equiprobables (semillas 1502 y 1503); supuesto de cultura imparcial.</tspan></text></svg>
