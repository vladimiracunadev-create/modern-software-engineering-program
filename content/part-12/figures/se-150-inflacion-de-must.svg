<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 467" width="940" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco interesados clasifican 40 requisitos: la inflación de «Must»</title><desc id="d">Barras con el número de requisitos marcados Must por cinco interesados con sesgos crecientes de 12, 16, 21, 22 y 26 de 40; si basta que alguien lo pida son 27, por mayoría 22 y por unanimidad 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="467" fill="#ffffff"/><text x="310" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="310" dy="0">Interesado sin sesgo</tspan></text><rect x="320" y="16" width="216" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="544" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="544" dy="0">12 de 40</tspan></text><text x="310" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="310" dy="0">Sesgo 0,1</tspan></text><rect x="320" y="60" width="288" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="616" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="616" dy="0">16</tspan></text><text x="310" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="310" dy="0">Sesgo 0,2</tspan></text><rect x="320" y="104" width="378" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="706" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="706" dy="0">21</tspan></text><text x="310" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="310" dy="0">Sesgo 0,3</tspan></text><rect x="320" y="148" width="396" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="724" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="724" dy="0">22</tspan></text><text x="310" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="310" dy="0">Sesgo 0,4</tspan></text><rect x="320" y="192" width="468" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="796" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="796" dy="0">26</tspan></text><text x="310" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="310" dy="0">«Must» si alguien lo pide</tspan></text><rect x="320" y="236" width="486" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="814" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="814" dy="0">27</tspan></text><text x="310" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="310" dy="0">«Must» por mayoría (≥3 de 5)</tspan></text><rect x="320" y="280" width="396" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="724" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="724" dy="0">22</tspan></text><text x="310" y="343.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="310" dy="0">«Must» por unanimidad</tspan></text><rect x="320" y="324" width="180" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="508" y="343.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="508" dy="0">10</tspan></text><rect x="10" y="372" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El mismo mundo produce entre 10 y 27 «Must» según la regla de agregación. Con presupuesto para 12 requisitos, solo un</tspan></text><text x="470" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ranking forzado o una regla de corte decide; MoSCoW por sí solo no pone un límite.</tspan></text><text x="470" y="453.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los sesgos son supuestos del autor.</tspan></text></svg>
