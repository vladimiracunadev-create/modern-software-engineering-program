t-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">73,7 %</tspan></text><rect x="590" y="102" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">54,4 %</tspan></text><rect x="750" y="102" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">29,6 %</tspan></text><rect x="10" y="148" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">5 % por sprint</tspan></text><rect x="270" y="148" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">77,4 %</tspan></text><rect x="430" y="148" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">59,9 %</tspan></text><rect x="590" y="148" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">35,8 %</tspan></text><rect x="750" y="148" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">12,9 %</tspan></text><rect x="10" y="198" width="900" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="222.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">El cálculo es (1−p)^sprints. En un verificador sintético con 10 requisitos, una etiqueta REQ-nnn en las pruebas detectó</tspan></text><text x="460" y="239.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">1 enlace colgante y 6 requisitos sin prueba, pero también dejó fuera dos pruebas bien intencionadas por escribir</tspan></text><text x="460" y="256.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">«req-005» y «REQ-0006».</tspan></text><text x="460" y="295.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Los porcentajes de degradación son hipótesis del autor; el verificador se ejecutó sobre un proyecto temporal con defectos inyectados.</tspan></text></svg>
