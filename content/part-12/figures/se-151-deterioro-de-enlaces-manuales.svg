<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fracción de enlaces manuales todavía correctos tras 5, 10, 20 y 40 sprints</title><desc id="d">Líneas con el porcentaje de enlaces de trazabilidad mantenidos a mano que siguen siendo correctos si cada sprint se degrada una fracción: con 1 por ciento por sprint quedan 66,9 por ciento tras 40 sprints, con 3 por ciento 29,6 y con 5 por ciento 12,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Fracción de enlaces manuales todavía correctos tras 5, 10, 20 y 40 sprints</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">1 % por sprint</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">3 % por sprint</tspan></text><polygon points="329.12,44.1 335.72,56.4 322.52,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="343.12" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="343.12" dy="0">5 % por sprint</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387