<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 309" width="920" height="309" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fracción de enlaces manuales todavía correctos tras 5, 10, 20 y 40 sprints</title><desc id="d">Tabla de enlaces de trazabilidad mantenidos a mano que siguen siendo correctos si cada sprint se degrada una fracción: con 1 por ciento queda 66,9 por ciento tras 40 sprints, con 3 por ciento 29,6 y con 5 por ciento 12,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="309" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Degradación</tspan></text><rect x="270" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="347" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">5 sprints</tspan></text><rect x="430" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">10 sprints</tspan></text><rect x="590" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">20 sprints</tspan></text><rect x="750" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43"