-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">29,6</tspan></text><polyline points="96.62,154.8 210.246,207.3 437.497,279.6 892,348.3" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="96.62,148.475 102.67,159.75 90.57,159.75" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="178.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">77,4</tspan></text><polygon points="210.246,200.975 216.296,212.25 204.196,212.25" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="210.246" y="231.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="210.246" dy="0">59,9</tspan></text><polygon points="437.497,273.275 443.547,284.55 431.447,284.55" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="437.497" y="303.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="437.497" dy="0">35,8</tspan></text><polygon points="892,341.975 898.05,353.25 885.95,353.25" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="372.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">12,9</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El cálculo es (1−p)^sprints. En un verificador sintético con 10 requisitos, una etiqueta REQ-nnn en las pruebas detectó 1</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">enlace colgante y 6 requisitos sin prueba, pero también dejó fuera dos pruebas bien intencionadas por escribir «req-005» y</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">«REQ-0006».</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los porcentajes de degradación son hipótesis del autor; el verificador se ejecutó sobre un proyecto temporal con defectos inyectados.</tspan></text></svg>
