<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 457" width="940" height="457" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Trazabilidad derivada: qué funciones toca realmente cada prueba (sys.settrace)</title><desc id="d">Mapa de calor de cinco pruebas y las cinco funciones que ejecutan según un trazador: T1 y T2 solo tarifa, T3 exento y total, T4 las cinco funciones y T5 exento; la prueba declarada de R4 toca también cuatro funciones de otros requisitos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="457" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Trazabilidad derivada: qué funciones toca realmente cada prueba (sys.settrace)</tspan></text><text x="419.6" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="419.6" dy="0">comprobante</tspan></text><text x="530.8" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530.8" dy="0">exento</tspan></text><text x="642" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642" dy="0">formato</tspan></text><text x="753.2" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="753.2" dy="0">tarifa</tspan></text><text x="864.4" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="864.4" dy="0">total</tspan></text><text x="354" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">T1 tarifa(0) · declara R1</tspan></text><text x="354" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">T2 tarifa(5) · declara R2</tspan></text><text x="354" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">T3 total(5, docente) · declara R3</tspan></text><text x="354" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">T4 comprobante(10, estudiante) · declara R4</tspan></text><text x="354" y="274.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">T5 exento(estudiante) · declara R3</tspan></text><rect x="365.5" y="73.5" width="108.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="419.6" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="419.6" dy="0">—</tspan></text><rect x="476.7" y="73.5" width="108.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="530.8" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530.8" dy="0">—</tspan></text><rect x="587.9" y="73.5" width="108.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="642" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642" dy="0">—</tspan></text><rect x="699.1" y="73.5" width="108.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="753.2" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="753.2" dy="0">ejecuta</tspan></text><rect x="810.3" y="73.5" width="108.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="864.4" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="864.4" dy="0">—</tspan></text><rect x="365.5" y="117.5" width="108.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="419.6" y="142.5" font-size="13"