n x="530.8" dy="0">ejecuta</tspan></text><rect x="587.9" y="249.5" width="108.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="642" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642" dy="0">—</tspan></text><rect x="699.1" y="249.5" width="108.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="753.2" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="753.2" dy="0">—</tspan></text><rect x="810.3" y="249.5" width="108.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="864.4" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="864.4" dy="0">—</tspan></text><text x="364" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="364" dy="0">—</tspan></text><rect x="379.54" y="306" width="30.5" height="14" fill="#dff1ee"/><rect x="409.54" y="306" width="30.5" height="14" fill="#c0e1e0"/><rect x="439.54" y="306" width="30.5" height="14" fill="#a2d0d2"/><rect x="469.54" y="306" width="30.5" height="14" fill="#83c0c4"/><rect x="499.54" y="306" width="30.5" height="14" fill="#64b0b6"/><rect x="529.54" y="306" width="30.5" height="14" fill="#45a0a8"/><rect x="559.54" y="306" width="30.5" height="14" fill="#278f9a"/><rect x="589.54" y="306" width="30.5" height="14" fill="#087f8c"/><text x="627.54" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="627.54" dy="0">ejecuta</tspan></text><text x="688.32" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="688.32" dy="0">más oscuro = mayor (funciones ejecutadas)</tspan></text><rect x="10" y="334" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="358.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El enlace declarado y el observado coinciden en R1–R3. T4 verifica el comprobante, pero un fallo en tarifa también la</tspan></text><text x="470" y="375.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">rompe: la prueba está acoplada a cuatro requisitos más (el contorno marca su fila). Ejecutar una función no prueba que se</tspan></text><text x="470" y="392.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">haya verificado su comportamiento.</tspan></text><text x="470" y="439.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con sys.settrace en CPython 3.12.9 (Windows) y 3.12.3 (Ubuntu); solo cuenta llamadas a funciones del módulo bajo prueba.</tspan></text></svg>
