<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 385" width="970" height="385" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Trazabilidad derivada: qué funciones toca realmente cada prueba (sys.settrace)</title><desc id="d">Tabla de cinco pruebas con las funciones que ejecutan según un trazador: T1 y T2 solo tarifa, T3 exento y total, T4 cinco funciones y T5 exento; la prueba declarada de R4 toca también cuatro funciones de otros requisitos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="385" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Prueba</tspan></text><rect x="330" y="12" width="454" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Funciones ejecutadas</tspan></text><rect x="790" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Requisito</tspan></text><text x="872" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">declarado</tspan></text><rect x="10" y="56" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">T1 tarifa(0)</tspan></text><rect x="330" y="56" width="454" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">tarifa</tspan></text><rect x="790" y="56" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">R1</tspan></text><rect x="10" y="102" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">T2 tarifa(5)</tspan></text><rect x="330" y="102" width="454" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">tarifa</tspan></text><rect x="790" y="102" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">R2</tspan></text><rect x="10" y="148" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">T3 total(5, docente)</tspan></text><rect x="330" y="148" width="454" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">exento, total</tspan></text><rect x="790" y="148" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">R3</tspan></text><rect x="10" y="194" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">T4 comprobante(10, estudiante)</tspan></text><rect x="330" y="194" width="454" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">comprobante, exento, formato, tarifa, total</tspan></text><rect x="790" y="194" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">R4</tspan></text><rect x="10" y="240" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">T5 exento(estudiante)</tspan></text><rect x="330" y="240" width="454" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">exento</tspan></text><rect x="790" y="240" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">R3</tspan></text><rect x="10" y="290" width="950" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">El enlace declarado y el observado coinciden en R1–R3. T4 verifica el comprobante, pero un fallo en tarifa también la rompe: la</tspan></text><text x="485" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">prueba está acoplada a cuatro requisitos más. Ejecutar una función no prueba que se haya verificado su comportamiento.</tspan></text><text x="485" y="371.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con sys.settrace en CPython 3.12.9 (Windows) y 3.12.3 (Ubuntu); solo cuenta llamadas a funciones del módulo bajo prueba.</tspan></text></svg>
