<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 351" width="1000" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Purga por retención en 10 000 registros sintéticos: cuántos se tratan mal según la variante</title><desc id="d">Barras de errores sobre 3907 registros que debían purgarse y 104 con retención legal: usar mayor o igual borra 10 de más; ignorar la retención de 730 días borra 1473; ignorar la retención legal borra 39; contar 12 meses como 360 días borra 83; un desfase de un día retiene 14 de más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="351" fill="#ffffff"/><text x="340" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">«&gt;=» en vez de «&gt;»</tspan></text><rect x="350" y="16" width="4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="362" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362" dy="0">10 borrados de más</tspan></text><text x="340" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">Ignora la retención de 730 días</tspan></text><rect x="350" y="60" width="441.9" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="799.9" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="799.9" dy="0">1 473 de más</tspan></text><text x="340" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">Ignora la retención legal</tspan></text><rect x="350" y="104" width="11.7" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="369.7" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="369.7" dy="0">39 de más</tspan></text><text x="340" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">«12 meses» como 360 días</tspan></text><rect x="350" y="148" width="24.9" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="382.9" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="382.9" dy="0">83 de más</tspan></text><text x="340" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">Desfase de un día por zona horaria</tspan></text><rect x="350" y="192" width="4.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="362.2" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362.2" dy="0">14 retenidos de más</tspan></text><rect x="10" y="240" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Cada variante parece correcta en una lectura rápida. Ignorar el caso de 730 días borra 1 473 registros que aún debían conservarse;</tspan></text><text x="500" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">ignorar la retención legal borra 39 que estaban bajo retención. Con un desfase de un día el error es de signo contrario: retiene</tspan></text><text x="500" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">datos que debían borrarse.</tspan></text><text x="500" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
