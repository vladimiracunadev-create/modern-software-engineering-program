<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 418" width="940" height="418" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">STRIDE por elemento en un diagrama de flujo de datos sintético con 18 elementos</title><desc id="d">Barras horizontales apiladas con las celdas de amenaza STRIDE por tipo de elemento: entidades externas 6 a revisar y 12 que no aplican, procesos 24 y 0, almacenes de datos 12 y 6, flujos de datos 24 y 24; en total 66 de 108 celdas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="418" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">STRIDE por elemento en un diagrama de flujo de datos sintético con 18 elementos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Celdas a revisar</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">No aplican</tspan></text><line x1="314" y1="77" x2="314" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="237" x2="314" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="426.34" y1="77" x2="426.34" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="426.34" y1="237" x2="426.34" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="426.34" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="426.34" dy="0">10</tspan></text><line x1="538.68" y1="77" x2="538.68" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="538.68" y1="237" x2="538.68" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="538.68" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="538.68" dy="0">20</tspan></text><line x1="651.02" y1="77" x2="651.02" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="651.02" y1="237" x2="651.02" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="651.02" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="651.02" dy="0">30</tspan></text><line x1="763.36" y1="77" x2="763.36" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="763.36" y1="237" x2="763.36" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="763.36" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="763.36" dy="0">40</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="237" x2="875.7" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">50</tspan></text><line x1="314" y1="237" x2="875.7" y2="237" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Entidad externa (3 · S, R)</tspan></text><text x="304" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Proceso (4 · S, T, R, I, D, E)</tspan></text><text x="304" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Almacén de datos (3 · T, R, I, D)</tspan></text><text x="304" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Flujo de datos (8 · T, I, D)</tspan></text><rect x="314" y="84" width="67.404" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="347.702" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347.702" dy="0">6</tspan></text><rect x="381.404" y="84" width="134.808" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="448.808" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="448.808" dy="0">12</tspan></text><text x="523.212" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="523.212" dy="0">18</tspan></text><rect x="314" y="124" width="269.616" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="448.808" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="448.808" dy="0">24</tspan></text><rect x="583.616" y="124" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="590.616" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="590.616" dy="0">24</tspan></text><rect x="314" y="164" width="134.808" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="381.404" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="381.404" dy="0">12</tspan></text><rect x="448.808" y="164" width="67.404" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="482.51" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482.51" dy="0">6</tspan></text><text x="523.212" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="523.212" dy="0">18</tspan></text><rect x="314" y="204" width="269.616" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="448.808" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="448.808" dy="0">24</tspan></text><rect x="583.616" y="204" width="269.616" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="718.424" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="718.424" dy="0">24</tspan></text><text x="860.232" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="860.232" dy="0">48</tspan></text><text x="594.85" y="281" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="594.85" dy="0">celdas de amenaza (6 categorías por elemento)</tspan></text><rect x="10" y="295" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="319.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Total: 18 elementos y 66 de 108 celdas. El mapa por elemento reduce 108 preguntas a 66, pero 66 sigue siendo una lista</tspan></text><text x="470" y="336.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">larga: cada celda debe terminar en un requisito, una aceptación explícita del riesgo o una nota de «no aplica». Una celda</tspan></text><text x="470" y="353.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sin decisión es un requisito de seguridad que nadie escribió.</tspan></text><text x="470" y="400.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Conteo aritmético con la tabla STRIDE por elemento de Microsoft; los números de elementos son un ejemplo del autor.</tspan></text></svg>
