<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 391" width="950" height="391" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">STRIDE por elemento en un diagrama de flujo de datos sintético con 18 elementos</title><desc id="d">Tabla de amenazas aplicables por tipo de elemento: 3 entidades externas con 2 categorías, 4 procesos con 6, 3 almacenes con 4 y 8 flujos con 3 suman 66 celdas de amenaza de las 108 posibles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="391" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Tipo de elemento</tspan></text><rect x="260" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Cantidad</tspan></text><rect x="400" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">Categorías aplicables</tspan></text><rect x="740" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Celdas a revisar</tspan></text><rect x="10" y="56" width="244" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Entidad externa</tspan></text><rect x="260" y="56" width="134" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">3</tspan></text><rect x="400" y="56" width="334" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">S, R</tspan></text><rect x="740" y="56" width="194" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">6</tspan></text><rect x="10" y="100" width="244" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Proceso</tspan></text><rect x="260" y="100" width="134" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">4</tspan></text><rect x="400" y="100" width="334" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">S, T, R, I, D, E</tspan></text><rect x="740" y="100" width="194" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">24</tspan></text><rect x="10" y="144" width="244" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="166.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Almacén de datos</tspan></text><rect x="260" y="144" width="134" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">3</tspan></text><rect x="400" y="144" width="334" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">T, R, I, D</tspan></text><rect x="740" y="144" width="194" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">12</tspan></text><rect x="10" y="188" width="244" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="210.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Flujo de datos</tspan></text><rect x="260" y="188" width="134" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">8</tspan></text><rect x="400" y="188" width="334" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">T, I, D</tspan></text><rect x="740" y="188" width="194" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">24</tspan></text><rect x="10" y="232" width="244" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="254.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Total</tspan></text><rect x="260" y="232" width="134" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">18</tspan></text><rect x="400" y="232" width="334" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">—</tspan></text><rect x="740" y="232" width="194" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">66 de 108</tspan></text><rect x="10" y="280" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="304.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">El mapa por elemento reduce 108 preguntas a 66, pero 66 sigue siendo una lista larga: cada celda debe terminar en un</tspan></text><text x="475" y="321.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">requisito, una aceptación explícita del riesgo o una nota de «no aplica». Una celda sin decisión es un requisito de</tspan></text><text x="475" y="338.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">seguridad que nadie escribió.</tspan></text><text x="475" y="377.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Conteo aritmético con la tabla STRIDE por elemento de Microsoft; los números de elementos son un ejemplo del autor.</tspan></text></svg>
