<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comité de cambios: espera de una solicitud según la cadencia (6 solicitudes por semana)</title><desc id="d">Barras agrupadas con la espera de solicitudes de cambio con llegadas de 6 por semana: reunirse cada 0,2 semanas da espera media 0,10 y p95 0,19; cada semana 0,50 y 0,95; cada 2 semanas 0,99 y 1,90; cada 4 semanas 1,97 y 3,79, con 1,2, 6,0, 12,0 y 23,9 solicitudes por reunión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Comité de cambios: espera de una solicitud según la cadencia (6 solicitudes por semana)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Espera media</tspan></text><rect x="154.48" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Espera p95</tspan></text><line x1="63.54" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="375" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="305" x2="63.54" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="235" x2="63.54" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="165" x2="63.54" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">semanas de espera</text><rect x="84.9515" y="368" width="83.646" height="7" rx="3" fill="#087f8c"/><text x="126.774" y="362" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.774" dy="0">0,10</tspan></text><rect x="172.597" y="361.7" width="83.646" height="13.3" rx="3" fill="#c0432f"/><text x="214.421" y="355.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214.421" dy="0">0,19</tspan></text><text x="170.597" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">Cada 0,2 semanas (1,2 por</tspan></text><text x="170.597" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">reunión)</tspan></text><rect x="299.067" y="340" width="83.646" height="35" rx="3" fill="#087f8c"/><text x="340.889" y="334" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="340.889" dy="0">0,50</tspan></text><rect x="386.713" y="308.5" width="83.646" height="66.5" rx="3" fill="#c0432f"/><text x="428.536" y="302.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="428.536" dy="0">0,95</tspan></text><text x="384.713" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">Cada semana (6,0 por</tspan></text><text x="384.713" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">reunión)</tspan></text><rect x="513.182" y="305.7" width="83.646" height="69.3" rx="3" fill="#087f8c"/><text x="555.005" y="299.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="555.005" dy="0">0,99</tspan></text><rect x="600.828" y="242" width="83.646" height="133" rx="3" fill="#c0432f"/><text x="642.651" y="236" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642.651" dy="0">1,90</tspan></text><text x="598.828" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">Cada 2 semanas (12,0 por</tspan></text><text x="598.828" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">reunión)</tspan></text><rect x="727.296" y="237.1" width="83.646" height="137.9" rx="3" fill="#087f8c"/><text x="769.119" y="231.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="769.119" dy="0">1,97</tspan></text><rect x="814.942" y="109.7" width="83.646" height="265.3" rx="3" fill="#c0432f"/><text x="856.765" y="103.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.765" dy="0">3,79</tspan></text><text x="812.942" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">Cada 4 semanas (23,9 por</tspan></text><text x="812.942" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">reunión)</tspan></text><rect x="10" y="444" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La espera media es la mitad del periodo, y la carga por reunión crece con él: a las cuatro semanas el comité revisa 24</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solicitudes de una vez. La cadencia es una decisión de costo y estabilidad, no una convención de calendario.</tspan></text><text x="470" y="533.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Llegadas de Poisson sintéticas con semilla 1530; la tasa de 6 por semana es un supuesto del autor.</tspan></text></svg>
