<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 263" width="960" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tabla estado–evento de una entrega: 6 estados × 7 eventos = 42 celdas</title><desc id="d">Barras del estado de 42 celdas de una máquina de estados de una entrega: 10 definidas, 11 imposibles por una regla explícita y 21 preguntas abiertas, como qué ocurre al enviar una entrega ya enviada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="263" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Definidas en la especificación</tspan></text><rect x="340" y="16" width="200" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="548" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="548" dy="0">10</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Imposibles por una regla escrita</tspan></text><rect x="340" y="60" width="220" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="568" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="568" dy="0">11</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Preguntas abiertas</tspan></text><rect x="340" y="104" width="420" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="768" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="768" dy="0">21</tspan></text><rect x="10" y="152" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El borrador de especificación define 10 de 42 celdas. Las 21 preguntas abiertas incluyen casos reales: calificar una entrega</tspan></text><text x="480" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">solo «Enviada», retirar una entrega «En revisión», expirar sesión en cualquier estado posterior. Cada una es un requisito que</tspan></text><text x="480" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">alguien tendrá que inventar en código.</tspan></text><text x="480" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
