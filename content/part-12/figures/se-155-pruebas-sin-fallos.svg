<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pruebas sin fallo necesarias para afirmar con 95 % de confianza que la tasa de fallo es menor que p</title><desc id="d">Barras agrupadas en escala logarítmica con las pruebas sin ningún fallo necesarias para acotar la tasa de fallo con 95 por ciento de confianza: 299 para 1 por ciento, 2995 para 1 por mil, 29 956 para 1 por diez mil y 2 995 731 para 1 por millón, casi iguales a la regla de tres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pruebas sin fallo necesarias para afirmar con 95 % de confianza que la tasa de fallo es menor que p</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pruebas sin fallo (exacto)</tspan></text><rect x="260.04" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Regla de tres (3/p)</tspan></text><line x1="131.4" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="375" x2="131.4" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">100</tspan></text><line x1="131.4" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="319" x2="131.4" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">1 000</tspan></text><line x1="131.4" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="263" x2="131.4" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">10 000</tspan></text><line x1="131.4" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="207" x2="131.4" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">100 000</tspan></text><line x1="131.4" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="151" x2="131.4" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">1 000 000</tspan></text><line x1="131.4" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="95" x2="131.4" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">10 000 000</tspan></text><line x1="131.4" y1="95" x2="131.4" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">pruebas sin ningún fallo (escala logarítmica)</text><rect x="151.115" y="348.362" width="76.86" height="26.6376" rx="3" fill="#087f8c"/><text x="189.545" y="342.362" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="189.545" dy="0">299</tspan></text><rect x="231.975" y="348.281" width="76.86" height="26.7188" rx="3" fill="#6b7c86"/><text x="270.405" y="342.281" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.405" dy="0">300</tspan></text><text x="229.975" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="229.975" dy="0">1 por 100 (1e-2)</tspan></text><rect x="348.265" y="292.322" width="76.86" height="82.6782" rx="3" fill="#087f8c"/><text x="386.695" y="286.322" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="386.695" dy="0">2 995</tspan></text><rect x="429.125" y="292.281" width="76.86" height="82.7188" rx="3" fill="#6b7c86"/><text x="467.555" y="286.281" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="467.555" dy="0">3 000</tspan></text><text x="427.125" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427.125" dy="0">1 por 1 000 (1e-3)</tspan></text><rect x="545.415" y="236.317" width="76.86" height="138.683" rx="3" fill="#087f8c"/><text x="583.845" y="230.317" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="583.845" dy="0">29 956</tspan></text><rect x="626.275" y="236.281" width="76.86" height="138.719" rx="3" fill="#6b7c86"/><text x="664.705" y="230.281" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="664.705" dy="0">30 000</tspan></text><text x="624.275" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="624.275" dy="0">1 por 10 000 (1e-4)</tspan></text><rect x="742.565" y="124.316" width="76.86" height="250.684" rx="3" fill="#087f8c"/><text x="780.995" y="118.316" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="780.995" dy="0">2 995 731</tspan></text><rect x="823.425" y="124.281" width="76.86" height="250.719" rx="3" fill="#6b7c86"/><text x="861.855" y="118.281" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="861.855" dy="0">3 000 000</tspan></text><text x="821.425" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.425" dy="0">1 por millón (1e-6)</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada orden de magnitud de confianza en la tasa cuesta diez veces más pruebas. «El sistema nunca perderá datos» no se puede</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">verificar con pruebas finitas. Con 100 pruebas sin fallos solo se puede afirmar que la tasa es menor que 3 %, y un sistema</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">que falla 2 % de las veces pasa esas 100 pruebas en 12,8 % de las ocasiones.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo exacto y simulación con semilla 155; idéntico en Windows y Ubuntu.</tspan></text></svg>
