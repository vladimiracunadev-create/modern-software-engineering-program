<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 369" width="940" height="369" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Regla léxica de verificabilidad (4 señales, umbral 3) frente a 26 enunciados</title><desc id="d">Tabla de una regla que puntúa cantidad con unidad, condición, estadístico o cota y respuesta observable: clasifica bien 10 de 10 enunciados vagos, 8 de 10 enunciados reparados y 6 de 6 enunciados nuevos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="369" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Conjunto</tspan></text><rect x="320" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Resultado</tspan></text><rect x="550" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Lectura</tspan></text><rect x="10" y="56" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">10 requisitos no verificables</tspan></text><rect x="320" y="56" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">10 de 10 bajo el umbral</tspan></text><rect x="550" y="56" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">El puntaje promedio es 0,1 de 4 señales</tspan></text><rect x="10" y="122" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">10 reparados por el autor</tspan></text><rect x="320" y="122" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">8 de 10 sobre el umbral</tspan></text><rect x="550" y="122" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="147.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Dos fallan: «completará» y «redondeará» no están</tspan></text><text x="737" y="163.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">en la lista de verbos (puntajes 2 y 0)</tspan></text><rect x="10" y="188" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="221.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">6 enunciados nuevos</tspan></text><rect x="320" y="188" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">6 de 6 acertados</tspan></text><rect x="550" y="188" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="213.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Con casos escritos después de fijar la regla;</tspan></text><text x="737" y="229.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">muestra muy pequeña</tspan></text><rect x="10" y="258" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La regla no entiende nada: cuenta señales. Marcó como no verificable una reparación correcta («redondeará a un decimal con</tspan></text><text x="470" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mitad hacia arriba… 25 casos») porque su vocabulario no incluye «redondeará». Sirve para mirar primero lo más vago, no para</tspan></text><text x="470" y="316.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aprobar.</tspan></text><text x="470" y="355.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Reglas y etiquetas escritas por el autor; seis casos nuevos no bastan para estimar una exactitud real.</tspan></text></svg>
