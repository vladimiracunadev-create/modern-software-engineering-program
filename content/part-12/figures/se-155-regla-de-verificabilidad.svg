<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Regla léxica de verificabilidad (4 señales, umbral 3) frente a 26 enunciados</title><desc id="d">Barras horizontales apiladas con los enunciados bien y mal clasificados por una regla que puntúa cantidad con unidad, condición, estadístico o cota y respuesta observable: 10 de 10 enunciados vagos, 8 de 10 reparados y 6 de 6 nuevos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Regla léxica de verificabilidad (4 señales, umbral 3) frente a 26 enunciados</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Clasificados como se esperaba</tspan></text><rect x="282.66" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Clasificados mal</tspan></text><line x1="274" y1="77" x2="274" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="197" x2="274" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="77" x2="394.34" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="197" x2="394.34" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">2</tspan></text><line x1="514.68" y1="77" x2="514.68" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="197" x2="514.68" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">4</tspan></text><line x1="635.02" y1="77" x2="635.02" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="197" x2="635.02" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">6</tspan></text><line x1="755.36" y1="77" x2="755.36" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="197" x2="755.36" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">8</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="197" x2="875.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10</tspan></text><line x1="274" y1="197" x2="875.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">10 requisitos no verificables</tspan></text><text x="264" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">10 reparados por el autor</tspan></text><text x="264" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">6 enunciados nuevos</tspan></text><rect x="274" y="84" width="601.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="574.85" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.85" dy="0">10</tspan></text><rect x="875.7" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">10</tspan></text><rect x="274" y="124" width="481.36" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="514.68" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="514.68" dy="0">8</tspan></text><rect x="755.36" y="124" width="120.34" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="815.53" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="815.53" dy="0">2</tspan></text><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">10</tspan></text><rect x="274" y="164" width="361.02" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="454.51" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="454.51" dy="0">6</tspan></text><rect x="635.02" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="642.02" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="642.02" dy="0">6</tspan></text><text x="574.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">enunciados</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La regla no entiende nada: cuenta señales. Los 10 vagos tienen un puntaje medio de 0,1 de 4 señales. Marcó como no</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">verificable una reparación correcta («redondeará a un decimal con mitad hacia arriba… 25 casos») porque su vocabulario no</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">incluye «redondeará»; las dos reparaciones que fallan puntúan 2 y 0. Sirve para mirar primero lo más vago, no para aprobar.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Reglas y etiquetas escritas por el autor; seis casos nuevos no bastan para estimar una exactitud real.</tspan></text></svg>
