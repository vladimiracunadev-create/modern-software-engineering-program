<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 335" width="980" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Duración acumulada mínima de cinco requisitos con dependencias (costos supuestos en días)</title><desc id="d">Barras del tiempo acumulado de cada requisito: REQ-001 5 días, REQ-003 2, REQ-002 8, REQ-005 8 y REQ-004 9; la suma secuencial es 17 días y el camino crítico 9, por REQ-001 seguido de REQ-004.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="335" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">REQ-001 (5 días)</tspan></text><rect x="370" y="16" width="200" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="578" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="578" dy="0">5</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">REQ-003 (2 días, sin dependencias)</tspan></text><rect x="370" y="60" width="80" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="458" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="458" dy="0">2</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">REQ-002 (necesita REQ-001)</tspan></text><rect x="370" y="104" width="320" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="698" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="698" dy="0">8</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">REQ-005 (necesita REQ-001)</tspan></text><rect x="370" y="148" width="320" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="698" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="698" dy="0">8</tspan></text><text x="360" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">REQ-004 (necesita REQ-001)</tspan></text><rect x="370" y="192" width="360" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="738" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="738" dy="0">9, camino crítico</tspan></text><rect x="10" y="240" width="960" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Con costos de 5, 3, 2, 4 y 3 días la suma secuencial es 17 y el camino crítico solo 9, porque tres requisitos pueden avanzar a la</tspan></text><text x="490" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">vez una vez terminado REQ-001. Una especificación que declara dependencias permite ese cálculo; una que no las declara no.</tspan></text><text x="490" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Costos y dependencias de un ejemplo del autor; cálculo exacto.</tspan></text></svg>
