<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 434" width="940" height="434" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de una especificación sintética con 16 defectos inyectados: 11 de 16 detectados</title><desc id="d">Barras horizontales apiladas con los defectos detectados y no detectados por un validador de especificaciones: las estructurales se detectan 8 de 8, las de completitud 3 de 3, el vocabulario flexionado 0 de 1 y las semánticas (umbral absurdo, contradicción, criterio ajeno y ambigüedad) 0 de 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="434" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Validador de una especificación sintética con 16 defectos inyectados: 11 de 16 detectados</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectados</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectados</tspan></text><line x1="354" y1="77" x2="354" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="253" x2="354" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="484.425" y1="77" x2="484.425" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="484.425" y1="253" x2="484.425" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="484.425" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="484.425" dy="0">2</tspan></text><line x1="614.85" y1="77" x2="614.85" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="614.85" y1="253" x2="614.85" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="614.85" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="614.85" dy="0">4</tspan></text><line x1="745.275" y1="77" x2="745.275" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="745.275" y1="253" x2="745.275" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="745.275" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="745.275" dy="0">6</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="253" x2="875.7" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">8</tspan></text><line x1="354" y1="253" x2="875.7" y2="253" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Estructurales (id duplicado, criterio</tspan></text><text x="344" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">inexistente, ciclo…)</tspan></text><text x="344" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">De completitud (sin supuestos, «por</tspan></text><text x="344" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">definir»…)</tspan></text><text x="344" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Vocabulario («adecuada» frente a «adecuado»)</tspan></text><text x="344" y="227" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Semánticas (30 → 3 000 días, plazos</tspan></text><text x="344" y="244" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">contradictorios…)</tspan></text><rect x="354" y="84" width="521.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">8</tspan></text><rect x="875.7" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">8</tspan></text><rect x="354" y="128" width="195.638" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="451.819" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="451.819" dy="0">3</tspan></text><rect x="549.638" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="556.638" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="556.638" dy="0">3</tspan></text><rect x="354" y="172" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="172" width="65.2125" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="386.606" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="386.606" dy="0">1</tspan></text><text x="426.212" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="426.212" dy="0">1</tspan></text><rect x="354" y="216" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="216" width="260.85" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="484.425" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="484.425" dy="0">4</tspan></text><text x="621.85" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="621.85" dy="0">4</tspan></text><text x="614.85" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">defectos inyectados</tspan></text><rect x="10" y="311" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La especificación base no produce errores. El validador comprueba forma y referencias; no compara 30 con 3 000 días, no</tspan></text><text x="470" y="352.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sabe que dos plazos se excluyen y no distingue un criterio ajeno. Esa parte la cubre la revisión humana. Detectar 11 de 16</tspan></text><text x="470" y="369.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">no es una probabilidad de que una especificación real esté bien.</tspan></text><text x="470" y="416.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
