<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 379" width="980" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutantes de la regla de penalización que cada suite de ejemplos mata</title><desc id="d">Barras: de once mutantes, dos equivalentes y nueve distinguibles; tres ejemplos de camino feliz matan 3, diez aleatorios en media 7,15, seis ejemplos de frontera 8 y tres ejemplos elegidos por cobertura voraz los 9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="379" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">3 ejemplos de camino feliz</tspan></text><rect x="340" y="16" width="165" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="513" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="513" dy="0">3 de 9</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">3 ejemplos aleatorios (media de 300)</tspan></text><rect x="340" y="60" width="336.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="684.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="684.6" dy="0">6,12</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">6 ejemplos aleatorios (media de 300)</tspan></text><rect x="340" y="104" width="377.3" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="725.3" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="725.3" dy="0">6,86</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">10 ejemplos aleatorios (media de 300)</tspan></text><rect x="340" y="148" width="393.25" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="741.25" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="741.25" dy="0">7,15</tspan></text><text x="330" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">6 ejemplos de frontera</tspan></text><rect x="340" y="192" width="440" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="788" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788" dy="0">8 de 9</tspan></text><text x="330" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">3 ejemplos de cobertura voraz</tspan></text><rect x="340" y="236" width="495" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="843" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="843" dy="0">9 de 9</tspan></text><rect x="10" y="284" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El número de ejemplos importa menos que su ubicación: tres ejemplos elegidos para separar mutantes superan a diez al azar. Los</tspan></text><text x="490" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">dos mutantes equivalentes no mueren con ningún ejemplo: no son defectos.</tspan></text><text x="490" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
