<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 438" width="940" height="438" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mini ejecutor de Gherkin: pasos indefinidos, ambiguos y definiciones sin uso</title><desc id="d">Diagrama de lo que detecta un ejecutor de Gherkin sobre cuatro escenarios con doce pasos y cinco definiciones: dos pasos indefinidos, tres ambiguos porque encajan con dos patrones y una definición de cinco sin uso; detecta la forma de la redacción, no su significado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="438" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mini ejecutor de Gherkin: pasos indefinidos, ambiguos y definiciones sin uso</tspan></text><rect x="14" y="147.96" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="169.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Ejecutor de Gherkin</tspan></text><text x="139" y="186.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">4 escenarios, 12 pasos y 5</tspan></text><text x="139" y="203.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">definiciones</tspan></text><rect x="334" y="49" width="592" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">Ambiguo (escenarios 1 y 2)</tspan></text><text x="630" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">el paso 2 encaja con dos patrones y el ejecutor no sabe cuál usar</tspan></text><polyline points="264,182.96 299,182.96 299,76 334,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="115" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="136.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Indefinido (escenario 3)</tspan></text><text x="630" y="153.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">ningún patrón reconoce «envía»: un cambio de redacción deja el paso sin</tspan></text><text x="630" y="170.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">definición</tspan></text><polyline points="264,182.96 299,182.96 299,149.96 334,149.96" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="196.92" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="219.24" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Ambiguo e indefinido (escenario 4)</tspan></text><text x="630" y="235.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">un paso con dos patrones y otro sin ninguno: no comprueba nada</tspan></text><polyline points="264,182.96 299,182.96 299,223.92 334,223.92" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="262.92" width="592" height="54" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="630" y="285.24" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="630" dy="0">En total: 2 indefinidos, 3 ambiguos y 1 definición sin uso</tspan></text><text x="630" y="301.88" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="630" dy="0">de 12 pasos y 5 definiciones; el ejecutor detecta forma, no significado</tspan></text><polyline points="264,182.96 299,182.96 299,289.92 334,289.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="330.92" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="355.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En total: 12 pasos, 2 indefinidos, 3 ambiguos (la definición «la estudiante entrega (.+)» solapa con la específica) y 1 de</tspan></text><text x="470" y="372.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">5 definiciones sin uso. El ejecutor detecta forma, no significado.</tspan></text><text x="470" y="420.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
