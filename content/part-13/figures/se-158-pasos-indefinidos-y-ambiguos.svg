<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 411" width="1030" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mini ejecutor de Gherkin: pasos indefinidos, ambiguos y definiciones sin uso</title><desc id="d">Tabla de cuatro escenarios con doce pasos contra cinco definiciones: dos pasos indefinidos, tres ambiguos y una definición sin uso, lo que muestra qué errores de redacción detecta un ejecutor antes de probar el producto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="411" fill="#ffffff"/><rect x="10" y="12" width="54" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="37" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="37" dy="0">N.º</tspan></text><rect x="70" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Pasos del escenario</tspan></text><rect x="400" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Resultado del emparejamiento</tspan></text><rect x="730" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Lectura</tspan></text><rect x="10" y="56" width="54" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="37" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="37" dy="0">1</tspan></text><rect x="70" y="56" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="232" dy="0">plazo 24 h · entrega con 30 h · nota 90</tspan></text><rect x="400" y="56" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">El paso 2 encaja con dos patrones</tspan></text><rect x="730" y="56" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">Ambiguo: el ejecutor no sabe cuál usar</tspan></text><rect x="10" y="120" width="54" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="37" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="37" dy="0">2</tspan></text><rect x="70" y="120" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="232" dy="0">entrega con 0 h de retraso · nota 100</tspan></text><rect x="400" y="120" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">El paso 2 encaja con dos patrones</tspan></text><rect x="730" y="120" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">Ambiguo, igual que el anterior</tspan></text><rect x="10" y="184" width="54" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="37" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="37" dy="0">3</tspan></text><rect x="70" y="184" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="232" dy="0">«envía con 30 h de retraso»</tspan></text><rect x="400" y="184" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">Ningún patrón reconoce «envía»</tspan></text><rect x="730" y="184" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">Indefinido por un cambio de redacción</tspan></text><rect x="10" y="248" width="54" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="37" y="280.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="37" dy="0">4</tspan></text><rect x="70" y="248" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="232" dy="0">paso 2 ambiguo y «se muestra una alerta»</tspan></text><rect x="400" y="248" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">Un paso con dos patrones y otro sin ninguno</tspan></text><rect x="730" y="248" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">Ambiguo e indefinido: no comprueba nada</tspan></text><rect x="10" y="316" width="1010" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="515" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">En total: 12 pasos, 2 indefinidos, 3 ambiguos (la definición «la estudiante entrega (.+)» solapa con la específica) y 1 de 5</tspan></text><text x="515" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">definiciones sin uso. El ejecutor detecta forma, no significado.</tspan></text><text x="515" y="397.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
