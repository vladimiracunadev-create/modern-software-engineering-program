<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 335" width="1040" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tabla de ejemplos: producto completo frente a cobertura de pares</title><desc id="d">Barras: cuatro factores de tres valores dan 81 filas; una suite de todos los pares tiene 9 y mata los 246 fallos de dos factores, pero solo 92 de 300 fallos de tres factores, apenas más que 87 con nueve filas al azar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="335" fill="#ffffff"/><text x="380" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Producto completo de 4 factores</tspan></text><rect x="390" y="16" width="162" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="560" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="560" dy="0">81 filas</tspan></text><text x="380" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Suite de todos los pares</tspan></text><rect x="390" y="60" width="18" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="416" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="416" dy="0">9 filas</tspan></text><text x="380" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Fallos de 2 factores: matados por los pares</tspan></text><rect x="390" y="104" width="492" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="890" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="890" dy="0">246 de 246</tspan></text><text x="380" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Fallos de 3 factores: matados por los pares</tspan></text><rect x="390" y="148" width="184" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="582" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="582" dy="0">92 de 300</tspan></text><text x="380" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Fallos de 3 factores: 9 filas al azar</tspan></text><rect x="390" y="192" width="174" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="572" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="572" dy="0">87 de 300</tspan></text><rect x="10" y="240" width="1020" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">Cubrir todos los pares es un acuerdo económico: reduce 81 filas a 9 y es exacto para interacciones de dos factores. No protege contra</tspan></text><text x="520" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">interacciones de tres: ahí 9 filas bien elegidas rinden casi como 9 al azar.</tspan></text><text x="520" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
