<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 247" width="1060" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Invariante violado y reparado en silencio: cuántas veces se escapa</title><desc id="d">Barras: en 1 000 corridas de 200 operaciones con un defecto introducido entre la operación 20 y la 120 y una operación que repara el estado con 5 por ciento de probabilidad, comprobar tras cada operación no pierde ninguna, cada 20 pierde 356 y solo al final pierde 997.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="247" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Comprobar el invariante tras cada operación</tspan></text><rect x="410" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422" dy="0">0 de 1 000 sin detectar</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Comprobar cada 20 operaciones</tspan></text><rect x="410" y="60" width="160.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="578.2" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="578.2" dy="0">356 sin detectar</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Comprobar solo al final de 200 operaciones</tspan></text><rect x="410" y="104" width="448.65" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="866.65" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="866.65" dy="0">997 sin detectar</tspan></text><rect x="10" y="152" width="1040" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">Comprobar más cerca del cambio localiza (distancia media 0 frente a 8,0 operaciones) y evita que el estado se repare solo antes del examen.</tspan></text><text x="530" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">Las cifras dependen de la probabilidad de reparación (5 %), que es un supuesto del autor.</tspan></text><text x="530" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
