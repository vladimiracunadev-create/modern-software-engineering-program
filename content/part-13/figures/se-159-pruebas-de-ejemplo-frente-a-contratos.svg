<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 770" width="940" height="770" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nueve mutantes de una clase con contratos: pruebas de ejemplo frente a contratos</title><desc id="d">Barras horizontales con las ejecuciones, de 200, en que salta un contrato en cada uno de nueve mutantes de una clase de calificación, frente a las cinco pruebas de ejemplo, que no matan ninguno: los contratos saltan en 200 de 200 con el estado que salta a publicada y con publicar que borra la nota, y en 0 con el mutante 5 y con los equivalentes 4 y 8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="770" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nueve mutantes de una clase con contratos: pruebas de ejemplo frente a contratos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cinco pruebas de ejemplo</tspan></text><rect x="244.96" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="264.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Contratos con conductor aleatorio</tspan></text><line x1="294" y1="77" x2="294" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="589" x2="294" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="443.455" y1="77" x2="443.455" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="443.455" y1="589" x2="443.455" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="443.455" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="443.455" dy="0">50</tspan></text><line x1="592.91" y1="77" x2="592.91" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="592.91" y1="589" x2="592.91" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="592.91" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592.91" dy="0">100</tspan></text><line x1="742.365" y1="77" x2="742.365" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="742.365" y1="589" x2="742.365" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="742.365" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742.365" dy="0">150</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="589" x2="891.82" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">200</tspan></text><line x1="294" y1="589" x2="891.82" y2="589" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">1 · Nota sin acotar</tspan></text><text x="284" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">2 · Salta a «publicada» al calificar</tspan></text><text x="284" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">3 · Nota sin cota inferior</tspan></text><text x="284" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">4 · Estado redundante (equivalente)</tspan></text><text x="284" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">5 · Prórroga duplicada, tope intacto</tspan></text><text x="284" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">6 y 7 · Prórroga sin tope</tspan></text><text x="284" y="489" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">8 · Publicar conserva la nota</tspan></text><text x="284" y="506" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">(equivalente)</tspan></text><text x="284" y="561.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">9 · Publicar borra la nota</tspan></text><rect x="294" y="83" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="303" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="110.5" width="349.725" height="24.5" rx="3" fill="#087f8c"/><text x="650.725" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="650.725" dy="0">117</tspan></text><rect x="294" y="147" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="303" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="174.5" width="597.82" height="24.5" rx="3" fill="#087f8c"/><text x="898.82" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">200</tspan></text><rect x="294" y="211" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="303" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="238.5" width="185.324" height="24.5" rx="3" fill="#087f8c"/><text x="486.324" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="486.324" dy="0">62</tspan></text><rect x="294" y="275" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="303" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="302.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="339" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="303" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="366.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="403" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="303" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="430.5" width="591.842" height="24.5" rx="3" fill="#087f8c"/><text x="892.842" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="892.842" dy="0">198</tspan></text><rect x="294" y="467" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="303" y="483.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="494.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="511.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="531" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="303" y="547.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="558.5" width="597.82" height="24.5" rx="3" fill="#087f8c"/><text x="898.82" y="575.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">200</tspan></text><text x="592.91" y="633" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592.91" dy="0">Ejecuciones en que salta, de 200</tspan></text><rect x="10" y="647" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="671.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los contratos detectan lo que afirman: nota acotada, estado válido, prórroga ≤ 72. El mutante 5 duplica la prórroga sin</tspan></text><text x="470" y="688.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pasar el tope y nadie declaró cuánto debía valer: lo no escrito no se comprueba. Sobrecoste de comprobar: 1,44 veces en</tspan></text><text x="470" y="705.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Windows y 1,47 en Ubuntu (100 000 llamadas).</tspan></text><text x="470" y="752.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
