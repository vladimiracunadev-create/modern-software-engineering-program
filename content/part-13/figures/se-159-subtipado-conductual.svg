<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 291" width="1130" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Subtipado conductual: qué rompe un cliente que usa la clase base</title><desc id="d">Barras: de 10 000 entradas aleatorias, 5 224 son válidas para la base; un subtipo que exige más las rechaza 1 777 veces, uno que acepta más ninguna, y uno que garantiza menos devuelve 913 resultados negativos que el cliente no espera.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1130" height="291" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Llamadas válidas para la clase base</tspan></text><rect x="480" y="16" width="470.16" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="958.16" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="958.16" dy="0">5 224</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Rechazadas si el subtipo refuerza la precondición</tspan></text><rect x="480" y="60" width="159.93" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="647.93" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="647.93" dy="0">1 777 (34,0 %)</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Rechazadas si el subtipo debilita la precondición</tspan></text><rect x="480" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="492" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">0</tspan></text><text x="470" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Resultados negativos si el subtipo debilita la postcondición</tspan></text><rect x="480" y="148" width="82.17" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="570.17" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="570.17" dy="0">913 de 10 000</tspan></text><rect x="10" y="196" width="1110" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="565" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="565" dy="0">Reforzar la precondición o debilitar la postcondición viola lo que el cliente de la base daba por seguro; aceptar más o garantizar más no lo viola.</tspan></text><text x="565" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="565" dy="0">La regla vale para las promesas escritas: si el contrato no dice nada, el cliente dependerá de lo que observó.</tspan></text><text x="565" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="565" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
