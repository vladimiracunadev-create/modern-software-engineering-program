<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 626" width="940" height="626" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comprobador de un modelo de ocho entidades: qué defectos ve</title><desc id="d">Barras horizontales con las mutaciones inyectadas y detectadas por un comprobador de un modelo de ocho entidades: detecta todas las referencias inexistentes, herencias circulares, campos duplicados e identificadores ausentes (197 de 197) y ninguna de las 103 que cambian una cardinalidad o invierten una relación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="626" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Comprobador de un modelo de ocho entidades: qué defectos ve</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Inyectados</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Detectados</tspan></text><line x1="294" y1="77" x2="294" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="461" x2="294" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="394.98" y1="77" x2="394.98" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="394.98" y1="461" x2="394.98" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="394.98" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.98" dy="0">10</tspan></text><line x1="495.96" y1="77" x2="495.96" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="495.96" y1="461" x2="495.96" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="495.96" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.96" dy="0">20</tspan></text><line x1="596.94" y1="77" x2="596.94" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="596.94" y1="461" x2="596.94" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="596.94" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="596.94" dy="0">30</tspan></text><line x1="697.92" y1="77" x2="697.92" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="697.92" y1="461" x2="697.92" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="697.92" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697.92" dy="0">40</tspan></text><line x1="798.9" y1="77" x2="798.9" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="798.9" y1="461" x2="798.9" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="798.9" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="798.9" dy="0">50</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="461" x2="899.88" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">60</tspan></text><line x1="294" y1="461" x2="899.88" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Referencia a una entidad inexistente</tspan></text><text x="284" y="177.5" font-size="13" text-anchor="e