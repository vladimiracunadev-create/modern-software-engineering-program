94" y="275" width="484.704" height="24.5" rx="3" fill="#6b7c86"/><text x="785.704" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="785.704" dy="0">48</tspan></text><rect x="294" y="302.5" width="484.704" height="24.5" rx="3" fill="#087f8c"/><text x="785.704" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="785.704" dy="0">48</tspan></text><rect x="294" y="339" width="494.802" height="24.5" rx="3" fill="#6b7c86"/><text x="795.802" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="795.802" dy="0">49</tspan></text><rect x="294" y="366.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="403" width="545.292" height="24.5" rx="3" fill="#6b7c86"/><text x="846.292" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="846.292" dy="0">54</tspan></text><rect x="294" y="430.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><text x="596.94" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="596.94" dy="0">Mutaciones</tspan></text><rect x="10" y="519" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un modelo puede ser estructuralmente perfecto y falso: la regla «una tarea pertenece a un curso» sobrevive a un cambio a</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">«0..*» porque ambas versiones son consistentes. La semántica la revisa una persona con el dominio.</tspan></text><text x="470" y="608.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
