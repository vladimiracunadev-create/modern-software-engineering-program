<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 395" width="970" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Deriva entre el modelo y el código leída con ast: nombres frente a nombres y tipos</title><desc id="d">Tabla de 250 mutaciones del código fuente de seis clases: comparar solo nombres detecta renombrados, borrados y agregados pero ninguno de los 55 cambios de tipo; comparar nombres y anotaciones de tipo los detecta todos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="395" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Mutación del código</tspan></text><rect x="340" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="407" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407" dy="0">Aplicadas</tspan></text><rect x="480" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Detecta solo nombres</tspan></text><rect x="700" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Detecta nombres y tipos</tspan></text><rect x="10" y="56" width="324" height="42" rx=