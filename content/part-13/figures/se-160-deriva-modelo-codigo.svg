2" y="176.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Agregar un campo</tspan></text><rect x="340" y="152" width="134" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">44</tspan></text><rect x="480" y="152" width="214" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">44</tspan></text><rect x="700" y="152" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">44</tspan></text><rect x="10" y="200" width="324" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="224.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Renombrar una clase</tspan></text><rect x="340" y="200" width="134" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">62</tspan></text><rect x="480" y="200" width="214" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">62</tspan></text><rect x="700" y="200" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">62</tspan></text><rect x="10" y="248" width="324" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="272.64" font-size="13" text-anchor="middle" font-weig