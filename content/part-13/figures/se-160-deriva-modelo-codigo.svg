<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 692" width="940" height="692" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Deriva entre el modelo y el código leída con ast: nombres frente a nombres y tipos</title><desc id="d">Barras horizontales con las mutaciones del código que detecta cada comparación: comparar solo nombres detecta los renombrados, borrados y agregados pero ninguno de los 55 cambios de tipo; comparar nombres y anotaciones de tipo detecta todas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="692" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Deriva entre el modelo y el código leída con ast: nombres frente a nombres y tipos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aplicadas</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Detecta solo nombres</tspan></text><rect x="330.66" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="350.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="350.66" dy="0">Detecta nombres y tipos</tspan></text><line x1="254" y1="77" x2="254" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="527" x2="254" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="548" font-s