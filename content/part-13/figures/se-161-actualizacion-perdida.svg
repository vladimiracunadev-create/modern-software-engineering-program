<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 351" width="1060" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intercalados con actualización perdida (cada revisora lee y luego escribe)</title><desc id="d">Barras: con dos revisoras 4 de 6 ordenaciones pierden una actualización, con cuatro 2 496 de 2 520; el mismo defecto no apareció en diez ejecuciones con hilos reales de CPython que sumaron 400 000 veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="351" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">2 revisoras</tspan></text><rect x="410" y="16" width="266.8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="684.8" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="684.8" dy="0">66,7 % (4 de 6)</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">3 revisoras</tspan></text><rect x="410" y="60" width="373.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="791.2" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="791.2" dy="0">93,3 % (84 de 90)</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">4 revisoras</tspan></text><rect x="410" y="104" width="396" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="814" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="814" dy="0">99,0 % (2 496 de 2 520)</tspan></text><text x="400" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">5 revisoras</tspan></text><rect x="410" y="148" width="399.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="817.6" dy="0">99,9 % (113 280 de 113 400)</tspan></text><text x="400" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Hilos reales de CPython, 10 × 400 000 sumas</tspan></text><rect x="410" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422" dy="0">0 pérdidas observadas</tspan></text><rect x="10" y="240" width="1040" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="530" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Casi todos los órdenes posibles son defectuosos, pero el planificador del sistema operativo con el intérprete casi nunca los produce: la</tspan></text><text x="530" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">prueba natural dice «nada» mientras la exploración sistemática dice «casi siempre». Las pérdidas con hilos reales dependen de la versión y</tspan></text><text x="530" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">la carga y no son reproducibles.</tspan></text><text x="530" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
