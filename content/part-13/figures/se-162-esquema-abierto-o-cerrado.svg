<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 434" width="940" height="434" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema abierto frente a cerrado: qué errores atrapa y qué cambios rechaza</title><desc id="d">Barras horizontales con los documentos rechazados, de 1 000, por cada esquema: ambos rechazan los mil con un campo requerido mal escrito; solo el cerrado rechaza el campo opcional mal escrito y, a la vez, rechaza los mil con un campo nuevo legítimo que el abierto acepta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="434" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema abierto frente a cerrado: qué errores atrapa y qué cambios rechaza</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Esquema abierto</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Esquema cerrado</tspan></text><line x1="294" y1="77" x2="294" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="269" x2="294" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="439.425" y1="77" x2="439.425" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="439.425" y1="269" x2="439.425" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="439.425" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.425" dy="0">250</tspan></text><line x1="584.85" y1="77" x2="584.85" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="584.85" y1="269" x2="584.85" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="584.85" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="584.85" dy="0">500</tspan></text><line x1="730.275" y1="77" x2="730.275" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="730.275" y1="269" x2="730.275" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="730.275" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.275" dy="0">750</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="269" x2="875.7" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="294" y1="269" x2="875.7" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Campo requerido mal escrito</tspan></text><text x="284" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Campo opcional mal escrito:</tspan></text><text x="284" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">«comentaro»</tspan></text><text x="284" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Campo nuevo legítimo: «prioridad»</tspan></text><rect x="294" y="83" width="581.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="294" y="110.5" width="581.7" height="24.5" rx="3" fill="#c0432f"/><text x="882.7" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="294" y="147" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="174.5" width="581.7" height="24.5" rx="3" fill="#c0432f"/><text x="882.7" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="294" y="211" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="238.5" width="581.7" height="24.5" rx="3" fill="#c0432f"/><text x="882.7" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><text x="584.85" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Documentos rechazados, de 1 000</tspan></text><rect x="10" y="327" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El esquema abierto deja pasar el error de escritura y descarta el comentario sin avisar; el cerrado lo atrapa pero</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">convierte cada campo nuevo del productor en un cambio incompatible. Elegir uno es decidir cómo evoluciona el contrato.</tspan></text><text x="470" y="416.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
