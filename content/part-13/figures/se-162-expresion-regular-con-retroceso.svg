<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 379" width="1020" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de una expresión regular con retroceso sobre una entrada casi válida (Windows)</title><desc id="d">Barras: el patrón (\w+\s?)* con una entrada de letras seguida de un signo tarda 0,0063 s con 17 caracteres y 1,65 s con 25, cuadruplicando cada dos caracteres; un patrón lineal tarda 0,00007 s con 5 001 caracteres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="379" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Patrón con retroceso, 17 caracteres</tspan></text><rect x="430" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442" dy="0">0,0063 s</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">19 caracteres</tspan></text><rect x="430" y="60" width="7.168" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="445.168" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="445.168" dy="0">0,026 s</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">21 caracteres</tspan></text><rect x="430" y="104" width="30.884" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="468.884" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="468.884" dy="0">0,11 s</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">23 caracteres</tspan></text><rect x="430" y="148" width="114.968" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="552.968" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="552.968" dy="0">0,41 s</tspan></text><text x="420" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">25 caracteres</tspan></text><rect x="430" y="192" width="461.216" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="899.216" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="899.216" dy="0">1,65 s</tspan></text><text x="420" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Patrón lineal, 5 001 caracteres</tspan></text><rect x="430" y="236" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442" dy="0">0,00007 s</tspan></text><rect x="10" y="284" width="1000" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="510" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Cada carácter extra duplica el tiempo. En Ubuntu la serie fue 0,0074 / 0,028 / 0,090 / 0,36 / 1,46 s: mismo crecimiento, distinto</tspan></text><text x="510" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">equipo. Comprobar la longitud máxima antes del patrón (1 µs con maxLength 20) y escribir patrones lineales evita el problema.</tspan></text><text x="510" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos; tiempos medidos en un equipo con CPython 3.12.9 (Windows); la forma del crecimiento se repite en Ubuntu.</tspan></text></svg>
