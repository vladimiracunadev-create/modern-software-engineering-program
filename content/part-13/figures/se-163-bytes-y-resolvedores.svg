<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 371" width="950" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién decide qué viaja: tamaño de la respuesta y coste de una consulta anidada</title><desc id="d">Tabla: cien entregas sintéticas pesan 69 629 bytes completas y 3 193 con solo id y nota; una consulta anidada de profundidad 3 invoca 1 111 resolvedores con ramificación 10 y 127 551 con ramificación 50.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="371" fill="#ffffff"/><rect x="10" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="267" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="267" dy="0">Caso</tspan></text><rect x="530" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Medida</tspan></text><rect x="760" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Frente a la</tspan></text><text x="847" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">respuesta completa</tspan></text><rect x="10" y="56" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">100 entregas completas (recurso REST)</tspan></text><rect x="530" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">69 629 bytes</tspan></text><rect x="760" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">100 %</tspan></text><rect x="10" y="106" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Las mismas 100 con solo id y nota (selección de campos)</tspan></text><rect x="530" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">3 193 bytes</tspan></text><rect x="760" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">4,6 %</tspan></text><rect x="10" y="156" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Consulta anidada: profundidad 3, ramificación 10</tspan></text><rect x="530" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">1 111 resolvedores</tspan></text><rect x="760" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">sin tope</tspan></text><rect x="10" y="206" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Consulta anidada: profundidad 3, ramificación 50</tspan></text><rect x="530" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">127 551 resolvedores</tspan></text><rect x="760" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">sin tope</tspan></text><rect x="10" y="260" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Dejar al cliente elegir campos reduce los bytes y desplaza el riesgo al servidor: sin límite de profundidad o de coste, una</tspan></text><text x="475" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">consulta pequeña puede costar miles de llamadas. El número de resolvedores es un cálculo (1 + b + b² + b³), no una medición</tspan></text><text x="475" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">de un servidor.</tspan></text><text x="475" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
