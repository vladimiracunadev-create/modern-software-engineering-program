<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién decide qué viaja: coste de una consulta anidada de profundidad 3 según la ramificación</title><desc id="d">Línea en escalas logarítmicas con los resolvedores que ejecuta una consulta anidada de profundidad 3 según la ramificación, 1 más b más b al cuadrado más b al cubo: 15 con ramificación 2, 1 111 con 10 y 127 551 con 50, sin tope; las dos cifras medidas son 10 y 50.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién decide qué viaja: coste de una consulta anidada de profundidad 3 según la ramificación</tspan></text><line x1="123.86" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="359" x2="123.86" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">10</tspan></text><line x1="123.86" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="299" x2="123.86" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">100</tspan></text><line x1="123.86" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="239" x2="123.86" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="