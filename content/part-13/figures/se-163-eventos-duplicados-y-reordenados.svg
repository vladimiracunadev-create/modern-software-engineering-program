<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 291" width="1080" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estado final correcto con entrega al-menos-una-vez y mensajes reordenados</title><desc id="d">Barras de 1 000 corridas: un consumidor sin idempotencia nunca obtiene el total correcto con 15 por ciento de duplicados; con identificador siempre; si el último mensaje gana el estado final es correcto 804 veces, y con número de versión 1 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="291" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Consumidor ingenuo, duplicados del 15 %</tspan></text><rect x="430" y="16" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="442" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442" dy="0">0 de 1 000</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Consumidor idempotente por identificador</tspan></text><rect x="430" y="60" width="460" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="898" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898" dy="0">1 000 de 1 000</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Último mensaje gana, 20 % reordenado</tspan></text><rect x="430" y="104" width="369.84" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="807.84" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="807.84" dy="0">804 de 1 000</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Número de versión por entidad</tspan></text><rect x="430" y="148" width="460" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="898" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898" dy="0">1 000 de 1 000</tspan></text><rect x="10" y="196" width="1060" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">El contrato de un evento incluye identificador, versión o clave de orden y la semántica de entrega. Las tasas de duplicado (15 %) y</tspan></text><text x="540" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">reordenamiento (20 %) son supuestos del autor, no medidas de un broker.</tspan></text><text x="540" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
