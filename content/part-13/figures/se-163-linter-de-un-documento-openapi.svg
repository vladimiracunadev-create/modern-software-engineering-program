<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 754" width="940" height="754" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter de un documento OpenAPI mínimo: 240 mutaciones</title><desc id="d">Barras horizontales con las mutaciones inyectadas y detectadas por un linter de un documento OpenAPI mínimo: detecta las seis familias de defectos de forma (173 de 173) y ninguna de las 67 que cambian el código de éxito o hacen que una descripción mienta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="754" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Linter de un documento OpenAPI mínimo: 240 mutaciones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Inyectados</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Detectados</tspan></text><line x1="314" y1="77" x2="314" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="589" x2="314" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="460.47" y1="77" x2="460.47" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="460.47" y1="589" x2="460.47" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="460.47" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="460.47" dy="0">10</tspan></text><line x1="606.94" y1="77" x2="606.94" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="606.94" y1="589" x2="606.94" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="606.94" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="606.94" dy="0">20</tspan></text><line x1="753.41" y1="77" x2="753.41" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="753.41" y1="589" x2="753.41" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="753.41" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="753.41" dy="0">30</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="589" x2="899.88" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">40</tspan></text><line x1="314" y1="589" x2="899.88" y2="589" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Parámetro de ruta sin declarar</tspan></text><text x="304" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Renombrar el parámetro solo en la ruta</tspan></text><text x="304" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">operationId repetido</tspan></text><text x="304" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Operación de escritura sin respuesta de</tspan></text><text x="304" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">error</tspan></text><text x="304" y="361" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Parámetro de ruta no marcado como</tspan></text><text x="304" y="378" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">requerido</tspan></text><text x="304" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Operación sin respuestas</tspan></text><text x="304" y="497.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Cambiar el código de éxito de 201 a 200</tspan></text><text x="304" y="553" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Descripción que miente («devuelve una</tspan></text><text x="304" y="570" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">lista»)</tspan></text><rect x="314" y="83" width="410.116" height="24.5" rx="3" fill="#6b7c86"/><text x="731.116" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="731.116" dy="0">28</tspan></text><rect x="314" y="110.5" width="410.116" height="24.5" rx="3" fill="#087f8c"/><text x="731.116" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="731.116" dy="0">28</tspan></text><rect x="314" y="147" width="454.057" height="24.5" rx="3" fill="#6b7c86"/><text x="775.057" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="775.057" dy="0">31</tspan></text><rect x="314" y="174.5" width="454.057" height="24.5" rx="3" fill="#087f8c"/><text x="775.057" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="775.057" dy="0">31</tspan></text><rect x="314" y="211" width="366.175" height="24.5" rx="3" fill="#6b7c86"/><text x="687.175" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="687.175" dy="0">25</tspan></text><rect x="314" y="238.5" width="366.175" height="24.5" rx="3" fill="#087f8c"/><text x="687.175" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="687.175" dy="0">25</tspan></text><rect x="314" y="275" width="468.704" height="24.5" rx="3" fill="#6b7c86"/><text x="789.704" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="789.704" dy="0">32</tspan></text><rect x="314" y="302.5" width="468.704" height="24.5" rx="3" fill="#087f8c"/><text x="789.704" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="789.704" dy="0">32</tspan></text><rect x="314" y="339" width="439.41" height="24.5" rx="3" fill="#6b7c86"/><text x="760.41" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="760.41" dy="0">30</tspan></text><rect x="314" y="366.5" width="439.41" height="24.5" rx="3" fill="#087f8c"/><text x="760.41" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="760.41" dy="0">30</tspan></text><rect x="314" y="403" width="395.469" height="24.5" rx="3" fill="#6b7c86"/><text x="716.469" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="716.469" dy="0">27</tspan></text><rect x="314" y="430.5" width="395.469" height="24.5" rx="3" fill="#087f8c"/><text x="716.469" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="716.469" dy="0">27</tspan></text><rect x="314" y="467" width="424.763" height="24.5" rx="3" fill="#6b7c86"/><text x="745.763" y="483.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="745.763" dy="0">29</tspan></text><rect x="314" y="494.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="323" y="511.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><rect x="314" y="531" width="556.586" height="24.5" rx="3" fill="#6b7c86"/><text x="877.586" y="547.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="877.586" dy="0">38</tspan></text><rect x="314" y="558.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="323" y="575.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><text x="606.94" y="633" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="606.94" dy="0">Mutaciones</tspan></text><rect x="10" y="647" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="671.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un documento puede ser sintácticamente impecable y describir otra cosa. El linter protege la forma del contrato; que el</tspan></text><text x="470" y="688.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">servicio responda lo que el documento promete lo comprueba una prueba contractual (SE-166).</tspan></text><text x="470" y="736.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
