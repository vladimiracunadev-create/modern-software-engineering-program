<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 507" width="840" height="507" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter de un documento OpenAPI mínimo: 240 mutaciones</title><desc id="d">Tabla de ocho tipos de defecto inyectados en un documento OpenAPI mínimo: el linter detecta los 173 defectos de estructura y no detecta los 67 que cambian el significado, como un código de éxito distinto o una descripción falsa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="507" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Defecto inyectado</tspan></text><rect x="510" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Inyectados</tspan></text><rect x="670" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Detectados</tspan></text><rect x="10" y="56" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Parámetro de ruta sin declarar</tspan></text><rect x="510" y="56" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">28</tspan></text><rect x="670" y="56" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">28</tspan></text><rect x="10" y="100" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Renombrar el parámetro solo en la ruta</tspan></text><rect x="510" y="100" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">31</tspan></text><rect x="670" y="100" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">31</tspan></text><rect x="10" y="144" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="166.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">operationId repetido</tspan></text><rect x="510" y="144" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">25</tspan></text><rect x="670" y="144" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">25</tspan></text><rect x="10" y="188" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="210.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Operación de escritura sin respuesta de error</tspan></text><rect x="510" y="188" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">32</tspan></text><rect x="670" y="188" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">32</tspan></text><rect x="10" y="232" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="254.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Parámetro de ruta no marcado como requerido</tspan></text><rect x="510" y="232" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">30</tspan></text><rect x="670" y="232" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">30</tspan></text><rect x="10" y="276" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="298.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Operación sin respuestas</tspan></text><rect x="510" y="276" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">27</tspan></text><rect x="670" y="276" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">27</tspan></text><rect x="10" y="320" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="342.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Cambiar el código de éxito de 201 a 200</tspan></text><rect x="510" y="320" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">29</tspan></text><rect x="670" y="320" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0</tspan></text><rect x="10" y="364" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="386.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Descripción que miente («devuelve una lista»)</tspan></text><rect x="510" y="364" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="386.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">38</tspan></text><rect x="670" y="364" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="386.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0</tspan></text><rect x="10" y="412" width="820" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="420" y="436.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">Un documento puede ser sintácticamente impecable y describir otra cosa. El linter protege la forma del</tspan></text><text x="420" y="453.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">contrato; que el servicio responda lo que el documento promete lo comprueba una prueba contractual (SE-166).</tspan></text><text x="420" y="493.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
