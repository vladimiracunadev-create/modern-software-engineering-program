t="700" fill="#142231"><tspan x="400" dy="0">0</tspan></text><rect x="505.5" y="401.5" width="205" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="608" y="421.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="608" dy="0">0</tspan></text><rect x="713.5" y="401.5" width="205" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="816" y="421.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="816" dy="0">0</tspan></text><text x="20" y="264" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 264)">Cambio de esquema</text><text x="296" y="460" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="296" dy="0">0</tspan></text><rect x="311.54" y="448" width="30.5" height="14" fill="#dff1ee"/><rect x="341.54" y="448" width="30.5" height="14" fill="#c0e1e0"/><rect x="371.54" y="448" width="30.5" height="14" fill="#a2d0d2"/><rect x="401.54" y="448" width="30.5" height="14" fill="#83c0c4"/><rect x="431.54" y="448" width="30.5" height="14" fill="#64b0b6"/><rect x="461.54" y="448" width="30.5" height="14" fill="#45a0a8"/><rect x="491.54" y="448" width="30.5" height="14" fill="#278f9a"/><rect x="521.54" y="448" width="30.5" height="14" fill="#087f8c"/><text x="559.54" y="460" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="559.54" dy="0">2 000</tspan></text><text x="605.24" y="460" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="605.24" dy="0">más oscuro = mayor (documentos legibles, de 2 000)</tspan></text><rect x="10" y="476" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="500.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un cambio es compatible solo si lee 2 000 de 2 000 en la dirección que importa. «Agregar campo opcional» es seguro para el</tspan></text><text x="470" y="517.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consumidor tolerante y rompe la mitad de los documentos para el estricto.</tspan></text><text x="470" y="565.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
