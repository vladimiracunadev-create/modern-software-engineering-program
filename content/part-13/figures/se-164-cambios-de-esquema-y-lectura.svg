<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 583" width="940" height="583" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Documentos legibles de 2 000 tras cada cambio de esquema</title><desc id="d">Mapa de calor con los documentos legibles, de 2 000, tras cada cambio de esquema según quién lee: el lector nuevo lee todos salvo con campo requerido agregado, campo renombrado u opcional que pasa a requerido; el viejo estricto falla con 0 en agregar un requerido, quitar un requerido y renombrar, y con 2 000 en quitar un opcional.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="583" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Documentos legibles de 2 000 tras cada cambio de esquema</tspan></text><text x="608" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="608" dy="0">Documentos legibles (de 2 000)</tspan></text><text x="400" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="400" dy="0">Nuevo lee viejos</tspan></text><text x="608" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="608" dy="0">Viejo tolerante lee nuevos</tspan></text><text x="816" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="816" dy="0">Viejo estricto lee nuevos</tspan></text><text x="286" y="115.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Agregar campo opcional</tspan></text><text x="286" y="149.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Agregar campo requerido</tspan></text><text x="286" y="183.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Quitar campo opcional</tspan></text><text x="286" y="217.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Quitar campo requerido</tspan></text><text x="286" y="251.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Opcional pasa a requerido</tspan></text><text x="286" y="285.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Requerido pasa a opcional</tspan></text><text x="286" y="319.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Ampliar tipo de entero a decimal</tspan></text><text x="286" y="353.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Agregar valor de enum</tspan></text><text x="286" y="387.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Quitar valor de enum</tspan></text><text x="286" y="421.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Renombrar un campo</tspan></text><rect x="297.5" y="95.5" width="205" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="400" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="400" dy="0">2 000</tspan></text><rect x="505.5" y="95.5" width="205" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="608" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="608" dy="0">2 000</tspan></text><rect x="713.5" y="95.5" width="205" height="31" rx="4" fill="#71b6bc" stroke="#ffffff" stroke-width="1"/><text x="816" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspa