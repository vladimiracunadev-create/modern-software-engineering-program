<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 335" width="980" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Consumidores rotos por lanzamiento (de 20) según cuántos son estrictos</title><desc id="d">Barras: con 2 000 lanzamientos sintéticos y una mezcla de cambios, el promedio de consumidores rotos por lanzamiento sube de 6,87 de 20 sin consumidores estrictos a 17,63 si todos son estrictos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="335" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">0 % de consumidores estrictos</tspan></text><rect x="370" y="16" width="178.62" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="556.62" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="556.62" dy="0">6,87 de 20</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">25 %</tspan></text><rect x="370" y="60" width="248.56" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="626.56" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="626.56" dy="0">9,56</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">50 %</tspan></text><rect x="370" y="104" width="318.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="696.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="696.5" dy="0">12,25</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">75 %</tspan></text><rect x="370" y="148" width="388.44" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="766.44" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="766.44" dy="0">14,94</tspan></text><text x="360" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">100 %</tspan></text><rect x="370" y="192" width="458.38" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="836.38" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="836.38" dy="0">17,63</tspan></text><rect x="10" y="240" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Incluso con todos tolerantes se rompen casi siete de cada veinte, porque la mezcla de cambios incluye renombrados y campos</tspan></text><text x="490" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">requeridos nuevos. La mezcla de cambios (45 % campos opcionales, 15 % enums…) es un supuesto del autor.</tspan></text><text x="490" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
