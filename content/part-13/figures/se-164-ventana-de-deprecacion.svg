<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 291" width="1100" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Consumidores que siguen en la versión vieja al cerrarse la ventana de deprecación</title><desc id="d">Barras de 2 000 simulaciones con 40 consumidores: con una ventana de 30 días quedan 22,4 en media, con 90 quedan 8,8, con 180 quedan 4,6 y con 365 quedan 4,0, porque 10 por ciento nunca migra solo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1100" height="291" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Ventana de 30 días</tspan></text><rect x="310" y="16" width="336" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="654" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="654" dy="0">22,4 de 40</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">90 días</tspan></text><rect x="310" y="60" width="132" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="450" dy="0">8,8</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">180 días</tspan></text><rect x="310" y="104" width="69" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="387" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="387" dy="0">4,6</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">365 días</tspan></text><rect x="310" y="148" width="60" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="378" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="378" dy="0">4,0 (98,7 % de las simulaciones: al menos uno)</tspan></text><rect x="10" y="196" width="1080" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="550" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">Alargar la ventana de 180 a 365 días casi no ayuda: el resto son consumidores abandonados que solo migran si alguien los contacta o se les corta</tspan></text><text x="550" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">el servicio. Migración exponencial de media 45 días y 10 % abandonado son supuestos del autor.</tspan></text><text x="550" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
