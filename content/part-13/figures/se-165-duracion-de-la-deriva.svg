<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 247" width="1100" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántos commits dura una deriva entre especificación y código</title><desc id="d">Barras de 300 trayectorias de 200 commits con 8 por ciento de probabilidad de deriva por commit: comprobar en cada commit la deja 1,0 commits, cada 5 la deja 3,2 y cada 20 la deja 13,2; sin comprobar, las 300 trayectorias terminan con deriva.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1100" height="247" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Comprobar en cada commit</tspan></text><rect x="310" y="16" width="18" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="336" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="336" dy="0">1,0 commits</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Cada 5 commits</tspan></text><rect x="310" y="60" width="57.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="375.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="375.6" dy="0">3,2</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Cada 20 commits</tspan></text><rect x="310" y="104" width="237.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="555.6" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="555.6" dy="0">13,2 (1 de 300 trayectorias termina con deriva)</tspan></text><rect x="10" y="152" width="1080" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="550" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">La comprobación mecánica no impide la deriva, acorta su vida. La probabilidad de 8 % por commit es un supuesto; la detección usa la firma real de</tspan></text><text x="550" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">funciones leída con inspect, lo que ve nombres y parámetros, no comportamiento.</tspan></text><text x="550" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
