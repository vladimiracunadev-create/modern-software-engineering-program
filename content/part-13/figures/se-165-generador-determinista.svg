<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 203" width="1100" height="203" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un generador determinista: la misma especificación, ocho semillas de hash de Python</title><desc id="d">Barras: un generador que recorre un conjunto de siete campos produce ocho salidas distintas con ocho valores de PYTHONHASHSEED; el mismo generador con orden explícito produce una sola salida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1100" height="203" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Salida en el orden de iteración de un conjunto</tspan></text><rect x="430" y="16" width="320" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="758" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758" dy="0">8 huellas distintas en 8 semillas</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Salida ordenada explícitamente</tspan></text><rect x="430" y="60" width="40" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="478" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="478" dy="0">1 huella en 8 semillas</tspan></text><rect x="10" y="108" width="1080" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="550" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">El orden de un conjunto de cadenas depende de la semilla de hash por proceso. Un generador que no ordena produce diffs fantasma, rompe las</tspan></text><text x="550" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">comprobaciones de «regenerar y comparar» y hace irrepetible el artefacto. Se comprobó en Windows y Ubuntu con el mismo resultado.</tspan></text><text x="550" y="189.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
