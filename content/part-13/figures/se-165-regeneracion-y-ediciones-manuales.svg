<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 329" width="950" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Regenerar código desde la especificación: qué se pierde</title><desc id="d">Tabla de un experimento de regeneración: tres líneas editadas a mano en un archivo generado se pierden al regenerar; el código manual fuera de una región delimitada sobrevive y lo editado dentro de ella se pierde.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="329" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Situación</tspan></text><rect x="390" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Resultado</tspan></text><rect x="680" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Consecuencia</tspan></text><rect x="10" y="56" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="77.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Se editan 3 líneas a mano dentro del archivo</tspan></text><text x="197" y="93.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">generado</tspan></text><rect x="390" y="56" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="77.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">3 de 21 líneas distintas del</tspan></text><text x="532" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">generador</tspan></text><rect x="680" y="56" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Regenerar las sobrescribe</tspan></text><rect x="10" y="114" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Código manual fuera de la región delimitada</tspan></text><rect x="390" y="114" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">Sobrevive a la regeneración</tspan></text><rect x="680" y="114" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Hace falta un límite explícito</tspan></text><rect x="10" y="172" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Lo editado dentro de la región delimitada</tspan></text><rect x="390" y="172" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">Se pierde igualmente</tspan></text><rect x="680" y="172" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">La región es del generador</tspan></text><rect x="10" y="234" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Spec-as-source exige que lo editable no viva en lo generado. Delimitar una región resuelve la pérdida silenciosa y no</tspan></text><text x="475" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">resuelve la pregunta de fondo: ¿quién es dueño de ese comportamiento, la especificación o el código?</tspan></text><text x="475" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
