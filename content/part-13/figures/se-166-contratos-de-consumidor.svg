<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 507" width="990" height="507" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho cambios del proveedor y cinco consumidores con contratos propios</title><desc id="d">Tabla de ocho cambios de un proveedor: los contratos dirigidos por los consumidores detectan qué consumidores rompe cada cambio, entre cero y tres, mientras que las pruebas del proveedor sobre su propio esquema no detectan ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="507" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Cambio del proveedor</tspan></text><rect x="330" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Consumidores rotos (detecta el contrato del</tspan></text><text x="537" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">consumidor)</tspan></text><rect x="750" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Detecta la prueba propia del</tspan></text><text x="862" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">proveedor</tspan></text><rect x="10" y="56" width="314" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="77.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Quitar nota</tspan></text><rect x="330" y="56" width="414" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">3: panel, exporta, informes</tspan></text><rect x="750" y="56" width="224" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="98" width="314" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="119.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Renombrar plazo a vence</tspan></text><rect x="330" y="98" width="414" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">2: avisos, informes</tspan></text><rect x="750" y="98" width="224" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="140" width="314" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Nota pasa a texto</tspan></text><rect x="330" y="140" width="414" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">3: panel, exporta, informes</tspan></text><rect x="750" y="140" width="224" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="182" width="314" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="203.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Nota pasa a decimal (80.0)</tspan></text><rect x="330" y="182" width="414" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">3: panel, exporta, informes</tspan></text><rect x="750" y="182" width="224" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="224" width="314" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Archivos pasa a nulo</tspan></text><rect x="330" y="224" width="414" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">1: exporta</tspan></text><rect x="750" y="224" width="224" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="266" width="314" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Agregar campo</tspan></text><rect x="330" y="266" width="414" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">0</tspan></text><rect x="750" y="266" width="224" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="308" width="314" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="329.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Reordenar campos</tspan></text><rect x="330" y="308" width="414" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">0</tspan></text><rect x="750" y="308" width="224" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="350" width="314" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="371.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Anidar el enlace «links»</tspan></text><rect x="330" y="350" width="414" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">0</tspan></text><rect x="750" y="350" width="224" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="396" width="970" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Cada consumidor fija solo los campos que usa; por eso agregar un campo no rompe a nadie, y por eso un contrato que fijara los seis</tspan></text><text x="495" y="437.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">campos habría rechazado 1 de los 3 cambios inocuos. Un proveedor que genera su esquema desde su código siempre se aprueba a sí</tspan></text><text x="495" y="454.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">mismo.</tspan></text><text x="495" y="493.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
