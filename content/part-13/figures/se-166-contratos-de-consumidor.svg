<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 770" width="940" height="770" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho cambios del proveedor y cinco consumidores con contratos propios</title><desc id="d">Barras horizontales con los consumidores rotos, de cinco, por cada cambio del proveedor que detecta el contrato del consumidor, frente a la prueba propia del proveedor, que no detecta ninguno: quitar la nota, pasarla a texto o a decimal rompe a 3, renombrar el plazo a 2 y archivos nulo a 1; agregar, reordenar o anidar no rompe a nadie.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="770" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocho cambios del proveedor y cinco consumidores con contratos propios</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Contratos de los consumidores</tspan></text><rect x="282.66" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Prueba propia del proveedor</tspan></text><line x1="264" y1="77" x2="264" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="264" y1="589" x2="264" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="264" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="264" dy="0">0</tspan></text><line x1="392.788" y1="77" x2="392.788" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="392.788" y1="589" x2="392.788" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="392.788" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392.788" dy="0">1</tspan></text><line x1="521.576" y1="77" x2="521.576" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="521.576" y1="589" x2="521.576" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="521.576" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="521.576" dy="0">2</tspan></text><line x1="650.364" y1="77" x2="650.364" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="650.364" y1="589" x2="650.364" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="650.364" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650.364" dy="0">3</tspan></text><line x1="779.152" y1="77" x2="779.152" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="779.152" y1="589" x2="779.152" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="779.152" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.152" dy="0">4</tspan></text><line x1="907.94" y1="77" x2="907.94" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="589" x2="907.94" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">5</tspan></text><line x1="264" y1="589" x2="907.94" y2="589" stroke="#5b7280" stroke-width="1.6"/><text x="254" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Quitar nota</tspan></text><text x="254" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Renombrar plazo a vence</tspan></text><text x="254" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Nota pasa a texto</tspan></text><text x="254" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Nota pasa a decimal (80.0)</tspan></text><text x="254" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Archivos pasa a nulo</tspan></text><text x="254" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Agregar campo</tspan></text><text x="254" y="497.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Reordenar campos</tspan></text><text x="254" y="561.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Anidar el enlace «links»</tspan></text><rect x="264" y="83" width="386.364" height="24.5" rx="3" fill="#087f8c"/><text x="657.364" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="657.364" dy="0">3</tspan></text><rect x="264" y="110.5" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="273" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><rect x="264" y="147" width="257.576" height="24.5" rx="3" fill="#087f8c"/><text x="528.576" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="528.576" dy="0">2</tspan></text><rect x="264" y="174.5" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="273" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><rect x="264" y="211" width="386.364" height="24.5" rx="3" fill="#087f8c"/><text x="657.364" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="657.364" dy="0">3</tspan></text><rect x="264" y="238.5" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="273" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><rect x="264" y="275" width="386.364" height="24.5" rx="3" fill="#087f8c"/><text x="657.364" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="657.364" dy="0">3</tspan></text><rect x="264" y="302.5" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="273" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><rect x="264" y="339" width="128.788" height="24.5" rx="3" fill="#087f8c"/><text x="399.788" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="399.788" dy="0">1</tspan></text><rect x="264" y="366.5" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="273" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><rect x="264" y="403" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="273" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><rect x="264" y="430.5" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="273" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><rect x="264" y="467" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="273" y="483.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><rect x="264" y="494.5" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="273" y="511.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><rect x="264" y="531" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="273" y="547.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><rect x="264" y="558.5" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="273" y="575.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><text x="585.97" y="633" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="585.97" dy="0">Consumidores rotos detectados, de 5</tspan></text><rect x="10" y="647" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="671.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada consumidor fija solo los campos que usa; por eso agregar un campo no rompe a nadie, y por eso un contrato que fijara</tspan></text><text x="470" y="688.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los seis campos habría rechazado 1 de los 3 cambios inocuos. Un proveedor que genera su esquema desde su código siempre se</tspan></text><text x="470" y="705.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aprueba a sí mismo.</tspan></text><text x="470" y="752.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
