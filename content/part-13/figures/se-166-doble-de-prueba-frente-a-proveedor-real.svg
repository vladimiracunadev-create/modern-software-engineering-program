<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 291" width="1000" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mediana por llamada: servidor HTTP local frente a un doble de prueba</title><desc id="d">Barras con la mediana de 300 llamadas: un servidor HTTP local real tarda 901 microsegundos en Windows y 667 en Ubuntu; un doble de prueba en proceso tarda 0,30 y 0,20, pero sigue pasando después de que el proveedor renombra el campo y el servidor real ya no.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="291" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Servidor local real, Windows</tspan></text><rect x="430" y="16" width="405.45" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="843.45" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="843.45" dy="0">901 µs por llamada</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Servidor local real, Ubuntu (WSL2)</tspan></text><rect x="430" y="60" width="300.15" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="738.15" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="738.15" dy="0">667 µs</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Doble de prueba en proceso, Windows</tspan></text><rect x="430" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442" dy="0">0,30 µs</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Doble de prueba en proceso, Ubuntu</tspan></text><rect x="430" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442" dy="0">0,20 µs</tspan></text><rect x="10" y="196" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El doble es unas tres mil veces más rápido y por eso se usa; cuando el proveedor renombró «nota» a «calificacion», la prueba con</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">doble siguió pasando y la prueba contra el proveedor real falló. Los tiempos son de un equipo y varían; la razón, no.</tspan></text><text x="500" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Tiempos medidos en un equipo (127.0.0.1); varían entre ejecuciones. El resultado de pasar o fallar es idéntico en ambos sistemas.</tspan></text></svg>
