<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 539" width="960" height="539" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter de cláusulas de contrato con seis cláusulas que no vio al escribirse</title><desc id="d">Tabla de seis cláusulas nuevas: la regla léxica, que acertó 8 de 8 en sus ejemplos de ajuste, acierta 5 de 6 con las nuevas y falla en una cláusula completa redactada con palabras que no estaban en sus listas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="539" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Cláusula</tspan></text><rect x="440" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="26.68" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Juicio del</tspan></text><text x="502" y="42.04" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">autor</tspan></text><rect x="570" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="34.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">Regla</tspan></text><rect x="670" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Lectura</tspan></text><rect x="10" y="56" width="424" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="81.04" font-size="11" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Ninguna estudiante podrá entregar después del cierre, excepto con</tspan></text><text x="222" y="95.12" font-size="11" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">prórroga aprobada por escrito.</tspan></text><rect x="440" y="56" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="88.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Completa</tspan></text><rect x="570" y="56" width="94" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="88.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Rechaza</tspan></text><rect x="670" y="56" width="274" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="81.04" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Falso negativo: «excepto» y «estudiante»</tspan></text><text x="807" y="95.12" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">no están en la lista</tspan></text><rect x="10" y="120" width="424" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="145.04" font-size="11" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">El servicio debe responder 429 si una cuenta supera 5 envíos por</tspan></text><text x="222" y="159.12" font-size="11" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">minuto…</tspan></text><rect x="440" y="120" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="152.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Completa</tspan></text><rect x="570" y="120" width="94" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="152.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Acepta</tspan></text><rect x="670" y="120" width="274" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="152.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Acierto</tspan></text><rect x="10" y="184" width="424" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="216.08" font-size="11" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">La plataforma debe ser segura y cumplir la ley.</tspan></text><rect x="440" y="184" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="216.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Incompleta</tspan></text><rect x="570" y="184" width="94" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="216.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Rechaza</tspan></text><rect x="670" y="184" width="274" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="216.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Acierto: sin observable ni límite</tspan></text><rect x="10" y="248" width="424" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="273.04" font-size="11" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">El sistema muestra siempre un mensaje de error comprensible y</tspan></text><text x="222" y="287.12" font-size="11" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">rápido.</tspan></text><rect x="440" y="248" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="280.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Incompleta</tspan></text><rect x="570" y="248" width="94" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="280.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Rechaza</tspan></text><rect x="670" y="248" width="274" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="280.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Acierto: sin modal «debe»</tspan></text><rect x="10" y="312" width="424" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="344.08" font-size="11" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">El docente debe corregir cada entrega.</tspan></text><rect x="440" y="312" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="344.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Incompleta</tspan></text><rect x="570" y="312" width="94" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="344.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Rechaza</tspan></text><rect x="670" y="312" width="274" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="344.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Acierto: sin observable</tspan></text><rect x="10" y="376" width="424" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="401.04" font-size="11" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">La plataforma debe devolver exactamente 3 campos y rechaza los</tspan></text><text x="222" y="415.12" font-size="11" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">demás.</tspan></text><rect x="440" y="376" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="408.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Completa</tspan></text><rect x="570" y="376" width="94" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="408.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Acepta</tspan></text><rect x="670" y="376" width="274" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="408.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Acierto</tspan></text><rect x="10" y="444" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Ajuste: 4 aceptadas y 4 rechazadas correctas (8 de 8). Casos nuevos: 5 de 6. La regla mide forma (actor, modal, observable,</tspan></text><text x="480" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">límite) y no verdad; una cláusula completa puede ser falsa y una incompleta, intencionalmente abierta.</tspan></text><text x="480" y="525.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
