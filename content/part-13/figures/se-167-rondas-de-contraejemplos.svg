<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 467" width="1020" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutantes que sobreviven a cada ronda de contraejemplos (255 mutantes, 2 equivalentes)</title><desc id="d">Barras: el ejemplo de la intención deja vivos 63 de 255 mutantes de una regla de penalización; cada contraejemplo del mutante superviviente los baja a 51, 43, 7 y 2, el mínimo posible; cinco, diez y veinte ejemplos al azar dejan 7,6, 5,2 y 4,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="467" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Ronda 0: solo el ejemplo de la intención</tspan></text><rect x="410" y="16" width="441" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="859" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="859" dy="0">63 supervivientes</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Ronda 1: un contraejemplo</tspan></text><rect x="410" y="60" width="357" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="775" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="775" dy="0">51</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Ronda 2</tspan></text><rect x="410" y="104" width="301" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="719" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="719" dy="0">43</tspan></text><text x="400" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Ronda 3</tspan></text><rect x="410" y="148" width="49" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="467" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="467" dy="0">7</tspan></text><text x="400" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Ronda 4: 5 ejemplos en total</tspan></text><rect x="410" y="192" width="14" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="432" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="432" dy="0">2 (los equivalentes)</tspan></text><text x="400" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">5 ejemplos al azar</tspan></text><rect x="410" y="236" width="53.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="471.2" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="471.2" dy="0">7,6</tspan></text><text x="400" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">10 ejemplos al azar</tspan></text><rect x="410" y="280" width="36.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="454.4" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="454.4" dy="0">5,2</tspan></text><text x="400" y="343.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">20 ejemplos al azar</tspan></text><rect x="410" y="324" width="30.1" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="448.1" y="343.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="448.1" dy="0">4,3</tspan></text><rect x="10" y="372" width="1000" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="510" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">Tomar un mutante vivo y añadir el ejemplo más pequeño que lo distingue converge en cinco ejemplos; la suite aleatoria no llega al</tspan></text><text x="510" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">mínimo ni con veinte. El bucle no sabe si un mutante superviviente es equivalente: detenerse es una decisión humana.</tspan></text><text x="510" y="453.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
