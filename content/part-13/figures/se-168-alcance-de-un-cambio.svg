<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 379" width="980" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Artefactos afectados al cambiar un requisito o un contrato (200 grafos sintéticos)</title><desc id="d">Barras: en grafos sintéticos de cinco capas, cambiar un requisito afecta en media 4,9 artefactos con un enlace por artefacto, 14,1 con dos y 33,1 con tres; cambiar un contrato afecta 2,7, 6,1 y 11,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="379" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Requisito, 1 enlace por artefacto</tspan></text><rect x="370" y="16" width="63.7" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="441.7" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="441.7" dy="0">4,9</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Requisito, 2 enlaces</tspan></text><rect x="370" y="60" width="183.3" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="561.3" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="561.3" dy="0">14,1</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Requisito, 3 enlaces</tspan></text><rect x="370" y="104" width="430.3" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="808.3" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="808.3" dy="0">33,1 de 170</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Contrato, 1 enlace</tspan></text><rect x="370" y="148" width="35.1" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="413.1" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="413.1" dy="0">2,7</tspan></text><text x="360" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Contrato, 2 enlaces</tspan></text><rect x="370" y="192" width="79.3" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="457.3" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="457.3" dy="0">6,1</tspan></text><text x="360" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Contrato, 3 enlaces</tspan></text><rect x="370" y="236" width="146.9" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="524.9" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="524.9" dy="0">11,3</tspan></text><rect x="10" y="284" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Densificar los enlaces multiplica el alcance de un cambio por unas siete veces al pasar de 1 a 3. El análisis de impacto lista</tspan></text><text x="490" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">qué revisar; no dice si esos artefactos necesitan cambiar. Las capas y grados son supuestos del autor.</tspan></text><text x="490" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
