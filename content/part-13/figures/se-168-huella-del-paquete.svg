<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 371" width="940" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Huella de un paquete de 200 archivos en dos sistemas</title><desc id="d">Tabla: el mismo paquete de 200 documentos produce la huella 480485af12cf44f9 en Windows y 55f841e9f3d4b56f en Ubuntu cuando se escribe con el modo de texto por defecto, y la misma huella en ambos cuando se fija el salto de línea; alterar tres bytes cambia la huella.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="371" fill="#ffffff"/><rect x="10" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">Situación</tspan></text><rect x="490" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Windows</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Ubuntu (WSL2)</tspan></text><rect x="10" y="56" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Escribir archivos con el modo de texto por defecto</tspan></text><rect x="490" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">480485af12cf44f9</tspan></text><rect x="710" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">55f841e9f3d4b56f</tspan></text><rect x="10" y="106" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Escribir con newline=&quot;\n&quot; fijo</tspan></text><rect x="490" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">55f841e9f3d4b56f</tspan></text><rect x="710" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">55f841e9f3d4b56f</tspan></text><rect x="10" y="156" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Alterar 3 bytes de un archivo (comprobación de manipulación)</tspan></text><rect x="490" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">Huella cambia</tspan></text><rect x="710" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Huella cambia</tspan></text><rect x="10" y="206" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Calcular la huella de 200 archivos (un equipo)</tspan></text><rect x="490" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">0,033 s</tspan></text><rect x="710" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0,004 s</tspan></text><rect x="10" y="260" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin fijar el salto de línea, el mismo contenido tiene dos huellas: un manifiesto firmado en un sistema no verifica en el</tspan></text><text x="470" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">otro. La huella detecta cambios en los bytes, no su autoría ni su sentido. Los tiempos son de un equipo y no son</tspan></text><text x="470" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">comparables entre sistemas.</tspan></text><text x="470" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos; las huellas son deterministas, los tiempos no.</tspan></text></svg>
