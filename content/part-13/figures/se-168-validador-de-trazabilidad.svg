<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 491" width="900" height="491" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de un paquete trazable de 41 artefactos: 240 mutaciones</title><desc id="d">Tabla de ocho mutaciones de un paquete con intenciones, requisitos, contratos, ejemplos y pruebas: el validador detecta las 216 que rompen enlaces, tipos, ciclos o huellas y ninguna de las 24 que cambian el sentido de un texto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="491" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Mutación del paquete</tspan></text><rect x="570" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Inyectadas</tspan></text><rect x="730" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Enlace a un identificador inexistente</tspan></text><rect x="570" y="56" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">33</tspan></text><rect x="730" y="56" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">33</tspan></text><rect x="10" y="98" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="119.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Requisito sin contrato (huérfano)</tspan></text><rect x="570" y="98" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">32</tspan></text><rect x="730" y="98" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">32</tspan></text><rect x="10" y="140" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Contrato sin ejemplo ni prueba</tspan></text><rect x="570" y="140" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">34</tspan></text><rect x="730" y="140" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">34</tspan></text><rect x="10" y="182" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="203.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Ciclo entre artefactos</tspan></text><rect x="570" y="182" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">35</tspan></text><rect x="730" y="182" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">35</tspan></text><rect x="10" y="224" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Prueba enlazada a una intención (tipo no permitido)</tspan></text><rect x="570" y="224" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">26</tspan></text><rect x="730" y="224" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">26</tspan></text><rect x="10" y="266" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Contenido cambiado sin actualizar el rastro</tspan></text><rect x="570" y="266" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">29</tspan></text><rect x="730" y="266" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">29</tspan></text><rect x="10" y="308" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Renombrar un identificador sin actualizar enlaces</tspan></text><rect x="570" y="308" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">27</tspan></text><rect x="730" y="308" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">27</tspan></text><rect x="10" y="350" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="371.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Texto cambiado de sentido, con el rastro intacto</tspan></text><rect x="570" y="350" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="371.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">24</tspan></text><rect x="730" y="350" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="371.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0</tspan></text><rect x="10" y="396" width="880" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">La trazabilidad mecánica prueba que los eslabones existen y no se han movido, no que digan lo mismo. Si el texto de un</tspan></text><text x="450" y="437.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">requisito cambia de sentido y su rastro queda intacto, el validador lo da por bueno.</tspan></text><text x="450" y="477.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
