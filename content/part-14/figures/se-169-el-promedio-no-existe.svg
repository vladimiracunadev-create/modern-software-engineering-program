<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 351" width="900" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Personas de 5 000 que caen en la banda central del 30 % en todas las dimensiones</title><desc id="d">Barras: de 5 000 personas simuladas con dimensiones correlacionadas 0,3, 1 542 están en la banda central de una dimensión, 473 de dos, 165 de tres, 13 de cinco y ninguna de diez.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="351" fill="#ffffff"/><text x="250" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">1 dimensión</tspan></text><rect x="260" y="16" width="420" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="688" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="688" dy="0">1 542</tspan></text><text x="250" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">2 dimensiones</tspan></text><rect x="260" y="60" width="128.833" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="396.833" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="396.833" dy="0">473</tspan></text><text x="250" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">3 dimensiones</tspan></text><rect x="260" y="104" width="44.9416" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="312.942" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="312.942" dy="0">165</tspan></text><text x="250" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">5 dimensiones</tspan></text><rect x="260" y="148" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="272" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="272" dy="0">13</tspan></text><text x="250" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">10 dimensiones</tspan></text><rect x="260" y="192" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="272" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="272" dy="0">0</tspan></text><rect x="10" y="240" width="880" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Diseñar para la persona promedio sirve a casi nadie en cuanto cuentan varias dimensiones (visión, destreza,</tspan></text><text x="450" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">conectividad, idioma, dispositivo). Con la correlación subida a 0,5 el resultado sube a 24 con cinco dimensiones y</tspan></text><text x="450" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">sigue en 0 con diez.</tspan></text><text x="450" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
