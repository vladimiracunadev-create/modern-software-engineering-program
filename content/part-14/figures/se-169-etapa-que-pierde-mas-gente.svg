<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 379" width="980" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Personas que se pierden en cada etapa de 1 000 que empiezan (tasas supuestas)</title><desc id="d">Barras: de 1 000 personas que empiezan, se pierden 30, 49, 92, 315, 36 y 19 en las seis etapas; completan 478. Mejorar solo la cuarta etapa 10 puntos sube la tasa de completar de 0,459 a 0,533; mejorar las seis 2 puntos la sube a 0,526.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="379" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Etapa 1: abrir la tarea</tspan></text><rect x="370" y="16" width="37.1429" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="415.143" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="415.143" dy="0">30</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Etapa 2: elegir el archivo</tspan></text><rect x="370" y="60" width="60.6667" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="438.667" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="438.667" dy="0">49</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Etapa 3: completar el formulario</tspan></text><rect x="370" y="104" width="113.905" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="491.905" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="491.905" dy="0">92</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Etapa 4: subir el archivo</tspan></text><rect x="370" y="148" width="390" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="768" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="768" dy="0">315</tspan></text><text x="360" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Etapa 5: confirmar</tspan></text><rect x="370" y="192" width="44.5714" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422.571" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422.571" dy="0">36</tspan></text><text x="360" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Etapa 6: ver el recibo</tspan></text><rect x="370" y="236" width="23.5238" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="401.524" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="401.524" dy="0">19</tspan></text><rect x="10" y="284" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Las tasas por etapa son un supuesto del autor, no una medición. Lo que muestra el cálculo es la forma: una sola etapa mala</tspan></text><text x="490" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">domina, y repartir esfuerzo en todas rinde menos que atacarla. Mejorar 2 puntos la primera etapa solo suma 0,0095.</tspan></text><text x="490" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
