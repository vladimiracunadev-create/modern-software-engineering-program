<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 411" width="1090" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Grafo sintético de 120 páginas: qué cambia un menú global y un enlace a la portada</title><desc id="d">Tabla de un sitio sintético de 120 páginas: con menú global todo se alcanza en 4 clics como máximo; sin él la profundidad llega a 9; desde una página interna con enlace a la portada se alcanza todo, y sin ese enlace solo 16 de 120 páginas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1090" height="411" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Situación</tspan></text><rect x="340" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Páginas alcanzables</tspan></text><rect x="570" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Clics máximos</tspan></text><rect x="720" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="897" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="897" dy="0">Distribución</tspan></text><rect x="10" y="56" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Con menú global en cada página</tspan></text><rect x="340" y="56" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Desde la portada: 120 de 120</tspan></text><rect x="570" y="56" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">4</tspan></text><rect x="720" y="56" width="354" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">17 / 47 / 41 / 14 páginas a 1 / 2 / 3 / 4 clics</tspan></text><rect x="10" y="120" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Sin menú global (solo enlaces de contenido)</tspan></text><rect x="340" y="120" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Desde la portada: 120 de 120</tspan></text><rect x="570" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">9</tspan></text><rect x="720" y="120" width="354" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="144.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">9 / 23 / 20 / 20 / 16 / 10 / 7 / 9 / 5 páginas a</tspan></text><text x="897" y="160.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">1 a 9 clics</tspan></text><rect x="10" y="184" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="208.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Desde una página interna, con enlace a la</tspan></text><text x="172" y="224.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">portada</tspan></text><rect x="340" y="184" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">120 de 120</tspan></text><rect x="570" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">5</tspan></text><rect x="720" y="184" width="354" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">4 / 18 / 46 / 38 / 13 páginas a 1 a 5 clics</tspan></text><rect x="10" y="248" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="272.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Desde la misma página, sin enlace a la</tspan></text><text x="172" y="288.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">portada</tspan></text><rect x="340" y="248" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">16 de 120</tspan></text><rect x="570" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">6</tspan></text><rect x="720" y="248" width="354" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Solo se alcanza el 13 % del sitio</tspan></text><rect x="10" y="316" width="1070" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="545" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">Un recorrido en anchura sobre un grafo de enlaces mide alcance y profundidad, no si la gente entiende las etiquetas. El grafo se generó con una</tspan></text><text x="545" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">semilla y 30 % de enlaces cruzados: un sitio real tiene otra forma, y la medida útil sigue siendo el éxito de personas buscando cosas.</tspan></text><text x="545" y="397.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="545" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
