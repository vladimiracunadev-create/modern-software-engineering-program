<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 291" width="1100" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Errores que se vuelven permanentes en 20 000 operaciones con 600 errores iniciales</title><desc id="d">Barras: de 600 errores en 100 series de 200 operaciones con 3 por ciento de error, un diálogo con 50, 80 y 95 por ciento de confirmación por reflejo deja 306, 479 y 571 errores permanentes; una ventana de deshacer donde 70 por ciento nota el error deja 178.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1100" height="291" fill="#ffffff"/><text x="480" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Diálogo de confirmación, 50 % confirma por reflejo</tspan></text><rect x="490" y="16" width="225.079" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="723.079" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="723.079" dy="0">306</tspan></text><text x="480" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Diálogo, 80 % confirma por reflejo</tspan></text><rect x="490" y="60" width="352.329" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="850.329" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="850.329" dy="0">479</tspan></text><text x="480" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Diálogo, 95 % confirma por reflejo</tspan></text><rect x="490" y="104" width="420" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="918" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="918" dy="0">571</tspan></text><text x="480" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Deshacer durante una ventana (70 % lo nota)</tspan></text><rect x="490" y="148" width="130.928" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="628.928" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="628.928" dy="0">178</tspan></text><rect x="10" y="196" width="1080" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="550" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">El diálogo falla porque convierte una interrupción en hábito; deshacer cambia la carga del momento de decidir al de comprobar. Los porcentajes de</tspan></text><text x="550" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">reflejo y de detección son supuestos del autor: lo que se mide es cómo cambia el resultado al moverlos.</tspan></text><text x="550" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
