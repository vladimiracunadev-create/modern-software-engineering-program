" stroke-width="2"/><rect x="786.135" y="367.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="886.5" y="373" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><polyline points="89.08,102.5 289.81,190.5 490.54,260.5 791.635,329.5 892,343.5" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="89.08,96.175 95.13,107.45 83.03,107.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="289.81,184.175 295.86,195.45 283.76,195.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="490.54,254.175 496.59,265.45 484.49,265.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="791.635,323.175 797.685,334.45 785.585,334.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="892,337.175 898.05,348.45 885.95,348.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Tiempo de apuntar con D = 600 px: 0,890, 0,805, 0,746, 0,681 y 0,663 s para 16, 24, 32, 44 y 48 px. Tiempo: 0,1 +</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">0,15·log2(D/W + 1), con constantes supuestas; fallo: probabilidad de que un toque con dispersión gaussiana caiga a más de</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">W/2 del centro, en una dimensión. La dispersión de una persona con temblor, un dedo grande o un autobús en marcha no se</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">midió: los tres σ son escenarios.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
