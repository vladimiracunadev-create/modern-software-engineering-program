<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tamaño del objetivo: tiempo de apuntar y toques que caen fuera</title><desc id="d">Líneas con el porcentaje de toques que caen fuera según el ancho del botón y tres dispersiones: con 24 píxeles fallan 4,5, 23,0 y 39,3 por ciento con dispersión de 6, 10 y 14 píxeles; con 44 píxeles 0,0, 2,8 y 11,5; el tiempo de Fitts baja de 0,89 a 0,66 segundos de 16 a 48 píxeles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tamaño del objetivo: tiempo de apuntar y toques que caen fuera</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">σ = 6 px</tspan></text><rect x="124.32" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">σ = 10 px</tspan></text><polygon points="246.18,44.1 252.78,56.4 239.58,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="260.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="260.18" dy="0">σ = 14 px</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="387" x2="71.08" y2="387" stroke=