<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 584" width="940" height="584" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Banderas independientes frente a un estado explícito</title><desc id="d">Barras agrupadas en escala logarítmica con las combinaciones posibles y las que tienen significado según el modelo del estado: tres banderas dan 8 de las que solo 4 tienen sentido; un estado con cuatro valores 4 y 4; dos fuentes 16 y 16; cuatro fuentes 256 y 256.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="584" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Banderas independientes frente a un estado explícito</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Combinaciones posibles</tspan></text><rect x="229.88" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="249.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">Con significado</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="281.667" x2="93.7" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="188.333" x2="93.7" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Combinaciones (escala logarítmica)</text><rect x="114.357" y="290.712" width="80.63" height="84.2884" rx="3" fill="#6b7c86"/><text x="154.672" y="284.712" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.672" dy="0">8</tspan></text><rect x="198.987" y="318.808" width="80.63" height="56.1923" rx="3" fill="#087f8c"/><text x="239.302" y="312.808" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="239.302" dy="0">4</tspan></text><text x="196.987" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.987" dy="0">Tres banderas booleanas</tspan></text><rect x="320.933" y="318.808" width="80.63" height="56.1923" rx="3" fill="#6b7c86"/><text x="361.248" y="312.808" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="361.248" dy="0">4</tspan></text><rect x="405.562" y="318.808" width="80.63" height="56.1923" rx="3" fill="#087f8c"/><text x="445.877" y="312.808" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="445.877" dy="0">4</tspan></text><text x="403.562" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.562" dy="0">Un único estado de cuatro</tspan></text><text x="403.562" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.562" dy="0">valores</tspan></text><rect x="527.507" y="262.615" width="80.63" height="112.385" rx="3" fill="#6b7c86"/><text x="567.822" y="256.615" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="567.822" dy="0">16</tspan></text><rect x="612.137" y="262.615" width="80.63" height="112.385" rx="3" fill="#087f8c"/><text x="652.452" y="256.615" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652.452" dy="0">16</tspan></text><text x="610.137" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">Dos fuentes de cuatro</tspan></text><text x="610.137" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">estados</tspan></text><rect x="734.082" y="150.231" width="80.63" height="224.769" rx="3" fill="#6b7c86"/><text x="774.398" y="144.231" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="774.398" dy="0">256</tspan></text><rect x="818.712" y="150.231" width="80.63" height="224.769" rx="3" fill="#087f8c"/><text x="859.027" y="144.231" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.027" dy="0">256</tspan></text><text x="816.712" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">Cuatro fuentes</tspan></text><rect x="10" y="444" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con tres banderas, 198 de 200 eventos aleatorios terminan en una combinación imposible; con un estado explícito, 0 de 200:</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solo se aceptan las transiciones declaradas. El manejador con banderas olvida apagar la carga y el error al llegar los</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">datos: cada actualización es correcta por separado y el conjunto no. Los eventos son aleatorios con semilla fija; en una</tspan></text><text x="470" y="518.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aplicación real no son equiprobables, pero la combinación imposible sigue siendo alcanzable.</tspan></text><text x="470" y="566.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
