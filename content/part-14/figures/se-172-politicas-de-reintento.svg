<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 309" width="1020" height="309" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil clientes tras una caída de 10 s: carga durante la caída y pico al recuperarse</title><desc id="d">Tabla de tres políticas de reintento con mil clientes y una caída de diez segundos: reintentar cada segundo suma 10 000 peticiones durante la caída y un pico de 1 000 al recuperarse; la espera exponencial sin aleatoriedad suma 3 000 pero mantiene el pico de 1 000; con aleatoriedad completa suma 3 978 y el pico baja a 151.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="309" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Política de reintento</tspan></text><rect x="410" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Peticiones durante la</tspan></text><text x="522" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">caída</tspan></text><rect x="640" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="762" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">Pico por segundo al</tspan></text><text x="762" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">recuperarse</tspan></text><rect x="890" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="947" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="947" dy="0">Total</tspan></text><rect x="10" y="56" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Cada segundo, sin espera creciente</tspan></text><rect x="410" y="56" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">10 000</tspan></text><rect x="640" y="56" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">1 000</tspan></text><rect x="890" y="56" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="947" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="947" dy="0">11 000</tspan></text><rect x="10" y="102" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Espera exponencial sin aleatoriedad</tspan></text><rect x="410" y="102" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">3 000</tspan></text><rect x="640" y="102" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">1 000</tspan></text><rect x="890" y="102" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="947" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="947" dy="0">4 000</tspan></text><rect x="10" y="148" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Espera exponencial con aleatoriedad completa</tspan></text><rect x="410" y="148" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">3 978</tspan></text><rect x="640" y="148" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">151</tspan></text><rect x="890" y="148" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="947" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="947" dy="0">4 978</tspan></text><rect x="10" y="198" width="1000" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="222.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">Los clientes arrancan casi a la vez (en 0,5 s) y el servicio vuelve a los 10 s. La espera exponencial reduce el tráfico pero deja a</tspan></text><text x="510" y="239.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">los clientes sincronizados; la aleatoriedad rompe esa sincronía. Es una simulación de un recurso sin capacidad finita: no incluye</tspan></text><text x="510" y="256.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">colas ni límites del servidor.</tspan></text><text x="510" y="295.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
