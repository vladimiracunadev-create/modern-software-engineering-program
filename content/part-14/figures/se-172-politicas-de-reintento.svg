<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil clientes tras una caída de 10 s: carga durante la caída y pico al recuperarse</title><desc id="d">Barras agrupadas en escala logarítmica de tres políticas de reintento con mil clientes y una caída de diez segundos: reintentar cada segundo suma 10 000 peticiones durante la caída y un pico de 1 000 al recuperarse; la espera exponencial sin aleatoriedad 3 000 y 1 000; con aleatoriedad completa 3 978 y 151.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mil clientes tras una caída de 10 s: carga durante la caída y pico al recuperarse</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Peticiones durante la caída</tspan></text><rect x="267.58" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="287.58" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="287.58" dy="0">Pico por segundo al recuperarse</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="235" x2="101.24" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Peticiones (escala logarítmica)</text><rect x="128.532" y="95" width="107.168" height="280" rx="3" fill="#6b7c86"/><text x="182.116" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182.116" dy="0">10 000</tspan></text><rect x="239.7" y="235" width="107.168" height="140" rx="3" fill="#c0432f"/><text x="293.284" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="293.284" dy="0">1 000</tspan></text><text x="237.7" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">Cada segundo, sin espera creciente</tspan></text><rect x="401.452" y="168.203" width="107.168" height="206.797" rx="3" fill="#6b7c86"/><text x="455.036" y="162.203" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="455.036" dy="0">3 000</tspan></text><rect x="512.62" y="235" width="107.168" height="140" rx="3" fill="#c0432f"/><text x="566.204" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.204" dy="0">1 000</tspan></text><text x="510.62" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">Espera exponencial sin aleatoriedad</tspan></text><rect x="674.372" y="151.047" width="107.168" height="223.953" rx="3" fill="#6b7c86"/><text x="727.956" y="145.047" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="727.956" dy="0">3 978</tspan></text><rect x="785.54" y="349.943" width="107.168" height="25.0568" rx="3" fill="#c0432f"/><text x="839.124" y="343.943" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.124" dy="0">151</tspan></text><text x="783.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">Espera exponencial con aleatoriedad</tspan></text><text x="783.54" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">completa</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Totales: 11 000, 4 000 y 4 978. Los clientes arrancan casi a la vez (en 0,5 s) y el servicio vuelve a los 10 s. La espera</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">exponencial reduce el tráfico pero deja a los clientes sincronizados; la aleatoriedad rompe esa sincronía. Es una</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">simulación de un recurso sin capacidad finita: no incluye colas ni límites del servidor.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
