<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 351" width="980" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Latencia lognormal simulada (mediana 0,4 s): cuántas cargas cruzan cada umbral</title><desc id="d">Barras: con latencia lognormal de mediana 0,4 segundos y dispersión 0,9, el 93,7 por ciento de las cargas supera 0,1 segundos, el 62,3 supera 0,3, el 15,3 supera 1, el 1,4 supera 3 y ninguna supera 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="351" fill="#ffffff"/><text x="320" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Cargas que tardan más de 0,1 s</tspan></text><rect x="330" y="16" width="450" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="788" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788" dy="0">93,7 %</tspan></text><text x="320" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Más de 0,3 s</tspan></text><rect x="330" y="60" width="299.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="637.2" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="637.2" dy="0">62,3 %</tspan></text><text x="320" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Más de 1 s</tspan></text><rect x="330" y="104" width="73.4792" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="411.479" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="411.479" dy="0">15,3 %</tspan></text><text x="320" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Más de 3 s</tspan></text><rect x="330" y="148" width="6.72359" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="344.724" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="344.724" dy="0">1,4 %</tspan></text><text x="320" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Más de 10 s</tspan></text><rect x="330" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="342" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="342" dy="0">0,0 %</tspan></text><rect x="10" y="240" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Con un indicador inmediato, 37,7 % de las cargas (las de menos de 0,3 s) lo mostrarían una fracción de segundo y desaparecerían:</tspan></text><text x="490" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">un parpadeo. Retrasar el indicador 0,3 s lo evita en esas, pero 4 432 cargas de 20 000 lo mostrarían menos de 0,2 s; una duración</tspan></text><text x="490" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">mínima lo arregla. La distribución es supuesta.</tspan></text><text x="490" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
