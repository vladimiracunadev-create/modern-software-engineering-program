<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 263" width="980" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Destinos de una fila que cumplen el tamaño mínimo de 24 px o la excepción por espacio</title><desc id="d">Barras: en 600 destinos sintéticos con anchos de 16 a 44 píxeles dispuestos en filas de seis, cumplen el tamaño mínimo o su excepción por espacio el 58,0 por ciento con 2 píxeles de separación y el 100 por ciento con 8 o 16.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="263" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Separación de 2 px entre destinos</tspan></text><rect x="370" y="16" width="226.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="604.2" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="604.2" dy="0">58,0 % cumplen</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Separación de 8 px</tspan></text><rect x="370" y="60" width="390" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="768" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="768" dy="0">100 % cumplen</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Separación de 16 px</tspan></text><rect x="370" y="104" width="390" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="768" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="768" dy="0">100 % cumplen</tspan></text><rect x="10" y="152" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Alrededor de la mitad de los destinos mide menos de 24 px, así que el cumplimiento depende del espacio. El modelo es</tspan></text><text x="490" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">unidimensional y usa la regla de círculo de 24 px de WCAG 2.2; en una rejilla real los vecinos diagonales y los alvéolos de</tspan></text><text x="490" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">lectura táctil cambian el cálculo.</tspan></text><text x="490" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
