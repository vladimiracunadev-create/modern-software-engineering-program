<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 305" width="1000" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estructura navegable: encabezados reales frente a texto con aspecto de título</title><desc id="d">Tabla: en una página de 12 secciones y 24 párrafos cada una, llegar a la sección 9 exige leer 201 nodos; con encabezados reales se llega con 9 saltos, con div estilizados no hay forma de saltar, y una secuencia de niveles tiene un salto del 2 al 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="305" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Página</tspan></text><rect x="340" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Nodos hasta la sección</tspan></text><text x="437" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">9</tspan></text><rect x="540" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">Encabezados</tspan></text><text x="632" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">disponibles</tspan></text><rect x="730" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">Resultado</tspan></text><rect x="10" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Secciones con h2 reales</tspan></text><rect x="340" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">201</tspan></text><rect x="540" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">12</tspan></text><rect x="730" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">9 saltos hasta la sección 9</tspan></text><rect x="10" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Secciones con div de clase «titulo»</tspan></text><rect x="340" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">201</tspan></text><rect x="540" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">0</tspan></text><rect x="730" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Ninguna: solo lectura lineal</tspan></text><rect x="10" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Niveles 1, 2, 2, 3, 3, 2, 4, 2, 3</tspan></text><rect x="340" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">—</tspan></text><rect x="540" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">9</tspan></text><rect x="730" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Un salto de nivel (del 2 al 4)</tspan></text><rect x="10" y="210" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El analizador cuenta nodos y encabezados de una página generada; no mide cómo navega una persona con un lector de pantalla, que</tspan></text><text x="500" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">combina atajos, listas de enlaces y regiones. El número de nodos lo fija la página sintética (12 × 24 + 12 + 1).</tspan></text><text x="500" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
