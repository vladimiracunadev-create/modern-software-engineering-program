<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 291" width="1040" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Invertir los colores ingenuamente para un modo oscuro no conserva el contraste</title><desc id="d">Barras: de 20 000 pares de colores al azar, 2 441 pasan 4,5 a 1; tras invertir cada canal pasan 2 499, pero 956 de los que pasaban dejan de pasar y 1 014 que fallaban pasan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="291" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Pares de 20 000 que pasan 4,5:1 antes</tspan></text><rect x="430" y="16" width="410.252" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="848.252" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="848.252" dy="0">2 441</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Pares que pasan tras invertir los colores</tspan></text><rect x="430" y="60" width="420" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="858" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="858" dy="0">2 499</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Pierden el cumplimiento al invertir</tspan></text><rect x="430" y="104" width="160.672" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="598.672" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="598.672" dy="0">956</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Ganan el cumplimiento al invertir</tspan></text><rect x="430" y="148" width="170.42" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="608.42" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="608.42" dy="0">1 014</tspan></text><rect x="10" y="196" width="1020" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">El total casi no cambia y esconde que casi cuatro de cada diez pares (956 de 2 441) cambian de lado. Un modo oscuro se diseña con pares</tspan></text><text x="520" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">calculados, no con una operación sobre los canales. Los pares son aleatorios y uniformes en sRGB, no una paleta real.</tspan></text><text x="520" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
