de 10 el par se confunde. Rojo y verde se vuelven casi iguales para deuteranopía (7,3) y su</tspan></text><text x="485" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">contraste de luminancia es 1,48:1. Aplicar las matrices de Machado en RGB lineal es una aproximación; ninguna simulación</tspan></text><text x="485" y="328.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">reemplaza a personas con esa visión ni abarca los casos parciales.</tspan></text><text x="485" y="367.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
