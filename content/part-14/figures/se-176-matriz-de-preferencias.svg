<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 263" width="1000" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defectos de preferencias del usuario hallados según el diseño de la matriz de pruebas</title><desc id="d">Barras: de 60 defectos sintéticos que dependen de una, dos o tres preferencias a la vez, las 32 combinaciones completas matan 60, seis filas que cubren todos los pares matan 55 y seis filas al azar matan 50,4 de media.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="263" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">32 combinaciones completas</tspan></text><rect x="410" y="16" width="380" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="798" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="798" dy="0">60 de 60</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">6 filas que cubren todos los pares</tspan></text><rect x="410" y="60" width="348.333" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="766.333" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="766.333" dy="0">55 de 60</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">6 filas al azar (media de 200 sorteos)</tspan></text><rect x="410" y="104" width="319.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="737.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="737.2" dy="0">50,4 de 60</tspan></text><rect x="10" y="152" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Cinco preferencias binarias (movimiento reducido, esquema oscuro, contraste, colores forzados, zoom del 200 %) dan 32</tspan></text><text x="500" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">combinaciones; seis filas cubren los 40 pares. Quedan sin cubrir los defectos de tres preferencias. Los 60 defectos son una mezcla</tspan></text><text x="500" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">supuesta (20 de una, 28 de dos, 12 de tres).</tspan></text><text x="500" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
