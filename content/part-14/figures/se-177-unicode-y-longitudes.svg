<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 564" width="940" height="564" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una misma «letra» que se cuenta de maneras distintas</title><desc id="d">Barras agrupadas con la longitud en puntos de código, en bytes UTF-8 y en unidades UTF-16: José tiene 4 puntos con el acento precompuesto y 5 con el acento combinado, y el emoji de mujer tecnóloga, con tres símbolos unidos, tiene 3 puntos, 11 bytes y 5 unidades.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="564" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una misma «letra» que se cuenta de maneras distintas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Puntos de código</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Bytes UTF-8</tspan></text><rect x="315.58" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="335.58" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="335.58" dy="0">Unidades UTF-16</tspan></text><line x1="86.16" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="355" x2="86.16" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0</tspan></text><line x1="86.16" y1="303" x2="920" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="303" x2="86.16" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">2,5</tspan></text><line x1="86.16" y1="251" x2="920" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="251" x2="86.16" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">5</tspan></text><line x1="86.16" y1="199" x2="920" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="199" x2="86.16" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">7,5</tspan></text><line x1="86.16" y1="147" x2="920" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="147" x2="86.16" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">10</tspan></text><line x1="86.16" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="95" x2="86.16" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">12,5</tspan></text><line x1="86.16" y1="95" x2="86.16" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Longitud</text><rect x="113.955" y="271.8" width="71.4524" height="83.2" rx="3" fill="#102a43"/><text x="149.681" y="265.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149.681" dy="0">4</tspan></text><rect x="189.407" y="251" width="71.4524" height="104" rx="3" fill="#c0432f"/><text x="225.133" y="245" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="225.133" dy="0">5</tspan></text><rect x="264.86" y="271.8" width="71.4524" height="83.2" rx="3" fill="#087f8c"/><text x="300.586" y="265.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="300.586" dy="0">4</tspan></text><text x="225.133" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="225.133" dy="0">José (acento precompuesto)</tspan></text><rect x="391.901" y="251" width="71.4524" height="104" rx="3" fill="#102a43"/><text x="427.628" y="245" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="427.628" dy="0">5</tspan></text><rect x="467.354" y="230.2" width="71.4524" height="124.8" rx="3" fill="#c0432f"/><text x="503.08" y="224.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="503.08" dy="0">6</tspan></text><rect x="542.806" y="251" width="71.4524" height="104" rx="3" fill="#087f8c"/><text x="578.532" y="245" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="578.532" dy="0">5</tspan></text><text x="503.08" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="503.08" dy="0">José (acento combinado)</tspan></text><rect x="669.848" y="292.6" width="71.4524" height="62.4" rx="3" fill="#102a43"/><text x="705.574" y="286.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705.574" dy="0">3</tspan></text><rect x="745.3" y="126.2" width="71.4524" height="228.8" rx="3" fill="#c0432f"/><text x="781.027" y="120.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="781.027" dy="0">11</tspan></text><rect x="820.753" y="251" width="71.4524" height="104" rx="3" fill="#087f8c"/><text x="856.479" y="245" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.479" dy="0">5</tspan></text><text x="781.027" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="781.027" dy="0">Mujer tecnóloga (tres símbolos</tspan></text><text x="781.027" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="781.027" dy="0">unidos)</tspan></text><rect x="10" y="424" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Otros casos de la tabla: «Zoë» tiene 3 puntos si el acento está precompuesto y 4 si está combinado; «straße» en mayúsculas</tspan></text><text x="470" y="465.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es «STRASSE»; «İ».lower() produce 2 puntos de código. De 7 nombres con variantes de composición, 7 son distintos como bytes</tspan></text><text x="470" y="482.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y 4 tras normalizar a NFC. Cortar «x👩‍💻» tras 2 puntos deja un emoji partido; ordenar por punto de código coloca «Ángel» y</tspan></text><text x="470" y="498.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«Ñandú» detrás de «Zoë».</tspan></text><text x="470" y="546.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
