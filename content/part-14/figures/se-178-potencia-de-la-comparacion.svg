<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 395" width="1090" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de detectar la diferencia entre dos diseños con una prueba de permutación</title><desc id="d">Barras: con desviación típica de 12 puntos de SUS, una diferencia de 7 puntos se detecta con probabilidad 22 por ciento con 8 participantes por grupo, 39 con 20 y 69 con 40; una diferencia de 15 puntos con 8 en 61 y con 20 en 97; sin diferencia real el 4 por ciento da un falso positivo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1090" height="395" fill="#ffffff"/><text x="410" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Diferencia de 7 puntos, 8 por grupo</tspan></text><rect x="420" y="16" width="95.2577" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="523.258" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="523.258" dy="0">22 %</tspan></text><text x="410" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Diferencia de 7 puntos, 20 por grupo</tspan></text><rect x="420" y="60" width="168.866" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="596.866" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="596.866" dy="0">39 %</tspan></text><text x="410" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Diferencia de 7 puntos, 40 por grupo</tspan></text><rect x="420" y="104" width="298.763" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="726.763" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="726.763" dy="0">69 %</tspan></text><text x="410" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Diferencia de 15 puntos, 8 por grupo</tspan></text><rect x="420" y="148" width="264.124" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="692.124" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="692.124" dy="0">61 %</tspan></text><text x="410" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Diferencia de 15 puntos, 20 por grupo</tspan></text><rect x="420" y="192" width="420" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="848" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="848" dy="0">97 %</tspan></text><text x="410" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Sin diferencia real, 12 por grupo</tspan></text><rect x="420" y="236" width="17.3196" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="445.32" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="445.32" dy="0">4,0 % de falsos positivos</tspan></text><rect x="10" y="284" width="1070" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="545" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">Con muestras de usabilidad típicas, una diferencia moderada pasa desapercibida la mayor parte del tiempo, y el análisis no se equivoca por ello:</tspan></text><text x="545" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">no tenía potencia. La media base de 68 y la desviación de 12 son supuestos del autor; 150 simulaciones por celda dan una incertidumbre de varios</tspan></text><text x="545" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">puntos.</tspan></text><text x="545" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="545" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
