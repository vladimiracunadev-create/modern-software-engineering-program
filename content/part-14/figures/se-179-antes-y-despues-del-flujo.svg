<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Auditoría de un formulario de entrega antes y después de reparar</title><desc id="d">Barras horizontales con los hallazgos del auditor automático antes y después de reparar un formulario de entrega: sin idioma, título genérico, sin región principal ni encabezados 4, campos sin etiqueta 2, imagen sin alt 1, un div clicable 1 y un enlace vacío 1, 9 en total; tras la reparación, ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Auditoría de un formulario de entrega antes y después de reparar</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Antes</tspan></text><rect x="101.7" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">Después</tspan></text><line x1="354" y1="77" x2="354" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="397" x2="354" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="492.485" y1="77" x2="492.485" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="492.485" y1="397" x2="492.485" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="492.485" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492.485" dy="0">1</tspan></text><line x1="630.97" y1="77" x2="630.97" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="630.97" y1="397" x2="630.97" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="630.97" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630.97" dy="0">2</tspan></text><line x1="769.455" y1="77" x2="769.455" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="769.455" y1="397" x2="769.455" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="769.455" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="769.455" dy="0">3</tspan></text><line x1="907.94" y1="77" x2="907.94" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="397" x2="907.94" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">4</tspan></text><line x1="354" y1="397" x2="907.94" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin idioma, título genérico, sin región</tspan></text><text x="344" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">principal ni encabezados</tspan></text><text x="344" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Campos sin etiqueta (solo placeholder)</tspan></text><text x="344" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Imagen sin texto alternativo</tspan></text><text x="344" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Control hecho con div y clic</tspan></text><text x="344" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Enlace sin texto</tspan></text><rect x="354" y="83" width="553.94" height="24.5" rx="3" fill="#c0432f"/><text x="914.94" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">4</tspan></text><rect x="354" y="110.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="147" width="276.97" height="24.5" rx="3" fill="#c0432f"/><text x="637.97" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="637.97" dy="0">2</tspan></text><rect x="354" y="174.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="211" width="138.485" height="24.5" rx="3" fill="#c0432f"/><text x="499.485" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="499.485" dy="0">1</tspan></text><rect x="354" y="238.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="275" width="138.485" height="24.5" rx="3" fill="#c0432f"/><text x="499.485" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="499.485" dy="0">1</tspan></text><rect x="354" y="302.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="339" width="138.485" height="24.5" rx="3" fill="#c0432f"/><text x="499.485" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="499.485" dy="0">1</tspan></text><rect x="354" y="366.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><text x="630.97" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">Hallazgos del auditor</tspan></text><rect x="10" y="455" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Total de hallazgos: 9 antes y 0 después. Cero hallazgos significa que las reglas no encuentran nada, no que el flujo sea</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">accesible: tras la reparación, un texto alternativo, una etiqueta o un orden de foco pueden ser incorrectos sin que el</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">auditor lo note, y el flujo completo (error, recuperación, confirmación) no se recorrió.</tspan></text><text x="470" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
