<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 423" width="960" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Auditoría de un formulario de entrega antes y después de reparar</title><desc id="d">Tabla: un formulario de entrega con nueve hallazgos del auditor automático (sin idioma, título genérico, sin región principal ni encabezados, dos campos sin etiqueta, una imagen sin alt, un div clicable y un enlace vacío) queda en cero hallazgos tras la reparación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="423" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Categoría de hallazgo</tspan></text><rect x="650" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Antes</tspan></text><rect x="800" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Después</tspan></text><rect x="10" y="56" width="634" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Sin idioma, título genérico, sin región principal ni encabezados</tspan></text><rect x="650" y="56" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">4</tspan></text><rect x="800" y="56" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0</tspan></text><rect x="10" y="98" width="634" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="119.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Campos sin etiqueta (solo placeholder)</tspan></text><rect x="650" y="98" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">2</tspan></text><rect x="800" y="98" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0</tspan></text><rect x="10" y="140" width="634" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Imagen sin texto alternativo</tspan></text><rect x="650" y="140" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">1</tspan></text><rect x="800" y="140" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0</tspan></text><rect x="10" y="182" width="634" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="203.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Control hecho con div y clic (inaccesible con teclado)</tspan></text><rect x="650" y="182" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">1</tspan></text><rect x="800" y="182" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0</tspan></text><rect x="10" y="224" width="634" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Enlace sin texto</tspan></text><rect x="650" y="224" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">1</tspan></text><rect x="800" y="224" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0</tspan></text><rect x="10" y="266" width="634" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Total de hallazgos del auditor</tspan></text><rect x="650" y="266" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">9</tspan></text><rect x="800" y="266" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0</tspan></text><rect x="10" y="312" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="336.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Cero hallazgos significa que las reglas no encuentran nada, no que el flujo sea accesible: tras la reparación, un texto</tspan></text><text x="480" y="353.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">alternativo, una etiqueta o un orden de foco pueden ser incorrectos sin que el auditor lo note, y el flujo completo (error,</tspan></text><text x="480" y="370.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">recuperación, confirmación) no se recorrió.</tspan></text><text x="480" y="409.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
