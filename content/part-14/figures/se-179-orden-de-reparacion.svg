<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 263" width="1080" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Barreras bloqueantes eliminadas tras cuatro horas de trabajo según el orden de reparación</title><desc id="d">Barras: con 12 hallazgos y 4 horas de trabajo, reparar primero lo más fácil o lo de mayor valor por hora elimina 51 por ciento de la población bloqueada, y reparar primero lo más grave y que afecta a más gente elimina 71 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="263" fill="#ffffff"/><text x="450" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="450" dy="0">Primero lo más fácil de reparar</tspan></text><rect x="460" y="16" width="330.423" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="798.423" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="798.423" dy="0">51 %</tspan></text><text x="450" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="450" dy="0">Primero lo de mayor valor por hora</tspan></text><rect x="460" y="60" width="330.423" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="798.423" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="798.423" dy="0">51 %</tspan></text><text x="450" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="450" dy="0">Primero lo más grave y que afecta a más gente</tspan></text><rect x="460" y="104" width="460" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="928" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="928" dy="0">71 %</tspan></text><rect x="10" y="152" width="1060" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">El orden por gravedad gana porque los bloqueos graves son caros: en el reparto de valor por hora aparecen detrás de arreglos baratos y poco</tspan></text><text x="540" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">graves. Alcance, gravedad y horas son estimaciones del autor sobre un flujo sintético; con otras horas el orden ganador cambia y eso es lo que</tspan></text><text x="540" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">hay que comprobar.</tspan></text><text x="540" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
