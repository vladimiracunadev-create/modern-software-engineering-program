<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 307" width="980" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que cuatro modalidades de uso estén todas representadas</title><desc id="d">Barras: reclutando al azar entre cuatro modalidades de uso con igual probabilidad, todas están representadas con probabilidad 38,1 por ciento con seis participantes, 62,3 con ocho, 87,5 con doce y 96,0 con dieciséis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="307" fill="#ffffff"/><text x="370" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">6 participantes reclutados al azar</tspan></text><rect x="380" y="16" width="170.656" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="558.656" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="558.656" dy="0">38,1 %</tspan></text><text x="370" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">8 participantes</tspan></text><rect x="380" y="60" width="279.052" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="667.052" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="667.052" dy="0">62,3 %</tspan></text><text x="370" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">12 participantes</tspan></text><rect x="380" y="104" width="391.927" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="779.927" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="779.927" dy="0">87,5 %</tspan></text><text x="370" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">16 participantes</tspan></text><rect x="380" y="148" width="430" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="818" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="818" dy="0">96,0 %</tspan></text><rect x="10" y="196" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Calculado por inclusión y exclusión y comprobado con 20 000 sorteos (61,9 % de fallos con 6). Reclutar por cuotas lo evita;</tspan></text><text x="490" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">recluta al azar solo si la modalidad no importa. Las cuatro modalidades con igual probabilidad son un supuesto: una modalidad</tspan></text><text x="490" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">menos frecuente hace peor el resultado.</tspan></text><text x="490" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
