<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 379" width="1010" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esfuerzo total de un plan de 40 piezas según cada cuánto se obtiene retroalimentación</title><desc id="d">Barras: con 40 piezas de trabajo y 25 por ciento de malentendidos, el esfuerzo total medio de 2000 simulaciones es 79,6 si se recibe retroalimentación solo al final, 64,9 cada 20 piezas, 55,3 cada 4, 56,8 cada 2 u 8 y 62,0 tras cada pieza, porque cada ciclo cuesta 0,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="379" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Retroalimentación tras cada pieza (40 ciclos)</tspan></text><rect x="410" y="16" width="372" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="790" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="790" dy="0">62,0</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Cada 2 piezas (20 ciclos)</tspan></text><rect x="410" y="60" width="340.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="758.8" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758.8" dy="0">56,8</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Cada 4 piezas (10 ciclos)</tspan></text><rect x="410" y="104" width="331.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="749.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="749.8" dy="0">55,3</tspan></text><text x="400" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Cada 8 piezas (5 ciclos)</tspan></text><rect x="410" y="148" width="340.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="758.8" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758.8" dy="0">56,8</tspan></text><text x="400" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Cada 20 piezas (2 ciclos)</tspan></text><rect x="410" y="192" width="389.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="807.4" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="807.4" dy="0">64,9</tspan></text><text x="400" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Solo al final (modelo predictivo)</tspan></text><rect x="410" y="236" width="477.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="895.6" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="895.6" dy="0">79,6</tspan></text><rect x="10" y="284" width="990" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="505" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">Hay un intervalo intermedio con el menor esfuerzo: retroalimentar con más frecuencia reduce el retrabajo pero cada ciclo cuesta 0,3</tspan></text><text x="505" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">piezas. Los parámetros (25 % de malentendidos, 15 % de piezas posteriores afectadas) son supuestos del autor.</tspan></text><text x="505" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
