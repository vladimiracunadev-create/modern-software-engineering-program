<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 291" width="900" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valor que se deja sin entregar frente al mejor conjunto posible</title><desc id="d">Barras: de 60 funciones y 10 sprints de 3 funciones, el valor no entregado respecto del mejor conjunto posible es 12,3 por ciento sin retroalimentación, 11,4 si se aprende cada 5 sprints, 9,4 cada 2 y 8,3 cada sprint, en 500 mundos sintéticos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="291" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Sin retroalimentación</tspan></text><rect x="300" y="16" width="307.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="615.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="615.5" dy="0">12,3 %</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Cada 5 sprints</tspan></text><rect x="300" y="60" width="285" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="593" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="593" dy="0">11,4 %</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Cada 2 sprints</tspan></text><rect x="300" y="104" width="235" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="543" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="543" dy="0">9,4 %</tspan></text><text x="290" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Cada sprint</tspan></text><rect x="300" y="148" width="207.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="515.5" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="515.5" dy="0">8,3 %</tspan></text><rect x="10" y="196" width="880" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">Aprender del uso reorganiza las prioridades de los grupos de funciones ya entregados. La ganancia total es de cuatro</tspan></text><text x="450" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">puntos: el proceso ayuda, pero el efecto depende de que lo observado en un grupo se generalice a los demás.</tspan></text><text x="450" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
