<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 385" width="940" height="385" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Longitud del ciclo: sobrecoste de las ceremonias frente a oportunidades de aprender</title><desc id="d">Tabla de un trimestre de 12 semanas con 10,5 horas de ceremonias por ciclo: el sobrecoste va de 5,25 por ciento con ciclos de una semana a 0,88 con ciclos de seis; el valor entregado respecto del mejor conjunto es máximo, 91,6 por ciento, con ciclos de dos semanas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="385" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Ciclo</tspan></text><rect x="200" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Capacidad en ceremonias</tspan></text><rect x="460" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">Ciclos por trimestre</tspan></text><rect x="680" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Valor / mejor conjunto</tspan></text><rect x="10" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">1 semana</tspan></text><rect x="200" y="56" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">5,25 %</tspan></text><rect x="460" y="56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">12</tspan></text><rect x="680" y="56" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">91,1 %</tspan></text><rect x="10" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">2 semanas</tspan></text><rect x="200" y="102" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">2,62 %</tspan></text><rect x="460" y="102" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">6</tspan></text><rect x="680" y="102" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">91,6 %</tspan></text><rect x="10" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">3 semanas</tspan></text><rect x="200" y="148" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">1,75 %</tspan></text><rect x="460" y="148" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">4</tspan></text><rect x="680" y="148" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">90,8 %</tspan></text><rect x="10" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">4 semanas</tspan></text><rect x="200" y="194" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">1,31 %</tspan></text><rect x="460" y="194" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">3</tspan></text><rect x="680" y="194" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">90,6 %</tspan></text><rect x="10" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">6 semanas</tspan></text><rect x="200" y="240" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">0,88 %</tspan></text><rect x="460" y="240" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">2</tspan></text><rect x="680" y="240" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">90,0 %</tspan></text><rect x="10" y="290" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El óptimo aparece en el ciclo de 2 semanas con una diferencia de 1,6 puntos entre el mejor y el peor: es una curva plana.</tspan></text><text x="470" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las 10,5 horas de ceremonias y el equipo de cinco personas son supuestos; con otros valores el óptimo se mueve.</tspan></text><text x="470" y="371.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
