<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 247" width="1030" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alcance fijo frente a tiempo fijo y alcance variable (4 semanas, 12 piezas)</title><desc id="d">Barras: con 12 piezas de esfuerzo lognormal y 4 semanas, terminar todas ocurre en 1,3 por ciento de 5000 simulaciones; con el tiempo fijo y las piezas en orden de prioridad se terminan las 4 imprescindibles en 84,7 por ciento y se entregan 6,04 piezas de media.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="247" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Las 12 piezas terminadas dentro de 4 semanas</tspan></text><rect x="480" y="16" width="6.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="494.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="494.5" dy="0">1,3 %</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Las 4 imprescindibles terminadas con tiempo fijo</tspan></text><rect x="480" y="60" width="423.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="911.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="911.5" dy="0">84,7 %</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Piezas medias entregadas con tiempo fijo (de 12)</tspan></text><rect x="480" y="104" width="251.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="739.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="739.5" dy="0">6,04</tspan></text><rect x="10" y="152" width="1010" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="515" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="515" dy="0">Fijar el tiempo y recortar el alcance convierte una promesa casi imposible en una entrega parcial pero útil. Funciona si las piezas son</tspan></text><text x="515" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="515" dy="0">separables y el orden de prioridad es real; la barra de 6,04 está escalada a porcentaje de 12 solo para dibujarla.</tspan></text><text x="515" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
