<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 434" width="940" height="434" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sprints que fallan según la regla para comprometer elementos (rendimiento medio de 10)</title><desc id="d">Barras horizontales con el porcentaje de 20 000 sprints sintéticos que no cumplen lo comprometido: 44,7 con el rendimiento del último sprint, 44,0 con la media de los 3 o de los 6 últimos, 11,2 con el mínimo de los 6 últimos y 12,1 con el segundo menor de los 12 últimos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="434" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sprints que fallan según la regla para comprometer elementos (rendimiento medio de 10)</tspan></text><line x1="324" y1="49" x2="324" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="269" x2="324" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="435.952" y1="49" x2="435.952" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="435.952" y1="269" x2="435.952" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="435.952" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435.952" dy="0">10</tspan></text><line x1="547.904" y1="49" x2="547.904" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="547.904" y1="269" x2="547.904" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="547.904" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.904" dy="0">20</tspan></text><line x1="659.856" y1="49" x2="659.856" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="659.856" y1="269" x2="659.856" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="659.856" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="659.856" dy="0">30</tspan></text><line x1="771.808" y1="49" x2="771.808" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="771.808" y1="269" x2="771.808" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="771.808" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.808" dy="0">40</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="269" x2="883.76" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">50</tspan></text><line x1="324" y1="269" x2="883.76" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Rendimiento del último sprint (compromete</tspan></text><text x="314" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">9,99)</tspan></text><text x="314" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Media de los 3 últimos (9,99)</tspan></text><text x="314" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Media de los 6 últimos (9,99)</tspan></text><text x="314" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Mínimo de los 6 últimos (6,21)</tspan></text><text x="314" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Segundo menor de los 12 últimos (6,63)</tspan></text><rect x="324" y="55" width="500.425" height="32" rx="3" fill="#c0432f"/><text x="831.425" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="831.425" dy="0">44,7</tspan></text><rect x="324" y="99" width="492.589" height="32" rx="3" fill="#c0432f"/><text x="823.589" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="823.589" dy="0">44,0</tspan></text><rect x="324" y="143" width="492.589" height="32" rx="3" fill="#c0432f"/><text x="823.589" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="823.589" dy="0">44,0</tspan></text><rect x="324" y="187" width="125.386" height="32" rx="3" fill="#c0432f"/><text x="456.386" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="456.386" dy="0">11,2</tspan></text><rect x="324" y="231" width="135.462" height="32" rx="3" fill="#c0432f"/><text x="466.462" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="466.462" dy="0">12,1</tspan></text><text x="603.88" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603.88" dy="0">Sprints que no cumplen lo comprometido (%)</tspan></text><rect x="10" y="327" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Comprometer la media garantiza fallar casi la mitad de las veces. Ninguna regla es correcta en sí: cada una cambia</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fiabilidad por capacidad sin usar, y el equipo decide qué cuesta más.</tspan></text><text x="470" y="416.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
