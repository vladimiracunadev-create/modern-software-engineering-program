<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Espera en cola según la utilización de una persona (en servicios medios)</title><desc id="d">Líneas con la espera en cola de un servidor en servicios medios según la utilización: la simulación y la fórmula utilización sobre uno menos utilización coinciden y pasan de 1 al 50 por ciento a 2,33 al 70, 4 al 80, 9 al 90 y unos 19 al 95.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Espera en cola según la utilización de una persona (en servicios medios)</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Simulada</tspan></text><rect x="124.32" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Fórmula ρ/(1−ρ)</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="387" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="312" x2="71.08" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="237" x2="71.08" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="162" x2="71.08" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="87" x2="71.08" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="87" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="87" x2="89.08" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="387" x2="89.08" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">50</tspan></text><line x1="445.933" y1="87" x2="445.933" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="445.933" y1="387" x2="445.933" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="445.933" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="445.933" dy="0">70</tspan></text><line x1="624.36" y1="87" x2="624.36" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="624.36" y1="387" x2="624.36" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="624.36" y="408" font-size="13" text-anchor="middle" font-weigh