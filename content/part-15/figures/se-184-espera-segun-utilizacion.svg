<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 385" width="840" height="385" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Espera en cola según la utilización de una persona (en servicios medios)</title><desc id="d">Tabla: simulación de una cola de un servidor con llegadas y servicios aleatorios frente a la fórmula utilización sobre uno menos utilización; la espera pasa de 1 servicio medio al 50 por ciento a 9 al 90 y a unos 19 al 95.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="385" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Utilización</tspan></text><rect x="270" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Simulada</tspan></text><rect x="530" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="677" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="677" dy="0">Fórmula ρ/(1−ρ)</tspan></text><rect x="10" y="56" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">50 %</tspan></text><rect x="270" y="56" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">1,00</tspan></text><rect x="530" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">1,00</tspan></text><rect x="10" y="102" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">70 %</tspan></text><rect x="270" y="102" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">2,33</tspan></text><rect x="530" y="102" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">2,33</tspan></text><rect x="10" y="148" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">80 %</tspan></text><rect x="270" y="148" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">3,95</tspan></text><rect x="530" y="148" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">4,00</tspan></text><rect x="10" y="194" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">90 %</tspan></text><rect x="270" y="194" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">8,80</tspan></text><rect x="530" y="194" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">9,00</tspan></text><rect x="10" y="240" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">95 %</tspan></text><rect x="270" y="240" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">17,90</tspan></text><rect x="530" y="240" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">19,00</tspan></text><rect x="10" y="290" width="820" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="420" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">La espera no crece linealmente: de 80 % a 95 % de utilización se multiplica por cinco. Con 95 % la simulación</tspan></text><text x="420" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">de 280 000 clientes aún no ha convergido a la fórmula (17,9 frente a 19,0).</tspan></text><text x="420" y="371.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
