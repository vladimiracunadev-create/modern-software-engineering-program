<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 423" width="950" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Plazo medio con tres personas según el límite de trabajo en curso</title><desc id="d">Barras: con tres personas y tareas de un día de media, el rendimiento satura en 3,02 elementos por día desde un límite de 3, y el plazo medio crece linealmente: 0,99 días con límite 3, 1,99 con 6, 4,97 con 15 y 9,95 con 30, igual a límite dividido por rendimiento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="423" fill="#ffffff"/><text x="410" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Límite de 1 elemento en curso (rend. 1,00/día)</tspan></text><rect x="420" y="16" width="40" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="468" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="468" dy="0">1,00 d</tspan></text><text x="410" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Límite de 3 (rend. 3,02/día)</tspan></text><rect x="420" y="60" width="39.6" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="467.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="467.6" dy="0">0,99 d</tspan></text><text x="410" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Límite de 4 (rend. 3,02/día)</tspan></text><rect x="420" y="104" width="53.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="481.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="481.2" dy="0">1,33 d</tspan></text><text x="410" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Límite de 6 (rend. 3,02/día)</tspan></text><rect x="420" y="148" width="79.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="507.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="507.6" dy="0">1,99 d</tspan></text><text x="410" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Límite de 9 (rend. 3,02/día)</tspan></text><rect x="420" y="192" width="119.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="547.2" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="547.2" dy="0">2,98 d</tspan></text><text x="410" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Límite de 15 (rend. 3,02/día)</tspan></text><rect x="420" y="236" width="198.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="626.8" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="626.8" dy="0">4,97 d</tspan></text><text x="410" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Límite de 30 (rend. 3,02/día)</tspan></text><rect x="420" y="280" width="398" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="826" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="826" dy="0">9,95 d</tspan></text><rect x="10" y="328" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Por encima del número de personas más trabajo en curso no añade rendimiento y solo añade espera: plazo = límite ÷</tspan></text><text x="475" y="369.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">rendimiento, la ley de Little. El modelo es cerrado y sin variabilidad entre tareas más allá de la exponencial.</tspan></text><text x="475" y="409.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
