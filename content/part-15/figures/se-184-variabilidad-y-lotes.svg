<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" width="1000" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Espera en cola con 85 % de utilización según la variabilidad</title><desc id="d">Barras: con la misma utilización de 85 por ciento, la espera media es 2,88 servicios con tiempos constantes, 5,57 con tiempos exponenciales, 13,64 con alta variabilidad y 19,61 si las llegadas son en lotes de cinco.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="335" fill="#ffffff"/><text x="450" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="450" dy="0">Servicio constante (CV² = 0)</tspan></text><rect x="460" y="16" width="63.36" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="531.36" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="531.36" dy="0">2,88</tspan></text><text x="450" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="450" dy="0">Servicio con poca variación (CV² = 0,25)</tspan></text><rect x="460" y="60" width="79.86" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="547.86" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="547.86" dy="0">3,63</tspan></text><text x="450" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="450" dy="0">Servicio exponencial (CV² = 1)</tspan></text><rect x="460" y="104" width="122.54" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590.54" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="590.54" dy="0">5,57</tspan></text><text x="450" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="450" dy="0">Servicio muy variable (CV² = 4)</tspan></text><rect x="460" y="148" width="300.08" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="768.08" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="768.08" dy="0">13,64</tspan></text><text x="450" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="450" dy="0">Exponencial, llegadas en lotes de 5</tspan></text><rect x="460" y="192" width="431.42" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="899.42" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="899.42" dy="0">19,61</tspan></text><rect x="10" y="240" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Misma carga media, espera distinta: la variabilidad y los lotes importan tanto como la utilización. Las simulaciones concuerdan con</tspan></text><text x="500" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">la aproximación de Kingman (2,83; 3,54; 5,67; 14,17).</tspan></text><text x="500" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
