<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 351" width="900" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cobertura real de un intervalo que promete 80 % para 12 semanas futuras</title><desc id="d">Barras: un intervalo central nominal del 80 por ciento para la suma de 12 semanas, construido por remuestreo de la historia, cubre el valor real en 32,5 por ciento de los casos con 3 semanas de historia, 46,6 con 6, 61,1 con 12, 70,7 con 24 y 75,7 con 48.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="351" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">3 semanas de historia</tspan></text><rect x="300" y="16" width="195" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="503" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="503" dy="0">32,5 %</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">6 semanas</tspan></text><rect x="300" y="60" width="279.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="587.6" dy="0">46,6 %</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">12 semanas</tspan></text><rect x="300" y="104" width="366.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="674.6" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="674.6" dy="0">61,1 %</tspan></text><text x="290" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">24 semanas</tspan></text><rect x="300" y="148" width="424.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="732.2" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="732.2" dy="0">70,7 %</tspan></text><text x="290" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">48 semanas</tspan></text><rect x="300" y="192" width="454.2" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="762.2" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="762.2" dy="0">75,7 %</tspan></text><rect x="10" y="240" width="880" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Con poca historia el intervalo es demasiado estrecho porque no incluye la incertidumbre de haber visto pocas semanas.</tspan></text><text x="450" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Incluso con 48 semanas queda bajo el 80 % prometido. El proceso simulado es estable; uno real cambia y empeora la</tspan></text><text x="450" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">cobertura.</tspan></text><text x="450" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
