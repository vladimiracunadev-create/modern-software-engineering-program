<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" width="1000" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de terminar 30 tareas dentro de la suma de sus medianas</title><desc id="d">Barras: con 30 tareas de mediana entre 1 y 5 días, terminar dentro de la suma de medianas (96 días) ocurre en 31,9 por ciento con dispersión 0,2, 12,5 con 0,5, 4,1 con 0,8 y 1,5 con 1,1; añadir 25 por ciento a cada tarea lo eleva a 83,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="335" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Dispersión σ = 0,2</tspan></text><rect x="410" y="16" width="159.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="577.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="577.5" dy="0">31,9 %</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">σ = 0,5</tspan></text><rect x="410" y="60" width="62.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="480.5" dy="0">12,5 %</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">σ = 0,8</tspan></text><rect x="410" y="104" width="20.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="438.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="438.5" dy="0">4,1 %</tspan></text><text x="400" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">σ = 1,1</tspan></text><rect x="410" y="148" width="7.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="425.5" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="425.5" dy="0">1,5 %</tspan></text><text x="400" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">σ = 0,5 con 25 % de margen por tarea</tspan></text><rect x="410" y="192" width="417.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="835.5" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="835.5" dy="0">83,5 %</tspan></text><rect x="10" y="240" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Sumar medianas subestima porque cada tarea tiene cola larga hacia arriba: con σ = 0,5 la media es 108,9 y el P85 120,8 frente a un</tspan></text><text x="500" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">plan de 96. Los márgenes por tarea sirven aquí pero la clase 191 muestra que se pueden consumir.</tspan></text><text x="500" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
