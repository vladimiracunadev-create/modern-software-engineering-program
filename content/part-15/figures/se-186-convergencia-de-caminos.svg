ght="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">P85 (días)</tspan></text><rect x="10" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">1 (cadena)</tspan></text><rect x="200" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">5</tspan></text><rect x="340" y="56" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">37,5 %</tspan></text><rect x="570" y="56" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">10,78</tspan></text><rect x="740" y="56" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">12,80</tspan></text><rect x="10" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">3</tspan></text><rect x="200" y="102" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">15</tspan></text><rect x="340" y="102" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">0,7 %</tspan></text><rect x="570" y="102" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">13,98</tspan></text><rect x="740" y="102" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">15,99</tspan></text><rect x="10" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">6</tspan></text><rect x="200" y="148" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">30</tspan></text><rect x="340" y="148" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">0,0 %</tspan></text><rect x="570" y="148" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">15,10</tspan></text><rect x="740" y="148" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">16,94</tspan></text><rect x="10" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">10</tspan></text><rect x="200" y="194" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">50</tspan></text><rect x="340" y="194" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">0,0 %</tspan></text><rect x="570" y="194" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">15,87</tspan></text><rect x="740" y="194" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">17,67</tspan></text><rect x="10" y="244" width="900" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Cuando varios caminos convergen, el máximo de duraciones aleatorias es mayor que cada una: el plan que usa solo medianas</tspan></text><text x="460" y="285.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">es optimista en proporción a la anchura de la red. Las duraciones lognormales de σ = 0,4 son un supuesto.</tspan></text><text x="460" y="325.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
