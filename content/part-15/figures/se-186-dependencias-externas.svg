<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 339" width="950" height="339" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que ninguna dependencia externa llegue tarde</title><desc id="d">Tabla: con 10 dependencias externas, la probabilidad de que ninguna se retrase es 34,7 por ciento si cada una llega tarde con probabilidad 0,1; 10,8 con 0,2 y 2,8 con 0,3; con una sola dependencia es 90,4, 80,6 y 70,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="339" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Dependencias</tspan></text><rect x="220" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="337" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337" dy="0">Cada una tarde 10 %</tspan></text><rect x="460" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Cada una tarde 20 %</tspan></text><rect x="700" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Cada una tarde 30 %</tspan></text><rect x="10" y="56" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">1</tspan></text><rect x="220" y="56" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">90,4 %</tspan></text><rect x="460" y="56" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">80,6 %</tspan></text><rect x="700" y="56" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">70,4 %</tspan></text><rect x="10" y="102" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">3</tspan></text><rect x="220" y="102" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">72,9 %</tspan></text><rect x="460" y="102" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">51,8 %</tspan></text><rect x="700" y="102" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">34,7 %</tspan></text><rect x="10" y="148" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">5</tspan></text><rect x="220" y="148" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">59,2 %</tspan></text><rect x="460" y="148" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">33,8 %</tspan></text><rect x="700" y="148" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">17,4 %</tspan></text><rect x="10" y="194" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">10</tspan></text><rect x="220" y="194" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">34,7 %</tspan></text><rect x="460" y="194" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">10,8 %</tspan></text><rect x="700" y="194" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">2,8 %</tspan></text><rect x="10" y="244" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">La probabilidad es (1 − p) elevado al número de dependencias: veinte por ciento de riesgo individual con diez dependencias</tspan></text><text x="475" y="285.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">deja 10,8 % de plazos sin sorpresa. Se supone independencia; dependencias del mismo proveedor se retrasan juntas.</tspan></text><text x="475" y="325.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
