eight="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Valor sobre coste</tspan></text><rect x="440" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">43,4 %</tspan></text><rect x="630" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">66,4 %</tspan></text><rect x="820" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">84,2 %</tspan></text><rect x="10" y="218" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Valor incluido lo que habilita, sobre coste</tspan></text><rect x="440" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">42,3 %</tspan></text><rect x="630" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">72,3 %</tspan></text><rect x="820" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">90,3 %</tspan></text><rect x="10" y="276" width="1000" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="510" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">Respetar las dependencias y ordenar por valor sobre coste duplica el valor del primer cuarto; contar lo que habilita ayuda más cuando</tspan></text><text x="510" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">el plan avanza. Las 300 redes de 15 elementos son sintéticas y sus valores lognormales son supuestos.</tspan></text><text x="510" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
