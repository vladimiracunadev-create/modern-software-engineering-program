<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 397" width="940" height="397" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valor entregado si se agota el 25, el 50 o el 75 % del coste, según el orden</title><desc id="d">Mapa de calor con el porcentaje del valor entregado de 15 elementos con dependencias: un orden aleatorio válido entrega 21,7, 46,5 y 70,1 por ciento al agotar un cuarto, la mitad y tres cuartos del coste; priorizar por valor sobre coste entrega 43,4, 66,4 y 84,2, y sumar lo que un elemento habilita llega a 90,3 a tres cuartos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="397" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Valor entregado si se agota el 25, el 50 o el 75 % del coste, según el orden</tspan></text><text x="423.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">25 % del coste</tspan></text><text x="622" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">50 %</tspan></text><text x="820.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">75 %</tspan></text><text x="314" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Orden aleatorio válido</tspan></text><text x="314" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Mayor valor disponible</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Valor sobre coste</tspan></text><text x="314" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Valor con lo que habilita, sobre coste</tspan></text><rect x="325.5" y="73.5" width="195.667" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">21,7 %</tspan></text><rect x="524.167" y="73.5" width="195.667" height="41" rx="4" fill="#91c8cb" stroke="#ffffff" stroke-width="1"/><text x="622" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">46,5 %</tspan></text><rect x="722.833" y="73.5" width="195.667" height="41" rx="4" fill="#47a1a9" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">70,1 %</tspan></text><rect x="325.5" y="117.5" width="195.667" height="41" rx="4" fill="#a5d2d4" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">40,2 %</tspan></text><rect x="524.167" y="117.5" width="195.667" height="41" rx="4" fill="#5dacb3" stroke="#ffffff" stroke-width="1"/><text x="622" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">63,1 %</tspan></text><rect x="722.833" y="117.5" width="195.667" height="41" rx="4" fill="#208c97" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">82,6 %</tspan></text><rect x="325.5" y="161.5" width="195.667" height="41" rx="4" fill="#9bcdcf" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">43,4 %</tspan></text><rect x="524.167" y="161.5" width="195.667" height="41" rx="4" fill="#53a7ae" stroke="#ffffff" stroke-width="1"/><text x="622" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">66,4 %</tspan></text><rect x="722.833" y="161.5" width="195.667" height="41" rx="4" fill="#1b8995" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">84,2 %</tspan></text><rect x="325.5" y="205.5" width="195.667" height="41" rx="4" fill="#9ecfd1" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">42,3 %</tspan></text><rect x="524.167" y="205.5" width="195.667" height="41" rx="4" fill="#409da6" stroke="#ffffff" stroke-width="1"/><text x="622" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">72,3 %</tspan></text><rect x="722.833" y="205.5" width="195.667" height="41" rx="4" fill="#087f8c" stroke="#102a43" stroke-width="3"/><text x="820.667" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">90,3 %</tspan></text><text x="324" y="274" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="324" dy="0">21,7 %</tspan></text><rect x="377.24" y="262" width="30.5" height="14" fill="#dff1ee"/><rect x="407.24" y="262" width="30.5" height="14" fill="#c0e1e0"/><rect x="437.24" y="262" width="30.5" height="14" fill="#a2d0d2"/><rect x="467.24" y="262" width="30.5" height="14" fill="#83c0c4"/><rect x="497.24" y="262" width="30.5" height="14" fill="#64b0b6"/><rect x="527.24" y="262" width="30.5" height="14" fill="#45a0a8"/><rect x="557.24" y="262" width="30.5" height="14" fill="#278f9a"/><rect x="587.24" y="262" width="30.5" height="14" fill="#087f8c"/><text x="625.24" y="274" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="625.24" dy="0">90,3 %</tspan></text><text x="678.48" y="274" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="678.48" dy="0">más oscuro = mayor (Valor entregado (%))</tspan></text><rect x="10" y="290" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Respetar las dependencias y ordenar por valor sobre coste duplica el valor del primer cuarto; contar lo que habilita ayuda</tspan></text><text x="470" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">más cuando el plan avanza. Las 300 redes de 15 elementos son sintéticas y sus valores lognormales son supuestos.</tspan></text><text x="470" y="379.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
