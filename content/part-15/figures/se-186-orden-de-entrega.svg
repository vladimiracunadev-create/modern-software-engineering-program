<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 371" width="1020" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valor entregado si se agota el 25, el 50 o el 75 % del coste, según el orden</title><desc id="d">Tabla: con 15 elementos con dependencias, un orden aleatorio válido entrega 21,7 por ciento del valor al agotar un cuarto del coste, 46,5 a la mitad y 70,1 a tres cuartos; priorizar por valor sobre coste entrega 43,4, 66,4 y 84,2, y sumar el valor que un elemento habilita llega a 90,3 a tres cuartos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="371" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Política de orden</tspan></text><rect x="440" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">25 % del coste</tspan></text><rect x="630" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">50 %</tspan></text><rect x="820" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="912" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="912" dy="0">75 %</tspan></text>