<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 291" width="1000" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste esperado de descubrir tarde que un supuesto era falso (12 supuestos)</title><desc id="d">Barras: con 12 supuestos cada uno cierto con probabilidad 0,85, el coste medio de descubrir tarde un supuesto falso es 78,7 con orden arbitrario, 65,4 validando primero el más barato, 64,2 el más caro de fallar y 57,9 ordenando por coste de fallar sobre coste de validar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="291" fill="#ffffff"/><text x="450" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="450" dy="0">Validar en orden arbitrario</tspan></text><rect x="460" y="16" width="472.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="940.2" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="940.2" dy="0">78,7</tspan></text><text x="450" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="450" dy="0">Primero el más barato de validar</tspan></text><rect x="460" y="60" width="392.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="860.4" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="860.4" dy="0">65,4</tspan></text><text x="450" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="450" dy="0">Primero el más caro de fallar</tspan></text><rect x="460" y="104" width="385.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="853.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="853.2" dy="0">64,2</tspan></text><text x="450" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="450" dy="0">Primero el mayor coste de fallar por coste de validar</tspan></text><rect x="460" y="148" width="347.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="815.4" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="815.4" dy="0">57,9</tspan></text><rect x="10" y="196" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Todos los supuestos ciertos a la vez ocurre solo en 14,2 % de los planes: casi siempre alguno falla. Importa cuándo se descubre. El</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">coste crece 15 % por semana de trabajo construido encima, un supuesto del autor.</tspan></text><text x="500" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
