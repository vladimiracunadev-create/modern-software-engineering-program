<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez riesgos: retraso en días con riesgos independientes y con una causa común</title><desc id="d">Intervalos con la mediana, el percentil 85 y el percentil 95 del retraso de diez riesgos: con riesgos independientes valen 21, 35 y 44 días; con una causa común que arrastra a la mayoría valen 10, 66 y 81, y la media casi no cambia (21,7 y 22,2) respecto de la exposición esperada de 21,6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diez riesgos: retraso en días con riesgos independientes y con una causa común</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mediana</tspan></text><polygon points="122.78,44.1 129.38,56.4 116.18,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">p85</tspan></text><polygon points="193.4,43.5 200.9,51 193.4,58.5 185.9,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="207.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="207.4" dy="0">p95</tspan></text><line x1="234" y1="77" x2="234" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1=