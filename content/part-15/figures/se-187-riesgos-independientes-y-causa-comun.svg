"#5c1f14"><tspan x="470" dy="0">La exposición esperada es la misma y el riesgo no: la causa común reparte el retraso entre muchos proyectos buenos y unos</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">pocos desastrosos. El 25 % de probabilidad del evento común y el 70 % de arrastre son supuestos.</tspan></text><text x="470" y="372.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
