troke-dasharray="7 4"/><polygon points="111.7,110.125 118.575,117 111.7,123.875 104.825,117" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="371.8,110.125 378.675,117 371.8,123.875 364.925,117" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="631.9,110.125 638.775,117 631.9,123.875 625.025,117" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="892,110.125 898.875,117 892,123.875 885.125,117" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="106" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">4 500</tspan></text><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Añadir comprobaciones solo ayuda si ven defectos distintos. Con alta correlación la segunda ya no aporta casi nada. El</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">modelo reduce la dificultad a un número; en la realidad la correlación depende de qué mira cada comprobación.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
