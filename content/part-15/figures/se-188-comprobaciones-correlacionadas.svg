<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defectos que se escapan de 10 000 según cuántas comprobaciones forman la definición de terminado</title><desc id="d">Líneas con los defectos que se escapan de 10 000 según el número de comprobaciones y su correlación: con comprobaciones independientes bajan de 4 436 con una a 1 122 con cuatro; con correlación 0,5 llegan a 2 961, con 0,8 se quedan en 4 258 y con 1,0 en 4 500 sin importar cuántas se añadan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Defectos que se escapan de 10 000 según cuántas comprobaciones forman la definición de terminado</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Correlación 0,0 (independientes)</tspan></text><rect x="305.28" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="325.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="325.28" dy="0">Correlación 0,5</tspan></text><polygon points="472.38,44.1 478.98,56.4 465.78,56.4" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="486.38" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="486.38" dy="0">Correlación 0,8</tspan></text><polygon points="633.48,43.5 640.98,51 633.48,58.5 625.98,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="647.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="647.48" dy="0">Correlación 1,0 (ven lo mismo)</tspan></text><line x1="93.7" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="387" x2="93.7" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="327" x2="93.7" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="267" x2="93.7" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="207" x2="93.7" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3 000</tspan></text><line x1="93.7" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="147" x2="93.7" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">4 000</tspan></text><line x1="93.7" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="87" x2="93.7" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">5 000</tspan></te