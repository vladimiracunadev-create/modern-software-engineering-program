<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" width="960" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defectos que se escapan de 10 000 según cuántas comprobaciones forman la definición de terminado</title><desc id="d">Tabla: con cuatro comprobaciones de potencia 0,55, 0,45, 0,25 y 0,35, los defectos que se escapan de 10 000 bajan de 4436 con una a 1122 con cuatro si las comprobaciones son independientes, pero con correlación 0,8 se quedan en 4258 y con correlación 1 en 4500 sin importar cuántas se añadan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="355" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Correlación entre comprobaciones</tspan></text><rect x="340" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">1 comprobación</tspan></text><rect x="530" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">2</tspan></text><rect x="670" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">3</tspan></text><rect x="810" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="877" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">4</tspan></text><rect x="10" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0,0 (independientes)</tspan></text><rect x="340" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">4 436</tspan></text><rect x="530" y="56" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">2 372</tspan></text><rect x="670" y="56" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">1 772</tspan></text><rect x="810" y="56" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">1 122</tspan></text><rect x="10" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0,5</tspan></text><rect x="340" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">4 030</tspan></text><rect x="530" y="106" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">3 174</tspan></text><rect x="670" y="106" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">3 137</tspan></text><rect x="810" y="106" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">2 961</tspan></text><rect x="10" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0,8</tspan></text><rect x="340" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">4 319</tspan></text><rect x="530" y="156" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">4 258</tspan></text><rect x="670" y="156" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">4 258</tspan></text><rect x="810" y="156" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">4 258</tspan></text><rect x="10" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">1,0 (ven lo mismo)</tspan></text><rect x="340" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">4 500</tspan></text><rect x="530" y="206" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">4 500</tspan></text><rect x="670" y="206" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">4 500</tspan></text><rect x="810" y="206" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">4 500</tspan></text><rect x="10" y="260" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Añadir comprobaciones solo ayuda si ven defectos distintos. Con alta correlación la segunda ya no aporta casi nada. El modelo</tspan></text><text x="480" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">reduce la dificultad a un número; en la realidad la correlación depende de qué mira cada comprobación.</tspan></text><text x="480" y="341.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
