<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 322" width="940" height="322" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter de criterios de aceptación: criterios con los que se ajustó frente a casos nuevos</title><desc id="d">Barras apiladas con los criterios en que el linter coincide con el juicio del autor: acierta 8 de 8 con los criterios con los que se ajustó y 6 de 8 con ocho casos nuevos, en los que dio dos falsos avisos sobre criterios verificables.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="322" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Linter de criterios de aceptación: criterios con los que se ajustó frente a casos nuevos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Coincide con el juicio del autor</tspan></text><rect x="305.28" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="325.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="325.28" dy="0">Falso aviso</tspan></text><line x1="244" y1="77" x2="244" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="244" y1="157" x2="244" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="244" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">0</tspan></text><line x1="401.925" y1="77" x2="401.925" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="401.925" y1="157" x2="401.925" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="401.925" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="401.925" dy="0">2</tspan></text><line x1="559.85" y1="77" x2="559.85" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="559.85" y1="157" x2="559.85" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="559.85" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="559.85" dy="0">4</tspan></text><line x1="717.775" y1="77" x2="717.775" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="717.775" y1="157" x2="717.775" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="717.775" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717.775" dy="0">6</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">8</tspan></text><line x1="244" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Criterios del ajuste (8)</tspan></text><text x="234" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Ocho casos nuevos (8)</tspan></text><rect x="244" y="84" width="631.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="559.85" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="559.85" dy="0">8</tspan></text><rect x="875.7" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">8</tspan></text><rect x="244" y="124" width="473.775" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="480.888" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480.888" dy="0">6</tspan></text><rect x="717.775" y="124" width="157.925" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="796.738" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="796.738" dy="0">2</tspan></text><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">8</tspan></text><text x="559.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="559.85" dy="0">Criterios</tspan></text><rect x="10" y="215" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ajuste 8 de 8; casos nuevos 6 de 8, con 4 aciertos y 2 falsos avisos. Con ocho casos la exactitud real es desconocida. El</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">linter ve palabras, no si un criterio se puede comprobar.</tspan></text><text x="470" y="304.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
