<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 523" width="960" height="523" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter de criterios de aceptación: ocho casos nuevos frente al juicio del autor</title><desc id="d">Tabla: un linter de palabras vagas y de falta de condición o número acertó 8 de 8 criterios con los que se ajustó y 6 de 8 con ocho casos nuevos: dio dos falsos avisos en criterios verificables, uno sin cifra y otro con una conjunción legítima.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="523" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Criterio</tspan></text><rect x="480" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Juicio del autor</tspan></text><rect x="680" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Resultado del linter</tspan></text><rect x="10" y="56" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Cuando llega a las 24 h exactas, se cuenta un día</tspan></text><rect x="480" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">Verificable</tspan></text><rect x="680" y="56" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Sin aviso</tspan></text><rect x="10" y="102" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">La interfaz debe ser amigable</tspan></text><rect x="480" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">Vago</tspan></text><rect x="680" y="102" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Palabra vaga y sin número</tspan></text><rect x="10" y="148" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Guarda el borrador cada 30 segundos</tspan></text><rect x="480" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">Verificable</tspan></text><rect x="680" y="148" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Sin aviso</tspan></text><rect x="10" y="194" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Debe ser robusto ante fallos de red</tspan></text><rect x="480" y="194" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">Vago</tspan></text><rect x="680" y="194" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Palabra vaga y sin número</tspan></text><rect x="10" y="240" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Se rechaza el formato .exe</tspan></text><rect x="480" y="240" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">Verificable</tspan></text><rect x="680" y="240" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Falso aviso: sin número</tspan></text><rect x="10" y="286" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Los reportes son adecuados</tspan></text><rect x="480" y="286" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">Vago</tspan></text><rect x="680" y="286" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Sin condición ni número</tspan></text><rect x="10" y="332" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Si no responde, reintenta tres veces y luego informa</tspan></text><rect x="480" y="332" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">Verificable</tspan></text><rect x="680" y="332" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Falso aviso: dos criterios</tspan></text><rect x="10" y="378" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="401.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Registra marca de tiempo y evaluador y luego envía correo</tspan></text><rect x="480" y="378" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">Dos criterios</tspan></text><rect x="680" y="378" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Sin número; dos en uno</tspan></text><rect x="10" y="428" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Ajuste 8 de 8; casos nuevos 6 de 8, con 4 aciertos y 2 falsos avisos. Con ocho casos la exactitud real es desconocida. El</tspan></text><text x="480" y="469.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">linter ve palabras, no si un criterio se puede comprobar.</tspan></text><text x="480" y="509.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
