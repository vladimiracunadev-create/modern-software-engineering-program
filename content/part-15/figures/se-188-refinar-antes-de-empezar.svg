<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 351" width="980" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Plazo medio hasta terminar según los días de refinamiento previo</title><desc id="d">Barras: con 60 por ciento de ambigüedad inicial que baja con cada día de refinamiento, el plazo medio hasta terminar es 5,37 días sin refinar, 5,54 con un día, 5,97 con dos, 7,40 con cuatro y 11,07 con ocho.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="351" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Sin refinar (60,0 % con ambigüedad)</tspan></text><rect x="370" y="16" width="214.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="592.8" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="592.8" dy="0">5,37 d</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">1 día de refinamiento (38,3 %)</tspan></text><rect x="370" y="60" width="221.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="599.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="599.6" dy="0">5,54 d</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">2 días (24,4 %)</tspan></text><rect x="370" y="104" width="238.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="616.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="616.8" dy="0">5,97 d</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">4 días (9,9 %)</tspan></text><rect x="370" y="148" width="296" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="674" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="674" dy="0">7,40 d</tspan></text><text x="360" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">8 días (1,6 %)</tspan></text><rect x="370" y="192" width="442.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="820.8" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820.8" dy="0">11,07 d</tspan></text><rect x="10" y="240" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Exigir más preparación reduce la ambigüedad pero retrasa el inicio: con estos parámetros no refinar tiene el menor plazo medio,</tspan></text><text x="490" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">aunque con el peor riesgo de rehacer. El plazo medio no incluye el coste de oportunidad de lo que se aprende al empezar; la</tspan></text><text x="490" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">elección depende de cuánto cuesta rehacer.</tspan></text><text x="490" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
