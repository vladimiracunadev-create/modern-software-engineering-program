<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 291" width="900" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de ciclo de 100 000 elementos con cola larga: qué número resumir</title><desc id="d">Barras: con tiempo de ciclo lognormal de mediana 4 días, la media es 5,52, el percentil 85 es 9,18 y el 95 es 14,95; 34,5 por ciento de los elementos supera la media, y un solo elemento de 60 días mueve la media de una muestra de 20 de 6,05 a 8,75 sin cambiar casi la mediana.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="291" fill="#ffffff"/><text x="190" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">Mediana</tspan></text><rect x="200" y="16" width="160.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="368.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="368.4" dy="0">4,01 d</tspan></text><text x="190" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">Media</tspan></text><rect x="200" y="60" width="220.8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="428.8" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="428.8" dy="0">5,52 d</tspan></text><text x="190" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">Percentil 85</tspan></text><rect x="200" y="104" width="367.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="575.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="575.2" dy="0">9,18 d</tspan></text><text x="190" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">Percentil 95</tspan></text><rect x="200" y="148" width="598" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="806" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="806" dy="0">14,95 d</tspan></text><rect x="10" y="196" width="880" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Prometer la media falla en 34,5 % de los elementos. En una muestra de 20, un elemento de 60 días sube la media de 6,05</tspan></text><text x="450" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">a 8,75 y deja la mediana en 4,32 → 4,48. Los datos son lognormales sintéticos: uno real puede ser distinto.</tspan></text><text x="450" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
