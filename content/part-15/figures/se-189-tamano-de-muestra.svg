<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 982" width="940" height="982" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Percentil estimado dividido por el verdadero: intervalo que contiene el 90 % de 1000 muestras</title><desc id="d">Intervalos del percentil 85 y del percentil 95 estimados divididos por el verdadero según el tamaño de la muestra: con 10 elementos el 85 va de 0,54 a 1,81 y el 95 de 0,46 a 2,09; con 20, de 0,69 a 1,74 y de 0,64 a 2,62; con 100, de 0,83 a 1,25 y de 0,79 a 1,40; con 400, de 0,91 a 1,11 y de 0,89 a 1,18.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="982" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Percentil estimado dividido por el verdadero: intervalo que contiene el 90 % de 1000 muestras</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p5</tspan></text><polygon points="85.08,44.1 91.68,56.4 78.48,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="99.08" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="99.08" dy="0">p95</tspan></text><line x1="234" y1="77" x2="234" y2="817" stroke="#d5dde1" stroke-width="1"/><line x1="234" y1="817" x2="234" y2="822" stroke="#5b7280" stroke-width="1.4"/><text x="234" y="838" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">0</tspan></text><line x1="452.667" y1="77" x2="452.667" y2="817" stroke="#d5dde1" stroke-width="1"/><line x1="452.667" y1="817" x2="452.667" y2="822" stroke="#5b7280" stroke-width="1.4"/><text x="452.667" y="838" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452.667" dy="0">1</tspan></text><line x1="671.333" y1="77" x2="671.333" y2="817" stroke="#d5dde1" stroke-width="1"/><line x1="671.333" y1="817" x2="671.333" y2="822" stroke="#5b7280" stroke-width="1.4"/><text x="671.333" y="838" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="671.333" dy="0">2</tspan></text><line x1="890" y1="77" x2="890" y2="817" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="817" x2="890" y2="822" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="838" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">3</tspan></text><line x1="234" y1="817" x2="890" y2="817" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">10 elementos · P85</tspan></text><text x="204" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">10 elementos · P95</tspan></text><text x="204" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">20 elementos · P85</tspan></text><text x="204" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">20 elementos · P95</tspan></text><text x="204" y="414.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">50 elementos · P85</tspan></text><text x="204" y="488.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">50 elementos · P95</tspan></text><text x="204" y="562.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">100 elementos · P85</tspan></text><text x="204" y="636.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">100 elementos · P95</tspan></text><text x="204" y="710.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">400 elementos · P85</tspan></text><text x="204" y="784.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">400 elementos · P95</tspan></text><line x1="352.08" y1="114" x2="629.787" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="345.08" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="352.08" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="352.08" dy="0">0,54</tspan></text><polygon points="629.787,105.95 637.487,120.3 622.087,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="629.787" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="629.787" dy="0">1,81</tspan></text><line x1="334.587" y1="188" x2="691.013" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="327.587" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="334.587" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="334.587" dy="0">0,46</tspan></text><polygon points="691.013,179.95 698.713,194.3 683.313,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="691.013" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="691.013" dy="0">2,09</tspan></text><line x1="384.88" y1="262" x2="614.48" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="377.88" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="384.88" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="384.88" dy="0">0,69</tspan></text><polygon points="614.48,253.95 622.18,268.3 606.78,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="614.48" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="614.48" dy="0">1,74</tspan></text><line x1="373.947" y1="336" x2="806.907" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="366.947" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="373.947" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="373.947" dy="0">0,64</tspan></text><polygon points="806.907,327.95 814.607,342.3 799.207,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="806.907" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="806.907" dy="0">2,62</tspan></text><line x1="400.187" y1="410" x2="527.013" y2="410" stroke="#8a9aa3" stroke-width="5"/><rect x="393.187" y="403" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="400.187" y="394" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="400.187" dy="0">0,76</tspan></text><polygon points="527.013,401.95 534.713,416.3 519.313,416.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="527.013" y="439" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="527.013" dy="0">1,34</tspan></text><line x1="384.88" y1="484" x2="553.253" y2="484" stroke="#8a9aa3" stroke-width="5"/><rect x="377.88" y="477" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="384.88" y="468" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="384.88" dy="0">0,69</tspan></text><polygon points="553.253,475.95 560.953,490.3 545.553,490.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="553.253" y="513" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.253" dy="0">1,46</tspan></text><line x1="415.493" y1="558" x2="507.333" y2="558" stroke="#8a9aa3" stroke-width="5"/><rect x="408.493" y="551" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="415.493" y="542" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415.493" dy="0">0,83</tspan></text><polygon points="507.333,549.95 515.033,564.3 499.633,564.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="507.333" y="587" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="507.333" dy="0">1,25</tspan></text><line x1="406.747" y1="632" x2="540.133" y2="632" stroke="#8a9aa3" stroke-width="5"/><rect x="399.747" y="625" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="406.747" y="616" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="406.747" dy="0">0,79</tspan></text><polygon points="540.133,623.95 547.833,638.3 532.433,638.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="540.133" y="661" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="540.133" dy="0">1,40</tspan></text><line x1="432.987" y1="706" x2="476.72" y2="706" stroke="#8a9aa3" stroke-width="5"/><rect x="425.987" y="699" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="432.987" y="690" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.987" dy="0">0,91</tspan></text><polygon points="476.72,697.95 484.42,712.3 469.02,712.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="476.72" y="735" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="476.72" dy="0">1,11</tspan></text><line x1="428.613" y1="780" x2="492.027" y2="780" stroke="#8a9aa3" stroke-width="5"/><rect x="421.613" y="773" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="428.613" y="764" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="428.613" dy="0">0,89</tspan></text><polygon points="492.027,771.95 499.727,786.3 484.327,786.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="492.027" y="809" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="492.027" dy="0">1,18</tspan></text><line x1="452.667" y1="77" x2="452.667" y2="817" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="457.667" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="457.667" dy="0">verdadero = 1</tspan></text><text x="562" y="861" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="562" dy="0">Percentil estimado / percentil verdadero</tspan></text><rect x="10" y="875" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="899.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con pocos elementos los percentiles altos son imprecisos: el percentil 95 de 20 elementos puede estar 2,6 veces por encima</tspan></text><text x="470" y="916.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del real. Informar el tamaño de la muestra junto al percentil es parte de la métrica.</tspan></text><text x="470" y="964.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
