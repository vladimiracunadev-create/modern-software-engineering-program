<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" width="960" height="455" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas veces una prueba declara una mejora, con efecto real de 15 % y sin efecto</title><desc id="d">Tabla: con una mejora real del 15 por ciento en el tiempo de ciclo y 8 elementos por semana, una prueba de rangos la detecta en 20,5 por ciento de los casos con 2 semanas de datos, 51,0 con 8 y 70,9 con 24; sin efecto real da falsa mejora en 2 a 3 por ciento, pero 19,7 si se mira cada semana durante 12.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="455" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Semanas tras el cambio</tspan></text><rect x="320" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Declara mejora (efecto real 15 %)</tspan></text><rect x="650" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Declara mejora (sin efecto)</tspan></text><rect x="10" y="56" width="304" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill=