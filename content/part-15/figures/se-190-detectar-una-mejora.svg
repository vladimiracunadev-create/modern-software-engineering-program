" stroke-width="1.6"/><text x="797" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">19,7 %</tspan></text><rect x="10" y="360" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Dos semanas de datos casi nunca bastan para ver una mejora real del 15 %. Mirar cada semana multiplica por siete la falsa</tspan></text><text x="480" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">mejora. La dispersión de 0,5 y los 8 elementos por semana son supuestos.</tspan></text><text x="480" y="441.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
