<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas veces una prueba declara una mejora, con efecto real de 15 % y sin efecto</title><desc id="d">Líneas con el porcentaje de casos en que una prueba de rangos declara una mejora según las semanas de datos tras el cambio: con efecto real de 15 por ciento sube de 20,5 con 2 semanas a 51,0 con 8 y 70,9 con 24; sin efecto real queda entre 1,9 y 2,9, pero llega a 19,7 si se mira cada semana durante 12.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántas veces una prueba declara una mejora, con efecto real de 15 % y sin efecto</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Con efecto real de 15 %</tspan></text><rect x="237.42" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Sin efecto, una sola mirada</tspan></text><polygon points="495,44.1 501.6,56.4 488.4,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="509" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="509" dy="0">Sin efecto, mirando cada semana</tspan></text><line x1="71.08" y1="387" x2="