<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 353" width="940" height="353" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Calibración de pronósticos de «cuándo termina» con alcance que crece de 0 a 20 %</title><desc id="d">Mapa de calor con el porcentaje de casos en que se cumple cada pronóstico según la historia disponible: el P85 que ignora el crecimiento del alcance se cumple en 65,2, 64,7 y 69,2 por ciento con 4, 8 y 16 semanas, y el que lo incluye en 77,7, 80,1 y 85,2; una estimación puntual con el rendimiento medio se cumple en 45,8, 40,2 y 42,2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="353" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Calibración de pronósticos de «cuándo termina» con alcance que crece de 0 a 20 %</tspan></text><text x="266.6" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="266.6" dy="0">P50</tspan></text><text x="411.8" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.8" dy="0">P85</tspan></text><text x="557" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="557" dy="0">P95</tspan></text><text x="702.2" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.2" dy="0">Estimación puntual</tspan></text><text x="847.4" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="847.4" dy="0">P85 con alcance</tspan></text><text x="184" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">4 semanas de historia</tspan></text><text x="184" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">8 semanas</tspan></text><text x="184" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">16 semanas</tspan></text><rect x="195.5" y="73.5" width="142.2" height="41" rx="4" fill="#c2e2e1" stroke="#ffffff" stroke-width="1"/><text x="266.6" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="266.6" dy="0">46,3 %</tspan></text><rect x="340.7" y="73.5" width="142.2" height="41" rx="4" fill="#68b2b8" stroke="#ffffff" stroke-width="1"/><text x="411.8" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.8" dy="0">65,2 %</tspan></text><rect x="485.9" y="73.5" width="142.2" height="41" rx="4" fill="#3c9aa4" stroke="#ffffff" stroke-width="1"/><text x="557" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="557" dy="0">74,4 %</tspan></text><rect x="631.1" y="73.5" width="142.2" height="41" rx="4" fill="#c4e3e2" stroke="#ffffff" stroke-width="1"/><text x="702.2" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.2" dy="0">45,8 %</tspan></text><rect x="776.3" y="73.5" width="142.2" height="41" rx="4" fill="#2c929c" stroke="#ffffff" stroke-width="1"/><text x="847.4" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="847.4" dy="0">77,7 %</tspan></text><rect x="195.5" y="117.5" width="142.2" height="41" rx="4" fill="#dcefed" stroke="#ffffff" stroke-width="1"/><text x="266.6" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="266.6" dy="0">40,8 %</tspan></text><rect x="340.7" y="117.5" width="142.2" height="41" rx="4" fill="#6ab3b9" stroke="#102a43" stroke-width="3"/><text x="411.8" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.8" dy="0">64,7 %</tspan></text><rect x="485.9" y="117.5" width="142.2" height="41" rx="4" fill="#32959f" stroke="#ffffff" stroke-width="1"/><text x="557" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="557" dy="0">76,5 %</tspan></text><rect x="631.1" y="117.5" width="142.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="702.2" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.2" dy="0">40,2 %</tspan></text><rect x="776.3" y="117.5" width="142.2" height="41" rx="4" fill="#208c97" stroke="#102a43" stroke-width="3"/><text x="847.4" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847.4" dy="0">80,1 %</tspan></text><rect x="195.5" y="161.5" width="142.2" height="41" rx="4" fill="#d3ebe9" stroke="#ffffff" stroke-width="1"/><text x="266.6" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="266.6" dy="0">42,7 %</tspan></text><rect x="340.7" y="161.5" width="142.2" height="41" rx="4" fill="#54a8af" stroke="#ffffff" stroke-width="1"/><text x="411.8" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.8" dy="0">69,2 %</tspan></text><rect x="485.9" y="161.5" width="142.2" height="41" rx="4" fill="#178793" stroke="#ffffff" stroke-width="1"/><text x="557" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">82,1 %</tspan></text><rect x="631.1" y="161.5" width="142.2" height="41" rx="4" fill="#d5ecea" stroke="#ffffff" stroke-width="1"/><text x="702.2" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.2" dy="0">42,2 %</tspan></text><rect x="776.3" y="161.5" width="142.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="847.4" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847.4" dy="0">85,2 %</tspan></text><text x="194" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="194" dy="0">40,2 %</tspan></text><rect x="247.24" y="218" width="30.5" height="14" fill="#dff1ee"/><rect x="277.24" y="218" width="30.5" height="14" fill="#c0e1e0"/><rect x="307.24" y="218" width="30.5" height="14" fill="#a2d0d2"/><rect x="337.24" y="218" width="30.5" height="14" fill="#83c0c4"/><rect x="367.24" y="218" width="30.5" height="14" fill="#64b0b6"/><rect x="397.24" y="218" width="30.5" height="14" fill="#45a0a8"/><rect x="427.24" y="218" width="30.5" height="14" fill="#278f9a"/><rect x="457.24" y="218" width="30.5" height="14" fill="#087f8c"/><text x="495.24" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="495.24" dy="0">85,2 %</tspan></text><text x="548.48" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="548.48" dy="0">más oscuro = mayor (Casos en que se cumple el pronóstico (%))</tspan></text><rect x="10" y="246" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El percentil 85 que ignora el crecimiento del alcance se cumple en 65 % a 69 %, no en 85 %. Un pronóstico está calibrado</tspan></text><text x="470" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">solo si incluye las fuentes de incertidumbre que existirán. La estimación puntual se cumple menos que la mediana.</tspan></text><text x="470" y="335.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
