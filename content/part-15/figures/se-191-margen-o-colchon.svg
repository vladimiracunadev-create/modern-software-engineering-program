<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 317" width="970" height="317" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez tareas en cadena: margen por tarea frente a colchón compartido</title><desc id="d">Tabla: para una cadena de diez tareas de mediana 5 días, la suma de medianas da un plan de 50 días que se cumple en 25,2 por ciento; el margen P85 en cada tarea da 84 días y se cumple en 99,2 por ciento, pero solo en 22,6 si el trabajo se expande hasta agotar el margen; un colchón compartido da 60,7 días y 68,8 por ciento en ambos casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="317" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Plan</tspan></text><rect x="390" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Plazo (días)</tspan></text><rect x="540" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Se cumple (sin</tspan></text><text x="642" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">expansión)</tspan></text><rect x="750" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Se cumple (con</tspan></text><text x="852" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">expansión)</tspan></text><rect x="10" y="56" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Suma de medianas</tspan></text><rect x="390" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">50,0</tspan></text><rect x="540" y="56" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">25,2 %</tspan></text><rect x="750" y="56" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">25,2 %</tspan></text><rect x="10" y="110" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Margen P85 en cada tarea</tspan></text><rect x="390" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">84,0</tspan></text><rect x="540" y="110" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">99,2 %</tspan></text><rect x="750" y="110" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">22,6 %</tspan></text><rect x="10" y="164" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Medianas más un colchón de proyecto</tspan></text><rect x="390" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">60,7</tspan></text><rect x="540" y="164" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">68,8 %</tspan></text><rect x="750" y="164" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">68,8 %</tspan></text><rect x="10" y="222" width="950" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">El margen en cada tarea parece seguro hasta que las tareas lo consumen; un colchón al final del proyecto no puede gastarse</tspan></text><text x="485" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">hasta que hace falta. La regla de expansión (entregar al agotar el margen si se iba antes) es un supuesto del autor.</tspan></text><text x="485" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
