<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 574" width="940" height="574" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Disparador de replanificación por pronóstico P85: falsas alarmas frente a retraso de detección</title><desc id="d">Puntos de seis reglas con la falsa alarma en proyectos sin deriva y el retraso mediano en detectar una caída real: con 4 semanas de historia y 1, 2 y 3 avisos seguidos la falsa alarma es 68,0, 46,5 y 34,8 por ciento con 3, 4 y 5 semanas de retraso; con 8 semanas es 47,2, 34,2 y 26,2 por ciento con 4, 5 y 6 semanas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="574" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Disparador de replanificación por pronóstico P85: falsas alarmas frente a retraso de detección</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">4 semanas de historia</tspan></text><rect x="222.34" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">8 semanas de historia</tspan></text><line x1="71.08" y1="407" x2="910" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="407" x2="71.08" y2="407" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="327" x2="71.08" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="247" x2="910" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="247" x2="71.08" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="167" x2="910" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="167" x2="71.08" y2="167" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="171.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="87" x2="71.08" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="87" x2="71.08" y2="407" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="87" x2="89.08" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="407" x2="89.08" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">3</tspan></text><line x1="356.72" y1="87" x2="356.72" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="356.72" y1="407" x2="356.72" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="356.72" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="356.72" dy="0">4</tspan></text><line x1="624.36" y1="87" x2="624.36" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="624.36" y1="407" x2="624.36" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="624.36" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="624.36" dy="0">5</tspan></text><line x1="892" y1="87" x2="892" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="407" x2="892" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">6</tspan></text><line x1="71.08" y1="407" x2="910" y2="407" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 247)">Falsa alarma en proyectos sin deriva (%)</text><text x="490.54" y="453" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Retraso mediano en detectar una caída real (semanas)</tspan></text><circle cx="89.08" cy="135" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="99.08" y="139.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="99.08" dy="0">1 aviso</tspan></text><circle cx="356.72" cy="221" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="366.72" y="225.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="366.72" dy="0">2 avisos</tspan></text><circle cx="624.36" cy="267.8" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="634.36" y="272.3" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="634.36" dy="0">3 avisos</tspan></text><rect x="351.22" y="212.7" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="346.72" y="222.7" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="346.72" dy="0">1 aviso</tspan></text><rect x="618.86" y="264.7" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="614.36" y="274.7" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="614.36" dy="0">2 avisos</tspan></text><rect x="886.5" y="296.7" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="882" y="306.7" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">3 avisos</tspan></text><rect x="10" y="467" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Endurecer la regla reduce las falsas alarmas y retrasa la detección: no existe una regla sin costo. Con un plazo de 22</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">semanas y 100 elementos, el 83 % de los proyectos con caída no terminaría a tiempo. Todos los parámetros son supuestos.</tspan></text><text x="470" y="556.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
