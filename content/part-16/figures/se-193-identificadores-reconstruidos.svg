<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 411" width="1120" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reconstruir a mano los identificadores de objetos</title><desc id="d">Tabla de cuatro objetos de Git reconstruidos con hashlib: el blob, el árbol con el orden correcto y el commit coinciden con Git y el árbol con orden ingenuo no coincide.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1120" height="411" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Objeto</tspan></text><rect x="260" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Cómo se construyó</tspan></text><rect x="590" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Resultado frente a Git</tspan></text><rect x="860" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="982" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="982" dy="0">Lectura</tspan></text><rect x="10" y="56" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Blob de «hola entrega»</tspan></text><rect x="260" y="56" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="80.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">SHA-1 de «blob 13», un byte nulo y el</tspan></text><text x="422" y="96.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">contenido</tspan></text><rect x="590" y="56" width="264" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Idéntico al de git hash-object</tspan></text><rect x="860" y="56" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="982" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="982" dy="0">Coincide</tspan></text><rect x="10" y="120" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Árbol con un directorio</tspan></text><rect x="260" y="120" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="144.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">Entradas ordenadas tratando el directorio</tspan></text><text x="422" y="160.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">como «src/»</tspan></text><rect x="590" y="120" width="264" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Idéntico al de git write-tree</tspan></text><rect x="860" y="120" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="982" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="982" dy="0">Coincide</tspan></text><rect x="10" y="184" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">El mismo árbol con orden ingenuo</tspan></text><rect x="260" y="184" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="208.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">Entradas ordenadas solo por nombre, sin la</tspan></text><text x="422" y="224.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">barra</tspan></text><rect x="590" y="184" width="264" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Otro identificador</tspan></text><rect x="860" y="184" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="982" y="208.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="982" dy="0">No coincide: «src.b» queda antes</tspan></text><text x="982" y="224.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="982" dy="0">que «src»</tspan></text><rect x="10" y="248" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="280.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Commit inicial</tspan></text><rect x="260" y="248" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="272.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">Árbol, autoría, fecha y mensaje escritos a</tspan></text><text x="422" y="288.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">mano</tspan></text><rect x="590" y="248" width="264" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Idéntico al de git commit-tree</tspan></text><rect x="860" y="248" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="982" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="982" dy="0">Coincide</tspan></text><rect x="10" y="316" width="1100" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="560" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="560" dy="0">El identificador es una función del contenido y de su formato, no un número asignado. El detalle del orden de los árboles basta para obtener otro</tspan></text><text x="560" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="560" dy="0">objeto.</tspan></text><text x="560" y="397.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="560" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
