<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 453" width="940" height="453" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reconstruir a mano los identificadores de objetos: de la entrada al identificador</title><desc id="d">Diagrama de flujo de cuatro objetos de Git reconstruidos con hashlib: del contenido y el formato al identificador; el blob, el árbol con el orden correcto y el commit coinciden con Git y el árbol con orden ingenuo da otro identificador.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="453" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reconstruir a mano los identificadores de objetos: de la entrada al identificador</tspan></text><text x="124" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="124" dy="0">Objeto</tspan></text><text x="433" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="433" dy="0">Cómo se construyó</tspan></text><text x="767" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="767" dy="0">Resultado frente a Git</tspan></text><rect x="14" y="71" width="220" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="102.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">Blob de «hola entrega»</tspan></text><polyline points="238,98.64 264,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="71" width="330" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="433" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433" dy="0">SHA-1 de «blob 13», un byte nulo y el</tspan></text><text x="433" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433" dy="0">contenido</tspan></text><polyline points="602,98.64 628,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="632" y="71" width="270" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="767" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="767" dy="0">Idéntico al de git hash-object:</tspan></text><text x="767" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="767" dy="0">coincide</tspan></text><rect x="14" y="138.28" width="220" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="169.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">Árbol con un directorio</tspan></text><polyline points="238,165.92 264,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="138.28" width="330" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="433" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433" dy="0">Entradas ordenadas tratando el directorio</tspan></text><text x="433" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433" dy="0">como «src/»</tspan></text><polyline points="602,165.92 628,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="632" y="138.28" width="270" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="767" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="767" dy="0">Idéntico al de git write-tree:</tspan></text><text x="767" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="767" dy="0">coincide</tspan></text><rect x="14" y="205.56" width="220" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="228.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">El mismo árbol con orden</tspan></text><text x="124" y="245.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">ingenuo</tspan></text><polyline points="238,233.2 264,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="205.56" width="330" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="433" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433" dy="0">Entradas ordenadas solo por nombre, sin la</tspan></text><text x="433" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433" dy="0">barra</tspan></text><polyline points="602,233.2 628,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="632" y="205.56" width="270" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="767" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="767" dy="0">Otro identificador: «src.b» queda</tspan></text><text x="767" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="767" dy="0">antes que «src»</tspan></text><rect x="14" y="272.84" width="220" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="304.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">Commit inicial</tspan></text><polyline points="238,300.48 264,300.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="272.84" width="330" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="433" y="295.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433" dy="0">Árbol, autoría, fecha y mensaje escritos a</tspan></text><text x="433" y="312.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433" dy="0">mano</tspan></text><polyline points="602,300.48 628,300.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="632" y="272.84" width="270" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="767" y="295.8" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="767" dy="0">Idéntico al de git commit-tree:</tspan></text><text x="767" y="312.44" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="767" dy="0">coincide</tspan></text><rect x="10" y="346.12" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="371.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El identificador es una función del contenido y de su formato, no un número asignado. El detalle del orden de los árboles</tspan></text><text x="470" y="387.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">basta para obtener otro objeto.</tspan></text><text x="470" y="435.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
