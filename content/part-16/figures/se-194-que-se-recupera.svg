<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 462" width="990" height="462" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">¿Sigue el contenido en la base de objetos después del error?</title><desc id="d">Tabla de seis errores con la respuesta de si el contenido sigue en la base de objetos de Git y por qué.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="462" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Qué ocurrió</tspan></text><rect x="380" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">¿Sigue?</tspan></text><rect x="480" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Motivo</tspan></text><rect x="10" y="56" width="364" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Commit y luego reset --hard</tspan></text><rect x="380" y="56" width="94" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">Sí</tspan></text><rect x="480" y="56" width="494" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">El objeto sigue y el reflog apunta a él</tspan></text><rect x="10" y="108" width="364" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Agregado al índice y luego reset --hard</tspan></text><rect x="380" y="108" width="94" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">Sí</tspan></text><rect x="480" y="108" width="494" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">Queda un blob suelto; git fsck --lost-found lo encuentra</tspan></text><rect x="10" y="160" width="364" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Editado sin agregar y luego reset --hard</tspan></text><rect x="380" y="160" width="94" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">No</tspan></text><rect x="480" y="160" width="494" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">Nunca entró en la base de objetos</tspan></text><rect x="10" y="212" width="364" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Archivo no rastreado y luego clean -fd</tspan></text><rect x="380" y="212" width="94" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">No</tspan></text><rect x="480" y="212" width="494" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">Nunca entró en la base de objetos</tspan></text><rect x="10" y="264" width="364" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Stash y luego stash drop</tspan></text><rect x="380" y="264" width="94" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">Sí</tspan></text><rect x="480" y="264" width="494" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">El commit del stash queda colgando hasta la poda</tspan></text><rect x="10" y="316" width="364" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="342.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Commit, reset, expirar el reflog y gc --prune=now</tspan></text><rect x="380" y="316" width="94" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">No</tspan></text><rect x="480" y="316" width="494" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">El objeto ya no es alcanzable y se poda</tspan></text><rect x="10" y="372" width="970" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="402.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Git solo puede recuperar lo que alguna vez guardó. Un cambio que no se agregó ni se confirmó no tiene copia.</tspan></text><text x="495" y="448" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
