<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 499" width="940" height="499" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">¿Sigue el contenido en la base de objetos después del error? Depende de hasta dónde llegó</title><desc id="d">Diagrama del recorrido de un cambio en cuatro etapas: nunca guardado, objeto suelto o colgante, alcanzable desde el reflog y podado; un cambio editado sin agregar o un archivo no rastreado no se recupera, un agregado o un stash descartado sí, un commit con reset sí, y un commit con el reflog expirado y gc --prune=now no.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="499" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">¿Sigue el contenido en la base de objetos después del error? Depende de hasta dónde llegó</tspan></text><rect x="14" y="51" width="205" height="330" rx="16" fill="#fbe4de" fill-opacity="0.45" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="8 5"/><text x="28" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="28" dy="0">1 · Nunca guardado</tspan></text><rect x="24" y="89" width="185" height="126" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="116.5" y="130.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116.5" dy="0">Editado sin agregar y</tspan></text><text x="116.5" y="147.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116.5" dy="0">luego reset --hard:</tspan></text><text x="116.5" y="163.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116.5" dy="0">no. Nunca entró en la</tspan></text><text x="116.5" y="180.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116.5" dy="0">base de objetos</tspan></text><rect x="24" y="229" width="185" height="126" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="116.5" y="270.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116.5" dy="0">Archivo no rastreado y</tspan></text><text x="116.5" y="287.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116.5" dy="0">luego clean -fd: no.</tspan></text><text x="116.5" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116.5" dy="0">Nunca entró en la base</tspan></text><text x="116.5" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116.5" dy="0">de objetos</tspan></text><polyline points="222,216 246,216" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="249" y="51" width="205" height="330" rx="16" fill="#f7ebc8" fill-opacity="0.45" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="8 5"/><text x="263" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="263" dy="0">2 · Objeto suelto o colgante</tspan></text><rect x="259" y="89" width="185" height="126" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="351.5" y="122.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351.5" dy="0">Agregado y luego reset</tspan></text><text x="351.5" y="139" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351.5" dy="0">--hard: sí. Un blob</tspan></text><text x="351.5" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351.5" dy="0">suelto; git fsck</tspan></text><text x="351.5" y="172.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351.5" dy="0">--lost-found lo</tspan></text><text x="351.5" y="188.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351.5" dy="0">encuentra</tspan></text><rect x="259" y="229" width="185" height="126" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="351.5" y="270.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351.5" dy="0">Stash y luego stash</tspan></text><text x="351.5" y="287.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351.5" dy="0">drop: sí. El commit</tspan></text><text x="351.5" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351.5" dy="0">del stash queda</tspan></text><text x="351.5" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351.5" dy="0">colgando hasta la poda</tspan></text><polyline points="457,216 481,216" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="484" y="51" width="205" height="330" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="498" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="498" dy="0">3 · Alcanzable desde el reflog</tspan></text><rect x="494" y="89" width="185" height="126" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="586.5" y="130.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="586.5" dy="0">Commit y luego reset</tspan></text><text x="586.5" y="147.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="586.5" dy="0">--hard: sí. El objeto</tspan></text><text x="586.5" y="163.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="586.5" dy="0">sigue y el reflog</tspan></text><text x="586.5" y="180.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="586.5" dy="0">apunta a él</tspan></text><polyline points="692,216 716,216" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="719" y="51" width="205" height="330" rx="16" fill="#fbe4de" fill-opacity="0.45" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="8 5"/><text x="733" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="733" dy="0">4 · Inalcanzable y podado</tspan></text><rect x="729" y="89" width="185" height="126" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="821.5" y="122.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="821.5" dy="0">Commit, reset, expirar</tspan></text><text x="821.5" y="139" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="821.5" dy="0">el reflog y gc</tspan></text><text x="821.5" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="821.5" dy="0">--prune=now: no. Ya no</tspan></text><text x="821.5" y="172.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="821.5" dy="0">es alcanzable y se</tspan></text><text x="821.5" y="188.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="821.5" dy="0">poda</tspan></text><rect x="10" y="397" width="920" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="427.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Git solo puede recuperar lo que alguna vez guardó. Un cambio que no se agregó ni se confirmó no tiene copia.</tspan></text><text x="470" y="481" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
