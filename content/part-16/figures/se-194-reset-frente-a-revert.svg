<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 283" width="1010" height="283" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Deshacer dos commits ya publicados mientras otra clon tiene trabajo local</title><desc id="d">Tabla de dos formas de deshacer commits publicados: reescribir con reset y fuerza, o revertir, y qué ocurre cuando otro clon fusiona y publica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="283" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Forma de deshacer</tspan></text><rect x="320" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Estado del otro clon tras fetch</tspan></text><rect x="580" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Commits en el remoto</tspan></text><text x="672" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">al final</tspan></text><rect x="770" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">¿Reaparece lo deshecho?</tspan></text><rect x="10" y="56" width="304" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">reset --hard HEAD~2 y push --force</tspan></text><rect x="320" y="56" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">3 por delante, 0 por detrás</tspan></text><rect x="580" y="56" width="184" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">6</tspan></text><rect x="770" y="56" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">Sí: a3 y a4 vuelven al remoto</tspan></text><rect x="10" y="120" width="304" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">revert de los dos últimos y push normal</tspan></text><rect x="320" y="120" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">1 por delante, 2 por detrás</tspan></text><rect x="580" y="120" width="184" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">9</tspan></text><rect x="770" y="120" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">No: quedan los dos revert</tspan></text><rect x="10" y="188" width="990" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="505" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">Quien tiene los dos commits publicados los devuelve al remoto en su siguiente push. Revertir produce una historia más larga pero</tspan></text><text x="505" y="229.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">converge sin coordinación.</tspan></text><text x="505" y="269.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
