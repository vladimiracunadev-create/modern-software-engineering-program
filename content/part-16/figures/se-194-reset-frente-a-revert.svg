<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 336" width="940" height="336" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Deshacer dos commits ya publicados mientras otro clon tiene trabajo local: commits en el remoto al final</title><desc id="d">Barras horizontales con los commits que quedan en el remoto tras deshacer dos commits publicados: con reset --hard y push forzado quedan 6 y lo deshecho reaparece cuando el otro clon publica; con revert y push normal quedan 9, incluidos los dos revert, y no reaparece.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="336" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Deshacer dos commits ya publicados mientras otro clon tiene trabajo local: commits en el remoto al final</tspan></text><line x1="424" y1="49" x2="424" y2="171" stroke="#d5dde1" stroke-width="1"/><line x1="424" y1="171" x2="424" y2="176" stroke="#5b7280" stroke-width="1.4"/><text x="424" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424" dy="0">0</tspan></text><line x1="544.985" y1="49" x2="544.985" y2="171" stroke="#d5dde1" stroke-width="1"/><line x1="544.985" y1="171" x2="544.985" y2="176" stroke="#5b7280" stroke-width="1.4"/><text x="544.985" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.985" dy="0">3</tspan></text><line x1="665.97" y1="49" x2="665.97" y2="171" stroke="#d5dde1" stroke-width="1"/><line x1="665.97" y1="171" x2="665.97" y2="176" stroke="#5b7280" stroke-width="1.4"/><text x="665.97" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="665.97" dy="0">6</tspan></text><line x1="786.955" y1="49" x2="786.955" y2="171" stroke="#d5dde1" stroke-width="1"/><line x1="786.955" y1="171" x2="786.955" y2="176" stroke="#5b7280" stroke-width="1.4"/><text x="786.955" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="786.955" dy="0">9</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="171" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="171" x2="907.94" y2="176" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">12</tspan></text><line x1="424" y1="171" x2="907.94" y2="171" stroke="#5b7280" stroke-width="1.6"/><text x="414" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">reset --hard HEAD~2 y push --force: el otro clon tiene</tspan></text><text x="414" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">3 por delante, 0 por detrás y lo deshecho reaparece</tspan></text><text x="414" y="101" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">(a3 y a4)</tspan></text><text x="414" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">revert de los dos últimos y push normal: el otro clon</tspan></text><text x="414" y="145" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">tiene 1 por delante, 2 por detrás y lo deshecho no</tspan></text><text x="414" y="162" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">reaparece</tspan></text><rect x="424" y="55" width="241.97" height="49" rx="3" fill="#946512"/><text x="672.97" y="84" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="672.97" dy="0">6</tspan></text><rect x="424" y="116" width="362.955" height="49" rx="3" fill="#946512"/><text x="793.955" y="145" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="793.955" dy="0">9</tspan></text><text x="665.97" y="215" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="665.97" dy="0">Commits en el remoto al final</tspan></text><rect x="10" y="229" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="253.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Quien tiene los dos commits publicados los devuelve al remoto en su siguiente push. Revertir produce una historia más larga</tspan></text><text x="470" y="270.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pero converge sin coordinación.</tspan></text><text x="470" y="318.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
