<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres formas de integrar una rama de 4 commits cuando main avanzó 3</title><desc id="d">Barras agrupadas con los commits en main, las fusiones y los commits de la rama que conservan su identificador al integrar una rama de cuatro commits: merge deja 10 commits, 1 fusión y 4 de 4 hashes; rebase deja 9, ninguna fusión y 0 de 4; squash deja 6, ninguna fusión y 0 de 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="520" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres formas de integrar una rama de 4 commits cuando main avanzó 3</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Commits en main</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Fusiones</tspan></text><rect x="285.42" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="305.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="305.42" dy="0">Commits de la rama con su hash conservado (de 4)</tspan></text><line x1="71.08" y1="345" x2="920" y2="345" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="345" x2="71.08" y2="345" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="349.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="295" x2="920" y2="295" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="295" x2="71.08" y2="295" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="299.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">2</tspan></text><line x1="71.08" y1="245" x2="920" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="245" x2="71.08" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="249.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">4</tspan></text><line x1="71.08" y1="195" x2="920" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="195" x2="71.08" y2="195" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="199.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">6</tspan></text><line x1="71.08" y1="145" x2="920" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="145" x2="71.08" y2="145" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="149.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">8</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="345" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">Commits</text><rect x="99.3773" y="95" width="72.7929" height="250" rx="3" fill="#102a43"/><text x="135.774" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135.774" dy="0">10</tspan></text><rect x="176.17" y="320" width="72.7929" height="25" rx="3" fill="#946512"/><text x="212.567" y="314" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">1</tspan></text><rect x="252.963" y="245" width="72.7929" height="100" rx="3" fill="#087f8c"/><text x="289.36" y="239" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="289.36" dy="0">4</tspan></text><text x="212.567" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Merge sin avance rápido</tspan></text><rect x="382.351" y="120" width="72.7929" height="225" rx="3" fill="#102a43"/><text x="418.747" y="114" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="418.747" dy="0">9</tspan></text><rect x="459.144" y="343" width="72.7929" height="2" rx="3" fill="#946512"/><text x="495.54" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">0</tspan></text><rect x="535.936" y="343" width="72.7929" height="2" rx="3" fill="#087f8c"/><text x="572.333" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="572.333" dy="0">0</tspan></text><text x="495.54" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Rebase y avance rápido</tspan></text><rect x="665.324" y="195" width="72.7929" height="150" rx="3" fill="#102a43"/><text x="701.72" y="189" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="701.72" dy="0">6</tspan></text><rect x="742.117" y="343" width="72.7929" height="2" rx="3" fill="#946512"/><text x="778.513" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">0</tspan></text><rect x="818.91" y="343" width="72.7929" height="2" rx="3" fill="#087f8c"/><text x="855.306" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855.306" dy="0">0</tspan></text><text x="778.513" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Squash</tspan></text><rect x="10" y="397" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="421.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El árbol final fue idéntico en las tres. Cambia la historia, no el contenido: merge conserva la forma de la bifurcación,</tspan></text><text x="470" y="438.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">rebase reescribe los 4 commits y squash crea uno nuevo; por eso la elección es de trazabilidad y de quién ya tiene esos</tspan></text><text x="470" y="455.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">commits.</tspan></text><text x="470" y="502.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
