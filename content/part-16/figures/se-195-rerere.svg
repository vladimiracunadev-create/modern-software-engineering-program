<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" width="940" height="490" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Repetir la misma fusión con rerere inactivo y activo: marcas de conflicto</title><desc id="d">Barras agrupadas con el número de fusiones que dejan marcas de conflicto en la primera y la segunda fusión de las mismas ramas: con rerere inactivo hay marcas en las dos; con rerere activo solo en la primera y la segunda reaplica la resolución previa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="490" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Repetir la misma fusión con rerere inactivo y activo: marcas de conflicto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">rerere inactivo</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">rerere activo</tspan></text><line x1="63.54" y1="315" x2="920" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="315" x2="63.54" y2="315" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="319.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="205" x2="920" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="205" x2="63.54" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="209.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="315" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="205" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 205)">Fusiones con marcas de conflicto</text><rect x="106.363" y="205" width="169.292" height="110" rx="3" fill="#c0432f"/><text x="191.009" y="199" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="191.009" dy="0">1</tspan></text><rect x="279.655" y="205" width="169.292" height="110" rx="3" fill="#087f8c"/><text x="364.301" y="199" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="364.301" dy="0">1</tspan></text><text x="277.655" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">1.ª fusión</tspan></text><rect x="534.593" y="205" width="169.292" height="110" rx="3" fill="#c0432f"/><text x="619.239" y="199" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="619.239" dy="0">1</tspan></text><rect x="707.885" y="313" width="169.292" height="2" rx="3" fill="#087f8c"/><text x="792.531" y="307" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="792.531" dy="0">0</tspan></text><text x="705.885" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">2.ª fusión</tspan></text><rect x="10" y="367" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="391.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con rerere el código de salida de la segunda fusión sigue siendo 1: Git avisa de que había conflicto y aun así deja</tspan></text><text x="470" y="408.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resuelto el archivo (tope=60, la resolución previa se reaplica). Hay que revisarlo y agregarlo; la reutilización no valida</tspan></text><text x="470" y="425.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que la resolución siga siendo correcta.</tspan></text><text x="470" y="472.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
