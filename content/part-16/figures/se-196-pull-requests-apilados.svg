<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 283" width="1000" height="283" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Corregir el primer PR de una pila de cuatro y reapilar con rebase --update-refs</title><desc id="d">Tabla con dos correcciones del primer pull request de una pila: una lejana que reapila sin conflicto y otra contigua al segundo PR que provoca conflicto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="283" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Dónde cae la corrección</tspan></text><rect x="390" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">¿Conflicto al reapilar?</tspan></text><rect x="610" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Ramas de la pila actualizadas</tspan></text><rect x="10" y="56" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">En una zona lejana de los demás PR</tspan></text><rect x="390" y="56" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">No</tspan></text><rect x="610" y="56" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">3 de 3</tspan></text><rect x="10" y="120" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Junto a la línea que edita el PR 2</tspan></text><rect x="390" y="120" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">Sí</tspan></text><rect x="610" y="120" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">0 de 3: se detiene en el primero</tspan></text><rect x="10" y="188" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Una pila de PR pequeños reduce lo que se lee, pero cada corrección del primero se paga en reapilados. Cuando hay conflicto Git</tspan></text><text x="500" y="229.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">detiene todo y hay que resolverlo para continuar.</tspan></text><text x="500" y="269.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
