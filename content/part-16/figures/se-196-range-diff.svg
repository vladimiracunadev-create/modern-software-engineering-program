<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 247" width="1060" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué muestra cada comparación tras reordenar una rama y pedir un cambio</title><desc id="d">Barras: tras rebasar una rama de cuatro commits sobre un main que avanzó doce commits y corregir uno, el diff plano entre puntas cambia 26 líneas y range-diff solo muestra 6 dentro de dos commits.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="247" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">git diff entre las dos puntas (incluye lo que cambió main)</tspan></text><rect x="430" y="16" width="780" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1218" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1218" dy="0">26 líneas</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Líneas +/− dentro de los commits que range-diff marca</tspan></text><rect x="430" y="60" width="180" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="618" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="618" dy="0">6 líneas</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Commits de la rama marcados como cambiados</tspan></text><rect x="430" y="104" width="60" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="498" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498" dy="0">2 de 4</tspan></text><rect x="10" y="152" width="1040" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">El diff plano mezcla lo que cambió main con la corrección pedida. range-diff compara commit contra commit y marca con «!» los que cambiaron.</tspan></text><text x="530" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">Fue «==!!»: el cuarto commit cambia porque su contexto incluye la línea corregida, no porque alguien lo editara.</tspan></text><text x="530" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
