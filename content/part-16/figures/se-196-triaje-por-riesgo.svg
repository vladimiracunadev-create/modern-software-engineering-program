<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 335" width="1040" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defectos plantados que alcanza a ver una lectura del 30 % de cada PR</title><desc id="d">Barras: de 91 defectos plantados en 300 pull requests sintéticos, leer el 30 por ciento de las líneas al azar halla 25,5; por tamaño 27; por tres niveles de riesgo 29 y por defectos esperados por línea 40.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="335" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Al azar (media de 100 barajados)</tspan></text><rect x="410" y="16" width="331.5" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="749.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="749.5" dy="0">25,5</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">En el orden en que aparecen los archivos</tspan></text><rect x="410" y="60" width="338" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="756" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="756" dy="0">26</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Primero los archivos más grandes</tspan></text><rect x="410" y="104" width="351" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="769" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="769" dy="0">27</tspan></text><text x="400" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Primero el mayor nivel de riesgo (3 niveles)</tspan></text><rect x="410" y="148" width="377" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="795" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="795" dy="0">29</tspan></text><text x="400" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Por defectos esperados por línea</tspan></text><rect x="410" y="192" width="520" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="938" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="938" dy="0">40</tspan></text><rect x="10" y="240" width="1020" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520" dy="0">Ordenar por defectos esperados por línea ve un 57 % más defectos que el azar con el mismo esfuerzo. La densidad de defectos por tipo de</tspan></text><text x="520" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520" dy="0">archivo es un supuesto del autor: el experimento muestra el efecto de priorizar, no cuántos defectos hay en proyectos reales.</tspan></text><text x="520" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
