<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 335" width="1060" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Extraer los issues que cierra cada mensaje (150 mensajes sintéticos)</title><desc id="d">Barras: de 132 cierres que la persona quería hacer, la expresión ingenua halla 113 y añade 57 vínculos falsos; la regla de palabra clave halla 86 y ninguno falso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="335" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Cierres que la persona quería hacer</tspan></text><rect x="430" y="16" width="818.4" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="1256.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1256.4" dy="0">132</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Expresión ingenua #número: cierres hallados</tspan></text><rect x="430" y="60" width="700.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="1138.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1138.6" dy="0">113</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Expresión ingenua: vínculos que no eran cierres</tspan></text><rect x="430" y="104" width="353.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="791.4" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="791.4" dy="0">57 falsos</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Palabra clave + #número: cierres hallados</tspan></text><rect x="430" y="148" width="533.2" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="971.2" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="971.2" dy="0">86</tspan></text><text x="420" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Palabra clave + #número: vínculos falsos</tspan></text><rect x="430" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442" dy="0">0</tspan></text><rect x="10" y="240" width="1040" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">La regla estricta no se equivoca de más pero pierde lo escrito sin espacio, con una dirección completa, con «GH-» o con un segundo número</tspan></text><text x="530" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">tras «y». La ingenua halla más y vincula referencias que no cierran nada.</tspan></text><text x="530" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
