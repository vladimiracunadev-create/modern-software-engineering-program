<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 291" width="1000" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Informes reproducidos de 120 según el detalle (6 defectos, 5 intentos al azar)</title><desc id="d">Barras: un script que intenta reproducir seis defectos solo con lo que dice el informe reproduce 6,7 por ciento con un título, 28,3 con pasos sin valores y 100 con los valores exactos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="291" fill="#ffffff"/><text x="380" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Solo un título</tspan></text><rect x="390" y="16" width="41.54" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="439.54" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="439.54" dy="0">6,7 %</tspan></text><text x="380" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Título y síntoma</tspan></text><rect x="390" y="60" width="41.54" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="439.54" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="439.54" dy="0">6,7 %</tspan></text><text x="380" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Pasos sin los valores exactos</tspan></text><rect x="390" y="104" width="175.46" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="573.46" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="573.46" dy="0">28,3 %</tspan></text><text x="380" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Pasos con los valores exactos de entrada</tspan></text><rect x="390" y="148" width="620" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1018" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1018" dy="0">100 %</tspan></text><rect x="10" y="196" width="980" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">Los valores que activan el defecto separan un informe accionable de uno que obliga a adivinar. El 28,3 % depende de que la persona</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">recuerde un valor una de cada cuatro veces: es un supuesto, no una medición de personas.</tspan></text><text x="500" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
