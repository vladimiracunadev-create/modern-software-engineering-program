<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 311" width="960" height="311" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mensajes con Fixes o Closes que sobreviven en main (60 cambios generados)</title><desc id="d">Tabla de tres orígenes de cambio con el número de mensajes, cuántos llevan Fixes o Closes y cuántos siguen visibles en el historial de main.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="311" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Origen del cambio</tspan></text><rect x="410" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Mensajes</tspan></text><rect x="540" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Con Fixes o Closes</tspan></text><rect x="760" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Visibles en main</tspan></text><rect x="10" y="56" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Commit directo en main</tspan></text><rect x="410" y="56" width="124" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">50</tspan></text><rect x="540" y="56" width="214" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">12</tspan></text><rect x="760" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">12</tspan></text><rect x="10" y="108" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Rama que nunca se integra</tspan></text><rect x="410" y="108" width="124" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">4</tspan></text><rect x="540" y="108" width="214" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">0</tspan></text><rect x="760" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0</tspan></text><rect x="10" y="160" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Rama integrada con squash sin copiar el cuerpo</tspan></text><rect x="410" y="160" width="124" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">6</tspan></text><rect x="540" y="160" width="214" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">1</tspan></text><rect x="760" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0</tspan></text><rect x="10" y="216" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">En main quedaron 56 commits, 18 con referencia y 13 de 25 issues con alguna. El squash que no copia el cuerpo borra el</tspan></text><text x="480" y="257.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">vínculo: la trazabilidad depende de cómo se integra, no solo de lo que se escribió.</tspan></text><text x="480" y="297.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
