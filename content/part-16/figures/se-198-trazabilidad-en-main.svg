<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 521" width="940" height="521" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mensajes con Fixes o Closes que sobreviven en main (60 cambios generados)</title><desc id="d">Barras agrupadas con los mensajes, los que llevan Fixes o Closes y los visibles en main para tres orígenes de cambio: el commit directo en main conserva sus 12 referencias de 50 mensajes; la rama que nunca se integra tiene 4 mensajes y ninguna referencia; la rama integrada con squash sin copiar el cuerpo tiene 1 referencia en 6 mensajes y ninguna visible.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="521" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mensajes con Fixes o Closes que sobreviven en main (60 cambios generados)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mensajes</tspan></text><rect x="124.32" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Con Fixes o Closes</tspan></text><rect x="308.04" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="328.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.04" dy="0">Visibles en main</tspan></text><line x1="71.08" y1="345" x2="920" y2="345" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="345" x2="71.08" y2="345" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="349.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="295" x2="920" y2="295" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="295" x2="71.08" y2="295" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="299.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="245" x2="920" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="245" x2="71.08" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="249.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="195" x2="920" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="195" x2="71.08" y2="195" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="199.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="145" x2="920" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="145" x2="71.08" y2="145" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="149.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">50</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="345" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">Mensajes</text><rect x="99.3773" y="95" width="72.7929" height="250" rx="3" fill="#102a43"/><text x="135.774" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135.774" dy="0">50</tspan></text><rect x="176.17" y="285" width="72.7929" height="60" rx="3" fill="#946512"/><text x="212.567" y="279" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">12</tspan></text><rect x="252.963" y="285" width="72.7929" height="60" rx="3" fill="#087f8c"/><text x="289.36" y="279" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="289.36" dy="0">12</tspan></text><text x="212.567" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Commit directo en main</tspan></text><rect x="382.351" y="325" width="72.7929" height="20" rx="3" fill="#102a43"/><text x="418.747" y="319" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="418.747" dy="0">4</tspan></text><rect x="459.144" y="343" width="72.7929" height="2" rx="3" fill="#946512"/><text x="495.54" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">0</tspan></text><rect x="535.936" y="343" width="72.7929" height="2" rx="3" fill="#087f8c"/><text x="572.333" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="572.333" dy="0">0</tspan></text><text x="495.54" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Rama que nunca se integra</tspan></text><rect x="665.324" y="315" width="72.7929" height="30" rx="3" fill="#102a43"/><text x="701.72" y="309" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="701.72" dy="0">6</tspan></text><rect x="742.117" y="340" width="72.7929" height="5" rx="3" fill="#946512"/><text x="778.513" y="334" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">1</tspan></text><rect x="818.91" y="343" width="72.7929" height="2" rx="3" fill="#087f8c"/><text x="855.306" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855.306" dy="0">0</tspan></text><text x="778.513" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Rama integrada con squash sin copiar</tspan></text><text x="778.513" y="383" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">el cuerpo</tspan></text><rect x="10" y="414" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="438.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En main quedaron 56 commits, 18 con referencia y 13 de 25 issues con alguna. El squash que no copia el cuerpo borra el</tspan></text><text x="470" y="455.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">vínculo: la trazabilidad depende de cómo se integra, no solo de lo que se escribió.</tspan></text><text x="470" y="503.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
