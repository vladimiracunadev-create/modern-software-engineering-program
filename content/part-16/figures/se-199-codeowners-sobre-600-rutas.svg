<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 467" width="1000" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un CODEOWNERS sintético evaluado sobre 600 rutas</title><desc id="d">Tabla con las métricas de un archivo de propietarios de 24 reglas evaluado sobre 600 rutas: rutas sin propietario, reglas que nunca ganan, efecto de invertir el orden y carga por equipo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="467" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Medida</tspan></text><rect x="390" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Valor</tspan></text><rect x="540" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="762" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">Lectura</tspan></text><rect x="10" y="56" width="374" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Rutas evaluadas / reglas</tspan></text><rect x="390" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">600 / 24</tspan></text><rect x="540" y="56" width="444" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">Rutas y reglas sintéticas del autor</tspan></text><rect x="10" y="108" width="374" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Rutas sin propietario</tspan></text><rect x="390" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">0</tspan></text><rect x="540" y="108" width="444" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">La regla «*» del principio cubre todo</tspan></text><rect x="10" y="160" width="374" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Rutas sin propietario si se quita «*»</tspan></text><rect x="390" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">31</tspan></text><rect x="540" y="160" width="444" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">Archivos de informes y carpetas sin regla propia</tspan></text><rect x="10" y="212" width="374" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Reglas que nunca ganan</tspan></text><rect x="390" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">1 de 24</tspan></text><rect x="540" y="212" width="444" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">«/CODEOWNERS»: ninguna ruta de la muestra la usa</tspan></text><rect x="10" y="264" width="374" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="282.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Rutas que cambian de propietario al invertir el</tspan></text><text x="197" y="298.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">orden</tspan></text><rect x="390" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">520 de 600</tspan></text><rect x="540" y="264" width="444" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="282.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">El último patrón que coincide gana, así que el orden es la</tspan></text><text x="762" y="298.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">semántica</tspan></text><rect x="10" y="316" width="374" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="342.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Carga del equipo más cargado / del menos cargado</tspan></text><rect x="390" y="316" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">108 / 25</tspan></text><rect x="540" y="316" width="444" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">108 de 600 rutas recaen en un solo equipo</tspan></text><rect x="10" y="372" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El modelo de coincidencia es una simplificación de lo que describe la documentación, no el motor de una plataforma. Sirve para</tspan></text><text x="500" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">auditar reglas, no para sustituir la comprobación en el alojamiento real.</tspan></text><text x="500" y="453.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
