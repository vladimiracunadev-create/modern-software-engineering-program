<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 379" width="1040" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mensajes que rechaza un validador de commits convencionales (400 sintéticos)</title><desc id="d">Barras: de 400 mensajes sintéticos el validador rechaza 53 sin tipo, 24 con tipo inventado, 23 en mayúscula, 23 sin espacio y 18 con alcance con espacio, y acepta los 54 cambios rompedores bien formados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="379" fill="#ffffff"/><text x="440" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Sin tipo (53 de 400)</tspan></text><rect x="450" y="16" width="795" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1253" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1253" dy="0">53</tspan></text><text x="440" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Tipo inventado, «mejora:» (24)</tspan></text><rect x="450" y="60" width="360" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="818" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="818" dy="0">24</tspan></text><text x="440" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Tipo en mayúscula (23)</tspan></text><rect x="450" y="104" width="345" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="803" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="803" dy="0">23</tspan></text><text x="440" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Sin espacio tras los dos puntos (23)</tspan></text><rect x="450" y="148" width="345" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="803" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="803" dy="0">23</tspan></text><text x="440" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Alcance con espacio (18)</tspan></text><rect x="450" y="192" width="270" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="728" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="728" dy="0">18</tspan></text><text x="440" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Rompedores con «!» o con pie BREAKING CHANGE (54)</tspan></text><rect x="450" y="236" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="462" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="462" dy="0">0 rechazados</tspan></text><rect x="10" y="284" width="1020" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">Una herramienta que solo lee el «!» detecta 16 de los 54 cambios rompedores; una que solo lee el pie, 38; leer ambos detecta 54. El</tspan></text><text x="520" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">validador comprueba la forma: no sabe si un cambio sin «!» rompía a alguien.</tspan></text><text x="520" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
