<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 247" width="1000" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rebase con conflicto de una contribución de 3 líneas tras quedarse atrás</title><desc id="d">Barras: una contribución de tres líneas en un archivo de 50 líneas entra en conflicto al rebasar en 2 de 6 casos si el original avanzó 5 commits, 4 de 6 si avanzó 20 y 6 de 6 si avanzó 60.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="247" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">5 commits nuevos en el original</tspan></text><rect x="370" y="16" width="280.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="658.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="658.5" dy="0">2 de 6</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">20 commits nuevos</tspan></text><rect x="370" y="60" width="569.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="947.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="947.5" dy="0">4 de 6</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">60 commits nuevos</tspan></text><rect x="370" y="104" width="850" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1228" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1228" dy="0">6 de 6</tspan></text><rect x="10" y="152" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El número de commits por detrás coincidió en las seis semillas con los commits del original: rev-list lo mide sin ambigüedad.</tspan></text><text x="500" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Cuanto más tiempo pasa sin sincronizar, más cuesta enviar el cambio.</tspan></text><text x="500" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
