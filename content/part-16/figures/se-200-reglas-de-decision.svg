<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reglas de decisión cuando solo el 30 % de las personas mantenedoras lee la propuesta</title><desc id="d">Barras agrupadas con los porcentajes de propuestas dañinas aceptadas, buenas rechazadas y sin decisión para tres reglas: el consenso perezoso acepta 40,5 por ciento de las dañinas y nunca deja sin decisión; la mayoría de 3 de 5 acepta 1,0 y deja sin decisión 83,5; la unanimidad de quienes votan, 0,5 y 83,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reglas de decisión cuando solo el 30 % de las personas mantenedoras lee la propuesta</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Dañinas aceptadas</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Buenas rechazadas</tspan></text><rect x="368.36" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="388.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="388.36" dy="0">Sin decisión</tspan></text><line x1="78.62" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="355" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="303" x2="920" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="303" x2="78.62" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="251" x2="920" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="251" x2="78.62" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="199" x2="920" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="199" x2="78.62" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="147" x2="920" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Propuestas (%)</text><rect x="106.666" y="249.7" width="72.1227" height="105.3" rx="3" fill="#c0432f"/><text x="142.727" y="243.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142.727" dy="0">40,5 %</tspan></text><rect x="182.789" y="323.02" width="72.1227" height="31.98" rx="3" fill="#946512"/><text x="218.85" y="317.02" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.85" dy="0">12,3 %</tspan></text><rect x="258.911" y="353" width="72.1227" height="2" rx="3" fill="#6b7c86"/><text x="294.973" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="294.973" dy="0">0 %</tspan></text><text x="218.85" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Consenso perezoso (72 h)</tspan></text><rect x="387.126" y="352.4" width="72.1227" height="2.6" rx="3" fill="#c0432f"/><text x="423.187" y="346.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.187" dy="0">1 %</tspan></text><rect x="463.249" y="346.94" width="72.1227" height="8.06" rx="3" fill="#946512"/><text x="499.31" y="340.94" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">3,1 %</tspan></text><rect x="539.371" y="137.9" width="72.1227" height="217.1" rx="3" fill="#6b7c86"/><text x="575.433" y="131.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="575.433" dy="0">83,5 %</tspan></text><text x="499.31" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Mayoría de 3 de 5</tspan></text><rect x="667.586" y="353" width="72.1227" height="2" rx="3" fill="#c0432f"/><text x="703.647" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="703.647" dy="0">0,5 %</tspan></text><rect x="743.709" y="344.34" width="72.1227" height="10.66" rx="3" fill="#946512"/><text x="779.77" y="338.34" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">4,1 %</tspan></text><rect x="819.831" y="137.9" width="72.1227" height="217.1" rx="3" fill="#6b7c86"/><text x="855.893" y="131.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855.893" dy="0">83,5 %</tspan></text><text x="779.77" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Unanimidad de votantes (mín. 3)</tspan></text><rect x="10" y="407" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 90 % de disponibilidad el consenso perezoso acepta 2,6 % de las dañinas pero rechaza 30,3 % de las buenas, y la mayoría</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 3 de 5 acepta 29,7 % de las dañinas. Ninguna regla es mejor en general: cada una cambia qué error se tolera.</tspan></text><text x="470" y="496.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
