<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 291" width="1040" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Licencias fuera de política que ve un análisis solo de directos frente a uno transitivo</title><desc id="d">Barras: con 60 dependencias directas que arrastran unos 514 paquetes, un análisis solo de directos halla 6,8 paquetes fuera de política y uno transitivo halla 60,5, un 89 por ciento que no habría visto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="291" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Paquetes directos</tspan></text><rect x="430" y="16" width="93" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="531" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="531" dy="0">60</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Paquetes en total (media de 20 grafos)</tspan></text><rect x="430" y="60" width="796.7" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="1234.7" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1234.7" dy="0">514</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Fuera de política entre los directos</tspan></text><rect x="430" y="104" width="10.54" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="448.54" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="448.54" dy="0">6,8</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Fuera de política en todo el grafo</tspan></text><rect x="430" y="148" width="93.775" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="531.775" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="531.775" dy="0">60,5</tspan></text><rect x="10" y="196" width="1020" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="520" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">El 89 % que un análisis de directos no ve sale de una mezcla del autor (80 % permisivas, 6 % de copyleft fuerte, 6 % sin declarar); lo</tspan></text><text x="520" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">robusto es la forma: la mayoría de los paquetes está en la transitividad.</tspan></text><text x="520" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
