<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 347" width="1000" height="347" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Verificar commits firmados con SSH</title><desc id="d">Tabla de tres comprobaciones de firma con el resultado de git verify-commit: 60 firmados que verifican, una copia con mensaje alterado que falla y una firma válida de un firmante no listado que falla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="347" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Caso</tspan></text><rect x="390" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Resultado</tspan></text><rect x="570" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Lectura</tspan></text><rect x="10" y="56" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">60 commits firmados con una clave SSH desechable</tspan></text><rect x="390" y="56" width="174" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">60 de 60 verifican</tspan></text><rect x="570" y="56" width="414" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Cada firma cubre el contenido exacto del commit</tspan></text><rect x="10" y="120" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="144.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Copia del commit con el mensaje cambiado y la misma</tspan></text><text x="197" y="160.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">firma</tspan></text><rect x="390" y="120" width="174" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">Código 1</tspan></text><rect x="570" y="120" width="414" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">La firma ya no corresponde al contenido</tspan></text><rect x="10" y="184" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Firma válida con otro archivo de firmantes</tspan></text><rect x="390" y="184" width="174" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">Código 1</tspan></text><rect x="570" y="184" width="414" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">El firmante no figura: válida no significa de confianza</tspan></text><rect x="10" y="252" width="980" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">La firma vive en una cabecera del propio objeto. Firmar añadió unos 92 ms por commit en Windows y 7 ms en Ubuntu, y verificar costó</tspan></text><text x="500" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">15 ms por commit en Ubuntu y 234 ms en Windows (60 repeticiones, medidas de un equipo): no se comparan entre sistemas.</tspan></text><text x="500" y="333.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
