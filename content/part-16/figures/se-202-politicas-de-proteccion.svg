<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 379" width="1000" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Eventos problemáticos que dejan pasar seis políticas (de 500 eventos sintéticos)</title><desc id="d">Barras: de 500 eventos sintéticos, 387 tienen algún problema; sin protección pasan los 387, con PR 255, con una aprobación 105, con comprobaciones 79, con firmas 1 y sin push forzado 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="379" fill="#ffffff"/><text x="340" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">Sin protección</tspan></text><rect x="350" y="16" width="561.15" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="919.15" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="919.15" dy="0">387</tspan></text><text x="340" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">Exigir PR</tspan></text><rect x="350" y="60" width="369.75" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="727.75" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="727.75" dy="0">255</tspan></text><text x="340" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">PR + 1 aprobación</tspan></text><rect x="350" y="104" width="152.25" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510.25" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="510.25" dy="0">105</tspan></text><text x="340" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">+ comprobaciones superadas</tspan></text><rect x="350" y="148" width="114.55" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="472.55" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="472.55" dy="0">79</tspan></text><text x="340" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">+ commits firmados</tspan></text><rect x="350" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="362" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362" dy="0">1</tspan></text><text x="340" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">+ sin push forzado</tspan></text><rect x="350" y="236" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="362" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362" dy="0">0</tspan></text><rect x="10" y="284" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Cada control cierra una clase de problema y el último deja 0 por construcción del experimento: los problemas se definieron con</tspan></text><text x="500" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">estos controles. Lo informativo es el orden de reducción y los 37 eventos de administradores que un bypass deja pasar.</tspan></text><text x="500" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
