<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 291" width="1000" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Órdenes de fusión de tres ramas cuyas pruebas quedan verdes según la estrategia</title><desc id="d">Barras: al fusionar las seis permutaciones de tres ramas, resolver siempre con ours o con theirs deja las pruebas verdes en 3 órdenes, unir ambos lados en 0 y la resolución manual correcta en 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="291" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Resolver siempre con «ours»</tspan></text><rect x="370" y="16" width="270" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="648" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="648" dy="0">3 de 6</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Resolver siempre con «theirs»</tspan></text><rect x="370" y="60" width="270" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="648" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="648" dy="0">3 de 6</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Unir ambos lados (--union)</tspan></text><rect x="370" y="104" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="382" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="382" dy="0">0 de 6</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Resolución manual correcta</tspan></text><rect x="370" y="148" width="540" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="918" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="918" dy="0">6 de 6</tspan></text><rect x="10" y="196" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Una estrategia automática acierta o falla según el orden: no es una política. Unir ambos lados no dejó ningún orden en verde. En</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">los seis órdenes hubo un solo archivo en conflicto, pero la resolución correcta combinaba las tres intenciones.</tspan></text><text x="500" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
