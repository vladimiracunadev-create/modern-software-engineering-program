<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rescatar una fusión que se resolvió con «ours» y perdió el periodo de gracia</title><desc id="d">Diagrama de flujo de tres rescates de una fusión mal resuelta: reiniciar y repetir si no se publicó y dejar las pruebas verdes, un commit de corrección si se publicó con las pruebas verdes, y revertir la fusión y volver a fusionar, que no hace nada y deja las pruebas en rojo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Rescatar una fusión que se resolvió con «ours» y perdió el periodo de gracia</tspan></text><text x="114" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="114" dy="0">Camino</tspan></text><text x="463" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="463" dy="0">Qué se hace y qué ocurre en la historia</tspan></text><text x="797" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="797" dy="0">Resultado</tspan></text><rect x="14" y="71" width="200" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="114" y="102.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="114" dy="0">(a) Sin publicar</tspan></text><polyline points="218,98.64 244,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="248" y="71" width="430" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="463" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463" dy="0">Reset al primer padre y fusionar de nuevo: se reescribe</tspan></text><text x="463" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463" dy="0">un commit que nadie tiene</tspan></text><polyline points="682,98.64 708,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="712" y="71" width="170" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="797" y="102.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="797" dy="0">Pruebas verdes</tspan></text><rect x="14" y="138.28" width="200" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="114" y="169.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="114" dy="0">(b) Publicada</tspan></text><polyline points="218,165.92 244,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="248" y="138.28" width="430" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="463" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463" dy="0">Nuevo commit que restaura lo perdido: el commit malo</tspan></text><text x="463" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463" dy="0">sigue en la historia</tspan></text><polyline points="682,165.92 708,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="712" y="138.28" width="170" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="797" y="169.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="797" dy="0">Pruebas verdes</tspan></text><rect x="14" y="205.56" width="200" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="114" y="236.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="114" dy="0">(c) Revertir la fusión</tspan></text><polyline points="218,233.2 244,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="248" y="205.56" width="430" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="463" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463" dy="0">revert -m 1 y volver a fusionar: Git responde «Already</tspan></text><text x="463" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463" dy="0">up to date», la rama figura integrada</tspan></text><polyline points="682,233.2 708,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="712" y="205.56" width="170" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="797" y="236.84" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="797" dy="0">Pruebas rojas</tspan></text><rect x="10" y="278.84" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="303.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tras la fusión mala la rama figuraba como ancestro, así que fusionarla otra vez no hace nada. El revert devuelve el árbol</tspan></text><text x="470" y="320.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">al primer padre pero no devuelve la intención perdida.</tspan></text><text x="470" y="368.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
