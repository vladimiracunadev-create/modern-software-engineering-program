<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 715" width="880" height="715" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué comprobación detecta cada defecto plantado en una contribución</title><desc id="d">Tabla de catorce contribuciones, una correcta y trece con un defecto plantado, con las comprobaciones que fallan en cada una; la prueba que no comprueba nada no dispara ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="880" height="715" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Contribución</tspan></text><rect x="430" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Comprobaciones que fallan</tspan></text><rect x="10" y="56" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="76.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Contribución correcta</tspan></text><rect x="430" y="56" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">Ninguna</tspan></text><rect x="10" y="96" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="116.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Mensaje sin tipo</tspan></text><rect x="430" y="96" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="116.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">1 mensaje convencional</tspan></text><rect x="10" y="136" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="156.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Un commit gigante que mezcla</tspan></text><rect x="430" y="136" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="156.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">2 commits atómicos</tspan></text><rect x="10" y="176" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Commit intermedio roto</tspan></text><rect x="430" y="176" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">3 cada commit pasa las pruebas</tspan></text><rect x="10" y="216" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Prueba que falla en la punta</tspan></text><rect x="430" y="216" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">3 y 4</tspan></text><rect x="10" y="256" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="276.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Archivo nuevo sin cabecera SPDX</tspan></text><rect x="430" y="256" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="276.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">5 cabecera SPDX</tspan></text><rect x="10" y="296" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="316.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Descripción sin issue</tspan></text><rect x="430" y="296" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">6 issue enlazado</tspan></text><rect x="10" y="336" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="356.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Secreto sintético en el diff</tspan></text><rect x="430" y="336" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">7 sin secreto</tspan></text><rect x="10" y="376" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="396.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Commits sin firmar</tspan></text><rect x="430" y="376" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="396.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">8 firmados</tspan></text><rect x="10" y="416" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="436.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Sin Signed-off-by</tspan></text><rect x="430" y="416" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="436.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">9 Signed-off-by</tspan></text><rect x="10" y="456" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="476.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">PR de más de 400 líneas</tspan></text><rect x="430" y="456" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="476.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">2 y 10</tspan></text><rect x="10" y="496" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="516.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Toca src/auth sin pedir al equipo dueño</tspan></text><rect x="430" y="496" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="516.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">11 revisores del CODEOWNERS</tspan></text><rect x="10" y="536" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="556.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Cambia el tope sin tocar pruebas</tspan></text><rect x="430" y="536" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="556.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">12 si cambia src, cambia una prueba</tspan></text><rect x="10" y="576" width="414" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="596.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Prueba que no comprueba nada</tspan></text><rect x="430" y="576" width="434" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="596.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">Ninguna</tspan></text><rect x="10" y="620" width="860" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="440" y="644.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">12 de 13 defectos tocan alguna comprobación y la contribución correcta no dispara ninguna alarma falsa. El que</tspan></text><text x="440" y="661.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">escapa pasa todas las comprobaciones de forma: cambia una prueba por una afirmación vacía.</tspan></text><text x="440" y="701.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
