<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clics esperados hasta la página correcta: árbol por componente frente a índice de tareas</title><desc id="d">Líneas con los clics esperados de 20 000 lectores simulados según la probabilidad de conocer el nombre del componente en cada nivel: el árbol por componente pasa de 3 clics con 100 por ciento a 7,88, 12,58, 17,49 y 22,05 con 80, 60, 40 y 20 por ciento, mientras el índice de tareas se queda entre 2,41 y 4,28.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Clics esperados hasta la página correcta: árbol por componente frente a índice de tareas</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Árbol por componente (125 hojas)</tspan></text><rect x="305.28" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="325.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="325.28" dy="0">Índice de tareas (25 títulos)</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="387" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><