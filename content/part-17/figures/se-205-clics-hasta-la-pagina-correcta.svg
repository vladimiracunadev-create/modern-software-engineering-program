roke="#c0432f" stroke-width="2"/><text x="289.81" y="166.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="289.81" dy="0">17,49</tspan></text><circle cx="490.54" cy="236.04" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="490.54" y="225.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="490.54" dy="0">12,58</tspan></text><circle cx="691.27" cy="292.44" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="691.27" y="281.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="691.27" dy="0">7,88</tspan></text><circle cx="892" cy="351" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="340" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">3,00</tspan></text><polyline points="89.08,335.64 289.81,340.92 490.54,347.04 691.27,351.84 892,358.08" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="330.14" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="89.08" y="359.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">4,28</tspan></text><rect x="284.31" y="335.42" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="289.81" y="364.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="289.81" dy="0">3,84</tspan></text><rect x="485.04" y="341.54" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="490.54" y="371.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="490.54" dy="0">3,33</tspan></text><rect x="685.77" y="346.34" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="691.27" y="375.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="691.27" dy="0">2,93</tspan></text><rect x="886.5" y="352.58" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="382.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">2,41</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El árbol por componente exige saber cómo se llama la pieza antes de saber cómo se arregla; cuando el lector sabe lo que</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">quiere hacer pero no el nombre interno, cada nivel equivocado cuesta entrar y volver. Es un modelo: los 0,9 de</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reconocimiento de la tarea y los 5 hijos por nivel son supuestos del autor, no una medición de personas.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
