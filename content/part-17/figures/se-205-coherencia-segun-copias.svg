<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 335" width="980" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Datos que siguen coherentes tras tres cambios, según cuántas páginas lo repiten</title><desc id="d">Barras de 20 000 hechos simulados con tres cambios cada uno y una probabilidad de 0,85 de actualizar cada copia: con una sola página siguen coherentes el 62,6 por ciento, con dos el 38,0, con tres el 23,3, con cuatro el 14,6 y con seis el 5,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="335" fill="#ffffff"/><text x="240" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">1 página dice el dato</tspan></text><rect x="250" y="16" width="62.6" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320.6" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="320.6" dy="0">62,6 % (teoría 61,4)</tspan></text><text x="240" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">2 páginas</tspan></text><rect x="250" y="60" width="38" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="296" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="296" dy="0">38,0 % (37,7)</tspan></text><text x="240" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">3 páginas</tspan></text><rect x="250" y="104" width="23.3" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="281.3" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="281.3" dy="0">23,3 % (23,2)</tspan></text><text x="240" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">4 páginas</tspan></text><rect x="250" y="148" width="14.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="272.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="272.6" dy="0">14,6 % (14,2)</tspan></text><text x="240" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">6 páginas</tspan></text><rect x="250" y="192" width="5.3" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="263.3" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="263.3" dy="0">5,3 % (5,4)</tspan></text><rect x="10" y="240" width="960" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Cada copia añade una oportunidad de olvido: la coherencia cae como 0,85 elevado a 3k. Repetir el plazo de entrega en seis</tspan></text><text x="490" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">audiencias deja un 5 % de probabilidad de que todas digan lo mismo. La solución es una fuente única enlazada, no más disciplina.</tspan></text><text x="490" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
