<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 291" width="1060" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Legibilidad de Fernández Huerta para cuatro textos sobre la misma regla</title><desc id="d">Barras con el índice de Fernández Huerta de cuatro textos sobre la penalización por retraso: el escrito para estudiantes 93,1, el de docentes 68,8, el de mantenimiento 58,6 y el que intenta servir a todos 41,1; más alto es más fácil.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="291" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Estudiante (entender el descuento)</tspan></text><rect x="370" y="16" width="41.895" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="419.895" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="419.895" dy="0">93,1 · 25 palabras, 2 frases</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Docente (cambiar el plazo)</tspan></text><rect x="370" y="60" width="30.96" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="408.96" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="408.96" dy="0">68,8 · 16 palabras, 4 frases</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Mantenimiento (depurar el cálculo)</tspan></text><rect x="370" y="104" width="26.37" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="404.37" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="404.37" dy="0">58,6 · 44 palabras, 1 frase</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Una sola página para todos</tspan></text><rect x="370" y="148" width="18.495" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="396.495" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="396.495" dy="0">41,1 · 39 palabras, 1 frase</tspan></text><rect x="10" y="196" width="1040" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">El mismo hecho se lee con facilidad muy distinta según la audiencia. El texto que mezcla tres audiencias en una frase larga queda el más</tspan></text><text x="530" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">difícil, no por técnico sino por intentar servir a todos. El índice es una fórmula sobre sílabas y frases; no mide si el lector entiende.</tspan></text><text x="530" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Cuatro textos escritos por el autor; sílabas contadas con una regla aproximada; idéntico en Windows y Ubuntu.</tspan></text></svg>
