<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 291" width="1060" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un clasificador léxico de los cuatro tipos de Diátaxis sobre párrafos puros y mezclados</title><desc id="d">Barras: un clasificador por palabras clave acierta 200 de 200 párrafos puros de tutorial, how-to, referencia o explicación, pero ante 300 mezclas de dos tipos solo reconoce uno de los dos en 240 casos, declara ambiguas 60 y nunca reconoce los dos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="291" fill="#ffffff"/><text x="410" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Párrafos puros bien clasificados</tspan></text><rect x="420" y="16" width="320" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="748" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="748" dy="0">200 de 200</tspan></text><text x="410" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Mezclas de dos tipos: acierta uno de los dos</tspan></text><rect x="420" y="60" width="256" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="684" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="684" dy="0">240 de 300</tspan></text><text x="410" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Mezclas de dos tipos: marcadas ambiguas</tspan></text><rect x="420" y="104" width="64" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="492" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">60 de 300</tspan></text><text x="410" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">Mezclas: reconoce a la vez los dos tipos</tspan></text><rect x="420" y="148" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="432" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="432" dy="0">0 de 300</tspan></text><rect x="10" y="196" width="1040" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="530" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Los párrafos puros se escribieron con las mismas plantillas que usa el clasificador, por eso acierta todo: la cifra mide circularidad, no</tspan></text><text x="530" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">capacidad. Lo que sí muestra es que una página mezclada deja de tener un tipo claro, y una herramienta que debe elegir uno oculta el otro.</tspan></text><text x="530" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
