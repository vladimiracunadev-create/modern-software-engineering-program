<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 247" width="980" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un detector compara las opciones del README con las del analizador de argumentos (400 mutaciones)</title><desc id="d">Barras: el detector que compara las opciones escritas en el README con las reales detecta 125 de 125 renombrados y 135 de 135 eliminaciones, pero 0 de 140 cambios en los que la opción conserva su nombre y cambia de significado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="247" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Se renombra una opción</tspan></text><rect x="300" y="16" width="460" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="768" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="768" dy="0">125 de 125 detectadas</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Se elimina una opción</tspan></text><rect x="300" y="60" width="460" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="768" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="768" dy="0">135 de 135 detectadas</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">La opción cambia de significado</tspan></text><rect x="300" y="104" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="312" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="312" dy="0">0 de 140 detectadas</tspan></text><rect x="10" y="152" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El detector es barato y atrapa lo que deja huella en la interfaz. No ve que `--plazo` pase de horas a días: ese cambio solo lo</tspan></text><text x="490" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">detecta ejecutar el ejemplo y comprobar su salida.</tspan></text><text x="490" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
