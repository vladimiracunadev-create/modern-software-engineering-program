<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién llega al primer éxito según el número de pasos y la probabilidad de fallo por paso</title><desc id="d">Barras agrupadas con el porcentaje de 40 000 recorridos simulados que llegan al primer éxito frente al teórico (1 − p)ⁿ: con 4, 6 y 10 pasos y 3 por ciento de fallo por paso llegan 88,9, 82,9 y 73,6 por ciento; con 6 por ciento, 69,2 con 6 pasos y 53,9 con 10; el simulado y el teórico casi coinciden.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién llega al primer éxito según el número de pasos y la probabilidad de fallo por paso</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Simulado</tspan></text><rect x="124.32" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Teórico (1 − p)ⁿ</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">% que llega al primer éxito</text><rect x="95.4476" y="126.08" width="65.3104" height="248.92" rx="3" fill="#087f8c"/><text x="128.103" y="120.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="128.103" dy="0">88,9</tspan></text><rect x="164.758" y="127.2" width="65.3104" height="247.8" rx="3" fill="#6b7c86"/><text x="197.413" y="121.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.413" dy="0">88,5</tspan></text><text x="162.758" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="162.758" dy="0">4 pasos · 3 %</tspan></text><rect x="263.724" y="142.88" width="65.3104" height="232.12" rx="3" fill="#087f8c"/><text x="296.379" y="136.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="296.379" dy="0">82,9</tspan></text><rect x="333.034" y="141.76" width="65.3104" height="233.24" rx="3" fill="#6b7c86"/><text x="365.689" y="135.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="365.689" dy="0">83,3</tspan></text><text x="331.034" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="331.034" dy="0">6 pasos · 3 %</tspan></text><rect x="432" y="168.92" width="65.3104" height="206.08" rx="3" fill="#087f8c"/><text x="464.655" y="162.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="464.655" dy="0">73,6</tspan></text><rect x="501.31" y="168.64" width="65.3104" height="206.36" rx="3" fill="#6b7c86"/><text x="533.965" y="162.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="533.965" dy="0">73,7</tspan></text><text x="499.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">10 pasos · 3 %</tspan></text><rect x="600.276" y="181.24" width="65.3104" height="193.76" rx="3" fill="#087f8c"/><text x="632.931" y="175.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="632.931" dy="0">69,2</tspan></text><rect x="669.586" y="181.8" width="65.3104" height="193.2" rx="3" fill="#6b7c86"/><text x="702.241" y="175.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.241" dy="0">69,0</tspan></text><text x="667.586" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.586" dy="0">6 pasos · 6 %</tspan></text><rect x="768.552" y="224.08" width="65.3104" height="150.92" rx="3" fill="#087f8c"/><text x="801.207" y="218.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="801.207" dy="0">53,9</tspan></text><rect x="837.862" y="224.08" width="65.3104" height="150.92" rx="3" fill="#6b7c86"/><text x="870.517" y="218.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870.517" dy="0">53,9</tspan></text><text x="835.862" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.862" dy="0">10 pasos · 6 %</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Quitar pasos pesa tanto como mejorar cada uno: pasar de 10 a 6 pasos con 3 % de fallo recupera 9 puntos. Los porcentajes de</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fallo son supuestos, no mediciones de lectores; la forma multiplicativa es lo que se puede afirmar.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
