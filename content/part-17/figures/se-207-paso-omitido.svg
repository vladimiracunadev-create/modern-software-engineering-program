<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 519" width="970" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Omitir un paso del README: dónde aparece el primer fallo</title><desc id="d">Tabla de un README de seis pasos ejecutado seis veces, omitiendo cada vez uno: omitir los pasos 1 a 4 hace fallar entre 1 y 2 pasos después; omitir los pasos 5 o 6, los de comprobación, no falla en ningún paso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="519" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Paso omitido</tspan></text><rect x="270" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="342" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="342" dy="0">Primer fallo</tspan></text><rect x="420" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Distancia</tspan></text><rect x="540" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Mensaje que vería quien lo siga</tspan></text><rect x="10" y="56" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">1. Instalar Python</tspan></text><rect x="270" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">Paso 2</tspan></text><rect x="420" y="56" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">1</tspan></text><rect x="540" y="56" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">python: orden no encontrada</tspan></text><rect x="10" y="114" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">2. Crear el entorno</tspan></text><rect x="270" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">Paso 3</tspan></text><rect x="420" y="114" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">1</tspan></text><rect x="540" y="114" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">no existe .venv</tspan></text><rect x="10" y="172" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">3. Activar el entorno</tspan></text><rect x="270" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">Paso 5</tspan></text><rect x="420" y="172" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">2</tspan></text><rect x="540" y="172" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="193.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">entregas: orden no reconocida; el paquete quedó fuera del</tspan></text><text x="747" y="209.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">entorno</tspan></text><rect x="10" y="230" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">4. Instalar el paquete</tspan></text><rect x="270" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">Paso 5</tspan></text><rect x="420" y="230" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">1</tspan></text><rect x="540" y="230" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">entregas: orden no reconocida</tspan></text><rect x="10" y="288" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">5. Comprobar la versión</tspan></text><rect x="270" y="288" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">ninguno</tspan></text><rect x="420" y="288" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">—</tspan></text><rect x="540" y="288" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">El README «funciona»: no se pierde nada</tspan></text><rect x="10" y="346" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="375.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">6. Ejecutar el ejemplo</tspan></text><rect x="270" y="346" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">ninguno</tspan></text><rect x="420" y="346" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">—</tspan></text><rect x="540" y="346" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">El README «funciona»: no se aprende nada</tspan></text><rect x="10" y="408" width="950" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Los pasos de comprobación son los únicos que pueden desaparecer sin que nada falle, y son los que dan al lector la evidencia</tspan></text><text x="485" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">del primer éxito. Omitir la activación es el caso peor: el error aparece dos pasos después y lejos de la causa. Máquina de</tspan></text><text x="485" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">estados de seis reglas escrita por el autor, no una instalación real.</tspan></text><text x="485" y="505.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
