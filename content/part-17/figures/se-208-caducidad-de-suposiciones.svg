<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 305" width="1040" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que al menos una suposición de un ADR haya cambiado</title><desc id="d">Tabla de 20 000 simulaciones por celda: con 2 suposiciones y un cambio anual del 10 por ciento, la probabilidad de que alguna haya cambiado es 9,9 por ciento a 6 meses, 18,4 a 12 y 34,9 a 24; con 6 suposiciones y 25 por ciento anual sube a 57,8, 82,1 y 96,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="305" fill="#ffffff"/><rect x="10" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="97" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="97" dy="0">Suposiciones del ADR</tspan></text><rect x="190" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="267" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="267" dy="0">10 %/año · 6 m</tspan></text><rect x="350" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">12 m</tspan></text><rect x="480" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">24 m</tspan></text><rect x="610" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="687" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">25 %/año · 6 m</tspan></text><rect x="770" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">12 m</tspan></text><rect x="900" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="962" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="962" dy="0">24 m</tspan></text><rect x="10" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">2</tspan></text><rect x="190" y="56" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">9,9 %</tspan></text><rect x="350" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">18,4 %</tspan></text><rect x="480" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">34,9 %</tspan></text><rect x="610" y="56" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">24,9 %</tspan></text><rect x="770" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">43,9 %</tspan></text><rect x="900" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="962" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="962" dy="0">69,1 %</tspan></text><rect x="10" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">4</tspan></text><rect x="190" y="106" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">18,4 %</tspan></text><rect x="350" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">34,4 %</tspan></text><rect x="480" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">57,4 %</tspan></text><rect x="610" y="106" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">44,1 %</tspan></text><rect x="770" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">68,1 %</tspan></text><rect x="900" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="962" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="962" dy="0">90,2 %</tspan></text><rect x="10" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">6</tspan></text><rect x="190" y="156" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">26,9 %</tspan></text><rect x="350" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">47,0 %</tspan></text><rect x="480" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">71,6 %</tspan></text><rect x="610" y="156" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">57,8 %</tspan></text><rect x="770" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">82,1 %</tspan></text><rect x="900" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="962" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="962" dy="0">96,8 %</tspan></text><rect x="10" y="210" width="1020" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">Cuantas más suposiciones lleva una decisión, antes pierde vigencia alguna. Por eso un ADR útil enumera sus suposiciones y fija una fecha</tspan></text><text x="520" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">de revisión. Las tasas de cambio de 10 % y 25 % al año son supuestos del autor, no medidas sobre proyectos reales.</tspan></text><text x="520" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
