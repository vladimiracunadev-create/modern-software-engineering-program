<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 369" width="940" height="369" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que al menos una suposición de un ADR haya cambiado</title><desc id="d">Mapa de calor con la probabilidad de que cambie al menos una suposición según cuántas lleva el ADR y la tasa anual: con 2 suposiciones y 10 por ciento anual es 9,9 por ciento a 6 meses, 18,4 a 12 y 34,9 a 24; con 6 suposiciones y 25 por ciento anual sube a 57,8, 82,1 y 96,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="369" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de que al menos una suposición de un ADR haya cambiado</tspan></text><text x="236.167" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="236.167" dy="0">10 %/año · 6 m</tspan></text><text x="360.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="360.5" dy="0">10 %/año · 12 m</tspan></text><text x="484.833" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="484.833" dy="0">10 %/año · 24 m</tspan></text><text x="609.167" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="609.167" dy="0">25 %/año · 6 m</tspan></text><text x="733.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="733.5" dy="0">25 %/año · 12 m</tspan></text><text x="857.833" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.833" dy="0">25 %/año · 24 m</tspan></text><text x="164" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">2 suposiciones</tspan></text><text x="164" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">4 suposiciones</tspan></text><text x="164" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">6 suposiciones</tspan></text><rect x="175.5" y="73.5" width="121.333" height="41" rx="4" fill="#eddeb6" stroke="#ffffff" stroke-width="1"/><text x="236.167" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="236.167" dy="0">9,9 %</tspan></text><rect x="299.833" y="73.5" width="121.333" height="41" rx="4" fill="#e5d2a7" stroke="#ffffff" stroke-width="1"/><text x="360.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="360.5" dy="0">18,4 %</tspan></text><rect x="424.167" y="73.5" width="121.333" height="41" rx="4" fill="#d4bc88" stroke="#ffffff" stroke-width="1"/><text x="484.833" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="484.833" dy="0">34,9 %</tspan></text><rect x="548.5" y="73.5" width="121.333" height="41" rx="4" fill="#deca9b" stroke="#ffffff" stroke-width="1"/><text x="609.167" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="609.167" dy="0">24,9 %</tspan></text><rect x="672.833" y="73.5" width="121.333" height="41" rx="4" fill="#ccb078" stroke="#ffffff" stroke-width="1"/><text x="733.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="733.5" dy="0">43,9 %</tspan></text><rect x="797.167" y="73.5" width="121.333" height="41" rx="4" fill="#b38e4a" stroke="#ffffff" stroke-width="1"/><text x="857.833" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.833" dy="0">69,1 %</tspan></text><rect x="175.5" y="117.5" width="121.333" height="41" rx="4" fill="#e5d2a7" stroke="#ffffff" stroke-width="1"/><text x="236.167" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="236.167" dy="0">18,4 %</tspan></text><rect x="299.833" y="117.5" width="121.333" height="41" rx="4" fill="#d5bd89" stroke="#ffffff" stroke-width="1"/><text x="360.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="360.5" dy="0">34,4 %</tspan></text><rect x="424.167" y="117.5" width="121.333" height="41" rx="4" fill="#be9e60" stroke="#ffffff" stroke-width="1"/><text x="484.833" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="484.833" dy="0">57,4 %</tspan></text><rect x="548.5" y="117.5" width="121.333" height="41" rx="4" fill="#cbb078" stroke="#ffffff" stroke-width="1"/><text x="609.167" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="609.167" dy="0">44,1 %</tspan></text><rect x="672.833" y="117.5" width="121.333" height="41" rx="4" fill="#b4904c" stroke="#ffffff" stroke-width="1"/><text x="733.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="733.5" dy="0">68,1 %</tspan></text><rect x="797.167" y="117.5" width="121.333" height="41" rx="4" fill="#9e7224" stroke="#ffffff" stroke-width="1"/><text x="857.833" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857.833" dy="0">90,2 %</tspan></text><rect x="175.5" y="161.5" width="121.333" height="41" rx="4" fill="#dcc797" stroke="#ffffff" stroke-width="1"/><text x="236.167" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="236.167" dy="0">26,9 %</tspan></text><rect x="299.833" y="161.5" width="121.333" height="41" rx="4" fill="#c8ac72" stroke="#ffffff" stroke-width="1"/><text x="360.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="360.5" dy="0">47,0 %</tspan></text><rect x="424.167" y="161.5" width="121.333" height="41" rx="4" fill="#b08b46" stroke="#ffffff" stroke-width="1"/><text x="484.833" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="484.833" dy="0">71,6 %</tspan></text><rect x="548.5" y="161.5" width="121.333" height="41" rx="4" fill="#be9e5f" stroke="#ffffff" stroke-width="1"/><text x="609.167" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="609.167" dy="0">57,8 %</tspan></text><rect x="672.833" y="161.5" width="121.333" height="41" rx="4" fill="#a67d33" stroke="#ffffff" stroke-width="1"/><text x="733.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="733.5" dy="0">82,1 %</tspan></text><rect x="797.167" y="161.5" width="121.333" height="41" rx="4" fill="#976918" stroke="#ffffff" stroke-width="1"/><text x="857.833" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857.833" dy="0">96,8 %</tspan></text><text x="174" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174" dy="0">0,0 %</tspan></text><rect x="219.7" y="218" width="30.5" height="14" fill="#f7ebc8"/><rect x="249.7" y="218" width="30.5" height="14" fill="#e9d8ae"/><rect x="279.7" y="218" width="30.5" height="14" fill="#dbc594"/><rect x="309.7" y="218" width="30.5" height="14" fill="#cdb27a"/><rect x="339.7" y="218" width="30.5" height="14" fill="#be9e60"/><rect x="369.7" y="218" width="30.5" height="14" fill="#b08b46"/><rect x="399.7" y="218" width="30.5" height="14" fill="#a2782c"/><rect x="429.7" y="218" width="30.5" height="14" fill="#946512"/><text x="467.7" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="467.7" dy="0">100,0 %</tspan></text><text x="528.48" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="528.48" dy="0">más oscuro = mayor (% de ADR con alguna suposición cambiada)</tspan></text><rect x="10" y="246" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cuantas más suposiciones lleva una decisión, antes pierde vigencia alguna. Por eso un ADR útil enumera sus suposiciones y</tspan></text><text x="470" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fija una fecha de revisión. Las tasas de cambio de 10 % y 25 % al año son supuestos del autor, no medidas sobre proyectos</tspan></text><text x="470" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reales (20 000 simulaciones por celda).</tspan></text><text x="470" y="351.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
