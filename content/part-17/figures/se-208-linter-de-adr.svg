<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 498" width="940" height="498" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un linter de ADR sobre 300 registros con defectos conocidos</title><desc id="d">Barras horizontales apiladas con lo que detecta un linter de ADR en 300 registros sintéticos: ve las 54 secciones ausentes y las 45 fechas ilegibles, pero ninguna de las 54 alternativas vacías, 60 consecuencias vacías ni 46 contextos sin razón, y no marca ninguno de los 41 registros correctos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="498" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un linter de ADR sobre 300 registros con defectos conocidos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectados</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectados</tspan></text><rect x="285.42" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="305.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="305.42" dy="0">Correctos sin falsa alarma</tspan></text><line x1="264" y1="77" x2="264" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="264" y1="317" x2="264" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="264" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="264" dy="0">0</tspan></text><line x1="467.9" y1="77" x2="467.9" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="467.9" y1="317" x2="467.9" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="467.9" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467.9" dy="0">20</tspan></text><line x1="671.8" y1="77" x2="671.8" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="671.8" y1="317" x2="671.8" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="671.8" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="671.8" dy="0">40</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="317" x2="875.7" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">60</tspan></text><line x1="264" y1="317" x2="875.7" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="254" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Falta una sección</tspan></text><text x="254" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Fecha ilegible («ayer»)</tspan></text><text x="254" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Alternativas: «Ninguna.»</tspan></text><text x="254" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Consecuencias: «Ninguna.»</tspan></text><text x="254" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Contexto: «Nada especial.»</tspan></text><text x="254" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">ADR correcto</tspan></text><rect x="264" y="84" width="550.53" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="539.265" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="539.265" dy="0">54</tspan></text><rect x="814.53" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="814.53" y="84" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="821.53" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="821.53" dy="0">54</tspan></text><rect x="264" y="124" width="458.775" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="493.388" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="493.388" dy="0">45</tspan></text><rect x="722.775" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="722.775" y="124" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="729.775" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="729.775" dy="0">45</tspan></text><rect x="264" y="164" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="264" y="164" width="550.53" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="539.265" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="539.265" dy="0">54</tspan></text><rect x="814.53" y="164" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="821.53" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="821.53" dy="0">54</tspan></text><rect x="264" y="204" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="264" y="204" width="611.7" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="569.85" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="569.85" dy="0">60</tspan></text><rect x="875.7" y="204" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">60</tspan></text><rect x="264" y="244" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="264" y="244" width="468.97" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="498.485" y="261.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="498.485" dy="0">46</tspan></text><rect x="732.97" y="244" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="739.97" y="261.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="739.97" dy="0">46</tspan></text><rect x="264" y="284" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="264" y="284" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="264" y="284" width="417.995" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="472.998" y="301.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472.998" dy="0">41</tspan></text><text x="688.995" y="301.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="688.995" dy="0">41</tspan></text><text x="569.85" y="361" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="569.85" dy="0">registros</tspan></text><rect x="10" y="375" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El linter comprueba forma: presencia, formato, vocabulario. Un ADR con «Alternativas: Ninguna.» tiene todas las secciones y</tspan></text><text x="470" y="416.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">no contiene ninguna decisión defendible. La calidad del razonamiento la revisan personas, con una pregunta concreta: ¿qué</tspan></text><text x="470" y="433.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">se descartó y por qué?</tspan></text><text x="470" y="480.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
