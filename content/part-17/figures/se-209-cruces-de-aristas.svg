<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cruces de aristas en un diagrama de cuatro capas: orden aleatorio frente a orden por baricentro</title><desc id="d">Barras agrupadas con la media de cruces de 150 grafos por tamaño: con 4 nodos por capa el orden aleatorio produce 27,1 cruces y el orden por baricentro 11,4; con 8 nodos 149,6 y 55,5; con 16 nodos 672,9 y 240,3, una reducción de 58 a 64 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cruces de aristas en un diagrama de cuatro capas: orden aleatorio frente a orden por baricentro</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Orden aleatorio</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Con baricentro (4 pasadas)</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="305" x2="78.62" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="235" x2="78.62" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="165" x2="78.62" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">600</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">800</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">cruces de aristas</text><rect x="106.666" y="365.515" width="110.184" height="9.485" rx="3" fill="#c0432f"/><text x="161.758" y="359.515" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">27,1</tspan></text><rect x="220.85" y="371.01" width="110.184" height="3.99" rx="3" fill="#087f8c"/><text x="275.942" y="365.01" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">11,4</tspan></text><text x="218.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">4 por capa · 24 aristas</tspan></text><rect x="387.126" y="322.64" width="110.184" height="52.36" rx="3" fill="#c0432f"/><text x="442.218" y="316.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">149,6</tspan></text><rect x="501.31" y="355.575" width="110.184" height="19.425" rx="3" fill="#087f8c"/><text x="556.402" y="349.575" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">55,5</tspan></text><text x="499.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">8 por capa · 48 aristas</tspan></text><rect x="667.586" y="139.485" width="110.184" height="235.515" rx="3" fill="#c0432f"/><text x="722.678" y="133.485" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">672,9</tspan></text><rect x="781.77" y="290.895" width="110.184" height="84.105" rx="3" fill="#087f8c"/><text x="836.862" y="284.895" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">240,3</tspan></text><text x="779.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">16 por capa · 96 aristas</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La reducción es de −58 %, −63 % y −64 %. Cuadruplicar el tamaño multiplica los cruces por 25: un diagrama que cabe en una</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pantalla con 12 nodos deja de leerse con 48. Ordenar las capas ayuda mucho y no elimina el problema; la solución de fondo</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es dibujar menos cosas por diagrama.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
