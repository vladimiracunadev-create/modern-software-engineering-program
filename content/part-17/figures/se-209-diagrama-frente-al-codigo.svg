<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" width="960" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de dependencias frente a lo que importa el código de diez módulos</title><desc id="d">Tabla de un paquete sintético de diez módulos: de 16 dependencias reales el análisis estático ve 14 y 13 si solo mira el nivel de módulo; 2 son dinámicas y quedan invisibles; el diagrama declarado tiene 2 aristas de más y le faltan 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="495" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Conteo</tspan></text><rect x="380" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Valor</tspan></text><rect x="470" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">Qué incluye</tspan></text><rect x="10" y="56" width="364" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Aristas reales del código</tspan></text><rect x="380" y="56" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">16</tspan></text><rect x="470" y="56" width="474" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">12 declaradas + 3 añadidas + 2 dinámicas + 1 diferida − 2 retiradas</tspan></text><rect x="10" y="110" width="364" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Las ve un análisis estático de `import`</tspan></text><rect x="380" y="110" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">14</tspan></text><rect x="470" y="110" width="474" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">Incluye la importación dentro de una función</tspan></text><rect x="10" y="164" width="364" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Solo las de nivel de módulo</tspan></text><rect x="380" y="164" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">13</tspan></text><rect x="470" y="164" width="474" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">La importación diferida queda fuera</tspan></text><rect x="10" y="218" width="364" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Invisibles para el análisis</tspan></text><rect x="380" y="218" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">2</tspan></text><rect x="470" y="218" width="474" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">`importlib.import_module` con nombre en texto</tspan></text><rect x="10" y="272" width="364" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="299.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Sobran en el diagrama</tspan></text><rect x="380" y="272" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">2</tspan></text><rect x="470" y="272" width="474" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">Dependencias retiradas del código</tspan></text><rect x="10" y="326" width="364" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="353.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Faltan en el diagrama</tspan></text><rect x="380" y="326" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">4</tspan></text><rect x="470" y="326" width="474" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">Dependencias añadidas sin actualizar</tspan></text><rect x="10" y="384" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="408.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Comparar el diagrama con el código convierte «creo que está al día» en una lista de diferencias concretas. El análisis tiene</tspan></text><text x="480" y="425.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">un techo: lo que se decide en tiempo de ejecución no deja huella en el árbol sintáctico, y esas aristas hay que declararlas en</tspan></text><text x="480" y="442.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">el diagrama con otra fuente.</tspan></text><text x="480" y="481.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
