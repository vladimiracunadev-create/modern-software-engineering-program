<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" width="940" height="492" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de dependencias frente a lo que importa el código de diez módulos</title><desc id="d">Barras horizontales sobre un paquete sintético de diez módulos: de 16 dependencias reales el análisis estático ve 14 y 13 si solo mira el nivel de módulo, 2 quedan invisibles por ser dinámicas, y el diagrama declarado tiene 2 aristas de más y le faltan 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="492" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diagrama de dependencias frente a lo que importa el código de diez módulos</tspan></text><line x1="324" y1="49" x2="324" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="277" x2="324" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="467.97" y1="49" x2="467.97" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="467.97" y1="277" x2="467.97" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="467.97" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467.97" dy="0">5</tspan></text><line x1="611.94" y1="49" x2="611.94" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="611.94" y1="277" x2="611.94" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="611.94" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="611.94" dy="0">10</tspan></text><line x1="755.91" y1="49" x2="755.91" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="755.91" y1="277" x2="755.91" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="755.91" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.91" dy="0">15</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="277" x2="899.88" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">20</tspan></text><line x1="324" y1="277" x2="899.88" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Aristas reales del código</tspan></text><text x="314" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Las ve un análisis estático de import</tspan></text><text x="314" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Solo las de nivel de módulo</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Invisibles para el análisis</tspan></text><text x="314" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Sobran en el diagrama</tspan></text><text x="314" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Faltan en el diagrama</tspan></text><rect x="324" y="55" width="460.704" height="26" rx="3" fill="#087f8c"/><text x="791.704" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="791.704" dy="0">16</tspan></text><rect x="324" y="93" width="403.116" height="26" rx="3" fill="#087f8c"/><text x="734.116" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="734.116" dy="0">14</tspan></text><rect x="324" y="131" width="374.322" height="26" rx="3" fill="#087f8c"/><text x="705.322" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="705.322" dy="0">13</tspan></text><rect x="324" y="169" width="57.588" height="26" rx="3" fill="#087f8c"/><text x="388.588" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="388.588" dy="0">2</tspan></text><rect x="324" y="207" width="57.588" height="26" rx="3" fill="#087f8c"/><text x="388.588" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="388.588" dy="0">2</tspan></text><rect x="324" y="245" width="115.176" height="26" rx="3" fill="#087f8c"/><text x="446.176" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="446.176" dy="0">4</tspan></text><text x="611.94" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="611.94" dy="0">dependencias</tspan></text><rect x="10" y="335" width="920" height="109.2" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Las 16 reales son 12 declaradas + 3 añadidas + 2 dinámicas + 1 diferida − 2 retiradas. Las 14 incluyen la importación</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">dentro de una función; la diferida queda fuera de las 13; las 2 invisibles usan importlib.import_module con el nombre en</tspan></text><text x="470" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">texto; las 2 que sobran son dependencias retiradas del código y las 4 que faltan, añadidas sin actualizar. Comparar el</tspan></text><text x="470" y="409.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">diagrama con el código convierte «creo que está al día» en una lista de diferencias concretas; el análisis tiene un techo:</tspan></text><text x="470" y="426.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">lo que se decide en tiempo de ejecución no deja huella en el árbol sintáctico.</tspan></text><text x="470" y="474.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
