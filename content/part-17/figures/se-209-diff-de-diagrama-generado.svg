<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diff de un diagrama generado: ruido entre ejecuciones y cambio real</title><desc id="d">Barras agrupadas con las líneas distintas entre salidas Mermaid de un modelo de 12 servicios y 18 dependencias: si el generador recorre un conjunto, dos ejecuciones del mismo modelo difieren en 42 líneas y renombrar un servicio produce 10; si ordena, 0 y 8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diff de un diagrama generado: ruido entre ejecuciones y cambio real</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aristas en el orden de un conjunto</tspan></text><rect x="320.36" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="340.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="340.36" dy="0">Aristas ordenadas</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="319" x2="71.08" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="263" x2="71.08" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="207" x2="71.08" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="151" x2="71.08" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">50</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">líneas de diff</text><rect x="113.526" y="139.8" width="167.784" height="235.2" rx="3" fill="#c0432f"/><text x="197.418" y="133.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.418" dy="0">42</tspan></text><rect x="285.31" y="373" width="167.784" height="2" rx="3" fill="#087f8c"/><text x="369.202" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="369.202" dy="0">0</tspan></text><text x="283.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">Dos ejecuciones del mismo modelo</tspan></text><rect x="537.986" y="319" width="167.784" height="56" rx="3" fill="#c0432f"/><text x="621.878" y="313" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="621.878" dy="0">10</tspan></text><rect x="709.77" y="330.2" width="167.784" height="44.8" rx="3" fill="#087f8c"/><text x="793.662" y="324.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="793.662" dy="0">8</tspan></text><text x="707.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">Al renombrar un servicio</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con orden no determinista, una revisión no distingue el cambio real del ruido: 42 líneas de diff sin que cambie nada. El</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">renombrado real cambia 4 líneas (el nodo y sus 3 dependencias), que el diff cuenta como 4 eliminadas y 4 añadidas: 8.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Dos ejecuciones con PYTHONHASHSEED=1 y 2; idéntico en Windows y Ubuntu.</tspan></text></svg>
