<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 275" width="970" height="275" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diff de un diagrama generado: ruido entre ejecuciones y cambio real</title><desc id="d">Tabla de líneas distintas entre salidas Mermaid de un modelo de 12 servicios y 18 dependencias: si el generador recorre un conjunto, dos ejecuciones del mismo modelo difieren en 42 líneas y renombrar un servicio produce 10; si ordena, 0 y 8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="275" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Generador</tspan></text><rect x="410" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">Líneas de diff entre dos</tspan></text><text x="547" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">ejecuciones del mismo modelo</tspan></text><rect x="690" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Líneas de diff al renombrar un</tspan></text><text x="822" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">servicio</tspan></text><rect x="10" y="56" width="394" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="86.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Aristas en el orden de un conjunto</tspan></text><rect x="410" y="56" width="274" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">42</tspan></text><rect x="690" y="56" width="264" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">10</tspan></text><rect x="10" y="116" width="394" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="146.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Aristas ordenadas</tspan></text><rect x="410" y="116" width="274" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">0</tspan></text><rect x="690" y="116" width="264" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">8</tspan></text><rect x="10" y="180" width="950" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="204.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Con orden no determinista, una revisión no distingue el cambio real del ruido: 42 líneas de diff sin que cambie nada. El</tspan></text><text x="485" y="221.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">renombrado real cambia 4 líneas (el nodo y sus 3 dependencias), que el diff cuenta como 4 eliminadas y 4 añadidas: 8.</tspan></text><text x="485" y="261.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Dos ejecuciones con PYTHONHASHSEED=1 y 2; idéntico en Windows y Ubuntu.</tspan></text></svg>
