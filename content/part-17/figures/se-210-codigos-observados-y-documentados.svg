<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 439" width="1000" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">600 peticiones de prueba a un servicio local: códigos devueltos frente a códigos documentados</title><desc id="d">Barras de 600 peticiones aleatorias a un servidor local que documenta solo 200, 201 y 404: 330 respuestas, el 55 por ciento, llevan códigos no documentados: 405 con 207, 400 con 64, 413 con 38 y 422 con 21.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="439" fill="#ffffff"/><text x="240" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">404 (documentado)</tspan></text><rect x="250" y="16" width="332.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="590.8" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="590.8" dy="0">208</tspan></text><text x="240" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">405 (no documentado)</tspan></text><rect x="250" y="60" width="331.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="589.2" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="589.2" dy="0">207</tspan></text><text x="240" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">400 (no documentado)</tspan></text><rect x="250" y="104" width="102.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="360.4" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="360.4" dy="0">64</tspan></text><text x="240" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">200 (documentado)</tspan></text><rect x="250" y="148" width="92.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="350.8" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="350.8" dy="0">58</tspan></text><text x="240" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">413 (no documentado)</tspan></text><rect x="250" y="192" width="60.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="318.8" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="318.8" dy="0">38</tspan></text><text x="240" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">422 (no documentado)</tspan></text><rect x="250" y="236" width="33.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="291.6" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="291.6" dy="0">21</tspan></text><text x="240" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">201 (documentado)</tspan></text><rect x="250" y="280" width="6.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="264.4" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="264.4" dy="0">4</tspan></text><rect x="10" y="328" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">La documentación cubre los caminos felices y deja sin explicar más de la mitad de lo que ve un cliente que se equivoca. El 413 se</tspan></text><text x="500" y="369.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">produjo al enviar cuerpos de más de 200 bytes; en Windows el servidor debe leer el cuerpo antes de responder o el cliente ve la</tspan></text><text x="500" y="386.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">conexión abortada.</tspan></text><text x="500" y="425.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Servidor y cliente locales en 127.0.0.1; semilla fija; mismos recuentos en Windows y Ubuntu.</tspan></text></svg>
