 rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">118</tspan></text><rect x="570" y="320" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">181</tspan></text><rect x="740" y="320" width="214" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">144</tspan></text><rect x="10" y="368" width="950" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="392.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Tener docstring no es documentar los parámetros: en csv y argparse las clases tienen texto pero el recuento de parámetros de</tspan></text><text x="485" y="409.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">funciones es cero porque son clases; en re uno de cada tres parámetros no se nombra. Medimos presencia, no calidad.</tspan></text><text x="485" y="449.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con inspect en CPython 3.12.9 (Windows) y 3.12.3 (Ubuntu); idéntico.</tspan></text></svg>
