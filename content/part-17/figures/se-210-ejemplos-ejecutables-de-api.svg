<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 467" width="940" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez ejemplos ejecutables de una API frente a cinco cambios del proveedor</title><desc id="d">Barras con los ejemplos que fallan de diez ejecutados contra una API tras cada cambio: sin cambios 0, con el campo renombrado 4, con el estado 201 cambiado a 200 fallan 2, con el id pasado a texto 2 y con la ruta movida 2; una comparación de nombres de campos solo detecta el renombrado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="467" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diez ejemplos ejecutables de una API frente a cinco cambios del proveedor</tspan></text><line x1="354" y1="49" x2="354" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="269" x2="354" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="464.788" y1="49" x2="464.788" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="464.788" y1="269" x2="464.788" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="464.788" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="464.788" dy="0">2</tspan></text><line x1="575.576" y1="49" x2="575.576" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="575.576" y1="269" x2="575.576" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="575.576" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575.576" dy="0">4</tspan></text><line x1="686.364" y1="49" x2="686.364" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="686.364" y1="269" x2="686.364" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="686.364" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686.364" dy="0">6</tspan></text><line x1="797.152" y1="49" x2="797.152" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="797.152" y1="269" x2="797.152" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="797.152" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797.152" dy="0">8</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="269" x2="907.94" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">10</tspan></text><line x1="354" y1="269" x2="907.94" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin cambios</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Campo renombrado (horas_retraso) · lo ve la</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">comparación de nombres</tspan></text><text x="344" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Estado 201 pasa a 200</tspan></text><text x="344" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">El id pasa a texto</tspan></text><text x="344" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Ruta /penalizacion movida</tspan></text><rect x="354" y="55" width="2" height="32" rx="3" fill="#087f8c"/><text x="363" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="99" width="221.576" height="32" rx="3" fill="#087f8c"/><text x="582.576" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="582.576" dy="0">4</tspan></text><rect x="354" y="143" width="110.788" height="32" rx="3" fill="#087f8c"/><text x="471.788" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="471.788" dy="0">2</tspan></text><rect x="354" y="187" width="110.788" height="32" rx="3" fill="#087f8c"/><text x="471.788" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="471.788" dy="0">2</tspan></text><rect x="354" y="231" width="110.788" height="32" rx="3" fill="#087f8c"/><text x="471.788" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="471.788" dy="0">2</tspan></text><text x="630.97" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">ejemplos que fallan de 10</tspan></text><rect x="10" y="327" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Solo el renombrado lo detecta una comparación de nombres de campo; los otros cuatro cambios solo los ve ejecutar los</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ejemplos. Ejecutar los ejemplos de la documentación detecta cambios de estado, de tipo y de ruta que una lista de campos no</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ve. Cada cambio deja un patrón distinto de ejemplos rotos, lo que ayuda a localizarlo. Un ejemplo que no se ejecuta es una</tspan></text><text x="470" y="401.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">promesa sin comprobar.</tspan></text><text x="470" y="449.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
