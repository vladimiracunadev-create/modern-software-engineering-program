<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 351" width="1060" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué fracción de los incidentes cubren los primeros k runbooks (64 tipos, reparto de Zipf)</title><desc id="d">Barras con la cobertura de 300 incidentes simulados repetidos 200 veces: 4 runbooks cubren el 50,8 por ciento, 8 el 62,9, 16 el 73,9, 32 el 83,4; el 8 por ciento de incidentes de tipo nuevo no está cubierto por ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="351" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Runbooks para los 4 síntomas más frecuentes</tspan></text><rect x="370" y="16" width="45.72" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="423.72" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="423.72" dy="0">50,8 % de los incidentes</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">8 síntomas</tspan></text><rect x="370" y="60" width="56.61" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="434.61" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="434.61" dy="0">62,9 %</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">16 síntomas</tspan></text><rect x="370" y="104" width="66.51" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="444.51" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="444.51" dy="0">73,9 %</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">32 síntomas (la mitad de los tipos)</tspan></text><rect x="370" y="148" width="75.06" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="453.06" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="453.06" dy="0">83,4 %</tspan></text><text x="360" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Techo: 8 % de incidentes de tipo nuevo</tspan></text><rect x="370" y="192" width="82.8" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="460.8" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="460.8" dy="0">92 % como máximo</tspan></text><rect x="10" y="240" width="1040" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">Los primeros runbooks rinden mucho y los siguientes cada vez menos: de 16 a 32 hacen falta el doble de documentos para ganar 9,5 puntos. El</tspan></text><text x="530" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">reparto de Zipf con exponente 1,2 y el 8 % de incidentes nuevos son supuestos; en una organización real se estiman con su propio historial</tspan></text><text x="530" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">de incidentes.</tspan></text><text x="530" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
