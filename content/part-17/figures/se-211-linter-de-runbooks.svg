<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un linter de runbooks sobre 40 textos con riesgos sembrados</title><desc id="d">Barras horizontales apiladas con lo que marca un linter por expresiones regulares en 40 runbooks: detecta las 3 órdenes destructivas, las 9 contraseñas y las 5 direcciones internas, marca 10 advertencias inocentes como peligro, no ve 6 órdenes ofuscadas y no da alarma en 7 runbooks limpios.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un linter de runbooks sobre 40 textos con riesgos sembrados</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectados</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Falsa alarma</tspan></text><rect x="277.88" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="297.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="297.88" dy="0">No detectados</tspan></text><rect x="423.9" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="443.9" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="443.9" dy="0">Limpios sin alarma</tspan></text><line x1="294" y1="77" x2="294" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="317" x2="294" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="410.34" y1="77" x2="410.34" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="410.34" y1="317" x2="410.34" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="410.34" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410.34" dy="0">2</tspan></text><line x1="526.68" y1="77" x2="526.68" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="526.68" y1="317" x2="526.68" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="526.68" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="526.68" dy="0">4</tspan></text><line x1="643.02" y1="77" x2="643.02" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="643.02" y1="317" x2="643.02" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="643.02" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="643.02" dy="0">6</tspan></text><line x1="759.36" y1="77" x2="759.36" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="759.36" y1="317" x2="759.36" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="759.36" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.36" dy="0">8</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="317" x2="875.7" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10</tspan></text><line x1="294" y1="317" x2="875.7" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Orden destructiva (rm -rf)</tspan></text><text x="284" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Contraseña en el texto</tspan></text><text x="284" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Dirección IP interna</tspan></text><text x="284" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Advertencia «nunca ejecutes rm -rf»</tspan></text><text x="284" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Orden ofuscada (r&#x27;&#x27;m -rf)</tspan></text><text x="284" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Runbook limpio</tspan></text><rect x="294" y="84" width="174.51" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="381.255" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="381.255" dy="0">3</tspan></text><rect x="468.51" y="84" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="468.51" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="468.51" y="84" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="475.51" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="475.51" dy="0">3</tspan></text><rect x="294" y="124" width="523.53" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="555.765" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="555.765" dy="0">9</tspan></text><rect x="817.53" y="124" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="817.53" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="817.53" y="124" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="824.53" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="824.53" dy="0">9</tspan></text><rect x="294" y="164" width="290.85" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="439.425" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="439.425" dy="0">5</tspan></text><rect x="584.85" y="164" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="584.85" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="584.85" y="164" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="591.85" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="591.85" dy="0">5</tspan></text><rect x="294" y="204" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="204" width="581.7" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">10</tspan></text><rect x="875.7" y="204" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="875.7" y="204" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">10</tspan></text><rect x="294" y="244" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="244" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="244" width="349.02" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="468.51" y="261.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="468.51" dy="0">6</tspan></text><rect x="643.02" y="244" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="650.02" y="261.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="650.02" dy="0">6</tspan></text><rect x="294" y="284" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="284" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="284" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="284" width="407.19" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="497.595" y="301.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497.595" dy="0">7</tspan></text><text x="708.19" y="301.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="708.19" dy="0">7</tspan></text><text x="584.85" y="361" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">runbooks</tspan></text><rect x="10" y="375" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una regla léxica no distingue ejecutar de advertir contra ejecutar, y se salta lo que se escribe distinto. Sirve como red</tspan></text><text x="470" y="416.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">antes de la revisión humana, no como garantía; cada patrón nuevo se justifica con un caso real que se coló.</tspan></text><text x="470" y="464.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
