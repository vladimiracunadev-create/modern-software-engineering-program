<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 443" width="970" height="443" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un linter de runbooks sobre 40 textos con riesgos sembrados</title><desc id="d">Tabla de un linter por expresiones regulares sobre 40 runbooks: detecta las 3 órdenes destructivas, las 9 contraseñas y las 5 direcciones internas, marca 10 advertencias inocentes como peligro, no ve 6 órdenes ofuscadas y no da alarma en 7 runbooks limpios.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="443" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Caso</tspan></text><rect x="380" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Runbooks</tspan></text><rect x="500" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Marcados</tspan></text><rect x="620" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Lectura</tspan></text><rect x="10" y="56" width="364" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="80.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Orden destructiva (`rm -rf`)</tspan></text><rect x="380" y="56" width="114" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="80.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">3</tspan></text><rect x="500" y="56" width="114" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="80.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">3</tspan></text><rect x="620" y="56" width="334" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="80.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Detectada</tspan></text><rect x="10" y="104" width="364" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="128.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Contraseña en el texto</tspan></text><rect x="380" y="104" width="114" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="128.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">9</tspan></text><rect x="500" y="104" width="114" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="128.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">9</tspan></text><rect x="620" y="104" width="334" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="128.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Detectada</tspan></text><rect x="10" y="152" width="364" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="176.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Dirección IP interna</tspan></text><rect x="380" y="152" width="114" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="176.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">5</tspan></text><rect x="500" y="152" width="114" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="176.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">5</tspan></text><rect x="620" y="152" width="334" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="176.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Detectada</tspan></text><rect x="10" y="200" width="364" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="224.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Advertencia «nunca ejecutes `rm -rf`»</tspan></text><rect x="380" y="200" width="114" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="224.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">10</tspan></text><rect x="500" y="200" width="114" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="224.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">10</tspan></text><rect x="620" y="200" width="334" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="224.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Falsa alarma: es una advertencia</tspan></text><rect x="10" y="248" width="364" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="272.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Orden ofuscada (`r&#x27;&#x27;m -rf`)</tspan></text><rect x="380" y="248" width="114" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="272.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">6</tspan></text><rect x="500" y="248" width="114" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="272.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">0</tspan></text><rect x="620" y="248" width="334" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="272.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">No detectada</tspan></text><rect x="10" y="296" width="364" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="320.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Runbook limpio</tspan></text><rect x="380" y="296" width="114" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="320.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">7</tspan></text><rect x="500" y="296" width="114" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="320.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">0</tspan></text><rect x="620" y="296" width="334" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="320.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Sin falsas alarmas</tspan></text><rect x="10" y="348" width="950" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Una regla léxica no distingue ejecutar de advertir contra ejecutar, y se salta lo que se escribe distinto. Sirve como red antes</tspan></text><text x="485" y="389.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">de la revisión humana, no como garantía; cada patrón nuevo se justifica con un caso real que se coló.</tspan></text><text x="485" y="429.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
