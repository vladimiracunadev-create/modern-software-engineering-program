<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 507" width="970" height="507" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ejecutar cada paso de un runbook dos veces: ¿queda el mismo estado?</title><desc id="d">Tabla de ocho pasos ejecutados dos veces sobre un estado simulado: cuatro dejan el mismo estado, tres lo cambian (añadir una línea, subir una réplica, rotar el registro) y uno falla al repetirse (crear el usuario temporal); reanudar desde el paso interrumpido acierta las 8 veces y volver a empezar solo 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="507" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Paso del runbook</tspan></text><rect x="460" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Segunda ejecución</tspan></text><rect x="650" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Por qué</tspan></text><rect x="10" y="56" width="444" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="77.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Añadir una línea al archivo de configuración</tspan></text><rect x="460" y="56" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Difiere</tspan></text><rect x="650" y="56" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Se duplica la línea</tspan></text><rect x="10" y="98" width="444" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="119.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Subir una réplica</tspan></text><rect x="460" y="98" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Difiere</tspan></text><rect x="650" y="98" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Cada repetición suma otra</tspan></text><rect x="10" y="140" width="444" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Poner el modo mantenimiento</tspan></text><rect x="460" y="140" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Igual</tspan></text><rect x="650" y="140" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Fija un valor</tspan></text><rect x="10" y="182" width="444" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="203.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Crear el usuario temporal</tspan></text><rect x="460" y="182" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Falla</tspan></text><rect x="650" y="182" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">«ya existe»: aborta el procedimiento</tspan></text><rect x="10" y="224" width="444" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Vaciar la cola</tspan></text><rect x="460" y="224" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Igual</tspan></text><rect x="650" y="224" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Fija un valor</tspan></text><rect x="10" y="266" width="444" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Rotar el registro</tspan></text><rect x="460" y="266" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Difiere</tspan></text><rect x="650" y="266" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Cada repetición añade 120 líneas</tspan></text><rect x="10" y="308" width="444" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="329.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Fijar 3 réplicas</tspan></text><rect x="460" y="308" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Igual</tspan></text><rect x="650" y="308" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Fija un valor</tspan></text><rect x="10" y="350" width="444" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="371.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Volver al modo normal</tspan></text><rect x="460" y="350" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Igual</tspan></text><rect x="650" y="350" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Fija un valor</tspan></text><rect x="10" y="396" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Reanudar desde el paso k deja el estado esperado en las 8 interrupciones posibles; volver a empezar solo en 1 (la interrupción</tspan></text><text x="485" y="437.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">antes del primer paso). Un runbook es seguro de repetir cuando sus pasos fijan valores en lugar de añadir cambios. Estado y</tspan></text><text x="485" y="454.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">pasos escritos por el autor.</tspan></text><text x="485" y="493.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
