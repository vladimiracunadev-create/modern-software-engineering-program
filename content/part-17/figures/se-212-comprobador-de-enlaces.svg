<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 584" width="940" height="584" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comprobador de enlaces de un corpus de 60 archivos Markdown</title><desc id="d">Barras agrupadas con los enlaces marcados como rotos: el corpus original de 480 enlaces no tiene ninguno; si el comprobador lee el interior de los bloques de código marca 60 enlaces de ejemplo como rotos; tras renombrar 5 archivos y 8 encabezados aparecen 52 enlaces a archivo rotos y 14 anclas rotas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="584" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Comprobador de enlaces de un corpus de 60 archivos Markdown</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Enlaces a archivo marcados</tspan></text><rect x="260.04" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Anclas rotas</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="281.667" x2="71.08" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="188.333" x2="71.08" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">enlaces marcados como rotos</text><rect x="99.3773" y="373" width="111.189" height="2" rx="3" fill="#c0432f"/><text x="154.972" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.972" dy="0">0</tspan></text><rect x="214.567" y="373" width="111.189" height="2" rx="3" fill="#946512"/><text x="270.161" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.161" dy="0">0</tspan></text><text x="212.567" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Corpus original, 60 archivos y 480</tspan></text><text x="212.567" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">enlaces</tspan></text><rect x="382.351" y="95" width="111.189" height="280" rx="3" fill="#c0432f"/><text x="437.945" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.945" dy="0">60</tspan></text><rect x="497.54" y="373" width="111.189" height="2" rx="3" fill="#946512"/><text x="553.135" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.135" dy="0">0</tspan></text><text x="495.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Mismo corpus, leyendo el interior de</tspan></text><text x="495.54" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">bloques de código</tspan></text><rect x="665.324" y="132.333" width="111.189" height="242.667" rx="3" fill="#c0432f"/><text x="720.919" y="126.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.919" dy="0">52</tspan></text><rect x="780.513" y="309.667" width="111.189" height="65.3333" rx="3" fill="#946512"/><text x="836.108" y="303.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.108" dy="0">14</tspan></text><text x="778.513" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Tras renombrar 5 archivos y 8</tspan></text><text x="778.513" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">encabezados</tspan></text><rect x="10" y="444" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los 60 marcados al leer los bloques de código son falsos positivos; los 66 de después del renombrado son enlaces rotos</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reales. Cinco renombrados rompen 52 enlaces, más de diez por cambio: un enlace roto rara vez viene solo. Y el comprobador</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ingenuo genera el doble de ruido que el cambio real. La ancla de un encabezado depende de la regla de generación de</tspan></text><text x="470" y="518.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">identificadores, que cambia entre renderizadores.</tspan></text><text x="470" y="566.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
