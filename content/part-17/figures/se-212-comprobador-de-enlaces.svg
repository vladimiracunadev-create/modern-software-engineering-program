<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 333" width="970" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comprobador de enlaces de un corpus de 60 archivos Markdown</title><desc id="d">Tabla de un comprobador de enlaces: el corpus original no tiene enlaces rotos; si el comprobador lee el interior de los bloques de código marca 60 enlaces de ejemplo como rotos; tras renombrar 5 archivos y 8 encabezados aparecen 52 enlaces a archivo rotos y 14 anclas rotas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="333" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Situación</tspan></text><rect x="410" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Archivos rotos</tspan></text><rect x="570" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Anclas rotas</tspan></text><rect x="720" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Lectura</tspan></text><rect x="10" y="56" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Corpus original, 60 archivos y 480 enlaces</tspan></text><rect x="410" y="56" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">0</tspan></text><rect x="570" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">0</tspan></text><rect x="720" y="56" width="234" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">—</tspan></text><rect x="10" y="110" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="129.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Mismo corpus, leyendo también el interior de bloques de</tspan></text><text x="207" y="145.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">código</tspan></text><rect x="410" y="110" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">60</tspan></text><rect x="570" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">0</tspan></text><rect x="720" y="110" width="234" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">60 falsos positivos</tspan></text><rect x="10" y="164" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Tras renombrar 5 archivos y 8 encabezados</tspan></text><rect x="410" y="164" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">52</tspan></text><rect x="570" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">14</tspan></text><rect x="720" y="164" width="234" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">66 enlaces rotos reales</tspan></text><rect x="10" y="222" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Cinco renombrados rompen 52 enlaces, más de diez por cambio: un enlace roto rara vez viene solo. Y el comprobador ingenuo</tspan></text><text x="485" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">genera el doble de ruido que el cambio real. La ancla de un encabezado depende de la regla de generación de identificadores,</tspan></text><text x="485" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">que cambia entre renderizadores.</tspan></text><text x="485" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
