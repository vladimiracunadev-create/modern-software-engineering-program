<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Huellas distintas al construir la misma página con 8 semillas de hash</title><desc id="d">Barras horizontales con las huellas distintas de una página generada con 8 valores de PYTHONHASHSEED: con etiquetas en orden de conjunto salen 8, añadiendo la fecha de ejecución también 8, con orden explícito y fecha fija una sola; cambiar LF por CRLF da otra huella aunque la estructura sea idéntica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Huellas distintas al construir la misma página con 8 semillas de hash</tspan></text><line x1="324" y1="49" x2="324" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="201" x2="324" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="469.985" y1="49" x2="469.985" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="469.985" y1="201" x2="469.985" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="469.985" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="469.985" dy="0">2</tspan></text><line x1="615.97" y1="49" x2="615.97" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="615.97" y1="201" x2="615.97" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="615.97" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615.97" dy="0">4</tspan></text><line x1="761.955" y1="49" x2="761.955" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="761.955" y1="201" x2="761.955" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="761.955" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="761.955" dy="0">6</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="201" x2="907.94" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">8</tspan></text><line x1="324" y1="201" x2="907.94" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Etiquetas en el orden de un conjunto</tspan></text><text x="314" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Orden de conjunto y fecha de la ejecución</tspan></text><text x="314" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Etiquetas ordenadas y fecha fija</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Ordenadas, con CRLF en lugar de LF</tspan></text><rect x="324" y="55" width="583.94" height="26" rx="3" fill="#087f8c"/><text x="914.94" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">8</tspan></text><rect x="324" y="93" width="583.94" height="26" rx="3" fill="#087f8c"/><text x="914.94" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">8</tspan></text><rect x="324" y="131" width="72.9925" height="26" rx="3" fill="#087f8c"/><text x="403.993" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="403.993" dy="0">1</tspan></text><rect x="324" y="169" width="72.9925" height="26" rx="3" fill="#087f8c"/><text x="403.993" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="403.993" dy="0">1</tspan></text><text x="615.97" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="615.97" dy="0">huellas distintas en 8 ejecuciones</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Con CRLF la huella sigue siendo una sola en las 8 ejecuciones, pero distinta de la de LF. Una construcción reproducible es</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">la condición para que «reconstruir y comparar» sirva como prueba. Los saltos de línea cuentan: un mismo generador en</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Windows y Ubuntu produce huellas distintas si no fija la salida a LF.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
