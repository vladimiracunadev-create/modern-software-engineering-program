<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 307" width="1060" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Búsqueda BM25 sobre 200 páginas y 40 conceptos con tres sinónimos (600 consultas)</title><desc id="d">Barras: con búsqueda léxica BM25 y el lector usando uno de tres sinónimos al azar, una página relevante aparece entre las tres primeras el 80,8 por ciento de las veces y en primer lugar el 78,8; con los sinónimos en los metadatos o ampliando la consulta, el 100 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="307" fill="#ffffff"/><text x="460" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="460" dy="0">Búsqueda por la palabra tal cual: acierta en las 3 primeras</tspan></text><rect x="470" y="16" width="274.72" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="752.72" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="752.72" dy="0">80,8 %</tspan></text><text x="460" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="460" dy="0">Búsqueda por la palabra tal cual: acierta en la primera</tspan></text><rect x="470" y="60" width="267.92" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="745.92" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="745.92" dy="0">78,8 %</tspan></text><text x="460" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="460" dy="0">Sinónimos del glosario en los metadatos de cada página</tspan></text><rect x="470" y="104" width="340" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="818" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="818" dy="0">100 % / 100 %</tspan></text><text x="460" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="460" dy="0">Se amplía la consulta con los sinónimos</tspan></text><rect x="470" y="148" width="340" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="818" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="818" dy="0">100 % / 100 %</tspan></text><rect x="10" y="196" width="1040" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">Una de cada cinco consultas fracasa solo porque el lector no usa el mismo nombre que la página. El glosario corrige eso de forma barata. El</tspan></text><text x="530" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">100 % es consecuencia de un vocabulario cerrado de 40 conceptos y 3 sinónimos exactos; en un corpus real los sinónimos no se enumeran del</tspan></text><text x="530" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">todo.</tspan></text><text x="530" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
