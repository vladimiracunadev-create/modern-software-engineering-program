<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 315" width="970" height="315" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Detectar definiciones contradictorias por similitud de palabras (240 pares de cada clase)</title><desc id="d">Tabla de 240 pares de definiciones parafraseadas y 240 contradictorias: la similitud media de Jaccard es 0,65 en las paráfrasis y 0,87 en las contradicciones; con umbral 0,5 no se marca ninguna de las dos clases, con 0,7 se marcan todas las paráfrasis y ningún conflicto, con 0,9 todas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="315" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Umbral: se marca si la similitud es menor que</tspan></text><rect x="390" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Contradicciones marcadas</tspan></text><rect x="670" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Paráfrasis marcadas (falsas</tspan></text><text x="812" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">alarmas)</tspan></text><rect x="10" y="56" width="374" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">0,5</tspan></text><rect x="390" y="56" width="274" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">0 de 240</tspan></text><rect x="670" y="56" width="284" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0 de 240</tspan></text><rect x="10" y="104" width="374" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="128.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">0,7</tspan></text><rect x="390" y="104" width="274" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">0 de 240</tspan></text><rect x="670" y="104" width="284" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">240 de 240</tspan></text><rect x="10" y="152" width="374" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="176.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">0,9</tspan></text><rect x="390" y="152" width="274" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">240 de 240</tspan></text><rect x="670" y="152" width="284" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">240 de 240</tspan></text><rect x="10" y="204" width="950" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="228.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Las definiciones que se contradicen por una sola palabra clave se parecen más entre sí que las paráfrasis honestas, así que la</tspan></text><text x="485" y="245.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">similitud léxica ordena al revés de lo deseado. Detectar conflictos de glosario exige comparar el valor de los términos</tspan></text><text x="485" y="262.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">definidos (números, condiciones) o la revisión de una persona.</tspan></text><text x="485" y="301.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
