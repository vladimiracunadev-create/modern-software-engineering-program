<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 355" width="970" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alcanzabilidad de 120 páginas desde la portada, antes y después de enlazar las huérfanas</title><desc id="d">Tabla de un sitio sintético de 120 páginas con 8 índices: antes de reparar hay 5 páginas sin enlaces entrantes e inalcanzables desde la portada; tras enlazarlas desde un índice quedan 0; ninguna está a más de 3 clics y la profundidad máxima es 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="355" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Medida</tspan></text><rect x="480" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Antes</tspan></text><rect x="670" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Después de enlazar desde índices</tspan></text><rect x="10" y="56" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Páginas sin enlaces entrantes</tspan></text><rect x="480" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">5</tspan></text><rect x="670" y="56" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0</tspan></text><rect x="10" y="102" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Páginas inalcanzables desde la portada</tspan></text><rect x="480" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">5</tspan></text><rect x="670" y="102" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0</tspan></text><rect x="10" y="148" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Páginas a más de 3 clics</tspan></text><rect x="480" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0</tspan></text><rect x="670" y="148" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0</tspan></text><rect x="10" y="194" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Profundidad máxima</tspan></text><rect x="480" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">3</tspan></text><rect x="670" y="194" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">3</tspan></text><rect x="10" y="244" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">El 4 % de páginas huérfanas es invisible para la navegación y solo aparece por búsqueda, si está indexada. La profundidad no</tspan></text><text x="485" y="285.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">fue el problema en este sitio porque los índices cuelgan de la portada; en uno real, la profundidad y la huérfana se miden con</tspan></text><text x="485" y="302.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">el mismo recorrido en anchura.</tspan></text><text x="485" y="341.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
