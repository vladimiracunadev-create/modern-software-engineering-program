<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 441" width="970" height="441" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reconstruir cuándo y por qué cambió un valor de configuración en 120 commits</title><desc id="d">Tabla de un repositorio sintético de 120 commits donde 84 tienen mensaje genérico: buscar por mensaje no encuentra nada, buscar por el contenido añadido con la opción -S halla el commit exacto y git blame apunta al mismo, pero el mensaje del commit solo dice fix.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="441" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Método</tspan></text><rect x="340" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Resultado</tspan></text><rect x="530" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Commits del historial</tspan></text><rect x="340" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">120</tspan></text><rect x="530" y="56" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">84 con mensaje genérico («fix», «wip», «ok»)</tspan></text><rect x="10" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">`git log --grep=timeout`</tspan></text><rect x="340" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">0 hallazgos</tspan></text><rect x="530" y="110" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">El mensaje no dice qué cambió</tspan></text><rect x="10" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">`git log -S&quot;TIMEOUT = 30&quot;`</tspan></text><rect x="340" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">1 hallazgo</tspan></text><rect x="530" y="164" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">El commit que introduce el valor: mensaje «fix»</tspan></text><rect x="10" y="218" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Commits que tocan el archivo</tspan></text><rect x="340" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">2</tspan></text><rect x="530" y="218" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">El rastreo por contenido evita leer ambos a ciegas</tspan></text><rect x="10" y="272" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="299.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">`git blame` de la línea</tspan></text><rect x="340" y="272" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Mismo commit</tspan></text><rect x="530" y="272" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Coincide con el hallado por `-S`</tspan></text><rect x="10" y="330" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">El historial permite saber cuándo y quién, casi nunca por qué: el motivo de un cambio de 10 a 30 no estaba en ningún mensaje.</tspan></text><text x="485" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Esa es la parte del conocimiento perdido que hay que reconstruir hablando con personas o con otros artefactos, y declarar como</tspan></text><text x="485" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">hipótesis.</tspan></text><text x="485" y="427.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Repositorio creado con git fast-import; resultados idénticos en Windows y Ubuntu.</tspan></text></svg>
