<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 463" width="940" height="463" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Huellas distintas de un paquete zip de 30 páginas construido tres veces</title><desc id="d">Tres construcciones de un archivo zip de 30 páginas como tarjetas: la ingenua, con orden de directorio y fechas de modificación, produce 3 huellas distintas, la determinista una sola, igual en Windows y Ubuntu cuando también se fija el campo de sistema de origen, y con saltos de línea CRLF la huella cambia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="463" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Huellas distintas de un paquete zip de 30 páginas construido tres veces</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Recorrer el directorio sin ordenar, con la fecha</tspan></text><text x="30" y="117.6" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">de modificación de cada archivo</tspan></text><polyline points="402,105.64 438,105.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="77" width="478" height="57.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="109.28" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">3 huellas distintas en 3 construcciones</tspan></text><text x="24" y="151.28" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Cambia con la hora de la extracción.</tspan></text><rect x="20" y="172.92" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="196.88" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Ordenar, fijar la fecha y los permisos y declarar</tspan></text><text x="30" y="213.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">el sistema de origen</tspan></text><polyline points="402,201.56 438,201.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="172.92" width="478" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="205.2" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">1 huella en las 3 construcciones</tspan></text><text x="24" y="247.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Misma huella entre ejecuciones y sistemas.</tspan></text><rect x="20" y="268.84" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="292.8" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">El mismo árbol con saltos de línea CRLF</tspan></text><polyline points="402,289.16 438,289.16" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="268.84" width="478" height="40.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="292.8" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">Otra huella</tspan></text><text x="24" y="326.48" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El contenido distinto cambia la huella.</tspan></text><rect x="10" y="350.12" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="375.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un hallazgo del experimento: sin fijar el sistema de origen del zip (0 en Windows, 3 en Linux por defecto) la construcción</tspan></text><text x="470" y="391.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">«determinista» daba huellas distintas en cada sistema. Fijar solo el orden y la fecha no basta.</tspan></text><text x="470" y="435.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Mismo conjunto de 30 páginas generado con semilla fija; huella determinista idéntica en Windows y Ubuntu.</tspan></text></svg>
