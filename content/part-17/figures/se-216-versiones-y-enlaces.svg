<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres versiones etiquetadas de un portal de 10 páginas: enlaces internos rotos por versión</title><desc id="d">Barras agrupadas con páginas, enlaces internos y enlaces rotos de tres versiones de un portal construidas desde etiquetas de git: v1 tiene 10 páginas, 30 enlaces y 0 rotos; v2, que elimina dos páginas y renombra una, 8, 21 y 7; v3, que añade una página, 9, 23 y 7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres versiones etiquetadas de un portal de 10 páginas: enlaces internos rotos por versión</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Páginas</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Enlaces internos</tspan></text><rect x="285.42" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="305.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="305.42" dy="0">Rotos</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="281.667" x2="71.08" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="188.333" x2="71.08" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">páginas o enlaces</text><rect x="99.3773" y="281.667" width="72.7929" height="93.3333" rx="3" fill="#6b7c86"/><text x="135.774" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135.774" dy="0">10</tspan></text><rect x="176.17" y="95" width="72.7929" height="280" rx="3" fill="#087f8c"/><text x="212.567" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">30</tspan></text><rect x="252.963" y="373" width="72.7929" height="2" rx="3" fill="#c0432f"/><text x="289.36" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="289.36" dy="0">0</tspan></text><text x="212.567" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">v1</tspan></text><rect x="382.351" y="300.333" width="72.7929" height="74.6667" rx="3" fill="#6b7c86"/><text x="418.747" y="294.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="418.747" dy="0">8</tspan></text><rect x="459.144" y="179" width="72.7929" height="196" rx="3" fill="#087f8c"/><text x="495.54" y="173" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">21</tspan></text><rect x="535.936" y="309.667" width="72.7929" height="65.3333" rx="3" fill="#c0432f"/><text x="572.333" y="303.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="572.333" dy="0">7</tspan></text><text x="495.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">v2 (se eliminan 2 páginas y se</tspan></text><text x="495.54" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">renombra 1)</tspan></text><rect x="665.324" y="291" width="72.7929" height="84" rx="3" fill="#6b7c86"/><text x="701.72" y="285" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="701.72" dy="0">9</tspan></text><rect x="742.117" y="160.333" width="72.7929" height="214.667" rx="3" fill="#087f8c"/><text x="778.513" y="154.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">23</tspan></text><rect x="818.91" y="309.667" width="72.7929" height="65.3333" rx="3" fill="#c0432f"/><text x="855.306" y="303.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855.306" dy="0">7</tspan></text><text x="778.513" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">v3 (se añade 1 página)</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las 3 páginas de v1 ausentes en la última versión (p03, p05 y p07) son el contrato roto con quien enlazó a la versión</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">antigua. Un portal versionado necesita dos cosas distintas: que cada versión sea coherente consigo misma y una política</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">para los enlaces entre versiones.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Repositorio de git creado en un directorio temporal; idéntico en Windows y Ubuntu.</tspan></text></svg>
