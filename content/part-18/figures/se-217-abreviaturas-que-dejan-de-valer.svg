<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 335" width="1020" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Abreviaturas de flags que dejan de valer al añadir flags</title><desc id="d">Barras: de 15 prefijos de flags de una herramienta con cinco opciones, 14 se aceptan; al añadir tres opciones nuevas solo 5 siguen aceptándose y 9 se rompen; con las abreviaturas desactivadas se aceptan 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="335" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Prefijos probados de 5 flags</tspan></text><rect x="410" y="16" width="540" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="958" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="958" dy="0">15</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Aceptados con 5 flags (v1)</tspan></text><rect x="410" y="60" width="504" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="922" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="922" dy="0">14</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Aceptados tras añadir 3 flags (v2)</tspan></text><rect x="410" y="104" width="180" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="598" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="598" dy="0">5</tspan></text><text x="400" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Rotos por añadir flags sin tocar el código</tspan></text><rect x="410" y="148" width="324" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="742" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="742" dy="0">9</tspan></text><text x="400" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Aceptados con allow_abbrev=False</tspan></text><rect x="410" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422" dy="0">0</tspan></text><rect x="10" y="240" width="1000" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="510" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Un script que escribió --sal y funcionaba deja de funcionar cuando aparece --salida-json: la abreviatura es un contrato implícito que</tspan></text><text x="510" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">cada flag nuevo puede romper. Desactivar las abreviaturas convierte el contrato en explícito.</tspan></text><text x="510" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos y procesos locales; Windows (CPython 3.12.9) y Ubuntu/WSL2 (3.12.3); los tiempos son de un equipo.</tspan></text></svg>
