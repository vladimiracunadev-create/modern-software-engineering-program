<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" width="1050" height="445" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que observa quien invoca una CLI de argparse</title><desc id="d">Tabla con cinco invocaciones de una herramienta de ejemplo: la ayuda sale con código 0 por la salida estándar; los cuatro tipos de uso incorrecto salen con código 2 y escriben solo en el error estándar; una invocación válida escribe 12 bytes y sale con 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="445" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Invocación</tspan></text><rect x="260" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="302" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="302" dy="0">Código</tspan></text><rect x="350" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">stdout</tspan></text><rect x="460" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">stderr</tspan></text><rect x="710" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Lectura</tspan></text><rect x="10" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">-h</tspan></text><rect x="260" y="56" width="84" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">0</tspan></text><rect x="350" y="56" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">125 B</tspan></text><rect x="460" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0 B</tspan></text><rect x="710" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">Ayuda: va a stdout</tspan></text><rect x="10" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Sin subcomando</tspan></text><rect x="260" y="114" width="84" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">2</tspan></text><rect x="350" y="114" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">0 B</tspan></text><rect x="460" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">89 B</tspan></text><rect x="710" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">Uso incorrecto: stderr</tspan></text><rect x="10" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Flag desconocido</tspan></text><rect x="260" y="172" width="84" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">2</tspan></text><rect x="350" y="172" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">0 B</tspan></text><rect x="460" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">77 B</tspan></text><rect x="710" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">Uso incorrecto: stderr</tspan></text><rect x="10" y="230" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Valor fuera de las opciones</tspan></text><rect x="260" y="230" width="84" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">2</tspan></text><rect x="350" y="230" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">0 B</tspan></text><rect x="460" y="230" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">139 B (Ubuntu: 143 B)</tspan></text><rect x="710" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">El texto del mensaje cambia entre versiones</tspan></text><rect x="10" y="288" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Invocación válida</tspan></text><rect x="260" y="288" width="84" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">0</tspan></text><rect x="350" y="288" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">12 B</tspan></text><rect x="460" y="288" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0 B</tspan></text><rect x="710" y="288" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">Resultado: stdout; nada en stderr</tspan></text><rect x="10" y="350" width="1030" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">El código 2 y la separación de flujos salen gratis de argparse, pero el texto exacto del mensaje no es contrato: entre Python 3.12.9 y</tspan></text><text x="525" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">3.12.3 el mismo error midió 139 y 143 bytes. Quien automatice debe leer el código, no analizar el mensaje.</tspan></text><text x="525" y="431.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Datos sintéticos y procesos locales; Windows (CPython 3.12.9) y Ubuntu/WSL2 (3.12.3); los tiempos son de un equipo.</tspan></text></svg>
