<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 423" width="1080" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sugerir el comando correcto ante un error de tecleo</title><desc id="d">Barras: con 12 subcomandos y 294 erratas de dos ediciones, un corte de similitud de 0,6 acierta 294, de 0,8 acierta 193 y no sugiere en 101, de 0,9 acierta solo 23; ninguna sugerencia fue equivocada, pero con 0,6 seis de 16 palabras ajenas recibieron una sugerencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="423" fill="#ffffff"/><text x="480" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Corte 0,6: acierta (de 294 erratas dobles)</tspan></text><rect x="490" y="16" width="396.9" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="894.9" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="894.9" dy="0">294</tspan></text><text x="480" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Corte 0,8: acierta</tspan></text><rect x="490" y="60" width="260.55" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="758.55" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758.55" dy="0">193</tspan></text><text x="480" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Corte 0,8: sin sugerencia</tspan></text><rect x="490" y="104" width="136.35" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="634.35" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="634.35" dy="0">101</tspan></text><text x="480" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Corte 0,9: acierta</tspan></text><rect x="490" y="148" width="31.05" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="529.05" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="529.05" dy="0">23</tspan></text><text x="480" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Corte 0,9: sin sugerencia</tspan></text><rect x="490" y="192" width="365.85" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="863.85" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="863.85" dy="0">271</tspan></text><text x="480" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Corte 0,6: palabras ajenas con sugerencia (de 16)</tspan></text><rect x="490" y="236" width="8.1" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="506.1" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="506.1" dy="0">6</tspan></text><text x="480" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Corte 0,8: palabras ajenas con sugerencia (de 16)</tspan></text><rect x="490" y="280" width="4.05" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="502.05" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="502.05" dy="0">3</tspan></text><rect x="10" y="328" width="1060" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">Ningún corte produjo una sugerencia equivocada ante erratas, pero un corte laxo sugiere «revisar» a quien escribió «crear». Una sugerencia es</tspan></text><text x="540" y="369.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">una ayuda y nunca una acción: la herramienta no debe ejecutar el comando adivinado.</tspan></text><text x="540" y="409.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Datos sintéticos con semilla 217: 12 subcomandos del dominio de la herramienta; resultados idénticos en ambos sistemas.</tspan></text></svg>
