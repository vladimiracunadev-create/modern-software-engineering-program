<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 561" width="1040" height="561" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Interpretar booleanos del entorno: bool(cadena) frente a un analizador estricto</title><desc id="d">Tabla: bool aplicado a una cadena del entorno devuelve True para 0, false, FALSE, no y off, es decir, interpreta mal cinco de las doce cadenas reconocidas; un analizador estricto acepta ocho formas, trata el vacío como no definido y rechaza 2 y los dígitos no ASCII.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="561" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Valor del entorno</tspan></text><rect x="270" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="377" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="377" dy="0">bool(cadena)</tspan></text><rect x="490" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Significado</tspan></text><rect x="690" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">Analizador estricto</tspan></text><rect x="10" y="56" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">«0»</tspan></text><rect x="270" y="56" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">True</tspan></text><rect x="490" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">falso</tspan></text><rect x="690" y="56" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">False</tspan></text><rect x="10" y="114" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">«false» y «FALSE»</tspan></text><rect x="270" y="114" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">True</tspan></text><rect x="490" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">falso</tspan></text><rect x="690" y="114" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">False</tspan></text><rect x="10" y="172" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">«no» y «off»</tspan></text><rect x="270" y="172" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">True</tspan></text><rect x="490" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">falso</tspan></text><rect x="690" y="172" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">False</tspan></text><rect x="10" y="230" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">«1» y «true»</tspan></text><rect x="270" y="230" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">True</tspan></text><rect x="490" y="230" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">verdadero</tspan></text><rect x="690" y="230" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">True</tspan></text><rect x="10" y="288" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">«» (vacío)</tspan></text><rect x="270" y="288" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">False</tspan></text><rect x="490" y="288" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">sin definir</tspan></text><rect x="690" y="288" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Se trata como no definido</tspan></text><rect x="10" y="346" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="375.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">«2»</tspan></text><rect x="270" y="346" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">True</tspan></text><rect x="490" y="346" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">desconocido</tspan></text><rect x="690" y="346" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Rechaza con un error de uso</tspan></text><rect x="10" y="404" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="433.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">«٣» (dígito arábigo)</tspan></text><rect x="270" y="404" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="433.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">int() lo lee como 3</tspan></text><rect x="490" y="404" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="433.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">no es ASCII</tspan></text><rect x="690" y="404" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="433.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Rechaza: solo dígitos ASCII</tspan></text><rect x="10" y="466" width="1020" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">bool(«false») es True porque la cadena no está vacía: cinco de las doce cadenas reconocidas se interpretan al revés. int() acepta dígitos</tspan></text><text x="520" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">de otros alfabetos (int(«٣») = 3), así que «isdigit» tampoco basta para validar un número.</tspan></text><text x="520" y="547.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Doce cadenas reconocidas y dos no reconocidas; idéntico en ambos sistemas (CPython 3.12.9 y 3.12.3).</tspan></text></svg>
