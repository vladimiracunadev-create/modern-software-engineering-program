<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 438" width="940" height="438" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Interpretar booleanos del entorno: bool(cadena) frente a un analizador estricto</title><desc id="d">Diagrama de cómo se interpretan las cadenas del entorno: bool aplicado a una cadena devuelve True para 0, false, FALSE, no y off, que significan falso; devuelve False para la cadena vacía, que un analizador estricto trata como no definida; devuelve True para 2 y lee un dígito arábigo como 3, que el analizador rechaza con un error de uso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="438" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Interpretar booleanos del entorno: bool(cadena) frente a un analizador estricto</tspan></text><rect x="14" y="147.96" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="169.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Valor del entorno</tspan></text><text x="139" y="186.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">bool(cadena) frente a un</tspan></text><text x="139" y="203.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">analizador estricto</tspan></text><rect x="334" y="49" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">«0», «false», «FALSE», «no», «off»</tspan></text><text x="630" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">bool(cadena) devuelve True; el analizador estricto devuelve False</tspan></text><polyline points="264,182.96 299,182.96 299,76 334,76" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="115" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="137.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">«1» y «true»</tspan></text><text x="630" y="153.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">ambos devuelven True</tspan></text><polyline points="264,182.96 299,182.96 299,142 334,142" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="181" width="592" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">«» (vacío)</tspan></text><text x="630" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">bool devuelve False; el analizador lo trata como no definido</tspan></text><polyline points="264,182.96 299,182.96 299,208 334,208" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="247" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="268.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">«2» y «٣» (dígito arábigo)</tspan></text><text x="630" y="285.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">bool devuelve True e int() lee el dígito como 3; el analizador rechaza con un</tspan></text><text x="630" y="302.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">error de uso (solo dígitos ASCII)</tspan></text><polyline points="264,182.96 299,182.96 299,281.96 334,281.96" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="330.92" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="355.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">bool(«false») es True porque la cadena no está vacía: cinco de las doce cadenas reconocidas se interpretan al revés. int()</tspan></text><text x="470" y="372.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">acepta dígitos de otros alfabetos (int(«٣») = 3), así que «isdigit» tampoco basta para validar un número.</tspan></text><text x="470" y="420.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Doce cadenas reconocidas y dos no reconocidas; idéntico en ambos sistemas (CPython 3.12.9 y 3.12.3).</tspan></text></svg>
