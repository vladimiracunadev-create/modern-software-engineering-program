<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 371" width="1050" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde puede verse un secreto sintético según cómo se entrega a la herramienta</title><desc id="d">Tabla: un valor falso pasado como argumento de línea de comandos fue visible para otro proceso del mismo usuario tanto en Windows como en Ubuntu; la variable de entorno fue visible en Ubuntu mediante /proc y no se comprobó en Windows; leerlo de un archivo o de la entrada estándar no lo expone en la línea de comandos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="371" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Cómo se entrega el secreto</tspan></text><rect x="310" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">Windows</tspan></text><rect x="690" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Ubuntu (WSL2)</tspan></text><rect x="10" y="56" width="294" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="92.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Secreto pasado como --token=VALOR</tspan></text><rect x="310" y="56" width="374" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="84.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">Visible para otro proceso del mismo usuario</tspan></text><text x="497" y="100.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">(Get-CimInstance)</tspan></text><rect x="690" y="56" width="344" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">Visible en /proc/pid/cmdline</tspan></text><rect x="10" y="128" width="294" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="164.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Secreto pasado por variable de entorno</tspan></text><rect x="310" y="128" width="374" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">No comprobado por esa vía (WMI no lista el entorno)</tspan></text><rect x="690" y="128" width="344" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">Visible en /proc/pid/environ</tspan></text><rect x="10" y="200" width="294" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Secreto leído de un archivo o de stdin</tspan></text><rect x="310" y="200" width="374" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">No aparece en la línea de comandos</tspan></text><rect x="690" y="200" width="344" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="228.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">No aparece en cmdline ni en el historial del</tspan></text><text x="862" y="244.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">shell</tspan></text><rect x="10" y="276" width="1030" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="525" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">El valor usado fue FAKE-TOKEN-0001, sintético. Cualquier proceso del mismo usuario lo leyó mientras la herramienta corría; el historial</tspan></text><text x="525" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">del shell y los registros de procesos lo conservan además. Pasar secretos por flag es una decisión de diseño, no un detalle de comodidad.</tspan></text><text x="525" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Medición en un equipo, mismo usuario; no incluye usuarios distintos, contenedores ni auditoría del sistema.</tspan></text></svg>
