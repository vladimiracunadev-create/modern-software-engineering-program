<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde puede verse un secreto sintético según cómo se entrega a la herramienta</title><desc id="d">Mapa de calor con dónde puede verse un secreto sintético según cómo se entrega: pasado como argumento es visible para otro proceso del mismo usuario en Windows y en Ubuntu; por variable de entorno es visible en Ubuntu y no se comprobó en Windows; leído de un archivo o de stdin no aparece en ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dónde puede verse un secreto sintético según cómo se entrega a la herramienta</tspan></text><text x="623" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="623" dy="0">¿Otro proceso del mismo usuario lo ve?</tspan></text><text x="474.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.5" dy="0">Windows</tspan></text><text x="771.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.5" dy="0">Ubuntu (WSL2)</tspan></text><text x="316" y="122.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="316" dy="0">Secreto pasado como --token=VALOR</tspan></text><text x="316" y="170.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="316" dy="0">Secreto pasado por variable de entorno</tspan></text><text x="316" y="218.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="316" dy="0">Secreto leído de un archivo o de stdin</tspan></text><rect x="327.5" y="95.5" width="294" height="45" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="474.5" y="122.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="474.5" dy="0">visible</tspan></text><rect x="624.5" y="95.5" width="294" height="45" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="771.5" y="122.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="771.5" dy="0">visible</tspan></text><rect x="327.5" y="143.5" width="294" height="45" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="474.5" y="170.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.5" dy="0">no comprobado</tspan></text><rect x="624.5" y="143.5" width="294" height="45" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="771.5" y="170.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="771.5" dy="0">visible</tspan></text><rect x="327.5" y="191.5" width="294" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="474.5" y="218.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.5" dy="0">no aparece</tspan></text><rect x="624.5" y="191.5" width="294" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="771.5" y="218.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.5" dy="0">no aparece</tspan></text><text x="20" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 166)">Cómo se entrega</text><text x="326" y="264" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="326" dy="0">no aparece</tspan></text><rect x="409.4" y="252" width="30.5" height="14" fill="#fbe4de"/><rect x="439.4" y="252" width="30.5" height="14" fill="#f3cdc5"/><rect x="469.4" y="252" width="30.5" height="14" fill="#eab6ac"/><rect x="499.4" y="252" width="30.5" height="14" fill="#e29f93"/><rect x="529.4" y="252" width="30.5" height="14" fill="#d9887a"/><rect x="559.4" y="252" width="30.5" height="14" fill="#d17161"/><rect x="589.4" y="252" width="30.5" height="14" fill="#c85a48"/><rect x="619.4" y="252" width="30.5" height="14" fill="#c0432f"/><text x="657.4" y="264" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="657.4" dy="0">visible</tspan></text><text x="718.18" y="264" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="718.18" dy="0">más oscuro = mayor (visibilidad)</tspan></text><rect x="10" y="280" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="304.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El valor usado fue FAKE-TOKEN-0001, sintético. Cualquier proceso del mismo usuario lo leyó mientras la herramienta corría;</tspan></text><text x="470" y="321.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el historial del shell y los registros de procesos lo conservan además. Pasar secretos por flag es una decisión de diseño,</tspan></text><text x="470" y="338.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">no un detalle de comodidad.</tspan></text><text x="470" y="385.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición en un equipo, mismo usuario; no incluye usuarios distintos, contenedores ni auditoría del sistema.</tspan></text></svg>
