<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 503" width="1020" height="503" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis resolvedores defectuosos de precedencia frente a 64 combinaciones</title><desc id="d">Tabla: de 64 combinaciones de cuatro valores por capa, seis resolvedores defectuosos difieren del correcto en 16, 4, 3, 14, 2 y 6 combinaciones; cuatro ejemplos de una sola capa solo detectan uno; tres ejemplos que combinan capas detectan dos más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="503" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Defecto del resolvedor</tspan></text><rect x="340" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Combinaciones que</tspan></text><text x="437" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">difieren (de 64)</tspan></text><rect x="540" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Lo detectan 4 ejemplos de</tspan></text><text x="652" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">una capa</tspan></text><rect x="770" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="887" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">Lo detectan + 3 ejemplos de</tspan></text><text x="887" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">varias capas</tspan></text><rect x="10" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">El entorno gana al flag</tspan></text><rect x="340" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">16</tspan></text><rect x="540" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">No</tspan></text><rect x="770" y="56" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">Sí</tspan></text><rect x="10" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">El archivo gana al entorno</tspan></text><rect x="340" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">4</tspan></text><rect x="540" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">No</tspan></text><rect x="770" y="114" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">Sí</tspan></text><rect x="10" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Un entorno vacío cuenta como definido</tspan></text><rect x="340" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">3</tspan></text><rect x="540" y="172" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">No</tspan></text><rect x="770" y="172" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">No</tspan></text><rect x="10" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">if flag: descarta el flag vacío</tspan></text><rect x="340" y="230" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">14</tspan></text><rect x="540" y="230" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">No</tspan></text><rect x="770" y="230" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">No</tspan></text><rect x="10" y="288" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">if archivo: descarta el valor vacío</tspan></text><rect x="340" y="288" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">2</tspan></text><rect x="540" y="288" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">No</tspan></text><rect x="770" y="288" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">No</tspan></text><rect x="10" y="346" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="375.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Ignora el entorno</tspan></text><rect x="340" y="346" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">6</tspan></text><rect x="540" y="346" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">Sí</tspan></text><rect x="770" y="346" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">Sí</tspan></text><rect x="10" y="408" width="1000" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="510" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Los ejemplos de una sola capa no pueden distinguir el orden de dos capas. Tres de los seis defectos sobreviven incluso a siete</tspan></text><text x="510" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">ejemplos razonables: los que dependen del valor vacío exigen escribir ese caso a propósito.</tspan></text><text x="510" y="489.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Enumeración exhaustiva de 4 × 4 × 4 combinaciones; sin aleatoriedad; idéntica en ambos sistemas.</tspan></text></svg>
