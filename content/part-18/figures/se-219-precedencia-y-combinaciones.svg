<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 507" width="940" height="507" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis resolvedores defectuosos de precedencia frente a 64 combinaciones</title><desc id="d">Mapa de calor con qué suite detecta cada uno de seis resolvedores defectuosos de precedencia: cuatro ejemplos de una sola capa solo detectan el que ignora el entorno; tres ejemplos que combinan capas detectan además el que hace ganar al entorno sobre el flag y el que hace ganar al archivo sobre el entorno; tres defectos sobreviven.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="507" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis resolvedores defectuosos de precedencia frente a 64 combinaciones</tspan></text><text x="648" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="648" dy="0">¿La suite lo detecta?</tspan></text><text x="512" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">4 ejemplos de una capa</tspan></text><text x="784" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784" dy="0">+ 3 ejemplos de varias capas</tspan></text><text x="366" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">El entorno gana al flag (difiere en 16 de 64)</tspan></text><text x="366" y="164.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">El archivo gana al entorno (4 de 64)</tspan></text><text x="366" y="200" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Un entorno vacío cuenta como definido (3 de</tspan></text><text x="366" y="217" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">64)</tspan></text><text x="366" y="252.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">if flag: descarta el flag vacío (14 de 64)</tspan></text><text x="366" y="296.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">if archivo: descarta el valor vacío (2 de 64)</tspan></text><text x="366" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Ignora el entorno (6 de 64)</tspan></text><rect x="377.5" y="95.5" width="269" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="512" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">sobrevive</tspan></text><rect x="649.5" y="95.5" width="269" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="784" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784" dy="0">lo detecta</tspan></text><rect x="377.5" y="139.5" width="269" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="512" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">sobrevive</tspan></text><rect x="649.5" y="139.5" width="269" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="784" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784" dy="0">lo detecta</tspan></text><rect x="377.5" y="183.5" width="269" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="512" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">sobrevive</tspan></text><rect x="649.5" y="183.5" width="269" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="784" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784" dy="0">sobrevive</tspan></text><rect x="377.5" y="227.5" width="269" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="512" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">sobrevive</tspan></text><rect x="649.5" y="227.5" width="269" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="784" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784" dy="0">sobrevive</tspan></text><rect x="377.5" y="271.5" width="269" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="512" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">sobrevive</tspan></text><rect x="649.5" y="271.5" width="269" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="784" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784" dy="0">sobrevive</tspan></text><rect x="377.5" y="315.5" width="269" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="512" y="340.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">lo detecta</tspan></text><rect x="649.5" y="315.5" width="269" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="784" y="340.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784" dy="0">lo detecta</tspan></text><text x="20" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 226)">Resolvedor defectuoso</text><text x="376" y="384" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="376" dy="0">sobrevive</tspan></text><rect x="451.86" y="372" width="30.5" height="14" fill="#dff1ee"/><rect x="481.86" y="372" width="30.5" height="14" fill="#c0e1e0"/><rect x="511.86" y="372" width="30.5" height="14" fill="#a2d0d2"/><rect x="541.86" y="372" width="30.5" height="14" fill="#83c0c4"/><rect x="571.86" y="372" width="30.5" height="14" fill="#64b0b6"/><rect x="601.86" y="372" width="30.5" height="14" fill="#45a0a8"/><rect x="631.86" y="372" width="30.5" height="14" fill="#278f9a"/><rect x="661.86" y="372" width="30.5" height="14" fill="#087f8c"/><text x="699.86" y="384" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="699.86" dy="0">lo detecta</tspan></text><text x="783.26" y="384" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="783.26" dy="0">más oscuro = mayor (detección)</tspan></text><rect x="10" y="400" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="424.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los ejemplos de una sola capa no pueden distinguir el orden de dos capas. Tres de los seis defectos sobreviven incluso a</tspan></text><text x="470" y="441.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">siete ejemplos razonables: los que dependen del valor vacío exigen escribir ese caso a propósito.</tspan></text><text x="470" y="489.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Enumeración exhaustiva de 4 × 4 × 4 combinaciones; sin aleatoriedad; idéntica en ambos sistemas.</tspan></text></svg>
