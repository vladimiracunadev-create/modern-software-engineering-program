<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 555" width="1010" height="555" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo código de salida observado desde el padre en Windows y en Ubuntu</title><desc id="d">Tabla: sys.exit(256) devuelve 256 en Windows y 0 en Ubuntu; sys.exit(1000) devuelve 1000 y 232; sys.exit(-1) devuelve 4294967295 y 255; un proceso abortado devuelve 3221226505 en Windows y menos 6 en Ubuntu; una excepción sin capturar devuelve 1 en ambos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="555" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Cómo termina el hijo</tspan></text><rect x="330" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">Windows (CPython 3.12.9)</tspan></text><rect x="660" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Ubuntu (3.12.3)</tspan></text><rect x="10" y="56" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">sys.exit(256)</tspan></text><rect x="330" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">256</tspan></text><rect x="660" y="56" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0</tspan></text><rect x="10" y="106" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">sys.exit(257)</tspan></text><rect x="330" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">257</tspan></text><rect x="660" y="106" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">1</tspan></text><rect x="10" y="156" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">sys.exit(1000)</tspan></text><rect x="330" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">1000</tspan></text><rect x="660" y="156" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">232</tspan></text><rect x="10" y="206" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">sys.exit(-1)</tspan></text><rect x="330" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">4294967295</tspan></text><rect x="660" y="206" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">255</tspan></text><rect x="10" y="256" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">os.abort()</tspan></text><rect x="330" y="256" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">3221226505</tspan></text><rect x="660" y="256" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">-6 (señal SIGABRT)</tspan></text><rect x="10" y="306" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">kill() desde el padre</tspan></text><rect x="330" y="306" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">1</tspan></text><rect x="660" y="306" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">-9 (señal SIGKILL)</tspan></text><rect x="10" y="356" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="381.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Excepción sin capturar</tspan></text><rect x="330" y="356" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">1</tspan></text><rect x="660" y="356" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">1</tspan></text><rect x="10" y="406" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="431.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">sys.exit(«mensaje»)</tspan></text><rect x="330" y="406" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">1</tspan></text><rect x="660" y="406" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">1</tspan></text><rect x="10" y="460" width="990" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="505" y="484.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Linux conserva solo ocho bits del código: 256 se lee como 0, es decir, éxito. Windows conserva treinta y dos. Un código fuera de</tspan></text><text x="505" y="501.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">0–255 no es portable; en POSIX una señal se informa como un número negativo y en Windows como un código de excepción.</tspan></text><text x="505" y="541.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Datos sintéticos y procesos locales; Windows (CPython 3.12.9) y Ubuntu/WSL2 (3.12.3); los tiempos son de un equipo.</tspan></text></svg>
