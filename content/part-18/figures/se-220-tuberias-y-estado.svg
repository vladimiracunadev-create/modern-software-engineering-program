<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 503" width="1050" height="503" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estado de salida de tuberías y guiones de shell (bash, mismos resultados en Windows y Ubuntu)</title><desc id="d">Tabla de seis guiones de bash: false seguido de cat devuelve 0 aunque la primera etapa falló; con pipefail devuelve 1; PIPESTATUS muestra 1 0 0; sin set -e el guion continúa y termina con 0; con set -e se detiene con 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="503" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Guion</tspan></text><rect x="410" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Resultado</tspan></text><rect x="540" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Lectura</tspan></text><rect x="10" y="56" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">false | cat; echo $?</tspan></text><rect x="410" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">0</tspan></text><rect x="540" y="56" width="494" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El estado de la tubería es el del último comando; el fallo se pierde</tspan></text><rect x="10" y="114" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">set -o pipefail; false | cat; echo $?</tspan></text><rect x="410" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">1</tspan></text><rect x="540" y="114" width="494" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">pipefail propaga el primer fallo</tspan></text><rect x="10" y="172" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">false | true | cat; echo ${PIPESTATUS[@]}</tspan></text><rect x="410" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">1 0 0</tspan></text><rect x="540" y="172" width="494" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">PIPESTATUS conserva el estado de cada etapa</tspan></text><rect x="10" y="230" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">false &amp;&amp; echo ok; echo $?</tspan></text><rect x="410" y="230" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">1</tspan></text><rect x="540" y="230" width="494" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El &amp;&amp; no ejecuta la segunda orden; $? queda en 1</tspan></text><rect x="10" y="288" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">false; echo continua; true; echo $?</tspan></text><rect x="410" y="288" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">continua · 0</tspan></text><rect x="540" y="288" width="494" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Sin set -e el script sigue y el último estado oculta el fallo</tspan></text><rect x="10" y="346" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="375.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">set -e; false; echo continua</tspan></text><rect x="410" y="346" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">(nada) · 1</tspan></text><rect x="540" y="346" width="494" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Con set -e el script se detiene en el primer fallo</tspan></text><rect x="10" y="408" width="1030" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">Una tubería sin pipefail devuelve éxito aunque falle la primera etapa. Un trabajo programado que termina con 0 después de un fallo</tspan></text><text x="525" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">intermedio es la forma más común de fallo silencioso en la automatización.</tspan></text><text x="525" y="489.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Git Bash en Windows y bash 5.2.21 en Ubuntu/WSL2; los resultados fueron iguales.</tspan></text></svg>
