<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 455" width="1060" height="455" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Longitud y ancho en pantalla de seis nombres</title><desc id="d">Tabla: José mide 4 caracteres en NFC y 5 en NFD pero ocupa 4 celdas; 李雨 mide 2 caracteres y ocupa 4 celdas; 田中太郎 mide 4 y ocupa 8; en 1 000 filas con diez nombres, rellenar con len desalineó 607 y rellenar por ancho estimado desalineó 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="455" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Nombre</tspan></text><rect x="310" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="417" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417" dy="0">len en NFC</tspan></text><rect x="530" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="637" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">len en NFD</tspan></text><rect x="750" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="897" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="897" dy="0">Ancho en celdas</tspan></text><rect x="10" y="56" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Ana</tspan></text><rect x="310" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">3</tspan></text><rect x="530" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">3</tspan></text><rect x="750" y="56" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">3</tspan></text><rect x="10" y="106" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">José</tspan></text><rect x="310" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">4</tspan></text><rect x="530" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">5</tspan></text><rect x="750" y="106" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">4</tspan></text><rect x="10" y="156" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Björn</tspan></text><rect x="310" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">5</tspan></text><rect x="530" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">6</tspan></text><rect x="750" y="156" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">5</tspan></text><rect x="10" y="206" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">李雨</tspan></text><rect x="310" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">2</tspan></text><rect x="530" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">2</tspan></text><rect x="750" y="206" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">4</tspan></text><rect x="10" y="256" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">田中太郎</tspan></text><rect x="310" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">4</tspan></text><rect x="530" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">4</tspan></text><rect x="750" y="256" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">8</tspan></text><rect x="10" y="306" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">👩‍💻 Eva</tspan></text><rect x="310" y="306" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">7</tspan></text><rect x="530" y="306" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">7</tspan></text><rect x="750" y="306" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">8 (estimado)</tspan></text><rect x="10" y="360" width="1040" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">En 607 de 1 000 filas len() no es el ancho en pantalla; rellenar con ljust desalineó esas 607 filas y rellenar por ancho estimado ninguna.</tspan></text><text x="530" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">Seis de los diez nombres tienen una forma NFD distinta de la NFC: se ven igual y son cadenas distintas hasta que se normalizan.</tspan></text><text x="530" y="441.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Semilla 1; el ancho se estimó con East Asian Width y es una aproximación: el emoji compuesto se dibuja distinto según el terminal.</tspan></text></svg>
