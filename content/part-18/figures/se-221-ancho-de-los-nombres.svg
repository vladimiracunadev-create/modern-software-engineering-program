<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Longitud y ancho en pantalla de seis nombres</title><desc id="d">Barras agrupadas con la longitud y el ancho en pantalla de seis nombres: José mide 4 caracteres en NFC y 5 en NFD pero ocupa 4 celdas; 李雨 mide 2 y ocupa 4; 田中太郎 mide 4 y ocupa 8; la longitud y el ancho en pantalla solo coinciden en los nombres ASCII.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Longitud y ancho en pantalla de seis nombres</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">len en NFC</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">len en NFD</tspan></text><rect x="262.8" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="282.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="282.8" dy="0">Ancho en celdas</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="319" x2="71.08" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">2</tspan></text><line x1="71.08" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="263" x2="71.08" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">4</tspan></text><line x1="71.08" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="207" x2="71.08" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">6</tspan></text><line x1="71.08" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="151" x2="71.08" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">8</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Caracteres o celdas</text><rect x="85.2287" y="291" width="35.0631" height="84" rx="3" fill="#087f8c"/><text x="102.76" y="285" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102.76" dy="0">3</tspan></text><rect x="124.292" y="291" width="35.0631" height="84" rx="3" fill="#946512"/><text x="141.823" y="285" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="141.823" dy="0">3</tspan></text><rect x="163.355" y="291" width="35.0631" height="84" rx="3" fill="#c0432f"/><text x="180.886" y="285" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="180.886" dy="0">3</tspan></text><text x="141.823" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="141.823" dy="0">Ana</tspan></text><rect x="226.715" y="263" width="35.0631" height="112" rx="3" fill="#087f8c"/><text x="244.247" y="257" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="244.247" dy="0">4</tspan></text><rect x="265.778" y="235" width="35.0631" height="140" rx="3" fill="#946512"/><text x="283.31" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="283.31" dy="0">5</tspan></text><rect x="304.842" y="263" width="35.0631" height="112" rx="3" fill="#c0432f"/><text x="322.373" y="257" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="322.373" dy="0">4</tspan></text><text x="283.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">José</tspan></text><rect x="368.202" y="235" width="35.0631" height="140" rx="3" fill="#087f8c"/><text x="385.734" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="385.734" dy="0">5</tspan></text><rect x="407.265" y="207" width="35.0631" height="168" rx="3" fill="#946512"/><text x="424.797" y="201" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="424.797" dy="0">6</tspan></text><rect x="446.328" y="235" width="35.0631" height="140" rx="3" fill="#c0432f"/><text x="463.86" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="463.86" dy="0">5</tspan></text><text x="424.797" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.797" dy="0">Björn</tspan></text><rect x="509.689" y="319" width="35.0631" height="56" rx="3" fill="#087f8c"/><text x="527.22" y="313" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="527.22" dy="0">2</tspan></text><rect x="548.752" y="319" width="35.0631" height="56" rx="3" fill="#946512"/><text x="566.283" y="313" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.283" dy="0">2</tspan></text><rect x="587.815" y="263" width="35.0631" height="112" rx="3" fill="#c0432f"/><text x="605.346" y="257" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="605.346" dy="0">4</tspan></text><text x="566.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="566.283" dy="0">李雨</tspan></text><rect x="651.175" y="263" width="35.0631" height="112" rx="3" fill="#087f8c"/><text x="668.707" y="257" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="668.707" dy="0">4</tspan></text><rect x="690.238" y="263" width="35.0631" height="112" rx="3" fill="#946512"/><text x="707.77" y="257" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.77" dy="0">4</tspan></text><rect x="729.302" y="151" width="35.0631" height="224" rx="3" fill="#c0432f"/><text x="746.833" y="145" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="746.833" dy="0">8</tspan></text><text x="707.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">田中太郎</tspan></text><rect x="792.662" y="179" width="35.0631" height="196" rx="3" fill="#087f8c"/><text x="810.194" y="173" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="810.194" dy="0">7</tspan></text><rect x="831.725" y="179" width="35.0631" height="196" rx="3" fill="#946512"/><text x="849.257" y="173" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="849.257" dy="0">7</tspan></text><rect x="870.788" y="151" width="35.0631" height="224" rx="3" fill="#c0432f"/><text x="888.32" y="145" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="888.32" dy="0">8</tspan></text><text x="849.257" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="849.257" dy="0">👩‍💻 Eva</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En 607 de 1 000 filas len() no es el ancho en pantalla; rellenar con ljust desalineó esas 607 filas y rellenar por ancho</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estimado ninguna. Seis de los diez nombres tienen una forma NFD distinta de la NFC: se ven igual y son cadenas distintas</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hasta que se normalizan.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Semilla 1; el ancho se estimó con East Asian Width y es una aproximación: el emoji compuesto se dibuja distinto según el terminal.</tspan></text></svg>
