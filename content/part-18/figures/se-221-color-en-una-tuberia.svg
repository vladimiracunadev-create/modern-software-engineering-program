<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un informe de 200 líneas con una palabra en rojo, escrito a una tubería</title><desc id="d">Barras agrupadas con los bytes de un informe de 200 líneas escrito a una tubería: con detección de terminal ocupa 8 000 bytes en Windows y 7 800 en Ubuntu y no tiene escapes; con color siempre ocupa 9 800 y 9 600, con 200 líneas con escapes en las que la búsqueda de la frase ERROR nota no encuentra ninguna coincidencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un informe de 200 líneas con una palabra en rojo, escrito a una tubería</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Color solo en terminal</tspan></text><rect x="229.88" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="249.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">Color siempre (ingenuo)</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="328.333" x2="920" y2="328.333" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="328.333" x2="101.24" y2="328.333" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="332.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">2 000</tspan></text><line x1="101.24" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="281.667" x2="101.24" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">4 000</tspan></text><line x1="101.24" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="235" x2="101.24" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">6 000</tspan></text><line x1="101.24" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="188.333" x2="101.24" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">8 000</tspan></text><line x1="101.24" y1="141.667" x2="920" y2="141.667" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="141.667" x2="101.24" y2="141.667" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="146.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">12 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Bytes del informe</text><rect x="142.178" y="188.333" width="161.752" height="186.667" rx="3" fill="#087f8c"/><text x="223.054" y="182.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="223.054" dy="0">8 000</tspan></text><rect x="307.93" y="146.333" width="161.752" height="228.667" rx="3" fill="#c0432f"/><text x="388.806" y="140.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="388.806" dy="0">9 800</tspan></text><text x="305.93" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="305.93" dy="0">Windows</tspan></text><rect x="551.558" y="193" width="161.752" height="182" rx="3" fill="#087f8c"/><text x="632.434" y="187" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="632.434" dy="0">7 800</tspan></text><rect x="717.31" y="151" width="161.752" height="224" rx="3" fill="#c0432f"/><text x="798.186" y="145" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="798.186" dy="0">9 600</tspan></text><text x="715.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="715.31" dy="0">Ubuntu (WSL2)</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El color añadió una quinta parte de bytes y, sobre todo, partió la frase buscada con secuencias invisibles: la búsqueda del</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">equipo dejó de funcionar. La diferencia de 200 bytes entre sistemas son los 200 saltos de línea CRLF de Windows.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La salida se capturó con una tubería, de modo que isatty() fue falso; no se probó un terminal interactivo.</tspan></text></svg>
