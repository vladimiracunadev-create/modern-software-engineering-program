<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 329" width="1050" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un informe de 200 líneas con una palabra en rojo, escrito a una tubería</title><desc id="d">Tabla: con detección de terminal el informe ocupa 8 000 bytes en Windows y 7 800 en Ubuntu y no tiene escapes; con color siempre ocupa 9 800 y 9 600, tiene 200 líneas con escapes y la búsqueda de la frase ERROR nota encuentra 0 coincidencias, que pasan a 200 al quitar los escapes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="329" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Política</tspan></text><rect x="380" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">Bytes (Windows / Ubuntu)</tspan></text><rect x="610" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">Líneas con escapes</tspan></text><rect x="800" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="917" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="917" dy="0">Coincidencias de «ERROR nota»</tspan></text><rect x="10" y="56" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Color solo en terminal (salida a tubería)</tspan></text><rect x="380" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">8 000 / 7 800</tspan></text><rect x="610" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">0</tspan></text><rect x="800" y="56" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">200</tspan></text><rect x="10" y="114" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Color siempre (ingenuo)</tspan></text><rect x="380" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">9 800 / 9 600</tspan></text><rect x="610" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">200</tspan></text><rect x="800" y="114" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">0 (200 tras quitar los escapes)</tspan></text><rect x="10" y="172" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Sobrecoste del color</tspan></text><rect x="380" y="172" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">+22,5 % / +23,1 %</tspan></text><rect x="610" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">—</tspan></text><rect x="800" y="172" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">—</tspan></text><rect x="10" y="234" width="1030" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="525" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">El color añadió una quinta parte de bytes y, sobre todo, partió la frase buscada con secuencias invisibles: la búsqueda del equipo dejó de</tspan></text><text x="525" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">funcionar. La diferencia de 200 bytes entre sistemas son los 200 saltos de línea CRLF de Windows.</tspan></text><text x="525" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">La salida se capturó con una tubería, de modo que isatty() fue falso; no se probó un terminal interactivo.</tspan></text></svg>
