<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" width="1000" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Identificadores distintos de 500 tras truncarlos a un ancho dado</title><desc id="d">Barras: de 500 identificadores sintéticos que comparten un prefijo, truncar por el final a 12 caracteres deja solo 3 distintos, a 16 deja 458 y a 20 o 24 los 500; truncar por el medio conserva los 500 con cualquiera de los cuatro anchos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="395" fill="#ffffff"/><text x="370" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Truncado al final, ancho 12</tspan></text><rect x="380" y="16" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="392" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">3 de 500</tspan></text><text x="370" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Truncado al final, ancho 16</tspan></text><rect x="380" y="60" width="389.3" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="777.3" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="777.3" dy="0">458</tspan></text><text x="370" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Truncado al final, ancho 20</tspan></text><rect x="380" y="104" width="425" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="813" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="813" dy="0">500</tspan></text><text x="370" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Truncado al final, ancho 24</tspan></text><rect x="380" y="148" width="425" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="813" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="813" dy="0">500</tspan></text><text x="370" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Truncado por el medio, ancho 12</tspan></text><rect x="380" y="192" width="425" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="813" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="813" dy="0">500</tspan></text><text x="370" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Truncado por el medio, ancho 16</tspan></text><rect x="380" y="236" width="425" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="813" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="813" dy="0">500</tspan></text><rect x="10" y="284" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Cortar por el final conserva el prefijo común y destruye lo distintivo: con 12 columnas 497 filas se volvieron indistinguibles.</tspan></text><text x="500" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Mostrar principio y final (o lo distintivo primero) conserva la diferencia con el mismo ancho. El truncado es una vista; la</tspan></text><text x="500" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">herramienta debe poder dar el valor completo.</tspan></text><text x="500" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Identificadores de 23 caracteres con semilla 221; si lo distintivo estuviera al principio, cortar por el final bastaría.</tspan></text></svg>
