<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 387" width="1050" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pedir a un servicio que termine: lo que ocurre en Windows y en Ubuntu</title><desc id="d">Tabla: en Windows, terminate equivale a una terminación forzada que no ejecuta el manejador y devuelve código 1, y solo CTRL_BREAK_EVENT dispara una limpieza ordenada; en Ubuntu terminate envía SIGTERM, que ejecuta el manejador y deja la marca de limpieza, y un manejador que ignora la señal obliga a forzar con SIGKILL.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="387" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Qué se hace</tspan></text><rect x="360" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Windows</tspan></text><rect x="700" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">Ubuntu (WSL2)</tspan></text><rect x="10" y="56" width="344" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="92.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">terminate() con un manejador que limpia en 0,2 s</tspan></text><rect x="360" y="56" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="84.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">Código 1 · sin limpieza (terminación</tspan></text><text x="527" y="100.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">inmediata)</tspan></text><rect x="700" y="56" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">Código 0 · marca de limpieza escrita</tspan></text><rect x="10" y="128" width="344" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="164.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">terminate() con un manejador que ignora la señal</tspan></text><rect x="360" y="128" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">Código 1 · el proceso desaparece</tspan></text><rect x="700" y="128" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">Código −9 tras 1,5 s: hubo que forzar</tspan></text><rect x="10" y="200" width="344" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">CTRL_BREAK_EVENT (grupo de procesos nuevo)</tspan></text><rect x="360" y="200" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">Código 0 · marca de limpieza escrita</tspan></text><rect x="700" y="200" width="334" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">No existe</tspan></text><rect x="10" y="276" width="1030" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="525" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">El mismo método de Python significa dos cosas: pedir y obligar. Un servicio que debe cerrar conexiones y vaciar datos necesita, en</tspan></text><text x="525" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Windows, un canal de aviso distinto (CTRL_BREAK, una orden de control o una petición por un canal propio), y en cualquier sistema un plazo</tspan></text><text x="525" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">tras el cual se fuerza.</tspan></text><text x="525" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Un hijo de Python con un manejador de señales; no se probó un servicio de Windows real ni systemd.</tspan></text></svg>
