<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 493" width="1020" height="493" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hilos y procesos para trabajo de espera y de cálculo</title><desc id="d">Tabla: para 40 esperas de 0,05 segundos, ocho hilos tardan 0,25 segundos frente a 2,01 secuencial; para ocho cálculos de CPU los hilos no aceleran (4,95 s en Windows frente a 2,27 secuencial) y cuatro procesos sí lo hacen; arrancar un pool de procesos cuesta 0,41 segundos en Windows y 0,06 en Ubuntu.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="493" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Carga y estrategia</tspan></text><rect x="460" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">Windows</tspan></text><rect x="730" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">Ubuntu (WSL2)</tspan></text><rect x="10" y="56" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">40 esperas de 0,05 s: secuencial</tspan></text><rect x="460" y="56" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">2,01 s</tspan></text><rect x="730" y="56" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">2,01 s</tspan></text><rect x="10" y="102" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">40 esperas: 8 hilos</tspan></text><rect x="460" y="102" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">0,25 s</tspan></text><rect x="730" y="102" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0,26 s</tspan></text><rect x="10" y="148" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">40 esperas: 4 procesos</tspan></text><rect x="460" y="148" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">1,14 s</tspan></text><rect x="730" y="148" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0,52 s</tspan></text><rect x="10" y="194" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">8 cálculos de CPU: secuencial</tspan></text><rect x="460" y="194" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">2,27 s</tspan></text><rect x="730" y="194" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">1,16 s</tspan></text><rect x="10" y="240" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">8 cálculos: 8 hilos</tspan></text><rect x="460" y="240" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">4,95 s</tspan></text><rect x="730" y="240" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">1,34 s</tspan></text><rect x="10" y="286" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">8 cálculos: 4 procesos</tspan></text><rect x="460" y="286" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">1,31 s</tspan></text><rect x="730" y="286" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0,54 s</tspan></text><rect x="10" y="332" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Arrancar 2 procesos con 2 tareas triviales</tspan></text><rect x="460" y="332" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">0,41 s</tspan></text><rect x="730" y="332" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0,06 s</tspan></text><rect x="10" y="382" width="1000" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="406.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">Los hilos sirven para esperar, no para calcular; los procesos sirven para calcular pero cuestan arranque (mucho más en Windows, que no</tspan></text><text x="510" y="423.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">puede hacer fork). Las cifras son medianas de tres ejecuciones en un equipo y variaron entre ejecuciones hasta 2 veces: se leen como</tspan></text><text x="510" y="440.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">orden de magnitud.</tspan></text><text x="510" y="479.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Tiempos de un equipo con 8 procesadores lógicos; el patrón (no las cifras) es el hallazgo.</tspan></text></svg>
