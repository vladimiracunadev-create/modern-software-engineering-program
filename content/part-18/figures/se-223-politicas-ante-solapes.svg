<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 329" width="1050" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un trabajo cada 60 s cuya duración varía: tres políticas durante 1 440 ejecuciones</title><desc id="d">Tabla: con una duración mediana de 40 segundos y 14 por ciento de ejecuciones por encima del periodo, sin bloqueo hay 271 arranques solapados, omitir deja 174 sin ejecutar y encolar retrasa hasta 79 segundos; con mediana de 55 segundos y 41,7 por ciento por encima del periodo hay 1 353 solapes, 439 omitidas o un retraso de 576 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="329" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Política</tspan></text><rect x="280" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Mediana 40 s (14,0 % superan el periodo)</tspan></text><rect x="660" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Mediana 55 s (41,7 % superan el periodo)</tspan></text><rect x="10" y="56" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Sin bloqueo</tspan></text><rect x="280" y="56" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">271 arranques solapados</tspan></text><rect x="660" y="56" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1 353 arranques solapados</tspan></text><rect x="10" y="114" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Omitir si sigue activo</tspan></text><rect x="280" y="114" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">174 ejecuciones omitidas (1 266 hechas)</tspan></text><rect x="660" y="114" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">439 omitidas (1 001 hechas)</tspan></text><rect x="10" y="172" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Encolar y ejecutar en orden</tspan></text><rect x="280" y="172" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Retraso máximo de inicio: 79 s</tspan></text><rect x="660" y="172" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Retraso máximo de inicio: 576 s</tspan></text><rect x="10" y="234" width="1030" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="525" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Ninguna política arregla un trabajo que tarda más que su periodo: elige entre solapar (riesgo de corromper datos), omitir (datos que no se</tspan></text><text x="525" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">procesan) o encolar (retraso que crece). La señal para actuar es la proporción de ejecuciones que superan el periodo, no el promedio.</tspan></text><text x="525" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Simulación con semilla 223: duraciones lognormales con sigma 0,35; supuestos del autor, no mediciones de un sistema.</tspan></text></svg>
