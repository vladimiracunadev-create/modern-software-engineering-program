<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una ejecución frente a tres: qué operaciones se pueden repetir</title><desc id="d">Puntos unidos por una línea con el efecto observable tras una y tras tres ejecuciones de siete operaciones: anexar una línea, incrementar un contador y enviar un aviso pasan de 1 a 3; fijar un valor, el upsert por clave, crear si falta y enviar un aviso con clave de idempotencia se quedan en 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una ejecución frente a tres: qué operaciones se pueden repetir</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Tras 1 ejecución</tspan></text><circle cx="190.64" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Tras 3 ejecuciones</tspan></text><line x1="340.06" y1="77" x2="340.06" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="340.06" y1="385" x2="340.06" y2="390" stroke="#5b7280" stroke-width="1.4"/><text x="340.06" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="340.06" dy="0">0</tspan></text><line x1="470.327" y1="77" x2="470.327" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="470.327" y1="385" x2="470.327" y2="390" stroke="#5b7280" stroke-width="1.4"/><text x="470.327" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470.327" dy="0">1</tspan></text><line x1="600.593" y1="77" x2="600.593" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="600.593" y1="385" x2="600.593" y2="390" stroke="#5b7280" stroke-width="1.4"/><text x="600.593" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600.593" dy="0">2</tspan></text><line x1="730.86" y1="77" x2="730.86" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="730.86" y1="385" x2="730.86" y2="390" stroke="#5b7280" stroke-width="1.4"/><text x="730.86" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.86" dy="0">3</tspan></text><line x1="340.06" y1="385" x2="730.86" y2="385" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Anexar una línea</tspan></text><text x="304" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Fijar un valor</tspan></text><text x="304" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Incrementar un contador</tspan></text><text x="304" y="235.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Upsert por clave</tspan></text><text x="304" y="279.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Crear si falta</tspan></text><text x="304" y="323.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Enviar un aviso (efecto externo)</tspan></text><text x="304" y="359" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Enviar un aviso con clave de</tspan></text><text x="304" y="376" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">idempotencia</tspan></text><line x1="470.327" y1="99" x2="730.86" y2="99" stroke="#c0432f" stroke-width="4"/><circle cx="470.327" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="730.86" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="458.327" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="458.327" dy="0">1</tspan></text><text x="742.86" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="742.86" dy="0">3</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×3: no idempotente</tspan></text><line x1="470.327" y1="143" x2="470.327" y2="143" stroke="#c0432f" stroke-width="4"/><circle cx="470.327" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="470.327" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="458.327" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="458.327" dy="0">1</tspan></text><text x="482.327" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="482.327" dy="0">1</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">igual: idempotente</tspan></text><line x1="470.327" y1="187" x2="730.86" y2="187" stroke="#c0432f" stroke-width="4"/><circle cx="470.327" cy="187" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="730.86" cy="187" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="458.327" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="458.327" dy="0">1</tspan></text><text x="742.86" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="742.86" dy="0">3</tspan></text><text x="926" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×3: no idempotente</tspan></text><line x1="470.327" y1="231" x2="470.327" y2="231" stroke="#c0432f" stroke-width="4"/><circle cx="470.327" cy="231" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="470.327" cy="231" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="458.327" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="458.327" dy="0">1</tspan></text><text x="482.327" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="482.327" dy="0">1</tspan></text><text x="926" y="235.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">igual: idempotente</tspan></text><line x1="470.327" y1="275" x2="470.327" y2="275" stroke="#c0432f" stroke-width="4"/><circle cx="470.327" cy="275" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="470.327" cy="275" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="458.327" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="458.327" dy="0">1</tspan></text><text x="482.327" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="482.327" dy="0">1</tspan></text><text x="926" y="279.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">igual: idempotente</tspan></text><line x1="470.327" y1="319" x2="730.86" y2="319" stroke="#c0432f" stroke-width="4"/><circle cx="470.327" cy="319" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="730.86" cy="319" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="458.327" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="458.327" dy="0">1</tspan></text><text x="742.86" y="323.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="742.86" dy="0">3</tspan></text><text x="926" y="323.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×3: no idempotente</tspan></text><line x1="470.327" y1="363" x2="470.327" y2="363" stroke="#c0432f" stroke-width="4"/><circle cx="470.327" cy="363" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="470.327" cy="363" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="458.327" y="367.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="458.327" dy="0">1</tspan></text><text x="482.327" y="367.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="482.327" dy="0">1</tspan></text><text x="926" y="367.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">igual: idempotente</tspan></text><text x="535.46" y="429" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="535.46" dy="0">Efecto observado (líneas, entradas, valor o avisos)</tspan></text><rect x="10" y="443" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="467.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La misma intención —«registrar la nota»— es idempotente como «fijar» y no lo es como «anexar». El efecto externo (un aviso)</tspan></text><text x="470" y="484.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">solo se vuelve repetible cuando se acompaña de una clave que el receptor recuerda.</tspan></text><text x="470" y="532.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación local en memoria; sin servicios reales; idéntica en ambos sistemas.</tspan></text></svg>
