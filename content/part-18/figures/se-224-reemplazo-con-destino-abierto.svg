<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 388" width="940" height="388" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reemplazar un archivo que otro proceso mantiene abierto</title><desc id="d">Diagrama de reemplazar o borrar un archivo que otro proceso mantiene abierto: en Windows os.replace y os.remove fallan con PermissionError; en Ubuntu ambos se permiten y el lector conserva el contenido anterior; tras cerrar el lector el reemplazo funciona.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="388" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reemplazar un archivo que otro proceso mantiene abierto</tspan></text><rect x="14" y="106.68" width="250" height="86.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="128.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Un lector mantiene el archivo</tspan></text><text x="139" y="145.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">abierto</tspan></text><text x="139" y="161.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">otro proceso intenta</tspan></text><text x="139" y="178.56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">reemplazarlo o borrarlo</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">os.replace sobre el destino abierto</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">Windows: PermissionError (errno 13, WinError 5) · Ubuntu: reemplazo permitido;</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">el lector sigue viendo el contenido viejo</tspan></text><polyline points="264,149.96 299,149.96 299,83.96 334,83.96" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="130.92" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="153.24" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">os.remove con el archivo abierto</tspan></text><text x="630" y="169.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">Windows: PermissionError (errno 13) · Ubuntu: borrado permitido</tspan></text><polyline points="264,149.96 299,149.96 299,157.92 334,157.92" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="196.92" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="219.24" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Tras cerrar el lector</tspan></text><text x="630" y="235.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">el reemplazo funciona</tspan></text><polyline points="264,149.96 299,149.96 299,223.92 334,223.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="264.92" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="289.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El reemplazo atómico no es igual de atómico en los dos sistemas: en Windows exige que nadie tenga el destino abierto y la</tspan></text><text x="470" y="306.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">automatización debe reintentar o fallar con un código temporal. La solución no es ignorar el error sino tratarlo como una</tspan></text><text x="470" y="323.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">condición esperada.</tspan></text><text x="470" y="370.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un proceso lector y un reemplazo en el mismo equipo; no se midieron antivirus, indexadores ni sistemas de red.</tspan></text></svg>
