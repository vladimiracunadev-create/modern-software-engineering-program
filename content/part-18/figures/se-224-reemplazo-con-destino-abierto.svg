<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 371" width="1060" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reemplazar un archivo que otro proceso mantiene abierto</title><desc id="d">Tabla: en Windows, os.replace sobre un archivo abierto por un lector falla con PermissionError y el borrado también; en Ubuntu ambos se permiten y el lector conserva el contenido anterior; tras cerrar el lector el reemplazo funciona en Windows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="371" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Operación</tspan></text><rect x="390" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Windows</tspan></text><rect x="720" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">Ubuntu (WSL2)</tspan></text><rect x="10" y="56" width="374" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="92.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">os.replace con el destino abierto por un lector</tspan></text><rect x="390" y="56" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">PermissionError (errno 13, WinError 5)</tspan></text><rect x="720" y="56" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="84.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">Reemplazo permitido; el lector sigue viendo</tspan></text><text x="882" y="100.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">el contenido viejo</tspan></text><rect x="10" y="128" width="374" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="164.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">os.remove con el archivo abierto</tspan></text><rect x="390" y="128" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">PermissionError (errno 13)</tspan></text><rect x="720" y="128" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">Borrado permitido</tspan></text><rect x="10" y="200" width="374" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Tras cerrar el lector</tspan></text><rect x="390" y="200" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">El reemplazo funciona</tspan></text><rect x="720" y="200" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">No aplica</tspan></text><rect x="10" y="276" width="1040" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="530" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">El reemplazo atómico no es igual de atómico en los dos sistemas: en Windows exige que nadie tenga el destino abierto y la automatización</tspan></text><text x="530" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">debe reintentar o fallar con un código temporal. La solución no es ignorar el error sino tratarlo como una condición esperada.</tspan></text><text x="530" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Un proceso lector y un reemplazo en el mismo equipo; no se midieron antivirus, indexadores ni sistemas de red.</tspan></text></svg>
