<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 371" width="1030" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Archivo sintético de 20 MB: qué comprobación detecta cada alteración</title><desc id="d">Tabla: sobre un archivo sintético de 20 megabytes, un bit alterado conserva la longitud pero cambia CRC32 y SHA-256; el truncado y el relleno cambian la longitud y los resúmenes; el archivo idéntico coincide en todo; un CRC32 de 32 bits colisionó entre dos mensajes de 8 bytes tras 87 650 intentos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="371" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Alteración</tspan></text><rect x="340" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Longitud</tspan></text><rect x="560" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">CRC32</tspan></text><rect x="790" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="902" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="902" dy="0">SHA-256</tspan></text><rect x="10" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Un bit alterado</tspan></text><rect x="340" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Igual</tspan></text><rect x="560" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Distinto</tspan></text><rect x="790" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">Distinto</tspan></text><rect x="10" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Truncado en 1 000 bytes</tspan></text><rect x="340" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Distinta</tspan></text><rect x="560" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Distinto</tspan></text><rect x="790" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">Distinto</tspan></text><rect x="10" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">16 bytes añadidos al final</tspan></text><rect x="340" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Distinta</tspan></text><rect x="560" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Distinto</tspan></text><rect x="790" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">Distinto</tspan></text><rect x="10" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Idéntico</tspan></text><rect x="340" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Igual</tspan></text><rect x="560" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Igual</tspan></text><rect x="790" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">Igual</tspan></text><rect x="10" y="260" width="1010" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="515" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">La longitud detecta un truncado pero no un bit alterado. El CRC32 detecta errores accidentales, pero se encontró una colisión entre dos</tspan></text><text x="515" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">mensajes de 8 bytes tras 87 650 intentos: no protege frente a quien alterara el archivo a propósito. SHA-256 corrió a unos 256 MB/s en</tspan></text><text x="515" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">Windows y 178 MB/s en Ubuntu en este equipo; un resumen publicado por el mismo canal que el binario no prueba su origen.</tspan></text><text x="515" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Semilla 225; los resúmenes dan integridad frente a errores, no autenticidad: eso exige una firma o un canal independiente.</tspan></text></svg>
