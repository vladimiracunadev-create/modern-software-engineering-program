<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Archivo sintético de 20 MB: qué comprobación detecta cada alteración</title><desc id="d">Mapa de calor con qué comprobación cambia ante cada alteración de un archivo sintético de 20 MB: un bit alterado conserva la longitud pero cambia CRC32 y SHA-256; el truncado y el relleno cambian la longitud y los dos resúmenes; el archivo idéntico no cambia ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="460" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Archivo sintético de 20 MB: qué comprobación detecta cada alteración</tspan></text><text x="603" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603" dy="0">¿La comprobación lo detecta?</tspan></text><text x="391.667" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="391.667" dy="0">Longitud</tspan></text><text x="603" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="603" dy="0">CRC32</tspan></text><text x="814.333" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="814.333" dy="0">SHA-256</tspan></text><text x="276" y="121.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="276" dy="0">Un bit alterado</tspan></text><text x="276" y="167.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="276" dy="0">Truncado en 1 000 bytes</tspan></text><text x="276" y="213.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="276" dy="0">16 bytes añadidos al final</tspan></text><text x="276" y="259.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="276" dy="0">Idéntico</tspan></text><rect x="287.5" y="95.5" width="208.333" height="43" rx="4" fill="#dff1ee" stroke="#102a43" stroke-width="3"/><text x="391.667" y="121.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="391.667" dy="0">igual</tspan></text><rect x="498.833" y="95.5" width="208.333" height="43" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="603" y="121.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="603" dy="0">distinto</tspan></text><rect x="710.167" y="95.5" width="208.333" height="43" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="814.333" y="121.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="814.333" dy="0">distinto</tspan></text><rect x="287.5" y="141.5" width="208.333" height="43" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="391.667" y="167.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="391.667" dy="0">distinto</tspan></text><rect x="498.833" y="141.5" width="208.333" height="43" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="603" y="167.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="603" dy="0">distinto</tspan></text><rect x="710.167" y="141.5" width="208.333" height="43" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="814.333" y="167.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="814.333" dy="0">distinto</tspan></text><rect x="287.5" y="187.5" width="208.333" height="43" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="391.667" y="213.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="391.667" dy="0">distinto</tspan></text><rect x="498.833" y="187.5" width="208.333" height="43" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="603" y="213.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="603" dy="0">distinto</tspan></text><rect x="710.167" y="187.5" width="208.333" height="43" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="814.333" y="213.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="814.333" dy="0">distinto</tspan></text><rect x="287.5" y="233.5" width="208.333" height="43" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="391.667" y="259.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="391.667" dy="0">igual</tspan></text><rect x="498.833" y="233.5" width="208.333" height="43" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="603" y="259.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="603" dy="0">igual</tspan></text><rect x="710.167" y="233.5" width="208.333" height="43" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="814.333" y="259.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="814.333" dy="0">igual</tspan></text><text x="20" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 186)">Alteración</text><text x="286" y="304" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="286" dy="0">igual</tspan></text><rect x="331.7" y="292" width="30.5" height="14" fill="#dff1ee"/><rect x="361.7" y="292" width="30.5" height="14" fill="#c0e1e0"/><rect x="391.7" y="292" width="30.5" height="14" fill="#a2d0d2"/><rect x="421.7" y="292" width="30.5" height="14" fill="#83c0c4"/><rect x="451.7" y="292" width="30.5" height="14" fill="#64b0b6"/><rect x="481.7" y="292" width="30.5" height="14" fill="#45a0a8"/><rect x="511.7" y="292" width="30.5" height="14" fill="#278f9a"/><rect x="541.7" y="292" width="30.5" height="14" fill="#087f8c"/><text x="579.7" y="304" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="579.7" dy="0">distinto</tspan></text><text x="648.02" y="304" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="648.02" dy="0">más oscuro = mayor (distinto frente al original)</tspan></text><rect x="10" y="320" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La longitud detecta un truncado pero no un bit alterado. El CRC32 detecta errores accidentales, pero se encontró una</tspan></text><text x="470" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">colisión entre dos mensajes de 8 bytes tras 87 650 intentos: no protege frente a quien alterara el archivo a propósito.</tspan></text><text x="470" y="378.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">SHA-256 corrió a unos 256 MB/s en Windows y 178 MB/s en Ubuntu en este equipo; un resumen publicado por el mismo canal que</tspan></text><text x="470" y="394.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el binario no prueba su origen.</tspan></text><text x="470" y="442.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Semilla 225; los resúmenes dan integridad frente a errores, no autenticidad: eso exige una firma o un canal independiente.</tspan></text></svg>
