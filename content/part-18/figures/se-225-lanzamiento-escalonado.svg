<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 379" width="1050" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clientes rotos de 10 000 por un lanzamiento defectuoso</title><desc id="d">Barras: con un defecto del 10 por ciento un lanzamiento a todos rompe 1 002 clientes y uno escalonado se detiene tras 11; con 2 por ciento rompe 194 frente a 3; con un defecto de 0,2 por ciento ambos rompen 20 porque el umbral de 1 por ciento nunca se supera.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="379" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Defecto 0,2 %: todos a la vez</tspan></text><rect x="480" y="16" width="8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="496" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="496" dy="0">20 rotos</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Defecto 0,2 %: escalonado (no se detiene)</tspan></text><rect x="480" y="60" width="8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="496" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="496" dy="0">20 rotos</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Defecto 2 %: todos a la vez</tspan></text><rect x="480" y="104" width="77.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="565.6" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="565.6" dy="0">194 rotos</tspan></text><text x="470" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Defecto 2 %: escalonado (se detiene al 1 %)</tspan></text><rect x="480" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="492" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">3 rotos</tspan></text><text x="470" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Defecto 10 %: todos a la vez</tspan></text><rect x="480" y="192" width="400.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="888.8" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="888.8" dy="0">1 002 rotos</tspan></text><text x="470" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Defecto 10 %: escalonado (se detiene al 1 %)</tspan></text><rect x="480" y="236" width="4.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="492.4" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492.4" dy="0">11 rotos</tspan></text><rect x="10" y="284" width="1030" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">El escalonamiento acota el daño de un defecto visible, pero con un defecto por debajo del umbral de detección completó el lanzamiento y</tspan></text><text x="525" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">rompió a 20 clientes de todos modos. El umbral y la señal de fallo son parte del diseño; sin ellos el escalonamiento es solo lentitud.</tspan></text><text x="525" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Simulación con semilla 5; el umbral del 1 % y las tasas de defecto son supuestos del autor.</tspan></text></svg>
