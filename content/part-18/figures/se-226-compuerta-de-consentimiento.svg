<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una compuerta de consentimiento frente a cinco escenarios (servidor local en 127.0.0.1)</title><desc id="d">Barras horizontales con cuántos de cinco escenarios detectan cada defecto de una compuerta de consentimiento: el código correcto no dispara ninguno, cuatro defectos y el opt-out explícito los detecta un único escenario cada uno y el que envía antes de decidir lo detectan los cinco.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="480" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una compuerta de consentimiento frente a cinco escenarios (servidor local en 127.0.0.1)</tspan></text><line x1="274" y1="49" x2="274" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="315" x2="274" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="400.788" y1="49" x2="400.788" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="400.788" y1="315" x2="400.788" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="400.788" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="400.788" dy="0">1</tspan></text><line x1="527.576" y1="49" x2="527.576" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="527.576" y1="315" x2="527.576" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="527.576" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527.576" dy="0">2</tspan></text><line x1="654.364" y1="49" x2="654.364" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="654.364" y1="315" x2="654.364" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="654.364" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="654.364" dy="0">3</tspan></text><line x1="781.152" y1="49" x2="781.152" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="781.152" y1="315" x2="781.152" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="781.152" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="781.152" dy="0">4</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="315" x2="907.94" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">5</tspan></text><line x1="274" y1="315" x2="907.94" y2="315" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Código correcto</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">M1 activado por defecto</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">M2 ignora DO_NOT_TRACK</tspan></text><text x="264" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">M3 ignora el entorno de CI</tspan></text><text x="264" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">M4 envía antes de decidir</tspan></text><text x="264" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">M6 incluye una ruta local</tspan></text><text x="264" y="300.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">M7 ignora el opt-out explícito</tspan></text><rect x="274" y="55" width="2" height="26" rx="3" fill="#087f8c"/><text x="283" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="93" width="126.788" height="26" rx="3" fill="#087f8c"/><text x="407.788" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.788" dy="0">1</tspan></text><rect x="274" y="131" width="126.788" height="26" rx="3" fill="#087f8c"/><text x="407.788" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.788" dy="0">1</tspan></text><rect x="274" y="169" width="126.788" height="26" rx="3" fill="#087f8c"/><text x="407.788" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.788" dy="0">1</tspan></text><rect x="274" y="207" width="633.94" height="26" rx="3" fill="#087f8c"/><text x="914.94" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">5</tspan></text><rect x="274" y="245" width="126.788" height="26" rx="3" fill="#087f8c"/><text x="407.788" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.788" dy="0">1</tspan></text><rect x="274" y="283" width="126.788" height="26" rx="3" fill="#087f8c"/><text x="407.788" y="300.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.788" dy="0">1</tspan></text><text x="590.97" y="359" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="590.97" dy="0">Escenarios que lo detectan, de 5</tspan></text><rect x="10" y="373" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada defecto exige su escenario: una suite con solo «opt-in» y «opt-out», los dos casos que cualquiera escribe, deja pasar</tspan></text><text x="470" y="414.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tres de los seis. Las pruebas de una compuerta de privacidad se escriben por los casos en que NO debe salir nada.</tspan></text><text x="470" y="462.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Servidor HTTP local que cuenta peticiones y examina la carga; no hay red ni servicio real.</tspan></text></svg>
