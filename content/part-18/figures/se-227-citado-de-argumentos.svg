eight="33" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="807.667" y="332.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="807.667" dy="0">bien</tspan></text><rect x="247.5" y="347.5" width="221.667" height="33" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="358.333" y="368.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358.333" dy="0">mal</tspan></text><rect x="472.167" y="347.5" width="221.667" height="33" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="583" y="368.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="583" dy="0">bien</tspan></text><rect x="696.833" y="347.5" width="221.667" height="33" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="807.667" y="368.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="807.667" dy="0">mal</tspan></text><text x="20" y="238" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 238)">Nombre de archivo</text><text x="246" y="408" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="246" dy="0">bien</tspan></text><rect x="284.16" y="396" width="30.5" height="14" fill="#fbe4de"/><rect x="314.16" y="396" width="30.5" height="14" fill="#f3cdc5"/><rect x="344.16" y="396" width="30.5" height="14" fill="#eab6ac"/><rect x="374.16" y="396" width="30.5" height="14" fill="#e29f93"/><rect x="404.16" y="396" width="30.5" height="14" fill="#d9887a"/><rect x="434.16" y="396" width="30.5" height="14" fill="#d17161"/><rect x="464.16" y="396" width="30.5" height="14" fill="#c85a48"/><rect x="494.16" y="396" width="30.5" height="14" fill="#c0432f"/><text x="532.16" y="408" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="532.16" dy="0">inyección</tspan></text><text x="608.02" y="408" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="608.02" dy="0">más oscuro = mayor (0 bien, 1 mal, 2 inyección)</tspan></text><rect x="10" y="424" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La misma cadena se interpreta distinto según el shell. Con una lista de argumentos el sistema no reinterpreta nada. El</tspan></text><text x="470" y="465.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">único fallo restante (ñandú en Windows) es de otra naturaleza: la salida del hijo se escribió en la codificación local y el</tspan></text><text x="470" y="482.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">padre la leyó como UTF-8.</tspan></text><text x="470" y="529.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Doce nombres de prueba; el comando ejecutado es un script que imprime sus argumentos, sin tocar archivos reales.</tspan></text></svg>
