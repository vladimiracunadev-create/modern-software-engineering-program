<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 547" width="940" height="547" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un nombre de archivo pasado como cadena con shell=True frente a una lista de argumentos</title><desc id="d">Mapa de calor con el resultado de pasar ocho nombres de archivo como cadena con shell=True en Windows y en Ubuntu, o como lista de argumentos: la lista acierta en todos; la cadena falla o permite una inyección de comando en la mayoría, con una inyección en Windows y dos en Ubuntu.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="547" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un nombre de archivo pasado como cadena con shell=True frente a una lista de argumentos</tspan></text><text x="583" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="583" dy="0">Resultado</tspan></text><text x="358.333" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358.333" dy="0">Cadena, Windows (cmd)</tspan></text><text x="583" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="583" dy="0">Cadena, Ubuntu (sh)</tspan></text><text x="807.667" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="807.667" dy="0">Lista de argumentos</tspan></text><text x="236" y="116.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="236" dy="0">a b.txt</tspan></text><text x="236" y="152.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="236" dy="0">x;echo INYECTADO</tspan></text><text x="236" y="188.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="236" dy="0">x&amp;echo INYECTADO</tspan></text><text x="236" y="224.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="236" dy="0">$HOME.txt</tspan></text><text x="236" y="260.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="236" dy="0">&#x27;q&#x27;.txt</tspan></text><text x="236" y="296.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="236" dy="0">(x).txt</tspan></text><text x="236" y="332.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="236" dy="0">a|b.txt</tspan></text><text x="236" y="368.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="236" dy="0">ñandú.txt</tspan></text><rect x="247.5" y="95.5" width="221.667" height="33" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="358.333" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358.333" dy="0">mal</tspan></text><rect x="472.167" y="95.5" width="221.667" height="33" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="583" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="583" dy="0">mal</tspan></text><rect x="696.833" y="95.5" width="221.667" height="33" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="807.667" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="807.667" dy="0">bien</tspan></text><rect x="247.5" y="131.5" width="221.667" height="33" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="358.333" y="152.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358.333" dy="0">mal</tspan></text><rect x="472.167" y="131.5" width="221.667" height="33" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="583" y="152.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="583" dy="0">inyección</tspan></text><rect x="696.833" y="131.5" width="221.667" height="33" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="807.667" y="152.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="807.667" dy="0">bien</tspan></text><rect x="247.5" y="167.5" width="221.667" height="33" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="358.333" y="188.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="358.333" dy="0">inyección</tspan></text><rect x="472.167" y="167.5" width="221.667" height="33" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="583" y="188.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="583" dy="0">inyección</tspan></text><rect x="696.833" y="167.5" width="221.667" height="33" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="807.667" y="188.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="807.667" dy="0">bien</tspan></text><rect x="247.5" y="203.5" width="221.667" height="33" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="358.333" y="224.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="358.333" dy="0">bien</tspan></text><rect x="472.167" y="203.5" width="221.667" height="33" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="583" y="224.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="583" dy="0">mal</tspan></text><rect x="696.833" y="203.5" width="221.667" height="33" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="807.667" y="224.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="807.667" dy="0">bien</tspan></text><rect x="247.5" y="239.5" width="221.667" height="3