<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 555" width="1050" height="555" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez fallos inyectados en una copia de seguridad: versión frágil frente a endurecida</title><desc id="d">Tabla: ante diez escenarios, la versión frágil acierta en 2, se cuelga en 1 y daña en silencio en 7; la versión endurecida acierta en los 10, rechazando o fallando con códigos 2, 1, 65 o 75 sin tocar las copias existentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="555" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Escenario</tspan></text><rect x="410" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Versión frágil</tspan></text><rect x="660" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Versión endurecida</tspan></text><rect x="10" y="56" width="394" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="76.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Normal</tspan></text><rect x="410" y="56" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">Correcto</tspan></text><rect x="660" y="56" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Correcto</tspan></text><rect x="10" y="96" width="394" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="116.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Directorio de origen con espacio</tspan></text><rect x="410" y="96" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="116.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">Daño silencioso</tspan></text><rect x="660" y="96" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="116.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Correcto</tspan></text><rect x="10" y="136" width="394" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="156.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Nombre con tilde y eñe</tspan></text><rect x="410" y="136" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="156.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">Correcto</tspan></text><rect x="660" y="136" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="156.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Correcto</tspan></text><rect x="10" y="176" width="394" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Origen inexistente</tspan></text><rect x="410" y="176" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">Daño silencioso</tspan></text><rect x="660" y="176" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Rechaza (código 2)</tspan></text><rect x="10" y="216" width="394" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Origen vacío</tspan></text><rect x="410" y="216" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">Daño silencioso</tspan></text><rect x="660" y="216" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Rechaza (código 2)</tspan></text><rect x="10" y="256" width="394" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="276.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">El destino es un archivo</tspan></text><rect x="410" y="256" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="276.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">Daño silencioso</tspan></text><rect x="660" y="256" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="276.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Rechaza (código 2)</tspan></text><rect x="10" y="296" width="394" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="316.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">La copia sale con código 3</tspan></text><rect x="410" y="296" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">Daño silencioso</tspan></text><rect x="660" y="296" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Falla (código 1)</tspan></text><rect x="10" y="336" width="394" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="356.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">La copia se cuelga 4 s</tspan></text><rect x="410" y="336" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">Se cuelga</tspan></text><rect x="660" y="336" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Código 75 tras 1,5 s</tspan></text><rect x="10" y="376" width="394" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="396.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Copia a la mitad con código 0</tspan></text><rect x="410" y="376" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="396.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">Daño silencioso</tspan></text><rect x="660" y="376" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="396.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Detecta (código 65)</tspan></text><rect x="10" y="416" width="394" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="436.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Otra instancia ya corre</tspan></text><rect x="410" y="416" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="436.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">Daño silencioso</tspan></text><rect x="660" y="416" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="436.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Rechaza (código 75)</tspan></text><rect x="10" y="460" width="1030" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="525" y="484.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">«Daño silencioso» significa código 0 con las copias viejas borradas o sin copia nueva. La versión frágil borra antes de copiar, no cita</tspan></text><text x="525" y="501.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">las rutas y no mira el código de salida; en siete de los diez escenarios el trabajo terminó con éxito aparente.</tspan></text><text x="525" y="541.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Resultados idénticos en Windows y Ubuntu; la sintaxis de rutas con espacio y las tildes son los casos que más cambian entre sistemas.</tspan></text></svg>
