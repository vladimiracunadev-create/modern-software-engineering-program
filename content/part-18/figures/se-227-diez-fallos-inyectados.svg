<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 338" width="940" height="338" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez fallos inyectados en una copia de seguridad: versión frágil frente a endurecida</title><desc id="d">Barras apiladas con el resultado de diez fallos inyectados en una copia de seguridad: la versión frágil acierta en 2, se cuelga en 1 y daña en silencio en 7; la versión endurecida acierta en los 10 rechazando o fallando con códigos 2, 1, 65 o 75.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="338" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diez fallos inyectados en una copia de seguridad: versión frágil frente a endurecida</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Correcto</tspan></text><rect x="124.32" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Se cuelga</tspan></text><rect x="240.18" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="260.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="260.18" dy="0">Daño silencioso</tspan></text><line x1="194" y1="77" x2="194" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="157" x2="194" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">0</tspan></text><line x1="330.34" y1="77" x2="330.34" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="330.34" y1="157" x2="330.34" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="330.34" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="330.34" dy="0">2</tspan></text><line x1="466.68" y1="77" x2="466.68" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="466.68" y1="157" x2="466.68" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="466.68" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="466.68" dy="0">4</tspan></text><line x1="603.02" y1="77" x2="603.02" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="603.02" y1="157" x2="603.02" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="603.02" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="603.02" dy="0">6</tspan></text><line x1="739.36" y1="77" x2="739.36" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="739.36" y1="157" x2="739.36" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="739.36" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="739.36" dy="0">8</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10</tspan></text><line x1="194" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Versión frágil</tspan></text><text x="184" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Versión endurecida</tspan></text><rect x="194" y="84" width="136.34" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="262.17" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="262.17" dy="0">2</tspan></text><rect x="330.34" y="84" width="68.17" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="364.425" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="364.425" dy="0">1</tspan></text><rect x="398.51" y="84" width="477.19" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="637.105" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637.105" dy="0">7</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">10</tspan></text><rect x="194" y="124" width="681.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="534.85" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="534.85" dy="0">10</tspan></text><rect x="875.7" y="124" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="875.7" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">10</tspan></text><text x="534.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="534.85" dy="0">Escenarios, de 10</tspan></text><rect x="10" y="215" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">«Daño silencioso» significa código 0 con las copias viejas borradas o sin copia nueva. La versión frágil borra antes de</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">copiar, no cita las rutas y no mira el código de salida; en siete de los diez escenarios el trabajo terminó con éxito</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">aparente.</tspan></text><text x="470" y="320.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados idénticos en Windows y Ubuntu; la sintaxis de rutas con espacio y las tildes son los casos que más cambian entre sistemas.</tspan></text></svg>
