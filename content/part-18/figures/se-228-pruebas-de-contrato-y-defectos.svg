<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 539" width="1050" height="539" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Trece pruebas de contrato sobre la herramienta de referencia y seis defectos inyectados</title><desc id="d">Tabla: la suite de trece pruebas de contrato pasó 12 en la primera ejecución sobre la herramienta de referencia y reveló que las abreviaturas no se heredan en los subcomandos; tras corregirlo pasa 13; cada uno de los seis defectos inyectados lo detectan entre una y tres pruebas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="539" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Variante</tspan></text><rect x="360" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Pruebas que fallan o pasan</tspan></text><rect x="600" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Qué se descubrió</tspan></text><rect x="10" y="56" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Herramienta limpia, primera ejecución</tspan></text><rect x="360" y="56" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">12 de 13</tspan></text><rect x="600" y="56" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">T13: allow_abbrev no se hereda en subcomandos</tspan></text><rect x="10" y="102" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Herramienta corregida</tspan></text><rect x="360" y="102" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">13 de 13</tspan></text><rect x="600" y="102" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">—</tspan></text><rect x="10" y="148" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">entorno_gana</tspan></text><rect x="360" y="148" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">T09</tspan></text><rect x="600" y="148" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Precedencia: el entorno vence al flag</tspan></text><rect x="10" y="194" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">error_en_stdout</tspan></text><rect x="360" y="194" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">T04, T07</tspan></text><rect x="600" y="194" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Errores por la salida estándar</tspan></text><rect x="10" y="240" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">salida_1_generica</tspan></text><rect x="360" y="240" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">T04, T07, T08</tspan></text><rect x="600" y="240" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Un solo código 1 para datos inválidos</tspan></text><rect x="10" y="286" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">escritura_directa</tspan></text><rect x="360" y="286" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">T11</tspan></text><rect x="600" y="286" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Escribe sin archivo temporal</tspan></text><rect x="10" y="332" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">traceback_utf8</tspan></text><rect x="360" y="332" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">T08</tspan></text><rect x="600" y="332" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Traza en lugar de código 65</tspan></text><rect x="10" y="378" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="401.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">abreviaturas</tspan></text><rect x="360" y="378" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">T13</tspan></text><rect x="600" y="378" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Acepta --form por --formato</tspan></text><rect x="10" y="428" width="1030" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">La suite se probó a sí misma: cada defecto inyectado fue detectado por al menos una prueba, y antes de eso encontró un defecto real de la</tspan></text><text x="525" y="469.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">herramienta que no se había inyectado. Ninguno de los seis defectos fue visible en las pruebas del camino feliz (T01, T02, T05): cayeron</tspan></text><text x="525" y="486.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">en errores, precedencia y escritura.</tspan></text><text x="525" y="525.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Resultados idénticos en Windows y Ubuntu; la herramienta es sintética (notas.py) y no es un producto.</tspan></text></svg>
