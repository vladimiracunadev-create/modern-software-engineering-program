<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 291" width="1060" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Proporción de combinaciones de color que cumple cada umbral de contraste WCAG</title><desc id="d">Barras: de 5000 pares de colores al azar solo 26,1 por ciento llega a 3 a 1, 11,2 por ciento a 4,5 a 1 y 2,9 por ciento a 7 a 1; de 256 grises sobre blanco pasa 46,5 por ciento, con el límite en el gris 767676 que da 4,54 a 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="291" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Pares de colores al azar con 3:1 o más (5000)</tspan></text><rect x="430" y="16" width="40.455" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="478.455" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="478.455" dy="0">26,1 %</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Pares al azar con 4,5:1 o más (5000)</tspan></text><rect x="430" y="60" width="17.36" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455.36" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="455.36" dy="0">11,2 %</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Pares al azar con 7:1 o más (5000)</tspan></text><rect x="430" y="104" width="4.495" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="442.495" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442.495" dy="0">2,9 %</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Grises sobre blanco con 4,5:1 o más (256)</tspan></text><rect x="430" y="148" width="72.075" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="510.075" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="510.075" dy="0">46,5 %</tspan></text><rect x="10" y="196" width="1040" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">El umbral de 4,5:1 no es una cuestión de gusto: #767676 sobre blanco da 4,54 y #777777 da 4,48. Rojo puro sobre blanco da 4,0 y azul puro</tspan></text><text x="530" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">8,59: el tono no basta para predecir el contraste, la luminancia sí.</tspan></text><text x="530" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
