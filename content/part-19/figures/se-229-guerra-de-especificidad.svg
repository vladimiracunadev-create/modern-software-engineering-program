<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Guerra de especificidad: subir el selector frente a ordenar con capas</title><desc id="d">Barras agrupadas con el selector más largo al sobrescribir estilos: escalar la especificidad llega a 4, 7 y 18 clases con 50, 200 y 800 peticiones de cambio, y a 0, 18 y 315 reglas que superan las cuatro clases, mientras que ordenar con capas mantiene una clase.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Guerra de especificidad: subir el selector frente a ordenar con capas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Selector más largo al escalar (clases)</tspan></text><rect x="350.52" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="370.52" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="370.52" dy="0">Selector más largo con capas (clases)</tspan></text><line x1="71.08" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="355" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="290" x2="920" y2="290" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="290" x2="71.08" y2="290" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="294.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="225" x2="920" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="225" x2="71.08" y2="225" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="229.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="160" x2="920" y2="160" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="160" x2="71.08" y2="160" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="164.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Clases en el selector más largo</text><rect x="99.3773" y="303" width="111.189" height="52" rx="3" fill="#c0432f"/><text x="154.972" y="297" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.972" dy="0">4</tspan></text><rect x="214.567" y="342" width="111.189" height="13" rx="3" fill="#087f8c"/><text x="270.161" y="336" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.161" dy="0">1</tspan></text><text x="212.567" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">50 peticiones</tspan></text><rect x="382.351" y="264" width="111.189" height="91" rx="3" fill="#c0432f"/><text x="437.945" y="258" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.945" dy="0">7</tspan></text><rect x="497.54" y="342" width="111.189" height="13" rx="3" fill="#087f8c"/><text x="553.135" y="336" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.135" dy="0">1</tspan></text><text x="495.54" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">200 peticiones</tspan></text><rect x="665.324" y="121" width="111.189" height="234" rx="3" fill="#c0432f"/><text x="720.919" y="115" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.919" dy="0">18</tspan></text><rect x="780.513" y="342" width="111.189" height="13" rx="3" fill="#087f8c"/><text x="836.108" y="336" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.108" dy="0">1</tspan></text><text x="778.513" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">800 peticiones</tspan></text><rect x="10" y="407" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Reglas que superan 4 clases al escalar: 0, 18 y 315. La calculadora de especificidad usada acertó los 11 ejemplos de la</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">especificación de Selectores (incluidos :where, que suma 0, y :is, que suma su argumento más específico). La simulación</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supone que la mitad de las nuevas reglas llegan antes que la que deben vencer; el valor exacto depende de ese supuesto.</tspan></text><text x="470" y="512.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
