<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 423" width="980" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Llamadas que producen 1000 pulsaciones (171,6 s) según la técnica y el intervalo</title><desc id="d">Barras: 1000 pulsaciones sintéticas se convierten en 638, 300 y 134 llamadas con throttle de 100, 300 y 1000 milisegundos y en 453, 93 y 45 con debounce; en 66 de 92 pausas el throttle de 300 ms no atiende el último evento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="423" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Sin control (cada evento)</tspan></text><rect x="310" y="16" width="570" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="888" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="888" dy="0">1000</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Throttle de 100 ms</tspan></text><rect x="310" y="60" width="363.66" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="681.66" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="681.66" dy="0">638</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Debounce de 100 ms</tspan></text><rect x="310" y="104" width="258.21" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="576.21" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="576.21" dy="0">453</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Throttle de 300 ms</tspan></text><rect x="310" y="148" width="171" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="489" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="489" dy="0">300</tspan></text><text x="300" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Debounce de 300 ms</tspan></text><rect x="310" y="192" width="53.01" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="371.01" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="371.01" dy="0">93</tspan></text><text x="300" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Throttle de 1000 ms</tspan></text><rect x="310" y="236" width="76.38" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="394.38" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="394.38" dy="0">134</tspan></text><text x="300" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Debounce de 1000 ms</tspan></text><rect x="310" y="280" width="25.65" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="343.65" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="343.65" dy="0">45</tspan></text><rect x="10" y="328" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Debounce responde después de la pausa y atiende el último evento; throttle responde durante la ráfaga pero en 66 de las 92 pausas</tspan></text><text x="490" y="369.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">de al menos 300 ms dejó sin atender el último evento. Elegir entre ambos es elegir qué error se tolera.</tspan></text><text x="490" y="409.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
