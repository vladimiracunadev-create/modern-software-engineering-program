<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 479" width="940" height="479" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Delegación de eventos frente a un listener por fila en un modelo mínimo de DOM</title><desc id="d">Tabla de seis estrategias para atender el clic de borrar en 1000 filas cargadas en cinco páginas: el listener por fila solo en la primera página atiende 200, el delegado con closest atiende las 1000 con un listener, y falla cuando se compara el target o cuando una fila detiene la propagación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="479" fill="#ffffff"/><rect x="10" y="12" width="564" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="292" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="292" dy="0">Estrategia</tspan></text><rect x="580" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Listeners</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Filas atendidas</tspan></text><rect x="10" y="56" width="564" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="292" dy="0">Un listener por fila, registrado solo en la primera página</tspan></text><rect x="580" y="56" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">200</tspan></text><rect x="710" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">200 de 1000</tspan></text><rect x="10" y="110" width="564" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="292" dy="0">Un listener por fila, registrado en cada página</tspan></text><rect x="580" y="110" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">1000</tspan></text><rect x="710" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1000 de 1000</tspan></text><rect x="10" y="164" width="564" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="292" dy="0">Delegado con closest, clic en el botón o en su icono</tspan></text><rect x="580" y="164" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">1</tspan></text><rect x="710" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1000 de 1000</tspan></text><rect x="10" y="218" width="564" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="292" dy="0">Delegado que compara target directo, clic en el icono</tspan></text><rect x="580" y="218" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">1</tspan></text><rect x="710" y="218" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0 de 1000</tspan></text><rect x="10" y="272" width="564" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="299.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="292" dy="0">Delegado con closest, 5 % de filas que detienen la propagación</tspan></text><rect x="580" y="272" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">1</tspan></text><rect x="710" y="272" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">943 de 1000</tspan></text><rect x="10" y="326" width="564" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="353.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="292" dy="0">Un listener por fila, 5 % que detienen la propagación</tspan></text><rect x="580" y="326" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">1000</tspan></text><rect x="710" y="326" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1000 de 1000</tspan></text><rect x="10" y="384" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="408.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El modelo implementa captura, destino y burbuja con stopPropagation, pero no el comportamiento de un navegador real</tspan></text><text x="470" y="425.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(listeners de captura en el destino, eventos pasivos, shadow DOM). Muestra el mecanismo, no mide memoria.</tspan></text><text x="470" y="465.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
