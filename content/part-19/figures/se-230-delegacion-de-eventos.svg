<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 659" width="940" height="659" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Delegación de eventos frente a un listener por fila en un modelo mínimo de DOM</title><desc id="d">Barras horizontales agrupadas con las filas atendidas de 1000 y los listeners usados por seis estrategias: el listener por fila solo en la primera página atiende 200 con 200 listeners, el delegado con closest atiende las 1000 con un listener y falla con 0 cuando compara el target o con 943 si una de cada veinte filas detiene la propagación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="659" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Delegación de eventos frente a un listener por fila en un modelo mínimo de DOM</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Listeners</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Filas atendidas de 1000</tspan></text><line x1="354" y1="77" x2="354" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="461" x2="354" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="458.34" y1="77" x2="458.34" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="458.34" y1="461" x2="458.34" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="458.34" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.34" dy="0">200</tspan></text><line x1="562.68" y1="77" x2="562.68" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="562.68" y1="461" x2="562.68" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="562.68" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.68" dy="0">400</tspan></text><line x1="667.02" y1="77" x2="667.02" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="667.02" y1="461" x2="667.02" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="667.02" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.02" dy="0">600</tspan></text><line x1="771.36" y1="77" x2="771.36" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="771.36" y1="461" x2="771.36" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="771.36" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.36" dy="0">800</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="461" x2="875.7" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="354" y1="461" x2="875.7" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Un listener por fila, solo en la primera</tspan></text><text x="344" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">página</tspan></text><text x="344" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Un listener por fila, en cada página</tspan></text><text x="344" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Delegado con closest (botón o icono)</tspan></text><text x="344" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Delegado que compara el target directo (clic</tspan></text><text x="344" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">en el icono)</tspan></text><text x="344" y="361" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Delegado con closest, 5 % de filas detienen</tspan></text><text x="344" y="378" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">la propagación</tspan></text><text x="344" y="425" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Un listener por fila, 5 % detienen la</tspan></text><text x="344" y="442" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">propagación</tspan></text><rect x="354" y="83" width="104.34" height="24.5" rx="3" fill="#6b7c86"/><text x="465.34" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="465.34" dy="0">200</tspan></text><rect x="354" y="110.5" width="104.34" height="24.5" rx="3" fill="#087f8c"/><text x="465.34" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="465.34" dy="0">200</tspan></text><rect x="354" y="147" width="521.7" height="24.5" rx="3" fill="#6b7c86"/><text x="882.7" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="354" y="174.5" width="521.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="354" y="211" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="363" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">1</tspan></text><rect x="354" y="238.5" width="521.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="354" y="275" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="363" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">1</tspan></text><rect x="354" y="302.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="339" width="2" height="24.5" rx="3" fill="#6b7c86"/><text x="363" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">1</tspan></text><rect x="354" y="366.5" width="491.963" height="24.5" rx="3" fill="#087f8c"/><text x="852.963" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="852.963" dy="0">943</tspan></text><rect x="354" y="403" width="521.7" height="24.5" rx="3" fill="#6b7c86"/><text x="882.7" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="354" y="430.5" width="521.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><text x="614.85" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Cantidad</tspan></text><rect x="10" y="519" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El delegado con closest atiende las 1000 filas con un solo listener; falla si compara el target (0 de 1000) o si una fila</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">detiene la propagación (943 de 1000). El modelo implementa captura, destino y burbuja con stopPropagation, pero no el</tspan></text><text x="470" y="577.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comportamiento de un navegador real (listeners de captura en el destino, eventos pasivos, shadow DOM). Muestra el</tspan></text><text x="470" y="593.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mecanismo, no mide memoria.</tspan></text><text x="470" y="641.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
