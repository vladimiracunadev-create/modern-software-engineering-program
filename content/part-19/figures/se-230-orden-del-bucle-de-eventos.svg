<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 247" width="1000" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Programas cuyo orden de salida predice cada modelo del bucle de eventos</title><desc id="d">Barras: de 300 programas generados con semilla fija con microtareas y temporizadores anidados, el modelo de dos colas acierta el orden de salida de los 300 en Node 24 y Node 20, y un modelo de una sola cola acierta 221.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="247" fill="#ffffff"/><text x="380" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Modelo de dos colas, Node 24 (Windows)</tspan></text><rect x="390" y="16" width="510" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="908" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="908" dy="0">300 de 300</tspan></text><text x="380" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Modelo de dos colas, Node 20 (Ubuntu)</tspan></text><rect x="390" y="60" width="510" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="908" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="908" dy="0">300 de 300</tspan></text><text x="380" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Modelo de una sola cola FIFO</tspan></text><rect x="390" y="104" width="375.7" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="773.7" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="773.7" dy="0">221 de 300</tspan></text><rect x="10" y="152" width="980" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">Las microtareas se vacían por completo antes de la siguiente tarea. Una cadena recursiva de 200 000 microtareas se ejecutó entera</tspan></text><text x="500" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">antes de un temporizador de 0 ms: las microtareas pueden dejar sin turno a las tareas.</tspan></text><text x="500" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Node 24.11 en Windows y Node 20.20 en Ubuntu (WSL2); el motor es V8, no un navegador.</tspan></text></svg>
