<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Regeneración por caducidad: cuántas visitas ven una página desactualizada</title><desc id="d">Línea con el porcentaje de visitas que ven contenido viejo según la caducidad antes de regenerar, con una página que cambia 0,2 veces por hora y 30 visitas por hora: 0,7 con 6 minutos, 8,3 con 1 hora, 39,2 con 6 horas y 76,9 con 24 horas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Regeneración por caducidad: cuántas visitas ven una página desactualizada</tspan></text><line x1="78.62" y1="339" x2="910" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="339" x2="78.62" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="343.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="283" x2="910" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="283" x2="78.62" y2="283" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="287.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="227" x2="910" y2="227" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="227" x2="78.62" y2="227" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="231.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="171" x2="910" y2="171" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="171" x2="78.62" y2="171" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="175.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="115" x2="910" y2="115" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="115" x2="78.62" y2="115" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="339" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="339" x2="96.62" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">6 min</tspan></text><line x1="430.784" y1="59" x2="430.784" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="430.784" y1="339" x2="430.784" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="430.784" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="430.784" dy="0">1 h</tspan></text><line x1="690.813" y1="59" x2="690.813" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="690.813" y1="339" x2="690.813" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="690.813" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690.813" dy="0">6 h</tspan></text><line x1="892" y1="59" x2="892" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="339" x2="892" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">24 h</tspan></text><line x1="78.62" y1="339" x2="910" y2="339" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 199)">Visitas con contenido viejo (%)</text><text x="494.31" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Caducidad antes de regenerar (horas) (escala logarítmica)</tspan></text><polyline points="96.62,337.04 430.784,315.76 690.813,229.24 892,123.68" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="337.04" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="326.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">0,7 %</tspan></text><circle cx="430.784" cy="315.76" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="430.784" y="304.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="430.784" dy="0">8,3 %</tspan></text><circle cx="690.813" cy="229.24" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="690.813" y="218.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="690.813" dy="0">39,2 %</tspan></text><circle cx="892" cy="123.68" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="112.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">76,9 %</tspan></text><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Antigüedad media del cambio que ve la visita: 0,03, 0,34, 2,15 y 9,88 horas. Simulación de 2000 h con cambios de Poisson</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(0,2 por hora) y visitas de Poisson (30 por hora); regenerar al pedir tras caducar. Regenerar más a menudo cuesta</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">compilaciones: este experimento no mide ese coste, solo la obsolescencia.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
