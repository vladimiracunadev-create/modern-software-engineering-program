<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 379" width="1080" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Textos del servidor que difieren de lo que calcularía el cliente al hidratar</title><desc id="d">Barras: de 2000 marcas de tiempo, formatear fecha y hora en una zona distinta a la del servidor da textos distintos en las 2000, formatear solo el día en 742 con UTC más 9 y 239 con UTC menos 3, y un valor aleatorio difiere en las 2000 hidrataciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="379" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Fecha y hora, cliente en UTC−3 (2000 marcas)</tspan></text><rect x="430" y="16" width="540" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="978" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="978" dy="0">2000</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Fecha y hora, cliente en UTC+9</tspan></text><rect x="430" y="60" width="540" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="978" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="978" dy="0">2000</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Solo el día, cliente en UTC+9</tspan></text><rect x="430" y="104" width="200.34" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="638.34" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="638.34" dy="0">742</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Solo el día, cliente en UTC−3</tspan></text><rect x="430" y="148" width="64.53" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="502.53" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="502.53" dy="0">239</tspan></text><text x="420" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Fecha y hora, cliente en la misma zona</tspan></text><rect x="430" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442" dy="0">0</tspan></text><text x="420" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Valor aleatorio generado en cada render</tspan></text><rect x="430" y="236" width="540" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="978" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="978" dy="0">2000</tspan></text><rect x="10" y="284" width="1060" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="540" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Todo valor que dependa de la zona horaria, la configuración regional, la hora actual o un azar sin semilla es una fuente de desajuste entre el</tspan></text><text x="540" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">HTML del servidor y el árbol del cliente. Se evita pasando el valor desde el servidor o renderizándolo solo en el cliente.</tspan></text><text x="540" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
