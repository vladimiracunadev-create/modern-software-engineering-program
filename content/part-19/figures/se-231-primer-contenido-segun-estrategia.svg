<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo hasta el primer contenido útil: cliente, servidor y estático (modelo con bytes reales)</title><desc id="d">Barras agrupadas en escala logarítmica con el tiempo hasta el primer contenido útil con 500 filas: render en el cliente 91, 378 y 1389 milisegundos, render en servidor 26, 92 y 365 y HTML estático en caché 11, 47 y 210, en fibra, móvil 4G y móvil lento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tiempo hasta el primer contenido útil: cliente, servidor y estático (modelo con bytes reales)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Render en cliente</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Render en servidor</tspan></text><rect x="375.9" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="395.9" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="395.9" dy="0">HTML estático</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="281.667" x2="101.24" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="188.333" x2="101.24" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Milisegundos (escala logarítmica)</text><rect x="128.532" y="285.489" width="70.112" height="89.5105" rx="3" fill="#c0432f"/><text x="163.588" y="279.489" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="163.588" dy="0">91</tspan></text><rect x="202.644" y="336.269" width="70.112" height="38.7308" rx="3" fill="#946512"/><text x="237.7" y="330.269" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237.7" dy="0">26</tspan></text><rect x="276.756" y="371.137" width="70.112" height="3.86332" rx="3" fill="#087f8c"/><text x="311.812" y="365.137" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="311.812" dy="0">11</tspan></text><text x="237.7" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">Fibra (RTT 20 ms, CPU ×1)</tspan></text><rect x="401.452" y="227.767" width="70.112" height="147.233" rx="3" fill="#c0432f"/><text x="436.508" y="221.767" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="436.508" dy="0">378</tspan></text><rect x="475.564" y="285.046" width="70.112" height="89.9535" rx="3" fill="#946512"/><text x="510.62" y="279.046" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="510.62" dy="0">92</tspan></text><rect x="549.676" y="312.271" width="70.112" height="62.7291" rx="3" fill="#087f8c"/><text x="584.732" y="306.271" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="584.732" dy="0">47</tspan></text><text x="510.62" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">Móvil 4G (RTT 80 ms, CPU ×4)</tspan></text><rect x="674.372" y="175.014" width="70.112" height="199.986" rx="3" fill="#c0432f"/><text x="709.428" y="169.014" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.428" dy="0">1 389</tspan></text><rect x="748.484" y="229.186" width="70.112" height="145.814" rx="3" fill="#946512"/><text x="783.54" y="223.186" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="783.54" dy="0">365</tspan></text><rect x="822.596" y="251.593" width="70.112" height="123.407" rx="3" fill="#087f8c"/><text x="857.652" y="245.593" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.652" dy="0">210</tspan></text><text x="783.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">Móvil lento (RTT 300 ms, CPU ×6)</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Anchos de banda supuestos: 50, 8 y 1 Mbit/s. Bytes medidos con gzip nivel 6: HTML renderizado 56 489 (7 486 comprimidos);</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">paquete JS sintético 147 255 (37 559); JSON 35 434 (5 612). Las latencias, el factor de CPU y 5 ms de render en servidor</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">son supuestos del autor: se lee la forma de la diferencia, no las cifras.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
