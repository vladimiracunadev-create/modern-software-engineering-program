<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 291" width="1000" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuencias de 30 operaciones que acaban con un total distinto de la suma real</title><desc id="d">Barras: con un total guardado aparte que se olvida de actualizar en 0,2, 1 y 5 por ciento de las operaciones, 2,7, 13,5 y 50,1 por ciento de 3000 secuencias de 30 operaciones terminan con un total incoherente; si el total se deriva de los elementos no puede divergir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="291" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Total derivado, olvido 0 %</tspan></text><rect x="410" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422" dy="0">0 %</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Total copiado, olvido 0,2 % por operación</tspan></text><rect x="410" y="60" width="16.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="434.2" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="434.2" dy="0">2,7 %</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Total copiado, olvido 1 %</tspan></text><rect x="410" y="104" width="81" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="499" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="499" dy="0">13,5 %</tspan></text><text x="400" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Total copiado, olvido 5 %</tspan></text><rect x="410" y="148" width="300.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="718.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="718.6" dy="0">50,1 %</tspan></text><rect x="10" y="196" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El estado duplicado no falla siempre: falla cuando una rama de código lo olvida, y la primera incoherencia aparece en promedio</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">hacia la operación 14 a 16. Derivar el valor elimina la posibilidad, a costa de recalcular o memorizar.</tspan></text><text x="500" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
