<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 247" width="1000" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pulsaciones en las que se muestra un error aunque el correo final sea válido</title><desc id="d">Barras: al escribir 200 correos válidos letra a letra, validar en cada pulsación muestra un error en 82,3 por ciento de las 4073 pulsaciones y en los 200 correos al menos una vez; validar al salir del campo o al enviar no muestra ninguno mientras se escribe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="247" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Validar en cada pulsación (4073 pulsaciones)</tspan></text><rect x="430" y="16" width="477.34" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="915.34" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="915.34" dy="0">82,3 %</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Validar al salir del campo</tspan></text><rect x="430" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442" dy="0">0 %</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Validar al enviar</tspan></text><rect x="430" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442" dy="0">0 %</tspan></text><rect x="10" y="152" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El error aparece porque el texto parcial todavía no es un correo, no porque la persona se haya equivocado. Validar al salir y</tspan></text><text x="500" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">volver a validar en cada pulsación solo cuando ya hay un error mostrado equilibra rapidez y ruido.</tspan></text><text x="500" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
