<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 291" width="1020" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nombres que cuenta un sistema para 10 personas, según cómo compare las cadenas</title><desc id="d">Barras: 5000 registros de diez nombres con acentos, algunos en forma descompuesta y algunos en mayúsculas, se cuentan como 38 nombres distintos sin normalizar, 20 tras normalizar a NFC y 10 tras NFC y plegado de mayúsculas, que son las diez personas reales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="291" fill="#ffffff"/><text x="440" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Nombres distintos sin normalizar (5000 registros)</tspan></text><rect x="450" y="16" width="456" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="914" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914" dy="0">38</tspan></text><text x="440" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Tras normalizar a NFC</tspan></text><rect x="450" y="60" width="240" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="698" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="698" dy="0">20</tspan></text><text x="440" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Tras NFC y plegado de mayúsculas</tspan></text><rect x="450" y="104" width="120" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="578" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="578" dy="0">10</tspan></text><text x="440" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Personas distintas reales de la muestra</tspan></text><rect x="450" y="148" width="120" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="578" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="578" dy="0">10</tspan></text><rect x="10" y="196" width="1000" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">Jose con tilde compuesta mide 4 puntos de código y descompuesta 5; en UTF-8 son 5 y 6 bytes. Una familia con emoji mide 5 puntos de</tspan></text><text x="510" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">código, 8 unidades UTF-16 y 18 bytes: contar caracteres exige decidir qué unidad se cuenta.</tspan></text><text x="510" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
