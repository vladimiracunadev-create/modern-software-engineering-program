<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 467" width="960" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis validadores de correo frente a un corpus de 64 direcciones etiquetadas por el autor</title><desc id="d">Tabla: ninguno de los seis validadores acierta a la vez las 30 direcciones ordinarias, las 4 internacionalizadas y las 30 inválidas; los laxos aceptan casi todo, el ASCII estricto rechaza 14 válidas y las 4 internacionalizadas y los basados en la especificación HTML rechazan las 4 internacionalizadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="467" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Validador</tspan></text><rect x="440" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Acepta ordinarias</tspan></text><rect x="590" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">Acepta</tspan></text><text x="682" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">internacionalizadas</tspan></text><rect x="780" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Rechaza inválidas</tspan></text><rect x="10" y="56" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Solo comprobar que hay una @</tspan></text><rect x="440" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">30 de 30</tspan></text><rect x="590" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">4 de 4</tspan></text><rect x="780" y="56" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">1 de 30</tspan></text><rect x="10" y="108" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Texto antes y después de la @</tspan></text><rect x="440" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">30 de 30</tspan></text><rect x="590" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">4 de 4</tspan></text><rect x="780" y="108" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">3 de 30</tspan></text><rect x="10" y="160" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Expresión simple con punto en el dominio</tspan></text><rect x="440" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">30 de 30</tspan></text><rect x="590" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">4 de 4</tspan></text><rect x="780" y="160" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">13 de 30</tspan></text><rect x="10" y="212" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Expresión ASCII estricta</tspan></text><rect x="440" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">16 de 30</tspan></text><rect x="590" y="212" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0 de 4</tspan></text><rect x="780" y="212" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">22 de 30</tspan></text><rect x="10" y="264" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Expresión de la especificación HTML</tspan></text><rect x="440" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">30 de 30</tspan></text><rect x="590" y="264" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0 de 4</tspan></text><rect x="780" y="264" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">24 de 30</tspan></text><rect x="10" y="316" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="342.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Especificación HTML más reglas de puntos y longitudes</tspan></text><rect x="440" y="316" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">30 de 30</tspan></text><rect x="590" y="316" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0 de 4</tspan></text><rect x="780" y="316" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">30 de 30</tspan></text><rect x="10" y="372" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Ningún validador puede saber si un buzón existe: solo un mensaje enviado y confirmado lo prueba. El corpus y sus etiquetas son</tspan></text><text x="480" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">del autor; con otro corpus las cifras cambian.</tspan></text><text x="480" y="453.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
