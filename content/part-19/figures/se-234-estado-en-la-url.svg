<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 291" width="1100" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estados de filtro recuperados exactamente tras ir a la URL y volver (2000 estados)</title><desc id="d">Barras: de 2000 estados de filtro con texto, lista, booleano, número y nulo, unir valores a mano recupera 1743, urlencode leído sin tipos recupera 0 porque los números vuelven como texto, y urlencode con esquema y JSON en base64 recuperan los 2000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1100" height="291" fill="#ffffff"/><text x="500" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Unir valores a mano, sin codificar</tspan></text><rect x="510" y="16" width="418.32" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="936.32" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="936.32" dy="0">1743</tspan></text><text x="500" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">urlencode y leer sin tipos (la página queda como texto)</tspan></text><rect x="510" y="60" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="522" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="522" dy="0">0</tspan></text><text x="500" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">urlencode y leer con un esquema de tipos</tspan></text><rect x="510" y="104" width="480" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="998" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="998" dy="0">2000</tspan></text><text x="500" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">JSON en base64 con URL segura</tspan></text><rect x="510" y="148" width="480" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="998" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="998" dy="0">2000</tspan></text><rect x="10" y="196" width="1080" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="550" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">El JSON en base64 recupera todo pero no se puede leer ni editar a mano y crece más rápido: con 100 etiquetas la URL mide 2299 caracteres con</tspan></text><text x="550" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">urlencode y 2020 con base64, ya cerca de los 2000 que algunos clientes y proxys recomiendan no superar.</tspan></text><text x="550" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
