<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 421" width="930" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bytes sobre la red de cinco activos sintéticos según el algoritmo y el nivel</title><desc id="d">Tabla: el texto sintético se reduce entre 77 y 91 por ciento con gzip nivel 6 y algo más con xz, mientras que un archivo de bytes aleatorios, equivalente a una imagen ya comprimida, crece unos 38 bytes con cualquier algoritmo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="421" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Activo</tspan></text><rect x="280" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="337" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337" dy="0">Bruto</tspan></text><rect x="400" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">gzip 1</tspan></text><rect x="530" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">gzip 6</tspan></text><rect x="660" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">gzip 9</tspan></text><rect x="790" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">xz</tspan></text><rect x="10" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">CSS, 900 reglas</tspan></text><rect x="280" y="56" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">74 585</tspan></text><rect x="400" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">15 797</tspan></text><rect x="530" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">12 462</tspan></text><rect x="660" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">11 776</tspan></text><rect x="790" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">10 348</tspan></text><rect x="10" y="106" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">HTML, lista de 800</tspan></text><rect x="280" y="106" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">45 232</tspan></text><rect x="400" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">9 311</tspan></text><rect x="530" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">7 835</tspan></text><rect x="660" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">7 721</tspan></text><rect x="790" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">4 532</tspan></text><rect x="10" y="156" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">JS, 450 funciones</tspan></text><rect x="280" y="156" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">84 488</tspan></text><rect x="400" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">7 416</tspan></text><rect x="530" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">6 009</tspan></text><rect x="660" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">5 594</tspan></text><rect x="790" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">4 836</tspan></text><rect x="10" y="206" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">JSON, 800 filas</tspan></text><rect x="280" y="206" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">73 063</tspan></text><rect x="400" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">8 832</tspan></text><rect x="530" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">6 737</tspan></text><rect x="660" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">6 226</tspan></text><rect x="790" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">4 820</tspan></text><rect x="10" y="256" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">PNG, bytes aleatorios</tspan></text><rect x="280" y="256" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">60 000</tspan></text><rect x="400" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">60 038</tspan></text><rect x="530" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">60 038</tspan></text><rect x="660" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">60 038</tspan></text><rect x="790" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">60 060</tspan></text><rect x="10" y="310" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Minificar antes de comprimir ahorró 29,5 % en el JS sintético (de 6009 a 4235 bytes con gzip) y solo 3,6 % en el CSS (de</tspan></text><text x="465" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">12 462 a 12 013). Brotli no está en la biblioteca estándar de Python y no se midió. El texto sintético es más repetitivo</tspan></text><text x="465" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">que el real: las razones reales serán menores.</tspan></text><text x="465" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
