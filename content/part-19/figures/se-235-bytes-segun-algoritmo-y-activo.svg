" y="605.1" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="480.563" dy="0">6 226</tspan></text><rect x="214" y="615.4" width="223.233" height="23.6" rx="3" fill="#087f8c"/><text x="444.233" y="631.7" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="444.233" dy="0">4 820</tspan></text><rect x="214" y="651" width="581.135" height="23.6" rx="3" fill="#6b7c86"/><text x="802.135" y="667.3" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802.135" dy="0">60 000</tspan></text><rect x="214" y="677.6" width="581.225" height="23.6" rx="3" fill="#946512"/><text x="802.225" y="693.9" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802.225" dy="0">60 038</tspan></text><rect x="214" y="704.2" width="581.225" height="23.6" rx="3" fill="#c0432f"/><text x="802.225" y="720.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802.225" dy="0">60 038</tspan></text><rect x="214" y="730.8" width="581.225" height="23.6" rx="3" fill="#102a43"/><text x="802.225" y="747.1" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802.225" dy="0">60 038</tspan></text><rect x="214" y="757.4" width="581.277" height="23.6" rx="3" fill="#087f8c"/><text x="802.277" y="773.7" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802.277" dy="0">60 060</tspan></text><text x="540.82" y="831" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="540.82" dy="0">Bytes (escala logarítmica)</tspan></text><rect x="10" y="845" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="869.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Minificar antes de comprimir ahorró 29,5 % en el JS sintético (de 6009 a 4235 bytes con gzip) y solo 3,6 % en el CSS (de 12</tspan></text><text x="470" y="886.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">462 a 12 013). Brotli no está en la biblioteca estándar de Python y no se midió. El texto sintético es más repetitivo que</tspan></text><text x="470" y="903.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el real: las razones reales serán menores.</tspan></text><text x="470" y="950.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
