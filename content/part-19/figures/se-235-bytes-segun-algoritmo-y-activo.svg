<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 968" width="940" height="968" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bytes sobre la red de cinco activos sintéticos según el algoritmo y el nivel</title><desc id="d">Barras horizontales en escala logarítmica con los bytes de cinco activos sin comprimir y con gzip 1, 6 y 9 y xz: el texto sintético se reduce entre 77 y 91 por ciento con gzip nivel 6 y algo más con xz, mientras que un archivo de bytes aleatorios, equivalente a una imagen ya comprimida, crece unos 38 bytes con cualquier algoritmo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="968" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Bytes sobre la red de cinco activos sintéticos según el algoritmo y el nivel</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Bruto</tspan></text><rect x="101.7" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">gzip 1</tspan></text><rect x="194.94" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="214.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="214.94" dy="0">gzip 6</tspan></text><rect x="288.18" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="308.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="308.18" dy="0">gzip 9</tspan></text><rect x="381.42" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="401.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="401.42" dy="0">xz</tspan></text><line x1="214" y1="77" x2="214" y2="787" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="787" x2="214" y2="792" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="808" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">1 000</tspan></text><line x1="540.82" y1="77" x2="540.82" y2="787" stroke="#d5dde1" stroke-width="1"/><line x1="540.82" y1="787" x2="540.82" y2="792" stroke="#5b7280" stroke-width="1.4"/><text x="540.82" y="808" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="540.82" dy="0">10 000</tspan></text><line x1="867.64" y1="77" x2="867.64" y2="787" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="787" x2="867.64" y2="792" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="808" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100 000</tspan></text><line x1="214" y1="787" x2="867.64" y2="787" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="152.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">CSS, 900 reglas</tspan></text><text x="204" y="294.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">HTML, lista de 800</tspan></text><text x="204" y="436.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">JS, 450 funciones</tspan></text><text x="204" y="578.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">JSON, 800 filas</tspan></text><text x="204" y="720.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">PNG, bytes aleatorios</tspan></text><rect x="214" y="83" wid