<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estimar el percentil 75 de una métrica con pocas visitas: intervalo y falsa conformidad</title><desc id="d">Líneas en escala logarítmica con el percentil 75 estimado y los límites de su intervalo central del 95 por ciento según las visitas: 2139 a 3500 milisegundos con 30 visitas, 2597 a 3024 con 300 y 2745 a 2862 con 3000, frente a un valor verdadero de 2802 y un presupuesto de 2500; con 30 visitas se declara cumplido el presupuesto en 22 por ciento de las repeticiones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estimar el percentil 75 de una métrica con pocas visitas: intervalo y falsa conformidad</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Límite inferior (2,5 %)</tspan></text><rect x="237.42" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">p75 estimado (media)</tspan></text><polygon points="442.22,44.1 448.82,56.4 435.62,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="456.22" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="456.22" dy=