" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="106.2" y="227.1" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="121.7" y="237.1" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="121.7" dy="0">2 772</tspan></text><rect x="496.35" y="220.7" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="511.85" y="230.7" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="511.85" dy="0">2 804</tspan></text><rect x="886.5" y="221.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="902" y="231.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="902" dy="0">2 800</tspan></text><polyline points="111.7,87 501.85,182.2 892,214.6" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="111.7,80.675 117.75,91.95 105.65,91.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="111.7" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">3 500</tspan></text><polygon points="501.85,175.875 507.9,187.15 495.8,187.15" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="501.85" y="171.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="501.85" dy="0">3 024</tspan></text><polygon points="892,208.275 898.05,219.55 885.95,219.55" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="203.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">2 862</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El eje vertical empieza en 2000 ms. El percentil 75 verdadero es 2802. Falsamente conformes (dicen cumplir 2500 ms): 22,0 %</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con 30 visitas, 0,1 % con 300 y 0,0 % con 3000. Población lognormal con mediana 2000 ms y σ = 0,5: media 2266, p75 2802,</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">p95 4552. Con 30 visitas una de cada cinco veces se concluye, erróneamente, que el presupuesto se cumple. Los valores</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reales de usuarios no son lognormales ni independientes.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
