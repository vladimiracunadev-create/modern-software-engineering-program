<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 333" width="940" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cascada de recursos: qué optimización acorta la ruta crítica de una página sintética</title><desc id="d">Tabla: en una página con HTML, hoja de estilos, script, imagen, fuente y datos, anticipar la fuente y los datos con preload baja el tiempo de 195 a 123 milisegundos en fibra, y poner el CSS en línea no lo cambia porque la ruta más larga es script y luego datos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="333" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Perfil de red supuesto</tspan></text><rect x="380" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Línea base</tspan></text><rect x="530" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Preload de fuente y datos</tspan></text><rect x="760" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">CSS en línea</tspan></text><rect x="10" y="56" width="364" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Fibra (RTT 20 ms, 100 Mbit/s)</tspan></text><rect x="380" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">195 ms</tspan></text><rect x="530" y="56" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">123 ms</tspan></text><rect x="760" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">199 ms</tspan></text><rect x="10" y="110" width="364" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Móvil 4G (RTT 80 ms, 10 Mbit/s)</tspan></text><rect x="380" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">801 ms</tspan></text><rect x="530" y="110" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">701 ms</tspan></text><rect x="760" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">801 ms</tspan></text><rect x="10" y="164" width="364" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Móvil lento (RTT 300 ms, 1,5 Mbit/s)</tspan></text><rect x="380" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">3805 ms</tspan></text><rect x="530" y="164" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">3712 ms</tspan></text><rect x="760" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">3805 ms</tspan></text><rect x="10" y="222" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La ruta crítica es HTML → script de 150 KB → petición de datos. Optimizar fuera de esa cadena (CSS en línea) no cambia el</tspan></text><text x="470" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">total. El modelo reparte el ancho de banda en partes iguales, ignora la ranura de conexiones y la priorización del</tspan></text><text x="470" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">navegador.</tspan></text><text x="470" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
