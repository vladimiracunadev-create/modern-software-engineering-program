<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cascada de recursos: qué optimización acorta la ruta crítica de una página sintética</title><desc id="d">Barras horizontales con el tiempo de una página con HTML, hoja de estilos, script, imagen, fuente y datos: en fibra la línea base tarda 195 milisegundos, el preload de fuente y datos 123 y el CSS en línea 199; en móvil 4G, 801, 701 y 801; en móvil lento, 3805, 3712 y 3805.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="528" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cascada de recursos: qué optimización acorta la ruta crítica de una página sintética</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Línea base</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Preload de fuente y datos</tspan></text><rect x="375.9" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="395.9" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="395.9" dy="0">CSS en línea</tspan></text><line x1="274" y1="77" x2="274" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="347" x2="274" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="424.425" y1="77" x2="424.425" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="424.425" y1="347" x2="424.425" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="424.425" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.425" dy="0">1 000</tspan></text><line x1="574.85" y1="77" x2="574.85" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="574.85" y1="347" x2="574.85" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="574.85" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="574.85" dy="0">2 000</tspan></text><line x1="725.275" y1="77" x2="725.275" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="725.275" y1="347" x2="725.275" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="725.275" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="725.275" dy="0">3 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="347" x2="875.7" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">4 000</tspan></text><line x1="274" y1="347" x2="875.7" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Fibra (RTT 20 ms, 100 Mbit/s)</tspan></text><text x="264" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Móvil 4G (RTT 80 ms, 10 Mbit/s)</tspan></text><text x="264" y="298" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Móvil lento (RTT 300 ms, 1,5</tspan></text><text x="264" y="315" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Mbit/s)</tspan></text><rect x="274" y="83" width="29.3329" height="24" rx="3" fill="#6b7c86"/><text x="310.333" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="310.333" dy="0">195</tspan></text><rect x="274" y="110" width="18.5023" height="24" rx="3" fill="#087f8c"/><text x="299.502" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="299.502" dy="0">123</tspan></text><rect x="274" y="137" width="29.9346" height="24" rx="3" fill="#946512"/><text x="310.935" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="310.935" dy="0">199</tspan></text><rect x="274" y="173" width="120.49" height="24" rx="3" fill="#6b7c86"/><text x="401.49" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="401.49" dy="0">801</tspan></text><rect x="274" y="200" width="105.448" height="24" rx="3" fill="#087f8c"/><text x="386.448" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="386.448" dy="0">701</tspan></text><rect x="274" y="227" width="120.49" height="24" rx="3" fill="#946512"/><text x="401.49" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="401.49" dy="0">801</tspan></text><rect x="274" y="263" width="572.367" height="24" rx="3" fill="#6b7c86"/><text x="853.367" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="853.367" dy="0">3 805</tspan></text><rect x="274" y="290" width="558.378" height="24" rx="3" fill="#087f8c"/><text x="839.378" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="839.378" dy="0">3 712</tspan></text><rect x="274" y="317" width="572.367" height="24" rx="3" fill="#946512"/><text x="853.367" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="853.367" dy="0">3 805</tspan></text><text x="574.85" y="391" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Milisegundos</tspan></text><rect x="10" y="405" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="429.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La ruta crítica es HTML → script de 150 KB → petición de datos. Optimizar fuera de esa cadena (CSS en línea) no cambia el</tspan></text><text x="470" y="446.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">total. El modelo reparte el ancho de banda en partes iguales, ignora la ranura de conexiones y la priorización del</tspan></text><text x="470" y="463.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">navegador.</tspan></text><text x="470" y="510.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
