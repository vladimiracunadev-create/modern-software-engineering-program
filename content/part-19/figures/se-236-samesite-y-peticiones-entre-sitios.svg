<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 457" width="940" height="457" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">¿Viaja la cookie en una petición iniciada desde otro sitio? Matriz de SameSite</title><desc id="d">Mapa de calor binario de cinco peticiones desde otro sitio y tres valores de SameSite: con Strict la cookie no viaja nunca, con Lax viaja solo en una navegación GET de nivel superior y con None viaja siempre; de 14 peticiones CORS del ejemplo, 7 necesitan una comprobación previa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="457" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">¿Viaja la cookie en una petición iniciada desde otro sitio? Matriz de SameSite</tspan></text><text x="431.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="431.667" dy="0">Strict</tspan></text><text x="627" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="627" dy="0">Lax</tspan></text><text x="822.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="822.333" dy="0">None</tspan></text><text x="324" y="90" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">Navegar con un enlace (GET de nivel</tspan></text><text x="324" y="107" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">superior)</tspan></text><text x="324" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">Enviar un formulario (POST)</tspan></text><text x="324" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">fetch con POST desde otro sitio</tspan></text><text x="324" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">Imagen incrustada</tspan></text><text x="324" y="274.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">Página incrustada en un iframe</tspan></text><rect x="335.5" y="73.5" width="192.333" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="431.667" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="431.667" dy="0">no viaja</tspan></text><rect x="530.833" y="73.5" width="192.333" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="627" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">viaja</tspan></text><rect x="726.167" y="73.5" width="192.333" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="822.333" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822.333" dy="0">viaja</tspan></text><rect x="335.5" y="117.5" width="192.333" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="431.667" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="431.667" dy="0">no viaja</tspan></text><rect x="530.833" y="117.5" width="192.333" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="627" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="627" dy="0">no viaja</tspan></text><rect x="726.167" y="117.5" width="192.333" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="822.333" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822.333" dy="0">viaja</tspan></text><rect x="335.5" y="161.5" width="192.333" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="431.667" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="431.667" dy="0">no viaja</tspan></text><rect x="530.833" y="161.5" width="192.333" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="627" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="627" dy="0">no viaja</tspan></text><rect x="726.167" y="161.5" width="192.333" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="822.333" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822.333" dy="0">viaja</tspan></text><rect x="335.5" y="205.5" width="192.333" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="431.667" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="431.667" dy="0">no viaja</tspan></text><rect x="530.833" y="205.5" width="192.333" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="627" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="627" dy="0">no viaja</tspan></text><rect x="726.167" y="205.5" width="192.333" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="822.333" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822.333" dy="0">viaja</tspan></text><rect x="335.5" y="249.5" width="192.333" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="431.667" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="431.667" dy="0">no viaja</tspan></text><rect x="530.833" y="249.5" width="192.333" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="627" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="627" dy="0">no viaja</tspan></text><rect x="726.167" y="249.5" width="192.333" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="822.333" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822.333" dy="0">viaja</tspan></text><text x="334" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="334" dy="0">no viaja</tspan></text><rect x="402.32" y="306" width="30.5" height="14" fill="#d9e2ec"/><rect x="432.32" y="306" width="30.5" height="14" fill="#bcc8d4"/><rect x="462.32" y="306" width="30.5" height="14" fill="#a0adbc"/><rect x="492.32" y="306" width="30.5" height="14" fill="#8393a4"/><rect x="522.32" y="306" width="30.5" height="14" fill="#66798b"/><rect x="552.32" y="306" width="30.5" height="14" fill="#495f73"/><rect x="582.32" y="306" width="30.5" height="14" fill="#2d445b"/><rect x="612.32" y="306" width="30.5" height="14" fill="#102a43"/><text x="650.32" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="650.32" dy="0">viaja</tspan></text><text x="696.02" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="696.02" dy="0">más oscuro = mayor (la cookie viaja)</tspan></text><rect x="10" y="334" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="358.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las dos peticiones que cambian estado (formulario y fetch POST) solo llevan la cookie con None: Lax y Strict cortan esa vía</tspan></text><text x="470" y="375.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de falsificación entre sitios. De 14 peticiones CORS de ejemplo, 7 necesitan una comprobación previa. Es una tabla de la</tspan></text><text x="470" y="392.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">regla, no una medición de navegadores; la excepción de Lax con POST reciente de algunos navegadores no está modelada.</tspan></text><text x="470" y="439.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
