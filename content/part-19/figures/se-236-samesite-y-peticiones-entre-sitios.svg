<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 448" width="940" height="448" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">¿Viaja la cookie en una petición iniciada desde otro sitio? Matriz de SameSite</title><desc id="d">Tabla: en una petición desde otro sitio, la cookie con SameSite Strict no viaja nunca, con Lax viaja solo en una navegación GET de nivel superior y con None viaja siempre; de las 14 peticiones CORS del ejemplo, 7 necesitan una comprobación previa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="448" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Petición iniciada desde otro sitio</tspan></text><rect x="480" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Strict</tspan></text><rect x="630" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">Lax</tspan></text><rect x="780" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">None</tspan></text><rect x="10" y="56" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Navegar con un enlace (GET de nivel superior)</tspan></text><rect x="480" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">No</tspan></text><rect x="630" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">Sí</tspan></text><rect x="780" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">Sí</tspan></text><rect x="10" y="108" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Enviar un formulario (POST)</tspan></text><rect x="480" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">No</tspan></text><rect x="630" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">No</tspan></text><rect x="780" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">Sí</tspan></text><rect x="10" y="160" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">fetch con POST desde otro sitio</tspan></text><rect x="480" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">No</tspan></text><rect x="630" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">No</tspan></text><rect x="780" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">Sí</tspan></text><rect x="10" y="212" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Imagen incrustada</tspan></text><rect x="480" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">No</tspan></text><rect x="630" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">No</tspan></text><rect x="780" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">Sí</tspan></text><rect x="10" y="264" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="290.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Página incrustada en un iframe</tspan></text><rect x="480" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">No</tspan></text><rect x="630" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">No</tspan></text><rect x="780" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">Sí</tspan></text><rect x="10" y="320" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las dos peticiones que cambian estado (formulario y fetch POST) solo llevan la cookie con None: Lax y Strict cortan esa vía</tspan></text><text x="470" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de falsificación entre sitios. De 14 peticiones CORS de ejemplo, 7 necesitan una comprobación previa (método distinto de</tspan></text><text x="470" y="378.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">GET, HEAD o POST, cabeceras no seguras o tipo de contenido no simple). Es una tabla de la regla, no una medición de</tspan></text><text x="470" y="394.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">navegadores; la excepción de Lax con POST reciente de algunos navegadores no está modelada.</tspan></text><text x="470" y="434.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
