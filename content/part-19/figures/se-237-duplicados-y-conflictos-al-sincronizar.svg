<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 427" width="960" height="427" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sincronizar tras estar sin conexión: duplicados, reintentos y escrituras perdidas</title><desc id="d">Tabla: sin clave de idempotencia, 2000 envíos con 20 por ciento de confirmaciones perdidas producen 476 efectos duplicados; con clave producen 2000; y con la última escritura gana, 300 ediciones concurrentes pierden una, y en 13,3 por ciento gana la más antigua por desajuste de reloj.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="427" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Situación simulada</tspan></text><rect x="430" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Resultado en el servidor</tspan></text><rect x="700" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Reintentos o riesgo</tspan></text><rect x="10" y="56" width="414" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="82.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">2000 envíos con 20 % de confirmaciones perdidas, sin clave</tspan></text><text x="217" y="98.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">de idempotencia</tspan></text><rect x="430" y="56" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">2476 efectos (476 duplicados)</tspan></text><rect x="700" y="56" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">476 reintentos</tspan></text><rect x="10" y="124" width="414" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Los mismos envíos con clave de idempotencia por operación</tspan></text><rect x="430" y="124" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">2000 efectos (0 duplicados)</tspan></text><rect x="700" y="124" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">390 reintentos</tspan></text><rect x="10" y="192" width="414" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="218.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">300 ediciones concurrentes sin conexión, última escritura</tspan></text><text x="217" y="234.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">gana</tspan></text><rect x="430" y="192" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">300 ediciones descartadas</tspan></text><rect x="700" y="192" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="218.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">13,3 % gana la más antigua por</tspan></text><text x="822" y="234.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">reloj</tspan></text><rect x="10" y="260" width="414" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Las mismas 300 con comprobación de versión</tspan></text><rect x="430" y="260" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">0 descartadas en silencio</tspan></text><rect x="700" y="260" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">exige resolver el conflicto</tspan></text><rect x="10" y="332" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Los relojes de los dispositivos se desviaron hasta ±2 min (supuesto). Si la política de nota por entrega tardía usa la hora</tspan></text><text x="480" y="373.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">del cliente, ese desajuste decide una nota: la hora debe ser la del servidor al recibir, o una marca firmada.</tspan></text><text x="480" y="413.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
