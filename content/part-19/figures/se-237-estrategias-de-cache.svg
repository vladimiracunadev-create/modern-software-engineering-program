<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" width="960" height="415" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estrategias de caché en 20 000 peticiones con 19,4 % del tiempo sin conexión</title><desc id="d">Tabla: servir solo desde la red falla en 19,33 por ciento de las peticiones; caché primero responde en 6 milisegundos pero sirve contenido obsoleto en 69,88 por ciento; red primero casi no sirve obsoleto pero tarda 165; revalidar en segundo plano reduce lo obsoleto a 5,2 por ciento con la misma latencia que caché primero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="415" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Estrategia</tspan></text><rect x="330" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Desde caché</tspan></text><rect x="480" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Fallos</tspan></text><rect x="610" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">Contenido obsoleto</tspan></text><rect x="800" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Latencia media</tspan></text><rect x="10" y="56" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Solo red</tspan></text><rect x="330" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">0 %</tspan></text><rect x="480" y="56" width="124" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">19,33 %</tspan></text><rect x="610" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">0 %</tspan></text><rect x="800" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">120 ms</tspan></text><rect x="10" y="108" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Caché primero</tspan></text><rect x="330" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">98,3 %</tspan></text><rect x="480" y="108" width="124" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0,69 %</tspan></text><rect x="610" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">69,88 %</tspan></text><rect x="800" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">6,2 ms</tspan></text><rect x="10" y="160" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Caché primero con precarga</tspan></text><rect x="330" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">100 %</tspan></text><rect x="480" y="160" width="124" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0 %</tspan></text><rect x="610" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">70,83 %</tspan></text><rect x="800" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">5,0 ms</tspan></text><rect x="10" y="212" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Red primero con respaldo en caché</tspan></text><rect x="330" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">18,6 %</tspan></text><rect x="480" y="212" width="124" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0,69 %</tspan></text><rect x="610" y="212" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">1,47 %</tspan></text><rect x="800" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">165 ms</tspan></text><rect x="10" y="264" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Revalidar en segundo plano</tspan></text><rect x="330" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">98,3 %</tspan></text><rect x="480" y="264" width="124" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0,69 %</tspan></text><rect x="610" y="264" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">5,2 %</tspan></text><rect x="800" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">6,2 ms</tspan></text><rect x="10" y="320" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">200 URL con popularidad 1/n, cambios de 0 a 12 por URL en 500 h y ráfagas sin conexión que suman 19,4 % del tiempo. Los 120 ms</tspan></text><text x="480" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">de red, 5 ms de caché y 360 ms de espera son supuestos; la obsolescencia cuenta versiones, no importancia del cambio.</tspan></text><text x="480" y="401.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
