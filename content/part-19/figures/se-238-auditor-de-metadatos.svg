<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 423" width="1000" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defectos de metadatos que detecta un auditor de 120 páginas sintéticas con una mutación cada una</title><desc id="d">Barras: un auditor de metadatos detecta 113 de 120 mutaciones, entre ellas canónica relativa, descripción larga, título duplicado o largo, JSON-LD inválido y noindex olvidado, y no detecta ninguno de los 7 títulos que describen otra cosa que la página.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="423" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Canónica relativa (14)</tspan></text><rect x="430" y="16" width="364" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="802" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802" dy="0">14 de 14</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Descripción larga (15)</tspan></text><rect x="430" y="60" width="390" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="828" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="828" dy="0">15 de 15</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Título duplicado (15)</tspan></text><rect x="430" y="104" width="390" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="828" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="828" dy="0">15 de 15</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Título largo (11)</tspan></text><rect x="430" y="148" width="286" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="724" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="724" dy="0">11 de 11</tspan></text><text x="420" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">JSON-LD inválido (9)</tspan></text><rect x="430" y="192" width="234" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="672" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="672" dy="0">9 de 9</tspan></text><text x="420" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">noindex olvidado (5)</tspan></text><rect x="430" y="236" width="130" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="568" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="568" dy="0">5 de 5</tspan></text><text x="420" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Título que no corresponde a la página (7)</tspan></text><rect x="430" y="280" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="442" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442" dy="0">0 de 7</tspan></text><rect x="10" y="328" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Otros tipos detectados: título ausente 10, descripción ausente 7, canónica ausente 9, imagen social relativa 11 y lang ausente 7.</tspan></text><text x="500" y="369.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El auditor comprueba forma, no verdad: un título bien formado que no describe la página pasa todas las reglas.</tspan></text><text x="500" y="409.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
