<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 379" width="960" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">URLs que una navegación facetada pone al alcance de un rastreador</title><desc id="d">Tabla: seis facetas, tres órdenes y veinte páginas generan 2 016 000 URLs con los parámetros en orden fijo y 544 467 960 si el orden puede variar; permitir indexar como mucho una faceta deja 600.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="379" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Situación</tspan></text><rect x="650" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">URLs posibles</tspan></text><rect x="10" y="56" width="634" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">6 facetas con 4, 5, 6, 3, 7 y 4 valores, más «sin filtro»</tspan></text><rect x="650" y="56" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">33 600 combinaciones</tspan></text><rect x="10" y="112" width="634" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Con 3 órdenes y 20 páginas, parámetros en orden fijo</tspan></text><rect x="650" y="112" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">2 016 000 URLs</tspan></text><rect x="10" y="168" width="634" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Si los parámetros pueden llegar en cualquier orden</tspan></text><rect x="650" y="168" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">544 467 960 URLs</tspan></text><rect x="10" y="224" width="634" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Como mucho una faceta indexable (el resto con canónica)</tspan></text><rect x="650" y="224" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">600 URLs</tspan></text><rect x="10" y="284" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cálculo exacto por enumeración de subconjuntos y permutaciones, validado enumerando un caso pequeño (36 combinaciones).</tspan></text><text x="480" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cuántas de esas URLs rastrea realmente un buscador depende de enlaces, presupuesto y señales que no se miden aquí.</tspan></text><text x="480" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
