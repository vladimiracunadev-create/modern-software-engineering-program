<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 569" width="960" height="569" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nueve defectos de accesibilidad inyectados: cuáles detecta un conjunto de reglas automáticas</title><desc id="d">Tabla: de nueve defectos de accesibilidad inyectados en una página sintética, seis se detectan con reglas automáticas, entre ellos el contraste, el foco, las etiquetas y los errores sin asociar, y tres no, porque exigen ver la imagen, identificar el idioma o entender el propósito del campo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="569" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Defecto inyectado</tspan></text><rect x="410" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">¿Lo detecta una regla?</tspan></text><rect x="600" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Por qué</tspan></text><rect x="10" y="56" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Contraste insuficiente de un enlace</tspan></text><rect x="410" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Sí</tspan></text><rect x="600" y="56" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Se calcula la razón</tspan></text><rect x="10" y="102" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Indicador de foco eliminado</tspan></text><rect x="410" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Sí</tspan></text><rect x="600" y="102" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Regla sobre el CSS</tspan></text><rect x="10" y="148" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Campo sin etiqueta</tspan></text><rect x="410" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Sí</tspan></text><rect x="600" y="148" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Regla estructural</tspan></text><rect x="10" y="194" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Error sin asociar al campo</tspan></text><rect x="410" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Sí</tspan></text><rect x="600" y="194" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">aria-describedby ausente</tspan></text><rect x="10" y="240" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">tabindex positivo</tspan></text><rect x="410" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Sí</tspan></text><rect x="600" y="240" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Regla estructural</tspan></text><rect x="10" y="286" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Enlace «clic aquí»</tspan></text><rect x="410" y="286" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Sí</tspan></text><rect x="600" y="286" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Lista de textos genéricos</tspan></text><rect x="10" y="332" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Texto alternativo engañoso</tspan></text><rect x="410" y="332" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">No</tspan></text><rect x="600" y="332" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Requiere mirar la imagen</tspan></text><rect x="10" y="378" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="401.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Idioma declarado equivocado</tspan></text><rect x="410" y="378" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">No</tspan></text><rect x="600" y="378" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Requiere identificar el idioma del texto</tspan></text><rect x="10" y="424" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="447.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Etiqueta que dice otra cosa que el campo</tspan></text><rect x="410" y="424" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">No</tspan></text><rect x="600" y="424" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Requiere entender el propósito</tspan></text><rect x="10" y="474" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="498.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">6 de 9 es el resultado de estas nueve reglas sobre estos nueve defectos, no una cobertura general de WCAG. Una herramienta</tspan></text><text x="480" y="515.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">automática real cubre más reglas y falla en otras: la revisión con teclado y lector de pantalla sigue haciendo falta.</tspan></text><text x="480" y="555.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
