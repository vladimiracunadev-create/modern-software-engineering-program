<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" width="960" height="455" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Auditoría de cabeceras de un servidor local con ocho rutas y cinco configuraciones erróneas</title><desc id="d">Tabla: un comprobador que pide ocho rutas a un servidor local en el bucle de retorno encuentra 7 hallazgos en cinco rutas, entre ellos un service worker con caché de un año, una hoja sin caché, un manifiesto con tipo MIME distinto y datos mutables con caché larga.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="455" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Ruta</tspan></text><rect x="340" y="12" width="604" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Hallazgo</tspan></text><rect x="10" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">/app/sw.js</tspan></text><rect x="340" y="56" width="604" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">Cache-Control de un año: el navegador no verá una versión nueva</tspan></text><rect x="10" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">/app/app.css</tspan></text><rect x="340" y="106" width="604" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">no-store en una hoja de estilos sin huella</tspan></text><rect x="10" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">/app/manifest.webmanifest</tspan></text><rect x="340" y="156" width="604" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">Content-Type application/json en vez de application/manifest+json</tspan></text><rect x="10" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">/app/datos.json</tspan></text><rect x="340" y="206" width="604" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">Un año de caché en datos mutables; sin nosniff</tspan></text><rect x="10" y="256" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">/app/ayuda/</tspan></text><rect x="340" y="256" width="604" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">HTML sin charset y sin nosniff</tspan></text><rect x="10" y="306" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">/app/, app.3f9a1c.js, icons/192.png</tspan></text><rect x="340" y="306" width="604" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">Sin hallazgos</tspan></text><rect x="10" y="360" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un servidor Python en 127.0.0.1 con puerto efímero sirvió ocho respuestas de dos bytes; no se tocó ninguna red. Que las</tspan></text><text x="480" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">cabeceras sean correctas no demuestra que el service worker se actualice: eso solo se ve en un navegador.</tspan></text><text x="480" y="441.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
