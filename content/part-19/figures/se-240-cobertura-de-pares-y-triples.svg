<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 335" width="1100" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Matriz de pruebas de aceptación: cobertura de pares frente a defectos que exigen tres factores</title><desc id="d">Barras: 108 combinaciones de red, dispositivo, entrada, estado e idioma se reducen a 12 casos que cubren todos los pares; esa suite halla 32 de 60 defectos que exigen tres factores a la vez, igual que 12 casos al azar, 31,7, y las 108 los hallan todos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1100" height="335" fill="#ffffff"/><text x="500" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Combinaciones posibles (3×2×3×3×2)</tspan></text><rect x="510" y="16" width="486" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="1004" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1004" dy="0">108 casos</tspan></text><text x="500" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Suite de pares elegida con criterio voraz</tspan></text><rect x="510" y="60" width="54" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="572" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="572" dy="0">12 casos</tspan></text><text x="500" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Defectos de tres factores hallados por esa suite (de 60)</tspan></text><rect x="510" y="104" width="144" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="662" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="662" dy="0">32 de 60</tspan></text><text x="500" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Misma cantidad de casos al azar (media de 200)</tspan></text><rect x="510" y="148" width="142.65" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="660.65" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="660.65" dy="0">31,7 de 60</tspan></text><text x="500" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Recorrido exhaustivo de las 108</tspan></text><rect x="510" y="192" width="270" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="788" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788" dy="0">60 de 60</tspan></text><rect x="10" y="240" width="1080" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="550" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">Cubrir todos los pares no significa cubrir las interacciones de tres factores: la suite de pares cubre 60,2 % de las triples. Los defectos que</tspan></text><text x="550" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">dependen de red, entrada y estado a la vez los encuentra el recorrido exhaustivo o la intuición sobre dónde interactúan.</tspan></text><text x="550" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
