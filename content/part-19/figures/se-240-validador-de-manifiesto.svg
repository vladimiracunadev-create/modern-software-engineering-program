<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 505" width="960" height="505" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de manifiesto: 120 mutaciones de un manifiesto de aplicación web sintético</title><desc id="d">Tabla: un validador de forma del manifiesto detecta 83 de 120 mutaciones, todas las que falta o rompen campos, el alcance o los iconos declarados, y no detecta las que exigen comprobar el sistema de archivos o el significado: iconos inexistentes, nombres engañosos, idioma equivocado o iconos de otro tamaño.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="505" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Mutación</tspan></text><rect x="570" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Casos</tspan></text><rect x="730" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Falta name, start_url o icons</tspan></text><rect x="570" y="56" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">27</tspan></text><rect x="730" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">27</tspan></text><rect x="10" y="106" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">short_name largo, display o color inválidos</tspan></text><rect x="570" y="106" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">23</tspan></text><rect x="730" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">23</tspan></text><rect x="10" y="156" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">start_url fuera del scope</tspan></text><rect x="570" y="156" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">6</tspan></text><rect x="730" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">6</tspan></text><rect x="10" y="206" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Sin icono 512 o sin maskable, sizes roto</tspan></text><rect x="570" y="206" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">27</tspan></text><rect x="730" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">27</tspan></text><rect x="10" y="256" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">src de un icono que no existe</tspan></text><rect x="570" y="256" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">11</tspan></text><rect x="730" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0</tspan></text><rect x="10" y="306" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Nombre engañoso o idioma equivocado</tspan></text><rect x="570" y="306" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">18</tspan></text><rect x="730" y="306" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0</tspan></text><rect x="10" y="356" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="381.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Icono declarado 192 que mide otra cosa</tspan></text><rect x="570" y="356" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">8</tspan></text><rect x="730" y="356" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0</tspan></text><rect x="10" y="410" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Detectadas 83 de 120. Los 37 casos restantes no son defectos del JSON: son discrepancias entre el JSON y el mundo (archivos,</tspan></text><text x="480" y="451.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">significado). Para verlos hay que abrir los archivos referidos y revisar el contenido, no validar el esquema.</tspan></text><text x="480" y="491.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
