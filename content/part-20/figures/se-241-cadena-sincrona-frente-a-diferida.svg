<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Solicitudes que superan el tiempo máximo del cliente (1 s): cadena síncrona frente a trabajo diferido</title><desc id="d">Barras de 100 000 solicitudes simuladas con tiempo máximo de 1 segundo: la cadena síncrona con base de datos, análisis de archivo y correo supera el límite en 12,47 por ciento con correo sano, 14,21 con 2 por ciento de envíos lentos y 21,42 con 10 por ciento; la versión que solo guarda y encola no lo supera nunca.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="307" fill="#ffffff"/><text x="340" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">Síncrona, correo sano</tspan></text><rect x="350" y="16" width="274.34" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="632.34" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="632.34" dy="0">12,47 %</tspan></text><text x="340" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">Síncrona, 2 % de envíos lentos</tspan></text><rect x="350" y="60" width="312.62" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="670.62" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="670.62" dy="0">14,21 %</tspan></text><text x="340" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">Síncrona, 10 % de envíos lentos</tspan></text><rect x="350" y="104" width="471.24" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="829.24" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="829.24" dy="0">21,42 %</tspan></text><text x="340" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">Diferida (base de datos + encolar)</tspan></text><rect x="350" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="362" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362" dy="0">0,00 %</tspan></text><rect x="10" y="196" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">La cadena síncrona suma tres latencias (mediana 8 ms + 400 ms + 150 ms) y hereda la cola larga del peor eslabón: con 10 % de envíos</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">lentos el p95 sube a 5 412 ms. Responder tras guardar y encolar (mediana 10 ms, p99 22 ms) separa lo que se promete ahora de lo que</tspan></text><text x="500" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">se completa después.</tspan></text><text x="500" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
