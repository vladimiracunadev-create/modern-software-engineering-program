<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 475" width="1020" height="475" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué estados quedan tras una caída en el alta de una entrega</title><desc id="d">Tabla: sin outbox, 10 de 24 combinaciones de orden y punto de caída dejan una violación grave; con archivo, fila más outbox transaccional y relevo, no queda ninguna violación grave, solo un archivo huérfano limpiable, y el relevo puede publicar un evento dos veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="475" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Diseño</tspan></text><rect x="390" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">Resultado</tspan></text><rect x="610" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Qué queda inconsistente</tspan></text><rect x="10" y="56" width="374" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="88.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Sin outbox: 6 órdenes de archivo, fila y evento × 4</tspan></text><text x="197" y="104.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">puntos de caída</tspan></text><rect x="390" y="56" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="96.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">10 de 24 con violación grave</tspan></text><rect x="610" y="56" width="394" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="88.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">fila sin archivo 4 · fila sin evento 4 · evento sin</tspan></text><text x="807" y="104.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">fila 4 · archivo huérfano 4</tspan></text><rect x="10" y="136" width="374" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="168.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Con outbox: archivo, luego fila y outbox en una</tspan></text><text x="197" y="184.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">transacción, luego relevo (3 puntos de caída)</tspan></text><rect x="390" y="136" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="176.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">0 de 3</tspan></text><rect x="610" y="136" width="394" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="168.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">fila sin archivo 0 · fila sin evento 0 · evento sin</tspan></text><text x="807" y="184.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">fila 0 · archivo huérfano 1 (limpiable)</tspan></text><rect x="10" y="216" width="374" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="256.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Caída dentro de la transacción</tspan></text><rect x="390" y="216" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="256.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">0 filas, 0 eventos</tspan></text><rect x="610" y="216" width="394" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="256.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">SQLite revierte las dos inserciones a la vez</tspan></text><rect x="10" y="296" width="374" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="328.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">El relevo publica y cae antes de marcar el evento</tspan></text><text x="197" y="344.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">como enviado</tspan></text><rect x="390" y="296" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="328.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">2 publicaciones del mismo</tspan></text><text x="497" y="344.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">evento</tspan></text><rect x="610" y="296" width="394" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="328.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">entrega al menos una vez: el consumidor debe tolerar el</tspan></text><text x="807" y="344.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">duplicado</tspan></text><rect x="10" y="380" width="1000" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">El modelo enumera todos los puntos de caída de tres pasos; no incluye caídas de disco, corrupción ni varios procesos concurrentes. La</tspan></text><text x="510" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">transacción atómica se comprobó con SQLite real; el archivo y el bus son simulados.</tspan></text><text x="510" y="461.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
