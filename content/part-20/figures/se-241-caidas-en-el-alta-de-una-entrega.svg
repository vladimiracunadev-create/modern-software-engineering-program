<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué estados quedan tras una caída en el alta de una entrega</title><desc id="d">Barras apiladas con las combinaciones de orden y punto de caída que dejan una violación grave: sin outbox, 10 de 24; con archivo, fila más outbox transaccional y relevo, 0 de 3, con solo un archivo huérfano limpiable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="330" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué estados quedan tras una caída en el alta de una entrega</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Violación grave</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Sin violación grave</tspan></text><line x1="314" y1="77" x2="314" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="165" x2="314" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="426.34" y1="77" x2="426.34" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="426.34" y1="165" x2="426.34" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="426.34" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="426.34" dy="0">5</tspan></text><line x1="538.68" y1="77" x2="538.68" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="538.68" y1="165" x2="538.68" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="538.68" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="538.68" dy="0">10</tspan></text><line x1="651.02" y1="77" x2="651.02" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="651.02" y1="165" x2="651.02" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="651.02" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="651.02" dy="0">15</tspan></text><line x1="763.36" y1="77" x2="763.36" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="763.36" y1="165" x2="763.36" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="763.36" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="763.36" dy="0">20</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">25</tspan></text><line x1="314" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Sin outbox: 6 órdenes × 4 puntos de</tspan></text><text x="304" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">caída</tspan></text><text x="304" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Con outbox: archivo, transacción y</tspan></text><text x="304" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">relevo (3 puntos)</tspan></text><rect x="314" y="84" width="224.68" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="426.34" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="426.34" dy="0">10</tspan></text><rect x="538.68" y="84" width="314.552" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="695.956" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="695.956" dy="0">14</tspan></text><text x="860.232" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="860.232" dy="0">24</tspan></text><rect x="314" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="314" y="128" width="67.404" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="347.702" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347.702" dy="0">3</tspan></text><text x="388.404" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="388.404" dy="0">3</tspan></text><text x="594.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="594.85" dy="0">Combinaciones de orden y punto de caída</tspan></text><rect x="10" y="223" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El modelo enumera todos los puntos de caída de tres pasos; no incluye caídas de disco, corrupción ni varios procesos</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">concurrentes. La transacción atómica se comprobó con SQLite real; el archivo y el bus son simulados.</tspan></text><text x="470" y="312.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
