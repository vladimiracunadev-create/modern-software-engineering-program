<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 351" width="1000" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">40 clientes simultáneos contra un servidor local real que tarda 50 ms por solicitud</title><desc id="d">Barras con el tiempo total de 40 solicitudes concurrentes: un servidor de un solo hilo tarda 3,42 segundos en Windows y 2,60 en Ubuntu, uno con un hilo por solicitud 0,16 y 0,14, y uno con tope de 8 solicitudes en curso 0,15 segundos pero rechaza 24 con el código 503.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="351" fill="#ffffff"/><text x="380" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Un solo hilo · Windows</tspan></text><rect x="390" y="16" width="444.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="842.6" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="842.6" dy="0">3,42 s</tspan></text><text x="380" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Un solo hilo · Ubuntu</tspan></text><rect x="390" y="60" width="338" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="736" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="736" dy="0">2,60 s</tspan></text><text x="380" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Un hilo por solicitud · Windows</tspan></text><rect x="390" y="104" width="20.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="418.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="418.8" dy="0">0,16 s</tspan></text><text x="380" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Un hilo por solicitud · Ubuntu</tspan></text><rect x="390" y="148" width="18.2" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="416.2" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="416.2" dy="0">0,14 s</tspan></text><text x="380" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Tope de 8 en curso · 16 servidas, 24 con 503</tspan></text><rect x="390" y="192" width="19.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="417.5" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="417.5" dy="0">0,15 s (Windows)</tspan></text><rect x="10" y="240" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Teóricamente 40 × 50 ms = 2 s; Windows añadió granularidad de temporizador. El tope de 8 acaba pronto porque rechaza lo que no</tspan></text><text x="500" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">cabe: devolver 503 rápido protege al proceso a cambio de que el cliente reintente. Tiempos de un equipo, no una promesa de</tspan></text><text x="500" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">capacidad.</tspan></text><text x="500" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Servidor HTTP de la biblioteca estándar, 127.0.0.1, medido; los tiempos dependen del equipo.</tspan></text></svg>
