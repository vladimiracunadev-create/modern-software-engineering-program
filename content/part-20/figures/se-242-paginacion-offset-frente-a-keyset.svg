<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 295" width="970" height="295" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Paginar 1 000 entregas mientras llegan 7 nuevas antes de cada página</title><desc id="d">Tabla: con paginación por desplazamiento (offset) se devuelven 1 168 filas con 161 repetidas; con paginación por clave (keyset) se devuelven 1 007 filas sin repetidas; las dos terminan viendo las 1 000 originales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="295" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Estrategia</tspan></text><rect x="340" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Filas devueltas</tspan></text><rect x="540" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="637" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">Filas repetidas</tspan></text><rect x="740" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Originales vistas</tspan></text><rect x="10" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Offset 50 (order by ts desc)</tspan></text><rect x="340" y="56" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">1 168</tspan></text><rect x="540" y="56" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">161</tspan></text><rect x="740" y="56" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1 000 de 1 000</tspan></text><rect x="10" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Keyset (ts &lt; último visto)</tspan></text><rect x="340" y="118" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">1 007</tspan></text><rect x="540" y="118" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">0</tspan></text><rect x="740" y="118" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1 000 de 1 000</tspan></text><rect x="10" y="184" width="950" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="208.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Las inserciones empujan las filas hacia abajo y el offset las vuelve a entregar. Keyset elimina las repetidas, pero no permite</tspan></text><text x="485" y="225.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">saltar a la página 40 y exige un orden total (marca de tiempo más identificador). Si se borran filas, el offset en cambio omite</tspan></text><text x="485" y="242.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">filas; aquí no se simuló el borrado.</tspan></text><text x="485" y="281.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
