<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 263" width="1000" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bytes que recibe la pantalla «entregas de un curso» (50 entregas) según el estilo de interfaz</title><desc id="d">Barras: con recursos REST completos la pantalla recibe 20 991 bytes en dos viajes, con campos seleccionados 1 272 bytes en dos viajes y con una llamada a medida 1 276 bytes en un viaje; la pantalla usa 2 de 6 campos de cada entrega.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="263" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">REST con recursos completos (2 viajes)</tspan></text><rect x="370" y="16" width="503.784" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="881.784" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="881.784" dy="0">20 991 B</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">REST con campos seleccionados (2 viajes)</tspan></text><rect x="370" y="60" width="30.528" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="408.528" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="408.528" dy="0">1 272 B</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Llamada a medida tipo RPC (1 viaje)</tspan></text><rect x="370" y="104" width="30.624" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="408.624" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="408.624" dy="0">1 276 B</tspan></text><rect x="10" y="152" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Solo el 6,1 % de los bytes del diseño con recursos completos sirve a la pantalla. Seleccionar campos o diseñar una llamada para la</tspan></text><text x="500" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">pantalla da el mismo tamaño; la diferencia es cuántos viajes y quién carga con el acoplamiento (la pantalla conoce campos, o el</tspan></text><text x="500" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">servidor conoce pantallas).</tspan></text><text x="500" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
