<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" width="1000" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Consultas SQL para devolver cursos con sus entregas</title><desc id="d">Barras con el número de consultas SQL medido con un contador sobre SQLite: un resolvedor ingenuo hace 11, 51 y 201 consultas para 10, 50 y 200 cursos, y la carga por lotes hace 2 en los tres casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="395" fill="#ffffff"/><text x="340" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">10 cursos · resolvedor ingenuo</tspan></text><rect x="350" y="16" width="26.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="384.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="384.4" dy="0">11 consultas</tspan></text><text x="340" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">10 cursos · por lotes</tspan></text><rect x="350" y="60" width="4.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="362.8" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362.8" dy="0">2</tspan></text><text x="340" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">50 cursos · resolvedor ingenuo</tspan></text><rect x="350" y="104" width="122.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480.4" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="480.4" dy="0">51</tspan></text><text x="340" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">50 cursos · por lotes</tspan></text><rect x="350" y="148" width="4.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="362.8" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362.8" dy="0">2</tspan></text><text x="340" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">200 cursos · resolvedor ingenuo</tspan></text><rect x="350" y="192" width="482.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.4" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="840.4" dy="0">201</tspan></text><text x="340" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="340" dy="0">200 cursos · por lotes</tspan></text><rect x="350" y="236" width="4.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="362.8" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362.8" dy="0">2</tspan></text><rect x="10" y="284" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El problema N+1 es independiente del estilo: ocurre en REST con includes y en GraphQL con resolvedores por campo. La carga por</tspan></text><text x="500" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">lotes lo evita en la capa de datos, no en el contrato. Con un SQLite en memoria cada consulta es barata; con red y base de datos</tspan></text><text x="500" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">remota cada una pagaría una latencia.</tspan></text><text x="500" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
