<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 447" width="990" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Límite de profundidad: nodos que permite y consultas legítimas que rechaza</title><desc id="d">Tabla: con 20 elementos por nivel, una consulta de profundidad 6 resuelve 67 368 420 nodos; un límite de profundidad 2 rechaza 18,62 por ciento de 10 000 consultas legítimas sintéticas, uno de 3 el 7,89, uno de 4 el 3,31 y uno de 5 el 1,48.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="447" fill="#ffffff"/><rect x="10" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="87" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="87" dy="0">Límite de</tspan></text><text x="87" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="87" dy="0">profundidad</tspan></text><rect x="170" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">Nodos de la consulta más profunda</tspan></text><text x="332" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">permitida (20 por nivel)</tspan></text><rect x="500" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Consultas legítimas rechazadas por ese límite</tspan></text><rect x="10" y="56" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">1</tspan></text><rect x="170" y="56" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">20</tspan></text><rect x="500" y="56" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">43,15 %</tspan></text><rect x="10" y="102" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">2</tspan></text><rect x="170" y="102" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">420</tspan></text><rect x="500" y="102" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">18,62 %</tspan></text><rect x="10" y="148" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">3</tspan></text><rect x="170" y="148" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">8 420</tspan></text><rect x="500" y="148" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">7,89 %</tspan></text><rect x="10" y="194" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">4</tspan></text><rect x="170" y="194" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">168 420</tspan></text><rect x="500" y="194" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">3,31 %</tspan></text><rect x="10" y="240" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">5</tspan></text><rect x="170" y="240" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">3 368 420</tspan></text><rect x="500" y="240" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">1,48 %</tspan></text><rect x="10" y="286" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">6</tspan></text><rect x="170" y="286" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">67 368 420</tspan></text><rect x="500" y="286" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">0,00 %</tspan></text><rect x="10" y="336" width="970" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Se acotan el coste y no solo la forma: un límite de 10 000 nodos acepta hasta profundidad 3 y uno de 1 000 solo hasta 2. La</tspan></text><text x="495" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">distribución de consultas legítimas es una suposición del autor (exponencial, media 1,2 niveles), no una medición de clientes</tspan></text><text x="495" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">reales.</tspan></text><text x="495" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
