<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 307" width="1060" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutaciones de una respuesta que detecta cada comprobación (283 mutaciones reales de 300)</title><desc id="d">Barras: de 283 mutaciones que cambian una respuesta, un ejemplo parcial detecta 155, un esquema abierto 181, uno cerrado 232 y uno cerrado con enumeración del estado las 283; 17 mutaciones no cambiaban nada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="307" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Solo código de estado + ejemplo parcial (id y estado)</tspan></text><rect x="430" y="16" width="232.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="670.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="670.5" dy="0">155 de 283</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Esquema abierto (tipos y campos obligatorios)</tspan></text><rect x="430" y="60" width="271.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="709.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="709.5" dy="0">181</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Esquema cerrado (sin campos extra)</tspan></text><rect x="430" y="104" width="348" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="786" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="786" dy="0">232</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Esquema cerrado + enumeración del estado</tspan></text><rect x="430" y="148" width="424.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="862.5" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="862.5" dy="0">283</tspan></text><rect x="10" y="196" width="1040" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="530" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="530" dy="0">Cada capa atrapa algo que la anterior dejaba pasar: campos extra (filtraciones como debug_sql) y valores fuera de la enumeración. Las 283</tspan></text><text x="530" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="530" dy="0">detectadas son las mutaciones que el autor imaginó (quitar, tipar mal, añadir, anular, renombrar, valor): una deriva de significado con la</tspan></text><text x="530" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="530" dy="0">forma intacta no se ve.</tspan></text><text x="530" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
