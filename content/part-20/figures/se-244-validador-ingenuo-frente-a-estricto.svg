" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">alumno_id = 99999999999999999999</tspan></text><rect x="410" y="194" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">acepta</tspan></text><rect x="740" y="194" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">rechaza</tspan></text><rect x="10" y="240" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">campo extra is_admin</tspan></text><rect x="410" y="240" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">acepta</tspan></text><rect x="740" y="240" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">rechaza</tspan></text><rect x="10" y="286" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">clave alumno_id repetida (gana la última)</tspan></text><rect x="410" y="286" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">acepta</tspan></text><rect x="740" y="286" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">rechaza</tspan></text><rect x="10" y="332" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">texto de 6 000 caracteres</tspan></text><rect x="410" y="332" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">acepta</tspan></text><rect x="740" y="332" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">rechaza</tspan></text><rect x="10" y="378" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="401.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">horas_retraso = NaN</tspan></text><rect x="410" y="378" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">rechaza (por azar: NaN ≥ 0 es falso)</tspan></text><rect x="740" y="378" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">rechaza</tspan></text><rect x="10" y="428" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Errores: ingenuo 11 de 14, estricto 0 de 14. En Python bool es subclase de int y json.loads acepta NaN e Infinity por defecto.</tspan></text><text x="480" y="469.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Que el estricto acierte las 14 solo prueba que se escribió mirándolas: otras cargas (unicode normalizado, enteros con ceros)</tspan></text><text x="480" y="486.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">no se probaron.</tspan></text><text x="480" y="525.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
