<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 341" width="1020" height="341" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">2 000 clientes reintentan tras una caída de 5 s con capacidad de 400 solicitudes por segundo</title><desc id="d">Tabla: tras la caída, con intervalo fijo el pico es de 2 000 solicitudes por segundo, hay 3 segundos sobre la capacidad y 800 clientes abandonan tras 8 intentos; con retroceso exponencial sin jitter el pico es 2 000 y hay 4 segundos sobre la capacidad; con jitter total el pico baja a 372 y no se supera la capacidad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="341" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Política de reintento</tspan></text><rect x="340" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Pico tras la caída (solicitudes</tspan></text><text x="472" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">por segundo)</tspan></text><rect x="610" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="712" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712" dy="0">Segundos sobre la</tspan></text><text x="712" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712" dy="0">capacidad</tspan></text><rect x="820" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="912" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="912" dy="0">Clientes que abandonan</tspan></text><rect x="10" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Intervalo fijo de 1 s</tspan></text><rect x="340" y="56" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">2 000</tspan></text><rect x="610" y="56" width="204" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">3 s</tspan></text><rect x="820" y="56" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">800</tspan></text><rect x="10" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Exponencial sin jitter</tspan></text><rect x="340" y="118" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">2 000</tspan></text><rect x="610" y="118" width="204" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">4 s</tspan></text><rect x="820" y="118" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">0</tspan></text><rect x="10" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Exponencial con jitter total</tspan></text><rect x="340" y="180" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">372</tspan></text><rect x="610" y="180" width="204" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">0 s</tspan></text><rect x="820" y="180" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">0</tspan></text><rect x="10" y="246" width="1000" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">Sin aleatoriedad, los clientes que fallaron a la vez vuelven a la vez: el retroceso exponencial solo los espacia en oleadas. El jitter</tspan></text><text x="510" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">reparte la carga. El modelo supone una capacidad fija y clientes idénticos; no representa colas del servidor ni presión posterior.</tspan></text><text x="510" y="327.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
