<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pico de solicitudes tras una caída de 5 s con 2 000 clientes y capacidad de 400 por segundo</title><desc id="d">Barras horizontales con el pico de solicitudes por segundo tras la caída: 2 000 con intervalo fijo de 1 s, 2 000 con retroceso exponencial sin jitter y 372 con jitter total, frente a una capacidad de 400; con intervalo fijo hay 3 segundos sobre la capacidad y 800 clientes abandonan, con exponencial sin jitter 4 segundos y con jitter total ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pico de solicitudes tras una caída de 5 s con 2 000 clientes y capacidad de 400 por segundo</tspan></text><line x1="254" y1="49" x2="254" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="163" x2="254" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="409.425" y1="49" x2="409.425" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="409.425" y1="163" x2="409.425" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="409.425" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409.425" dy="0">500</tspan></text><line x1="564.85" y1="49" x2="564.85" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="564.85" y1="163" x2="564.85" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="564.85" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="564.85" dy="0">1 000</tspan></text><line x1="720.275" y1="49" x2="720.275" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="720.275" y1="163" x2="720.275" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="720.275" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="720.275" dy="0">1 500</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="163" x2="875.7" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2 000</tspan></text><line x1="254" y1="163" x2="875.7" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Intervalo fijo de 1 s</tspan></text><text x="244" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Exponencial sin jitter</tspan></text><text x="244" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Exponencial con jitter total</tspan></text><rect x="254" y="55" width="621.7" height="26" rx="3" fill="#c0432f"/><text x="882.7" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">2 000</tspan></text><rect x="254" y="93" width="621.7" height="26" rx="3" fill="#c0432f"/><text x="882.7" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">2 000</tspan></text><rect x="254" y="131" width="115.636" height="26" rx="3" fill="#c0432f"/><text x="376.636" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="376.636" dy="0">372</tspan></text><line x1="378.34" y1="49" x2="378.34" y2="163" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="383.34" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="383.34" dy="0">capacidad 400</tspan></text><text x="564.85" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">Solicitudes por segundo</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Sin aleatoriedad, los clientes que fallaron a la vez vuelven a la vez: el retroceso exponencial solo los espacia en</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">oleadas. El jitter reparte la carga. El modelo supone una capacidad fija y clientes idénticos; no representa colas del</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">servidor ni presión posterior.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
