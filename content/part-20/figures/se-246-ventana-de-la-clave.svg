<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reintentos que llegan después de que la clave caducó y crean un duplicado (6 000 reintentos)</title><desc id="d">Barras: con una distribución supuesta de retardos de reintento de 1 minuto a 7 días, una clave que caduca a los 10 minutos deja pasar 66,9 por ciento de los reintentos como duplicados, a 1 hora 50,9, a 24 horas 33,3 y a 48 horas 16,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="307" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">TTL de la clave: 10 min</tspan></text><rect x="310" y="16" width="468.3" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="786.3" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="786.3" dy="0">66,9 %</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">TTL 1 h</tspan></text><rect x="310" y="60" width="356.3" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="674.3" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="674.3" dy="0">50,9 %</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">TTL 24 h</tspan></text><rect x="310" y="104" width="233.1" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="551.1" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="551.1" dy="0">33,3 %</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">TTL 48 h</tspan></text><rect x="310" y="148" width="118.3" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="436.3" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="436.3" dy="0">16,9 %</tspan></text><rect x="10" y="196" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">La ventana de la clave debe cubrir el reintento más tardío que el cliente pueda hacer (colas offline, aplicaciones móviles). La</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">misma clave con otra carga debe devolver 422 en vez de la respuesta guardada: la huella de la carga lo distingue (765f4a431bef</tspan></text><text x="500" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">frente a aaa1c9e4780f). Con 8 hilos y la misma clave, 1 inserta y 7 se detectan como repetidos.</tspan></text><text x="500" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
