 fill="#142231"><tspan x="732" dy="0">8 674 s</tspan></text><rect x="820" y="256" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">9 080 s</tspan></text><rect x="10" y="310" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Pasar de 0,90 a 0,95 duplica la espera media y el p99 pasa de 39 s a 78 s; por encima de 1 la cola crece sin tope mientras haya</tspan></text><text x="500" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">llegadas. La simulación supone llegadas aleatorias y servicios exponenciales, que casi ningún sistema real cumple exactamente.</tspan></text><text x="500" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
