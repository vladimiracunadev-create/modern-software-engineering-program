<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 481" width="1010" height="481" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nombres de archivo hostiles y bombas de descompresión</title><desc id="d">Tabla: de 12 nombres hostiles, el tratamiento ingenuo deja escapar 3 del directorio en Windows y 2 en Ubuntu y el estricto 0; 10 MB de ceros se comprimen a 9,7 kB (razón 1 027:1) y una bomba de 200 MB comprimida a 194 kB se detiene al llegar a 48 MB si se descomprime por trozos con tope.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="481" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Entrada</tspan></text><rect x="340" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Ingenuo / resultado</tspan></text><rect x="670" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Con límites</tspan></text><rect x="10" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">12 nombres de archivo hostiles</tspan></text><rect x="340" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">escapan 3 en Windows y 2 en Ubuntu</tspan></text><rect x="670" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">escapan 0; 6 rechazados</tspan></text><rect x="10" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">10 MB de ceros comprimidos</tspan></text><rect x="340" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">9,7 kB (1 027:1)</tspan></text><rect x="670" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">tope de salida a 50 MB</tspan></text><rect x="10" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">10 MB de texto repetido</tspan></text><rect x="340" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">14,6 kB (685:1)</tspan></text><rect x="670" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">tope de salida a 50 MB</tspan></text><rect x="10" y="242" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">10 MB aleatorios</tspan></text><rect x="340" y="242" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">10 003 kB (1:1)</tspan></text><rect x="670" y="242" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">no comprime: el tamaño es el de entrada</tspan></text><rect x="10" y="304" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="335.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">200 MB de ceros comprimidos</tspan></text><rect x="340" y="304" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">194 kB</tspan></text><rect x="670" y="304" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="327.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">lectura por trozos se detiene a 48 MB</tspan></text><text x="832" y="343.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">descomprimidos</tspan></text><rect x="10" y="370" width="990" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="505" y="394.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">La diferencia entre sistemas sale de que Windows trata la barra invertida como separador. El tamaño comprimido no dice nada del</tspan></text><text x="505" y="411.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">descomprimido: el límite debe aplicarse a la salida. Los nombres y las razones son sintéticos; no se probó ningún formato real de</tspan></text><text x="505" y="428.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">archivo comprimido ni un antivirus.</tspan></text><text x="505" y="467.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
