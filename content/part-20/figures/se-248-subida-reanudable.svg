<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 291" width="1000" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Datos enviados para subir 100 MiB con una caída cada 15 MiB en media</title><desc id="d">Barras: reiniciar la subida tras cada caída envía 12 421 MiB para entregar 100 MiB; reanudar por trozos de 1 MiB envía 101,5 MiB, de 5 MiB 117,5 MiB y de 25 MiB 301,5 MiB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="291" fill="#ffffff"/><text x="320" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Reiniciar desde cero (866 caídas)</tspan></text><rect x="330" y="16" width="496.848" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="834.848" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="834.848" dy="0">12 421 MiB</tspan></text><text x="320" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Reanudar, trozos de 1 MiB</tspan></text><rect x="330" y="60" width="4.06" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="342.06" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="342.06" dy="0">101,5 MiB</tspan></text><text x="320" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Reanudar, trozos de 5 MiB</tspan></text><rect x="330" y="104" width="4.7" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="342.7" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="342.7" dy="0">117,5 MiB</tspan></text><text x="320" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Reanudar, trozos de 25 MiB</tspan></text><rect x="330" y="148" width="12.06" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="350.06" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="350.06" dy="0">301,5 MiB</tspan></text><rect x="10" y="196" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El trozo fija cuánto se repite tras una caída: uno pequeño repite poco pero exige más confirmaciones; uno grande repite más. Un</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">archivo truncado sin Content-Length ni huella no se detecta; con SHA-256 sí.</tspan></text><text x="500" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Simulación con semilla 248; la tasa de caída es un supuesto del autor, no una medición de redes reales.</tspan></text></svg>
