"><tspan x="137" dy="0">2 500</tspan></text><rect x="270" y="296" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="316.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">60 s</tspan></text><rect x="470" y="296" width="214" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="316.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">76,3 %</tspan></text><rect x="690" y="296" width="274" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="316.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">3,34 %</tspan></text><rect x="10" y="336" width="254" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="356.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">2 500</tspan></text><rect x="270" y="336" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="356.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">600 s</tspan></text><rect x="470" y="336" width="214" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="356.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">87,9 %</tspan></text><rect x="690" y="336" width="274" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="356.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">33,11 %</tspan></text><rect x="10" y="380" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Subir el TTL compra aciertos con obsolescencia: de 60 a 600 s con 2 500 entradas el acierto sube 11,6 puntos y las lecturas</tspan></text><text x="490" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">obsoletas se multiplican por 10. Con capacidad pequeña el TTL no importa: manda la capacidad. La popularidad Zipf y el cambio</tspan></text><text x="490" y="438.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">cada 300 a 900 s son supuestos del autor.</tspan></text><text x="490" y="477.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
