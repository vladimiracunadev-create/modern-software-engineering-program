<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 387" width="1030" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro limitadores ante 200 solicitudes junto al cambio de ventana y ante tráfico uniforme</title><desc id="d">Tabla: ante 200 solicitudes agrupadas en dos segundos alrededor del cambio de ventana, la ventana fija de 100 por 10 segundos acepta 200, la deslizante 100, la cubeta de capacidad 20 acepta 39 y la de capacidad 100 acepta 119; con tráfico legítimo uniforme aceptan 954, 920, 966 y 1 000 de 1 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="387" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Limitador</tspan></text><rect x="390" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Ráfaga de 200 en el borde de la</tspan></text><text x="552" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">ventana</tspan></text><rect x="720" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">Tráfico uniforme de 1 000 en 100 s</tspan></text><rect x="10" y="56" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Ventana fija 100 / 10 s</tspan></text><rect x="390" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">200 aceptadas</tspan></text><rect x="720" y="56" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">954 de 1 000</tspan></text><rect x="10" y="110" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Ventana deslizante 100 / 10 s</tspan></text><rect x="390" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">100</tspan></text><rect x="720" y="110" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">920</tspan></text><rect x="10" y="164" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Cubeta de fichas, 10/s, capacidad 20</tspan></text><rect x="390" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">39</tspan></text><rect x="720" y="164" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">966</tspan></text><rect x="10" y="218" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Cubeta de fichas, 10/s, capacidad 100</tspan></text><rect x="390" y="218" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">119</tspan></text><rect x="720" y="218" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">1 000</tspan></text><rect x="10" y="276" width="1010" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="515" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">La ventana fija permite el doble del límite nominal en dos segundos. La deslizante es exacta pero rechaza más tráfico legítimo agrupado</tspan></text><text x="515" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">(920 frente a 966). La cubeta permite una ráfaga acotada por su capacidad y mantiene la tasa media. Ningún limitador distingue a un</tspan></text><text x="515" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">atacante de un cliente legítimo sin una identidad fiable.</tspan></text><text x="515" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
