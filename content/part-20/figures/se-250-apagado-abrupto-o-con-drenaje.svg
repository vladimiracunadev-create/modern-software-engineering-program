<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 219" width="1000" height="219" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">30 solicitudes en curso de 200 ms cuando se detiene un servidor local real</title><desc id="d">Barras: al detenerlo de forma abrupta, 30 de 30 solicitudes en curso fallan; al dejar de aceptar conexiones nuevas y esperar a las que están en curso, 0 fallan y 30 se completan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="219" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Apagado abrupto (la conexión se corta)</tspan></text><rect x="370" y="16" width="330" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="708" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="708" dy="0">30 fallidas, 0 completadas</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Apagado con drenaje</tspan></text><rect x="370" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="382" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="382" dy="0">0 fallidas, 30 completadas</tspan></text><rect x="10" y="108" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El drenaje exige tres pasos en orden: salir del reparto de tráfico, dejar de aceptar y esperar con un plazo máximo. Si el</tspan></text><text x="500" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">orchestrator mata el proceso antes de que termine el plazo, el drenaje no basta; el tiempo de gracia debe superar la solicitud más</tspan></text><text x="500" y="166.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">larga esperable.</tspan></text><text x="500" y="205.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Servidor HTTP de la biblioteca estándar; el apagado abrupto se simula cortando las conexiones, no matando el proceso.</tspan></text></svg>
