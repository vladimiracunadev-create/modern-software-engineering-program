<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 247" width="1040" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Solicitudes más lentas que 250 ms en una instancia nueva con la caché fría</title><desc id="d">Barras: una instancia que recibe tráfico desde el arranque sirve 35,6 por ciento de solicitudes por encima de 250 ms; con readiness tras 30 segundos de calentamiento 15,1; con readiness por umbral de 60 por ciento de aciertos 12,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="247" fill="#ffffff"/><text x="440" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Tráfico desde el arranque (1 800 servidas)</tspan></text><rect x="450" y="16" width="391.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="849.6" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="849.6" dy="0">35,6 %</tspan></text><text x="440" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Readiness tras 30 s de calentamiento (1 200)</tspan></text><rect x="450" y="60" width="166.1" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="624.1" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="624.1" dy="0">15,1 %</tspan></text><text x="440" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Readiness por umbral de aciertos del 60 % (1 080)</tspan></text><rect x="450" y="104" width="139.7" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="597.7" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="597.7" dy="0">12,7 %</tspan></text><rect x="10" y="152" width="1020" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">Esperar no elimina las solicitudes lentas: las traslada a otras instancias y retrasa la capacidad. El umbral por aciertos se adapta a la</tspan></text><text x="520" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">velocidad real del calentamiento; el tiempo fijo no. La curva de calentamiento lineal en 60 s es un supuesto del autor.</tspan></text><text x="520" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
