<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 295" width="1030" height="295" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La base de datos cae 120 s de 600: qué hace cada diseño de sondeos</title><desc id="d">Tabla: si el sondeo de vida consulta la base de datos, una caída de 120 segundos provoca 4 reinicios y 80 segundos sin proceso; si el sondeo de vida es local y solo el de disponibilidad consulta la base, hay 0 reinicios.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="295" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Diseño de sondeos</tspan></text><rect x="390" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Reinicios</tspan></text><rect x="520" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">Segundos sin proceso</tspan></text><rect x="720" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">Consecuencia</tspan></text><rect x="10" y="56" width="374" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Liveness y readiness consultan la base de datos</tspan></text><rect x="390" y="56" width="124" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">4</tspan></text><rect x="520" y="56" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">80 s</tspan></text><rect x="720" y="56" width="294" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="83.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">el proceso se reinicia aunque no tenga</tspan></text><text x="867" y="99.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">fallo propio</tspan></text><rect x="10" y="126" width="374" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Liveness local; readiness consulta la base de datos</tspan></text><rect x="390" y="126" width="124" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">0</tspan></text><rect x="520" y="126" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">0 s</tspan></text><rect x="720" y="126" width="294" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="153.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">la instancia sale del reparto pero no se</tspan></text><text x="867" y="169.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">reinicia</tspan></text><rect x="10" y="200" width="1010" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="515" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Un reinicio no arregla una dependencia externa: la pierde la caché y añade 20 s de arranque a la caída. Los sondeos cada 5 s, el umbral</tspan></text><text x="515" y="241.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">de 3 fallos y el arranque de 20 s son parámetros del autor, no valores por defecto de una plataforma.</tspan></text><text x="515" y="281.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
