<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 247" width="1020" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">12 cargas de inyección contra una búsqueda con SQL concatenado y con parámetros</title><desc id="d">Barras: contra la búsqueda con SQL construido por concatenación, 3 de 12 cargas devuelven filas de otros usuarios y 2 provocan errores del motor; con consulta parametrizada ninguna hace ninguna de las dos cosas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="247" fill="#ffffff"/><text x="430" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">SQL concatenado · cargas que filtran filas ajenas</tspan></text><rect x="440" y="16" width="180" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="628" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="628" dy="0">3 de 12</tspan></text><text x="430" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">SQL concatenado · cargas que provocan error</tspan></text><rect x="440" y="60" width="120" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="568" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="568" dy="0">2 de 12</tspan></text><text x="430" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">SQL parametrizado · filtran o provocan error</tspan></text><rect x="440" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="452" dy="0">0 de 12</tspan></text><rect x="10" y="152" width="1000" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">Los parámetros separan datos de instrucciones: la carga se trata siempre como texto. Esto cubre la inyección en valores; no cubre</tspan></text><text x="510" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">nombres de columna ni de orden, que no se pueden parametrizar y se validan contra una lista cerrada.</tspan></text><text x="510" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
