<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 365" width="1050" height="365" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">SLO de 99,5 % a 30 días: presupuesto consumido y alertas por tasa de consumo</title><desc id="d">Tabla: una caída total de 10 minutos consume 14,6 por ciento del presupuesto de error y la alerta rápida (quema mayor a 14,4) salta a los 4 minutos; 5 por ciento de errores durante 6 horas consume 18,3 y solo la alerta lenta salta, a los 215 minutos; una degradación del 0,8 por ciento durante 10 días consume 63,3 y ninguna de las dos alertas salta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="365" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Incidente simulado</tspan></text><rect x="340" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Presupuesto consumido</tspan></text><rect x="540" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Alerta rápida (14,4× en 1 h y</tspan></text><text x="662" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">5 min)</tspan></text><rect x="790" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="912" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="912" dy="0">Alerta lenta (6× en 6 h y 30</tspan></text><text x="912" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="912" dy="0">min)</tspan></text><rect x="10" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Caída total de 10 min</tspan></text><rect x="340" y="56" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">14,6 %</tspan></text><rect x="540" y="56" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">a los 4 min</tspan></text><rect x="790" y="56" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">nunca</tspan></text><rect x="10" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">5 % de errores durante 6 h</tspan></text><rect x="340" y="126" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">18,3 %</tspan></text><rect x="540" y="126" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">nunca</tspan></text><rect x="790" y="126" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">a los 215 min</tspan></text><rect x="10" y="196" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="223.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Degradación lenta del 0,8 % sin corregir 10</tspan></text><text x="172" y="239.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">días</tspan></text><rect x="340" y="196" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">63,3 %</tspan></text><rect x="540" y="196" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">nunca</tspan></text><rect x="790" y="196" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">nunca</tspan></text><rect x="10" y="270" width="1030" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">La degradación lenta quema 1,7 veces el presupuesto por unidad de tiempo: por debajo de ambos umbrales y, sin embargo, consume casi dos</tspan></text><text x="525" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">tercios del mes. Hace falta una tercera ventana (por ejemplo 3 días con quema mayor a 1). Escenarios y umbrales sintéticos.</tspan></text><text x="525" y="351.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
