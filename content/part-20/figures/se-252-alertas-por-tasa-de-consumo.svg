<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">SLO de 99,5 % a 30 días: presupuesto de error consumido por incidente</title><desc id="d">Barras horizontales con el presupuesto de error consumido por tres incidentes: una caída total de 10 minutos consume 14,6 por ciento y la alerta rápida salta a los 4 minutos; 5 por ciento de errores durante 6 horas consume 18,3 y solo la alerta lenta salta, a los 215 minutos; una degradación del 0,8 por ciento durante 10 días consume 63,3 y ninguna alerta salta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">SLO de 99,5 % a 30 días: presupuesto de error consumido por incidente</tspan></text><line x1="354" y1="49" x2="354" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="181" x2="354" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="458.34" y1="49" x2="458.34" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="458.34" y1="181" x2="458.34" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="458.34" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.34" dy="0">20</tspan></text><line x1="562.68" y1="49" x2="562.68" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="562.68" y1="181" x2="562.68" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="562.68" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.68" dy="0">40</tspan></text><line x1="667.02" y1="49" x2="667.02" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="667.02" y1="181" x2="667.02" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="667.02" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.02" dy="0">60</tspan></text><line x1="771.36" y1="49" x2="771.36" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="771.36" y1="181" x2="771.36" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="771.36" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.36" dy="0">80</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="181" x2="875.7" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="354" y1="181" x2="875.7" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Caída total de 10 min (alerta rápida a los 4</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">min)</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">5 % de errores durante 6 h (alerta lenta a</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">los 215 min)</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Degradación de 0,8 % durante 10 días (ninguna</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">alerta)</tspan></text><rect x="354" y="55" width="76.1682" height="32" rx="3" fill="#c0432f"/><text x="437.168" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="437.168" dy="0">14,6</tspan></text><rect x="354" y="99" width="95.4711" height="32" rx="3" fill="#c0432f"/><text x="456.471" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="456.471" dy="0">18,3</tspan></text><rect x="354" y="143" width="330.236" height="32" rx="3" fill="#c0432f"/><text x="691.236" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="691.236" dy="0">63,3</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="181" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="880.7" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="880.7" dy="0">100 %</tspan></text><text x="614.85" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Presupuesto de error consumido (%)</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La degradación lenta quema 1,7 veces el presupuesto por unidad de tiempo: por debajo de ambos umbrales y, sin embargo,</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consume casi dos tercios del mes. Hace falta una tercera ventana (por ejemplo 3 días con quema mayor a 1). Escenarios y</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">umbrales sintéticos.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
