<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">1 000 entregas con caídas, respuestas perdidas y trabajos entregados dos veces</title><desc id="d">Barras horizontales con los resultados tras 1 000 entregas con 8 por ciento de caídas antes de encolar, 8 por ciento de respuestas perdidas y 10 por ciento de trabajos entregados dos veces: el diseño ingenuo termina con 1 184 filas, 184 entregas duplicadas, 109 sin trabajo encolado, 110 notas duplicadas y 109 entregas sin nota; el contractual con clave, outbox y efecto idempotente termina con 1 000 filas y 0 en todo lo demás.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">1 000 entregas con caídas, respuestas perdidas y trabajos entregados dos veces</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Diseño ingenuo</tspan></text><rect x="169.56" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Contractual (clave + outbox + efecto idempotente)</tspan></text><line x1="274" y1="77" x2="274" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="397" x2="274" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="77" x2="394.34" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="397" x2="394.34" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">250</tspan></text><line x1="514.68" y1="77" x2="514.68" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="397" x2="514.68" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">500</tspan></text><line x1="635.02" y1="77" x2="635.02" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="397" x2="635.02" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">750</tspan></text><line x1="755.36" y1="77" x2="755.36" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="397" x2="755.36" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">1 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="397" x2="875.7" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 250</tspan></text><line x1="274" y1="397" x2="875.7" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Filas de entrega (esperadas: 1</tspan></text><text x="264" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">000)</tspan></text><text x="264" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Entregas duplicadas</tspan></text><text x="264" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Entregas sin trabajo encolado</tspan></text><text x="264" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Notas duplicadas</tspan></text><text x="264" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Entregas sin nota</tspan></text><rect x="274" y="83" width="569.93" height="24.5" rx="3" fill="#c0432f"/><text x="850.93" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="850.93" dy="0">1 184</tspan></text><rect x="274" y="110.5" width="481.36" height="24.5" rx="3" fill="#087f8c"/><text x="762.36" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="762.36" dy="0">1 000</tspan></text><rect x="274" y="147" width="88.5702" height="24.5" rx="3" fill="#c0432f"/><text x="369.57" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="369.57" dy="0">184</tspan></text><rect x="274" y="174.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="283" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="211" width="52.4682" height="24.5" rx="3" fill="#c0432f"/><text x="333.468" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333.468" dy="0">109</tspan></text><rect x="274" y="238.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="283" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="275" width="52.9496" height="24.5" rx="3" fill="#c0432f"/><text x="333.95" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333.95" dy="0">110</tspan></text><rect x="274" y="302.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="283" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="339" width="52.4682" height="24.5" rx="3" fill="#c0432f"/><text x="333.468" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333.468" dy="0">109</tspan></text><rect x="274" y="366.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="283" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><text x="574.85" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Entregas o notas</tspan></text><rect x="10" y="455" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El diseño contractual cumple los cuatro invariantes bajo este modelo de fallos, no ante cualquier fallo: no se simularon</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">corrupción de disco, relojes desfasados ni dos réplicas escribiendo a la vez. Las probabilidades de fallo son supuestos del</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">autor.</tspan></text><text x="470" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
