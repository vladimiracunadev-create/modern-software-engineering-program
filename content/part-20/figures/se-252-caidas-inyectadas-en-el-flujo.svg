<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 405" width="1020" height="405" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">1 000 entregas con caídas, respuestas perdidas y trabajos entregados dos veces</title><desc id="d">Tabla: con 8 por ciento de caídas antes de encolar, 8 por ciento de respuestas perdidas y 10 por ciento de trabajos entregados dos veces, el diseño ingenuo termina con 184 entregas duplicadas, 109 sin trabajo, 110 notas duplicadas y 109 entregas sin nota; el contractual con clave, outbox y efecto idempotente termina con 0 en todo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="405" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Resultado</tspan></text><rect x="390" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">Diseño ingenuo</tspan></text><rect x="610" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Contractual (clave + outbox + efecto</tspan></text><text x="807" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">idempotente)</tspan></text><rect x="10" y="56" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Filas de entrega</tspan></text><rect x="390" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">1 184</tspan></text><rect x="610" y="56" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">1 000</tspan></text><rect x="10" y="106" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Entregas duplicadas</tspan></text><rect x="390" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">184</tspan></text><rect x="610" y="106" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0</tspan></text><rect x="10" y="156" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Entregas sin trabajo encolado</tspan></text><rect x="390" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">109</tspan></text><rect x="610" y="156" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0</tspan></text><rect x="10" y="206" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Notas duplicadas</tspan></text><rect x="390" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">110</tspan></text><rect x="610" y="206" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0</tspan></text><rect x="10" y="256" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Entregas sin nota</tspan></text><rect x="390" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">109</tspan></text><rect x="610" y="256" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0</tspan></text><rect x="10" y="310" width="1000" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="510" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">El diseño contractual cumple los cuatro invariantes bajo este modelo de fallos, no ante cualquier fallo: no se simularon corrupción de</tspan></text><text x="510" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">disco, relojes desfasados ni dos réplicas escribiendo a la vez. Las probabilidades de fallo son supuestos del autor.</tspan></text><text x="510" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
