<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 291" width="1000" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutaciones de la implementación que detecta cada capa de la comprobación de conformidad (12 rutas)</title><desc id="d">Barras: de 189 mutaciones reales de la implementación de 12 rutas, comprobar solo que existan las rutas detecta 64, añadir códigos de estado 99, añadir campos obligatorios 156 y añadir campos extra (esquema cerrado) las 189.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="291" fill="#ffffff"/><text x="320" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Solo existencia de rutas</tspan></text><rect x="330" y="16" width="166.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="504.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="504.4" dy="0">64 de 189</tspan></text><text x="320" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">+ códigos de estado</tspan></text><rect x="330" y="60" width="257.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="595.4" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="595.4" dy="0">99</tspan></text><text x="320" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">+ campos obligatorios</tspan></text><rect x="330" y="104" width="405.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="743.6" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="743.6" dy="0">156</tspan></text><text x="320" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">+ campos extra (esquema cerrado)</tspan></text><rect x="330" y="148" width="491.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="829.4" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="829.4" dy="0">189</tspan></text><rect x="10" y="196" width="980" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">Cada capa atrapa cambios que la anterior no ve; el mutante equivalente (11 de 200) no cambia nada y no cuenta. Un contrato conforme</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">con la implementación no prueba que el contrato describa lo que los consumidores necesitan.</tspan></text><text x="500" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
