<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Controles que se ven sin desplazar según el ancho de ventana: diseño fijo frente a diseño adaptable</title><desc id="d">Líneas con los controles, de doce, que se ven sin desplazar según el ancho de ventana: un diseño fijo de una fila de 1200 píxeles deja visibles 3, 3, 7, 10 y 12 con anchos de 320, 390, 768, 1024 y 1280 píxeles; un diseño adaptable muestra los doce en todos, en 6, 4, 2, 2 y 1 filas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Controles que se ven sin desplazar según el ancho de ventana: diseño fijo frente a diseño adaptable</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Diseño fijo de una fila (100 px por control)</tspan></text><rect x="395.76" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="415.76" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="415.76" dy="0">Diseño adaptable (104 px por columna)</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="387" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="391.5" font-size="13" text-anchor="end" font-weight="400" f