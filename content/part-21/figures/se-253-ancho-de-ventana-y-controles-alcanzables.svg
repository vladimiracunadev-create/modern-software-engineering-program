eight="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="463.776" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="463.776" dy="0">12 en 2 filas</tspan></text><rect x="672.388" y="141.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="677.888" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="677.888" dy="0">12 en 2 filas</tspan></text><rect x="886.5" y="141.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">12 en 1 fila</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El modelo cuenta solo geometría: no mide legibilidad, tamaño táctil ni orden de lectura. Reflujo no significa buen diseño,</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pero un diseño de escritorio fijo deja inalcanzables nueve de doce controles en una pantalla de 320 px; con el resto de</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">controles exige desplazamiento horizontal.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
