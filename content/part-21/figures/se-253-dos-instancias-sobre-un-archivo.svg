<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 263" width="1040" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos instancias de escritorio que leen, suman y escriben el mismo archivo</title><desc id="d">Barras: dos instancias que hacen cada una 100 incrementos sobre un archivo compartido terminan con 127,65 de 200 en media de 1000 semillas, entre 110 y 151, y ninguna da 200; con bloqueo o con una sola instancia las 1000 dan exactamente 200.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="263" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Dos instancias, sin coordinación</tspan></text><rect x="370" y="16" width="255.3" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="633.3" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="633.3" dy="0">127,65 de 200 (110 a 151)</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Dos instancias con archivo de bloqueo</tspan></text><rect x="370" y="60" width="400" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="778" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="778" dy="0">200 de 200</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Una sola instancia permitida</tspan></text><rect x="370" y="104" width="400" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="778" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="778" dy="0">200 de 200</tspan></text><rect x="10" y="152" width="1020" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="520" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Un modelo de escritorio permite abrir la aplicación dos veces, y entonces el archivo local deja de tener un solo escritor. Sin</tspan></text><text x="520" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">coordinación se pierden 72 de cada 200 actualizaciones en media; el bloqueo o la política de instancia única lo evitan a cambio de más</tspan></text><text x="520" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">reglas.</tspan></text><text x="520" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
