<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 307" width="940" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste de guardar el estado con archivo temporal, sincronización y reemplazo</title><desc id="d">Barras: escribir un estado en JSON, vaciar el búfer, sincronizar el disco y reemplazar el archivo tarda 3,96 milisegundos con 1 KiB, 6,12 con 64 KiB, 34,15 con 1 MiB y 401,99 con 16 MiB en Windows; en Ubuntu fueron 3,78, 5,73, 17,91 y 228,74.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="307" fill="#ffffff"/><text x="260" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Estado de 1 KiB</tspan></text><rect x="270" y="16" width="5.544" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="283.544" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283.544" dy="0">3,96 ms</tspan></text><text x="260" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Estado de 64 KiB</tspan></text><rect x="270" y="60" width="8.568" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="286.568" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="286.568" dy="0">6,12 ms</tspan></text><text x="260" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Estado de 1 MiB</tspan></text><rect x="270" y="104" width="47.81" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="325.81" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="325.81" dy="0">34,15 ms</tspan></text><text x="260" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Estado de 16 MiB</tspan></text><rect x="270" y="148" width="562.786" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.786" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="840.786" dy="0">401,99 ms</tspan></text><rect x="10" y="196" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El tiempo crece con el tamaño del estado, y el plazo que concede el sistema para guardar al pasar a segundo plano no es un</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">parámetro que el equipo pueda elegir. Un estado grande se guarda por partes, incrementalmente, o se reduce a lo que no</tspan></text><text x="470" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">puede reconstruirse.</tspan></text><text x="470" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tiempos medidos en un equipo (Windows 11, CPython 3.12.9); en Ubuntu (WSL2) la forma se repite con otras cifras.</tspan></text></svg>
