<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 335" width="1080" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ediciones perdidas por sesión según cuándo se guarda el borrador</title><desc id="d">Barras: en 10 000 sesiones sintéticas de seis episodios, guardar solo al cerrar pierde 109,27 ediciones por sesión, guardar cada diez 10,12, guardar al pasar a segundo plano 8,03, combinar ambas 1,69 y guardar en cada edición ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="335" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Guardar solo al cerrar</tspan></text><rect x="410" y="16" width="546.35" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="964.35" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="964.35" dy="0">109,27 (72,8 %)</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Guardar cada 10 ediciones</tspan></text><rect x="410" y="60" width="50.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="468.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="468.6" dy="0">10,12 (6,8 %)</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Guardar al pasar a segundo plano</tspan></text><rect x="410" y="104" width="40.15" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="458.15" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="458.15" dy="0">8,03 (5,4 %)</tspan></text><text x="400" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Cada 10 ediciones y al pasar a segundo plano</tspan></text><rect x="410" y="148" width="8.45" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="426.45" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="426.45" dy="0">1,69 (1,1 %)</tspan></text><text x="400" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Guardar en cada edición</tspan></text><rect x="410" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422" dy="0">0</tspan></text><rect x="10" y="240" width="1060" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">Con 35 % de episodios que terminan sin aviso, 10 % de ganchos que no alcanzan a escribir y 3 % de cierres inesperados, ninguna política barata</tspan></text><text x="540" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">llega a cero. Las dos protecciones se complementan: una cubre el aviso, la otra el cierre sin aviso.</tspan></text><text x="540" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
