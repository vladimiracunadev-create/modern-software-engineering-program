<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 247" width="1040" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste de cruzar una frontera serializando: mensajes sueltos o en lote</title><desc id="d">Barras: un proxy de la frontera entre capas que solo mide serialización con JSON tarda 0,12 milisegundos con llamadas directas, 23,8 con 2000 mensajes enviados de uno en uno y 4,3 en un lote, una razón entre 3 y 5,5 en cuatro ejecuciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="247" fill="#ffffff"/><text x="370" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">2000 llamadas directas</tspan></text><rect x="380" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="392" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">0,12 ms</tspan></text><text x="370" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">2000 mensajes, uno a uno por JSON</tspan></text><rect x="380" y="60" width="524.04" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="912.04" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="912.04" dy="0">23,8 ms</tspan></text><text x="370" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">2000 mensajes en un solo lote por JSON</tspan></text><rect x="380" y="104" width="94.82" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="482.82" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="482.82" dy="0">4,3 ms</tspan></text><rect x="10" y="152" width="1020" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">Una frontera entre el código compartido y la capa nativa cuesta por cruce, no solo por byte: agrupar los mensajes redujo el tiempo entre</tspan></text><text x="520" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">3 y 5,5 veces según la ejecución. Es un proxy, no un puente real: no se midió ningún marco concreto.</tspan></text><text x="520" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Tiempos medidos en un equipo (Windows 11, CPython 3.12.9); en Ubuntu (WSL2) la forma se repite con otras cifras.</tspan></text></svg>
