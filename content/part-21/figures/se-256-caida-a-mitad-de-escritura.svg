<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Terminar el proceso a mitad de una escritura: tres formas de guardar</title><desc id="d">Diagrama de flujo de tres formas de guardar un documento local y de lo que queda tras terminar el proceso a mitad de la escritura: el archivo sobrescrito queda corrupto, el temporal con reemplazo conserva el anterior y SQLite conserva la última transacción confirmada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Terminar el proceso a mitad de una escritura: tres formas de guardar</tspan></text><text x="164" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="164" dy="0">Forma de guardar</tspan></text><text x="478" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="478" dy="0">Qué ocurre</tspan></text><text x="772" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="772" dy="0">Resultado observado</tspan></text><rect x="14" y="71" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="102.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">Abrir el archivo y escribir encima</tspan></text><polyline points="318,98.64 344,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="348" y="71" width="260" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="478" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="478" dy="0">El proceso se corta a la mitad</tspan></text><text x="478" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="478" dy="0">del contenido</tspan></text><polyline points="612,98.64 638,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="71" width="260" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="772" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="772" dy="0">Documento corrupto (no es JSON</tspan></text><text x="772" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="772" dy="0">válido)</tspan></text><rect x="14" y="138.28" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="161.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">Escribir un temporal y reemplazar al</tspan></text><text x="164" y="177.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">final</tspan></text><polyline points="318,165.92 344,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="348" y="138.28" width="260" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="478" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="478" dy="0">El proceso se corta con el</tspan></text><text x="478" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="478" dy="0">temporal a medias</tspan></text><polyline points="612,165.92 638,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="138.28" width="260" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="772" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="772" dy="0">Documento anterior intacto y</tspan></text><text x="772" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="772" dy="0">válido</tspan></text><rect x="14" y="205.56" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="228.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">SQLite con 1000 inserciones sin</tspan></text><text x="164" y="245.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">confirmar</tspan></text><polyline points="318,233.2 344,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="348" y="205.56" width="260" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="478" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="478" dy="0">El proceso termina dentro de la</tspan></text><text x="478" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="478" dy="0">transacción</tspan></text><polyline points="612,233.2 638,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="205.56" width="260" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="772" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="772" dy="0">1 fila (la anterior), integridad</tspan></text><text x="772" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="772" dy="0">correcta</tspan></text><rect x="10" y="278.84" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="303.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El experimento termina el proceso, no corta la corriente: no prueba lo que ocurre si el sistema operativo pierde la caché</tspan></text><text x="470" y="320.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de escritura. Esa garantía depende de la sincronización con el disco y del soporte, algo que aquí no se midió.</tspan></text><text x="470" y="368.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Procesos hijo terminados con os._exit; mismo resultado en Windows y Ubuntu (WSL2).</tspan></text></svg>
