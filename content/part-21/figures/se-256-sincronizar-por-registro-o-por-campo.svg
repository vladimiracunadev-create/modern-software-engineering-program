<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 247" width="1160" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intenciones de edición perdidas en 400 ediciones de dos dispositivos sobre 200 registros</title><desc id="d">Barras: con 200 registros de tres campos y 400 ediciones repartidas entre dos dispositivos, quedarse con el último registro pierde 100,68 intenciones en media con relojes alineados y 106,57 con un reloj adelantado, y fusionar por campo pierde 47,85.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1160" height="247" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Último registro gana, relojes sincronizados</tspan></text><rect x="480" y="16" width="604.08" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1092.08" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1092.08" dy="0">100,68</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Último registro gana, un reloj 5 minutos adelantado</tspan></text><rect x="480" y="60" width="639.42" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1127.42" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1127.42" dy="0">106,57</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Fusión por campo, sin importar el reloj</tspan></text><rect x="480" y="104" width="287.1" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="775.1" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="775.1" dy="0">47,85</tspan></text><rect x="10" y="152" width="1140" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="580" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="580" dy="0">Fusionar por campo reduce a menos de la mitad las intenciones perdidas, pero no las elimina: dos ediciones del mismo campo siguen compitiendo. Cada</tspan></text><text x="580" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="580" dy="0">política es una decisión de producto sobre qué intención se sacrifica.</tspan></text><text x="580" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="580" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
