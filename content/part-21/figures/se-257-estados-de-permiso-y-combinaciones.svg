<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 419" width="1030" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estados de un permiso y combinaciones de cuatro capacidades</title><desc id="d">Tabla: seis estados por permiso y cuatro permisos dan 1296 combinaciones; un código que asume que el permiso está concedido falla en 1280, y 15 combinaciones con acceso solo aproximado devuelven un resultado engañoso sin lanzar ninguna excepción.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="419" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Magnitud</tspan></text><rect x="320" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">Valor</tspan></text><rect x="510" y="12" width="504" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="762" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">Qué significa</tspan></text><rect x="10" y="56" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Estados por permiso</tspan></text><rect x="320" y="56" width="184" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="412" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="412" dy="0">6</tspan></text><rect x="510" y="56" width="504" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="81.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">concedido, denegado, denegado sin volver a preguntar, revocado en</tspan></text><text x="762" y="97.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">ajustes, restringido por política, solo aproximado</tspan></text><rect x="10" y="122" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Combinaciones de 4 permisos</tspan></text><rect x="320" y="122" width="184" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="412" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="412" dy="0">1296</tspan></text><rect x="510" y="122" width="504" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">6 elevado a 4: probarlas todas a mano no escala</tspan></text><rect x="10" y="188" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="213.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Combinaciones con código que asume</tspan></text><text x="162" y="229.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">«concedido»</tspan></text><rect x="320" y="188" width="184" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="412" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="412" dy="0">1280 fallan (98,8 %)</tspan></text><rect x="510" y="188" width="504" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">con estados uniformes; los usuarios reales no se reparten así</tspan></text><rect x="10" y="254" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="279.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Combinaciones con «solo aproximado» y sin</tspan></text><text x="162" y="295.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">fallo</tspan></text><rect x="320" y="254" width="184" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="412" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="412" dy="0">15</tspan></text><rect x="510" y="254" width="504" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">resultado engañoso sin ninguna excepción: la ubicación parece precisa</tspan></text><rect x="10" y="324" width="1010" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="515" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">El reparto uniforme de estados es un supuesto del autor, no una medición de personas. La conclusión sólida es de forma: cada capacidad</tspan></text><text x="515" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">necesita un camino para cada estado, y el estado «aproximado» es el que no falla pero engaña.</tspan></text><text x="515" y="405.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
