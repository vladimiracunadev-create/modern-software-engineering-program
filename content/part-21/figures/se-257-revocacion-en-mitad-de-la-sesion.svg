<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 247" width="1060" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Usos de una capacidad después de que el usuario la revoca en mitad de la sesión</title><desc id="d">Barras: en 10 000 sesiones de 50 operaciones con una revocación en un punto al azar, comprobar el permiso solo al iniciar deja 24,53 usos tras la revocación, comprobarlo cada diez operaciones deja 4,51 y comprobarlo en cada uso deja ninguno, con 50 comprobaciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="247" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Comprobar solo al iniciar la sesión</tspan></text><rect x="370" y="16" width="220.77" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="598.77" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="598.77" dy="0">24,53 usos (0 comprobaciones)</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Comprobar cada 10 operaciones</tspan></text><rect x="370" y="60" width="40.59" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="418.59" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="418.59" dy="0">4,51 usos (5 comprobaciones)</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Comprobar en cada uso</tspan></text><rect x="370" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="382" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="382" dy="0">0 usos (50 comprobaciones)</tspan></text><rect x="10" y="152" width="1040" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">La comprobación en el momento del uso es la única que respeta la revocación, y cuesta una consulta por operación. Caché y comprobación</tspan></text><text x="530" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">periódica reducen el coste a cambio de usos indebidos: la tolerancia es una decisión de privacidad, no de rendimiento.</tspan></text><text x="530" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
