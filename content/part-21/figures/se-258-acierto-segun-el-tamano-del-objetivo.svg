<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 421" width="1000" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Toques simulados que caen dentro de un objetivo cuadrado según su lado y el error del dedo</title><desc id="d">Tabla de acierto de 20 000 toques simulados con error gaussiano de 2, 3 y 4 milímetros: un objetivo de 3 mm acierta 29,5, 14,6 y 8,5 por ciento, y uno de 12 mm acierta 99,5, 90,9 y 74,9 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="421" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Lado del objetivo</tspan></text><rect x="270" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">Error 2 mm</tspan></text><rect x="510" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="627" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">Error 3 mm</tspan></text><rect x="750" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">Error 4 mm</tspan></text><rect x="10" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">3 mm</tspan></text><rect x="270" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">29,5 %</tspan></text><rect x="510" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">14,6 %</tspan></text><rect x="750" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">8,5 %</tspan></text><rect x="10" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">5 mm</tspan></text><rect x="270" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">61,8 %</tspan></text><rect x="510" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">34,8 %</tspan></text><rect x="750" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">21,4 %</tspan></text><rect x="10" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">7 mm</tspan></text><rect x="270" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">84,4 %</tspan></text><rect x="510" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">56,7 %</tspan></text><rect x="750" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">37,7 %</tspan></text><rect x="10" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">9 mm</tspan></text><rect x="270" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">95,0 %</tspan></text><rect x="510" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">74,9 %</tspan></text><rect x="750" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">54,0 %</tspan></text><rect x="10" y="256" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">12 mm</tspan></text><rect x="270" y="256" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">99,5 %</tspan></text><rect x="510" y="256" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">90,9 %</tspan></text><rect x="750" y="256" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">74,9 %</tspan></text><rect x="10" y="310" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El error del dedo es un supuesto del autor, no una medición de personas ni de pantallas: sirve para mostrar la forma de la curva.</tspan></text><text x="500" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El acierto crece rápido hasta unos 9 mm y después apenas; la recomendación de cada guía de plataformas debe verificarse con</tspan></text><text x="500" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">usuarios reales.</tspan></text><text x="500" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
