<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 335" width="1080" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Relación de contraste de cinco pares de color calculada con la fórmula de WCAG</title><desc id="d">Barras: el texto oscuro sobre blanco da 16,12 a 1, el aviso coral 5,14, el enlace turquesa 4,75, un gris medio 4,48 y queda por debajo del mínimo de 4,5 para texto normal, y un gris claro 2,32, por debajo incluso del mínimo de 3 para elementos no textuales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="335" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Texto oscuro sobre blanco</tspan></text><rect x="370" y="16" width="580.32" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="958.32" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="958.32" dy="0">16,12:1</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Aviso coral sobre blanco</tspan></text><rect x="370" y="60" width="185.04" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="563.04" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="563.04" dy="0">5,14:1</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Enlace turquesa sobre blanco</tspan></text><rect x="370" y="104" width="171" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="549" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="549" dy="0">4,75:1</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Gris medio (119, 119, 119) sobre blanco</tspan></text><rect x="370" y="148" width="161.28" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="539.28" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="539.28" dy="0">4,48:1</tspan></text><text x="360" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Gris claro (170, 170, 170) sobre blanco</tspan></text><rect x="370" y="192" width="83.52" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="461.52" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="461.52" dy="0">2,32:1</tspan></text><rect x="10" y="240" width="1060" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">Un gris medio muy habitual queda a dos centésimas del umbral y no lo cumple; el cálculo lo detecta sin mirar la pantalla. De 20 000 colores</tspan></text><text x="540" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">aleatorios sobre blanco, solo el 36,2 % alcanza 4,5 a 1. El cálculo no sustituye una prueba con personas con baja visión.</tspan></text><text x="540" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Fórmula de luminancia relativa de WCAG 2.2; cálculo determinista, idéntico en Windows y Ubuntu.</tspan></text></svg>
