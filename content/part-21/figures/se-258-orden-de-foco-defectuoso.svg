<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 469" width="940" height="469" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Controles inalcanzables (media de 1000 interfaces de 14 controles) según el defecto del orden de foco; el recorrido detecta el defecto en el 100 % de los casos con defecto</title><desc id="d">Barras horizontales con los controles inalcanzables en media por tipo de defecto del orden de foco: 0 con el orden correcto, 6,49 con una trampa de foco, 1,00 con un salto que se salta un control, 0,92 con un control visible fuera del orden y 6,23 con un recorrido que vuelve al inicio antes de tiempo; un recorrido automático detecta el 100 por ciento de los defectos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="469" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Controles inalcanzables (media de 1000 interfaces de 14 controles) según el defecto del orden de foco; el</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">recorrido detecta el defecto en el 100 % de los casos con defecto</tspan></text><line x1="344" y1="68" x2="344" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="288" x2="344" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0</tspan></text><line x1="478.94" y1="68" x2="478.94" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="478.94" y1="288" x2="478.94" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="478.94" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478.94" dy="0">2</tspan></text><line x1="613.88" y1="68" x2="613.88" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="613.88" y1="288" x2="613.88" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="613.88" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="613.88" dy="0">4</tspan></text><line x1="748.82" y1="68" x2="748.82" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="748.82" y1="288" x2="748.82" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="748.82" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.82" dy="0">6</tspan></text><line x1="883.76" y1="68" x2="883.76" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="288" x2="883.76" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">8</tspan></text><line x1="344" y1="288" x2="883.76" y2="288" stroke="#5b7280" stroke-width="1.6"/><text x="334" y="94.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Orden de foco correcto</tspan></text><text x="334" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Un control que retiene el foco (trampa)</tspan></text><text x="334" y="182.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Un salto que se salta un control</tspan></text><text x="334" y="226.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Un control visible fuera del orden</tspan></text><text x="334" y="262" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Un recorrido que vuelve al inicio antes de</tspan></text><text x="334" y="279" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">tiempo</tspan></text><rect x="344" y="74" width="2" height="32" rx="3" fill="#c0432f"/><text x="353" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353" dy="0">0,00</tspan></text><rect x="344" y="118" width="437.88" height="32" rx="3" fill="#c0432f"/><text x="788.88" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788.88" dy="0">6,49</tspan></text><rect x="344" y="162" width="67.47" height="32" rx="3" fill="#c0432f"/><text x="418.47" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="418.47" dy="0">1,00</tspan></text><rect x="344" y="206" width="62.0724" height="32" rx="3" fill="#c0432f"/><text x="413.072" y="226.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="413.072" dy="0">0,92</tspan></text><rect x="344" y="250" width="420.338" height="32" rx="3" fill="#c0432f"/><text x="771.338" y="270.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="771.338" dy="0">6,23</tspan></text><text x="613.88" y="332" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="613.88" dy="0">Controles inalcanzables (media, de 14)</tspan></text><rect x="10" y="346" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="370.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El recorrido encuentra defectos de alcance, no de sentido: un orden completo que salta de la derecha a la izquierda sin</tspan></text><text x="470" y="387.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lógica visual sigue siendo inalcanzable para quien necesita entender dónde está. Ese juicio requiere a una persona que use</tspan></text><text x="470" y="404.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el teclado o un lector de pantalla.</tspan></text><text x="470" y="451.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
