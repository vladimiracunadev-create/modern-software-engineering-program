<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Parte de la base instalada que ya tiene la versión nueva según el canal de actualización</title><desc id="d">Líneas con el porcentaje de instalaciones con la versión nueva a 1, 7, 14 y 30 días según el canal: con actualización automática 34,6, 95,0, 99,9 y 100 por ciento; mixta 10,2, 52,2, 77,1 y 95,6; manual 3,1, 18,6, 34,3 y 59,2; empresarial con ventana 1,0, 6,8, 13,5 y 26,2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Parte de la base instalada que ya tiene la versión nueva según el canal de actualización</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Automática (35 % por día)</tspan></text><rect x="252.5" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Mixta (10 % por día)</tspan></text><polygon points="457.3,44.1 463.9,56.4 450.7,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="471.3" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="471.3" dy="0">Manual (3 % por día)</tspan></text><polygon points="22,67.5 29.5,75 22,82.5 14.5,75" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Empresarial con ventana (1 % por día)</tspan></text><line x1="78.62" y1="411" x2="910" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="411" x2="78.62" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="415.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="336" x2="910" y2="336" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="336" x2="78.62" y2="336" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="340.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="261" x2="910" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="261" x2="78.62" y2="261" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="265.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="186" x2="910" y2="186" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="186" x2="78.62" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="190.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="111" x2="910" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="111" x2="78.62" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="111" x2="78.62" y2="411" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="111" x2="96.62" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="411" x2="96.62" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="432" font-size="13" text-anchor="middle" font-weight="400"