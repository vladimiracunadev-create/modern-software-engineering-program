17,377.375 446.295,370.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="892,325.525 898.875,332.4 892,339.275 885.125,332.4" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="321.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">26,2</tspan></text><rect x="10" y="471" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="495.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las probabilidades diarias son supuestos del autor, no medidas de ninguna tienda ni empresa. Lo transferible es la forma:</tspan></text><text x="470" y="512.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con un canal lento las versiones coexisten durante meses y el servidor debe aceptar a todas.</tspan></text><text x="470" y="560.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
