<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 335" width="1160" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Elementos finales que difieren de lo que el usuario hizo en último lugar</title><desc id="d">Barras: con ocho elementos, tres réplicas y 60 operaciones, un conjunto con marcas únicas difiere de la última intención en 0,78 elementos de media, un conjunto con baja definitiva en 4,23, y el último escritor gana en 0 con relojes alineados, 0,88 con diez pasos de desfase y 2,14 con cuarenta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1160" height="335" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Conjunto con marcas únicas (alta gana)</tspan></text><rect x="480" y="16" width="62.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="550.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="550.4" dy="0">0,78 de 8</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Conjunto donde la baja es definitiva</tspan></text><rect x="480" y="60" width="338.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="826.4" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="826.4" dy="0">4,23 de 8</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Último escritor gana, relojes alineados</tspan></text><rect x="480" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="492" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">0 de 8</tspan></text><text x="470" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Último escritor gana, reloj 10 pasos adelantado</tspan></text><rect x="480" y="148" width="70.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="558.4" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="558.4" dy="0">0,88 de 8</tspan></text><text x="470" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Último escritor gana, reloj 40 pasos adelantado</tspan></text><rect x="480" y="192" width="171.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="659.2" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="659.2" dy="0">2,14 de 8</tspan></text><rect x="10" y="240" width="1140" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="580" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="580" dy="0">No hay una política de conflicto sin pérdida: el conjunto con marcas respeta lo que cada réplica vio y por eso una alta concurrente a una baja sobrevive;</tspan></text><text x="580" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="580" dy="0">el último escritor acierta solo si los relojes dicen la verdad. Se elige la política por la intención que se está dispuesto a sacrificar.</tspan></text><text x="580" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="580" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
