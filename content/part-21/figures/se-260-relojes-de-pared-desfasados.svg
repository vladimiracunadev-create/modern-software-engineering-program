<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 307" width="900" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pares de eventos de dos dispositivos ordenados al revés por un reloj de pared desfasado</title><desc id="d">Barras: con eventos separados por 1 a 10 unidades de tiempo y un dispositivo adelantado, el porcentaje de pares de eventos mal ordenados es 0 con desfase 0 y 1, 0,78 por ciento con desfase 5 y 7,76 por ciento con desfase 30.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="307" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Sin desfase</tspan></text><rect x="310" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">0,00 %</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Desfase de 1 unidad</tspan></text><rect x="310" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">0,00 %</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Desfase de 5 unidades</tspan></text><rect x="310" y="104" width="31.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="349.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="349.2" dy="0">0,78 %</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Desfase de 30 unidades</tspan></text><rect x="310" y="148" width="310.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="628.4" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="628.4" dy="0">7,76 %</tspan></text><rect x="10" y="196" width="880" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Ordenar por el reloj de pared funciona mientras el desfase sea menor que el intervalo entre eventos, y deja de</tspan></text><text x="450" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">funcionar sin avisar. Los relojes lógicos (contadores por réplica) no dependen de la hora: ordenan lo causal y dejan</tspan></text><text x="450" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">lo concurrente declarado como concurrente.</tspan></text><text x="450" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
