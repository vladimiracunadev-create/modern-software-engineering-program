<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 327" width="1020" height="327" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Construir las etiquetas de toda la lista o solo las 20 visibles</title><desc id="d">Tabla de tiempos en Windows: construir las etiquetas de 1000, 10 000 y 100 000 elementos tarda 0,50, 14,57 y 103,2 milisegundos, mientras construir solo una ventana de 20 tarda 0,027, 0,030 y 0,031; la razón sube de 18 a 3370 veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="327" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Tamaño de la lista</tspan></text><rect x="280" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Todos los elementos</tspan></text><rect x="530" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Ventana de 20</tspan></text><rect x="780" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="892" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="892" dy="0">Razón</tspan></text><rect x="10" y="56" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">1000 elementos</tspan></text><rect x="280" y="56" width="244" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="402" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="402" dy="0">0,50 ms</tspan></text><rect x="530" y="56" width="244" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="652" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="652" dy="0">0,027 ms</tspan></text><rect x="780" y="56" width="224" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">18 veces</tspan></text><rect x="10" y="108" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">10 000 elementos</tspan></text><rect x="280" y="108" width="244" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="402" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="402" dy="0">14,57 ms</tspan></text><rect x="530" y="108" width="244" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="652" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="652" dy="0">0,030 ms</tspan></text><rect x="780" y="108" width="224" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">485 veces</tspan></text><rect x="10" y="160" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">100 000 elementos</tspan></text><rect x="280" y="160" width="244" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="402" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="402" dy="0">103,2 ms</tspan></text><rect x="530" y="160" width="244" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="652" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="652" dy="0">0,031 ms</tspan></text><rect x="780" y="160" width="224" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">3370 veces</tspan></text><rect x="10" y="216" width="1000" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">El tiempo de la ventana no depende del tamaño de la lista, y el tiempo completo crece con él. Es un proxy de cadenas en Python: no</tspan></text><text x="510" y="257.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">mide dibujo en pantalla ni el coste de un marco real; en Ubuntu fueron 0,44, 3,14 y 42,9 ms completos y 0,006 a 0,012 ms para la</tspan></text><text x="510" y="274.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">ventana.</tspan></text><text x="510" y="313.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Tiempos medidos en un equipo (Windows 11, CPython 3.12.9); en Ubuntu (WSL2) la forma se repite con otras cifras.</tspan></text></svg>
