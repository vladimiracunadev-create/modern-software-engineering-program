<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 594" width="940" height="594" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Energía y retraso de enterarse de 48 eventos en un día según cómo despierta la radio</title><desc id="d">Dispersión de la energía, en unidades arbitrarias y escala logarítmica, frente a la latencia media de cinco políticas para 48 eventos en 24 horas: el sondeo cada 30 segundos gasta 1 440 000 con 15,3 s; cada 5 minutos 144 000 con 157,1 s; cada 15 minutos 48 000 con 407,1 s; el lote cada hora 12 000 con 1794,6 s; el empuje 24 000 con latencia 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="594" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Energía y retraso de enterarse de 48 eventos en un día según cómo despierta la radio</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sondeo cada 30 s</tspan></text><rect x="184.64" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Sondeo cada 5 min</tspan></text><polygon points="366.82,44.1 373.42,56.4 360.22,56.4" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="380.82" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="380.82" dy="0">Sondeo cada 15 min</tspan></text><polygon points="550.54,43.5 558.04,51 550.54,58.5 543.04,51" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="564.54" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="564.54" dy="0">Lote cada hora</tspan></text><path d="M16,69 L28,81 M28,69 L16,81" stroke="#087f8c" stroke-width="2.4" fill="none"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Empuje (un despertar por evento)</tspan></text><line x1="131.4" y1="411" x2="910" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="411" x2="131.4" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="415.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">10 000</tspan></text><line x1="131.4" y1="311" x2="910" y2="311" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="311" x2="131.4" y2="311" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="315.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">100 000</tspan></text><line x1="131.4" y1="211" x2="910" y2="211" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="211" x2="131.4" y2="211" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="215.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">1 000 000</tspan></text><line x1="131.4" y1="111" x2="910" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="111" x2="131.4" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">10 000 000</tspan></text><line x1="131.4" y1="111" x2="131.4" y2="411" stroke="#5b7280" stroke-width="1.6"/><line x1="149.4" y1="111" x2="149.4" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="149.4" y1="411" x2="149.4" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="149.4" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="149.4" dy="0">0</tspan></text><line x1="335.05" y1="111" x2="335.05" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="335.05" y1="411" x2="335.05" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="335.05" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="335.05" dy="0">500</tspan></text><line x1="520.7" y1="111" x2="520.7" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="520.7" y1="411" x2="520.7" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="520.7" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="520.7" dy="0">1000</tspan></text><line x1="706.35" y1="111" x2="706.35" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="706.35" y1="411" x2="706.35" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="706.35" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="706.35" dy="0">1500</tspan></text><line x1="892" y1="111" x2="892" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="411" x2="892" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">2000</tspan></text><line x1="131.4" y1="411" x2="910" y2="411" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 261)">Energía (u. a.) (escala logarítmica)</text><text x="520.7" y="457" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="520.7" dy="0">Latencia media (s)</tspan></text><circle cx="155.081" cy="195.164" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="202.231" y="289.664" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="300.556,336.551 306.606,347.826 294.506,347.826" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="815.735,396.207 822.61,403.082 815.735,409.957 808.86,403.082" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><path d="M143.9,367.479 L154.9,378.479 M154.9,367.479 L143.9,378.479" stroke="#087f8c" stroke-width="2.4" fill="none"/><text x="179.4" y="320.979" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="179.4" dy="0">Empuje: 24 000 u. a. y 48</tspan></text><text x="179.4" y="337.979" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="179.4" dy="0">despertares, sin retraso</tspan></text><line x1="151.16" y1="368.419" x2="171.4" y2="315.979" stroke="#5c1f14" stroke-width="1.2"/><text x="195.081" y="201.164" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="195.081" dy="0">Sondeo cada 30 s: 2880</tspan></text><text x="195.081" y="218.164" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="195.081" dy="0">despertares</tspan></text><line x1="157.641" y1="195.244" x2="187.081" y2="196.164" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="471" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="495.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los costes (100 por despertar y hasta 400 de cola) son supuestos del autor, no mediciones de un radio ni de una batería. La</tspan></text><text x="470" y="512.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comparación enseña la estructura: la energía depende del número de despertares (2880, 288, 96, 24 y 48), y el empuje solo</tspan></text><text x="470" y="529.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">despierta cuando hay algo.</tspan></text><text x="470" y="576.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo determinista; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
