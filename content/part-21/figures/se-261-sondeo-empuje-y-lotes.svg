<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 405" width="1020" height="405" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Energía y retraso de enterarse de 48 eventos en un día según cómo despierta la radio</title><desc id="d">Tabla de un modelo de energía en unidades arbitrarias para 48 eventos en 24 horas: sondeo cada 30 segundos gasta 1 440 000 con 15,3 s de latencia, sondeo cada 15 minutos 48 000 con 407,1 s, lote cada hora 12 000 con 1794,6 s, y empuje 24 000 sin latencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="405" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Política</tspan></text><rect x="390" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">Energía (u. a.)</tspan></text><rect x="610" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Latencia media</tspan></text><rect x="830" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="917" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="917" dy="0">Despertares</tspan></text><rect x="10" y="56" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Sondeo cada 30 s</tspan></text><rect x="390" y="56" width="214" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="497" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="497" dy="0">1 440 000</tspan></text><rect x="610" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">15,3 s</tspan></text><rect x="830" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">2880</tspan></text><rect x="10" y="106" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Sondeo cada 5 min</tspan></text><rect x="390" y="106" width="214" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="497" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="497" dy="0">144 000</tspan></text><rect x="610" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">157,1 s</tspan></text><rect x="830" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">288</tspan></text><rect x="10" y="156" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Sondeo cada 15 min</tspan></text><rect x="390" y="156" width="214" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="497" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="497" dy="0">48 000</tspan></text><rect x="610" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">407,1 s</tspan></text><rect x="830" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">96</tspan></text><rect x="10" y="206" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Lote cada hora</tspan></text><rect x="390" y="206" width="214" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="497" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="497" dy="0">12 000</tspan></text><rect x="610" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">1794,6 s</tspan></text><rect x="830" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">24</tspan></text><rect x="10" y="256" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Empuje (un despertar por evento)</tspan></text><rect x="390" y="256" width="214" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="497" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="497" dy="0">24 000</tspan></text><rect x="610" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">0 s</tspan></text><rect x="830" y="256" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">48</tspan></text><rect x="10" y="310" width="1000" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">Los costes (100 por despertar y hasta 400 de cola) son supuestos del autor, no mediciones de un radio ni de una batería. La</tspan></text><text x="510" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">comparación enseña la estructura: la energía depende del número de despertares, y el empuje solo despierta cuando hay algo.</tspan></text><text x="510" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Modelo determinista; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
