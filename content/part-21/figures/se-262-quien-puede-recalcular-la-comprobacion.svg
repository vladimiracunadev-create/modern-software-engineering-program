<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 402" width="940" height="402" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué detecta cada comprobación al voltear un bit y qué ocurre cuando alguien manipula el paquete</title><desc id="d">Diagrama de flujo de tres comprobaciones sobre un paquete de 4096 bytes: las tres detectan los 32 768 volteos de un bit; un atacante puede recalcular el CRC y el SHA-256 publicado junto al paquete, pero no el HMAC sin la clave, que a su vez tiene el límite de que la clave no puede ir en el cliente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="402" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué detecta cada comprobación al voltear un bit y qué ocurre cuando alguien manipula el paquete</tspan></text><text x="99" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="99" dy="0">Comprobación</tspan></text><text x="310" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="310" dy="0">Corrupción accidental</tspan></text><text x="551" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="551" dy="0">¿Puede recalcularla quien modifica?</tspan></text><text x="787" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="787" dy="0">Límite</tspan></text><rect x="14" y="71" width="170" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99" y="102.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99" dy="0">CRC-32</tspan></text><polyline points="188,98.64 206,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="210" y="71" width="200" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="310" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="310" dy="0">32 768 de 32 768 volteos</tspan></text><text x="310" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="310" dy="0">detectados</tspan></text><polyline points="414,98.64 432,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="436" y="71" width="230" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="551" y="102.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="551" dy="0">Sí: lo recalcula cualquiera</tspan></text><polyline points="670,98.64 688,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="692" y="71" width="190" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="787" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="787" dy="0">Detecta corrupción, no</tspan></text><text x="787" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="787" dy="0">manipulación</tspan></text><rect x="14" y="138.28" width="170" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99" y="161.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99" dy="0">SHA-256 junto al</tspan></text><text x="99" y="177.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99" dy="0">paquete</tspan></text><polyline points="188,165.92 206,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="210" y="138.28" width="200" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="310" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="310" dy="0">32 768 de 32 768 volteos</tspan></text><text x="310" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="310" dy="0">detectados</tspan></text><polyline points="414,165.92 432,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="436" y="138.28" width="230" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="551" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="551" dy="0">Sí: se publica junto al</tspan></text><text x="551" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="551" dy="0">archivo</tspan></text><polyline points="670,165.92 688,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="692" y="138.28" width="190" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="787" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="787" dy="0">Solo vale si llega por</tspan></text><text x="787" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="787" dy="0">un canal distinto</tspan></text><rect x="14" y="205.56" width="170" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99" y="228.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99" dy="0">HMAC con clave</tspan></text><text x="99" y="245.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99" dy="0">compartida</tspan></text><polyline points="188,233.2 206,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="210" y="205.56" width="200" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="310" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="310" dy="0">32 768 de 32 768 volteos</tspan></text><text x="310" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="310" dy="0">detectados</tspan></text><polyline points="414,233.2 432,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="436" y="205.56" width="230" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="551" y="236.84" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="551" dy="0">No, sin la clave</tspan></text><polyline points="670,233.2 688,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="692" y="205.56" width="190" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="787" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="787" dy="0">La clave no puede ir</tspan></text><text x="787" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="787" dy="0">dentro del cliente</tspan></text><rect x="10" y="278.84" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Detectar corrupción accidental y detectar manipulación son problemas distintos. Una firma con clave privada que el cliente</tspan></text><text x="470" y="320.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no posee añade lo que ni un CRC ni un hash resuelven: la procedencia. Aquí se usó HMAC con una clave de prueba por falta de</tspan></text><text x="470" y="337.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">criptografía asimétrica en la biblioteca estándar.</tspan></text><text x="470" y="384.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Clave de prueba que no protege nada; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
