<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 425" width="940" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un secreto ficticio dentro del paquete de un cliente: qué lo encuentra</title><desc id="d">Diagrama de flujo de cuatro formas de guardar un secreto ficticio en un paquete de cliente: texto plano, base64 y XOR con un byte se recuperan con una búsqueda simple; partido en tres trozos evita la búsqueda ingenua, pero el programa lo reconstruye al ejecutarse y por tanto también quien lo observe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="425" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un secreto ficticio dentro del paquete de un cliente: qué lo encuentra</tspan></text><text x="134" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="134" dy="0">Cómo se guarda</tspan></text><text x="433" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="433" dy="0">¿Lo recupera quien tiene el paquete?</tspan></text><text x="757" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="757" dy="0">Esfuerzo</tspan></text><rect x="14" y="71" width="240" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="134" dy="0">Texto plano</tspan></text><polyline points="258,94 284,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="288" y="71" width="290" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="433" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="433" dy="0">Sí: búsqueda de «sk_test_»</tspan></text><polyline points="582,94 608,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="612" y="71" width="290" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">No hace falta nada más</tspan></text><rect x="14" y="129" width="240" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="134" dy="0">Base64</tspan></text><polyline points="258,152 284,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="288" y="129" width="290" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="433" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="433" dy="0">Sí: decodificar candidatos</tspan></text><polyline points="582,152 608,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="612" y="129" width="290" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Un patrón y una línea de código</tspan></text><rect x="14" y="187" width="240" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="213.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="134" dy="0">XOR con un byte fijo</tspan></text><polyline points="258,210 284,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="288" y="187" width="290" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="433" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="433" dy="0">Sí: probar los 256 bytes</tspan></text><polyline points="582,210 608,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="612" y="187" width="290" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">256 intentos por candidato</tspan></text><rect x="14" y="245" width="240" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="276.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="134" dy="0">Partido en tres trozos</tspan></text><polyline points="258,272.64 284,272.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="288" y="245" width="290" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="433" y="276.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="433" dy="0">No con una búsqueda ingenua</tspan></text><polyline points="582,272.64 608,272.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="612" y="245" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="267.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Pero el programa lo reconstruye al</tspan></text><text x="757" y="284.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">ejecutarse</tspan></text><rect x="10" y="318.28" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="343.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ofuscar sube el esfuerzo de una búsqueda, no impide que quien posee el paquete lo ejecute y observe. Todo secreto que el</tspan></text><text x="470" y="359.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cliente necesita para funcionar es, en la práctica, público para quien tenga el cliente: la defensa es no ponerlo ahí.</tspan></text><text x="470" y="407.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Secreto ficticio de ejemplo; sin valor real. Resultados idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
