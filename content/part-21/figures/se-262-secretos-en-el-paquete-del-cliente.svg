<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 379" width="1020" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un secreto ficticio dentro del paquete de un cliente: qué lo encuentra</title><desc id="d">Tabla de cuatro formas de guardar un secreto ficticio en un paquete de cliente: texto plano, base64 y XOR con un byte se recuperan con una búsqueda simple; partido en tres trozos evita la búsqueda ingenua, pero el programa lo reconstruye al ejecutarse y por tanto también quien lo observe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="379" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Cómo se guarda</tspan></text><rect x="270" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">¿Lo recupera quien tiene el paquete?</tspan></text><rect x="650" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Esfuerzo</tspan></text><rect x="10" y="56" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Texto plano</tspan></text><rect x="270" y="56" width="374" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="457" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="457" dy="0">Sí (búsqueda de «sk_test_»)</tspan></text><rect x="650" y="56" width="354" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">No hace falta nada más</tspan></text><rect x="10" y="112" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Base64</tspan></text><rect x="270" y="112" width="374" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="457" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="457" dy="0">Sí (decodificar candidatos)</tspan></text><rect x="650" y="112" width="354" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Un patrón y una línea de código</tspan></text><rect x="10" y="168" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">XOR con un byte fijo</tspan></text><rect x="270" y="168" width="374" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="457" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="457" dy="0">Sí (probar los 256 bytes)</tspan></text><rect x="650" y="168" width="354" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">256 intentos por candidato</tspan></text><rect x="10" y="224" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Partido en tres trozos</tspan></text><rect x="270" y="224" width="374" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="457" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="457" dy="0">No con una búsqueda ingenua</tspan></text><rect x="650" y="224" width="354" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Pero el programa lo reconstruye al ejecutarse</tspan></text><rect x="10" y="284" width="1000" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="510" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Ofuscar sube el esfuerzo de una búsqueda, no impide que quien posee el paquete lo ejecute y observe. Todo secreto que el cliente</tspan></text><text x="510" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">necesita para funcionar es, en la práctica, público para quien tenga el cliente: la defensa es no ponerlo ahí.</tspan></text><text x="510" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Secreto ficticio de ejemplo; sin valor real. Resultados idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
