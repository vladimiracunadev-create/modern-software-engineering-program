<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 477" width="1020" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete diferencias medidas entre Windows 11 y Ubuntu bajo WSL2 con el mismo programa</title><desc id="d">Tabla de siete comportamientos del mismo programa en Windows y en Ubuntu: separador de ruta, salto de línea, distinción de mayúsculas en nombres, nombres aceptados, codificación por defecto, borrar un archivo abierto y bit de ejecución.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="477" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Comportamiento</tspan></text><rect x="510" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">Windows 11</tspan></text><rect x="760" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">Ubuntu (WSL2)</tspan></text><rect x="10" y="56" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Separador de ruta</tspan></text><rect x="510" y="56" width="244" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="632" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="632" dy="0">\</tspan></text><rect x="760" y="56" width="244" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="882" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="882" dy="0">/</tspan></text><rect x="10" y="102" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Salto de línea de os.linesep</tspan></text><rect x="510" y="102" width="244" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="632" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="632" dy="0">CR LF</tspan></text><rect x="760" y="102" width="244" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="882" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="882" dy="0">LF</tspan></text><rect x="10" y="148" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Abrir «notas.txt» si existe «Notas.txt»</tspan></text><rect x="510" y="148" width="244" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="632" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="632" dy="0">Sí</tspan></text><rect x="760" y="148" width="244" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="882" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="882" dy="0">No</tspan></text><rect x="10" y="194" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Nombres con :, ?, CON, punto final, etc. (de 7)</tspan></text><rect x="510" y="194" width="244" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="632" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="632" dy="0">4 aceptados</tspan></text><rect x="760" y="194" width="244" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="882" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="882" dy="0">7 aceptados</tspan></text><rect x="10" y="240" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Bytes de «é» con la codificación por defecto</tspan></text><rect x="510" y="240" width="244" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="632" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="632" dy="0">1 (cp1252)</tspan></text><rect x="760" y="240" width="244" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="882" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="882" dy="0">2 (UTF-8)</tspan></text><rect x="10" y="286" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Reemplazar o borrar un archivo abierto</tspan></text><rect x="510" y="286" width="244" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="632" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="632" dy="0">Rechazado</tspan></text><rect x="760" y="286" width="244" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="882" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="882" dy="0">Permitido</tspan></text><rect x="10" y="332" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="355.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Bit de ejecución visible en un .txt</tspan></text><rect x="510" y="332" width="244" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="632" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="632" dy="0">Sí</tspan></text><rect x="760" y="332" width="244" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="882" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="882" dy="0">No</tspan></text><rect x="10" y="382" width="1000" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="406.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">La codificación de «é» depende del modo de Python en cada sistema: con -X utf8 Windows también da 2 bytes. El mapa de diferencias es</tspan></text><text x="510" y="423.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">parcial; solo contiene lo que se midió y nada de iOS, Android ni macOS.</tspan></text><text x="510" y="463.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Python 3.12.9 (Windows) y 3.12.3 (Ubuntu); sin opciones de UTF-8 forzado.</tspan></text></svg>
