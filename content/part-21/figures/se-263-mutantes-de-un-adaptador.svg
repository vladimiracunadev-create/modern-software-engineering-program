<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" width="940" height="490" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un contrato de cinco comprobaciones contra cuatro adaptadores de almacenamiento defectuosos</title><desc id="d">Diagrama de flujo de un adaptador de almacenamiento falso y cuatro mutaciones: el contrato de cinco comprobaciones pasa el adaptador correcto y detecta las cuatro mutaciones, una de ellas con una excepción, otra con dos comprobaciones fallidas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="490" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un contrato de cinco comprobaciones contra cuatro adaptadores de almacenamiento defectuosos</tspan></text><text x="214" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="214" dy="0">Adaptador</tspan></text><text x="563" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="563" dy="0">Comprobaciones que fallan</tspan></text><text x="807" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="807" dy="0">Resultado del contrato</tspan></text><rect x="14" y="71" width="400" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214" dy="0">Sin mutación (adaptador falso correcto)</tspan></text><polyline points="418,94 444,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="448" y="71" width="230" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="563" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="563" dy="0">Ninguna comprobación falla</tspan></text><polyline points="682,94 708,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="712" y="71" width="190" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="807" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="807" dy="0">Pasa</tspan></text><rect x="14" y="129" width="400" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214" dy="0">Guardar no sobrescribe un valor existente</tspan></text><polyline points="418,152 444,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="448" y="129" width="230" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="563" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="563" dy="0">sobrescribir</tspan></text><polyline points="682,152 708,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="712" y="129" width="190" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="807" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="807" dy="0">Detectada</tspan></text><rect x="14" y="187" width="400" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="213.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214" dy="0">Borrar lo ausente lanza una excepción</tspan></text><polyline points="418,210 444,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="448" y="187" width="230" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="563" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="563" dy="0">excepción KeyError</tspan></text><polyline points="682,210 708,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="712" y="187" width="190" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="807" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="807" dy="0">Detectada</tspan></text><rect x="14" y="245" width="400" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="271.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214" dy="0">Listar devuelve el orden inverso</tspan></text><polyline points="418,268 444,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="448" y="245" width="230" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="563" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="563" dy="0">orden</tspan></text><polyline points="682,268 708,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="712" y="245" width="190" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="807" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="807" dy="0">Detectada</tspan></text><rect x="14" y="303" width="400" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214" dy="0">Leer lo ausente devuelve cadena vacía</tspan></text><polyline points="418,326 444,326" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="448" y="303" width="230" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="563" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="563" dy="0">ausente y borrar</tspan></text><polyline points="682,326 708,326" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="712" y="303" width="190" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="807" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="807" dy="0">Detectada</tspan></text><rect x="10" y="367" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="391.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El mismo contrato se ejecuta contra el adaptador falso de las pruebas y contra el adaptador real de cada plataforma: si el</tspan></text><text x="470" y="408.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">falso no cumple el contrato, las pruebas del resto de la aplicación certifican un comportamiento que no existe. Cuatro</tspan></text><text x="470" y="425.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mutaciones no agotan los defectos posibles.</tspan></text><text x="470" y="472.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Mutaciones escritas por el autor; resultados idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
