"10" y="218" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Cambiar un campo que sí comprueba</tspan></text><rect x="390" y="218" width="124" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="452" dy="0">56</tspan></text><rect x="520" y="218" width="484" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">el validador acepta cualquier valor no vacío</tspan></text><rect x="10" y="272" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Detectadas por el validador</tspan></text><rect x="390" y="272" width="124" height="48" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="452" dy="0">136</tspan></text><rect x="520" y="272" width="484" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">borrar o vaciar un campo comprobado</tspan></text><rect x="10" y="330" width="1000" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">Un validador que solo comprueba presencia aprueba un paquete con evidencia absurda. Ese hueco no se cierra con más reglas de forma: la</tspan></text><text x="510" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">evidencia la revisa una persona que ejecuta lo que el paquete dice.</tspan></text><text x="510" y="411.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Paquete y mutaciones sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
