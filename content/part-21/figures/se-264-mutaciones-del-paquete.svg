width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="378.814" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="378.814" dy="0">13</tspan></text><rect x="324" y="124" width="62.526" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="355.263" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="355.263" dy="0">17</tspan></text><rect x="386.526" y="124" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="393.526" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="393.526" dy="0">17</tspan></text><rect x="324" y="164" width="66.204" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="357.102" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357.102" dy="0">18</tspan></text><rect x="390.204" y="164" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="397.204" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="397.204" dy="0">18</tspan></text><rect x="324" y="204" width="205.968" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="426.984" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="426.984" dy="0">56</tspan></text><rect x="529.968" y="204" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="536.968" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="536.968" dy="0">56</tspan></text><rect x="324" y="244" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="244" width="500.208" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="574.104" y="261.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.104" dy="0">136</tspan></text><text x="831.208" y="261.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="831.208" dy="0">136</tspan></text><text x="599.85" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Mutaciones</tspan></text><rect x="10" y="335" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un validador que solo comprueba presencia aprueba un paquete con evidencia absurda: no mira enlaces ni huella, y acepta</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cualquier valor no vacío en los campos que sí comprueba. Ese hueco no se cierra con más reglas de forma: la evidencia la</tspan></text><text x="470" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">revisa una persona que ejecuta lo que el paquete dice.</tspan></text><text x="470" y="440.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Paquete y mutaciones sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
