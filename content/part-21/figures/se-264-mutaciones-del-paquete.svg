<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 458" width="940" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">240 mutaciones de un paquete de proyecto: 136 detectadas y 104 que el validador no ve</title><desc id="d">Barras apiladas horizontales con las 240 mutaciones de un paquete de once campos: el validador de presencia detecta 136, borrar o vaciar un campo comprobado, y no ve 104: 13 por borrar, 17 por vaciar y 18 por cambiar un campo ajeno al validador y 56 por cambiar el contenido de un campo comprobado a otro valor no vacío.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="458" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">240 mutaciones de un paquete de proyecto: 136 detectadas y 104 que el validador no ve</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">No detectadas</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Detectadas</tspan></text><line x1="324" y1="77" x2="324" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="277" x2="324" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="507.9" y1="77" x2="507.9" y2="277" 