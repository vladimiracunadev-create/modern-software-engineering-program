<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 499" width="940" height="499" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Promedios erróneos al acumular lecturas de 12 bits en 16 bits (% de ventanas)</title><desc id="d">Mapa de calor con el porcentaje de promedios erróneos según el número de lecturas y la señal media: con señal media de 1000 no falla ninguno hasta 32 lecturas y con 64 falla el 10 por ciento; con señal media de 3000 falla el 100 por ciento desde 32 lecturas, con un error de 2048 cuentas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="499" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Promedios erróneos al acumular lecturas de 12 bits en 16 bits (% de ventanas)</tspan></text><text x="531.33" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="531.33" dy="0">Ventanas con el promedio erróneo (%)</tspan></text><text x="336.995" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="336.995" dy="0">Señal media 1000</tspan></text><text x="725.665" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="725.665" dy="0">Señal media 3000</tspan></text><text x="132.66" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="132.66" dy="0">4 lecturas</tspan></text><text x="132.66" y="158.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="132.66" dy="0">8 lecturas</tspan></text><text x="132.66" y="198.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="132.66" dy="0">16 lecturas</tspan></text><text x="132.66" y="238.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="132.66" dy="0">17 lecturas</tspan></text><text x="132.66" y="278.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="132.66" dy="0">32 lecturas</tspan></text><text x="132.66" y="318.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="132.66" dy="0">64 lecturas</tspan></text><rect x="144.16" y="95.5" width="385.67" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="336.995" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="336.995" dy="0">0 %</tspan></text><rect x="532.83" y="95.5" width="385.67" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="725.665" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="725.665" dy="0">0 %</tspan></text><rect x="144.16" y="135.5" width="385.67" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="336.995" y="158.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="336.995" dy="0">0 %</tspan></text><rect x="532.83" y="135.5" width="385.67" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="725.665" y="158.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="725.665" dy="0">0 %</tspan></text><rect x="144.16" y="175.5" width="385.67" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="336.995" y="198.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="336.995" dy="0">0 %</tspan></text><rect x="532.83" y="175.5" width="385.67" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="725.665" y="198.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="725.665" dy="0">0 %</tspan></text><rect x="144.16" y="215.5" width="385.67" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="336.995" y="238.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="336.995" dy="0">0 %</tspan></text><rect x="532.83" y="215.5" width="385.67" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="725.665" y="238.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="725.665" dy="0">0 %</tspan></text><rect x="144.16" y="255.5" width="385.67" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="336.995" y="278.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="336.995" dy="0">0 %</tspan></text><rect x="532.83" y="255.5" width="385.67" height="37" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="725.665" y="278.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="725.665" dy="0">100 %</tspan></text><rect x="144.16" y="295.5" width="385.67" height="37" rx="4" fill="#f5d4cc" stroke="#102a43" stroke-width="3"/><text x="336.995" y="318.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="336.995" dy="0">10 %</tspan></text><rect x="532.83" y="295.5" width="385.67" height="37" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="725.665" y="318.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="725.665" dy="0">100 %</tspan></text><text x="20" y="214" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 214)">Lecturas promediadas</text><text x="142.66" y="360" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="142.66" dy="0">0 %</tspan></text><rect x="173.28" y="348" width="30.5" height="14" fill="#fbe4de"/><rect x="203.28" y="348" width="30.5" height="14" fill="#f3cdc5"/><rect x="233.28" y="348" width="30.5" height="14" fill="#eab6ac"/><rect x="263.28" y="348" width="30.5" height="14" fill="#e29f93"/><rect x="293.28" y="348" width="30.5" height="14" fill="#d9887a"/><rect x="323.28" y="348" width="30.5" height="14" fill="#d17161"/><rect x="353.28" y="348" width="30.5" height="14" fill="#c85a48"/><rect x="383.28" y="348" width="30.5" height="14" fill="#c0432f"/><text x="421.28" y="360" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="421.28" dy="0">100 %</tspan></text><text x="466.98" y="360" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="466.98" dy="0">más oscuro = mayor (% de ventanas erróneas)</tspan></text><rect x="10" y="376" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="400.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El frente de fallo avanza con el producto número de lecturas × valor máximo: 32 × 3000 supera 65 535 y desborda siempre.</tspan></text><text x="470" y="417.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuando falla, el error es de 2048 cuentas (65 536 / 32) y el promedio sigue pareciendo plausible. Sobre 20 000 ventanas por</tspan></text><text x="470" y="434.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">celda, señal con ruido gaussiano de 150 cuentas.</tspan></text><text x="470" y="481.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
