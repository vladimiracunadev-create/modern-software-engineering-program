<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 618" width="940" height="618" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Errores no detectados de 200 000 tramas de 8 bytes según el código de control</title><desc id="d">Barras horizontales con las tramas con error que no detecta cada código, de 200 000 inyectadas por tipo de error: la paridad deja pasar todas las de dos bits invertidos (200 000) y 99 238 ráfagas de hasta 8 bits; la suma de 8 bits deja pasar 12 445 con dos bits y 2 143 con tres; el CRC-8 de polinomio 0x07 no deja pasar ninguna en estos casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="618" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Errores no detectados de 200 000 tramas de 8 bytes según el código de control</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Paridad</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Suma de 8 bits</tspan></text><rect x="270.34" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="290.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="290.34" dy="0">CRC-8</tspan></text><line x1="224" y1="77" x2="224" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="437" x2="224" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="382.895" y1="77" x2="382.895" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="382.895" y1="437" x2="382.895" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="382.895" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382.895" dy="0">50 000</tspan></text><line x1="541.79" y1="77" x2="541.79" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="541.79" y1="437" x2="541.79" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="541.79" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="541.79" dy="0">100 000</tspan></text><line x1="700.685" y1="77" x2="700.685" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="700.685" y1="437" x2="700.685" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="700.685" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700.685" dy="0">150 000</tspan></text><line x1="859.58" y1="77" x2="859.58" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="437" x2="859.58" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">200 000</tspan></text><line x1="224" y1="437" x2="859.58" y2="437" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Un bit invertido</tspan></text><text x="214" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Dos bits invertidos</tspan></text><text x="214" y="306.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Tres bits invertidos</tspan></text><text x="214" y="396.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Ráfaga de hasta 8 bits</tspan></text><rect x="224" y="83" width="2" height="24" rx="3" fill="#c0432f"/><text x="233" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="233" dy="0">0</tspan></text><rect x="224" y="110" width="2" height="24" rx="3" fill="#946512"/><text x="233" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="233" dy="0">0</tspan></text><rect x="224" y="137" width="2" height="24" rx="3" fill="#087f8c"/><text x="233" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="233" dy="0">0</tspan></text><rect x="224" y="173" width="635.58" height="24" rx="3" fill="#c0432f"/><text x="866.58" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="866.58" dy="0">200 000</tspan></text><rect x="224" y="200" width="39.549" height="24" rx="3" fill="#946512"/><text x="270.549" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="270.549" dy="0">12 445</tspan></text><rect x="224" y="227" width="2" height="24" rx="3" fill="#087f8c"/><text x="233" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="233" dy="0">0</tspan></text><rect x="224" y="263" width="2" height="24" rx="3" fill="#c0432f"/><text x="233" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="233" dy="0">0</tspan></text><rect x="224" y="290" width="6.81024" height="24" rx="3" fill="#946512"/><text x="237.81" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="237.81" dy="0">2 143</tspan></text><rect x="224" y="317" width="2" height="24" rx="3" fill="#087f8c"/><text x="233" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="233" dy="0">0</tspan></text><rect x="224" y="353" width="315.368" height="24" rx="3" fill="#c0432f"/><text x="546.368" y="369.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="546.368" dy="0">99 238</tspan></text><rect x="224" y="380" width="2" height="24" rx="3" fill="#946512"/><text x="233" y="396.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="233" dy="0">0</tspan></text><rect x="224" y="407" width="2" height="24" rx="3" fill="#087f8c"/><text x="233" y="423.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="233" dy="0">0</tspan></text><text x="541.79" y="481" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="541.79" dy="0">Tramas con error no detectado (de 200 000)</tspan></text><rect x="10" y="495" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="519.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El CRC-8 detecta toda ráfaga de hasta ocho bits y toda combinación de uno a tres bits en tramas tan cortas, pero deja pasar</tspan></text><text x="470" y="536.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">errores más largos o más numerosos en la proporción de 1 entre 256. Las tramas, los errores y la semilla son sintéticos: no</tspan></text><text x="470" y="553.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">se midió ningún bus real.</tspan></text><text x="470" y="600.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
