<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 321" width="920" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Error eficaz (en LSB) de un ADC de 10 bits al promediar N lecturas</title><desc id="d">Tabla: al promediar cuatro, dieciséis, sesenta y cuatro o doscientas cincuenta y seis lecturas, el error eficaz baja a la mitad por cada factor cuatro de sobremuestreo cuando hay ruido de 0,5 o 1,0 LSB, y no baja nada, 0,431, cuando no hay ruido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="321" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Ruido (σ en LSB)</tspan></text><rect x="260" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="322" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322" dy="0">N = 1</tspan></text><rect x="390" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">4</tspan></text><rect x="520" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">16</tspan></text><rect x="650" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="712" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712" dy="0">64</tspan></text><rect x="780" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">256</tspan></text><rect x="10" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">0,0 (sin ruido)</tspan></text><rect x="260" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">0,431</tspan></text><rect x="390" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">0,431</tspan></text><rect x="520" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0,431</tspan></text><rect x="650" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">0,431</tspan></text><rect x="780" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0,431</tspan></text><rect x="10" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">0,5</tspan></text><rect x="260" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">0,583</tspan></text><rect x="390" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">0,289</tspan></text><rect x="520" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0,145</tspan></text><rect x="650" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">0,071</tspan></text><rect x="780" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0,036</tspan></text><rect x="10" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">1,0</tspan></text><rect x="260" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">1,031</tspan></text><rect x="390" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">0,520</tspan></text><rect x="520" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0,259</tspan></text><rect x="650" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">0,128</tspan></text><rect x="780" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0,065</tspan></text><rect x="10" y="210" width="900" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">Sobremuestrear mejora la resolución solo si hay un poco de ruido que la reparta: sin ruido todas las lecturas redondean</tspan></text><text x="460" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">igual y el promedio no mejora. Cada factor cuatro cuesta cuatro veces más tiempo y energía. Señal constante de 1,2345 V</tspan></text><text x="460" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">con referencia de 3,3 V.</tspan></text><text x="460" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
