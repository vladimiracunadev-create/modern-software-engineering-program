<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 329" width="1080" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Desgaste de una flash de 16 sectores tras 200 000 escrituras (mitad de los datos fríos)</title><desc id="d">Tabla: tras 200 000 escrituras, sobrescribir el mismo sector lo borra 200 000 veces y deja una vida relativa de 0,062; rotar solo entre los sectores libres lo deja en 0,5 con 25 000 borrados por sector; moverse entre todos los sectores, incluidos los de datos fríos, llega a 1,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="329" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Política</tspan></text><rect x="430" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">Borrados del sector más</tspan></text><text x="547" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">usado</tspan></text><rect x="670" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Vida relativa al ideal</tspan></text><rect x="870" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="967" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="967" dy="0">Vida a 1 registro por</tspan></text><text x="967" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="967" dy="0">minuto</tspan></text><rect x="10" y="56" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Sobrescribir siempre el mismo sector</tspan></text><rect x="430" y="56" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">200 000</tspan></text><rect x="670" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0,062</tspan></text><rect x="870" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="967" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="967" dy="0">6,9 días</tspan></text><rect x="10" y="114" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Rotar entre los sectores libres</tspan></text><rect x="430" y="114" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">25 000</tspan></text><rect x="670" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0,500</tspan></text><rect x="870" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="967" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="967" dy="0">—</tspan></text><rect x="10" y="172" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Rotar entre todos, moviendo los datos fríos</tspan></text><rect x="430" y="172" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">12 500</tspan></text><rect x="670" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">1,000</tspan></text><rect x="870" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="967" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="967" dy="0">—</tspan></text><rect x="10" y="234" width="1060" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="540" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Con 64 sectores de 4 KiB, registros de 16 B y 10 000 borrados por sector, un registro por minuto da 6,9 días si se sobrescribe un solo sector</tspan></text><text x="540" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">y unos 312 años con un registro circular. La segunda cifra ignora otros límites (retención de datos, tensión): es un techo teórico.</tspan></text><text x="540" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
