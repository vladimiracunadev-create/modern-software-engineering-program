<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Borrados del sector más usado tras 200 000 escrituras en una flash de 16 sectores</title><desc id="d">Barras horizontales con los borrados del sector más usado tras 200 000 escrituras (la mitad de los datos, fríos): sobrescribir siempre el mismo sector lo borra 200 000 veces y deja una vida relativa de 0,062; rotar entre los sectores libres lo deja en 25 000 y 0,5; rotar entre todos, moviendo los datos fríos, en 12 500 y 1,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Borrados del sector más usado tras 200 000 escrituras en una flash de 16 sectores</tspan></text><line x1="354" y1="49" x2="354" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="181" x2="354" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="480.395" y1="49" x2="480.395" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="480.395" y1="181" x2="480.395" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="480.395" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480.395" dy="0">50 000</tspan></text><line x1="606.79" y1="49" x2="606.79" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="606.79" y1="181" x2="606.79" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="606.79" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="606.79" dy="0">100 000</tspan></text><line x1="733.185" y1="49" x2="733.185" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="733.185" y1="181" x2="733.185" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="733.185" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="733.185" dy="0">150 000</tspan></text><line x1="859.58" y1="49" x2="859.58" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="181" x2="859.58" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">200 000</tspan></text><line x1="354" y1="181" x2="859.58" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sobrescribir siempre el mismo sector (vida</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">relativa 0,062)</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Rotar entre los sectores libres (vida</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">relativa 0,5)</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Rotar entre todos, moviendo los datos fríos</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(vida relativa 1,0)</tspan></text><rect x="354" y="55" width="505.58" height="32" rx="3" fill="#c0432f"/><text x="866.58" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="866.58" dy="0">200 000</tspan></text><rect x="354" y="99" width="63.1975" height="32" rx="3" fill="#c0432f"/><text x="424.197" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="424.197" dy="0">25 000</tspan></text><rect x="354" y="143" width="31.5987" height="32" rx="3" fill="#c0432f"/><text x="392.599" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392.599" dy="0">12 500</tspan></text><text x="606.79" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="606.79" dy="0">Borrados del sector más usado</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con 64 sectores de 4 KiB, registros de 16 B y 10 000 borrados por sector, un registro por minuto da 6,9 días si se</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sobrescribe un solo sector y unos 312 años con un registro circular. La segunda cifra ignora otros límites (retención de</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">datos, tensión): es un techo teórico.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
