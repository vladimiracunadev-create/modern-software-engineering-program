<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 305" width="1040" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Filtro y += (x − y) &gt;&gt; k con enteros: error final en cuentas de 10 bits</title><desc id="d">Tabla: un filtro de paso bajo con enteros se queda a 3, 15 y 63 cuentas de la entrada subiendo con k igual a 2, 4 y 6 si se trunca, y a 1, 7 y 31 si se redondea; bajando, el truncado converge exactamente y el redondeado se queda a entre 2 y 32 cuentas; con coma flotante el error es cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="305" fill="#ffffff"/><rect x="10" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="52" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="52" dy="0">k</tspan></text><rect x="100" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="212" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="212" dy="0">Truncado subiendo</tspan></text><rect x="330" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Redondeado subiendo</tspan></text><rect x="570" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="677" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="677" dy="0">Truncado bajando</tspan></text><rect x="790" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="907" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="907" dy="0">Redondeado bajando</tspan></text><rect x="10" y="56" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">2</tspan></text><rect x="100" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="212" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212" dy="0">3</tspan></text><rect x="330" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">1</tspan></text><rect x="570" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">0</tspan></text><rect x="790" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">2</tspan></text><rect x="10" y="106" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">4</tspan></text><rect x="100" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="212" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212" dy="0">15</tspan></text><rect x="330" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">7</tspan></text><rect x="570" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">0</tspan></text><rect x="790" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">8</tspan></text><rect x="10" y="156" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">6</tspan></text><rect x="100" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="212" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212" dy="0">63</tspan></text><rect x="330" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">31</tspan></text><rect x="570" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">0</tspan></text><rect x="790" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">23 a 32</tspan></text><rect x="10" y="210" width="1020" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">El truncado tiene una zona muerta de 2^k − 1 cuentas hacia arriba: el filtro «converge» sin llegar a la entrada y el sesgo es asimétrico.</tspan></text><text x="520" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">Redondear reduce la zona a la mitad y la mueve. Con k = 6 y entradas de 10 bits, 63 cuentas son un 6 % del rango.</tspan></text><text x="520" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
