<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 321" width="970" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Vida de una pila de 2400 mAh (días) según el periodo y la corriente de reposo</title><desc id="d">Tabla: con una pila de 2400 miliamperios hora y un nodo que despierta cada diez segundos la vida es de 198 días con una corriente de reposo de 2 microamperios y 166 con 100; despertando cada 600 segundos va de 7650 a 901 días, de modo que el reposo domina cuando el nodo despierta poco.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="321" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Periodo</tspan></text><rect x="200" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Reposo 2 µA</tspan></text><rect x="420" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">5 µA</tspan></text><rect x="600" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="687" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">20 µA</tspan></text><rect x="780" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">100 µA</tspan></text><rect x="10" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">10 s</tspan></text><rect x="200" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">198</tspan></text><rect x="420" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">197</tspan></text><rect x="600" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">191</tspan></text><rect x="780" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">166</tspan></text><rect x="10" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">60 s</tspan></text><rect x="200" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">1 135</tspan></text><rect x="420" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">1 098</tspan></text><rect x="600" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">943</tspan></text><rect x="780" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">538</tspan></text><rect x="10" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">600 s</tspan></text><rect x="200" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">7 650</tspan></text><rect x="420" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">6 222</tspan></text><rect x="600" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">3 219</tspan></text><rect x="780" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">901</tspan></text><rect x="10" y="210" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Con un despertar cada 10 s la corriente de reposo apenas cuenta: manda lo que se gasta despierto. Con 600 s, pasar de 2 a 100</tspan></text><text x="485" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">µA divide la vida por 8,5. Supuestos: 15 mA durante 120 ms y 80 mA durante 40 ms de radio, autodescarga del 1 % anual, sin</tspan></text><text x="485" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">envejecimiento ni temperatura.</tspan></text><text x="485" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
