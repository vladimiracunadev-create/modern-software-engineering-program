<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 263" width="960" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Respuesta de la tarea de prioridad alta con un mutex tomado por la de baja</title><desc id="d">Barras: la tarea de prioridad alta, con 2 milisegundos de trabajo y un mutex que retiene la de baja, responde en 15,1 milisegundos si una de prioridad media se libera mientras la baja tiene el mutex y en 7,0 si no; con herencia de prioridad responde siempre en 7,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="263" fill="#ffffff"/><text x="430" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Sin herencia, M liberada entre 2 y 5 ms</tspan></text><rect x="440" y="16" width="377.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="825.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="825.5" dy="0">15,1 ms</tspan></text><text x="430" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Sin herencia, M liberada entre 6 y 10 ms</tspan></text><rect x="440" y="60" width="175" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="623" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="623" dy="0">7,0 ms</tspan></text><text x="430" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Con herencia de prioridad, cualquier caso</tspan></text><rect x="440" y="104" width="175" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="623" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="623" dy="0">7,0 ms</tspan></text><rect x="10" y="152" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">La tarea media, que no necesita el mutex, retrasa a la alta durante todo su cómputo. La herencia de prioridad acota la espera</tspan></text><text x="480" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">a lo que dura la sección crítica de la baja. Simulación en pasos de 0,1 ms con tres tareas; no se midió ningún sistema</tspan></text><text x="480" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">operativo.</tspan></text><text x="480" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
