 y="204" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">62,5 %</tspan></text><polyline points="96.62,87 414.772,87 732.924,120.6 892,237.9" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="96.62,80.675 102.67,91.95 90.57,91.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="111" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0"> </tspan></text><polygon points="414.772,80.675 420.822,91.95 408.722,91.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="414.772" y="111" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="414.772" dy="0"> </tspan></text><polygon points="732.924,114.275 738.974,125.55 726.874,125.55" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="732.924" y="144.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="732.924" dy="0">88,8 %</tspan></text><polygon points="892,231.575 898.05,242.85 885.95,242.85" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="261.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">49,7 %</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La cota es suficiente pero no necesaria: por debajo de ella siempre se cumple y por encima a veces. Con U = 0,8 todos los</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">conjuntos sintéticos pasan aunque 0,8 supere la cota de las tres series (0,78, 0,743 y 0,724). El análisis exacto de tiempo</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">de respuesta decide cada caso; 2000 conjuntos por punto, periodos entre 10 y 1000.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
