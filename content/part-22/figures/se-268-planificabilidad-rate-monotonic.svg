<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Conjuntos de tareas rate-monotonic planificables según la utilización (análisis exacto)</title><desc id="d">Líneas con el porcentaje de conjuntos de tareas planificables por prioridades por periodo según la utilización total: con tres, cinco u ocho tareas lo son el 100 por ciento con utilización 0,7 y 0,8, aunque la cota de Liu y Layland sea 0,78, 0,743 y 0,724; con 0,9 lo son entre 88,8 y 92,5 por ciento y con 0,95 entre 49,7 y 73,0, y la caída es más fuerte cuantas más tareas hay.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Conjuntos de tareas rate-monotonic planificables según la utilización (análisis exacto)</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">3 tareas</tspan></text><rect x="124.32" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">5 tareas</tspan></text><polygon points="238.64,44.1 245.24,56.4 232.04,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="252.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="252.64" dy="0">8 tareas</t