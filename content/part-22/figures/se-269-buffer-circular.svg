<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 351" width="900" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Muestras perdidas por un búfer circular entre una ISR y un bucle con paradas</title><desc id="d">Barras: con una interrupción que produce 0,5 muestras por milisegundo y un bucle principal que vacía el búfer cada 15 milisegundos con paradas ocasionales de 100, un búfer de 8 muestras pierde el 27,31 por ciento, uno de 16 el 11,09, uno de 32 el 6,45, uno de 64 el 0,2 y uno de 128 ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="351" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Capacidad de 8 muestras</tspan></text><rect x="310" y="16" width="273.1" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="591.1" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="591.1" dy="0">27,31 %</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">16 muestras</tspan></text><rect x="310" y="60" width="110.9" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="428.9" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="428.9" dy="0">11,09 %</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">32 muestras</tspan></text><rect x="310" y="104" width="64.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="382.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="382.5" dy="0">6,45 %</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">64 muestras</tspan></text><rect x="310" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">0,2 %</tspan></text><text x="300" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">128 muestras</tspan></text><rect x="310" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">0,0 %</tspan></text><rect x="10" y="240" width="880" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">El tamaño necesario lo fija la parada más larga del bucle, no su período habitual: cada 100 ms de parada acumulan 50</tspan></text><text x="450" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">muestras. Un búfer que alcanza para el caso típico pierde datos justo cuando el sistema está ocupado. Modelo de 60 000</tspan></text><text x="450" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">muestras por capacidad.</tspan></text><text x="450" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
