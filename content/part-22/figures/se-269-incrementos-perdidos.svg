<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 287" width="1080" height="287" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Incrementos de una ISR perdidos al compartir un contador con el bucle principal</title><desc id="d">Tabla: al enumerar las diez posiciones en que una interrupción puede caer dentro de una vuelta de un bucle que lee, suma y escribe un contador, dos posiciones pierden el incremento de la rutina, y en 300 corridas se pierde el 9,9 por ciento; con una sección crítica no se pierde ninguno y la rutina se retrasa como máximo dos instrucciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="287" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Estrategia</tspan></text><rect x="440" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Posiciones con</tspan></text><text x="532" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">pérdida</tspan></text><rect x="630" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Incrementos perdidos</tspan></text><rect x="830" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="947" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="947" dy="0">Retraso máximo de la ISR</tspan></text><text x="947" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="947" dy="0">(instrucciones)</tspan></text><rect x="10" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Sin protección</tspan></text><rect x="440" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">2 de 10</tspan></text><rect x="630" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">9,9 %</tspan></text><rect x="830" y="56" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="947" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="947" dy="0">0</tspan></text><rect x="10" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Sección crítica con interrupciones enmascaradas</tspan></text><rect x="440" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">0 de 10</tspan></text><rect x="630" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0,0 %</tspan></text><rect x="830" y="114" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="947" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="947" dy="0">2</tspan></text><rect x="10" y="176" width="1060" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">El defecto solo existe en dos de diez posiciones, de modo que una prueba corta casi nunca lo ve. Enumerar las posiciones lo encuentra siempre.</tspan></text><text x="540" y="217.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">La sección crítica cuesta latencia de la rutina: acota esa espera o cambia a una estructura sin bloqueo. Modelo de instrucciones, no de un</tspan></text><text x="540" y="234.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">procesador concreto.</tspan></text><text x="540" y="273.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
