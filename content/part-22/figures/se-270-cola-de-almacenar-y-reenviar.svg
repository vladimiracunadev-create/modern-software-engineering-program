<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 379" width="1010" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Muestras perdidas por día según la capacidad de la cola de almacenar y reenviar</title><desc id="d">Barras: con una muestra por minuto y desconexiones de media 30 minutos, una cola de 5 muestras pierde el 17,53 por ciento del día, una de 30 el 7,45, una de 120 el 0,25 y una de 240 el 0,01; la latencia máxima de los datos reenviados crece de 4 a 85 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="379" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Cola de 5 muestras (latencia máxima 4 min)</tspan></text><rect x="480" y="16" width="438.25" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="926.25" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="926.25" dy="0">17,53 %</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">15 muestras (14 min)</tspan></text><rect x="480" y="60" width="312.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="800.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="800.5" dy="0">12,5 %</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">30 muestras (29 min)</tspan></text><rect x="480" y="104" width="186.25" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="674.25" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="674.25" dy="0">7,45 %</tspan></text><text x="470" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">60 muestras (56 min)</tspan></text><rect x="480" y="148" width="67" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="555" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="555" dy="0">2,68 %</tspan></text><text x="470" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">120 muestras (82 min)</tspan></text><rect x="480" y="192" width="6.25" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="494.25" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="494.25" dy="0">0,25 %</tspan></text><text x="470" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">240 muestras (85 min)</tspan></text><rect x="480" y="236" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="492" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">0,01 %</tspan></text><rect x="10" y="284" width="990" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="505" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">Más cola pierde menos datos pero los entrega más tarde: la capacidad se elige por la desconexión más larga que se quiere cubrir y por</tspan></text><text x="505" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">cuánto vale un dato viejo. Las desconexiones geométricas de media 30 min, 400 días simulados por capacidad, son un supuesto.</tspan></text><text x="505" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
