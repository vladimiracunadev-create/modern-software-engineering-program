 x="567" dy="0">29,58 %</tspan></text><rect x="670" y="240" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">3,37</tspan></text><rect x="10" y="286" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">30 %</tspan></text><rect x="160" y="286" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="217" dy="0">2</tspan></text><rect x="280" y="286" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">0,24 %</tspan></text><rect x="470" y="286" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">0 %</tspan></text><rect x="670" y="286" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">6,59</tspan></text><rect x="10" y="336" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Cada nivel compra una garantía con paquetes: el 2 no duplica y cuesta cuatro o seis veces el nivel 0. Con 30 % de pérdida el</tspan></text><text x="475" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">6,67 % de los mensajes del nivel 2 llega y el emisor no lo sabe (agotó los reintentos). Simulación del protocolo, no de un</tspan></text><text x="475" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">agente MQTT real.</tspan></text><text x="475" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
