<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 547" width="940" height="547" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Garantías de entrega sobre un enlace con pérdida (20 000 mensajes, hasta 5 envíos)</title><desc id="d">Barras agrupadas con el porcentaje de mensajes que no llegan y de duplicados según el nivel de garantía y la pérdida del enlace: con pérdida del 10 por ciento el nivel 0 no entrega el 9,96 por ciento, el nivel 1 duplica el 10,01 y el nivel 2 ni pierde ni duplica; con 30 por ciento el nivel 1 duplica el 29,58, y la garantía más fuerte cuesta de 1,00 a 6,59 paquetes por mensaje.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="547" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Garantías de entrega sobre un enlace con pérdida (20 000 mensajes, hasta 5 envíos)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">No llegó</tspan></text><rect x="124.32" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Duplicados</tspan></text><line x1="71.08" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="355" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="268.333" x2="920" y2="268.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="268.333" x2="71.08" y2="268.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="272.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="181.667" x2="920" y2="181.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="181.667" x2="71.08" y2="181.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="186.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">% de los 20 000 mensajes</text><rect x="85.2287" y="268.68" width="54.5947" height="86.32" rx="3" fill="#c0432f"/><text x="112.526" y="262.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112.526" dy="0">9,96</tspan></text><rect x="143.823" y="353" width="54.5947" height="2" rx="3" fill="#946512"/><text x="171.121" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="171.121" dy="0">0,00</tspan></text><text x="141.823" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="141.823" dy="0">10 % · nivel 0</tspan></text><text x="141.823" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="141.823" dy="0">1,00 paq./msj.</tspan></text><rect x="226.715" y="353" width="54.5947" height="2" rx="3" fill="#c0432f"/><text x="254.013" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="254.013" dy="0">0,00</tspan></text><rect x="285.31" y="268.247" width="54.5947" height="86.7533" rx="3" fill="#946512"/><text x="312.607" y="262.247" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312.607" dy="0">10,01</tspan></text><text x="283.31" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">10 % · nivel 1</tspan></text><text x="283.31" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">2,35 paq./msj.</tspan></text><rect x="368.202" y="353" width="54.5947" height="2" rx="3" fill="#c0432f"/><text x="395.499" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="395.499" dy="0">0,00</tspan></text><rect x="426.797" y="353" width="54.5947" height="2" rx="3" fill="#946512"/><text x="454.094" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="454.094" dy="0">0,00</tspan></text><text x="424.797" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.797" dy="0">10 % · nivel 2</tspan></text><text x="424.797" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.797" dy="0">4,69 paq./msj.</tspan></text><rect x="509.689" y="101.327" width="54.5947" height="253.673" rx="3" fill="#c0432f"/><text x="536.986" y="95.3267" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="536.986" dy="0">29,27</tspan></text><rect x="568.283" y="353" width="54.5947" height="2" rx="3" fill="#946512"/><text x="595.581" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="595.581" dy="0">0,00</tspan></text><text x="566.283" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="566.283" dy="0">30 % · nivel 0</tspan></text><text x="566.283" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="566.283" dy="0">1,00 paq./msj.</tspan></text><rect x="651.175" y="353" width="54.5947" height="2" rx="3" fill="#c0432f"/><text x="678.473" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.473" dy="0">0,16</tspan></text><rect x="709.77" y="98.64" width="54.5947" height="256.36" rx="3" fill="#946512"/><text x="737.067" y="92.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="737.067" dy="0">29,58</tspan></text><text x="707.77" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">30 % · nivel 1</tspan></text><text x="707.77" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">3,37 paq./msj.</tspan></text><rect x="792.662" y="352.92" width="54.5947" height="2.08" rx="3" fill="#c0432f"/><text x="819.959" y="346.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819.959" dy="0">0,24</tspan></text><rect x="851.257" y="353" width="54.5947" height="2" rx="3" fill="#946512"/><text x="878.554" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="878.554" dy="0">0,00</tspan></text><text x="849.257" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="849.257" dy="0">30 % · nivel 2</tspan></text><text x="849.257" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="849.257" dy="0">6,59 paq./msj.</tspan></text><rect x="10" y="424" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada nivel compra una garantía con paquetes: el 2 no duplica y cuesta cuatro o seis veces el nivel 0. Con 30 % de pérdida</tspan></text><text x="470" y="465.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el 6,67 % de los mensajes del nivel 2 llega y el emisor no lo sabe (agotó los reintentos). Simulación del protocolo, no de</tspan></text><text x="470" y="482.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un agente MQTT real.</tspan></text><text x="470" y="529.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
