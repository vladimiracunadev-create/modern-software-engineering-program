<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 447" width="950" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Garantías de entrega sobre un enlace con pérdida (20 000 mensajes, hasta 5 envíos)</title><desc id="d">Tabla: con pérdida del 10 por ciento por sentido, un nivel 0 no entrega el 9,96 por ciento, el nivel 1 entrega siempre pero duplica el 10,01 por ciento y usa 2,35 paquetes por mensaje, y el nivel 2 no duplica y usa 4,69; con pérdida del 30 por ciento el nivel 1 duplica el 29,58 y el 2 deja el 6,67 por ciento sin que el emisor lo sepa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="447" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Pérdida</tspan></text><rect x="160" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Nivel</tspan></text><rect x="280" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">No llegó</tspan></text><rect x="470" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0