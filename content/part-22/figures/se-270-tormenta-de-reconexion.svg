<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dispositivos conectados a los 900 s tras una caída de 5000 (servidor: 200 intentos por segundo)</title><desc id="d">Barras horizontales con los dispositivos conectados a los 900 segundos tras una caída que termina a la vez: con reintento fijo cada 5 segundos y con espera exponencial con jitter completo están los 5000 (todos conectados en 245 y en 169 segundos); con espera exponencial sin jitter solo 691, porque los reintentos siguen sincronizados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dispositivos conectados a los 900 s tras una caída de 5000 (servidor: 200 intentos por segundo)</tspan></text><line x1="324" y1="49" x2="324" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="181" x2="324" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="49" x2="434.34" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="181" x2="434.34" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="434.34" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.34" dy="0">1 000</tspan></text><line x1="544.68" y1="49" x2="544.68" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="544.68" y1="181" x2="544.68" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="544.68" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.68" dy="0">2 000</tspan></text><line x1="655.02" y1="49" x2="655.02" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="655.02" y1="181" x2="655.02" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="655.02" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.02" dy="0">3 000</tspan></text><line x1="765.36" y1="49" x2="765.36" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="765.36" y1="181" x2="765.36" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="765.36" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.36" dy="0">4 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="181" x2="875.7" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5 000</tspan></text><line x1="324" y1="181" x2="875.7" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Fijo cada 5 s (todos conectados en 245 s)</tspan></text><text x="314" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Exponencial sin jitter (no termina)</tspan></text><text x="314" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Exponencial con jitter completo (todos en</tspan></text><text x="314" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">169 s)</tspan></text><rect x="324" y="55" width="551.7" height="32" rx="3" fill="#087f8c"/><text x="882.7" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5 000</tspan></text><rect x="324" y="99" width="76.2449" height="32" rx="3" fill="#087f8c"/><text x="407.245" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.245" dy="0">691</tspan></text><rect x="324" y="143" width="551.7" height="32" rx="3" fill="#087f8c"/><text x="882.7" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5 000</tspan></text><text x="599.85" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Dispositivos conectados a los 900 s (de 5 000)</tspan></text><rect x="10" y="239" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El pico del primer segundo es el mismo en las tres políticas (5 000 intentos) porque todas empiezan a la vez. Sin jitter,</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la espera exponencial mantiene a todos los dispositivos en las mismas olas: el servidor se satura en cada una. El jitter</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reparte los intentos en el tiempo. El colapso de la capacidad por encima de 1,5 veces la carga admisible es un supuesto del</tspan></text><text x="470" y="313.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">modelo.</tspan></text><text x="470" y="361.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
