<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 434" width="940" height="434" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Corte de energía en cada paso posible de una actualización (enumeración exhaustiva)</title><desc id="d">Barras horizontales apiladas con el estado en que queda el dispositivo según el punto de corte: una sola ranura que sobrescribe deja 17 de 19 puntos de corte con el dispositivo inservible; dos ranuras con indicador atómico, ninguno de 19; con un indicador de dos bytes sin validar queda 1 de 20 inválido y al validarlo ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="434" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Corte de energía en cada paso posible de una actualización (enumeración exhaustiva)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Queda la antigua</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Queda la nueva</tspan></text><rect x="338.2" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="358.2" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="358.2" dy="0">Queda inservible</tspan></text><line x1="324" y1="77" x2="324" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="253" x2="324" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="461.925" y1="77" x2="461.925" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="461.925" y1="253" x2="461.925" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="461.925" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.925" dy="0">5</tspan></text><line x1="599.85" y1="77" x2="599.85" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="599.85" y1="253" x2="599.85" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="599.85" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="599.85" dy="0">10</tspan></text><line x1="737.775" y1="77" x2="737.775" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="737.775" y1="253" x2="737.775" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="737.775" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737.775" dy="0">15</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="253" x2="875.7" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">20</tspan></text><line x1="324" y1="253" x2="875.7" y2="253" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Una sola ranura (sobrescribe)</tspan></text><text x="314" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Dos ranuras, indicador atómico</tspan></text><text x="314" y="183" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Dos ranuras, indicador de 2 bytes sin</tspan></text><text x="314" y="200" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">validar</tspan></text><text x="314" y="227" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Dos ranuras, indicador de 2 bytes</tspan></text><text x="314" y="244" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">validado</tspan></text><rect x="324" y="84" width="27.585" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="337.793" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337.793" dy="0">1</tspan></text><rect x="351.585" y="84" width="27.585" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="365.377" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="365.377" dy="0">1</tspan></text><rect x="379.17" y="84" width="468.945" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="613.643" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="613.643" dy="0">17</tspan></text><text x="855.115" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="855.115" dy="0">19</tspan></text><rect x="324" y="128" width="496.53" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="572.265" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572.265" dy="0">18</tspan></text><rect x="820.53" y="128" width="27.585" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="834.322" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="834.322" dy="0">1</tspan></text><rect x="848.115" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="855.115" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="855.115" dy="0">19</tspan></text><rect x="324" y="172" width="496.53" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="572.265" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572.265" dy="0">18</tspan></text><rect x="820.53" y="172" width="27.585" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="834.322" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="834.322" dy="0">1</tspan></text><rect x="848.115" y="172" width="27.585" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="861.908" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="861.908" dy="0">1</tspan></text><text x="882.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="324" y="216" width="524.115" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="586.058" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="586.058" dy="0">19</tspan></text><rect x="848.115" y="216" width="27.585" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="861.908" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="861.908" dy="0">1</tspan></text><rect x="875.7" y="216" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><text x="599.85" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Puntos de corte posibles</tspan></text><rect x="10" y="311" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La enumeración prueba todos los cortes posibles, no una muestra: el defecto del indicador de dos bytes existe en un solo</tspan></text><text x="470" y="352.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">punto de veinte y una prueba con cortes al azar lo vería pocas veces. Es un modelo de pasos, no de una memoria flash</tspan></text><text x="470" y="369.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">concreta con su orden de programación.</tspan></text><text x="470" y="416.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
