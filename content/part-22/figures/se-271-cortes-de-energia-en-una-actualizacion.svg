<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 387" width="1140" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Corte de energía en cada paso posible de una actualización (enumeración exhaustiva)</title><desc id="d">Tabla: al cortar la energía en cada uno de los pasos de una actualización, una sola ranura que sobrescribe deja el dispositivo inutilizable en 17 de 19 puntos de corte; con dos ranuras y un indicador atómico ninguno, y con un indicador de dos bytes sin validar queda un punto de corte inválido que desaparece al validarlo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1140" height="387" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Estrategia</tspan></text><rect x="410" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Puntos de corte</tspan></text><rect x="560" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Queda la antigua</tspan></text><rect x="740" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Queda la nueva</tspan></text><rect x="900" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="1012" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="1012" dy="0">Queda inservible</tspan></text><rect x="10" y="56" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Una sola ranura (sobrescribe)</tspan></text><rect x="410" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">19</tspan></text><rect x="560" y="56" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">1</tspan></text><rect x="740" y="56" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1</tspan></text><rect x="900" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="1012" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="1012" dy="0">17 (inutilizable)</tspan></text><rect x="10" y="114" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Dos ranuras, indicador atómico</tspan></text><rect x="410" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">19</tspan></text><rect x="560" y="114" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">18</tspan></text><rect x="740" y="114" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1</tspan></text><rect x="900" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="1012" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="1012" dy="0">0</tspan></text><rect x="10" y="172" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Dos ranuras, indicador de 2 bytes sin validar</tspan></text><rect x="410" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">20</tspan></text><rect x="560" y="172" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">18</tspan></text><rect x="740" y="172" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1</tspan></text><rect x="900" y="172" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="1012" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="1012" dy="0">1 (indicador inválido)</tspan></text><rect x="10" y="230" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Dos ranuras, indicador de 2 bytes validado</tspan></text><rect x="410" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">20</tspan></text><rect x="560" y="230" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">19</tspan></text><rect x="740" y="230" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1</tspan></text><rect x="900" y="230" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="1012" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="1012" dy="0">0</tspan></text><rect x="10" y="292" width="1120" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="570" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="570" dy="0">La enumeración prueba todos los cortes posibles, no una muestra: el defecto del indicador de dos bytes existe en un solo punto de veinte y una prueba</tspan></text><text x="570" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="570" dy="0">con cortes al azar lo vería pocas veces. Es un modelo de pasos, no de una memoria flash concreta con su orden de programación.</tspan></text><text x="570" y="373.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="570" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
