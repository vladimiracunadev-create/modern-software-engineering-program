<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dispositivos suplantables tras extraer k claves de una flota de 10 000</title><desc id="d">Barras agrupadas en escala logarítmica con los dispositivos suplantables según las claves extraídas: con una clave de flota, una sola extracción permite suplantar a los 10 000; con claves por dispositivo, 1, 10 o 100 claves permiten suplantar exactamente 1, 10 o 100; con claves derivadas, si la clave maestra sale del dispositivo, vuelven a ser 10 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dispositivos suplantables tras extraer k claves de una flota de 10 000</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Una clave de flota</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Claves por dispositivo</tspan></text><rect x="413.6" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="433.6" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="433.6" dy="0">Derivadas, con la maestra extraída</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="305" x2="101.24" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="235" x2="101.24" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="165" x2="101.24" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Dispositivos suplantables (de 10 000) (escala logarítmica)</text><rect x="128.532" y="95" width="70.112" height="280" rx="3" fill="#c0432f"/><text x="163.588" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="163.588" dy="0">10 000</tspan></text><rect x="202.644" y="373" width="70.112" height="2" rx="3" fill="#087f8c"/><text x="237.7" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237.7" dy="0">1</tspan></text><rect x="276.756" y="95" width="70.112" height="280" rx="3" fill="#102a43"/><text x="311.812" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="311.812" dy="0">10 000</tspan></text><text x="237.7" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">1 clave extraída</tspan></text><rect x="401.452" y="95" width="70.112" height="280" rx="3" fill="#c0432f"/><text x="436.508" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="436.508" dy="0">10 000</tspan></text><rect x="475.564" y="305" width="70.112" height="70" rx="3" fill="#087f8c"/><text x="510.62" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="510.62" dy="0">10</tspan></text><rect x="549.676" y="95" width="70.112" height="280" rx="3" fill="#102a43"/><text x="584.732" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="584.732" dy="0">10 000</tspan></text><text x="510.62" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">10 claves extraídas</tspan></text><rect x="674.372" y="95" width="70.112" height="280" rx="3" fill="#c0432f"/><text x="709.428" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.428" dy="0">10 000</tspan></text><rect x="748.484" y="235" width="70.112" height="140" rx="3" fill="#087f8c"/><text x="783.54" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="783.54" dy="0">100</tspan></text><rect x="822.596" y="95" width="70.112" height="280" rx="3" fill="#102a43"/><text x="857.652" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.652" dy="0">10 000</tspan></text><text x="783.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">100 claves extraídas</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La clave por dispositivo limita el daño de una extracción a un dispositivo, siempre que la clave maestra nunca esté en</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ninguno. Las firmas son HMAC-SHA256 reales; la flota, la extracción y los números son sintéticos y no se atacó ningún chip.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
