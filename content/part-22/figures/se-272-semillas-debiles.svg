<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 321" width="1000" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Claves de 64 bits generadas con una semilla débil (5000 dispositivos)</title><desc id="d">Tabla: si 5000 dispositivos generan una clave de 64 bits con el segundo de arranque como semilla, con una ventana de una hora hay 2279 claves repetidas y quien enumere las 3600 semillas recupera las 5000 claves; con un día quedan 149 repetidas y se recupera el 3,94 por ciento; con una semilla de 32 bits no hay repetidas ni recuperadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="321" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Origen de la semilla</tspan></text><rect x="440" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Claves repetidas</tspan></text><rect x="630" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Recuperadas enumerando 3 600 semillas</tspan></text><rect x="10" y="56" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Segundo de arranque en 1 hora (3 600)</tspan></text><rect x="440" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">2 279</tspan></text><rect x="630" y="56" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">5 000 (100 %)</tspan></text><rect x="10" y="106" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Segundo de arranque en 1 día (86 400)</tspan></text><rect x="440" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">149</tspan></text><rect x="630" y="106" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">197 (3,94 %)</tspan></text><rect x="10" y="156" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Semilla de 32 bits</tspan></text><rect x="440" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">0</tspan></text><rect x="630" y="156" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0 (0 %)</tspan></text><rect x="10" y="210" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Una clave de 64 bits con una semilla de 3600 posibilidades tiene la seguridad de 12 bits: la longitud de la clave no importa si la</tspan></text><text x="500" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">semilla es predecible. Se usó el generador estándar de Python solo para ilustrar el mecanismo; no es un generador criptográfico y</tspan></text><text x="500" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">ningún dispositivo real lo hace así.</tspan></text><text x="500" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
