<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Claves de 64 bits generadas con una semilla débil (5000 dispositivos)</title><desc id="d">Barras agrupadas con las claves repetidas y las recuperadas por enumeración de 3 600 semillas, de 5000 dispositivos: con el segundo de arranque dentro de una hora hay 2279 repetidas y se recuperan las 5000; con un día, 149 repetidas y 197 recuperadas (3,94 por ciento); con una semilla de 32 bits, ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Claves de 64 bits generadas con una semilla débil (5000 dispositivos)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Claves repetidas</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Recuperadas enumerando 3 600 semillas</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="319" x2="93.7" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="263" x2="93.7" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="207" x2="93.7" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3 000</tspan></text><line x1="93.7" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="151" x2="93.7" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">4 000</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">5 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Dispositivos (de 5 000)</text><rect x="121.243" y="247.376" width="108.173" height="127.624" rx="3" fill="#946512"/><text x="175.33" y="241.376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.33" dy="0">2 279</tspan></text><rect x="233.417" y="95" width="108.173" height="280" rx="3" fill="#c0432f"/><text x="287.503" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287.503" dy="0">5 000</tspan></text><text x="231.417" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Segundo de arranque dentro de 1 hora</tspan></text><rect x="396.677" y="366.656" width="108.173" height="8.344" rx="3" fill="#946512"/><text x="450.763" y="360.656" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.763" dy="0">149</tspan></text><rect x="508.85" y="363.968" width="108.173" height="11.032" rx="3" fill="#c0432f"/><text x="562.937" y="357.968" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.937" dy="0">197</tspan></text><text x="506.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Segundo de arranque dentro de 1 día</tspan></text><rect x="672.11" y="373" width="108.173" height="2" rx="3" fill="#946512"/><text x="726.197" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.197" dy="0">0</tspan></text><rect x="784.283" y="373" width="108.173" height="2" rx="3" fill="#c0432f"/><text x="838.37" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.37" dy="0">0</tspan></text><text x="782.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Semilla de 32 bits</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una clave de 64 bits con una semilla de 3600 posibilidades tiene la seguridad de 12 bits: la longitud de la clave no</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">importa si la semilla es predecible. Se usó el generador estándar de Python solo para ilustrar el mecanismo; no es un</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">generador criptográfico y ningún dispositivo real lo hace así.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
