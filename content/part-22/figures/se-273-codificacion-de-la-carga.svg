<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bytes por muestra según la codificación y el tamaño del lote</title><desc id="d">Barras agrupadas con los bytes por muestra de una lectura de cinco magnitudes: JSON ocupa unos 85 con cualquier lote y binario 13; comprimir un lote de 60 muestras baja el JSON a 14,9 y el binario a 10,5, pero con una sola muestra el JSON comprimido ocupa 83,0 y el binario comprimido 21,0, más que el binario sin comprimir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Bytes por muestra según la codificación y el tamaño del lote</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">JSON</tspan></text><rect x="94.16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="114.16" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="114.16" dy="0">Binario</tspan></text><rect x="194.94" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="214.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="214.94" dy="0">JSON comprimido</tspan></text><rect x="356.04" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="376.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="376.04" dy="0">Binario comprimido</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Bytes por muestra</text><rect x="106.666" y="137" width="53.092" height="238" rx="3" fill="#c0432f"/><text x="133.212" y="131" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="133.212" dy="0">85,0</tspan></text><rect x="163.758" y="338.6" width="53.092" height="36.4" rx="3" fill="#087f8c"/><text x="190.304" y="332.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="190.304" dy="0">13,0</tspan></text><rect x="220.85" y="142.6" width="53.092" height="232.4" rx="3" fill="#946512"/><text x="247.396" y="136.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247.396" dy="0">83,0</tspan></text><rect x="277.942" y="316.2" width="53.092" height="58.8" rx="3" fill="#102a43"/><text x="304.488" y="310.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="304.488" dy="0">21,0</tspan></text><text x="218.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Lote de 1 muestra</tspan></text><rect x="387.126" y="137.28" width="53.092" height="237.72" rx="3" fill="#c0432f"/><text x="413.672" y="131.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="413.672" dy="0">84,9</tspan></text><rect x="444.218" y="338.6" width="53.092" height="36.4" rx="3" fill="#087f8c"/><text x="470.764" y="332.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470.764" dy="0">13,0</tspan></text><rect x="501.31" y="310.6" width="53.092" height="64.4" rx="3" fill="#946512"/><text x="527.856" y="304.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="527.856" dy="0">23,0</tspan></text><rect x="558.402" y="338.6" width="53.092" height="36.4" rx="3" fill="#102a43"/><text x="584.948" y="332.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="584.948" dy="0">13,0</tspan></text><text x="499.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Lote de 10 muestras</tspan></text><rect x="667.586" y="137.84" width="53.092" height="237.16" rx="3" fill="#c0432f"/><text x="694.132" y="131.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="694.132" dy="0">84,7</tspan></text><rect x="724.678" y="338.6" width="53.092" height="36.4" rx="3" fill="#087f8c"/><text x="751.224" y="332.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="751.224" dy="0">13,0</tspan></text><rect x="781.77" y="333.28" width="53.092" height="41.72" rx="3" fill="#946512"/><text x="808.316" y="327.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="808.316" dy="0">14,9</tspan></text><rect x="838.862" y="345.6" width="53.092" height="29.4" rx="3" fill="#102a43"/><text x="865.408" y="339.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="865.408" dy="0">10,5</tspan></text><text x="779.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Lote de 60 muestras</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El formato compacto ahorra más que comprimir cuando el lote es pequeño; comprimir ayuda cuando hay muchas muestras</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">parecidas y a cambio exige memoria y energía en el dispositivo. Lecturas sintéticas con ruido gaussiano; la compresión es</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">zlib en el nivel 9.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
