<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 247" width="950" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Decisiones de control que cumplen un plazo de 100 ms (100 000 decisiones)</title><desc id="d">Barras: con un plazo de 100 milisegundos, una decisión local lo cumple el 100 por ciento de las veces, una que depende de la nube el 61,41 por ciento, con un percentil 99 de ida y vuelta de 256,7 milisegundos y la nube caída el 5 por ciento del tiempo, y una nube con respaldo local el 100 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="247" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Decisión local</tspan></text><rect x="310" y="16" width="500" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="818" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="818" dy="0">100,0 %</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Decisión solo en la nube</tspan></text><rect x="310" y="60" width="307.05" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="625.05" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="625.05" dy="0">61,41 %</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Nube con respaldo local</tspan></text><rect x="310" y="104" width="500" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="818" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="818" dy="0">100,0 %</tspan></text><rect x="10" y="152" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">La nube incumple por la latencia (mediana de 80 ms con cola larga) y por las caídas; el respaldo local cumple siempre, pero</tspan></text><text x="475" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">decide con menos información. Latencias lognormales y caídas del 5 % supuestas, no medidas en ninguna red.</tspan></text><text x="475" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
