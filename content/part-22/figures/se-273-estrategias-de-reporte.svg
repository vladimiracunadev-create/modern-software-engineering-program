<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 607" width="940" height="607" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo en bytes frente al error de reconstrucción de cinco estrategias de reporte</title><desc id="d">Dispersión con los bytes enviados al día, en escala logarítmica, frente al error medio de reconstrucción de una señal de 1 Hz: enviar cada segundo cuesta 691 200 bytes y no tiene error; la banda muerta de 0,5 cuesta 1 250 con error 0,140; la media por minuto, 11 520 con error 0,089, y el máximo por minuto, 11 520 con 0,250. Ninguna estrategia gana en las dos medidas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="607" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo en bytes frente al error de reconstrucción de cinco estrategias de reporte</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cada segundo</tspan></text><rect x="154.48" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Media por minuto</tspan></text><polygon points="329.12,44.1 335.72,56.4 322.52,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="343.12" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="343.12" dy="0">Máximo por minuto</tspan></text><polygon points="505.3,43.5 512.8,51 505.3,58.5 497.8,51" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="519.3" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="519.3" dy="0">Banda muerta de 0,5</tspan></text><path d="M690.56,45 L702.56,57 M702.56,45 L690.56,57" stroke="#6b7c86" stroke-width="2.4" fill="none"/><text x="710.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="710.56" dy="0">Media por minuto y evento</tspan></text><line x1="78.62" y1="407" x2="910" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="407" x2="78.62" y2="407" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="300.333" x2="910" y2="300.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="300.333" x2="78.62" y2="300.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="304.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,1</tspan></text><line x1="78.62" y1="193.667" x2="910" y2="193.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="193.667" x2="78.62" y2="193.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="198.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,2</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,3</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="407" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="407" x2="96.62" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1 000</tspan></text><line x1="361.747" y1="87" x2="361.747" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="361.747" y1="407" x2="361.747" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="361.747" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="361.747" dy="0">10 000</tspan></text><line x1="626.873" y1="87" x2="626.873" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="626.873" y1="407" x2="626.873" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="626.873" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.873" dy="0">100 000</tspan></text><line x1="892" y1="87" x2="892" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="407" x2="892" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1 000 000</tspan></text><line x1="78.62" y1="407" x2="910" y2="407" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 247)">Error medio de reconstrucción (°C)</text><text x="494.31" y="453" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Bytes enviados al día (escala logarítmica)</tspan></text><circle cx="849.475" cy="407" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="839.475" y="411.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="839.475" dy="0">Cada segundo · aviso 0 s</tspan></text><rect x="372.539" y="306.567" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="368.039" y="316.567" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="368.039" dy="0">Media por minuto · 22 s</tspan></text><polygon points="378.039,134.008 384.089,145.283 371.989,145.283" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="388.039" y="144.833" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="388.039" dy="0">Máximo por minuto · 22 s</tspan></text><polygon points="122.313,250.792 129.188,257.667 122.313,264.542 115.438,257.667" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="132.313" y="262.167" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="132.313" dy="0">Banda muerta de 0,5 · 0 s</tspan></text><path d="M373.416,294.833 L384.416,305.833 M384.416,294.833 L373.416,305.833" stroke="#6b7c86" stroke-width="2.4" fill="none"/><text x="388.916" y="304.833" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="388.916" dy="0">Media y evento · 22 s</tspan></text><rect x="10" y="467" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El rótulo de cada punto añade el retraso mediano de aviso. La banda muerta reduce los bytes 550 veces y avisa de inmediato,</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pero reconstruye peor la señal lenta. La media por minuto la reconstruye mejor y retrasa el aviso. No hay estrategia que</tspan></text><text x="470" y="525.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">gane en todo: se elige según lo que se decide con los datos. Señal sintética con ocho picos de 3 °C; las cinco detectan los</tspan></text><text x="470" y="541.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ocho eventos.</tspan></text><text x="470" y="589.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
