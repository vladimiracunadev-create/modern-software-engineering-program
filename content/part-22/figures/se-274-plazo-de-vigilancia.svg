<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Horas perdidas por año según el plazo del temporizador de vigilancia</title><desc id="d">Línea en doble escala logarítmica con las horas perdidas por año según el plazo del temporizador de vigilancia: un plazo de 0,1 segundos pierde 8,78 horas por reinicios falsos (17,3 al día), uno de 1 segundo 1,17, uno de 5 segundos 0,06 y uno de 10 segundos 0,05, pero con 10 segundos un cuelgue tarda 15 en resolverse.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Horas perdidas por año según el plazo del temporizador de vigilancia</tspan></text><line x1="86.16" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="359" x2="86.16" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,01</tspan></text><line x1="86.16" y1="259" x2="910" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="259" x2="86.16" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,1</tspan></text><line x1="86.16" y1="159" x2="910" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="159" x2="86.16" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1</tspan></text><line x1="86.16" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="59" x2="86.16" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">10</tspan></text><line x1="86.16" y1="59" x2="86.16" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="104.16" y1="59" x2="104.16" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="104.16" y1="359" x2="104.16" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="104.16" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.16" dy="0">0,1</tspan></text><line x1="379.498" y1="59" x2="379.498" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="379.498" y1="359" x2="379.498" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="379.498" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="379.498" dy="0">0,5</tspan></text><line x1="498.08" y1="59" x2="498.08" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="498.08" y1="359" x2="498.08" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="498.08" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498.08" dy="0">1</tspan></text><line x1="616.662" y1="59" x2="616.662" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="616.662" y1="359" x2="616.662" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="616.662" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="616.662" dy="0">2</tspan></text><line x1="773.418" y1="59" x2="773.418" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="773.418" y1="359" x2="773.418" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="773.418" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="773.418" dy="0">5</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">10</tspan></text><line x1="86.16" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Horas perdidas por año (escala logarítmica)</text><text x="498.08" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="498.08" dy="0">Plazo del temporizador de vigilancia (s) (escala logarítmica)</tspan></text><polyline points="104.16,64.6505 379.498,109.864 498.08,152.181 616.662,208.485 773.418,281.185 892,289.103" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="104.16" cy="64.6505" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="104.16" y="53.6505" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">8,78</tspan></text><circle cx="379.498" cy="109.864" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="379.498" y="98.8638" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="379.498" dy="0">3,10</tspan></text><circle cx="498.08" cy="152.181" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="498.08" y="141.181" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="498.08" dy="0">1,17</tspan></text><circle cx="616.662" cy="208.485" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="616.662" y="197.485" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="616.662" dy="0">0,32</tspan></text><circle cx="773.418" cy="281.185" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="773.418" y="270.185" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="773.418" dy="0">0,06</tspan></text><circle cx="892" cy="289.103" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="313.103" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,05</tspan></text><text x="164.16" y="124.651" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="164.16" dy="0">0,1 s: 17,3 reinicios</tspan></text><text x="164.16" y="141.651" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="164.16" dy="0">falsos por día; un cuelgue</tspan></text><text x="164.16" y="158.651" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="164.16" dy="0">se resuelve en 5,1 s</tspan></text><line x1="108.32" y1="69.0505" x2="156.16" y2="119.651" stroke="#5c1f14" stroke-width="1.2"/><text x="862" y="189.103" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="862" dy="0">10 s: casi sin reinicios</tspan></text><text x="862" y="206.103" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="862" dy="0">falsos, pero un cuelgue</tspan></text><text x="862" y="223.103" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="862" dy="0">tarda 15 s</tspan></text><line x1="890.24" y1="280.703" x2="870" y2="184.103" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un plazo corto reacciona rápido y reinicia sin motivo las operaciones largas legítimas; uno largo casi no se equivoca y</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tarda en actuar. El percentil 99,9 de las operaciones es 6,6 s: un plazo de 5 s aún reinicia una de cada mil. Un cuelgue al</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mes y 20 operaciones largas al día son supuestos.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
