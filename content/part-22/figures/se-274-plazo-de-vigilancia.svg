<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 447" width="1030" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Plazo del temporizador de vigilancia: reinicios falsos y horas perdidas por año</title><desc id="d">Tabla: con operaciones largas de mediana 0,3 segundos y cola larga, un plazo de vigilancia de 0,1 segundos produce 17,3 reinicios falsos por día y 8,78 horas perdidas por año; con 5 segundos, 0,047 reinicios y 0,06 horas, pero un cuelgue tarda 10 segundos en resolverse; la operación más larga observada fue de 35,3 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="447" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Plazo</tspan></text><rect x="160" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="302" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="302" dy="0">Reinicios falsos por día</tspan></text><rect x="450" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Indisponibilidad por cuelgue</tspan></text><rect x="770" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="892" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="892" dy="0">Horas perdidas por año</tspan></text><rect x="10" y="56" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">0,1 s</tspan></text><rect x="160" y="56" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">17,289</tspan></text><rect x="450" y="56" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">5,1 s</tspan></text><rect x="770" y="56" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">8,78</tspan></text><rect x="10" y="102" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">0,5 s</tspan></text><rect x="160" y="102" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">6,086</tspan></text><rect x="450" y="102" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">5,5 s</tspan></text><rect x="770" y="102" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">3,10</tspan></text><rect x="10" y="148" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">1 s</tspan></text><rect x="160" y="148" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">2,268</tspan></text><rect x="450" y="148" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">6,0 s</tspan></text><rect x="770" y="148" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1,17</tspan></text><rect x="10" y="194" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">2 s</tspan></text><rect x="160" y="194" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">0,581</tspan></text><rect x="450" y="194" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">7,0 s</tspan></text><rect x="770" y="194" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0,32</tspan></text><rect x="10" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">5 s</tspan></text><rect x="160" y="240" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">0,047</tspan></text><rect x="450" y="240" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">10,0 s</tspan></text><rect x="770" y="240" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0,06</tspan></text><rect x="10" y="286" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">10 s</tspan></text><rect x="160" y="286" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">0,003</tspan></text><rect x="450" y="286" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">15,0 s</tspan></text><rect x="770" y="286" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0,05</tspan></text><rect x="10" y="336" width="1010" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="515" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">Un plazo corto reacciona rápido y reinicia sin motivo las operaciones largas legítimas; uno largo casi no se equivoca y tarda en</tspan></text><text x="515" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">actuar. El percentil 99,9 de las operaciones es 6,6 s: un plazo de 5 s aún reinicia una de cada mil. Un cuelgue al mes y 20 operaciones</tspan></text><text x="515" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">largas al día son supuestos.</tspan></text><text x="515" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
