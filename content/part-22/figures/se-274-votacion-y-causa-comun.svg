<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fallo peligroso no detectado en una misión: un sensor frente a votación 2 de 3</title><desc id="d">Barras agrupadas con la probabilidad de fallo peligroso no detectado según la fracción de fallos de causa común, con probabilidad de fallo de 0,1 por sensor: un sensor se queda en unos 0,099; la votación de dos de tres baja a 0,0278 con fallos independientes, 3,6 veces menos, y sube a 0,0380 con 20 por ciento de causa común, con una mejora de 2,6 veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Fallo peligroso no detectado en una misión: un sensor frente a votación 2 de 3</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Un sensor</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">2 de 3 simulado</tspan></text><rect x="292.96" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="312.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="312.96" dy="0">2 de 3 analítico</tspan></text><line x1="86.16" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="375" x2="86.16" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0</tspan></text><line x1="86.16" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="319" x2="86.16" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,02</tspan></text><line x1="86.16" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="263" x2="86.16" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,04</tspan></text><line x1="86.16" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="207" x2="86.16" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,06</tspan></text><line x1="86.16" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="151" x2="86.16" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,08</tspan></text><line x1="86.16" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="95" x2="86.16" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,1</tspan></text><line x1="86.16" y1="95" x2="86.16" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Probabilidad de fallo peligroso no detectado</text><rect x="113.955" y="95.56" width="71.4524" height="279.44" rx="3" fill="#c0432f"/><text x="149.681" y="89.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149.681" dy="0">0,0998</tspan></text><rect x="189.407" y="297.16" width="71.4524" height="77.84" rx="3" fill="#087f8c"/><text x="225.133" y="291.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="225.133" dy="0">0,0278</tspan></text><rect x="264.86" y="291" width="71.4524" height="84" rx="3" fill="#102a43"/><text x="300.586" y="285" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="300.586" dy="0">0,0300</tspan></text><text x="225.133" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="225.133" dy="0">Sin causa común (0 %)</tspan></text><rect x="391.901" y="95.84" width="71.4524" height="279.16" rx="3" fill="#c0432f"/><text x="427.628" y="89.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="427.628" dy="0">0,0997</tspan></text><rect x="467.354" y="290.16" width="71.4524" height="84.84" rx="3" fill="#087f8c"/><text x="503.08" y="284.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="503.08" dy="0">0,0303</tspan></text><rect x="542.806" y="285.12" width="71.4524" height="89.88" rx="3" fill="#102a43"/><text x="578.532" y="279.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="578.532" dy="0">0,0321</tspan></text><text x="503.08" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="503.08" dy="0">5 % de causa común</tspan></text><rect x="669.848" y="98.36" width="71.4524" height="276.64" rx="3" fill="#c0432f"/><text x="705.574" y="92.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705.574" dy="0">0,0988</tspan></text><rect x="745.3" y="268.6" width="71.4524" height="106.4" rx="3" fill="#087f8c"/><text x="781.027" y="262.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="781.027" dy="0">0,0380</tspan></text><rect x="820.753" y="265.24" width="71.4524" height="109.76" rx="3" fill="#102a43"/><text x="856.479" y="259.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.479" dy="0">0,0392</tspan></text><text x="781.027" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="781.027" dy="0">20 % de causa común</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La redundancia no triplica la seguridad: con p = 0,1 solo la divide por 3,6 (3,3 con 5 % y 2,6 con 20 % de causa común), y</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la causa común (misma fuente de alimentación, mismo error de calibración, mismo software) se come la mejora. Un millón de</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">misiones por grupo; p = 0,1 es alto a propósito para poder medirlo.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
