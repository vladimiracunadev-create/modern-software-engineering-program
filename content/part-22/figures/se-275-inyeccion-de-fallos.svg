#ffffff"><tspan x="771.5" dy="0">100</tspan></text><rect x="822.5" y="271.5" width="96" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="870.5" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="870.5" dy="0">100</tspan></text><text x="20" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 204)">Comprobaciones activas (acumulativas)</text><text x="326" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="326" dy="0">0</tspan></text><rect x="341.54" y="328" width="30.5" height="14" fill="#dff1ee"/><rect x="371.54" y="328" width="30.5" height="14" fill="#c0e1e0"/><rect x="401.54" y="328" width="30.5" height="14" fill="#a2d0d2"/><rect x="431.54" y="328" width="30.5" height="14" fill="#83c0c4"/><rect x="461.54" y="328" width="30.5" height="14" fill="#64b0b6"/><rect x="491.54" y="328" width="30.5" height="14" fill="#45a0a8"/><rect x="521.54" y="328" width="30.5" height="14" fill="#278f9a"/><rect x="551.54" y="328" width="30.5" height="14" fill="#087f8c"/><text x="589.54" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="589.54" dy="0">100</tspan></text><text x="620.16" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="620.16" dy="0">más oscuro = mayor (fallos detectados de 100)</tspan></text><rect x="10" y="356" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="380.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La deriva lenta pasa todas las comprobaciones que miran solo el propio sensor: cada lectura parece plausible con respecto a</tspan></text><text x="470" y="397.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la anterior. Solo una referencia independiente la ve. Cada celda son 100 fallos con instante de aparición aleatorio; los</tspan></text><text x="470" y="414.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fallos y las comprobaciones son modelos del autor. El número tras cada fila es el total detectado de 600.</tspan></text><text x="470" y="461.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
