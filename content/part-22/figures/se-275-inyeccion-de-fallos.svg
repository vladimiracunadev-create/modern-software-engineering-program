" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">100</tspan></text><rect x="770" y="240" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">100</tspan></text><rect x="880" y="240" width="74" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">600</tspan></text><rect x="10" y="290" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">La deriva lenta pasa todas las comprobaciones que miran solo el propio sensor: cada lectura parece plausible con respecto a la</tspan></text><text x="485" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">anterior. Solo una referencia independiente la ve. Cada celda son 100 fallos con instante de aparición aleatorio; los fallos y</tspan></text><text x="485" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">las comprobaciones son modelos del autor.</tspan></text><text x="485" y="387.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
