<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 479" width="940" height="479" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fallos detectados de 100 inyectados por tipo según las comprobaciones activas</title><desc id="d">Mapa de calor con los fallos detectados de 100 inyectados por tipo según las comprobaciones activas, acumulativas: solo rango no detecta ninguno; la variación máxima detecta picos, ruido y bit alto; el valor congelado y la ausencia de lectura completan esos tipos; la dispersión cierra el ruido; y solo la referencia independiente detecta la deriva, hasta los 600 de 600.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="479" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Fallos detectados de 100 inyectados por tipo según las comprobaciones activas</tspan></text><text x="623" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="623" dy="0">Tipo de fallo inyectado</tspan></text><text x="375.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="375.5" dy="0">Congelado</tspan></text><text x="474.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.5" dy="0">Deriva</tspan></text><text x="573.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="573.5" dy="0">Pico</tspan></text><text x="672.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="672.5" dy="0">Ruido ×10</tspan></text><text x="771.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.5" dy="0">Bit alto</tspan></text><text x="870.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870.5" dy="0">Ausencia</tspan></text><text x="316" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="316" dy="0">Solo rango · 0 de 600</tspan></text><text x="316" y="164.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="316" dy="0">Rango y variación · 298</tspan></text><text x="316" y="208.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="316" dy="0">Más congelado y ausencia · 498</tspan></text><text x="316" y="252.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="316" dy="0">Más dispersión · 500</tspan></text><text x="316" y="296.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="316" dy="0">Más referencia independiente · 600</tspan></text><rect x="327.5" y="95.5" width="96" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="375.5" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="375.5" dy="0">0</tspan></text><rect x="426.5" y="95.5" width="96" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="474.5" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.5" dy="0">0</tspan></text><rect x="525.5" y="95.5" width="96" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="573.5" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="573.5" dy="0">0</tspan></text><rect x="624.5" y="95.5" width="96" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="672.5" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="672.5" dy="0">0</tspan></text><rect 