<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 317" width="1080" height="317" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil dispositivos y una versión defectuosa (3 % fallan; informe con probabilidad 0,9)</title><desc id="d">Tabla: con una versión defectuosa que daña al 3 por ciento de 1000 dispositivos, publicar a todos daña 30 sin posibilidad de detenerse, las etapas dañan 18 y detienen el despliegue a tiempo en el 44,2 por ciento, y con reversión automática solo 1,8 dispositivos siguen dañados al final.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="317" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Estrategia</tspan></text><rect x="440" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Dañados</tspan></text><rect x="570" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Siguen dañados</tspan></text><rect x="760" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Días</tspan></text><rect x="850" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="957" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="957" dy="0">Detenidos a tiempo</tspan></text><rect x="10" y="56" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Publicar a todos el día 1</tspan></text><rect x="440" y="56" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">30,0</tspan></text><rect x="570" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">30,0</tspan></text><rect x="760" y="56" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">1</tspan></text><rect x="850" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="957" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="957" dy="0">0 %</tspan></text><rect x="10" y="110" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Etapas sin reversión automática</tspan></text><rect x="440" y="110" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">18,0</tspan></text><rect x="570" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">18,0</tspan></text><rect x="760" y="110" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">7,7</tspan></text><rect x="850" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="957" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="957" dy="0">44,2 %</tspan></text><rect x="10" y="164" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Etapas con reversión y umbral de 3 informes</tspan></text><rect x="440" y="164" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">18,0</tspan></text><rect x="570" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">1,8</tspan></text><rect x="760" y="164" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">7,7</tspan></text><rect x="850" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="957" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="957" dy="0">44,2 %</tspan></text><rect x="10" y="222" width="1060" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="540" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="540" dy="0">Las etapas reducen el daño inicial; la reversión lo repara. Con el 3 % de fallo, 55,8 % de los despliegues llegan a toda la flota antes de</tspan></text><text x="540" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="540" dy="0">detectar el problema, porque la primera etapa de 10 dispositivos espera 0,3 fallos. 2000 despliegues; la reparación al 90 % es un supuesto.</tspan></text><text x="540" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
