<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 770" width="940" height="770" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de paquetes de dispositivo sobre 200 mutaciones: 142 detectadas</title><desc id="d">Barras horizontales apiladas con las mutaciones detectadas y no detectadas por un verificador de forma, por tipo de mutación: detecta todas las de los ocho tipos que rompen la forma, 142 de 200, y ninguna de las 58 que cambian el sentido: un plazo de vigilancia menor que la operación más larga, etapas de despliegue en orden inverso, un umbral invertido o una clave maestra almacenada en el dispositivo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="770" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Validador de paquetes de dispositivo sobre 200 mutaciones: 142 detectadas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="354" y1="77" x2="354" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="605" x2="354" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="458.34" y1="77" x2="458.34" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="458.34" y1="605" x2="458.34" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="458.34" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.34" dy="0">5</tspan></text><line x1="562.68" y1="77" x2="562.68" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="562.68" y1="605" x2="562.68" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="562.68" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.68" dy="0">10</tspan></text><line x1="667.02" y1="77" x2="667.02" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="667.02" y1="605" x2="667.02" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="667.02" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.02" dy="0">15</tspan></text><line x1="771.36" y1="77" x2="771.36" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="771.36" y1="605" x2="771.36" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="771.36" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.36" dy="0">20</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="605" x2="875.7" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">25</tspan></text><line x1="354" y1="605" x2="875.7" y2="605" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Campo ausente</tspan></text><text x="344" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin identidad individual</tspan></text><text x="344" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin plan de reversión</tspan></text><text x="344" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin rotación con plazo</tspan></text><text x="344" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reintentos sin jitter</tspan></text><text x="344" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Despliegue sin etapas</tspan></text><text x="344" y="367.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Fecha de revisión sin formato</tspan></text><text x="344" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Responsable colectivo</tspan></text><text x="344" y="447" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Plazo del temporizador menor que la operación</tspan></text><text x="344" y="464" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">más larga</tspan></text><text x="344" y="499.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Etapas de despliegue en orden inverso</tspan></text><text x="344" y="543.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Umbral invertido (40 a 5 °C)</tspan></text><text x="344" y="587.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Clave maestra almacenada en el dispositivo</tspan></text><rect x="354" y="84" width="354.756" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="531.378" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="531.378" dy="0">17</tspan></text><rect x="708.756" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="715.756" y="103.5" font-size="13" text-anchor="start" font-weight="700