<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 611" width="860" height="611" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de paquetes de dispositivo sobre 200 mutaciones: 142 detectadas</title><desc id="d">Tabla: un verificador de forma detecta 142 de 200 mutaciones de un paquete de dispositivo y ninguna de las 58 que cambian el sentido: un plazo de vigilancia menor que la operación más larga, etapas de despliegue en orden inverso, un umbral invertido o una clave maestra almacenada en el dispositivo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="860" height="611" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Mutación</tspan></text><rect x="650" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="75.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Campo ausente</tspan></text><rect x="650" y="56" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="75.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">17 de 17</tspan></text><rect x="10" y="94" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="113.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Sin identidad individual</tspan></text><rect x="650" y="94" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="113.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">12 de 12</tspan></text><rect x="10" y="132" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="151.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Sin plan de reversión</tspan></text><rect x="650" y="132" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="151.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">12 de 12</tspan></text><rect x="10" y="170" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="189.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Sin rotación con plazo</tspan></text><rect x="650" y="170" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="189.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">15 de 15</tspan></text><rect x="10" y="208" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="227.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Reintentos sin jitter</tspan></text><rect x="650" y="208" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="227.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">25 de 25</tspan></text><rect x="10" y="246" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="265.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Despliegue sin etapas</tspan></text><rect x="650" y="246" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="265.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">20 de 20</tspan></text><rect x="10" y="284" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="303.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Fecha de revisión sin formato</tspan></text><rect x="650" y="284" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="303.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">17 de 17</tspan></text><rect x="10" y="322" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="341.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Responsable colectivo</tspan></text><rect x="650" y="322" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="341.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">24 de 24</tspan></text><rect x="10" y="360" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="379.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Plazo del temporizador menor que la operación más larga</tspan></text><rect x="650" y="360" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="379.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 15</tspan></text><rect x="10" y="398" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="417.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Etapas de despliegue en orden inverso</tspan></text><rect x="650" y="398" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="417.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 16</tspan></text><rect x="10" y="436" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="455.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Umbral invertido (40 a 5 °C)</tspan></text><rect x="650" y="436" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="455.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 17</tspan></text><rect x="10" y="474" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="493.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Clave maestra almacenada en el dispositivo</tspan></text><rect x="650" y="474" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="493.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 10</tspan></text><rect x="10" y="516" width="840" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="430" y="540.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="430" dy="0">Las cuatro mutaciones que no ve son justo las que rompen el dispositivo: tienen forma correcta y sentido</tspan></text><text x="430" y="557.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="430" dy="0">contrario. Las reglas se escribieron conociendo las mutaciones, así que el 100 % por tipo es optimista.</tspan></text><text x="430" y="597.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
