<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 421" width="930" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pasos hasta que dos trayectorias casi idénticas se separan en 0,1 (mapa logístico, r = 3,9)</title><desc id="d">Tabla: en un mapa logístico caótico, dos trayectorias con diferencia inicial de diez a la menos seis se separan en 23 pasos de mediana y con diferencia de diez a la menos quince en 65; en un régimen estable la diferencia no crece en quinientos pasos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="421" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Diferencia inicial</tspan></text><rect x="390" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Pasos hasta separarse (mediana)</tspan></text><rect x="680" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Percentiles 10 a 90</tspan></text><rect x="10" y="56" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">10⁻⁶</tspan></text><rect x="390" y="56" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">23</tspan></text><rect x="680" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">20 a 29</tspan></text><rect x="10" y="106" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">10⁻⁹</tspan></text><rect x="390" y="106" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">37</tspan></text><rect x="680" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">33 a 45</tspan></text><rect x="10" y="156" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">10⁻¹²</tspan></text><rect x="390" y="156" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">50</tspan></text><rect x="680" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">46 a 59</tspan></text><rect x="10" y="206" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">10⁻¹⁵</tspan></text><rect x="390" y="206" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">65</tspan></text><rect x="680" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">59 a 75</tspan></text><rect x="10" y="256" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Control estable (r = 2,8), 10⁻¹²</tspan></text><rect x="390" y="256" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">no diverge en 500</tspan></text><rect x="680" y="256" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">—</tspan></text><rect x="10" y="310" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Cada mil millonésima de diferencia compra apenas unos 14 pasos: la divergencia crece de forma exponencial, así que mejorar</tspan></text><text x="465" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">la precisión de la máquina retrasa el desacuerdo pero no lo elimina. Si el modelo es caótico, reproducir bit a bit una</tspan></text><text x="465" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">trayectoria larga en otra plataforma no es un objetivo realista; hay que reproducir estadísticos.</tspan></text><text x="465" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
