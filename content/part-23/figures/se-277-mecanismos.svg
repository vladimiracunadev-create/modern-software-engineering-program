<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 454" width="940" height="454" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco cosas que una regla ajena podría intentar y el mecanismo que contiene cada una</title><desc id="d">Mapa de calor con cinco escenarios y cinco mecanismos: la lectura fuera de memoria la contiene la memoria lineal, el bucle infinito el combustible, el crecimiento de memoria el límite del anfitrión, la conexión de red la importación no concedida y el archivo ajeno el directorio concedido; cada escenario tiene un solo mecanismo marcado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="454" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco cosas que una regla ajena podría intentar y el mecanismo que contiene cada una</tspan></text><text x="329.6" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="329.6" dy="0">Memoria lineal</tspan></text><text x="460.8" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="460.8" dy="0">Combustible</tspan></text><text x="592" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="592" dy="0">Límite del</tspan></text><text x="592" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="592" dy="0">anfitrión</tspan></text><text x="723.2" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="723.2" dy="0">Importación no</tspan></text><text x="723.2" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="723.2" dy="0">concedida</tspan></text><text x="854.4" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="854.4" dy="0">Directorio</tspan></text><text x="854.4" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="854.4" dy="0">concedido</tspan></text><text x="254" y="113.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Leer fuera de su memoria</tspan></text><text x="254" y="153.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Bucle infinito</tspan></text><text x="254" y="193.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Crecer la memoria sin tope</tspan></text><text x="254" y="233.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Abrir una conexión de red</tspan></text><text x="254" y="273.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Abrir un archivo ajeno</tspan></text><rect x="265.5" y="90.5" width="128.2" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="329.6" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="329.6" dy="0">contiene</tspan></text><rect x="396.7" y="90.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="460.8" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="460.8" dy="0">—</tspan></text><rect x="527.9" y="90.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="592" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="592" dy="0">—</tspan></text><rect x="659.1" y="90.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="723.2" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="723.2" dy="0">—</tspan></text><rect x="790.3" y="90.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="854.4" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="854.4" dy="0">—</tspan></text><rect x="265.5" y="130.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="329.6" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="329.6" dy="0">—</tspan></text><rect x="396.7" y="130.5" width="128.2" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="460.8" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="460.8" dy="0">contiene</tspan></text><rect x="527.9" y="130.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="592" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="592" dy="0">—</tspan></text><rect x="659.1" y="130.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="723.2" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="723.2" dy="0">—</tspan></text><rect x="790.3" y="130.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="854.4" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="854.4" dy="0">—</tspan></text><rect x="265.5" y="170.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="329.6" y="193.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="329.6" dy="0">—</tspan></text><rect x="396.7" y="170.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="460.8" y="193.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="460.8" dy="0">—</tspan></text><rect x="527.9" y="170.5" width="128.2" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="592" y="193.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">contiene</tspan></text><rect x="659.1" y="170.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="723.2" y="193.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="723.2" dy="0">—</tspan></text><rect x="790.3" y="170.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="854.4" y="193.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="854.4" dy="0">—</tspan></text><rect x="265.5" y="210.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="329.6" y="233.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="329.6" dy="0">—</tspan></text><rect x="396.7" y="210.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="460.8" y="233.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="460.8" dy="0">—</tspan></text><rect x="527.9" y="210.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="592" y="233.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="592" dy="0">—</tspan></text><rect x="659.1" y="210.5" width="128.2" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="723.2" y="233.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="723.2" dy="0">contiene</tspan></text><rect x="790.3" y="210.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="854.4" y="233.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="854.4" dy="0">—</tspan></text><rect x="265.5" y="250.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="329.6" y="273.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="329.6" dy="0">—</tspan></text><rect x="396.7" y="250.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="460.8" y="273.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="460.8" dy="0">—</tspan></text><rect x="527.9" y="250.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="592" y="273.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="592" dy="0">—</tspan></text><rect x="659.1" y="250.5" width="128.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="723.2" y="273.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="723.2" dy="0">—</tspan></text><rect x="790.3" y="250.5" width="128.2" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="854.4" y="273.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="854.4" dy="0">contiene</tspan></text><text x="264" y="315" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264" dy="0">—</tspan></text><rect x="279.54" y="303" width="30.5" height="14" fill="#dff1ee"/><rect x="309.54" y="303" width="30.5" height="14" fill="#c0e1e0"/><rect x="339.54" y="303" width="30.5" height="14" fill="#a2d0d2"/><rect x="369.54" y="303" width="30.5" height="14" fill="#83c0c4"/><rect x="399.54" y="303" width="30.5" height="14" fill="#64b0b6"/><rect x="429.54" y="303" width="30.5" height="14" fill="#45a0a8"/><rect x="459.54" y="303" width="30.5" height="14" fill="#278f9a"/><rect x="489.54" y="303" width="30.5" height="14" fill="#087f8c"/><text x="527.54" y="315" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="527.54" dy="0">contiene</tspan></text><text x="595.86" y="315" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="595.86" dy="0">más oscuro = mayor (contiene)</tspan></text><rect x="10" y="331" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="355.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada escenario tiene un solo mecanismo marcado: si falta configurarlo, nadie más lo contiene. El combustible no limita la</tspan></text><text x="470" y="372.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">memoria ni el límite de memoria detiene un bucle; son mecanismos que se configuran y se prueban por separado. Resume lo que</tspan></text><text x="470" y="389.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se ejercitó en el laboratorio, no una enumeración de ataques.</tspan></text><text x="470" y="436.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
