<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 321" width="960" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estimar π con 200 semillas: lo que una sola ejecución no dice</title><desc id="d">Tabla: con mil puntos la desviación de la estimación de pi entre doscientas semillas es 0,049 y solo el 15 por ciento queda a menos de 0,01 del valor; con cien mil puntos la desviación es 0,0048 y el 95,5 por ciento queda dentro de 0,01.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="321" fill="#ffffff"/><rect x="10" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="117" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="117" dy="0">Puntos por ejecución</tspan></text><rect x="230" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357" dy="0">Desviación entre semillas</tspan></text><rect x="490" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Dentro de ±0,01 de π</tspan></text><rect x="730" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Rango observado</tspan></text><rect x="10" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">1 000</tspan></text><rect x="230" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">0,0490</tspan></text><rect x="490" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">15,0 %</tspan></text><rect x="730" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">2,988 a 3,292</tspan></text><rect x="10" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">10 000</tspan></text><rect x="230" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">0,0161</tspan></text><rect x="490" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">46,5 %</tspan></text><rect x="730" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">3,090 a 3,183</tspan></text><rect x="10" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">100 000</tspan></text><rect x="230" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">0,0048</tspan></text><rect x="490" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">95,5 %</tspan></text><rect x="730" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">3,128 a 3,158</tspan></text><rect x="10" y="210" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Con una semilla fija la misma ejecución da siempre el mismo número, y eso es reproducibilidad exacta. No es evidencia de que</tspan></text><text x="480" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">el resultado sea estable: con mil puntos, otra semilla da cualquier valor entre 2,99 y 3,29. Publicar la semilla permite</tspan></text><text x="480" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">repetir; variar las semillas permite saber cuánto vale la cifra.</tspan></text><text x="480" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
