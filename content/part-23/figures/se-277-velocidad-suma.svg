<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma suma de 5 000 000 de enteros en tres tecnologías: WebAssembly con combustible, Python puro y NumPy</title><desc id="d">Barras horizontales en escala logarítmica con el tiempo en milisegundos de sumar los enteros de 0 a 4 999 999: WebAssembly con medición de combustible 9,98, Python puro 777,4 y NumPy 3,5 sobre un arreglo ya creado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La misma suma de 5 000 000 de enteros en tres tecnologías: WebAssembly con combustible, Python puro y NumPy</tspan></text><line x1="294" y1="49" x2="294" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="163" x2="294" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">1</tspan></text><line x1="487.9" y1="49" x2="487.9" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="487.9" y1="163" x2="487.9" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="487.9" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487.9" dy="0">10</tspan></text><line x1="681.8" y1="49" x2="681.8" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="681.8" y1="163" x2="681.8" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="681.8" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="681.8" dy="0">100</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="163" x2="875.7" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="294" y1="163" x2="875.7" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">WebAssembly con combustible activado</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Python puro (bucle)</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">NumPy (arreglo ya creado)</tspan></text><rect x="294" y="55" width="193.731" height="26" rx="3" fill="#087f8c"/><text x="494.731" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="494.731" dy="0">10,0</tspan></text><rect x="294" y="93" width="560.496" height="26" rx="3" fill="#087f8c"/><text x="861.496" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="861.496" dy="0">777,4</tspan></text><rect x="294" y="131" width="105.495" height="26" rx="3" fill="#087f8c"/><text x="406.495" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="406.495" dy="0">3,5</tspan></text><text x="584.85" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Milisegundos (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los tres resultados coinciden (12 499 997 500 000). Wasm es unas 78 veces más rápido que el bucle de Python y unas 3 veces</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">más lento que NumPy en esta ejecución; entre ejecuciones Wasm tardó de unos 10 a unos 16 ms y Python de unos 780 a unos 930</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ms. Un módulo escrito a mano de 236 bytes, con la medición de combustible activada, que tiene un costo.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
