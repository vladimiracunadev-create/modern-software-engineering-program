<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" width="960" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Eventos que llegan después de cerrar su ventana según la tolerancia de retraso</title><desc id="d">Barras: con retraso lognormal de mediana 5 segundos, una tolerancia de 5 segundos descarta el 50,2 por ciento de los eventos, 15 segundos el 13,6, 30 segundos el 3,6, 60 segundos el 0,66, 120 segundos el 0,06 y 300 segundos ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="395" fill="#ffffff"/><text x="190" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">Espera de 5 s</tspan></text><rect x="200" y="16" width="551.87" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="759.87" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="759.87" dy="0">50,2 % descartado</tspan></text><text x="190" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">15 s</tspan></text><rect x="200" y="60" width="149.27" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="357.27" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="357.27" dy="0">13,6 %</tspan></text><text x="190" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">30 s</tspan></text><rect x="200" y="104" width="39.05" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="247.05" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="247.05" dy="0">3,6 %</tspan></text><text x="190" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">60 s</tspan></text><rect x="200" y="148" width="7.26" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="215.26" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="215.26" dy="0">0,66 %</tspan></text><text x="190" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">120 s</tspan></text><rect x="200" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="212" dy="0">0,06 %</tspan></text><text x="190" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">300 s</tspan></text><rect x="200" y="236" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="212" dy="0">0 %</tspan></text><rect x="10" y="284" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Retraso de llegada lognormal (mediana 5 s, p99 51 s, máximo 351 s) sobre 100 000 eventos. Cada tolerancia compra completitud a</tspan></text><text x="480" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">costa de latencia: esperar 120 s deja los resultados abiertos dos minutos. El 0 % exacto depende de esta muestra, no de la</tspan></text><text x="480" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">física.</tspan></text><text x="480" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
