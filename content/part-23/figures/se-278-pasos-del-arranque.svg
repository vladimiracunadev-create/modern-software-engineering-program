<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los pasos del arranque de un módulo de WebAssembly y, como referencia, el arranque de un proceso de Python</title><desc id="d">Barras horizontales en escala logarítmica con el costo en milisegundos de cinco pasos: crear el motor 0,047, compilar el módulo 3,486, deserializar el módulo compilado 0,168, instanciar y llamar 0,468 y arrancar un intérprete de Python como proceso 158,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Los pasos del arranque de un módulo de WebAssembly y, como referencia, el arranque de un proceso de Python</tspan></text><line x1="324" y1="49" x2="324" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="239" x2="324" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0,01</tspan></text><line x1="431.116" y1="49" x2="431.116" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="431.116" y1="239" x2="431.116" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="431.116" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="431.116" dy="0">0,1</tspan></text><line x1="538.232" y1="49" x2="538.232" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="538.232" y1="239" x2="538.232" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="538.232" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="538.232" dy="0">1</tspan></text><line x1="645.348" y1="49" x2="645.348" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="645.348" y1="239" x2="645.348" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="645.348" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="645.348" dy="0">10</tspan></text><line x1="752.464" y1="49" x2="752.464" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="752.464" y1="239" x2="752.464" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="752.464" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752.464" dy="0">100</tspan></text><line x1="859.58" y1="49" x2="859.58" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="239" x2="859.58" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">1 000</tspan></text><line x1="324" y1="239" x2="859.58" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Crear el motor (una vez)</tspan></text><text x="314" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Compilar el binario (una vez por versión)</tspan></text><text x="314" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Deserializar el módulo compilado</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Instanciar y llamar (por petición)</tspan></text><text x="314" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Proceso de Python (referencia)</tspan></text><rect x="324" y="55" width="71.9924" height="26" rx="3" fill="#102a43"/><text x="402.992" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="402.992" dy="0">0,047</tspan></text><rect x="324" y="93" width="272.324" height="26" rx="3" fill="#102a43"/><text x="603.324" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="603.324" dy="0">3,486</tspan></text><rect x="324" y="131" width="131.25" height="26" rx="3" fill="#102a43"/><text x="462.25" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="462.25" dy="0">0,168</tspan></text><rect x="324" y="169" width="178.91" height="26" rx="3" fill="#102a43"/><text x="509.91" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="509.91" dy="0">0,468</tspan></text><rect x="324" y="207" width="449.949" height="26" rx="3" fill="#102a43"/><text x="780.949" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="780.949" dy="0">158,700</tspan></text><text x="591.79" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="591.79" dy="0">Milisegundos (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="297" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Compilar es unas 7 veces más caro que instanciar y unas 20 veces más que deserializar; el módulo serializado (14 728 bytes)</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">es unas 60 veces mayor que el binario (236 bytes). El proceso de Python tardó entre unos 100 y unos 160 ms en distintas</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ejecuciones: entre 210 y 340 veces el costo de instanciar. No son funciones equivalentes.</tspan></text><text x="470" y="402.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
