<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 427" width="940" height="427" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alarmas de deriva (PSI &gt; 0,2) según el desplazamiento de la media y el tamaño de la ventana</title><desc id="d">Mapa de calor con el porcentaje de ventanas en que suena la alarma de deriva según el desplazamiento de la media y el tamaño de la ventana: con ventanas de 100 suena el 4 por ciento sin cambio y el 37 con 0,3 desviaciones; con ventanas de 500 o 5 000 no suena con ese desplazamiento y con 0,5 suena el 92 y el 100 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="427" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Alarmas de deriva (PSI &gt; 0,2) según el desplazamiento de la media y el tamaño de la ventana</tspan></text><text x="558" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="558" dy="0">Ventanas con alarma (PSI &gt; 0,2)</tspan></text><text x="316.667" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="316.667" dy="0">Ventana de 100</tspan></text><text x="558" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="558" dy="0">Ventana de 500</tspan></text><text x="799.333" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="799.333" dy="0">Ventana de 5 000</tspan></text><text x="186" y="119.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="186" dy="0">0,0 (sin cambio)</tspan></text><text x="186" y="161.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="186" dy="0">0,1</tspan></text><text x="186" y="203.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="186" dy="0">0,3</tspan></text><text x="186" y="245.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="186" dy="0">0,5</tspan></text><rect x="197.5" y="95.5" width="238.333" height="39" rx="4" fill="#f9ded7" stroke="#ffffff" stroke-width="1"/><text x="316.667" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="316.667" dy="0">4 %</tspan></text><rect x="438.833" y="95.5" width="238.333" height="39" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="558" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="558" dy="0">0 %</tspan></text><rect x="680.167" y="95.5" width="238.333" height="39" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="799.333" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="799.333" dy="0">0 %</tspan></text><rect x="197.5" y="137.5" width="238.333" height="39" rx="4" fill="#f7dad4" stroke="#ffffff" stroke-width="1"/><text x="316.667" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="316.667" dy="0">6 %</tspan></text><rect x="438.833" y="137.5" width="238.333" height="39" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="558" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="558" dy="0">0 %</tspan></text><rect x="680.167" y="137.5" width="238.333" height="39" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="799.333" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="799.333" dy="0">0 %</tspan></text><rect x="197.5" y="179.5" width="238.333" height="39" rx="4" fill="#e5a89d" stroke="#102a43" stroke-width="3"/><text x="316.667" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="316.667" dy="0">37 %</tspan></text><rect x="438.833" y="179.5" width="238.333" height="39" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="558" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="558" dy="0">0 %</tspan></text><rect x="680.167" y="179.5" width="238.333" height="39" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="799.333" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="799.333" dy="0">0 %</tspan></text><rect x="197.5" y="221.5" width="238.333" height="39" rx="4" fill="#c5503d" stroke="#ffffff" stroke-width="1"/><text x="316.667" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="316.667" dy="0">92 %</tspan></text><rect x="438.833" y="221.5" width="238.333" height="39" rx="4" fill="#c5503d" stroke="#ffffff" stroke-width="1"/><text x="558" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="558" dy="0">92 %</tspan></text><rect x="680.167" y="221.5" width="238.333" height="39" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="799.333" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="799.333" dy="0">100 %</tspan></text><text x="20" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 178)">Desplazamiento (σ)</text><text x="196" y="288" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="196" dy="0">0 %</tspan></text><rect x="226.62" y="276" width="30.5" height="14" fill="#fbe4de"/><rect x="256.62" y="276" width="30.5" height="14" fill="#f3cdc5"/><rect x="286.62" y="276" width="30.5" height="14" fill="#eab6ac"/><rect x="316.62" y="276" width="30.5" height="14" fill="#e29f93"/><rect x="346.62" y="276" width="30.5" height="14" fill="#d9887a"/><rect x="376.62" y="276" width="30.5" height="14" fill="#d17161"/><rect x="406.62" y="276" width="30.5" height="14" fill="#c85a48"/><rect x="436.62" y="276" width="30.5" height="14" fill="#c0432f"/><text x="474.62" y="288" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="474.62" dy="0">100 %</tspan></text><text x="520.32" y="288" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="520.32" dy="0">más oscuro = mayor (% de ventanas con alarma)</tspan></text><rect x="10" y="304" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="328.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Con ventanas pequeñas el índice se infla por azar: a 0,3 desviaciones la alarma de n = 100 suena 37 veces de 100 y la de n</tspan></text><text x="470" y="345.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">≥ 500 ninguna, porque el valor real del índice (alrededor de 0,09) queda bajo el umbral. El umbral de 0,2 es una</tspan></text><text x="470" y="362.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">convención, no una ley; 200 ventanas por celda.</tspan></text><text x="470" y="409.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
