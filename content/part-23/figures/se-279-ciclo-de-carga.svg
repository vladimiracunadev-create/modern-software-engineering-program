<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 377" width="960" height="377" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El recorrido de un programa eBPF: del bytecode al contador leído desde el espacio de usuario</title><desc id="d">Diagrama con tres filas de cajas: cargar con la llamada de sistema y recibir el registro del verificador; compilar y enganchar el programa aceptado; ejecutar en el núcleo y leer el mapa desde el espacio de usuario; una nota indica que el mapa es el único canal de datos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="377" fill="#ffffff"/><rect x="10" y="14" width="284" height="108" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="55" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">1. Cargar</tspan></text><text x="152" y="71.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">bpf(PROG_LOAD) con el tipo, las</tspan></text><text x="152" y="88.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">instrucciones y un búfer de registro</tspan></text><rect x="338" y="14" width="284" height="108" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="46.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">2. Verificar</tspan></text><text x="480" y="63.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Todos los caminos, registros,</tspan></text><text x="480" y="79.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">accesos y presupuesto de</tspan></text><text x="480" y="96.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">instrucciones</tspan></text><polyline points="294,68 338,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="108" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="808" y="55" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">3. Aceptar o rechazar</tspan></text><text x="808" y="71.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">Rechazo con mensaje; aceptación con</tspan></text><text x="808" y="88.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">un descriptor</tspan></text><polyline points="622,68 666,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="162" width="284" height="108" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">4. Compilar</tspan></text><text x="152" y="219.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Compilación a código nativo (JIT) y</tspan></text><text x="152" y="236.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">enganche a un punto</tspan></text><rect x="338" y="162" width="284" height="108" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">5. Ejecutar</tspan></text><text x="480" y="219.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">En el núcleo en cada evento; solo</tspan></text><text x="480" y="236.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">ayudantes conocidos</tspan></text><polyline points="294,216 338,216" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="162" width="284" height="108" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">6. Leer el mapa</tspan></text><text x="808" y="219.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">El espacio de usuario consulta el</tspan></text><text x="808" y="236.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">contador con otra llamada</tspan></text><polyline points="622,216 666,216" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,122 808,142 152,142 152,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="284" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">El mapa es el único canal de datos entre el núcleo y el espacio de usuario. Cada tipo de programa tiene sus propios puntos de</tspan></text><text x="480" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">enganche, ayudantes permitidos y reglas de retorno; el laboratorio ejercita uno solo (filtro de socket) con BPF_PROG_TEST_RUN.</tspan></text><text x="480" y="367.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Programas cargados de verdad en el núcleo de Linux de WSL2 (6.18.58.1); los mensajes y los límites son los de esa versión.</tspan></text></svg>
