<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 325" width="940" height="325" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de contar un evento: un programa eBPF ejecutado cien mil veces y la misma cuenta como llamada a una función de Python</title><desc id="d">Barras horizontales en escala logarítmica con el costo por evento en nanosegundos: el contador eBPF tardó unos 52 nanosegundos por ejecución y la misma cuenta como función de Python dentro del proceso unos 766.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="325" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo de contar un evento: un programa eBPF ejecutado cien mil veces y la misma cuenta como llamada a una</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">función de Python</tspan></text><line x1="284" y1="68" x2="284" y2="144" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="144" x2="284" y2="149" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="165" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">10</tspan></text><line x1="587.91" y1="68" x2="587.91" y2="144" stroke="#d5dde1" stroke-width="1"/><line x1="587.91" y1="144" x2="587.91" y2="149" stroke="#5b7280" stroke-width="1.4"/><text x="587.91" y="165" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.91" dy="0">100</tspan></text><line x1="891.82" y1="68" x2="891.82" y2="144" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="144" x2="891.82" y2="149" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="165" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">1 000</tspan></text><line x1="284" y1="144" x2="891.82" y2="144" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Programa eBPF en el núcleo</tspan></text><text x="274" y="129.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Función de Python en el proceso</tspan></text><rect x="284" y="74" width="217.601" height="26" rx="3" fill="#087f8c"/><text x="508.601" y="91.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="508.601" dy="0">52</tspan></text><rect x="284" y="112" width="572.636" height="26" rx="3" fill="#087f8c"/><text x="863.636" y="129.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="863.636" dy="0">766</tspan></text><text x="587.91" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="587.91" dy="0">Nanosegundos por evento (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="202" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="226.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El tiempo del programa eBPF lo informa el núcleo sobre 100 000 ejecuciones de prueba (41, 52, 53 y 56 ns en cuatro</tspan></text><text x="470" y="243.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ejecuciones). La función de Python mide una llamada y la actualización de un diccionario, no leer un evento: es una</tspan></text><text x="470" y="260.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comparación de escala y no una medida de una carga real. El mapa leído al final valía 100 000.</tspan></text><text x="470" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Programas cargados de verdad en el núcleo de Linux de WSL2 (6.18.58.1); los mensajes y los límites son los de esa versión.</tspan></text></svg>
