<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 555" width="940" height="555" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Instrucciones que el verificador del núcleo procesó antes de decidir, en siete programas</title><desc id="d">Barras horizontales en escala logarítmica con las instrucciones que el verificador procesó en siete programas: leer un registro sin inicializar 1, el programa trivial 2, desreferenciar sin comprobar nulo con clave variable 7, con clave constante 7, lectura fuera del valor del mapa 8, el contador con comprobación de nulo 10 y el bucle sin salida 1 000 001.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="555" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Instrucciones que el verificador del núcleo procesó antes de decidir, en siete programas</tspan></text><line x1="354" y1="49" x2="354" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="357" x2="354" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0,1</tspan></text><line x1="415.183" y1="49" x2="415.183" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="415.183" y1="357" x2="415.183" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="415.183" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="415.183" dy="0">1</tspan></text><line x1="476.365" y1="49" x2="476.365" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="476.365" y1="357" x2="476.365" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="476.365" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="476.365" dy="0">10</tspan></text><line x1="537.548" y1="49" x2="537.548" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="537.548" y1="357" x2="537.548" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="537.548" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537.548" dy="0">100</tspan></text><line x1="598.73" y1="49" x2="598.73" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="598.73" y1="357" x2="598.73" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="598.73" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.73" dy="0">1 000</tspan></text><line x1="659.913" y1="49" x2="659.913" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="659.913" y1="357" x2="659.913" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="659.913" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="659.913" dy="0">10 000</tspan></text><line x1="721.095" y1="49" x2="721.095" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="721.095" y1="357" x2="721.095" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="721.095" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="721.095" dy="0">100 000</tspan></text><line x1="782.278" y1="49" x2="782.278" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="782.278" y1="357" x2="782.278" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="782.278" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.278" dy="0">1 000 000</tspan></text><line x1="843.46" y1="49" x2="843.46" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="843.46" y1="357" x2="843.46" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="843.46" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="843.46" dy="0">10 000 000</tspan></text><line x1="354" y1="357" x2="843.46" y2="357" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Leer un registro sin inicializar (rechazado)</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Programa trivial r0 = 42 (aceptado)</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin comprobar nulo, clave variable</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(rechazado)</tspan></text><text x="344" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin comprobar nulo, clave constante</tspan></text><text x="344" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(aceptado)</tspan></text><text x="344" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Leer fuera del valor del mapa (rechazado)</tspan></text><text x="344" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Contador con comprobación de nulo (aceptado)</tspan></text><text x="344" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Bucle sin salida (rechazado)</tspan></text><rect x="354" y="55" width="61.1825" height="32" rx="3" fill="#102a43"/><text x="422.183" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422.183" dy="0">1</tspan></text><rect x="354" y="99" width="79.6003" height="32" rx="3" fill="#102a43"/><text x="440.6" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="440.6" dy="0">2</tspan></text><rect x="354" y="143" width="112.888" height="32" rx="3" fill="#102a43"/><text x="473.888" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="473.888" dy="0">7</tspan></text><rect x="354" y="187" width="112.888" height="32" rx="3" fill="#102a43"/><text x="473.888" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="473.888" dy="0">7</tspan></text><rect x="354" y="231" width="116.436" height="32" rx="3" fill="#102a43"/><text x="477.436" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="477.436" dy="0">8</tspan></text><rect x="354" y="275" width="122.365" height="32" rx="3" fill="#102a43"/><text x="483.365" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="483.365" dy="0">10</tspan></text><rect x="354" y="319" width="428.278" height="32" rx="3" fill="#102a43"/><text x="789.278" y="339.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="789.278" dy="0">1 000 001</tspan></text><line x1="782.278" y1="49" x2="782.278" y2="357" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="787.278" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="787.278" dy="0">límite 1 000 000</tspan></text><text x="598.73" y="401" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598.73" dy="0">Instrucciones procesadas (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="415" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="439.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los rechazos por reglas de seguridad ocurren en pocas instrucciones. El bucle sin salida no recibió un mensaje de bucle</tspan></text><text x="470" y="456.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">infinito: consumió todo el presupuesto (BPF program is too large. Processed 1000001 insn). Un caso que parece inseguro,</tspan></text><text x="470" y="473.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">desreferenciar sin comprobar nulo con una clave constante, fue aceptado porque el análisis sabe que la búsqueda no puede</tspan></text><text x="470" y="489.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fallar.</tspan></text><text x="470" y="537.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Programas cargados de verdad en el núcleo de Linux de WSL2 (6.18.58.1); los mensajes y los límites son los de esa versión.</tspan></text></svg>
