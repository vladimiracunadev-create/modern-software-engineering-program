<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 387" width="990" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un detector con sensibilidad 0,90 y especificidad 0,95 según la prevalencia del evento</title><desc id="d">Tabla: con sensibilidad 0,90 y especificidad 0,95 la exactitud casi no cambia con la prevalencia, pero el valor predictivo positivo baja de 0,947 con prevalencia del 50 por ciento a 0,154 con el 1 por ciento y 0,018 con el 0,1 por ciento; responder siempre no obtiene 0,99 de exactitud con el 1 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="387" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Prevalencia</tspan></text><rect x="200" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="292" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="292" dy="0">Exactitud</tspan></text><rect x="390" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">De cada aviso, proporción real</tspan></text><rect x="720" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Exactitud de «siempre no»</tspan></text><rect x="10" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">50 %</tspan></text><rect x="200" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">0,925</tspan></text><rect x="390" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0,947</tspan></text><rect x="720" y="56" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0,500</tspan></text><rect x="10" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">10 %</tspan></text><rect x="200" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">0,945</tspan></text><rect x="390" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0,667</tspan></text><rect x="720" y="110" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0,900</tspan></text><rect x="10" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">1 %</tspan></text><rect x="200" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">0,950</tspan></text><rect x="390" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0,154</tspan></text><rect x="720" y="164" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0,990</tspan></text><rect x="10" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">0,1 %</tspan></text><rect x="200" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">0,950</tspan></text><rect x="390" y="218" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0,018</tspan></text><rect x="720" y="218" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0,999</tspan></text><rect x="10" y="276" width="970" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Con el 1 % de casos, 85 de cada 100 avisos son falsos aunque el detector parezca bueno (0,95 de exactitud). Y la regla que nunca</tspan></text><text x="495" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">avisa saca 0,99. La exactitud no sirve con eventos raros: hay que reportar sensibilidad, valor predictivo y coste de cada tipo de</tspan></text><text x="495" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">error. Comprobado con 500 000 casos simulados.</tspan></text><text x="495" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
