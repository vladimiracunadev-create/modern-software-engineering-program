<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 421" width="950" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Espiral de la muerte: coste de cada actualización fija de 16,7 ms (fotogramas por segundo · peor fotograma en ms)</title><desc id="d">Tabla: con actualizaciones de 4 milisegundos el juego sostiene 60 fotogramas por segundo; con 17 milisegundos, más que el paso de 16,7, sin tope de pasos cae a 1 fotograma por segundo con un fotograma de 5357 milisegundos y con un tope de 5 pasos sostiene 10,9 fotogramas por segundo con el juego al 90 por ciento de la velocidad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="421" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Coste de una actualización (ms)</tspan></text><rect x="280" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Sin tope de pasos</tspan></text><rect x="570" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Tope de 5 pasos (fps · peor · juego/real)</tspan></text><rect x="10" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="8