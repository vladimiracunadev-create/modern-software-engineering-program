ont-weight="400" fill="#142231"><tspan x="752" dy="0">26,7 · 167 · 0,98</tspan></text><rect x="10" y="206" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">17</tspan></text><rect x="280" y="206" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">1,0 · 5 357</tspan></text><rect x="570" y="206" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">10,9 · 189 · 0,90</tspan></text><rect x="10" y="256" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">20</tspan></text><rect x="280" y="256" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,5 · 13 322</tspan></text><rect x="570" y="256" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">9,3 · 282 · 0,77</tspan></text><rect x="10" y="310" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Si actualizar cuesta más que el paso, cada fotograma debe recuperar más pasos, tarda más, acumula más tiempo y el sistema</tspan></text><text x="475" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">colapsa. El tope de pasos evita el bloqueo a cambio de que el juego corra más lento que el reloj (0,90 a 17 ms). Picos del 2</tspan></text><text x="475" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">% con coste cuádruple; 60 s simulados.</tspan></text><text x="475" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
