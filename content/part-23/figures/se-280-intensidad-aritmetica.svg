<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rendimiento medido frente a operaciones por byte movido en tres operaciones de CPU</title><desc id="d">Dispersión en escala logarítmica con el rendimiento en GFLOP/s frente a las operaciones por byte movido: la suma vectorial con unas 0,17 operaciones por byte rinde 0,38, el producto de matrices de 256 con 43 rinde 16,5 y el de 1024 con 171 rinde 86,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Rendimiento medido frente a operaciones por byte movido en tres operaciones de CPU</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Suma vectorial</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Producto de matrices 256 × 256</tspan></text><polygon points="449.76,44.1 456.36,56.4 443.16,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="463.76" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="463.76" dy="0">Producto de matrices 1024 × 1024</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,1</tspan></text><line x1="78.62" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="187" x2="78.62" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">10</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0,1</tspan></text><line x1="295.465" y1="87" x2="295.465" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="295.465" y1="387" x2="295.465" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="295.465" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295.465" dy="0">1</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="387" x2="494.31" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">10</tspan></text><line x1="693.155" y1="87" x2="693.155" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="693.155" y1="387" x2="693.155" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="693.155" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.155" dy="0">100</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1000</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">GFLOP/s medidos (escala logarítmica) (escala logarítmica)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Operaciones por byte movido (escala logarítmica) (escala logarítmica)</tspan></text><circle cx="142.444" cy="329.022" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="142.444" y="318.022" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="142.444" dy="0">0,38</tspan></text><rect x="614.772" y="159.752" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="620.272" y="154.252" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="620.272" dy="0">16,50</tspan></text><polygon points="739.485,86.823 745.535,98.098 733.435,98.098" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="739.485" y="82.148" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="739.485" dy="0">86,80</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El rendimiento sube con la intensidad aritmética: la suma vectorial, limitada por memoria, rinde 0,38 GFLOP/s y el producto</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 1024 × 1024, 86,8 (más de 200 veces). En otras ejecuciones del producto de 1024 se midieron 105 a 112 GFLOP/s. No se</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dibujaron los techos de la máquina porque no se midieron sus picos de cómputo ni de ancho de banda.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medida de CPU con NumPy como proxy: muestra la forma del efecto, no su magnitud en un acelerador. No se ejecutó ningún núcleo en una GPU.</tspan></text></svg>
