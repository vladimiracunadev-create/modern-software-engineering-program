<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 511" width="940" height="511" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sumar 1 048 576 elementos de un arreglo de 64 MiB según cómo se leen: contiguos, con salto y en orden aleatorio</title><desc id="d">Barras con el tiempo en milisegundos de sumar 1 048 576 elementos de un arreglo de 16 777 216 valores de 32 bits según el patrón de lectura: contiguos 4,67, con un salto de 16 posiciones 9,32 y en orden aleatorio 27,56.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="511" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sumar 1 048 576 elementos de un arreglo de 64 MiB según cómo se leen: contiguos, con salto y en orden</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">aleatorio</tspan></text><line x1="71.08" y1="336" x2="920" y2="336" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="336" x2="71.08" y2="336" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="340.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="252.667" x2="920" y2="252.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="252.667" x2="71.08" y2="252.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="257.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="169.333" x2="920" y2="169.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="169.333" x2="71.08" y2="169.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="173.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="86" x2="920" y2="86" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="86" x2="71.08" y2="86" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="90.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="86" x2="71.08" y2="336" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="211" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 211)">Milisegundos</text><rect x="99.3773" y="297.083" width="226.379" height="38.9167" rx="3" fill="#102a43"/><text x="212.567" y="291.083" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">4,67</tspan></text><text x="212.567" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Contiguos</tspan></text><rect x="382.351" y="258.333" width="226.379" height="77.6667" rx="3" fill="#102a43"/><text x="495.54" y="252.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">9,32</tspan></text><text x="495.54" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Con salto de 16 posiciones</tspan></text><rect x="665.324" y="106.333" width="226.379" height="229.667" rx="3" fill="#102a43"/><text x="778.513" y="100.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">27,56</tspan></text><text x="778.513" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">En orden aleatorio</tspan></text><rect x="10" y="388" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="412.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El mismo trabajo cuesta casi 6 veces más en orden aleatorio que contiguo (27,56 frente a 4,67 ms). Cada línea de memoria</tspan></text><text x="470" y="429.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">que se trae se usa menos. En una GPU la magnitud es otra, pero el mecanismo es el mismo: los hilos de un grupo que leen</tspan></text><text x="470" y="446.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">posiciones vecinas se sirven con pocas transacciones.</tspan></text><text x="470" y="493.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medida de CPU con NumPy como proxy: muestra la forma del efecto, no su magnitud en un acelerador. No se ejecutó ningún núcleo en una GPU.</tspan></text></svg>
