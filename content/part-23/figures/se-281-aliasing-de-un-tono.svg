<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Frecuencia que mide una transformada al muestrear tonos puros a 16 kHz</title><desc id="d">Líneas con la frecuencia medida frente a la frecuencia real al muestrear a 16 kilohercios: hasta 8 000 hercios la medida coincide con la real; por encima del límite de 8 000 la medida se pliega hacia abajo: 9 000 se mide como 7 000, 12 000 como 4 000 y 15 000 como 1 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Frecuencia que mide una transformada al muestrear tonos puros a 16 kHz</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Frecuencia medida</tspan></text><rect x="192.18" y="45" width="12" height="12" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Sin plegado (medida = real)</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="387" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="312" x2="101.24" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">4 000</tspan></text><line x1="101.24" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="237" x2="101.24" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">8 000</tspan></text><line x1="101.24" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="162" x2="101.24" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">12 000</tspan></text><line x1="101.24" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="87" x2="101.24" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">16 000</tspan></text><line x1="101.24" y1="87" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="87" x2="119.24" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="387" x2="119.24" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">0</tspan></text><line x1="312.43" y1="87" x2="312.43" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="312.43" y1="387" x2="312.43" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="312.43" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312.43" dy="0">4 000</tspan></text><line x1="505.62" y1="87" x2="505.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="505.62" y1="387" x2="505.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="505.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505.62" dy="0">8 000</tspan></text><line x1="698.81" y1="87" x2="698.81" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="698.81" y1="387" x2="698.81" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="698.81" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="698.81" dy="0">12 000</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">16 000</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Frecuencia medida (Hz)</text><text x="505.62" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Frecuencia real del tono (Hz)</tspan></text><line x1="505.62" y1="87" x2="505.62" y2="387" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="510.62" y="100" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="510.62" dy="0">límite: 8 000 Hz</tspan></text><polyline points="167.537,368.25 360.728,293.25 553.918,255.75 698.81,312 843.702,368.25" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="167.537" cy="368.25" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="177.537" y="372.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="177.537" dy="0">1 000</tspan></text><circle cx="360.728" cy="293.25" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="360.728" y="317.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="360.728" dy="0">5 000</tspan></text><circle cx="553.918" cy="255.75" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="563.918" y="260.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="563.918" dy="0">9 000 → 7 000</tspan></text><circle cx="698.81" cy="312" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="708.81" y="316.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="708.81" dy="0">12 000 → 4 000</tspan></text><circle cx="843.702" cy="368.25" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="833.702" y="372.75" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="833.702" dy="0">15 000 → 1 000</tspan></text><polyline points="119.24,387 843.702,105.75" fill="none" stroke="#6b7c86" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="113.74" y="381.5" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="838.202" y="100.25" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sobre la mitad de la frecuencia de muestreo (8 kHz aquí) los tonos no desaparecen: se disfrazan de otro más grave, y nada</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">en las muestras permite distinguirlos. Por eso el filtro debe ir antes de muestrear. La transformada se calculó con</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Goertzel sobre 1 024 muestras; medida y fórmula coincidieron en los seis casos.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
