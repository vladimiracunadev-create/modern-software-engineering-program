<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 421" width="950" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Frecuencia que mide una transformada al muestrear tonos puros a 16 kHz</title><desc id="d">Tabla: al muestrear a 16 kilohercios un tono de 9000 hercios se mide como 7000, uno de 12000 como 4000 y uno de 15000 como 1000, mientras que los de 1000 y 5000 se miden correctamente; el valor medido coincide con la fórmula del pliegue.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="421" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Frecuencia real (Hz)</tspan></text><rect x="280" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Frecuencia medida (Hz)</tspan></text><rect x="610" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">¿Plegada sobre otra?</tspan></text><rect x="10" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">1 000</tspan></text><rect x="280" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">1 000</tspan></text><rect x="610" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">—</tspan></text><rect x="10" y="106" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">5 000</tspan></text><rect x="280" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">5 000</tspan></text><rect x="610" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">—</tspan></text><rect x="10" y="156" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">9 000</tspan></text><rect x="280" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">7 000</tspan></text><rect x="610" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">sí (8 000 es el límite)</tspan></text><rect x="10" y="206" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">12 000</tspan></text><rect x="280" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">4 000</tspan></text><rect x="610" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">sí</tspan></text><rect x="10" y="256" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">15 000</tspan></text><rect x="280" y="256" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">1 000</tspan></text><rect x="610" y="256" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">sí</tspan></text><rect x="10" y="310" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Sobre la mitad de la frecuencia de muestreo (8 kHz aquí) los tonos no desaparecen: se disfrazan de otro más grave, y nada en</tspan></text><text x="475" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">las muestras permite distinguirlos. Por eso el filtro debe ir antes de muestrear. La transformada se calculó con Goertzel</tspan></text><text x="475" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">sobre 1 024 muestras; medida y fórmula coincidieron en los seis casos.</tspan></text><text x="475" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
