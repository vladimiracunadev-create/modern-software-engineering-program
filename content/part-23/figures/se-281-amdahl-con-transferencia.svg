<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 377" width="940" height="377" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Aceleración total con una mejora de 50 veces en la parte acelerable, según la parte serie y la transferencia</title><desc id="d">Mapa de calor con la aceleración total para una mejora de 50 veces en la parte acelerable: con parte serie de 0,05 es 14,5 sin transferencia, 8,4 con transferencia de 0,05 y 3,7 con 0,20; con parte serie de 0,20 es 4,6, 3,8 y 2,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="377" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Aceleración total con una mejora de 50 veces en la parte acelerable, según la parte serie y la transferencia</tspan></text><text x="331.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="331.667" dy="0">Sin transferencia</tspan></text><text x="567" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="567" dy="0">Transferencia 5 %</tspan></text><text x="802.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="802.333" dy="0">Transferencia 20 %</tspan></text><text x="204" y="111.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Parte serie 5 %</tspan></text><text x="204" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Parte serie 20 %</tspan></text><rect x="215.5" y="73.5" width="232.333" height="67" rx="4" fill="#0f838f" stroke="#ffffff" stroke-width="1"/><text x="331.667" y="111.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="331.667" dy="0">14,5 ×</tspan></text><rect x="450.833" y="73.5" width="232.333" height="67" rx="4" fill="#67b1b7" stroke="#ffffff" stroke-width="1"/><text x="567" y="111.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="567" dy="0">8,4 ×</tspan></text><rect x="686.167" y="73.5" width="232.333" height="67" rx="4" fill="#aad5d6" stroke="#ffffff" stroke-width="1"/><text x="802.333" y="111.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="802.333" dy="0">3,7 ×</tspan></text><rect x="215.5" y="143.5" width="232.333" height="67" rx="4" fill="#9dced0" stroke="#ffffff" stroke-width="1"/><text x="331.667" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="331.667" dy="0">4,6 ×</tspan></text><rect x="450.833" y="143.5" width="232.333" height="67" rx="4" fill="#a9d4d5" stroke="#ffffff" stroke-width="1"/><text x="567" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="567" dy="0">3,8 ×</tspan></text><rect x="686.167" y="143.5" width="232.333" height="67" rx="4" fill="#bddfde" stroke="#ffffff" stroke-width="1"/><text x="802.333" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="802.333" dy="0">2,4 ×</tspan></text><text x="214" y="238" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="214" dy="0">0,0 ×</tspan></text><rect x="259.7" y="226" width="30.5" height="14" fill="#dff1ee"/><rect x="289.7" y="226" width="30.5" height="14" fill="#c0e1e0"/><rect x="319.7" y="226" width="30.5" height="14" fill="#a2d0d2"/><rect x="349.7" y="226" width="30.5" height="14" fill="#83c0c4"/><rect x="379.7" y="226" width="30.5" height="14" fill="#64b0b6"/><rect x="409.7" y="226" width="30.5" height="14" fill="#45a0a8"/><rect x="439.7" y="226" width="30.5" height="14" fill="#278f9a"/><rect x="469.7" y="226" width="30.5" height="14" fill="#087f8c"/><text x="507.7" y="238" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="507.7" dy="0">15,0 ×</tspan></text><text x="560.94" y="238" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="560.94" dy="0">más oscuro = mayor (veces)</tspan></text><rect x="10" y="254" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="278.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una mejora de 50 veces en el núcleo de cálculo termina entre 2,4 y 14,5 veces en el sistema. La fórmula es 1 / (s + t + (1</tspan></text><text x="470" y="295.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">− s)/k) con k = 50. Es aritmética, no una medición: la transferencia real depende del bus y de si los datos pueden quedarse</tspan></text><text x="470" y="312.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en el acelerador, y la parte serie de lo que se acelera de verdad.</tspan></text><text x="470" y="359.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 48; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
