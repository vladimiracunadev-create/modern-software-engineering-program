<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Peticiones por segundo de una capa densa de 1024 × 1024 en CPU según el tamaño del lote</title><desc id="d">Líneas con el rendimiento en peticiones por segundo según el tamaño del lote: 3693 con lote 1, 170 con lote 4, 3317 con lote 16, 8140 con lote 64 y 17863 con lote 256.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Peticiones por segundo de una capa densa de 1024 × 1024 en CPU según el tamaño del lote</tspan></text><line x1="101.24" y1="339" x2="910" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="339" x2="101.24" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="343.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="269" x2="910" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="269" x2="101.24" y2="269" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="273.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">5 000</tspan></text><line x1="101.24" y1="199" x2="910" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="199" x2="101.24" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="129" x2="910" y2="129" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="129" x2="101.24" y2="129" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="133.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">15 000</tspan></text><line x1="101.24" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="59" x2="101.24" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">20 000</tspan></text><line x1="101.24" y1="59" x2="101.24" y2="339" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="59" x2="119.24" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="339" x2="119.24" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">1</tspan></text><line x1="312.43" y1="59" x2="312.43" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="312.43" y1="339" x2="312.43" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="312.43" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312.43" dy="0">4</tspan></text><line x1="505.62" y1="59" x2="505.62" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="505.62" y1="339" x2="505.62" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="505.62" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505.62" dy="0">16</tspan></text><line x1="698.81" y1="59" x2="698.81" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="698.81" y1="339" x2="698.81" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="698.81" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="698.81" dy="0">64</tspan></text><line x1="892" y1="59" x2="892" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="339" x2="892" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">256</tspan></text><line x1="101.24" y1="339" x2="910" y2="339" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 199)">Peticiones por segundo</text><text x="505.62" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Tamaño del lote (escala logarítmica) (escala logarítmica)</tspan></text><polyline points="119.24,287.298 312.43,336.62 505.62,292.562 698.81,225.04 892,88.918" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="119.24" cy="287.298" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="119.24" y="276.298" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">3 693</tspan></text><circle cx="312.43" cy="336.62" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="312.43" y="325.62" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="312.43" dy="0">170</tspan></text><circle cx="505.62" cy="292.562" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="505.62" y="281.562" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="505.62" dy="0">3 317</tspan></text><circle cx="698.81" cy="225.04" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="698.81" y="214.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="698.81" dy="0">8 140</tspan></text><circle cx="892" cy="88.918" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="77.918" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">17 863</tspan></text><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El rendimiento sube de unas 3 700 a unas 17 900 peticiones por segundo con lotes de 1 a 256, pero no de forma monótona: con</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lote 4 cayó a 170 (de 170 a 363 en tres ejecuciones), una ruta lenta de la biblioteca para esa forma que no se investigó.</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La latencia por lote sube de 0,27 a 14,3 ms: cada petición espera a que el lote se llene y termine.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Mediciones de CPU con NumPy 2.5.5; no se ejecutó nada en un acelerador. El valor del lote 4 es una anomalía real de esa máquina.</tspan></text></svg>
