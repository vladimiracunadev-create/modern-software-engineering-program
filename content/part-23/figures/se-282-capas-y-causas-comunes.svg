<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 579" width="940" height="579" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de cruzar todas las capas de aislamiento según su número, con capas independientes y con un fallo común</title><desc id="d">Líneas en escala logarítmica con la probabilidad de cruzar todas las capas según su número: con p igual a 0,10 baja de 0,1 a 0,001 con tres capas independientes, con p igual a 0,02 baja de 0,02 a 0,000008 y con p igual a 0,02 y un fallo común entre pares de capas baja de 0,02 a 0,0004.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="579" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de cruzar todas las capas de aislamiento según su número, con capas independientes y con un</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">fallo común</tspan></text><circle cx="22" cy="70" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p = 0,10, capas independientes</tspan></text><rect x="290.2" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="310.2" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310.2" dy="0">p = 0,02, capas independientes</tspan></text><polygon points="570.4,63.1 577,75.4 563.8,75.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="584.4" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="584.4" dy="0">p = 0,02, con un fallo común entre pares</tspan></text><line x1="101.24" y1="396" x2="910" y2="396" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="396" x2="101.24" y2="396" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="400.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="323.5" x2="910" y2="323.5" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="323.5" x2="101.24" y2="323.5" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="328" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,0001</tspan></text><line x1="101.24" y1="251" x2="910" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="251" x2="101.24" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,001</tspan></text><line x1="101.24" y1="178.5" x2="910" y2="178.5" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="178.5" x2="101.24" y2="178.5" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="183" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,01</tspan></text><line x1="101.24" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="106" x2="101.24" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,1</tspan></text><line x1="101.24" y1="106" x2="101.24" y2="396" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="106" x2="119.24" y2="396" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="396" x2="119.24" y2="401" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">1</tspan></text><line x1="505.62" y1="106" x2="505.62" y2="396" stroke="#d5dde1" stroke-width="1"/><line x1="505.62" y1="396" x2="505.62" y2="401" stroke="#5b7280" stroke-width="1.4"/><text x="505.62" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505.62" dy="0">2</tspan></text><line x1="892" y1="106" x2="892" y2="396" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="396" x2="892" y2="401" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">3</tspan></text><line x1="101.24" y1="396" x2="910" y2="396" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="251" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 251)">Probabilidad de cruzarlas todas (escala logarítmica) (escala logarítmica)</text><text x="505.62" y="442" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Número de capas</tspan></text><polyline points="119.24,106 505.62,178.5 892,251" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="119.24" cy="106" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="505.62" cy="178.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="892" cy="251" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polyline points="119.24,156.675 505.62,279.851 892,396" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="113.74" y="151.175" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="500.12" y="274.351" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="886.5" y="390.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polyline points="119.24,156.675 505.62,156.675 892,279.851" fill="none" stroke="#946512" stroke-width="2.4"/><polygon points="119.24,150.35 125.29,161.625 113.19,161.625" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="505.62,150.35 511.67,161.625 499.57,161.625" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="892,273.526 898.05,284.801 885.95,284.801" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="10" y="456" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="480.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con dos capas que comparten una causa de fallo la probabilidad sigue en 0,02, como si no hubiera segunda capa. Antes de</tspan></text><text x="470" y="497.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">apilar una capa hay que preguntar qué no comparte con las anteriores. Las probabilidades por capa son supuestos del autor,</tspan></text><text x="470" y="514.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">no medidas; la realidad está entre la independencia total y la correlación total.</tspan></text><text x="470" y="561.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 48; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
