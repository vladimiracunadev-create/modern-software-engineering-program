<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de crear y destruir una frontera de aislamiento: instancia de WebAssembly, hilo y proceso de Python</title><desc id="d">Barras horizontales en escala logarítmica con el costo en milisegundos de crear y destruir cada frontera: una instancia de WebAssembly 0,092, un hilo 0,38 y un proceso nuevo de Python 99,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo de crear y destruir una frontera de aislamiento: instancia de WebAssembly, hilo y proceso de Python</tspan></text><line x1="314" y1="49" x2="314" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="181" x2="314" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0,01</tspan></text><line x1="452.41" y1="49" x2="452.41" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="452.41" y1="181" x2="452.41" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="452.41" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452.41" dy="0">0,1</tspan></text><line x1="590.82" y1="49" x2="590.82" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="590.82" y1="181" x2="590.82" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="590.82" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590.82" dy="0">1</tspan></text><line x1="729.23" y1="49" x2="729.23" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="729.23" y1="181" x2="729.23" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="729.23" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="729.23" dy="0">10</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="181" x2="867.64" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100</tspan></text><line x1="314" y1="181" x2="867.64" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Instancia de WebAssembly (módulo</tspan></text><text x="304" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">compilado)</tspan></text><text x="304" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Hilo del mismo proceso</tspan></text><text x="304" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Proceso nuevo de Python</tspan></text><rect x="314" y="55" width="133.398" height="32" rx="3" fill="#102a43"/><text x="454.398" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="454.398" dy="0">0,092</tspan></text><rect x="314" y="99" width="218.658" height="32" rx="3" fill="#102a43"/><text x="539.658" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="539.658" dy="0">0,380</tspan></text><rect x="314" y="143" width="553.278" height="32" rx="3" fill="#102a43"/><text x="874.278" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="874.278" dy="0">99,400</tspan></text><text x="590.82" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="590.82" dy="0">Milisegundos (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La instancia es unas mil veces más barata que el proceso. Que el hilo cueste más que la instancia no se investigó. El</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">proceso tardó entre unos 100 y unos 160 ms en distintas ejecuciones. No se midieron contenedores ni microVM: en esta</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">máquina Docker corre sobre WSL2 y su arranque mediría esa capa y no la frontera.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
