3" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Los dos errores no cuestan lo mismo: un duplicado sin fusionar fragmenta una historia clínica; una fusión errónea mezcla la de</tspan></text><text x="485" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">dos personas, y ese es el error que puede dañar. Por eso la zona intermedia se envía a revisión humana en lugar de decidirse</tspan></text><text x="485" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">con un umbral único. Nombres y errores de tecleo sintéticos.</tspan></text><text x="485" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
