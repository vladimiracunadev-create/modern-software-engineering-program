<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 298" width="940" height="298" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nodos mal en una flota de 1 000: cuántos detecta la atestación de arranque</title><desc id="d">Barras apiladas horizontales con los 39 nodos mal de una flota de 1000: 7 con el arranque alterado, que la atestación detecta, y 32 explotados en ejecución con el software legítimo, que la atestación de arranque no detecta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="298" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nodos mal en una flota de 1 000: cuántos detecta la atestación de arranque</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Arranque alterado: detectados</tspan></text><rect x="282.66" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Explotados en ejecución: no detectados</tspan></text><line x1="234" y1="77" x2="234" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="234" y1="117" x2="234" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="234" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">0</tspan></text><line x1="394.425" y1="77" x2="394.425" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="394.425" y1="117" x2="394.425" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="394.425" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.425" dy="0">10</tspan></text><line x1="554.85" y1="77" x2="554.85" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="554.85" y1="117" x2="554.85" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="554.85" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="554.85" dy="0">20</tspan></text><line x1="715.275" y1="77" x2="715.275" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="715.275" y1="117" x2="715.275" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="715.275" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="715.275" dy="0">30</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="117" x2="875.7" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">40</tspan></text><line x1="234" y1="117" x2="875.7" y2="117" stroke="#5b7280" stroke-width="1.6"/><text x="224" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="224" dy="0">Flota de 1 000 nodos: 39 mal</tspan></text><rect x="234" y="84" width="112.298" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="290.149" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290.149" dy="0">7</tspan></text><rect x="346.298" y="84" width="513.36" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="602.977" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602.977" dy="0">32</tspan></text><text x="866.658" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="866.658" dy="0">39</tspan></text><text x="554.85" y="161" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="554.85" dy="0">Nodos mal</tspan></text><rect x="10" y="175" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La atestación de arranque detecta 7 de 39 (18 %): los explotados en ejecución con el software legítimo no cambian la</tspan></text><text x="470" y="216.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">medición. Los porcentajes (1 % alterado en el arranque y 3 % explotado en ejecución, semilla 48) son supuestos del autor;</tspan></text><text x="470" y="233.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el patrón, no. Una atestación demuestra qué código se cargó, no que ese código sea seguro.</tspan></text><text x="470" y="280.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 48; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
