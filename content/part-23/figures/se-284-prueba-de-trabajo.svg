<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Prueba de trabajo con SHA-256: intentos para hallar un hash con n ceros iniciales</title><desc id="d">Líneas en escala logarítmica con los intentos para hallar un hash SHA-256 con n ceros iniciales: el valor esperado 2 elevado a n sube de 256 con 8 bits a 65 536 con 16; la media medida (283,5 a 47 442,1) y la mediana medida (174,0 a 27 372,0) crecen en paralelo, con la mediana siempre por debajo de la media.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Prueba de trabajo con SHA-256: intentos para hallar un hash con n ceros iniciales</tspan></text><circle cx="22" cy="51" r="6" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Esperado 2ⁿ</tspan></text><rect x="146.94" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Media medida</tspan></text><polygon points="291.42,44.1 298.02,56.4 284.82,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="305.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="305.42" dy="0">Mediana medida</tspan></text><line x1="108.78" y1="387" x2="910" y2="387" stroke="#d5d