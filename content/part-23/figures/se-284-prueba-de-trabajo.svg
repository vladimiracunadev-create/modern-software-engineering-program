.956" cy="105.352" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="738.956" y="94.352" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="738.956" dy="0">65 536</tspan></text><polyline points="126.78,341.745 279.824,289.406 432.868,226.5 585.912,168.727 738.956,119.384" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="121.28" y="336.245" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="274.324" y="283.906" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="427.368" y="221" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="580.412" y="163.227" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="733.456" y="113.884" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="748.956" y="123.884" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="748.956" dy="0">47 442</tspan></text><polyline points="126.78,362.945 279.824,305.809 432.868,239.996 585.912,183.132 738.956,143.269" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="126.78,356.62 132.83,367.895 120.73,367.895" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="279.824,299.484 285.874,310.759 273.774,310.759" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="432.868,233.671 438.918,244.946 426.818,244.946" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="585.912,176.807 591.962,188.082 579.862,188.082" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="738.956,136.944 745.006,148.219 732.906,148.219" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="748.956" y="147.769" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="748.956" dy="0">27 372</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El coste crece al doble por cada bit, y el tiempo de un bloque es una variable aleatoria con mucha dispersión (mínimo 26,</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">máximo 15 969 con 12 bits). Rehacer 10 bloques encadenados de 12 bits costó unos 48 785 intentos frente a 310 de uno solo.</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 40 bloques, la media de 16 bits aún fluctúa.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
