<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Porcentaje de mediciones correctas de un estado GHZ según el número de qubits y la probabilidad de error por puerta</title><desc id="d">Mapa de calor con el porcentaje de mediciones correctas de un estado GHZ según el número de qubits y la probabilidad de error por puerta: con 0,001 está entre 99,6 y 100 por ciento, con 0,01 baja de 99,8 a 95,7 y con 0,05 baja de 97,2 a 79,5 al pasar de 2 a 10 qubits.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="476" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Porcentaje de mediciones correctas de un estado GHZ según el número de qubits y la probabilidad de error por</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">puerta</tspan></text><text x="281.667" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="281.667" dy="0">Error 0,001</tspan></text><text x="537" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="537" dy="0">Error 0,01</tspan></text><text x="792.333" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="792.333" dy="0">Error 0,05</tspan></text><text x="144" y="117.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">2 qubits</tspan></text><text x="144" y="161.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">4 qubits</tspan></text><text x="144" y="205.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">6 qubits</tspan></text><text x="144" y="249.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">8 qubits</tspan></text><text x="144" y="293.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">10 qubits</tspan></text><rect x="155.5" y="92.5" width="252.333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="281.667" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="281.667" dy="0">100,0 %</tspan></text><rect x="410.833" y="92.5" width="252.333" height="41" rx="4" fill="#0a808d" stroke="#ffffff" stroke-width="1"/><text x="537" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">99,8 %</tspan></text><rect x="666.167" y="92.5" width="252.333" height="41" rx="4" fill="#208c97" stroke="#ffffff" stroke-width="1"/><text x="792.333" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792.333" dy="0">97,2 %</tspan></text><rect x="155.5" y="136.5" width="252.333" height="41" rx="4" fill="#0b808d" stroke="#ffffff" stroke-width="1"/><text x="281.667" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="281.667" dy="0">99,7 %</tspan></text><rect x="410.833" y="136.5" width="252.333" height="41" rx="4" fill="#138591" stroke="#ffffff" stroke-width="1"/><text x="537" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">98,7 %</tspan></text><rect x="666.167" y="136.5" width="252.333" height="41" rx="4" fill="#4ca3ab" stroke="#ffffff" stroke-width="1"/><text x="792.333" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="792.333" dy="0">92,1 %</tspan></text><rect x="155.5" y="180.5" width="252.333" height="41" rx="4" fill="#0b808d" stroke="#ffffff" stroke-width="1"/><text x="281.667" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="281.667" dy="0">99,7 %</tspan></text><rect x="410.833" y="180.5" width="252.333" height="41" rx="4" fill="#1e8a96" stroke="#ffffff" stroke-width="1"/><text x="537" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">97,5 %</tspan></text><rect x="666.167" y="180.5" width="252.333" height="41" rx="4" fill="#68b2b8" stroke="#ffffff" stroke-width="1"/><text x="792.333" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="792.333" dy="0">88,8 %</tspan></text><rect x="155.5" y="224.5" width="252.333" height="41" rx="4" fill="#0a808d" stroke="#ffffff" stroke-width="1"/><text x="281.667" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="281.667" dy="0">99,8 %</tspan></text><rect x="410.833" y="224.5" width="252.333" height="41" rx="4" fill="#268f9a" stroke="#ffffff" stroke-width="1"/><text x="537" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="537" dy="0">96,5 %</tspan></text><rect x="666.167" y="224.5" width="252.333" height="41" rx="4" fill="#93c9cc" stroke="#ffffff" stroke-width="1"/><text x="792.333" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="792.333" dy="0">83,8 %</tspan></text><rect x="155.5" y="268.5" width="252.333" height="41" rx="4" fill="#0b818e" stroke="#ffffff" stroke-width="1"/><text x="281.667" y="293.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="281.667" dy="0">99,6 %</tspan></text><rect x="410.833" y="268.5" width="252.333" height="41" rx="4" fill="#2d939d" stroke="#ffffff" stroke-width="1"/><text x="537" y="293.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="537" dy="0">95,7 %</tspan></text><rect x="666.167" y="268.5" width="252.333" height="41" rx="4" fill="#b8dcdc" stroke="#ffffff" stroke-width="1"/><text x="792.333" y="293.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="792.333" dy="0">79,5 %</tspan></text><text x="154" y="337" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="154" dy="0">75,0 %</tspan></text><rect x="207.24" y="325" width="30.5" height="14" fill="#dff1ee"/><rect x="237.24" y="325" width="30.5" height="14" fill="#c0e1e0"/><rect x="267.24" y="325" width="30.5" height="14" fill="#a2d0d2"/><rect x="297.24" y="325" width="30.5" height="14" fill="#83c0c4"/><rect x="327.24" y="325" width="30.5" height="14" fill="#64b0b6"/><rect x="357.24" y="325" width="30.5" height="14" fill="#45a0a8"/><rect x="387.24" y="325" width="30.5" height="14" fill="#278f9a"/><rect x="417.24" y="325" width="30.5" height="14" fill="#087f8c"/><text x="455.24" y="337" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="455.24" dy="0">100,0 %</tspan></text><text x="516.02" y="337" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="516.02" dy="0">más oscuro = mayor (% correctas)</tspan></text><rect x="10" y="353" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="377.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El efecto se acumula con el número de puertas y con la probabilidad de error: con 10 qubits y error de 0,05, una de cada</tspan></text><text x="470" y="394.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cinco mediciones es incorrecta. El modelo cuenta solo la medición inmediata (4 000 repeticiones por celda, semilla 48) y</tspan></text><text x="470" y="411.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">subestima el daño en algoritmos que interfieren, donde los errores de fase destruyen justo la cancelación que se necesita.</tspan></text><text x="470" y="458.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación clásica con NumPy: no hubo acceso a ningún ordenador cuántico ni se ejecutó ningún SDK de proveedor.</tspan></text></svg>
