<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 471" width="950" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Candidatos examinados por una consulta de radio de 1 km según el tamaño de celda de una rejilla</title><desc id="d">Tabla: con puntos uniformes una rejilla de 1 kilómetro examina 18 candidatos por consulta para hallar 6,4 resultados; con puntos agrupados en una ciudad examina 1260 para hallar 455; la fuerza bruta examina 20000 en ambos casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="471" fill="#ffffff"/><rect x="10" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Tamaño de celda</tspan></text><rect x="240" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">Candidatos (uniforme; 6,4 resultados)</tspan></text><rect x="590" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="762" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">Candidatos (agrupado; 455,5 resultados)</tspan></text><rect x="10" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">0,5 km</tspan></text><rect x="240" y="56" width="344" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">12,7</tspan></text><rect x="590" y="56" width="344" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">894,4</tspan></text><rect x="10" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">1 km</tspan></text><rect x="240" y="106" width="344" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">18,0</tspan></text><rect x="590" y="106" width="344" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">1 260,5</tspan></text><rect x="10" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">2 km</tspan></text><rect x="240" y="156" width="344" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">31,6</tspan></text><rect x="590" y="156" width="344" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">2 131,0</tspan></text><rect x="10" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">5 km</tspan></text><rect x="240" y="206" width="344" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">98,6</tspan></text><rect x="590" y="206" width="344" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">5 189,9</tspan></text><rect x="10" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">20 km</tspan></text><rect x="240" y="256" width="344" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">934,8</tspan></text><rect x="590" y="256" width="344" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">16 106,8</tspan></text><rect x="10" y="306" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Fuerza bruta</tspan></text><rect x="240" y="306" width="344" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">20 000</tspan></text><rect x="590" y="306" width="344" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">20 000</tspan></text><rect x="10" y="360" width="930" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">El índice reduce el trabajo de 20 000 a 18 candidatos cuando los datos se reparten por igual, y a 1 260 cuando se agrupan:</tspan></text><text x="475" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">la distribución de los datos decide cuánto ayuda. Una celda mucho mayor que el radio pierde la ventaja. Se cuentan</tspan></text><text x="475" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">candidatos, no milisegundos: no se midió ninguna base de datos espacial.</tspan></text><text x="475" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
