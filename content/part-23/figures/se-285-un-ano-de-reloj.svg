<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 384" width="940" height="384" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una zona con cambio de hora sintético (UTC−4 y UTC−3): lo que hace un año de reloj</title><desc id="d">Línea de tiempo de un año en una zona sintética: UTC−4 hasta el día 120, UTC−3 del día 120 al 300 y UTC−4 desde el 300; en el día 120 falta una hora local (día de 23 horas) y en el 300 una hora se repite (día de 25 horas); una tarea diaria guardada como 13:00 UTC cae a las 10:00 locales los 180 días de verano en vez de a las 09:00.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="384" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una zona con cambio de hora sintético (UTC−4 y UTC−3): lo que hace un año de reloj</tspan></text><line x1="254" y1="83" x2="254" y2="203" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="203" x2="254" y2="208" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="362.164" y1="83" x2="362.164" y2="203" stroke="#d5dde1" stroke-width="1"/><line x1="362.164" y1="203" x2="362.164" y2="208" stroke="#5b7280" stroke-width="1.4"/><text x="362.164" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362.164" dy="0">60</tspan></text><line x1="470.329" y1="83" x2="470.329" y2="203" stroke="#d5dde1" stroke-width="1"/><line x1="470.329" y1="203" x2="470.329" y2="208" stroke="#5b7280" stroke-width="1.4"/><text x="470.329" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470.329" dy="0">120</tspan></text><line x1="578.493" y1="83" x2="578.493" y2="203" stroke="#d5dde1" stroke-width="1"/><line x1="578.493" y1="203" x2="578.493" y2="208" stroke="#5b7280" stroke-width="1.4"/><text x="578.493" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="578.493" dy="0">180</tspan></text><line x1="686.658" y1="83" x2="686.658" y2="203" stroke="#d5dde1" stroke-width="1"/><line x1="686.658" y1="203" x2="686.658" y2="208" stroke="#5b7280" stroke-width="1.4"/><text x="686.658" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686.658" dy="0">240</tspan></text><line x1="794.822" y1="83" x2="794.822" y2="203" stroke="#d5dde1" stroke-width="1"/><line x1="794.822" y1="203" x2="794.822" y2="208" stroke="#5b7280" stroke-width="1.4"/><text x="794.822" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="794.822" dy="0">300</tspan></text><line x1="912" y1="83" x2="912" y2="203" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="203" x2="912" y2="208" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">365</tspan></text><line x1="254" y1="203" x2="912" y2="203" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="117.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Regla de desfase de la zona</tspan></text><text x="244" y="169" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Tarea «09:00 local» guardada</tspan></text><text x="244" y="186" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">como 13:00 UTC</tspan></text><line x1="470.329" y1="75" x2="470.329" y2="203" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="470.329" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470.329" dy="0">día 120: día de 23 h</tspan></text><line x1="794.822" y1="75" x2="794.822" y2="203" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="794.822" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.822" dy="0">día 300: día de 25 h</tspan></text><rect x="254" y="92" width="216.329" height="42" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="362.164" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362.164" dy="0">UTC−4</tspan></text><rect x="470.329" y="92" width="324.493" height="42" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="632.575" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632.575" dy="0">UTC−3 (horario de verano)</tspan></text><rect x="794.822" y="92" width="117.178" height="42" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="853.411" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="853.411" dy="0">UTC−4</tspan></text><line x1="14" y1="143" x2="912" y2="143" stroke="#d5dde1" stroke-width="1"/><rect x="254" y="152" width="216.329" height="42" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="362.164" y="177.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362.164" dy="0">09:00 correcta</tspan></text><rect x="470.329" y="152" width="324.493" height="42" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="632.575" y="177.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632.575" dy="0">10:00 equivocada (180 días)</tspan></text><rect x="794.822" y="152" width="117.178" height="42" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="853.411" y="177.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="853.411" dy="0">09:00</tspan></text><text x="583" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="583" dy="0">Día del año (365 días, 8 760 horas UTC)</tspan></text><rect x="10" y="261" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="285.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una hora local sin zona no identifica un instante: la mitad del año una tarea «a las 09:00» guardada como UTC se ejecuta</tspan></text><text x="470" y="302.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una hora corrida. Guardar el instante en UTC y la regla de zona por separado evita ambos. Las reglas de la zona son</tspan></text><text x="470" y="319.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sintéticas; no se usó la base de datos de zonas horarias.</tspan></text><text x="470" y="366.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
