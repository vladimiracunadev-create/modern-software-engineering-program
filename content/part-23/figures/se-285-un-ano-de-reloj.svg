<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 519" width="950" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una zona con cambio de hora sintético (UTC−4 y UTC−3): lo que hace un año de reloj</title><desc id="d">Tabla: en una zona sintética con horario de verano, las 8760 horas de un año producen 8759 horas locales distintas, una repetida y una inexistente; hay un día de 23 horas y uno de 25; una tarea diaria guardada como hora UTC fija cae a la hora local equivocada en 180 de 365 días.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="519" fill="#ffffff"/><rect x="10" y="12" width="674" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="347" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">Medida</tspan></text><rect x="690" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Valor</tspan></text><rect x="10" y="56" width="674" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">Horas UTC de un año</tspan></text><rect x="690" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">8 760</tspan></text><rect x="10" y="114" width="674" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">Horas locales distintas que aparecen</tspan></text><rect x="690" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">8 759</tspan></text><rect x="10" y="172" width="674" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">Hora local que se repite (ambigua)</tspan></text><rect x="690" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">1</tspan></text><rect x="10" y="230" width="674" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">Hora local que no existe</tspan></text><rect x="690" y="230" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">1</tspan></text><rect x="10" y="288" width="674" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">Días locales de 23 h / 24 h / 25 h</tspan></text><rect x="690" y="288" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">1 / 362 / 1</tspan></text><rect x="10" y="346" width="674" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="375.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">Tarea diaria «09:00 local» guardada como 13:00 UTC fijas: días en hora equivocada</tspan></text><rect x="690" y="346" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="375.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">180 de 365</tspan></text><rect x="10" y="408" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Una hora local sin zona no identifica un instante: la mitad del año una tarea «a las 09:00» guardada como UTC se ejecuta una</tspan></text><text x="475" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">hora corrida. Guardar el instante en UTC y la regla de zona por separado evita ambos. Las reglas de la zona son sintéticas;</tspan></text><text x="475" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">no se usó la base de datos de zonas horarias.</tspan></text><text x="475" y="505.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
