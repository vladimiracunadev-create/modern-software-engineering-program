<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" width="1000" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Eventos ejecutados dos veces cuando el 5 % se entrega de nuevo y se guarda cada identificador un tiempo limitado</title><desc id="d">Barras: si el cinco por ciento de los eventos se vuelve a entregar con un retraso lognormal de mediana 30 segundos, sin deduplicar se ejecuta dos veces el 5 por ciento; con una memoria de 60 segundos el 1,6; con una de cinco minutos el 0,3; con una de una hora 4 de cada cien mil; con una de un día ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="395" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Sin deduplicar (TTL 0)</tspan></text><rect x="300" y="16" width="650" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="958" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="958" dy="0">5,0 % de los eventos</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">TTL de 10 s</tspan></text><rect x="300" y="60" width="495.3" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="803.3" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="803.3" dy="0">3,8 %</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">TTL de 60 s</tspan></text><rect x="300" y="104" width="209.3" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="517.3" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="517.3" dy="0">1,6 %</tspan></text><text x="290" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">TTL de 5 min</tspan></text><rect x="300" y="148" width="39" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="347" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="347" dy="0">0,30 %</tspan></text><text x="290" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">TTL de 1 h</tspan></text><rect x="300" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="312" dy="0">4 de 100 000</tspan></text><text x="290" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">TTL de 24 h</tspan></text><rect x="300" y="236" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="312" dy="0">0</tspan></text><rect x="10" y="284" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Una memoria de identificadores con vida corta no basta: las re-entregas con retraso largo (cola de una cola, reintento tras un</tspan></text><text x="500" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">fallo) la superan. El TTL es una decisión de coste (memoria) frente a riesgo (duplicados). Retraso lognormal con mediana de 30 s y</tspan></text><text x="500" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">σ = 1,5, supuestos del autor; 100 000 eventos.</tspan></text><text x="500" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
