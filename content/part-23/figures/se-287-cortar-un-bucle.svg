<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 337" width="940" height="337" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo que tardó el anfitrión en cortar un bucle infinito: módulo de WebAssembly con combustible y proceso hijo con límite de tiempo</title><desc id="d">Barras horizontales con el tiempo en milisegundos para cortar un bucle infinito: el módulo de WebAssembly con 2 000 000 de unidades de combustible 27 y el proceso hijo con límite de 0,5 segundos 629.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="337" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tiempo que tardó el anfitrión en cortar un bucle infinito: módulo de WebAssembly con combustible y proceso</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">hijo con límite de tiempo</tspan></text><line x1="324" y1="68" x2="324" y2="156" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="156" x2="324" y2="161" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="465.955" y1="68" x2="465.955" y2="156" stroke="#d5dde1" stroke-width="1"/><line x1="465.955" y1="156" x2="465.955" y2="161" stroke="#5b7280" stroke-width="1.4"/><text x="465.955" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465.955" dy="0">200</tspan></text><line x1="607.91" y1="68" x2="607.91" y2="156" stroke="#d5dde1" stroke-width="1"/><line x1="607.91" y1="156" x2="607.91" y2="161" stroke="#5b7280" stroke-width="1.4"/><text x="607.91" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607.91" dy="0">400</tspan></text><line x1="749.865" y1="68" x2="749.865" y2="156" stroke="#d5dde1" stroke-width="1"/><line x1="749.865" y1="156" x2="749.865" y2="161" stroke="#5b7280" stroke-width="1.4"/><text x="749.865" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.865" dy="0">600</tspan></text><line x1="891.82" y1="68" x2="891.82" y2="156" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="156" x2="891.82" y2="161" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">800</tspan></text><line x1="324" y1="156" x2="891.82" y2="156" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="86" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Módulo de WebAssembly (2 000 000 de</tspan></text><text x="314" y="103" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">combustible)</tspan></text><text x="314" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Proceso hijo (límite de 0,5 s)</tspan></text><rect x="324" y="74" width="19.1639" height="32" rx="3" fill="#102a43"/><text x="350.164" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="350.164" dy="0">27</tspan></text><rect x="324" y="118" width="446.448" height="32" rx="3" fill="#102a43"/><text x="777.448" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="777.448" dy="0">629</tspan></text><text x="607.91" y="200" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">Milisegundos hasta el corte</tspan></text><rect x="10" y="214" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="238.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los dos tiempos dependen de los parámetros elegidos (2 000 000 de unidades de combustible y 0,5 s) y no son comparables</tspan></text><text x="470" y="255.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">como velocidad de aislamiento: con otro combustible el módulo tardaría otro tiempo, y el proceso incluye su límite y su</tspan></text><text x="470" y="272.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">arranque. Lo que muestran es que el mecanismo de corte existe en ambos y que su costo es parte de la decisión.</tspan></text><text x="470" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
