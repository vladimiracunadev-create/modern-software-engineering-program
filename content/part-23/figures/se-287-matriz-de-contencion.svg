<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 535" width="940" height="535" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis comportamientos hostiles contra tres formas de ejecutar código ajeno: qué contuvo cada una</title><desc id="d">Mapa de calor con seis comportamientos hostiles y tres candidatos: el bucle infinito lo contienen el proceso hijo y el módulo de WebAssembly; la bomba de memoria, leer un archivo ajeno y abrir una conexión de red solo el módulo; leer el entorno el proceso hijo y el módulo; la introspección la hace inocua el módulo; el exec sin funciones integradas no contiene ninguno de los probados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="535" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis comportamientos hostiles contra tres formas de ejecutar código ajeno: qué contuvo cada una</tspan></text><text x="381.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">exec sin funciones</tspan></text><text x="381.667" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">integradas</tspan></text><text x="597" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">Proceso hijo con entorno</tspan></text><text x="597" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">vacío</tspan></text><text x="812.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="812.333" dy="0">Módulo de WebAssembly</tspan></text><text x="264" y="115.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Bucle infinito</tspan></text><text x="264" y="159.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Bomba de memoria</tspan></text><text x="264" y="203.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Leer un archivo ajeno</tspan></text><text x="264" y="247.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Leer el entorno del servicio</tspan></text><text x="264" y="291.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Abrir una conexión de red</tspan></text><text x="264" y="335.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Escapar por introspección</tspan></text><rect x="275.5" y="90.5" width="212.333" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">—</tspan></text><rect x="490.833" y="90.5" width="212.333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="597" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">contuvo</tspan></text><rect x="706.167" y="90.5" width="212.333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">contuvo</tspan></text><rect x="275.5" y="134.5" width="212.333" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">—</tspan></text><rect x="490.833" y="134.5" width="212.333" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="597" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">no contuvo</tspan></text><rect x="706.167" y="134.5" width="212.333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">contuvo</tspan></text><rect x="275.5" y="178.5" width="212.333" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">—</tspan></text><rect x="490.833" y="178.5" width="212.333" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="597" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">no contuvo</tspan></text><rect x="706.167" y="178.5" width="212.333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">contuvo</tspan></text><rect x="275.5" y="222.5" width="212.333" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">no contuvo</tspan></text><rect x="490.833" y="222.5" width="212.333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="597" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">contuvo</tspan></text><rect x="706.167" y="222.5" width="212.333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">contuvo</tspan></text><rect x="275.5" y="266.5" width="212.333" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">—</tspan></text><rect x="490.833" y="266.5" width="212.333" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="597" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">no contuvo</tspan></text><rect x="706.167" y="266.5" width="212.333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">contuvo</tspan></text><rect x="275.5" y="310.5" width="212.333" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">no contuvo</tspan></text><rect x="490.833" y="310.5" width="212.333" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="597" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">—</tspan></text><rect x="706.167" y="310.5" width="212.333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">contuvo</tspan></text><text x="274" y="379" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="274" dy="0">no contuvo</tspan></text><rect x="357.4" y="367" width="30.5" height="14" fill="#dff1ee"/><rect x="387.4" y="367" width="30.5" height="14" fill="#c0e1e0"/><rect x="417.4" y="367" width="30.5" height="14" fill="#a2d0d2"/><rect x="447.4" y="367" width="30.5" height="14" fill="#83c0c4"/><rect x="477.4" y="367" width="30.5" height="14" fill="#64b0b6"/><rect x="507.4" y="367" width="30.5" height="14" fill="#45a0a8"/><rect x="537.4" y="367" width="30.5" height="14" fill="#278f9a"/><rect x="567.4" y="367" width="30.5" height="14" fill="#087f8c"/><text x="605.4" y="379" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="605.4" dy="0">contuvo</tspan></text><text x="666.18" y="379" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="666.18" dy="0">más oscuro = mayor (contuvo)</tspan></text><rect x="10" y="395" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="419.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ninguna columna contiene todo salvo el módulo, que lo logra porque no puede expresar esas operaciones y solo ejecuta código</tspan></text><text x="470" y="436.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">compilado a Wasm. El proceso hijo contiene el bucle y el entorno, no la memoria, los archivos ni la red. El guion es «no se</tspan></text><text x="470" y="453.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ejecutó» (el bucle y la memoria en el mismo proceso no se pueden probar sin colgarlo) o «no aplica» (un intérprete</tspan></text><text x="470" y="469.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">completo).</tspan></text><text x="470" y="517.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
