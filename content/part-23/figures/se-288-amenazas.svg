="330.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="741.2" y="353.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="741.2" dy="0">—</tspan></text><rect x="802.3" y="330.5" width="116.2" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="860.4" y="353.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="860.4" dy="0">contiene</tspan></text><text x="324" y="395" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="324" dy="0">—</tspan></text><rect x="339.54" y="383" width="30.5" height="14" fill="#dff1ee"/><rect x="369.54" y="383" width="30.5" height="14" fill="#c0e1e0"/><rect x="399.54" y="383" width="30.5" height="14" fill="#a2d0d2"/><rect x="429.54" y="383" width="30.5" height="14" fill="#83c0c4"/><rect x="459.54" y="383" width="30.5" height="14" fill="#64b0b6"/><rect x="489.54" y="383" width="30.5" height="14" fill="#45a0a8"/><rect x="519.54" y="383" width="30.5" height="14" fill="#278f9a"/><rect x="549.54" y="383" width="30.5" height="14" fill="#087f8c"/><text x="587.54" y="395" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="587.54" dy="0">contiene</tspan></text><text x="655.86" y="395" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="655.86" dy="0">más oscuro = mayor (contiene)</tspan></text><rect x="10" y="411" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="435.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ninguna fila queda sin marca y ninguna columna queda vacía: cada mecanismo existe porque una amenaza lo exige y cada uno</tspan></text><text x="470" y="452.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">necesita una prueba que falle si se quita. Los límites de ejecución agrupan combustible, memoria acotada y memoria lineal.</tspan></text><text x="470" y="469.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las amenazas que la referencia no cubre (autenticación, entorno del anfitrión, hardware) no son filas porque no hay</tspan></text><text x="470" y="485.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mecanismo que marcar.</tspan></text><text x="470" y="533.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
