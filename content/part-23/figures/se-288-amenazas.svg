 font-weight="700" fill="#ffffff"><tspan x="502.8" dy="0">contiene</tspan></text><rect x="563.9" y="210.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="622" y="233.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">—</tspan></text><rect x="683.1" y="210.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="741.2" y="233.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="741.2" dy="0">—</tspan></text><rect x="802.3" y="210.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="860.4" y="233.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="860.4" dy="0">—</tspan></text><rect x="325.5" y="250.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="383.6" y="273.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="383.6" dy="0">—</tspan></text><rect x="444.7" y="250.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="502.8" y="273.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="502.8" dy="0">—</tspan></text><rect x="563.9" y="250.5" width="116.2" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="622" y="273.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">contiene</tspan></text><rect x="683.1" y="250.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="741.2" y="273.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="741.2" dy="0">—</tspan></text><rect x="802.3" y="250.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="860.4" y="273.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x