<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete amenazas de la plataforma de referencia y el mecanismo que contiene cada una</title><desc id="d">Mapa de calor con siete amenazas y cinco mecanismos de contención: el acceso a archivos o red lo contiene el validador de subida; que no termine, que reserve memoria o que lea fuera de su memoria, los límites de ejecución; que filtre estado, la instancia por petición; alterar o borrar el registro, la cadena de resúmenes; y alterar el informe, la firma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Siete amenazas de la plataforma de referencia y el mecanismo que contiene cada una</tspan></text><text x="383.6" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="383.6" dy="0">Validador de</tspan></text><text x="383.6" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="383.6" dy="0">subida</tspan></text><text x="502.8" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="502.8" dy="0">Límites de</tspan></text><text x="502.8" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="502.8" dy="0">ejecución</tspan></text><text x="622" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">Instancia por</tspan></text><text x="622" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">petición</tspan></text><text x="741.2" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="741.2" dy="0">Cadena de</tspan></text><text x="741.2" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="741.2" dy="0">resúmenes</tspan></text><text x="860.4" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="860.4" dy="0">Firma del</tspan></text><text x="860.4" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="860.4" dy="0">informe</tspan></text><text x="314" y="113.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Una regla pide acceso a archivos o red</tspan></text><text x="314" y="153.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Una regla no termina</tspan></text><text x="314" y="193.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Una regla reserva memoria sin límite</tspan></text><text x="314" y="233.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Una regla lee fuera de su memoria</tspan></text><text x="314" y="265" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Una regla filtra estado a la siguiente</tspan></text><text x="314" y="282" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">petición</tspan></text><text x="314" y="313.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Alguien altera o borra el registro</tspan></text><text x="314" y="353.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Alguien altera el informe</tspan></text><rect x="325.5" y="90.5" width="116.2" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="383.6" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="383.6" dy="0">contiene</tspan></text><rect x="444.7" y="90.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="502.8" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="502.8" dy="0">—</tspan></text><rect x="563.9" y="90.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="622" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">—</tspan></text><rect x="683.1" y="90.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="741.2" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="741.2" dy="0">—</tspan></text><rect x="802.3" y="90.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="860.4" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="860.4" dy="0">—</tspan></text><rect x="325.5" y="130.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="383.6" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="383.6" dy="0">—</tspan></text><rect x="444.7" y="130.5" width="116.2" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="502.8" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502.8" dy="0">contiene</tspan></text><rect x="563.9" y="130.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="622" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">—</tspan></text><rect x="683.1" y="130.5" width="116.2" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="741.2" 