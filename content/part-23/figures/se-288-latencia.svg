<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 425" width="940" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Latencia por petición con instancia nueva y módulo ya compilado: mediana, percentil 99 y máximo de dos reglas</title><desc id="d">Intervalos de percentiles en milisegundos con la mediana, el percentil 99 y el máximo de 1012 peticiones de la regla estándar, 0,338, 1,106 y 5,321, y de 988 peticiones de la regla con cálculo, 0,344, 1,416 y 17,254.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="425" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Latencia por petición con instancia nueva y módulo ya compilado: mediana, percentil 99 y máximo de dos</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">reglas</tspan></text><rect x="16" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p50</tspan></text><polygon points="92.62,63.1 99.22,75.4 86.02,75.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="106.62" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="106.62" dy="0">p99</tspan></text><polygon points="163.24,62.5 170.74,70 163.24,77.5 155.74,70" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="177.24" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="177.24" dy="0">máx</tspan></text><line x1="294" y1="96" x2="294" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="244" x2="294" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0,1</tspan></text><line x1="492.667" y1="96" x2="492.667" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="492.667" y1="244" x2="492.667" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="492.667" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492.667" dy="0">1</tspan></text><line x1="691.333" y1="96" x2="691.333" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="691.333" y1="244" x2="691.333" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="691.333" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691.333" dy="0">10</tspan></text><line x1="890" y1="96" x2="890" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="244" x2="890" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">100</tspan></text><line x1="294" y1="244" x2="890" y2="244" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="137.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Regla estándar (1 012 peticiones)</tspan></text><text x="264" y="211.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Regla con cálculo (988 peticiones)</tspan></text><line x1="399.078" y1="133" x2="636.897" y2="133" stroke="#8a9aa3" stroke-width="5"/><rect x="392.078" y="126" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="399.078" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="399.078" dy="0">0,338</tspan></text><polygon points="501.359,124.95 509.059,139.3 493.659,139.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="501.359" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="501.359" dy="0">1,106</tspan></text><polygon points="636.897,124.25 645.647,133 636.897,141.75 628.147,133" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="636.897" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="636.897" dy="0">5,321</tspan></text><line x1="400.596" y1="207" x2="738.395" y2="207" stroke="#8a9aa3" stroke-width="5"/><rect x="393.596" y="200" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="400.596" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="400.596" dy="0">0,344</tspan></text><polygon points="522.678,198.95 530.378,213.3 514.978,213.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="522.678" y="236" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="522.678" dy="0">1,416</tspan></text><polygon points="738.395,198.25 747.145,207 738.395,215.75 729.645,207" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="738.395" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="738.395" dy="0">17,254</tspan></text><text x="592" y="288" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592" dy="0">Milisegundos (escala logarítmica)</tspan></text><rect x="10" y="302" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="326.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El máximo está lejos del p99: son llamadas aisladas, con calentamiento. Se emitieron 651 avisos de 2 000 peticiones</tspan></text><text x="470" y="343.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(semilla 48). La instancia nueva por petición cuesta del orden de 0,3 ms con módulos triviales, el precio de no filtrar</tspan></text><text x="470" y="360.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estado entre peticiones. Con módulos reales la latencia depende de su tamaño y de su memoria.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
