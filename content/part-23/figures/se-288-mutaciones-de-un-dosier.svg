<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 523" width="950" height="523" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de forma de un dosier: mutaciones detectadas de 25 por tipo</title><desc id="d">Tabla: un validador de estructura detecta 25 de 25 mutaciones que borran o vacían una sección, cambian una cifra en la sección de experimentos o quitan el enlace; no detecta ninguna de las que cambian una cifra en la afirmación, invierten la conclusión, enlazan una página inexistente o sustituyen un límite por uno genérico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="523" fill="#ffffff"/><rect x="10" y="12" width="654" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="337" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337" dy="0">Mutación del dosier</tspan></text><rect x="670" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Detectada por el validador</tspan></text><rect x="10" y="56" width="654" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">Borrar una sección</tspan></text><rect x="670" y="56" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">25 de 25</tspan></text><rect x="10" y="100" width="654" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">Vaciar una sección</tspan></text><rect x="670" y="100" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">25 de 25</tspan></text><rect x="10" y="144" width="654" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="166.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">Cambiar una cifra en la sección de experimentos</tspan></text><rect x="670" y="144" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">25 de 25</tspan></text><rect x="10" y="188" width="654" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="210.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">Quitar el enlace de las fuentes</tspan></text><rect x="670" y="188" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">25 de 25</tspan></text><rect x="10" y="232" width="654" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="254.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">Cambiar una cifra en la afirmación</tspan></text><rect x="670" y="232" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">0 de 25</tspan></text><rect x="10" y="276" width="654" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="298.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">Invertir la conclusión</tspan></text><rect x="670" y="276" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">0 de 25</tspan></text><rect x="10" y="320" width="654" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="342.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">Enlazar una página inexistente</tspan></text><rect x="670" y="320" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">0 de 25</tspan></text><rect x="10" y="364" width="654" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="386.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">Sustituir un límite concreto por uno genérico</tspan></text><rect x="670" y="364" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="386.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">0 de 25</tspan></text><rect x="10" y="412" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="436.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">El validador ve la forma y las cifras que alguien le pidió cruzar; no ve el sentido. Las cuatro mutaciones que se le escapan</tspan></text><text x="475" y="453.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">son las que más dañan a un lector. Por eso el dosier necesita una revisión de contenido hecha por una persona, y el</tspan></text><text x="475" y="470.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">validador solo evita lo mecánico.</tspan></text><text x="475" y="509.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
