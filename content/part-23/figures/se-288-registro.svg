<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" width="940" height="492" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Entradas del registro de evidencia de la ejecución de referencia, por tipo de evento</title><desc id="d">Barras con las entradas del registro de evidencia de la ejecución de referencia por evento: 5 aceptaciones, 1 rechazo, 5 llamadas y 5 muestras de la carga de 2000 peticiones, para un total de 16 entradas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="492" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Entradas del registro de evidencia de la ejecución de referencia, por tipo de evento</tspan></text><line x1="63.54" y1="317" x2="920" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="317" x2="63.54" y2="317" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="321.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="267" x2="920" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="267" x2="63.54" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="217" x2="920" y2="217" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="217" x2="63.54" y2="217" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="167" x2="920" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="167" x2="63.54" y2="167" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="171.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="117" x2="920" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="117" x2="63.54" y2="117" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="121.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="67" x2="63.54" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">5</tspan></text><line x1="63.54" y1="67" x2="63.54" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 192)">Entradas (16 en total)</text><rect x="84.9515" y="67" width="171.292" height="250" rx="3" fill="#102a43"/><text x="170.597" y="61" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="170.597" dy="0">5</tspan></text><text x="170.597" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">Aceptaciones</tspan></text><rect x="299.067" y="267" width="171.292" height="50" rx="3" fill="#102a43"/><text x="384.713" y="261" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="384.713" dy="0">1</tspan></text><text x="384.713" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">Rechazos</tspan></text><rect x="513.182" y="67" width="171.292" height="250" rx="3" fill="#102a43"/><text x="598.828" y="61" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="598.828" dy="0">5</tspan></text><text x="598.828" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">Llamadas de prueba</tspan></text><rect x="727.296" y="67" width="171.292" height="250" rx="3" fill="#102a43"/><text x="812.942" y="61" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="812.942" dy="0">5</tspan></text><text x="812.942" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">Muestras de la carga</tspan></text><rect x="10" y="369" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La cadena de 16 entradas verificó como íntegra; alterar el resultado de la entrada 3 hizo que la verificación señalara la</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">entrada 3, y borrar la entrada 2 hizo que señalara la entrada 2. El rechazo también es evidencia. Un registro real anotaría</tspan></text><text x="470" y="427.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cada llamada (aquí solo cinco muestras de las 2 000) y su volumen cambiaría el diseño del almacenamiento.</tspan></text><text x="470" y="474.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
