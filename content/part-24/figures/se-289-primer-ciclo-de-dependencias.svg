<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 447" width="890" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de ciclos entre 20 módulos cuando las dependencias se añaden sin regla</title><desc id="d">Tabla: al añadir dependencias al azar entre veinte módulos hay ciclo en el 65 por ciento de los casos con veinte aristas y en el 100 por ciento con cuarenta; el primer ciclo aparece con una mediana de 18 aristas; con un orden de capas que solo permite dependencias hacia abajo no hay ciclos posibles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="447" fill="#ffffff"/><rect x="10" y="12" width="604" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="312" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="312" dy="0">Situación</tspan></text><rect x="620" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Resultado</tspan></text><rect x="10" y="56" width="604" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">20 aristas al azar entre 20 módulos</tspan></text><rect x="620" y="56" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">65,0 %</tspan></text><rect x="10" y="102" width="604" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">40 aristas al azar</tspan></text><rect x="620" y="102" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">100 %</tspan></text><rect x="10" y="148" width="604" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">60 aristas al azar</tspan></text><rect x="620" y="148" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">100 %</tspan></text><rect x="10" y="194" width="604" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">Aristas hasta el primer ciclo: mediana (p10 – p90)</tspan></text><rect x="620" y="194" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">18 (9 – 27)</tspan></text><rect x="10" y="240" width="604" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">Aristas hasta el primer ciclo: mínimo y máximo</tspan></text><rect x="620" y="240" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">2 y 47</tspan></text><rect x="10" y="286" width="604" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">Con orden de capas (solo hacia abajo): ciclos posibles</tspan></text><rect x="620" y="286" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0</tspan></text><rect x="10" y="336" width="870" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="445" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Los ciclos no son un accidente raro: aparecen pronto cuando nadie decide el sentido de las dependencias. Un orden de</tspan></text><text x="445" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">capas permite 190 de las 380 aristas posibles y elimina los ciclos por construcción. Grafos sintéticos de 2000</tspan></text><text x="445" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">repeticiones; un grafo real no es aleatorio.</tspan></text><text x="445" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
