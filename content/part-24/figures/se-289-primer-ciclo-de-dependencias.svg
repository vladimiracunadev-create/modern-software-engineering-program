<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de ciclos entre 20 módulos cuando las dependencias se añaden sin regla</title><desc id="d">Líneas con el porcentaje de grafos con ciclo según las aristas añadidas entre veinte módulos: al azar sube de 65 por ciento con 20 aristas a 100 con 40 y con 60; con un orden de capas se queda en 0; el primer ciclo aparece con una mediana de 18 aristas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de ciclos entre 20 módulos cuando las dependencias se añaden sin regla</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aristas al azar</tspan></text><rect x="177.1" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Con orden de capas (solo hacia abajo)</tspan></text><line x1="78.62" y1="367" x2="910" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="367" x2="78.62" y2="367" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="371.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="311" x2="910" y2="311" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="311" x2="78.62" y2="311" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="315.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="255" x2="910" y2="255" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="255" x2="78.62" y2="255" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="259.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="199" x2="910" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="199" x2="78.62" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="143" x2="910" y2="143" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="143" x2="78.62" y2="143" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="367" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="367" x2="96.62" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="388" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">10</tspan></text><line x1="255.696" y1="87" x2="255.696" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="255.696" y1="367" x2="255.696" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="255.696" 