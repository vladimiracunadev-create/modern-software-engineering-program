span></text><polyline points="255.696,185 573.848,87 892,87" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="255.696" cy="185" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="255.696" y="174" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.696" dy="0">65,0</tspan></text><circle cx="573.848" cy="87" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="573.848" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="573.848" dy="0">100,0</tspan></text><circle cx="892" cy="87" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">100,0</tspan></text><polyline points="255.696,367 573.848,367 892,367" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="250.196" y="361.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="255.696" y="356" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.696" dy="0">0,0</tspan></text><rect x="568.348" y="361.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="573.848" y="356" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="573.848" dy="0">0,0</tspan></text><rect x="886.5" y="361.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="356" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,0</tspan></text><rect x="10" y="427" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los ciclos no son un accidente raro: aparecen pronto cuando nadie decide el sentido de las dependencias. El primer ciclo</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">llega con una mediana de 18 aristas (p10 a p90: 9 a 27; mínimo 2, máximo 47). Un orden de capas permite 190 de las 380</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">aristas posibles y elimina los ciclos por construcción. Grafos sintéticos de 2000 repeticiones; un grafo real no es</tspan></text><text x="470" y="501.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">aleatorio.</tspan></text><text x="470" y="549.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
