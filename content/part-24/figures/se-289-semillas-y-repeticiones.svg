<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estimar π con 200 semillas: lo que una sola ejecución no dice</title><desc id="d">Líneas con el valor mínimo y máximo de la estimación de pi entre doscientas semillas según los puntos por ejecución: con mil puntos el rango va de 2,988 a 3,292, con diez mil de 3,090 a 3,183 y con cien mil de 3,128 a 3,158; el embudo se cierra alrededor de 3,1416.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estimar π con 200 semillas: lo que una sola ejecución no dice</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Máximo observado</tspan></text><rect x="184.64" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Mínimo observado</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">2,9</tspan></text><line x1="78.62" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="312" x2="78.62" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">3</tspan></text><line x1="78.62" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="237" x2="78.62" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">3,1</tspan></text><line x1="78.62" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="162" x2="78.62" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">3,2</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">3,3</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1 000</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="387" x2="494.31" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">10 000</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">100 000</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Estimación de π</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Puntos por ejecución (escala logarítmica)</tspan></text><line x1="78.62" y1="205.8" x2="910" y2="205.8" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="84.62" y="199.8" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="84.62" dy="0">π = 3,1416</tspan></text><polyline points="96.62,93 494.31,174.75 892,193.5" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="93" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">3,292</tspan></text><circle cx="494.31" cy="174.75" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="494.31" y="163.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">3,183</tspan></text><circle cx="892" cy="193.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="182.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">3,158</tspan></text><polyline points="96.62,321 494.31,244.5 892,216" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="315.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="345" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">2,988</tspan></text><rect x="488.81" y="239" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="494.31" y="268.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">3,090</tspan></text><rect x="886.5" y="210.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="240" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">3,128</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Con una semilla fija la misma ejecución da siempre el mismo número, y eso es reproducibilidad exacta. No es evidencia de</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">que el resultado sea estable: con mil puntos, otra semilla da cualquier valor entre 2,99 y 3,29. Publicar la semilla</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">permite repetir; variar las semillas permite saber cuánto vale la cifra.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
