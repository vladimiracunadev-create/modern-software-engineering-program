<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 355" width="1000" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Añadir una regla de descuento: cadena if/elif frente a registro de reglas</title><desc id="d">Tabla: al añadir de la segunda a la quinta regla de descuento, la cadena if elif modifica siempre la función existente, añade dos líneas y su complejidad sube de 3 a 6; el registro no modifica ninguna función existente, añade cuatro líneas y la complejidad de la función descuento se queda en 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="355" fill="#ffffff"/><rect x="10" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="67" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="67" dy="0">Regla</tspan></text><text x="67" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="67" dy="0">añadida</tspan></text><rect x="130" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="212" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="212" dy="0">Cadena: modifica</tspan></text><rect x="300" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="352" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352" dy="0">Líneas</tspan></text><rect x="410" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Complejidad</tspan></text><rect x="550" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Registro: modifica</tspan></text><rect x="740" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Líneas</tspan></text><rect x="850" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="917" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="917" dy="0">Complejidad</tspan></text><rect x="10" y="56" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="67" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="67" dy="0">2.ª</tspan></text><rect x="130" y="56" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="212" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212" dy="0">descuento</tspan></text><rect x="300" y="56" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">+2 / −0</tspan></text><rect x="410" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">3</tspan></text><rect x="550" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">ninguna</tspan></text><rect x="740" y="56" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">+4 / −0</tspan></text><rect x="850" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">2</tspan></text><rect x="10" y="102" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="67" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="67" dy="0">3.ª</tspan></text><rect x="130" y="102" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="212" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212" dy="0">descuento</tspan></text><rect x="300" y="102" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">+2 / −0</tspan></text><rect x="410" y="102" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">4</tspan></text><rect x="550" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">ninguna</tspan></text><rect x="740" y="102" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">+4 / −0</tspan></text><rect x="850" y="102" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">2</tspan></text><rect x="10" y="148" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="67" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="67" dy="0">4.ª</tspan></text><rect x="130" y="148" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="212" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212" dy="0">descuento</tspan></text><rect x="300" y="148" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">+2 / −0</tspan></text><rect x="410" y="148" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">5</tspan></text><rect x="550" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">ninguna</tspan></text><rect x="740" y="148" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">+4 / −0</tspan></text><rect x="850" y="148" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">2</tspan></text><rect x="10" y="194" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="67" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="67" dy="0">5.ª</tspan></text><rect x="130" y="194" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="212" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212" dy="0">descuento</tspan></text><rect x="300" y="194" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">+2 / −0</tspan></text><rect x="410" y="194" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">6</tspan></text><rect x="550" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">ninguna</tspan></text><rect x="740" y="194" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">+4 / −0</tspan></text><rect x="850" y="194" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">2</tspan></text><rect x="10" y="244" width="980" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">Abierto/cerrado se ve como funciones existentes que no cambian: en la cadena, cada regla nueva reabre la función que todas las</tspan></text><text x="500" y="285.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">pruebas atraviesan; en el registro, no. El registro escribe más líneas por regla. Cuesta además dos decisiones nuevas: el orden y</tspan></text><text x="500" y="302.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">cómo se combinan reglas simultáneas (aquí, el máximo).</tspan></text><text x="500" y="341.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
