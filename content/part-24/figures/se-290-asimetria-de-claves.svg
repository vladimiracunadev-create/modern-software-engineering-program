<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Carga de la partición más cargada frente a la media (8 particiones, 200 000 filas, 1 000 claves)</title><desc id="d">Líneas con la carga de la partición más cargada frente a la media según el exponente de Zipf: sin sal sube de 1,01 con claves uniformes a 1,35 con exponente 0,8, 2,03 con 1,1 y 3,43 con 1,5; con una sal de 8 se queda en 1,01 en todos los casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Carga de la partición más cargada frente a la media (8 particiones, 200 000 filas, 1 000 claves)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin sal</tspan></text><rect x="116.78" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Con sal de 8</tspan></text><line x1="63.54" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="387" x2="63.54" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="312" x2="63.54" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="237" x2="63.54" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="162" x2="63.54" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="87" x2="63.54" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="87" x2="63.54" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="81.54" y1="87" x2="81.54" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="81.54" y1="387" x2="81.54" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="81.54" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81.54" dy="0">0</tspan></text><line x1="351.693" y1="87" x2="351.693" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="351.693" y1="387" x2="351.693" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="351.693" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="351.693" dy="0">0,5</tspan></text><line x1="621.847" y1="87" x2="621.847" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="621.847" y1="387" x2="621.847" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="621.847" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="621.847" dy="0">1,0</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1,5</tspan></text><line x1="63.54" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Carga máxima / carga media</text><text x="486.77" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="486.77" dy="0">Exponente de Zipf (0 = claves uniformes)</tspan></text><polyline points="81.54,311.25 513.785,285.75 675.877,234.75 892,129.75" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="81.54" cy="311.25" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="81.54" y="335.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="81.54" dy="0">1,01</tspan></text><circle cx="513.785" cy="285.75" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="513.785" y="274.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="513.785" dy="0">1,35</tspan></text><circle cx="675.877" cy="234.75" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="675.877" y="223.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="675.877" dy="0">2,03</tspan></text><circle cx="892" cy="129.75" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="118.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">3,43</tspan></text><polyline points="81.54,311.25 513.785,311.25 675.877,311.25 892,311.25" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="76.04" y="305.75" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="508.285" y="305.75" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="513.785" y="300.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="513.785" dy="0">1,01</tspan></text><rect x="670.377" y="305.75" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="675.877" y="300.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="675.877" dy="0">1,01</tspan></text><rect x="886.5" y="305.75" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="300.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">1,01</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El reparto por clave es equilibrado solo si las claves lo son: una sola partición con 3,4 veces la media fija el tiempo</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">total del trabajo. Salar la clave reparte la carga a cambio de un paso más para recombinar los resultados parciales. Las</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">claves y los exponentes son sintéticos.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
