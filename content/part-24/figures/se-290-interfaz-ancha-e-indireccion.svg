<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 451" width="910" height="451" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Interfaces anchas y estructura innecesaria sobre el mismo comportamiento</title><desc id="d">Tabla: con ocho clientes que usan entre uno y tres de doce métodos, cambiar un método afecta de verdad a 1,75 clientes pero a ocho si todos dependen de la interfaz ancha y a cinco si dependen de roles; la misma regla de redondeo y tope ocupa 17 nodos en una función y 126 con estrategias y fábrica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="451" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Medida</tspan></text><rect x="410" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Opción simple</tspan></text><rect x="710" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Opción estructurada</tspan></text><rect x="10" y="56" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Clientes afectados al cambiar un método (media de 12)</tspan></text><rect x="410" y="56" width="294" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="83.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">usan el método: 1,75 · dependen de la</tspan></text><text x="557" y="99.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">interfaz: 8</tspan></text><rect x="710" y="56" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">dependen del rol: 5</tspan></text><rect x="10" y="126" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Métodos que debe implementar un doble de prueba</tspan></text><rect x="410" y="126" width="294" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">12</tspan></text><rect x="710" y="126" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">7,5</tspan></text><rect x="10" y="196" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="223.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Redondear a dos decimales y aplicar un tope: clases y</tspan></text><text x="207" y="239.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">funciones</tspan></text><rect x="410" y="196" width="294" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">0 clases · 1 función</tspan></text><rect x="710" y="196" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">6 clases · 8 métodos</tspan></text><rect x="10" y="266" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="301.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Mismo cálculo: nodos del árbol sintáctico y líneas</tspan></text><rect x="410" y="266" width="294" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="301.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">17 nodos · 2 líneas</tspan></text><rect x="710" y="266" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="301.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">126 nodos · 17 líneas</tspan></text><rect x="10" y="340" width="890" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">Segregar interfaces reduce la dependencia nominal, no la real: aun con roles, cinco clientes revisan un cambio que</tspan></text><text x="455" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">afecta a 1,75. Y la abstracción tiene precio de lectura: 7 veces más nodos para la misma regla. Sin un segundo uso, esa</tspan></text><text x="455" y="398.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">estructura no compra nada. Ocho clientes sintéticos con semilla fija.</tspan></text><text x="455" y="437.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
