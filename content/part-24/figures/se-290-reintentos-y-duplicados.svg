<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cargar 10 000 filas en lotes de 100 con fallos a mitad de lote y reintentos</title><desc id="d">Barras agrupadas con las filas duplicadas tras cargar 10 000 filas con reintentos: añadir al final deja 0, 442 y 867 duplicadas si fallan el 0, el 5 y el 20 por ciento de los lotes; escribir por clave deja siempre 0 duplicadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cargar 10 000 filas en lotes de 100 con fallos a mitad de lote y reintentos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Añadir al final</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Escribir por clave (upsert)</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="319" x2="93.7" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">200</tspan></text><line x1="93.7" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="263" x2="93.7" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">400</tspan></text><line x1="93.7" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="207" x2="93.7" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">600</tspan></text><line x1="93.7" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="151" x2="93.7" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">800</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Filas duplicadas (de 10 000 cargadas)</text><rect x="121.243" y="373" width="108.173" height="2" rx="3" fill="#c0432f"/><text x="175.33" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.33" dy="0">0</tspan></text><rect x="233.417" y="373" width="108.173" height="2" rx="3" fill="#087f8c"/><text x="287.503" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287.503" dy="0">0</tspan></text><text x="231.417" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">0 % de lotes fallan</tspan></text><rect x="396.677" y="251.24" width="108.173" height="123.76" rx="3" fill="#c0432f"/><text x="450.763" y="245.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.763" dy="0">442</tspan></text><rect x="508.85" y="373" width="108.173" height="2" rx="3" fill="#087f8c"/><text x="562.937" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.937" dy="0">0</tspan></text><text x="506.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">5 % de lotes fallan</tspan></text><rect x="672.11" y="132.24" width="108.173" height="242.76" rx="3" fill="#c0432f"/><text x="726.197" y="126.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.197" dy="0">867</tspan></text><rect x="784.283" y="373" width="108.173" height="2" rx="3" fill="#087f8c"/><text x="838.37" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.37" dy="0">0</tspan></text><text x="782.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">20 % de lotes fallan</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El reintento es correcto solo si repetir la escritura no cambia el resultado. Añadir al final no es repetible: cada</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reintento duplica lo que ya se había escrito antes del corte. La escritura por clave es idempotente. Simulación con cortes</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">en un punto aleatorio del lote y hasta diez intentos.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
