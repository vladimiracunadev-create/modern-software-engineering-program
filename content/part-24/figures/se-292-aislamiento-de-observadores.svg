<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Notificaciones perdidas por observador de 1000 eventos (5 observadores que fallan el 2 % de las veces)</title><desc id="d">Intervalos con las notificaciones perdidas por observador, de 1000: con un bucle simple el mejor observador pierde 20, la media es 59,2 y el peor pierde 101 porque una excepción corta el reparto (4704 de 5000 entregas); con cada observador aislado pierden 15, 21,2 y 32 (4894 de 5000).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="440" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Notificaciones perdidas por observador de 1000 eventos (5 observadores que fallan el 2 % de las veces)</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mejor observador</tspan></text><polygon points="190.64,44.1 197.24,56.4 184.04,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">media</tspan></text><polygon points="276.34,43.5 283.84,51 276.34,58.5 268.84,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="290.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="290.34" dy="0">peor observador</tspan></text><line x1="374" y1="77" x2="374" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="374" y1="225" x2="374" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="374" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374" dy="0">0</tspan></text><line x1="485.2" y1="77" x2="485.2" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="485.2" y1="225" x2="485.2" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="485.2" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="485.2" dy="0">25</tspan></text><line x1="596.4" y1="77" x2="596.4" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="596.4" y1="225" x2="596.4" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="596.4" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="596.4" dy="0">50</tspan></text><line x1="707.6" y1="77" x2="707.6" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="707.6" y1="225" x2="707.6" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="707.6" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.6" dy="0">75</tspan></text><line x1="818.8" y1="77" x2="818.8" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="818.8" y1="225" x2="818.8" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="818.8" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="818.8" dy="0">100</tspan></text><line x1="930" y1="77" x2="930" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="930" y1="225" x2="930" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="930" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="930" dy="0">125</tspan></text><line x1="374" y1="225" x2="930" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="110" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Bucle simple (la excepción sube y corta el</tspan></text><text x="344" y="127" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">reparto)</tspan></text><text x="344" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Cada observador aislado con try/except</tspan></text><line x1="462.96" y1="114" x2="823.248" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="455.96" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="462.96" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="462.96" dy="0">20,0</tspan></text><polygon points="637.322,105.95 645.022,120.3 629.622,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="637.322" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637.322" dy="0">59,2</tspan></text><polygon points="823.248,105.25 831.998,114 823.248,122.75 814.498,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="823.248" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="823.248" dy="0">101,0</tspan></text><line x1="440.72" y1="188" x2="516.336" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="433.72" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="440.72" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="440.72" dy="0">15,0</tspan></text><polygon points="468.298,179.95 475.998,194.3 460.598,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="468.298" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="468.298" dy="0">21,2</tspan></text><polygon points="516.336,179.25 525.086,188 516.336,196.75 507.586,188" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="516.336" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="516.336" dy="0">32,0</tspan></text><text x="652" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="652" dy="0">Notificaciones perdidas por observador (de 1000)</tspan></text><rect x="10" y="283" width="960" height="109.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Las pérdidas son 1000 menos las entregas por observador (899 a 980 con el bucle simple, 968 a 985 aislado). El primero en la</tspan></text><text x="490" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">lista casi nunca pierde nada y el último pierde más: el orden de suscripción se vuelve una prioridad implícita. Aislar a los</tspan></text><text x="490" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">observadores baja las pérdidas pero oculta los fallos si nadie cuenta las excepciones (101 frente a 106). Dar de baja un</tspan></text><text x="490" y="357.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">observador durante el reparto sin copiar la lista salta a b; con copia se visita a, b, c, d. Falla cada observador con</tspan></text><text x="490" y="374.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">probabilidad 0,02, un supuesto.</tspan></text><text x="490" y="422.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
