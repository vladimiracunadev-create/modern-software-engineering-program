<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Notificaciones entregadas con 1000 eventos y 5 observadores que fallan el 2 % de las veces</title><desc id="d">Tabla: con mil eventos y cinco observadores que fallan el dos por ciento de las veces, un bucle simple entrega 4704 de 5000 notificaciones porque una excepción corta el reparto, y con cada observador aislado se entregan 4894; dar de baja un observador durante el reparto sin copiar la lista salta al siguiente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Variante</tspan></text><rect x="440" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Entregas</tspan></text><rect x="630" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Excepciones</tspan></text><rect x="760" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Por observador</tspan></text><rect x="10" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Bucle simple (la excepción sube y corta el reparto)</tspan></text><rect x="440" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">4704 de 5000</tspan></text><rect x="630" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">101</tspan></text><rect x="760" y="56" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">899 a 980</tspan></text><rect x="10" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Cada observador aislado con try/except</tspan></text><rect x="440" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">4894 de 5000</tspan></text><rect x="630" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">106</tspan></text><rect x="760" y="114" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">968 a 985</tspan></text><rect x="10" y="172" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Baja durante el reparto, sin copiar la lista</tspan></text><rect x="440" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">visita a, c, d</tspan></text><rect x="630" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">—</tspan></text><rect x="760" y="172" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">se salta b</tspan></text><rect x="10" y="230" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Baja durante el reparto, con copia de la lista</tspan></text><rect x="440" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">visita a, b, c, d</tspan></text><rect x="630" y="230" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">—</tspan></text><rect x="760" y="230" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">—</tspan></text><rect x="10" y="292" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">El primero en la lista casi nunca pierde nada y el último pierde más: el orden de suscripción se vuelve una prioridad</tspan></text><text x="465" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">implícita. Aislar a los observadores sube la entrega pero oculta los fallos si nadie cuenta las excepciones. Falla cada</tspan></text><text x="465" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">observador con probabilidad 0,02, un supuesto.</tspan></text><text x="465" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
