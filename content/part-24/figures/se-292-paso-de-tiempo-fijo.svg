<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Posición de un resorte amortiguado a los 10 s según la política de paso de tiempo</title><desc id="d">Barras horizontales con el error de la posición de un resorte a los 10 segundos frente a la referencia: con paso variable es 14, 9,1 y 3,4 milésimas a 30, 60 y 144 fotogramas por segundo y con paso fijo de 1/60 es 8,1; el paso variable da un resultado distinto en cada ejecución y el fijo siempre el mismo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Posición de un resorte amortiguado a los 10 s según la política de paso de tiempo</tspan></text><line x1="274" y1="49" x2="274" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="201" x2="274" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="479.94" y1="49" x2="479.94" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="479.94" y1="201" x2="479.94" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="479.94" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479.94" dy="0">5</tspan></text><line x1="685.88" y1="49" x2="685.88" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="685.88" y1="201" x2="685.88" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="685.88" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685.88" dy="0">10</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="201" x2="891.82" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">15</tspan></text><line x1="274" y1="201" x2="891.82" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Paso variable, 30 fps medios</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Paso variable, 60 fps medios</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Paso variable, 144 fps medios</tspan></text><text x="264" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Paso fijo de 1/60 s</tspan></text><rect x="274" y="55" width="576.632" height="26" rx="3" fill="#946512"/><text x="857.632" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="857.632" dy="0">14</tspan></text><rect x="274" y="93" width="374.811" height="26" rx="3" fill="#946512"/><text x="655.811" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="655.811" dy="0">9,1</tspan></text><rect x="274" y="131" width="140.039" height="26" rx="3" fill="#946512"/><text x="421.039" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="421.039" dy="0">3,4</tspan></text><rect x="274" y="169" width="333.623" height="26" rx="3" fill="#946512"/><text x="614.623" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="614.623" dy="0">8,1</tspan></text><text x="582.91" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="582.91" dy="0">Error de la posición (milésimas, 10⁻³)</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El paso variable no es necesariamente menos exacto en una corrida: es irrepetible. Con una fluctuación del 25 % en el</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tiempo de cada fotograma, 20 ejecuciones dieron 20 resultados distintos; con paso fijo, uno. Reproducir un fallo, grabar</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una repetición o sincronizar una partida exige el paso fijo.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
