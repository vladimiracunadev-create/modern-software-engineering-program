e" font-weight="400" fill="#142231"><tspan x="822" dy="0">0,992</tspan></text><rect x="10" y="240" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">Estado</tspan></text><rect x="180" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">0,988</tspan></text><rect x="330" y="240" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">0,945</tspan></text><rect x="460" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">0,980</tspan></text><rect x="610" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0,992</tspan></text><rect x="760" y="240" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">1,000</tspan></text><rect x="10" y="290" width="880" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">Las cinco clases guardan un colaborador y le delegan: lo que cambia es la intención (traducir, controlar el acceso,</tspan></text><text x="450" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">añadir, intercambiar un algoritmo, cambiar de comportamiento con el estado). El patrón no se reconoce por la forma</tspan></text><text x="450" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">sino por el motivo del cambio. Cinco clases escritas por el autor.</tspan></text><text x="450" y="387.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
