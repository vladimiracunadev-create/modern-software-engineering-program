<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 507" width="940" height="507" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Impurezas detectadas según el nivel de la prueba</title><desc id="d">Tabla: de ocho funciones impuras, una prueba con un ejemplo no detecta ninguna, repetir la llamada y comprobar la entrada y la salida detecta cuatro, y además perturbar el estado global entre llamadas detecta siete; la que devuelve su estado interno no la detecta ningún nivel; ninguna de las cuatro funciones puras dio falsa alarma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="507" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Impureza</tspan></text><rect x="390" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Un ejemplo</tspan></text><rect x="520" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">Repetir y comprobar</tspan></text><rect x="720" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Y perturbar lo global</tspan></text><rect x="10" y="56" width="374" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="77.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Muta su argumento (sort, append)</tspan></text><rect x="390" y="56" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">no</tspan></text><rect x="520" y="56" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">sí</tspan></text><rect x="720" y="56" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="98" width="374" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="119.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Imprime</tspan></text><rect x="390" y="98" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">no</tspan></text><rect x="520" y="98" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">sí</tspan></text><rect x="720" y="98" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="140" width="374" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Argumento por defecto mutable</tspan></text><rect x="390" y="140" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">no</tspan></text><rect x="520" y="140" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">sí</tspan></text><rect x="720" y="140" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="182" width="374" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="203.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Lee una configuración global</tspan></text><rect x="390" y="182" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">no</tspan></text><rect x="520" y="182" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">no</tspan></text><rect x="720" y="182" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="224" width="374" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Lee el reloj</tspan></text><rect x="390" y="224" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">no</tspan></text><rect x="520" y="224" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">no</tspan></text><rect x="720" y="224" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="266" width="374" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Escribe un total global</tspan></text><rect x="390" y="266" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">no</tspan></text><rect x="520" y="266" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">no</tspan></text><rect x="720" y="266" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="308" width="374" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="329.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Devuelve su estado interno</tspan></text><rect x="390" y="308" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">no</tspan></text><rect x="520" y="308" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">no</tspan></text><rect x="720" y="308" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">no</tspan></text><rect x="10" y="350" width="374" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="371.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Total de 8 impurezas / falsas alarmas en 4 puras</tspan></text><rect x="390" y="350" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">0 / 0</tspan></text><rect x="520" y="350" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">4 / 0</tspan></text><rect x="720" y="350" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">7 / 0</tspan></text><rect x="10" y="396" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una función con un solo ejemplo correcto no demuestra pureza. La que devuelve una referencia a su estado interno pasa los</tspan></text><text x="470" y="437.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tres niveles: se descubre solo cuando alguien muta el valor devuelto. Doce funciones escritas por el autor; el detector es</tspan></text><text x="470" y="454.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una construcción simple.</tspan></text><text x="470" y="493.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
