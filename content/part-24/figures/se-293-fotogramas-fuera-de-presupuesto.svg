<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pantalla de 90 Hz (presupuesto de 11,1 ms): fotogramas fuera de presupuesto según el coste medio</title><desc id="d">Línea con el porcentaje de fotogramas fuera del presupuesto de 11,1 milisegundos según el coste medio de render: 0,5 por ciento con 6 milisegundos, 7,4 con 8, 16,5 con 9, 29,0 con 10 y 43,3 con 11; ya con un coste medio por debajo del presupuesto se pierde una parte creciente de los fotogramas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pantalla de 90 Hz (presupuesto de 11,1 ms): fotogramas fuera de presupuesto según el coste medio</tspan></text><line x1="71.08" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="359" x2="71.08" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="299" x2="71.08" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="239" x2="71.08" y2="239" stroke="#5b7280" stroke-width="1.