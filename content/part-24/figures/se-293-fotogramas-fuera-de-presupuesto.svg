ill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="345" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">0,5 %</tspan></text><circle cx="356.72" cy="314.6" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="346.72" y="319.1" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="346.72" dy="0">7,4 %</tspan></text><circle cx="490.54" cy="260" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="480.54" y="264.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="480.54" dy="0">16,5 %</tspan></text><circle cx="624.36" cy="185" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="614.36" y="189.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="614.36" dy="0">29,0 %</tspan></text><circle cx="758.18" cy="99.2" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="748.18" y="103.7" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="748.18" dy="0">43,3 %</tspan></text><text x="316.72" y="114.6" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="316.72" dy="0">Con 8 ms, por debajo del</tspan></text><text x="316.72" y="131.6" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="316.72" dy="0">presupuesto de 11,1 ms, ya</tspan></text><text x="316.72" y="148.6" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="316.72" dy="0">se pierde el 7,4 %</tspan></text><line x1="354.16" y1="298.2" x2="324.72" y2="109.6" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El promedio engaña: con un coste medio de 8 ms, por debajo de 11,1, aún el 7 % de los fotogramas se pierde y con</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sincronización cada uno se muestra el doble de tiempo (22,2 ms en el percentil 99). En realidad virtual esos fotogramas son</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los que se sienten. Tiempos lognormales con σ = 0,25 supuestos; no se midió ningún casco.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
