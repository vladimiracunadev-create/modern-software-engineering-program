<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Búfer de audio a 48 kHz: latencia que se añade y callbacks que no llegan a tiempo</title><desc id="d">Línea en escalas logarítmicas que une latencia y fallos del búfer de audio: con 64 muestras la latencia es 1,3 milisegundos y falla el 22,3 por ciento de las llamadas; con 256 muestras, 5,3 y 1,6 por ciento; con 1024, 21,3 y 0,016 por ciento; la línea desciende, cada mejora de fiabilidad se paga con latencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Búfer de audio a 48 kHz: latencia que se añade y callbacks que no llegan a tiempo</tspan></text><line x1="86.16" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="359" x2="86.16" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,01</tspan></text><line x1="86.16" y1="284" x2="910" y2="284" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="284" x2="86.16" y2="284" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="288.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,1</tspan></text><line x1="86.16" y1="209" x2="910" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="209" x2="86.16" y2="209" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="213.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1</tspan></text><line x1="86.16" y1="134" x2="910" y2="134" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="134" x2="86.16" y2="134" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">10</tspan></text><line x1="86.16" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="59" x2="86.16" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">100</tspan></text><line x1="86.16" y1="59" x2="86.16" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="104.16" y1="59" x2="104.16" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="104.16" y1="359" x2="104.16" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="104.16" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.16" dy="0">1</tspan></text><line x1="243.753" y1="59" x2="243.753" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="243.753" y1="359" x2="243.753" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="243.753" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="243.753" dy="0">2</tspan></text><line x1="428.284" y1="59" x2="428.284" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="428.284" y1="359" x2="428.284" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="428.284" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="428.284" dy="0">5</tspan></text><line x1="567.876" y1="59" x2="567.876" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="567.876" y1="359" x2="567.876" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="567.876" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567.876" dy="0">10</tspan></text><line x1="707.469" y1="59" x2="707.469" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="707.469" y1="359" x2="707.469" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="707.469" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.469" dy="0">20</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">50</tspan></text><line x1="86.16" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Callbacks que no llegan a tiempo (%) (escala logarítmica)</text><text x="498.08" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="498.08" dy="0">Latencia que añade el búfer (ms) (escala logarítmica)</tspan></text><polyline points="156.997,107.877 304.19,144.251 440.018,193.691 581.502,256.87 720.151,343.691" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="156.997" cy="107.877" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="156.997" y="96.8771" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="156.997" dy="0">64 muestras · 22,3 %</tspan></text><circle cx="304.19" cy="144.251" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="314.19" y="148.751" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="314.19" dy="0">128 · 7,3 %</tspan></text><circle cx="440.018" cy="193.691" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="450.018" y="198.191" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.018" dy="0">256 · 1,6 %</tspan></text><circle cx="581.502" cy="256.87" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="591.502" y="261.37" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="591.502" dy="0">512 · 0,23 %</tspan></text><circle cx="720.151" cy="343.691" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="730.151" y="348.191" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="730.151" dy="0">1 024 · 0,016 %</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un búfer mayor compra holgura con latencia: de 64 a 512 muestras los fallos bajan de 22 % a 0,23 % y la latencia sube de</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">1,3 a 10,7 ms. El modelo supone un coste fijo con picos lognormales (mediana 0,5 ms, σ = 1,0) más 4 µs por muestra; son</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuestos del autor, no una medición de ninguna tarjeta ni sistema operativo.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
