<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 696" width="940" height="696" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dinero con coma flotante, con decimales y con enteros: seis comprobaciones</title><desc id="d">Diagrama de seis comprobaciones agrupadas en tres bloques: la suma repetida, la igualdad y el redondeo en coma flotante fallan por representación; la suma de líneas redondeadas y el total redondeado difieren en el 38,68 por ciento de 100000 facturas; repartir 100,00 en tres pierde un céntimo con coma flotante y es exacto con enteros de céntimos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="696" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dinero con coma flotante, con decimales y con enteros: seis comprobaciones</tspan></text><rect x="10" y="45" width="920" height="206" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Coma flotante: el error está en cómo se guarda 0,1</tspan></text><rect x="24" y="79" width="360" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="105.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="204" dy="0">Sumar 0,10 un millón de veces (float)</tspan></text><polyline points="384,102 424,102" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="424" y="79" width="220" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="534" y="105.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="534" dy="0">100 000,00000133</tspan></text><polyline points="644,102 684,102" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="684" y="79" width="232" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="800" y="105.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="800" dy="0">error de 1,3·10⁻⁶</tspan></text><rect x="24" y="135" width="360" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="204" dy="0">0,1 + 0,2 == 0,3 (float)</tspan></text><polyline points="384,158 424,158" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="424" y="135" width="220" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="534" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="534" dy="0">Falso</tspan></text><polyline points="644,158 684,158" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="684" y="135" width="232" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="800" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="800" dy="0">—</tspan></text><rect x="24" y="191" width="360" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="204" dy="0">round(2.675, 2) frente a Decimal con HALF_UP</tspan></text><polyline points="384,214 424,214" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="424" y="191" width="220" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="534" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="534" dy="0">2,67 y 2,68</tspan></text><polyline points="644,214 684,214" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="684" y="191" width="232" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="800" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="800" dy="0">dos reglas, dos totales</tspan></text><rect x="10" y="263" width="920" height="150" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="285" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Decimales exactos: el desacuerdo es una regla de redondeo sin decidir</tspan></text><rect x="24" y="299" width="360" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="325.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="204" dy="0">Redondear cada línea y luego sumar</tspan></text><rect x="24" y="355" width="360" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="204" dy="0">Sumar las líneas y luego redondear el total</tspan></text><polyline points="384,322 404,322 404,350 424,350" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="384,378 404,378 404,350 424,350" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="424" y="299" width="220" height="102" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="534" y="345.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="534" dy="0">No coinciden en el 38,68 %</tspan></text><text x="534" y="361.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="534" dy="0">de 100 000 facturas</tspan></text><polyline points="644,350 684,350" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="684" y="327" width="232" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="800" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="800" dy="0">brecha media de 1 céntimo</tspan></text><rect x="10" y="425" width="920" height="134" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="447" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Repartir 100,00 entre tres: coma flotante frente a enteros de céntimos</tspan></text><rect x="24" y="459" width="360" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="485.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="204" dy="0">Repartir 100,00 en tres con float redondeado</tspan></text><polyline points="384,482 424,482" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="424" y="459" width="220" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="534" y="485.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="534" dy="0">99,99</tspan></text><polyline points="644,482 684,482" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="684" y="459" width="232" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="800" y="485.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="800" dy="0">falta 1 céntimo</tspan></text><rect x="24" y="511" width="360" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="529.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="204" dy="0">Repartir 10 000 céntimos en tres, resto al</tspan></text><text x="204" y="545.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="204" dy="0">primero</tspan></text><polyline points="384,534 424,534" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="424" y="511" width="220" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534" y="537.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="534" dy="0">3334 + 3333 + 3333</tspan></text><polyline points="644,534 684,534" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="684" y="511" width="232" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="800" y="537.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="800" dy="0">suma exacta</tspan></text><rect x="10" y="573" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="597.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Que la suma por líneas y la suma del total difieran en un céntimo en casi cuatro facturas de cada diez no es un error de</tspan></text><text x="470" y="614.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">coma flotante: es una decisión de negocio sin tomar (dónde se redondea). Hay que declararla, probarla y aplicarla en un</tspan></text><text x="470" y="631.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">único lugar. Facturas sintéticas con IVA del 19 %.</tspan></text><text x="470" y="678.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
