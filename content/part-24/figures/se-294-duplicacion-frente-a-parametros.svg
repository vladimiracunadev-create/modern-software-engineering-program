<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" width="940" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">120 cambios sobre dos usos parecidos: divergencias por olvido frente a ramas añadidas</title><desc id="d">Tabla: si el 90 por ciento de los cambios afecta a las dos copias, mantener dos copias produce 32,3 divergencias por olvido en 120 cambios y una función compartida añade 12,0 ramas; si solo el 10 por ciento afecta a ambas, las copias producen 3,6 divergencias y la función compartida añade 108,0 ramas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="345" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Fracción de cambios que afecta a ambos usos</tspan></text><rect x="390" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Dos copias: divergencias por</tspan></text><text x="522" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">olvido</tspan></text><rect x="660" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Función compartida: ramas</tspan></text><text x="792" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">añadidas</tspan></text><rect x="10" y="56" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">0,9</tspan></text><rect x="390" y="56" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">32,3</tspan></text><rect x="660" y="56" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">12,0</tspan></text><rect x="10" y="114" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">0,5</tspan></text><rect x="390" y="114" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">18,0</tspan></text><rect x="660" y="114" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">60,1</tspan></text><rect x="10" y="172" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">0,1</tspan></text><rect x="390" y="172" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">3,6</tspan></text><rect x="660" y="172" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">108,0</tspan></text><rect x="10" y="234" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La duplicación es un problema cuando los usos cambian por la misma razón; unirlos cuando cambian por razones distintas</tspan></text><text x="470" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">compra ramas y parámetros. No decide el parecido del texto sino la razón de cambio. Supuestos: olvido del 30 % en cada</tspan></text><text x="470" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cambio común y una rama por cada cambio de un solo uso.</tspan></text><text x="470" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
