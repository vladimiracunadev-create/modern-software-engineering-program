oke-width="1.6"/><text x="460" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">Tres verdaderos positivos, una falsa alarma y cuatro verdaderos negativos: el serializador accede a los campos de otro</tspan></text><text x="460" y="437.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">objeto por oficio. Que el método sea problema depende de si moverlo mejoraría el diseño: lo decide una persona con el</tspan></text><text x="460" y="454.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">contexto. Ocho métodos y etiquetas del autor.</tspan></text><text x="460" y="493.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
