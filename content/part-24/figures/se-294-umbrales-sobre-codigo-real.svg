<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 458" width="960" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Funciones señaladas por cada regla de olores sobre 65 funciones del propio repositorio (commit 4dafaa63)</title><desc id="d">Barras horizontales con las funciones señaladas por cada regla entre 65: largo mayor de 25 líneas, 5; más de 5 parámetros, 7; anidamiento mayor de 3, 1; complejidad ciclomática mayor de 10, 3; por alguna regla, 12; si el largo de datos no cuenta, 11 porque sale una plantilla de 217 líneas con 83 por ciento de datos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="458" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Funciones señaladas por cada regla de olores sobre 65 funciones del propio repositorio (commit 4dafaa63)</tspan></text><line x1="324" y1="49" x2="324" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="277" x2="324" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="443.176" y1="49" x2="443.176" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="443.176" y1="277" x2="443.176" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="443.176" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="443.176" dy="0">2,5</tspan></text><line x1="562.352" y1="49" x2="562.352" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="562.352" y1="277" x2="562.352" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="562.352" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.352" dy="0">5</tspan></text><line x1="681.528" y1="49" x2="681.528" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="681.528" y1="277" x2="681.528" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="681.528" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="681.528" dy="0">7,5</tspan></text><line x1="800.704" y1="49" x2="800.704" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="800.704" y1="277" x2="800.704" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="800.704" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800.704" dy="0">10</tspan></text><line x1="919.88" y1="49" x2="919.88" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="919.88" y1="277" x2="919.88" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="919.88" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="919.88" dy="0">12,5</tspan></text><line x1="324" y1="277" x2="919.88" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Largo mayor de 25 líneas</tspan></text><text x="314" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Más de 5 parámetros</tspan></text><text x="314" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Anidamiento mayor de 3</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Complejidad ciclomática mayor de 10</tspan></text><text x="314" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Señaladas por alguna regla</tspan></text><text x="314" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Si el largo de datos no cuenta</tspan></text><rect x="324" y="55" width="238.352" height="26" rx="3" fill="#946512"/><text x="569.352" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="569.352" dy="0">5</tspan></text><rect x="324" y="93" width="333.693" height="26" rx="3" fill="#946512"/><text x="664.693" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="664.693" dy="0">7</tspan></text><rect x="324" y="131" width="47.6704" height="26" rx="3" fill="#946512"/><text x="378.67" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="378.67" dy="0">1</tspan></text><rect x="324" y="169" width="143.011" height="26" rx="3" fill="#946512"/><text x="474.011" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="474.011" dy="0">3</tspan></text><rect x="324" y="207" width="572.045" height="26" rx="3" fill="#946512"/><text x="903.045" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="903.045" dy="0">12</tspan></text><rect x="324" y="245" width="524.374" height="26" rx="3" fill="#946512"/><text x="855.374" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="855.374" dy="0">11</tspan></text><text x="621.94" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="621.94" dy="0">Funciones señaladas</tspan></text><rect x="10" y="335" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Las tres funciones de mayor complejidad (el convertidor con 39, la página con 14 y el diagrama con 12) merecen leerse: tienen</tspan></text><text x="480" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">lógica. La de 217 líneas es mayoritariamente texto de una plantilla: señalarla por largo es una falsa alarma que enseña a</tspan></text><text x="480" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">ignorar la herramienta. Los umbrales son convenciones del autor y se midió en el estado del repositorio de ese commit.</tspan></text><text x="480" y="440.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
