<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alarma por frecuencia cardíaca: avisos por 100 pacientes-día y deterioros detectados según el umbral</title><desc id="d">Línea con los deterioros detectados, de 89, según los avisos por 100 pacientes-día en escala logarítmica: el umbral de 120 latidos por minuto da 1,0 aviso y detecta 31; el de 110 da 11,3 y detecta 58; el de 100 da 103,0 y detecta 74; el de 90 da 462,4 y detecta 85.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Alarma por frecuencia cardíaca: avisos por 100 pacientes-día y deterioros detectados según el umbral</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="299" x2="78.62" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="179" x2="910" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="179" x2="78.62" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="119" x2="910" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="119" x2="78.62" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="359" x2="96.62" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="361.747" y1="59" x2="361.747" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="361.747" y1="359" x2="361.747" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="361.747" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="361.747" dy="0">10</tspan></text><line x1="626.873" y1="59" x2="626.873" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="626.873" y1="359" x2="626.873" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="626.873" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.873" dy="0">100</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1 000</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Deterioros detectados (de 89)</text><text x="494.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Avisos por 100 pacientes-día (escala logarítmica)</tspan></text><line x1="78.62" y1="92" x2="910" y2="92" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="84.62" y="86" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="84.62" dy="0">89 deterioros reales</tspan></text><polyline points="96.62,266 375.819,185 630.277,137 803.187,104" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="266" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="106.62" y="270.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="106.62" dy="0">120 lat/min · 31 de 89</tspan></text><circle cx="375.819" cy="185" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="385.819" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="385.819" dy="0">110 · 58 de 89</tspan></text><circle cx="630.277" cy="137" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="640.277" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="640.277" dy="0">100 · 74 de 89</tspan></text><circle cx="803.187" cy="104" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="793.187" y="108.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="793.187" dy="0">90 · 85 de 89</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">No hay umbral sin coste: el que detecta casi todo emite 272 avisos por cada deterioro real, que nadie puede atender; el que</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">casi no molesta deja pasar dos de cada tres. Pacientes, señales y deterioros sintéticos; no representan ninguna cohorte ni</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">dispositivo, y la clase no propone umbrales clínicos.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
