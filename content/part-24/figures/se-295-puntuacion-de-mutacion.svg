<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutantes de una función de tarifa que mata cada conjunto de pruebas</title><desc id="d">Barras: de 19 mutantes generados automáticamente sobre una función de tarifa, cinco ejemplos matan 12, doscientas entradas al azar matan 14 y cincuenta y seis entradas en los bordes de los rangos matan los 19.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="307" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">5 ejemplos</tspan></text><rect x="300" y="16" width="316" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="624" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="624" dy="0">12 de 19 (63,2 %)</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">200 entradas al azar</tspan></text><rect x="300" y="60" width="368.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="676.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="676.5" dy="0">14 de 19 (73,7 %)</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">56 entradas en los bordes</tspan></text><rect x="300" y="104" width="500" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="808" dy="0">19 de 19 (100 %)</tspan></text><text x="290" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Azar + bordes</tspan></text><rect x="300" y="148" width="500" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="808" dy="0">19 de 19 (100 %)</tspan></text><rect x="10" y="196" width="980" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">Los mutantes que sobreviven a los ejemplos son tres de frontera (cambiar &lt;= por &lt;), tres de constante y uno lógico: justo lo que un</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">ejemplo del camino feliz no toca. Ningún mutante resultó equivalente sobre una rejilla de 2140 entradas. Los mutantes son cambios</tspan></text><text x="500" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">automáticos simples del autor, no defectos reales.</tspan></text><text x="500" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
