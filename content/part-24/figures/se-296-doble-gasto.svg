<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que un atacante rehaga la cadena: simulación (fórmula de Nakamoto)</title><desc id="d">Líneas con la probabilidad simulada de que un atacante rehaga la cadena según las confirmaciones: con el 10 por ciento del poder cae a 0,001 con 6 confirmaciones; con el 30 por ciento baja de 0,603 a 0,064 con 10; con el 40 por ciento solo baja de 0,800 a 0,372; la fórmula de Nakamoto da valores equivalentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de que un atacante rehaga la cadena: simulación (fórmula de Nakamoto)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Atacante con el 40 %</tspan></text><rect x="214.8" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Atacante con el 30 %</tspan></text><polygon points="419.6,44.1 426.2,56.4 413,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="433.6" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="433.6" dy="0">Atacante con el 10 %</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,2</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,4</tspan></text><line x1="78.62" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,6</tspan></text><line x1="78.62" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,8</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="176.158" y1="87" x2="176.158" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="176.158" y1="387" x2="176.158" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="176.158" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="176.158" dy="0">2</tspan></text><line x1="335.234" y1="87" x2="335.234" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="335.234" y1="387" x2="335.234" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="335.234" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="335.234" dy="0">4</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="387" x2="494.31" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">6</tspan></text><line x1="812.462" y1="87" x2="812.462" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="812.462" y1="387" x2="812.462" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="812.462" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.462" dy="0">10</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0"></tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Probabilidad de rehacer la cadena (simulada)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Confirmaciones esperadas</tspan></text><polyline points="96.62,147 176.158,175.2 335.234,212.7 494.31,239.4 812.462,275.4" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="147" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">0,800</tspan></text><circle cx="176.158" cy="175.2" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="176.158" y="164.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="176.158" dy="0">0,706</tspan></text><circle cx="335.234" cy="212.7" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="335.234" y="201.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="335.234" dy="0">0,581</tspan></text><circle cx="494.31" cy="239.4" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="494.31" y="228.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">0,492</tspan></text><circle cx="812.462" cy="275.4" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="812.462" y="264.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="812.462" dy="0">0,372</tspan></text><polyline points="96.62,206.1 176.158,257.7 335.234,312.3 494.31,339.9 812.462,367.8" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="200.6" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="96.62" y="195.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">0,603</tspan></text><rect x="170.658" y="252.2" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="176.158" y="246.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="176.158" dy="0">0,431</tspan></text><rect x="329.734" y="306.8" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="335.234" y="301.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="335.234" dy="0">0,249</tspan></text><rect x="488.81" y="334.4" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="494.31" y="328.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">0,157</tspan></text><rect x="806.962" y="362.3" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="812.462" y="356.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="812.462" dy="0">0,064</tspan></text><polyline points="96.62,327 176.158,371.1 335.234,385.2 494.31,386.7 812.462,387" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="96.62,320.675 102.67,331.95 90.57,331.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="316" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">0,200</tspan></text><polygon points="176.158,364.775 182.208,376.05 170.108,376.05" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="176.158" y="360.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="176.158" dy="0">0,053</tspan></text><polygon points="335.234,378.875 341.284,390.15 329.184,390.15" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="335.234" y="374.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="335.234" dy="0">0,006</tspan></text><polygon points="494.31,380.375 500.36,391.65 488.26,391.65" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="494.31" y="375.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">0,001</tspan></text><polygon points="812.462,380.675 818.512,391.95 806.412,391.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="822.462" y="391.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="822.462" dy="0">0,000</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La seguridad probabilística depende de dos cosas que el código no controla: la fracción de poder del atacante y el número</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de confirmaciones que se esperan. Con 30 % ni 10 confirmaciones bajan la probabilidad de 0,04. Simulación (40 000 carreras)</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">y fórmula coinciden en torno a ±0,03; no se probó ninguna red real.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
