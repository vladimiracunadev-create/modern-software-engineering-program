<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 465" width="910" height="465" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Módulos que hay que editar al cambiar una decisión de diseño</title><desc id="d">Tabla: al cambiar una de seis decisiones, una descomposición por pasos del flujo obliga a editar entre 2 y 4 módulos y 2,19 de media sobre mil cambios, mientras que una descomposición que oculta cada decisión en un módulo obliga a editar uno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="465" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Decisión que cambia</tspan></text><rect x="340" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Por pasos del flujo (5 módulos)</tspan></text><rect x="610" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Por decisión oculta (6 +</tspan></text><text x="752" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">orquestador)</tspan></text><rect x="10" y="56" width="324" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="77.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Tarifas</tspan></text><rect x="340" y="56" width="264" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">2</tspan></text><rect x="610" y="56" width="284" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">1</tspan></text><rect x="10" y="98" width="324" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="119.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Zonas</tspan></text><rect x="340" y="98" width="264" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">2</tspan></text><rect x="610" y="98" width="284" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">1</tspan></text><rect x="10" y="140" width="324" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Descuentos (30 % de los cambios)</tspan></text><rect x="340" y="140" width="264" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">2</tspan></text><rect x="610" y="140" width="284" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">1</tspan></text><rect x="10" y="182" width="324" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="203.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Moneda y redondeo</tspan></text><rect x="340" y="182" width="264" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">4</tspan></text><rect x="610" y="182" width="284" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">1</tspan></text><rect x="10" y="224" width="324" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Canal de aviso</tspan></text><rect x="340" y="224" width="264" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">2</tspan></text><rect x="610" y="224" width="284" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">1</tspan></text><rect x="10" y="266" width="324" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Persistencia</tspan></text><rect x="340" y="266" width="264" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">2</tspan></text><rect x="610" y="266" width="284" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">1</tspan></text><rect x="10" y="308" width="324" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="329.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Media sobre 1000 cambios</tspan></text><rect x="340" y="308" width="264" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">2,19</tspan></text><rect x="610" y="308" width="284" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">1,00</tspan></text><rect x="10" y="354" width="890" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="378.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">La moneda aparece en cuatro pasos del flujo: un cambio de redondeo recorre cuatro módulos. Con módulos que conocen cada</tspan></text><text x="455" y="395.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">decisión al azar con probabilidad 0,3, la media es 1,48; con 0,5, 2,50. Las matrices de conocimiento y los pesos de los</tspan></text><text x="455" y="412.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">cambios son supuestos del autor, no un proyecto medido.</tspan></text><text x="455" y="451.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
