<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 519" width="910" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una prueba que espera «sin recargo» ejecutada en cada minuto de una semana</title><desc id="d">Tabla: una prueba que espera que no haya recargo de fin de semana y lee el reloj real falla en 2880 de los 10 080 minutos de una semana, un 28,6 por ciento, en cualquier huso horario; el servidor en UTC y una persona en UTC menos 3 discrepan sobre si es fin de semana durante 360 minutos; con un reloj inyectado fijo en un miércoles no falla ninguna ejecución.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="519" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Situación</tspan></text><rect x="570" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="732" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="732" dy="0">Minutos con fallo / resultado</tspan></text><rect x="10" y="56" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Reloj real, huso de UTC</tspan></text><rect x="570" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">2880 de 10 080 (28,6 %)</tspan></text><rect x="10" y="114" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Reloj real, huso UTC−3</tspan></text><rect x="570" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">2880 de 10 080 (28,6 %)</tspan></text><rect x="10" y="172" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Reloj real, huso UTC+9</tspan></text><rect x="570" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">2880 de 10 080 (28,6 %)</tspan></text><rect x="10" y="230" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">UTC y UTC−3 discrepan sobre si es fin de semana</tspan></text><rect x="570" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">360 de 10 080 (3,6 %)</tspan></text><rect x="10" y="288" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Dos lecturas del reloj con 20 ms de separación, junto a cada medianoche</tspan></text><rect x="570" y="288" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">2 de 7 medianoches con resultado distinto</tspan></text><rect x="10" y="346" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="375.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Reloj inyectado con un miércoles fijo</tspan></text><rect x="570" y="346" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="375.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">0 de 10 080</tspan></text><rect x="10" y="408" width="890" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">El 28,6 % es 2/7: una prueba que no controla el reloj pasa de lunes a viernes y falla el fin de semana, y el huso solo</tspan></text><text x="455" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">cambia qué minutos fallan. Inyectar el reloj convierte esa dependencia en un parámetro: la prueba ejecuta el miércoles</tspan></text><text x="455" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">de siempre. Cálculo exhaustivo sobre una semana, sin reloj real.</tspan></text><text x="455" y="505.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
