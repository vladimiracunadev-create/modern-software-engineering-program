<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 578" width="980" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Complejidad ciclomática y complejidad cognitiva simplificada de cinco funciones</title><desc id="d">Barras agrupadas con la complejidad ciclomática y la cognitiva de cinco funciones: la cadena plana de ocho casos y las ocho condiciones anidadas tienen ciclomática 8 y 9, casi iguales, pero cognitiva 7 y 36; la tabla de consulta tiene ciclomática 1 y cognitiva 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Complejidad ciclomática y complejidad cognitiva simplificada de cinco funciones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ciclomática</tspan></text><rect x="146.94" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Cognitiva (simplificada)</tspan></text><line x1="324" y1="77" x2="324" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="397" x2="324" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="477.97" y1="77" x2="477.97" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="477.97" y1="397" x2="477.97" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="477.97" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477.97" dy="0">10</tspan></text><line x1="631.94" y1="77" x2="631.94" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="631.94" y1="397" x2="631.94" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="631.94" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="631.94" dy="0">20</tspan></text><line x1="785.91" y1="77" x2="785.91" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="785.91" y1="397" x2="785.91" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="785.91" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785.91" dy="0">30</tspan></text><line x1="939.88" y1="77" x2="939.88" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="939.88" y1="397" x2="939.88" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="939.88" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="939.88" dy="0">40</tspan></text><line x1="324" y1="397" x2="939.88" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Cadena plana de 8 casos</tspan></text><text x="314" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Ocho condiciones anidadas</tspan></text><text x="314" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Bucle con condición y salida</tspan></text><text x="314" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Las ocho condiciones en una conjunción</tspan></text><text x="314" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Tabla de consulta</tspan></text><rect x="324" y="83" width="123.176" height="24.5" rx="3" fill="#102a43"/><text x="454.176" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="454.176" dy="0">8</tspan></text><rect x="324" y="110.5" width="107.779" height="24.5" rx="3" fill="#c0432f"/><text x="438.779" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="438.779" dy="0">7</tspan></text><rect x="324" y="147" width="138.573" height="24.5" rx="3" fill="#102a43"/><text x="469.573" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="469.573" dy="0">9</tspan></text><rect x="324" y="174.5" width="554.292" height="24.5" rx="3" fill="#c0432f"/><text x="885.292" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="885.292" dy="0">36</tspan></text><rect x="324" y="211" width="61.588" height="24.5" rx="3" fill="#102a43"/><text x="392.588" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392.588" dy="0">4</tspan></text><rect x="324" y="238.5" width="76.985" height="24.5" rx="3" fill="#c0432f"/><text x="407.985" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.985" dy="0">5</tspan></text><rect x="324" y="275" width="46.191" height="24.5" rx="3" fill="#102a43"/><text x="377.191" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="377.191" dy="0">3</tspan></text><rect x="324" y="302.5" width="30.794" height="24.5" rx="3" fill="#c0432f"/><text x="361.794" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="361.794" dy="0">2</tspan></text><rect x="324" y="339" width="15.397" height="24.5" rx="3" fill="#102a43"/><text x="346.397" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="346.397" dy="0">1</tspan></text><rect x="324" y="366.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="333" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><text x="631.94" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="631.94" dy="0">Complejidad</tspan></text><rect x="10" y="455" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">La ciclomática cuenta caminos; la cognitiva penaliza el anidamiento porque cada nivel obliga a recordar más condiciones a la vez</tspan></text><text x="490" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">(anidamiento 1 en la cadena plana y 8 en la anidada). Ocho casos planos se leen de arriba abajo; ocho niveles, no. La</tspan></text><text x="490" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">implementación es una versión simplificada del autor: no reproduce la de ninguna herramienta.</tspan></text><text x="490" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
