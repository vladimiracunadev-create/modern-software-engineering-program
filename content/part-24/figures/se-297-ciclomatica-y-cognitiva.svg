<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 421" width="930" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Complejidad ciclomática y complejidad cognitiva simplificada de cinco funciones</title><desc id="d">Tabla: una cadena plana de ocho casos y ocho condiciones anidadas tienen complejidad ciclomática 8 y 9, casi iguales, pero complejidad cognitiva 7 y 36; la tabla de consulta tiene ciclomática 1 y cognitiva 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="421" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Función</tspan></text><rect x="430" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">Ciclomática</tspan></text><rect x="570" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">Cognitiva</tspan></text><text x="667" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">(simplificada)</tspan></text><rect x="770" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Anidamiento</tspan></text><rect x="10" y="56" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Cadena plana de 8 casos</tspan></text><rect x="430" y="56" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">8</tspan></text><rect x="570" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">7</tspan></text><rect x="770" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">1</tspan></text><rect x="10" y="106" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Ocho condiciones anidadas</tspan></text><rect x="430" y="106" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">9</tspan></text><rect x="570" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">36</tspan></text><rect x="770" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">8</tspan></text><rect x="10" y="156" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Bucle con condición y salida</tspan></text><rect x="430" y="156" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">4</tspan></text><rect x="570" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">5</tspan></text><rect x="770" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">2</tspan></text><rect x="10" y="206" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Las mismas ocho condiciones en una conjunción</tspan></text><rect x="430" y="206" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">3</tspan></text><rect x="570" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">2</tspan></text><rect x="770" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">1</tspan></text><rect x="10" y="256" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Tabla de consulta</tspan></text><rect x="430" y="256" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">1</tspan></text><rect x="570" y="256" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">0</tspan></text><rect x="770" y="256" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0</tspan></text><rect x="10" y="310" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">La ciclomática cuenta caminos; la cognitiva penaliza el anidamiento porque cada nivel obliga a recordar más condiciones a</tspan></text><text x="465" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">la vez. Ocho casos planos se leen de arriba abajo; ocho niveles, no. La implementación es una versión simplificada del</tspan></text><text x="465" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">autor: no reproduce la de ninguna herramienta.</tspan></text><text x="465" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
