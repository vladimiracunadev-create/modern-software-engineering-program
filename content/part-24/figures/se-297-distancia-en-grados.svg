<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Error al tratar grados de longitud y latitud como un plano (pares a menos de 100 km)</title><desc id="d">Barras agrupadas con el error al medir distancias como si los grados fueran un plano: la mediana es 0,0 por ciento en el ecuador, 6,8 a 30 grados de latitud, 25,5 a 60 y 41,4 a 80; el percentil 95 llega a 408,4 y el máximo a 505,2 por ciento a 80 grados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Error al tratar grados de longitud y latitud como un plano (pares a menos de 100 km)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mediana</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Percentil 95</tspan></text><rect x="255.26" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="275.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="275.26" dy="0">Máximo</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="281.667" x2="78.62" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="188.333" x2="78.62" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">600</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Error de la distancia plana (%)</text><rect x="99.6545" y="373" width="53.4253" height="2" rx="3" fill="#087f8c"/><text x="126.367" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.367" dy="0">0,0</tspan></text><rect x="157.08" y="373" width="53.4253" height="2" rx="3" fill="#946512"/><text x="183.793" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="183.793" dy="0">0,0</tspan></text><rect x="214.505" y="373" width="53.4253" height="2" rx="3" fill="#c0432f"/><text x="241.218" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="241.218" dy="0">0,0</tspan></text><text x="183.793" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">0° (ecuador)</tspan></text><rect x="310" y="371.827" width="53.4253" height="3.17333" rx="3" fill="#087f8c"/><text x="336.712" y="365.827" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="336.712" dy="0">6,8</tspan></text><rect x="367.425" y="367.907" width="53.4253" height="7.09333" rx="3" fill="#946512"/><text x="394.138" y="361.907" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="394.138" dy="0">15,2</tspan></text><rect x="424.85" y="367.533" width="53.4253" height="7.46667" rx="3" fill="#c0432f"/><text x="451.563" y="361.533" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="451.563" dy="0">16,0</tspan></text><text x="394.138" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">30°</tspan></text><rect x="520.345" y="363.1" width="53.4253" height="11.9" rx="3" fill="#087f8c"/><text x="547.057" y="357.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.057" dy="0">25,5</tspan></text><rect x="577.77" y="329.967" width="53.4253" height="45.0333" rx="3" fill="#946512"/><text x="604.483" y="323.967" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="604.483" dy="0">96,5</tspan></text><rect x="635.195" y="326.933" width="53.4253" height="48.0667" rx="3" fill="#c0432f"/><text x="661.908" y="320.933" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="661.908" dy="0">103,0</tspan></text><text x="604.482" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">60°</tspan></text><rect x="730.689" y="355.68" width="53.4253" height="19.32" rx="3" fill="#087f8c"/><text x="757.402" y="349.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="757.402" dy="0">41,4</tspan></text><rect x="788.115" y="184.413" width="53.4253" height="190.587" rx="3" fill="#946512"/><text x="814.827" y="178.413" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="814.827" dy="0">408,4</tspan></text><rect x="845.54" y="139.24" width="53.4253" height="235.76" rx="3" fill="#c0432f"/><text x="872.253" y="133.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="872.253" dy="0">505,2</tspan></text><text x="814.827" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">80°</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un grado de longitud mide 111 km en el ecuador y 19 km a 80° de latitud; la fórmula plana no lo sabe. Además, dos puntos a</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ambos lados de ±180° quedan a 111 km pero la resta ingenua da 39 919 km. Esferas frente a elipsoides y proyecciones no se</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">evaluaron: la haversine usa un radio medio.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
