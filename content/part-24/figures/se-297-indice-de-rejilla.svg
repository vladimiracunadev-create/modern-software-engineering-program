<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Candidatos examinados por una consulta de radio de 1 km según el tamaño de celda de una rejilla</title><desc id="d">Líneas en escalas logarítmicas con los candidatos examinados por una consulta de radio de 1 kilómetro según el tamaño de celda: con puntos uniformes pasa de 12,7 con celdas de 0,5 km a 934,8 con 20 km; con puntos agrupados de 894,4 a 16 106,8; la fuerza bruta examina 20 000 en ambos casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Candidatos examinados por una consulta de radio de 1 km según el tamaño de celda de una rejilla</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Puntos agrupados en una ciudad</tspan></text><rect x="290.2" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="310.2" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310.2" dy="0">Puntos uniformes</tspan></text><line x1="108.78" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="387" x2="108.78" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10</tspan></text><line x1="108.78" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="312" x2="108.78" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100</tspan></text><line x1="108.78" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="237" x2="108.78" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">1 000</tspan></text><line x1="108.78" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="162" x2="108.78" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10 000</tspan></text><line x1="108.78" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="87" x2="108.78" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100 000</tspan></text><line x1="108.78" y1="87" x2="108.78" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="126.78" y1="87" x2="126.78" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="126.78" y1="387" x2="126.78" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="126.78" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="126.78" dy="0">0,5</tspan></text><line x1="270.566" y1="87" x2="270.566" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="270.566" y1="387" x2="270.566" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="270.566" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="270.566" dy="0">1</tspan></text><line x1="414.352" y1="87" x2="414.352" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="414.352" y1="387" x2="414.352" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="414.352" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="414.352" dy="0">2</tspan></text><line x1="604.428" y1="87" x2="604.428" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="604.428" y1="387" x2="604.428" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="604.428" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.428" dy="0">5</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">20</tspan></text><line x1="108.78" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Candidatos examinados por consulta (escala logarítmica)</text><text x="509.39" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="509.39" dy="0">Tamaño de celda de la rejilla (km) (escala logarítmica)</tspan></text><line x1="108.78" y1="139.423" x2="910" y2="139.423" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="114.78" y="133.423" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="114.78" dy="0">fuerza bruta: 20 000</tspan></text><polyline points="126.78,240.635 270.566,229.459 414.352,212.356 604.428,183.363 892,146.474" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="126.78" cy="240.635" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="126.78" y="229.635" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="126.78" dy="0">894,4</tspan></text><circle cx="270.566" cy="229.459" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="270.566" y="218.459" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="270.566" dy="0">1 260,5</tspan></text><circle cx="414.352" cy="212.356" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="414.352" y="201.356" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="414.352" dy="0">2 131,0</tspan></text><circle cx="604.428" cy="183.363" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="604.428" y="172.363" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="604.428" dy="0">5 189,9</tspan></text><circle cx="892" cy="146.474" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="170.474" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">16 106,8</tspan></text><polyline points="126.78,379.215 270.566,367.855 414.352,349.523 604.428,312.459 892,239.196" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="121.28" y="373.715" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="126.78" y="368.215" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="126.78" dy="0">12,7</tspan></text><rect x="265.066" y="362.355" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="270.566" y="356.855" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="270.566" dy="0">18,0</tspan></text><rect x="408.852" y="344.023" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="414.352" y="338.523" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="414.352" dy="0">31,6</tspan></text><rect x="598.928" y="306.959" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="604.428" y="301.459" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="604.428" dy="0">98,6</tspan></text><rect x="886.5" y="233.696" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="228.196" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">934,8</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El índice reduce el trabajo de 20 000 a 18 candidatos cuando los datos se reparten por igual, y a 1 260 cuando se agrupan:</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">la distribución de los datos decide cuánto ayuda. Una celda mucho mayor que el radio pierde la ventaja. Se cuentan</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">candidatos, no milisegundos: no se midió ninguna base de datos espacial.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
