<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 458" width="980" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma regla de tarifa en una tabla con tres reglas y en condicionales anidados</title><desc id="d">Gráfico de mancuernas en escala logarítmica: la misma regla ocupa 13 líneas con complejidad 4 y 8 caminos en forma de tabla más tres reglas, y 51 líneas, complejidad 19 y 96 caminos en condicionales anidados; las 96 combinaciones esenciales de la regla son iguales en ambas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="458" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La misma regla de tarifa en una tabla con tres reglas y en condicionales anidados</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Tabla + 3 reglas</tspan></text><circle cx="190.64" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Condicionales anidados</tspan></text><line x1="388.12" y1="77" x2="388.12" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="388.12" y1="277" x2="388.12" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="388.12" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="388.12" dy="0">0,1</tspan></text><line x1="547.94" y1="77" x2="547.94" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="547.94" y1="277" x2="547.94" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="547.94" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.94" dy="0">1</tspan></text><line x1="707.76" y1="77" x2="707.76" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="707.76" y1="277" x2="707.76" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="707.76" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.76" dy="0">10</tspan></text><line x1="867.58" y1="77" x2="867.58" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="867.58" y1="277" x2="867.58" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="867.58" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.58" dy="0">100</tspan></text><line x1="388.12" y1="277" x2="867.58" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Líneas</tspan></text><text x="344" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Complejidad ciclomática</tspan></text><text x="344" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Anidamiento máximo</tspan></text><text x="344" y="221.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Caminos distintos recorridos por la rejilla</tspan></text><text x="344" y="261.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Combinaciones esenciales de la regla</tspan></text><line x1="725.97" y1="97" x2="820.844" y2="97" stroke="#c0432f" stroke-width="4"/><circle cx="725.97" cy="97" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="820.844" cy="97" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="713.97" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="713.97" dy="0">13</tspan></text><text x="832.844" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="832.844" dy="0">51</tspan></text><text x="966" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="966" dy="0">×3,9</tspan></text><line x1="644.161" y1="137" x2="752.31" y2="137" stroke="#c0432f" stroke-width="4"/><circle cx="644.161" cy="137" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="752.31" cy="137" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="632.161" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="632.161" dy="0">4</tspan></text><text x="764.31" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="764.31" dy="0">19</tspan></text><text x="966" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="966" dy="0">×4,8</tspan></text><line x1="547.94" y1="177" x2="624.194" y2="177" stroke="#c0432f" stroke-width="4"/><circle cx="547.94" cy="177" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="624.194" cy="177" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="535.94" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="535.94" dy="0">1</tspan></text><text x="636.194" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="636.194" dy="0">3</tspan></text><text x="966" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="966" dy="0">×3,0</tspan></text><line x1="692.272" y1="217" x2="864.747" y2="217" stroke="#c0432f" stroke-width="4"/><circle cx="692.272" cy="217" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="864.747" cy="217" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="680.272" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="680.272" dy="0">8</tspan></text><text x="876.747" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="876.747" dy="0">96</tspan></text><text x="966" y="221.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="966" dy="0">×12,0</tspan></text><line x1="864.747" y1="257" x2="864.747" y2="257" stroke="#c0432f" stroke-width="4"/><circle cx="864.747" cy="257" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="864.747" cy="257" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="852.747" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="852.747" dy="0">96</tspan></text><text x="876.747" y="261.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="876.747" dy="0">96</tspan></text><text x="966" y="261.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="966" dy="0">igual</tspan></text><text x="627.85" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="627.85" dy="0">Cantidad (escala logarítmica)</tspan></text><rect x="10" y="335" width="960" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">La regla tiene 96 combinaciones en cualquier forma: eso es complejidad esencial. La forma anidada reparte la misma regla en 96</tspan></text><text x="490" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">caminos de código y multiplica por cinco la complejidad ciclomática: lo que sobra es accidental. Coinciden en 224 entradas; no se</tspan></text><text x="490" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">probó equivalencia completa.</tspan></text><text x="490" y="440.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
