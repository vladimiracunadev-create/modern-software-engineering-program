<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Automatizaciones sin responsable activo si cada responsable se va con probabilidad del 15 % al año (500 flujos)</title><desc id="d">Líneas con el porcentaje de automatizaciones sin responsable activo según los años: con un solo responsable, con o sin revisión anual, sube de 15,4 a 37,8 y 52,2 por ciento al año, a los tres y a los cinco; con dos responsables sin revisión llega a 30,8; con dos responsables y revisión anual se queda en 8,6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Automatizaciones sin responsable activo si cada responsable se va con probabilidad del 15 % al año (500</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">flujos)</tspan></text><circle cx="22" cy="70" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Un responsable (con o sin revisión)</tspan></text><rect x="327.9" y="64" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="347.9" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="347.9" dy="0">Dos responsables, sin revisión</tspan></text><polygon points="608.1,63.1 614.7,75.4 601.5,75.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="622.1" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="622.1" dy="0">Dos responsables, revisión anual</tspan></text><line x1="71.08" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="406" x2="71.08" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="410.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="356" x2="910" y2="356" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="356" x2="71.08" y2="356" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="360.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="306" x2="910" y2="306" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="306" x2="71.08" y2="306" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="310.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="256" x2="910" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="256" x2="71.08" y2="256" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="206" x2="910" y2="206" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="206" x2="71.08" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="210.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="156" x2="910" y2="156" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="156" x2="71.08" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="160.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">50</tspan></text><line x1="71.08" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="106" x2="71.08" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="106" x2="71.08" y2="406" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="106" x2="89.08" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="406" x2="89.08" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">1 año</tspan></text><line x1="490.54" y1="106" x2="490.54" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="490.54" y1="406" x2="490.54" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="490.54" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.54" dy="0">3 años</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">5 años</tspan></text><line x1="71.08" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Automatizaciones sin responsable activo (%)</text><text x="490.54" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Años transcurridos</tspan></text><polyline points="89.08,329 490.54,217 892,145" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="89.08" cy="329" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="318" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">15,4</tspan></text><circle cx="490.54" cy="217" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="490.54" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="490.54" dy="0">37,8</tspan></text><circle cx="892" cy="145" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="134" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">52,2</tspan></text><polyline points="89.08,396 490.54,342 892,252" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="390.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="89.08" y="385" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">2,0</tspan></text><rect x="485.04" y="336.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="490.54" y="331" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="490.54" dy="0">12,8</tspan></text><rect x="886.5" y="246.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="241" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">30,8</tspan></text><polyline points="89.08,396 490.54,378 892,363" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="89.08,389.675 95.13,400.95 83.03,400.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="490.54,371.675 496.59,382.95 484.49,382.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="490.54" y="402" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="490.54" dy="0">5,6</tspan></text><polygon points="892,356.675 898.05,367.95 885.95,367.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="387" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">8,6</tspan></text><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La revisión anual no sirve si no queda nadie a quien reasignar: solo cambia el resultado cuando hay al menos dos</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">responsables y la revisión repone al que se fue. La tasa de salida del 15 % es un supuesto, no una medición de ninguna</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">organización; el patrón (no basta revisar) es el hallazgo.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
