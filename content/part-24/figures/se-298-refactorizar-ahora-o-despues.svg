font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0,05</tspan></text><line x1="345.411" y1="87" x2="345.411" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="345.411" y1="387" x2="345.411" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="345.411" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="345.411" dy="0">0,15</tspan></text><line x1="502.38" y1="87" x2="502.38" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="502.38" y1="387" x2="502.38" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="502.38" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502.38" dy="0">0,3</tspan></text><line x1="659.35" y1="87" x2="659.35" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="659.35" y1="387" x2="659.35" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="659.35" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="659.35" dy="0">0,6</tspan></text><line x1="775.031" y1="87" x2="775.031" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="775.031" y1="387" x2="775.031" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="775.031" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="775.031" dy="0">1</tspan></text><line x1="932" y1="87" x2="932" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="932" y1="387" x2="932" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="932" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="932" dy="0">2</tspan></text><line x1="78.62" y1="387" x2="950" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Costo esperado en 12 meses (puntos) (escala logarítmica)</text><text x="514.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="514.31" dy="0">Cambios por mes en el área (escala logarítmica)</tspan></text><polyline points="96.62,347.632 345.411,276.78 502.38,231.746 659.35,186.711 775.031,153.482 932,108.201" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="347.632" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="345.411" cy="276.78" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="502.38" cy="231.746" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="659.35" cy="186.711" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="775.031" cy="153.482" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="932" cy="108.201" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polyline points="96.62,251.537 345.411,251.537 502.38,251.537 659.35,251.537 775.031,251.537 932,251.537" fill="none" stroke="#102a43" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="246.037" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="339.911" y="246.037" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="496.88" y="246.037" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="653.85" y="246.037" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="769.531" y="246.037" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="926.5" y="246.037" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><polyline points="96.62,302.123 345.411,262.412 502.38,252.936 659.35,251.537 775.031,251.537 932,251.537" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="96.62,295.798 102.67,307.073 90.57,307.073" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="345.411,256.087 351.461,267.362 339.361,267.362" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="502.38,246.611 508.43,257.886 496.33,257.886" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="659.35,245.212 665.4,256.487 653.3,256.487" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="775.031,245.212 781.081,256.487 768.981,256.487" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="932,245.212 938.05,256.487 925.95,256.487" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="10" y="447" width="960" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Esperar al primer cambio es una opción: se paga solo si el área se mueve. Si aplazar duplica el costo del refactor, desde 0,30</tspan></text><text x="490" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">cambios por mes conviene hacerlo ahora. Deja de convenir esperar cuando aplazar encarece el trabajo (se pierde el contexto) o</tspan></text><text x="490" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">cuando el área cambia tanto que el pago es seguro. Un área que nunca cambia no merece refactor, aunque se vea fea. Poisson</tspan></text><text x="490" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">aproximado, 20 000 repeticiones y parámetros supuestos.</tspan></text><text x="490" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
