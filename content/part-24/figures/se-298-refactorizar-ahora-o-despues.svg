<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 587" width="980" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo esperado en 12 meses (puntos): refactorizar ahora, al primer cambio o nunca</title><desc id="d">Líneas en escala logarítmica con el costo esperado según los cambios por mes del área: no refactorizar sube de 1,83 con 0,05 cambios por mes a 72,22 con 2; refactorizar ahora cuesta 8 siempre; esperar al primer cambio cuesta entre 3,68 y 8; nunca gana con 0,15 cambios por mes o menos, el primer cambio con 0,30 y ahora con 1 o más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo esperado en 12 meses (puntos): refactorizar ahora, al primer cambio o nunca</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Nunca</tspan></text><rect x="101.7" y="45" width="12" height="12" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">Ahora</tspan></text><polygon points="193.4,44.1 200,56.4 186.8,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="207.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="207.4" dy="0">Al primer cambio</tspan></text><line x1="78.62" y1="387" x2="950" y2="387" stroke="#d5