<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arcos de la función heredada alcanzados según el número de entradas registradas</title><desc id="d">Líneas en escala logarítmica con los arcos alcanzados según las entradas registradas: la media sube de 67,4 por ciento con 3 entradas a 88,7 con 10, 94,9 con 30 y 96,7 con 300; el mínimo de 30 muestras va de 52,4 a 95,2; solo las 3000 entradas alcanzan el 100 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="560" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Arcos de la función heredada alcanzados según el número de entradas registradas</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Media de 30 muestras</tspan></text><rect x="214.8" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Mínimo de 30 muestras</tspan></text><line x1="78.62" y1="377" x2="950" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="377" x2="78.62" y2="377" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="319" x2="950" y2="