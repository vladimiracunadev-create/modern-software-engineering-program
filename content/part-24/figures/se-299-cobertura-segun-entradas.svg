x="96.62" y="387.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">52,4</tspan></text><rect x="236.721" y="205.62" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="242.221" y="235.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="242.221" dy="0">78,6</tspan></text><rect x="369.58" y="136.6" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="375.08" y="166.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="375.08" dy="0">90,5</tspan></text><rect x="515.181" y="136.6" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="520.681" y="166.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="520.681" dy="0">90,5</tspan></text><rect x="648.04" y="109.34" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="653.54" y="138.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="653.54" dy="0">95,2</tspan></text><rect x="926.5" y="81.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="932" y="111" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="932" dy="0"> </tspan></text><rect x="10" y="437" width="960" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Los primeros diez casos rinden mucho y los últimos arcos cuestan miles: los caminos raros (el cupón de envío gratis fuera de</tspan></text><text x="490" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">zona, el piso en cero) casi no aparecen al azar. Hay que ir a buscarlos. El eje vertical empieza en 50 %. Tras el paso 2, la</tspan></text><text x="490" y="495.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">función de 15 de complejidad queda en seis funciones, la mayor con 4.</tspan></text><text x="490" y="542.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
