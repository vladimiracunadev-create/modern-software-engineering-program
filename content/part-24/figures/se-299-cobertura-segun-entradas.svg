<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 447" width="910" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arcos de la función heredada alcanzados según el número de entradas registradas</title><desc id="d">Tabla: con 3 entradas registradas al azar se alcanza en promedio el 67,4 por ciento de los arcos de la función heredada y como mínimo el 52,4; con 30, el 94,9 por ciento; con 300, el 96,7 con un mínimo de 95,2, y solo con las 3000 entradas se alcanzan todos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="447" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Entradas registradas</tspan></text><rect x="270" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">Arcos alcanzados (media)</tspan></text><rect x="590" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Mínimo de 30 muestras</tspan></text><rect x="10" y="56" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">3</tspan></text><rect x="270" y="56" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">67,4 %</tspan></text><rect x="590" y="56" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">52,4 %</tspan></text><rect x="10" y="102" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">10</tspan></text><rect x="270" y="102" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">88,7 %</tspan></text><rect x="590" y="102" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">78,6 %</tspan></text><rect x="10" y="148" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">30</tspan></text><rect x="270" y="148" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">94,9 %</tspan></text><rect x="590" y="148" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">90,5 %</tspan></text><rect x="10" y="194" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">100</tspan></text><rect x="270" y="194" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">96,0 %</tspan></text><rect x="590" y="194" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">90,5 %</tspan></text><rect x="10" y="240" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">300</tspan></text><rect x="270" y="240" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">96,7 %</tspan></text><rect x="590" y="240" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">95,2 %</tspan></text><rect x="10" y="286" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">3000</tspan></text><rect x="270" y="286" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">100 %</tspan></text><rect x="590" y="286" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">100 %</tspan></text><rect x="10" y="336" width="890" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">Los primeros diez casos rinden mucho y los últimos arcos cuestan miles: los caminos raros (el cupón de envío gratis</tspan></text><text x="455" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">fuera de zona, el piso en cero) casi no aparecen al azar. Hay que ir a buscarlos. Tras el paso 2, la función de 15 de</tspan></text><text x="455" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">complejidad queda en seis funciones, la mayor con 4.</tspan></text><text x="455" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
