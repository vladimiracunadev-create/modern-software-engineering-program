<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 351" width="1050" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutantes de la función refactorizada que mata un maestro dorado según su tamaño (media de 30 muestras)</title><desc id="d">Barras: un maestro dorado con 10 entradas registradas al azar mata en promedio el 81,6 por ciento de los 39 mutantes de la función refactorizada, con 50 el 92,9, con 200 el 96,8, con 1000 el 99,4 y con 3000 los mata todos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="351" fill="#ffffff"/><text x="260" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">10 entradas registradas</tspan></text><rect x="270" y="16" width="408" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="686" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="686" dy="0">31,8 de 39 (81,6 %)</tspan></text><text x="260" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">50 entradas</tspan></text><rect x="270" y="60" width="464.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="742.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="742.5" dy="0">36,2 de 39 (92,9 %)</tspan></text><text x="260" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">200 entradas</tspan></text><rect x="270" y="104" width="484" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="762" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="762" dy="0">37,7 de 39 (96,8 %)</tspan></text><text x="260" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">1000 entradas</tspan></text><rect x="270" y="148" width="497" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="775" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="775" dy="0">38,8 de 39 (99,4 %)</tspan></text><text x="260" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">3000 entradas</tspan></text><rect x="270" y="192" width="500" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="778" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="778" dy="0">39 de 39 (100 %)</tspan></text><rect x="10" y="240" width="1030" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">El mínimo con 10 entradas fue 27 de 39 y con 200 fue 36: la variación entre muestras importa tanto como la media. Con 200 entradas aún</tspan></text><text x="525" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">sobreviven en promedio 1,3 mutantes. Los mutantes son cambios automáticos y el dominio de entradas es pequeño; con un dominio grande la</tspan></text><text x="525" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">curva sube mucho más despacio.</tspan></text><text x="525" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
