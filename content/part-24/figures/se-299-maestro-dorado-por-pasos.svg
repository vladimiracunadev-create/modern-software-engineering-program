<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 371" width="920" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Entradas del maestro dorado (3000) cuyo resultado cambia en cada paso del refactor</title><desc id="d">Tabla: al contrastar con 3000 entradas registradas de una función heredada, extraer funciones no cambia ningún resultado en los pasos 1 y 2; simplificar una comparación con True cambia 142 resultados cuando el parámetro llega como 2 o como una cadena; sustituir el redondeo histórico por round cambia 257 resultados, 106 de ellos con parámetros booleanos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="371" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Paso</tspan></text><rect x="570" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Entradas que difieren</tspan></text><rect x="10" y="56" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">1. Extraer zona y peso</tspan></text><rect x="570" y="56" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">0</tspan></text><rect x="10" y="106" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">2. Extraer opciones, cupón y redondeo</tspan></text><rect x="570" y="106" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">0</tspan></text><rect x="10" y="156" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">3. Simplificar «urgente == True» a «if urgente»</tspan></text><rect x="570" y="156" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">142 (urgente = 2 o «si»)</tspan></text><rect x="10" y="206" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">4. Cambiar el redondeo histórico por round()</tspan></text><rect x="570" y="206" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">257 (106 con urgente booleano)</tspan></text><rect x="10" y="260" width="900" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Los dos pasos que parecían simplificaciones cambiaron comportamiento: el primero con entradas que la función aceptaba</tspan></text><text x="460" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">sin documentar, el segundo con la diferencia entre sumar 0,5 y redondear al par. Hay que decidir caso por caso si el</tspan></text><text x="460" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">comportamiento se conserva o se corrige. Entradas sintéticas con semilla fija.</tspan></text><text x="460" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
