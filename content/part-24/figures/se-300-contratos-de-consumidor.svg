<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 379" width="980" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cambios de una respuesta de 12 campos que rompen a algún consumidor: quién los detecta</title><desc id="d">Barras horizontales con las roturas detectadas de 23 que rompen a algún consumidor entre 54 cambios probados: la suite del proveedor, que comprueba cuatro campos de doce, detecta 9 y deja pasar 14; las pruebas de contrato de los ocho consumidores detectan las 23.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="379" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cambios de una respuesta de 12 campos que rompen a algún consumidor: quién los detecta</tspan></text><line x1="354" y1="49" x2="354" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="181" x2="354" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="471.176" y1="49" x2="471.176" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="471.176" y1="181" x2="471.176" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="471.176" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="471.176" dy="0">5</tspan></text><line x1="588.352" y1="49" x2="588.352" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="588.352" y1="181" x2="588.352" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="588.352" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="588.352" dy="0">10</tspan></text><line x1="705.528" y1="49" x2="705.528" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="705.528" y1="181" x2="705.528" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="705.528" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.528" dy="0">15</tspan></text><line x1="822.704" y1="49" x2="822.704" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="822.704" y1="181" x2="822.704" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="822.704" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822.704" dy="0">20</tspan></text><line x1="939.88" y1="49" x2="939.88" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="939.88" y1="181" x2="939.88" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="939.88" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="939.88" dy="0">25</tspan></text><line x1="354" y1="181" x2="939.88" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Rompen a algún consumidor</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Las detecta la suite del proveedor (4 de 12</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">campos)</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Las detectan los contratos de los 8</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">consumidores</tspan></text><rect x="354" y="55" width="539.01" height="32" rx="3" fill="#087f8c"/><text x="900.01" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="900.01" dy="0">23</tspan></text><rect x="354" y="99" width="210.917" height="32" rx="3" fill="#087f8c"/><text x="571.917" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="571.917" dy="0">9</tspan></text><rect x="354" y="143" width="539.01" height="32" rx="3" fill="#087f8c"/><text x="900.01" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="900.01" dy="0">23</tspan></text><text x="646.94" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="646.94" dy="0">Cambios que rompen a un consumidor</tspan></text><rect x="10" y="239" width="960" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Los que no ve el proveedor son 14 de 23. El contrato dirigido por el consumidor acierta porque cada consumidor declara lo que</tspan></text><text x="490" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">lee: añadir un campo no alarma y quitar uno que nadie usa tampoco; un esquema exacto, en cambio, da 36 alarmas, 16 de ellas sin</tspan></text><text x="490" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">consumidor afectado. Los diez campos que algún consumidor lee son los que pesan. Ocho consumidores sintéticos que leen entre 2 y</tspan></text><text x="490" y="313.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">4 campos con semilla fija; la detección de contratos es 100 % por construcción del modelo.</tspan></text><text x="490" y="361.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
