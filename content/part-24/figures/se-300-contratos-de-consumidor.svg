<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 519" width="930" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cambios de una respuesta de 12 campos: quién los detecta</title><desc id="d">Tabla: de 54 cambios probados sobre una respuesta con doce campos, 23 rompen a algún consumidor; la suite del proveedor, que comprueba cuatro campos, detecta 9; las pruebas de contrato de los ocho consumidores detectan los 23; un esquema exacto da 36 alarmas, 16 de ellas sin ningún consumidor afectado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="519" fill="#ffffff"/><rect x="10" y="12" width="604" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="312" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="312" dy="0">Medida</tspan></text><rect x="620" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Resultado</tspan></text><rect x="10" y="56" width="604" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">Cambios probados (5 tipos × campos)</tspan></text><rect x="620" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">54</tspan></text><rect x="10" y="114" width="604" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">Rompen a algún consumidor</tspan></text><rect x="620" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">23</tspan></text><rect x="10" y="172" width="604" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">Los detecta la suite del proveedor (comprueba 4 campos de 12)</tspan></text><rect x="620" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">9 de 23</tspan></text><rect x="10" y="230" width="604" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">Los detectan las pruebas de contrato de los 8 consumidores</tspan></text><rect x="620" y="230" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">23 de 23</tspan></text><rect x="10" y="288" width="604" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">Los que no ve el proveedor</tspan></text><rect x="620" y="288" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">14 de 23</tspan></text><rect x="10" y="346" width="604" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="375.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">Alarmas de un esquema exacto (campos añadidos, quitados o renombrados)</tspan></text><rect x="620" y="346" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="367.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">36, de ellas 16 sin consumidor</tspan></text><text x="767" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">afectado</tspan></text><rect x="10" y="408" width="910" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">El contrato dirigido por el consumidor acierta porque cada consumidor declara lo que lee: añadir un campo no alarma y</tspan></text><text x="465" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">quitar uno que nadie usa tampoco. Los diez campos que algún consumidor lee son los que pesan. Ocho consumidores sintéticos</tspan></text><text x="465" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">que leen entre 2 y 4 campos con semilla fija; la detección de contratos es 100 % por construcción del modelo.</tspan></text><text x="465" y="505.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
