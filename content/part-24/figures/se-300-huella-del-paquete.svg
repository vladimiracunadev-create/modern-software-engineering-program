<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 469" width="940" height="469" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Huella SHA-256 del paquete: cambios que la alteran con y sin canonicalizar antes</title><desc id="d">Mapa de calor con los ficheros, de 3, cuya huella SHA-256 cambia según la alteración y el método: sobre los bytes cambia en 3 de 3 con un cambio de saltos de línea, espacios finales o salto final y en 1 de 3 al reordenar claves de un JSON; tras canonicalizar no cambia en ninguno, y el cambio de una cifra altera la huella en 3 de 3 en ambos métodos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="469" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Huella SHA-256 del paquete: cambios que la alteran con y sin canonicalizar antes</tspan></text><text x="608" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="608" dy="0">Ficheros con la huella alterada (de 3)</tspan></text><text x="452" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="452" dy="0">Huella sobre los bytes</tspan></text><text x="764" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="764" dy="0">Huella tras canonicalizar</tspan></text><text x="286" y="119.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Cambiar de LF a CRLF</tspan></text><text x="286" y="153" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Añadir espacios al final de una</tspan></text><text x="286" y="170" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">línea</tspan></text><text x="286" y="203.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Quitar el salto de línea final</tspan></text><text x="286" y="245.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Reordenar las claves de un JSON</tspan></text><text x="286" y="287.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Cambiar una cifra del contenido</tspan></text><rect x="297.5" y="95.5" width="309" height="39" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="452" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">3 de 3</tspan></text><rect x="609.5" y="95.5" width="309" height="39" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="764" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="764" dy="0">0 de 3</tspan></text><rect x="297.5" y="137.5" width="309" height="39" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="452" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">3 de 3</tspan></text><rect x="609.5" y="137.5" width="309" height="39" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="764" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="764" dy="0">0 de 3</tspan></text><rect x="297.5" y="179.5" width="309" height="39" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="452" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">3 de 3</tspan></text><rect x="609.5" y="179.5" width="309" height="39" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="764" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="764" dy="0">0 de 3</tspan></text><rect x="297.5" y="221.5" width="309" height="39" rx="4" fill="#e7aea4" stroke="#ffffff" stroke-width="1"/><text x="452" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="452" dy="0">1 de 3</tspan></text><rect x="609.5" y="221.5" width="309" height="39" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="764" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="764" dy="0">0 de 3</tspan></text><rect x="297.5" y="263.5" width="309" height="39" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="452" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">3 de 3</tspan></text><rect x="609.5" y="263.5" width="309" height="39" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="764" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="764" dy="0">3 de 3</tspan></text><text x="20" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 199)">Cambio sobre tres ficheros</text><text x="296" y="330" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="296" dy="0">0 de 3</tspan></text><rect x="349.24" y="318" width="30.5" height="14" fill="#fbe4de"/><rect x="379.24" y="318" width="30.5" height="14" fill="#f3cdc5"/><rect x="409.24" y="318" width="30.5" height="14" fill="#eab6ac"/><rect x="439.24" y="318" width="30.5" height="14" fill="#e29f93"/><rect x="469.24" y="318" width="30.5" height="14" fill="#d9887a"/><rect x="499.24" y="318" width="30.5" height="14" fill="#d17161"/><rect x="529.24" y="318" width="30.5" height="14" fill="#c85a48"/><rect x="559.24" y="318" width="30.5" height="14" fill="#c0432f"/><text x="597.24" y="330" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="597.24" dy="0">3 de 3</tspan></text><text x="650.48" y="330" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="650.48" dy="0">más oscuro = mayor (ficheros alterados)</tspan></text><rect x="10" y="346" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="370.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una huella sobre bytes crudos avisa de cambios que no importan (saltos de línea de Windows frente a Linux) y esa alarma</tspan></text><text x="470" y="387.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">constante enseña a ignorarla. Canonicalizar conserva la alarma para el cambio de contenido. Lo que ninguna huella dice es</tspan></text><text x="470" y="404.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">si el contenido es correcto: solo si cambió.</tspan></text><text x="470" y="451.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
