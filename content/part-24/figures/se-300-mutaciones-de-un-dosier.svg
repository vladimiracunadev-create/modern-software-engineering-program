<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 582" width="940" height="582" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de forma de un dosier: mutaciones detectadas de 25 por tipo</title><desc id="d">Barras horizontales con las mutaciones detectadas, de 25, por un validador de forma: detecta 25 de 25 al borrar o vaciar una sección, cambiar una cifra en la sección de experimentos o quitar el enlace de las fuentes, y 0 de 25 al cambiar una cifra en la afirmación, invertir la conclusión, enlazar una página inexistente o sustituir un límite concreto por uno genérico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="582" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Validador de forma de un dosier: mutaciones detectadas de 25 por tipo</tspan></text><line x1="364" y1="49" x2="364" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="364" y1="401" x2="364" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="364" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364" dy="0">0</tspan></text><line x1="471.176" y1="49" x2="471.176" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="471.176" y1="401" x2="471.176" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="471.176" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="471.176" dy="0">5</tspan></text><line x1="578.352" y1="49" x2="578.352" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="578.352" y1="401" x2="578.352" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="578.352" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="578.352" dy="0">10</tspan></text><line x1="685.528" y1="49" x2="685.528" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="685.528" y1="401" x2="685.528" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="685.528" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685.528" dy="0">15</tspan></text><line x1="792.704" y1="49" x2="792.704" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="792.704" y1="401" x2="792.704" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="792.704" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792.704" dy="0">20</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="401" x2="899.88" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">25</tspan></text><line x1="364" y1="401" x2="899.88" y2="401" stroke="#5b7280" stroke-width="1.6"/><text x="354" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Borrar una sección</tspan></text><text x="354" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Vaciar una sección</tspan></text><text x="354" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Cambiar una cifra en la sección de</tspan></text><text x="354" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">experimentos</tspan></text><text x="354" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Quitar el enlace de las fuentes</tspan></text><text x="354" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Cambiar una cifra en la afirmación</tspan></text><text x="354" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Invertir la conclusión</tspan></text><text x="354" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Enlazar una página inexistente</tspan></text><text x="354" y="383.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Sustituir un límite concreto por uno genérico</tspan></text><rect x="364" y="55" width="535.88" height="32" rx="3" fill="#087f8c"/><text x="906.88" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">25</tspan></text><rect x="364" y="99" width="535.88" height="32" rx="3" fill="#087f8c"/><text x="906.88" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">25</tspan></text><rect x="364" y="143" width="535.88" height="32" rx="3" fill="#087f8c"/><text x="906.88" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">25</tspan></text><rect x="364" y="187" width="535.88" height="32" rx="3" fill="#087f8c"/><text x="906.88" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">25</tspan></text><rect x="364" y="231" width="2" height="32" rx="3" fill="#087f8c"/><text x="373" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="373" dy="0">0</tspan></text><rect x="364" y="275" width="2" height="32" rx="3" fill="#087f8c"/><text x="373" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="373" dy="0">0</tspan></text><rect x="364" y="319" width="2" height="32" rx="3" fill="#087f8c"/><text x="373" y="339.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="373" dy="0">0</tspan></text><rect x="364" y="363" width="2" height="32" rx="3" fill="#087f8c"/><text x="373" y="383.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="373" dy="0">0</tspan></text><text x="631.94" y="445" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="631.94" dy="0">Mutaciones detectadas (de 25)</tspan></text><rect x="10" y="459" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="483.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El validador ve la forma y las cifras que alguien le pidió cruzar; no ve el sentido. Las cuatro mutaciones que se le</tspan></text><text x="470" y="500.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">escapan son las que más dañan a un lector. Por eso el dosier necesita una revisión de contenido hecha por una persona, y el</tspan></text><text x="470" y="517.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">validador solo evita lo mecánico.</tspan></text><text x="470" y="564.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
