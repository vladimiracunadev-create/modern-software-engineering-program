<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 307" width="960" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Candidatos no dominados entre 300 al azar según cuántos atributos se comparan</title><desc id="d">Barras: de 300 arquitecturas candidatas al azar, quedan 6 sin dominar al comparar dos atributos, 24 con tres, 105 con cinco y 215 con ocho; con tres atributos del caso, latencia, costo y complejidad, solo 13 de 300 son no dominadas y 4 cumplen además las restricciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="307" fill="#ffffff"/><text x="160" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="160" dy="0">2 atributos</tspan></text><rect x="170" y="16" width="12" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="190" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="190" dy="0">6 de 300</tspan></text><text x="160" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="160" dy="0">3 atributos</tspan></text><rect x="170" y="60" width="48" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="226" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="226" dy="0">24 de 300</tspan></text><text x="160" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="160" dy="0">5 atributos</tspan></text><rect x="170" y="104" width="210" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="388" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="388" dy="0">105 de 300</tspan></text><text x="160" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="160" dy="0">8 atributos</tspan></text><rect x="170" y="148" width="430" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="608" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="608" dy="0">215 de 300</tspan></text><rect x="10" y="196" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Cuantos más atributos se comparan, menos candidatos se pueden descartar por ser peores en todo y más decisiones dependen de</tspan></text><text x="480" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">pesos. Con latencia, costo y complejidad hay 13 candidatos no dominados; solo 4 cumplen además latencia ≤ 200 ms, costo ≤ 8 y</tspan></text><text x="480" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">complejidad ≤ 5. Las restricciones, no los pesos, hicieron la mayor parte del filtro. Candidatos y valores son sintéticos.</tspan></text><text x="480" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
