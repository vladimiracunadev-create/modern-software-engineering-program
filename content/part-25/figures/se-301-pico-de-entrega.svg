 font-weight="700" fill="#142231"><tspan x="102" dy="0">8</tspan></text><rect x="200" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">0,102 s</tspan></text><rect x="390" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">0,230 s</tspan></text><rect x="580" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">0,325 s</tspan></text><rect x="770" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0 %</tspan></text><rect x="10" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">16</tspan></text><rect x="200" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">0,100 s</tspan></text><rect x="390" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">0,227 s</tspan></text><rect x="580" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">0,322 s</tspan></text><rect x="770" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0 %</tspan></text><rect x="10" y="290" width="950" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">El umbral no es gradual: con 4 trabajadores la capacidad (unas 35 peticiones por segundo) queda por debajo de la llegada del</tspan></text><text x="485" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">pico (40) y la cola crece hasta el final de la ráfaga; con 5 o más el sistema se comporta como si no hubiera pico. Un escenario</tspan></text><text x="485" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">de calidad que diga «p95 de 2 s a 40 rps» detecta el umbral; «debe ser rápido» no.</tspan></text><text x="485" y="387.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
