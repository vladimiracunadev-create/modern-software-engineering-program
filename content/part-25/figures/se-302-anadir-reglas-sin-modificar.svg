<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Complejidad de la función de descuento al añadir reglas: cadena if/elif frente a registro</title><desc id="d">Líneas con la complejidad ciclomática según la regla de descuento añadida: en la cadena if elif sube de 3 con la segunda regla a 6 con la quinta porque cada regla modifica la función; en el registro de reglas se queda en 2 y ninguna función existente se modifica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Complejidad de la función de descuento al añadir reglas: cadena if/elif frente a registro</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cadena if/elif (modifica la función, +2 líneas)</tspan></text><rect x="418.38" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="438.38" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="438.38" dy="0">Registro de reglas (no modifica, +4 líneas)</tspan></text><line x1="63.54" y1="347" x2="910" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="347" x2="63.54" y2="347" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="351.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="282" x2="910" y2="282" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="282" x2="63.54" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="286.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="217" x2="910" y2="217" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="217" x2="63.54" y2="217" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="152" x2="910" y2="152" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="152" x2="63.54" y2="152" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="156.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="87" x2="63.54" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">8</tspan></text><line x1="63.54" y1="87" x2="63.54" y2="347" stroke="#5b7280" stroke-width="1.6"/><line x1="81.54" y1="87" x2="81.54" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="81.54" y1="347" x2="81.54" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="81.54" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81.54" dy="0">2.ª</tspan></text><line x1="351.693" y1="87" x2="351.693" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="351.693" y1="347" x2="351.693" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="351.693" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="351.693" dy="0">3.ª</tspan></text><line x1="621.847" y1="87" x2="621.847" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="621.847" y1="347" x2="621.847" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="621.847" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="621.847" dy="0">4.ª</tspan></text><line x1="892" y1="87" x2="892" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="347" x2="892" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">5.ª</tspan></text><line x1="63.54" y1="347" x2="910" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="217" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 217)">Complejidad de la función de descuento</text><text x="486.77" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="486.77" dy="0">Regla de descuento añadida</tspan></text><polyline points="81.54,249.5 351.693,217 621.847,184.5 892,152" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="81.54" cy="249.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="81.54" y="238.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="81.54" dy="0">3</tspan></text><circle cx="351.693" cy="217" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="351.693" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="351.693" dy="0">4</tspan></text><circle cx="621.847" cy="184.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="621.847" y="173.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="621.847" dy="0">5</tspan></text><circle cx="892" cy="152" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="141" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">6</tspan></text><polyline points="81.54,282 351.693,282 621.847,282 892,282" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="76.04" y="276.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="81.54" y="271" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="81.54" dy="0">2</tspan></text><rect x="346.193" y="276.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="351.693" y="271" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="351.693" dy="0">2</tspan></text><rect x="616.347" y="276.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="621.847" y="271" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="621.847" dy="0">2</tspan></text><rect x="886.5" y="276.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="271" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">2</tspan></text><rect x="10" y="407" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Abierto/cerrado se ve como funciones existentes que no cambian: en la cadena, cada regla nueva reabre la función que todas</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">las pruebas atraviesan; en el registro, no. El registro escribe más líneas por regla (cuatro frente a dos). Cuesta además</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">dos decisiones nuevas: el orden y cómo se combinan reglas simultáneas (aquí, el máximo).</tspan></text><text x="470" y="512.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
