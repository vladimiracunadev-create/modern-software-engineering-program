<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 434" width="980" height="434" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Interfaces anchas y estructura innecesaria: qué baja y qué sube al segregar y abstraer</title><desc id="d">Gráfico de mancuernas en escala logarítmica: segregar la interfaz baja los clientes que revisan un cambio de 8 a 5 y los métodos de un doble de prueba de 12 a 7,5; abstraer la misma regla de redondeo y tope sube los nodos del árbol sintáctico de 17 a 126 y las líneas de 2 a 17.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="434" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Interfaces anchas y estructura innecesaria: qué baja y qué sube al segregar y abstraer</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Interfaz ancha / función simple</tspan></text><circle cx="303.74" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="317.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="317.74" dy="0">Roles / estrategias y fábrica</tspan></text><line x1="366.18" y1="77" x2="366.18" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="366.18" y1="253" x2="366.18" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="366.18" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="366.18" dy="0">1</tspan></text><line x1="533.313" y1="77" x2="533.313" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="533.313" y1="253" x2="533.313" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="533.313" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="533.313" dy="0">10</tspan></text><line x1="700.447" y1="77" x2="700.447" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="700.447" y1="253" x2="700.447" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="700.447" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700.447" dy="0">100</tspan></text><line x1="867.58" y1="77" x2="867.58" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="867.58" y1="253" x2="867.58" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="867.58" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.58" dy="0">1 000</tspan></text><line x1="366.18" y1="253" x2="867.58" y2="253" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Clientes que revisan un cambio (de 8)</tspan></text><text x="314" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Métodos de un doble de prueba</tspan></text><text x="314" y="183" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Nodos del árbol sintáctico de la misma</tspan></text><text x="314" y="200" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">regla</tspan></text><text x="314" y="235.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Líneas de la misma regla</tspan></text><line x1="517.116" y1="99" x2="483.001" y2="99" stroke="#087f8c" stroke-width="4"/><circle cx="517.116" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="483.001" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="529.116" y="103.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="529.116" dy="0">8</tspan></text><text x="471.001" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="471.001" dy="0">5</tspan></text><text x="966" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="966" dy="0">×0,6</tspan></text><line x1="546.547" y1="143" x2="512.432" y2="143" stroke="#087f8c" stroke-width="4"/><circle cx="546.547" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="512.432" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="558.547" y="147.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="558.547" dy="0">12</tspan></text><text x="500.432" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500.432" dy="0">7,5</tspan></text><text x="966" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="966" dy="0">×0,6</tspan></text><line x1="571.829" y1="187" x2="717.222" y2="187" stroke="#c0432f" stroke-width="4"/><circle cx="571.829" cy="187" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="717.222" cy="187" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="559.829" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="559.829" dy="0">17</tspan></text><text x="729.222" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="729.222" dy="0">126</tspan></text><text x="966" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="966" dy="0">×7,4</tspan></text><line x1="416.492" y1="231" x2="571.829" y2="231" stroke="#c0432f" stroke-width="4"/><circle cx="416.492" cy="231" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="571.829" cy="231" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="404.492" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="404.492" dy="0">2</tspan></text><text x="583.829" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="583.829" dy="0">17</tspan></text><text x="966" y="235.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="966" dy="0">×8,5</tspan></text><text x="616.88" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="616.88" dy="0">Cantidad (escala logarítmica)</tspan></text><rect x="10" y="311" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Segregar interfaces reduce la dependencia nominal, no la real: de ocho clientes solo 1,75 usan de verdad el método que cambia, y</tspan></text><text x="490" y="352.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">aun con roles cinco revisan el cambio. Y la abstracción tiene precio de lectura: 7 veces más nodos para la misma regla. Sin un</tspan></text><text x="490" y="369.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">segundo uso, esa estructura no compra nada. Ocho clientes sintéticos con semilla fija.</tspan></text><text x="490" y="416.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
