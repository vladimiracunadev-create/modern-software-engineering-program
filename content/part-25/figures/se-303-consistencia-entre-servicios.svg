<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Operación que cruza tres servicios: estados inconsistentes con y sin compensación</title><desc id="d">Barras agrupadas con el porcentaje de operaciones que quedan inconsistentes según la tasa de fallo por llamada: sin compensación 0,22, 1,98 y 9,27 por ciento con fallos de 0,1, 1 y 5 por ciento; con una compensación que falla el 5 por ciento de las veces quedan 0,02, 0,14 y 0,69 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Operación que cruza tres servicios: estados inconsistentes con y sin compensación</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin compensación</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Con compensación (5 % de fallo)</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="319" x2="71.08" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">2</tspan></text><line x1="71.08" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="263" x2="71.08" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">4</tspan></text><line x1="71.08" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="207" x2="71.08" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">6</tspan></text><line x1="71.08" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="151" x2="71.08" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">8</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Operaciones inconsistentes (%)</text><rect x="99.3773" y="368.84" width="111.189" height="6.16" rx="3" fill="#c0432f"/><text x="154.972" y="362.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.972" dy="0">0,22</tspan></text><rect x="214.567" y="373" width="111.189" height="2" rx="3" fill="#087f8c"/><text x="270.161" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.161" dy="0">0,02</tspan></text><text x="212.567" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Fallo de 0,1 % por llamada</tspan></text><rect x="382.351" y="319.56" width="111.189" height="55.44" rx="3" fill="#c0432f"/><text x="437.945" y="313.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.945" dy="0">1,98</tspan></text><rect x="497.54" y="371.08" width="111.189" height="3.92" rx="3" fill="#087f8c"/><text x="553.135" y="365.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.135" dy="0">0,14</tspan></text><text x="495.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Fallo de 1 % por llamada</tspan></text><rect x="665.324" y="115.44" width="111.189" height="259.56" rx="3" fill="#c0432f"/><text x="720.919" y="109.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.919" dy="0">9,27</tspan></text><rect x="780.513" y="355.68" width="111.189" height="19.32" rx="3" fill="#087f8c"/><text x="836.108" y="349.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.108" dy="0">0,69</tspan></text><text x="778.513" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Fallo de 5 % por llamada</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una transacción local en el monolito deja 0 filas tras un fallo (se comprobó con SQLite). Entre servicios, la consistencia</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">se compra con compensaciones, que también pueden fallar: no desaparece el estado intermedio, se reduce y se vuelve</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">observable. 200 000 operaciones por celda; fallos independientes por supuesto.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
