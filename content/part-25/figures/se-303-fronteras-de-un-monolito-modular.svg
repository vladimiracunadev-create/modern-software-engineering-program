<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un comprobador de fronteras de un monolito modular (análisis estático con ast)</title><desc id="d">Barras: de 30 importaciones inyectadas en un proyecto sintético de seis módulos, 4 eran permitidas y 26 violaban la frontera; el análisis estático detecta 16 sin falsos positivos y no ve las 10 que usan importación dinámica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="307" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Inyectadas</tspan></text><rect x="340" y="16" width="330" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="678" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="678" dy="0">30 (4 permitidas)</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Violaciones reales</tspan></text><rect x="340" y="60" width="286" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="634" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="634" dy="0">26</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Detectadas por el análisis estático</tspan></text><rect x="340" y="104" width="176" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="524" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="524" dy="0">16 (0 falsos positivos)</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Importaciones dinámicas no vistas</tspan></text><rect x="340" y="148" width="110" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="458" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="458" dy="0">10</tspan></text><rect x="10" y="196" width="980" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">El comprobador lee los nodos de importación y detecta 16 de las 26 violaciones sin marcar ninguna de las permitidas; las 10 con</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">`__import__` o `importlib` quedan fuera. Una regla de frontera comprobable es necesaria pero no suficiente: hace falta una segunda</tspan></text><text x="500" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">regla (prohibir la importación dinámica entre módulos) o una prueba en tiempo de ejecución.</tspan></text><text x="500" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
