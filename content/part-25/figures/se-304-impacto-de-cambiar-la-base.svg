<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 309" width="1080" height="309" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Módulos que dependen de la base de datos (40 módulos: 15 de dominio, 10 de aplicación, 8 web, 7 de infraestructura)</title><desc id="d">Tabla: al cambiar la base de datos, en una estructura por capas 17 de 40 módulos dependen de ella, entre ellos 3 de dominio y 6 de aplicación, y hay 30 dependencias del dominio hacia la infraestructura; en la estructura hexagonal dependen 2 módulos, ninguno de dominio, y hay 0 dependencias del dominio hacia la infraestructura.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="309" fill="#ffffff"/><rect x="10" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Estructura</tspan></text><rect x="240" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="297" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="297" dy="0">Aristas</tspan></text><rect x="360" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Dependientes de la BD</tspan></text><rect x="620" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">De ellos de dominio</tspan></text><rect x="840" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="952" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="952" dy="0">Dependencias dominio →</tspan></text><text x="952" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="952" dy="0">infra</tspan></text><rect x="10" y="56" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Capas clásicas</tspan></text><rect x="240" y="56" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">94</tspan></text><rect x="360" y="56" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">17</tspan></text><rect x="620" y="56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">3</tspan></text><rect x="840" y="56" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="952" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="952" dy="0">30</tspan></text><rect x="10" y="102" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Capas con fugas</tspan></text><rect x="240" y="102" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">102</tspan></text><rect x="360" y="102" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">17</tspan></text><rect x="620" y="102" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">3</tspan></text><rect x="840" y="102" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="952" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="952" dy="0">30</tspan></text><rect x="10" y="148" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Hexagonal</tspan></text><rect x="240" y="148" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">86</tspan></text><rect x="360" y="148" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">2</tspan></text><rect x="620" y="148" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0</tspan></text><rect x="840" y="148" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="952" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="952" dy="0">0</tspan></text><rect x="10" y="198" width="1060" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="540" y="222.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="540" dy="0">La dirección de la dependencia, no el número de capas, decide cuánto arrastra un cambio: invertirla en el borde (infraestructura → puerto del</tspan></text><text x="540" y="239.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="540" dy="0">dominio) reduce los dependientes de 17 a 2. Los grafos son sintéticos con semilla fija y miden estructura, no esfuerzo. Aun así «hexagonal» no</tspan></text><text x="540" y="256.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="540" dy="0">garantiza nada si los adaptadores filtran tipos de la base al dominio.</tspan></text><text x="540" y="295.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
