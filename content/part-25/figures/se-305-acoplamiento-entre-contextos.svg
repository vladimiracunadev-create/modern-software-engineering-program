<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 219" width="1000" height="219" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que un cambio de un atributo afecte a código de otro equipo</title><desc id="d">Barras: con un único modelo compartido de 14 atributos, el 56,8 por ciento de los cambios de un atributo afecta a código de otro de los tres equipos; con tres contextos y tres atributos de contrato compartidos baja al 20,2 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="219" fill="#ffffff"/><text x="380" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Un único modelo de 14 atributos</tspan></text><rect x="390" y="16" width="454.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="852.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="852.4" dy="0">56,8 %</tspan></text><text x="380" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Tres contextos con 3 atributos de contrato</tspan></text><rect x="390" y="60" width="161.6" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="559.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="559.6" dy="0">20,2 %</tspan></text><rect x="10" y="108" width="980" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">Fronteras explícitas no eliminan el acoplamiento: lo concentran en el contrato (3 atributos). Las lecturas de cada equipo (5 a 9</tspan></text><text x="500" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">atributos en el modelo único; 3 a 5 propios más el contrato) son supuestos del autor sobre 20 000 modelos al azar. El resultado</tspan></text><text x="500" y="166.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">depende de que el contrato sea pequeño y estable.</tspan></text><text x="500" y="205.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
