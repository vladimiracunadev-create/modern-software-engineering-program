<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 519" width="900" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Impurezas detectadas, de 8, según el nivel de la prueba</title><desc id="d">Barras con las impurezas que detecta cada nivel de prueba sobre ocho funciones impuras: un ejemplo no detecta ninguna, repetir la llamada y comprobar la entrada y la salida detecta cuatro, y perturbar además el estado global detecta siete; ninguna de las cuatro funciones puras dio falsa alarma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="519" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Impurezas detectadas, de 8, según el nivel de la prueba</tspan></text><line x1="63.54" y1="327" x2="880" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="327" x2="63.54" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="262" x2="880" y2="262" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="262" x2="63.54" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="266.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="197" x2="880" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="197" x2="63.54" y2="197" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="201.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="132" x2="880" y2="132" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="132" x2="63.54" y2="132" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="136.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="67" x2="880" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="67" x2="63.54" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">8</tspan></text><line x1="63.54" y1="67" x2="63.54" y2="327" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 197)">Impurezas detectadas (de 8)</text><rect x="90.7553" y="325" width="217.723" height="2" rx="3" fill="#087f8c"/><text x="199.617" y="319" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="199.617" dy="0">0</tspan></text><text x="199.617" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="199.617" dy="0">Un ejemplo</tspan></text><rect x="362.909" y="197" width="217.723" height="130" rx="3" fill="#087f8c"/><text x="471.77" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="471.77" dy="0">4</tspan></text><text x="471.77" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="471.77" dy="0">Repetir y comprobar</tspan></text><rect x="635.062" y="99.5" width="217.723" height="227.5" rx="3" fill="#087f8c"/><text x="743.923" y="93.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="743.923" dy="0">7</tspan></text><text x="743.923" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="743.923" dy="0">Y perturbar lo global</tspan></text><line x1="63.54" y1="67" x2="880" y2="67" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="876" y="61" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="876" dy="0">8 funciones impuras</tspan></text><rect x="10" y="379" width="880" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Una función con un solo ejemplo correcto no demuestra pureza. La que devuelve una referencia a su estado interno pasa</tspan></text><text x="450" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">los tres niveles: se descubre solo cuando alguien muta el valor devuelto. Las que no se ven sin perturbar lo global</tspan></text><text x="450" y="437.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">son la lectura de configuración, la del reloj y la escritura de un total global. Doce funciones escritas por el autor,</tspan></text><text x="450" y="453.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">cuatro puras sin falsas alarmas; el detector es una construcción simple.</tspan></text><text x="450" y="501.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
