<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 321" width="960" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intercalaciones en las que se acepta más de un reenvío cuando el agregado admitía uno</title><desc id="d">Tabla: con dos comandos concurrentes de reenvío de una entrega, 4 de las 6 intercalaciones posibles aceptan dos reenvíos cuando solo cabía uno; con tres comandos son 72 de 90 y con cuatro 2160 de 2520; con comprobación de versión del agregado ninguna lo permite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="321" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Comandos concurrentes</tspan></text><rect x="260" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">Intercalaciones</tspan></text><rect x="480" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">Violan el invariante sin control</tspan></text><rect x="760" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Violan con versión</tspan></text><rect x="10" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">2</tspan></text><rect x="260" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">6</tspan></text><rect x="480" y="56" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">4</tspan></text><rect x="760" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0</tspan></text><rect x="10" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">3</tspan></text><rect x="260" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">90</tspan></text><rect x="480" y="106" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">72</tspan></text><rect x="760" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0</tspan></text><rect x="10" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">4</tspan></text><rect x="260" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">2 520</tspan></text><rect x="480" y="156" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">2 160</tspan></text><rect x="760" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0</tspan></text><rect x="10" y="210" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Leer, validar y escribir sin condición permite que dos comandos validen contra el mismo estado. Comparar la versión leída con</tspan></text><text x="480" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">la actual al escribir convierte la carrera en un rechazo reintentable. Se enumeraron todas las intercalaciones de pasos</tspan></text><text x="480" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">leer/escribir; no se usó una base de datos real, así que no se midió el coste de los reintentos.</tspan></text><text x="480" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
