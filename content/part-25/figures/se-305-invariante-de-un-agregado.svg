"200.567" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="775.417" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="775.417" dy="0">33 %</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="274" y="124" width="481.36" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="514.68" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="514.68" dy="0">80 %</tspan></text><rect x="755.36" y="124" width="120.34" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="815.53" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="815.53" dy="0">20 %</tspan></text><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="274" y="164" width="515.743" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="531.871" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="531.871" dy="0">86 %</tspan></text><rect x="789.743" y="164" width="85.9571" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="832.721" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832.721" dy="0">14 %</tspan></text><text x="882.7" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="574.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">% del total</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Leer, validar y escribir sin condición permite que dos comandos validen contra el mismo estado. Comparar la versión leída</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">con la actual al escribir convierte la carrera en un rechazo reintentable. Se enumeraron todas las intercalaciones de pasos</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">leer/escribir; no se usó una base de datos real, así que no se midió el coste de los reintentos.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
