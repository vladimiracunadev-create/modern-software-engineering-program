<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intercalaciones en las que se acepta más de un reenvío cuando el agregado admitía uno</title><desc id="d">Barras horizontales apiladas al 100 por ciento con las intercalaciones que violan el invariante sin control de versión: 4 de 6 con dos comandos concurrentes, 72 de 90 con tres y 2160 de 2520 con cuatro, una proporción que crece con los comandos; con comprobación de versión del agregado ninguna lo viola.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Intercalaciones en las que se acepta más de un reenvío cuando el agregado admitía uno</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aceptan más de un reenvío</tspan></text><rect x="252.5" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Respetan el invariante</tspan></text><line x1="274" y1="77" x2="274" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="197" x2="274" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="424.425" y1="77" x2="424.425" 