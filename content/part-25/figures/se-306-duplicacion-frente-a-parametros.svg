<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">120 cambios sobre dos usos parecidos: divergencias por olvido frente a ramas añadidas</title><desc id="d">Líneas según la fracción de cambios que afecta a ambos usos: las divergencias por olvido de dos copias bajan de 32,3 con el 90 por ciento a 3,6 con el 10 por ciento, mientras que las ramas que añade la función compartida suben de 12,0 a 108,0; las curvas se cruzan entre las fracciones 0,5 y 0,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">120 cambios sobre dos usos parecidos: divergencias por olvido frente a ramas añadidas</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Dos copias: divergencias por olvido</tspan></text><rect x="327.9" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="347.9" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="347.9" dy="0">Función compartida: ramas añadidas</tspan></text><line x1="78.62" y1="367" x2="910" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="367" x2="78.62" y2="367" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="371.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="320.333" x2="910" y2="320.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="320.333" x2="78.62" y2="320.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="324.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="273.667" x2="910" y2="273.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="273.667" x2="78.62" y2="273.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="278.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="227" x2="910" y2="227" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="227" x2="78.62" y2="227" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="231.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="180.333" x2="910" y2="180.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="180.333" x2="78.62" y2="180.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="184.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="133.667" x2="910" y2="133.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="133.667" x2="78.62" y2="133.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="138.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">120</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="367" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="367" stroke="#