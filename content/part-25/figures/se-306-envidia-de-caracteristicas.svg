<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" width="980" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Envidia de características en 8 métodos: accesos propios y ajenos frente al criterio del autor</title><desc id="d">Dispersión de ocho métodos según sus accesos propios y ajenos: los tres que el autor considera un problema tienen cero accesos propios y tres o más ajenos, y el detector los señala; el serializador también tiene cero propios y cuatro ajenos y es una falsa alarma; los otros cuatro métodos legítimos no se señalan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Envidia de características en 8 métodos: accesos propios y ajenos frente al criterio del autor</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Problema según el autor (señalado)</tspan></text><rect x="320.36" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="340.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="340.36" dy="0">Legítimo, señalado (falsa alarma)</tspan></text><polygon points="623.18,44.1 629.78,56.4 616.58,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="637.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="637.18" dy="0">Legítimo, no señalado</tspan></text><line x1="63.54" y1="387" x2="950" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="387" x2="63.54" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="344.143" x2="950" y2="344.143" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="344.143" x2="63.54" y2="344.143" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="348.643" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="301.286" x2="950" y2="301.286" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="301.286" x2="63.54" y2="301.286" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="305.786" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="258.429" x2="950" y2="258.429" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="258.429" x2="63.54" y2="258.429" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="262.929" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="215.571" x2="950" y2="215.571" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="215.571" x2="63.54" y2="215.571" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="220.071" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="172.714" x2="950" y2="172.714" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="172.714" x2="63.54" y2="172.714" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="177.214" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">5</tspan></text><line x1="63.54" y1="129.857" x2="950" y2="129.857" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="129.857" x2="6