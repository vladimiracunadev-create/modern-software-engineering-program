hor="middle" font-weight="400" fill="#142231"><tspan x="761.908" dy="0">3</tspan></text><line x1="932" y1="87" x2="932" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="932" y1="387" x2="932" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="932" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="932" dy="0">4</tspan></text><line x1="63.54" y1="387" x2="950" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Accesos a otro objeto</text><text x="506.77" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="506.77" dy="0">Accesos propios</tspan></text><line x1="63.54" y1="258.429" x2="950" y2="258.429" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="69.54" y="252.429" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="69.54" dy="0">umbral del detector: 3</tspan></text><circle cx="251.632" cy="129.857" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="261.632" y="134.357" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="261.632" dy="0">Recibo.texto</tspan></text><circle cx="251.632" cy="258.429" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="261.632" y="262.929" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="261.632" dy="0">Política.aplica</tspan></text><circle cx="234.623" cy="215.571" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="224.623" y="220.071" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="224.623" dy="0">Etiqueta.línea</tspan></text><rect x="263.141" y="210.071" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="278.641" y="220.071" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="278.641" dy="0">Serializador.a_dict</tspan></text><polygon points="761.908,294.961 767.958,306.236 755.858,306.236" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="771.908" y="305.786" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="771.908" dy="0">Visitante.visita_envio</tspan></text><polygon points="761.908,380.675 767.958,391.95 755.858,391.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="761.908" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="761.908" dy="0">Pedido.total</tspan></text><polygon points="421.724,337.818 427.774,349.093 415.674,349.093" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="431.724" y="348.643" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="431.724" dy="0">Calculadora.costo</tspan></text><polygon points="591.816,380.675 597.866,391.95 585.766,391.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="591.816" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="591.816" dy="0">Cuenta.saldo_neto</tspan></text><rect x="10" y="447" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Tres verdaderos positivos, una falsa alarma y cuatro verdaderos negativos: el serializador accede a los campos de otro objeto por</tspan></text><text x="490" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">oficio. Los dos métodos con 0 accesos propios y 4 ajenos se dibujan separados 0,1 a cada lado para que se vean. Que el método sea</tspan></text><text x="490" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">problema depende de si moverlo mejoraría el diseño: lo decide una persona con el contexto. Ocho métodos y etiquetas del autor.</tspan></text><text x="490" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
