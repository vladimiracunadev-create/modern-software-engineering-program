<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 371" width="970" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Eventos que hay que aplicar para reconstruir un agregado de 10 000 eventos (5000 consultas)</title><desc id="d">Tabla: reconstruir el estado de un agregado de 10000 eventos sin instantáneas aplica en media 5021 eventos y en el percentil 99 9893; con una instantánea cada 1000 baja a 507 y 991, cada 200 a 99 y 198 y cada 50 a 24 y 49, a costa de 10, 50 y 200 instantáneas almacenadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="371" fill="#ffffff"/><rect x="10" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="147" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="147" dy="0">Instantánea</tspan></text><rect x="290" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">Eventos aplicados, media</tspan></text><rect x="540" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">Percentil 99</tspan></text><rect x="730" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Instantáneas guardadas</tspan></text><rect x="10" y="56" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Nunca</tspan></text><rect x="290" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">5 021</tspan></text><rect x="540" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">9 893</tspan></text><rect x="730" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0</tspan></text><rect x="10" y="106" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Cada 1 000 eventos</tspan></text><rect x="290" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">507</tspan></text><rect x="540" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">991</tspan></text><rect x="730" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">10</tspan></text><rect x="10" y="156" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Cada 200 eventos</tspan></text><rect x="290" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">99</tspan></text><rect x="540" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">198</tspan></text><rect x="730" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">50</tspan></text><rect x="10" y="206" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Cada 50 eventos</tspan></text><rect x="290" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">24</tspan></text><rect x="540" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">49</tspan></text><rect x="730" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">200</tspan></text><rect x="10" y="260" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">El coste de reconstruir es proporcional a la distancia hasta la última instantánea; el de guardarlas, a su número. El agregado</tspan></text><text x="485" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">«curso» recibe un evento por entrega (4 800 por periodo con 400 estudiantes y 12 tareas): agregados que crecen sin límite piden</tspan></text><text x="485" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">otro diseño del límite. Se contaron eventos aplicados, no segundos.</tspan></text><text x="485" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
