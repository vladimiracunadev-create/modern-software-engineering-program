<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 557" width="940" height="557" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cobertura de líneas y mutantes muertos de la misma función</title><desc id="d">Barras agrupadas con la cobertura de líneas y los mutantes muertos de cuatro conjuntos de pruebas: cinco ejemplos, doscientas entradas al azar y ocho entradas sin bordes ejecutan el 90 por ciento de las líneas pero matan el 63,2, el 73,7 y el 63,2 por ciento de los mutantes; las cincuenta y seis entradas en los bordes alcanzan el 100 por ciento de ambos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="557" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cobertura de líneas y mutantes muertos de la misma función</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Líneas ejecutadas</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Mutantes muertos</tspan></text><line x1="78.62" y1="365" x2="920" y2="365" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="365" x2="78.62" y2="365" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="311" x2="920" y2="311" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="311" x2="78.62" y2="311" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="315.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="257" x2="920" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="257" x2="78.62" y2="257" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="203" x2="920" y2="203" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="203" x2="78.62" y2="203" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="149" x2="920" y2="149" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="149" x2="78.62" y2="149" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="153.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="365" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 230)">Porcentaje (%)</text><rect x="99.6545" y="122" width="82.138" height="243" rx="3" fill="#6b7c86"/><text x="140.724" y="116" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140.724" dy="0">90,0</tspan></text><rect x="185.793" y="194.36" width="82.138" height="170.64" rx="3" fill="#c0432f"/><text x="226.862" y="188.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="226.862" dy="0">63,2</tspan></text><text x="183.793" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">5 ejemplos</tspan></text><rect x="310" y="122" width="82.138" height="243" rx="3" fill="#6b7c86"/><text x="351.069" y="116" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="351.069" dy="0">90,0</tspan></text><rect x="396.138" y="166.01" width="82.138" height="198.99" rx="3" fill="#c0432f"/><text x="437.207" y="160.01" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.207" dy="0">73,7</tspan></text><text x="394.138" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">200 entradas al azar</tspan></text><rect x="520.345" y="122" width="82.138" height="243" rx="3" fill="#6b7c86"/><text x="561.413" y="116" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.413" dy="0">90,0</tspan></text><rect x="606.483" y="194.36" width="82.138" height="170.64" rx="3" fill="#c0432f"/><text x="647.552" y="188.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.552" dy="0">63,2</tspan></text><text x="604.482" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">8 entradas por todas las</tspan></text><text x="604.482" y="403" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">ramas, sin bordes</tspan></text><rect x="730.689" y="95" width="82.138" height="270" rx="3" fill="#6b7c86"/><text x="771.758" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.758" dy="0">100,0</tspan></text><rect x="816.827" y="95" width="82.138" height="270" rx="3" fill="#c0432f"/><text x="857.896" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.896" dy="0">100,0</tspan></text><text x="814.827" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">56 entradas en los bordes</tspan></text><rect x="10" y="434" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="458.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ejecutar una línea no es comprobarla: 90 % de cobertura convive con un tercio de mutantes vivos. La línea que falta es la</tspan></text><text x="470" y="475.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del error por peso fuera de rango, que solo un borde alcanza. La cobertura dice qué no se ejecutó; la mutación, qué no se</tspan></text><text x="470" y="492.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comprueba.</tspan></text><text x="470" y="539.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
