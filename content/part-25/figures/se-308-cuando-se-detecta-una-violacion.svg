<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 307" width="980" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Puntos de uso de una dependencia indebida que hay que corregir según cuándo se detecta</title><desc id="d">Barras: una dependencia indebida que entra en el commit t y atrae un uso nuevo con probabilidad 3 por ciento por commit deja 1,00 punto de uso por corregir si se detecta en el mismo commit, 1,30 si se revisa cada 20, 2,50 cada 100 y 7,05 si solo se revisa al final.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="307" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Se revisa en cada commit</tspan></text><rect x="300" y="16" width="60" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="368" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="368" dy="0">1,00 (p95: 1)</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Cada 20 commits</tspan></text><rect x="300" y="60" width="78" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="386" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="386" dy="0">1,30 (p95: 2)</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Cada 100 commits</tspan></text><rect x="300" y="104" width="150" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="458" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="458" dy="0">2,50 (p95: 5)</tspan></text><text x="290" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Solo al final (400 commits)</tspan></text><rect x="300" y="148" width="423" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="731" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="731" dy="0">7,05 (p95: 14)</tspan></text><rect x="10" y="196" width="960" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Cada commit sin detección es una oportunidad de que alguien se apoye en la violación: el coste de corregir crece con el tiempo</tspan></text><text x="490" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">hasta detectar. La tasa del 3 % es un supuesto; con otra tasa cambian las cifras, no la forma. Una función de aptitud que falla</tspan></text><text x="490" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">en el commit que introduce el problema hace la corrección tan barata como puede ser.</tspan></text><text x="490" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
