0" stroke-width="1.6"/><text x="127" y="355.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">500</tspan></text><rect x="250" y="332" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">× 1,25</tspan></text><rect x="470" y="332" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0,0 %</tspan></text><rect x="690" y="332" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">87,5 %</tspan></text><rect x="10" y="382" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="406.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El umbral y el número de muestras son una decisión estadística: con pocas muestras no existe un umbral que dé a la vez pocas</tspan></text><text x="480" y="423.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">falsas alarmas y pocas regresiones perdidas; con muchas sí, a costa de tiempo de ejecución. Una prueba que falla al azar se</tspan></text><text x="480" y="440.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">ignora, y una función de aptitud ignorada ha dejado de existir. 2000 ejecuciones por celda, latencias lognormales sintéticas.</tspan></text><text x="480" y="479.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
