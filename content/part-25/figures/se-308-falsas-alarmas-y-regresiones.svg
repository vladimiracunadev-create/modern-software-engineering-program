<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 493" width="960" height="493" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Prueba de rendimiento con umbral sobre el percentil 95: falsas alarmas y regresiones de +20 % no detectadas</title><desc id="d">Tabla: con 30 muestras por ejecución y un umbral de 1,10 veces el percentil 95 esperado hay 24,7 por ciento de falsas alarmas y se pierde el 21,6 por ciento de las regresiones de 20 por ciento; con 500 muestras y 1,10 las dos cifras caen a 0,3 y 0,5 por ciento; con margen 1,25 casi nunca hay falsa alarma pero se pierde el 87,5 por ciento de las regresiones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="493" fill="#ffffff"/><rect x="10" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="127" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="127" dy="0">Muestras por ejecución</tspan></text><rect x="250" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357" dy="0">Margen del umbral</tspan></text><rect x="470" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Falsas alarmas</tspan></text><rect x="690" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-s