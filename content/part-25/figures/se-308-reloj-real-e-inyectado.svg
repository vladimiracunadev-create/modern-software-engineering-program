<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 437" width="980" height="437" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una prueba que espera «sin recargo» ejecutada en cada minuto de una semana</title><desc id="d">Barras horizontales con el porcentaje de los 10 080 minutos de una semana en que falla la prueba: con el reloj real falla el 28,6 por ciento en el huso UTC, en UTC menos 3 y en UTC más 9; el servidor en UTC y una persona en UTC menos 3 discrepan sobre si es fin de semana en el 3,6 por ciento; con un reloj inyectado fijo en un miércoles no falla ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="437" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una prueba que espera «sin recargo» ejecutada en cada minuto de una semana</tspan></text><line x1="354" y1="49" x2="354" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="239" x2="354" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="543.92" y1="49" x2="543.92" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="543.92" y1="239" x2="543.92" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="543.92" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="543.92" dy="0">10</tspan></text><line x1="733.84" y1="49" x2="733.84" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="733.84" y1="239" x2="733.84" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="733.84" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="733.84" dy="0">20</tspan></text><line x1="923.76" y1="49" x2="923.76" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="923.76" y1="239" x2="923.76" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="923.76" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="923.76" dy="0">30</tspan></text><line x1="354" y1="239" x2="923.76" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reloj real, huso de UTC</tspan></text><text x="344" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reloj real, huso UTC−3</tspan></text><text x="344" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reloj real, huso UTC+9</tspan></text><text x="344" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">UTC y UTC−3 discrepan sobre el fin de semana</tspan></text><text x="344" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reloj inyectado con un miércoles fijo</tspan></text><rect x="354" y="55" width="543.171" height="26" rx="3" fill="#c0432f"/><text x="904.171" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="904.171" dy="0">28,6</tspan></text><rect x="354" y="93" width="543.171" height="26" rx="3" fill="#c0432f"/><text x="904.171" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="904.171" dy="0">28,6</tspan></text><rect x="354" y="131" width="543.171" height="26" rx="3" fill="#c0432f"/><text x="904.171" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="904.171" dy="0">28,6</tspan></text><rect x="354" y="169" width="68.3712" height="26" rx="3" fill="#c0432f"/><text x="429.371" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="429.371" dy="0">3,6</tspan></text><rect x="354" y="207" width="2" height="26" rx="3" fill="#c0432f"/><text x="363" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0,0</tspan></text><text x="638.88" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="638.88" dy="0">Minutos de la semana (%)</tspan></text><rect x="10" y="297" width="960" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">El 28,6 % es 2/7: una prueba que no controla el reloj pasa de lunes a viernes y falla el fin de semana, y el huso solo cambia qué</tspan></text><text x="490" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">minutos fallan (2880 de 10 080 en cada huso; 360 de discrepancia). Con dos lecturas del reloj separadas 20 ms junto a cada</tspan></text><text x="490" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">medianoche, 2 de 7 medianoches dan un resultado distinto. Inyectar el reloj convierte esa dependencia en un parámetro. Cálculo</tspan></text><text x="490" y="371.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">exhaustivo sobre una semana, sin reloj real.</tspan></text><text x="490" y="419.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
