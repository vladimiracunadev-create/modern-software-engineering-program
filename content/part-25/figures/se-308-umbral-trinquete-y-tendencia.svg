<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 363" width="1010" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres alarmas sobre una deriva de acoplamiento (926 series de 80 semanas con daño real sobre 26)</title><desc id="d">Tabla: de 926 series con una deriva real que supera 26, el umbral absoluto de 30 nunca avisa antes del daño y no avisa nunca en el 18 por ciento; el trinquete avisa antes en el 99 por ciento con una mediana de 18 semanas de adelanto y 24,4 por ciento de falsas alarmas en series planas; la alarma por pendiente avisa antes en el 95 por ciento y da falsa alarma en el 95,4 por ciento de las series planas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="363" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Alarma</tspan></text><rect x="340" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Avisa antes del</tspan></text><text x="422" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">daño</tspan></text><rect x="510" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">Mediana</tspan></text><rect x="680" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Nunca avisa</tspan></text><rect x="810" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="902" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="902" dy="0">Falsas alarmas en</tspan></text><text x="902" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="902" dy="0">series planas</tspan></text><rect x="10" y="56" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Umbral absoluto de 30</tspan></text><rect x="340" y="56" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0 %</tspan></text><rect x="510" y="56" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">14 semanas tarde</tspan></text><rect x="680" y="56" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">18 %</tspan></text><rect x="810" y="56" width="184" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">0 %</tspan></text><rect x="10" y="120" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Trinquete: +2 sobre el mejor valor</tspan></text><rect x="340" y="120" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">99 %</tspan></text><rect x="510" y="120" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">18 semanas antes</tspan></text><rect x="680" y="120" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">0 %</tspan></text><rect x="810" y="120" width="184" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">24,4 %</tspan></text><rect x="10" y="184" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Pendiente &gt; 0,1 por semana en 8 semanas</tspan></text><rect x="340" y="184" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">95 %</tspan></text><rect x="510" y="184" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">21 semanas antes</tspan></text><rect x="680" y="184" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">0 %</tspan></text><rect x="810" y="184" width="184" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">95,4 %</tspan></text><rect x="10" y="252" width="990" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="505" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Una alarma que llega pronto es una alarma que se equivoca más: el umbral absoluto no da falsas alarmas porque llega tarde; la</tspan></text><text x="505" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">pendiente de ocho semanas ve tendencias en el ruido. La combinación habitual, un trinquete con tolerancia más una revisión humana de</tspan></text><text x="505" y="310.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">las alarmas, es una decisión sobre qué error cuesta más. Series sintéticas con deriva de 0,05 por semana y ruido de 0,4.</tspan></text><text x="505" y="349.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
