><text x="505.62" y="388" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505.62" dy="0">8</tspan></text><line x1="698.81" y1="87" x2="698.81" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="698.81" y1="367" x2="698.81" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="698.81" y="388" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="698.81" dy="0">10</tspan></text><line x1="892" y1="87" x2="892" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="367" x2="892" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="388" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">12</tspan></text><line x1="101.24" y1="367" x2="910" y2="367" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 227)">Configuraciones que probar (escala logarítmica)</text><text x="505.62" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Opciones binarias</tspan></text><polyline points="119.24,282.712 312.43,240.567 505.62,198.423 698.81,156.279 892,114.135" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="119.24" cy="282.712" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="119.24" y="271.712" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">16</tspan></text><circle cx="312.43" cy="240.567" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="312.43" y="229.567" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="312.43" dy="0">64</tspan></text><circle cx="505.62" cy="198.423" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="505.62" y="187.423" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="505.62" dy="0">256</tspan></text><circle cx="698.81" cy="156.279" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="698.81" y="145.279" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="698.81" dy="0">1 024</tspan></text><circle cx="892" cy="114.135" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="103.135" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">4 096</tspan></text><polyline points="119.24,312.529 312.43,307.843 505.62,303.784 698.81,303.784 892,300.203" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="113.74" y="307.029" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="119.24" y="301.529" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">6</tspan></text><rect x="306.93" y="302.343" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="312.43" y="296.843" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="312.43" dy="0">7</tspan></text><rect x="500.12" y="298.284" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="505.62" y="292.784" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="505.62" dy="0">8</tspan></text><rect x="693.31" y="298.284" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="698.81" y="292.784" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="698.81" dy="0">8</tspan></text><rect x="886.5" y="294.703" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="289.203" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">9</tspan></text><rect x="10" y="427" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 12 opciones, las 9 configuraciones cubren todos los pares, el 81,5 % de los tríos y el 50,3 % de los cuartetos (con 10</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">opciones, 8 configuraciones: 77,7 % y 46,1 %). Si los fallos de interacción suelen implicar pocas opciones, los pares</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">atrapan casi todos con una fracción de las pruebas; si requieren tres o cuatro, la mitad queda sin ver. El conjunto se</tspan></text><text x="470" y="501.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">construyó con un algoritmo voraz de semilla fija. Pares al azar del mismo tamaño cubren menos.</tspan></text><text x="470" y="549.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
