<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un comprobador de ADR frente a 12 ADR válidos con un defecto cada uno</title><desc id="d">Barras horizontales apiladas con los defectos detectados y no detectados según su tipo: las cuatro variantes de forma, falta de sección, estado inventado, fecha mal escrita o una sola alternativa, se detectan en 48 de 48 casos; las cuatro de sentido, alternativas vacías, consecuencias solo positivas, decisión que no responde al contexto o reversibilidad sin condición, en 0 de 48; los doce ADR válidos pasan sin falsos positivos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un comprobador de ADR frente a 12 ADR válidos con un defecto cada uno</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectados</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectados</tspan></text><line x1="274" y1="77" x2="274" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="165" x2="274" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="77" x2="394.34" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="165" x2="394.34" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">10</tspan></text><line x1="514.68" y1="77" x2="514.68" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="165" x2="514.68" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">20</tspan></text><line x1="635.02" y1="77" x2="635.02" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="165" x2="635.02" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">30</tspan></text><line x1="755.36" y1="77" x2="755.36" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="165" x2="755.36" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">40</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">50</tspan></text><line x1="274" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Defectos de forma (4 variantes ×</tspan></text><text x="264" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">12 ADR)</tspan></text><text x="264" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Defectos de sentido (4 variantes ×</tspan></text><text x="264" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">12 ADR)</tspan></text><rect x="274" y="84" width="577.632" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="562.816" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562.816" dy="0">48</tspan></text><rect x="851.632" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="858.632" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="858.632" dy="0">48</tspan></text><rect x="274" y="128" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="274" y="128" width="577.632" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="562.816" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562.816" dy="0">48</tspan></text><text x="858.632" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="858.632" dy="0">48</tspan></text><text x="574.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Casos (defecto × ADR)</tspan></text><rect x="10" y="223" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El comprobador exige secciones, estado válido, fecha ISO y al menos dos alternativas: eso evita ADR incompletos, no malos.</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las cuatro variantes que pasan cumplen la forma y vacían el contenido; eso lo ve una persona leyendo. Un ADR aceptado por</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el comprobador sigue necesitando revisión humana del sentido.</tspan></text><text x="470" y="328.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
