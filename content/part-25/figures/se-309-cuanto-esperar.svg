<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 321" width="990" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste esperado (semanas-equipo) de decidir tras esperar, según lo caro que sea revertir</title><desc id="d">Tabla: si revertir una decisión equivocada cuesta 5 o 30 semanas-equipo conviene decidir de inmediato, con costes esperados de 2,0 y 12,0; si cuesta 100 conviene esperar 20 semanas hasta que la evidencia sea fiable, con un coste esperado de 25,0 frente a 40,2 de decidir ya.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="321" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Coste de revertir</tspan></text><rect x="210" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="262" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="262" dy="0">Esperar 0</tspan></text><rect x="320" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">4</tspan></text><rect x="420" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">8</tspan></text><rect x="520" y="12" width="94" 