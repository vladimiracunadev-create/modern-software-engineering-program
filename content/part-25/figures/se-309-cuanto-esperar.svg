nt-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">13,0</tspan></text><rect x="620" y="56" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">20,3</tspan></text><rect x="720" y="56" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">30,3</tspan></text><rect x="820" y="56" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">0 semanas</tspan></text><rect x="10" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">30</tspan></text><rect x="210" y="106" width="104" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="262" dy="0">12,0</tspan></text><rect x="320" y="106" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">14,3</tspan></text><rect x="420" y="106" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">16,2</tspan></text><rect x="520" y="106" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">17,9</tspan></text><rect x="620" y="106" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">21,5</tspan></text><rect x="720" y="106" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">31,5</tspan></text><rect x="820" y="106" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">0 semanas</tspan></text><rect x="10" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">100</tspan></text><rect x="210" y="156" width="104" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="262" dy="0">40,2</tspan></text><rect x="320" y="156" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">38,2</tspan></text><rect x="420" y="156" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">35,2</tspan></text><rect x="520" y="156" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">31,8</tspan></text><rect x="620" y="156" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">25,0</tspan></text><rect x="720" y="156" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">35,0</tspan></text><rect x="820" y="156" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">20 semanas</tspan></text><rect x="10" y="210" width="970" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">La espera tiene un coste lineal de 1 por semana y la evidencia pasa de acertar el 60 % a acertar el 95 % tras un tiempo</tspan></text><text x="495" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">desconocido (2 a 20 semanas). Esperar solo compensa cuando equivocarse es caro y la evidencia mejora de verdad. Es un modelo de</tspan></text><text x="495" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">juguete con supuestos del autor: sirve para pensar la reversibilidad, no para fijar cifras.</tspan></text><text x="495" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
