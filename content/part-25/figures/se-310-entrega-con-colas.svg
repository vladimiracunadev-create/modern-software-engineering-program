<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 321" width="950" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Días de entrega de un cambio (mediana / percentil 90) según equipos por los que pasa y su ocupación</title><desc id="d">Tabla: con equipos ocupados al 50 por ciento, un cambio que pasa por cinco equipos tarda 9,3 días de mediana y 15,9 en el percentil 90; con ocupación del 90 por ciento tarda 42,8 y 71,4 días; pasando por un solo equipo ocupado al 90 por ciento tarda 6,5 y 18,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="321" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Ocupación de cada equipo</tspan></text><rect x="260" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="342" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="342" dy="0">1 equipo</tspan></text><rect x="430" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">2 equipos</tspan></text><rect x="600" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">3 equipos</tspan></text><rect x="770" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">5 equipos</tspan></text><rect x="10" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">50 %</tspan></text><rect x="260" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">1,4 / 4,5</tspan></text><rect x="430" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">3,4 / 7,6</tspan></text><rect x="600" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">5,3 / 10,4</tspan></text><rect x="770" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">9,3 / 15,9</tspan></text><rect x="10" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">70 %</tspan></text><rect x="260" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">2,3 / 7,5</tspan></text><rect x="430" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">5,6 / 12,5</tspan></text><rect x="600" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">8,9 / 17,2</tspan></text><rect x="770" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">15,4 / 25,8</tspan></text><rect x="10" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">90 %</tspan></text><rect x="260" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">6,5 / 18,9</tspan></text><rect x="430" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">15,8 / 34,1</tspan></text><rect x="600" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">24,9 / 47,3</tspan></text><rect x="770" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">42,8 / 71,4</tspan></text><rect x="10" y="210" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Cada traspaso añade una cola y la espera crece más que linealmente con la ocupación. El trabajo (servicio medio de un día)</tspan></text><text x="475" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">es el mismo en todas las celdas: lo que cambia es cuánto espera. Colas M/M/1 en serie con llegadas de Poisson, un modelo</tspan></text><text x="475" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">ideal; los equipos reales tienen trabajo en paralelo, prioridades y vacaciones.</tspan></text><text x="475" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
