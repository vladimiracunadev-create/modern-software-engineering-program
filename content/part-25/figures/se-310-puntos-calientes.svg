<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reducción del interés pagado al refactorizar 5 de 40 archivos según cómo se eligen</title><desc id="d">Barras agrupadas con la reducción del interés pagado según el criterio de elección y la relación entre complejidad y cambios: sin relación, elegir por complejidad reduce el 17,8 por ciento, por cambios el 33,9, por complejidad por cambios el 36,6 y al azar el 7,4; con coincidencia total los tres criterios dan 48,1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="540" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reducción del interés pagado al refactorizar 5 de 40 archivos según cómo se eligen</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Por complejidad</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Por cambios</tspan></text><rect x="308.04" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="328.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.04" dy="0">Por complejidad × cambios</tspan></text><rect x="544.54" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="564.54" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="564.54" dy="0">Al azar</tspan></text><line x1="71.08" y1="365" x2="960" y2="365" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="365" x2="71.08" y2="365" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="311" x2="960" y2="311" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="311" x2="71.08" y2="311" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="315.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="257" x2="960" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="257" x2="71.08" y2="257" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="203" x2="960" y2="203" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="203" x2="71.08" y2="203" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="149" x2="960" y2="149" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="149" x2="71.08" y2="149" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="153.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="960" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">50</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="365" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 230)">Reducción del interés pagado (%)</text><rect x="100.711" y="268.88" width="56.2613" height="96.12" rx="3" fill="#c0432f"/><text x="128.841" y="262.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="128.841" dy="0">17,8</tspan></text><rect x="160.972" y="181.94" width="56.2613" height="183.06" rx="3" fill="#946512"/><text x="189.103" y="175.94" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="189.103" dy="0">33,9</tspan></text><rect x="221.233" y="167.36" width="56.2613" height="197.64" rx="3" fill="#087f8c"/><text x="249.364" y="161.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="249.364" dy="0">36,6</tspan></text><rect x="281.495" y="325.04" width="56.2613" height="39.96" rx="3" fill="#6b7c86"/><text x="309.625" y="319.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="309.625" dy="0">7,4</tspan></text><text x="219.233" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="219.233" dy="0">Sin relación</tspan></text><rect x="397.017" y="163.58" width="56.2613" height="201.42" rx="3" fill="#c0432f"/><text x="425.148" y="157.58" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="425.148" dy="0">37,3</tspan></text><rect x="457.279" y="132.26" width="56.2613" height="232.74" rx="3" fill="#946512"/><text x="485.409" y="126.26" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="485.409" dy="0">43,1</tspan></text><rect x="517.54" y="126.86" width="56.2613" height="238.14" rx="3" fill="#087f8c"/><text x="545.671" y="120.86" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="545.671" dy="0">44,1</tspan></text><rect x="577.801" y="320.72" width="56.2613" height="44.28" rx="3" fill="#6b7c86"/><text x="605.932" y="314.72" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="605.932" dy="0">8,2</tspan></text><text x="515.54" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="515.54" dy="0">Relación media (0,5)</tspan></text><rect x="693.324" y="105.26" width="56.2613" height="259.74" rx="3" fill="#c0432f"/><text x="721.455" y="99.26" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="721.455" dy="0">48,1</tspan></text><rect x="753.585" y="105.26" width="56.2613" height="259.74" rx="3" fill="#946512"/><text x="781.716" y="99.26" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="781.716" dy="0">48,1</tspan></text><rect x="813.847" y="105.26" width="56.2613" height="259.74" rx="3" fill="#087f8c"/><text x="841.977" y="99.26" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.977" dy="0">48,1</tspan></text><rect x="874.108" y="325.58" width="56.2613" height="39.42" rx="3" fill="#6b7c86"/><text x="902.239" y="319.58" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="902.239" dy="0">7,3</tspan></text><text x="811.847" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="811.847" dy="0">Relación total (1,0)</tspan></text><rect x="10" y="417" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="441.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El archivo más complejo no es necesariamente el más caro: si nadie lo toca, su deuda no paga interés. Esto es un resultado del</tspan></text><text x="490" y="458.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">modelo, que fija como supuesto que el interés es complejidad por cambios: con otro supuesto el orden de los criterios puede</tspan></text><text x="490" y="475.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">cambiar. 400 repeticiones con semilla fija.</tspan></text><text x="490" y="522.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
