<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 371" width="920" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que la revisión cubra las tres categorías débiles según quién revisa (5 escenarios por persona, 30 candidatos)</title><desc id="d">Tabla: una persona que prefiere escenarios de latencia cubre las tres categorías débiles, capacidad, disponibilidad y cambio, el 2,0 por ciento de las veces; dos personas con la misma especialidad el 13,9 y cinco el 61,5; con especialidades distintas una persona cubre el 9,4, dos el 40,3 y cinco el 89,4 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="371" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Personas que revisan</tspan></text><rect x="270" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Todas con la misma especialidad</tspan></text><rect x="610" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Con especialidades distintas</tspan></text><rect x="10" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">1 persona</tspan></text><rect x="270" y="56" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">2,0 %</tspan></text><rect x="610" y="56" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">9,4 %</tspan></text><rect x="10" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">2 personas</tspan></text><rect x="270" y="106" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">13,9 %</tspan></text><rect x="610" y="106" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">40,3 %</tspan></text><rect x="10" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">3 personas</tspan></text><rect x="270" y="156" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">30,5 %</tspan></text><rect x="610" y="156" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">65,3 %</tspan></text><rect x="10" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">5 personas</tspan></text><rect x="270" y="206" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">61,5 %</tspan></text><rect x="610" y="206" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">89,4 %</tspan></text><rect x="10" y="260" width="900" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">Elegir escenarios sin sesgo (5 de 30 al azar) cubre las tres categorías el 12,2 % de las veces, más que una persona</tspan></text><text x="460" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">sesgada. El valor de varias miradas está en que sus sesgos no coinciden. Pesos de preferencia (×4 por la especialidad),</tspan></text><text x="460" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">categorías y debilidades son supuestos del autor.</tspan></text><text x="460" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
