<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 631" width="940" height="631" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Revisión ejecutable de la arquitectura en servicios contra 12 escenarios (supuestos del autor)</title><desc id="d">Tabla: al ejecutar el modelo de la arquitectura en servicios contra doce escenarios, seis fallan: el pico de entrega satura el almacenamiento de archivos al 120 por ciento, la disponibilidad de la entrega da 99,905 por ciento, el antivirus llega al 125 por ciento de su capacidad y los dos cambios tocan dos unidades de despliegue.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="631" fill="#ffffff"/><rect x="10" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="77" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="77" dy="0">Escenario</tspan></text><rect x="150" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">Exigencia</tspan></text><rect x="630" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Resultado del modelo</tspan></text><rect x="10" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">E01</tspan></text><rect x="150" y="56" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">Entrega en día normal, p95 ≤ 800 ms</tspan></text><rect x="630" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">cumple · 445 ms</tspan></text><rect x="10" y="102" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">E02</tspan></text><rect x="150" y="102" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">Entrega en el pico (60 rps), p95 ≤ 2 s</tspan></text><rect x="630" y="102" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">falla · satura al 120 %</tspan></text><rect x="10" y="148" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">E03</tspan></text><rect x="150" y="148" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">Consulta de nota, p95 ≤ 400 ms</tspan></text><rect x="630" y="148" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">cumple · 155 ms</tspan></text><rect x="10" y="194" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">E04</tspan></text><rect x="150" y="194" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">Disponibilidad de la entrega ≥ 99,95 %</tspan></text><rect x="630" y="194" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">falla · 99,905 %</tspan></text><rect x="10" y="240" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">E05</tspan></text><rect x="150" y="240" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">Disponibilidad de la consulta ≥ 99,9 %</tspan></text><rect x="630" y="240" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">cumple · 99,930 %</tspan></text><rect x="10" y="286" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">E06 – E08</tspan></text><rect x="150" y="286" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">Si cae notificaciones, antivirus o notas, se sigue entregando</tspan></text><rect x="630" y="286" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">cumple (3 de 3)</tspan></text><rect x="10" y="332" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">E09</tspan></text><rect x="150" y="332" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">El pico cabe con uso ≤ 80 %</tspan></text><rect x="630" y="332" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">falla · uso 120 % de 50 rps</tspan></text><rect x="10" y="378" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="401.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">E10</tspan></text><rect x="150" y="378" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">El antivirus procesa 20 archivos por segundo</tspan></text><rect x="630" y="378" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">falla · uso 125 % de 16 rps</tspan></text><rect x="10" y="424" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="447.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">E11</tspan></text><rect x="150" y="424" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">Cambiar la regla de nota toca ≤ 1 unidad</tspan></text><rect x="630" y="424" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">falla · 2 unidades</tspan></text><rect x="10" y="470" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="493.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">E12</tspan></text><rect x="150" y="470" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="493.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">Cambiar el formato de archivo toca ≤ 1 unidad</tspan></text><rect x="630" y="470" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="493.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">falla · 2 unidades</tspan></text><rect x="10" y="520" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="544.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Seis de doce escenarios fallan y cuatro de ellos por la misma pieza: el almacenamiento de archivos y su revisión limitan el</tspan></text><text x="470" y="561.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">pico. Los números salen de un modelo con latencias p95 sumadas, disponibilidades por componente y capacidades supuestas;</tspan></text><text x="470" y="578.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sirve para encontrar dónde mirar, no para predecir el comportamiento de un sistema real.</tspan></text><text x="470" y="617.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
