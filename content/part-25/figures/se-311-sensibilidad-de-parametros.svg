<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 418" width="940" height="418" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Perturbaciones de un parámetro que invierten algún veredicto (8 de 144 combinaciones)</title><desc id="d">Barras horizontales apiladas con las perturbaciones, de 36 por parámetro, que invierten algún veredicto: seis de capacidad y dos de instancias del antivirus lo cambian; ninguna de latencia ni de tasa de fallo, de 0,5 a 2 veces, cambia un veredicto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="418" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Perturbaciones de un parámetro que invierten algún veredicto (8 de 144 combinaciones)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Invierten un veredicto</tspan></text><rect x="229.88" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="249.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">No cambian ninguno</tspan></text><line x1="154" y1="77" x2="154" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="154" y1="237" x2="154" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="154" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154" dy="0">0</tspan></text><line x1="334.425" y1="77" x2="334.425" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="334.425" y1="237" x2="334.425" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="334.425" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334.425" dy="0">10</tspan></text><line x1="514.85" y1="77" x2="514.85" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="514.85" y1="237" x2="514.85" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="514.85" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.85" dy="0">20</tspan></text><line x1="695.275" y1="77" x2="695.275" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="695.275" y1="237" x2="695.275" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="695.275" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="695.275" dy="0">30</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="237" x2="875.7" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">40</tspan></text><line x1="154" y1="237" x2="875.7" y2="237" stroke="#5b7280" stroke-width="1.6"/><text x="144" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">Capacidad</tspan></text><text x="144" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">Instancias</tspan></text><text x="144" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">Latencia</tspan></text><text x="144" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">Tasa de fallo</tspan></text><rect x="154" y="84" width="108.255" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="208.127" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="208.127" dy="0">6</tspan></text><rect x="262.255" y="84" width="541.275" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="532.893" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532.893" dy="0">30</tspan></text><text x="810.53" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="810.53" dy="0">36</tspan></text><rect x="154" y="124" width="36.085" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="172.043" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172.043" dy="0">2</tspan></text><rect x="190.085" y="124" width="613.445" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="496.808" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="496.808" dy="0">34</tspan></text><text x="810.53" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="810.53" dy="0">36</tspan></text><rect x="154" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="154" y="164" width="649.53" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="478.765" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="478.765" dy="0">36</tspan></text><text x="810.53" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="810.53" dy="0">36</tspan></text><rect x="154" y="204" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="154" y="204" width="649.53" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="478.765" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="478.765" dy="0">36</tspan></text><text x="810.53" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="810.53" dy="0">36</tspan></text><text x="514.85" y="281" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="514.85" dy="0">Perturbaciones (9 componentes × 4 variaciones por parámetro)</tspan></text><rect x="10" y="295" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="319.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los veredictos son robustos a la latencia y a la tasa de fallo y frágiles a la capacidad. El escenario E04 falla por solo</tspan></text><text x="470" y="336.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">0,015 puntos de disponibilidad, pero ninguna mejora individual de un componente lo arregla: su causa es la suma de</tspan></text><text x="470" y="353.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">componentes y la causa común. Un margen pequeño no implica sensibilidad a un parámetro concreto.</tspan></text><text x="470" y="400.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
