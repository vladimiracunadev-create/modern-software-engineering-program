<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 803" width="1000" height="803" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Consumidores rotos por cada uno de doce cambios de una función pública, y si la firma lo ve</title><desc id="d">Barras horizontales con los consumidores rotos, de 8, por cada cambio: la firma detecta cinco cambios que rompen (añadir un parámetro obligatorio, eliminar, renombrar, reordenar y pasar a solo por nombre) y no ve cinco que rompen a entre uno y cinco consumidores (cambiar el valor por defecto, el redondeo, rechazar pesos altos, añadir un valor a un campo y añadir un campo a la respuesta); dos cambios sin efecto no rompen a nadie.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="803" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Consumidores rotos por cada uno de doce cambios de una función pública, y si la firma lo ve</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">La firma lo detecta</tspan></text><rect x="207.26" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">La firma no lo ve</tspan></text><line x1="354" y1="77" x2="354" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="605" x2="354" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="499.425" y1="77" x2="499.425" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="499.425" y1="605" x2="499.425" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="499.425" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.425" dy="0">2</tspan></text><line x1="644.85" y1="77" x2="644.85" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="644.85" y1="605" x2="644.85" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="644.85" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="644.85" dy="0">4</tspan></text><line x1="790.275" y1="77" x2="790.275" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="790.275" y1="605" x2="790.275" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="790.275" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790.275" dy="0">6</tspan></text><line x1="935.7" y1="77" x2="935.7" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="935.7" y1="605" x2="935.7" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="935.7" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="935.7" dy="0">8</tspan></text><line x1="354" y1="605" x2="935.7" y2="605" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Añadir un parámetro obligatorio solo por</tspan></text><text x="344" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">nombre</tspan></text><text x="344" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reordenar parámetros</tspan></text><text x="344" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Eliminar un parámetro</tspan></text><text x="344" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Renombrar un parámetro</tspan></text><text x="344" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Pasar un parámetro a solo por nombre</tspan></text><text x="344" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Cambiar el redondeo</tspan></text><text x="344" y="367.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Cambiar el valor por defecto</tspan></text><text x="344" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Rechazar pesos mayores de 30</tspan></text><text x="344" y="455.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Añadir un valor al campo estado</tspan></text><text x="344" y="499.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Añadir un campo notas a la respuesta</tspan></text><text x="344" y="543.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Añadir un parámetro opcional al final</tspan></text><text x="344" y="587.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reescribir sin cambio observable</tspan></text><rect x="354" y="84" width="581.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="644.85" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="644.85" dy="0">8</tspan></text><rect x="935.7" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="942.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="942.7" dy="0">8</tspan></text><rect x="354" y="128" width="290.85" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="499.425" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="499.425" dy="0">4</tspan></text><rect x="644.85" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="651.85" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="651.85" dy="0">4</tspan></text><rect x="354" y="172" width="218.138" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="463.069" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="463.069" dy="0">3</tspan></text><rect x="572.138" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="579.138" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="579.138" dy="0">3</tspan></text><rect x="354" y="216" width="145.425" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="426.712" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="426.712" dy="0">2</tspan></text><rect x="499.425" y="216" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="506.425" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="506.425" dy="0">2</tspan></text><rect x="354" y="260" width="72.7125" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="390.356" y="279.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="390.356" dy="0">1</tspan></text><rect x="426.712" y="260" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="433.712" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="433.712" dy="0">1</tspan></text><rect x="354" y="304" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="304" width="363.562" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="535.781" y="323.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="535.781" dy="0">5</tspan></text><text x="724.562" y="323.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="724.562" dy="0">5</tspan></text><rect x="354" y="348" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="348" width="218.138" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="463.069" y="367.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="463.069" dy="0">3</tspan></text><text x="579.138" y="367.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="579.138" dy="0">3</tspan></text><rect x="354" y="392" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="392" width="145.425" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="426.712" y="411.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="426.712" dy="0">2</tspan></text><text x="506.425" y="411.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="506.425" dy="0">2</tspan></text><rect x="354" y="436" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="436" width="72.7125" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="390.356" y="455.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="390.356" dy="0">1</tspan></text><text x="433.712" y="455.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="433.712" dy="0">1</tspan></text><rect x="354" y="480" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="480" width="72.7125" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="390.356" y="499.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="390.356" dy="0">1</tspan></text><text x="433.712" y="499.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="433.712" dy="0">1</tspan></text><rect x="354" y="524" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="524" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="361" y="543.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="361" dy="0">0</tspan></text><rect x="354" y="568" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="568" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="361" y="587.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="361" dy="0">0</tspan></text><text x="644.85" y="649" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="644.85" dy="0">Consumidores rotos (de 8)</tspan></text><rect x="10" y="663" width="980" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="687.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Cinco de diez cambios con efecto real no cambian la firma: el verificador por firma es necesario y no suficiente. Los dos cambios</tspan></text><text x="500" y="704.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">sin consumidores rotos (añadir un opcional al final y reescribir sin cambio observable) los clasifica bien como compatibles; no</tspan></text><text x="500" y="721.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">hubo falsas alarmas. Los consumidores son ocho funciones sintéticas con estilos de llamada distintos; su cobertura es del autor y</tspan></text><text x="500" y="737.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">una compatibilidad semántica real exige consumidores reales.</tspan></text><text x="500" y="785.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
