<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="940" height="590" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil meses simulados de cuatro arquitecturas (4 picos de 60 a 90 rps de 10 minutos por mes)</title><desc id="d">Dispersión con la capacidad de la ruta de entrega y el porcentaje de meses que alcanzan 99,9 por ciento de disponibilidad: servicios con 50 peticiones por segundo logra 60 por ciento y pasa 40 minutos saturado; el monolito modular con 50 logra 74 y también 40 minutos; con 120 y con 135 desaparece la saturación pero el porcentaje sigue en 74, de modo que añadir capacidad no mejora la disponibilidad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="590" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mil meses simulados de cuatro arquitecturas (4 picos de 60 a 90 rps de 10 minutos por mes)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Saturan 40 minutos en los picos</tspan></text><rect x="297.74" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="317.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="317.74" dy="0">No saturan</tspan></text><line x1="71.08" y1="407" x2="910" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="407" x2="71.08" y2="407" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">55</tspan></text><line x1="71.08" y1="343" x2="910" y2="343" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="343" x2="71.08" y2="343" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="347.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="279" x2="910" y2="279" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="279" x2="71.08" y2="279" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="283.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">65</tspan></text><line x1="71.08" y1="215" x2="910" y2="215" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="215" x2="71.08" y2="215" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="219.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">70</tspan></text><line x1="71.08" y1="151" x2="910" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="151" x2="71.08" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">75</tspan></text><line x1="71.08" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="87" x2="71.08" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="87" x2="71.08" y2="407" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="87" x2="89.08" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="407" x2="89.08" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">40</tspan></text><line x1="222.9" y1="87" x2="222.9" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="222.9" y1="407" x2="222.9" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="222.9" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222.9" dy="0">60</tspan></text><line x1="356.72" y1="87" x2="356.72" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="356.72" y1="407" x2="356.72" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="356.72" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="356.72" dy="0">80</tspan></text><line x1="490.54" y1="87" x2="490.54" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="490.54" y1="407" x2="490.54" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="490.54" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.54" dy="0">100</tspan></text><line x1="624.36" y1="87" x2="624.36" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="624.36" y1="407" x2="624.36" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="624.36" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="624.36" dy="0">120</tspan></text><line x1="758.18" y1="87" x2="758.18" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="758.18" y1="407" x2="758.18" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="758.18" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="758.18" dy="0">140</tspan></text><line x1="892" y1="87" x2="892" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="407" x2="892" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">160</tspan></text><line x1="71.08" y1="407" x2="910" y2="407" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 247)">Meses con al menos 99,9 % de disponibilidad (%)</text><text x="490.54" y="453" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Capacidad de la ruta de entrega (peticiones por segundo)</tspan></text><circle cx="155.99" cy="343" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="165.99" y="347.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="165.99" dy="0">Servicios · 40 min saturados</tspan></text><circle cx="155.99" cy="163.8" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="165.99" y="168.3" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="165.99" dy="0">Monolito modular · 40 min saturados</tspan></text><rect x="618.86" y="158.3" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="624.36" y="187.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="624.36" dy="0">Monolito + archivos asíncronos · 0 min</tspan></text><rect x="719.225" y="158.3" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="724.725" y="152.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="724.725" dy="0">Propuesta final · 0 min</tspan></text><rect x="10" y="467" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Añadir instancias elimina la saturación pero no mejora la disponibilidad: lo domina la causa común. Eso obliga a una</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">decisión de negocio escrita en un ADR: aceptar 99,9 % o invertir en aislar la causa común. Caídas con duración exponencial</tspan></text><text x="470" y="525.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 20 minutos y 30 % de causa común: supuestos del autor, no datos de un sistema.</tspan></text><text x="470" y="572.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
