<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 523" width="880" height="523" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador del dossier de arquitectura frente a 200 mutaciones (150 detectadas)</title><desc id="d">Tabla: de 200 mutaciones de un dossier de arquitectura el validador detecta 150, las seis de estructura (referencias rotas, umbral borrado, vista incompleta, una sola alternativa) en 25 de 25 casos cada una, y ninguna de las dos de sentido, un umbral de 999999 milisegundos y una función de aptitud que siempre pasa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="880" height="523" fill="#ffffff"/><rect x="10" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="267" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="267" dy="0">Mutación</tspan></text><rect x="530" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="612" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">Detectadas</tspan></text><rect x="700" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Tipo</tspan></text><rect x="10" y="56" width="514" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Escenario sin driver</tspan></text><rect x="530" y="56" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">25 de 25</tspan></text><rect x="700" y="56" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">estructura</tspan></text><rect x="10" y="100" width="514" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Umbral borrado</tspan></text><rect x="530" y="100" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">25 de 25</tspan></text><rect x="700" y="100" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">estructura</tspan></text><rect x="10" y="144" width="514" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="166.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">ADR que apunta a un escenario inexistente</tspan></text><rect x="530" y="144" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">25 de 25</tspan></text><rect x="700" y="144" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">estructura</tspan></text><rect x="10" y="188" width="514" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="210.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Vista sin un componente</tspan></text><rect x="530" y="188" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">25 de 25</tspan></text><rect x="700" y="188" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">estructura</tspan></text><rect x="10" y="232" width="514" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="254.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Función de aptitud sobre un escenario inexistente</tspan></text><rect x="530" y="232" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">25 de 25</tspan></text><rect x="700" y="232" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">estructura</tspan></text><rect x="10" y="276" width="514" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="298.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">ADR con una sola alternativa</tspan></text><rect x="530" y="276" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">25 de 25</tspan></text><rect x="700" y="276" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">estructura</tspan></text><rect x="10" y="320" width="514" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="342.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Umbral absurdo (999 999 ms)</tspan></text><rect x="530" y="320" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">0 de 25</tspan></text><rect x="700" y="320" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">sentido</tspan></text><rect x="10" y="364" width="514" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="386.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Función de aptitud que siempre pasa</tspan></text><rect x="530" y="364" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="386.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">0 de 25</tspan></text><rect x="700" y="364" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="386.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">sentido</tspan></text><rect x="10" y="412" width="860" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="440" y="436.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">El dossier base (4 drivers, 12 escenarios, 4 ADR, 6 funciones de aptitud, 4 vistas) pasa el validador y, aun así,</tspan></text><text x="440" y="453.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">el modelo ejecutable da cuatro fallas (E04, E08, E10, E12): validar la forma no es evaluar la arquitectura. Las</tspan></text><text x="440" y="470.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">mutaciones son del autor; la tasa de 150/200 depende de cuántas sean de sentido.</tspan></text><text x="440" y="509.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
