<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 338" width="940" height="338" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador del dossier de arquitectura frente a 200 mutaciones (150 detectadas)</title><desc id="d">Barras horizontales apiladas con las mutaciones detectadas y no detectadas según su tipo: las seis de estructura, referencias rotas, umbral borrado, vista incompleta o una sola alternativa, se detectan en 150 de 150 casos; las dos de sentido, un umbral de 999999 milisegundos y una función de aptitud que siempre pasa, en 0 de 50.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="338" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Validador del dossier de arquitectura frente a 200 mutaciones (150 detectadas)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="214" y1="77" x2="214" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="157" x2="214" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="434.567" y1="77" x2="434.567" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="434.567" y1="157" x2="434.567" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="434.567" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.567" dy="0">50</tspan></text><line x1="655.133" y1="77" x2="655.133" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="655.133" y1="157" x2="655.133" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="655.133" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.133" dy="0">100</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">150</tspan></text><line x1="214" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Estructura (6 tipos × 25)</tspan></text><text x="204" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Sentido (2 tipos × 25)</tspan></text><rect x="214" y="84" width="661.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="544.85" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="544.85" dy="0">150</tspan></text><rect x="875.7" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">150</tspan></text><rect x="214" y="124" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="214" y="124" width="220.567" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="324.283" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="324.283" dy="0">50</tspan></text><text x="441.567" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="441.567" dy="0">50</tspan></text><text x="544.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.85" dy="0">Mutaciones del dossier</tspan></text><rect x="10" y="215" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El dossier base (4 drivers, 12 escenarios, 4 ADR, 6 funciones de aptitud, 4 vistas) pasa el validador y, aun así, el modelo</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ejecutable da cuatro fallas (E04, E08, E10, E12): validar la forma no es evaluar la arquitectura. Las mutaciones son del</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">autor; la tasa de 150/200 depende de cuántas sean de sentido.</tspan></text><text x="470" y="320.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
