<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 539" width="980" height="539" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Retirar la versión antigua: clientes que se rompen (500 clientes, parámetros supuestos)</title><desc id="d">Líneas con el porcentaje de clientes que se rompen al retirar la versión antigua según la semana de retirada: baja de 53,8 por ciento en la semana 8 a 42,4 en la 12, 31,6 en la 26, 27,4 en la 52 y 25,8 en la 104, y se acerca al 25,6 por ciento que nunca migra solo, sin llegar a cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="539" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Retirar la versión antigua: clientes que se rompen (500 clientes, parámetros supuestos)</tspan></text><line x1="71.08" y1="339" x2="950" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="339" x2="71.08" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="343.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="292.333" x2="950" y2="292.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="292.333" x2="71.08" y2="292.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="296.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="245.667" x2="950" y2="245.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="245.667" x2="71.08" y2="245.667" stroke="#5b7280" stroke-widt