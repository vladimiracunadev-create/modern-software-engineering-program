"middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">53,8</tspan></text><circle cx="222.328" cy="141.133" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="222.328" y="130.133" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="222.328" dy="0">42,4</tspan></text><circle cx="476.422" cy="191.533" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="476.422" y="180.533" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="476.422" dy="0">31,6</tspan></text><circle cx="704.211" cy="211.133" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="704.211" y="200.133" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="704.211" dy="0">27,4</tspan></text><circle cx="932" cy="218.6" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="932" y="207.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="932" dy="0">25,8</tspan></text><rect x="10" y="399" width="960" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Con retirada en la semana 12 se rompen 212 clientes (42,4 %) y en la 104 todavía 129 (25,8 %); los que ya migraron suben de 46,2</tspan></text><text x="490" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">% a 74,2 %. El 75 % de los diligentes migra en 11,3 semanas, el 95 % en 36,3 y el 99 % en 72,4, pero el 25,6 % de los clientes</tspan></text><text x="490" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">(abandonados y reactivos) nunca migrará solo. Una ventana larga cuesta mantenimiento en paralelo y no elimina el riesgo; la fecha</tspan></text><text x="490" y="473.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">de retirada es una decisión de producto con aviso. Todos los porcentajes son supuestos.</tspan></text><text x="490" y="521.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
