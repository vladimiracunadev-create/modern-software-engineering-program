<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Strategy frente a if/elif: tamaño y complejidad crecen distinto con el número de variantes</title><desc id="d">Líneas en escala logarítmica con el tamaño en nodos de sintaxis y la complejidad ciclomática máxima de una función de tarifas según el número de variantes: if y elif pasa de 41 a 191 nodos y de complejidad 3 a 13; Strategy con registro pasa de 85 a 285 nodos y mantiene la complejidad en 2; el patrón cuesta más código y mantiene plana la complejidad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Strategy frente a if/elif: tamaño y complejidad crecen distinto con el número de variantes</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Nodos Strategy</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Nodos if/elif</tspan></text><polygon points="321.58,44.1 328.18,56.4 314.98,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="335.58" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="335.58" dy="0">Complejidad máx. if/elif</tspan></text><polygon points="550.54,43.5 558.04,51 550.54,58.5 543.04,51" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="564.54" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="564.54" dy="0">Complejidad máx. Strategy</tspan></text><line x1="93.7" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="387" x2="93.7" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="287" x2="93.7" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="187" x2="93.7" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="87" x2="93.7" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="87" x2="93.7" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="87" x2="111.7" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="387" x2="111.7" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">2</tspan></text><line x1="267.76" y1="87" x2="267.76" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="267.76" y1="387" x2="267.76" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="267.