<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 361" width="960" height="361" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pregunta por la fuerza antes de elegir el patrón</title><desc id="d">Diagrama de decisión en cuatro cajas: nombrar la fuerza que duele, comprobar que la variación existe hoy y no solo en la imaginación, medir el costo del patrón en tamaño y en indirección y escribir la condición de salida; una flecha de retorno lleva a la primera caja si la fuerza no se puede nombrar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="361" fill="#ffffff"/><rect x="10" y="14" width="284" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="152" y="51" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">FUERZA</tspan></text><text x="152" y="67.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">Nombra qué duele hoy: una variante</tspan></text><text x="152" y="84.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">nueva, un acoplamiento o un fallo</tspan></text><rect x="338" y="14" width="284" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="42.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">EVIDENCIA</tspan></text><text x="480" y="59.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">La variación ya existe en el código</tspan></text><text x="480" y="75.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">o en el backlog, no en la</tspan></text><text x="480" y="92.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">imaginación</tspan></text><polyline points="294,64 338,64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="808" y="51" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">COSTO</tspan></text><text x="808" y="67.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">Mide nodos, indirección y quien</tspan></text><text x="808" y="84.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">tiene que aprenderlo</tspan></text><polyline points="622,64 666,64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="154" width="284" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="191" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="152" dy="0">SALIDA</tspan></text><text x="152" y="207.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="152" dy="0">Escribe cuándo se retirará el patrón</tspan></text><text x="152" y="224.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="152" dy="0">y cómo se sabrá</tspan></text><polyline points="808,114 808,134 152,134 152,154" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="268" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Un patrón sin fuerza nombrada es decoración con costo; con fuerza nombrada, evidencia y salida es una decisión que otra</tspan></text><text x="480" y="309.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">persona puede revisar.</tspan></text><text x="480" y="351.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
