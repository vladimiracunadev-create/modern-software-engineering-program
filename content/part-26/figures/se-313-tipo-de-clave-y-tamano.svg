<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 263" width="940" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tamaño del archivo con 20 000 filas según la clave primaria</title><desc id="d">Barras: la misma tabla de 20 000 filas ocupa 284 KiB con una clave entera, 1 708 KiB con un UUID de texto en una tabla con rowid y 872 KiB con el UUID en una tabla WITHOUT ROWID.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="263" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Clave entera (INTEGER PRIMARY KEY)</tspan></text><rect x="410" y="16" width="102.24" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520.24" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="520.24" dy="0">284 KiB</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Clave UUID como texto, tabla con rowid</tspan></text><rect x="410" y="60" width="614.88" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1032.88" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1032.88" dy="0">1 708 KiB</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Clave UUID como texto, WITHOUT ROWID</tspan></text><rect x="410" y="104" width="313.92" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="731.92" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="731.92" dy="0">872 KiB</tspan></text><rect x="10" y="152" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La clave de 32 caracteres se escribe en la tabla y otra vez en el índice que SQLite crea para ella; sin rowid solo se</tspan></text><text x="470" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escribe una vez, pero las filas se insertan en orden aleatorio y dividen páginas. Seis veces más espacio no es un defecto</tspan></text><text x="470" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de UUID sino de la decisión física.</tspan></text><text x="470" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
