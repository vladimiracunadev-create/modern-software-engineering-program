<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 485" width="940" height="485" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué aporta un catálogo de patrones y cómo se estropea</title><desc id="d">Diagrama de cuatro aportes de un catálogo de patrones, vocabulario común, solución probada, evaluación del diseño y enseñanza, y para cada uno el modo en que se estropea: se usa el nombre sin la estructura, el contexto cambió y la solución se copió igual, se convierte en lista de verificación sin fuerza o se ve patrón donde hay un nombre de clase.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="485" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué aporta un catálogo de patrones y cómo se estropea</tspan></text><rect x="14" y="171.84" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="202.16" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Un catálogo de patrones</tspan></text><text x="139" y="218.8" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">qué aporta y cómo se estropea</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">Vocabulario común</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">funciona: decir «es un Decorator» condensa una estructura conocida · se</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">estropea: se usa el nombre sin que la estructura exista</tspan></text><polyline points="264,206.84 299,206.84 299,83.96 334,83.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="130.92" width="592" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="152.88" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">Solución probada</tspan></text><text x="630" y="169.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">funciona: resuelve un problema recurrente en un contexto · se estropea: el</tspan></text><text x="630" y="186.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">contexto cambió y la solución se copió igual</tspan></text><polyline points="264,206.84 299,206.84 299,165.88 334,165.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="212.84" width="592" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="234.8" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">Evaluación del diseño</tspan></text><text x="630" y="251.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">funciona: da criterios para discutir alternativas · se estropea: se convierte</tspan></text><text x="630" y="268.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">en lista de verificación sin fuerza</tspan></text><polyline points="264,206.84 299,206.84 299,247.8 334,247.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="294.76" width="592" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="316.72" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">Enseñanza</tspan></text><text x="630" y="333.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">funciona: permite entrar a un código ajeno más rápido · se estropea: se ve</tspan></text><text x="630" y="350" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">patrón donde hay un nombre de clase</tspan></text><polyline points="264,206.84 299,206.84 299,329.72 334,329.72" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="378.68" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="403.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La tabla resume el argumento de la clase; la evidencia medida está en la figura anterior y en las siguientes clases de la</tspan></text><text x="470" y="420.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">parte.</tspan></text><text x="470" y="467.96" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
