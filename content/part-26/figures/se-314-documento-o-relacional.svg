<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 441" width="940" height="441" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mismos datos en filas relacionadas y en documentos con el estudiante y el curso embebidos</title><desc id="d">Tabla: leer una entrega cuesta tres filas o un documento de tamaño parecido; el promedio por curso lee unos 104 kilobytes en el modelo relacional y 1 229 kilobytes en el documental; renombrar a un estudiante cambia una fila o dieciséis documentos y, si se corta a mitad, deja ocho con el nombre viejo; el documental ocupa 4,78 veces más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="441" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Operación</tspan></text><rect x="440" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">Filas relacionadas</tspan></text><rect x="660" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Documentos embebidos</tspan></text><rect x="10" y="56" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Leer una entrega con estudiante y curso</tspan></text><rect x="440" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">3 filas, 291 B</tspan></text><rect x="660" y="56" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">1 documento, 305 B</tspan></text><rect x="10" y="110" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Promedio de notas por curso (4 000 entregas)</tspan></text><rect x="440" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">4 000 filas, ≈104 KB</tspan></text><rect x="660" y="110" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">4 000 documentos, 1 229 KB</tspan></text><rect x="10" y="164" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Renombrar a un estudiante con 16 entregas</tspan></text><rect x="440" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">1 fila</tspan></text><rect x="660" y="164" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">16 documentos</tspan></text><rect x="10" y="218" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Mismo cambio, cortado a mitad</tspan></text><rect x="440" y="218" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">Nada o todo</tspan></text><rect x="660" y="218" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">8 de 16 con el nombre viejo</tspan></text><rect x="10" y="272" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Tamaño total de los datos</tspan></text><rect x="440" y="272" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">257 103 B</tspan></text><rect x="660" y="272" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">1 229 093 B (4,78 ×)</tspan></text><rect x="10" y="330" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El documento gana cuando la lectura es siempre la misma entidad completa; pierde cuando el mismo dato se repite y cambia.</tspan></text><text x="470" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los bytes son del JSON de los objetos, no de un motor documental real, y la lectura relacional se midió solo como las dos</tspan></text><text x="470" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">columnas necesarias.</tspan></text><text x="470" y="427.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
