<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Filas de la recursión de prerrequisitos según el límite de profundidad (200 cursos, 291 aristas)</title><desc id="d">Líneas con las filas devueltas por una consulta recursiva según el límite de profundidad 6, 8 y 10: con UNION ALL y un ciclo crece de 62 a 159 y 386 filas, y sin ciclo de 40 a 96 y 226; con UNION y el mismo ciclo devuelve 89 filas y termina sin necesitar límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Filas de la recursión de prerrequisitos según el límite de profundidad (200 cursos, 291 aristas)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">UNION ALL con un ciclo</tspan></text><rect x="229.88" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="249.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">UNION ALL sin ciclo</tspan></text><line x1="78.62" y1="367" x2="910" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="367" x2="78.62" y2="367" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="371.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="297" x2="910" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="297" x2="78.62" y2="297" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="227" x2="910" y2="227" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="227" x2="78.62" y2="227" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="231.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="157" x2="910" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="157" x2="78.62" y2="157" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="161.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="367" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="367" x2="96.62" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="388" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">6</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="367" x2="494.31" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="388" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">8</tspan></text><line x1="892" y1="87" x2="892" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="367" x2="892" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="388" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">10</tspan></text><line x1="78.62" y1="367" x2="910" y2="367" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 227)">Filas devueltas</text><text x="494.31" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Límite de profundidad de la recursión</tspan></text><line x1="78.62" y1="304.7" x2="910" y2="304.7" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="84.62" y="298.7" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="84.62" dy="0">UNION con el ciclo: 89 filas, termina sin límite</tspan></text><polyline points="96.62,323.6 494.31,255.7 892,96.8" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="323.6" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="106.62" y="328.1" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="106.62" dy="0">62</tspan></text><circle cx="494.31" cy="255.7" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="494.31" y="244.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">159</tspan></text><circle cx="892" cy="96.8" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="85.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">386</tspan></text><polyline points="96.62,339 494.31,299.8 892,208.8" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="333.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="96.62" y="363" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">40</tspan></text><rect x="488.81" y="294.3" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="494.31" y="323.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">96</tspan></text><rect x="886.5" y="203.3" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="232.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">226</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El grafo se recorre con una recursión de la base de datos, no con un modelo especial. UNION ALL cuenta caminos y UNION</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cuenta alcanzables (sin ciclos, 478 filas frente a 88 cursos distintos); en un grafo con ciclos la primera necesita un tope</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">y la segunda se detiene sola. El grafo es sintético y las cifras dependen de la semilla.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
