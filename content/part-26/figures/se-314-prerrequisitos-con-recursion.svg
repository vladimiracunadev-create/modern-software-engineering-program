<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 387" width="940" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Prerrequisitos de un curso con una consulta recursiva (grafo de 200 cursos y 291 aristas)</title><desc id="d">Tabla: con UNION ALL la consulta recursiva devuelve rutas y no cursos: 478 filas para 88 cursos distintos; con UNION devuelve los 88 y termina. Con un ciclo, UNION ALL solo se detiene por el límite de profundidad y crece de 62 a 159 y 386 filas, mientras que UNION termina con 89.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="387" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Consulta</tspan></text><rect x="450" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Filas</tspan></text><rect x="640" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Observación</tspan></text><rect x="10" y="56" width="434" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">UNION ALL, grafo sin ciclos, profundidad máxima 12</tspan></text><rect x="450" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">478</tspan></text><rect x="640" y="56" width="284" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">88 cursos distintos</tspan></text><rect x="10" y="110" width="434" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">UNION, grafo sin ciclos</tspan></text><rect x="450" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">88</tspan></text><rect x="640" y="110" width="284" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Termina sin límite</tspan></text><rect x="10" y="164" width="434" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">UNION ALL con un ciclo, límite 6 / 8 / 10</tspan></text><rect x="450" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">62 / 159 / 386</tspan></text><rect x="640" y="164" width="284" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="183.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Crece con el límite (sin ciclo: 40 /</tspan></text><text x="782" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">96 / 226)</tspan></text><rect x="10" y="218" width="434" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">UNION con el mismo ciclo</tspan></text><rect x="450" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">89</tspan></text><rect x="640" y="218" width="284" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Termina sin límite</tspan></text><rect x="10" y="276" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El grafo se recorre con una recursión de la base de datos, no con un modelo especial. UNION ALL cuenta caminos y UNION</tspan></text><text x="470" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cuenta alcanzables; en un grafo con ciclos la primera necesita un tope y la segunda se detiene sola. El grafo es sintético</tspan></text><text x="470" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">y las cifras dependen de la semilla.</tspan></text><text x="470" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
