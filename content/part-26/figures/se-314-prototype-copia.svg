<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 328" width="940" height="328" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Prototype: añadir un destinatario a un clon contamina a los demás si la copia es superficial</title><desc id="d">Barras horizontales con los clones afectados, de 1 000, al añadir un destinatario a uno de ellos: con copia superficial son 1 000 de 1 000 porque comparten la lista con la plantilla, con copia profunda 1 y construyendo desde cero 0; la copia profunda cuesta unos 11 microsegundos frente a 1 de la superficial y 0,6 de construir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="328" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Prototype: añadir un destinatario a un clon contamina a los demás si la copia es superficial</tspan></text><line x1="304" y1="49" x2="304" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="304" y1="163" x2="304" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="304" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="304" dy="0">0</tspan></text><line x1="446.925" y1="49" x2="446.925" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="446.925" y1="163" x2="446.925" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="446.925" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="446.925" dy="0">250</tspan></text><line x1="589.85" y1="49" x2="589.85" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="589.85" y1="163" x2="589.85" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="589.85" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="589.85" dy="0">500</tspan></text><line x1="732.775" y1="49" x2="732.775" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="732.775" y1="163" x2="732.775" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="732.775" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732.775" dy="0">750</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="163" x2="875.7" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="304" y1="163" x2="875.7" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="294" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Copia superficial (copy.copy), ≈1 µs</tspan></text><text x="294" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Copia profunda (copy.deepcopy), ≈11 µs</tspan></text><text x="294" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Construir desde cero, ≈0,6 µs</tspan></text><rect x="304" y="55" width="571.7" height="26" rx="3" fill="#c0432f"/><text x="882.7" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="304" y="93" width="2" height="26" rx="3" fill="#c0432f"/><text x="313" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="313" dy="0">1</tspan></text><rect x="304" y="131" width="2" height="26" rx="3" fill="#c0432f"/><text x="313" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="313" dy="0">0</tspan></text><text x="589.85" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="589.85" dy="0">Clones afectados, de 1 000</tspan></text><rect x="10" y="221" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La copia profunda corrige el defecto compartido y cuesta del orden de diez a veinte veces más que construir. Los tiempos</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">son de un equipo y se dan como orden de magnitud.</tspan></text><text x="470" y="310.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
