<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 333" width="1000" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres clientes suben un contador en todas las intercalaciones posibles (valor correcto: 3)</title><desc id="d">Tabla: con leer-sumar-escribir, de 90 intercalaciones solo 6 terminan en 3; 48 terminan en 1 y 36 en 2 sin ningún aviso. Escribir solo si la versión no cambió acepta exactamente tantas escrituras como el valor final. Un UPDATE atómico termina siempre en 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="333" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Variante</tspan></text><rect x="360" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Intercalaciones</tspan></text><rect x="510" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Final = 3</tspan></text><rect x="670" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Final = 1</tspan></text><rect x="830" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="907" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="907" dy="0">Final = 2</tspan></text><rect x="10" y="56" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Leer, sumar uno y escribir</tspan></text><rect x="360" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">90</tspan></text><rect x="510" y="56" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">6</tspan></text><rect x="670" y="56" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">48</tspan></text><rect x="830" y="56" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">36</tspan></text><rect x="10" y="110" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Escribir solo si la versión no cambió</tspan></text><rect x="360" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">90</tspan></text><rect x="510" y="110" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">6 (3 aceptadas)</tspan></text><rect x="670" y="110" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">36 (1 aceptada)</tspan></text><rect x="830" y="110" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">48 (2 aceptadas)</tspan></text><rect x="10" y="164" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">UPDATE n = n + 1 atómico</tspan></text><rect x="360" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">6</tspan></text><rect x="510" y="164" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">6</tspan></text><rect x="670" y="164" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0</tspan></text><rect x="830" y="164" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">0</tspan></text><rect x="10" y="222" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">La actualización perdida no falla: devuelve éxito a los tres clientes y deja un valor equivocado. La comprobación de versión no</tspan></text><text x="500" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">evita el conflicto, lo vuelve visible para que el cliente reintente. Se ejecutó sobre SQLite con tres conexiones en un hilo y orden</tspan></text><text x="500" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">forzado.</tspan></text><text x="500" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
