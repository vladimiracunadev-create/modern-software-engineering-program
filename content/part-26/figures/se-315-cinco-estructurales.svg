<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco patrones estructurales y el hecho medido de cada uno</title><desc id="d">Diagrama de cinco patrones estructurales con un hecho medido de cada uno: el Adapter unifica dos proveedores en la misma forma, la Facade reduce siete llamadas del cliente a una, el Proxy construye 37 objetos para 1 000 proxies con 37 usos, el Composite necesita una guarda ante un ciclo y el orden de apilado del Decorator cambia la política.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco patrones estructurales y el hecho medido de cada uno</tspan></text><rect x="14" y="204.84" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="235.16" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Cinco patrones estructurales</tspan></text><text x="139" y="251.8" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">la fuerza y el hecho medido</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Adapter</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">dos proveedores con formas distintas · ambos devuelven (id, aceptado) tras la</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">adaptación</tspan></text><polyline points="264,239.84 299,239.84 299,83.96 334,83.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="130.92" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="153.24" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Facade</tspan></text><text x="630" y="169.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">cliente que coordina subsistemas · 7 llamadas del cliente pasan a 1</tspan></text><polyline points="264,239.84 299,239.84 299,157.92 334,157.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="196.92" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="218.88" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Proxy</tspan></text><text x="630" y="235.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">objeto costoso que no siempre se usa · 1 000 proxies, 37 usos, 37 objetos</tspan></text><text x="630" y="252.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">construidos</tspan></text><polyline points="264,239.84 299,239.84 299,231.88 334,231.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="278.84" width="592" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="300.8" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">Composite</tspan></text><text x="630" y="317.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">grupos que contienen grupos · con ciclo: lista correcta con guarda;</tspan></text><text x="630" y="334.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">RecursionError sin ella</tspan></text><polyline points="264,239.84 299,239.84 299,313.8 334,313.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="360.76" width="592" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="382.72" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">Decorator</tspan></text><text x="630" y="399.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">añadir comportamiento sin tocar el objeto · el orden de apilado cambia la</tspan></text><text x="630" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">política</tspan></text><polyline points="264,239.84 299,239.84 299,395.72 334,395.72" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="444.68" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="469.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los cinco comparten una forma (un objeto que envuelve o contiene a otro con la misma interfaz) y se distinguen por la</tspan></text><text x="470" y="486.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">intención: adaptar, simplificar, controlar el acceso, componer o añadir.</tspan></text><text x="470" y="533.96" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
