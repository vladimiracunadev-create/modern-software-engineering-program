<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 574" width="940" height="574" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos órdenes de los mismos decoradores, 3000 peticiones con latencias lognormales</title><desc id="d">Dispersión de la latencia p99 y el éxito de dos órdenes de los mismos decoradores sobre 3 000 peticiones: con el reintento por fuera y un plazo de 80 ms por intento el éxito es 97,5 por ciento, la latencia p99 240 ms y 1,37 llamadas por petición; con el plazo total de 80 ms por fuera de los reintentos el éxito es 71,2 por ciento, la latencia 80 ms y 1,00 llamadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="574" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos órdenes de los mismos decoradores, 3000 peticiones con latencias lognormales</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Reintento por fuera, plazo por intento</tspan></text><rect x="350.52" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="370.52" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="370.52" dy="0">Plazo total por fuera de los reintentos</tspan></text><line x1="78.62" y1="407" x2="910" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="407" x2="78.62" y2="407" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">70</tspan></text><line x1="78.62" y1="247" x2="910" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="247" x2="78.62" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="167" x2="910" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="167" x2="78.62" y2="167" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="171.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">90</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="407" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="407" x2="96.62" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0</tspan></text><line x1="229.183" y1="87" x2="229.183" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="229.183" y1="407" x2="229.183" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="229.183" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="229.183" dy="0">50</tspan></text><line x1="361.747" y1="87" x2="361.747" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="361.747" y1="407" x2="361.747" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="361.747" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="361.747" dy="0">100</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="407" x2="494.31" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">150</tspan></text><line x1="626.873" y1="87" x2="626.873" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="626.873" y1="407" x2="626.873" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="626.873" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.873" dy="0">200</tspan></text><line x1="759.437" y1="87" x2="759.437" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="759.437" y1="407" x2="759.437" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="759.437" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.437" dy="0">250</tspan></text><line x1="892" y1="87" x2="892" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="407" x2="892" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0"></tspan></text><line x1="78.62" y1="407" x2="910" y2="407" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 247)">Éxito (%)</text><text x="494.31" y="453" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Latencia p99 (ms)</tspan></text><circle cx="732.924" cy="107" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="722.924" y="111.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="722.924" dy="0">97,5 % · 240 ms · 1,37 llamadas</tspan></text><rect x="303.221" y="311.9" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="318.721" y="321.9" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="318.721" dy="0">71,2 % · 80 ms · 1,00 llamadas</tspan></text><rect x="10" y="467" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los mismos dos decoradores, apilados en otro orden, producen sistemas con políticas distintas: uno compra éxito con</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">latencia y carga; el otro acota la latencia y pierde peticiones. El orden es una decisión de diseño, no un detalle.</tspan></text><text x="470" y="556.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
