<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 419" width="970" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos docentes de guardia se retiran a la vez: intercalaciones que dejan cero (70 posibles)</title><desc id="d">Tabla: en 70 intercalaciones de dos transacciones que comprueban que quedan dos docentes y se retiran, 60 terminan sin nadie de guardia bajo lectura confirmada y 68 bajo instantánea; con detección de conflictos de lectura-escritura ninguna, a costa de abortar una transacción en 68. SQLite lo evita bloqueando.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="419" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Nivel o motor</tspan></text><rect x="410" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Quedan 0 de guardia</tspan></text><rect x="600" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Abortos o comportamiento</tspan></text><rect x="10" y="56" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Lee lo confirmado (READ COMMITTED)</tspan></text><rect x="410" y="56" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">60</tspan></text><rect x="600" y="56" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">0</tspan></text><rect x="10" y="118" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Lee una instantánea (SNAPSHOT)</tspan></text><rect x="410" y="118" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">68</tspan></text><rect x="600" y="118" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">0</tspan></text><rect x="10" y="180" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Instantánea + detección de lecturas obsoletas</tspan></text><rect x="410" y="180" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0</tspan></text><rect x="600" y="180" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">68</tspan></text><rect x="10" y="242" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">SQLite con dos conexiones DEFERRED</tspan></text><rect x="410" y="242" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0</tspan></text><rect x="600" y="242" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">La segunda escritura y el commit del primero</tspan></text><text x="777" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">fallan con «database is locked»</tspan></text><rect x="10" y="308" width="950" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Las dos transacciones escriben filas distintas, así que ningún conflicto de escritura las detiene: el invariante «al menos uno»</tspan></text><text x="485" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">solo se protege si la lectura también cuenta. El modelo de niveles es una simplificación del autor; SQLite se ejecutó de</tspan></text><text x="485" y="366.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">verdad.</tspan></text><text x="485" y="405.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
