<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 313" width="960" height="313" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco patrones conductuales: qué parte del comportamiento se hace intercambiable</title><desc id="d">Diagrama de cinco cajas en dos filas: Strategy hace intercambiable el algoritmo, Observer hace intercambiables los receptores, Command convierte una acción en un objeto que se puede encolar y deshacer, State hace que el comportamiento dependa de un estado nombrado y Template Method fija el esqueleto y deja pasos variables.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="313" fill="#ffffff"/><rect x="10" y="14" width="284" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="47.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="152" dy="0">STRATEGY</tspan></text><text x="152" y="63.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="152" dy="0">el algoritmo</tspan></text><rect x="338" y="14" width="284" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="47.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">OBSERVER</tspan></text><text x="480" y="63.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">los receptores</tspan></text><polyline points="294,52 338,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="808" y="47.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">COMMAND</tspan></text><text x="808" y="63.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">la acción como objeto</tspan></text><polyline points="622,52 666,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="130" width="284" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="152" y="163.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">STATE</tspan></text><text x="152" y="179.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">el comportamiento según el estado</tspan></text><rect x="338" y="130" width="284" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="163.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="480" dy="0">TEMPLATE METHOD</tspan></text><text x="480" y="179.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="480" dy="0">esqueleto fijo, pasos variables</tspan></text><polyline points="294,168 338,168" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,90 808,110 152,110 152,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="220" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="244.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Todos mueven una decisión de un condicional a un objeto. La pregunta práctica es si el condicional que se elimina crecía de</tspan></text><text x="480" y="261.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">verdad.</tspan></text><text x="480" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
