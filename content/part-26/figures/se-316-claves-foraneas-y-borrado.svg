<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 434" width="940" height="434" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Entregas que quedan tras borrar un curso que tenía 50 de las 100 entregas, según la clave foránea</title><desc id="d">Barras apiladas horizontales con las entregas que quedan de 100 tras borrar un curso con 50 de ellas: con las claves foráneas desactivadas, valor por defecto de SQLite, quedan las 100 y 50 son huérfanas sin que haya error; con NO ACTION o RESTRICT el borrado se rechaza y quedan 100 intactas; con CASCADE quedan 50 porque las otras 50 se borran con el curso; con SET NULL quedan 100, 50 con curso nulo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="434" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Entregas que quedan tras borrar un curso que tenía 50 de las 100 entregas, según la clave foránea</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Con un curso válido</tspan></text><rect x="207.26" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Huérfanas (curso inexistente)</tspan></text><rect x="473.92" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="493.92" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="493.92" dy="0">Con curso nulo</tspan></text><line x1="324" y1="77" x2="324" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="253" x2="324" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="77" x2="434.34" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="253" x2="434.34" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="434.34" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.34" dy="0">20</tspan></text><line x1="544.68" y1="77" x2="544.68" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="544.68" y1="253" x2="544.68" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="544.68" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.68" dy="0">40</tspan></text><line x1="655.02" y1="77" x2="655.02" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="655.02" y1="253" x2="655.02" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="655.02" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.02" dy="0">60</tspan></text><line x1="765.36" y1="77" x2="765.36" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="765.36" y1="253" x2="765.36" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="765.36" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.36" dy="0">80</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="253" x2="875.7" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="324" y1="253" x2="875.7" y2="253" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Cualquier acción, foreign_keys = OFF</tspan></text><text x="314" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">(valor por defecto de SQLite)</tspan></text><text x="314" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">NO ACTION o RESTRICT, foreign_keys = ON</tspan></text><text x="314" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">ON DELETE CASCADE, foreign_keys = ON</tspan></text><text x="314" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">ON DELETE SET NULL, foreign_keys = ON</tspan></text><rect x="324" y="84" width="275.85" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="461.925" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="461.925" dy="0">50</tspan></text><rect x="599.85" y="84" width="275.85" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="737.775" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737.775" dy="0">50</tspan></text><rect x="875.7" y="84" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100</tspan></text><rect x="324" y="128" width="551.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="599.85" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="599.85" dy="0">100</tspan></text><rect x="875.7" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="875.7" y="128" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100</tspan></text><rect x="324" y="172" width="275.85" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="461.925" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="461.925" dy="0">50</tspan></text><rect x="599.85" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="599.85" y="172" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="606.85" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="606.85" dy="0">50</tspan></text><rect x="324" y="216" width="275.85" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="461.925" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="461.925" dy="0">50</tspan></text><rect x="599.85" y="216" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="599.85" y="216" width="275.85" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="737.775" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737.775" dy="0">50</tspan></text><text x="882.7" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100</tspan></text><text x="599.85" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Entregas que quedan en la tabla (de 100)</tspan></text><rect x="10" y="311" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La clave foránea declarada no protege nada si el motor no la aplica. CASCADE, RESTRICT y SET NULL son tres decisiones de</tspan></text><text x="470" y="352.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">negocio distintas sobre qué pasa con las 50 entregas del curso (se borran, se rechaza el borrado, quedan sin curso), no</tspan></text><text x="470" y="369.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">tres sintaxis de lo mismo. Comportamiento de SQLite; otros motores aplican las claves por defecto.</tspan></text><text x="470" y="416.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
