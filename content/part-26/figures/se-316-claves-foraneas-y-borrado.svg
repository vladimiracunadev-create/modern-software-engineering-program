<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 419" width="910" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Borrar un curso con 50 de las 100 entregas de una tabla: efecto según la clave foránea</title><desc id="d">Tabla: con las claves foráneas desactivadas, que es el valor por defecto de SQLite, borrar el curso no da error y deja 50 entregas huérfanas; con ellas activadas, NO ACTION y RESTRICT rechazan, CASCADE borra las 50 entregas y SET NULL las deja con curso nulo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="419" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Configuración</tspan></text><rect x="390" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Resultado</tspan></text><rect x="690" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Entregas</tspan></text><text x="742" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">que quedan</tspan></text><rect x="800" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Huérfanas</tspan></text><rect x="10" y="56" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="79.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Cualquier acción, foreign_keys = OFF (valor por</tspan></text><text x="197" y="95.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">defecto de SQLite)</tspan></text><rect x="390" y="56" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">Borra sin error</tspan></text><rect x="690" y="56" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">100</tspan></text><rect x="800" y="56" width="94" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">50</tspan></text><rect x="10" y="118" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">NO ACTION o RESTRICT, foreign_keys = ON</tspan></text><rect x="390" y="118" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">Rechaza el borrado</tspan></text><rect x="690" y="118" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">100</tspan></text><rect x="800" y="118" width="94" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0</tspan></text><rect x="10" y="180" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">ON DELETE CASCADE, foreign_keys = ON</tspan></text><rect x="390" y="180" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">Borra el curso y 50 entregas</tspan></text><rect x="690" y="180" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">50</tspan></text><rect x="800" y="180" width="94" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0</tspan></text><rect x="10" y="242" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">ON DELETE SET NULL, foreign_keys = ON</tspan></text><rect x="390" y="242" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="265.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">Borra el curso; 50 entregas con curso</tspan></text><text x="537" y="281.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">nulo</tspan></text><rect x="690" y="242" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">100</tspan></text><rect x="800" y="242" width="94" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0</tspan></text><rect x="10" y="308" width="890" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">La clave foránea declarada no protege nada si el motor no la aplica. CASCADE, RESTRICT y SET NULL son tres decisiones</tspan></text><text x="455" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">de negocio distintas sobre qué pasa con las 50 entregas, no tres sintaxis de lo mismo. Comportamiento de SQLite; otros</tspan></text><text x="455" y="366.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">motores aplican las claves por defecto.</tspan></text><text x="455" y="405.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
