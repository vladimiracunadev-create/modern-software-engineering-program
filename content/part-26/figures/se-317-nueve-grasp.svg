<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 341" width="960" height="341" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los nueve principios GRASP agrupados por la pregunta que responden</title><desc id="d">Diagrama de cuatro cajas con los nueve principios GRASP agrupados por pregunta: quién hace el trabajo con Creador, Experto en información y Controlador; cómo se relacionan con Bajo acoplamiento y Alta cohesión; cómo se varía con Polimorfismo y Variaciones protegidas; y cómo se aísla con Indirección y Fabricación pura.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="341" fill="#ffffff"/><rect x="10" y="14" width="448" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="234" y="54.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="234" dy="0">¿QUIÉN HACE EL TRABAJO?</tspan></text><text x="234" y="70.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="234" dy="0">Creador · Experto en información · Controlador</tspan></text><rect x="502" y="14" width="448" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="726" y="54.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="726" dy="0">¿CÓMO SE RELACIONAN?</tspan></text><text x="726" y="70.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="726" dy="0">Bajo acoplamiento · Alta cohesión</tspan></text><polyline points="458,59 502,59" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="144" width="448" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="234" y="184.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="234" dy="0">¿CÓMO SE VARÍA?</tspan></text><text x="234" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="234" dy="0">Polimorfismo · Variaciones protegidas</tspan></text><rect x="502" y="144" width="448" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="726" y="184.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="726" dy="0">¿CÓMO SE AÍSLA?</tspan></text><text x="726" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="726" dy="0">Indirección · Fabricación pura</tspan></text><polyline points="458,189 502,189" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="726,104 726,124 234,124 234,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="248" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="272.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">GRASP son criterios para decidir dónde poner una responsabilidad, no una lista de clases. Dos principios pueden tirar en</tspan></text><text x="480" y="289.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">direcciones opuestas y la decisión es del diseñador.</tspan></text><text x="480" y="331.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
