e="#5b7280" stroke-width="1.6"/><text x="672" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">124 772</tspan></text><rect x="770" y="256" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">18 142</tspan></text><rect x="10" y="310" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El orden de las columnas decide qué consultas ayuda. SQLite, tras ANALYZE, usó un recorrido por saltos (ANY(curso)) para</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">algunas consultas sin el primer prefijo, algo que otros motores no hacen. Pasos medidos, no tiempo.</tspan></text><text x="470" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
