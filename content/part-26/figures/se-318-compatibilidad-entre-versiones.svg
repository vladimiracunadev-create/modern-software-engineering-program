<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué versión de la aplicación funciona con cada estado del esquema</title><desc id="d">Tabla: el renombrado de una columna en un solo paso rompe las dos operaciones de la versión antigua; el estado intermedio con la columna nueva, el relleno y los disparadores de copia permite las cuatro operaciones de ambas versiones; contraer rompe otra vez a la versión antigua, pero ya no debe quedar ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Estado del esquema</tspan></text><rect x="460" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">v1 lee</tspan></text><rect x="570" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">v1 escribe</tspan></text><rect x="700" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">v2 lee</tspan></text><rect x="810" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">v2 escribe</tspan></text><rect x="10" y="56" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Original: columna nombre</tspan></text><rect x="460" y="56" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">Sí</tspan></text><rect x="570" y="56" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">Sí</tspan></text><rect x="700" y="56" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">No</tspan></text><rect x="810" y="56" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">No</tspan></text><rect x="10" y="118" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Renombrar a nombre_completo en un solo paso</tspan></text><rect x="460" y="118" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">No</tspan></text><rect x="570" y="118" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">No</tspan></text><rect x="700" y="118" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Sí</tspan></text><rect x="810" y="118" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">Sí</tspan></text><rect x="10" y="180" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Expandir: añadir la columna, rellenar y copiar con</tspan></text><text x="232" y="219.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">disparadores</tspan></text><rect x="460" y="180" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">Sí</tspan></text><rect x="570" y="180" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">Sí</tspan></text><rect x="700" y="180" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Sí</tspan></text><rect x="810" y="180" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">Sí</tspan></text><rect x="10" y="242" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Contraer: quitar nombre y los disparadores</tspan></text><rect x="460" y="242" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">No</tspan></text><rect x="570" y="242" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">No</tspan></text><rect x="700" y="242" width="104" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Sí</tspan></text><rect x="810" y="242" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">Sí</tspan></text><rect x="10" y="308" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El estado intermedio es el único compatible con las dos versiones y con una vuelta atrás; solo se contrae cuando ya ninguna</tspan></text><text x="470" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">instancia de v1 corre. En el experimento, 0 filas quedaron con nombres distintos o vacíos tras escrituras de ambas</tspan></text><text x="470" y="366.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">versiones.</tspan></text><text x="470" y="405.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
