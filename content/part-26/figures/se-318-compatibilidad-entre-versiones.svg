<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué versión de la aplicación funciona con cada estado del esquema</title><desc id="d">Diagrama de fases con el estado de cada versión de la aplicación al renombrar una columna: renombrar en un solo paso rompe la versión 1 desde el cambio y deja la versión 2 sin funcionar antes de él; expandir, rellenar y copiar con disparadores permite que las dos versiones lean y escriban a la vez, y solo al contraer la versión 1 deja de funcionar, cuando ya no debe quedar ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="480" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué versión de la aplicación funciona con cada estado del esquema</tspan></text><line x1="217.38" y1="83" x2="217.38" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="217.38" y1="299" x2="217.38" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="217.38" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="217.38" dy="0">0</tspan></text><line x1="448.92" y1="83" x2="448.92" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="448.92" y1="299" x2="448.92" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="448.92" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="448.92" dy="0">1</tspan></text><line x1="680.46" y1="83" x2="680.46" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="680.46" y1="299" x2="680.46" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="680.46" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="680.46" dy="0">2</tspan></text><line x1="912" y1="83" x2="912" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="299" x2="912" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">3</tspan></text><line x1="217.38" y1="299" x2="912" y2="299" stroke="#5b7280" stroke-width="1.6"/><text x="207.38" y="114.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Un solo paso: v1</tspan></text><text x="207.38" y="168.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Un solo paso: v2</tspan></text><text x="207.38" y="222.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Expandir y contraer: v1</tspan></text><text x="207.38" y="276.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Expandir y contraer: v2</tspan></text><line x1="448.92" y1="75" x2="448.92" y2="299" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="448.92" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="448.92" dy="0">1: esquema nuevo</tspan></text><line x1="680.46" y1="75" x2="680.46" y2="299" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="680.46" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="680.46" dy="0">2: se quita la columna vieja</tspan></text><rect x="217.38" y="92" width="231.54" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="333.15" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="333.15" dy="0">lee y escribe</tspan></text><rect x="448.92" y="92" width="463.08" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="680.46" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="680.46" dy="0">no lee ni escribe</tspan></text><line x1="14" y1="137" x2="912" y2="137" stroke="#d5dde1" stroke-width="1"/><rect x="217.38" y="146" width="231.54" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="333.15" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="333.15" dy="0">no funciona</tspan></text><rect x="448.92" y="146" width="463.08" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="680.46" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="680.46" dy="0">lee y escribe</tspan></text><line x1="14" y1="191" x2="912" y2="191" stroke="#d5dde1" stroke-width="1"/><rect x="217.38" y="200" width="463.08" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="448.92" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="448.92" dy="0">lee y escribe</tspan></text><rect x="680.46" y="200" width="231.54" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="796.23" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="796.23" dy="0">se rompe</tspan></text><line x1="14" y1="245" x2="912" y2="245" stroke="#d5dde1" stroke-width="1"/><rect x="217.38" y="254" width="231.54" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="333.15" y="276.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="333.15" dy="0">no funciona</tspan></text><rect x="448.92" y="254" width="463.08" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="680.46" y="276.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="680.46" dy="0">lee y escribe</tspan></text><text x="564.69" y="343" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.69" dy="0">Fases del despliegue (no es una escala de tiempo)</tspan></text><rect x="10" y="357" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El estado intermedio es el único compatible con las dos versiones y con una vuelta atrás; solo se contrae cuando ya ninguna</tspan></text><text x="470" y="398.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">instancia de v1 corre. En el experimento, 0 filas quedaron con nombres distintos o vacíos tras escrituras de ambas</tspan></text><text x="470" y="415.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">versiones.</tspan></text><text x="470" y="462.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
