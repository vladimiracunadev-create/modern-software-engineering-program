<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 351" width="940" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pasos de la transacción más larga al rellenar una columna en 100 000 filas</title><desc id="d">Barras: rellenar una columna en 100 000 filas en una sola transacción ocupa 1 400 021 pasos seguidos; en lotes de 20 000, 5 000, 1 000 y 100 filas la transacción más larga baja a 280 023, 70 023, 14 023 y 1 423 pasos. El total apenas cambia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="351" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">1 transacción de 100 000 filas</tspan></text><rect x="340" y="16" width="504" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="852" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="852" dy="0">1 400 021 pasos</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">5 transacciones de 20 000</tspan></text><rect x="340" y="60" width="100.8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="448.8" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="448.8" dy="0">280 023 pasos</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">20 transacciones de 5 000</tspan></text><rect x="340" y="104" width="25.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="373.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="373.2" dy="0">70 023 pasos</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">100 transacciones de 1 000</tspan></text><rect x="340" y="148" width="5.04" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="353.04" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353.04" dy="0">14 023 pasos</tspan></text><text x="330" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">1 000 transacciones de 100</tspan></text><rect x="340" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352" dy="0">1 423 pasos</tspan></text><rect x="10" y="240" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El trabajo total es casi el mismo (1,40 a 1,42 millones de pasos) pero el tiempo que se retiene el bloqueo de escritura</tspan></text><text x="470" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">baja con el tamaño del lote; con lotes más pequeños hay más transacciones. Windows (SQLite 3.45.3); en Ubuntu (3.45.1) las</tspan></text><text x="470" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cifras son 7 % mayores con la misma proporción.</tspan></text><text x="470" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
