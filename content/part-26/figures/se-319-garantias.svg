<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" width="960" height="328" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué garantía de entrega exige qué patrón en el receptor</title><desc id="d">Diagrama de cuatro cajas: al menos una vez puede duplicar y exige un receptor idempotente, como mucho una vez puede perder y exige reconciliación, sin orden garantizado exige un reordenador si el orden importa, y el mensaje que nunca se procesa exige un canal de cartas muertas con alarma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="328" fill="#ffffff"/><rect x="10" y="14" width="448" height="86" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="234" y="52.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="234" dy="0">AL MENOS UNA VEZ</tspan></text><text x="234" y="68.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="234" dy="0">Puede duplicar → Idempotent Receiver</tspan></text><rect x="502" y="14" width="448" height="86" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="726" y="52.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="726" dy="0">COMO MUCHO UNA VEZ</tspan></text><text x="726" y="68.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="726" dy="0">Puede perder → reconciliación</tspan></text><polyline points="458,57 502,57" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="140" width="448" height="86" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="234" y="178.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="234" dy="0">SIN ORDEN</tspan></text><text x="234" y="194.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="234" dy="0">Si importa → Resequencer</tspan></text><rect x="502" y="140" width="448" height="86" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="726" y="178.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="726" dy="0">VENENO</tspan></text><text x="726" y="194.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="726" dy="0">Nunca se procesa → Dead Letter Channel y alarma</tspan></text><polyline points="458,183 502,183" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="726,100 726,120 234,120 234,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="240" width="940" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="270.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cada garantía débil traslada una obligación al receptor. Elegir una garantía es elegir qué patrón se escribe después.</tspan></text><text x="480" y="318" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
