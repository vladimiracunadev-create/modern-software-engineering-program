<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 626" width="940" height="626" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lecturas obsoletas tras una escritura propia: réplicas asíncronas y cuórum (100 000 y 60 000 pruebas)</title><desc id="d">Barras horizontales con el porcentaje de lecturas obsoletas inmediatas a la propia escritura: leer del líder o de una réplica con la versión, 0; de una réplica al azar o siempre de la misma, cerca del 24 por ciento; con tres réplicas, escribir en 1 y leer 1 falla el 66,7 por ciento, escribir 1 y leer 2 o escribir 2 y leer 1 cerca del 33, y con R más W mayor que N ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="626" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lecturas obsoletas tras una escritura propia: réplicas asíncronas y cuórum (100 000 y 60 000 pruebas)</tspan></text><line x1="414" y1="49" x2="414" y2="445" stroke="#d5dde1" stroke-width="1"/><line x1="414" y1="445" x2="414" y2="450" stroke="#5b7280" stroke-width="1.4"/><text x="414" y="466" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="414" dy="0">0</tspan></text><line x1="525.395" y1="49" x2="525.395" y2="445" stroke="#d5dde1" stroke-width="1"/><line x1="525.395" y1="445" x2="525.395" y2="450" stroke="#5b7280" stroke-width="1.4"/><text x="525.395" y="466" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="525.395" dy="0">20</tspan></text><line x1="636.79" y1="49" x2="636.79" y2="445" stroke="#d5dde1" stroke-width="1"/><line x1="636.79" y1="445" x2="636.79" y2="450" stroke="#5b7280" stroke-width="1.4"/><text x="636.79" y="466" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="636.79" dy="0">40</tspan></text><line x1="748.185" y1="49" x2="748.185" y2="445" stroke="#d5dde1" stroke-width="1"/><line x1="748.185" y1="445" x2="748.185" y2="450" stroke="#5b7280" stroke-width="1.4"/><text x="748.185" y="466" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.185" dy="0">60</tspan></text><line x1="859.58" y1="49" x2="859.58" y2="445" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="445" x2="859.58" y2="450" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="466" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">80</tspan></text><line x1="414" y1="445" x2="859.58" y2="445" stroke="#5b7280" stroke-width="1.6"/><text x="404" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="404" dy="0">Leer del líder</tspan></text><text x="404" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="404" dy="0">Réplica al azar (retardo medio 50 ms, lectura a 0–200</tspan></text><text x="404" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="404" dy="0">ms)</tspan></text><text x="404" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="404" dy="0">Siempre la misma réplica</tspan></text><text x="404" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="404" dy="0">Réplica con la versión de la escritura (8,3 % van al</tspan></text><text x="404" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="404" dy="0">líder)</tspan></text><text x="404" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="404" dy="0">Cuórum de 3: escribir en 1 y leer 1</tspan></text><text x="404" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="404" dy="0">Cuórum de 3: escribir en 1 y leer 2</tspan></text><text x="404" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="404" dy="0">Cuórum de 3: escribir en 2 y leer 1</tspan></text><text x="404" y="383.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="404" dy="0">Cuórum de 3: escribir en 2 y leer 2 (R + W &gt; N)</tspan></text><text x="404" y="427.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="404" dy="0">Escribir en las 3 y leer 1, o escribir en 1 y leer 3</tspan></text><rect x="414" y="55" width="2" height="32" rx="3" fill="#c0432f"/><text x="423" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="423" dy="0">0 %</tspan></text><rect x="414" y="99" width="135.735" height="32" rx="3" fill="#c0432f"/><text x="556.735" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="556.735" dy="0">24,37 %</tspan></text><rect x="414" y="143" width="136.236" height="32" rx="3" fill="#c0432f"/><text x="557.236" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="557.236" dy="0">24,46 %</tspan></text><rect x="414" y="187" width="2" height="32" rx="3" fill="#c0432f"/><text x="423" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="423" dy="0">0 %</tspan></text><rect x="414" y="231" width="371.502" height="32" rx="3" fill="#c0432f"/><text x="792.502" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="792.502" dy="0">66,7 %</tspan></text><rect x="414" y="275" width="186.03" height="32" rx="3" fill="#c0432f"/><text x="607.03" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="607.03" dy="0">33,4 %</tspan></text><rect x="414" y="319" width="184.359" height="32" rx="3" fill="#c0432f"/><text x="605.359" y="339.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="605.359" dy="0">33,1 %</tspan></text><rect x="414" y="363" width="2" height="32" rx="3" fill="#c0432f"/><text x="423" y="383.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="423" dy="0">0 %</tspan></text><rect x="414" y="407" width="2" height="32" rx="3" fill="#c0432f"/><text x="423" y="427.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="423" dy="0">0 %</tspan></text><text x="636.79" y="489" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="636.79" dy="0">Lecturas obsoletas tras la propia escritura (%)</tspan></text><rect x="10" y="503" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="527.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Que el 24 % sea alto depende de un retardo medio de 50 ms y una lectura uniforme entre 0 y 200 ms: son supuestos del autor,</tspan></text><text x="470" y="544.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">no medidas de una base real. Lo que se mantiene es la forma: la lectura propia necesita la versión o el líder, y el cuórum</tspan></text><text x="470" y="561.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">solo acierta si las dos mitades se solapan.</tspan></text><text x="470" y="608.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
