<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 571" width="890" height="571" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lecturas obsoletas tras una escritura propia: réplicas asíncronas y cuórum (100 000 y 60 000 pruebas)</title><desc id="d">Tabla: con réplicas asíncronas, leer de una réplica cualquiera devuelve el valor viejo en cerca del 24 por ciento de las lecturas inmediatas a la propia escritura; leer del líder o de una réplica con la versión, ninguna. Con tres réplicas, el cuórum de uno y uno falla en el 66,7 por ciento y cualquier combinación con R más W mayor que N, en ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="571" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Estrategia de lectura</tspan></text><rect x="650" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="762" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">Lecturas obsoletas</tspan></text><rect x="10" y="56" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Leer del líder</tspan></text><rect x="650" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">0 %</tspan></text><rect x="10" y="106" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Leer de una réplica al azar (retardo medio 50 ms, lectura a 0–200 ms)</tspan></text><rect x="650" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">24,37 %</tspan></text><rect x="10" y="156" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Leer siempre de la misma réplica</tspan></text><rect x="650" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">24,46 %</tspan></text><rect x="10" y="206" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Leer de una réplica con la versión de la escritura (8,3 % van al líder)</tspan></text><rect x="650" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">0 %</tspan></text><rect x="10" y="256" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Cuórum de 3 réplicas, escribir en 1 y leer 1</tspan></text><rect x="650" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">66,7 %</tspan></text><rect x="10" y="306" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Escribir en 1 y leer 2, o escribir en 2 y leer 1</tspan></text><rect x="650" y="306" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">33,4 % y 33,1 %</tspan></text><rect x="10" y="356" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="381.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Escribir en 2 y leer 2 (R + W &gt; N)</tspan></text><rect x="650" y="356" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">0 %</tspan></text><rect x="10" y="406" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="431.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Escribir en las 3 y leer 1, o escribir en 1 y leer 3</tspan></text><rect x="650" y="406" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">0 %</tspan></text><rect x="10" y="460" width="870" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="445" y="484.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Que el 24 % sea alto depende de un retardo medio de 50 ms y una lectura uniforme entre 0 y 200 ms: son supuestos del</tspan></text><text x="445" y="501.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">autor, no medidas de una base real. Lo que se mantiene es la forma: la lectura propia necesita la versión o el</tspan></text><text x="445" y="518.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">líder, y el cuórum solo acierta si las dos mitades se solapan.</tspan></text><text x="445" y="557.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
