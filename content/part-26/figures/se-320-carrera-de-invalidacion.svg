<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos de los seis órdenes posibles de un lector y un escritor que dejan la caché con el valor viejo</title><desc id="d">Diagrama de secuencia de dos órdenes de los pasos de un lector (leer la base, llenar la caché) y de un escritor (escribir la base, borrar la clave) que dejan la caché con el valor viejo: en uno de seis órdenes la lectura vieja llega después de borrar la clave; en dos de seis, un lector rellena entre el borrado y la escritura; guardar con versión no deja la caché vieja en ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos de los seis órdenes posibles de un lector y un escritor que dejan la caché con el valor viejo</tspan></text><line x1="274" y1="51" x2="274" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="259" x2="274" y2="264" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="280" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="433.5" y1="51" x2="433.5" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="433.5" y1="259" x2="433.5" y2="264" stroke="#5b7280" stroke-width="1.4"/><text x="433.5" y="280" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433.5" dy="0">1</tspan></text><line x1="593" y1="51" x2="593" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="593" y1="259" x2="593" y2="264" stroke="#5b7280" stroke-width="1.4"/><text x="593" y="280" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="593" dy="0">2</tspan></text><line x1="752.5" y1="51" x2="752.5" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="752.5" y1="259" x2="752.5" y2="264" stroke="#5b7280" stroke-width="1.4"/><text x="752.5" y="280" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752.5" dy="0">3</tspan></text><line x1="912" y1="51" x2="912" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="259" x2="912" y2="264" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="280" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">4</tspan></text><line x1="274" y1="259" x2="912" y2="259" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="73" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Escribir y luego borrar (1 de 6):</tspan></text><text x="264" y="90" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">lector</tspan></text><text x="264" y="125" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Escribir y luego borrar (1 de 6):</tspan></text><text x="264" y="142" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">escritor</tspan></text><text x="264" y="177" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Borrar y luego escribir (2 de 6):</tspan></text><text x="264" y="194" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">lector</tspan></text><text x="264" y="229" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Borrar y luego escribir (2 de 6):</tspan></text><text x="264" y="246" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">escritor</tspan></text><rect x="274" y="60" width="159.5" height="34" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="353.75" y="81.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="353.75" dy="0">R1 lee la base</tspan></text><rect x="752.5" y="60" width="159.5" height="34" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="832.25" y="81.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832.25" dy="0">R2 llena la caché</tspan></text><line x1="14" y1="103" x2="912" y2="103" stroke="#d5dde1" stroke-width="1"/><rect x="433.5" y="112" width="159.5" height="34" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="513.25" y="133.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="513.25" dy="0">W1 escribe la base</tspan></text><rect x="593" y="112" width="159.5" height="34" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="672.75" y="133.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672.75" dy="0">W2 borra la clave</tspan></text><line x1="14" y1="155" x2="912" y2="155" stroke="#d5dde1" stroke-width="1"/><rect x="433.5" y="164" width="159.5" height="34" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="513.25" y="185.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="513.25" dy="0">R1 lee la base</tspan></text><rect x="593" y="164" width="159.5" height="34" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="672.75" y="185.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672.75" dy="0">R2 llena la caché</tspan></text><line x1="14" y1="207" x2="912" y2="207" stroke="#d5dde1" stroke-width="1"/><rect x="274" y="216" width="159.5" height="34" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="353.75" y="237.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="353.75" dy="0">W2 borra la clave</tspan></text><rect x="752.5" y="216" width="159.5" height="34" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="832.25" y="237.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832.25" dy="0">W1 escribe la base</tspan></text><text x="593" y="303" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593" dy="0">Posición en el orden de ejecución (pasos, no segundos)</tspan></text><rect x="10" y="317" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="341.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Mientras la clave no expire, el valor viejo se sirve para siempre: el TTL solo acota cuánto dura. El error aparece una vez</tspan></text><text x="470" y="358.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">en seis intercalaciones, es decir, es raro, no inexistente, y solo se ve con pruebas de intercalación; con la versión</tspan></text><text x="470" y="375.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">guardada y sin pisar una más nueva, 0 de 6. El modelo tiene un lector y un escritor.</tspan></text><text x="470" y="422.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
