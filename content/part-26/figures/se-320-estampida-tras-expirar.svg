<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 471" width="930" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Consultas a la base tras expirar: 1 000 claves, 2 000 lecturas por segundo, TTL de 60 s, recarga de 2 s</title><desc id="d">Tabla: si las 1 000 claves expiran a la vez, el pico llega a 2 000 consultas por segundo sin protección y a 863 con una sola recarga por clave; variar el TTL un 10 por ciento reduce el pico a 423 y a 99; un 30 por ciento a 167 y a 39. El total de consultas baja a unas 2 000 con recarga única.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="471" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Variante</tspan></text><rect x="510" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Pico de consultas por</tspan></text><text x="622" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">segundo</tspan></text><rect x="740" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Consultas en 180 s</tspan></text><rect x="10" y="56" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Todas expiran a la vez, sin protección</tspan></text><rect x="510" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">2 000</tspan></text><rect x="740" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">8 640</tspan></text><rect x="10" y="106" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Todas expiran a la vez, una sola recarga por clave</tspan></text><rect x="510" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">863</tspan></text><rect x="740" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">2 000</tspan></text><rect x="10" y="156" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">TTL con variación de ±10 %, sin protección</tspan></text><rect x="510" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">423</tspan></text><rect x="740" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">9 334</tspan></text><rect x="10" y="206" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">TTL con variación de ±10 %, una sola recarga</tspan></text><rect x="510" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">99</tspan></text><rect x="740" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">2 136</tspan></text><rect x="10" y="256" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">TTL con variación de ±30 %, sin protección</tspan></text><rect x="510" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">167</tspan></text><rect x="740" y="256" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">10 091</tspan></text><rect x="10" y="306" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">TTL con variación de ±30 %, una sola recarga</tspan></text><rect x="510" y="306" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">39</tspan></text><rect x="740" y="306" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">2 354</tspan></text><rect x="10" y="360" width="910" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">El pico y el total miden cosas distintas: la variación del TTL reparte el pico en el tiempo, la recarga única elimina las</tspan></text><text x="465" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">consultas repetidas. Combinadas, el pico baja de 2 000 a 39. Es un modelo discreto de un segundo, con una recarga de 2 s</tspan></text><text x="465" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">supuesta.</tspan></text><text x="465" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
