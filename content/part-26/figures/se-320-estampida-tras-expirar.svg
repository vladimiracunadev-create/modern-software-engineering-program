<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 557" width="940" height="557" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pico de consultas a la base cuando expiran 1 000 claves (TTL de 60 s, recarga de 2 s)</title><desc id="d">Barras agrupadas con el pico de consultas por segundo a la base cuando expiran mil claves: si todas expiran a la vez el pico es de 2 000 sin protección y 863 con una sola recarga por clave; con variación del TTL de 10 por ciento baja a 423 y 99; con 30 por ciento, a 167 y 39.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="557" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pico de consultas a la base cuando expiran 1 000 claves (TTL de 60 s, recarga de 2 s)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin protección</tspan></text><rect x="169.56" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Una sola recarga por clave</tspan></text><line x1="93.7" y1="365" x2="920" y2="365" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="365" x2="93.7" y2="365" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="297.5" x2="920" y2="297.5" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="297.5" x2="93.7" y2="297.5" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="302" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="230" x2="920" y2="230" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="230" x2="93.7" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="234.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="162.5" x2="920" y2="162.5" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="162.5" x2="93.7" y2="162.5" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 500</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="365" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 230)">Pico de consultas a la base por segundo</text><rect x="121.243" y="95" width="108.173" height="270" rx="3" fill="#c0432f"/><text x="175.33" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.33" dy="0">2 000</tspan></text><rect x="233.417" y="248.495" width="108.173" height="116.505" rx="3" fill="#087f8c"/><text x="287.503" y="242.495" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287.503" dy="0">863</tspan></text><text x="231.417" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Todas expiran a la vez</tspan></text><rect x="396.677" y="307.895" width="108.173" height="57.105" rx="3" fill="#c0432f"/><text x="450.763" y="301.895" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.763" dy="0">423</tspan></text><rect x="508.85" y="351.635" width="108.173" height="13.365" rx="3" fill="#087f8c"/><text x="562.937" y="345.635" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.937" dy="0">99</tspan></text><text x="506.85" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">TTL con variación de ±10 %</tspan></text><rect x="672.11" y="342.455" width="108.173" height="22.545" rx="3" fill="#c0432f"/><text x="726.197" y="336.455" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.197" dy="0">167</tspan></text><rect x="784.283" y="359.735" width="108.173" height="5.265" rx="3" fill="#087f8c"/><text x="838.37" y="353.735" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.37" dy="0">39</tspan></text><text x="782.283" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">TTL con variación de ±30 %</tspan></text><rect x="10" y="417" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="441.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El pico y el total miden cosas distintas: la variación del TTL reparte el pico en el tiempo, la recarga única elimina las</tspan></text><text x="470" y="458.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">consultas repetidas (el total en 180 s baja de 8 640 a 2 000 con las claves a la vez, de 10 091 a 2 354 con ±30 %).</tspan></text><text x="470" y="475.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Combinadas, el pico baja de 2 000 a 39. Es un modelo discreto de un segundo, con 2 000 lecturas por segundo y una recarga</tspan></text><text x="470" y="491.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">de 2 s supuesta.</tspan></text><text x="470" y="539.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
