<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 471" width="940" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Políticas de caché sobre 200 000 operaciones (5 % escrituras, 2 000 claves con popularidad Zipf)</title><desc id="d">Tabla: con TTL solo, subir el plazo de 10 a 1 000 operaciones sube los aciertos de 12,7 a 64,6 por ciento y las lecturas obsoletas de 0,21 a 23,73; sin TTL ni invalidación el 85,49 por ciento de las lecturas son obsoletas; invalidar o escribir en la caché al escribir las deja en 0 y mantiene unos 63 a 66 por ciento de aciertos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="471" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Política</tspan></text><rect x="430" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">Aciertos</tspan></text><rect x="560" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Lecturas obsoletas</tspan></text><rect x="750" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Consultas a la base</tspan></text><rect x="10" y="56" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">TTL de 10 operaciones</tspan></text><rect x="430" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">12,7 %</tspan></text><rect x="560" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">0,21 %</tspan></text><rect x="750" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">165 849</tspan></text><rect x="10" y="106" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">TTL de 100 operaciones</tspan></text><rect x="430" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">37,5 %</tspan></text><rect x="560" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">4,41 %</tspan></text><rect x="750" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">118 707</tspan></text><rect x="10" y="156" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">TTL de 1 000 operaciones</tspan></text><rect x="430" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">64,6 %</tspan></text><rect x="560" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">23,73 %</tspan></text><rect x="750" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">67 182</tspan></text><rect x="10" y="206" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Sin TTL ni invalidación</tspan></text><rect x="430" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">98,9 %</tspan></text><rect x="560" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">85,49 %</tspan></text><rect x="750" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">2 000</tspan></text><rect x="10" y="256" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Invalidar al escribir, TTL de 1 000</tspan></text><rect x="430" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">62,9 %</tspan></text><rect x="560" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">0 %</tspan></text><rect x="750" y="256" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">70 507</tspan></text><rect x="10" y="306" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Escribir también en la caché, TTL de 1 000</tspan></text><rect x="430" y="306" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">66,2 %</tspan></text><rect x="560" y="306" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">0 %</tspan></text><rect x="750" y="306" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">64 271</tspan></text><rect x="10" y="360" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El TTL cambia frescura por aciertos; la invalidación elimina la obsolescencia sin perder aciertos, pero solo si la</tspan></text><text x="470" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">invalidación llega siempre. Las obsolescencias no incluyen las carreras de la figura siguiente: aquí el modelo es</tspan></text><text x="470" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">secuencial.</tspan></text><text x="470" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
