<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 306" width="940" height="306" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de un salto adicional (ambassador o sidecar) medido con sockets locales</title><desc id="d">Barras horizontales con la mediana de una petición y su respuesta por sockets locales: unos 61 microsegundos directo del cliente al servidor y unos 122 a través de un intermediario, un salto adicional que cuesta cerca de dos veces la línea base.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="306" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo de un salto adicional (ambassador o sidecar) medido con sockets locales</tspan></text><line x1="294" y1="49" x2="294" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="125" x2="294" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="413.564" y1="49" x2="413.564" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="413.564" y1="125" x2="413.564" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="413.564" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="413.564" dy="0">30</tspan></text><line x1="533.128" y1="49" x2="533.128" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="533.128" y1="125" x2="533.128" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="533.128" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="533.128" dy="0">60</tspan></text><line x1="652.692" y1="49" x2="652.692" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="652.692" y1="125" x2="652.692" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="652.692" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652.692" dy="0">90</tspan></text><line x1="772.256" y1="49" x2="772.256" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="772.256" y1="125" x2="772.256" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="772.256" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772.256" dy="0">120</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="125" x2="891.82" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">150</tspan></text><line x1="294" y1="125" x2="891.82" y2="125" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Cliente → servidor (directo)</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Cliente → ambassador → servidor</tspan></text><rect x="294" y="55" width="243.113" height="26" rx="3" fill="#087f8c"/><text x="544.113" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="544.113" dy="0">61</tspan></text><rect x="294" y="93" width="486.227" height="26" rx="3" fill="#087f8c"/><text x="787.227" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="787.227" dy="0">122</tspan></text><text x="592.91" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592.91" dy="0">Mediana por petición-respuesta (µs)</tspan></text><rect x="10" y="183" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="207.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El sidecar o el ambassador sacan reintentos, TLS o métricas de la aplicación al precio de un salto. En una red real el</tspan></text><text x="470" y="224.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">salto se mide en milisegundos y en el mismo equipo en decenas de microsegundos; esta cifra es de un equipo y de un</tspan></text><text x="470" y="241.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">protocolo trivial.</tspan></text><text x="470" y="288.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
