<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 471" width="890" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Personas únicas según los atributos que se combinan (5 000 personas sintéticas)</title><desc id="d">Tabla: con solo la edad, el grupo más pequeño tiene 90 personas y ninguna es única; con edad y comuna hay 161 personas únicas; con edad, comuna y año, 3 094 de 5 000; con el curso también, 4 876. Generalizar a rangos baja a 2 y a 1 persona única, pero el k mínimo sigue siendo 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="471" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Atributos combinados</tspan></text><rect x="460" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">k mínimo</tspan></text><rect x="570" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Personas únicas</tspan></text><rect x="740" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Grupos</tspan></text><rect x="10"