<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 371" width="960" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocurrencias de un valor identificable en el archivo tras borrar la mitad de 2 000 filas</title><desc id="d">Tabla: borrar 1 000 de 2 000 filas deja 2 087 de las 2 090 ocurrencias en el archivo con el borrado estándar; con secure_delete queda aproximadamente la mitad; VACUUM elimina casi todas las del borrado estándar pero deja 1 085; y una copia hecha antes del borrado conserva las 2 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="371" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Procedimiento</tspan></text><rect x="390" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Antes</tspan></text><rect x="500" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Tras borrar 1 000</tspan></text><rect x="680" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Tras VACUUM</tspan></text><rect x="10" y="56" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Borrado estándar</tspan></text><rect x="390" y="56" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">2 090</tspan></text><rect x="500" y="56" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">2 087</tspan></text><rect x="680" y="56" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">2 087</tspan></text><rect x="10" y="110" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">secure_delete activado</tspan></text><rect x="390" y="110" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">2 000</tspan></text><rect x="500" y="110" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">1 001</tspan></text><rect x="680" y="110" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">1 001</tspan></text><rect x="10" y="164" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Borrado estándar + VACUUM</tspan></text><rect x="390" y="164" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">2 090</tspan></text><rect x="500" y="164" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">2 087</tspan></text><rect x="680" y="164" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">1 085</tspan></text><rect x="10" y="218" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">secure_delete + VACUUM, y copia hecha antes</tspan></text><rect x="390" y="218" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">2 000</tspan></text><rect x="500" y="218" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">1 001</tspan></text><rect x="680" y="218" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">1 000 (la copia conserva 2 000)</tspan></text><rect x="10" y="276" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">DELETE marca el espacio como libre pero no lo sobrescribe: el dato borrado sigue legible en el archivo. El valor de «antes»</tspan></text><text x="480" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">supera 2 000 porque los desbordes de páginas dejan copias viejas. Ninguna política de borrado alcanza las copias de seguridad.</tspan></text><text x="480" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
