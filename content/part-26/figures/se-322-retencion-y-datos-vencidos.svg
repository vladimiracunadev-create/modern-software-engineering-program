<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 418" width="940" height="418" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Eventos de acceso tras 36 meses según la retención (20 000 eventos al mes; plazo legítimo de 12 meses)</title><desc id="d">Barras apiladas horizontales con las filas de eventos de acceso tras 36 meses: sin límite de retención hay 720 000, de las que 480 000 superan los 12 meses; con 24 meses quedan 480 000 y 240 000 vencidas; con 12 meses quedan 240 000 y con 6 meses 120 000, ninguna vencida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="418" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Eventos de acceso tras 36 meses según la retención (20 000 eventos al mes; plazo legítimo de 12 meses)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Dentro del plazo de 12 meses</tspan></text><rect x="275.12" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="295.12" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="295.12" dy="0">Con más de 12 meses (vencidas)</tspan></text><line x1="244" y1="77" x2="244" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="244" y1="237" x2="244" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="244" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">0</tspan></text><line x1="401.925" y1="77" x2="401.925" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="401.925" y1="237" x2="401.925" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="401.925" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="401.925" dy="0">200 000</tspan></text><line x1="559.85" y1="77" x2="559.85" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="559.85" y1="237" x2="559.85" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="559.85" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="559.85" dy="0">400 000</tspan></text><line x1="717.775" y1="77" x2="717.775" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="717.775" y1="237" x2="717.775" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="717.775" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717.775" dy="0">600 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="237" x2="875.7" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">800 000</tspan></text><line x1="244" y1="237" x2="875.7" y2="237" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Sin límite de retención</tspan></text><text x="234" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Conservar 24 meses</tspan></text><text x="234" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Conservar 12 meses</tspan></text><text x="234" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Conservar 6 meses</tspan></text><rect x="244" y="84" width="189.51" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="338.755" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="338.755" dy="0">240 000</tspan></text><rect x="433.51" y="84" width="379.02" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="623.02" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="623.02" dy="0">480 000</tspan></text><text x="819.53" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="819.53" dy="0">720 000</tspan></text><rect x="244" y="124" width="189.51" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="338.755" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="338.755" dy="0">240 000</tspan></text><rect x="433.51" y="124" width="189.51" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="528.265" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="528.265" dy="0">240 000</tspan></text><text x="630.02" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="630.02" dy="0">480 000</tspan></text><rect x="244" y="164" width="189.51" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="338.755" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="338.755" dy="0">240 000</tspan></text><rect x="433.51" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="440.51" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="440.51" dy="0">240 000</tspan></text><rect x="244" y="204" width="94.755" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="291.377" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="291.377" dy="0">120 000</tspan></text><rect x="338.755" y="204" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="345.755" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="345.755" dy="0">120 000</tspan></text><text x="559.85" y="281" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="559.85" dy="0">Filas de eventos tras 36 meses</tspan></text><rect x="10" y="295" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="319.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Es un cálculo aritmético, no una medición: el plazo de 12 meses es un supuesto del autor y cada institución debe fijar el</tspan></text><text x="470" y="336.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">suyo con su base legal (67 % de vencidas sin límite, 50 % con 24 meses). Muestra que una retención sin purga programada</tspan></text><text x="470" y="353.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">convierte datos legítimos en pasivo con el tiempo.</tspan></text><text x="470" y="400.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
