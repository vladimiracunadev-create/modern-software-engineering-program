<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 387" width="870" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Eventos de acceso tras 36 meses según la retención (20 000 eventos al mes; plazo legítimo de 12 meses)</title><desc id="d">Tabla: tras 36 meses con 20 000 eventos al mes, sin retención hay 720 000 filas y 480 000 de ellas con más de 12 meses; con 24 meses de retención quedan 480 000 y 240 000 vencidas; con 12 o 6 meses ninguna vencida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="870" height="387" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Política</tspan></text><rect x="360" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">Filas</tspan></text><rect x="500" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Con más de 12 meses</tspan></text><rect x="720" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Porcentaje</tspan></text><rect x="10" y="56" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Sin límite de retención</tspan></text><rect x="360" y="56" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">720 000</tspan></text><rect x="500" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">480 000</tspan></text><rect x="720" y="56" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">67 %</tspan></text><rect x="10" y="110" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Conservar 24 meses</tspan></text><rect x="360" y="110" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">480 000</tspan></text><rect x="500" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">240 000</tspan></text><rect x="720" y="110" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">50 %</tspan></text><rect x="10" y="164" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Conservar 12 meses</tspan></text><rect x="360" y="164" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">240 000</tspan></text><rect x="500" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">0</tspan></text><rect x="720" y="164" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">0 %</tspan></text><rect x="10" y="218" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Conservar 6 meses</tspan></text><rect x="360" y="218" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">120 000</tspan></text><rect x="500" y="218" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">0</tspan></text><rect x="720" y="218" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">0 %</tspan></text><rect x="10" y="276" width="850" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="435" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="435" dy="0">Es un cálculo aritmético, no una medición: el plazo de 12 meses es un supuesto del autor y cada institución debe</tspan></text><text x="435" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="435" dy="0">fijar el suyo con su base legal. Muestra que una retención sin purga programada convierte datos legítimos en</tspan></text><text x="435" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="435" dy="0">pasivo con el tiempo.</tspan></text><text x="435" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="435" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
