<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 627" width="840" height="627" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Analizador de migraciones sobre 200 mutaciones: 141 detectadas</title><desc id="d">Tabla: un analizador de texto detecta 141 de 200 mutaciones de una migración segura, todas las de forma como un NOT NULL sin valor por defecto, un UPDATE sin WHERE o un índice bloqueante, y ninguna de las 59 que cambian el sentido: un relleno que omite filas, con la columna equivocada, en orden inverso o con un valor por defecto equivocado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="627" fill="#ffffff"/><rect x="10" y="12" width="614" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="317" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="317" dy="0">Mutación</tspan></text><rect x="630" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="614" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="75.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Añadir columna NOT NULL sin valor por defecto</tspan></text><rect x="630" y="56" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="75.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">13 de 13</tspan></text><rect x="10" y="94" width="614" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="113.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Quitar una columna</tspan></text><rect x="630" y="94" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="113.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">17 de 17</tspan></text><rect x="10" y="132" width="614" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="151.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Renombrar una columna</tspan></text><rect x="630" y="132" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="151.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">25 de 25</tspan></text><rect x="10" y="170" width="614" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="189.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">UPDATE sin WHERE</tspan></text><rect x="630" y="170" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="189.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">18 de 18</tspan></text><rect x="10" y="208" width="614" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="227.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Crear un índice que bloquea escrituras</tspan></text><rect x="630" y="208" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="227.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">17 de 17</tspan></text><rect x="10" y="246" width="614" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="265.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Sin plan de reversión</tspan></text><rect x="630" y="246" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="265.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">18 de 18</tspan></text><rect x="10" y="284" width="614" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="303.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Sin tiempo máximo de espera de bloqueo</tspan></text><rect x="630" y="284" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="303.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">15 de 15</tspan></text><rect x="10" y="322" width="614" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="341.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Cambiar el tipo de una columna</tspan></text><rect x="630" y="322" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="341.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">18 de 18</tspan></text><rect x="10" y="360" width="614" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="379.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Relleno que omite filas (nota &gt; 0)</tspan></text><rect x="630" y="360" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="379.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0 de 17</tspan></text><rect x="10" y="398" width="614" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="417.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Relleno con la columna equivocada</tspan></text><rect x="630" y="398" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="417.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0 de 22</tspan></text><rect x="10" y="436" width="614" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="455.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Relleno antes de crear la columna</tspan></text><rect x="630" y="436" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="455.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0 de 11</tspan></text><rect x="10" y="474" width="614" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="493.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Valor por defecto equivocado</tspan></text><rect x="630" y="474" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="493.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0 de 9</tspan></text><rect x="10" y="516" width="820" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="420" y="540.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">Las cuatro mutaciones que no ve son las que dañan los datos sin romper la sintaxis. Las reglas se escribieron</tspan></text><text x="420" y="557.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">conociendo las mutaciones, así que el 100 % por tipo es optimista. El analizador trabaja sobre texto: no</tspan></text><text x="420" y="574.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">ejecuta nada.</tspan></text><text x="420" y="613.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
