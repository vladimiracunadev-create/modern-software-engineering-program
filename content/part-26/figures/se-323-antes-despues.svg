<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tarifa de avisos: función con cadena de condiciones frente a Strategy con registro</title><desc id="d">Puntos unidos por una línea, en escala logarítmica, con tres medidas de una función de tarifas antes y después de refactorizarla a Strategy con registro: la complejidad ciclomática máxima baja de 15 a 3, los nodos de sintaxis suben de 149 a 215 y el tiempo por llamada de unos 260 a unos 380 nanosegundos; las medidas tienen unidades distintas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tarifa de avisos: función con cadena de condiciones frente a Strategy con registro</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Antes</tspan></text><circle cx="107.7" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">Después</tspan></text><line x1="326.18" y1="77" x2="326.18" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="326.18" y1="197" x2="326.18" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="326.18" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="326.18" dy="0">1</tspan></text><line x1="490.627" y1="77" x2="490.627" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="490.627" y1="197" x2="490.627" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="490.627" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.627" dy="0">10</tspan></text><line x1="655.073" y1="77" x2="655.073" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="655.073" y1="197" x2="655.073" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="655.073" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.073" dy="0">100</tspan></text><line x1="819.52" y1="77" x2="819.52" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="819.52" y1="197" x2="819.52" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="819.52" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.52" dy="0">1 000</tspan></text><line x1="326.18" y1="197" x2="819.52" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Complejidad ciclomática máxima</tspan></text><text x="274" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Nodos de sintaxis</tspan></text><text x="274" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Tiempo por llamada (ns)</tspan></text><line x1="519.584" y1="97" x2="404.641" y2="97" stroke="#087f8c" stroke-width="4"/><circle cx="519.584" cy="97" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="404.641" cy="97" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="531.584" y="101.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="531.584" dy="0">15</tspan></text><text x="392.641" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="392.641" dy="0">3</tspan></text><text x="926" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">-80 %</tspan></text><line x1="683.553" y1="137" x2="709.742" y2="137" stroke="#c0432f" stroke-width="4"/><circle cx="683.553" cy="137" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="709.742" cy="137" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="671.553" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="671.553" dy="0">149</tspan></text><text x="721.742" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="721.742" dy="0">215</tspan></text><text x="926" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">+44 %</tspan></text><line x1="723.314" y1="177" x2="750.417" y2="177" stroke="#c0432f" stroke-width="4"/><circle cx="723.314" cy="177" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="750.417" cy="177" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="711.314" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="711.314" dy="0">260</tspan></text><text x="762.417" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="762.417" dy="0">380</tspan></text><text x="926" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">+46 %</tspan></text><text x="572.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="572.85" dy="0">Valor de cada medida (unidades distintas por fila) (escala logarítmica)</tspan></text><rect x="10" y="255" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El refactor compró complejidad por función a cambio de un 44 % más de nodos y una indirección. Si el número de canales no</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">va a crecer, ese costo no se justifica: la condición de salida es volver a una función simple.</tspan></text><text x="470" y="344.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
