<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 259" width="960" height="259" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis mutantes del refactor: cuántos detecta el maestro dorado según la distribución de entradas</title><desc id="d">Gráfico de barras con los mutantes del refactor detectados por un maestro dorado de seis posibles: 2 con 30 entradas aleatorias, 3 con 5000 entradas aleatorias de semilla fija y 6 con 5000 más 384 entradas de frontera.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="259" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">30 entradas al azar</tspan></text><rect x="344" y="16" width="140" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="492" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">2 de 6</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">5000 entradas al azar</tspan></text><rect x="344" y="62" width="210" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="562" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="562" dy="0">3 de 6</tspan></text><text x="334" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">5000 más 384 de frontera</tspan></text><rect x="344" y="108" width="420" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="772" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="772" dy="0">6 de 6</tspan></text><rect x="10" y="156" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="180.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Más entradas al azar no atraparon los tres mutantes de frontera: las entradas no tocaban los valores 50, 100 ni 1000. Un</tspan></text><text x="480" y="197.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">maestro dorado es tan bueno como las entradas que elige; los límites hay que escribirlos.</tspan></text><text x="480" y="245.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
