<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" width="940" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bytes comprimidos para retener 30 días de una base de 40 000 filas y qué hay que encadenar al restaurar</title><desc id="d">Tabla: retener 30 días con copias completas comprimidas ocupa unos 16 millones de bytes y se restaura con una sola copia; con cuatro completas semanales y 26 incrementales ocupa unos 11,6 millones y exige hasta 6 incrementales; con una completa y 29 incrementales, unos 11,1 millones y hasta 29 incrementales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="345" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Política de 30 días</tspan></text><rect x="410" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Bytes comprimidos</tspan></text><text x="517" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">(Windows)</tspan></text><rect x="630" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Para restaurar hay que aplicar</tspan></text><rect x="10" y="56" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">30 copias completas comprimidas</tspan></text><rect x="410" y="56" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">16 237 980</tspan></text><rect x="630" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">1 copia</tspan></text><rect x="10" y="114" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">4 completas semanales + 26 incrementales</tspan></text><rect x="410" y="114" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">11 614 707</tspan></text><rect x="630" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Una completa + hasta 6 incrementales</tspan></text><rect x="10" y="172" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">1 completa + 29 incrementales</tspan></text><rect x="410" y="172" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">11 081 253</tspan></text><rect x="630" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Una completa + hasta 29 incrementales</tspan></text><rect x="10" y="234" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La compresión reduce una copia completa al 18 % y un incremental por páginas, aunque toque el 67 % de las páginas, al 12 %.</tspan></text><text x="470" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los incrementales ahorran un 30 %, pero cada eslabón es un punto de fallo. Con la zlib de Ubuntu las cifras difieren en</tspan></text><text x="470" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">menos de un 1 %.</tspan></text><text x="470" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
