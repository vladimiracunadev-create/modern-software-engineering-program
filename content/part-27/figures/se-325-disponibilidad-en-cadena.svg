<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias encadenadas: peticiones que terminan bien con un fallo del 1 % por llamada</title><desc id="d">Líneas con el porcentaje de 200 000 peticiones que terminan bien según el número de dependencias de la cadena: la cadena síncrona medida cae de 99,02 a 95,20 por ciento y sigue de cerca la curva esperada 0,99 elevado a k; aceptar en una cola y completar con tres intentos por dependencia se queda entre 98,9 y 99,0 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dependencias encadenadas: peticiones que terminan bien con un fallo del 1 % por llamada</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Síncrona medida</tspan></text><rect x="177.1" y="45" width="12" height="12" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Esperado 0,99^k</tspan></text><polygon points="344.2,44.1 350.8,56.4 337.6,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="358.2" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="358.2" dy="0">Cola y 3 intentos por dependencia</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">94</tspan></text><line x1="78.62" y1="337" x2="910" y2="337" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="337" x2="78.62" y2="337" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">95</tspan></text><line x1="78.62" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">96</tspan></text><line x1="78.62" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="237" x2="78.62" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">97</tspan></text><line x1="78.62" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="187" x2="78.62" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">98</tspan></text><line x1="78.62" y1="137" x2="910" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="137" x2="78.62" y2="137" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">99</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="295.465" y1="87" x2="295.465" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="295.465" y1="387" x2="295.465" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="295.465" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295.465" dy="0">2</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="387" x2="494.31" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">3</tspan></text><line x1="693.155" y1="87" x2="693.155" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="693.155" y1="387" x2="693.155" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="693.155" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.155" dy="0">4</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">5</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Peticiones que terminan bien (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Dependencias en la cadena (k)</tspan></text><polyline points="96.62,136 295.465,185 494.31,237.5 693.155,282 892,327" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="136" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="295.465" cy="185" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="494.31" cy="237.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="693.155" cy="282" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="892" cy="327" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polyline points="96.62,137 295.465,186.5 494.31,235.5 693.155,284 892,332" fill="none" stroke="#102a43" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="131.5" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="289.965" y="181" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="488.81" y="230" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="687.655" y="278.5" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="886.5" y="326.5" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><polyline points="96.62,137.5 295.465,136 494.31,137.5 693.155,136.5 892,140.5" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="96.62,131.175 102.67,142.45 90.57,142.45" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="295.465,129.675 301.515,140.95 289.415,140.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="494.31,131.175 500.36,142.45 488.26,142.45" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="693.155,130.175 699.205,141.45 687.105,141.45" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="892,134.175 898.05,145.45 885.95,145.45" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="662" y="293" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="662" dy="0">5 dependencias síncronas:</tspan></text><text x="662" y="310" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="662" dy="0">95,20 % (esperado 95,10 %)</tspan></text><line x1="874.24" y1="323.88" x2="670" y2="288" stroke="#5c1f14" stroke-width="1.2"/><text x="484.31" y="109.5" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="484.31" dy="0">La cola se queda en el 1 %</tspan></text><text x="484.31" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="484.31" dy="0">de su propia cola</tspan></text><line x1="494.15" y1="134.86" x2="492.31" y2="104.5" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La disponibilidad de una cadena síncrona es el producto de las de sus eslabones, por eso cae con cada dependencia. La cola</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no la mejora gratis: mueve el 1 % a la propia cola y convierte el resto en retraso. El eje vertical no empieza en cero para</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">separar las curvas. El fallo del 1 %, independiente entre llamadas, es un supuesto del autor.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
