 stroke-width="2"/><text x="361.691" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="361.691" dy="0">0,113</tspan></text><polygon points="428.052,253.95 435.752,268.3 420.352,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="428.052" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="428.052" dy="0">0,265</tspan></text><polygon points="453.406,253.25 462.156,262 453.406,270.75 444.656,262" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="453.406" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="453.406" dy="0">0,367</tspan></text><line x1="353.717" y1="336" x2="443.943" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="346.717" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="353.717" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="353.717" dy="0">0,102</tspan></text><polygon points="417.024,327.95 424.724,342.3 409.324,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="417.024" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.024" dy="0">0,23</tspan></text><polygon points="443.943,327.25 452.693,336 443.943,344.75 435.193,336" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="443.943" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="443.943" dy="0">0,325</tspan></text><line x1="352.175" y1="410" x2="443.221" y2="410" stroke="#8a9aa3" stroke-width="5"/><rect x="345.175" y="403" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="352.175" y="394" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="352.175" dy="0">0,1</tspan></text><polygon points="416.002,401.95 423.702,416.3 408.302,416.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="416.002" y="439" font-size="13" text-anchor