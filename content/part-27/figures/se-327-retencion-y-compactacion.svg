<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 333" width="960" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reconstruir el estado desde el log: 100 000 eventos sobre 2 000 claves con 5 % de borrados</title><desc id="d">Tabla: el log completo guarda 100 000 entradas y reconstruye las 1 891 claves vivas; conservar solo los últimos 20 000 eventos reconstruye 1 692 y pierde 199 claves que no cambiaron en la ventana; la compactación guarda 1 999 entradas y reconstruye exactamente las mismas 1 891 claves.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="333" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Estrategia de retención</tspan></text><rect x="330" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Entradas</tspan></text><text x="402" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">guardadas</tspan></text><rect x="480" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">Claves vivas</tspan></text><text x="567" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">reconstruidas</tspan></text><rect x="660" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="732" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="732" dy="0">Claves que</tspan></text><text x="732" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="732" dy="0">faltan</tspan></text><rect x="810" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="877" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">Valores</tspan></text><text x="877" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">incorrectos</tspan></text><rect x="10" y="56" width="314" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Log completo</tspan></text><rect x="330" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">100 000</tspan></text><rect x="480" y="56" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">1 891</tspan></text><rect x="660" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">0</tspan></text><rect x="810" y="56" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">0</tspan></text><rect x="10" y="110" width="314" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Retención de los últimos 20 000 eventos</tspan></text><rect x="330" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">20 000</tspan></text><rect x="480" y="110" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">1 692</tspan></text><rect x="660" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">199</tspan></text><rect x="810" y="110" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">0</tspan></text><rect x="10" y="164" width="314" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Compactación (último valor por clave)</tspan></text><rect x="330" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">1 999</tspan></text><rect x="480" y="164" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">1 891</tspan></text><rect x="660" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">0</tspan></text><rect x="810" y="164" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">0</tspan></text><rect x="10" y="222" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">La retención por tiempo o tamaño sirve para eventos; para reconstruir un estado hace falta compactar. Una ventana nunca</tspan></text><text x="480" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">devuelve un valor equivocado pero oculta las claves que no cambiaron, que son las más fáciles de olvidar. Datos sintéticos con</tspan></text><text x="480" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">popularidad Zipf de exponente 1,0.</tspan></text><text x="480" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
