<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 586" width="940" height="586" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Módulos que dependen de la base de datos (40 módulos: 15 de dominio, 10 de aplicación, 8 web, 7 de infraestructura)</title><desc id="d">Barras agrupadas con lo que arrastra un cambio de base de datos en tres estructuras: en las dos por capas dependen de ella 17 de 40 módulos, 3 de ellos de dominio, y hay 30 dependencias del dominio hacia la infraestructura; en la estructura hexagonal dependen 2 módulos, ninguno de dominio, y esas dependencias son 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="586" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Módulos que dependen de la base de datos (40 módulos: 15 de dominio, 10 de aplicación, 8 web, 7 de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">infraestructura)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Módulos dependientes de la BD</tspan></text><rect x="282.66" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="302.66" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">De ellos, de dominio</tspan></text><rect x="481.46" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="501.46" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="501.46" dy="0">Dependencias dominio → infraestructura</tspan></text><line x1="71.08" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="394" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="300.667" x2="920" y2="300.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="300.667" x2="71.08" y2="300.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="305.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="207.333" x2="920" y2="207.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="207.333" x2="71.08" y2="207.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="211.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="114" x2="71.08" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="114" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">Módulos o dependencias (cantidad)</text><rect x="99.3773" y="235.333" width="72.7929" height="158.667" rx="3" fill="#c0432f"/><text x="135.774" y="229.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135.774" dy="0">17</tspan></text><rect x="176.17" y="366" width="72.7929" height="28" rx="3" fill="#946512"/><text x="212.567" y="360" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">3</tspan></text><rect x="252.963" y="114" width="72.7929" height="280" rx="3" fill="#102a43"/><text x="289.36" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="289.36" dy="0">30</tspan></text><text x="212.567" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Capas clásicas</tspan></text><rect x="382.351" y="235.333" width="72.7929" height="158.667" rx="3" fill="#c0432f"/><text x="418.747" y="229.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="418.747" dy="0">17</tspan></text><rect x="459.144" y="366" width="72.7929" height="28" rx="3" fill="#946512"/><text x="495.54" y="360" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">3</tspan></text><rect x="535.936" y="114" width="72.7929" height="280" rx="3" fill="#102a43"/><text x="572.333" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="572.333" dy="0">30</tspan></text><text x="495.54" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Capas con fugas</tspan></text><rect x="665.324" y="375.333" width="72.7929" height="18.6667" rx="3" fill="#c0432f"/><text x="701.72" y="369.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="701.72" dy="0">2</tspan></text><rect x="742.117" y="392" width="72.7929" height="2" rx="3" fill="#946512"/><text x="778.513" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">0</tspan></text><rect x="818.91" y="392" width="72.7929" height="2" rx="3" fill="#102a43"/><text x="855.306" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855.306" dy="0">0</tspan></text><text x="778.513" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Hexagonal</tspan></text><rect x="10" y="446" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="470.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La dirección de la dependencia, no el número de capas, decide cuánto arrastra un cambio: invertirla en el borde</tspan></text><text x="470" y="487.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">(infraestructura → puerto del dominio) reduce los dependientes de 17 a 2. Los grafos son sintéticos con semilla fija y</tspan></text><text x="470" y="504.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">miden estructura, no esfuerzo. Aun así «hexagonal» no garantiza nada si los adaptadores filtran tipos de la base al</tspan></text><text x="470" y="520.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">dominio.</tspan></text><text x="470" y="568.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
