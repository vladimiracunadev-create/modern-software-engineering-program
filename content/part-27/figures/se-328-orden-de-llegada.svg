<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mensajes desordenados: entradas con valor final equivocado de 500 (10 versiones cada una)</title><desc id="d">Líneas con las entradas de 500 que terminan con un valor equivocado según cuántas posiciones puede retrasarse un mensaje: aplicar siempre el último que llega deja 0, 135, 308 y 416 equivocadas con retrasos de 0, 3, 10 y 50 posiciones; aplicar solo si la versión es mayor deja 0 en todos los casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mensajes desordenados: entradas con valor final equivocado de 500 (10 versiones cada una)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aplicar en orden de llegada</tspan></text><rect x="267.58" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="287.58" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="287.58" dy="0">Aplicar solo si la versión es mayor</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">500</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0</tspan></text><line x1="255.696" y1="87" x2="255.696" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="255.696" y1="387" x2="255.696" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="255.696" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255.696" dy="0">10</tspan></text><line x1="414.772" y1="87" x2="414.772" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="414.772" y1="387" x2="414.772" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="414.772" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="414.772" dy="0">20</tspan></text><line x1="573.848" y1="87" x2="573.848" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="573.848" y1="387" x2="573.848" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="573.848" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573.848" dy="0">30</tspan></text><line x1="732.924" y1="87" x2="732.924" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="732.924" y1="387" x2="732.924" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="732.924" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732.924" dy="0">40</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">50</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Entradas con valor final equivocado (de 500)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Desplazamiento máximo de un mensaje (posiciones)</tspan></text><polyline points="96.62,387 144.343,306 255.696,202.2 892,137.4" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="387" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">0</tspan></text><circle cx="144.343" cy="306" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="144.343" y="295" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="144.343" dy="0">135</tspan></text><circle cx="255.696" cy="202.2" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="255.696" y="191.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.696" dy="0">308</tspan></text><circle cx="892" cy="137.4" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="126.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">416</tspan></text><polyline points="96.62,387 144.343,387 255.696,387 892,387" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="381.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">0</tspan></text><rect x="138.843" y="381.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="144.343" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="144.343" dy="0">0</tspan></text><rect x="250.196" y="381.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="255.696" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.696" dy="0">0</tspan></text><rect x="886.5" y="381.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El orden de llegada no es el orden de los hechos; un número de versión por entidad convierte la lectura desordenada en un</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">problema de comparar enteros. La guarda no recupera los valores intermedios: si importan los estados intermedios, hace</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">falta el historial.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
