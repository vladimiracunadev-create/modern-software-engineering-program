<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una prueba de la regla de promedio con tres implementaciones del repositorio (mediana de 60 ejecuciones)</title><desc id="d">Intervalos en escala logarítmica con el rango entre ejecuciones de la mediana de una prueba: un doble en memoria tarda de 0,008 a 0,044 milisegundos, SQLite en memoria de 0,26 a 0,83 y SQLite en un archivo temporal de 102 a 133, miles de veces más que el doble.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="480" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una prueba de la regla de promedio con tres implementaciones del repositorio (mediana de 60 ejecuciones)</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mínimo</tspan></text><polygon points="115.24,44.1 121.84,56.4 108.64,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">máximo</tspan></text><line x1="261.56" y1="77" x2="261.56" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="261.56" y1="299" x2="261.56" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="261.56" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="261.56" dy="0">0,001</tspan></text><line x1="366.3" y1="77" x2="366.3" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="366.3" y1="299" x2="366.3" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="366.3" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="366.3" dy="0">0,01</tspan></text><line x1="471.04" y1="77" x2="471.04" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="471.04" y1="299" x2="471.04" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="471.04" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="471.04" dy="0">0,1</tspan></text><line x1="575.78" y1="77" x2="575.78" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="575.78" y1="299" x2="575.78" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="575.78" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575.78" dy="0">1</tspan></text><line x1="680.52" y1="77" x2="680.52" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="680.52" y1="299" x2="680.52" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="680.52" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="680.52" dy="0">10</tspan></text><line x1="785.26" y1="77" x2="785.26" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="785.26" y1="299" x2="785.26" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="785.26" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785.26" dy="0">100</tspan></text><line x1="890" y1="77" x2="890" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="299" x2="890" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">1 000</tspan></text><line x1="261.56" y1="299" x2="890" y2="299" stroke="#5b7280" stroke-width="1.6"/><text x="231.56" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="231.56" dy="0">Doble en memoria</tspan></text><text x="231.56" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="231.56" dy="0">SQLite en memoria</tspan></text><text x="231.56" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="231.56" dy="0">SQLite en archivo temporal</tspan></text><line x1="356.15" y1="114" x2="433.695" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="349.15" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="356.15" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="356.15" dy="0">0,008</tspan></text><polygon points="433.695,105.95 441.395,120.3 425.995,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="433.695" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.695" dy="0">0,044</tspan></text><line x1="514.504" y1="188" x2="567.304" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="507.504" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="514.504" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="514.504" dy="0">0,26</tspan></text><polygon points="567.304,179.95 575.004,194.3 559.604,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="567.304" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="567.304" dy="0">0,83</tspan></text><line x1="786.161" y1="262" x2="798.232" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="779.161" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="786.161" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="786.161" dy="0">102</tspan></text><polygon points="798.232,253.95 805.932,268.3 790.532,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="798.232" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="798.232" dy="0">133</tspan></text><text x="575.78" y="343" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="575.78" dy="0">Mediana por prueba (ms), rango entre ejecuciones (escala logarítmica)</tspan></text><rect x="10" y="357" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El puerto hace que la regla se pueda probar a velocidad de función. Medición real con crear el repositorio y 20 inserciones</tspan></text><text x="470" y="398.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por prueba; el coste del archivo se debe sobre todo a crear, sincronizar y borrar un archivo, no a la regla. Es la razón</tspan></text><text x="470" y="415.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por la que un doble necesita pruebas de contrato: es rápido, pero no demuestra que el adaptador real se comporte igual.</tspan></text><text x="470" y="462.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición real en bucle local: depende de la máquina; rangos de cinco ejecuciones en Windows y cuatro en Ubuntu (WSL2).</tspan></text></svg>
