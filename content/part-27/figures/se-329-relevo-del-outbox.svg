<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Relevo del outbox con 3 % de caídas entre publicar y marcar (1 000 entregas)</title><desc id="d">Diagrama con dos relevos: publicar y luego marcar como enviado deja 1 029 mensajes en el corredor, 29 duplicados y ninguno perdido, y con la bandeja de entrada 1 000 efectos; marcar y luego publicar deja 971 mensajes, ninguno duplicado y 29 perdidos sin remedio, 971 efectos. La caída entre los dos pasos produce el duplicado o la pérdida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Relevo del outbox con 3 % de caídas entre publicar y marcar (1 000 entregas)</tspan></text><rect x="10" y="48" width="920" height="156" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="70" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Relevo A: publicar y luego marcar</tspan></text><rect x="26" y="88" width="170" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="111" y="108.96" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">1. Publicar el</tspan></text><text x="111" y="126.88" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">mensaje</tspan></text><polyline points="196,114 248,114" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="260" cy="114" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="260" y="119" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="260" dy="0">!</tspan></text><polyline points="272,114 324,114" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="324" y="88" width="170" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="409" y="108.96" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409" dy="0">2. Marcar como</tspan></text><text x="409" y="126.88" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409" dy="0">enviado</tspan></text><text x="260" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="260" dy="0">Caída entre los dos pasos: la fila sigue pendiente y el relevo publica otra vez</tspan></text><polyline points="494,114 542,114" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="542" y="78" width="190" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="637" y="95.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="637" dy="0">Corredor: 1 029</tspan></text><text x="637" y="112.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="637" dy="0">mensajes</tspan></text><text x="637" y="128.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="637" dy="0">29 duplicados, 0</tspan></text><text x="637" y="145.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="637" dy="0">perdidos</tspan></text><polyline points="732,114 754,114" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="754" y="78" width="166" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="837" y="112.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="837" dy="0">Con inbox: 1 000</tspan></text><text x="837" y="128.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="837" dy="0">efectos</tspan></text><rect x="10" y="218" width="920" height="156" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="240" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Relevo B: marcar y luego publicar</tspan></text><rect x="26" y="258" width="170" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="111" y="278.96" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">1. Marcar como</tspan></text><text x="111" y="296.88" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">enviado</tspan></text><polyline points="196,284 248,284" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="260" cy="284" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="260" y="289" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="260" dy="0">!</tspan></text><polyline points="272,284 324,284" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="324" y="258" width="170" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="409" y="278.96" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409" dy="0">2. Publicar el</tspan></text><text x="409" y="296.88" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409" dy="0">mensaje</tspan></text><text x="260" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="260" dy="0">Caída entre los dos pasos: la fila ya está marcada y el mensaje nunca sale</tspan></text><polyline points="494,284 542,284" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="542" y="248" width="190" height="78" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="637" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="637" dy="0">Corredor: 971 mensajes</tspan></text><text x="637" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="637" dy="0">0 duplicados, 29</tspan></text><text x="637" y="307.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="637" dy="0">perdidos</tspan></text><polyline points="732,284 754,284" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="754" y="248" width="166" height="78" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="837" y="274" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="837" dy="0">Con inbox: 971</tspan></text><text x="837" y="290.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="837" dy="0">efectos, 29 sin</tspan></text><text x="837" y="307.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="837" dy="0">remedio</tspan></text></svg>
