<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 435" width="940" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Entregas (de 2000) con estado erróneo según cómo procesa el consumidor</title><desc id="d">Mapa de calor con las entregas erróneas de 2000 según el flujo de eventos y la estrategia del consumidor: los duplicados rompen solo al contador ingenuo, con 1824 entregas; el desorden rompe solo a quien se queda con la última llegada, con 6 y 2 entregas; el contador idempotente y la mayor secuencia dan 0 en todos los flujos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="435" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Entregas (de 2000) con estado erróneo según cómo procesa el consumidor</tspan></text><text x="608" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="608" dy="0">Estrategia del consumidor</tspan></text><text x="374" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374" dy="0">Contador ingenuo</tspan></text><text x="530" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530" dy="0">Contador idempotente</tspan></text><text x="686" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="686" dy="0">Última llegada gana</tspan></text><text x="842" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">Mayor secuencia gana</tspan></text><text x="286" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Sin duplicados ni desorden</tspan></text><text x="286" y="164.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">5 % de duplicados</tspan></text><text x="286" y="208.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Desorden de hasta 30 posiciones</tspan></text><text x="286" y="252.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Duplicados y desorden</tspan></text><rect x="297.5" y="95.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="374" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374" dy="0">0</tspan></text><rect x="453.5" y="95.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="530" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530" dy="0">0</tspan></text><rect x="609.5" y="95.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="686" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="686" dy="0">0</tspan></text><rect x="765.5" y="95.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="842" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">0</tspan></text><rect x="297.5" y="139.5" width="153" height="41" rx="4" fill="#c5513e" stroke="#102a43" stroke-width="3"/><text x="374" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="374" dy="0">1 824</tspan></text><rect x="453.5" y="139.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="530" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530" dy="0">0</tspan></text><rect x="609.5" y="139.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="686" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="686" dy="0">0</tspan></text><rect x="765.5" y="139.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="842" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">0</tspan></text><rect x="297.5" y="183.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="374" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374" dy="0">0</tspan></text><rect x="453.5" y="183.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="530" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530" dy="0">0</tspan></text><rect x="609.5" y="183.5" width="153" height="41" rx="4" fill="#fbe4dd" stroke="#102a43" stroke-width="3"/><text x="686" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="686" dy="0">6</tspan></text><rect x="765.5" y="183.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="842" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">0</tspan></text><rect x="297.5" y="227.5" width="153" height="41" rx="4" fill="#c5513e" stroke="#102a43" stroke-width="3"/><text x="374" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="374" dy="0">1 824</tspan></text><rect x="453.5" y="227.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="530" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530" dy="0">0</tspan></text><rect x="609.5" y="227.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#102a43" stroke-width="3"/><text x="686" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="686" dy="0">2</tspan></text><rect x="765.5" y="227.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="842" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">0</tspan></text><text x="20" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 182)">Flujo de eventos</text><text x="296" y="296" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="296" dy="0">0</tspan></text><rect x="311.54" y="284" width="30.5" height="14" fill="#fbe4de"/><rect x="341.54" y="284" width="30.5" height="14" fill="#f3cdc5"/><rect x="371.54" y="284" width="30.5" height="14" fill="#eab6ac"/><rect x="401.54" y="284" width="30.5" height="14" fill="#e29f93"/><rect x="431.54" y="284" width="30.5" height="14" fill="#d9887a"/><rect x="461.54" y="284" width="30.5" height="14" fill="#d17161"/><rect x="491.54" y="284" width="30.5" height="14" fill="#c85a48"/><rect x="521.54" y="284" width="30.5" height="14" fill="#c0432f"/><text x="559.54" y="296" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="559.54" dy="0">2 000</tspan></text><text x="605.24" y="296" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="605.24" dy="0">más oscuro = mayor (entregas erróneas de 2 000)</tspan></text><rect x="10" y="312" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="336.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los duplicados rompen lo que acumula; el desorden rompe lo que sobrescribe. Un identificador de evento y un número de</tspan></text><text x="470" y="353.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">secuencia por entidad son el contrato mínimo para que un consumidor sea correcto con entrega al-menos-una-vez. 100 000</tspan></text><text x="470" y="370.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">eventos sintéticos sobre 2000 entregas, semilla fija.</tspan></text><text x="470" y="417.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
