<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" width="940" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Réplica tras 2 000 operaciones sobre 10 000 filas (origen: 10 195 filas)</title><desc id="d">Tabla: sondear por una marca de tiempo con mayor estricto deja 11 filas faltantes, 50 desactualizadas y 194 filas borradas que siguen en la réplica; usar mayor o igual corrige las faltantes y las desactualizadas pero no los borrados; un registro de cambios con disparadores deja la réplica idéntica al origen.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="345" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Método de detección</tspan></text><rect x="450" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Filas</tspan></text><text x="517" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">faltantes</tspan></text><rect x="590" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Filas</tspan></text><text x="672" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">desactualizadas</tspan></text><rect x="760" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Filas que debían</tspan></text><text x="842" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">borrarse</tspan></text><rect x="10" y="56" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Sondear por marca de modificación con mayor estricto (&gt;)</tspan></text><rect x="450" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">11</tspan></text><rect x="590" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">50</tspan></text><rect x="760" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">194</tspan></text><rect x="10" y="114" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Sondear con mayor o igual (&gt;=)</tspan></text><rect x="450" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">0</tspan></text><rect x="590" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">0</tspan></text><rect x="760" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">194</tspan></text><rect x="10" y="172" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Registro de cambios con disparadores</tspan></text><rect x="450" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">0</tspan></text><rect x="590" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">0</tspan></text><rect x="760" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0</tspan></text><rect x="10" y="234" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sondear por marca no puede ver un borrado: la fila ya no está para devolver su marca. El mayor estricto además pierde las</tspan></text><text x="470" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">filas modificadas en el mismo segundo que la marca. La resolución de un segundo con 5 operaciones por segundo y el sondeo</tspan></text><text x="470" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cada 47 operaciones son supuestos del autor.</tspan></text><text x="470" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
