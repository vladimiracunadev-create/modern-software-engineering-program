<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Eventos que hay que aplicar para reconstruir un agregado de 10 000 eventos (5000 consultas)</title><desc id="d">Líneas en escala logarítmica con los eventos aplicados al reconstruir según las instantáneas guardadas: sin instantáneas 5021 de media y 9893 en el percentil 99; con 10 instantáneas, una cada 1000 eventos, 507 y 991; con 50, 99 y 198; con 200, 24 y 49. Los eventos aplicados bajan casi en proporción inversa a las instantáneas guardadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Eventos que hay que aplicar para reconstruir un agregado de 10 000 eventos (5000 consultas)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Percentil 99</tspan></text><rect x="154.48" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Media</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="387" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="287" x2="101.24" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="187" x2="101.24" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="87" x2="101.24" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="87" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="87" x2="119.24" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="387" x2="119.24" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">Nunca (0)</tspan></text><line x1="376.827" y1="87" x2="376.827" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="376.827" y1="387" x2="376.827" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="376.827" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="376.827" dy="0">Cada 1 000 eventos (10)</tspan></text><line x1="634.413" y1="87" x2="634.413" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="634.413" y1="387" x2="634.413" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="634.413" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="634.413" dy="0">Cada 200 (50)</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">Cada 50 (200)</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Eventos aplicados al reconstruir (escala logarítmica)</text><text x="505.62" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Política de instantáneas (entre paréntesis, cuántas quedan guardadas)</tspan></text><polyline points="119.24,87.4672 376.827,187.393 634.413,257.333 892,317.98" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="119.24" cy="87.4672" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="119.24" y="76.4672" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">9 893</tspan></text><circle cx="376.827" cy="187.393" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="376.827" y="176.393" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="376.827" dy="0">991</tspan></text><circle cx="634.413" cy="257.333" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="634.413" y="246.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="634.413" dy="0">198</tspan></text><circle cx="892" cy="317.98" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="306.98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">49</tspan></text><polyline points="119.24,116.921 376.827,216.499 634.413,287.436 892,348.979" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="113.74" y="111.421" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="129.24" y="121.421" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="129.24" dy="0">5 021</tspan></text><rect x="371.327" y="210.999" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="376.827" y="240.499" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="376.827" dy="0">507</tspan></text><rect x="628.913" y="281.936" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="634.413" y="311.436" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="634.413" dy="0">99</tspan></text><rect x="886.5" y="343.479" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="372.979" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">24</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El coste de reconstruir es proporcional a la distancia hasta la última instantánea; el de guardarlas, a su número. El</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">agregado «curso» recibe un evento por entrega (4 800 por periodo con 400 estudiantes y 12 tareas): agregados que crecen sin</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">límite piden otro diseño del límite. Se contaron eventos aplicados, no segundos.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
