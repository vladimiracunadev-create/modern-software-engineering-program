<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Retraso del modelo de lectura en un pico de 40 eventos por segundo (5 minutos)</title><desc id="d">Intervalos en escala logarítmica con el retraso mediano y del percentil 99 según la capacidad del proyector: con 60 eventos por segundo el percentil 99 es 0,2 segundos; con 45, 0,8; con 41 sube a 3,3 y supera la recarga a 1 segundo; con 38, por debajo de la llegada, llega a 13,4 y supera también los 5 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Retraso del modelo de lectura en un pico de 40 eventos por segundo (5 minutos)</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p50</tspan></text><polygon points="92.62,44.1 99.22,56.4 86.02,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="106.62" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="106.62" dy="0">p99</tspan></text><line x1="269.62" y1="77" x2="269.62" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="269.62" y1="373" x2="269.62" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="269.62" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="269.62" dy="0">0,01</tspan></text><line x1="424.715" y1="77" x2="424.715" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="424.715" y1="373" x2="424.715" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="424.715" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.715" dy="0">0,1</tspan></text><line x1="579.81" y1="77" x2="579.81" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="579.81" y1="373" x2="579.81" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="579.81" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="579.81" dy="0">1</tspan></text><line x1="734.905" y1="77" x2="734.905" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="734.905" y1="373" x2="734.905" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="734.905" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="734.905" dy="0">10</tspan></text><line x1="890" y1="77" x2="890" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="373" x2="890" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">100</tspan></text><line x1="269.62" y1="373" x2="890" y2="373" stroke="#5b7280" stroke-width="1.6"/><text x="239.62" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="239.62" dy="0">Proyector de 60 por segundo</tspan></text><text x="239.62" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="239.62" dy="0">Proyector de 45 por segundo</tspan></text><text x="239.62" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="239.62" dy="0">Proyector de 41 por segundo</tspan></text><text x="239.62" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="239.62" dy="0">Proyector de 38 por segundo</tspan></text><line x1="316.308" y1="114" x2="471.403" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="309.308" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="316.308" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="316.308" dy="0">0,02</tspan></text><polygon points="471.403,105.95 479.103,120.3 463.703,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="471.403" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="471.403" dy="0">0,2</tspan></text><line x1="362.996" y1="188" x2="564.78" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="355.996" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="362.996" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="362.996" dy="0">0,04</tspan></text><polygon points="564.78,179.95 572.48,194.3 557.08,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="564.78" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="564.78" dy="0">0,8</tspan></text><line x1="390.307" y1="262" x2="660.229" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="383.307" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="390.307" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="390.307" dy="0">0,06</tspan></text><polygon points="660.229,253.95 667.929,268.3 652.529,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="660.229" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="660.229" dy="0">3,3</tspan></text><line x1="417.618" y1="336" x2="754.618" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="410.618" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="417.618" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.618" dy="0">0,09</tspan></text><polygon points="754.618,327.95 762.318,342.3 746.918,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="754.618" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="754.618" dy="0">13,4</tspan></text><line x1="579.81" y1="77" x2="579.81" y2="373" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="584.81" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="584.81" dy="0">recarga a 1 s</tspan></text><line x1="688.217" y1="77" x2="688.217" y2="373" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="693.217" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="693.217" dy="0">a 5 s</tspan></text><text x="579.81" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="579.81" dy="0">Retraso del modelo de lectura (s) (escala logarítmica)</tspan></text><rect x="10" y="431" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="455.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La consistencia eventual es un número, no un adjetivo: depende de cuánto margen tiene el proyector sobre el pico. Cuando la</tspan></text><text x="470" y="472.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">capacidad cae por debajo de la llegada la cola crece mientras dure la ráfaga. Un token de lectura propia (esperar la</tspan></text><text x="470" y="489.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">versión escrita) arregla la percepción de quien escribió sin eliminar el retraso para los demás.</tspan></text><text x="470" y="536.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
