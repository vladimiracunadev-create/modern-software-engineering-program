/tspan></text><rect x="260" y="256" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">No</tspan></text><rect x="430" y="256" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">No</tspan></text><rect x="600" y="256" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">No</tspan></text><rect x="770" y="256" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">No</tspan></text><rect x="10" y="306" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Cambiar el tipo de un campo</tspan></text><rect x="260" y="306" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">No</tspan></text><rect x="430" y="306" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">No</tspan></text><rect x="600" y="306" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">No</tspan></text><rect x="770" y="306" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">No</tspan></text><rect x="10" y="356" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="373.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Volver obligatorio un campo</tspan></text><text x="132" y="389.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">opcional</tspan></text><rect x="260" y="356" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">No</tspan></text><rect x="430" y="356" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">Sí</tspan></text><rect x="600" y="356" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">No</tspan></text><rect x="770" y="356" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">Sí</tspan></text><rect x="10" y="410" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">La compatibilidad depende de quién lee y de cómo: un lector estricto convierte cualquier campo nuevo en un fallo. Se probó</tspan></text><text x="475" y="451.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">con instancias mínimas y máximas de cada versión. Solo se modelan campos simples y tipos primitivos; no se ejecutó ningún</tspan></text><text x="475" y="468.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">registro de esquemas real.</tspan></text><text x="475" y="507.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
