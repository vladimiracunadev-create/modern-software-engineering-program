<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" width="940" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un proveedor renombra un campo: qué falla sin y con capa anticorrupción</title><desc id="d">Tabla: con datos en el formato actual nada falla en ninguno de los dos diseños; cuando el proveedor renombra un campo, seis de seis funciones del diseño sin capa fallan y solo falla el traductor, con un error explícito, en el diseño con capa; el nombre externo aparece en seis lugares sin capa y en uno con ella.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="345" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Situación</tspan></text><rect x="380" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">Sin capa anticorrupción</tspan></text><rect x="640" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Con capa anticorrupción</tspan></text><rect x="10" y="56" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Datos con el formato actual</tspan></text><rect x="380" y="56" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">0 de 6 funciones fallan</tspan></text><rect x="640" y="56" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">0 de 6 funciones fallan</tspan></text><rect x="10" y="114" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">El proveedor renombra cod_alumno a alumno_id</tspan></text><rect x="380" y="114" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">6 de 6 funciones fallan</tspan></text><rect x="640" y="114" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="135.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1 falla: el traductor, con error</tspan></text><text x="782" y="151.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">explícito</tspan></text><rect x="10" y="172" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Lugares del código que mencionan cod_alumno</tspan></text><rect x="380" y="172" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">6</tspan></text><rect x="640" y="172" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1</tspan></text><rect x="10" y="234" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La capa no evita el cambio del proveedor; limita su alcance a un lugar y lo convierte en un error con nombre. El código de</tspan></text><text x="470" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">seis funciones lo escribió el autor para el ejercicio, ejecutado de verdad con exec; no es una medida de ningún proyecto</tspan></text><text x="470" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">real.</tspan></text><text x="470" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
