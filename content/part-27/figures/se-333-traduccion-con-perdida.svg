<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 441" width="900" height="441" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ida y vuelta de 5 000 registros: qué se recupera al volver al modelo externo</title><desc id="d">Tabla: traducir nueve códigos de estado externos a cuatro del dominio impide recuperar el original en 2 813 de 5 000 registros; convertir la nota de 0 a 100 a una escala de 1,0 a 7,0 con un decimal altera 1 912; ambas juntas alteran 3 659; con tres decimales o conservando el código externo original no se altera ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="441" fill="#ffffff"/><rect x="10" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="267" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="267" dy="0">Traducción</tspan></text><rect x="530" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">No se recuperan</tspan></text><rect x="710" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Se recuperan</tspan></text><rect x="10" y="56" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Estado: 9 códigos externos a 4 del dominio</tspan></text><rect x="530" y="56" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">2 813</tspan></text><rect x="710" y="56" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">2 187</tspan></text><rect x="10" y="110" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Nota: de 0 a 100 a 1,0 a 7,0 con un decimal</tspan></text><rect x="530" y="110" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">1 912</tspan></text><rect x="710" y="110" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">3 088</tspan></text><rect x="10" y="164" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Ambas traducciones a la vez</tspan></text><rect x="530" y="164" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">3 659</tspan></text><rect x="710" y="164" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">1 341</tspan></text><rect x="10" y="218" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Nota con tres decimales</tspan></text><rect x="530" y="218" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">0</tspan></text><rect x="710" y="218" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">5 000</tspan></text><rect x="10" y="272" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Estado traducido y código externo original conservado</tspan></text><rect x="530" y="272" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">0</tspan></text><rect x="710" y="272" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">5 000</tspan></text><rect x="10" y="330" width="880" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Traducir es resumir y resumir pierde información. Si algún proceso debe devolver el dato al sistema externo, hay que</tspan></text><text x="450" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">conservar el original junto al traducido o ampliar la precisión del modelo. Asignación de estados 9 a 4 y reparto</tspan></text><text x="450" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">uniforme: supuestos del autor.</tspan></text><text x="450" y="427.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
