<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 478" width="940" height="478" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ida y vuelta de 5 000 registros: qué se recupera al volver al modelo externo</title><desc id="d">Barras apiladas horizontales con los registros de 5 000 que se recuperan o no al volver al modelo externo: traducir nueve estados a cuatro impide recuperar el original en 2 813; convertir la nota de 0 a 100 a 1,0 a 7,0 con un decimal altera 1 912; ambas juntas alteran 3 659; con tres decimales o conservando el código externo original no se altera ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="478" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ida y vuelta de 5 000 registros: qué se recupera al volver al modelo externo</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">No se recuperan</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Se recuperan</tspan></text><line x1="364" y1="77" x2="364" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="364" y1="297" x2="364" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="364" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364" dy="0">0</tspan></text><line x1="466.34" y1="77" x2="466.34" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="466.34" y1="297" x2="466.34" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="466.34" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="466.34" dy="0">1 000</tspan></text><line x1="568.68" y1="77" x2="568.68" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="568.68" y1="297" x2="568.68" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="568.68" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="568.68" dy="0">2 000</tspan></text><line x1="671.02" y1="77" x2="671.02" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="671.02" y1="297" x2="671.02" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="671.02" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="671.02" dy="0">3 000</tspan></text><line x1="773.36" y1="77" x2="773.36" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="773.36" y1="297" x2="773.36" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="773.36" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="773.36" dy="0">4 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="297" x2="875.7" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5 000</tspan></text><line x1="364" y1="297" x2="875.7" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="354" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Estado: 9 códigos externos a 4 del dominio</tspan></text><text x="354" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Nota: de 0 a 100 a 1,0 a 7,0 con un decimal</tspan></text><text x="354" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Ambas traducciones a la vez</tspan></text><text x="354" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Nota con tres decimales</tspan></text><text x="354" y="271" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Estado traducido y código externo original</tspan></text><text x="354" y="288" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">conservado</tspan></text><rect x="364" y="84" width="287.882" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="507.941" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507.941" dy="0">2 813</tspan></text><rect x="651.882" y="84" width="223.818" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="763.791" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="763.791" dy="0">2 187</tspan></text><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5 000</tspan></text><rect x="364" y="128" width="195.674" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="461.837" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="461.837" dy="0">1 912</tspan></text><rect x="559.674" y="128" width="316.026" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="717.687" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717.687" dy="0">3 088</tspan></text><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5 000</tspan></text><rect x="364" y="172" width="374.462" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="551.231" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="551.231" dy="0">3 659</tspan></text><rect x="738.462" y="172" width="137.238" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="807.081" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807.081" dy="0">1 341</tspan></text><text x="882.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5 000</tspan></text><rect x="364" y="216" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="364" y="216" width="511.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="619.85" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="619.85" dy="0">5 000</tspan></text><text x="882.7" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5 000</tspan></text><rect x="364" y="260" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="364" y="260" width="511.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="619.85" y="279.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="619.85" dy="0">5 000</tspan></text><text x="882.7" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5 000</tspan></text><text x="619.85" y="341" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="619.85" dy="0">Registros de 5 000</tspan></text><rect x="10" y="355" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="379.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Traducir es resumir y resumir pierde información. Si algún proceso debe devolver el dato al sistema externo, hay que</tspan></text><text x="470" y="396.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">conservar el original junto al traducido o ampliar la precisión del modelo. Asignación de estados 9 a 4 y reparto uniforme:</tspan></text><text x="470" y="413.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuestos del autor.</tspan></text><text x="470" y="460.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
