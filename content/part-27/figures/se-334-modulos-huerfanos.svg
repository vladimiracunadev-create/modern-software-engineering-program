<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Módulos sin nadie que los conozca según cuántas personas los conocen y cuántas se van (escala logarítmica)</title><desc id="d">Líneas en escala logarítmica con el porcentaje de módulos que quedan sin conocimiento según la fracción del equipo que se va: con una persona por módulo 5,04, 14,94 y 29,99 por ciento al irse el 5, el 15 y el 30; con dos personas 0,24, 2,13 y 8,83; con tres 0,01, 0,32 y 2,69; cada persona más baja el riesgo en un factor entre seis y siete.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Módulos sin nadie que los conozca según cuántas personas los conocen y cuántas se van (escala logarítmica)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Una persona por módulo</tspan></text><rect x="229.88" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="249.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">Dos personas por módulo</tspan></text><polygon points="457.3,44.1 463.9,56.4 450.7,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="471.3" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="471.3" dy="0">Tres personas por módulo</tspan></text><line x1="86.16" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="387" x2="86.16" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,01</tspan></text><line x1="86.16" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="312" x2="86.16" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,1</tspan></text><line x1="86.16" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="237" x2="86.16" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1</tspan></text><line x1="86.16" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="162" x2="86.16" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">10</tspan></text><line x1="86.16" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="87" x2="86.16" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">100</tspan></text><line x1="86.16" y1="87" x2="86.16" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="104.16" y1="87" x2="104.16" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="104.16" y1="387" x2="104.16" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="104.16" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.16" dy="0">5 %</tspan></text><line x1="419.296" y1="87" x2="419.296" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="419.296" y1="387" x2="419.296" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="419.296" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="419.296" dy="0">15 %</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">30 %</tspan></text><line x1="86.16" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Módulos sin conocimiento (%) (escala logarítmica)</text><text x="498.08" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="498.08" dy="0">Personas que se van del equipo (%)</tspan></text><polyline points="104.16,184.318 419.296,148.924 892,126.227" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="104.16" cy="184.318" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="104.16" y="173.318" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">5,04</tspan></text><circle cx="419.296" cy="148.924" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="419.296" y="137.924" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="419.296" dy="0">14,94</tspan></text><circle cx="892" cy="126.227" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="115.227" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">29,99</tspan></text><polyline points="104.16,283.484 419.296,212.372 892,166.053" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="98.66" y="277.984" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="104.16" y="272.484" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">0,24</tspan></text><rect x="413.796" y="206.872" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="419.296" y="201.372" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="419.296" dy="0">2,13</tspan></text><rect x="886.5" y="160.553" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="155.053" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">8,83</tspan></text><polyline points="104.16,387 419.296,274.114 892,204.769" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="104.16,380.675 110.21,391.95 98.11,391.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="104.16" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">0,01</tspan></text><polygon points="419.296,267.789 425.346,279.064 413.246,279.064" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="419.296" y="263.114" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="419.296" dy="0">0,32</tspan></text><polygon points="892,198.444 898.05,209.719 885.95,209.719" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="193.769" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">2,69</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Pasar de una a dos personas por módulo reduce el riesgo unas siete veces (14,94 % → 2,13 %); pasar de dos a tres, algo más</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de seis. El resultado es q^k con salidas independientes; las salidas reales se correlacionan (reorganizaciones, un mismo</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">proyecto). Además, con un propietario principal por módulo, 5 de 15 personas concentran la mitad de los 60 módulos.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
