<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Segundos hasta la primera alarma desde el inicio de cada falla, según la señal vigilada</title><desc id="d">Tabla: la profundidad de la cola detecta al consumidor lento a los 101 segundos pero nunca al productor parado; la edad del mensaje más viejo es más lenta que la profundidad; la tasa de procesados detecta consumidores colgados y venenosos a los 25 segundos pero da una falsa alarma cuando el productor se detiene; la tasa de errores solo detecta el mensaje venenoso, a los 10 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Falla</tspan></text><rect x="340" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="407" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407" dy="0">Profundidad &gt;</tspan></text><text x="407" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407" dy="0">50</tspan></text><rect x="480" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Edad &gt; 60 s</tspan></text><rect x="600" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">Procesados &lt; 5 en 30 s</tspan></text><rect x="800" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Errores &gt; 10</tspan></text><text x="862" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">en 30 s</tspan></text><rect x="10" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Consumidor lento (mitad de capacidad)</tspan></text><rect x="340" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">101 s</tspan></text><rect x="480" y="56" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">123 s</tspan></text><rect x="600" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">nunca</tspan></text><rect x="800" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">nunca</tspan></text><rect x="10" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Consumidor colgado</tspan></text><rect x="340" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">50 s</tspan></text><rect x="480" y="114" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">61 s</tspan></text><rect x="600" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">25 s</tspan></text><rect x="800" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">nunca</tspan></text><rect x="10" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Mensaje venenoso que se reintenta</tspan></text><rect x="340" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">50 s</tspan></text><rect x="480" y="172" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">61 s</tspan></text><rect x="600" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">25 s</tspan></text><rect x="800" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">10 s</tspan></text><rect x="10" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Productor parado</tspan></text><rect x="340" y="230" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">nunca</tspan></text><rect x="480" y="230" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">nunca</tspan></text><rect x="600" y="230" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">25 s (falsa alarma)</tspan></text><rect x="800" y="230" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">nunca</tspan></text><rect x="10" y="292" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ninguna señal detecta todo: cada falla se ve en una señal distinta y una misma señal confunde fallas diferentes. Se vigilan</tspan></text><text x="470" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">al menos profundidad, edad, procesados y errores, y se interpretan juntas. Umbrales fijos y llegada de un mensaje por</tspan></text><text x="470" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">segundo: supuestos del autor.</tspan></text><text x="470" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
