<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco formas de provocar duplicados en un consumidor sin defensa (2 000 mensajes)</title><desc id="d">Barras horizontales con los efectos duplicados de 2 000 mensajes que produce cada causa en un consumidor sin defensa: la visibilidad de 30 segundos menor que el proceso 378, el reinicio de desplazamientos 200, el acuse perdido 122, la caída antes de acusar 106 y el reintento del productor 103.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco formas de provocar duplicados en un consumidor sin defensa (2 000 mensajes)</tspan></text><line x1="364" y1="49" x2="364" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="364" y1="269" x2="364" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="364" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364" dy="0">0</tspan></text><line x1="495.955" y1="49" x2="495.955" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="495.955" y1="269" x2="495.955" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="495.955" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.955" dy="0">100</tspan></text><line x1="627.91" y1="49" x2="627.91" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="627.91" y1="269" x2="627.91" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="627.91" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627.91" dy="0">200</tspan></text><line x1="759.865" y1="49" x2="759.865" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="759.865" y1="269" x2="759.865" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="759.865" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.865" dy="0">300</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="269" x2="891.82" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">400</tspan></text><line x1="364" y1="269" x2="891.82" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="354" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Visibilidad de 30 s menor que el proceso</tspan></text><text x="354" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">(mediana 16 s)</tspan></text><text x="354" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Reinicio de desplazamientos (200 releídos)</tspan></text><text x="354" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Acuse perdido en la red (5 % de los acuses)</tspan></text><text x="354" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Caída del consumidor antes de acusar (5 %)</tspan></text><text x="354" y="243" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Reintento del productor tras un tiempo agotado</tspan></text><text x="354" y="260" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">(5 %, otro id)</tspan></text><rect x="364" y="55" width="498.79" height="32" rx="3" fill="#c0432f"/><text x="869.79" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="869.79" dy="0">378</tspan></text><rect x="364" y="99" width="263.91" height="32" rx="3" fill="#c0432f"/><text x="634.91" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="634.91" dy="0">200</tspan></text><rect x="364" y="143" width="160.985" height="32" rx="3" fill="#c0432f"/><text x="531.985" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="531.985" dy="0">122</tspan></text><rect x="364" y="187" width="139.872" height="32" rx="3" fill="#c0432f"/><text x="510.872" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="510.872" dy="0">106</tspan></text><rect x="364" y="231" width="135.914" height="32" rx="3" fill="#c0432f"/><text x="506.914" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="506.914" dy="0">103</tspan></text><text x="627.91" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="627.91" dy="0">Efectos duplicados de 2 000 mensajes</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cinco causas distintas producen el mismo síntoma, un efecto repetido, y se defienden de formas distintas. La de visibilidad</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es la más cara porque depende del tiempo de proceso y no de un fallo. Las probabilidades y la distribución del tiempo de</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">proceso son supuestos del autor.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
