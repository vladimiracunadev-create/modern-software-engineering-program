<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 479" width="940" height="479" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Efectos duplicados que quedan según la defensa y la causa del duplicado</title><desc id="d">Mapa de calor con los efectos duplicados de 2 000 mensajes que quedan según cinco defensas y cinco causas: sin defensa quedan 106, 122, 103, 378 y 200; la clave del mensaje elimina todos salvo los 103 del reintento del productor, que llegan con otro identificador; la clave de negocio única, la actualización condicionada por versión y la operación idempotente dejan cero en todas las causas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="479" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Efectos duplicados que quedan según la defensa y la causa del duplicado</tspan></text><text x="618" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="618" dy="0">Causa del duplicado</tspan></text><text x="376.4" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="376.4" dy="0">Caída</tspan></text><text x="497.2" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="497.2" dy="0">Acuse</tspan></text><text x="618" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="618" dy="0">Productor</tspan></text><text x="738.8" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="738.8" dy="0">Visibilidad</tspan></text><text x="859.6" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.6" dy="0">Desplazamientos</tspan></text><text x="306" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="306" dy="0">Ninguna</tspan></text><text x="306" y="164.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="306" dy="0">Clave del mensaje</tspan></text><text x="306" y="208.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="306" dy="0">Clave de negocio única</tspan></text><text x="306" y="244" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="306" dy="0">Actualización condicionada por</tspan></text><text x="306" y="261" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="306" dy="0">versión</tspan></text><text x="306" y="296.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="306" dy="0">Operación naturalmente idempotente</tspan></text><rect x="317.5" y="95.5" width="117.8" height="41" rx="4" fill="#eab7ad" stroke="#ffffff" stroke-width="1"/><text x="376.4" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="376.4" dy="0">106</tspan></text><rect x="438.3" y="95.5" width="117.8" height="41" rx="4" fill="#e8b0a6" stroke="#ffffff" stroke-width="1"/><text x="497.2" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="497.2" dy="0">122</tspan></text><rect x="559.1" y="95.5" width="117.8" height="41" rx="4" fill="#ebb8ae" stroke="#ffffff" stroke-width="1"/><text x="618" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="618" dy="0">103</tspan></text><rect x="679.9" y="95.5" width="117.8" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="738.8" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="738.8" dy="0">378</tspan></text><rect x="800.7" y="95.5" width="117.8" height="41" rx="4" fill="#dc8f81" stroke="#ffffff" stroke-width="1"/><text x="859.6" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.6" dy="0">200</tspan></text><rect x="317.5" y="139.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="376.4" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="376.4" dy="0">0</tspan></text><rect x="438.3" y="139.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="497.2" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="497.2" dy="0">0</tspan></text><rect x="559.1" y="139.5" width="117.8" height="41" rx="4" fill="#ebb8ae" stroke="#102a43" stroke-width="3"/><text x="618" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="618" dy="0">103</tspan></text><rect x="679.9" y="139.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="738.8" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="738.8" dy="0">0</tspan></text><rect x="800.7" y="139.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="859.6" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.6" dy="0">0</tspan></text><rect x="317.5" y="183.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="376.4" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="376.4" dy="0">0</tspan></text><rect x="438.3" y="183.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="497.2" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="497.2" dy="0">0</tspan></text><rect x="559.1" y="183.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="618" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="618" dy="0">0</tspan></text><rect x="679.9" y="183.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="738.8" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="738.8" dy="0">0</tspan></text><rect x="800.7" y="183.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="859.6" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.6" dy="0">0</tspan></text><rect x="317.5" y="227.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="376.4" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="376.4" dy="0">0</tspan></text><rect x="438.3" y="227.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="497.2" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="497.2" dy="0">0</tspan></text><rect x="559.1" y="227.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="618" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="618" dy="0">0</tspan></text><rect x="679.9" y="227.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="738.8" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="738.8" dy="0">0</tspan></text><rect x="800.7" y="227.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="859.6" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.6" dy="0">0</tspan></text><rect x="317.5" y="271.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="376.4" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="376.4" dy="0">0</tspan></text><rect x="438.3" y="271.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="497.2" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="497.2" dy="0">0</tspan></text><rect x="559.1" y="271.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="618" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="618" dy="0">0</tspan></text><rect x="679.9" y="271.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="738.8" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="738.8" dy="0">0</tspan></text><rect x="800.7" y="271.5" width="117.8" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="859.6" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.6" dy="0">0</tspan></text><text x="20" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 204)">Defensa</text><text x="316" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="316" dy="0">0</tspan></text><rect x="331.54" y="328" width="30.5" height="14" fill="#fbe4de"/><rect x="361.54" y="328" width="30.5" height="14" fill="#f3cdc5"/><rect x="391.54" y="328" width="30.5" height="14" fill="#eab6ac"/><rect x="421.54" y="328" width="30.5" height="14" fill="#e29f93"/><rect x="451.54" y="328" width="30.5" height="14" fill="#d9887a"/><rect x="481.54" y="328" width="30.5" height="14" fill="#d17161"/><rect x="511.54" y="328" width="30.5" height="14" fill="#c85a48"/><rect x="541.54" y="328" width="30.5" height="14" fill="#c0432f"/><text x="579.54" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="579.54" dy="0">378</tspan></text><text x="610.16" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="610.16" dy="0">más oscuro = mayor (efectos duplicados)</tspan></text><rect x="10" y="356" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="380.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La clave del mensaje no ve duplicados que nacen antes del corredor: el reintento del productor (contorno) crea un mensaje</tspan></text><text x="470" y="397.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">nuevo con el mismo contenido. La clave de negocio atrapa todas las causas porque no depende de cómo llegó el duplicado,</tspan></text><text x="470" y="414.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">pero exige saber qué identifica una operación. SQLite real.</tspan></text><text x="470" y="461.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
