<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 461" width="940" height="461" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Flujo de entrega, calificación y aviso con fallas inyectadas (3 000 entregas)</title><desc id="d">Tabla: sin outbox, bandeja de entrada ni cola de fallidos el flujo deja 74 entregas sin calificar, 171 calificadas dos veces, 291 sin aviso, 153 avisadas dos veces y un mensaje venenoso que bloquea los 2 793 que le siguen; el flujo tolerante deja cero en todas las invariantes y aparta los 15 venenosos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="461" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Invariante</tspan></text><rect x="360" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Flujo ingenuo</tspan></text><rect x="650" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Flujo tolerante</tspan></text><rect x="10" y="56" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Entregas sin calificación</tspan></text><rect x="360" y="56" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">74</tspan></text><rect x="650" y="56" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">0</tspan></text><rect x="10" y="114" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Entregas con calificación doble</tspan></text><rect x="360" y="114" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">171</tspan></text><rect x="650" y="114" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">0</tspan></text><rect x="10" y="172" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Calificadas sin aviso al estudiante</tspan></text><rect x="360" y="172" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">291</tspan></text><rect x="650" y="172" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">0</tspan></text><rect x="10" y="230" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Estudiantes avisados dos veces</tspan></text><rect x="360" y="230" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">153</tspan></text><rect x="650" y="230" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">0</tspan></text><rect x="10" y="288" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">15 mensajes venenosos</tspan></text><rect x="360" y="288" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Bloquean 2 793 mensajes tras el</tspan></text><text x="502" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">primero</tspan></text><rect x="650" y="288" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">15 en la cola de fallidos; nadie</tspan></text><text x="787" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">bloqueado</tspan></text><rect x="10" y="350" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El flujo tolerante combina cuatro mecanismos de las clases anteriores: outbox, bandeja de entrada, versión por entidad y</tspan></text><text x="470" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cola de fallidos. Las fallas (2 % de caída del relevo, 3 % de duplicados, desorden, 15 venenosos, notificador caído) son</tspan></text><text x="470" y="408.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">inyecciones del autor sobre SQLite y listas en memoria.</tspan></text><text x="470" y="447.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
