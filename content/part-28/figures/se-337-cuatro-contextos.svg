<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 531" width="940" height="531" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro contextos, cuatro estilos distintos: la misma matriz de valoraciones con pesos de cada contexto</title><desc id="d">Barras agrupadas con el puntaje del estilo ganador y del segundo en cuatro contextos con la misma matriz de seis estilos y siete atributos: un equipo de seis gana el monolito modular con 4,00 frente a 3,65, doce equipos los microservicios con 3,45 frente a 3,15, una plataforma con extensiones de terceros el microkernel con 3,75 frente a 3,10 y un sistema crítico y multi-inquilino la arquitectura celular con 3,50 frente a 3,30.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="531" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro contextos, cuatro estilos distintos: la misma matriz de valoraciones con pesos de cada contexto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ganador</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Segundo</tspan></text><line x1="354" y1="77" x2="354" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="333" x2="354" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="486.44" y1="77" x2="486.44" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="486.44" y1="333" x2="486.44" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="486.44" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.44" dy="0">1</tspan></text><line x1="618.88" y1="77" x2="618.88" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="618.88" y1="333" x2="618.88" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="618.88" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="618.88" dy="0">2</tspan></text><line x1="751.32" y1="77" x2="751.32" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="751.32" y1="333" x2="751.32" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="751.32" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751.32" dy="0">3</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="333" x2="883.76" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">4</tspan></text><line x1="354" y1="333" x2="883.76" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Equipo de 6: gana monolito modular (2.º:</tspan></text><text x="344" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">monolito en capas)</tspan></text><text x="344" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">12 equipos: gana microservicios (2.º:</tspan></text><text x="344" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">celular)</tspan></text><text x="344" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Plataforma con terceros: gana microkernel</tspan></text><text x="344" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(2.º: microservicios)</tspan></text><text x="344" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Crítico y multi-inquilino: gana celular (2.º:</tspan></text><text x="344" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">microservicios)</tspan></text><rect x="354" y="83" width="529.76" height="24.5" rx="3" fill="#087f8c"/><text x="890.76" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="890.76" dy="0">4,00</tspan></text><rect x="354" y="110.5" width="483.406" height="24.5" rx="3" fill="#6b7c86"/><text x="844.406" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="844.406" dy="0">3,65</tspan></text><rect x="354" y="147" width="456.918" height="24.5" rx="3" fill="#087f8c"/><text x="817.918" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="817.918" dy="0">3,45</tspan></text><rect x="354" y="174.5" width="417.186" height="24.5" rx="3" fill="#6b7c86"/><text x="778.186" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="778.186" dy="0">3,15</tspan></text><rect x="354" y="211" width="496.65" height="24.5" rx="3" fill="#087f8c"/><text x="857.65" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="857.65" dy="0">3,75</tspan></text><rect x="354" y="238.5" width="410.564" height="24.5" rx="3" fill="#6b7c86"/><text x="771.564" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="771.564" dy="0">3,10</tspan></text><rect x="354" y="275" width="463.54" height="24.5" rx="3" fill="#087f8c"/><text x="824.54" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="824.54" dy="0">3,50</tspan></text><rect x="354" y="302.5" width="437.052" height="24.5" rx="3" fill="#6b7c86"/><text x="798.052" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="798.052" dy="0">3,30</tspan></text><text x="618.88" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="618.88" dy="0">Puntaje ponderado</tspan></text><rect x="10" y="391" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El puntaje del segundo es el del ganador menos la diferencia: 0,35, 0,30, 0,65 y 0,20. La matriz de valoraciones es la</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">misma en los cuatro casos; solo cambian los pesos. Cuatro estilos distintos ganan, y en el contexto crítico la ventaja</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sobre el segundo es de 0,20 puntos, menos que el margen de error de un juicio de 1 a 5. Las valoraciones y los pesos los</tspan></text><text x="470" y="465.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fijó el autor.</tspan></text><text x="470" y="513.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
