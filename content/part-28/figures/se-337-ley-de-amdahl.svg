92" y="342.97" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">3,8</tspan></text><polyline points="89.08,400.5 222.9,395.055 356.72,390.6 490.54,387.63 624.36,385.98 892,384.495" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="89.08,393.625 95.955,400.5 89.08,407.375 82.205,400.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="222.9,388.18 229.775,395.055 222.9,401.93 216.025,395.055" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="356.72,383.725 363.595,390.6 356.72,397.475 349.845,390.6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="490.54,380.755 497.415,387.63 490.54,394.505 483.665,387.63" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="624.36,379.105 631.235,385.98 624.36,392.855 617.485,385.98" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="892,377.62 898.875,384.495 892,391.37 885.125,384.495" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="373.495" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">2,0</tspan></text><rect x="10" y="477" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="501.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Acercarse al tope exige muchos más trabajadores de los que parece: con un 5 % secuencial hacen falta 171 para llegar al 90</tspan></text><text x="470" y="518.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">% de 20, y con un 50 %, 10 para el 90 % de 2. La fórmula es 1 / (s + (1 − s) / n) y supone una carga fija sin costo de</tspan></text><text x="470" y="535.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">coordinación, que en la práctica añade un tramo secuencial más.</tspan></text><text x="470" y="582.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
