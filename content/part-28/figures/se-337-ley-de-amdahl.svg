<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Aceleración según el número de trabajadores y la parte secuencial (ley de Amdahl)</title><desc id="d">Líneas en escala logarítmica del número de trabajadores con la aceleración teórica: con un 5 por ciento secuencial, 64 trabajadores dan 15,4 veces y el tope es 20; con un 10 por ciento dan 8,8 y el tope es 10; con un 25 por ciento dan 3,8 y el tope es 4; con un 50 por ciento el tope es 2 y 8 trabajadores ya dan 1,8. Cada curva se aplana contra su tope.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="600" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Aceleración según el número de trabajadores y la parte secuencial (ley de Amdahl)</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">5 % secuencial</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">10 %</tspan></text><polygon points="253.72,44.1 260.32,56.4 247.12,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="267.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="267.72" dy="0">25 %</tspan></text><polygon points="331.88,43.