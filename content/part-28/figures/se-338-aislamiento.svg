<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres formas de ejecutar un complemento: qué pasa con uno que falla y con uno lento, y cuánto cuesta cada una</title><desc id="d">Barras agrupadas en escala logarítmica con el bloqueo por un complemento lento y el costo por llamada de tres formas de ejecutar complementos: en el mismo hilo, con o sin try y except, el lento bloquea 1000 milisegundos y la llamada cuesta 0,0003; en un proceso con límite de 0,3 segundos el lento se corta a los 314 milisegundos y la llamada cuesta una mediana de 122.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres formas de ejecutar un complemento: qué pasa con uno que falla y con uno lento, y cuánto cuesta cada una</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Bloqueo por el complemento lento</tspan></text><rect x="305.28" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="325.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="325.28" dy="0">Costo por llamada</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,0001</tspan></text><line x1="101.24" y1="335" x2="920" y2="335" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="335" x2="101.24" y2="335" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,001</tspan></text><line x1="101.24" y1="295" x2="920" y2="295" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="295" x2="101.24" y2="295" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="299.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,01</tspan></text><line x1="101.24" y1="255" x2="920" y2="255" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="255" x2="101.24" y2="255" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="259.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,1</tspan></text><line x1="101.24" y1="215" x2="920" y2="215" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="215" x2="101.24" y2="215" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="219.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="175" x2="920" y2="175" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="175" x2="101.24" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="179.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="135" x2="920" y2="135" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="135" x2="101.24" y2="135" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="139.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Milisegundos (escala logarítmica)</text><rect x="128.532" y="95" width="107.168" height="280" rx="3" fill="#c0432f"/><text x="182.116" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182.116" dy="0">1 000</tspan></text><rect x="239.7" y="355.915" width="107.168" height="19.0849" rx="3" fill="#102a43"/><text x="293.284" y="349.915" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="293.284" dy="0">0,0003</tspan></text><text x="237.7" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">Mismo hilo, sin protección</tspan></text><rect x="401.452" y="95" width="107.168" height="280" rx="3" fill="#c0432f"/><text x="455.036" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="455.036" dy="0">1 000</tspan></text><rect x="512.62" y="355.915" width="107.168" height="19.0849" rx="3" fill="#102a43"/><text x="566.204" y="349.915" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.204" dy="0">0,0003</tspan></text><text x="510.62" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">Mismo hilo, con try y except</tspan></text><rect x="674.372" y="115.123" width="107.168" height="259.877" rx="3" fill="#c0432f"/><text x="727.956" y="109.123" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="727.956" dy="0">314</tspan></text><rect x="785.54" y="131.546" width="107.168" height="243.454" rx="3" fill="#102a43"/><text x="839.124" y="125.546" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.124" dy="0">122</tspan></text><text x="783.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">Proceso con límite de 0,3 s</tspan></text><rect x="10" y="427" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Sin protección, la excepción detiene la entrega a los demás; con try y except queda aislada y se entregan 7 de 8</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resultados; con un proceso, el error se aísla con un código de error. El aislamiento por proceso protege del complemento</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lento y del que cuelga, pero cuesta más de cinco órdenes de magnitud por llamada (0,30 µs frente a 122 ms). Una excepción</tspan></text><text x="470" y="501.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se contiene con una línea; un bloqueo exige otro proceso o un hilo con límite.</tspan></text><text x="470" y="549.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
