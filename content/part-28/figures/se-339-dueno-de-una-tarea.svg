<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 443" width="920" height="443" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién es dueño de una tarea y qué ocurre al cancelarla (asyncio, CPython 3.12)</title><desc id="d">Tabla: con TaskGroup el fallo de una tarea cancela a sus hermanas y el error se propaga; con gather las hermanas siguen vivas sin dueño; cancelar una transferencia de cuatro pasos sin protección deja tres de seis instantes con estado a medias y con un escudo ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="443" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Caso</tspan></text><rect x="340" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Qué ocurrió</tspan></text><rect x="740" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Resultado</tspan></text><rect x="10" y="56" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="90.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">TaskGroup: una hermana falla</tspan></text><rect x="340" y="56" width="394" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">b y c se cancelan; el error llega a quien creó el grupo</tspan></text><rect x="740" y="56" width="164" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0 tareas vivas</tspan></text><rect x="10" y="124" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">gather con tareas sueltas: una falla</tspan></text><rect x="340" y="124" width="394" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="150.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">El error llega, pero b y c siguen y terminan «ok» sin</tspan></text><text x="537" y="166.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">dueño</tspan></text><rect x="740" y="124" width="164" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">2 tareas vivas</tspan></text><rect x="10" y="192" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="218.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cancelar una transferencia de 4 pasos, sin</tspan></text><text x="172" y="234.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">escudo</tspan></text><rect x="340" y="192" width="394" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="218.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">3 de 6 instantes dejan estado a medias (por ejemplo, 25</tspan></text><text x="537" y="234.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">+ 30)</tspan></text><rect x="740" y="192" width="164" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">3 de 6 incoherentes</tspan></text><rect x="10" y="260" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cancelar la misma transferencia con escudo</tspan></text><rect x="340" y="260" width="394" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="286.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">La transferencia termina siempre: 25 + 35 y</tspan></text><text x="537" y="302.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">«completado»</tspan></text><rect x="740" y="260" width="164" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0 de 6 incoherentes</tspan></text><rect x="10" y="332" width="900" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">La concurrencia estructurada ata la vida de una tarea al bloque que la creó. No resuelve la atomicidad: una cancelación</tspan></text><text x="460" y="373.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">llega en un punto de espera y deja lo ya hecho; hay que decidir qué es indivisible. Pasos simulados con await de turno,</tspan></text><text x="460" y="390.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">no entrada y salida real.</tspan></text><text x="460" y="429.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
