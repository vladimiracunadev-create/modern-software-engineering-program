<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 416" width="940" height="416" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué queda a medias cuando una tarea falla o se cancela, sin y con la protección de la clase (asyncio, CPython 3.12)</title><desc id="d">Mancuernas con dos comparaciones: tras una falla, gather deja 2 tareas hermanas vivas sin dueño y TaskGroup deja 0; al cancelar una transferencia de cuatro pasos, 3 de 6 instantes dejan estado a medias sin escudo y 0 con escudo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="416" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué queda a medias cuando una tarea falla o se cancela, sin y con la protección de la clase (asyncio,</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">CPython 3.12)</tspan></text><circle cx="22" cy="70" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">gather / sin escudo</tspan></text><circle cx="213.26" cy="70" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="227.26" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">TaskGroup / con escudo</tspan></text><line x1="380.06" y1="96" x2="380.06" y2="218" stroke="#d5dde1" stroke-width="1"/><line x1="380.06" y1="218" x2="380.06" y2="223" stroke="#5b7280" stroke-width="1.4"/><text x="380.06" y="239" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380.06" dy="0">0</tspan></text><line x1="539.98" y1="96" x2="539.98" y2="218" stroke="#d5dde1" stroke-width="1"/><line x1="539.98" y1="218" x2="539.98" y2="223" stroke="#5b7280" stroke-width="1.4"/><text x="539.98" y="239" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="539.98" dy="0">1</tspan></text><line x1="699.9" y1="96" x2="699.9" y2="218" stroke="#d5dde1" stroke-width="1"/><line x1="699.9" y1="218" x2="699.9" y2="223" stroke="#5b7280" stroke-width="1.4"/><text x="699.9" y="239" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="699.9" dy="0">2</tspan></text><line x1="859.82" y1="96" x2="859.82" y2="218" stroke="#d5dde1" stroke-width="1"/><line x1="859.82" y1="218" x2="859.82" y2="223" stroke="#5b7280" stroke-width="1.4"/><text x="859.82" y="239" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.82" dy="0">3</tspan></text><line x1="380.06" y1="218" x2="859.82" y2="218" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="122.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Tareas hermanas vivas tras una falla (gather</tspan></text><text x="344" y="139.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">frente a TaskGroup)</tspan></text><text x="344" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Instantes de cancelación de 6 que dejan la</tspan></text><text x="344" y="192" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">transferencia a medias (sin escudo frente a</tspan></text><text x="344" y="209" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">con escudo)</tspan></text><line x1="699.9" y1="126.5" x2="380.06" y2="126.5" stroke="#087f8c" stroke-width="4"/><circle cx="699.9" cy="126.5" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="380.06" cy="126.5" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="711.9" y="131" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="711.9" dy="0">2</tspan></text><text x="368.06" y="131" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="368.06" dy="0">0</tspan></text><text x="926" y="131" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">−2</tspan></text><line x1="859.82" y1="187.5" x2="380.06" y2="187.5" stroke="#087f8c" stroke-width="4"/><circle cx="859.82" cy="187.5" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="380.06" cy="187.5" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="871.82" y="192" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="871.82" dy="0">3</tspan></text><text x="368.06" y="192" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="368.06" dy="0">0</tspan></text><text x="926" y="192" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">−3</tspan></text><text x="619.94" y="262" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="619.94" dy="0">Tareas vivas o instantes incoherentes</tspan></text><rect x="10" y="276" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La concurrencia estructurada ata la vida de una tarea al bloque que la creó: con TaskGroup una hermana que falla cancela a</tspan></text><text x="470" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">las demás y el error llega a quien creó el grupo; con gather las hermanas terminan «ok» sin dueño. No resuelve la</tspan></text><text x="470" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">atomicidad: una cancelación llega en un punto de espera y deja lo ya hecho (por ejemplo 25 + 30); hay que decidir qué es</tspan></text><text x="470" y="350.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">indivisible. Pasos simulados con await de turno, no entrada y salida real.</tspan></text><text x="470" y="398.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
