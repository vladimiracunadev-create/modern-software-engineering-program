<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 275" width="960" height="275" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pico de memoria al procesar 100 000 registros: por lotes, en flujo y en flujo con un filtro que necesita todo</title><desc id="d">Gráfico de barras con el pico de memoria medido con tracemalloc sobre 100 000 registros: por lotes 48,4 megabytes, en flujo con generadores 0,006 megabytes y en flujo con un filtro de ordenación al final 1,2 megabytes; las tres versiones producen la misma salida de 16 259 elementos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="275" fill="#ffffff"/><text x="304" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Por lotes (listas)</tspan></text><rect x="314" y="16" width="435.6" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="757.6" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="757.6" dy="0">48,4 MB</tspan></text><text x="304" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">En flujo (generadores)</tspan></text><rect x="314" y="62" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="326" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="326" dy="0">0,006 MB</tspan></text><text x="304" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">En flujo con ordenación</tspan></text><rect x="314" y="108" width="10.8" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="332.8" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="332.8" dy="0">1,2 MB</tspan></text><rect x="10" y="156" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="180.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El flujo procesa un registro a la vez y su memoria no depende de la entrada; la ordenación necesita retener todo lo que llega</tspan></text><text x="480" y="197.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">a ese filtro, de modo que el pico crece con el tamaño de la salida. La razón por lotes frente a flujo es de unas 7 700 veces</tspan></text><text x="480" y="214.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">solo con estos datos y esta forma de medir.</tspan></text><text x="480" y="261.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
