<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 407" width="940" height="407" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un buzón conserva el orden de cada emisor, no el orden entre emisores: dos de los 90 órdenes posibles</title><desc id="d">Diagrama con dos de los 90 órdenes globales que pueden salir del buzón cuando tres emisores envían dos mensajes cada uno: en ambos, el primer mensaje de cada emisor sale antes que su segundo, pero los emisores se intercalan de forma distinta. En 2 000 ejecuciones asyncio produjo 89 órdenes globales distintos y ninguna alteró el orden de los mensajes de un mismo emisor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="407" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un buzón conserva el orden de cada emisor, no el orden entre emisores: dos de los 90 órdenes posibles</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Emisor A</tspan></text><rect x="124.32" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Emisor B</tspan></text><rect x="232.64" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="252.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="252.64" dy="0">Emisor C</tspan></text><text x="547" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="547" dy="0">Orden en que el buzón entrega los mensajes</tspan></text><polyline points="174,97 916,97" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="164" y="143" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">Una ejecución</tspan></text><rect x="177" y="115" width="118.333" height="44" rx="6" fill="#087f8c"/><text x="236.167" y="143" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="236.167" dy="0">A1</tspan></text><rect x="301.333" y="115" width="118.333" height="44" rx="6" fill="#946512"/><text x="360.5" y="143" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="360.5" dy="0">B1</tspan></text><rect x="425.667" y="115" width="118.333" height="44" rx="6" fill="#087f8c"/><text x="484.833" y="143" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="484.833" dy="0">A2</tspan></text><rect x="550" y="115" width="118.333" height="44" rx="6" fill="#c0432f"/><text x="609.167" y="143" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="609.167" dy="0">C1</tspan></text><rect x="674.333" y="115" width="118.333" height="44" rx="6" fill="#c0432f"/><text x="733.5" y="143" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="733.5" dy="0">C2</tspan></text><rect x="798.667" y="115" width="118.333" height="44" rx="6" fill="#946512"/><text x="857.833" y="143" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857.833" dy="0">B2</tspan></text><text x="164" y="205" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">Otra ejecución</tspan></text><rect x="177" y="177" width="118.333" height="44" rx="6" fill="#c0432f"/><text x="236.167" y="205" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="236.167" dy="0">C1</tspan></text><rect x="301.333" y="177" width="118.333" height="44" rx="6" fill="#946512"/><text x="360.5" y="205" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="360.5" dy="0">B1</tspan></text><rect x="425.667" y="177" width="118.333" height="44" rx="6" fill="#946512"/><text x="484.833" y="205" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="484.833" dy="0">B2</tspan></text><rect x="550" y="177" width="118.333" height="44" rx="6" fill="#087f8c"/><text x="609.167" y="205" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="609.167" dy="0">A1</tspan></text><rect x="674.333" y="177" width="118.333" height="44" rx="6" fill="#c0432f"/><text x="733.5" y="205" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="733.5" dy="0">C2</tspan></text><rect x="798.667" y="177" width="118.333" height="44" rx="6" fill="#087f8c"/><text x="857.833" y="205" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857.833" dy="0">A2</tspan></text><text x="14" y="253" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dentro de cada color el número 1 siempre sale antes que el 2: eso es lo único que el buzón garantiza.</tspan></text><rect x="10" y="267" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El orden entre emisores no existe como propiedad del buzón: depende de quién llegó antes. De los 90 órdenes posibles se</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">observaron 89 en 2 000 ejecuciones, y en 0 un emisor vio alterado su propio orden. Cualquier lógica que suponga el orden</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">entre emisores funcionará hasta que cambie el reparto de los turnos. El retardo aleatorio de los emisores es una</tspan></text><text x="470" y="341.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">construcción del autor.</tspan></text><text x="470" y="389.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
