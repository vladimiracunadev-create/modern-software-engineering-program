<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 351" width="980" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escrituras posteriores que pierden frente a una anterior cuando gana la marca de tiempo más alta</title><desc id="d">Barras con el porcentaje de veces que una escritura causalmente posterior, hecha 100 ms después, pierde contra la anterior: 0 con desfase de 50 ms, 5,1 con 75, 11,9 con 100, 31,5 con 250 y 44,4 con 1 000 ms; con reloj híbrido, 0 en todos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="351" fill="#ffffff"/><text x="240" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">Desfase ±50 ms</tspan></text><rect x="250" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="262" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="262" dy="0">0 %</tspan></text><text x="240" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">Desfase ±75 ms</tspan></text><rect x="250" y="60" width="55.88" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="313.88" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="313.88" dy="0">5,08 %</tspan></text><text x="240" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">Desfase ±100 ms</tspan></text><rect x="250" y="104" width="131.34" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="389.34" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="389.34" dy="0">11,94 %</tspan></text><text x="240" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">Desfase ±250 ms</tspan></text><rect x="250" y="148" width="346.17" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="604.17" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="604.17" dy="0">31,47 %</tspan></text><text x="240" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">Desfase ±1 000 ms</tspan></text><rect x="250" y="192" width="488.51" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="746.51" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="746.51" dy="0">44,41 %</tspan></text><rect x="10" y="240" width="960" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">La pérdida empieza cuando el desfase entre relojes supera la mitad de la separación causal (50 ms de cada lado con 100 ms de</tspan></text><text x="490" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">separación). Un reloj híbrido que toma el máximo entre la hora local y la última marca vista dio 0 de 20 000 en todos los casos.</tspan></text><text x="490" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Los desfases son supuestos del autor.</tspan></text><text x="490" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
