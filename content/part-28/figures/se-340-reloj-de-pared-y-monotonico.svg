<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 501" width="900" height="501" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reloj de pared y reloj monotónico en dos sistemas operativos</title><desc id="d">Tabla: en Windows la resolución de los relojes de Python es de 15,6 ms y en Ubuntu de 1 ns; el reloj monotónico no retrocedió en 2 millones de lecturas; un ajuste simulado del reloj de pared produjo 205 duraciones erróneas en 100 000 mediciones y el monotónico ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="501" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Medida</tspan></text><rect x="510" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Windows 11</tspan></text><rect x="700" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Ubuntu (WSL2)</tspan></text><rect x="10" y="56" width="494" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Resolución de time.time()</tspan></text><rect x="510" y="56" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">15,6 ms</tspan></text><rect x="700" y="56" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">1 ns</tspan></text><rect x="10" y="122" width="494" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Resolución de time.monotonic()</tspan></text><rect x="510" y="122" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">15,6 ms</tspan></text><rect x="700" y="122" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">1 ns</tspan></text><rect x="10" y="188" width="494" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Retrocesos de monotonic en 2 000 000 de lecturas</tspan></text><rect x="510" y="188" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">0</tspan></text><rect x="700" y="188" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">0</tspan></text><rect x="10" y="254" width="494" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="279.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Duraciones negativas por un ajuste de −80 ms (1 de cada 500), reloj de</tspan></text><text x="257" y="295.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">pared</tspan></text><rect x="510" y="254" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">205 de 100 000</tspan></text><rect x="700" y="254" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">205 de 100 000</tspan></text><rect x="10" y="320" width="494" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="353.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Duraciones erróneas con reloj monotónico</tspan></text><rect x="510" y="320" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">0</tspan></text><rect x="700" y="320" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">0</tspan></text><rect x="10" y="390" width="880" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">Para medir cuánto duró algo se usa un reloj monotónico; para decir cuándo ocurrió, el de pared, sabiendo que se ajusta</tspan></text><text x="450" y="431.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">y que los nodos no coinciden. La resolución es una propiedad del sistema, no de Python: medir 5 ms con un reloj de</tspan></text><text x="450" y="448.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">15,6 ms es inexacto. El ajuste de −80 ms es un supuesto.</tspan></text><text x="450" y="487.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Resolución medida con time.get_clock_info; el ajuste de reloj es una simulación con semilla 3403.</tspan></text></svg>
