<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 259" width="960" height="259" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Latencia mediana de una llamada HTTP local según el número de proxies de un salto en el camino</title><desc id="d">Gráfico de barras con la mediana de medianas de ocho rondas intercaladas de 500 llamadas: directo 0,365 milisegundos, con un proxy 0,483 y con dos proxies 0,586; cada proxy añade entre 0,11 y 0,12 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="259" fill="#ffffff"/><text x="304" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Directo</tspan></text><rect x="314" y="16" width="219" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="541" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="541" dy="0">0,365 ms</tspan></text><text x="304" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Un salto (un proxy)</tspan></text><rect x="314" y="62" width="289.8" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="611.8" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="611.8" dy="0">0,483 ms</tspan></text><text x="304" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Dos saltos (dos proxies)</tspan></text><rect x="314" y="108" width="351.6" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="673.6" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="673.6" dy="0">0,586 ms</tspan></text><rect x="10" y="156" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="180.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un proxy de bytes escrito en Python añade unos 0,12 ms por salto sobre esta base; un sidecar de producción tiene otro costo y</tspan></text><text x="480" y="197.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">además hace TLS, métricas y reintentos. La cifra enseña que el salto no es gratis, no el costo de un mesh real.</tspan></text><text x="480" y="245.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
