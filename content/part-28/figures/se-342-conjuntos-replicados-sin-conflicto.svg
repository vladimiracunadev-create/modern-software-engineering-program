<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 613" width="940" height="613" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres réplicas de un conjunto con entrega desordenada y duplicada: divergencia y cumplimiento de «el alta gana»</title><desc id="d">Barras agrupadas con el porcentaje de 5 000 corridas en que las tres réplicas terminan con estados distintos y el porcentaje en que el estado final no cumple la regla de que un alta que ninguna baja observó permanece. Aplicar en orden de llegada diverge en el 87,6 % de las corridas e incumple la regla en el 93,2 %; el último escritor con relojes desfasados diverge en el 6,5 % e incumple la regla en el 41,3 %; el conjunto con etiquetas únicas (OR-Set) diverge en el 0 % e incumple la regla en el 0 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="613" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres réplicas de un conjunto con entrega desordenada y duplicada: divergencia y cumplimiento de «el alta</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">gana»</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Réplicas con estados distintos</tspan></text><rect x="290.2" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="310.2" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310.2" dy="0">Estado final que incumple «el alta gana»</tspan></text><line x1="78.62" y1="404" x2="920" y2="404" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="404" x2="78.62" y2="404" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="408.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="346" x2="920" y2="346" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="346" x2="78.62" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="350.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="288" x2="920" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="288" x2="78.62" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="292.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="230" x2="920" y2="230" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="230" x2="78.62" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="234.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="172" x2="920" y2="172" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="172" x2="78.62" y2="172" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="176.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="114" x2="78.62" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="114" x2="78.62" y2="404" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="259" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 259)">% de las 5 000 corridas</text><rect x="106.666" y="149.96" width="110.184" height="254.04" rx="3" fill="#c0432f"/><text x="161.758" y="143.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">87,6</tspan></text><rect x="220.85" y="133.72" width="110.184" height="270.28" rx="3" fill="#946512"/><text x="275.942" y="127.72" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">93,2</tspan></text><text x="218.85" y="425" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Aplicar en orden de llegada</tspan></text><rect x="387.126" y="385.15" width="110.184" height="18.85" rx="3" fill="#c0432f"/><text x="442.218" y="379.15" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">6,5</tspan></text><rect x="501.31" y="284.23" width="110.184" height="119.77" rx="3" fill="#946512"/><text x="556.402" y="278.23" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">41,3</tspan></text><text x="499.31" y="425" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Último escritor con relojes</tspan></text><text x="499.31" y="442" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">desfasados</tspan></text><rect x="667.586" y="402" width="110.184" height="2" rx="3" fill="#c0432f"/><text x="722.678" y="396" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">0,0</tspan></text><rect x="781.77" y="402" width="110.184" height="2" rx="3" fill="#946512"/><text x="836.862" y="396" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">0,0</tspan></text><text x="779.77" y="425" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">OR-Set con etiquetas únicas</tspan></text><rect x="10" y="473" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="497.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Converger y ser correcto son propiedades distintas: el último escritor casi siempre converge (6,5 % de divergencia, por</tspan></text><text x="470" y="514.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">empates de reloj sin desempate) y aun así descarta altas concurrentes en el 41,3 % de las corridas. El OR-Set cumple ambas</tspan></text><text x="470" y="531.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">porque la baja solo quita lo que vio y la unión es conmutativa, asociativa e idempotente. El precio es que las etiquetas de</tspan></text><text x="470" y="547.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las bajas se acumulan.</tspan></text><text x="470" y="595.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija (scripts/experiments_part28_ext.py), CPython 3.12.9 en Windows; no es Raft ni un conjunto de producción.</tspan></text></svg>
