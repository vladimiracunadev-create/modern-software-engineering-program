<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una base de datos por inquilino frente a una tabla compartida: crear 200 inquilinos y migrar el esquema</title><desc id="d">Barras horizontales en escala logarítmica con el tiempo de aislar por base de datos con 200 inquilinos de SQLite: crear las 200 bases tarda 3619 milisegundos y migrar el esquema en las 200 tarda 1401, mientras que alterar la tabla compartida tarda 0,18 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una base de datos por inquilino frente a una tabla compartida: crear 200 inquilinos y migrar el esquema</tspan></text><line x1="314" y1="49" x2="314" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="181" x2="314" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0,1</tspan></text><line x1="421.504" y1="49" x2="421.504" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="421.504" y1="181" x2="421.504" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="421.504" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="421.504" dy="0">1</tspan></text><line x1="529.008" y1="49" x2="529.008" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="529.008" y1="181" x2="529.008" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="529.008" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="529.008" dy="0">10</tspan></text><line x1="636.512" y1="49" x2="636.512" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="636.512" y1="181" x2="636.512" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="636.512" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="636.512" dy="0">100</tspan></text><line x1="744.016" y1="49" x2="744.016" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="744.016" y1="181" x2="744.016" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="744.016" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="744.016" dy="0">1 000</tspan></text><line x1="851.52" y1="49" x2="851.52" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="851.52" y1="181" x2="851.52" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="851.52" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="851.52" dy="0">10 000</tspan></text><line x1="314" y1="181" x2="851.52" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Crear 200 bases, una por inquilino</tspan></text><text x="304" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Migrar el esquema en las 200 bases</tspan></text><text x="304" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Migrar el esquema en la tabla</tspan></text><text x="304" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">compartida</tspan></text><rect x="314" y="55" width="490.067" height="32" rx="3" fill="#102a43"/><text x="811.067" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="811.067" dy="0">3 619,00</tspan></text><rect x="314" y="99" width="445.759" height="32" rx="3" fill="#102a43"/><text x="766.759" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="766.759" dy="0">1 401,00</tspan></text><rect x="314" y="143" width="27.4428" height="32" rx="3" fill="#102a43"/><text x="348.443" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="348.443" dy="0">0,18</tspan></text><text x="582.76" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="582.76" dy="0">Milisegundos (escala logarítmica)</tspan></text><rect x="10" y="239" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada base ocupa 12 288 bytes, mientras que la tabla compartida se crea una vez y guarda filas con inquilino_id. El</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">aislamiento fuerte se paga en operaciones que se multiplican por el número de inquilinos; con 200 es tolerable y con 20 000</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la migración deja de ser un comando para ser un proyecto. Tiempos de escritura con sincronización de disco en Windows:</tspan></text><text x="470" y="313.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">varían mucho entre equipos.</tspan></text><text x="470" y="361.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
