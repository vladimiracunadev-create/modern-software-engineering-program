<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 461" width="960" height="461" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres réplicas: cuántas escrituras y lecturas confirma cada cuórum y si garantiza ver lo último</title><desc id="d">Tabla de cuórums con tres réplicas: W=1 y R=1 tolera dos caídas pero no garantiza leer lo último; W=2 y R=2 sí lo garantiza y tolera una; W=3 y R=1 lo garantiza pero no tolera ninguna caída al escribir; W=2 y R=1 no lo garantiza.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="461" fill="#ffffff"/><rect x="10" y="12" width="54" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="37" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="37" dy="0">W</tspan></text><rect x="70" y="12" width="54" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="97" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="97" dy="0">R</tspan></text><rect x="130" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="297" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="297" dy="0">Garantiza lectura reciente (W + R &gt; N)</tspan></text><rect x="470" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Caídas toleradas al</tspan></text><text x="577" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">escribir / leer</tspan></text><rect x="690" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Disponibilidad con 1 % de caída</tspan></text><text x="817" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">por réplica</tspan></text><rect x="10" y="56" width="54" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="37" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="37" dy="0">1</tspan></text><rect x="70" y="56" width="54" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="97" dy="0">1</tspan></text><rect x="130" y="56" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">No</tspan></text><rect x="470" y="56" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">2 / 2</tspan></text><rect x="690" y="56" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">99,9999 %</tspan></text><rect x="10" y="114" width="54" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="37" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="37" dy="0">2</tspan></text><rect x="70" y="114" width="54" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="97" dy="0">2</tspan></text><rect x="130" y="114" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">Sí</tspan></text><rect x="470" y="114" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">1 / 1</tspan></text><rect x="690" y="114" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">99,97 %</tspan></text><rect x="10" y="172" width="54" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="37" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="37" dy="0">3</tspan></text><rect x="70" y="172" width="54" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="97" dy="0">1</tspan></text><rect x="130" y="172" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">Sí</tspan></text><rect x="470" y="172" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0 / 2</tspan></text><rect x="690" y="172" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">97,03 % al escribir</tspan></text><rect x="10" y="230" width="54" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="37" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="37" dy="0">1</tspan></text><rect x="70" y="230" width="54" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="97" dy="0">3</tspan></text><rect x="130" y="230" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">Sí</tspan></text><rect x="470" y="230" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">2 / 0</tspan></text><rect x="690" y="230" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">99,9999 % al escribir</tspan></text><rect x="10" y="288" width="54" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="37" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="37" dy="0">2</tspan></text><rect x="70" y="288" width="54" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="97" dy="0">1</tspan></text><rect x="130" y="288" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">No</tspan></text><rect x="470" y="288" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">1 / 2</tspan></text><rect x="690" y="288" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">99,97 % al escribir</tspan></text><rect x="10" y="350" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La garantía sale de la intersección: toda lectura toca al menos una réplica que vio la última escritura cuando W + R &gt; N. A</tspan></text><text x="480" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">cambio se pierde tolerancia a caídas en una de las dos operaciones. Sin reloj ni fallos parciales de red: es el modelo de</tspan></text><text x="480" y="408.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">conjuntos alcanzables, no un sistema real.</tspan></text><text x="480" y="447.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Enumeración exacta de subconjuntos y cálculo binomial; sin simulación aleatoria.</tspan></text></svg>
