<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 381" width="940" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce consultas sobre una tabla compartida por cinco inquilinos: cuántas filtran datos ajenos según la protección</title><desc id="d">Barras horizontales con las consultas de doce que filtran o se señalan según la estrategia: sin protección cuatro consultas devuelven datos ajenos, un linter que busca el filtro por tenant_id en el texto señala tres y no ve la Q12, cuyo filtro se anula con OR, y una vista temporal del inquilino creada en cada solicitud deja cero fugas sin cambiar las consultas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="381" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Doce consultas sobre una tabla compartida por cinco inquilinos: cuántas filtran datos ajenos según la</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">protección</tspan></text><line x1="354" y1="68" x2="354" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="200" x2="354" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="492.485" y1="68" x2="492.485" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="492.485" y1="200" x2="492.485" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="492.485" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492.485" dy="0">1</tspan></text><line x1="630.97" y1="68" x2="630.97" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="630.97" y1="200" x2="630.97" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="630.97" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630.97" dy="0">2</tspan></text><line x1="769.455" y1="68" x2="769.455" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="769.455" y1="200" x2="769.455" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="769.455" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="769.455" dy="0">3</tspan></text><line x1="907.94" y1="68" x2="907.94" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="200" x2="907.94" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">4</tspan></text><line x1="354" y1="200" x2="907.94" y2="200" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="86" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin protección: consultas que filtran (Q09,</tspan></text><text x="344" y="103" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Q10, Q11, Q12)</tspan></text><text x="344" y="130" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Linter de «tenant_id = ?»: fugas señaladas</tspan></text><text x="344" y="147" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(no ve Q12)</tspan></text><text x="344" y="174" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Vista temporal del inquilino: consultas que</tspan></text><text x="344" y="191" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">filtran</tspan></text><rect x="354" y="74" width="553.94" height="32" rx="3" fill="#c0432f"/><text x="914.94" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">4</tspan></text><rect x="354" y="118" width="415.455" height="32" rx="3" fill="#c0432f"/><text x="776.455" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="776.455" dy="0">3</tspan></text><rect x="354" y="162" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><text x="630.97" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">Consultas de 12</tspan></text><rect x="10" y="258" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La regla «filtrar por inquilino» escrita en cada consulta falla donde un humano la olvida o la anula; una barrera que no</tspan></text><text x="470" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">depende de la consulta (la vista que tapa el nombre de la tabla) falla solo si alguien usa otra conexión. Doce consultas</tspan></text><text x="470" y="316.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escritas por el autor, no una muestra de código real.</tspan></text><text x="470" y="363.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
