<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 431" width="880" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una réplica de tres aislada durante 300 de 1 000 operaciones: rechazar o aceptar</title><desc id="d">Tabla: si la réplica aislada rechaza operaciones (CP), se rechazan 97 y no hay lecturas obsoletas ni escrituras perdidas; si acepta (AP), se atienden las 1 000, pero hay 89 lecturas obsoletas y 27 escrituras del lado aislado que se descartan al reparar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="880" height="431" fill="#ffffff"/><rect x="10" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">Medida</tspan></text><rect x="490" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Rechazar (CP)</tspan></text><rect x="680" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Aceptar (AP)</tspan></text><rect x="10" y="56" width="474" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Operaciones rechazadas</tspan></text><rect x="490" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">97</tspan></text><rect x="680" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">0</tspan></text><rect x="10" y="108" width="474" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Operaciones atendidas</tspan></text><rect x="490" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">903</tspan></text><rect x="680" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">1 000</tspan></text><rect x="10" y="160" width="474" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Lecturas obsoletas</tspan></text><rect x="490" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0</tspan></text><rect x="680" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">89</tspan></text><rect x="10" y="212" width="474" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Escrituras aceptadas por el lado aislado</tspan></text><rect x="490" y="212" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0</tspan></text><rect x="680" y="212" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">27</tspan></text><rect x="10" y="264" width="474" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="290.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Escrituras descartadas al reparar la partición</tspan></text><rect x="490" y="264" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0</tspan></text><rect x="680" y="264" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">27</tspan></text><rect x="10" y="320" width="860" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="440" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="440" dy="0">Durante la partición no se puede conservar a la vez la respuesta a todas las peticiones y la coherencia con lo</tspan></text><text x="440" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="440" dy="0">último escrito. Rechazar cuesta disponibilidad visible; aceptar cuesta un trabajo de reparación que hay que definir</tspan></text><text x="440" y="378.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="440" dy="0">antes. La carga y la duración de la partición son supuestos del autor.</tspan></text><text x="440" y="417.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
