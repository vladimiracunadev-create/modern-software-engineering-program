t x="738.2" y="382.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="738.2" dy="0">—</tspan></text><rect x="800.3" y="361.5" width="118.2" height="33" rx="4" fill="#102a43" stroke="#102a43" stroke-width="3"/><text x="859.4" y="382.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="859.4" dy="0">falla</tspan></text><text x="314" y="422" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="314" dy="0">—</tspan></text><rect x="329.54" y="410" width="30.5" height="14" fill="#d9e2ec"/><rect x="359.54" y="410" width="30.5" height="14" fill="#bcc8d4"/><rect x="389.54" y="410" width="30.5" height="14" fill="#a0adbc"/><rect x="419.54" y="410" width="30.5" height="14" fill="#8393a4"/><rect x="449.54" y="410" width="30.5" height="14" fill="#66798b"/><rect x="479.54" y="410" width="30.5" height="14" fill="#495f73"/><rect x="509.54" y="410" width="30.5" height="14" fill="#2d445b"/><rect x="539.54" y="410" width="30.5" height="14" fill="#102a43"/><text x="577.54" y="422" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="577.54" dy="0">falla</tspan></text><text x="623.24" y="422" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="623.24" dy="0">más oscuro = mayor (falla)</tspan></text><rect x="10" y="438" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="462.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Las ocho derivas se detectan con cinco comprobaciones; con solo el esquema se detectarían 4. La celda resaltada es la falsa</tspan></text><text x="470" y="479.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">alarma: el cambio legítimo de temporada también falla la distribución. La unidad cambiada y el significado invertido son</tspan></text><text x="470" y="496.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">válidos para el esquema y solo se ven por su efecto en la distribución, que no distingue un defecto de un cambio real del</tspan></text><text x="470" y="512.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">negocio.</tspan></text><text x="470" y="560.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
