<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho derivas de un producto de datos y un cambio legítimo: qué comprobación del contrato las detecta</title><desc id="d">Mapa de calor con nueve cambios sobre un producto de datos de 1000 filas y las comprobaciones que fallan: D1 a D3 las detecta el esquema, D4 la completitud y el esquema, D5 la unicidad, D6 la frescura y D7 y D8 la distribución; el cambio legítimo de temporada L1 también falla la distribución y es una falsa alarma; solo con el esquema se detectan 4 de las 8 derivas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocho derivas de un producto de datos y un cambio legítimo: qué comprobación del contrato las detecta</tspan></text><text x="374.6" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374.6" dy="0">Esquema</tspan></text><text x="495.8" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.8" dy="0">Completitud</tspan></text><text x="617" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">Unicidad</tspan></text><text x="738.2" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="738.2" dy="0">Frescura</tspan></text><text x="859.4" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.4" dy="0">Distribución</tspan></text><text x="304" y="94.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D1 columna renombrada</tspan></text><text x="304" y="130.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D2 tipo cambiado a texto</tspan></text><text x="304" y="166.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D3 columna eliminada</tspan></text><text x="304" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D4 nulos en estudiante (12,5 %)</tspan></text><text x="304" y="238.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D5 identificadores duplicados</tspan></text><text x="304" y="274.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D6 datos atrasados (30 h)</tspan></text><text x="304" y="310.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D7 unidad cambiada a minutos</tspan></text><text x="304" y="346.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D8 significado invertido</tspan></text><text x="304" y="382.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">L1 cambio legítimo de temporada</tspan></text><rect x="315.5" y="73.5" width="118.2" height="33" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="374.6" y="94.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="374.6" dy="0">falla</tspan></text><rect x="436.7" y="73.5" width="118.2" height="33" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="495.8" y="94.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.8" dy="0">—</tspan></text><rect x="557.9" y="73.5" width="118.2" height="33" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/