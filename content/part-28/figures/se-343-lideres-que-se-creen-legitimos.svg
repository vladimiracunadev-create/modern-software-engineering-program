<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 471" width="910" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco nodos y una partición: líderes que se creen legítimos según la regla de elección</title><desc id="d">Tabla: con la regla «el identificador mayor que veo vivo», una partición de cinco nodos produce dos o tres líderes a la vez, y las 15 biparticiones posibles producen dos; con la regla de mayoría nunca hay más de uno y en un reparto 2, 2, 1 no hay ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="471" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Situación</tspan></text><rect x="390" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Regla «el mayor que veo»</tspan></text><rect x="640" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Regla de mayoría</tspan></text><rect x="10" y="56" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Sin partición</tspan></text><rect x="390" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">1</tspan></text><rect x="640" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">1</tspan></text><rect x="10" y="106" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Partición en 2 y 3</tspan></text><rect x="390" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">2</tspan></text><rect x="640" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">1</tspan></text><rect x="10" y="156" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Partición en 1 y 4</tspan></text><rect x="390" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">2</tspan></text><rect x="640" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">1</tspan></text><rect x="10" y="206" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Partición en 1, 1 y 3</tspan></text><rect x="390" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">3</tspan></text><rect x="640" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">1</tspan></text><rect x="10" y="256" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Partición en 2, 2 y 1</tspan></text><rect x="390" y="256" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">3</tspan></text><rect x="640" y="256" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0 (nadie tiene mayoría)</tspan></text><rect x="10" y="306" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Las 15 biparticiones posibles de 5 nodos</tspan></text><rect x="390" y="306" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">2 en las 15</tspan></text><rect x="640" y="306" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">nunca más de 1</tspan></text><rect x="10" y="360" width="890" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">La mayoría resuelve el cerebro dividido a cambio de disponibilidad: el grupo sin mayoría no elige a nadie. Dos mayorías</tspan></text><text x="455" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">siempre se cruzan en algún nodo, y de ahí sale la seguridad. Es un modelo de conjuntos de nodos, sin mensajes ni</tspan></text><text x="455" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">tiempo.</tspan></text><text x="455" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Enumeración exacta de particiones; sin simulación aleatoria.</tspan></text></svg>
