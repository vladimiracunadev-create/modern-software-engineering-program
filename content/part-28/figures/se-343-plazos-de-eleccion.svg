<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 559" width="940" height="559" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Elección de líder entre cinco nodos: tiempo medio hasta tener líder según la anchura del plazo aleatorio</title><desc id="d">Línea en escala logarítmica con el tiempo medio hasta tener líder según cuánto se ensancha el plazo de elección sobre 150 ms: con 0 y 25 ms de dispersión no se llega a un líder en 50 rondas (7 650 y 7 863 ms); con 50 ms, 25,5 rondas y 4 057 ms; con 150 ms, 2,49 rondas y 461 ms; con 300 ms, 1,54 rondas y 333 ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="559" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Elección de líder entre cinco nodos: tiempo medio hasta tener líder según la anchura del plazo aleatorio</tspan></text><line x1="108.78" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="359" x2="108.78" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100</tspan></text><line x1="108.78" y1="259" x2="910" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="259" x2="108.78" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">1 000</tspan></text><line x1="108.78" y1="159" x2="910" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="159" x2="108.78" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10 000</tspan></text><line x1="108.78" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="59" x2="108.78" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100 000</tspan></text><line x1="108.78" y1="59" x2="108.78" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="126.78" y1="59" x2="126.78" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="126.78" y1="359" x2="126.78" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="126.78" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="126.78" dy="0">0</tspan></text><line x1="190.548" y1="59" x2="190.548" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="190.548" y1="359" x2="190.548" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="190.548" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="190.548" dy="0">25</tspan></text><line x1="254.317" y1="59" x2="254.317" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="254.317" y1="359" x2="254.317" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="254.317" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254.317" dy="0">50</tspan></text><line x1="381.853" y1="59" x2="381.853" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="381.853" y1="359" x2="381.853" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="381.853" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="381.853" dy="0">100</tspan></text><line x1="509.39" y1="59" x2="509.39" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="509.39" y1="359" x2="509.39" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="509.39" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="509.39" dy="0">150</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">300</tspan></text><line x1="108.78" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Tiempo medio hasta tener líder (ms) (escala logarítmica)</text><text x="509.39" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="509.39" dy="0">Dispersión del plazo de elección sobre 150 ms (ms)</tspan></text><line x1="190.548" y1="59" x2="190.548" y2="359" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="195.548" y="72" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="195.548" dy="0">retardo máximo de mensajes: 25 ms</tspan></text><polyline points="126.78,170.634 190.548,169.441 254.317,198.179 381.853,272.966 509.39,292.63 892,306.756" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="126.78" cy="170.634" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="126.78" y="159.634" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="126.78" dy="0">7 650</tspan></text><circle cx="190.548" cy="169.441" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="190.548" y="158.441" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="190.548" dy="0">7 863</tspan></text><circle cx="254.317" cy="198.179" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="264.317" y="202.679" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="264.317" dy="0">4 057</tspan></text><circle cx="381.853" cy="272.966" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="381.853" y="261.966" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="381.853" dy="0">725</tspan></text><circle cx="509.39" cy="292.63" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="509.39" y="281.63" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="509.39" dy="0">461</tspan></text><circle cx="892" cy="306.756" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="295.756" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">333</tspan></text><rect x="10" y="419" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La dispersión de los plazos debe ser mayor que el retardo de los mensajes para que un candidato gane antes de que otro se</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">presente: a la izquierda de la línea punteada no hay líder en 50 rondas. Con 300 ms de dispersión un líder sale en la</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">primera ronda el 64,7 % de las veces; con 150 ms, el 40,3 %. Mayor dispersión tarda más en empezar una elección y menos en</tspan></text><text x="470" y="493.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">terminarla. Es un modelo simplificado inspirado en Raft, no Raft.</tspan></text><text x="470" y="541.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
