<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 536" width="940" height="536" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Calendarios aleatorios de 70 pasos con violación de seguridad según qué regla de Raft se quite</title><desc id="d">Barras con el porcentaje de 20 000 calendarios aleatorios de 70 pasos sobre cinco nodos en que un líder elegido no tiene una entrada ya comprometida o se compromete una entrada distinta en un índice ya comprometido: 0 % con el modelo completo, 6,88 % si el voto no compara los registros y 0,06 % si el líder cuenta réplicas de entradas de mandatos anteriores para comprometer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="536" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Calendarios aleatorios de 70 pasos con violación de seguridad según qué regla de Raft se quite</tspan></text><line x1="63.54" y1="327" x2="920" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="327" x2="63.54" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="262" x2="920" y2="262" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="262" x2="63.54" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="266.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="197" x2="920" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="197" x2="63.54" y2="197" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="201.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="132" x2="920" y2="132" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="132" x2="63.54" y2="132" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="136.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="67" x2="63.54" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">8</tspan></text><line x1="63.54" y1="67" x2="63.54" y2="327" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 197)">% de los 20 000 calendarios</text><rect x="92.0887" y="325" width="228.389" height="2" rx="3" fill="#c0432f"/><text x="206.283" y="319" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="206.283" dy="0">0,00</tspan></text><text x="206.283" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="206.283" dy="0">Reglas completas</tspan></text><rect x="377.575" y="103.4" width="228.389" height="223.6" rx="3" fill="#c0432f"/><text x="491.77" y="97.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="491.77" dy="0">6,88</tspan></text><text x="491.77" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491.77" dy="0">El voto no compara los registros</tspan></text><rect x="663.062" y="325" width="228.389" height="2" rx="3" fill="#c0432f"/><text x="777.257" y="319" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="777.257" dy="0">0,06</tspan></text><text x="777.257" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777.257" dy="0">Comprometer contando réplicas de</tspan></text><text x="777.257" y="365" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777.257" dy="0">mandatos anteriores</tspan></text><rect x="10" y="396" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Quitar la comparación de registros pierde entradas comprometidas en 1 377 calendarios de 20 000 (6,88 %). Quitar la regla</tspan></text><text x="470" y="437.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de comprometer solo entradas del mandato actual produce 11 violaciones (0,06 %): un fallo real pero raro, que una prueba</tspan></text><text x="470" y="454.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con pocos calendarios no vería. Las 0 violaciones del modelo completo en 20 000 calendarios no son una demostración de</tspan></text><text x="470" y="470.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">corrección.</tspan></text><text x="470" y="518.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija (scripts/experiments_part28_ext.py), CPython 3.12.9 en Windows; no es Raft ni un conjunto de producción.</tspan></text></svg>
