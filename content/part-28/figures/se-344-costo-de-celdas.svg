<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 563" width="700" height="563" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de repartir 1 000 inquilinos en 8 celdas frente a una flota compartida: capacidad, disponibilidad y punto de fallo</title><desc id="d">Barras con la capacidad necesaria para cubrir el percentil 99 de la carga: 1824 unidades con una flota compartida y 2184 con ocho celdas, un 19,8 por ciento más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="700" height="563" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo de repartir 1 000 inquilinos en 8 celdas frente a una flota compartida:</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">capacidad, disponibilidad y punto de fallo</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Flota compartida</tspan></text><rect x="184.64" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="204.64" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Ocho celdas</tspan></text><line x1="93.7" y1="354" x2="680" y2="354" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="354" x2="93.7" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="358.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="306" x2="680" y2="306" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="306" x2="93.7" y2="306" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="310.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="258" x2="680" y2="258" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="258" x2="93.7" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="210" x2="680" y2="210" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="210" x2="93.7" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="214.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 500</tspan></text><line x1="93.7" y1="162" x2="680" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="162" x2="93.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="114" x2="680" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="114" x2="93.7" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 500</tspan></text><line x1="93.7" y1="114" x2="93.7" y2="354" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="234" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 234)">Unidades de capacidad</text><rect x="152.33" y="178.896" width="232.52" height="175.104" rx="3" fill="#087f8c"/><text x="268.59" y="172.896" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="268.59" dy="0">1 824</tspan></text><rect x="388.85" y="144.336" width="232.52" height="209.664" rx="3" fill="#c0432f"/><text x="505.11" y="138.336" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="505.11" dy="0">2 184</tspan></text><text x="386.85" y="375" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="386.85" dy="0">Capacidad para cubrir el p99 de la carga</tspan></text><rect x="10" y="406" width="680" height="109.2" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="350" y="430.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">Disponibilidad de un inquilino: la de la flota (99,9 %) frente a 99,890 % con el enrutador</tspan></text><text x="350" y="447.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">al 99,99 % y la celda al 99,9 %. Punto de fallo compartido: la flota entera frente al</tspan></text><text x="350" y="464.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">enrutador. Repartir cuesta capacidad (cada celda se dimensiona a su propio p99, y los</tspan></text><text x="350" y="480.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">picos no se compensan entre celdas) y mueve el punto de fallo al enrutador. La carga de</tspan></text><text x="350" y="497.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">cada inquilino es lognormal con semilla 44; una carga real tiene otra forma.</tspan></text><text x="350" y="545.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
