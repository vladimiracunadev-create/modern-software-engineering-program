<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 321" width="960" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fracción de los 1 000 inquilinos que un solo inquilino venenoso deja sin servicio según cómo está repartida la flota</title><desc id="d">Gráfico de barras con la fracción de inquilinos afectada por un inquilino venenoso: en una flota compartida el 100 por ciento según el supuesto de reintentos, con ocho celdas el 10,9 por ciento, con fragmentación aleatoria de dos trabajadores de ocho el 3,0 por ciento queda caído del todo y el 45,6 por ciento queda degradado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="321" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Flota compartida (supuesto)</tspan></text><rect x="344" y="16" width="400" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="752" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="752" dy="0">100 %</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Ocho celdas</tspan></text><rect x="344" y="62" width="43.6" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="395.6" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="395.6" dy="0">10,9 %</tspan></text><text x="334" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Fragmentación: caídos del todo</tspan></text><rect x="344" y="108" width="12" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="364" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="364" dy="0">3,0 %</tspan></text><text x="334" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Fragmentación: degradados</tspan></text><rect x="344" y="154" width="182.4" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="534.4" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="534.4" dy="0">45,6 %</tspan></text><rect x="10" y="202" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="226.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Las celdas acotan el daño a una fracción fija y la fragmentación lo reduce aún más a quien comparte todos sus trabajadores con</tspan></text><text x="480" y="243.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">el venenoso, a costa de degradar a casi la mitad. El 100 % de la flota compartida es un supuesto (los reintentos del cliente</tspan></text><text x="480" y="260.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">recorren todos los trabajadores), no una medición.</tspan></text><text x="480" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
