<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pasar de 8 a 9 celdas con 100 000 inquilinos: cuántos cambian de celda según la función de asignación</title><desc id="d">Barras horizontales con los inquilinos reubicados al pasar de 8 a 9 celdas con 100000 inquilinos: el módulo del hash reubica 88985, un 89,0 por ciento; el hash por encuentro 11176, un 11,2 por ciento; el mínimo teórico es un noveno, 11111, un 11,1 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pasar de 8 a 9 celdas con 100 000 inquilinos: cuántos cambian de celda según la función de asignación</tspan></text><line x1="274" y1="49" x2="274" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="163" x2="274" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="392.728" y1="49" x2="392.728" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="392.728" y1="163" x2="392.728" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="392.728" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392.728" dy="0">20 000</tspan></text><line x1="511.456" y1="49" x2="511.456" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="511.456" y1="163" x2="511.456" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="511.456" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="511.456" dy="0">40 000</tspan></text><line x1="630.184" y1="49" x2="630.184" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="630.184" y1="163" x2="630.184" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="630.184" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630.184" dy="0">60 000</tspan></text><line x1="748.912" y1="49" x2="748.912" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="748.912" y1="163" x2="748.912" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="748.912" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.912" dy="0">80 000</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="163" x2="867.64" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100 000</tspan></text><line x1="274" y1="163" x2="867.64" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Módulo del hash (89,0 %)</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Hash por encuentro (11,2 %)</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Mínimo teórico, 1/9 (11,1 %)</tspan></text><rect x="274" y="55" width="528.251" height="26" rx="3" fill="#102a43"/><text x="809.251" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="809.251" dy="0">88 985</tspan></text><rect x="274" y="93" width="66.3452" height="26" rx="3" fill="#102a43"/><text x="347.345" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="347.345" dy="0">11 176</tspan></text><rect x="274" y="131" width="65.9593" height="26" rx="3" fill="#102a43"/><text x="346.959" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="346.959" dy="0">11 111</tspan></text><text x="570.82" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="570.82" dy="0">Inquilinos reubicados de 100 000</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, la proporción reubicada. Con el módulo, añadir una celda mueve casi todo; con el hash por encuentro solo</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se mueve lo que la celda nueva se queda. Mover un inquilino es una migración de datos, de modo que la función de asignación</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">decide el costo de crecer. El reparto entre las 8 celdas fue de 12 339 a 12 713 inquilinos por celda.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
