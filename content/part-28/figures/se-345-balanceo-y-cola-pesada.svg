<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 387" width="910" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">10 servidores, 200 000 solicitudes de tamaño Pareto y 85 % de carga: tiempo hasta terminar (unidades de tiempo; tamaño medio 3,0)</title><desc id="d">Tabla: con turnos rotativos el percentil 99 es 316,8 unidades y con reparto aleatorio 361,6; con dos opciones al azar baja a 95,4 y con la de menos conexiones a 52,6, con una carga del 85 por ciento y tamaños de cola pesada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="387" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Política</tspan></text><rect x="430" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">Mediana</tspan></text><rect x="570" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Percentil 99</tspan></text><rect x="730" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Percentil 99,9</tspan></text><rect x="10" y="56" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Turnos rotativos</tspan></text><rect x="430" y="56" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">13,3</tspan></text><rect x="570" y="56" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">316,8</tspan></text><rect x="730" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">535,1</tspan></text><rect x="10" y="110" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Aleatorio</tspan></text><rect x="430" y="110" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">19,9</tspan></text><rect x="570" y="110" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">361,6</tspan></text><rect x="730" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">632,4</tspan></text><rect x="10" y="164" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Dos opciones al azar, la menos cargada</tspan></text><rect x="430" y="164" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">4,5</tspan></text><rect x="570" y="164" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">95,4</tspan></text><rect x="730" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">203,6</tspan></text><rect x="10" y="218" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Menos conexiones (estado global)</tspan></text><rect x="430" y="218" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">2,7</tspan></text><rect x="570" y="218" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">52,6</tspan></text><rect x="730" y="218" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">188,5</tspan></text><rect x="10" y="276" width="890" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">Repartir por turnos equilibra el número de solicitudes, no el trabajo: un tamaño de cola pesada deja un servidor</tspan></text><text x="455" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">atascado mientras otros esperan. Mirar solo dos servidores logra casi todo el beneficio sin estado global. Los tamaños</tspan></text><text x="455" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">Pareto (forma 1,5) y el 85 % son supuestos del autor.</tspan></text><text x="455" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
