<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 571" width="940" height="571" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">10 servidores, 200 000 solicitudes de tamaño Pareto y 85 % de carga: tiempo hasta terminar</title><desc id="d">Intervalos con la mediana, el percentil 99 y el percentil 99,9 del tiempo hasta terminar una solicitud (tamaño medio 3,0) en escala logarítmica: con turnos rotativos 13,3, 316,8 y 535,1 unidades; con reparto aleatorio 19,9, 361,6 y 632,4; con dos opciones al azar 4,5, 95,4 y 203,6; con la de menos conexiones 2,7, 52,6 y 188,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="571" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">10 servidores, 200 000 solicitudes de tamaño Pareto y 85 % de carga: tiempo hasta terminar</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mediana</tspan></text><polygon points="122.78,44.1 129.38,56.4 116.18,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">p99</tspan></text><polygon points="193.4,43.5 200.9,51 193.4,58.5 185.9,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="207.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="207.4" dy="0">p99,9</tspan></text><line x1="344" y1="77" x2="344" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="373" x2="344" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">1</tspan></text><line x1="526" y1="77" x2="526" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="526" y1="373" x2="526" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="526" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="526" dy="0">10</tspan></text><line x1="708" y1="77" x2="708" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="708" y1="373" x2="708" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="708" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="708" dy="0">100</tspan></text><line x1="890" y1="77" x2="890" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="373" x2="890" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">1 000</tspan></text><line x1="344" y1="373" x2="890" y2="373" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Turnos rotativos</tspan></text><text x="314" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Aleatorio</tspan></text><text x="314" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Dos opciones al azar, la menos cargada</tspan></text><text x="314" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Menos conexiones (estado global)</tspan></text><line x1="548.541" y1="114" x2="840.575" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="541.541" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="548.541" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="548.541" dy="0">13,3</tspan></text><polygon points="799.143,105.95 806.843,120.3 791.443,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="799.143" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="799.143" dy="0">316,8</tspan></text><polygon points="840.575,105.25 849.325,114 840.575,122.75 831.825,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="840.575" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="840.575" dy="0">535,1</tspan></text><line x1="580.391" y1="188" x2="853.781" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="573.391" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="580.391" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="580.391" dy="0">19,9</tspan></text><polygon points="809.598,179.95 817.298,194.3 801.898,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="809.598" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="809.598" dy="0">361,6</tspan></text><polygon points="853.781,179.25 862.531,188 853.781,196.75 845.031,188" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="853.781" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="853.781" dy="0">632,4</tspan></text><line x1="462.885" y1="262" x2="764.198" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="455.885" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="462.885" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="462.885" dy="0">4,5</tspan></text><polygon points="704.278,253.95 711.978,268.3 696.578,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="704.278" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.278" dy="0">95,4</tspan></text><polygon points="764.198,253.25 772.948,262 764.198,270.75 755.448,262" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="764.198" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="764.198" dy="0">203,6</tspan></text><line x1="422.508" y1="336" x2="758.107" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="415.508" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="422.508" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="422.508" dy="0">2,7</tspan></text><polygon points="657.219,327.95 664.919,342.3 649.519,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="657.219" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="657.219" dy="0">52,6</tspan></text><polygon points="758.107,327.25 766.857,336 758.107,344.75 749.357,336" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="758.107" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="758.107" dy="0">188,5</tspan></text><text x="617" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="617" dy="0">Unidades de tiempo (tamaño medio de solicitud 3,0) (escala logarítmica)</tspan></text><rect x="10" y="431" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="455.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Repartir por turnos equilibra el número de solicitudes, no el trabajo: un tamaño de cola pesada deja un servidor atascado</tspan></text><text x="470" y="472.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mientras otros esperan, y la mediana es parecida pero el p99 es seis veces mayor que con dos opciones. Mirar solo dos</tspan></text><text x="470" y="489.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">servidores logra casi todo el beneficio sin estado global. Los tamaños Pareto (forma 1,5) y el 85 % son supuestos del</tspan></text><text x="470" y="505.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">autor.</tspan></text><text x="470" y="553.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
