<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 564" width="940" height="564" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Desechabilidad y configuración: qué pasa al parar un proceso, y un mismo artefacto con tres entornos</title><desc id="d">Barras agrupadas con el resultado de parar un proceso con 100 trabajos en una cola en memoria: un corte inmediato completa 40 y pierde 60; un drenaje ordenado completa 41, devuelve 60 a la cola y no pierde ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="564" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Desechabilidad y configuración: qué pasa al parar un proceso, y un mismo artefacto con tres entornos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Completados</tspan></text><rect x="146.94" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Perdidos</tspan></text><rect x="255.26" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="275.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="275.26" dy="0">Devueltos a la cola</tspan></text><line x1="71.08" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="355" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="268.333" x2="920" y2="268.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="268.333" x2="71.08" y2="268.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="272.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="181.667" x2="920" y2="181.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="181.667" x2="71.08" y2="181.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="186.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Trabajos</text><rect x="113.526" y="181.667" width="110.523" height="173.333" rx="3" fill="#087f8c"/><text x="168.787" y="175.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="168.787" dy="0">40</tspan></text><rect x="228.049" y="95" width="110.523" height="260" rx="3" fill="#c0432f"/><text x="283.31" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="283.31" dy="0">60</tspan></text><rect x="342.571" y="353" width="110.523" height="2" rx="3" fill="#946512"/><text x="397.833" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="397.833" dy="0">0</tspan></text><text x="283.31" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">Corte inmediato con 100 trabajos</tspan></text><rect x="537.986" y="177.333" width="110.523" height="177.667" rx="3" fill="#087f8c"/><text x="593.247" y="171.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="593.247" dy="0">41</tspan></text><rect x="652.509" y="353" width="110.523" height="2" rx="3" fill="#c0432f"/><text x="707.77" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.77" dy="0">0</tspan></text><rect x="767.031" y="95" width="110.523" height="260" rx="3" fill="#946512"/><text x="822.293" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="822.293" dy="0">60</tspan></text><text x="707.77" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">Drenaje ordenado, devuelve lo pendiente</tspan></text><rect x="10" y="407" width="920" height="109.2" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El mismo artefacto con configuración de desarrollo sale con código 0 y umbrales 12 y 48; con la de producción, con código 0</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">y umbrales 1, 24 y 72; sin configurar, con código 1 y el mensaje «falta AVISOS_UMBRALES». El arranque de un proceso Python</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">tarda una mediana de 116 ms vacío y 249 ms con cuatro módulos. La misma huella del archivo con configuración distinta es la</tspan></text><text x="470" y="481.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">paridad que pide el factor de configuración; fallar de inmediato cuando falta es mejor que arrancar con un valor por</tspan></text><text x="470" y="498.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">defecto invisible. Los trabajos y el corte son un modelo; el arranque y la ejecución del artefacto sí se midieron.</tspan></text><text x="470" y="546.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
