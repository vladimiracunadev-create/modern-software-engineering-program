<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 435" width="910" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Repartir por hash o por rango de fecha: dónde caen las escrituras nuevas y cuántos fragmentos toca una consulta</title><desc id="d">Tabla: con reparto por hash, las 5 000 escrituras más recientes se reparten entre 8 fragmentos, de 578 a 674 cada uno, pero toda consulta de un tramo de fechas toca los 8; con rangos fijos, las 5 000 caen en un solo fragmento y una consulta de 100 claves toca uno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="435" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Operación</tspan></text><rect x="390" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Reparto por hash</tspan></text><rect x="670" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Reparto por rango fijo</tspan></text><rect x="10" y="56" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">5 000 escrituras de las entregas más recientes</tspan></text><rect x="390" y="56" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="81.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">674 a 578 por fragmento (8</tspan></text><text x="527" y="97.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">fragmentos)</tspan></text><rect x="670" y="56" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">5 000 en un fragmento</tspan></text><rect x="10" y="122" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Consulta de 100 claves consecutivas</tspan></text><rect x="390" y="122" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">8 fragmentos</tspan></text><rect x="670" y="122" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1 fragmento</tspan></text><rect x="10" y="188" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Consulta de 10 000 claves consecutivas</tspan></text><rect x="390" y="188" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">8 fragmentos</tspan></text><rect x="670" y="188" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1 fragmento</tspan></text><rect x="10" y="254" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Consulta de 50 000 claves consecutivas</tspan></text><rect x="390" y="254" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">8 fragmentos</tspan></text><rect x="670" y="254" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">5 fragmentos</tspan></text><rect x="10" y="324" width="890" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">Cada reparto abarata una pregunta y encarece la otra: el hash esparce la escritura y dispersa la lectura por rango; el</tspan></text><text x="455" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">rango agrupa la lectura y acumula la escritura nueva en un fragmento. Ocho fragmentos y 100 000 claves son sintéticos;</tspan></text><text x="455" y="382.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">el hash es MD5 solo por su reparto, no por seguridad.</tspan></text><text x="455" y="421.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
