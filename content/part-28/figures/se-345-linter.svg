<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 564" width="940" height="564" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un linter de cuatro señales de 12-factor sobre una aplicación con defectos y su versión corregida</title><desc id="d">Barras agrupadas con las señales contadas por un linter de árbol sintáctico sobre dos versiones de la misma aplicación: URL fija 1 y 0, estado en memoria del proceso 2 y 0, registro en archivo local 1 y 0, y lecturas del entorno 1 y 2 en la versión corregida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="564" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un linter de cuatro señales de 12-factor sobre una aplicación con defectos y su versión corregida</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aplicación con defectos</tspan></text><rect x="237.42" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Aplicación corregida</tspan></text><line x1="78.62" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="355" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="290" x2="920" y2="290" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="290" x2="78.62" y2="290" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="294.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,5</tspan></text><line x1="78.62" y1="225" x2="920" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="225" x2="78.62" y2="225" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="229.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="160" x2="920" y2="160" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="160" x2="78.62" y2="160" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="164.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1,5</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">2</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Señales encontradas</text><rect x="99.6545" y="225" width="82.138" height="130" rx="3" fill="#c0432f"/><text x="140.724" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140.724" dy="0">1</tspan></text><rect x="185.793" y="353" width="82.138" height="2" rx="3" fill="#087f8c"/><text x="226.862" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="226.862" dy="0">0</tspan></text><text x="183.793" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">URL fija en el código</tspan></text><rect x="310" y="95" width="82.138" height="260" rx="3" fill="#c0432f"/><text x="351.069" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="351.069" dy="0">2</tspan></text><rect x="396.138" y="353" width="82.138" height="2" rx="3" fill="#087f8c"/><text x="437.207" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.207" dy="0">0</tspan></text><text x="394.138" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">Estado en memoria del</tspan></text><text x="394.138" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">proceso</tspan></text><rect x="520.345" y="225" width="82.138" height="130" rx="3" fill="#c0432f"/><text x="561.413" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.413" dy="0">1</tspan></text><rect x="606.483" y="353" width="82.138" height="2" rx="3" fill="#087f8c"/><text x="647.552" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.552" dy="0">0</tspan></text><text x="604.482" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">Registro en archivo local</tspan></text><rect x="730.689" y="225" width="82.138" height="130" rx="3" fill="#c0432f"/><text x="771.758" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.758" dy="0">1</tspan></text><rect x="816.827" y="95" width="82.138" height="260" rx="3" fill="#087f8c"/><text x="857.896" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.896" dy="0">2</tspan></text><text x="814.827" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">Lecturas del entorno</tspan></text><rect x="10" y="424" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las tres primeras señales son defectos y desaparecen al corregir; las lecturas del entorno son la señal buena y suben de 1</tspan></text><text x="470" y="465.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">a 2. El linter ve la forma del código, no su comportamiento: una URL construida por concatenación o un estado guardado en</tspan></text><text x="470" y="482.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un atributo de clase pasarían. Detecta cuatro señales de dos aplicaciones de juguete; no certifica que una aplicación sea</tspan></text><text x="470" y="498.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">12-factor.</tspan></text><text x="470" y="546.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
