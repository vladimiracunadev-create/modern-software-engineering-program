<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 275" width="960" height="275" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Peticiones sin sesión de 1 000 con tres instancias, 100 usuarios y una instancia que cae en la petición 500</title><desc id="d">Gráfico de barras con las peticiones que no encuentran su sesión de 1 000: con sesiones en memoria y balanceo sin afinidad 611, con afinidad por usuario 140 que corresponden a la instancia caída, y con un almacén externo compartido 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="275" fill="#ffffff"/><text x="304" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">En memoria, sin afinidad</tspan></text><rect x="314" y="16" width="366.6" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="688.6" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="688.6" dy="0">611</tspan></text><text x="304" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">En memoria, con afinidad</tspan></text><rect x="314" y="62" width="84" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="406" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="406" dy="0">140</tspan></text><text x="304" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Almacén externo</tspan></text><rect x="314" y="108" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="326" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="326" dy="0">0</tspan></text><rect x="10" y="156" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="180.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Una aplicación con estado en el proceso no puede escalar horizontalmente ni sobrevivir a una caída: sin afinidad falla en 611</tspan></text><text x="480" y="197.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">de 1 000 peticiones aun sin caída; con afinidad pierde las sesiones de la instancia que cae. El estado externo lo resuelve a</tspan></text><text x="480" y="214.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">costa de una dependencia más, que el modelo no cuenta.</tspan></text><text x="480" y="261.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
