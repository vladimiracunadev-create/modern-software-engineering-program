<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 471" width="780" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter de planes de caos sobre 200 mutaciones: 147 detectadas</title><desc id="d">Tabla: un linter de forma detecta 147 de 200 mutaciones de un plan de experimento de caos, todas las de campos ausentes, alcance total, aborto inalcanzable e hipótesis sin umbral, y ninguna de las 53 que dejan los campos plausibles: resultados copiados de otro entorno y reversiones nunca ensayadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="780" height="471" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Mutación</tspan></text><rect x="570" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Campo ausente o vacío</tspan></text><rect x="570" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">50 de 50</tspan></text><rect x="10" y="106" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Alcance del 100 % del tráfico</tspan></text><rect x="570" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">33 de 33</tspan></text><rect x="10" y="156" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Condición de aborto inalcanzable</tspan></text><rect x="570" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">29 de 29</tspan></text><rect x="10" y="206" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Hipótesis sin umbral medible</tspan></text><rect x="570" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">35 de 35</tspan></text><rect x="10" y="256" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Resultado copiado de otro entorno</tspan></text><rect x="570" y="256" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">0 de 29</tspan></text><rect x="10" y="306" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Reversión nunca ensayada</tspan></text><rect x="570" y="306" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">0 de 24</tspan></text><rect x="10" y="360" width="760" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="390" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">Las dos que el linter no ve son las que convierten un experimento en teatro: un resultado que no se</tspan></text><text x="390" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">obtuvo y una reversión que nunca se probó. Las reglas se escribieron conociendo las mutaciones, así</tspan></text><text x="390" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">que cada tipo sale al 0 % o al 100 %; la exactitud sobre planes reales es desconocida.</tspan></text><text x="390" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="390" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
