n></text><rect x="10" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">50 %</tspan></text><rect x="190" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">50,1 % · 1,00</tspan></text><rect x="410" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">93,1 % · 1,90</tspan></text><rect x="650" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">93,1 % · 1,90</tspan></text><rect x="10" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">80 %</tspan></text><rect x="190" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">20,1 % · 1,00</tspan></text><rect x="410" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">54,1 % · 3,05</tspan></text><rect x="650" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">9,9 % · 0,53</tspan></text><rect x="10" y="260" width="860" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="440" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">Un experimento de caos busca el punto donde la estrategia deja de proteger: aquí, entre 50 % y 80 %, los reintentos</tspan></text><text x="440" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">triplican la carga sobre una dependencia ya enferma y el interruptor sacrifica éxito para dejarla respirar. El</tspan></text><text x="440" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">servicio, su capacidad de 100 y el exceso son un modelo del autor.</tspan></text><text x="440" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
