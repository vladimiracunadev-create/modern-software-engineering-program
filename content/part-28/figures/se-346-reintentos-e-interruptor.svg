<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 371" width="880" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Éxito y llamadas por solicitud según el fallo inyectado y la estrategia del cliente (80 solicitudes por turno)</title><desc id="d">Tabla de éxito y llamadas por solicitud: con 20 por ciento de fallo inyectado, los reintentos suben el éxito de 80,5 a 99,9 por ciento con 1,24 llamadas; con 80 por ciento de fallo los reintentos llegan a 54,1 con 3,05 llamadas y el interruptor baja el éxito a 9,9 con 0,53 llamadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="880" height="371" fill="#ffffff"/><rect x="10" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="97" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="97" dy="0">Fallo inyectado</tspan></text><rect x="190" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="297" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="297" dy="0">Sin reintentos</tspan></text><rect x="410" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Con reintentos (máx. 4)</tspan></text><rect x="650" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757