<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 387" width="840" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reproducir la carrera del cupo y reducir el calendario hasta lo esencial</title><desc id="d">Tabla: de las 20 intercalaciones de dos solicitudes que leen, comprueban y escriben el cupo, 18 aceptan dos entregas con cupo 1; un calendario fallido de 40 pasos con ruido se redujo a 6 pasos que siguen fallando.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="387" fill="#ffffff"/><rect x="10" y="12" width="594" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Medida</tspan></text><rect x="610" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Resultado</tspan></text><rect x="10" y="56" width="594" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Intercalaciones de 2 solicitudes (3 pasos cada una)</tspan></text><rect x="610" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">20</tspan></text><rect x="10" y="110" width="594" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">…con dos entregas aceptadas con cupo 1</tspan></text><rect x="610" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">18 (90 %)</tspan></text><rect x="10" y="164" width="594" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Calendario fallido al azar, con 4 solicitudes y ruido</tspan></text><rect x="610" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">40 pasos</tspan></text><rect x="10" y="218" width="594" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Calendario mínimo que sigue fallando (reducción por bloques)</tspan></text><rect x="610" y="218" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">6 pasos</tspan></text><rect x="10" y="276" width="820" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="420" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="420" dy="0">Un fallo reproducible se reduce eliminando pasos mientras siga fallando: lo que queda es la explicación</tspan></text><text x="420" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="420" dy="0">(leer, comprobar, leer, escribir, comprobar, escribir). El ruido son pasos ajenos al cupo y el calendario</tspan></text><text x="420" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="420" dy="0">sale de la semilla 347; con hilos del sistema operativo no se controla el orden.</tspan></text><text x="420" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
