<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis escenarios de calidad de Avisos con su medida y su importancia en dos contextos</title><desc id="d">Mapa de calor con la importancia de seis escenarios de calidad en dos contextos: latencia y disponibilidad son de importancia alta en ambos, el radio de impacto de hasta 15 por ciento de los inquilinos es alta con un cliente dominante y baja sin él, y la coordinación de despliegue, el costo y la extensión son de importancia media en ambos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis escenarios de calidad de Avisos con su medida y su importancia en dos contextos</tspan></text><text x="503" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="503" dy="0">Con cliente dominante</tspan></text><text x="781" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="781" dy="0">Sin cliente dominante</tspan></text><text x="354" y="96.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">S1 latencia: p99 ≤ 200 ms</tspan></text><text x="354" y="136.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">S2 disponibilidad: ≥ 99,9 %</tspan></text><text x="354" y="176.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">S3 radio de impacto: ≤ 15 % de inquilinos</tspan></text><text x="354" y="216.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">S4 coordinación de despliegue: ≤ 2 equipos</tspan></text><text x="354" y="256.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">S5 costo: ≤ 12 unidades</tspan></text><text x="354" y="296.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">S6 extensión: canal nuevo sin tocar el núcleo</tspan></text><rect x="365.5" y="73.5" width="275" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="503" y="96.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="503" dy="0">alta</tspan></text><rect x="643.5" y="73.5" width="275" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="781" y="96.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="781" dy="0">alta</tspan></text><rect x="365.5" y="113.5" width="275" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="503" y="136.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="503" dy="0">alta</tspan></text><rect x="643.5" y="113.5" width="275" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="781" y="136.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="781" dy="0">alta</tspan></text><rect x="365.5" y="153.5" width="275" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="503" y="176.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="503" dy="0">alta</tspan></text><rect x="643.5" y="153.5" width="275" height="37" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="781" y="176.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="781" dy="0">baja</tspan></text><rect x="365.5" y="193.5" width="275" height="37" rx="4" fill="#748698" stroke="#ffffff" stroke-width="1"/><text x="503" y="216.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="503" dy="0">media</tspan></text><rect x="643.5" y="193.5" width="275" height="37" rx="4" fill="#748698" stroke="#ffffff" stroke-width="1"/><text x="781" y="216.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="781" dy="0">media</tspan></text><rect x="365.5" y="233.5" width="275" height="37" rx="4" fill="#748698" stroke="#ffffff" stroke-width="1"/><text x="503" y="256.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="503" dy="0">media</tspan></text><rect x="643.5" y="233.5" width="275" height="37" rx="4" fill="#748698" stroke="#ffffff" stroke-width="1"/><text x="781" y="256.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="781" dy="0">media</tspan></text><rect x="365.5" y="273.5" width="275" height="37" rx="4" fill="#748698" stroke="#ffffff" stroke-width="1"/><text x="503" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="503" dy="0">media</tspan></text><rect x="643.5" y="273.5" width="275" height="37" rx="4" fill="#748698" stroke="#ffffff" stroke-width="1"/><text x="781" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="781" dy="0">media</tspan></text><text x="364" y="338" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="364" dy="0">baja</tspan></text><rect x="402.16" y="326" width="30.5" height="14" fill="#d9e2ec"/><rect x="432.16" y="326" width="30.5" height="14" fill="#bcc8d4"/><rect x="462.16" y="326" width="30.5" height="14" fill="#a0adbc"/><rect x="492.16" y="326" width="30.5" height="14" fill="#8393a4"/><rect x="522.16" y="326" width="30.5" height="14" fill="#66798b"/><rect x="552.16" y="326" width="30.5" height="14" fill="#495f73"/><rect x="582.16" y="326" width="30.5" height="14" fill="#2d445b"/><rect x="612.16" y="326" width="30.5" height="14" fill="#102a43"/><text x="650.16" y="338" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="650.16" dy="0">alta</tspan></text><text x="688.32" y="338" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="688.32" dy="0">más oscuro = mayor (Importancia)</tspan></text><rect x="10" y="354" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="378.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada escenario tiene una medida que se puede comprobar; la importancia es una decisión de negocio, no una medición. El</tspan></text><text x="470" y="395.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">único escenario que cambia de importancia entre los dos contextos es el radio de impacto, y eso es suficiente para cambiar</tspan></text><text x="470" y="412.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el resultado.</tspan></text><text x="470" y="459.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
