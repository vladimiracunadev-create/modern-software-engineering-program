<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 353" width="960" height="353" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ciclo de una decisión arquitectónica defendida: de los escenarios al disparador de revisión</title><desc id="d">Diagrama de cinco cajas en dos filas: escenarios de calidad con medida, alternativas evaluadas con evidencia, ADR con consecuencias negativas, función de aptitud que protege la decisión y disparador de revisión numérico; una flecha de retorno lleva del disparador a los escenarios.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="353" fill="#ffffff"/><rect x="10" y="14" width="284" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Escenarios</tspan></text><text x="152" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Con medida y contexto</tspan></text><rect x="338" y="14" width="284" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Alternativas</tspan></text><text x="480" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Evaluadas con evidencia y supuestos</tspan></text><polyline points="294,62 338,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">ADR</tspan></text><text x="808" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">Decisión, costos y reversibilidad</tspan></text><polyline points="622,62 666,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="150" width="284" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="152" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">Función de aptitud</tspan></text><text x="152" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">Protege la decisión contra la deriva</tspan></text><rect x="338" y="150" width="284" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Disparador de revisión</tspan></text><text x="480" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un número y un plazo</tspan></text><polyline points="294,198 338,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,110 808,130 152,130 152,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="260" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Una decisión arquitectónica es una hipótesis con fecha de revisión: el disparador numérico (por ejemplo, p99 mayor que 200 ms</tspan></text><text x="480" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">durante 3 días seguidos) dice cuándo la evidencia obliga a volver a los escenarios.</tspan></text><text x="480" y="343.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
