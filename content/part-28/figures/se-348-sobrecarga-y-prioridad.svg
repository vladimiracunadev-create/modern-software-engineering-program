<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 375" width="930" height="375" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Llegan 150 solicitudes por turno a un sistema que atiende 100, durante 120 turnos</title><desc id="d">Tabla: sin límite quedan 6 000 solicitudes en cola y la espera media sube a unos 21 turnos; con una cola acotada la espera baja a 2 turnos pero se descartan 1 761 entregas y 4 139 listados; con prioridad se descartan 0 entregas y 5 900 listados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="375" fill="#ffffff"/><rect x="10" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="117" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="117" dy="0">Política</tspan></text><rect x="230" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="297" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="297" dy="0">Al final</tspan></text><rect x="370" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Espera media de una</tspan></text><text x="457" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">entrega</tspan></text><rect x="550" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="637" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">Espera media de un</tspan></text><text x="637" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">listado</tspan></text><rect x="730" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Descartadas</tspan></text><rect x="10" y="56" width="214" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="90.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Sin límite</tspan></text><rect x="230" y="56" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">6 000 en cola</tspan></text><rect x="370" y="56" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">21,2 turnos</tspan></text><rect x="550" y="56" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">20,9 turnos</tspan></text><rect x="730" y="56" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0</tspan></text><rect x="10" y="124" width="214" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Cola acotada a 200</tspan></text><rect x="230" y="124" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">100 en cola</tspan></text><rect x="370" y="124" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">2,0 turnos</tspan></text><rect x="550" y="124" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">2,0 turnos</tspan></text><rect x="730" y="124" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="150.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">1 761 entregas y 4 139</tspan></text><text x="822" y="166.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">listados</tspan></text><rect x="10" y="192" width="214" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="226.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Cola acotada con prioridad</tspan></text><rect x="230" y="192" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">100 en cola</tspan></text><rect x="370" y="192" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">1,0 turnos</tspan></text><rect x="550" y="192" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">2,8 turnos</tspan></text><rect x="730" y="192" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="218.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0 entregas y 5 900</tspan></text><text x="822" y="234.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">listados</tspan></text><rect x="10" y="264" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="288.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Si llegan más solicitudes de las que se atienden, algo espera o se descarta; elegir qué se descarta es la política. La</tspan></text><text x="465" y="305.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">prioridad protege lo que no se puede reintentar sin costo. Que la cola crezca 50 por turno hasta 6 000 explica una espera</tspan></text><text x="465" y="322.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">que sube hasta unos 41 turnos (ley de Little). Las proporciones 30/70 y la capacidad son supuestos del autor.</tspan></text><text x="465" y="361.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
