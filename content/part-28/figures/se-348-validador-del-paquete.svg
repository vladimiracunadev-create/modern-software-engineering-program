<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 583" width="940" height="583" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador del paquete del servicio distribuido sobre 200 mutaciones: 101 detectadas y 99 que pasan</title><desc id="d">Barras apiladas horizontales por tipo de mutación de un paquete de servicio distribuido: el verificador de forma detecta las 59 de campo ausente, las 21 de degradación sin límite y las 21 de reintento «hasta que funcione», y ninguna de las 23 de presupuesto de tiempos incoherente, 23 de evidencia copiada, 25 de prueba nunca ejecutada ni 28 de garantía imposible.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="583" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Validador del paquete del servicio distribuido sobre 200 mutaciones: 101 detectadas y 99 que pasan</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="284" y1="77" x2="284" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="385" x2="284" y2="390" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="481.233" y1="77" x2="481.233" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="481.233" y1="385" x2="481.233" y2="390" stroke="#5b7280" stroke-width="1.4"/><text x="481.233" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="481.233" dy="0">20</tspan></text><line x1="678.467" y1="77" x2="678.467" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="678.467" y1="385" x2="678.467" y2="390" stroke="#5b7280" stroke-width="1.4"/><text x="678.467" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="678.467" dy="0">40</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="385" x2="875.7" y2="390" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">60</tspan></text><line x1="284" y1="385" x2="875.7" y2="385" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Campo ausente o vacío</tspan></text><text x="274" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Degradación sin límite declarado</tspan></text><text x="274" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Reintento «hasta que funcione»</tspan></text><text x="274" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Presupuesto de tiempos incoherente</tspan></text><text x="274" y="271" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Evidencia copiada del servicio</tspan></text><text x="274" y="288" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">vecino</tspan></text><text x="274" y="315" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Prueba de fallos que nunca se</tspan></text><text x="274" y="332" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">ejecutó</tspan></text><text x="274" y="367.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Garantía imposible</tspan></text><rect x="284" y="84" width="581.838" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="574.919" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.919" dy="0">59</tspan></text><rect x="865.838" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="872.838" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="872.838" dy="0">59</tspan></text><rect x="284" y="128" width="207.095" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="387.548" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387.548" dy="0">21</tspan></text><rect x="491.095" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="498.095" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498.095" dy="0">21</tspan></text><rect x="284" y="172" width="207.095" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="387.548" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387.548" dy="0">21</tspan></text><rect x="491.095" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="498.095" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498.095" dy="0">21</tspan></text><rect x="284" y="216" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="284" y="216" width="226.818" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="397.409" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397.409" dy="0">23</tspan></text><text x="517.818" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="517.818" dy="0">23</tspan></text><rect x="284" y="260" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="284" y="260" width="226.818" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="397.409" y="279.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397.409" dy="0">23</tspan></text><text x="517.818" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="517.818" dy="0">23</tspan></text><rect x="284" y="304" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="284" y="304" width="246.542" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="407.271" y="323.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407.271" dy="0">25</tspan></text><text x="537.542" y="323.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="537.542" dy="0">25</tspan></text><rect x="284" y="348" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="284" y="348" width="276.127" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="422.063" y="367.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422.063" dy="0">28</tspan></text><text x="567.127" y="367.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="567.127" dy="0">28</tspan></text><text x="579.85" y="429" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="579.85" dy="0">Mutaciones del paquete</tspan></text><rect x="10" y="443" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="467.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un paquete completo no es un paquete correcto. Lo que ningún validador de forma ve es lo que ocurre en las revisiones</tspan></text><text x="470" y="484.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reales: un presupuesto de 800 ms con 3 llamadas de 500 ms, una garantía de exactamente una vez y disponible en cualquier</tspan></text><text x="470" y="501.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">partición, una prueba que no se corrió. Reglas escritas conociendo las mutaciones: la exactitud sobre paquetes reales es</tspan></text><text x="470" y="517.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">desconocida.</tspan></text><text x="470" y="565.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
