<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 403" width="920" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de dejar al menos un ajuste de seguridad mal configurado</title><desc id="d">Tabla: con una probabilidad de error del 1 por ciento por ajuste, dejar al menos uno mal puesto ocurre en el 95,1 por ciento de las instalaciones propias con 300 ajustes, 70,1 con IaaS y 120 ajustes, 36,4 con PaaS y 45 ajustes y 13,1 con SaaS y 14 ajustes; con el 2 por ciento sube a 99,8, 91,1, 59,7 y 24,6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="403" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Modelo</tspan></text><rect x="220" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="292" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="292" dy="0">Ajustes del</tspan></text><text x="292" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="292" dy="0">cliente</tspan></text><rect x="370" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">P(al menos 1 error), 1 % por</tspan></text><text x="492" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">ajuste</tspan></text><rect x="620" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="687" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">P, 2 % por</tspan></text><text x="687" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">ajuste</tspan></text><rect x="760" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Errores</tspan></text><text x="832" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">esperados (1 %)</tspan></text><rect x="10" y="56" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Instalación propia</tspan></text><rect x="220" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">300</tspan></text><rect x="370" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">95,1 %</tspan></text><rect x="620" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">99,8 %</tspan></text><rect x="760" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">3,0</tspan></text><rect x="10" y="114" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">IaaS</tspan></text><rect x="220" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">120</tspan></text><rect x="370" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">70,1 %</tspan></text><rect x="620" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">91,1 %</tspan></text><rect x="760" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">1,2</tspan></text><rect x="10" y="172" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">PaaS</tspan></text><rect x="220" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">45</tspan></text><rect x="370" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">36,4 %</tspan></text><rect x="620" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">59,7 %</tspan></text><rect x="760" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0,45</tspan></text><rect x="10" y="230" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">SaaS</tspan></text><rect x="220" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">14</tspan></text><rect x="370" y="230" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">13,1 %</tspan></text><rect x="620" y="230" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">24,6 %</tspan></text><rect x="760" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0,14</tspan></text><rect x="10" y="292" width="900" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">La probabilidad cae porque hay menos ajustes, no porque el cliente se equivoque menos. Con 14 ajustes y un 1 % de error,</tspan></text><text x="460" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">uno de cada ocho equipos tiene un error: el modelo es el producto 1 − (1 − p)^n, verificado con 20 000 ensayos por</tspan></text><text x="460" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">celda; los 300, 120, 45 y 14 ajustes son supuestos del autor.</tspan></text><text x="460" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
