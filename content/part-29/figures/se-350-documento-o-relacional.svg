<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Registros que toca cada operación con filas relacionadas y con documentos embebidos</title><desc id="d">Barras agrupadas con los registros tocados por tres operaciones: leer una entrega toca 3 filas relacionadas o 1 documento; renombrar a un estudiante con 16 entregas toca 1 fila o 16 documentos; si el renombrado se corta a mitad, ninguna fila queda con el nombre viejo y 8 de los 16 documentos sí.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Registros que toca cada operación con filas relacionadas y con documentos embebidos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Filas relacionadas</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Documentos embebidos</tspan></text><line x1="71.08" y1="345" x2="920" y2="345" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="345" x2="71.08" y2="345" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="349.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="282.5" x2="920" y2="282.5" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="282.5" x2="71.08" y2="282.5" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="287" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="220" x2="920" y2="220" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="220" x2="71.08" y2="220" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="157.5" x2="920" y2="157.5" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="157.5" x2="71.08" y2="157.5" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="162" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="345" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">Registros tocados o desactualizados</text><rect x="99.3773" y="307.5" width="111.189" height="37.5" rx="3" fill="#087f8c"/><text x="154.972" y="301.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.972" dy="0">3</tspan></text><rect x="214.567" y="332.5" width="111.189" height="12.5" rx="3" fill="#946512"/><text x="270.161" y="326.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.161" dy="0">1</tspan></text><text x="212.567" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Leer una entrega con su estudiante y</tspan></text><text x="212.567" y="383" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">su curso</tspan></text><rect x="382.351" y="332.5" width="111.189" height="12.5" rx="3" fill="#087f8c"/><text x="437.945" y="326.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.945" dy="0">1</tspan></text><rect x="497.54" y="145" width="111.189" height="200" rx="3" fill="#946512"/><text x="553.135" y="139" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.135" dy="0">16</tspan></text><text x="495.54" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Renombrar a un estudiante con 16</tspan></text><text x="495.54" y="383" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">entregas</tspan></text><rect x="665.324" y="343" width="111.189" height="2" rx="3" fill="#087f8c"/><text x="720.919" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.919" dy="0">0</tspan></text><rect x="780.513" y="245" width="111.189" height="100" rx="3" fill="#946512"/><text x="836.108" y="239" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.108" dy="0">8</tspan></text><text x="778.513" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Mismo renombrado cortado a mitad:</tspan></text><text x="778.513" y="383" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">registros con el nombre viejo</tspan></text><rect x="10" y="414" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="438.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El documento gana cuando la lectura es siempre la misma entidad completa (1 documento frente a 3 filas); pierde cuando el</tspan></text><text x="470" y="455.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mismo dato se repite y cambia (16 documentos frente a 1 fila). Los bytes del JSON del documento ocupan 4,78 veces más (1</tspan></text><text x="470" y="472.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">229 093 frente a 257 103); no son de un motor documental real y la lectura relacional se midió solo como las dos columnas</tspan></text><text x="470" y="488.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">necesarias.</tspan></text><text x="470" y="536.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
