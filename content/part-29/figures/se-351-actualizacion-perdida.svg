<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valor final de un contador que suben tres clientes (valor correcto: 3)</title><desc id="d">Barras apiladas horizontales con la proporción de intercalaciones según el valor final: con leer-sumar-escribir 7 por ciento termina en 3, 53 por ciento en 1 y 40 por ciento en 2, sin aviso; con comprobación de versión 7 por ciento acepta tres escrituras y el resto pierde dos o una; con un UPDATE atómico el 100 por ciento termina en 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Valor final de un contador que suben tres clientes (valor correcto: 3)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Final = 3 (correcto)</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Final = 2</tspan></text><rect x="330.66" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="350.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="350.66" dy="0">Final = 1</tspan></text><line x1="294" y1="77" x2="294" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="209" x2="294" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="439.425" y1="77" x2="439.425" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="439.425" y1="209" x2="439.425" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="439.425" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.425" dy="0">25</tspan></text><line x1="584.85" y1="77" x2="584.85" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="584.85" y1="209" x2="584.85" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="584.85" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="584.85" dy="0">50</tspan></text><line x1="730.275" y1="77" x2="730.275" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="730.275" y1="209" x2="730.275" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="730.275" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.275" dy="0">75</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="209" x2="875.7" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="294" y1="209" x2="875.7" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Leer, sumar uno y escribir (90</tspan></text><text x="284" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">intercalaciones)</tspan></text><text x="284" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Escribir solo si la versión no cambió</tspan></text><text x="284" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">(90 intercalaciones)</tspan></text><text x="284" y="183" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">UPDATE n = n + 1 atómico (6</tspan></text><text x="284" y="200" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">intercalaciones)</tspan></text><rect x="294" y="84" width="38.78" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="313.39" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="313.39" dy="0">7 %</tspan></text><rect x="332.78" y="84" width="232.68" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="449.12" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="449.12" dy="0">40 %</tspan></text><rect x="565.46" y="84" width="310.24" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="720.58" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="720.58" dy="0">53 %</tspan></text><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="294" y="128" width="38.78" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="313.39" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="313.39" dy="0">7 %</tspan></text><rect x="332.78" y="128" width="310.24" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="487.9" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487.9" dy="0">53 %</tspan></text><rect x="643.02" y="128" width="232.68" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="759.36" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="759.36" dy="0">40 %</tspan></text><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="294" y="172" width="581.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">100 %</tspan></text><rect x="875.7" y="172" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="875.7" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="584.85" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">% del total</tspan></text><rect x="10" y="267" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La actualización perdida no falla: devuelve éxito a los tres clientes y deja un valor equivocado. La comprobación de</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">versión no evita el conflicto, lo vuelve visible para que el cliente reintente (acepta tantas escrituras como el valor</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">final). Se ejecutó sobre SQLite con tres conexiones en un hilo y orden forzado.</tspan></text><text x="470" y="372.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
