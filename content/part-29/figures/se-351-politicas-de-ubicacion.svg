<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 345" width="950" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pods que no caben (de 150) en 19 nodos de 4 CPU y 16 GiB según la política y el orden de llegada</title><desc id="d">Tabla: con el 91 por ciento de la CPU del clúster ocupada, primer ajuste y mejor ajuste dejan sin ubicar menos de un pod con llegada al azar, 34 si los pods se ordenan por CPU decreciente y 27 por memoria decreciente, y ninguno si se ordenan por su dimensión dominante; menos asignado deja 1,41, 0, 2 y 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="345" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Política</tspan></text><rect x="320" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Llegada al azar (media de</tspan></text><text x="422" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">200; peor)</tspan></text><rect x="530" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">CPU</tspan></text><text x="592" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">decreciente</tspan></text><rect x="660" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Memoria</tspan></text><text x="727" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">decreciente</tspan></text><rect x="800" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">Dimensión</tspan></text><text x="867" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">dominante</tspan></text><rect x="10" y="56" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Primer ajuste</tspan></text><rect x="320" y="56" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,05 (peor: 4)</tspan></text><rect x="530" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">34</tspan></text><rect x="660" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">27</tspan></text><rect x="800" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0</tspan></text><rect x="10" y="114" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Mejor ajuste</tspan></text><rect x="320" y="114" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,04 (peor: 3)</tspan></text><rect x="530" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">34</tspan></text><rect x="660" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">27</tspan></text><rect x="800" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0</tspan></text><rect x="10" y="172" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Menos asignado (por defecto de Kubernetes)</tspan></text><rect x="320" y="172" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">1,41 (peor: 5)</tspan></text><rect x="530" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">0</tspan></text><rect x="660" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">2</tspan></text><rect x="800" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">4</tspan></text><rect x="10" y="234" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Ordenar de mayor a menor mejora el empaquetado de una sola dimensión y lo empeora en dos: los pods grandes en CPU llenan los</tspan></text><text x="475" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">nodos y dejan memoria sin usar. Ninguna política gana siempre. El conjunto es sintético (69 250 m de CPU y 228 864 MiB</tspan></text><text x="475" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">pedidos) y el orden por dimensión dominante es una elección del autor.</tspan></text><text x="475" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
