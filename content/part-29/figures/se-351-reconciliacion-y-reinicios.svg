<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Réplicas-segundo ausentes en 600 s con 10 réplicas deseadas, según cada cuánto revisa el controlador (media de 300 corridas)</title><desc id="d">Tabla: con un intervalo de revisión de 1 segundo faltan en promedio 102,6 réplicas-segundo en 600 segundos; con 5 segundos faltan 125,4, con 15 faltan 193,9, con 30 faltan 319,9 y con 60 faltan 474,4. Con un retardo de reinicio que se duplica desde 10 s hasta 300 s, una réplica que siempre falla se reinicia 15 veces en una hora; con 10 s fijos serían 360.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Intervalo del controlador</tspan></text><rect x="260" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Réplicas-segundo ausentes</tspan></text><rect x="510" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Lectura</tspan></text><rect x="10" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">1 s</tspan></text><rect x="260" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">102,6</tspan></text><rect x="510" y="56" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">Una lectura por segundo; el arranque (7 s) domina</tspan></text><rect x="10" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">5 s</tspan></text><rect x="260" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">125,4</tspan></text><rect x="510" y="106" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">+22 % respecto de 1 s</tspan></text><rect x="10" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">15 s</tspan></text><rect x="260" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">193,9</tspan></text><rect x="510" y="156" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">Casi el doble que con 1 s</tspan></text><rect x="10" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">30 s</tspan></text><rect x="260" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">319,9</tspan></text><rect x="510" y="206" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">3,1 veces</tspan></text><rect x="10" y="256" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">60 s</tspan></text><rect x="260" y="256" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">474,4</tspan></text><rect x="510" y="256" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">4,6 veces</tspan></text><rect x="10" y="310" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El bucle no evita el fallo: acota cuánto dura. La espera tras cada reinicio cuesta menos que reiniciar sin freno, porque 15</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">intentos por hora en lugar de 360 dejan a la réplica fallida de agotar los recursos del nodo. Dos fallos por réplica del</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">0,2 % por segundo y 3 pods perdidos en el segundo 100 son supuestos del autor.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
