<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 421" width="920" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que el uso real de un nodo supere su capacidad según cuánto se sobreasigna lo pedido</title><desc id="d">Tabla: si la suma de lo pedido es igual a la capacidad, el nodo no se satura nunca; con 1,25 veces, el 0,1 por ciento de los casos; con 1,5 veces, el 4,3; con 2 veces, el 67,9; con 3 veces, siempre. El uso medio sube del 51 al 100 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="421" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Pedido ÷ capacidad</tspan></text><rect x="310" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Probabilidad de saturar</tspan></text><rect x="610" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Uso medio del nodo</tspan></text><rect x="10" y="56" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1,00</tspan></text><rect x="310" y="56" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">0,0 %</tspan></text><rect x="610" y="56" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">51 %</tspan></text><rect x="10" y="106" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1,25</tspan></text><rect x="310" y="106" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">0,1 %</tspan></text><rect x="610" y="106" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">65 %</tspan></text><rect x="10" y="156" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1,50</tspan></text><rect x="310" y="156" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">4,3 %</tspan></text><rect x="610" y="156" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">79 %</tspan></text><rect x="10" y="206" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">2,00</tspan></text><rect x="310" y="206" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">67,9 %</tspan></text><rect x="610" y="206" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">97 %</tspan></text><rect x="10" y="256" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">3,00</tspan></text><rect x="310" y="256" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">100 %</tspan></text><rect x="610" y="256" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">100 %</tspan></text><rect x="10" y="310" width="900" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">La sobreasignación compra uso medio a cambio de riesgo de cola: pasar de 1,5 a 2,0 veces no suma un 33 % de riesgo, lo</tspan></text><text x="460" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">multiplica por 16. La distribución del uso (normal de media 0,55 y desviación 0,25 de lo pedido, acotada) es un supuesto</tspan></text><text x="460" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">del autor; con uso correlacionado entre pods el riesgo sería mayor.</tspan></text><text x="460" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
