x="672" dy="0">0,08 %</tspan></text><rect x="750" y="256" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0,01 %</tspan></text><rect x="10" y="310" width="890" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">El arranque en frío no es un defecto del tráfico alto: a 30 peticiones por minuto es raro y a 0,05 es casi la regla. La</tspan></text><text x="455" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">tasa baja con ráfagas sufre más que la alta uniforme. Siete días de llegadas de Poisson, una petición por instancia a</tspan></text><text x="455" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">la vez y 0,2 s de servicio son supuestos del autor.</tspan></text><text x="455" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
