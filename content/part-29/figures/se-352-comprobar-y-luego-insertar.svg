<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 364" width="940" height="364" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres clientes registran la misma entrega (estudiante, tarea) en las 90 intercalaciones posibles</title><desc id="d">Barras apiladas horizontales con las filas que quedan tras 90 intercalaciones de comprobar y luego insertar: sin restricción de unicidad solo 18 dejan una fila, 36 dejan dos y 36 dejan tres; con UNIQUE todas dejan una y el motor rechaza 108 inserciones duplicadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="364" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres clientes registran la misma entrega (estudiante, tarea) en las 90 intercalaciones posibles</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">1 fila (correcto)</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">2 filas</tspan></text><rect x="292.96" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="312.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="312.96" dy="0">3 filas</tspan></text><line x1="274" y1="77" x2="274" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="199" x2="274" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="77" x2="394.34" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="199" x2="394.34" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">20</tspan></text><line x1="514.68" y1="77" x2="514.68" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="199" x2="514.68" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">40</tspan></text><line x1="635.02" y1="77" x2="635.02" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="199" x2="635.02" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">60</tspan></text><line x1="755.36" y1="77" x2="755.36" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="199" x2="755.36" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">80</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="199" x2="875.7" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="274" y1="199" x2="875.7" y2="199" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Comprobar y luego insertar, sin</tspan></text><text x="264" y="120.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">UNIQUE</tspan></text><text x="264" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Comprobar y luego insertar, con</tspan></text><text x="264" y="173" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">UNIQUE (el motor rechaza 108</tspan></text><text x="264" y="190" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">inserciones)</tspan></text><rect x="274" y="84" width="108.306" height="47" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="328.153" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="328.153" dy="0">18</tspan></text><rect x="382.306" y="84" width="216.612" height="47" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="490.612" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="490.612" dy="0">36</tspan></text><rect x="598.918" y="84" width="216.612" height="47" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="707.224" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707.224" dy="0">36</tspan></text><text x="822.53" y="112" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="822.53" dy="0">90</tspan></text><rect x="274" y="145" width="541.53" height="47" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="544.765" y="173" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="544.765" dy="0">90</tspan></text><rect x="815.53" y="145" width="0" height="47" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="815.53" y="145" width="0" height="47" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="822.53" y="173" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="822.53" dy="0">90</tspan></text><text x="574.85" y="243" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Intercalaciones de 90 según las filas finales</tspan></text><rect x="10" y="257" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La comprobación en la aplicación es correcta en un solo hilo y falla bajo concurrencia; la restricción convierte el defecto</tspan></text><text x="470" y="298.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">en un error que el cliente puede manejar. Los 108 rechazos son trabajo útil, no un problema del motor.</tspan></text><text x="470" y="346.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
