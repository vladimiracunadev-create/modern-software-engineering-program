an x="686" dy="0">0</tspan></text><rect x="765.5" y="328.5" width="153" height="33" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="842" y="349.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">0</tspan></text><rect x="297.5" y="364.5" width="153" height="33" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="374" y="385.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="374" dy="0">200</tspan></text><rect x="453.5" y="364.5" width="153" height="33" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="530" y="385.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="530" dy="0">200</tspan></text><rect x="609.5" y="364.5" width="153" height="33" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="686" y="385.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="686" dy="0">200</tspan></text><rect x="765.5" y="364.5" width="153" height="33" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="842" y="385.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">0</tspan></text><text x="20" y="255" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 255)">Defecto del cliente</text><text x="296" y="425" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="296" dy="0">0</tspan></text><rect x="311.54" y="413" width="30.5" height="14" fill="#fbe4de"/><rect x="341.54" y="413" width="30.5" height="14" fill="#f3cdc5"/><rect x="371.54" y="413" width="30.5" height="14" fill="#eab6ac"/><rect x="401.54" y="413" width="30.5" height="14" fill="#e29f93"/><rect x="431.54" y="413" width="30.5" height="14" fill="#d9887a"/><rect x="461.54" y="413" width="30.5" height="14" fill="#d17161"/><rect x="491.54" y="413" width="30.5" height="14" fill="#c85a48"/><rect x="521.54" y="413" width="30.5" height="14" fill="#c0432f"/><text x="559.54" y="425" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="559.54" dy="0">200</tspan></text><text x="590.16" y="425" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="590.16" dy="0">más oscuro = mayor (filas inválidas guardadas de 200)</tspan></text><rect x="10" y="441" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="465.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada capa elimina una familia de defectos y deja pasar la siguiente: las reglas que cruzan columnas o tablas piden claves</tspan></text><text x="470" y="482.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">foráneas o disparadores. Los defectos se generaron para cada capa conociendo sus límites, de modo que 0 en la última</tspan></text><text x="470" y="499.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">columna no mide cobertura real.</tspan></text><text x="470" y="546.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
