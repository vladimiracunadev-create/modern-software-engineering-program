<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 564" width="940" height="564" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Filas inválidas que llegan a la base según la capa que las rechaza (200 intentos por defecto)</title><desc id="d">Mapa de calor con las filas inválidas que se guardan, de 200 intentos por defecto del cliente, en cuatro capas acumulativas: sin restricciones se guardan las 1 600; con NOT NULL, CHECK y UNIQUE persisten 1 000, solo los defectos entre filas o tablas; con claves foráneas, 600; con disparadores, ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="564" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Filas inválidas que llegan a la base según la capa que las rechaza (200 intentos por defecto)</tspan></text><text x="608" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="608" dy="0">Capas acumulativas de restricciones</tspan></text><text x="374" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374" dy="0">Sin restricciones (1</tspan></text><text x="374" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374" dy="0">600)</tspan></text><text x="530" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530" dy="0">NOT NULL, CHECK,</tspan></text><text x="530" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530" dy="0">UNIQUE (1 000)</tspan></text><text x="686" y="82" 