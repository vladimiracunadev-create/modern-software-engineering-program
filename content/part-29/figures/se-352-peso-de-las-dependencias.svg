<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de arrancar un proceso Python que solo importa módulos de la biblioteca estándar</title><desc id="d">Barras horizontales agrupadas con la mediana de 21 repeticiones: sin dependencias, 49 milisegundos en Windows y 30 en Ubuntu; con json y re, 104 y 38; añadiendo sqlite3, decimal, http.client y email, 220 y 90; añadiendo asyncio, ssl, unittest y xml.dom, 734 y 155. El tiempo crece con lo que se importa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tiempo de arrancar un proceso Python que solo importa módulos de la biblioteca estándar</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows 11</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Ubuntu (WSL2)</tspan></text><line x1="324" y1="77" x2="324" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="333" x2="324" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="465.955" y1="77" x2="465.955" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="465.955" y1="333" x2="465.955" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="465.955" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465.955" dy="0">200</tspan></text><line x1="607.91" y1="77" x2="607.91" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="607.91" y1="333" x2="607.91" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="607.91" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607.91" dy="0">400</tspan></text><line x1="749.865" y1="77" x2="749.865" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="749.865" y1="333" x2="749.865" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="749.865" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.865" dy="0">600</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="333" x2="891.82" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">800</tspan></text><line x1="324" y1="333" x2="891.82" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Sin dependencias</tspan></text><text x="314" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">json y re</tspan></text><text x="314" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">+ sqlite3, decimal, http.client, email</tspan></text><text x="314" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">+ asyncio, ssl, unittest, xml.dom</tspan></text><rect x="324" y="83" width="34.779" height="24.5" rx="3" fill="#102a43"/><text x="365.779" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="365.779" dy="0">49</tspan></text><rect x="324" y="110.5" width="21.2933" height="24.5" rx="3" fill="#087f8c"/><text x="352.293" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352.293" dy="0">30</tspan></text><rect x="324" y="147" width="73.8166" height="24.5" rx="3" fill="#102a43"/><text x="404.817" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="404.817" dy="0">104</tspan></text><rect x="324" y="174.5" width="26.9715" height="24.5" rx="3" fill="#087f8c"/><text x="357.971" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="357.971" dy="0">38</tspan></text><rect x="324" y="211" width="156.151" height="24.5" rx="3" fill="#102a43"/><text x="487.151" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="487.151" dy="0">220</tspan></text><rect x="324" y="238.5" width="63.8798" height="24.5" rx="3" fill="#087f8c"/><text x="394.88" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="394.88" dy="0">90</tspan></text><rect x="324" y="275" width="520.975" height="24.5" rx="3" fill="#102a43"/><text x="851.975" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="851.975" dy="0">734</tspan></text><rect x="324" y="302.5" width="110.015" height="24.5" rx="3" fill="#087f8c"/><text x="441.015" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="441.015" dy="0">155</tspan></text><text x="607.91" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">ms (mediana de 21 repeticiones)</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El coste inicial de una función sin servidor crece con lo que carga, no con lo que ejecuta: quince veces más en Windows</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">entre la primera y la última barra. Es el único tiempo de esta clase medido de verdad; el arranque de una plataforma</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">gestionada incluye además descarga y aislamiento que no se midió.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tiempos medidos en un equipo de 8 hilos lógicos con otros procesos activos; cambian de una ejecución a otra, léanse como órdenes de magnitud.</tspan></text></svg>
