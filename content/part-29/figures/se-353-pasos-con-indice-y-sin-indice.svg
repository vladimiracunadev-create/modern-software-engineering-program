<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pasos de la máquina virtual de SQLite para leer filas con y sin índice (50 000 entregas)</title><desc id="d">Gráfico de puntos unidos en escala logarítmica con los pasos sin índice y con índice: buscar al estudiante 17, el 0,07 por ciento de las filas, baja de 150 296 a 407 pasos; el estado anulada, el 2,5 por ciento, de 160 072 a 13 847; el estado enviada, el 90 por ciento, apenas baja de 510 248 a 495 339.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pasos de la máquina virtual de SQLite para leer filas con y sin índice (50 000 entregas)</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin índice</tspan></text><circle cx="145.4" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Con índice</tspan></text><line x1="348.42" y1="77" x2="348.42" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="348.42" y1="209" x2="348.42" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="348.42" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="348.42" dy="0">100</tspan></text><line x1="458.135" y1="77" x2="458.135" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="458.135" y1="209" x2="458.135" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="458.135" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.135" dy="0">1 000</tspan></text><line x1="567.85" y1="77" x2="567.85" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="567.85" y1="209" x2="567.85" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="567.85" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567.85" dy="0">10 000</tspan></text><line x1="677.565" y1="77" x2="677.565" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="677.565" y1="209" x2="677.565" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="677.565" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677.565" dy="0">100 000</tspan></text><line x1="787.28" y1="77" x2="787.28" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="787.28" y1="209" x2="787.28" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="787.28" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787.28" dy="0">1 000 000</tspan></text><line x1="348.42" y1="209" x2="787.28" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Estudiante = 17 (36 filas, 0,07 %)</tspan></text><text x="264" y="139" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Estado = «anulada» (1 258 filas,</tspan></text><text x="264" y="156" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">2,5 %)</tspan></text><text x="264" y="183" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Estado = «enviada» (45 030 filas,</tspan></text><text x="264" y="200" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">90 %)</tspan></text><line x1="696.979" y1="99" x2="415.302" y2="99" stroke="#087f8c" stroke-width="4"/><circle cx="696.979" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="415.302" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="708.979" y="103.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="708.979" dy="0">150 296</tspan></text><text x="403.302" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="403.302" dy="0">407</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">÷369</tspan></text><line x1="699.981" y1="143" x2="583.359" y2="143" stroke="#087f8c" stroke-width="4"/><circle cx="699.981" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="583.359" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="711.981" y="147.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="711.981" dy="0">160 072</tspan></text><text x="571.359" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="571.359" dy="0">13 847</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">÷11,6</tspan></text><line x1="755.219" y1="187" x2="753.806" y2="187" stroke="#087f8c" stroke-width="4"/><circle cx="755.219" cy="187" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="753.806" cy="187" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="767.219" y="191.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="767.219" dy="0">510 248</tspan></text><text x="741.806" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="741.806" dy="0">495 339</tspan></text><text x="926" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">÷1,03</tspan></text><text x="567.85" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="567.85" dy="0">Pasos de la máquina virtual (escala logarítmica)</tspan></text><rect x="10" y="267" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El índice sirve cuanto más selectiva es la fila buscada, no cuanto más grande es la tabla. Para el 90 % de las filas,</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">recorrer el índice cuesta casi lo mismo que recorrer la tabla (el plan es SEARCH, solo un 3 % menos de pasos). Los pasos</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">son una métrica determinista de trabajo, no tiempo.</tspan></text><text x="470" y="372.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
