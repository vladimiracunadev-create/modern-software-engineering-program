<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pares acción-recurso concedidos y usados por rol (25 roles, 400 pares posibles)</title><desc id="d">Tabla: un rol administrador concede 400 pares de los que usa 5,8, el 1,4 por ciento, y los 25 roles tienen ruta de escalada; conceder el servicio completo da 80,8 pares, el 7,2 por ciento usado y 6 roles con escalada; conceder las acciones usadas sobre todos los recursos da 32,4 y 2 roles; conceder solo los pares usados da 5,8 y 2 roles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Estilo de política</tspan></text><rect x="330" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Pares</tspan></text><text x="402" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">concedidos</tspan></text><rect x="480" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Usados</tspan></text><rect x="580" y="12" width="144" height="38" rx="10" fill="#102a43" 