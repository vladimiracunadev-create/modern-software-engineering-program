<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 453" width="940" height="453" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escrituras simultáneas sobre un mismo archivo de estado: resultado de todas las intercalaciones de leer y escribir</title><desc id="d">Barras apiladas horizontales al 100 por ciento con el resultado de todas las intercalaciones: con 2 aplicaciones sin bloqueo, 2 de 6 no pierden nada y 4 pierden el trabajo de una; con 3, 6 de 90 no pierden nada, 36 pierden el de una y 48 el de dos; con bloqueo solo quedan las ejecuciones en serie y ninguna pierde trabajo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="453" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Escrituras simultáneas sobre un mismo archivo de estado: resultado de todas las intercalaciones de leer y</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">escribir</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin pérdida</tspan></text><rect x="146.94" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="166.94" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Pierde el trabajo de una</tspan></text><rect x="375.9" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="395.9" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="395.9" dy="0">Pierde el trabajo de dos</tspan></text><line x1="294" y1="96" x2="294" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="272" x2="294" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="439.425" y1="96" x2="439.425" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="439.425" y1="272" x2="439.425" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="439.425" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.425" dy="0">25</tspan></text><line x1="584.85" y1="96" x2="584.85" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="584.85" y1="272" x2="584.85" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="584.85" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="584.85" dy="0">50</tspan></text><line x1="730.275" y1="96" x2="730.275" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="730.275" y1="272" x2="730.275" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="730.275" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.275" dy="0">75</tspan></text><line x1="875.7" y1="96" x2="875.7" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="272" x2="875.7" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="294" y1="272" x2="875.7" y2="272" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="114" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">2 aplicaciones, sin bloqueo (6</tspan></text><text x="284" y="131" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">intercalaciones)</tspan></text><text x="284" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">3 aplicaciones, sin bloqueo (90)</tspan></text><text x="284" y="210.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">2 aplicaciones, con bloqueo (2)</tspan></text><text x="284" y="254.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">3 aplicaciones, con bloqueo (6)</tspan></text><rect x="294" y="103" width="193.9" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="390.95" y="122.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="390.95" dy="0">33 %</tspan></text><rect x="487.9" y="103" width="387.8" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="681.8" y="122.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="681.8" dy="0">67 %</tspan></text><rect x="875.7" y="103" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="122.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="294" y="147" width="38.78" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="313.39" y="166.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="313.39" dy="0">7 %</tspan></text><rect x="332.78" y="147" width="232.68" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="449.12" y="166.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="449.12" dy="0">40 %</tspan></text><rect x="565.46" y="147" width="310.24" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="720.58" y="166.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="720.58" dy="0">53 %</tspan></text><text x="882.7" y="166.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="294" y="191" width="581.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="210.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">100 %</tspan></text><rect x="875.7" y="191" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="875.7" y="191" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="210.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="294" y="235" width="581.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="254.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">100 %</tspan></text><rect x="875.7" y="235" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="875.7" y="235" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="254.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="584.85" y="316" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">% del total</tspan></text><rect x="10" y="330" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Es la misma actualización perdida de la Parte 26 aplicada a un archivo que describe infraestructura: el recurso existe en</tspan></text><text x="470" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">la nube y no en el estado, y el siguiente plan lo creará otra vez o fallará por duplicado. Un bloqueo con caducidad añade</tspan></text><text x="470" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">su propio riesgo cuando el proceso muere con el bloqueo tomado.</tspan></text><text x="470" y="435.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
