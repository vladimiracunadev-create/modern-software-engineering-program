<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Claves que cambian de nodo al pasar de 4 a 5 nodos con un anillo de hash (100 000 claves)</title><desc id="d">Líneas con el porcentaje de claves que cambian de nodo al añadir uno según los puntos del anillo por nodo: con 1 punto se mueve el 41,5 por ciento y el nodo más cargado recibe 2,07 veces la media; con 16 puntos 17,0 por ciento; con 128, 21,1 y 1,06 veces; con 512, 20,8 y 1,04 veces. El reparto por módulo mueve el 79,9 por ciento de 4 a 5 nodos y el 94,2 de 16 a 17.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Claves que cambian de nodo al pasar de 4 a 5 nodos con un anillo de hash (100 000 claves)</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="299" x2="78.62" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="179" x2="910" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="179" x2="78.62" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="119" x2="910" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="119" x2="78.62" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="359" x2="96.62" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="450.122" y1="59" x2="450.122" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="450.122" y1="359" x2="450.122" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="450.122" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="450.122" dy="0">16</tspan></text><line x1="715.249" y1="59" x2="715.249" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="715.249" y1="359" x2="715.249" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="715.249" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="715.249" dy="0">128</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">512</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Claves que cambian de nodo (%)</text><text x="494.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Puntos del anillo por nodo (escala logarítmica)</tspan></text><line x1="78.62" y1="299" x2="910" y2="299" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="84.62" y="293" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="84.62" dy="0">Ideal al pasar de 4 a 5 nodos: 20 %</tspan></text><line x1="78.62" y1="119.3" x2="910" y2="119.3" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="84.62" y="113.3" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="84.62" dy="0">Módulo, 4 → 5 nodos: 79,9 %</tspan></text><line x1="78.62" y1="76.4" x2="910" y2="76.4" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="84.62" y="70.4" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="84.62" dy="0">Módulo, 16 → 17 nodos: 94,2 %</tspan></text><polyline points="96.62,234.5 450.122,308 715.249,295.7 892,296.6" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="234.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="106.62" y="239" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="106.62" dy="0">41,5 % · máx./media 2,07</tspan></text><circle cx="450.122" cy="308" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="450.122" y="332" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.122" dy="0">17,0 % · 1,20</tspan></text><circle cx="715.249" cy="295.7" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="715.249" y="284.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="715.249" dy="0">21,1 % · 1,06</tspan></text><circle cx="892" cy="296.6" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="320.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">20,8 % · 1,04</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El módulo es sencillo y obliga a mover casi todo; el anillo mueve solo lo que llega al nodo nuevo, pero con pocos puntos</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">reparte desigual (el rótulo de cada punto da el cociente entre la carga del nodo más cargado y la media con 5 nodos). El</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ideal al pasar de 4 a 5 nodos es mover 1/5 = 20 %. Hash MD5 de claves sintéticas; ningún motor de bases de datos real.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
