<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 307" width="900" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Personas con una combinación tóxica de permisos según cuántos roles se les asignan (40 roles, 6 pares prohibidos)</title><desc id="d">Barras: con 40 roles de 2 a 4 permisos entre 12 y seis pares de permisos incompatibles, el 27,1 por ciento de las personas con un solo rol ya tiene una combinación tóxica; con dos roles el 61,8, con tres el 82,7 y con cuatro el 92,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="307" fill="#ffffff"/><text x="120" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="120" dy="0">1 rol</tspan></text><rect x="130" y="16" width="203.25" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="341.25" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="341.25" dy="0">27,1 %</tspan></text><text x="120" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="120" dy="0">2 roles</tspan></text><rect x="130" y="60" width="463.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="601.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="601.5" dy="0">61,8 %</tspan></text><text x="120" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="120" dy="0">3 roles</tspan></text><rect x="130" y="104" width="620.25" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="758.25" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758.25" dy="0">82,7 %</tspan></text><text x="120" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="120" dy="0">4 roles</tspan></text><rect x="130" y="148" width="692.25" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830.25" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="830.25" dy="0">92,3 %</tspan></text><rect x="10" y="196" width="880" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Once de los 40 roles ya contienen un par tóxico dentro de sí mismos; los demás se vuelven tóxicos al sumarse. Revisar</tspan></text><text x="450" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">cada rol por separado no detecta el problema: el riesgo está en la unión de los roles de una persona. Los 12 permisos,</tspan></text><text x="450" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">los 6 pares y los 40 roles son sintéticos.</tspan></text><text x="450" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
