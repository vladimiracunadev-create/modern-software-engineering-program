<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 381" width="940" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cupos que faltan en la copia frente a la suma original de 2 000 000, con la comprobación de integridad en «ok» en los tres casos</title><desc id="d">Barras horizontales con los cupos que faltan frente a la suma original de 2 000 000 mientras otra transacción mueve 20 000 cupos: la base original no pierde ninguno, la copia del archivo con una transacción sin confirmar pierde 197 aunque integrity_check dice ok, y la API de copia en línea no pierde ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="381" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cupos que faltan en la copia frente a la suma original de 2 000 000, con la comprobación de integridad en</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">«ok» en los tres casos</tspan></text><line x1="314" y1="68" x2="314" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="200" x2="314" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="458.455" y1="68" x2="458.455" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="458.455" y1="200" x2="458.455" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="458.455" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.455" dy="0">50</tspan></text><line x1="602.91" y1="68" x2="602.91" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="602.91" y1="200" x2="602.91" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="602.91" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602.91" dy="0">100</tspan></text><line x1="747.365" y1="68" x2="747.365" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="747.365" y1="200" x2="747.365" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="747.365" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747.365" dy="0">150</tspan></text><line x1="891.82" y1="68" x2="891.82" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="200" x2="891.82" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">200</tspan></text><line x1="314" y1="200" x2="891.82" y2="200" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="86" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Base original, antes de la</tspan></text><text x="304" y="103" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">transferencia</tspan></text><text x="304" y="130" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Copia del archivo con una transacción</tspan></text><text x="304" y="147" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">sin confirmar</tspan></text><text x="304" y="174" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Copia con la API de copia en línea</tspan></text><text x="304" y="191" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">(backup)</tspan></text><rect x="314" y="74" width="2" height="32" rx="3" fill="#c0432f"/><text x="323" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><rect x="314" y="118" width="569.153" height="32" rx="3" fill="#c0432f"/><text x="890.153" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="890.153" dy="0">197</tspan></text><rect x="314" y="162" width="2" height="32" rx="3" fill="#c0432f"/><text x="323" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><text x="602.91" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="602.91" dy="0">Cupos que faltan frente a la suma de 2 000 000</tspan></text><rect x="10" y="258" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La copia a medias está estructuralmente sana (la suma queda en 1 999 803) y es lógicamente falsa: integrity_check no ve un</tspan></text><text x="470" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">invariante de negocio. La API la corrige tomando una instantánea consistente. Con otro tamaño de caché o de transacción, la</tspan></text><text x="470" y="316.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">diferencia sería otra: lo que no cambia es que puede haber alguna.</tspan></text><text x="470" y="363.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
