<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 529" width="940" height="529" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutaciones de una copia que detecta cada nivel de verificación por separado (200 mutaciones)</title><desc id="d">Barras con las mutaciones detectadas de 200 por cada nivel de verificación: comprobar que el archivo existe detecta 10; abrir la base, 25; quick_check, 50; integrity_check, 53; los conteos del manifiesto, 100; los conteos con suma y claves foráneas, 140. Todos los niveles juntos ven 180 y los estructurales solos 88.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="529" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mutaciones de una copia que detecta cada nivel de verificación por separado (200 mutaciones)</tspan></text><line x1="78.62" y1="337" x2="920" y2="337" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="337" x2="78.62" y2="337" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="269.5" x2="920" y2="269.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="269.5" x2="78.62" y2="269.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="274" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="202" x2="920" y2="202" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="202" x2="78.62" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="206.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="134.5" x2="920" y2="134.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="134.5" x2="78.62" y2="134.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">150</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="337" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 202)">Mutaciones detectadas de 200</text><rect x="92.643" y="323.5" width="112.184" height="13.5" rx="3" fill="#087f8c"/><text x="148.735" y="317.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="148.735" dy="0">10</tspan></text><text x="148.735" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="148.735" dy="0">Existe</tspan></text><rect x="232.873" y="303.25" width="112.184" height="33.75" rx="3" fill="#087f8c"/><text x="288.965" y="297.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="288.965" dy="0">25</tspan></text><text x="288.965" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Se abre</tspan></text><rect x="373.103" y="269.5" width="112.184" height="67.5" rx="3" fill="#087f8c"/><text x="429.195" y="263.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="429.195" dy="0">50</tspan></text><text x="429.195" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429.195" dy="0">quick_check</tspan></text><rect x="513.333" y="265.45" width="112.184" height="71.55" rx="3" fill="#087f8c"/><text x="569.425" y="259.45" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="569.425" dy="0">53</tspan></text><text x="569.425" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="569.425" dy="0">integrity_check</tspan></text><rect x="653.563" y="202" width="112.184" height="135" rx="3" fill="#087f8c"/><text x="709.655" y="196" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.655" dy="0">100</tspan></text><text x="709.655" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Conteos</tspan></text><rect x="793.793" y="148" width="112.184" height="189" rx="3" fill="#087f8c"/><text x="849.885" y="142" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="849.885" dy="0">140</tspan></text><text x="849.885" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="849.885" dy="0">Conteos + suma +</tspan></text><text x="849.885" y="375" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="849.885" dy="0">FK</tspan></text><line x1="78.62" y1="94" x2="920" y2="94" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="88" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">Todos los niveles juntos: 180</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="61" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">Las 200 mutaciones</tspan></text><rect x="10" y="406" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="430.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los niveles estructurales ven 88 de 200 y ninguna de las 90 mutaciones lógicas; sumar el manifiesto de negocio eleva la</tspan></text><text x="470" y="447.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cifra a 180. Los 20 bits que quedan sin ver cayeron en texto sin invariante o en espacio libre. Cada nivel es acumulativo</tspan></text><text x="470" y="464.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">en costo: el último exige conocer el negocio. El desglose por familia de alteración está en la tabla de la clase.</tspan></text><text x="470" y="511.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
