<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 395" width="940" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un verificador de ocho reglas sobre 150 descriptores de servicio sintéticos: qué señala y qué no</title><desc id="d">Barras apiladas horizontales al 100 por ciento: de 100 servicios generados desde la plantilla señala 5 con alguna violación y deja 95 sin señalar; de 50 escritos a mano señala 49 (135 violaciones) y deja 1; de 5 defectos semánticos, como un límite de 1 000 núcleos o una ruta de sonda inexistente, no señala ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="395" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un verificador de ocho reglas sobre 150 descriptores de servicio sintéticos: qué señala y qué no</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Señalados por el verificador</tspan></text><rect x="275.12" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="295.12" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="295.12" dy="0">Sin señalar</tspan></text><line x1="274" y1="77" x2="274" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="197" x2="274" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="424.425" y1="77" x2="424.425" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="424.425" y1="197" x2="424.425" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="424.425" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.425" dy="0">25</tspan></text><line x1="574.85" y1="77" x2="574.85" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="574.85" y1="197" x2="574.85" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="574.85" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="574.85" dy="0">50</tspan></text><line x1="725.275" y1="77" x2="725.275" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="725.275" y1="197" x2="725.275" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="725.275" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="725.275" dy="0">75</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="197" x2="875.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="274" y1="197" x2="875.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Servicios de la plantilla (100)</tspan></text><text x="264" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Servicios escritos a mano (50)</tspan></text><text x="264" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Defectos semánticos (5)</tspan></text><rect x="274" y="84" width="30.085" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="304.085" y="84" width="571.615" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="589.893" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="589.893" dy="0">95 %</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="274" y="124" width="589.666" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="568.833" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="568.833" dy="0">98 %</tspan></text><rect x="863.666" y="124" width="12.034" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="274" y="164" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="274" y="164" width="601.7" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="574.85" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.85" dy="0">100 %</tspan></text><text x="882.7" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="574.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">% del total</tspan></text><rect x="10" y="255" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las ocho reglas detectaron las 25 mutaciones de cada una, y por eso el verificador es útil y a la vez ciego a lo que no es</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">una regla. La plantilla no elimina las violaciones, las reduce al 4 % de ediciones manuales. Las 5 y 135 violaciones</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">señaladas en los dos primeros conjuntos están en la tabla. Las reglas y los defectos los escribí yo: la exactitud sobre</tspan></text><text x="470" y="329.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">código real es desconocida.</tspan></text><text x="470" y="377.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
