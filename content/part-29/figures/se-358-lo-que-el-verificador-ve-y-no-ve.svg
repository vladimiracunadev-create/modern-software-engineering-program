<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 465" width="940" height="465" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un verificador de ocho reglas sobre 150 descriptores de servicio sintéticos</title><desc id="d">Tabla: el verificador de ocho reglas señala 5 violaciones en 5 de los 100 servicios generados desde la plantilla y 135 violaciones en 49 de los 50 escritos a mano; de cinco defectos semánticos, entre ellos un límite de 1 000 núcleos y una sonda con una ruta inexistente, no señala ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="465" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Conjunto</tspan></text><rect x="570" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Servicios con alguna</tspan></text><text x="662" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">violación</tspan></text><rect x="760" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Violaciones</tspan></text><text x="842" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">señaladas</tspan></text><rect x="10" y="56" width="554" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="105.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">100 servicios de la plantilla</tspan></text><rect x="570" y="56" width="184" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="105.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">5</tspan></text><rect x="760" y="56" width="164" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="105.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">5</tspan></text><rect x="10" y="154" width="554" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="203.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">50 servicios escritos a mano</tspan></text><rect x="570" y="154" width="184" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">49</tspan></text><rect x="760" y="154" width="164" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">135</tspan></text><rect x="10" y="252" width="554" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="293.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">5 defectos semánticos (1 000 núcleos, ruta de sonda inexistente, imagen de otro</tspan></text><text x="287" y="309.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">registro, propietario «x», secreto corto)</tspan></text><rect x="570" y="252" width="184" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="301.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">0</tspan></text><rect x="760" y="252" width="164" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="301.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0</tspan></text><rect x="10" y="354" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="378.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las ocho reglas detectaron las 25 mutaciones de cada una, y por eso el verificador es útil y a la vez ciego a lo que no es</tspan></text><text x="470" y="395.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">una regla. La plantilla no elimina las violaciones, las reduce al 4 % de ediciones manuales. Las reglas y los defectos los</tspan></text><text x="470" y="412.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">escribí yo: la exactitud sobre código real es desconocida.</tspan></text><text x="470" y="451.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
