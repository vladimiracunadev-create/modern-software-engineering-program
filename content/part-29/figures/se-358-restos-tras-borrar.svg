<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 557" width="940" height="557" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocurrencias de un valor identificable en el archivo tras borrar la mitad de 2 000 filas</title><desc id="d">Barras agrupadas con las ocurrencias de un valor identificable antes de borrar, tras borrar 1 000 de 2 000 filas y tras VACUUM: con el borrado estándar quedan 2 087 de las 2 090; con secure_delete, 1 001 de 2 000; el borrado estándar con VACUUM deja 1 085; secure_delete con VACUUM deja 1 000, y una copia hecha antes conserva las 2 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="557" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocurrencias de un valor identificable en el archivo tras borrar la mitad de 2 000 filas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Antes de borrar</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Tras borrar 1 000</tspan></text><rect x="353.28" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="373.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="373.28" dy="0">Tras VACUUM</tspan></text><line x1="93.7" y1="365" x2="920" y2="365" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="365" x2="93.7" y2="365" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="311" x2="920" y2="311" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="311" x2="93.7" y2="311" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="315.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="257" x2="920" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="257" x2="93.7" y2="257" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="203" x2="920" y2="203" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="203" x2="93.7" y2="203" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 500</tspan></text><line x1="93.7" y1="149" x2="920" y2="149" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="149" x2="93.7" y2="149" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="153.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 500</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="365" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 230)">Ocurrencias del valor en el archivo</text><rect x="114.357" y="139.28" width="52.42" height="225.72" rx="3" fill="#102a43"/><text x="140.567" y="133.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140.567" dy="0">2 090</tspan></text><rect x="170.777" y="139.604" width="52.42" height="225.396" rx="3" fill="#c0432f"/><text x="196.987" y="133.604" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="196.987" dy="0">2 087</tspan></text><rect x="227.197" y="139.604" width="52.42" height="225.396" rx="3" fill="#087f8c"/><text x="253.407" y="133.604" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="253.407" dy="0">2 087</tspan></text><text x="196.987" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.987" dy="0">Borrado estándar</tspan></text><rect x="320.933" y="149" width="52.42" height="216" rx="3" fill="#102a43"/><text x="347.142" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347.142" dy="0">2 000</tspan></text><rect x="377.353" y="256.892" width="52.42" height="108.108" rx="3" fill="#c0432f"/><text x="403.562" y="250.892" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="403.562" dy="0">1 001</tspan></text><rect x="433.772" y="256.892" width="52.42" height="108.108" rx="3" fill="#087f8c"/><text x="459.982" y="250.892" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="459.982" dy="0">1 001</tspan></text><text x="403.562" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.562" dy="0">secure_delete activado</tspan></text><rect x="527.507" y="139.28" width="52.42" height="225.72" rx="3" fill="#102a43"/><text x="553.717" y="133.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.717" dy="0">2 090</tspan></text><rect x="583.927" y="139.604" width="52.42" height="225.396" rx="3" fill="#c0432f"/><text x="610.137" y="133.604" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="610.137" dy="0">2 087</tspan></text><rect x="640.347" y="247.82" width="52.42" height="117.18" rx="3" fill="#087f8c"/><text x="666.558" y="241.82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="666.558" dy="0">1 085</tspan></text><text x="610.137" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">Borrado estándar + VACUUM</tspan></text><rect x="734.082" y="149" width="52.42" height="216" rx="3" fill="#102a43"/><text x="760.293" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="760.293" dy="0">2 000</tspan></text><rect x="790.502" y="256.892" width="52.42" height="108.108" rx="3" fill="#c0432f"/><text x="816.712" y="250.892" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="816.712" dy="0">1 001</tspan></text><rect x="846.923" y="257" width="52.42" height="108" rx="3" fill="#087f8c"/><text x="873.133" y="251" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="873.133" dy="0">1 000</tspan></text><text x="816.712" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">secure_delete + VACUUM y</tspan></text><text x="816.712" y="403" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">copia previa</tspan></text><rect x="10" y="434" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="458.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">DELETE marca el espacio como libre pero no lo sobrescribe: el dato borrado sigue legible en el archivo. El valor de «antes»</tspan></text><text x="470" y="475.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">supera 2 000 porque los desbordes de páginas dejan copias viejas. Ninguna política de borrado alcanza las copias de</tspan></text><text x="470" y="492.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">seguridad: la copia hecha antes del borrado conserva las 2 000 ocurrencias.</tspan></text><text x="470" y="539.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
