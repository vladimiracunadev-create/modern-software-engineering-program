<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una migración de cinco pasos cortada antes de cada paso (seis puntos de corte)</title><desc id="d">Diagrama de secuencia de una migración de cinco pasos y del estado que deja un corte antes de cada paso: con cada paso confirmado por separado, cuatro de seis cortes dejan un esquema intermedio, con las dos columnas o solo con la nueva; con todos los pasos en una transacción, ninguno deja un estado intermedio, porque SQLite admite DDL transaccional.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una migración de cinco pasos cortada antes de cada paso (seis puntos de corte)</tspan></text><line x1="284" y1="51" x2="284" y2="219" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="219" x2="284" y2="224" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="240" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="388.667" y1="51" x2="388.667" y2="219" stroke="#d5dde1" stroke-width="1"/><line x1="388.667" y1="219" x2="388.667" y2="224" stroke="#5b7280" stroke-width="1.4"/><text x="388.667" y="240" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="388.667" dy="0">1</tspan></text><line x1="493.333" y1="51" x2="493.333" y2="219" stroke="#d5dde1" stroke-width="1"/><line x1="493.333" y1="219" x2="493.333" y2="224" stroke="#5b7280" stroke-width="1.4"/><text x="493.333" y="240" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="493.333" dy="0">2</tspan></text><line x1="598" y1="51" x2="598" y2="219" stroke="#d5dde1" stroke-width="1"/><line x1="598" y1="219" x2="598" y2="224" stroke="#5b7280" stroke-width="1.4"/><text x="598" y="240" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598" dy="0">3</tspan></text><line x1="702.667" y1="51" x2="702.667" y2="219" stroke="#d5dde1" stroke-width="1"/><line x1="702.667" y1="219" x2="702.667" y2="224" stroke="#5b7280" stroke-width="1.4"/><text x="702.667" y="240" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702.667" dy="0">4</tspan></text><line x1="807.333" y1="51" x2="807.333" y2="219" stroke="#d5dde1" stroke-width="1"/><line x1="807.333" y1="219" x2="807.333" y2="224" stroke="#5b7280" stroke-width="1.4"/><text x="807.333" y="240" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807.333" dy="0">5</tspan></text><line x1="912" y1="51" x2="912" y2="219" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="219" x2="912" y2="224" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="240" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">6</tspan></text><line x1="284" y1="219" x2="912" y2="219" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="83.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Pasos de la migración</tspan></text><text x="274" y="131" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Cada paso confirmado por separado:</tspan></text><text x="274" y="148" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">esquema si se corta</tspan></text><text x="274" y="187" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Todos los pasos en una transacción:</tspan></text><text x="274" y="204" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">esquema si se corta</tspan></text><rect x="284" y="60" width="104.667" height="38" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="336.333" y="83.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="336.333" dy="0">1 añadir</tspan></text><rect x="388.667" y="60" width="104.667" height="38" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="441" y="83.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="441" dy="0">2 copiar</tspan></text><rect x="493.333" y="60" width="104.667" height="38" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="545.667" y="83.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="545.667" dy="0">3 índice</tspan></text><rect x="598" y="60" width="104.667" height="38" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="650.333" y="83.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="650.333" dy="0">4 quitar</tspan></text><rect x="702.667" y="60" width="104.667" height="38" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="755" y="83.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="755" dy="0">5 renombrar</tspan></text><rect x="807.333" y="60" width="104.667" height="38" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="859.667" y="83.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="859.667" dy="0">fin</tspan></text><line x1="14" y1="107" x2="912" y2="107" stroke="#d5dde1" stroke-width="1"/><rect x="284" y="116" width="104.667" height="38" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="336.333" y="139.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="336.333" dy="0">anterior</tspan></text><rect x="388.667" y="116" width="104.667" height="38" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="441" y="139.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="441" dy="0">intermedio</tspan></text><rect x="493.333" y="116" width="104.667" height="38" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="545.667" y="139.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="545.667" dy="0">intermedio</tspan></text><rect x="598" y="116" width="104.667" height="38" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="650.333" y="139.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="650.333" dy="0">intermedio</tspan></text><rect x="702.667" y="116" width="104.667" height="38" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="755" y="139.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="755" dy="0">intermedio</tspan></text><rect x="807.333" y="116" width="104.667" height="38" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="859.667" y="139.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="859.667" dy="0">nuevo</tspan></text><line x1="14" y1="163" x2="912" y2="163" stroke="#d5dde1" stroke-width="1"/><rect x="284" y="172" width="523.333" height="38" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="545.667" y="195.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="545.667" dy="0">siempre el esquema anterior, completo</tspan></text><rect x="807.333" y="172" width="104.667" height="38" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="859.667" y="195.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="859.667" dy="0">nuevo</tspan></text><text x="598" y="263" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598" dy="0">Punto de corte: antes del paso indicado (el sexto no corta)</tspan></text><rect x="10" y="277" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los intermedios son dos columnas «estado» y «estado_v2» a la vez, o solo «estado_v2» tras quitar la vieja. La seguridad de</tspan></text><text x="470" y="318.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">un corte depende del motor: SQLite y PostgreSQL permiten DDL transaccional, MySQL confirma implícitamente cada sentencia</tspan></text><text x="470" y="335.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">DDL. El experimento usa SQLite y un corte como excepción en el cliente; no prueba el comportamiento de ningún otro motor.</tspan></text><text x="470" y="382.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
