<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 369" width="890" height="369" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una creación de 12 recursos interrumpida en cada paso: restos sin rastro y conflictos al reintentar</title><desc id="d">Tabla: interrumpir 12 veces la creación de 12 recursos antes de crear el recurso fallido deja 66 restos sin rastro y 66 conflictos al reintentar si el estado se guarda solo al final, y 0 y 0 si se guarda tras cada recurso o con intención previa; interrumpir después de crear y antes de anotar deja 78 y 78, 12 y 12, y 0 con 12 sospechosos y 12 conflictos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="369" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Estrategia de estado</tspan></text><rect x="260" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">Corte antes de</tspan></text><text x="332" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">crear: restos</tspan></text><rect x="410" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">conflictos</tspan></text><rect x="530" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Corte tras crear y antes de</tspan></text><text x="642" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">anotar: restos</tspan></text><rect x="760" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">conflictos</tspan></text><rect x="10" y="56" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Estado solo al final</tspan></text><rect x="260" y="56" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">66</tspan></text><rect x="410" y="56" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">66</tspan></text><rect x="530" y="56" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">78</tspan></text><rect x="760" y="56" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">78</tspan></text><rect x="10" y="122" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Estado tras cada recurso</tspan></text><rect x="260" y="122" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">0</tspan></text><rect x="410" y="122" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">0</tspan></text><rect x="530" y="122" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">12</tspan></text><rect x="760" y="122" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">12</tspan></text><rect x="10" y="188" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="213.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Intención antes, confirmación</tspan></text><text x="132" y="229.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">después</tspan></text><rect x="260" y="188" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">0</tspan></text><rect x="410" y="188" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">0</tspan></text><rect x="530" y="188" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">0 (12 sospechosos)</tspan></text><rect x="760" y="188" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">12</tspan></text><rect x="10" y="258" width="870" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="445" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Guardar el estado tras cada recurso elimina el caso fácil y deja el difícil: el recurso creado cuyo registro no</tspan></text><text x="445" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">llegó. Anotar la intención antes de crear lo vuelve un sospechoso que se puede reconciliar, aunque el reintento</tspan></text><text x="445" y="316.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">sigue chocando con él hasta que se reconcilia. Los recursos son carpetas locales, no recursos de una nube.</tspan></text><text x="445" y="355.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
