<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 489" width="940" height="489" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un mes con un borrado accidental (día 10) y una corrupción silenciosa (día 18, detectada el día 21)</title><desc id="d">Línea de tiempo de un mes de 30 días con tres estrategias de respaldo: la copia diaria sin verificar solo conserva las copias de los días 28 a 30, todas posteriores a la corrupción del día 18; la copia diaria verificada conserva 14 copias sanas, de los días 4 a 17, y rechaza las del 18 en adelante; con una bitácora de cambios se recuperan además las 800 filas posteriores a la última copia sana.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="489" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un mes con un borrado accidental (día 10) y una corrupción silenciosa (día 18, detectada el día 21)</tspan></text><line x1="294" y1="83" x2="294" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="291" x2="294" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="397" y1="83" x2="397" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="397" y1="291" x2="397" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="397" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">5</tspan></text><line x1="500" y1="83" x2="500" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="500" y1="291" x2="500" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="500" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="500" dy="0">10</tspan></text><line x1="603" y1="83" x2="603" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="603" y1="291" x2="603" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="603" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="603" dy="0">15</tspan></text><line x1="706" y1="83" x2="706" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="706" y1="291" x2="706" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="706" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="706" dy="0">20</tspan></text><line x1="809" y1="83" x2="809" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="809" y1="291" x2="809" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="809" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">25</tspan></text><line x1="912" y1="83" x2="912" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="291" x2="912" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">30</tspan></text><line x1="294" y1="291" x2="912" y2="291" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="105" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">A · diaria sin verificar: solo 3</tspan></text><text x="284" y="122" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">copias retenidas</tspan></text><text x="284" y="165.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">B · copia diaria verificada, 14 días</tspan></text><text x="284" y="217.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">C · copias, igual que B</tspan></text><text x="284" y="269.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">C · bitácora de cambios</tspan></text><line x1="500" y1="75" x2="500" y2="291" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="500" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="500" dy="0">10: borrado</tspan></text><line x1="664.8" y1="75" x2="664.8" y2="291" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="664.8" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="664.8" dy="0">18: corrupción</tspan></text><line x1="726.6" y1="75" x2="726.6" y2="291" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="779.61" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.61" dy="0">21: detectada</tspan></text><rect x="870.8" y="92" width="41.2" height="34" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="891.4" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="891.4" dy="0">3</tspan></text><line x1="14" y1="135" x2="912" y2="135" stroke="#d5dde1" stroke-width="1"/><rect x="376.4" y="144" width="267.8" height="34" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="510.3" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="510.3" dy="0">14 copias sanas</tspan></text><rect x="664.8" y="144" width="247.2" height="34" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="788.4" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="788.4" dy="0">copias rechazadas</tspan></text><line x1="14" y1="187" x2="912" y2="187" stroke="#d5dde1" stroke-width="1"/><rect x="376.4" y="196" width="267.8" height="34" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="510.3" y="217.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="510.3" dy="0">14 copias sanas</tspan></text><rect x="664.8" y="196" width="247.2" height="34" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="788.4" y="217.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="788.4" dy="0">copias rechazadas</tspan></text><line x1="14" y1="239" x2="912" y2="239" stroke="#d5dde1" stroke-width="1"/><rect x="294" y="248" width="618" height="34" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="603" y="269.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="603" dy="0">bitácora: recupera las 800 filas posteriores a la última copia sana</tspan></text><text x="603" y="335" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603" dy="0">Día del mes</tspan></text><rect x="10" y="349" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La verificación convierte una corrupción detectada el día 21 en una detectada el día 18, y la retención larga deja una</tspan></text><text x="470" y="390.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">copia sana para usar; la bitácora cierra la brecha entre copias. Resultado del borrado del día 10: 200 de 2 000 filas</tspan></text><text x="470" y="407.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">perdidas en A y B, ninguna en C; en A quedan 68 valores alterados sin recuperar. Las cifras son de un sistema sintético de</tspan></text><text x="470" y="423.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">200 filas nuevas al día y dos incidentes inyectados.</tspan></text><text x="470" y="471.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
