<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 786" width="940" height="786" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador del paquete de datos sobre 200 mutaciones: 134 detectadas</title><desc id="d">Barras apiladas horizontales con las mutaciones detectadas y no detectadas por un verificador de forma y de coherencia sobre 200 mutaciones de un paquete de capa de datos: detecta las 134 de campos ausentes, plazos o números incoherentes, y ninguna de las 66 que dejan los campos plausibles: evidencia copiada de otro entorno, un invariante sin prueba que exista, una purga nunca programada o la clave junto a la copia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="786" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Validador del paquete de datos sobre 200 mutaciones: 134 detectadas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="354" y1="77" x2="354" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="605" x2="354" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="458.34" y1="77" x2="458.34" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="458.34" y1="605" x2="458.34" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="458.34" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.34" dy="0">5</tspan></text><line x1="562.68" y1="77" x2="562.68" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="562.68" y1="605" x2="562.68" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="562.68" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.68" dy="0">10</tspan></text><line x1="667.02" y1="77" x2="667.02" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="667.02" y1="605" x2="667.02" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="667.02" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.02" dy="0">15</tspan></text><line x1="771.36" y1="77" x2="771.36" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="771.36" y1="605" x2="771.36" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="771.36" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.36" dy="0">20</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="605" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="605" x2="875.7" y2="610" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="626" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">25</tspan></text><line x1="354" y1="605" x2="875.7" y2="605" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Campo del respaldo ausente</tspan></text><text x="344" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Migración sin down</tspan></text><text x="344" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">RPO objetivo menor que el intervalo de copia</tspan></text><text x="344" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Copia en el mismo volumen que los datos</tspan></text><text x="344" y="271" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Prueba de restauración vencida (más de 90</tspan></text><text x="344" y="288" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">días)</tspan></text><text x="344" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Retención mayor que el plazo legal</tspan></text><text x="344" y="367.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Responsable colectivo</tspan></text><text x="344" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Índice sin consulta que lo justifique</tspan></text><text x="344" y="447" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Evidencia de restauración copiada de otro</tspan></text><text x="344" y="464" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">entorno</tspan></text><text x="344" y="499.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Invariante sin prueba ejecutable</tspan></text><text x="344" y="543.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Purga de retención nunca programada</tspan></text><text x="344" y="587.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Clave de cifrado junto a la copia</tspan></text><rect x="354" y="84" width="375.624" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="541.812" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="541.8