ill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="715.756" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="715.756" dy="0">17</tspan></text><rect x="354" y="304" width="417.36" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="562.68" y="323.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562.68" dy="0">20</tspan></text><rect x="771.36" y="304" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="778.36" y="323.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="778.36" dy="0">20</tspan></text><rect x="354" y="348" width="229.548" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="468.774" y="367.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="468.774" dy="0">11</tspan></text><rect x="583.548" y="348" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="590.548" y="367.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="590.548" dy="0">11</tspan></text><rect x="354" y="392" width="375.624" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="541.812" y="411.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="541.812" dy="0">18</tspan></text><rect x="729.624" y="392" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="736.624" y="411.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="736.624" dy="0">18</tspan></text><rect x="354" y="436" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="436" width="187.812" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="447.906" y="455.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447.906" dy="0">9</tspan></text><text x="548.812" y="455.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="548.812" dy="0">9</tspan></text><rect x="354" y="480" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="480" width="459.096" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="583.548" y="499.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="583.548" dy="0">22</tspan></text><text x="820.096" y="499.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820.096" dy="0">22</tspan></text><rect x="354" y="524" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="524" width="354.756" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="531.378" y="543.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="531.378" dy="0">17</tspan></text><text x="715.756" y="543.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="715.756" dy="0">17</tspan></text><rect x="354" y="568" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="568" width="375.624" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="541.812" y="587.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="541.812" dy="0">18</tspan></text><text x="736.624" y="587.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="736.624" dy="0">18</tspan></text><text x="614.85" y="649" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Mutaciones de cada tipo</tspan></text><rect x="10" y="663" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="687.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las cuatro que no ve son las que ocurren en la realidad cuando un paquete se rellena para aprobar. Las reglas se</tspan></text><text x="470" y="704.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escribieron conociendo las mutaciones y cada tipo sale al 100 % o al 0 %: la exactitud real sobre paquetes reales es</tspan></text><text x="470" y="721.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">desconocida.</tspan></text><text x="470" y="768.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
