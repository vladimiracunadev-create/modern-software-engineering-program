<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 571" width="930" height="571" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador de paquetes frente a 208 mutaciones: ocho familias que ve y cinco que no</title><desc id="d">Tabla: el validador detecta 16 de 16 mutaciones de cada una de ocho familias estructurales, entre ellas sección faltante, hash alterado y secreto literal, y 0 de 16 de cada una de cinco familias que exigen interpretar el contenido, como una prueba de destrucción caducada o un gasto muy superior al tope.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="571" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Defecto sembrado</tspan></text><rect x="650" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Detectado</tspan></text><rect x="10" y="56" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Falta una sección, sección vacía, módulo duplicado</tspan></text><rect x="650" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">16 de 16 cada uno</tspan></text><rect x="10" y="106" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Hash alterado, tope de gasto no positivo, TTL en cero</tspan></text><rect x="650" y="106" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">16 de 16 cada uno</tspan></text><rect x="10" y="156" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Versión sin fijar, secreto literal</tspan></text><rect x="650" y="156" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">16 de 16 cada uno</tspan></text><rect x="10" y="206" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Prueba de destrucción de 2019 (caducada)</tspan></text><rect x="650" y="206" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">0 de 16</tspan></text><rect x="10" y="256" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Gasto de 10^6 sobre un tope de 100</tspan></text><rect x="650" y="256" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">0 de 16</tspan></text><rect x="10" y="306" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Evidencia copiada de otro paquete</tspan></text><rect x="650" y="306" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">0 de 16</tspan></text><rect x="10" y="356" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="381.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Límites que dicen «sin límites»</tspan></text><rect x="650" y="356" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">0 de 16</tspan></text><rect x="10" y="406" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="431.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Estado que no corresponde al plan</tspan></text><rect x="650" y="406" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">0 de 16</tspan></text><rect x="10" y="460" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="484.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">El validador ve la forma y las coincidencias exactas; no ve la verdad de lo que el paquete afirma. Que apruebe un paquete</tspan></text><text x="465" y="501.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">solo significa que está completo y coherente en forma. Las mutaciones y las reglas las escribí yo, así que 16 de 16</tspan></text><text x="465" y="518.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">describe estas reglas contra estos defectos, no una cobertura general.</tspan></text><text x="465" y="557.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
