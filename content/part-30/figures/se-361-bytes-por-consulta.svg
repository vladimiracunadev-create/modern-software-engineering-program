<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 361" width="940" height="361" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Datos que debe tocar cada consulta sobre 200 000 pedidos guardados por filas en SQLite</title><desc id="d">Barras horizontales con los megabytes que toca cada consulta sobre una tabla de 200000 pedidos de 14,1 megabytes: una búsqueda por clave toca una página de 4 kilobytes, una agregación por día sin índice recorre los 14,1 megabytes y las dos columnas que la agregación necesita suman 3,2 megabytes, un 22,8 por ciento de la tabla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="361" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Datos que debe tocar cada consulta sobre 200 000 pedidos guardados por filas en SQLite</tspan></text><line x1="354" y1="49" x2="354" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="163" x2="354" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0,001</tspan></text><line x1="456.728" y1="49" x2="456.728" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="456.728" y1="163" x2="456.728" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="456.728" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="456.728" dy="0">0,01</tspan></text><line x1="559.456" y1="49" x2="559.456" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="559.456" y1="163" x2="559.456" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="559.456" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="559.456" dy="0">0,1</tspan></text><line x1="662.184" y1="49" x2="662.184" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="662.184" y1="163" x2="662.184" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="662.184" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662.184" dy="0">1</tspan></text><line x1="764.912" y1="49" x2="764.912" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="764.912" y1="163" x2="764.912" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="764.912" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="764.912" dy="0">10</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="163" x2="867.64" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100</tspan></text><line x1="354" y1="163" x2="867.64" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Búsqueda por clave (una página)</tspan></text><text x="344" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Agregación por día recorriendo las filas</tspan></text><text x="344" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Solo las dos columnas que la agregación usa</tspan></text><rect x="354" y="55" width="61.8484" height="26" rx="3" fill="#102a43"/><text x="422.848" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422.848" dy="0">0,004</tspan></text><rect x="354" y="93" width="426.241" height="26" rx="3" fill="#102a43"/><text x="787.241" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="787.241" dy="0">14,100</tspan></text><rect x="354" y="131" width="360.077" height="26" rx="3" fill="#102a43"/><text x="721.077" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="721.077" dy="0">3,200</tspan></text><text x="610.82" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="610.82" dy="0">Megabytes que toca la consulta (escala logarítmica)</tspan></text><rect x="10" y="221" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un almacén por filas guarda cada pedido junto, de modo que la agregación lee las columnas que no necesita (nota, estado,</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cliente). La búsqueda por clave tardó unos 13 a 18 microsegundos y la agregación entre 280 y 540 milisegundos en tres</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ejecuciones: miles de veces más, no por ser lenta sino por tocar 200 000 filas. Un índice que cubre día e importe bajó la</tspan></text><text x="470" y="295.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">agregación a unos 60 milisegundos.</tspan></text><text x="470" y="343.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
