<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 479" width="960" height="479" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lecturas largas, escrituras y la pregunta sobre el pasado: qué pasó en cada caso medido</title><desc id="d">Cuatro casos medidos en SQLite: con el diario de reversión una lectura larga abierta impide que una escritura se confirme y falla con database is locked; con el registro anticipado, WAL, la escritura se confirma mientras la lectura sigue abierta; la tabla de estado actual solo responde 1486 pagados hoy y el registro de eventos responde 989 pagados y sin enviar el día 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="479" fill="#ffffff"/><rect x="10" y="14" width="290" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="55.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">Lectura larga abierta, modo delete</tspan></text><rect x="336" y="14" width="270" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="471" y="47.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="471" dy="0">La escritura falla: database is</tspan></text><text x="471" y="63.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="471" dy="0">locked</tspan></text><rect x="642" y="14" width="308" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="47.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">El informe pesado bloquea a la</tspan></text><text x="796" y="63.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">aplicación</tspan></text><polyline points="300,52 336,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,52 642,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="108" width="290" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">Lectura larga abierta, modo WAL</tspan></text><rect x="336" y="108" width="270" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">La escritura se confirma</tspan></text><rect x="642" y="108" width="308" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">Lector y escritor no se esperan, con el</tspan></text><text x="796" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">costo del archivo WAL</tspan></text><polyline points="300,146 336,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,146 642,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="202" width="290" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">«¿Cuántos estaban pagados el día</tspan></text><text x="155" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">100?» con el estado actual</tspan></text><rect x="336" y="202" width="270" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="471" y="243.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="471" dy="0">1 486 pagados hoy: otra pregunta</tspan></text><rect x="642" y="202" width="308" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">La tabla sobrescribe el estado y borra</tspan></text><text x="796" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">el pasado</tspan></text><polyline points="300,240 336,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,240 642,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="296" width="290" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">La misma pregunta con el registro de</tspan></text><text x="155" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">cambios de estado</tspan></text><rect x="336" y="296" width="270" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="337.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">989 pagados y sin enviar</tspan></text><rect x="642" y="296" width="308" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">La historia se reconstruye porque se</tspan></text><text x="796" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">conservó</tspan></text><polyline points="300,334 336,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,334 642,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="386" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="410.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Dos problemas distintos justifican separar lo operacional de lo analítico: la interferencia (una lectura larga contra</tspan></text><text x="480" y="427.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">escrituras cortas) y la historia (lo operacional guarda el presente). Ni el modo WAL ni un índice resuelven el segundo.</tspan></text><text x="480" y="469.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
