<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 387" width="860" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pérdida real dividida por la pérdida del plan óptimo cuando las estimaciones se equivocan hasta un factor 2</title><desc id="d">Tabla: con 5 000 realidades en las que probabilidad e impacto de cada componente se multiplican por un factor entre 0,5 y 2, el reparto por riesgo pierde en mediana 1,128 veces el óptimo y el uniforme 1,271 veces; el tamaño llega a 1,441. El reparto por riesgo supera al uniforme en 97,2 por ciento de las realidades.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="860" height="387" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Estrategia (se planea con las estimaciones)</tspan></text><rect x="440" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Mediana</tspan></text><rect x="570" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Percentil 90</tspan></text><rect x="720" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Máximo</tspan></text><rect x="10" y="56" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Uniforme</tspan></text><rect x="440" y="56" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">1,271</tspan></text><rect x="570" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">1,455</tspan></text><rect x="720" y="56" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1,955</tspan></text><rect x="10" y="110" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Proporcional al tamaño</tspan></text><rect x="440" y="110" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">1,441</tspan></text><rect x="570" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">1,735</tspan></text><rect x="720" y="110" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">2,382</tspan></text><rect x="10" y="164" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Proporcional a probabilidad × impacto</tspan></text><rect x="440" y="164" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">1,128</tspan></text><rect x="570" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">1,212</tspan></text><rect x="720" y="164" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1,460</tspan></text><rect x="10" y="218" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Marginal con las estimaciones</tspan></text><rect x="440" y="218" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">1,101</tspan></text><rect x="570" y="218" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">1,178</tspan></text><rect x="720" y="218" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1,396</tspan></text><rect x="10" y="276" width="840" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="430" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="430" dy="0">Equivocarse por un factor 2 en cada estimación no invalida el reparto por riesgo: gana al uniforme en el 97,2 %</tspan></text><text x="430" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="430" dy="0">de las 5 000 realidades. Lo que sí cambia es el ranking: el trío de componentes más arriesgados difiere del</tspan></text><text x="430" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="430" dy="0">estimado en el 74,2 % de ellas. El plan es una hipótesis que se revisa, no un resultado.</tspan></text><text x="430" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
