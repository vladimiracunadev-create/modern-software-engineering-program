<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 435" width="940" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias ocultas de una función antes y después de hacerla testable (análisis con ast)</title><desc id="d">Tabla: la función original lee tres nombres globales (base de datos, reloj y correo) y llama a servicios reales; tras separar el cálculo, la hora y los efectos, la función de nota no tiene dependencias y la de cierre recibe la hora, el guardado y el aviso como argumentos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="435" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Función</tspan></text><rect x="220" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="302" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="302" dy="0">Nombres libres</tspan></text><rect x="390" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Llamadas a lo externo</tspan></text><rect x="680" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Qué hace falta para probarla</tspan></text><rect x="10" y="56" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">cerrar_y_avisar (antes)</tspan></text><rect x="220" y="56" width="164" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">DB, dt, smtplib</tspan></text><rect x="390" y="56" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="81.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">DB.execute, dt.datetime.now,</tspan></text><text x="532" y="97.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">smtplib.SMTP().sendmail</tspan></text><rect x="680" y="56" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Base, reloj y correo reales</tspan></text><rect x="10" y="122" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">calcular_nota</tspan></text><rect x="220" y="122" width="164" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">ninguno</tspan></text><rect x="390" y="122" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">ninguna</tspan></text><rect x="680" y="122" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Función pura: entrada y salida</tspan></text><rect x="10" y="188" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">horas_tarde</tspan></text><rect x="220" y="188" width="164" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">ninguno</tspan></text><rect x="390" y="188" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">total_seconds sobre sus argumentos</tspan></text><rect x="680" y="188" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">El reloj llega como parámetro</tspan></text><rect x="10" y="254" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">cerrar (después)</tspan></text><rect x="220" y="254" width="164" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="279.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">calcular_nota,</tspan></text><text x="302" y="295.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">horas_tarde</tspan></text><rect x="390" y="254" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">ninguna externa</tspan></text><rect x="680" y="254" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="279.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Base y correo entran como</tspan></text><text x="802" y="295.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">funciones</tspan></text><rect x="10" y="324" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cada nombre libre es una costura que una prueba debe reemplazar o soportar. La función original no se puede ejecutar sin</tspan></text><text x="470" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">una base, un reloj y un servidor de correo; la versión refactorizada se prueba con valores. La medida cuenta dependencias</tspan></text><text x="470" y="382.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">en el código, no la calidad del diseño.</tspan></text><text x="470" y="421.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
