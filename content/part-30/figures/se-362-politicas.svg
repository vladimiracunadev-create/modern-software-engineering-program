<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 515" width="940" height="515" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Eventos que cada política de ingesta deja fuera de su ventana, sobre 10 000 eventos con 3 % de llegadas tardías</title><desc id="d">Barras horizontales con los eventos fuera de su ventana: el flujo sin tolerancia deja 315, con marca de agua de 1 minuto 262, de 10 minutos 257, de 1 hora 229 y de 6 horas 0; el lote nocturno a las 02:00 del día siguiente deja 15 y el lote con reproceso 3 días después deja 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="515" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Eventos que cada política de ingesta deja fuera de su ventana, sobre 10 000 eventos con 3 % de llegadas</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">tardías</tspan></text><line x1="314" y1="68" x2="314" y2="334" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="334" x2="314" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="458.455" y1="68" x2="458.455" y2="334" stroke="#d5dde1" stroke-width="1"/><line x1="458.455" y1="334" x2="458.455" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="458.455" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.455" dy="0">100</tspan></text><line x1="602.91" y1="68" x2="602.91" y2="334" stroke="#d5dde1" stroke-width="1"/><line x1="602.91" y1="334" x2="602.91" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="602.91" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602.91" dy="0">200</tspan></text><line x1="747.365" y1="68" x2="747.365" y2="334" stroke="#d5dde1" stroke-width="1"/><line x1="747.365" y1="334" x2="747.365" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="747.365" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747.365" dy="0">300</tspan></text><line x1="891.82" y1="68" x2="891.82" y2="334" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="334" x2="891.82" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">400</tspan></text><line x1="314" y1="334" x2="891.82" y2="334" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Flujo sin tolerancia</tspan></text><text x="304" y="129.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Flujo, marca de agua de 1 min</tspan></text><text x="304" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Flujo, marca de agua de 10 min</tspan></text><text x="304" y="205.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Flujo, marca de agua de 1 h</tspan></text><text x="304" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Flujo, marca de agua de 6 h</tspan></text><text x="304" y="281.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Lote a las 02:00 del día siguiente</tspan></text><text x="304" y="319.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Lote con reproceso a los 3 días</tspan></text><rect x="314" y="74" width="455.033" height="26" rx="3" fill="#102a43"/><text x="776.033" y="91.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="776.033" dy="0">315</tspan></text><rect x="314" y="112" width="378.472" height="26" rx="3" fill="#102a43"/><text x="699.472" y="129.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="699.472" dy="0">262</tspan></text><rect x="314" y="150" width="371.249" height="26" rx="3" fill="#102a43"/><text x="692.249" y="167.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="692.249" dy="0">257</tspan></text><rect x="314" y="188" width="330.802" height="26" rx="3" fill="#102a43"/><text x="651.802" y="205.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="651.802" dy="0">229</tspan></text><rect x="314" y="226" width="2" height="26" rx="3" fill="#102a43"/><text x="323" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><rect x="314" y="264" width="21.6683" height="26" rx="3" fill="#102a43"/><text x="342.668" y="281.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="342.668" dy="0">15</tspan></text><rect x="314" y="302" width="2" height="26" rx="3" fill="#102a43"/><text x="323" y="319.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><text x="602.91" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="602.91" dy="0">Eventos fuera de su ventana (de 10 000)</tspan></text><rect x="10" y="392" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="416.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los eventos que llegan entre 1 y 6 horas tarde no caben en una marca de agua corta; solo una espera de 6 horas los recoge,</tspan></text><text x="470" y="433.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y esa espera es el retraso con que se publica cada ventana. El lote los recoge porque espera: cambia latencia por</tspan></text><text x="470" y="450.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">completitud. Los retrasos de llegada son una mezcla inventada por el autor.</tspan></text><text x="470" y="497.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 45; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
