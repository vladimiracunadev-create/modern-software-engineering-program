<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 353" width="960" height="353" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo del evento y tiempo de llegada: por qué una ventana necesita una marca de agua</title><desc id="d">Diagrama en dos filas: el evento ocurre en un instante, viaja con un retraso variable y llega al sistema; la ventana de una hora que lo contiene se emite cuando la marca de agua, el instante hasta el que se espera a los rezagados, la cierra; un evento que llega después de la marca es tardío y se descarta, se corrige o se procesa aparte.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="353" fill="#ffffff"/><rect x="10" y="14" width="284" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Evento ocurre</tspan></text><text x="152" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Tiempo del evento: 10:59</tspan></text><rect x="338" y="14" width="284" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Viaja con retraso</tspan></text><text x="480" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Red, colas, teléfono sin cobertura</tspan></text><polyline points="294,62 338,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="808" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="808" dy="0">Llega al sistema</tspan></text><text x="808" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="808" dy="0">Tiempo de llegada: 12:30</tspan></text><polyline points="622,62 666,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="150" width="284" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Ventana 10:00 a 11:00</tspan></text><text x="152" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Acumula lo que llega a tiempo</tspan></text><rect x="338" y="150" width="284" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Marca de agua</tspan></text><text x="480" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Se espera hasta 11:10 por rezagados</tspan></text><polyline points="294,198 338,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="150" width="284" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="808" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">Evento tardío</tspan></text><text x="808" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">Llegó pasada la marca: se corrige o</tspan></text><text x="808" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">se aparta</tspan></text><polyline points="622,198 666,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,110 808,130 152,130 152,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="260" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">La ventana se define por el tiempo del evento; la marca de agua se define por el tiempo de llegada. Subir la tolerancia recoge</tspan></text><text x="480" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">más rezagados y retrasa cada resultado la misma cantidad; ninguna marca de agua puede garantizar que no llegue algo más tarde.</tspan></text><text x="480" y="343.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 45; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
