<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 509" width="940" height="509" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Envío total de 20 000 pedidos según el grano de la consulta</title><desc id="d">Barras con el envío total en millones: el real, con un grano por pedido, es 10,0; sumado después de unir los pedidos con sus 59809 líneas es 29,9, un 199 por ciento de más; sumado sobre una subconsulta de un registro por pedido vuelve a ser 10,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="509" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Envío total de 20 000 pedidos según el grano de la consulta</tspan></text><line x1="71.08" y1="317" x2="920" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="317" x2="71.08" y2="317" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="321.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="233.667" x2="920" y2="233.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="233.667" x2="71.08" y2="233.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="238.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="150.333" x2="920" y2="150.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="150.333" x2="71.08" y2="150.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="154.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="67" x2="71.08" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="67" x2="71.08" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 192)">Envío total (millones)</text><rect x="99.3773" y="233.667" width="226.379" height="83.3333" rx="3" fill="#c0432f"/><text x="212.567" y="227.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">10,0</tspan></text><text x="212.567" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Un grano por pedido</tspan></text><rect x="382.351" y="67.8333" width="226.379" height="249.167" rx="3" fill="#c0432f"/><text x="495.54" y="61.8333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">29,9</tspan></text><text x="495.54" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Después de unir con las líneas</tspan></text><rect x="665.324" y="233.667" width="226.379" height="83.3333" rx="3" fill="#c0432f"/><text x="778.513" y="227.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">10,0</tspan></text><text x="778.513" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Subconsulta con un registro por</tspan></text><text x="778.513" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">pedido</tspan></text><rect x="10" y="386" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="410.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada pedido tiene entre 1 y 5 líneas y su costo de envío se repite en cada una; sumarlo tras la unión lo cuenta una vez por</tspan></text><text x="470" y="427.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">línea. El error no falla ni avisa: la consulta devuelve un número verosímil. El grano de cada tabla (una fila por qué) es</tspan></text><text x="470" y="444.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la defensa.</tspan></text><text x="470" y="491.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
