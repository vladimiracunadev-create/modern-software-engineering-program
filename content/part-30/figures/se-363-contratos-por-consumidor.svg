<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 898" width="940" height="898" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez cambios del proveedor: alarma del esquema completo frente a consumidores realmente afectados</title><desc id="d">Barras horizontales para diez cambios: el diff de esquema completo da alarma en ocho, pero en «pagina» y «total» ningún consumidor se rompe; los cambios que sí rompen afectan a entre uno y tres de los tres consumidores, y los contratos por consumidor dicen cuáles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="898" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diez cambios del proveedor: alarma del esquema completo frente a consumidores realmente afectados</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Consumidores afectados (de 3)</tspan></text><rect x="282.66" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Alarma del diff completo (1 = sí)</tspan></text><line x1="274" y1="77" x2="274" y2="717" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="717" x2="274" y2="722" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="738" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="485.313" y1="77" x2="485.313" y2="717" stroke="#d5dde1" stroke-width="1"/><line x1="485.313" y1="717" x2="485.313" y2="722" stroke="#5b7280" stroke-width="1.4"/><text x="485.313" y="738" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="485.313" dy="0">1</tspan></text><line x1="696.627" y1="77" x2="696.627" y2="717" stroke="#d5dde1" stroke-width="1"/><line x1="696.627" y1="717" x2="696.627" y2="722" stroke="#5b7280" stroke-width="1.4"/><text x="696.627" y="738" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696.627" dy="0">2</tspan></text><line x1="907.94" y1="77" x2="907.94" y2="717" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="717" x2="907.94" y2="722" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="738" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">3</tspan></text><line x1="274" y1="717" x2="907.94" y2="717" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Quitar «creada»</tspan></text><text x="264" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Renombrar «nota»</tspan></text><text x="264" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Cambiar el tipo de «id»</tspan></text><text x="264" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Quitar «estado»</tspan></text><text x="264" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Cambiar «estudiante»</tspan></text><text x="264" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Cambiar el tipo de «creada»</tspan></text><text x="264" y="497.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Quitar «pagina»</tspan></text><text x="264" y="561.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Renombrar «total»</tspan></text><text x="264" y="625.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Quitar «revisor», que no existe</tspan></text><text x="264" y="689.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Añadir un campo</tspan></text><rect x="274" y="83" width="211.313" height="24.5" rx="3" fill="#087f8c"/><text x="492.313" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492.313" dy="0">1</tspan></text><rect x="274" y="110.5" width="211.313" height="24.5" rx="3" fill="#946512"/><text x="492.313" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492.313" dy="0">1</tspan></text><rect x="274" y="147" width="422.627" height="24.5" rx="3" fill="#087f8c"/><text x="703.627" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="703.627" dy="0">2</tspan></text><rect x="274" y="174.5" width="211.313" height="24.5" rx="3" fill="#946512"/><text x="492.313" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492.313" dy="0">1</tspan></text><rect x="274" y="211" width="211.313" height="24.5" rx="3" fill="#087f8c"/><text x="492.313" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492.313" dy="0">1</tspan></text><rect x="274" y="238.5" width="211.313" height="24.5" rx="3" fill="#946512"/><text x="492.313" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492.313" dy="0">1</tspan></text><rect x="274" y="275" width="422.627" height="24.5" rx="3" fill="#087f8c"/><text x="703.627" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="703.627" dy="0">2</tspan></text><rect x="274" y="302.5" width="211.313" height="24.5" rx="3" fill="#946512"/><text x="492.313" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492.313" dy="0">1</tspan></text><rect x="274" y="339" width="633.94" height="24.5" rx="3" fill="#087f8c"/><text x="914.94" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="274" y="366.5" width="211.313" height="24.5" rx="3" fill="#946512"/><text x="492.313" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492.313" dy="0">1</tspan></text><rect x="274" y="403" width="211.313" height="24.5" rx="3" fill="#087f8c"/><text x="492.313" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492.313" dy="0">1</tspan></text><rect x="274" y="430.5" width="211.313" height="24.5" rx="3" fill="#946512"/><text x="492.313" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492.313" dy="0">1</tspan></text><rect x="274" y="467" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="283" y="483.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="494.5" width="211.313" height="24.5" rx="3" fill="#946512"/><text x="492.313" y="511.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492.313" dy="0">1</tspan></text><rect x="274" y="531" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="283" y="547.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="558.5" width="211.313" height="24.5" rx="3" fill="#946512"/><text x="492.313" y="575.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492.313" dy="0">1</tspan></text><rect x="274" y="595" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="283" y="611.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="622.5" width="2" height="24.5" rx="3" fill="#946512"/><text x="283" y="639.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="659" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="283" y="675.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="686.5" width="2" height="24.5" rx="3" fill="#946512"/><text x="283" y="703.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><text x="590.97" y="761" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="590.97" dy="0">consumidores afectados · alarmas del diff</tspan></text><rect x="10" y="775" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="799.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El diff de esquema acierta siempre que hay un consumidor afectado y señala dos cambios que nadie usa (la barra dorada sin</tspan></text><text x="470" y="816.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">barra verde). Los contratos por consumidor no los señalan, y además dicen a quién avisar. Para que funcione, cada</tspan></text><text x="470" y="833.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consumidor debe declarar los campos que lee: el contrato incompleto produce un falso sentimiento de seguridad.</tspan></text><text x="470" y="880.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
