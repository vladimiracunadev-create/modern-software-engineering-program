<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 591" width="910" height="591" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comparar todo el esquema o solo lo que cada consumidor usa: tres consumidores y diez cambios</title><desc id="d">Tabla: ocho alarmas del diff de esquema completo, de las cuales seis afectan al menos a un consumidor y dos no afectan a ninguno; los contratos por consumidor señalan quién se rompe en cada cambio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="591" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Cambio del proveedor</tspan></text><rect x="310" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Diff de esquema completo</tspan></text><rect x="560" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Consumidores afectados</tspan></text><rect x="10" y="56" width="294" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="77.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Quitar «creada»</tspan></text><rect x="310" y="56" width="244" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Alarma</tspan></text><rect x="560" y="56" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">exportador</tspan></text><rect x="10" y="98" width="294" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="119.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Renombrar «nota»</tspan></text><rect x="310" y="98" width="244" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Alarma</tspan></text><rect x="560" y="98" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">panel, exportador</tspan></text><rect x="10" y="140" width="294" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Cambiar el tipo de «id»</tspan></text><rect x="310" y="140" width="244" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Alarma</tspan></text><rect x="560" y="140" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">exportador</tspan></text><rect x="10" y="182" width="294" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="203.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Quitar «estado»</tspan></text><rect x="310" y="182" width="244" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Alarma</tspan></text><rect x="560" y="182" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">panel, avisos</tspan></text><rect x="10" y="224" width="294" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Cambiar «estudiante»</tspan></text><rect x="310" y="224" width="244" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Alarma</tspan></text><rect x="560" y="224" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">panel, exportador, avisos</tspan></text><rect x="10" y="266" width="294" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Cambiar el tipo de «creada»</tspan></text><rect x="310" y="266" width="244" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Alarma</tspan></text><rect x="560" y="266" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">exportador</tspan></text><rect x="10" y="308" width="294" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="329.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Quitar «pagina»</tspan></text><rect x="310" y="308" width="244" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Alarma</tspan></text><rect x="560" y="308" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">nadie (falsa alarma)</tspan></text><rect x="10" y="350" width="294" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="371.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Renombrar «total»</tspan></text><rect x="310" y="350" width="244" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Alarma</tspan></text><rect x="560" y="350" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">nadie (falsa alarma)</tspan></text><rect x="10" y="392" width="294" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="413.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Quitar «revisor», que no existe</tspan></text><rect x="310" y="392" width="244" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="413.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Sin alarma</tspan></text><rect x="560" y="392" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="413.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">nadie</tspan></text><rect x="10" y="434" width="294" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="455.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Añadir un campo</tspan></text><rect x="310" y="434" width="244" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="455.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Sin alarma</tspan></text><rect x="560" y="434" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="455.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">nadie (compatible)</tspan></text><rect x="10" y="480" width="890" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="504.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">El diff de esquema acierta siempre que hay un consumidor afectado y señala dos cambios que nadie usa. Los contratos por</tspan></text><text x="455" y="521.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">consumidor no los señalan, y además dicen a quién avisar. Para que funcione, cada consumidor debe declarar los campos</tspan></text><text x="455" y="538.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">que lee: el contrato incompleto produce un falso sentimiento de seguridad.</tspan></text><text x="455" y="577.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
