<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 219" width="1000" height="219" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Interfaces sospechosas tras el primer fallo: 1 000 defectos de interfaz sorteados en 7 interfaces</title><desc id="d">Barras: con tres recorridos de extremo a extremo, un defecto de interfaz deja en promedio 2,71 interfaces sospechosas, y en 857 de 1 000 casos son tres; con una prueba por interfaz la sospechosa es una.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="219" fill="#ffffff"/><text x="380" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Recorridos de extremo a extremo (3)</tspan></text><rect x="390" y="16" width="325.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="723.2" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="723.2" dy="0">2,71 interfaces sospechosas de media</tspan></text><text x="380" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Una prueba por interfaz (7)</tspan></text><rect x="390" y="60" width="120" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="518" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="518" dy="0">1 interfaz sospechosa</tspan></text><rect x="10" y="108" width="980" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">En el sistema modelado, 857 de 1 000 defectos dejan tres interfaces sospechosas (los recorridos solo ven el camino entero) y 143</tspan></text><text x="500" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">dejan una (el tramo común del recorrido). Siete pruebas de interfaz localizan el defecto; tres recorridos no. El grafo de siete</tspan></text><text x="500" y="166.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">componentes y tres recorridos es un modelo del autor.</tspan></text><text x="500" y="205.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
