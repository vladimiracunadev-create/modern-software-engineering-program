<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Instantánea del HTML frente a aserciones semánticas, sobre 7 cambios benignos y 9 defectos</title><desc id="d">Tabla: la instantánea exacta falla en los siete cambios benignos y detecta los nueve defectos, con una precisión de 56 por ciento; las aserciones semánticas no fallan en ninguno de los benignos y detectan seis de nueve, sin ver el botón deshabilitado, la lista oculta ni el texto con el color del fondo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Resultado</tspan></text><rect x="410" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Instantánea exacta</tspan></text><rect x="670" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Aserciones semánticas</tspan></text><rect x="10" y="56" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Cambios benignos (7)</tspan></text><rect x="410" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">Falla en 7</tspan></text><rect x="670" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Falla en 0</tspan></text><rect x="10" y="106" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Defectos de contenido y estructura (6)</tspan></text><rect x="410" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">Detecta 6</tspan></text><rect x="670" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Detecta 6</tspan></text><rect x="10" y="156" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Defectos de estilo o de estado (3)</tspan></text><rect x="410" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">Detecta 3</tspan></text><rect x="670" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Detecta 0</tspan></text><rect x="10" y="206" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Precisión de las alarmas</tspan></text><rect x="410" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">9 de 16 (56 %)</tspan></text><rect x="670" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">6 de 6 (100 %)</tspan></text><rect x="10" y="256" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Cobertura de los defectos</tspan></text><rect x="410" y="256" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">9 de 9</tspan></text><rect x="670" y="256" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">6 de 9</tspan></text><rect x="10" y="310" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Si el equipo aprueba cada diferencia de la instantánea sin leerla, acepta los nueve defectos con la misma facilidad que los</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">siete cambios benignos. Las aserciones semánticas no ven lo que está en atributos de estilo. Hace falta una comprobación de</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lo visual aparte; esta figura no la mide.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
