<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tráfico y riesgo cubiertos por k recorridos de hasta tres rutas (20 000 sesiones sintéticas, 25 rutas)</title><desc id="d">Tabla: con un recorrido se cubre 48,3 por ciento del tráfico y 45,1 por ciento del riesgo eligiendo por tráfico; con cinco recorridos se cubre 87,6 por ciento del tráfico, y elegir por tráfico por impacto sube el riesgo cubierto a 93,7 por ciento con cinco.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Recorridos</tspan></text><rect x="160" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="342" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="342" dy="0">Elegidos por tráfico (tráfico / riesgo)</tspan></text><rect x="530" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Elegidos por tráfico × impacto (tráfico /</tspan></text><text x="727" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">riesgo)</tspan></text><rect x="10" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">1</tspan></text><rect x="160" y="56" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">48,3 % / 45,1 %</tspan></text><rect x="530" y="56" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">46,0 % / 55,5 %</tspan></text><rect x="10" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">2</tspan></text><rect x="160" y="106" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">64,9 % / 71,1 %</tspan></text><rect x="530" y="106" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">59,0 % / 72,0 %</tspan></text><rect x="10" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">3</tspan></text><rect x="160" y="156" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">74,9 % / 77,8 %</tspan></text><rect x="530" y="156" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">71,6 % / 82,6 %</tspan></text><rect x="10" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">5</tspan></text><rect x="160" y="206" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">87,6 % / 89,6 %</tspan></text><rect x="530" y="206" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">86,7 % / 93,7 %</tspan></text><rect x="10" y="256" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">8</tspan></text><rect x="160" y="256" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">98,0 % / 98,5 %</tspan></text><rect x="530" y="256" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">97,8 % / 99,5 %</tspan></text><rect x="10" y="310" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cinco recorridos cubren el 87 % del tráfico y el 90 % del riesgo; los ocho siguientes aportan menos. Elegir por tráfico</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">multiplicado por impacto cede 1 punto de tráfico y gana 4 de riesgo con cinco recorridos. Las rutas, su frecuencia (Zipf</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">1,1) y sus impactos son supuestos del autor.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
