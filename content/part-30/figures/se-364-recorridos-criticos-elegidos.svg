idos (k)</tspan></text><polyline points="96.62,266.1 210.246,216.3 323.871,186.3 551.123,148.2 892,117" fill="none" stroke="#6b7c86" stroke-width="2.4"/><circle cx="96.62" cy="266.1" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><circle cx="210.246" cy="216.3" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><circle cx="323.871" cy="186.3" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><circle cx="551.123" cy="148.2" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><circle cx="892" cy="117" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><polyline points="96.62,275.7 210.246,197.7 323.871,177.6 551.123,142.2 892,115.5" fill="none" stroke="#102a43" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="270.2" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="204.746" y="192.2" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="318.371" y="172.1" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="545.623" y="136.7" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="886.5" y="110" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><polyline points="96.62,273 210.246,234 323.871,196.2 551.123,150.9 892,117.6" fill="none" stroke="#946512" stroke-width="2.4"/><polygon points="96.62,266.675 102.67,277.95 90.57,277.95" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="210.246,227.675 216.296,238.95 204.196,238.95" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="323.871,189.875 329.921,201.15 317.821,201.15" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="551.123,144.575 557.173,155.85 545.073,155.85" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="892,111.275 898.05,122.55 885.95,122.55" fill="#946512" stroke="#946512" stroke-width="2"/><polyline points="96.62,244.5 210.246,195 323.871,163.2 551.123,