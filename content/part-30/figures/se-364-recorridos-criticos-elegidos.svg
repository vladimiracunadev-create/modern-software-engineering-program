<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 594" width="940" height="594" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tráfico y riesgo cubiertos por k recorridos de hasta tres rutas (20 000 sesiones sintéticas, 25 rutas)</title><desc id="d">Cuatro curvas crecientes con el número de recorridos: el tráfico cubierto sube de 48 a 98 por ciento con ocho recorridos; con cinco, elegir por tráfico por impacto cubre 93,7 por ciento del riesgo frente a 89,6 por ciento al elegir solo por tráfico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="594" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tráfico y riesgo cubiertos por k recorridos de hasta tres rutas (20 000 sesiones sintéticas, 25 rutas)</tspan></text><circle cx="22" cy="51" r="6" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Tráfico cubierto, elegido por tráfico</tspan></text><rect x="342.98" y="45" width="12" height="12" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="362.98" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="362.98" dy="0">Riesgo cubierto, elegido por tráfico</tspan></text><polygon points="22,68.1 28.6,80.4 15.4,80.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Tráfico cubierto, elegido por tráfico × impacto</tspan></text><polygon