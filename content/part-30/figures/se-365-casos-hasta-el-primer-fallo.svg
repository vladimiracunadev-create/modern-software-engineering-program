<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 637" width="940" height="637" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro versiones defectuosas de «repartir n entregas entre k correctores»: cuántas semillas detectan el defecto</title><desc id="d">Barras horizontales con el porcentaje de semillas (de 100) que detectan cada defecto: cinco ejemplos escritos a mano detectan solo uno de los cuatro; las propiedades con generador uniforme detectan los cuatro, uno de ellos solo en 87 de 100; un generador con 30 por ciento de casos cerca de la frontera los detecta en las 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="637" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro versiones defectuosas de «repartir n entregas entre k correctores»: cuántas semillas detectan el</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">defecto</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">5 ejemplos (determinista)</tspan></text><rect x="252.5" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="272.5" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Propiedades, generador uniforme</tspan></text><rect x="534.24" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="554.24" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="554.24" dy="0">Con 30 % de casos cerca de la frontera</tspan></text><line x1="324" y1="96" x2="324" y2="456" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="456" x2="324" y2="461" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="465.955" y1="96" x2="465.955" y2="456" stroke="#d5dde1" stroke-width="1"/><line x1="465.955" y1="456" x2="465.955" y2="461" stroke="#5b7280" stroke-width="1.4"/><text x="465.955" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465.955" dy="0">25</tspan></text><line x1="607.91" y1="96" x2="607.91" y2="456" stroke="#d5dde1" stroke-width="1"/><line x1="607.91" y1="456" x2="607.91" y2="461" stroke="#5b7280" stroke-width="1.4"/><text x="607.91" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607.91" dy="0">50</tspan></text><line x1="749.865" y1="96" x2="749.865" y2="456" stroke="#d5dde1" stroke-width="1"/><line x1="749.865" y1="456" x2="749.865" y2="461" stroke="#5b7280" stroke-width="1.4"/><text x="749.865" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.865" dy="0">75</tspan></text><line x1="891.82" y1="96" x2="891.82" y2="456" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="456" x2="891.82" y2="461" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">100</tspan></text><line x1="324" y1="456" x2="891.82" y2="456" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="145.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Olvida el resto</tspan></text><text x="314" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Resto al último corrector</tspan></text><text x="314" y="317" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Falla solo si hay menos entregas que</tspan></text><text x="314" y="334" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">correctores</tspan></text><text x="314" y="415.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Pierde una entrega si n ≥ 500</tspan></text><rect x="324" y="102" width="567.82" height="24" rx="3" fill="#c0432f"/><text x="898.82" y="118.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="324" y="129" width="567.82" height="24" rx="3" fill="#946512"/><text x="898.82" y="145.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="324" y="156" width="567.82" height="24" rx="3" fill="#087f8c"/><text x="898.82" y="172.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="324" y="192" width="2" height="24" rx="3" fill="#c0432f"/><text x="333" y="208.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="219" width="567.82" height="24" rx="3" fill="#946512"/><text x="898.82" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="324" y="246" width="567.82" height="24" rx="3" fill="#087f8c"/><text x="898.82" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="324" y="282" width="2" height="24" rx="3" fill="#c0432f"/><text x="333" y="298.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="309" width="494.003" height="24" rx="3" fill="#946512"/><text x="825.003" y="325.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="825.003" dy="0">87</tspan></text><rect x="324" y="336" width="567.82" height="24" rx="3" fill="#087f8c"/><text x="898.82" y="352.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="324" y="372" width="2" height="24" rx="3" fill="#c0432f"/><text x="333" y="388.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="399" width="567.82" height="24" rx="3" fill="#946512"/><text x="898.82" y="415.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="324" y="426" width="567.82" height="24" rx="3" fill="#087f8c"/><text x="898.82" y="442.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><text x="607.91" y="500" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">% de las 100 semillas que detectan el defecto</tspan></text><rect x="10" y="514" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="538.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Las propiedades son longitud igual a k, suma igual a n, diferencia máxima de 1 y ninguna cantidad negativa. El defecto que</tspan></text><text x="470" y="555.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">solo ocurre con n &lt; k aparece en el 1 % de los casos uniformes y por eso necesita más casos: la calidad del generador es</tspan></text><text x="470" y="572.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">parte de la prueba. Los ejemplos son deterministas: detectan o no.</tspan></text><text x="470" y="619.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
