<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cobertura de líneas y puntuación de mutación de cuatro baterías sobre el mismo módulo (18 mutantes)</title><desc id="d">Barras agrupadas: de la batería A a la B la cobertura de líneas sube de 72,2 a 94,4 por ciento y los mutantes muertos se quedan en 61,1 por ciento (11 de 18); la C llega a 100 por ciento de líneas y 94,4 por ciento de mutantes muertos; la D cubre 66,7 por ciento de líneas con una sola prueba sin aserciones y mata 33,3 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cobertura de líneas y puntuación de mutación de cuatro baterías sobre el mismo módulo (18 mutantes)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Líneas ejecutadas</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Mutantes muertos (de 18)</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="305" x2="78.62" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="235" x2="78.62" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="165" x2="78.62" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">% de las líneas · % de los 18 mutantes</text><rect x="99.6545" y="172.84" width="82.138" height="202.16" rx="3" fill="#6b7c86"/><text x="140.724" y="166.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140.724" dy="0">72,2</tspan></text><rect x="185.793" y="203.92" width="82.138" height="171.08" rx="3" fill="#087f8c"/><text x="226.862" y="197.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="226.862" dy="0">61,1</tspan></text><text x="183.793" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">A: 3 casos del camino feliz</tspan></text><rect x="310" y="110.68" width="82.138" height="264.32" rx="3" fill="#6b7c86"/><text x="351.069" y="104.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="351.069" dy="0">94,4</tspan></text><rect x="396.138" y="203.92" width="82.138" height="171.08" rx="3" fill="#087f8c"/><text x="437.207" y="197.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.207" dy="0">61,1</tspan></text><text x="394.138" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">B: A + 4 rechazos de</tspan></text><text x="394.138" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">formato</tspan></text><rect x="520.345" y="95" width="82.138" height="280" rx="3" fill="#6b7c86"/><text x="561.413" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.413" dy="0">100,0</tspan></text><rect x="606.483" y="110.68" width="82.138" height="264.32" rx="3" fill="#087f8c"/><text x="647.552" y="104.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.552" dy="0">94,4</tspan></text><text x="604.482" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">C: B + bordes y exclusiones</tspan></text><rect x="730.689" y="188.24" width="82.138" height="186.76" rx="3" fill="#6b7c86"/><text x="771.758" y="182.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.758" dy="0">66,7</tspan></text><rect x="816.827" y="281.76" width="82.138" height="93.24" rx="3" fill="#087f8c"/><text x="857.896" y="275.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.896" dy="0">33,3</tspan></text><text x="814.827" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">D: una prueba sin</tspan></text><text x="814.827" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">aserciones</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La batería B añade 22 puntos de cobertura y 0 mutantes muertos. La D alcanza dos tercios de las líneas sin una sola</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">aserción. El único superviviente de C cambia el redondeo de 1 a 2 decimales y ningún promedio de los casos lo distingue.</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las baterías y los 18 mutantes son del autor; ninguno es equivalente.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
