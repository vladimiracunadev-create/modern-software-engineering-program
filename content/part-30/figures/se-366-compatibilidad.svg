<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 597" width="940" height="597" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez cambios de esquema: si un lector nuevo lee datos viejos y si un lector viejo lee datos nuevos</title><desc id="d">Mapa de calor con diez cambios y dos columnas, compatible hacia atrás y compatible hacia adelante: añadir un campo con valor por defecto, quitar un campo con valor por defecto, reordenar y cambiar la unidad son compatibles en las dos direcciones; añadir un campo requerido rompe hacia atrás; quitar un campo requerido y ampliar el tipo rompen hacia adelante; renombrar y cambiar a texto rompen en las dos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="597" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diez cambios de esquema: si un lector nuevo lee datos viejos y si un lector viejo lee datos nuevos</tspan></text><text x="495.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.5" dy="0">Lector nuevo lee datos viejos</tspan></text><text x="778.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.5" dy="0">Lector viejo lee datos nuevos</tspan></text><text x="344" y="94.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Añadir campo opcional con valor por defecto</tspan></text><text x="344" y="130.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Añadir campo requerido sin valor por defecto</tspan></text><text x="344" y="166.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Quitar un campo con valor por defecto</tspan></text><text x="344" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Quitar un campo requerido</tspan></text><text x="344" y="238.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Renombrar un campo</tspan></text><text x="344" y="274.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Ampliar el tipo de int a long</tspan></text><text x="344" y="310.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Estrechar el tipo de long a int</tspan></text><text x="344" y="346.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Cambiar el tipo a texto</tspan></text><text x="344" y="382.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Cambiar la unidad de horas a minutos</tspan></text><text x="344" y="418.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Reordenar los campos</tspan></text><rect x="355.5" y="73.5" width="280" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="495.5" y="94.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="495.5" dy="0">sí</tspan></text><rect x="638.5" y="73.5" width="280" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="778.5" y="94.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="778.5" dy="0">sí</tspan></text><rect x="355.5" y="109.5" width="280" height="33" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="495.5" y="130.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.5" dy="0">NO</tspan></text><rect x="638.5" y="109.5" width="280" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="778.5" y="130.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="778.5" dy="0">sí</tspan></text><rect x="355.5" y="145.5" width="280" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="495.5" y="166.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="495.5" dy="0">sí</tspan></text><rect x="638.5" y="145.5" width="280" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="778.5" y="166.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="778.5" dy="0">sí</tspan></text><rect x="355.5" y="181.5" width="280" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="495.5" y="202.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="495.5" dy="0">sí</tspan></text><rect x="638.5" y="181.5" width="280" height="33" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="778.5" y="202.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.5" dy="0">NO</tspan></text><rect x="355.5" y="217.5" width="280" height="33" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="495.5" y="238.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.5" dy="0">NO</tspan></text><rect x="638.5" y="217.5" width="280" height="33" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="778.5" y="238.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.5" dy="0">NO</tspan></text><rect x="355.5" y="253.5" width="280" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="495.5" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="495.5" dy="0">sí</tspan></text><rect x="638.5" y="253.5" width="280" height="33" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="778.5" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.5" dy="0">NO</tspan></text><rect x="355.5" y="289.5" width="280" height="33" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="495.5" y="310.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.5" dy="0">NO</tspan></text><rect x="638.5" y="289.5" width="280" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="778.5" y="310.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="778.5" dy="0">sí</tspan></text><rect x="355.5" y="325.5" width="280" height="33" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="495.5" y="346.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.5" dy="0">NO</tspan></text><rect x="638.5" y="325.5" width="280" height="33" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="778.5" y="346.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.5" dy="0">NO</tspan></text><rect x="355.5" y="361.5" width="280" height="33" rx="4" fill="#087f8c" stroke="#102a43" stroke-width="3"/><text x="495.5" y="382.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="495.5" dy="0">sí</tspan></text><rect x="638.5" y="361.5" width="280" height="33" rx="4" fill="#087f8c" stroke="#102a43" stroke-width="3"/><text x="778.5" y="382.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="778.5" dy="0">sí</tspan></text><rect x="355.5" y="397.5" width="280" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="495.5" y="418.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="495.5" dy="0">sí</tspan></text><rect x="638.5" y="397.5" width="280" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="778.5" y="418.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="778.5" dy="0">sí</tspan></text><text x="354" y="458" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="354" dy="0">NO</tspan></text><rect x="377.08" y="446" width="30.5" height="14" fill="#dff1ee"/><rect x="407.08" y="446" width="30.5" height="14" fill="#c0e1e0"/><rect x="437.08" y="446" width="30.5" height="14" fill="#a2d0d2"/><rect x="467.08" y="446" width="30.5" height="14" fill="#83c0c4"/><rect x="497.08" y="446" width="30.5" height="14" fill="#64b0b6"/><rect x="527.08" y="446" width="30.5" height="14" fill="#45a0a8"/><rect x="557.08" y="446" width="30.5" height="14" fill="#278f9a"/><rect x="587.08" y="446" width="30.5" height="14" fill="#087f8c"/><text x="625.08" y="458" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="625.08" dy="0">sí</tspan></text><text x="648.16" y="458" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="648.16" dy="0">más oscuro = mayor (compatible)</tspan></text><rect x="10" y="474" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="498.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La celda resaltada es la trampa: cambiar la unidad conserva nombre y tipo y el verificador la aprueba en las dos</tspan></text><text x="470" y="515.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">direcciones, pero los datos dejan de significar lo mismo. La compatibilidad de esquema es necesaria y no suficiente; la</tspan></text><text x="470" y="532.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">semántica pide una versión nueva, un campo nuevo o un acuerdo escrito.</tspan></text><text x="470" y="579.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
