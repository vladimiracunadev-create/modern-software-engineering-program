" fill="#142231"><tspan x="314" dy="0">Estrechar de long a int</tspan></text><text x="314" y="300.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Cambiar el tipo a texto</tspan></text><text x="314" y="338.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Cambiar la unidad de horas a minutos</tspan></text><text x="314" y="376.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Reordenar los campos</tspan></text><rect x="324" y="55" width="2" height="26" rx="3" fill="#102a43"/><text x="333" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="93" width="551.7" height="26" rx="3" fill="#102a43"/><text x="882.7" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="324" y="131" width="2" height="26" rx="3" fill="#102a43"/><text x="333" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="169" width="551.7" height="26" rx="3" fill="#102a43"/><text x="882.7" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="324" y="207" width="2" height="26" rx="3" fill="#102a43"/><text x="333" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="245" width="2" height="26" rx="3" fill="#102a43"/><text x="333" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="283" width="551.7" height="26" rx="3" fill="#102a43"/><text x="882.7" y="300.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="324" y="321" width="2" height="26" rx="3" fill="#102a43"/><text x="333" y="338.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="359" width="2" height="26" rx="3" fill="#102a43"/><text x="333" y="376.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><text x="599.85" y="435" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Registros ilegibles de 1 000</tspan></text><rect x="10" y="449" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="473.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los cambios que rompen, rompen todo: ninguno deja la mitad de los registros legibles, porque el defecto está en la regla y</tspan></text><text x="470" y="490.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no en el dato. Estrechar de long a int no rompió aquí porque ningún valor de la muestra excedía el rango; con un</tspan></text><text x="470" y="507.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">identificador grande sí habría roto, y esa dependencia del dato no se ve en el esquema.</tspan></text><text x="470" y="554.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
