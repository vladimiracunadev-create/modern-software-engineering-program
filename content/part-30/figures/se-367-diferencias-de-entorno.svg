<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los bytes de «é» seguido de un salto de línea en un mismo script según el sistema</title><desc id="d">Tres secuencias de bytes: en Windows con la codificación por defecto cp1252 se escribe 233, 13, 10; en Windows con PYTHONUTF8=1 se escribe 195, 169, 13, 10; en Ubuntu bajo WSL2 con UTF-8 se escribe 195, 169, 10. La codificación cambia los bytes de la letra y el sistema cambia el salto de línea.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Los bytes de «é» seguido de un salto de línea en un mismo script según el sistema</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Bytes de la letra «é»</tspan></text><rect x="222.34" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Bytes del salto de línea</tspan></text><text x="14" y="117" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Windows 11, por defecto (cp1252)</tspan></text><rect x="330" y="89" width="84" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="372" y="116.48" font-size="16" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="372" dy="0">233</tspan></text><rect x="426" y="89" width="84" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="468" y="116.48" font-size="16" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="468" dy="0">13</tspan></text><rect x="522" y="89" width="84" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="564" y="116.48" font-size="16" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="564" dy="0">10</tspan></text><text x="14" y="181" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Windows 11 con PYTHONUTF8=1</tspan></text><rect x="330" y="153" width="84" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="372" y="180.48" font-size="16" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="372" dy="0">195</tspan></text><rect x="426" y="153" width="84" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="468" y="180.48" font-size="16" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="468" dy="0">169</tspan></text><rect x="522" y="153" width="84" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="564" y="180.48" font-size="16" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="564" dy="0">13</tspan></text><rect x="618" y="153" width="84" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="660" y="180.48" font-size="16" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="660" dy="0">10</tspan></text><text x="14" y="245" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ubuntu en WSL2 (UTF-8)</tspan></text><rect x="330" y="217" width="84" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="372" y="244.48" font-size="16" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="372" dy="0">195</tspan></text><rect x="426" y="217" width="84" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="468" y="244.48" font-size="16" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="468" dy="0">169</tspan></text><rect x="522" y="217" width="84" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="564" y="244.48" font-size="16" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="564" dy="0">10</tspan></text><rect x="10" y="283" width="920" height="109.2" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una prueba que depende del orden de un conjunto es inestable en cualquier sistema (11 de 12 semillas de hash dan resultados</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">distintos en ambos) y se arregla ordenando. Una que depende de la codificación o del salto de línea cambia de resultado</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">entre sistemas y se arregla declarándolos. Forzar UTF-8 corrige los bytes de la letra y no el salto de línea. El separador</tspan></text><text x="470" y="357.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">de rutas también difiere (\ y /); el orden alfabético con mayúsculas y «ñ» es igual. Esta es la única figura de la parte</tspan></text><text x="470" y="374.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cuyos valores difieren por sistema.</tspan></text><text x="470" y="422.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
