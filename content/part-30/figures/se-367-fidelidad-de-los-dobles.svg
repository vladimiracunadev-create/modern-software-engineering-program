<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fidelidad de dos dobles de un repositorio medida con las mismas 8 comprobaciones de contrato</title><desc id="d">Barras apiladas horizontales: SQLite real pasa las 8 comprobaciones; el diccionario ingenuo pasa 4 y no rechaza el identificador duplicado, la nota fuera de rango, el estudiante nulo ni el correo repetido con otra capitalización; el diccionario con las reglas añadidas pasa las 8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Fidelidad de dos dobles de un repositorio medida con las mismas 8 comprobaciones de contrato</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Superadas</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">No superadas</tspan></text><line x1="274" y1="77" x2="274" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="209" x2="274" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="434.5" y1="77" x2="434.5" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="434.5" y1="209" x2="434.5" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="434.5" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.5" dy="0">2</tspan></text><line x1="595" y1="77" x2="595" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="595" y1="209" x2="595" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="595" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595" dy="0">4</tspan></text><line x1="755.5" y1="77" x2="755.5" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="755.5" y1="209" x2="755.5" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="755.5" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.5" dy="0">6</tspan></text><line x1="916" y1="77" x2="916" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="916" y1="209" x2="916" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="916" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="916" dy="0">8</tspan></text><line x1="274" y1="209" x2="916" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">SQLite real (referencia)</tspan></text><text x="264" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Diccionario ingenuo</tspan></text><text x="264" y="183" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Diccionario con las reglas</tspan></text><text x="264" y="200" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">añadidas</tspan></text><rect x="274" y="84" width="642" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="595" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="595" dy="0">8</tspan></text><rect x="916" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="274" y="128" width="321" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="434.5" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="434.5" dy="0">4</tspan></text><rect x="595" y="128" width="321" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="755.5" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="755.5" dy="0">4</tspan></text><rect x="274" y="172" width="642" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="595" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="595" dy="0">8</tspan></text><rect x="916" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="595" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="595" dy="0">comprobaciones de contrato (de 8)</tspan></text><rect x="10" y="267" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El doble ingenuo hace pasar pruebas de servicio que con la base real fallarían. Pasar las ocho comprobaciones demuestra que</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el doble reproduce esas ocho reglas, no que reproduzca la base: una novena comprobación (transacciones, índices, orden de</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">nulos en otra colación) podría separarlos. La batería de contrato debe correr contra ambos.</tspan></text><text x="470" y="372.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
