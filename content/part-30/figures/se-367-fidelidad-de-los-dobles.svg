<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" width="940" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fidelidad de dos dobles de un repositorio medida con las mismas 8 comprobaciones de contrato</title><desc id="d">Tabla: ocho comprobaciones de comportamiento pasan en SQLite real; un diccionario ingenuo pasa cuatro y no rechaza el identificador duplicado, la nota fuera de rango, el estudiante nulo ni el correo repetido con otra capitalización; un diccionario al que se añadieron esas reglas pasa las ocho.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="345" fill="#ffffff"/><rect x="10" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152" dy="0">Implementación</tspan></text><rect x="300" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="392" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">Comprobaciones</tspan></text><text x="392" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">superadas</tspan></text><rect x="490" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">Qué no reproduce</tspan></text><rect x="10" y="56" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">SQLite real (referencia)</tspan></text><rect x="300" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">8 de 8</tspan></text><rect x="490" y="56" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">—</tspan></text><rect x="10" y="114" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Diccionario ingenuo</tspan></text><rect x="300" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">4 de 8</tspan></text><rect x="490" y="114" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="135.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">Id duplicado, nota fuera de rango, estudiante nulo y correo</tspan></text><text x="707" y="151.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">único sin distinguir mayúsculas</tspan></text><rect x="10" y="172" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Diccionario con las reglas añadidas</tspan></text><rect x="300" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">8 de 8</tspan></text><rect x="490" y="172" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">—</tspan></text><rect x="10" y="234" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El doble ingenuo hace pasar pruebas de servicio que con la base real fallarían. Pasar las ocho comprobaciones demuestra que</tspan></text><text x="470" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el doble reproduce esas ocho reglas, no que reproduzca la base: una novena comprobación (transacciones, índices, orden de</tspan></text><text x="470" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">nulos en otra colación) podría separarlos. La batería de contrato debe correr contra ambos.</tspan></text><text x="470" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
