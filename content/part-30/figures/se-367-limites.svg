<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 479" width="960" height="479" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro formas de SQL que un analizador de texto no resuelve y de dónde sale el linaje en cada una</title><desc id="d">Cuatro casos: un SELECT con comodín no nombra columnas y produce cero aristas, de modo que hay que expandirlo con el catálogo; el SQL armado por concatenación en código no aparece en el texto y se recupera con los metadatos de la ejecución; una condición de filtro no forma parte del valor y se declara como arista de condición; una función definida por el usuario oculta qué columnas lee y pide declararlo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="479" fill="#ffffff"/><rect x="10" y="14" width="280" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="55.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">SELECT * FROM fact_sales</tspan></text><rect x="326" y="14" width="240" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="446" y="55.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="446" dy="0">0 aristas de columna</tspan></text><rect x="602" y="14" width="348" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="47.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Expandir el comodín con las columnas del</tspan></text><text x="776" y="63.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">catálogo</tspan></text><polyline points="290,52 326,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,52 602,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="108" width="280" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">f&#x27;SELECT {col} FROM {tabla}&#x27; en</tspan></text><text x="150" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">código</tspan></text><rect x="326" y="108" width="240" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="446" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="446" dy="0">Invisible al texto</tspan></text><rect x="602" y="108" width="348" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Capturar el SQL ejecutado o usar metadatos de</tspan></text><text x="776" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">la consulta</tspan></text><polyline points="290,146 326,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,146 602,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="202" width="280" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">WHERE status &lt;&gt; &#x27;cancelled&#x27;</tspan></text><rect x="326" y="202" width="240" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="446" y="235.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="446" dy="0">No entra en el valor, sí en</tspan></text><text x="446" y="251.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="446" dy="0">las filas</tspan></text><rect x="602" y="202" width="348" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Registrar condiciones como un tipo de arista</tspan></text><text x="776" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">propio</tspan></text><polyline points="290,240 326,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,240 602,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="296" width="280" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="337.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">Función definida por el usuario</tspan></text><rect x="326" y="296" width="240" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="446" y="337.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="446" dy="0">Entradas ocultas</tspan></text><rect x="602" y="296" width="348" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Declarar las columnas que lee en el contrato</tspan></text><text x="776" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">de la función</tspan></text><polyline points="290,334 326,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,334 602,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="386" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="410.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Ningún método de linaje es completo: el análisis estático ve el texto, la captura en ejecución ve lo que se corrió y la</tspan></text><text x="480" y="427.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">declaración manual ve lo que alguien recordó. Un catálogo honesto marca de qué método viene cada arista y qué no cubre.</tspan></text><text x="480" y="469.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
