<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Megabytes que lee cada formato para sumar el importe de 10 días de 365</title><desc id="d">Barras horizontales con los megabytes leídos: el JSON por líneas lee 25,93, el binario por filas 11,60, el CSV 7,33, el columnar sin ordenar por día 0,945, el columnar leyendo solo dos columnas de todo el rango 0,59 y el columnar ordenado por día que salta 18 de 20 grupos 0,059.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="494" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Megabytes que lee cada formato para sumar el importe de 10 días de 365</tspan></text><line x1="354" y1="49" x2="354" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="313" x2="354" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0,01</tspan></text><line x1="482.41" y1="49" x2="482.41" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="482.41" y1="313" x2="482.41" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="482.41" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482.41" dy="0">0,1</tspan></text><line x1="610.82" y1="49" x2="610.82" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="610.82" y1="313" x2="610.82" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="610.82" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.82" dy="0">1</tspan></text><line x1="739.23" y1="49" x2="739.23" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="739.23" y1="313" x2="739.23" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="739.23" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="739.23" dy="0">10</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="313" x2="867.64" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100</tspan></text><line x1="354" y1="313" x2="867.64" y2="313" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">JSON por líneas</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Binario por filas</tspan></text><text x="344" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">CSV</tspan></text><text x="344" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Columnar sin ordenar por día (20 de 20</tspan></text><text x="344" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">grupos)</tspan></text><text x="344" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Columnar, dos columnas, todo el rango</tspan></text><text x="344" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Columnar ordenado por día (2 de 20 grupos)</tspan></text><rect x="354" y="55" width="438.366" height="32" rx="3" fill="#087f8c"/><text x="799.366" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="799.366" dy="0">25,930</tspan></text><rect x="354" y="99" width="393.507" height="32" rx="3" fill="#087f8c"/><text x="754.507" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="754.507" dy="0">11,600</tspan></text><rect x="354" y="143" width="367.908" height="32" rx="3" fill="#087f8c"/><text x="728.908" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="728.908" dy="0">7,330</tspan></text><rect x="354" y="187" width="253.665" height="32" rx="3" fill="#087f8c"/><text x="614.665" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="614.665" dy="0">0,945</tspan></text><rect x="354" y="231" width="227.395" height="32" rx="3" fill="#087f8c"/><text x="588.395" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="588.395" dy="0">0,590</tspan></text><rect x="354" y="275" width="98.9851" height="32" rx="3" fill="#087f8c"/><text x="459.985" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="459.985" dy="0">0,059</tspan></text><text x="610.82" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="610.82" dy="0">Megabytes leídos (escala logarítmica)</tspan></text><rect x="10" y="371" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="395.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los formatos por filas leen el archivo entero aunque la consulta use dos de ocho columnas y 10 de 365 días. El columnar</tspan></text><text x="470" y="412.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ahorra por dos vías distintas: leer solo las columnas (de 2,00 a 0,59) y saltar grupos con las estadísticas de mínimo y</tspan></text><text x="470" y="429.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">máximo, que solo funcionan si los datos están agrupados por esa columna: sin ordenar por día se leen los 20 grupos.</tspan></text><text x="470" y="476.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
