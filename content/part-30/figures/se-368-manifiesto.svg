<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 369" width="960" height="369" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un manifiesto con versiones: cómo una compactación no rompe a quien está leyendo</title><desc id="d">Diagrama en dos filas: el lector A abre la versión 1 del manifiesto, que lista 10 archivos; la compactación escribe un archivo nuevo y publica la versión 2 con un único renombrado atómico; el lector A sigue viendo los 10 archivos de la versión 1 y un lector B nuevo ve la versión 2 con 1 archivo; los archivos viejos se borran más tarde, cuando nadie los usa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="369" fill="#ffffff"/><rect x="10" y="14" width="284" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Versión 1</tspan></text><text x="152" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Manifiesto con 10 archivos</tspan></text><rect x="338" y="14" width="284" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Lector A</tspan></text><text x="480" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Abre la versión 1 y la conserva</tspan></text><polyline points="294,62 338,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="808" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">Compactación</tspan></text><text x="808" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">Escribe 1 archivo nuevo</tspan></text><polyline points="622,62 666,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="150" width="284" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="152" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">Publicar versión 2</tspan></text><text x="152" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">Un solo renombrado atómico</tspan></text><rect x="338" y="150" width="284" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Lector B</tspan></text><text x="480" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Ve la versión 2: 1 archivo</tspan></text><polyline points="294,198 338,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="150" width="284" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="808" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">Limpieza</tspan></text><text x="808" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">Borra archivos viejos cuando nadie</tspan></text><text x="808" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">los lee</tspan></text><polyline points="622,198 666,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,110 808,130 152,130 152,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="260" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">La tabla no es la carpeta: es la lista de archivos de una versión. Eso da lecturas consistentes, viaje en el tiempo y</tspan></text><text x="480" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">compactación sin parar a los lectores, y exige que todos pasen por el manifiesto; quien lee la carpeta directo vuelve a ver</tspan></text><text x="480" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">archivos a medias.</tspan></text><text x="480" y="359.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
