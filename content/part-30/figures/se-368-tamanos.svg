<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 509" width="940" height="509" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tamaño de los mismos 200 000 pedidos en cuatro formatos de archivo</title><desc id="d">Barras con el tamaño en megabytes de 200000 pedidos de ocho columnas: CSV 7,33, JSON por líneas 25,93, binario por filas 11,60 y columnar con compresión 2,00, un 27 por ciento del CSV.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="509" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tamaño de los mismos 200 000 pedidos en cuatro formatos de archivo</tspan></text><line x1="71.08" y1="317" x2="920" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="317" x2="71.08" y2="317" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="321.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="233.667" x2="920" y2="233.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="233.667" x2="71.08" y2="233.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="238.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="150.333" x2="920" y2="150.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="150.333" x2="71.08" y2="150.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="154.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="67" x2="71.08" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="67" x2="71.08" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 192)">Megabytes en disco</text><rect x="92.303" y="255.917" width="169.784" height="61.0833" rx="3" fill="#102a43"/><text x="177.195" y="249.917" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177.195" dy="0">7,33</tspan></text><text x="177.195" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">CSV</tspan></text><rect x="304.533" y="100.917" width="169.784" height="216.083" rx="3" fill="#102a43"/><text x="389.425" y="94.9167" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="389.425" dy="0">25,93</tspan></text><text x="389.425" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">JSON por líneas</tspan></text><rect x="516.763" y="220.333" width="169.784" height="96.6667" rx="3" fill="#102a43"/><text x="601.655" y="214.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.655" dy="0">11,60</tspan></text><text x="601.655" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">Binario por filas de ancho</tspan></text><text x="601.655" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">fijo</tspan></text><rect x="728.993" y="300.333" width="169.784" height="16.6667" rx="3" fill="#102a43"/><text x="813.885" y="294.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="813.885" dy="0">2,00</tspan></text><text x="813.885" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">Columnar con diccionario y</tspan></text><text x="813.885" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">compresión</tspan></text><rect x="10" y="386" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="410.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El binario de ancho fijo es mayor que el CSV porque reserva ocho bytes por entero y por texto; el JSON repite el nombre de</tspan></text><text x="470" y="427.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cada columna en cada fila. El columnar gana porque cada columna guarda valores parecidos juntos y comprime mejor, y la</tspan></text><text x="470" y="444.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">columna de estado, con tres valores, se reduce a un byte por fila antes de comprimir.</tspan></text><text x="470" y="491.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
