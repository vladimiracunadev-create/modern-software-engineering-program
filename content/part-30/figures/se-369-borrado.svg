<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" width="940" height="566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde queda el usuario 42 tras una solicitud de borrado, según se borre solo el origen o se propague por el linaje</title><desc id="d">Barras agrupadas con las filas o copias del usuario 42 que quedan: borrando solo en la tabla de origen quedan 0 en raw, 1 en la tabla intermedia, 3 en la tabla de eventos, 1 en el almacén de variables y 1 en el archivo exportado; propagando por el linaje de tablas queda solo la copia del archivo exportado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="566" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dónde queda el usuario 42 tras una solicitud de borrado, según se borre solo el origen o se propague por el</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">linaje</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Borrar solo en el origen</tspan></text><rect x="244.96" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="264.96" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Propagar por el linaje de tablas</tspan></text><line x1="63.54" y1="374" x2="920" y2="374" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="374" x2="63.54" y2="374" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="378.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="287.333" x2="920" y2="287.333" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="287.333" x2="63.54" y2="287.333" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="291.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="200.667" x2="920" y2="200.667" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="200.667" x2="63.54" y2="200.667" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="205.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="114" x2="63.54" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="114" x2="63.54" y2="374" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 244)">Filas o copias que quedan</text><rect x="80.6692" y="372" width="66.5168" height="2" rx="3" fill="#c0432f"/><text x="113.928" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="113.928" dy="0">0</tspan></text><rect x="151.186" y="372" width="66.5168" height="2" rx="3" fill="#087f8c"/><text x="184.444" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="184.444" dy="0">0</tspan></text><text x="149.186" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="149.186" dy="0">raw_users</tspan></text><rect x="251.961" y="287.333" width="66.5168" height="86.6667" rx="3" fill="#c0432f"/><text x="285.22" y="281.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="285.22" dy="0">1</tspan></text><rect x="322.478" y="372" width="66.5168" height="2" rx="3" fill="#087f8c"/><text x="355.736" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="355.736" dy="0">0</tspan></text><text x="320.478" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="320.478" dy="0">stg_users</tspan></text><rect x="423.253" y="114" width="66.5168" height="260" rx="3" fill="#c0432f"/><text x="456.512" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="456.512" dy="0">3</tspan></text><rect x="493.77" y="372" width="66.5168" height="2" rx="3" fill="#087f8c"/><text x="527.028" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="527.028" dy="0">0</tspan></text><text x="491.77" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491.77" dy="0">fact_events</tspan></text><rect x="594.545" y="287.333" width="66.5168" height="86.6667" rx="3" fill="#c0432f"/><text x="627.804" y="281.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="627.804" dy="0">1</tspan></text><rect x="665.062" y="372" width="66.5168" height="2" rx="3" fill="#087f8c"/><text x="698.32" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="698.32" dy="0">0</tspan></text><text x="663.062" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="663.062" dy="0">feature_store</tspan></text><rect x="765.837" y="287.333" width="66.5168" height="86.6667" rx="3" fill="#c0432f"/><text x="799.096" y="281.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="799.096" dy="0">1</tspan></text><rect x="836.354" y="287.333" width="66.5168" height="86.6667" rx="3" fill="#087f8c"/><text x="869.612" y="281.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="869.612" dy="0">1</tspan></text><text x="834.354" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="834.354" dy="0">export.csv (copia</tspan></text><text x="834.354" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="834.354" dy="0">fuera de las tablas)</tspan></text><rect x="10" y="443" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="467.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El linaje de tablas encuentra todas las copias que son tablas; la copia exportada a un archivo no está en el grafo y</tspan></text><text x="470" y="484.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sobrevive. Por eso el catálogo debe registrar las exportaciones como activos con dueño, y por eso el plazo de un borrado</tspan></text><text x="470" y="501.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">incluye las copias de seguridad, que esta prueba no modeló.</tspan></text><text x="470" y="548.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
