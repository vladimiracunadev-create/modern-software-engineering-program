<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Filas con un correo o un teléfono dentro de cada columna, sobre una muestra de 500 filas</title><desc id="d">Barras horizontales con las filas de la muestra que contienen un dato personal: email 500 y phone 500, columnas cuyo nombre lo delata, y contact_ref 150 y note 55, columnas con nombre inocuo que también guardan correos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Filas con un correo o un teléfono dentro de cada columna, sobre una muestra de 500 filas</tspan></text><line x1="324" y1="49" x2="324" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="201" x2="324" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="437.564" y1="49" x2="437.564" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="437.564" y1="201" x2="437.564" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="437.564" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437.564" dy="0">100</tspan></text><line x1="551.128" y1="49" x2="551.128" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="551.128" y1="201" x2="551.128" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="551.128" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="551.128" dy="0">200</tspan></text><line x1="664.692" y1="49" x2="664.692" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="664.692" y1="201" x2="664.692" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="664.692" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="664.692" dy="0">300</tspan></text><line x1="778.256" y1="49" x2="778.256" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="778.256" y1="201" x2="778.256" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="778.256" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.256" dy="0">400</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="201" x2="891.82" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">500</tspan></text><line x1="324" y1="201" x2="891.82" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">email (el nombre lo delata)</tspan></text><text x="314" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">phone (el nombre lo delata)</tspan></text><text x="314" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">contact_ref (el nombre no lo delata)</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">note (el nombre no lo delata)</tspan></text><rect x="324" y="55" width="567.82" height="26" rx="3" fill="#102a43"/><text x="898.82" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">500</tspan></text><rect x="324" y="93" width="567.82" height="26" rx="3" fill="#102a43"/><text x="898.82" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">500</tspan></text><rect x="324" y="131" width="170.346" height="26" rx="3" fill="#102a43"/><text x="501.346" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="501.346" dy="0">150</tspan></text><rect x="324" y="169" width="62.4602" height="26" rx="3" fill="#102a43"/><text x="393.46" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="393.46" dy="0">55</tspan></text><text x="607.91" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">Filas de 500 con correo o teléfono</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un clasificador por nombre de columna encuentra dos de las cuatro columnas con datos personales; el texto libre y los</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">identificadores externos esconden el resto. Clasificar por contenido sobre una muestra encuentra las cuatro, a costa de</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">leer datos y de errar en ambos sentidos con valores que se parecen a un correo sin serlo.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
