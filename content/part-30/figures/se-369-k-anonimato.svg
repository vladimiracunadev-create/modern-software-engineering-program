an></text><text x="403.562" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.562" dy="0">Ciudad y plan</tspan></text><rect x="527.507" y="278.56" width="80.63" height="76.44" rx="3" fill="#c0432f"/><text x="567.822" y="272.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="567.822" dy="0">441</tspan></text><rect x="612.137" y="127.933" width="80.63" height="227.067" rx="3" fill="#102a43"/><text x="652.452" y="121.933" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652.452" dy="0">1 310</tspan></text><text x="610.137" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">Ciudad, plan y año de</tspan></text><text x="610.137" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">nacimiento</tspan></text><rect x="734.082" y="353" width="80.63" height="2" rx="3" fill="#c0432f"/><text x="774.398" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="774.398" dy="0">0</tspan></text><rect x="818.712" y="353" width="80.63" height="2" rx="3" fill="#102a43"/><text x="859.027" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.027" dy="0">0</tspan></text><text x="816.712" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">Ciudad, plan y década de</tspan></text><text x="816.712" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">nacimiento</tspan></text><rect x="10" y="424" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Añadir el año de nacimiento convierte 18 grupos cómodos en 1 004 grupos, 441 de ellos con menos de cinco personas: 1 310 de</tspan></text><text x="470" y="465.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">5 000 personas quedan señaladas por su combinación. Generalizar a la década vuelve a 108 grupos sin ninguno pequeño.</tspan></text><text x="470" y="482.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">K-anonimato es una condición necesaria sobre la tabla liberada y no garantiza privacidad frente a quien sabe más.</tspan></text><text x="470" y="529.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
