<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 547" width="940" height="547" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Grupos pequeños de un agregado liberado según los cuasi-identificadores, con k igual a 5</title><desc id="d">Barras agrupadas con los grupos de menos de 5 personas y las personas en ellos: ciudad 0 y 0, ciudad y plan 0 y 0, ciudad plan y año de nacimiento 441 grupos y 1310 personas, y ciudad plan y década de nacimiento 0 y 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="547" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Grupos pequeños de un agregado liberado según los cuasi-identificadores, con k igual a 5</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Grupos con menos de 5 personas</tspan></text><rect x="290.2" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="310.2" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310.2" dy="0">Personas en esos grupos</tspan></text><line x1="93.7" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="355" x2="93.7" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="268.333" x2="920" y2="268.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="268