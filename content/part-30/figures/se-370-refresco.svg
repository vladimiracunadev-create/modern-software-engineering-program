<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo mensual de refrescar un mart según la frecuencia, con recálculo completo o incremental de 2 días</title><desc id="d">Barras agrupadas en unidades inventadas: cada 5 minutos el recálculo completo cuesta 24335 y el incremental 3042; cada hora 2028 y 253; una vez al día 84 y 11; escala logarítmica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="540" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo mensual de refrescar un mart según la frecuencia, con recálculo completo o incremental de 2 días</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Recálculo completo</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Incremental, últimos 2 días</tspan></text><line x1="108.78" y1="365" x2="920" y2="365" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="365" x2="108.78" y2="365" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10</tspan></text><line x1="108.78" y1="297.5" x2="920" y2="297.5" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="297.5" x2="108.78" y2="297.5" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="302" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100</tspan></text><line x1="108.78" y1="230" x2="920" y2="230" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="230" x2="108.78" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="234.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">1 000</tspan></text><line x1="108.78" y1="162.5" x2="920" y2="162.5" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="162.5" x2="108.78" y2="162.5" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10 000</tspan></text><line x1="108.78" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="95" x2="108.78" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100 000</tspan></text><line x1="108.78" y1="95" x2="108.78" y2="365" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 230)">Costo mensual (unidades inventadas) (escala logarítmica)</text><rect x="135.821" y="136.429" width="106.163" height="228.571" rx="3" fill="#c0432f"/><text x="188.902" y="130.429" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="188.902" dy="0">24 335</tspan></text><rect x="245.983" y="197.387" width="106.163" height="167.613" rx="3" fill="#087f8c"/><text x="299.065" y="191.387" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="299.065" dy="0">3 042</tspan></text><text x="243.983" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="243.983" dy="0">Cada 5 minutos</tspan></text><rect x="406.227" y="209.273" width="106.163" height="155.727" rx="3" fill="#c0432f"/><text x="459.309" y="203.273" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="459.309" dy="0">2 028</tspan></text><rect x="516.39" y="270.289" width="106.163" height="94.7106" rx="3" fill="#087f8c"/><text x="569.471" y="264.289" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="569.471" dy="0">253</tspan></text><text x="514.39" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.39" dy="0">Cada hora</tspan></text><rect x="676.634" y="302.611" width="106.163" height="62.3889" rx="3" fill="#c0432f"/><text x="729.715" y="296.611" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="729.715" dy="0">84</tspan></text><rect x="786.797" y="362.206" width="106.163" height="2.79401" rx="3" fill="#087f8c"/><text x="839.878" y="356.206" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.878" dy="0">11</tspan></text><text x="784.797" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.797" dy="0">Una vez al día</tspan></text><rect x="10" y="417" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="441.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con los tiempos de esta ejecución (700 ms completo y 78 ms incremental sobre 500 000 filas, escalados 2 000 veces) el</tspan></text><text x="470" y="458.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">incremental cuesta unas 8 veces menos en cada frecuencia, y pasar de diario a cada 5 minutos multiplica el costo por 288 en</tspan></text><text x="470" y="475.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ambos. La frecuencia es la decisión más cara de la plataforma y la menos discutida.</tspan></text><text x="470" y="522.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 45; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
