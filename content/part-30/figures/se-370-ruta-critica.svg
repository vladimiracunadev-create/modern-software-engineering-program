<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 536" width="940" height="536" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho tareas de un pipeline: la ruta crítica de 40 minutos y las tareas que tienen holgura</title><desc id="d">Diagrama de Gantt con ocho tareas: la ruta crítica, en rojo, es ingest_orders 12 minutos, stg_orders 6, fact_sales 15, mart_city 5 y report 2, en total 40 minutos; ingest_customers 4, dim_customer 3 y mart_daily 4 tienen holgura; la suma de todas las duraciones es 51 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="536" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocho tareas de un pipeline: la ruta crítica de 40 minutos y las tareas que tienen holgura</tspan></text><line x1="194" y1="51" x2="194" y2="371" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="371" x2="194" y2="376" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="392" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">0</tspan></text><line x1="373.5" y1="51" x2="373.5" y2="371" stroke="#d5dde1" stroke-width="1"/><line x1="373.5" y1="371" x2="373.5" y2="376" stroke="#5b7280" stroke-width="1.4"/><text x="373.5" y="392" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="373.5" dy="0">10</tspan></text><line x1="553" y1="51" x2="553" y2="371" stroke="#d5dde1" stroke-width="1"/><line x1="553" y1="371" x2="553" y2="376" stroke="#5b7280" stroke-width="1.4"/><text x="553" y="392" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="553" dy="0">20</tspan></text><line x1="732.5" y1="51" x2="732.5" y2="371" stroke="#d5dde1" stroke-width="1"/><line x1="732.5" y1="371" x2="732.5" y2="376" stroke="#5b7280" stroke-width="1.4"/><text x="732.5" y="392" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732.5" dy="0">30</tspan></text><line x1="912" y1="51" x2="912" y2="371" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="371" x2="912" y2="376" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="392" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">40</tspan></text><line x1="194" y1="371" x2="912" y2="371" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="75.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">ingest_orders</tspan></text><text x="184" y="115.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">stg_orders</tspan></text><text x="184" y="155.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">fact_sales</tspan></text><text x="184" y="195.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">mart_city</tspan></text><text x="184" y="235.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">report</tspan></text><text x="184" y="275.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">ingest_customers</tspan></text><text x="184" y="315.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">dim_customer</tspan></text><text x="184" y="355.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">mart_daily</tspan></text><rect x="194" y="60" width="215.4" height="22" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="301.7" y="75.5" font-size="13" text-anc