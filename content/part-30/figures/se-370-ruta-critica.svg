></text><line x1="14" y1="331" x2="912" y2="331" stroke="#d5dde1" stroke-width="1"/><rect x="786.35" y="340" width="71.8" height="22" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="822.25" y="355.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822.25" dy="0">4</tspan></text><text x="553" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="553" dy="0">Minutos desde el inicio</tspan></text><rect x="10" y="429" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="453.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Reducir a la mitad fact_sales baja el total de 40 a 32,5 minutos; reducir mart_city, de 40 a 39; reducir ingest_customers</tspan></text><text x="470" y="470.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">no cambia nada. Optimizar fuera de la ruta crítica no mueve la hora de entrega.</tspan></text><text x="470" y="518.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 45; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
