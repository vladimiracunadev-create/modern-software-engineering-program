<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 371" width="880" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Corridas de la suite que pasan limpias según su tamaño y la inestabilidad de cada prueba: (1 − p)^N</title><desc id="d">Tabla: con una inestabilidad de 0,1 por ciento por prueba, una suite de 1 000 pruebas pasa limpia 36,8 por ciento de las veces y una de 5 000 pasa 0,7 por ciento; con 0,5 por ciento una suite de 200 pasa 36,7 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="880" height="371" fill="#ffffff"/><rect x="10" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="127" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="127" dy="0">Fallo espurio por prueba</tspan></text><rect x="250" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="322" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322" dy="0">50 pruebas</tspan></text><rect x="400" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">200 pruebas</tspan></text><rect x="550" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="627" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">1 000 pruebas</tspan></text><rect x="710" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">5 000 pruebas</tspan></text><rect x="10" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">0,01 %</tspan></text><rect x="250" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">99,5</tspan></text><rect x="400" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">98,0</tspan></text><rect x="550" y="56" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">90,5</tspan></text><rect x="710" y="56" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">60,7</tspan></text><rect x="10" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">0,1 %</tspan></text><rect x="250" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">95,1</tspan></text><rect x="400" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">81,9</tspan></text><rect x="550" y="106" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">36,8</tspan></text><rect x="710" y="106" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">0,7</tspan></text><rect x="10" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">0,5 %</tspan></text><rect x="250" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">77,8</tspan></text><rect x="400" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">36,7</tspan></text><rect x="550" y="156" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">0,7</tspan></text><rect x="710" y="156" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">0,0</tspan></text><rect x="10" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">1 %</tspan></text><rect x="250" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">60,5</tspan></text><rect x="400" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">13,4</tspan></text><rect x="550" y="206" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">0,0</tspan></text><rect x="710" y="206" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">0,0</tspan></text><rect x="10" y="260" width="860" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="440" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">Un reintento automático lo arregla en apariencia: con una inestabilidad del 2 % y un reintento, la prueba termina</tspan></text><text x="440" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">en verde el 99,96 % de las veces, pero un defecto real que falla el 30 % de las ejecuciones también termina en</tspan></text><text x="440" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">verde el 91,2 % con un reintento y el 97,3 % con dos. Reintentar oculta el problema que ahora no se ve.</tspan></text><text x="440" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
