<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 371" width="910" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas pruebas hacen falta para matar los mismos mutantes, y qué indicador barato se parece más</title><desc id="d">Tabla: tres de catorce pruebas matan los mismos 17 mutantes que la suite entera; la correlación de rangos entre el número de aserciones y los mutantes muertos es 0,45 y entre líneas ejecutadas y mutantes muertos es 0,87, con catorce pruebas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="371" fill="#ffffff"/><rect x="10" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="267" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="267" dy="0">Medida</tspan></text><rect x="530" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="612" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">Valor</tspan></text><rect x="700" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Detalle</tspan></text><rect x="10" y="56" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Pruebas en la suite · mutantes muertos por la unión</tspan></text><rect x="530" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">14 · 17 de 18</tspan></text><rect x="700" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">—</tspan></text><rect x="10" y="106" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Conjunto mínimo (voraz) que mata los mismos 17</tspan></text><rect x="530" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">3 de 14</tspan></text><rect x="700" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">t08, t11, t12</tspan></text><rect x="10" y="156" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Correlación de Spearman entre aserciones y mutantes muertos</tspan></text><rect x="530" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">0,45</tspan></text><rect x="700" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">n = 14</tspan></text><rect x="10" y="206" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Correlación de Spearman entre líneas ejecutadas y mutantes muertos</tspan></text><rect x="530" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">0,87</tspan></text><rect x="700" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">n = 14</tspan></text><rect x="10" y="260" width="890" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">Las otras once pruebas no son basura: documentan, protegen contra otras regresiones y fallan con mensajes más claros.</tspan></text><text x="455" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">Que el mínimo sea de tres solo dice que, frente a estos mutantes, el resto no añade detección. Con n = 14 las</tspan></text><text x="455" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">correlaciones son una orientación y no una regla.</tspan></text><text x="455" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
