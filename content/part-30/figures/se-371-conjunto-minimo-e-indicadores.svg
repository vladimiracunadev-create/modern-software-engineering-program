<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 318" width="940" height="318" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué indicador barato se parece más a los mutantes muertos: correlación de rangos de Spearman con 14 pruebas</title><desc id="d">Barras horizontales: la correlación de rangos entre el número de aserciones y los mutantes muertos es 0,45 y entre las líneas ejecutadas y los mutantes muertos es 0,87, con catorce pruebas; tres de las catorce matan los mismos 17 mutantes que la suite entera.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="318" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué indicador barato se parece más a los mutantes muertos: correlación de rangos de Spearman con 14 pruebas</tspan></text><line x1="304" y1="49" x2="304" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="304" y1="137" x2="304" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="304" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="304" dy="0">0</tspan></text><line x1="448.94" y1="49" x2="448.94" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="448.94" y1="137" x2="448.94" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="448.94" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="448.94" dy="0">0,25</tspan></text><line x1="593.88" y1="49" x2="593.88" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="593.88" y1="137" x2="593.88" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="593.88" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="593.88" dy="0">0,5</tspan></text><line x1="738.82" y1="49" x2="738.82" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="738.82" y1="137" x2="738.82" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="738.82" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="738.82" dy="0">0,75</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="137" x2="883.76" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">1</tspan></text><line x1="304" y1="137" x2="883.76" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="294" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Aserciones frente a mutantes muertos</tspan></text><text x="294" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Líneas ejecutadas frente a mutantes</tspan></text><text x="294" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">muertos</tspan></text><rect x="304" y="55" width="260.892" height="32" rx="3" fill="#087f8c"/><text x="571.892" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="571.892" dy="0">0,45</tspan></text><rect x="304" y="99" width="504.391" height="32" rx="3" fill="#087f8c"/><text x="815.391" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="815.391" dy="0">0,87</tspan></text><text x="593.88" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593.88" dy="0">coeficiente de correlación de rangos (0 = ninguna, 1 = perfecta)</tspan></text><rect x="10" y="195" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Tres de las 14 pruebas (t08, t11 y t12, por un conjunto voraz) matan los mismos 17 mutantes que la suite entera, que mata</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">17 de 18. Las otras once no son basura: documentan, protegen contra otras regresiones y fallan con mensajes más claros. Con</tspan></text><text x="470" y="253.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">n = 14 las correlaciones son una orientación y no una regla.</tspan></text><text x="470" y="300.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
