<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 353" width="960" height="353" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Plataforma mínima gobernada de Avisos: tres capas, un registro de metadatos y un control que decide si se publica</title><desc id="d">Diagrama en dos filas: la zona cruda raw_orders con datos personales declarados, la capa intermedia stg_orders con un seudónimo en lugar del correo y el mart diario mart_daily; un registro de metadatos con dueño, contrato, comprobaciones, retención y entradas de cada conjunto; y un control de siete reglas sobre dueño, contrato, comprobaciones, datos personales, retención, linaje y frescura que se ejecuta antes de publicar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="353" fill="#ffffff"/><rect x="10" y="14" width="284" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">raw_orders</tspan></text><text x="152" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Correo declarado como dato personal</tspan></text><rect x="338" y="14" width="284" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">stg_orders</tspan></text><text x="480" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Seudónimo en lugar del correo</tspan></text><polyline points="294,62 338,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">mart_daily</tspan></text><text x="808" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">Día, pedidos e ingreso, sin datos</tspan></text><text x="808" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">personales</tspan></text><polyline points="622,62 666,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="150" width="284" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152" dy="0">Registro de metadatos</tspan></text><text x="152" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152" dy="0">Dueño, contrato, comprobaciones,</tspan></text><text x="152" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152" dy="0">retención, entradas</tspan></text><rect x="338" y="150" width="284" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Control de siete reglas</tspan></text><text x="480" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Se ejecuta antes de publicar</tspan></text><polyline points="294,198 338,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="150" width="284" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="808" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">Informe de evidencia</tspan></text><text x="808" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">Qué se comprobó y qué no se ve</tspan></text><polyline points="622,198 666,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,110 808,130 152,130 152,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="260" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Todo lo que el control comprueba está declarado en el registro y verificado contra lo construido: el registro dice lo que</tspan></text><text x="480" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">debería ser y el control lo compara con lo que es. Sin las dos mitades, o la gobernanza es un documento o es una conjetura.</tspan></text><text x="480" y="343.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
