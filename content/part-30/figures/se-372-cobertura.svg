<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 499" width="940" height="499" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutaciones detectadas de 10 según el control que se aplique a la plataforma</title><desc id="d">Barras con las mutaciones detectadas de diez: el control de siete reglas detecta 9, un control que solo compara el esquema con el contrato detecta 2 y sin control se detectan 0 antes de que un consumidor las vea.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="499" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mutaciones detectadas de 10 según el control que se aplique a la plataforma</tspan></text><line x1="71.08" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="307" x2="71.08" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="259" x2="920" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="259" x2="71.08" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">2</tspan></text><line x1="71.08" y1="211" x2="920" y2="211" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="211" x2="71.08" y2="211" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="215.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">4</tspan></text><line x1="71.08" y1="163" x2="920" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="163" x2="71.08" y2="163" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">6</tspan></text><line x1="71.08" y1="115" x2="920" y2="115" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="115" x2="71.08" y2="115" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">8</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="67" x2="71.08" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="67" x2="71.08" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">Mutaciones detectadas de 10</text><rect x="99.3773" y="91" width="226.379" height="216" rx="3" fill="#087f8c"/><text x="212.567" y="85" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">9</tspan></text><text x="212.567" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Control de siete reglas</tspan></text><rect x="382.351" y="259" width="226.379" height="48" rx="3" fill="#087f8c"/><text x="495.54" y="253" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">2</tspan></text><text x="495.54" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Solo comparar el esquema con el</tspan></text><text x="495.54" y="345" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">contrato</tspan></text><rect x="665.324" y="305" width="226.379" height="2" rx="3" fill="#087f8c"/><text x="778.513" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">0</tspan></text><text x="778.513" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Sin control</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="61" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">10</tspan></text><rect x="10" y="376" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="400.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las diez mutaciones son de autor y cubren las siete reglas con una por regla, más una semántica: miden qué familia de</tspan></text><text x="470" y="417.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">defectos ve cada regla, no la tasa de defectos de una plataforma real. Comparar el esquema detecta solo lo que cambia el</tspan></text><text x="470" y="434.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">contrato; el resto exige reglas sobre dueños, datos personales, retención, linaje y frescura.</tspan></text><text x="470" y="481.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 45; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
