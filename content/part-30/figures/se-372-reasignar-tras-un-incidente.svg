<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reasignar el presupuesto tras un incidente en plazos y zonas horarias</title><desc id="d">Flujo de cuatro pasos: el incidente multiplica por tres la probabilidad de defecto de plazos y zonas horarias y por la mitad la de notificaciones; 2,3 horas salen de notificaciones y 3,7 llegan a plazos; la pérdida esperada baja de 0,706 a 0,678 y la media simulada de 22,59 a 21,73; tres componentes quedan bajo 2 horas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="340" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reasignar el presupuesto tras un incidente en plazos y zonas horarias</tspan></text><rect x="10" y="51" width="200" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="66.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="110" dy="0">Incidente en plazos y</tspan></text><text x="110" y="82.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="110" dy="0">zonas horarias</tspan></text><rect x="10" y="97" width="200" height="104" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="136" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Probabilidad de defecto</tspan></text><text x="110" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">de plazos ×3 y de</tspan></text><text x="110" y="169.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">notificaciones ×0,5</tspan></text><polyline points="210,71 254,71" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="254" y="51" width="200" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="354" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="354" dy="0">Reasignar las horas</tspan></text><rect x="254" y="97" width="200" height="104" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="354" y="127.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">Notificaciones: de 2,3 h</tspan></text><text x="354" y="144.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">a 0,0 h. Plazos y zonas</tspan></text><text x="354" y="160.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">horarias: de 4,7 h a 8,4</tspan></text><text x="354" y="177.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">h</tspan></text><polyline points="454,71 498,71" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="498" y="51" width="200" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="598" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="598" dy="0">Pérdida esperada</tspan></text><rect x="498" y="97" width="200" height="104" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="598" y="127.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598" dy="0">Del modelo: de 0,706 a</tspan></text><text x="598" y="144.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598" dy="0">0,678 (−4 %). Media</tspan></text><text x="598" y="160.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598" dy="0">simulada: de 22,59 a</tspan></text><text x="598" y="177.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598" dy="0">21,73 (−3,8 %)</tspan></text><polyline points="698,71 742,71" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="742" y="51" width="200" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Bajo 2 horas</tspan></text><rect x="742" y="97" width="200" height="104" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="127.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Autenticación 0,7 h,</tspan></text><text x="842" y="144.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">búsqueda 0,6 h,</tspan></text><text x="842" y="160.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">administración 1,1 h: se</tspan></text><text x="842" y="177.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">declaran y caducan</tspan></text><rect x="10" y="217" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="241.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Reasignar tras un incidente mejora poco (3,8 %) porque el plan anterior ya era razonable; lo que cambia es que ahora está</tspan></text><text x="470" y="258.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">justificado con el incidente. Tres componentes quedan bajo 2 horas: el paquete los declara como exclusiones con una razón y</tspan></text><text x="470" y="275.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una fecha de caducidad, no los deja olvidados.</tspan></text><text x="470" y="322.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
