<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 577" width="910" height="577" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador del paquete de estrategia: 200 mutaciones y nivel en que se detecta cada una</title><desc id="d">Tabla: el validador detecta 186 de 200 mutaciones; 60 con la estructura, 124 al añadir coherencia de riesgo y 186 al añadir presupuesto y trazabilidad; las 13 mutaciones inocuas de redacción no se detectan y una mutación del nivel resulta equivalente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="577" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Tipo de mutación (cantidad)</tspan></text><rect x="570" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">Detectadas</tspan></text><rect x="700" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Primer nivel</tspan></text><rect x="10" y="56" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Campo de un riesgo eliminado (20) · p fuera de rango (19) · límites vacíos (21)</tspan></text><rect x="570" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">60</tspan></text><rect x="700" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Estructura</tspan></text><rect x="10" y="114" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Nivel que no ve la clase de fallo (10, de los que 9 cambian algo)</tspan></text><rect x="570" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">9</tspan></text><rect x="700" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Coherencia</tspan></text><rect x="10" y="172" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Riesgo alto con 0,5 h (13) · excluir un riesgo alto (11)</tspan></text><rect x="570" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">24</tspan></text><rect x="700" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Coherencia</tspan></text><rect x="10" y="230" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Exclusión sin caducidad (19) o a un año (12)</tspan></text><rect x="570" y="230" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">31</tspan></text><rect x="700" y="230" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Coherencia</tspan></text><rect x="10" y="288" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Horas que no suman (11) · sin gate que bloquee (18)</tspan></text><rect x="570" y="288" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">29</tspan></text><rect x="700" y="288" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Presupuesto</tspan></text><rect x="10" y="346" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="375.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Componente sin decisión (17) · prueba repetida (16)</tspan></text><rect x="570" y="346" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">33</tspan></text><rect x="700" y="346" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Trazabilidad</tspan></text><rect x="10" y="404" width="554" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="433.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Cambio de redacción inocuo (13)</tspan></text><rect x="570" y="404" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="433.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">0</tspan></text><rect x="700" y="404" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="433.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">No debe detectarse</tspan></text><rect x="10" y="466" width="890" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">De 187 mutaciones que cambian el contenido se detectan 186: la que falta es un cambio de nivel que cae en otro nivel</tspan></text><text x="455" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">igualmente válido, es decir, no cambia nada. Las reglas se ajustaron con los mismos tipos que se miden; un paquete</tspan></text><text x="455" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">incorrecto de un tipo no contemplado puede pasar.</tspan></text><text x="455" y="563.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
