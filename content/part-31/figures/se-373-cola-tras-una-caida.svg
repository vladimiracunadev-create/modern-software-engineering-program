<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una dependencia caída 600 s con 1 envío por segundo: tiempo que tarda la cola en vaciarse</title><desc id="d">Línea con los segundos que tarda la cola en vaciarse según la capacidad del consumidor al volver: 2 995 s con 1,2 mensajes por segundo, 1 198 con 1,5, 599 con 2 y 199 con 4, siempre con 600 mensajes acumulados que habrían sido 600 errores síncronos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una dependencia caída 600 s con 1 envío por segundo: tiempo que tarda la cola en vaciarse</tspan></text><line x1="93.7" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="359" x2="93.7" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="309" x2="910" y2="309" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="309" x2="93.7" y2="309" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="313.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="259" x2="910" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="259" x2="93.7" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="209" x2="910" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="209" x2="93.7" y2="209" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="213.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 500</tspan></text><line x1="93.7" y1="159" x2="910" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="159" x2="93.7" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="109" x2="910" y2="109" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="109" x2="93.7" y2="109" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 500</tspan></text><line x1="93.7" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="59" x2="93.7" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3 000</tspan></text><line x1="93.7" y1="59" x2="93.7" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="59" x2="111.7" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="359" x2="111.7" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">1,2</tspan></text><line x1="195.304" y1="59" x2="195.304" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="195.304" y1="359" x2="195.304" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="195.304" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="195.304" dy="0">1,5</tspan></text><line x1="334.643" y1="59" x2="334.643" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="334.643" y1="359" x2="334.643" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="334.643" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334.643" dy="0">2</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">4</tspan></text><line x1="93.7" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Segundos hasta vaciar la cola</text><text x="501.85" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">Capacidad del consumidor al volver (mensajes por segundo)</tspan></text><polyline points="111.7,59.5 195.304,239.2 334.643,299.1 892,339.1" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="111.7" cy="59.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="121.7" y="64" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="121.7" dy="0">2 995 s (casi 50 min)</tspan></text><circle cx="195.304" cy="239.2" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="205.304" y="243.7" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="205.304" dy="0">1 198</tspan></text><circle cx="334.643" cy="299.1" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="344.643" y="303.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="344.643" dy="0">599</tspan></text><circle cx="892" cy="339.1" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="328.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">199</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La cola convierte 600 errores en 600 mensajes con retraso, y el tiempo de recuperación depende del margen de capacidad: cae</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">como el inverso de la capacidad que sobra sobre la llegada. Con una capacidad igual a la llegada nunca se vacía. Llegada</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">constante y capacidad fija son supuestos del autor.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
