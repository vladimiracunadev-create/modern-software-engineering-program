<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 496" width="940" height="496" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reintentos apilados: llamadas que recibe el servicio por cada petición del usuario</title><desc id="d">Barras horizontales con las llamadas que recibe el servicio por petición según su estado y la política de reintentos: sano recibe 1, caído con una capa y dos reintentos recibe 3, caído con tres capas de dos reintentos recibe 27 y con un presupuesto del 10 por ciento por capa solo 1,30, aunque con fallo parcial del 50 por ciento el éxito baja de 100 a 64,8 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="496" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reintentos apilados: llamadas que recibe el servicio por cada petición del usuario</tspan></text><line x1="354" y1="49" x2="354" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="315" x2="354" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="440.95" y1="49" x2="440.95" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="440.95" y1="315" x2="440.95" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="440.95" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="440.95" dy="0">5</tspan></text><line x1="527.9" y1="49" x2="527.9" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="527.9" y1="315" x2="527.9" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="527.9" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527.9" dy="0">10</tspan></text><line x1="614.85" y1="49" x2="614.85" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="614.85" y1="315" x2="614.85" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="614.85" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="614.85" dy="0">15</tspan></text><line x1="701.8" y1="49" x2="701.8" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="701.8" y1="315" x2="701.8" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="701.8" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701.8" dy="0">20</tspan></text><line x1="788.75" y1="49" x2="788.75" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="788.75" y1="315" x2="788.75" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="788.75" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="788.75" dy="0">25</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="315" x2="875.7" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">30</tspan></text><line x1="354" y1="315" x2="875.7" y2="315" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sano (0 % de fallo) · 1 capa, 2 reintentos</tspan></text><text x="344" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">50 % de fallo · 1 capa, 2 reintentos</tspan></text><text x="344" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">50 % · 3 capas, 2 reintentos cada una</tspan></text><text x="344" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">50 % · 3 capas con presupuesto del 10 %</tspan></text><text x="344" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Caído · 1 capa, 2 reintentos</tspan></text><text x="344" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Caído · 3 capas, 2 reintentos cada una</tspan></text><text x="344" y="300.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Caído · 3 capas con presupuesto del 10 %</tspan></text><rect x="354" y="55" width="17.39" height="26" rx="3" fill="#c0432f"/><text x="378.39" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="378.39" dy="0">1,00</tspan></text><rect x="354" y="93" width="30.4325" height="26" rx="3" fill="#c0432f"/><text x="391.433" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="391.433" dy="0">1,75</tspan></text><rect x="354" y="131" width="34.9539" height="26" rx="3" fill="#c0432f"/><text x="395.954" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="395.954" dy="0">2,01</tspan></text><rect x="354" y="169" width="22.607" height="26" rx="3" fill="#c0432f"/><text x="383.607" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="383.607" dy="0">1,30</tspan></text><rect x="354" y="207" width="52.17" height="26" rx="3" fill="#c0432f"/><text x="413.17" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="413.17" dy="0">3,00</tspan></text><rect x="354" y="245" width="469.53" height="26" rx="3" fill="#c0432f"/><text x="830.53" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="830.53" dy="0">27,00</tspan></text><rect x="354" y="283" width="22.607" height="26" rx="3" fill="#c0432f"/><text x="383.607" y="300.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="383.607" dy="0">1,30</tspan></text><text x="614.85" y="359" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Llamadas que recibe el servicio por petición</tspan></text><rect x="10" y="373" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada capa reintenta sin saber que las demás también lo hacen, de modo que el servicio caído recibe 3^3 = 27 veces la carga</tspan></text><text x="470" y="414.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">justo cuando menos puede soportarla. El presupuesto frena la amplificación y deja de ayudar cuando el fallo es parcial: con</tspan></text><text x="470" y="431.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">50 % de fallo las peticiones que terminan bien bajan de 100 % a 64,8 %. Simulación de 10 000 peticiones; sin latencias.</tspan></text><text x="470" y="478.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
