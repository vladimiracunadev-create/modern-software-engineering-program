<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 519" width="940" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un mismo mes de 60 000 peticiones medido con seis definiciones del objetivo «p95 ≤ 300 ms»</title><desc id="d">Tabla: con la misma ventana de 30 días, la media de las medias diarias cumple con 161 milisegundos, el percentil 95 del mes cumple con 227, pero exigir el percentil 95 en cada día falla el día 17 con 2 294 milisegundos, y el percentil 99 del mes es de 2 057 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="519" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Definición de «cumple»</tspan></text><rect x="440" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Valor</tspan></text><rect x="600" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="762" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">Veredicto</tspan></text><rect x="10" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Media de las medias diarias</tspan></text><rect x="440" y="56" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">161 ms</tspan></text><rect x="600" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">Cumple</tspan></text><rect x="10" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">p95 de todas las peticiones del mes</tspan></text><rect x="440" y="114" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">227 ms</tspan></text><rect x="600" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">Cumple</tspan></text><rect x="10" y="172" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">p95 de cada día (se exige en los 30)</tspan></text><rect x="440" y="172" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">29 de 30 días</tspan></text><rect x="600" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">No cumple: falla el día 17</tspan></text><rect x="10" y="230" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="251.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">p95 del día 17 (tres horas con 60 % de peticiones</tspan></text><text x="222" y="267.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">lentas)</tspan></text><rect x="440" y="230" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">2 294 ms</tspan></text><rect x="600" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">No cumple</tspan></text><rect x="10" y="288" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Fracción del mes por encima de 300 ms</tspan></text><rect x="440" y="288" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">2,00 %</tspan></text><rect x="600" y="288" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">Cumple si el margen es 5 %</tspan></text><rect x="10" y="346" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="375.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">p99 del mes</tspan></text><rect x="440" y="346" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="375.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">2 057 ms</tspan></text><rect x="600" y="346" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="367.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">Sin objetivo: la cola existe y nadie la</tspan></text><text x="762" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">pide</tspan></text><rect x="10" y="408" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El objetivo es el mismo número y las definiciones llegan a conclusiones opuestas. Agregar el mes entero diluye un incidente</tspan></text><text x="470" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de tres horas porque 59 de cada 60 peticiones fueron normales. La definición forma parte del requisito: ventana,</tspan></text><text x="470" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estadístico y alcance.</tspan></text><text x="470" y="505.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
