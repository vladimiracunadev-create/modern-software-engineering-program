<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres compuertas de cobertura sobre 500 cambios que se fusionan en un repositorio de 20 000 líneas al 72 %</title><desc id="d">Tabla: la compuerta de cobertura total mínima del 70 por ciento deja pasar los 117 cambios con pruebas pobres; las compuertas de que la cobertura total no baje y de cobertura del cambio al 80 por ciento no dejan pasar ninguno; la del cambio bloquea a 1 de 193 cambios bien probados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="345" fill="#ffffff"/><rect x="10" y="12" width="384" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="202" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="202" dy="0">Compuerta</tspan></text><rect x="400" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Cambios con pruebas pobres que</tspan></text><text x="537" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">pasan</tspan></text><rect x="680" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Cambios bien probados que se</tspan></text><text x="812" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">bloquean</tspan></text><rect x="10" y="56" width="384" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="202" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="202" dy="0">Cobertura total ≥ 70 %</tspan></text><rect x="400" y="56" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">117 de 117</tspan></text><rect x="680" y="56" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0 de 193</tspan></text><rect x="10" y="114" width="384" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="202" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="202" dy="0">La cobertura total no baja</tspan></text><rect x="400" y="114" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">0 de 117</tspan></text><rect x="680" y="114" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0 de 193</tspan></text><rect x="10" y="172" width="384" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="202" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="202" dy="0">Cobertura de las líneas del cambio ≥ 80 %</tspan></text><rect x="400" y="172" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">0 de 117</tspan></text><rect x="680" y="172" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">1 de 193</tspan></text><rect x="10" y="234" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">El repositorio crece de 20 000 a 118 813 líneas y la cobertura total termina en 73,1 %: cada cambio mueve el total menos de</tspan></text><text x="480" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">0,1 punto, así que un umbral absoluto no ve a ninguno. «Pobre» significa que la calidad real de las pruebas es menor del 60 %;</tspan></text><text x="480" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">la cobertura mide líneas ejecutadas, no aserciones.</tspan></text><text x="480" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
