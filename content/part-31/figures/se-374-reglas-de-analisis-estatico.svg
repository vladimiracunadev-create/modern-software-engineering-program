<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 547" width="940" height="547" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres reglas de análisis estático con ast sobre 300 funciones generadas con defectos conocidos</title><desc id="d">Barras agrupadas con los defectos reales, los hallados y las falsas alarmas antes y después de afinar para cuatro clases de defecto: las tres reglas halladoras encuentran todos los suyos (44, 60 y 37), dejan 18, 40 y 53 falsas alarmas que la afinación baja a 18, 0 y 26, y el recorrido que omite el primer elemento tiene 70 defectos y ninguno hallado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="547" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres reglas de análisis estático con ast sobre 300 funciones generadas con defectos conocidos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Defectos reales</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Hallados</tspan></text><rect x="285.42" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="305.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="305.42" dy="0">Falsas alarmas sin afinar</tspan></text><rect x="521.92" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="541.92" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="541.92" dy="0">Falsas alarmas afinadas</tspan></text><line x1="71.08" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="355" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="290" x2="920" y2="290" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="290" x2="71.08" y2="290" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="294.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="225" x2="920" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="225" x2="71.08" y2="225" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="229.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="160" x2="920" y2="160" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="160" x2="71.08" y2="160" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="164.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Defectos o alertas</text><rect x="92.303" y="212" width="39.446" height="143" rx="3" fill="#102a43"/><text x="112.026" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112.026" dy="0">44</tspan></text><rect x="135.749" y="212" width="39.446" height="143" rx="3" fill="#087f8c"/><text x="155.472" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="155.472" dy="0">44</tspan></text><rect x="179.195" y="296.5" width="39.446" height="58.5" rx="3" fill="#c0432f"/><text x="198.918" y="290.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="198.918" dy="0">18</tspan></text><rect x="222.641" y="296.5" width="39.446" height="58.5" rx="3" fill="#946512"/><text x="242.364" y="290.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242.364" dy="0">18</tspan></text><text x="177.195" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">Argumento por defecto</tspan></text><text x="177.195" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">mutable</tspan></text><rect x="304.533" y="160" width="39.446" height="195" rx="3" fill="#102a43"/><text x="324.256" y="154" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="324.256" dy="0">60</tspan></text><rect x="347.979" y="160" width="39.446" height="195" rx="3" fill="#087f8c"/><text x="367.702" y="154" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="367.702" dy="0">60</tspan></text><rect x="391.425" y="225" width="39.446" height="130" rx="3" fill="#c0432f"/><text x="411.148" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.148" dy="0">40</tspan></text><rect x="434.871" y="353" width="39.446" height="2" rx="3" fill="#946512"/><text x="454.594" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="454.594" dy="0">0</tspan></text><text x="389.425" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">Excepción sin tipo (bare</tspan></text><text x="389.425" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">except)</tspan></text><rect x="516.763" y="234.75" width="39.446" height="120.25" rx="3" fill="#102a43"/><text x="536.486" y="228.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="536.486" dy="0">37</tspan></text><rect x="560.209" y="234.75" width="39.446" height="120.25" rx="3" fill="#087f8c"/><text x="579.932" y="228.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="579.932" dy="0">37</tspan></text><rect x="603.655" y="182.75" width="39.446" height="172.25" rx="3" fill="#c0432f"/><text x="623.378" y="176.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="623.378" dy="0">53</tspan></text><rect x="647.101" y="270.5" width="39.446" height="84.5" rx="3" fill="#946512"/><text x="666.824" y="264.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="666.824" dy="0">26</tspan></text><text x="601.655" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">Variable local sin uso</tspan></text><rect x="728.993" y="127.5" width="39.446" height="227.5" rx="3" fill="#102a43"/><text x="748.716" y="121.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="748.716" dy="0">70</tspan></text><rect x="772.439" y="353" width="39.446" height="2" rx="3" fill="#087f8c"/><text x="792.162" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="792.162" dy="0">0</tspan></text><rect x="815.885" y="353" width="39.446" height="2" rx="3" fill="#c0432f"/><text x="835.608" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835.608" dy="0">0</tspan></text><rect x="859.331" y="353" width="39.446" height="2" rx="3" fill="#946512"/><text x="879.054" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="879.054" dy="0">0</tspan></text><text x="813.885" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">Recorrido que omite el</tspan></text><text x="813.885" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">primer elemento</tspan></text><rect x="10" y="424" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Encontrar el 100 % de lo que busca no es calidad: la regla afinada deja 18 + 26 falsas alarmas y su precisión es del 71 %</tspan></text><text x="470" y="465.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">para argumentos mutables y del 59 % para variables sin uso. Afinar la excepción con los mismos casos que evalúan la regla</tspan></text><text x="470" y="482.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es un sesgo declarado. El defecto lógico (70) queda fuera de cualquier regla sintáctica.</tspan></text><text x="470" y="529.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
