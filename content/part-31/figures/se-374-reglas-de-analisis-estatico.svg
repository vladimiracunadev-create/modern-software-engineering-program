<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 403" width="950" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres reglas de análisis estático con ast sobre 300 funciones generadas con defectos conocidos</title><desc id="d">Tabla: sobre 300 funciones con 161 con algún defecto, las tres reglas encuentran todos los defectos de su clase, pero producen 18 falsas alarmas de argumentos mutables, 40 de excepciones sin tipo que se reducen a cero con una excepción y 53 de variables sin uso que bajan a 26; ninguna regla ve los 70 recorridos que omiten el primer elemento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="403" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Regla</tspan></text><rect x="320" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Defectos</tspan></text><text x="382" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">reales</tspan></text><rect x="450" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Hallados</tspan></text><rect x="560" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Falsas alarmas</tspan></text><rect x="830" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">No vistos</tspan></text><rect x="10" y="56" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Argumento por defecto mutable</tspan></text><rect x="320" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">44</tspan></text><rect x="450" y="56" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">44</tspan></text><rect x="560" y="56" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">18 (caché intencional)</tspan></text><rect x="830" y="56" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0</tspan></text><rect x="10" y="114" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Excepción sin tipo (bare except)</tspan></text><rect x="320" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">60</tspan></text><rect x="450" y="114" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">60</tspan></text><rect x="560" y="114" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="135.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">40 → 0 con la excepción de</tspan></text><text x="692" y="151.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">«relanzar»</tspan></text><rect x="830" y="114" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0</tspan></text><rect x="10" y="172" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Variable local sin uso</tspan></text><rect x="320" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">37</tspan></text><rect x="450" y="172" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">37</tspan></text><rect x="560" y="172" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">53 → 26 al ignorar el prefijo «_»</tspan></text><rect x="830" y="172" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0</tspan></text><rect x="10" y="230" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Recorrido que omite el primer elemento</tspan></text><rect x="320" y="230" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">70</tspan></text><rect x="450" y="230" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0</tspan></text><rect x="560" y="230" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">0</tspan></text><rect x="830" y="230" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">70</tspan></text><rect x="10" y="292" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Encontrar el 100 % de lo que busca no es calidad: la regla afinada deja 18 + 26 falsas alarmas y su precisión es del 71 %</tspan></text><text x="475" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">para argumentos mutables y del 59 % para variables sin uso. Afinar la excepción con los mismos casos que evalúan la regla es</tspan></text><text x="475" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">un sesgo declarado. El defecto lógico (70) queda fuera de cualquier regla sintáctica.</tspan></text><text x="475" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
