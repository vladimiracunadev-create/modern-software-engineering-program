<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 531" width="960" height="531" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro pruebas sobre el mismo sistema sintético (4 servidores, 50 ms de servicio medio, capacidad nominal de 80 req/s)</title><desc id="d">Tabla: la prueba de carga a 60 solicitudes por segundo no muestra límite; la rampa de estrés encuentra el codo entre 68 y 86 solicitudes por segundo y un colapso completo si el servidor sigue trabajando para clientes que ya se fueron; un pico de 20 segundos deja 165 segundos de recuperación; y una fuga de una conexión cada 5 000 solicitudes solo aparece a los 67 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="531" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Prueba</tspan></text><rect x="310" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Qué se observa</tspan></text><rect x="670" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Qué enseña o qué no ve</tspan></text><rect x="10" y="56" width="294" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="93.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Carga: 60 req/s durante 5 min (75 % de</tspan></text><text x="157" y="109.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">utilización)</tspan></text><rect x="310" y="56" width="354" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="93.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">n = 17 829; p50 57, p95 202, p99 285 ms; sin</tspan></text><text x="487" y="109.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">fallos</tspan></text><rect x="670" y="56" width="274" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="101.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">No dice dónde está el límite</tspan></text><rect x="10" y="146" width="294" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Estrés: rampa de 20 a 160 req/s en 8 min</tspan></text><rect x="310" y="146" width="354" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="183.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">p95 288 ms a 68/s; 357 ms a 77/s; 1 718 ms y 32,7</tspan></text><text x="487" y="199.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">% de fallos a 86/s; después, 100 %</tspan></text><rect x="670" y="146" width="274" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="176" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Sin descartar trabajo vencido, 0</tspan></text><text x="807" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">respuestas útiles por segundo (con</tspan></text><text x="807" y="206.72" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">descarte, 80,8)</tspan></text><rect x="10" y="236" width="294" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="273.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Pico: 240 req/s durante 20 s sobre 60</tspan></text><text x="157" y="289.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">base</tspan></text><rect x="310" y="236" width="354" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="273.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Latencia máxima 41,4 s; 165 s para volver a p95 &lt;</tspan></text><text x="487" y="289.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">200 ms</tspan></text><rect x="670" y="236" width="274" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Un pico de 20 s deja 165 s de daño</tspan></text><rect x="10" y="326" width="294" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="363.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Resistencia: 60 req/s, fuga de 1</tspan></text><text x="157" y="379.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">conexión cada 5 000</tspan></text><rect x="310" y="326" width="354" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="363.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">En 5 min se pierden 3 de 50 conexiones; el pool</tspan></text><text x="487" y="379.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">se agota a los 67 min</tspan></text><rect x="670" y="326" width="274" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">La prueba de 5 min no lo ve</tspan></text><rect x="10" y="420" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="444.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cada forma de carga responde a una pregunta distinta y ninguna sustituye a otra. El colapso de la rampa no es un defecto del</tspan></text><text x="480" y="461.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">algoritmo de cola: el servidor sigue atendiendo solicitudes cuyo cliente ya se rindió a los 2 s, así que cada respuesta llega</tspan></text><text x="480" y="478.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">tarde.</tspan></text><text x="480" y="517.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
