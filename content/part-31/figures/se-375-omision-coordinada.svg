<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una pausa de 10 s del servidor a 40 req/s medida con tres generadores de carga</title><desc id="d">Intervalos en escala logarítmica con la mediana, el percentil 99 y el percentil 99,9 de cada generador: el abierto tiene mediana de 45 milisegundos y percentil 99 de 9 071; el cerrado de 8 usuarios, 35 y solo 232; el cerrado con corrección de omisión coordinada, 38 y 8 600; el percentil 99,9 queda cerca de 10 000 en los tres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="480" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una pausa de 10 s del servidor a 40 req/s medida con tres generadores de carga</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p50</tspan></text><polygon points="92.62,44.1 99.22,56.4 86.02,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="106.62" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="106.62" dy="0">p99</tspan></text><polygon points="163.24,43.5 170.74,51 163.24,58.5 155.74,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="177.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="177.24" dy="0">p99,9</tspan></text><line x1="294" y1="77" x2="294" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="299" x2="294" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">10</tspan></text><line x1="492.667" y1="77" x2="492.667" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="492.667" y1="299" x2="492.667" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="492.667" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492.667" dy="0">100</tspan></text><line x1="691.333" y1="77" x2="691.333" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="691.333" y1="299" x2="691.333" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="691.333" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691.333" dy="0">1 000</tspan></text><line x1="890" y1="77" x2="890" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="299" x2="890" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">10 000</tspan></text><line x1="294" y1="299" x2="890" y2="299" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="110" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Abierto: llegadas programadas,</tspan></text><text x="264" y="127" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">latencia desde la hora prevista</tspan></text><text x="264" y="184" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Cerrado: 8 usuarios virtuales que</tspan></text><text x="264" y="201" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">esperan la respuesta</tspan></text><text x="264" y="258" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Cerrado con corrección de la</tspan></text><text x="264" y="275" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">omisión</tspan></text><line x1="423.772" y1="114" x2="888.678" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="416.772" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="423.772" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.772" dy="0">45</tspan></text><polygon points="881.587,105.95 889.287,120.3 873.887,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="881.587" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="881.587" dy="0">9 071</tspan></text><polygon points="888.678,105.25 897.428,114 888.678,122.75 879.928,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="888.678" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="888.678" dy="0">9 848</tspan></text><line x1="402.088" y1="188" x2="889.272" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="395.088" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="402.088" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="402.088" dy="0">35</tspan></text><polygon points="565.277,179.95 572.977,194.3 557.577,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="565.277" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="565.277" dy="0">232</tspan></text><polygon points="889.272,179.25 898.022,188 889.272,196.75 880.522,188" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="889.272" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="889.272" dy="0">9 916</tspan></text><line x1="409.184" y1="262" x2="889.272" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="402.184" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="409.184" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="409.184" dy="0">38</tspan></text><polygon points="876.987,253.95 884.687,268.3 869.287,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="876.987" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="876.987" dy="0">8 600</tspan></text><polygon points="889.272,253.25 898.022,262 889.272,270.75 880.522,262" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="889.272" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="889.272" dy="0">9 916</tspan></text><text x="592" y="343" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592" dy="0">Milisegundos (ms) (escala logarítmica)</tspan></text><rect x="10" y="357" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El generador cerrado dejó de enviar mientras el servidor estaba parado, de modo que casi nadie llegó a esperar: el p99 pasa</tspan></text><text x="470" y="398.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de 9 071 a 232 ms sin que el sistema haya cambiado. Solo 8 muestras de 5 438 cayeron en la pausa (7 117 muestras en el</tspan></text><text x="470" y="415.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">abierto; 10,51 % por encima de 1 s frente a 0,15 %). La corrección recupera una parte porque asume un intervalo esperado.</tspan></text><text x="470" y="462.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
