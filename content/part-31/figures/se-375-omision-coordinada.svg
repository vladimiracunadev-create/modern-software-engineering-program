<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 381" width="890" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una pausa de 10 s del servidor a 40 req/s medida con tres generadores de carga</title><desc id="d">Tabla: con una pausa de 10 segundos, el generador de lazo abierto registra 7 117 muestras y un percentil 99 de 9 071 milisegundos; el de lazo cerrado con 8 usuarios registra 5 438 muestras y un percentil 99 de solo 232 milisegundos; la corrección de omisión coordinada lo acerca a 8 600.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="381" fill="#ffffff"/><rect x="10" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177" dy="0">Generador</tspan></text><rect x="350" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Muestras</tspan></text><rect x="450" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">p50</tspan></text><rect x="540" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">p99</tspan></text><rect x="660" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">p99,9</tspan></text><rect x="780" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">&gt; 1 s</tspan></text><rect x="10" y="56" width="334" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="83.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Abierto: llegadas programadas, latencia desde</tspan></text><text x="177" y="99.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">la hora prevista</tspan></text><rect x="350" y="56" width="94" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">7 117</tspan></text><rect x="450" y="56" width="84" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">45 ms</tspan></text><rect x="540" y="56" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">9 071 ms</tspan></text><rect x="660" y="56" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">9 848 ms</tspan></text><rect x="780" y="56" width="94" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">10,51 %</tspan></text><rect x="10" y="126" width="334" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="153.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Cerrado: 8 usuarios virtuales que esperan la</tspan></text><text x="177" y="169.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">respuesta</tspan></text><rect x="350" y="126" width="94" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">5 438</tspan></text><rect x="450" y="126" width="84" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">35 ms</tspan></text><rect x="540" y="126" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">232 ms</tspan></text><rect x="660" y="126" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">9 916 ms</tspan></text><rect x="780" y="126" width="94" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0,15 %</tspan></text><rect x="10" y="196" width="334" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Cerrado con corrección de la omisión</tspan></text><rect x="350" y="196" width="94" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">5 827</tspan></text><rect x="450" y="196" width="84" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">38 ms</tspan></text><rect x="540" y="196" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">8 600 ms</tspan></text><rect x="660" y="196" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">9 916 ms</tspan></text><rect x="780" y="196" width="94" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">6,23 %</tspan></text><rect x="10" y="270" width="870" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="445" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">El generador cerrado dejó de enviar mientras el servidor estaba parado, de modo que casi nadie llegó a esperar: el</tspan></text><text x="445" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">p99 pasa de 9 071 a 232 ms sin que el sistema haya cambiado. Solo 8 muestras de 5 438 cayeron en la pausa. La</tspan></text><text x="445" y="328.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">corrección recupera una parte porque asume un intervalo esperado.</tspan></text><text x="445" y="367.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
