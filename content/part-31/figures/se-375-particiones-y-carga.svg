<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Particiones, consumidores y una clave popular (20 000 eventos, 800 estudiantes, popularidad Zipf)</title><desc id="d">Barras agrupadas con los eventos del consumidor más cargado: con cuatro consumidores recibe 7 129 de 20 000 con 4, 8 o 16 particiones; con ocho consumidores recibe 7 129 con cuatro particiones y 5 174 con ocho o dieciséis; la clave más popular suma 3 643 eventos y vive en una sola partición, y con cuatro particiones y ocho consumidores cuatro consumidores quedan sin trabajo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Particiones, consumidores y una clave popular (20 000 eventos, 800 estudiantes, popularidad Zipf)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">4 particiones</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">8 particiones</tspan></text><rect x="308.04" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="328.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.04" dy="0">16 particiones</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="305" x2="93.7" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="235" x2="93.7" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">4 000</tspan></text><line x1="93.7" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="165" x2="93.7" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">6 000</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">8 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Eventos del consumidor más cargado (de 20 000)</text><rect x="135.015" y="125.485" width="107.507" height="249.515" rx="3" fill="#c0432f"/><text x="188.768" y="119.485" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="188.768" dy="0">7 129</tspan></text><rect x="246.522" y="125.485" width="107.507" height="249.515" rx="3" fill="#946512"/><text x="300.275" y="119.485" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="300.275" dy="0">7 129</tspan></text><rect x="358.028" y="125.485" width="107.507" height="249.515" rx="3" fill="#087f8c"/><text x="411.782" y="119.485" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.782" dy="0">7 129</tspan></text><text x="300.275" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300.275" dy="0">4 consumidores</tspan></text><rect x="548.165" y="125.485" width="107.507" height="249.515" rx="3" fill="#c0432f"/><text x="601.918" y="119.485" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.918" dy="0">7 129</tspan></text><rect x="659.672" y="193.91" width="107.507" height="181.09" rx="3" fill="#946512"/><text x="713.425" y="187.91" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="713.425" dy="0">5 174</tspan></text><rect x="771.178" y="193.91" width="107.507" height="181.09" rx="3" fill="#087f8c"/><text x="824.932" y="187.91" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="824.932" dy="0">5 174</tspan></text><text x="713.425" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="713.425" dy="0">8 consumidores</tspan></text><rect x="10" y="427" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con cuatro particiones y ocho consumidores cuatro consumidores quedan sin trabajo, y con ocho el máximo solo baja de 7 129</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">a 5 174 porque los 3 643 eventos de la clave más popular siguen en una sola partición. Con clave, todos los eventos de un</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">estudiante van a una partición y se procesan en orden (0 de 669 estudiantes fuera de orden); con reparto circular 106 de</tspan></text><text x="470" y="501.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">669 quedaron fuera de orden. Exponente de popularidad 1,1: supuesto del autor.</tspan></text><text x="470" y="549.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
