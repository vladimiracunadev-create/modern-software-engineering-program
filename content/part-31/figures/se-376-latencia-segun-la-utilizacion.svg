<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 471" width="960" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una cola M/M/1 de 50 ms de servicio medio: latencia simulada frente a teoría según la utilización</title><desc id="d">Tabla: con un servicio medio de 50 milisegundos, la latencia media pasa de 99 milisegundos al 50 por ciento de utilización a 481 al 90 y a más de 6 000 al 99; el percentil 99 simulado coincide con la fórmula entre el 50 y el 80 por ciento y se separa por debajo de la teoría al 90 y 95 por ciento y por encima al 99.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="471" fill="#ffffff"/><rect x="10" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="97" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="97" dy="0">Utilización</tspan></text><rect x="190" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Media simulada / teoría</tspan></text><rect x="470" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">p95 simulado</tspan></text><rect x="670" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">p99 simulado / teoría</tspan></text><rect x="10" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">50 %</tspan></text><rect x="190" y="56" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">99 / 100 ms</tspan></text><rect x="470" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">297 ms</tspan></text><rect x="670" y="56" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">454 / 461 ms</tspan></text><rect x="10" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">70 %</tspan></text><rect x="190" y="106" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">165 / 167 ms</tspan></text><rect x="470" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">496 ms</tspan></text><rect x="670" y="106" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">754 / 768 ms</tspan></text><rect x="10" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">80 %</tspan></text><rect x="190" y="156" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">246 / 250 ms</tspan></text><rect x="470" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">733 ms</tspan></text><rect x="670" y="156" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">1 132 / 1 151 ms</tspan></text><rect x="10" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">90 %</tspan></text><rect x="190" y="206" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">481 / 500 ms</tspan></text><rect x="470" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">1 436 ms</tspan></text><rect x="670" y="206" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">2 098 / 2 303 ms</tspan></text><rect x="10" y="256" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">95 %</tspan></text><rect x="190" y="256" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">973 / 1 000 ms</tspan></text><rect x="470" y="256" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">2 901 ms</tspan></text><rect x="670" y="256" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">4 165 / 4 605 ms</tspan></text><rect x="10" y="306" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">99 %</tspan></text><rect x="190" y="306" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">6 115 / 5 000 ms</tspan></text><rect x="470" y="306" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">17 175 ms</tspan></text><rect x="670" y="306" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">24 286 / 23 026 ms</tspan></text><rect x="10" y="360" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El crecimiento no es lineal: del 90 al 99 % la media se multiplica por 12. La simulación de 400 000 llegadas se aparta de la</tspan></text><text x="480" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">teoría cerca del 100 % porque el régimen estable tarda mucho en alcanzarse; 400 000 llegadas no bastan al 99 %. Con llegadas</tspan></text><text x="480" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">de Poisson y servicio exponencial; un sistema real no cumple ninguna de las dos.</tspan></text><text x="480" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
