<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres semánticas con 2 % de mensajes perdidos, 5 % de acuses perdidos y 2 % de caídas (20 000 mensajes)</title><desc id="d">Barras agrupadas con los mensajes perdidos y los efectos duplicados de cada semántica: a lo sumo una vez pierde 743 y no duplica; al menos una vez no pierde y duplica 1 476; al menos una vez con consumidor idempotente deja 0 y 0 y exactamente 20 000 efectos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres semánticas con 2 % de mensajes perdidos, 5 % de acuses perdidos y 2 % de caídas (20 000 mensajes)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mensajes perdidos</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Efectos duplicados</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="281.667" x2="93.7" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="188.333" x2="93.7" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 500</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">De 20 000 mensajes</text><rect x="121.243" y="236.307" width="108.173" height="138.693" rx="3" fill="#c0432f"/><text x="175.33" y="230.307" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.33" dy="0">743</tspan></text><rect x="233.417" y="373" width="108.173" height="2" rx="3" fill="#946512"/><text x="287.503" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287.503" dy="0">0</tspan></text><text x="231.417" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">A lo sumo una vez</tspan></text><rect x="396.677" y="373" width="108.173" height="2" rx="3" fill="#c0432f"/><text x="450.763" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.763" dy="0">0</tspan></text><rect x="508.85" y="99.48" width="108.173" height="275.52" rx="3" fill="#946512"/><text x="562.937" y="93.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.937" dy="0">1 476</tspan></text><text x="506.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Al menos una vez</tspan></text><rect x="672.11" y="373" width="108.173" height="2" rx="3" fill="#c0432f"/><text x="726.197" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.197" dy="0">0</tspan></text><rect x="784.283" y="373" width="108.173" height="2" rx="3" fill="#946512"/><text x="838.37" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.37" dy="0">0</tspan></text><text x="782.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Al menos una vez + consumidor</tspan></text><text x="782.283" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">idempotente</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">No existe una entrega exactamente una vez entre procesos que fallan: se elige perder o duplicar, y el efecto exactamente</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una vez se obtiene al hacer idempotente al consumidor (efectos totales: 19 257, 21 476 y 20 000). La tabla de vistos real</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es SQLite; la red, los acuses y las caídas son un modelo del autor.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
