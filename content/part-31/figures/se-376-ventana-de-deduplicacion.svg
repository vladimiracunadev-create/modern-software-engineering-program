<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ventana de deduplicación: duplicados que pasan de 86 590 reentregas en un día (5 mensajes por segundo)</title><desc id="d">Línea con los duplicados que pasan según los identificadores que guarda cada ventana, en escala logarítmica horizontal: 10 segundos guarda 50 y deja pasar 73 414; 60 segundos, 300 y 32 388; 5 minutos, 1 500 y 1 521; una hora, 18 000 y 921 por una cola larga; 24 horas, 432 000 y ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ventana de deduplicación: duplicados que pasan de 86 590 reentregas en un día (5 mensajes por segundo)</tspan></text><line x1="101.24" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="359" x2="101.24" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="284" x2="910" y2="284" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="284" x2="101.24" y2="284" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="288.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">20 000</tspan></text><line x1="101.24" y1="209" x2="910" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="209" x2="101.24" y2="209" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="213.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">40 000</tspan></text><line x1="101.24" y1="134" x2="910" y2="134" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="134" x2="101.24" y2="134" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">60 000</tspan></text><line x1="101.24" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="59" x2="101.24" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">80 000</tspan></text><line x1="101.24" y1="59" x2="101.24" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="59" x2="119.24" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="359" x2="119.24" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">10</tspan></text><line x1="273.792" y1="59" x2="273.792" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="273.792" y1="359" x2="273.792" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="273.792" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="273.792" dy="0">100</tspan></text><line x1="428.344" y1="59" x2="428.344" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="428.344" y1="359" x2="428.344" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="428.344" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="428.344" dy="0">1 000</tspan></text><line x1="582.896" y1="59" x2="582.896" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="582.896" y1="359" x2="582.896" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="582.896" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582.896" dy="0">10 000</tspan></text><line x1="737.448" y1="59" x2="737.448" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="737.448" y1="359" x2="737.448" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="737.448" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737.448" dy="0">100 000</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1 000 000</tspan></text><line x1="101.24" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Duplicados que pasan (de 86 590)</text><text x="505.62" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Identificadores guardados (escala logarítmica)</tspan></text><polyline points="227.267,83.6975 347.532,237.545 455.559,353.296 622.349,355.546 835.663,359" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="227.267" cy="83.6975" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="237.267" y="88.1975" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="237.267" dy="0">10 s</tspan></text><circle cx="347.532" cy="237.545" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="357.532" y="242.045" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="357.532" dy="0">60 s</tspan></text><circle cx="455.559" cy="353.296" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="455.559" y="342.296" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="455.559" dy="0">5 min</tspan></text><circle cx="622.349" cy="355.546" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="622.349" y="344.546" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="622.349" dy="0">1 h</tspan></text><circle cx="835.663" cy="359" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="835.663" y="348" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="835.663" dy="0">24 h</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El tamaño de la ventana es una apuesta sobre cuánto tarda en volver una reentrega: cada punto compra menos duplicados con</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">más memoria. Las reentregas siguen una distribución con cola larga (1 % entre 1 y 6 horas), por eso una ventana que cubre</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">casi todo deja pasar cientos de duplicados. Retardos exponenciales con cola: supuesto del autor.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
