<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 387" width="940" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comparar dos copias idénticas: falsas diferencias de más del 3 % / detección de una regresión real del 5 %</title><desc id="d">Tabla: al comparar dos copias idénticas con ruido y un 8 por ciento de interferencias, la media declara una diferencia de más del 3 por ciento en el 58 al 60 por ciento de los casos con 3 a 10 repeticiones; la mediana baja del 48,6 al 2,8 por ciento al pasar de 3 a 30 repeticiones y detecta el 92 por ciento de una regresión real del 5 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="387" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Repeticiones por versión</tspan></text><rect x="270" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="377" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="377" dy="0">Media</tspan></text><rect x="490" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Mediana</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Mínimo</tspan></text><rect x="10" y="56" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">3</tspan></text><rect x="270" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">58,8 % / 64 %</tspan></text><rect x="490" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">48,6 % / 67 %</tspan></text><rect x="710" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">48,9 % / 66 %</tspan></text><rect x="10" y="110" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">5</tspan></text><rect x="270" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">60,4 % / 64 %</tspan></text><rect x="490" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">37,7 % / 72 %</tspan></text><rect x="710" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">43,7 % / 69 %</tspan></text><rect x="10" y="164" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">10</tspan></text><rect x="270" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">58,0 % / 64 %</tspan></text><rect x="490" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">18,6 % / 79 %</tspan></text><rect x="710" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">36,0 % / 71 %</tspan></text><rect x="10" y="218" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">30</tspan></text><rect x="270" y="218" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">39,5 % / 72 %</tspan></text><rect x="490" y="218" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">2,8 % / 92 %</tspan></text><rect x="710" y="218" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">27,5 % / 77 %</tspan></text><rect x="10" y="276" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con 5 repeticiones y la media, dos programas idénticos «difieren» el 60 % de las veces. La mediana es robusta a las</tspan></text><text x="470" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">interferencias, el mínimo reduce el ruido pero también la señal. El ruido (lognormal de 4 %, 8 % de interferencias de +15 a</tspan></text><text x="470" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">+80 %) es un supuesto del autor.</tspan></text><text x="470" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
