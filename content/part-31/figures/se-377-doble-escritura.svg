<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 436" width="940" height="436" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escribir en la base y publicar un evento con 3 % de caídas entre los dos pasos (1 000 entregas)</title><desc id="d">Diagrama de tres estrategias con una caída entre sus dos pasos: confirmar la base y luego publicar deja 1 000 filas y 966 eventos, 34 entregas sin evento; publicar y luego confirmar deja 966 filas y 1 000 eventos, 34 eventos de entregas que no existen; escribir la fila y su evento en la misma transacción del outbox deja 966 y 966, sin ninguna diferencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="436" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Escribir en la base y publicar un evento con 3 % de caídas entre los dos pasos (1 000 entregas)</tspan></text><rect x="10" y="46" width="920" height="116" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="68" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Confirmar la base y luego publicar</tspan></text><rect x="26" y="82" width="190" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="121" y="113.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="121" dy="0">1. Confirmar la base</tspan></text><polyline points="216,110 276,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="288" cy="110" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="288" y="115" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="288" dy="0">!</tspan></text><polyline points="300,110 360,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="360" y="82" width="200" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="460" y="113.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="460" dy="0">2. Publicar el evento</tspan></text><polyline points="560,110 606,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="606" y="78" width="310" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="761" y="105.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="761" dy="0">1 000 filas, 966 eventos</tspan></text><text x="761" y="121.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="761" dy="0">34 entregas sin evento</tspan></text><rect x="10" y="174" width="920" height="116" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="196" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Publicar y luego confirmar la base</tspan></text><rect x="26" y="210" width="190" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="121" y="241.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="121" dy="0">1. Publicar el evento</tspan></text><polyline points="216,238 276,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="288" cy="238" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="288" y="243" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="288" dy="0">!</tspan></text><polyline points="300,238 360,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="360" y="210" width="200" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="460" y="241.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="460" dy="0">2. Confirmar la base</tspan></text><polyline points="560,238 606,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="606" y="206" width="310" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="761" y="233.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="761" dy="0">966 filas, 1 000 eventos</tspan></text><text x="761" y="249.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="761" dy="0">34 eventos de entregas que no existen</tspan></text><rect x="10" y="302" width="920" height="116" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="324" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Outbox: fila y evento en una transacción</tspan></text><rect x="26" y="338" width="190" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="121" y="360.96" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="121" dy="0">1. Fila y evento</tspan></text><text x="121" y="378.88" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="121" dy="0">juntos</tspan></text><polyline points="216,366 276,366" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="288" cy="366" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="288" y="371" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="288" dy="0">!</tspan></text><polyline points="300,366 360,366" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url