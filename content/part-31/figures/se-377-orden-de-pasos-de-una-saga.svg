<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Saga de inscripción con 8 % de fallo por paso y compensación en tres intentos (10 000 sagas)</title><desc id="d">Barras apiladas horizontales con el destino de 10 000 sagas según el orden de los pasos: con el paso irreversible de enviar la bienvenida al final terminan 7 136, se revierten limpiamente 2 860, ninguna deja residuo y 4 quedan atascadas; con la bienvenida antes de dar acceso terminan 7 144, se revierten limpiamente 2 249, 603 dejan un correo irreversible y 4 quedan atascadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Saga de inscripción con 8 % de fallo por paso y compensación en tres intentos (10 000 sagas)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Completas</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Revertidas limpias</tspan></text><rect x="315.58" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="335.58" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="335.58" dy="0">Residuo irreversible</tspan></text><rect x="514.38" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="534.38" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="534.38" dy="0">Atascadas</tspan></text><line x1="324" y1="77" x2="324" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="165" x2="324" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="77" x2="434.34" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="165" x2="434.34" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="434.34" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.34" dy="0">2 000</tspan></text><line x1="544.68" y1="77" x2="544.68" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="544.68" y1="165" x2="544.68" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="544.68" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.68" dy="0">4 000</tspan></text><line x1="655.02" y1="77" x2="655.02" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="655.02" y1="165" x2="655.02" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="655.02" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.02" dy="0">6 000</tspan></text><line x1="765.36" y1="77" x2="765.36" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="765.36" y1="165" x2="765.36" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="765.36" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.36" dy="0">8 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10 000</tspan></text><line x1="324" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Reservar, cobrar, dar acceso, enviar</tspan></text><text x="314" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">bienvenida</tspan></text><text x="314" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Reservar, cobrar, enviar bienvenida, dar</tspan></text><text x="314" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">acceso</tspan></text><rect x="324" y="84" width="393.693" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="520.847" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="520.847" dy="0">7 136</tspan></text><rect x="717.693" y="84" width="157.786" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="796.586" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="796.586" dy="0">2 860</tspan></text><rect x="875.479" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="875.479" y="84" width="0.22068" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">10 000</tspan></text><rect x="324" y="128" width="394.134" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="521.067" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="521.067" dy="0">7 144</tspan></text><rect x="718.134" y="128" width="124.077" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="780.173" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="780.173" dy="0">2 249</tspan></text><rect x="842.212" y="128" width="33.2675" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="858.846" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="858.846" dy="0">603</tspan></text><rect x="875.479" y="128" width="0.22068" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">10 000</tspan></text><text x="599.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Sagas de 10 000</tspan></text><rect x="10" y="223" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Poner los pasos que no se pueden compensar al final es una decisión de diseño, no un detalle: mueve 603 sagas del residuo</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">irreversible a la reversión limpia. Las atascadas (cuatro de 10 000) son las que fallan tres veces al compensar y necesitan</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">a una persona. Probabilidades fijas del autor.</tspan></text><text x="470" y="328.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
