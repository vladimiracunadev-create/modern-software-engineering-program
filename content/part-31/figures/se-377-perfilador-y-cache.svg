<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 543" width="940" height="543" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El perfilador cambia lo que mide y una caché puede estar midiéndose a sí misma</title><desc id="d">Tabla: perfilar con cProfile multiplica por 4,6 el tiempo de 300 000 llamadas mínimas en Windows y por 3,7 en Ubuntu, y atribuye a la función mínima el 34 por ciento del tiempo cuando midiendo con y sin la llamada es el 46; repetir la misma clave con caché reduce el tiempo de 69 milisegundos a 0,05, mil trescientas noventa y cinco veces menos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="543" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Medida</tspan></text><rect x="440" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Windows 11</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Ubuntu (WSL2)</tspan></text><rect x="10" y="56" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">300 000 llamadas a una función mínima, sin perfilador</tspan></text><rect x="440" y="56" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">43,7 ms</tspan></text><rect x="710" y="56" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">26,9 ms</tspan></text><rect x="10" y="118" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Las mismas con cProfile</tspan></text><rect x="440" y="118" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">199,9 ms (× 4,6)</tspan></text><rect x="710" y="118" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">98,7 ms (× 3,7)</tspan></text><rect x="10" y="180" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Parte del tiempo atribuida a la función mínima</tspan></text><rect x="440" y="180" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="203.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">34 % (cProfile) frente a 46 % (con y</tspan></text><text x="572" y="219.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">sin la llamada)</tspan></text><rect x="710" y="180" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">31 % frente a 39 %</tspan></text><rect x="10" y="242" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">300 llamadas a una función cara, sin caché</tspan></text><rect x="440" y="242" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">69,49 ms</tspan></text><rect x="710" y="242" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">68,64 ms</tspan></text><rect x="10" y="304" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="335.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Con caché y la misma clave</tspan></text><rect x="440" y="304" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0,050 ms (1 395 × menos)</tspan></text><rect x="710" y="304" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0,026 ms (2 599 × menos)</tspan></text><rect x="10" y="366" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="397.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Con caché y claves distintas</tspan></text><rect x="440" y="366" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="397.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">68,80 ms</tspan></text><rect x="710" y="366" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="397.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">50,93 ms</tspan></text><rect x="10" y="432" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="456.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un perfil determinista cuenta llamadas con precisión y altera el reparto del tiempo; sirve para ver qué se llama, no para</tspan></text><text x="470" y="473.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">decir cuánto cuesta. El benchmark con caché de una sola clave mide una búsqueda en diccionario, no el trabajo: 1 395 veces</tspan></text><text x="470" y="490.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">menos con la misma clave y casi igual con claves distintas.</tspan></text><text x="470" y="529.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); los tiempos de reloj cambian de equipo en equipo.</tspan></text></svg>
