<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 403" width="960" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres capas encadenadas con hasta tres intentos cada una: intentos que llegan a la base de datos / solicitudes que terminan bien</title><desc id="d">Tabla: con la base de datos caída, tres capas con tres intentos cada una envían 27 intentos a la base por cada solicitud del usuario, frente a 3 si solo reintenta el borde y 1,37 con un presupuesto del 10 por ciento; con un 50 por ciento de fallos independientes, reintentar en las tres capas lleva el éxito al 100 por ciento con 2,01 intentos por solicitud y el presupuesto lo deja en 69 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="403" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Fallo de la base de datos</tspan></text><rect x="220" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="302" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="302" dy="0">Sin reintentos</tspan></text><rect x="390" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Solo el borde</tspan></text><rect x="560" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Las tres capas</tspan></text><rect x="750" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Presupuesto del 10 %</tspan></text><rect x="10" y="56" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">100 % (caído)</tspan></text><rect x="220" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">1,00 / 0 %</tspan></text><rect x="390" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">3,00 / 0 %</tspan></text><rect x="560" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">27,00 / 0 %</tspan></text><rect x="750" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1,37 / 0 %</tspan></text><rect x="10" y="114" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">50 %</tspan></text><rect x="220" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">1,00 / 49 %</tspan></text><rect x="390" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">1,75 / 88 %</tspan></text><rect x="560" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">2,01 / 100 %</tspan></text><rect x="750" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1,37 / 69 %</tspan></text><rect x="10" y="172" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">10 %</tspan></text><rect x="220" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">1,00 / 90 %</tspan></text><rect x="390" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">1,11 / 100 %</tspan></text><rect x="560" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">1,11 / 100 %</tspan></text><rect x="750" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1,11 / 100 %</tspan></text><rect x="10" y="230" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">0 %</tspan></text><rect x="220" y="230" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">1,00 / 100 %</tspan></text><rect x="390" y="230" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">1,00 / 100 %</tspan></text><rect x="560" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">1,00 / 100 %</tspan></text><rect x="750" y="230" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1,00 / 100 %</tspan></text><rect x="10" y="292" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Los reintentos son un buen remedio para fallos independientes y transitorios (10 %: de 90 % a 100 % con 1,11 intentos) y una</tspan></text><text x="480" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">trampa cuando la base está caída: la amplificación es 3 × 3 × 3. El presupuesto limita el daño y paga con éxito (69 % en lugar</tspan></text><text x="480" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">de 100 % al 50 % de fallo).</tspan></text><text x="480" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
