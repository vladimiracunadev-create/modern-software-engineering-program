<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Copia completa frente a incremental: filas leídas por ciclo sobre 100 000 filas</title><desc id="d">Líneas en escala logarítmica con las filas leídas por ciclo según el porcentaje de filas que cambian: la copia completa lee siempre 100 000; la incremental lee 100, 1 000, 10 000 y 50 000 con 0,1, 1, 10 y 50 por ciento de cambios, un ahorro de 99,9, 99, 90 y 50 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Copia completa frente a incremental: filas leídas por ciclo sobre 100 000 filas</tspan></text><circle cx="22" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Copia completa</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Incremental</tspan></text><line x1="108.78" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="387" x2="108.78" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100</tspan></text><line x1="108.78" y1="287" x2="910" y2="287" s