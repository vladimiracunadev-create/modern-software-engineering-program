e-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">50</tspan></text><line x1="108.78" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Filas leídas por ciclo (escala logarítmica)</text><text x="509.39" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="509.39" dy="0">Filas que cambian por ciclo (%) (escala logarítmica)</tspan></text><polyline points="126.78,87 410.303,87 693.826,87 892,87" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="126.78" cy="87" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="126.78" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="126.78" dy="0">100 000</tspan></text><circle cx="410.303" cy="87" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="410.303" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="410.303" dy="0">100 000</tspan></text><circle cx="693.826" cy="87" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="693.826" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="693.826" dy="0">100 000</tspan></text><circle cx="892" cy="87" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">100 000</tspan></text><polyline points="126.78,387 410.303,287 693.826,187 892,117.103" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="121.28" y="381.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="126.78" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="126.78" dy="0">100</tspan></text><rect x="404.803" y="281.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="410.303" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="410.303" dy="0">1 000</tspan></text><rect x="688.326" y="181.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="693.826" y="176" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="693.826" dy="0">10 000</tspan></text><rect x="886.5" y="111.603" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="106.103" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">50 000</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El incremental ahorra lectura (99,9, 99, 90 y 50 % menos filas leídas) y cobra escritura: 10 000 actualizaciones cuestan</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">210 006 pasos sin disparador y 560 001 con él en Windows (SQLite 3.45.3); en Ubuntu 220 006 y 570 001 (2,7 veces). Cuenta</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de filas y pasos de la máquina virtual, no tiempo de reloj.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
