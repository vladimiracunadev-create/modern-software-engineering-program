<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 483" width="960" height="483" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Timeout por intento y un reintento: 97 % de peticiones de ~80 ms, 3 % lentas y 0,2 % que no responden</title><desc id="d">Tabla: con un timeout de 100 milisegundos solo el 68,9 por ciento de los primeros intentos tiene éxito y el servidor hace 3,96 veces más trabajo inútil que útil; con 200 milisegundos el éxito con un reintento es 99,83 por ciento y la latencia media 94 milisegundos; con 10 segundos el éxito es total pero el percentil 99 llega a 3 976 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="483" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Timeout</tspan></text><rect x="160" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="252" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="252" dy="0">Éxito con 1 intento</tspan></text><rect x="350" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Éxito con reintento</tspan></text><rect x="540" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Latencia media / p99</tspan></text><rect x="750" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Trabajo tras el</tspan></text><text x="847" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">abandono / útil</tspan></text><rect x="10" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">100 ms</tspan></text><rect x="160" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">68,9 %</tspan></text><rect x="350" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">90,36 %</tspan></text><rect x="540" y="56" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">103 ms / 200 ms</tspan></text><rect x="750" y="56" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">3,96</tspan></text><rect x="10" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">200 ms</tspan></text><rect x="160" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">95,9 %</tspan></text><rect x="350" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">99,83 %</tspan></text><rect x="540" y="108" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">94 ms / 310 ms</tspan></text><rect x="750" y="108" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1,88</tspan></text><rect x="10" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">500 ms</tspan></text><rect x="160" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">97,2 %</tspan></text><rect x="350" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">99,93 %</tspan></text><rect x="540" y="160" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">102 ms / 594 ms</tspan></text><rect x="750" y="160" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1,77</tspan></text><rect x="10" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">1 s</tspan></text><rect x="160" y="212" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">97,6 %</tspan></text><rect x="350" y="212" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">99,95 %</tspan></text><rect x="540" y="212" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">114 ms / 1 088 ms</tspan></text><rect x="750" y="212" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1,67</tspan></text><rect x="10" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">3 s</tspan></text><rect x="160" y="264" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">98,7 %</tspan></text><rect x="350" y="264" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">99,98 %</tspan></text><rect x="540" y="264" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">149 ms / 3 060 ms</tspan></text><rect x="750" y="264" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1,17</tspan></text><rect x="10" y="316" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="342.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">10 s</tspan></text><rect x="160" y="316" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">99,7 %</tspan></text><rect x="350" y="316" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">100,00 %</tspan></text><rect x="540" y="316" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">192 ms / 3 976 ms</tspan></text><rect x="750" y="316" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0,46</tspan></text><rect x="10" y="372" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">No existe un timeout correcto en abstracto: uno demasiado corto crea carga (3,96) y uno demasiado largo retiene recursos y</tspan></text><text x="480" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">alarga la cola (p99 de 3 976 ms). El cociente baja con timeouts largos porque lo inútil se limita a 30 s en el modelo. Un</tspan></text><text x="480" y="430.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">plazo para varias llamadas en serie debe repartirse: tres de 1 s con un reintento suman hasta 6 s.</tspan></text><text x="480" y="469.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
