<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 403" width="960" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sobrecarga de 2 × (160 req/s sobre 80 de capacidad, 20 % críticas) durante 60 s: respuestas útiles dentro de 2 s</title><desc id="d">Tabla: sin control casi nada llega a tiempo, 3 por ciento de las críticas; una cola acotada a 50 reparte el daño y atiende el 53,9 por ciento de las críticas; priorizar las críticas las atiende todas, 100 por ciento, y las no críticas el 40,3; añadir una respuesta degradada de bajo costo atiende todas las solicitudes con 155,9 respuestas útiles por segundo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="403" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Política</tspan></text><rect x="310" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Críticas a tiempo</tspan></text><rect x="540" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="657" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">No críticas a tiempo</tspan></text><rect x="780" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Respuestas útiles</tspan></text><text x="862" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">por segundo</tspan></text><rect x="10" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Sin control</tspan></text><rect x="310" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">3,0 % (p99 1 989 ms)</tspan></text><rect x="540" y="56" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">3,7 %</tspan></text><rect x="780" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">5,6</tspan></text><rect x="10" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Cola acotada a 50</tspan></text><rect x="310" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">53,9 % (p99 930 ms)</tspan></text><rect x="540" y="114" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">52,3 %</tspan></text><rect x="780" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">82,0</tspan></text><rect x="10" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Prioridad a las críticas</tspan></text><rect x="310" y="172" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">100,0 % (p99 271 ms)</tspan></text><rect x="540" y="172" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">40,3 %</tspan></text><rect x="780" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">81,6</tspan></text><rect x="10" y="230" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Prioridad y respuesta degradada</tspan></text><rect x="310" y="230" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">100,0 % (p99 243 ms)</tspan></text><rect x="540" y="230" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">100,0 % (4 919 degradadas)</tspan></text><rect x="780" y="230" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">155,9</tspan></text><rect x="10" y="292" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">La degradación bajo control es una decisión de producto: qué es crítico y qué respuesta barata sigue siendo útil. El 155,9</tspan></text><text x="480" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">supone que la respuesta degradada cuesta 5 ms en lugar de 50 ms (supuesto del autor): si degradar costara lo mismo, no habría</tspan></text><text x="480" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">ganancia.</tspan></text><text x="480" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
