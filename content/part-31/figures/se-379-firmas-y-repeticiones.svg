<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 584" width="940" height="584" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete entregas de webhook frente a cuatro políticas de verificación</title><desc id="d">Mapa de calor de siete entregas frente a cuatro políticas: sin verificar se acepta todo; la firma HMAC del cuerpo rechaza las alteradas, las de otro secreto, las sin firma y las reserializadas pero acepta repeticiones; la marca de tiempo firmada con tolerancia de 300 segundos rechaza la repetición tardía; guardar los identificadores vistos rechaza también la repetición inmediata. Los huecos se van cerrando de izquierda a derecha.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="584" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Siete entregas de webhook frente a cuatro políticas de verificación</tspan></text><text x="608" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="608" dy="0">Política de verificación</tspan></text><text x="374" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374" dy="0">Sin verificar</tspan></text><text x="530" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530" dy="0">HMAC del cuerpo</tspan></text><text x="686" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="686" dy="0">HMAC con marca de</tspan></text><text x="686" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="686" dy="0">tiempo</tspan></text><text x="842" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">Más id ya visto</tspan></text><text x="286" y="137.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Entrega válida</tspan></text><text x="286" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Cuerpo alterado</tspan></text><text x="286" y="225.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Firmada con otro secreto</tspan></text><text x="286" y="269.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Sin firma</tspan></text><text x="286" y="313.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Repetición 10 min después</tspan></text><text x="286" y="357.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Repetición inmediata del mismo id</tspan></text><text x="286" y="401.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">JSON reserializado con espacios</tspan></text><rect x="297.5" y="112.5" width="153" height="41" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="374" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374" dy="0">Acepta</tspan></text><rect x="453.5" y="112.5" width="153" height="41" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="530" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530" dy="0">Acepta</tspan></text><rect x="609.5" y="112.5" width="153" height="41" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="686" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="686" dy="0">Acepta</tspan></text><rect x="765.5" y="112.5" width="153" height="41" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="842" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">Acepta</tspan></text><rect x="297.5" y="156.5" width="153" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="374" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="374" dy="0">Acepta (hueco)</tspan></text><rect x="453.5" y="156.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="530" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530" dy="0">Rechaza</tspan></text><rect x="609.5" y="156.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="686" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="686" dy="0">Rechaza</tspan></text><rect x="765.5" y="156.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="842" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">Rechaza</tspan></text><rect x="297.5" y="200.5" width="153" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="374" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="374" dy="0">Acepta (hueco)</tspan></text><rect x="453.5" y="200.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="530" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530" dy="0">Rechaza</tspan></text><rect x="609.5" y="200.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="686" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="686" dy="0">Rechaza</tspan></text><rect x="765.5" y="200.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#