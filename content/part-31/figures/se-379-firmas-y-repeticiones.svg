text x="842" y="313.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">Rechaza</tspan></text><rect x="297.5" y="332.5" width="153" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="374" y="357.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="374" dy="0">Acepta (hueco)</tspan></text><rect x="453.5" y="332.5" width="153" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="530" y="357.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="530" dy="0">Acepta (hueco)</tspan></text><rect x="609.5" y="332.5" width="153" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="686" y="357.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="686" dy="0">Acepta (hueco)</tspan></text><rect x="765.5" y="332.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="842" y="357.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">Rechaza</tspan></text><rect x="297.5" y="376.5" width="153" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="374" y="401.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="374" dy="0">Acepta (hueco)</tspan></text><rect x="453.5" y="376.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="530" y="401.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530" dy="0">Rechaza</tspan></text><rect x="609.5" y="376.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="686" y="401.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="686" dy="0">Rechaza</tspan></text><rect x="765.5" y="376.5" width="153" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="842" y="401.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">Rechaza</tspan></text><text x="20" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 265)">Entrega</text><text x="296" y="445" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="296" dy="0">Rechaza</tspan></text><rect x="356.78" y="433" width="30.5" height="14" fill="#fbe4de"/><rect x="386.78" y="433" width="30.5" height="14" fill="#f3cdc5"/><rect x="416.78" y="433" width="30.5" height="14" fill="#eab6ac"/><rect x="446.78" y="433" width="30.5" height="14" fill="#e29f93"/><rect x="476.78" y="433" width="30.5" height="14" fill="#d9887a"/><rect x="506.78" y="433" width="30.5" height="14" fill="#d17161"/><rect x="536.78" y="433" width="30.5" height="14" fill="#c85a48"/><rect x="566.78" y="433" width="30.5" height="14" fill="#c0432f"/><text x="604.78" y="445" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="604.78" dy="0">Acepta (hueco)</tspan></text><text x="718.34" y="445" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="718.34" dy="0">más oscuro = mayor (hueco)</tspan></text><rect x="10" y="461" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="485.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada capa cierra un ataque distinto: la firma, la manipulación; la marca de tiempo, la repetición tardía; el identificador,</tspan></text><text x="470" y="502.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la repetición inmediata. «Acepta (hueco)» es una entrega maliciosa o repetida que pasa. Se firman los bytes recibidos, no</tspan></text><text x="470" y="519.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el objeto: en un servidor real en el bucle local el cuerpo original dio 204 y el reserializado 401.</tspan></text><text x="470" y="566.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
