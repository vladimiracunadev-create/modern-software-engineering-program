<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 508" width="940" height="508" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una dependencia que se cuelga 60 s a 100 req/s: efecto de un interruptor de circuito según sus parámetros</title><desc id="d">Tabla: sin interruptor, 4 430 llamadas llegan a la dependencia caída, 1 637 solicitudes se rechazan por pool agotado y el percentil 99 del usuario es de 2 000 milisegundos; con un interruptor las llamadas bajan a unas 150, el percentil 99 a 50 milisegundos y la recuperación tras sanar tarda en promedio entre 2,2 y 11,6 segundos según cuánto tiempo permanezca abierto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="508" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Configuración</tspan></text><rect x="260" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="322" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322" dy="0">Llamadas a la</tspan></text><text x="322" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322" dy="0">dependencia</tspan></text><rect x="390" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Respuestas</tspan></text><text x="447" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">de respaldo</tspan></text><rect x="510" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Rechazadas por</tspan></text><text x="577" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">pool agotado</tspan></text><rect x="650" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">p99 del</tspan></text><text x="707" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">usuario</tspan></text><rect x="770" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Recuperación media</tspan></text><text x="847" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">/ máx</tspan></text><rect x="10" y="56" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Sin interruptor</tspan></text><rect x="260" y="56" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">4 430</tspan></text><rect x="390" y="56" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">0</tspan></text><rect x="510" y="56" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">1 637</tspan></text><rect x="650" y="56" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">2 000 ms</tspan></text><rect x="770" y="56" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">—</tspan></text><rect x="10" y="120" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">5 fallos seguidos, abierto 2 s</tspan></text><rect x="260" y="120" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">165</tspan></text><rect x="390" y="120" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">5 860</tspan></text><rect x="510" y="120" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">59</tspan></text><rect x="650" y="120" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">50 ms</tspan></text><rect x="770" y="120" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">2,2 s / 4,0 s</tspan></text><rect x="10" y="184" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">5 fallos seguidos, abierto 10 s</tspan></text><rect x="260" y="184" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">155</tspan></text><rect x="390" y="184" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">5 859</tspan></text><rect x="510" y="184" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">59</tspan></text><rect x="650" y="184" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">50 ms</tspan></text><rect x="770" y="184" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">6,5 s / 11,4 s</tspan></text><rect x="10" y="248" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="280.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">5 fallos seguidos, abierto 30 s</tspan></text><rect x="260" y="248" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">152</tspan></text><rect x="390" y="248" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">6 270</tspan></text><rect x="510" y="248" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">59</tspan></text><rect x="650" y="248" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">50 ms</tspan></text><rect x="770" y="248" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">11,6 s / 31,8 s</tspan></text><rect x="10" y="312" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="344.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">50 % de 20 llamadas, abierto 10 s</tspan></text><rect x="260" y="312" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">160</tspan></text><rect x="390" y="312" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">5 861</tspan></text><rect x="510" y="312" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">59</tspan></text><rect x="650" y="312" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">50 ms</tspan></text><rect x="770" y="312" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">6,6 s / 11,5 s</tspan></text><rect x="10" y="380" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Abrir cuesta 59 rechazos igualmente: detectar cinco fallos de 2 s lleva 2 s y en ese tiempo entran 200 solicitudes a un</tspan></text><text x="470" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pool de 150. Abierto más tiempo protege más y tarda más en volver. Con una dependencia con 40 % de fallos aleatorios (el 60</tspan></text><text x="470" y="438.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">% de las llamadas tendría éxito), el de 2 s se abre 133 veces y responde con respaldo el 65 % de las solicitudes; el de 10</tspan></text><text x="470" y="454.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">s, 31 veces y el 92 %.</tspan></text><text x="470" y="494.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
