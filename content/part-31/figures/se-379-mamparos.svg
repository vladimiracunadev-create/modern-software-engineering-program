<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 543" width="940" height="543" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos dependencias (A: 80 req/s de 50 ms; B: 20 req/s) y 20 trabajadores: solicitudes atendidas según el reparto</title><desc id="d">Barras agrupadas con el porcentaje de solicitudes atendidas de A y de B con B sana y con B lenta: con un pool compartido de 20, B lenta arrastra a A a 74,3 por ciento; con pools separados A queda en 100 por ciento y B atiende 23,1 por ciento con 15 y 5, 45,0 con 10 y 10 y 9,3 con 18 y 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="543" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos dependencias (A: 80 req/s de 50 ms; B: 20 req/s) y 20 trabajadores: solicitudes atendidas según el</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">reparto</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">A con B sana</tspan></text><rect x="154.48" y="64" width="12" height="12" rx="2" fill="#6b7c86"/><text x="174.48" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">B con B sana</tspan></text><rect x="292.96" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="312.96" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="312.96" dy="0">A con B lenta</tspan></text><rect x="438.98" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="458.98" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="458.98" dy="0">B con B lenta</tspan></text><line x1="78.62" y1="384" x2="920" y2="384" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="384" x2="78.62" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="388.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="316.5" x2="920" y2="316.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="316.5" x2="78.62" y2="316.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="321" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="249" x2="920" y2="249" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="249" x2="78.62" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="253.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="181.5" x2="920" y2="181.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="181.5" x2="78.62" y2="181.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="114" x2="78.62" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="114" x2="78.62" y2="384" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 249)">Solicitudes atendidas (%)</text><rect x="99.6545" y="114" width="3