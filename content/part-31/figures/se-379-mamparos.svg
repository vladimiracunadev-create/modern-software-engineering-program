="394.138" dy="0">A 15 y B 5</tspan></text><rect x="520.345" y="115.35" width="39.069" height="268.65" rx="3" fill="#087f8c"/><text x="539.879" y="109.35" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="539.879" dy="0">99,5</tspan></text><rect x="563.413" y="114" width="39.069" height="270" rx="3" fill="#6b7c86"/><text x="582.948" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="582.948" dy="0">100,0</tspan></text><rect x="606.483" y="115.08" width="39.069" height="268.92" rx="3" fill="#102a43"/><text x="626.017" y="109.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="626.017" dy="0">99,6</tspan></text><rect x="649.552" y="262.5" width="39.069" height="121.5" rx="3" fill="#c0432f"/><text x="669.086" y="256.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="669.086" dy="0">45,0</tspan></text><text x="604.482" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">A 10 y B 10</tspan></text><rect x="730.689" y="114" width="39.069" height="270" rx="3" fill="#087f8c"/><text x="750.224" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="750.224" dy="0">100,0</tspan></text><rect x="773.758" y="169.08" width="39.069" height="214.92" rx="3" fill="#6b7c86"/><text x="793.293" y="163.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="793.293" dy="0">79,6</tspan></text><rect x="816.827" y="114" width="39.069" height="270" rx="3" fill="#102a43"/><text x="836.362" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.362" dy="0">100,0</tspan></text><rect x="859.896" y="358.89" width="39.069" height="25.11" rx="3" fill="#c0432f"/><text x="879.431" y="352.89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="879.431" dy="0">9,3</tspan></text><text x="814.827" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">A 18 y B 2</tspan></text><rect x="10" y="436" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="460.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El mamparo no arregla B: lo confina. Cuesta capacidad ociosa (con B sana, 18 + 2 rechaza el 20 % de B) y exige dimensionar</tspan></text><text x="470" y="477.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cada compartimento. A 10 y B 10 protege a A y deja a B en 45 %, y no existe un reparto que dé lo mejor a ambos.</tspan></text><text x="470" y="525.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
