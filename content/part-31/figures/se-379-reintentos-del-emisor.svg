<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Receptor caído 2 horas: 1 440 eventos (uno cada 10 s durante 4 horas) y tres políticas del emisor</title><desc id="d">Barras horizontales con los eventos entregados, perdidos y repetidos de 1 440 según la política de reintentos del emisor: tres reintentos de un segundo entregan 720 y pierden 720; cinco exponenciales entregan 792 y pierden 648; nueve hasta seis horas con jitter entregan los 1 440 pero producen 71 entregas repetidas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="528" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Receptor caído 2 horas: 1 440 eventos (uno cada 10 s durante 4 horas) y tres políticas del emisor</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Entregados</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Perdidos</tspan></text><rect x="247.72" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="267.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="267.72" dy="0">Entregas repetidas</tspan></text><line x1="284" y1="77" x2="284" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="347" x2="284" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="431.925" y1="77" x2="431.925" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="431.925" y1="347" x2="431.925" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="431.925" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="431.925" dy="0">400</tspan></text><line x1="579.85" y1="77" x2="579.85" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="579.85" y1="347" x2="579.85" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="579.85" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="579.85" dy="0">800</tspan></text><line x1="727.775" y1="77" x2="727.775" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="727.775" y1="347" x2="727.775" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="727.775" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727.775" dy="0">1 200</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="347" x2="875.7" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 600</tspan></text><line x1="284" y1="347" x2="875.7" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">3 reintentos fijos de 1 s</tspan></text><text x="274" y="208" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">5 reintentos exponenciales (1, 5,</tspan></text><text x="274" y="225" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">30, 120, 600 s)</tspan></text><text x="274" y="306.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">9 reintentos hasta 6 h con jitter</tspan></text><rect x="284" y="83" width="266.265" height="24" rx="3" fill="#087f8c"/><text x="557.265" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="557.265" dy="0">720</tspan></text><rect x="284" y="110" width="266.265" height="24" rx="3" fill="#c0432f"/><text x="557.265" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="557.265" dy="0">720</tspan></text><rect x="284" y="137" width="12.5736" height="24" rx="3" fill="#946512"/><text x="303.574" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303.574" dy="0">34</tspan></text><rect x="284" y="173" width="292.891" height="24" rx="3" fill="#087f8c"/><text x="583.891" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="583.891" dy="0">792</tspan></text><rect x="284" y="200" width="239.639" height="24" rx="3" fill="#c0432f"/><text x="530.639" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="530.639" dy="0">648</tspan></text><rect x="284" y="227" width="12.2038" height="24" rx="3" fill="#946512"/><text x="303.204" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303.204" dy="0">33</tspan></text><rect x="284" y="263" width="532.53" height="24" rx="3" fill="#087f8c"/><text x="823.53" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="823.53" dy="0">1 440</tspan></text><rect x="284" y="290" width="2" height="24" rx="3" fill="#c0432f"/><text x="293" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="317" width="26.2567" height="24" rx="3" fill="#946512"/><text x="317.257" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="317.257" dy="0">71</tspan></text><text x="579.85" y="391" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="579.85" dy="0">Eventos de 1 440</tspan></text><rect x="10" y="405" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="429.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Con una caída de dos horas los reintentos cortos son un descarte lento. Cuanto más persiste el emisor, más repeticiones</tspan></text><text x="470" y="446.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">recibe el receptor, por lo que el receptor debe ser idempotente. Un sondeo de reconciliación recuperaría los perdidos, pero</tspan></text><text x="470" y="463.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">no se midió aquí. Pérdida de respuesta del 5 % por intento: supuesto del autor.</tspan></text><text x="470" y="510.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
