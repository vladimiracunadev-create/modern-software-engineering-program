<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sondeo cada cierto intervalo frente a 311 eventos de un día (unos 12 por hora)</title><desc id="d">Líneas en escala logarítmica con las peticiones al día según el retraso con que se detecta un evento: sondear cada 10 segundos cuesta 8 640 peticiones y detecta un evento en 5,1 segundos de media y 9,5 en el percentil 95; cada hora cuesta 24 peticiones y tarda 1 807 segundos de media y 3 379 en el percentil 95; un webhook costaría 311 entregas al día.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sondeo cada cierto intervalo frente a 311 eventos de un día (unos 12 por hora)</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Retraso medio</tspan></text><rect x="162.02" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Retraso p95</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="387" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="287" x2="101.24" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="187" x2="101.24" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="87" x2="101.24" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="87" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="87" x2="119.24" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="387" x2="119.24" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">1</tspan></text><line x1="312.43" y1="87" x2="312.43" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="312.43" y1="387" x2="312.43" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="312.43" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312.43" dy="0">10</tspan></text><line x1="505.62" y1="87" x2="505.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="505.62" y1="387" x2="505.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="505.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505.62" dy="0">100</tspan></text><line x1="698.81" y1="87" x2="698.81" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="698.81" y1="387" x2="698.81" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="698.81" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="698.81" dy="0">1 000</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">10 000</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Peticiones al día (escala logarítmica)</text><text x="505.62" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Retraso hasta detectar un evento (s) (escala logarítmica)</tspan></text><line x1="101.24" y1="237.724" x2="910" y2="237.724" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="107.24" y="231.724" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="107.24" dy="0">Webhook: 311 entregas al día</tspan></text><polyline points="255.935,93.3486 350.276,141.061 408.965,171.164 537.601,241.061 631.309,288.773 748.475,348.979" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="255.935" cy="93.3486" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="255.935" y="82.3486" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.935" dy="0">10 s</tspan></text><circle cx="350.276" cy="141.061" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="350.276" y="130.061" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="350.276" dy="0">30 s</tspan></text><circle cx="408.965" cy="171.164" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="408.965" y="160.164" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="408.965" dy="0">60 s</tspan></text><circle cx="537.601" cy="241.061" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="537.601" y="230.061" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="537.601" dy="0">5 min</tspan></text><circle cx="631.309" cy="288.773" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="631.309" y="277.773" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="631.309" dy="0">15 min</tspan></text><circle cx="748.475" cy="348.979" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="748.475" y="337.979" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="748.475" dy="0">1 h</tspan></text><polyline points="308.126,93.3486 401.471,141.061 458.605,171.164 594.864,241.061 685.774,288.773 800.974,348.979" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="302.626" y="87.8486" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="395.971" y="135.561" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="453.105" y="165.664" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="589.364" y="235.561" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="680.274" y="283.273" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="795.474" y="343.479" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El sondeo cambia peticiones por retraso: el retraso medio es la mitad del intervalo y las peticiones vacías crecen cuando</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el intervalo baja (96,5 % vacías a 10 s, 0,0 % a 1 h). Un webhook empuja 311 entregas sin peticiones vacías, a cambio de</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">recibir tráfico que no controlas. Eventos de Poisson de tasa fija: supuesto del autor.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
