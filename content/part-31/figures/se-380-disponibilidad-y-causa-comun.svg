<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 403" width="950" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Disponibilidad simulada durante 400 años según la arquitectura y la causa común de fallo</title><desc id="d">Tabla: tres componentes en serie con 99,9 por ciento cada uno dan 99,70 por ciento, unos 1 574 minutos de caída al año; duplicar solo la aplicación sube a 99,80 por ciento porque web y base de datos siguen siendo un punto único; cuatro despliegues malos al año que tumban ambas réplicas la bajan a 99,756 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="403" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Configuración</tspan></text><rect x="430" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Disponibilidad</tspan></text><rect x="580" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Minutos de caída al</tspan></text><text x="662" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">año</tspan></text><rect x="750" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Teoría</tspan></text><rect x="10" y="56" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Un componente (MTBF 500 h, MTTR 0,5 h)</tspan></text><rect x="430" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0,99899</tspan></text><rect x="580" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">529</tspan></text><rect x="750" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0,99900 → 526</tspan></text><rect x="10" y="114" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Serie: web, aplicación y base de datos</tspan></text><rect x="430" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0,99701</tspan></text><rect x="580" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">1 574</tspan></text><rect x="750" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0,99700 → 1 575</tspan></text><rect x="10" y="172" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Dos réplicas independientes de la aplicación</tspan></text><rect x="430" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0,99801</tspan></text><rect x="580" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">1 044</tspan></text><rect x="750" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0,99800</tspan></text><rect x="10" y="230" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Dos réplicas y 4 despliegues malos al año de 1 h</tspan></text><rect x="430" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0,99756</tspan></text><rect x="580" y="230" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">1 282</tspan></text><rect x="750" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="251.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0,99800 si fueran</tspan></text><text x="842" y="267.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">independientes</tspan></text><rect x="10" y="292" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">La réplica de una capa mejora el 99,70 % a un 99,80 % y nada más: los otros dos tramos en serie mandan. La causa común es la</tspan></text><text x="475" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">que quita el beneficio: la aplicación con dos réplicas pasa de 0,9999996 a 0,99955. Los MTBF y MTTR son supuestos del autor</tspan></text><text x="475" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">y las caídas independientes son un modelo, no una medición.</tspan></text><text x="475" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
