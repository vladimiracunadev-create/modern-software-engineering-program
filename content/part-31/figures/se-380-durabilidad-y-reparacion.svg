<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 507" width="920" height="507" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad anual de perder un objeto con réplicas independientes según el tiempo de reparación</title><desc id="d">Tabla: con una tasa anual de fallo de disco del 20 por ciento, dos réplicas con 24 horas de reparación pierden el objeto con probabilidad simulada 2,35 por diez mil al año, y la aproximación analítica da 2,19; pasar a tres réplicas con 168 horas baja la pérdida a 1 por cien mil. Con una tasa del 2 por ciento, tres réplicas con 24 horas dan 1,8 por diez mil millones al año.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="507" fill="#ffffff"/><rect x="10" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177" dy="0">Configuración</tspan></text><rect x="350" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Simulada (tasa anual 20 %)</tspan></text><rect x="570" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Aproximación 20 %</tspan></text><rect x="740" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Aproximación 2 %</tspan></text><rect x="10" y="56" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">2 réplicas, reparación de 1 h</tspan></text><rect x="350" y="56" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">1,75e-05 (7 eventos)</tspan></text><rect x="570" y="56" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">9,13e-06</tspan></text><rect x="740" y="56" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">9,13e-08</tspan></text><rect x="10" y="112" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">2 réplicas, reparación de 24 h</tspan></text><rect x="350" y="112" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">2,35e-04</tspan></text><rect x="570" y="112" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">2,19e-04</tspan></text><rect x="740" y="112" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">2,19e-06</tspan></text><rect x="10" y="168" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">2 réplicas, reparación de 168 h</tspan></text><rect x="350" y="168" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">1,50e-03</tspan></text><rect x="570" y="168" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">1,53e-03</tspan></text><rect x="740" y="168" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">1,53e-05</tspan></text><rect x="10" y="224" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">3 réplicas, reparación de 168 h</tspan></text><rect x="350" y="224" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">1,00e-05 (10 eventos)</tspan></text><rect x="570" y="224" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">8,83e-06</tspan></text><rect x="740" y="224" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">8,83e-09</tspan></text><rect x="10" y="280" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">3 réplicas, reparación de 336 h</tspan></text><rect x="350" y="280" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">3,50e-05</tspan></text><rect x="570" y="280" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">3,53e-05</tspan></text><rect x="740" y="280" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">3,53e-08</tspan></text><rect x="10" y="336" width="334" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="364.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">3 réplicas, reparación de 24 h</tspan></text><rect x="350" y="336" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="364.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">no observable</tspan></text><rect x="570" y="336" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="364.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">1,80e-07</tspan></text><rect x="740" y="336" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="364.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">1,80e-10</tspan></text><rect x="10" y="396" width="900" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">La aproximación 8 760 · N · λᴺ · Rᴺ⁻¹ coincide con la simulación y enseña que la reparación pesa más que el número: 7</tspan></text><text x="460" y="437.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">veces más tiempo, 7ᴺ⁻¹ más pérdida. Pero si el 0,1 % de los fallos afecta a las tres réplicas a la vez (mismo lote,</tspan></text><text x="460" y="454.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">misma sala, mismo error), la pérdida anual es 2,0e-05, cinco órdenes mayor que la independiente (1,8e-10).</tspan></text><text x="460" y="493.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
