<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 584" width="940" height="584" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete cambios de esquema: compatibilidad según quién lee y en qué sentido</title><desc id="d">Mapa de calor de siete cambios de esquema ordenados por cuántas de las cuatro combinaciones de lector y sentido siguen siendo compatibles: añadir o quitar un campo opcional es compatible en tres, volver obligatorio un campo opcional en dos, añadir o quitar un obligatorio en una, y renombrar un campo o cambiar su tipo en ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="584" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Siete cambios de esquema: compatibilidad según quién lee y en qué sentido</tspan></text><text x="633" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="633" dy="0">Tipo de lector y sentido de la lectura</tspan></text><text x="417.75" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">Tolerante: nuevo</tspan></text><text x="417.75" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">lee viejos</tspan></text><text x="561.25" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">Tolerante: viejo</tspan></text><text x="561.25" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">lee nuevos</tspan></text><text x="704.75" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">Estricto: nuevo</tspan></text><text x="704.75" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">lee viejos</tspan></text><text x="848.25" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="848.25" dy="0">Estricto: viejo</tspan></text><text x="848.25" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="848.25" dy="0">lee nuevos</tspan></text><text x="336" y="137.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Añadir un campo opcional (3 de 4)</tspan></text><text x="336" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Quitar un campo opcional (3 de 4)</tspan></text><text x="336" y="217" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Volver obligatorio un campo opcional (2</tspan></text><text x="336" y="234" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">de 4)</tspan></text><text x="336" y="269.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Añadir un campo obligatorio (1 de 4)</tspan></text><text x="336" y="313.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Quitar un campo obligatorio (1 de 4)</tspan></text><text x="336" y="357.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Renombrar un campo (0 de 4)</tspan></text><text x="336" y="401.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Cambiar el tipo de un campo (0 de 4)</tspan></text><rect x="347.5" y="112.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417.75" dy="0">Sí</tspan></text><rect x="491" y="112.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="561.25" dy="0">Sí</tspan></text><rect x="634.5" y="112.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="704.75" dy="0">Sí</tspan></text><rect x="778" y="112.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="848.25" dy="0">No</tspan></text><rect x="347.5" y="156.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417.75" dy="0">Sí</tspan></text><rect x="491" y="156.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="561.25" dy="0">Sí</tspan></text><rect x="634.5" y="156.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">No</tspan></text><rect x="778" y="156.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="848.25" dy="0">Sí</tspan></text><rect x="347.5" y="200.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">No</tspan></text><rect x="491" y="200.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="561.25" dy="0">Sí</tspan></text><rect x="634.5" y="200.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">No</tspan></text><rect x="778" y="200.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="848.25" dy="0">Sí</tspan></text><rect x="347.5" y="244.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="269.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">No</tspan></text><rect x="491" y="244.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="269.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="561.25" dy="0">Sí</tspan></text><rect x="634.5" y="244.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="269.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">No</tspan></text><rect x="778" y="244.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="269.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="848.25" dy="0">No</tspan></text><rect x="347.5" y="288.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="313.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417.75" dy="0">Sí</tspan></text><rect x="491" y="288.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="313.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">No</tspan></text><rect x="634.5" y="288.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="313.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">No</tspan></text><rect x="778" y="288.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="313.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="848.25" dy="0">No</tspan></text><rect x="347.5" y="332.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="357.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">No</tspan></text><rect x="491" y="332.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="357.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">No</tspan></text><rect x="634.5" y="332.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="357.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">No</tspan></text><rect x="778" y="332.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="357.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="848.25" dy="0">No</tspan></text><rect x="347.5" y="376.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="401.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">No</tspan></text><rect x="491" y="376.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="401.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">No</tspan></text><rect x="634.5" y="376.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="401.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">No</tspan></text><rect x="778" y="376.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="401.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="848.25" dy="0">No</tspan></text><text x="20" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 265)">Cambio</text><text x="346" y="445" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="346" dy="0">No</tspan></text><rect x="369.08" y="433" width="30.5" height="14" fill="#dff1ee"/><rect x="399.08" y="433" width="30.5" height="14" fill="#c0e1e0"/><rect x="429.08" y="433" width="30.5" height="14" fill="#a2d0d2"/><rect x="459.08" y="433" width="30.5" height="14" fill="#83c0c4"/><rect x="489.08" y="433" width="30.5" height="14" fill="#64b0b6"/><rect x="519.08" y="433" width="30.5" height="14" fill="#45a0a8"/><rect x="549.08" y="433" width="30.5" height="14" fill="#278f9a"/><rect x="579.08" y="433" width="30.5" height="14" fill="#087f8c"/><text x="617.08" y="445" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="617.08" dy="0">Sí</tspan></text><text x="640.16" y="445" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="640.16" dy="0">más oscuro = mayor (1 = compatible)</tspan></text><rect x="10" y="461" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="485.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La compatibilidad depende de quién lee y de cómo: un lector estricto convierte cualquier campo nuevo en un fallo. Las filas</tspan></text><text x="470" y="502.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">están ordenadas por cuántas combinaciones sobreviven; renombrar y cambiar el tipo no sobreviven en ninguna. Se probó con</tspan></text><text x="470" y="519.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">instancias mínimas y máximas de cada versión; no se ejecutó ningún registro de esquemas real.</tspan></text><text x="470" y="566.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
