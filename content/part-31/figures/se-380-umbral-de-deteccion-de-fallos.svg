height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El umbral intercambia un tipo de pérdida por otro: 30 s cuestan 2 minutos al año en detección tardía y ninguno en</tspan></text><text x="470" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">conmutaciones falsas; 2 s cuestan 0,1 minutos y casi 40 000 en falsas. Las pausas del emisor (una cada 5 horas, mediana de</tspan></text><text x="470" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">2 s) y la pérdida del 0,5 % son supuestos del autor.</tspan></text><text x="470" y="505.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
