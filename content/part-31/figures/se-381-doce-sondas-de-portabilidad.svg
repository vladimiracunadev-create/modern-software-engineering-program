<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 771" width="940" height="771" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce sondas de portabilidad ejecutadas con el mismo script de Python en Windows 11 y en Ubuntu bajo WSL2</title><desc id="d">Tabla: el mismo script de Python obtiene resultados distintos en Windows y Ubuntu en las doce sondas, entre ellas la codificación por defecto cp1252 frente a UTF-8, los bytes de un texto con eñe, la sensibilidad a mayúsculas, el límite de 260 caracteres de ruta, renombrar sobre un archivo existente, borrar un archivo abierto y el método de arranque de procesos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="771" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Sonda</tspan></text><rect x="440" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Windows 11</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Ubuntu (WSL2)</tspan></text><rect x="10" y="56" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Separador de ruta y fin de línea</tspan></text><rect x="440" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">«\» y «\r\n»</tspan></text><rect x="710" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">«/» y «\n»</tspan></text><rect x="10" y="106" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Codificación por defecto de open() sin encoding</tspan></text><rect x="440" y="106" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">cp1252</tspan></text><rect x="710" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">UTF-8</tspan></text><rect x="10" y="156" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Bytes de «a», «ñ», «o» y salto de línea en modo texto</tspan></text><rect x="440" y="156" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">61 f1 6f 0d 0a</tspan></text><rect x="710" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">61 c3 b1 6f 0a</tspan></text><rect x="10" y="206" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">«archivo.txt» existe tras crear «Archivo.TXT»</tspan></text><rect x="440" y="206" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">Sí</tspan></text><rect x="710" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">No</tspan></text><rect x="10" y="256" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Crear un archivo llamado «a:b»</tspan></text><rect x="440" y="256" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">Error</tspan></text><rect x="710" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Sí</tspan></text><rect x="10" y="306" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">8 directorios anidados de 50 caracteres</tspan></text><rect x="440" y="306" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">Falla en el 4.º (252 caracteres)</tspan></text><rect x="710" y="306" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">8 niveles (428 caracteres)</tspan></text><rect x="10" y="356" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="381.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">os.rename sobre un archivo existente</tspan></text><rect x="440" y="356" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">FileExistsError</tspan></text><rect x="710" y="356" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Sobrescribe sin error</tspan></text><rect x="10" y="406" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="431.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Borrar un archivo que sigue abierto</tspan></text><rect x="440" y="406" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">PermissionError</tspan></text><rect x="710" y="406" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Borra</tspan></text><rect x="10" y="456" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="481.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">datetime.fromtimestamp(-1)</tspan></text><rect x="440" y="456" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="481.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">OSError</tspan></text><rect x="710" y="456" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="481.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1969</tspan></text><rect x="10" y="506" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="531.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">time.strftime con «%-d»</tspan></text><rect x="440" y="506" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="531.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">ValueError</tspan></text><rect x="710" y="506" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="531.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">5</tspan></text><rect x="10" y="556" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="581.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">os.getuid()</tspan></text><rect x="440" y="556" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="581.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">AttributeError</tspan></text><rect x="710" y="556" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="581.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Un entero</tspan></text><rect x="10" y="606" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="631.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Método de arranque de multiprocessing</tspan></text><rect x="440" y="606" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="631.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">spawn</tspan></text><rect x="710" y="606" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="631.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">fork</tspan></text><rect x="10" y="660" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="684.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El texto «año» escrito sin encoding ocupa 5 bytes con salto de línea en ambos sistemas y los bytes son distintos: el tamaño</tspan></text><text x="470" y="701.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">no delata la diferencia. La ruta de Windows falla por el límite de 260 caracteres con la configuración de este equipo; con</tspan></text><text x="470" y="718.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">rutas largas habilitadas no fallaría.</tspan></text><text x="470" y="757.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sondas reales en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); cada fila es una observación, no una norma.</tspan></text></svg>
