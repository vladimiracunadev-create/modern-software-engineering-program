<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">5 000 notas de un sistema externo con cuatro formatos distintos</title><desc id="d">Barras apiladas horizontales con el destino de 5 000 notas: la conversión directa con float acepta 721 dentro de rango y 411 fuera de rango, y rompe con 3 868; la capa anticorrupción acepta 4 627 normalizadas y pone 373 en cuarentena con su motivo, sin dejar pasar ninguna fuera de rango.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">5 000 notas de un sistema externo con cuatro formatos distintos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aceptadas dentro de rango</tspan></text><rect x="252.5" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Aceptadas fuera de rango</tspan></text><rect x="481.46" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="501.46" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="501.46" dy="0">Rotas por excepción</tspan></text><rect x="672.72" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="692.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="692.72" dy="0">En cuarentena</tspan></text><line x1="224" y1="77" x2="224" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="165" x2="224" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="354.34" y1="77" x2="354.34" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="354.34" y1="165" x2="354.34" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="354.34" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354.34" dy="0">1 000</tspan></text><line x1="484.68" y1="77" x2="484.68" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="484.68" y1="165" x2="484.68" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="484.68" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="484.68" dy="0">2 000</tspan></text><line x1="615.02" y1="77" x2="615.02" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="615.02" y1="165" x2="615.02" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="615.02" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615.02" dy="0">3 000</tspan></text><line x1="745.36" y1="77" x2="745.36" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="745.36" y1="165" x2="745.36" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="745.36" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="745.36" dy="0">4 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5 000</tspan></text><line x1="224" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Conversión directa con</tspan></text><text x="214" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">float</tspan></text><text x="214" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Capa anticorrupción</tspan></text><rect x="224" y="84" width="93.9751" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="270.988" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="270.988" dy="0">721</tspan></text><rect x="317.975" y="84" width="53.5697" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="344.76" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="344.76" dy="0">411</tspan></text><rect x="371.545" y="84" width="504.155" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="623.622" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="623.622" dy="0">3 868</tspan></text><rect x="875.7" y="84" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5 000</tspan></text><rect x="224" y="128" width="603.083" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="525.542" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="525.542" dy="0">4 627</tspan></text><rect x="827.083" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="827.083" y="128" width="0" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><rect x="827.083" y="128" width="48.6168" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="851.392" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="851.392" dy="0">373</tspan></text><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5 000</tspan></text><text x="549.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="549.85" dy="0">Registros de 5 000</tspan></text><rect x="10" y="223" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El modelo externo usa coma decimal, punto decimal, escala de 0 a 100, «N/P» y vacío. La conversión directa acepta 1 132</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">notas, de las cuales 411 son válidas solo en apariencia porque vienen de 0 a 100 (721 = 1 132 − 411). La capa traduce,</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">rechaza con motivo (198 N/P y 175 vacías) y deja un lugar único donde mirar. Distribución de formatos del autor.</tspan></text><text x="470" y="328.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
