<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 438" width="940" height="438" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una deriva de peso del 0,6 % por compilación (de 800 KB a 1 324 KB en 80) frente a tres compuertas</title><desc id="d">Línea de tiempo por compilación con el momento en que cada compuerta avisa: el presupuesto absoluto de 1 000 kilobytes avisa en la compilación 38 con un 25 por ciento de aumento; la tendencia, en la 26 con 926 kilobytes y un 16 por ciento; la compuerta contra la compilación anterior falla 21 veces en 79 por ruido y ninguna por la deriva real.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="438" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una deriva de peso del 0,6 % por compilación (de 800 KB a 1 324 KB en 80) frente a tres compuertas</tspan></text><line x1="284" y1="83" x2="284" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="257" x2="284" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="362.5" y1="83" x2="362.5" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="362.5" y1="257" x2="362.5" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="362.5" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362.5" dy="0">10</tspan></text><line x1="441" y1="83" x2="441" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="441" y1="257" x2="441" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="441" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="441" dy="0">20</tspan></text><line x1="519.5" y1="83" x2="519.5" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="519.5" y1="257" x2="519.5" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="519.5" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="519.5" dy="0">30</tspan></text><line x1="598" y1="83" x2="598" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="598" y1="257" x2="598" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="598" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598" dy="0">40</tspan></text><line x1="676.5" y1="83" x2="676.5" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="676.5" y1="257" x2="676.5" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="676.5" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="676.5" dy="0">50</tspan></text><line x1="755" y1="83" x2="755" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="755" y1="257" x2="755" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="755" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755" dy="0">60</tspan></text><line x1="833.5" y1="83" x2="833.5" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="833.5" y1="257" x2="833.5" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="833.5" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="833.5" dy="0">70</tspan></text><line x1="912" y1="83" x2="912" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="257" x2="912" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">80</tspan></text><line x1="284" y1="257" x2="912" y2="257" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="116.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Presupuesto absoluto de 1 000 KB</tspan></text><text x="274" y="166" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Tendencia: mediana de 3 contra las</tspan></text><text x="274" y="183" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">10 primeras, +10 %</tspan></text><text x="274" y="224" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Contra la compilación anterior, +2</tspan></text><text x="274" y="241" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">%</tspan></text><line x1="488.1" y1="75" x2="488.1" y2="257" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="488.1" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="488.1" dy="0">26</tspan></text><line x1="582.3" y1="75" x2="582.3" y2="257" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="582.3" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="582.3" dy="0">38</tspan></text><rect x="284" y="92" width="298.3" height="40" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="433.15" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="433.15" dy="0">Sin aviso</tspan></text><rect x="582.3" y="92" width="329.7" height="40" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="747.15" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747.15" dy="0">Avisa desde la 38 (+25 %)</tspan></text><line x1="14" y1="141" x2="912" y2="141" stroke="#d5dde1" stroke-width="1"/><rect x="284" y="150" width="204.1" height="40" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="386.05" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="386.05" dy="0">Sin aviso</tspan></text><rect x="488.1" y="150" width="423.9" height="40" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="700.05" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="700.05" dy="0">Avisa desde la 26 (926 KB, +16 %)</tspan></text><line x1="14" y1="199" x2="912" y2="199" stroke="#d5dde1" stroke-width="1"/><rect x="284" y="208" width="628" height="40" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="598" y="232.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="598" dy="0">21 de 79 compilaciones fallan por ruido; ninguna por la deriva real</tspan></text><text x="598" y="301" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598" dy="0">Número de compilación</tspan></text><rect x="10" y="315" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="339.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cada compilación solo engorda 0,6 %, por debajo del ruido de 1,2 %, y por eso la compuerta paso a paso no la ve (y se</tspan></text><text x="470" y="356.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">dispara por ruido). La tendencia ve el conjunto sin disparar: 12 compilaciones antes que el presupuesto absoluto, con la</tspan></text><text x="470" y="373.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ventaja de llegar cuando aún hay margen. Sin deriva, las falsas alarmas son 0 de 80, 15 de 79 y 0 de 70.</tspan></text><text x="470" y="420.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
