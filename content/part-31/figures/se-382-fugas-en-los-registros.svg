<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 618" width="940" height="618" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Datos sensibles que aparecen en los registros de 2 000 mensajes según la política</title><desc id="d">Barras horizontales con los correos, los tokens y los comentarios con identificador que aparecen en los registros de 2 000 mensajes: registrar el cuerpo completo filtra 2 000 correos, 2 000 tokens y 200 comentarios; sustituir correos deja 2 000 tokens y 200 comentarios; sustituir correos y tokens deja 200 comentarios; registrar solo los campos permitidos no filtra nada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="618" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Datos sensibles que aparecen en los registros de 2 000 mensajes según la política</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Correos filtrados</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Tokens filtrados</tspan></text><rect x="360.82" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="380.82" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="380.82" dy="0">Comentarios con identificador</tspan></text><line x1="344" y1="77" x2="344" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="437" x2="344" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0</tspan></text><line x1="476.925" y1="77" x2="476.925" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="476.925" y1="437" x2="476.925" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="476.925" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="476.925" dy="0">500</tspan></text><line x1="609.85" y1="77" x2="609.85" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="609.85" y1="437" x2="609.85" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="609.85" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="609.85" dy="0">1 000</tspan></text><line x1="742.775" y1="77" x2="742.775" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="742.775" y1="437" x2="742.775" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="742.775" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742.775" dy="0">1 500</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="437" x2="875.7" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2 000</tspan></text><line x1="344" y1="437" x2="875.7" y2="437" stroke="#5b7280" stroke-width="1.6"/><text x="334" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Registrar el cuerpo completo</tspan></text><text x="334" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Sustituir correos con una expresión regular</tspan></text><text x="334" y="298" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Sustituir correos y tokens con expresiones</tspan></text><text x="334" y="315" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">regulares</tspan></text><text x="334" y="396.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Registrar solo los campos permitidos</tspan></text><rect x="344" y="83" width="531.7" height="24" rx="3" fill="#c0432f"/><text x="882.7" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">2 000</tspan></text><rect x="344" y="110" width="531.7" height="24" rx="3" fill="#946512"/><text x="882.7" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">2 000</tspan></text><rect x="344" y="137" width="53.17" height="24" rx="3" fill="#102a43"/><text x="404.17" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="404.17" dy="0">200</tspan></text><rect x="344" y="173" width="2" height="24" rx="3" fill="#c0432f"/><text x="353" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353" dy="0">0</tspan></text><rect x="344" y="200" width="531.7" height="24" rx="3" fill="#946512"/><text x="882.7" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">2 000</tspan></text><rect x="344" y="227" width="53.17" height="24" rx="3" fill="#102a43"/><text x="404.17" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="404.17" dy="0">200</tspan></text><rect x="344" y="263" width="2" height="24" rx="3" fill="#c0432f"/><text x="353" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353" dy="0">0</tspan></text><rect x="344" y="290" width="2" height="24" rx="3" fill="#946512"/><text x="353" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353" dy="0">0</tspan></text><rect x="344" y="317" width="53.17" height="24" rx="3" fill="#102a43"/><text x="404.17" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="404.17" dy="0">200</tspan></text><rect x="344" y="353" width="2" height="24" rx="3" fill="#c0432f"/><text x="353" y="369.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353" dy="0">0</tspan></text><rect x="344" y="380" width="2" height="24" rx="3" fill="#946512"/><text x="353" y="396.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353" dy="0">0</tspan></text><rect x="344" y="407" width="2" height="24" rx="3" fill="#102a43"/><text x="353" y="423.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353" dy="0">0</tspan></text><text x="609.85" y="481" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="609.85" dy="0">Apariciones en los registros de 2 000 mensajes</tspan></text><rect x="10" y="495" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="519.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una lista de lo permitido falla cerrada: lo nuevo no se registra. Una lista de lo prohibido falla abierta: lo que no</tspan></text><text x="470" y="536.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">previste se registra. Los correos y tokens son sintéticos (dominio de ensayo y cadenas aleatorias); el comentario ofuscado</tspan></text><text x="470" y="553.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">muestra por qué la expresión regular no basta.</tspan></text><text x="470" y="600.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
