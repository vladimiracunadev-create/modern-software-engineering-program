<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Trazas completas de tres saltos si cada salto puede perder el encabezado de correlación</title><desc id="d">Líneas con el porcentaje de trazas completas de 10 000 según la probabilidad de que cada uno de tres saltos pierda el encabezado: 100,0, 97,1, 86,1 y 51,5 por ciento medidos con pérdidas de 0, 1, 5 y 20 por ciento, casi iguales a lo esperado, uno menos la pérdida elevado al cubo: 100,0, 97,0, 85,7 y 51,2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Trazas completas de tres saltos si cada salto puede perder el encabezado de correlación</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Medido</tspan></text><rect x="109.24" y="45" width="12" height="12" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">Esperado (1 − d)³</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0</tspan></text><line x1="295.465" y1="87" x2="295.465" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="295.465" y1="387" x2="295.465" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="295.465" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295.465" dy="0">5</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="387" x2="494.31" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">10</tspan></text><line x1="693.155" y1="87" x2="693.155" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="693.155" y1="387" x2="693.155" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="693.155" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.155" dy="0">15</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">20</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Trazas completas (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Pérdida del encabezado por salto (%)</tspan></text><polyline points="96.62,87 136.389,95.7 295.465,128.7 892,232.5" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="87" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="136.389" cy="95.7" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="295.465" cy="128.7" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="892" cy="232.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polyline points="96.62,87 136.389,96 295.465,129.9 892,233.4" fill="none" stroke="#102a43" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="81.5" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="130.889" y="90.5" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="289.965" y="124.4" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="886.5" y="227.9" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="562" y="192.5" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="562" dy="0">Con 20 % por salto solo la</tspan></text><text x="562" y="209.5" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="562" dy="0">mitad de las trazas llega</tspan></text><text x="562" y="226.5" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="562" dy="0">completa</tspan></text><line x1="866.24" y1="228.9" x2="570" y2="187.5" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La correlación se pierde en multiplicación: un salto que no propaga el encabezado rompe la traza entera. Reconstruir por</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tiempo y estudiante funciona con poca concurrencia (99,4 % con 1 solicitud por segundo; 93,6 % con 10) y se degrada con</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mucha (74,8 % con 50). Pérdidas independientes entre saltos: supuesto del autor.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
