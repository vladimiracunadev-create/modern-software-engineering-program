<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 452" width="940" height="452" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Segundos hasta la primera alarma desde el inicio de cada falla, según la señal vigilada</title><desc id="d">Mapa de calor con los segundos hasta la primera alarma de cuatro fallas según cuatro señales: el consumidor lento se ve a los 101 segundos en la profundidad y a los 123 en la edad; el colgado a los 50, 61 y 25; el mensaje venenoso a los 50, 61, 25 y 10; el productor parado solo produce una falsa alarma a los 25 segundos en los procesados. Un guion indica que la señal nunca alarma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="452" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Segundos hasta la primera alarma desde el inicio de cada falla, según la señal vigilada</tspan></text><text x="618" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="618" dy="0">Señal vigilada (— = la señal nunca alarma; contorno = falsa alarma)</tspan></text><text x="391.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="391.5" dy="0">Profundidad &gt; 50</tspan></text><text x="542.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="542.5" dy="0">Edad &gt; 60 s</tspan></text><text x="693.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="693.5" dy="0">Procesados &lt; 5 en</tspan></text><text x="693.5" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="693.5" dy="0">30 s</tspan></text><text x="844.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="844.5" dy="0">Errores &gt; 10 en 30</tspan></text><text x="844.5" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="844.5" dy="0">s</tspan></text><text x="306" y="137.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="306" dy="0">Consumidor lento (mitad de capacidad)</tspan></text><text x="306" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="306" dy="0">Consumidor colgado</tspan></text><text x="306" y="225.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="306" dy="0">Mensaje venenoso que se reintenta</tspan></text><text x="306" y="269.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="306" dy="0">Productor parado</tspan></text><rect x="317.5" y="112.5" width="148" height="41" rx="4" fill="#a77f35" stroke="#ffffff" stroke-width="1"/><text x="391.5" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="391.5" dy="0">101 s</tspan></text><rect x="468.5" y="112.5" width="148" height="41" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="542.5" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542.5" dy="0">123 s</tspan></text><rect x="619.5" y="112.5" width="148" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="693.5" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="693.5" dy="0">—</tspan></text><rect x="770.5" y="112.5" width="148" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="844.5" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="844.5" dy="0">—</tspan></text><rect x="317.5" y="156.5" width="148" height="41" rx="4" fill="#d4bc88" stroke="#ffffff" stroke-width="1"/><text x="391.5" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="391.5" dy="0">50 s</tspan></text><rect x="468.5" y="156.5" width="148" height="41" rx="4" fill="#caaf76" stroke="#ffffff" stroke-width="1"/><text x="542.5" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="542.5" dy="0">61 s</tspan></text><rect x="619.5" y="156.5" width="148" height="41" rx="4" fill="#ead9b0" stroke="#ffffff" stroke-width="1"/><text x="693.5" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="693.5" dy="0">25 s</tspan></text><rect x="770.5" y="156.5" width="148" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="844.5" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="844.5" dy="0">—</tspan></text><rect x="317.5" y="200.5" width="148" height="41" rx="4" fill="#d4bc88" stroke="#ffffff" stroke-width="1"/><text x="391.5" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="391.5" dy="0">50 s</tspan></text><rect x="468.5" y="200.5" width="148" height="41" rx="4" fill="#caaf76" stroke="#ffffff" stroke-width="1"/><text x="542.5" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="542.5" dy="0">61 s</tspan></text><rect x="619.5" y="200.5" width="148" height="41" rx="4" fill="#ead9b0" stroke="#ffffff" stroke-width="1"/><text x="693.5" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="693.5" dy="0">25 s</tspan></text><rect x="770.5" y="200.5" width="148" height="41" rx="4" fill="#f7ebc8" stroke="#ffffff" stroke-width="1"/><text x="844.5" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="844.5" dy="0">10 s</tspan></text><rect x="317.5" y="244.5" width="148" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="391.5" y="269.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="391.5" dy="0">—</tspan></text><rect x="468.5" y="244.5" width="148" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="542.5" y="269.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="542.5" dy="0">—</tspan></text><rect x="619.5" y="244.5" width="148" height="41" rx="4" fill="#ead9b0" stroke="#102a43" stroke-width="3"/><text x="693.5" y="269.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="693.5" dy="0">25 s</tspan></text><rect x="770.5" y="244.5" width="148" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="844.5" y="269.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="844.5" dy="0">—</tspan></text><text x="20" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 199)">Falla</text><text x="316" y="313" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="316" dy="0">10 s</tspan></text><rect x="354.16" y="301" width="30.5" height="14" fill="#f7ebc8"/><rect x="384.16" y="301" width="30.5" height="14" fill="#e9d8ae"/><rect x="414.16" y="301" width="30.5" height="14" fill="#dbc594"/><rect x="444.16" y="301" width="30.5" height="14" fill="#cdb27a"/><rect x="474.16" y="301" width="30.5" height="14" fill="#be9e60"/><rect x="504.16" y="301" width="30.5" height="14" fill="#b08b46"/><rect x="534.16" y="301" width="30.5" height="14" fill="#a2782c"/><rect x="564.16" y="301" width="30.5" height="14" fill="#946512"/><text x="602.16" y="313" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="602.16" dy="0">123 s</tspan></text><text x="647.86" y="313" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="647.86" dy="0">más oscuro = mayor (segundos hasta la alarma)</tspan></text><rect x="10" y="329" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="353.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ninguna señal detecta todo: cada falla se ve en una señal distinta y una misma señal confunde fallas diferentes (los</tspan></text><text x="470" y="370.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">procesados dan falsa alarma cuando el productor se detiene). Se vigilan al menos profundidad, edad, procesados y errores, y</tspan></text><text x="470" y="387.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">se interpretan juntas. Umbrales fijos y llegada de un mensaje por segundo: supuestos del autor.</tspan></text><text x="470" y="434.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
