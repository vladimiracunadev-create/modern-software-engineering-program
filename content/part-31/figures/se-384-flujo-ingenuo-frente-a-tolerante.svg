<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Flujo de entrega, calificación y aviso con fallas inyectadas (3 000 entregas)</title><desc id="d">Barras horizontales con las violaciones de cinco invariantes en un flujo ingenuo y en uno tolerante: 74 entregas sin calificar, 171 calificadas dos veces, 291 sin aviso, 153 avisadas dos veces y 2 793 mensajes bloqueados tras un venenoso en el ingenuo; el tolerante deja cero en todas y aparta los 15 venenosos en la cola de fallidos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Flujo de entrega, calificación y aviso con fallas inyectadas (3 000 entregas)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Flujo ingenuo</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Flujo tolerante</tspan></text><line x1="354" y1="77" x2="354" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="397" x2="354" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="440.95" y1="77" x2="440.95" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="440.95" y1="397" x2="440.95" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="440.95" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="440.95" dy="0">500</tspan></text><line x1="527.9" y1="77" x2="527.9" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="527.9" y1="397" x2="527.9" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="527.9" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527.9" dy="0">1 000</tspan></text><line x1="614.85" y1="77" x2="614.85" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="614.85" y1="397" x2="614.85" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="614.85" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="614.85" dy="0">1 500</tspan></text><line x1="701.8" y1="77" x2="701.8" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="701.8" y1="397" x2="701.8" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="701.8" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701.8" dy="0">2 000</tspan></text><line x1="788.75" y1="77" x2="788.75" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="788.75" y1="397" x2="788.75" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="788.75" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="788.75" dy="0">2 500</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="397" x2="875.7" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">3 000</tspan></text><line x1="354" y1="397" x2="875.7" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Entregas sin calificación</tspan></text><text x="344" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Entregas con calificación doble</tspan></text><text x="344" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Calificadas sin aviso al estudiante</tspan></text><text x="344" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Estudiantes avisados dos veces</tspan></text><text x="344" y="361" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Mensajes bloqueados tras un venenoso (15</tspan></text><text x="344" y="378" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">venenosos)</tspan></text><rect x="354" y="83" width="12.8686" height="24.5" rx="3" fill="#c0432f"/><text x="373.869" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="373.869" dy="0">74</tspan></text><rect x="354" y="110.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="147" width="29.7369" height="24.5" rx="3" fill="#c0432f"/><text x="390.737" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="390.737" dy="0">171</tspan></text><rect x="354" y="174.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="211" width="50.6049" height="24.5" rx="3" fill="#c0432f"/><text x="411.605" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="411.605" dy="0">291</tspan></text><rect x="354" y="238.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="275" width="26.6067" height="24.5" rx="3" fill="#c0432f"/><text x="387.607" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="387.607" dy="0">153</tspan></text><rect x="354" y="302.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="339" width="485.703" height="24.5" rx="3" fill="#c0432f"/><text x="846.703" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="846.703" dy="0">2 793</tspan></text><rect x="354" y="366.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><text x="614.85" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Violaciones de la invariante (de 3 000 entregas)</tspan></text><rect x="10" y="455" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El flujo tolerante combina cuatro mecanismos de las clases anteriores: outbox, bandeja de entrada, versión por entidad y</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cola de fallidos (donde quedan los 15 venenosos sin bloquear a nadie). Las fallas (2 % de caída del relevo, 3 % de</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">duplicados, desorden, 15 venenosos, notificador caído) son inyecciones del autor sobre SQLite y listas en memoria.</tspan></text><text x="470" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
