<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 619" width="940" height="619" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho artefactos del mismo canal: ¿idénticos entre dos ejecuciones? ¿idénticos entre Windows y Ubuntu? (SHA-256)</title><desc id="d">Tabla: de ocho artefactos generados por el mismo programa, seis son idénticos entre dos ejecuciones en el mismo sistema y solo tres lo son entre Windows y Ubuntu; los resultados con semilla fija y los archivos escritos con codificación y fin de línea explícitos coinciden; el CSV y el informe escritos en modo texto por defecto difieren; el reloj y el orden de un conjunto cambian en cada ejecución.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="619" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Artefacto</tspan></text><rect x="460" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Igual entre dos</tspan></text><text x="562" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">ejecuciones</tspan></text><rect x="670" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Igual entre Windows y Ubuntu</tspan></text><rect x="10" y="56" width="444" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">resultados.json (estadísticos con semilla fija)</tspan></text><rect x="460" y="56" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">Sí</tspan></text><rect x="670" y="56" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Sí</tspan></text><rect x="10" y="112" width="444" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">correcto.csv (newline vacío, terminador explícito)</tspan></text><rect x="460" y="112" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">Sí</tspan></text><rect x="670" y="112" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Sí</tspan></text><rect x="10" y="168" width="444" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">informe_correcto.md (UTF-8 y \n explícitos)</tspan></text><rect x="460" y="168" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">Sí</tspan></text><rect x="670" y="168" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Sí</tspan></text><rect x="10" y="224" width="444" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">ingenuo.csv (modo texto sin newline vacío)</tspan></text><rect x="460" y="224" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">Sí</tspan></text><rect x="670" y="224" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">No: \r\r\n frente a \r\n</tspan></text><rect x="10" y="280" width="444" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">informe_ingenuo.md (modo texto sin encoding)</tspan></text><rect x="460" y="280" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">Sí</tspan></text><rect x="670" y="280" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="300.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">No: cp1252 y \r\n frente a UTF-8 y</tspan></text><text x="797" y="316.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">\n</tspan></text><rect x="10" y="336" width="444" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="364.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">tiempos.json (reloj de pared)</tspan></text><rect x="460" y="336" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="364.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">No</tspan></text><rect x="670" y="336" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="364.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">No</tspan></text><rect x="10" y="392" width="444" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="420.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">orden de un conjunto de cadenas (set)</tspan></text><rect x="460" y="392" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="420.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">No</tspan></text><rect x="670" y="392" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="420.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">No</tspan></text><rect x="10" y="448" width="444" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="476.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">entorno.json (nombre del sistema)</tspan></text><rect x="460" y="448" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="476.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">Sí</tspan></text><rect x="670" y="448" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="476.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">No, por diseño</tspan></text><rect x="10" y="508" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="532.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Reproducible no significa idéntico a nivel de bytes en todo: el reloj y el orden de un set nunca lo serán y hay que</tspan></text><text x="470" y="549.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">excluirlos del hash o declararlos. Los dos que difieren entre sistemas son defectos de escritura (modo texto sin newline ni</tspan></text><text x="470" y="566.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">encoding), no del experimento, y se corrigen sin tocar los datos.</tspan></text><text x="470" y="605.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sondas reales en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); cada fila es una observación, no una norma.</tspan></text></svg>
