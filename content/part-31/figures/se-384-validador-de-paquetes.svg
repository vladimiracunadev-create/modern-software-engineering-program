<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 521" width="940" height="521" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador de paquetes de informe frente a 240 mutaciones (12 operadores × 20): 140 detectadas</title><desc id="d">Tabla: un validador que recalcula el hash de los datos, los percentiles, el veredicto y exige campos y un plan con hash detecta 20 de 20 en cada uno de siete operadores, como quitar un campo, alterar una fila o invertir el veredicto, y 0 de 20 en cinco operadores coherentes, como reemplazar los datos con su hash y sus resultados, cambiar a la vez el umbral y el plan o conservar solo la mitad más rápida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="521" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Mutación detectada</tspan></text><rect x="310" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">Detectadas</tspan></text><rect x="430" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">Mutación no detectada</tspan></text><rect x="810" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Quitar un campo obligatorio</tspan></text><rect x="310" y="56" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">20 de 20</tspan></text><rect x="430" y="56" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Cambiar umbral y plan a la vez</tspan></text><rect x="810" y="56" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0 de 20</tspan></text><rect x="10" y="106" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Alterar una fila de los datos</tspan></text><rect x="310" y="106" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">20 de 20</tspan></text><rect x="430" y="106" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Reemplazar datos, hash y resultados</tspan></text><rect x="810" y="106" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0 de 20</tspan></text><rect x="10" y="156" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Alterar un resultado un 10 %</tspan></text><rect x="310" y="156" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">20 de 20</tspan></text><rect x="430" y="156" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Conservar solo la mitad más rápida</tspan></text><rect x="810" y="156" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0 de 20</tspan></text><rect x="10" y="206" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Invertir el veredicto</tspan></text><rect x="310" y="206" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">20 de 20</tspan></text><rect x="430" y="206" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Un límite genérico pero extenso</tspan></text><rect x="810" y="206" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0 de 20</tspan></text><rect x="10" y="256" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Vaciar los límites («n/a»)</tspan></text><rect x="310" y="256" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">20 de 20</tspan></text><rect x="430" y="256" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Borrar lo no medido («nada»)</tspan></text><rect x="810" y="256" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0 de 20</tspan></text><rect x="10" y="306" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Dejar el entorno incompleto</tspan></text><rect x="310" y="306" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">20 de 20</tspan></text><rect x="430" y="306" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="810" y="306" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="10" y="356" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="381.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Cambiar el umbral sin el plan</tspan></text><rect x="310" y="356" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">20 de 20</tspan></text><rect x="430" y="356" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="810" y="356" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="10" y="410" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Detecta 140 de 240 (58 %) y las 100 que se escapan son coherentes: el informe se contradice solo cuando algo se olvidó, no</tspan></text><text x="470" y="451.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cuando se eligió. El hash prueba que los datos no cambiaron, no que sean los correctos; el plan con hash prueba el orden</tspan></text><text x="470" y="468.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">solo si se registró antes (por ejemplo, en un commit anterior).</tspan></text><text x="470" y="507.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
