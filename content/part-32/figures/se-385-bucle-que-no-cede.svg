<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 307" width="980" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Latidos de una tarea vecina emitidos antes de que termine un cálculo de 200 000 vueltas (asyncio)</title><desc id="d">Barras con los latidos que una tarea vecina logra emitir mientras otra calcula en el mismo bucle de eventos: un latido de 20 si el cálculo nunca cede, 5 si cede cada 50 000 vueltas y 20 de 20 si cede cada 10 000 o cada 1 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="307" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Sin ceder nunca</tspan></text><rect x="310" y="16" width="22" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="340" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="340" dy="0">1 de 20 latidos</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Cede cada 50 000 vueltas</tspan></text><rect x="310" y="60" width="110" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="428" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="428" dy="0">5 de 20</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Cede cada 10 000 vueltas</tspan></text><rect x="310" y="104" width="440" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="758" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758" dy="0">20 de 20</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Cede cada 1 000 vueltas</tspan></text><rect x="310" y="148" width="440" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="758" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758" dy="0">20 de 20</tspan></text><rect x="10" y="196" width="960" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Un bucle de eventos es un solo hilo: una tarea que no espera no deja pasar a ninguna otra. Se cuentan latidos en vez de</tspan></text><text x="490" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">milisegundos para que el resultado no dependa del equipo. Ceder más a menudo reparte mejor, a costa de más cambios de contexto</tspan></text><text x="490" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">que esta medida no cuenta.</tspan></text><text x="490" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
