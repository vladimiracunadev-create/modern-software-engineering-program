<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 555" width="940" height="555" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un grafo de ataque de 12 aristas: costo mínimo para alterar una nota tras cada decisión de defensa</title><desc id="d">Tabla: en el grafo de ataque de la plataforma el camino más barato cuesta 7 por la cuenta docente; corregir la inyección SQL lo deja en 7; bloquear en orden el camino más barato lo sube a 8 tres veces y a 27 tras el cuarto bloqueo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="555" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Decisión de defensa</tspan></text><rect x="340" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Costo mínimo</tspan></text><rect x="460" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Camino más barato resultante</tspan></text><rect x="10" y="56" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Línea base</tspan></text><rect x="340" y="56" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">7</tspan></text><rect x="460" y="56" width="464" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="80.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">internet → cuenta docente (phishing, 6) → alterar nota (1); 4</tspan></text><text x="692" y="96.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">rutas de costo 10 o menos</tspan></text><rect x="10" y="120" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Corregir la inyección SQL (+20 de costo)</tspan></text><rect x="340" y="120" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">7</tspan></text><rect x="460" y="120" width="464" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">El camino más barato no cambia; quedan 3 rutas de costo 10 o menos</tspan></text><rect x="10" y="184" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Bloquear el camino más barato</tspan></text><rect x="340" y="184" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">8</tspan></text><rect x="460" y="184" width="464" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">internet → inyección SQL → base de datos directa → alterar nota</tspan></text><rect x="10" y="248" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="280.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Bloquear el segundo camino</tspan></text><rect x="340" y="248" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">8</tspan></text><rect x="460" y="248" width="464" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">internet → cuenta de estudiante → rol elevado → alterar nota</tspan></text><rect x="10" y="312" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="344.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Bloquear el tercer camino</tspan></text><rect x="340" y="312" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">8</tspan></text><rect x="460" y="312" width="464" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">internet → token de servicio filtrado → alterar nota</tspan></text><rect x="10" y="376" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="408.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Bloquear el cuarto camino</tspan></text><rect x="340" y="376" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="408.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">27</tspan></text><rect x="460" y="376" width="464" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="400.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Ninguna ruta de costo 10 o menos; el mínimo ahora es la cuenta</tspan></text><text x="692" y="416.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">docente con +20</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Arreglar lo que más asusta (la inyección) no movió el mínimo porque ese no era el camino más barato. Hicieron falta cuatro</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">bloqueos, uno por camino, para pasar de 7 a 27. Los costos de las aristas son una escala del autor, no una medición de</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">atacantes reales.</tspan></text><text x="470" y="541.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
