43" dy="0">2 090</tspan></text><rect x="245.983" y="225.103" width="51.0813" height="169.897" rx="3" fill="#102a43"/><text x="271.524" y="219.103" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="271.524" dy="0">5 000</tspan></text><rect x="301.065" y="317.915" width="51.0813" height="77.0852" rx="3" fill="#087f8c"/><text x="326.605" y="311.915" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="326.605" dy="0">590</tspan></text><text x="243.983" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="243.983" dy="0">10 ms CPU + 90 ms espera</tspan></text><rect x="406.227" y="164.897" width="51.0813" height="230.103" rx="3" fill="#6b7c86"/><text x="431.768" y="158.897" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="431.768" dy="0">20 000</tspan></text><rect x="461.309" y="169.449" width="51.0813" height="225.551" rx="3" fill="#946512"/><text x="486.849" y="163.449" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="486.849" dy="0">18 010</tspan></text><rect x="516.39" y="225.103" width="51.0813" height="169.897" rx="3" fill="#102a43"/><text x="541.931" y="219.103" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="541.931" dy="0">5 000</tspan></text><rect x="571.471" y="229.582" width="51.0813" height="165.418" rx="3" fill="#087f8c"/><text x="597.012" y="223.582" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597.012" dy="0">4 510</tspan></text><text x="514.39" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.39" dy="0">90 ms CPU + 10 ms espera</tspan></text><rect x="676.634" y="164.897" width="51.0813" height="230.103" rx="3" fill="#6b7c86"/><text x="702.175" y="158.897" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.175" dy="0">20 000</tspan></text><rect x="731.715" y="164.897" width="51.0813" height="230.103" rx="3" fill="#946512"/><text x="757.256" y="158.897" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="757.256" dy="0">20 000</tspan></text><rect x="786.797" y="225.103" width="51.0813" height="169.897" rx="3" fill="#102a43"/><text x="812.337" y="219.103" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="812.337" dy="0">5 000</tspan></text><rect x="841.878" y="225.103" width="51.0813" height="169.897" rx="3" fill="#087f8c"/><text x="867.419" y="219.103" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="867.419" dy="0">5 000</tspan></text><text x="784.797" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.797" dy="0">100 ms CPU + 0 espera</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Concurrencia y paralelismo resuelven problemas distintos: solapar esperas ayuda cuando hay espera (barra dorada baja a la</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">izquierda y se pega a la gris a la derecha); repartir CPU ayuda cuando hay CPU (barra azul igual en los tres grupos). Un</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hilo que bloquea mientras espera gasta un núcleo entero. Es un planificador en tiempo virtual escrito por el autor, no una</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">medición de Python ni de un sistema operativo.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
