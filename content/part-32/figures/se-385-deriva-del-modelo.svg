<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">300 cambios en un año, 24 cruzan una frontera de confianza: días con la frontera sin modelar</title><desc id="d">Tabla: con una sola revisión inicial la frontera nueva queda sin modelar 209,3 días de media; con revisión trimestral 53,3; con un disparador por cambio que solo ve la mitad de las fronteras 103,0; y con disparador más revisión trimestral 25,0 días de media y 88 de máximo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Política de revisión</tspan></text><rect x="570" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">Días sin modelar,</tspan></text><text x="667" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">media</tspan></text><rect x="770" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Máximo</tspan></text><rect x="10" y="56" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Revisar el modelo una sola vez al empezar</tspan></text><rect x="570" y="56" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">209,3</tspan></text><rect x="770" y="56" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">364</tspan></text><rect x="10" y="108" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Revisión trimestral (días 90, 180, 270 y 360)</tspan></text><rect x="570" y="108" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">53,3</tspan></text><rect x="770" y="108" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">89</tspan></text><rect x="10" y="160" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Revisión al cambiar una frontera (la regla ve 12 de 24)</tspan></text><rect x="570" y="160" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">103,0</tspan></text><rect x="770" y="160" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">364</tspan></text><rect x="10" y="212" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Por cambio de frontera y además trimestral</tspan></text><rect x="570" y="212" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">25,0</tspan></text><rect x="770" y="212" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">88</tspan></text><rect x="10" y="268" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Ninguna política llega a cero: el disparador por cambio solo acierta donde la regla ve la frontera (12 de 24 en esta</tspan></text><text x="470" y="309.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">simulación) y la revisión periódica acota lo que la regla no ve. La combinación es la única que cierra el peor caso por</tspan></text><text x="470" y="326.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">debajo de los 90 días.</tspan></text><text x="470" y="365.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
