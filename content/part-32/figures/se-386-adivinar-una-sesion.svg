<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 377" width="940" height="377" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántos intentos necesita alguien para quedarse con una sesión según cómo se generó el identificador</title><desc id="d">Tabla: un identificador secuencial se adivina en unos 99 intentos entre 10 000 sesiones activas; un generador sembrado con la hora del inicio de sesión se recupera probando 3 601 semillas de 7 201; un token de 128 bits del sistema exige del orden de 3,4 por 10 elevado a 34 intentos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="377" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Cómo se generó el identificador</tspan></text><rect x="390" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Intentos hasta acertar</tspan></text><rect x="590" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Consecuencia</tspan></text><rect x="10" y="56" width="374" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="85.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Identificador secuencial en un espacio de 1 000 000</tspan></text><text x="197" y="101.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">con 10 000 sesiones</tspan></text><rect x="390" y="56" width="194" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="93.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">99 (se esperan 100)</tspan></text><rect x="590" y="56" width="334" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="85.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Se acierta una sesión ajena adivinando; el</tspan></text><text x="757" y="101.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">espacio efectivo es 1 de cada 100</tspan></text><rect x="10" y="130" width="374" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="167.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Semilla del generador = segundo del inicio de sesión</tspan></text><rect x="390" y="130" width="194" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="167.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">3 601 de 7 201 candidatos</tspan></text><rect x="590" y="130" width="334" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="159.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">El token de la víctima se recupera sabiendo la</tspan></text><text x="757" y="175.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">hora del inicio con ±1 hora</tspan></text><rect x="10" y="204" width="374" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="233.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">128 bits del generador criptográfico del sistema</tspan></text><text x="197" y="249.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">(secrets)</tspan></text><rect x="390" y="204" width="194" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="241.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">3,4 × 10^34 esperados</tspan></text><rect x="590" y="204" width="334" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="233.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Adivinar no es el camino; quedan el robo del</tspan></text><text x="757" y="249.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">token y la fijación de sesión</tspan></text><rect x="10" y="282" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="306.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un token largo no es seguro si su origen es predecible: la longitud no es la entropía. La seguridad real de la tercera fila</tspan></text><text x="470" y="323.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">depende de que el token no se filtre, caduque y se invalide al cerrar sesión, nada de lo cual mide este experimento.</tspan></text><text x="470" y="363.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
