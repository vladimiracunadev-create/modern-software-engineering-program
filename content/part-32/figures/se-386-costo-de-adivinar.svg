<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una hora de un núcleo contra 10 000 contraseñas filtradas: cuántas caen según cómo se guardaron</title><desc id="d">Tabla: con una función de una vuelta, una hora de un núcleo rompe el 70 por ciento de las cuentas con o sin sal en el mejor caso del modelo; con 600 000 iteraciones de PBKDF2 solo el 22,5 por ciento sin sal y el 0,9 por ciento con sal por usuario.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Función de derivación</tspan></text><rect x="410" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">ms por hash</tspan></text><rect x="550" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">Rotas sin sal</tspan></text><rect x="720" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Rotas con sal por</tspan></text><text x="822" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">usuario</tspan></text><rect x="10" y="56" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">SHA-256 de una vuelta</tspan></text><rect x="410" y="56" width="134" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">0,0025</tspan></text><rect x="550" y="56" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">70,0 %</tspan></text><rect x="720" y="56" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">46,2 %</tspan></text><rect x="10" y="108" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">PBKDF2-HMAC-SHA256, 1 000 iteraciones</tspan></text><rect x="410" y="108" width="134" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">2,38</tspan></text><rect x="550" y="108" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">70,0 %</tspan></text><rect x="720" y="108" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">9,0 %</tspan></text><rect x="10" y="160" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">PBKDF2-HMAC-SHA256, 600 000 iteraciones</tspan></text><rect x="410" y="160" width="134" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">633</tspan></text><rect x="550" y="160" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">22,5 %</tspan></text><rect x="720" y="160" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0,9 %</tspan></text><rect x="10" y="212" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">scrypt (N = 2^14, r = 8, p = 1)</tspan></text><rect x="410" y="212" width="134" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">72,4</tspan></text><rect x="550" y="212" width="164" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">36,7 %</tspan></text><rect x="720" y="212" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">2,4 %</tspan></text><rect x="10" y="268" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con sal, el atacante paga cada candidato una vez por usuario: 10 000 veces más. El costo de la función decide qué parte del</tspan></text><text x="470" y="309.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">70 % de contraseñas «de diccionario» alcanza. La distribución de contraseñas (Zipf, exponente 0,8), el 30 % imposible de</tspan></text><text x="470" y="326.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">adivinar y el núcleo único son supuestos del autor.</tspan></text><text x="470" y="365.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lectura de reloj de un equipo Windows 11 (CPython 3.12.9); en otro equipo los milisegundos cambian.</tspan></text></svg>
