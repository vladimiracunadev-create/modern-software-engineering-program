<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos hilos suben un contador dos veces cada uno: valor final en todas las intercalaciones (correcto: 4)</title><desc id="d">Barras apiladas horizontales con el valor final del contador en todas las intercalaciones: sin cerrojo, de 70 intercalaciones solo 6 terminan en 4, 32 terminan en 3 y 32 en 2 sin aviso; con un cerrojo alrededor de cada incremento solo son posibles 6 intercalaciones y todas terminan en 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="330" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos hilos suben un contador dos veces cada uno: valor final en todas las intercalaciones (correcto: 4)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Final = 4 (correcto)</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Final = 3</tspan></text><rect x="330.66" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="350.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="350.66" dy="0">Final = 2</tspan></text><line x1="284" y1="77" x2="284" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="165" x2="284" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="431.925" y1="77" x2="431.925" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="431.925" y1="165" x2="431.925" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="431.925" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="431.925" dy="0">20</tspan></text><line x1="579.85" y1="77" x2="579.85" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="579.85" y1="165" x2="579.85" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="579.85" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="579.85" dy="0">40</tspan></text><line x1="727.775" y1="77" x2="727.775" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="727.775" y1="165" x2="727.775" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="727.775" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727.775" dy="0">60</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">80</tspan></text><line x1="284" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Sin cerrojo: leer, sumar, escribir</tspan></text><text x="274" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Con cerrojo alrededor de cada</tspan></text><text x="274" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">incremento</tspan></text><rect x="284" y="84" width="44.3775" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="306.189" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="306.189" dy="0">6</tspan></text><rect x="328.377" y="84" width="236.68" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="446.717" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="446.717" dy="0">32</tspan></text><rect x="565.058" y="84" width="236.68" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="683.398" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="683.398" dy="0">32</tspan></text><text x="808.738" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="808.738" dy="0">70</tspan></text><rect x="284" y="128" width="44.3775" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="306.189" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="306.189" dy="0">6</tspan></text><rect x="328.377" y="128" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="328.377" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="335.377" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="335.377" dy="0">6</tspan></text><text x="579.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="579.85" dy="0">Intercalaciones posibles</tspan></text><rect x="10" y="223" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuatro hilos reales de CPython 3.12 con 100 000 incrementos sin cerrojo dieron 400 000 en tres ejecuciones: el defecto</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">existe y no se vio. Que una prueba pase no demuestra que no haya carrera; enumerar o forzar el orden sí la expone.</tspan></text><text x="470" y="312.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
