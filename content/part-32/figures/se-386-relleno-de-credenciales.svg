<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 555" width="940" height="555" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Relleno de credenciales contra 5 000 cuentas: cuántas de las 100 con contraseña reutilizada se comprometen</title><desc id="d">Tabla: sin defensas se comprometen 100 de 100 cuentas con contraseña reutilizada; un límite por dirección IP y un bloqueo por cuenta no cambian la cifra; el segundo factor con 30 por ciento de adopción la baja a 73; el rechazo de contraseñas filtradas a 33; ambos a 24.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="555" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Defensa</tspan></text><rect x="380" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Cuentas</tspan></text><text x="452" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">comprometidas</tspan></text><rect x="530" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Por qué</tspan></text><rect x="10" y="56" width="364" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Ninguna defensa</tspan></text><rect x="380" y="56" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">100</tspan></text><rect x="530" y="56" width="394" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">Todas las cuentas con contraseña reutilizada</tspan></text><rect x="10" y="120" width="364" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Límite de 5 intentos por hora por dirección IP</tspan></text><rect x="380" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">100</tspan></text><rect x="530" y="120" width="394" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">2 000 direcciones prueban las 5 000 cuentas en una hora</tspan></text><rect x="10" y="184" width="364" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Bloqueo de la cuenta tras 5 fallos</tspan></text><rect x="380" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">100</tspan></text><rect x="530" y="184" width="394" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="208.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">El relleno usa un intento por cuenta; un atacante que</tspan></text><text x="727" y="224.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">falle a propósito bloquearía a las 5 000</tspan></text><rect x="10" y="248" width="364" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="280.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Segundo factor con 30 % de adopción</tspan></text><rect x="380" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">73</tspan></text><rect x="530" y="248" width="394" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">Protege solo a quien lo activó</tspan></text><rect x="10" y="312" width="364" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="344.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Rechazo de contraseñas filtradas (cubre el 60 %)</tspan></text><rect x="380" y="312" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">33</tspan></text><rect x="530" y="312" width="394" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">Depende de qué corpus de filtraciones se consulta</tspan></text><rect x="10" y="376" width="364" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="408.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Segundo factor y rechazo de filtradas</tspan></text><rect x="380" y="376" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="408.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">24</tspan></text><rect x="530" y="376" width="394" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="408.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">Las defensas se complementan; ninguna llega a cero</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Dos controles muy citados no frenan este ataque porque el relleno reparte un intento por cuenta entre muchas direcciones.</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El bloqueo por cuenta, además, convierte al atacante en un denegador de servicio contra sus víctimas. Las tasas de</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reutilización (2 %), adopción (30 %) y cobertura del corpus (60 %) son supuestos del autor.</tspan></text><text x="470" y="541.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
