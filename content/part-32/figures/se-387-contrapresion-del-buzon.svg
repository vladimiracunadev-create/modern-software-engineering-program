<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un productor de 3 mensajes por turno y un consumidor de 1 por turno, 1 000 turnos: adónde va el exceso</title><desc id="d">Barras apiladas horizontales de los 3 000 mensajes producidos: el consumidor procesa siempre 1 000; sin límite quedan 2 000 en cola y el último espera 2 000 turnos; con una cola de 100 se rechazan 1 901 y quedan 99 con espera de 99 turnos; con una cola de 10 se rechazan 1 991 y quedan 9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un productor de 3 mensajes por turno y un consumidor de 1 por turno, 1 000 turnos: adónde va el exceso</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Procesados</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">En cola al final</tspan></text><rect x="308.04" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="328.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.04" dy="0">Rechazados</tspan></text><line x1="174" y1="77" x2="174" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="174" y1="197" x2="174" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="174" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="174" dy="0">0</tspan></text><line x1="407.9" y1="77" x2="407.9" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="407.9" y1="197" x2="407.9" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="407.9" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407.9" dy="0">1 000</tspan></text><line x1="641.8" y1="77" x2="641.8" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="641.8" y1="197" x2="641.8" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="641.8" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="641.8" dy="0">2 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="197" x2="875.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">3 000</tspan></text><line x1="174" y1="197" x2="875.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">Cola sin límite</tspan></text><text x="164" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">Cola de 100</tspan></text><text x="164" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">Cola de 10</tspan></text><rect x="174" y="84" width="233.9" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="290.95" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290.95" dy="0">1 000</tspan></text><rect x="407.9" y="84" width="467.8" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="641.8" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="641.8" dy="0">2 000</tspan></text><rect x="875.7" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3 000</tspan></text><rect x="174" y="124" width="233.9" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="290.95" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290.95" dy="0">1 000</tspan></text><rect x="407.9" y="124" width="23.1561" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="431.056" y="124" width="444.644" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="653.378" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="653.378" dy="0">1 901</tspan></text><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3 000</tspan></text><rect x="174" y="164" width="233.9" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="290.95" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290.95" dy="0">1 000</tspan></text><rect x="407.9" y="164" width="2.1051" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="410.005" y="164" width="465.695" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="642.853" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642.853" dy="0">1 991</tspan></text><text x="882.7" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3 000</tspan></text><text x="524.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="524.85" dy="0">Mensajes producidos en 1 000 turnos</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La cola no crea capacidad: solo decide dónde espera el exceso. Sin límite, el exceso se convierte en latencia creciente y</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">memoria (el último espera 2 000 turnos); con límite se convierte en un rechazo que el emisor puede ver y manejar (espera de</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">99 y de 9 turnos). Las tasas de 3 y 1 son supuestos del autor.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
