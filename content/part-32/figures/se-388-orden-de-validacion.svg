<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" width="940" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">84 variantes de 12 cargas (porcentaje, doble porcentaje, ancho completo, NUL) y 10 nombres legítimos</title><desc id="d">Tabla: validar antes de decodificar acepta 67 variantes y 48 son peligrosas después; decodificar y normalizar primero con lista negra acepta 50 y 31 son peligrosas; con lista blanca solo acepta 5, ninguna peligrosa, pero rechaza 5 de 10 nombres legítimos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="345" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Orden y tipo de validación</tspan></text><rect x="460" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Variantes</tspan></text><text x="532" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">aceptadas</tspan></text><rect x="610" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Peligrosas tras</tspan></text><text x="692" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">aceptar</tspan></text><rect x="780" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Legítimos</tspan></text><text x="852" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">rechazados de 10</tspan></text><rect x="10" y="56" width="444" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Validar la forma recibida y decodificar después</tspan></text><rect x="460" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">67</tspan></text><rect x="610" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">48</tspan></text><rect x="780" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0</tspan></text><rect x="10" y="114" width="444" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Decodificar, normalizar y validar con lista negra</tspan></text><rect x="460" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">50</tspan></text><rect x="610" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">31</tspan></text><rect x="780" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0</tspan></text><rect x="10" y="172" width="444" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Decodificar, normalizar y validar con lista blanca</tspan></text><rect x="460" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">5</tspan></text><rect x="610" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">0</tspan></text><rect x="780" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">5</tspan></text><rect x="10" y="234" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cambiar el orden reduce el daño (de 48 a 31) y la lista negra sigue incompleta. La lista blanca elimina lo peligroso y</tspan></text><text x="470" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuesta falsos rechazos: la regla ASCII estricta rechaza «María_López.pdf» y «informe final.pdf». Ese costo es una decisión</tspan></text><text x="470" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de producto, no un error de la lista.</tspan></text><text x="470" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
