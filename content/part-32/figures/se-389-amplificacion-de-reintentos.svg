<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 307" width="980" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intentos que recibe el servicio final por cada solicitud, si cada capa reintenta 2 veces y el servicio falla siempre</title><desc id="d">Barras: con 2 reintentos por capa, el servicio del fondo recibe 3 intentos con una capa, 9 con dos, 27 con tres y 81 con cuatro por cada solicitud del usuario.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="307" fill="#ffffff"/><text x="190" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">1 capa</tspan></text><rect x="200" y="16" width="18" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="226" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="226" dy="0">3 intentos</tspan></text><text x="190" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">2 capas</tspan></text><rect x="200" y="60" width="54" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="262" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="262" dy="0">9 intentos</tspan></text><text x="190" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">3 capas</tspan></text><rect x="200" y="104" width="162" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="370" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="370" dy="0">27 intentos</tspan></text><text x="190" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">4 capas</tspan></text><rect x="200" y="148" width="486" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="694" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="694" dy="0">81 intentos</tspan></text><rect x="10" y="196" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El factor es (1 + reintentos) elevado al número de capas. Con un presupuesto de reintentos del 10 % por capa, los intentos por</tspan></text><text x="490" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">solicitud con el servicio caído quedaron en 1,10 en vez de 3,00, y con un reintento con espera aleatoria el pico bajó de 1 000 a</tspan></text><text x="490" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">159 reintentos por ventana de 10 ms.</tspan></text><text x="490" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
