<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 363" width="940" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Consultas para falsificar una etiqueta de autenticación de 8 bytes según cómo se compara</title><desc id="d">Tabla: si la comparación termina en el primer byte distinto y el atacante ve cuántos bytes coincidieron, recupera la etiqueta de 8 bytes en 2 002 consultas; con una comparación de tiempo constante la señal es constante; sin señal la fuerza bruta esperada es de 9,2 por 10 elevado a 18 pruebas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="363" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Comparación</tspan></text><rect x="430" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Consultas</tspan></text><rect x="630" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Efecto</tspan></text><rect x="10" y="56" width="414" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Comparación que termina en el primer byte distinto</tspan></text><rect x="430" y="56" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">2 002</tspan></text><rect x="630" y="56" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="80.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Etiqueta de 8 bytes recuperada byte a</tspan></text><text x="777" y="96.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">byte</tspan></text><rect x="10" y="120" width="414" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Comparación de tiempo constante</tspan></text><rect x="430" y="120" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">—</tspan></text><rect x="630" y="120" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="144.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">La señal toma 1 valor: no hay nada que</tspan></text><text x="777" y="160.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">medir</tspan></text><rect x="10" y="184" width="414" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Fuerza bruta sin señal</tspan></text><rect x="430" y="184" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">9,2 × 10^18 esperados</tspan></text><rect x="630" y="184" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">2^63 pruebas medias para 64 bits</tspan></text><rect x="10" y="252" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Pasar de 9,2 × 10^18 a 2 002 es el valor de un oráculo de pasos. Aquí la señal es un contador perfecto; por la red real el</tspan></text><text x="470" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ruido la degrada y por eso existen límites prácticos (Crosby et al. los miden), pero un atacante con muchas repeticiones</tspan></text><text x="470" y="310.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los reduce. hmac.compare_digest elimina la señal en vez de confiar en el ruido.</tspan></text><text x="470" y="349.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
