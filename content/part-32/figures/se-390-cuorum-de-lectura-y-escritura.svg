<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres réplicas: caídas que tolera cada cuórum al escribir y al leer, y si garantiza ver lo último</title><desc id="d">Dispersión con cinco cuórums de tres réplicas según las caídas que toleran al escribir y al leer: W=2 y R=2 (1 y 1), W=3 y R=1 (0 y 2) y W=1 y R=3 (2 y 0) garantizan leer lo último porque W + R supera 3; W=1 y R=1 (2 y 2) y W=2 y R=1 (1 y 2) no lo garantizan. Los que garantizan caen sobre una diagonal: lo que se gana en una operación se pierde en la otra.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres réplicas: caídas que tolera cada cuórum al escribir y al leer, y si garantiza ver lo último</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Garantiza leer lo último (W + R &gt; 3)</tspan></text><rect x="335.44" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="355.44" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="355.44" dy="0">No lo garantiza</tspan></text><line x1="63.54" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="387" x2="63.54" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="237" x2="63.54" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="87" x2="63.54" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="87" x2="63.54" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="81.54" y1="87" x2="81.54" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="81.54" y1="387" x2="81.54" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="81.54" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81.54" dy="0">0</tspan></text><line x1="486.77" y1="87" x2="486.77" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="486.77" y1="387" x2="486.77" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="486.77" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.77" dy="0">1</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">2</tspan></text><line x1="63.54" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Caídas toleradas al leer (N − R)</text><text x="486.77" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="486.77" dy="0">Caídas toleradas al escribir (N − W)</tspan></text><circle cx="486.77" cy="237" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="486.77" y="226" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="486.77" dy="0">W=2, R=2</tspan></text><circle cx="81.54" cy="87" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="91.54" y="91.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="91.54" dy="0">W=3, R=1</tspan></text><circle cx="892" cy="387" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">W=1, R=3</tspan></text><rect x="886.5" y="81.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="882" y="91.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">W=1, R=1</tspan></text><rect x="481.27" y="81.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="486.77" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="486.77" dy="0">W=2, R=1</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La garantía sale de la intersección: toda lectura toca al menos una réplica que vio la última escritura cuando W + R &gt; N. A</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cambio se pierde tolerancia a caídas en una de las dos operaciones; con 1 % de caída por réplica la disponibilidad va del</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">97,03 % (W=3) al 99,9999 % (W=1). Sin reloj ni fallos parciales de red: es el modelo de conjuntos alcanzables, no un</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sistema real.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Enumeración exacta de subconjuntos y cálculo binomial; sin simulación aleatoria.</tspan></text></svg>
