<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escáner de secretos de juguete sobre 500 líneas con 60 secretos plantados y 140 señuelos</title><desc id="d">Tabla: ningún escáner simple encuentra los 60 secretos plantados sin falsas alarmas; los patrones de proveedor detectan 40 con 24 falsas alarmas, la palabra clave 38 con 51, la entropía 45 con 21, y la combinación de patrones y palabra clave con entropía detecta 60 con 24 falsas alarmas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Estrategia</tspan></text><rect x="410" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Detectados de 60</tspan></text><rect x="560" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="627" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">Falsas alarmas</tspan></text><rect x="700" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Precisión</tspan></text><rect x="810" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">Exhaustividad</tspan></text><rect x="10" y="56" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Solo patrones de proveedor</tspan></text><rect x="410" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">40</tspan></text><rect x="560" y="56" width="134" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">24</tspan></text><rect x="700" y="56" width="104" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">62,5 %</tspan></text><rect x="810" y="56" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">66,7 %</tspan></text><rect x="10" y="108" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Solo palabra clave (password=, secret=)</tspan></text><rect x="410" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">38</tspan></text><rect x="560" y="108" width="134" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">51</tspan></text><rect x="700" y="108" width="104" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">42,7 %</tspan></text><rect x="810" y="108" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">63,3 %</tspan></text><rect x="10" y="160" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Solo entropía de las cadenas largas</tspan></text><rect x="410" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">45</tspan></text><rect x="560" y="160" width="134" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">21</tspan></text><rect x="700" y="160" width="104" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">68,2 %</tspan></text><rect x="810" y="160" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">75,0 %</tspan></text><rect x="10" y="212" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Patrones, y palabra clave con entropía</tspan></text><rect x="410" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">60</tspan></text><rect x="560" y="212" width="134" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">24</tspan></text><rect x="700" y="212" width="104" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">71,4 %</tspan></text><rect x="810" y="212" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">100,0 %</tspan></text><rect x="10" y="268" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La combinación llega al 100 % de exhaustividad porque se escribió conociendo los formatos plantados: es una frontera, no</tspan></text><text x="470" y="309.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una tasa de detección. Las 24 falsas alarmas son ejemplos de documentación con forma de secreto. Todas las cadenas se</tspan></text><text x="470" y="326.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">generan al ejecutar; ninguna es una credencial real.</tspan></text><text x="470" y="365.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
