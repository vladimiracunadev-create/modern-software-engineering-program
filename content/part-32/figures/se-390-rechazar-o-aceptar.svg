<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 531" width="940" height="531" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una réplica de tres aislada durante 300 de 1 000 operaciones: qué cuesta rechazar y qué cuesta aceptar</title><desc id="d">Barras agrupadas con el costo de cada política: si la réplica aislada rechaza (CP) se rechazan 97 operaciones y no hay lecturas obsoletas ni escrituras perdidas; si acepta (AP) se atienden las 1 000, pero hay 89 lecturas obsoletas y 27 escrituras del lado aislado que se descartan al reparar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="531" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una réplica de tres aislada durante 300 de 1 000 operaciones: qué cuesta rechazar y qué cuesta aceptar</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Rechazar (CP)</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Aceptar (AP)</tspan></text><line x1="274" y1="77" x2="274" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="333" x2="274" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="399.176" y1="77" x2="399.176" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="399.176" y1="333" x2="399.176" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="399.176" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="399.176" dy="0">20</tspan></text><line x1="524.352" y1="77" x2="524.352" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="524.352" y1="333" x2="524.352" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="524.352" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524.352" dy="0">40</tspan></text><line x1="649.528" y1="77" x2="649.528" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="649.528" y1="333" x2="649.528" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="649.528" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="649.528" dy="0">60</tspan></text><line x1="774.704" y1="77" x2="774.704" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="774.704" y1="333" x2="774.704" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="774.704" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="774.704" dy="0">80</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="333" x2="899.88" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">100</tspan></text><line x1="274" y1="333" x2="899.88" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Operaciones rechazadas</tspan></text><text x="264" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Lecturas obsoletas</tspan></text><text x="264" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Escrituras aceptadas por el lado</tspan></text><text x="264" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">aislado</tspan></text><text x="264" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Escrituras descartadas al reparar</tspan></text><rect x="274" y="83" width="607.104" height="24.5" rx="3" fill="#102a43"/><text x="888.104" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="888.104" dy="0">97</tspan></text><rect x="274" y="110.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="283" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="147" width="2" height="24.5" rx="3" fill="#102a43"/><text x="283" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="174.5" width="557.033" height="24.5" rx="3" fill="#c0432f"/><text x="838.033" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="838.033" dy="0">89</tspan></text><rect x="274" y="211" width="2" height="24.5" rx="3" fill="#102a43"/><text x="283" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="238.5" width="168.988" height="24.5" rx="3" fill="#c0432f"/><text x="449.988" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="449.988" dy="0">27</tspan></text><rect x="274" y="275" width="2" height="24.5" rx="3" fill="#102a43"/><text x="283" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="302.5" width="168.988" height="24.5" rx="3" fill="#c0432f"/><text x="449.988" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="449.988" dy="0">27</tspan></text><text x="586.94" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="586.94" dy="0">Operaciones de 1 000</tspan></text><rect x="10" y="391" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Durante la partición no se puede conservar a la vez la respuesta a todas las peticiones y la coherencia con lo último</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">escrito: rechazar atiende 903 operaciones de 1 000 y aceptar las atiende todas. Rechazar cuesta disponibilidad visible;</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">aceptar cuesta un trabajo de reparación que hay que definir antes. La carga y la duración de la partición son supuestos del</tspan></text><text x="470" y="465.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">autor.</tspan></text><text x="470" y="513.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
