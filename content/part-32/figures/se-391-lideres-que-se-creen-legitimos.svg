<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 595" width="940" height="595" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco nodos y una partición: líderes que se creen legítimos según la regla de elección</title><desc id="d">Barras agrupadas horizontales con los líderes simultáneos: con la regla «el identificador mayor que veo vivo», una partición de cinco nodos produce dos o tres líderes a la vez; con la regla de mayoría nunca hay más de uno y en un reparto 2, 2, 1 no hay ninguno. Las 15 biparticiones posibles producen dos líderes con la primera regla y nunca más de uno con la segunda.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="595" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco nodos y una partición: líderes que se creen legítimos según la regla de elección</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Regla «el mayor que veo»</tspan></text><rect x="244.96" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="264.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Regla de mayoría</tspan></text><line x1="214" y1="77" x2="214" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="397" x2="214" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="445.313" y1="77" x2="445.313" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="445.313" y1="397" x2="445.313" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="445.313" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="445.313" dy="0">1</tspan></text><line x1="676.627" y1="77" x2="676.627" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="676.627" y1="397" x2="676.627" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="676.627" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="676.627" dy="0">2</tspan></text><line x1="907.94" y1="77" x2="907.94" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="397" x2="907.94" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">3</tspan></text><line x1="214" y1="397" x2="907.94" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Sin partición</tspan></text><text x="204" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Partición en 2 y 3</tspan></text><text x="204" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Partición en 1 y 4</tspan></text><text x="204" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Partición en 1, 1 y 3</tspan></text><text x="204" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Partición en 2, 2 y 1</tspan></text><rect x="214" y="83" width="231.313" height="24.5" rx="3" fill="#c0432f"/><text x="452.313" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="452.313" dy="0">1</tspan></text><rect x="214" y="110.5" width="231.313" height="24.5" rx="3" fill="#087f8c"/><text x="452.313" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="452.313" dy="0">1</tspan></text><rect x="214" y="147" width="462.627" height="24.5" rx="3" fill="#c0432f"/><text x="683.627" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="683.627" dy="0">2</tspan></text><rect x="214" y="174.5" width="231.313" height="24.5" rx="3" fill="#087f8c"/><text x="452.313" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="452.313" dy="0">1</tspan></text><rect x="214" y="211" width="462.627" height="24.5" rx="3" fill="#c0432f"/><text x="683.627" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="683.627" dy="0">2</tspan></text><rect x="214" y="238.5" width="231.313" height="24.5" rx="3" fill="#087f8c"/><text x="452.313" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="452.313" dy="0">1</tspan></text><rect x="214" y="275" width="693.94" height="24.5" rx="3" fill="#c0432f"/><text x="914.94" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="214" y="302.5" width="231.313" height="24.5" rx="3" fill="#087f8c"/><text x="452.313" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="452.313" dy="0">1</tspan></text><rect x="214" y="339" width="693.94" height="24.5" rx="3" fill="#c0432f"/><text x="914.94" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="214" y="366.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="223" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="223" dy="0">0</tspan></text><text x="560.97" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="560.97" dy="0">Líderes que se creen legítimos</tspan></text><rect x="10" y="455" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La mayoría resuelve el cerebro dividido a cambio de disponibilidad: el grupo sin mayoría no elige a nadie (reparto 2, 2,</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">1). Dos mayorías siempre se cruzan en algún nodo, y de ahí sale la seguridad. En las 15 biparticiones posibles de 5 nodos</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">la primera regla da 2 líderes en las 15 y la mayoría nunca más de 1. Es un modelo de conjuntos de nodos, sin mensajes ni</tspan></text><text x="470" y="529.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">tiempo.</tspan></text><text x="470" y="577.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Enumeración exacta de particiones; sin simulación aleatoria.</tspan></text></svg>
