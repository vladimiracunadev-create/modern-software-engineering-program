<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 411" width="940" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mismo conteo (312 estudiantes) consultado Q veces con ruido de Laplace nuevo, ε = 0,5 por consulta</title><desc id="d">Tabla: una consulta con epsilon 0,5 tiene un error medio de 2 estudiantes; promediar 100 consultas repetidas lo baja a 0,2 y promediar 10 000 a 0,02, a costa de un presupuesto acumulado de privacidad que pasa de 0,5 a 5 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="411" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Consultas repetidas (Q)</tspan></text><rect x="370" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Error medio del promedio</tspan></text><rect x="670" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">ε acumulado</tspan></text><rect x="10" y="56" width="354" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">1</tspan></text><rect x="370" y="56" width="294" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">2,034</tspan></text><rect x="670" y="56" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">0,5</tspan></text><rect x="10" y="104" width="354" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="128.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">10</tspan></text><rect x="370" y="104" width="294" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">0,753</tspan></text><rect x="670" y="104" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">5</tspan></text><rect x="10" y="152" width="354" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="176.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">100</tspan></text><rect x="370" y="152" width="294" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">0,209</tspan></text><rect x="670" y="152" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">50</tspan></text><rect x="10" y="200" width="354" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="224.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">1 000</tspan></text><rect x="370" y="200" width="294" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">0,076</tspan></text><rect x="670" y="200" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">500</tspan></text><rect x="10" y="248" width="354" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="272.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">10 000</tspan></text><rect x="370" y="248" width="294" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">0,022</tspan></text><rect x="670" y="248" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">5 000</tspan></text><rect x="10" y="300" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una sola respuesta con ruido protege y mil respuestas promediadas devuelven el valor verdadero: el ruido por consulta no es</tspan></text><text x="470" y="341.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la garantía, el presupuesto total sí. Con una consulta el error medio vale 9,93 con ε = 0,1, 2,00 con 0,5, 0,99 con 1 y</tspan></text><text x="470" y="358.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">0,20 con 5.</tspan></text><text x="470" y="397.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
