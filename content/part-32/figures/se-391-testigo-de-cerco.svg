<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 502" width="940" height="502" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Titular del arrendamiento que se pausa más de 10 s y escribe después de que otro tomó su lugar</title><desc id="d">Barras con las tareas de 10 000 cuyo arrendamiento de 10 segundos caduca antes de que el titular escriba, según la pausa media: 1 con pausas de 1 s, 73 con 2 s, 854 con 4 s y 2 918 con 8 s. Sin testigo de cerco el almacén acepta esas escrituras tardías y con testigo las rechaza todas (849 en la corrida de media 4 s).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="502" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Titular del arrendamiento que se pausa más de 10 s y escribe después de que otro tomó su lugar</tspan></text><line x1="93.7" y1="327" x2="920" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="327" x2="93.7" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="240.333" x2="920" y2="240.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="240.333" x2="93.7" y2="240.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="244.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="153.667" x2="920" y2="153.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="153.667" x2="93.7" y2="153.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="158.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="67" x2="93.7" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3 000</tspan></text><line x1="93.7" y1="67" x2="93.7" y2="327" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 197)">Tareas de 10 000</text><rect x="114.357" y="325" width="165.26" height="2" rx="3" fill="#c0432f"/><text x="196.987" y="319" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="196.987" dy="0">1</tspan></text><text x="196.987" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.987" dy="0">Pausa media 1 s</tspan></text><rect x="320.933" y="320.673" width="165.26" height="6.32667" rx="3" fill="#c0432f"/><text x="403.562" y="314.673" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="403.562" dy="0">73</tspan></text><text x="403.562" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.562" dy="0">Pausa media 2 s</tspan></text><rect x="527.507" y="252.987" width="165.26" height="74.0133" rx="3" fill="#c0432f"/><text x="610.137" y="246.987" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="610.137" dy="0">854</tspan></text><text x="610.137" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">Pausa media 4 s</tspan></text><rect x="734.082" y="74.1067" width="165.26" height="252.893" rx="3" fill="#c0432f"/><text x="816.712" y="68.1067" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="816.712" dy="0">2 918</tspan></text><text x="816.712" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">Pausa media 8 s</tspan></text><rect x="10" y="379" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">En la corrida de media 4 s hay 849 escrituras de un titular caducado (otra semilla da 854 caducados): sin testigo el</tspan></text><text x="470" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">almacén las acepta todas, con un número de cerco creciente las rechaza todas. El arrendamiento solo no basta porque el</tspan></text><text x="470" y="437.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">titular no sabe que caducó. Las pausas exponenciales son un supuesto del autor.</tspan></text><text x="470" y="484.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
