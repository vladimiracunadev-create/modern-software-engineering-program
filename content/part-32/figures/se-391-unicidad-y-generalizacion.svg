<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">5 000 estudiantes sintéticos: cuántos son únicos según cuánto se generalizan cuatro atributos</title><desc id="d">Barras agrupadas con el porcentaje de registros únicos y en grupos de menos de cinco según la generalización: con año, comuna, curso y género exactos 88,2 y 100,0 por ciento; con año en tramos de 3 y comuna a región 44,5 y 90,6; con tramos de cinco años, región y sin curso 0,0 y 0,9; con macrozona y sin curso ni género 0,0 y 0,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">5 000 estudiantes sintéticos: cuántos son únicos según cuánto se generalizan cuatro atributos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Registros únicos</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">En grupos menores de 5</tspan></text><line x1="354" y1="77" x2="354" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="333" x2="354" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="458.34" y1="77" x2="458.34" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="458.34" y1="333" x2="458.34" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="458.34" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.34" dy="0">20</tspan></text><line x1="562.68" y1="77" x2="562.68" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="562.68" y1="333" x2="562.68" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="562.68" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.68" dy="0">40</tspan></text><line x1="667.02" y1="77" x2="667.02" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="667.02" y1="333" x2="667.02" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="667.02" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.02" dy="0">60</tspan></text><line x1="771.36" y1="77" x2="771.36" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="771.36" y1="333" x2="771.36" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="771.36" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.36" dy="0">80</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="333" x2="875.7" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="354" y1="333" x2="875.7" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Año, comuna, curso y género exactos (4 689</tspan></text><text x="344" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">grupos, k = 1)</tspan></text><text x="344" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Año en tramos de 3 y comuna a región (3 268</tspan></text><text x="344" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">grupos, k = 1)</tspan></text><text x="344" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Tramos de 5 años, región, sin curso (191</tspan></text><text x="344" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">grupos, k = 3)</tspan></text><text x="344" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Tramos de 5 años, macrozona, sin curso ni</tspan></text><text x="344" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">género (12 grupos, k = 63)</tspan></text><rect x="354" y="83" width="460.139" height="24.5" rx="3" fill="#c0432f"/><text x="821.139" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="821.139" dy="0">88,2</tspan></text><rect x="354" y="110.5" width="521.7" height="24.5" rx="3" fill="#946512"/><text x="882.7" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="354" y="147" width="232.157" height="24.5" rx="3" fill="#c0432f"/><text x="593.157" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="593.157" dy="0">44,5</tspan></text><rect x="354" y="174.5" width="472.66" height="24.5" rx="3" fill="#946512"/><text x="833.66" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="833.66" dy="0">90,6</tspan></text><rect x="354" y="211" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0,0</tspan></text><rect x="354" y="238.5" width="4.6953" height="24.5" rx="3" fill="#946512"/><text x="365.695" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="365.695" dy="0">0,9</tspan></text><rect x="354" y="275" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0,0</tspan></text><rect x="354" y="302.5" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0,0</tspan></text><text x="614.85" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">% de los 5 000 registros</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ningún dato es un nombre y aun así el 88,2 % se distingue de los demás. Generalizar reduce la unicidad y también la</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">utilidad: con 12 grupos solo se puede contar por macrozona. La distribución de comunas y de años es del autor, y</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">k-anonimato no protege frente a quien conoce otros datos.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
