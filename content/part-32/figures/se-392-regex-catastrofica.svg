<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 447" width="940" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de re.match con a repetida n veces y un «!» al final: ^(a+)+$ frente a ^a+$</title><desc id="d">Tabla: el patrón con cuantificadores anidados tarda 0,88 milisegundos con 14 caracteres y 935,54 con 24, multiplicándose por unas 4 cada 2 caracteres, mientras el patrón lineal se mantiene en milésimas de milisegundo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="447" fill="#ffffff"/><rect x="10" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="117" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="117" dy="0">n (caracteres a)</tspan></text><rect x="230" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="347" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">ms con ^(a+)+$</tspan></text><rect x="470" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">ms con ^a+$</tspan></text><rect x="690" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Factor entre filas</tspan></text><rect x="10" y="56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">14</tspan></text><rect x="230" y="56" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">0,88</tspan></text><rect x="470" y="56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0,0014</tspan></text><rect x="690" y="56" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">—</tspan></text><rect x="10" y="102" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">16</tspan></text><rect x="230" y="102" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">3,97</tspan></text><rect x="470" y="102" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0,0040</tspan></text><rect x="690" y="102" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">4,5</tspan></text><rect x="10" y="148" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">18</tspan></text><rect x="230" y="148" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">13,84</tspan></text><rect x="470" y="148" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0,0045</tspan></text><rect x="690" y="148" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">3,5</tspan></text><rect x="10" y="194" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">20</tspan></text><rect x="230" y="194" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">59,99</tspan></text><rect x="470" y="194" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0,0046</tspan></text><rect x="690" y="194" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">4,3</tspan></text><rect x="10" y="240" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">22</tspan></text><rect x="230" y="240" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">230,38</tspan></text><rect x="470" y="240" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0,0050</tspan></text><rect x="690" y="240" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">3,8</tspan></text><rect x="10" y="286" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">24</tspan></text><rect x="230" y="286" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">935,54</tspan></text><rect x="470" y="286" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0,0051</tspan></text><rect x="690" y="286" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">4,1</tspan></text><rect x="10" y="336" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Dos caracteres más multiplican el tiempo por cuatro: extrapolado, 30 caracteres ocupan un hilo cerca de un minuto y 40,</tspan></text><text x="470" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">unas 17 horas. El defecto está en la expresión, no en el dato; recortar la longitud a 20 es una mitigación que se rompe si</tspan></text><text x="470" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el límite cambia. Lectura de reloj: en otro equipo cambian los milisegundos y se conserva el crecimiento.</tspan></text><text x="470" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lectura de reloj de un equipo Windows 11 (CPython 3.12.9); en otro equipo los milisegundos cambian.</tspan></text></svg>
