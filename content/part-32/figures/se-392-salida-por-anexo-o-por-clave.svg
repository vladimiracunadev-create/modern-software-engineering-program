<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 547" width="940" height="547" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">200 tareas, el 5 % se reintenta tras escribir y antes de confirmar: qué queda mal en la salida</title><desc id="d">Barras agrupadas con los defectos que deja la salida: anexar al archivo deja 9 filas duplicadas si la tarea es determinista y 14 si devuelve un valor aleatorio, con 13 claves con valores distintos; escribir por clave de tarea deja siempre 200 filas, sin duplicados ni claves con valores distintos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="547" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">200 tareas, el 5 % se reintenta tras escribir y antes de confirmar: qué queda mal en la salida</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Filas duplicadas</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Claves con valores distintos</tspan></text><line x1="71.08" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="355" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="268.333" x2="920" y2="268.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="268.333" x2="71.08" y2="268.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="272.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="181.667" x2="920" y2="181.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="181.667" x2="71.08" y2="181.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="186.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Filas o claves de 200 tareas</text><rect x="92.303" y="199" width="82.892" height="156" rx="3" fill="#c0432f"/><text x="133.749" y="193" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="133.749" dy="0">9</tspan></text><rect x="179.195" y="353" width="82.892" height="2" rx="3" fill="#946512"/><text x="220.641" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="220.641" dy="0">0</tspan></text><text x="177.195" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">Anexar · tarea determinista</tspan></text><rect x="304.533" y="112.333" width="82.892" height="242.667" rx="3" fill="#c0432f"/><text x="345.979" y="106.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="345.979" dy="0">14</tspan></text><rect x="391.425" y="129.667" width="82.892" height="225.333" rx="3" fill="#946512"/><text x="432.871" y="123.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.871" dy="0">13</tspan></text><text x="389.425" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">Anexar · valor aleatorio</tspan></text><rect x="516.763" y="353" width="82.892" height="2" rx="3" fill="#c0432f"/><text x="558.209" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="558.209" dy="0">0</tspan></text><rect x="603.655" y="353" width="82.892" height="2" rx="3" fill="#946512"/><text x="645.101" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="645.101" dy="0">0</tspan></text><text x="601.655" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">Por clave · tarea</tspan></text><text x="601.655" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">determinista</tspan></text><rect x="728.993" y="353" width="82.892" height="2" rx="3" fill="#c0432f"/><text x="770.439" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="770.439" dy="0">0</tspan></text><rect x="815.885" y="353" width="82.892" height="2" rx="3" fill="#946512"/><text x="857.331" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.331" dy="0">0</tspan></text><text x="813.885" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">Por clave · valor aleatorio</tspan></text><rect x="10" y="424" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Escribir por clave convierte el reintento en una sobrescritura del mismo resultado (200 filas siempre); anexar convierte</tspan></text><text x="470" y="465.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cada reintento en una fila más (209 y 214 filas) y, si la tarea no es determinista, en dos verdades. La tasa del 5 % y los</tspan></text><text x="470" y="482.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">valores son sintéticos; no se usó ningún sistema de procesamiento distribuido.</tspan></text><text x="470" y="529.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
