span></text><text x="264" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Hipótesis sin umbral medible</tspan></text><text x="264" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Resultado copiado de otro entorno</tspan></text><text x="264" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Reversión nunca ensayada</tspan></text><rect x="274" y="84" width="601.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="574.85" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.85" dy="0">50</tspan></text><rect x="875.7" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">50</tspan></text><rect x="274" y="124" width="397.122" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="472.561" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472.561" dy="0">33</tspan></text><rect x="671.122" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="678.122" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="678.122" dy="0">33</tspan></text><rect x="274" y="164" width="348.986" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="448.493" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="448.493" dy="0">29</tspan></text><rect x="622.986" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="629.986" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="629.986" dy="0">29</tspan></text><rect x="274" y="204" width="421.19" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="484.595" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="484.595" dy="0">35</tspan></text><rect x="695.19" y="204" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="702.19" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="702.19" dy="0">35</tspan></text><rect x="274" y="244" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="274" y="244" width="348.986" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="448.493" y="261.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="448.493" dy="0">29</tspan></text><text x="629.986" y="261.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="629.986" dy="0">29</tspan></text><rect x="274" y="284" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="274" y="284" width="288.816" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="418.408" y="301.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="418.408" dy="0">24</tspan></text><text x="569.816" y="301.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="569.816" dy="0">24</tspan></text><text x="574.85" y="361" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Mutaciones del plan</tspan></text><rect x="10" y="375" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las dos que el linter no ve son las que convierten un experimento en teatro: un resultado que no se obtuvo y una reversión</tspan></text><text x="470" y="416.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que nunca se probó. Las reglas se escribieron conociendo las mutaciones, así que cada tipo sale al 0 % o al 100 %; la</tspan></text><text x="470" y="433.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">exactitud sobre planes reales es desconocida.</tspan></text><text x="470" y="480.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
