<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 498" width="940" height="498" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter de planes de caos sobre 200 mutaciones: 147 detectadas y 53 que pasan</title><desc id="d">Barras apiladas horizontales por tipo de mutación de un plan de experimento de caos: el linter de forma detecta las 50 de campo ausente o vacío, las 33 de alcance del 100 por ciento, las 29 de aborto inalcanzable y las 35 de hipótesis sin umbral, y ninguna de las 29 de resultado copiado de otro entorno ni de las 24 de reversión nunca ensayada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="498" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Linter de planes de caos sobre 200 mutaciones: 147 detectadas y 53 que pasan</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="274" y1="77" x2="274" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="317" x2="274" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="77" x2="394.34" y2=