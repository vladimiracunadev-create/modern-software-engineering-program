<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 431" width="940" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Registro de 1 000 eventos con huellas encadenadas: 100 ataques de cada tipo</title><desc id="d">Tabla: una cadena de huellas detecta 100 de 100 modificaciones, borrados intermedios y reordenamientos, pero no detecta 0 de 100 truncamientos de los últimos eventos ni reescrituras que recalculan las huellas; con la huella final publicada fuera del sistema se detectan 100 de 100 de todos los tipos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="431" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Ataque al registro</tspan></text><rect x="480" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Solo la cadena</tspan></text><rect x="680" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Cadena y huella publicada</tspan></text><text x="802" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">fuera</tspan></text><rect x="10" y="56" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Modificar un evento</tspan></text><rect x="480" y="56" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">100 de 100</tspan></text><rect x="680" y="56" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">100 de 100</tspan></text><rect x="10" y="108" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Borrar un evento intermedio</tspan></text><rect x="480" y="108" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">100 de 100</tspan></text><rect x="680" y="108" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">100 de 100</tspan></text><rect x="10" y="160" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Reordenar dos eventos</tspan></text><rect x="480" y="160" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">100 de 100</tspan></text><rect x="680" y="160" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">100 de 100</tspan></text><rect x="10" y="212" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Truncar los últimos 10 eventos</tspan></text><rect x="480" y="212" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0 de 100</tspan></text><rect x="680" y="212" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">100 de 100</tspan></text><rect x="10" y="264" width="464" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="290.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Reescribir desde un evento recalculando las huellas</tspan></text><rect x="480" y="264" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0 de 100</tspan></text><rect x="680" y="264" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">100 de 100</tspan></text><rect x="10" y="320" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La cadena detecta lo que rompe un eslabón y no lo que lo reconstruye bien: quien puede escribir puede recalcular. Hace</tspan></text><text x="470" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">falta un ancla fuera del alcance del atacante (un tercero, un sellado de tiempo, un registro de transparencia). El ancla</tspan></text><text x="470" y="378.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">debe publicarse antes del ataque; un ancla posterior no detecta nada.</tspan></text><text x="470" y="417.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
