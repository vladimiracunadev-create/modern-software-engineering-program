<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 381" width="940" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El calendario mínimo que reproduce la carrera del cupo: seis pasos de dos solicitudes</title><desc id="d">Línea de tiempo de seis pasos en el orden en que dos solicitudes leen, comprueban y escriben un cupo de 1: la solicitud A lee y comprueba, la B lee antes de que A escriba, A escribe y B, con el valor viejo, comprueba y escribe, y se aceptan dos entregas con cupo 1. De las 20 intercalaciones de este tipo, 18 (90 por ciento) fallan; un calendario fallido de 40 pasos con ruido se redujo a estos 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="381" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El calendario mínimo que reproduce la carrera del cupo: seis pasos de dos solicitudes</tspan></text><line x1="164" y1="83" x2="164" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="164" y1="183" x2="164" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="164" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="164" dy="0">0</tspan></text><line x1="288.667" y1="83" x2="288.667" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="288.667" y1="183" x2="288.667" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="288.667" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.667" dy="0">1</tspan></text><line x1="413.333" y1="83" x2="413.333" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="413.333" y1="183" x2="413.333" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="413.333" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="413.333" dy="0">2</tspan></text><line x1="538" y1="83" x2="538" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="538" y1="183" x2="538" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="538" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="538" dy="0">3</tspan></text><line x1="662.667" y1="83" x2="662.667" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="662.667" y1="183" x2="662.667" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="662.667" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662.667" dy="0">4</tspan></text><line x1="787.333" y1="83" x2="787.333" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="787.333" y1="183" x2="787.333" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="787.333" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787.333" dy="0">5</tspan></text><line x1="912" y1="83" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="183" x2="912" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">6</tspan></text><line x1="164" y1="183" x2="912" y2="183" stroke="#5b7280" stroke-width="1.6"/><text x="154" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="154" dy="0">Solicitud A</tspan></text><text x="154" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="154" dy="0">Solicitud B</tspan></text><line x1="538" y1="75" x2="538" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="538" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="538" dy="0">A escribe; B ya leyó el cupo viejo</tspan></text><rect x="164" y="92" width="124.667" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="226.333" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="226.333" dy="0">lee</tspan></text><rect x="288.667" y="92" width="124.667" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="351" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="351" dy="0">comprueba</tspan></text><rect x="538" y="92" width="124.667" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="600.333" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="600.333" dy="0">escribe</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="413.333" y="142" width="124.667" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="475.667" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="475.667" dy="0">lee</tspan></text><rect x="662.667" y="142" width="124.667" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="725" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="725" dy="0">comprueba</tspan></text><rect x="787.333" y="142" width="124.667" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="849.667" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="849.667" dy="0">escribe</tspan></text><text x="538" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="538" dy="0">Orden de los pasos del calendario (sin escala de tiempo)</tspan></text><rect x="10" y="241" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="265.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un fallo reproducible se reduce eliminando pasos mientras siga fallando: lo que queda es la explicación (leer, comprobar,</tspan></text><text x="470" y="282.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">leer, escribir, comprobar, escribir). De las 20 intercalaciones de dos solicitudes con 3 pasos cada una, 18 aceptan dos</tspan></text><text x="470" y="299.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">entregas; el calendario al azar con 4 solicitudes y ruido tenía 40 pasos. El ruido son pasos ajenos al cupo y el calendario</tspan></text><text x="470" y="315.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">sale de la semilla 347; con hilos del sistema operativo no se controla el orden.</tspan></text><text x="470" y="363.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
