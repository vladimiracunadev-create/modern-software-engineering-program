<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 407" width="940" height="407" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Flujo de 5 pasos con efectos: puntos de fallo que dejan el estado coherente o incoherente</title><desc id="d">Barras apiladas horizontales sobre los 5 puntos de fallo de un flujo de cinco pasos: un corte antes de cada paso, sin reintento, deja un estado incoherente en 4 de 5 puntos; perder la respuesta tras cada paso y reintentar el flujo entero lo deja incoherente en 5 de 5; con pasos idempotentes, en 0 de 5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="407" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Flujo de 5 pasos con efectos: puntos de fallo que dejan el estado coherente o incoherente</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Estado coherente</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Estado incoherente</tspan></text><line x1="324" y1="77" x2="324" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="209" x2="324" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="77" x2="434.34" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="209" x2="434.34" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="434.34" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.34" dy="0">1</tspan></text><line x1="544.68" y1="77" x2="544.68" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="544.68" y1="209" x2="544.68" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="544.68" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.68" dy="0">2</tspan></text><line x1="655.02" y1="77" x2="655.02" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="655.02" y1="209" x2="655.02" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="655.02" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.02" dy="0">3</tspan></text><line x1="765.36" y1="77" x2="765.36" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="765.36" y1="209" x2="765.36" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="765.36" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.36" dy="0">4</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="209" x2="875.7" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5</tspan></text><line x1="324" y1="209" x2="875.7" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Corte antes de cada paso, sin reintento</tspan></text><text x="314" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Respuesta perdida, reintento del flujo</tspan></text><text x="314" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">completo</tspan></text><text x="314" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Respuesta perdida, pasos idempotentes</tspan></text><rect x="324" y="84" width="110.34" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="379.17" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="379.17" dy="0">1</tspan></text><rect x="434.34" y="84" width="441.36" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="655.02" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="655.02" dy="0">4</tspan></text><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5</tspan></text><rect x="324" y="128" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="128" width="551.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="599.85" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="599.85" dy="0">5</tspan></text><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5</tspan></text><rect x="324" y="172" width="551.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="599.85" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="599.85" dy="0">5</tspan></text><rect x="875.7" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5</tspan></text><text x="599.85" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Puntos de fallo del flujo (de 5)</tspan></text><rect x="10" y="267" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los dos fallos parciales distintos, el corte y la respuesta perdida, necesitan defensas distintas: el corte pide atomicidad</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">o compensación (solo el corte antes del primer paso deja todo intacto); la respuesta perdida pide idempotencia, porque el</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reintento repite cupo, entrega, penalización y aviso. Se enumeran todos los puntos del flujo; los efectos son contadores en</tspan></text><text x="470" y="341.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">memoria, sin red.</tspan></text><text x="470" y="389.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Enumeración exacta de los puntos de fallo; sin aleatoriedad.</tspan></text></svg>
