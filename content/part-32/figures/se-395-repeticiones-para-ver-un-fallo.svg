<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 395" width="980" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de ver al menos una vez un fallo que aparece en 1 de cada 70 ejecuciones</title><desc id="d">Barras con la probabilidad de ver un fallo que ocurre en 1 de cada 70 ejecuciones al repetir la prueba: 6,9 por ciento con 5 repeticiones, 13,4 con 10, 51,3 con 50, 76,3 con 100, 94,4 con 200 y 98,7 con 300.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="395" fill="#ffffff"/><text x="190" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">5 ejecuciones</tspan></text><rect x="200" y="16" width="37.26" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="245.26" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="245.26" dy="0">6,9 %</tspan></text><text x="190" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">10 ejecuciones</tspan></text><rect x="200" y="60" width="72.36" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="280.36" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="280.36" dy="0">13,4 %</tspan></text><text x="190" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">50 ejecuciones</tspan></text><rect x="200" y="104" width="277.02" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485.02" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="485.02" dy="0">51,3 %</tspan></text><text x="190" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">100 ejecuciones</tspan></text><rect x="200" y="148" width="412.02" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="620.02" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="620.02" dy="0">76,3 %</tspan></text><text x="190" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">200 ejecuciones</tspan></text><rect x="200" y="192" width="509.76" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="717.76" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="717.76" dy="0">94,4 %</tspan></text><text x="190" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">300 ejecuciones</tspan></text><rect x="200" y="236" width="532.98" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="740.98" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="740.98" dy="0">98,7 %</tspan></text><rect x="10" y="284" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Para el 95 % hacen falta 209 repeticiones y para el 99,9 % 481; una simulación de 10 000 campañas de 10 repeticiones dio 14,0 %</tspan></text><text x="490" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">frente al 13,4 % teórico. Enumerar las 70 intercalaciones las cubre todas. Repetir una prueba inestable en CI sin controlar el</tspan></text><text x="490" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">orden no la arregla.</tspan></text><text x="490" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
