<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La base de entregas cae 60 s de 300 (50 lecturas y 10 escrituras por segundo): qué ve cada solicitud afectada</title><desc id="d">Barras apiladas horizontales con las 3 600 solicitudes que llegan durante la caída de 60 segundos: con fallo duro fallan 3 000 lecturas y se rechazan 600 escrituras; con caché obsoleta las 3 000 lecturas se sirven obsoletas y las 600 escrituras se rechazan; con caché y cola, las 3 000 lecturas son obsoletas, ninguna falla y las 600 escrituras se encolan y se reenvían al volver.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La base de entregas cae 60 s de 300 (50 lecturas y 10 escrituras por segundo): qué ve cada solicitud</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">afectada</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Lecturas falladas</tspan></text><rect x="192.18" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="212.18" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Lecturas obsoletas servidas</tspan></text><rect x="443.76" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="463.76" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="463.76" dy="0">Escrituras rechazadas</tspan></text><rect x="16" y="88" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="99" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Escrituras encoladas y reenviadas</tspan></text><line x1="244" y1="120" x2="244" y2="240" stroke="#d5dde1" stroke-width="1"/><line x1="244" y1="240" x2="244" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="244" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">0</tspan></text><line x1="401.925" y1="120" x2="401.925" y2="240" stroke="#d5dde1" stroke-width="1"/><line x1="401.925" y1="240" x2="401.925" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="401.925" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="401.925" dy="0">1 000</tspan></text><line x1="559.85" y1="120" x2="559.85" y2="240" stroke="#d5dde1" stroke-width="1"/><line x1="559.85" y1="240" x2="559.85" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="559.85" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="559.85" dy="0">2 000</tspan></text><line x1="717.775" y1="120" x2="717.775" y2="240" stroke="#d5dde1" stroke-width="1"/><line x1="717.775" y1="240" x2="717.775" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="717.775" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717.775" dy="0">3 000</tspan></text><line x1="875.7" y1="120" x2="875.7" y2="240" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="240" x2="875.7" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">4 000</tspan></text><line x1="244" y1="240" x2="875.7" y2="240" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="144.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Fallo duro</tspan></text><text x="234" y="184.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Caché obsoleta para lecturas</tspan></text><text x="234" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Caché + cola de escrituras</tspan></text><rect x="244" y="127" width="473.775" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="480.888" y="144.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480.888" dy="0">3 000</tspan></text><rect x="717.775" y="127" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="717.775" y="127" width="94.755" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="765.153" y="144.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="765.153" dy="0">600</tspan></text><rect x="812.53" y="127" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="819.53" y="144.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="819.53" dy="0">3 600</tspan></text><rect x="244" y="167" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="244" y="167" width="473.775" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="480.888" y="184.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480.888" dy="0">3 000</tspan></text><rect x="717.775" y="167" width="94.755" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="765.153" y="184.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="765.153" dy="0">600</tspan></text><rect x="812.53" y="167" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="819.53" y="184.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="819.53" dy="0">3 600</tspan></text><rect x="244" y="207" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="244" y="207" width="473.775" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="480.888" y="224.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480.888" dy="0">3 000</tspan></text><rect x="717.775" y="207" width="0" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><rect x="717.775" y="207" width="94.755" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="765.153" y="224.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="765.153" dy="0">600</tspan></text><text x="819.53" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="819.53" dy="0">3 600</tspan></text><text x="559.85" y="284" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="559.85" dy="0">Solicitudes durante la caída de 60 s</tspan></text><rect x="10" y="298" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cada peldaño cambia un fallo visible por un estado que hay que declarar: una lectura vieja hasta N minutos, una escritura</tspan></text><text x="470" y="339.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">confirmada que aún no está en la base. No se pierden datos con la cola si cabe. Pasar de uno a otro es una decisión de</tspan></text><text x="470" y="356.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">producto con su límite, no un interruptor técnico. Tasas y duración son supuestos del autor.</tspan></text><text x="470" y="403.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
