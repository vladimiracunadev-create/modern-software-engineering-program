<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 363" width="940" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La huella de un paquete de cinco archivos construido en Windows y en Ubuntu (WSL2)</title><desc id="d">Tabla: el listado de un mismo directorio sale en distinto orden en Windows y en Ubuntu y la huella ingenua del paquete difiere entre ambos; una huella canónica con rutas ordenadas, saltos de línea normalizados y separador barra coincide en los dos sistemas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="363" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Método</tspan></text><rect x="340" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Windows 11</tspan></text><rect x="580" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">Ubuntu (WSL2)</tspan></text><rect x="820" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Coinciden</tspan></text><rect x="10" y="56" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Orden de os.listdir</tspan></text><rect x="340" y="56" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">A.txt, b.txt, informe, ñ.txt</tspan></text><rect x="580" y="56" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">A.txt, ñ.txt, b.txt, informe</tspan></text><rect x="820" y="56" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">No</tspan></text><rect x="10" y="120" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="144.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Huella ingenua (orden del sistema, bytes</tspan></text><text x="172" y="160.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">crudos)</tspan></text><rect x="340" y="120" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">dcb7a0e6…</tspan></text><rect x="580" y="120" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">9eb5bb1c…</tspan></text><rect x="820" y="120" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">No</tspan></text><rect x="10" y="184" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="208.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Huella canónica (rutas ordenadas, LF,</tspan></text><text x="172" y="224.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">separador /)</tspan></text><rect x="340" y="184" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">7f9dbc41…</tspan></text><rect x="580" y="184" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">7f9dbc41…</tspan></text><rect x="820" y="184" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">Sí</tspan></text><rect x="10" y="252" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Dos personas que ejecutan lo mismo en equipos distintos no obtienen la misma huella si la huella depende del orden del</tspan></text><text x="470" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">sistema de archivos o de los finales de línea. La huella canónica define el orden, la codificación y la normalización; con</tspan></text><text x="470" y="310.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ella la verificación entre sistemas se puede automatizar.</tspan></text><text x="470" y="349.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sonda real en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas es el resultado que se mide.</tspan></text></svg>
