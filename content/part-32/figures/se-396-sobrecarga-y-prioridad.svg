<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 412" width="940" height="412" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Llegan 150 solicitudes por turno a un sistema que atiende 100, durante 120 turnos: adónde va el exceso</title><desc id="d">Barras apiladas horizontales de las 18 000 solicitudes que llegan: se atienden 12 000 en las tres políticas; sin límite quedan 6 000 en cola; con cola acotada a 200 quedan 100 y se descartan 1 761 entregas y 4 139 listados; con prioridad quedan 100 y se descartan 0 entregas y 5 900 listados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="412" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Llegan 150 solicitudes por turno a un sistema que atiende 100, durante 120 turnos: adónde va el exceso</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Atendidas</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">En cola al final</tspan></text><rect x="300.5" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="320.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="320.5" dy="0">Descartadas: entregas</tspan></text><rect x="506.84" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="526.84" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="526.84" dy="0">Descartadas: listados</tspan></text><line x1="224" y1="77" x2="224" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="197" x2="224" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="386.925" y1="77" x2="386.925" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="386.925" y1="197" x2="386.925" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="386.925" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="386.925" dy="0">5 000</tspan></text><line x1="549.85" y1="77" x2="549.85" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="549.85" y1="197" x2="549.85" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="549.85" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="549.85" dy="0">10 000</tspan></text><line x1="712.775" y1="77" x2="712.775" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="712.775" y1="197" x2="712.775" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="712.775" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712.775" dy="0">15 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="197" x2="875.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">20 000</tspan></text><line x1="224" y1="197" x2="875.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Sin límite</tspan></text><text x="214" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Cola acotada a 200</tspan></text><text x="214" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Cola acotada con prioridad</tspan></text><rect x="224" y="84" width="391.02" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="419.51" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="419.51" dy="0">12 000</tspan></text><rect x="615.02" y="84" width="195.51" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="712.775" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712.775" dy="0">6 000</tspan></text><rect x="810.53" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="810.53" y="84" width="0" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="817.53" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="817.53" dy="0">18 000</tspan></text><rect x="224" y="124" width="391.02" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="419.51" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="419.51" dy="0">12 000</tspan></text><rect x="615.02" y="124" width="3.2585" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="618.279" y="124" width="57.3822" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="646.97" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="646.97" dy="0">1 761</tspan></text><rect x="675.661" y="124" width="134.869" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="743.095" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="743.095" dy="0">4 139</tspan></text><text x="817.53" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="817.53" dy="0">18 000</tspan></text><rect x="224" y="164" width="391.02" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="419.51" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="419.51" dy="0">12 000</tspan></text><rect x="615.02" y="164" width="3.2585" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="618.279" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="618.279" y="164" width="192.252" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="714.404" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="714.404" dy="0">5 900</tspan></text><text x="817.53" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="817.53" dy="0">18 000</tspan></text><text x="549.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="549.85" dy="0">Solicitudes llegadas en 120 turnos</tspan></text><rect x="10" y="255" width="920" height="109.2" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Si llegan más solicitudes de las que se atienden, algo espera o se descarta; elegir qué se descarta es la política. La</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">prioridad protege lo que no se puede reintentar sin costo: la espera media de una entrega pasa de 21,2 turnos sin límite a</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">2,0 con cola acotada y a 1,0 con prioridad, y la de un listado de 20,9 a 2,0 y 2,8. Que la cola crezca 50 por turno hasta 6</tspan></text><text x="470" y="329.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">000 explica una espera que sube hasta unos 41 turnos (ley de Little). Las proporciones 30/70 y la capacidad son supuestos</tspan></text><text x="470" y="346.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del autor.</tspan></text><text x="470" y="394.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
