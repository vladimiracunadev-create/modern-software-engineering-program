<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 631" width="940" height="631" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Veinte builds del mismo árbol en entornos distintos: hashes distintos según la fuente de variación que se deja sin normalizar</title><desc id="d">Tabla: al construir 20 veces el mismo árbol de 42 archivos con una sola fuente sin normalizar, las marcas de tiempo, el orden, la ruta absoluta y la fecha incrustada producen 20 hashes distintos; el orden de un diccionario 13, el usuario 5, los permisos 3 y los saltos de línea 2; con todo normalizado hay un solo hash.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="631" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Fuente de variación sin normalizar</tspan></text><rect x="390" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Hashes</tspan></text><text x="462" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">distintos</tspan></text><rect x="540" y="12" width="384" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="732" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="732" dy="0">Qué la elimina</tspan></text><rect x="10" y="56" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Marca de tiempo de cada archivo</tspan></text><rect x="390" y="56" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">20 de 20</tspan></text><rect x="540" y="56" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Fijarla (1980-01-01 o SOURCE_DATE_EPOCH)</tspan></text><rect x="10" y="102" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Orden de los archivos</tspan></text><rect x="390" y="102" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">20 de 20</tspan></text><rect x="540" y="102" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Ordenar los nombres</tspan></text><rect x="10" y="148" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Ruta absoluta del build</tspan></text><rect x="390" y="148" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">20 de 20</tspan></text><rect x="540" y="148" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Quitarla del artefacto o fijar la ruta</tspan></text><rect x="10" y="194" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Fecha del build incrustada</tspan></text><rect x="390" y="194" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">20 de 20</tspan></text><rect x="540" y="194" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">No incrustarla o derivarla del commit</tspan></text><rect x="10" y="240" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Orden de un diccionario o conjunto</tspan></text><rect x="390" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">13 de 20</tspan></text><rect x="540" y="240" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Ordenar antes de serializar</tspan></text><rect x="10" y="286" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Nombre de usuario o de equipo</tspan></text><rect x="390" y="286" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">5 de 20</tspan></text><rect x="540" y="286" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">No incrustarlo</tspan></text><rect x="10" y="332" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="355.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Permisos del sistema de archivos</tspan></text><rect x="390" y="332" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">3 de 20</tspan></text><rect x="540" y="332" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Fijar el modo de cada entrada</tspan></text><rect x="10" y="378" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="401.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Saltos de línea CRLF frente a LF</tspan></text><rect x="390" y="378" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">2 de 20</tspan></text><rect x="540" y="378" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Fijar la normalización de la fuente</tspan></text><rect x="10" y="424" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="447.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Todas a la vez</tspan></text><rect x="390" y="424" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="447.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">20 de 20</tspan></text><rect x="540" y="424" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="447.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Se acumulan sin aviso</tspan></text><rect x="10" y="470" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="493.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Ninguna (todo normalizado)</tspan></text><rect x="390" y="470" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="493.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">1 de 20</tspan></text><rect x="540" y="470" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="493.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">Un solo hash: el build es reproducible</tspan></text><rect x="10" y="520" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="544.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La columna central cuenta cuántos de 20 resultados distintos produce cada fuente por sí sola: con 2 o 3 entornos posibles</tspan></text><text x="470" y="561.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">basta ver pocas variantes, con 20 entornos cada uno produce su propio hash. Una fuente que casi nunca cambia (CRLF) no es</tspan></text><text x="470" y="578.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">inofensiva: aparece en la primera máquina que la cambia.</tspan></text><text x="470" y="617.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
