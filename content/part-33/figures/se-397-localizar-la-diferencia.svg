<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 381" width="940" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo se localiza lo que no es reproducible y qué muestra un build que lee una entrada no declarada</title><desc id="d">Tabla: comparar dos zips archivo a archivo localiza que solo pyproject.toml difiere cuando se incrusta una fecha; un build que lee una variable de entorno no declarada produce hashes distintos con los valores A y B; con las entradas fijadas el hash es el mismo en Windows y Ubuntu.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="381" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Caso</tspan></text><rect x="340" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Resultado</tspan></text><rect x="470" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">Evidencia</tspan></text><rect x="720" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="83.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Dos builds con fecha incrustada: archivos que</tspan></text><text x="172" y="99.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">difieren</tspan></text><rect x="340" y="56" width="124" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">1 de 42</tspan></text><rect x="470" y="56" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">pyproject.toml</tspan></text><rect x="720" y="56" width="204" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="83.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Localizada con una</tspan></text><text x="822" y="99.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">comparación por archivo</tspan></text><rect x="10" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="153.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Dos builds con una variable de entorno no</tspan></text><text x="172" y="169.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">declarada (A y B)</tspan></text><rect x="340" y="126" width="124" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">Hash distinto</tspan></text><rect x="470" y="126" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="153.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">10e620451e6c frente a</tspan></text><text x="592" y="169.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">8f681af2e460</tspan></text><rect x="720" y="126" width="204" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">El build no es hermético</tspan></text><rect x="10" y="196" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Mismo árbol, tras fijar entradas y entorno</tspan></text><rect x="340" y="196" width="124" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">Un hash</tspan></text><rect x="470" y="196" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">2d20872cfbd34c32</tspan></text><rect x="720" y="196" width="204" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="223.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Reproducible en ambos</tspan></text><text x="822" y="239.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sistemas</tspan></text><rect x="10" y="270" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un build hermético declara todas sus entradas y no lee otras; un build reproducible produce los mismos bytes con las mismas</tspan></text><text x="470" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entradas. Lo primero es una condición de diseño que se puede comprobar bloqueando el acceso; lo segundo, un resultado que</tspan></text><text x="470" y="328.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se comprueba reconstruyendo. Ninguno prueba que el contenido sea benigno.</tspan></text><text x="470" y="367.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
