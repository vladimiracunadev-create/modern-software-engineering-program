<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste de arrancar una unidad de ejecución: mediana en Windows y en Ubuntu</title><desc id="d">Barras agrupadas en escala logarítmica con la mediana del arranque: un hilo cuesta 0,17 milisegundos en Windows y 0,34 en Ubuntu; un proceso mínimo 34 y 16; un proceso vacío del intérprete 109 y 41; un proceso que importa siete módulos 405 y 161. Del hilo al proceso con módulos hay tres órdenes de magnitud.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Coste de arrancar una unidad de ejecución: mediana en Windows y en Ubuntu</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows 11</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Ubuntu (WSL2)</tspan></text><line x1="93.7" y1="395" x2="920" y2="395" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="395" x2="93.7" y2="395" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="399.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,1</tspan></text><line x1="93.7" y1="320" x2="920" y2="320" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="320" x2="93.7" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="324.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="245" x2="920" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="245" x2="93.7" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="249.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="170" x2="920" y2="170" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="170" x2="93.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="174.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="395" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 245)">ms (mediana) (escala logarítmica)</text><rect x="114.357" y="377.716" width="80.63" height="17.2837" rx="3" fill="#102a43"/><text x="154.672" y="371.716" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.672" dy="0">0,17</tspan></text><rect x="198.987" y="355.139" width="80.63" height="39.8609" rx="3" fill="#087f8c"/><text x="239.302" y="349.139" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="239.302" dy="0">0,34</tspan></text><text x="196.987" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.987" dy="0">Hilo (crear y unir)</tspan></text><rect x="320.933" y="205.139" width="80.63" height="189.861" rx="3" fill="#102a43"/><text x="361.248" y="199.139" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="361.248" dy="0">34</tspan></text><rect x="405.562" y="229.691" width="80.63" height="165.309" rx="3" fill="#087f8c"/><text x="445.877" y="223.691" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="445.877" dy="0">16</tspan></text><text x="403.562" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.562" dy="0">Proceso mínimo</tspan></text><rect x="527.507" y="167.193" width="80.63" height="227.807" rx="3" fill="#102a43"/><text x="567.822" y="161.193" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="567.822" dy="0">109</tspan></text><rect x="612.137" y="199.041" width="80.63" height="195.959" rx="3" fill="#087f8c"/><text x="652.452" y="193.041" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652.452" dy="0">41</tspan></text><text x="610.137" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">Proceso vacío del</tspan></text><text x="610.137" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">intérprete</tspan></text><rect x="734.082" y="124.441" width="80.63" height="270.559" rx="3" fill="#102a43"/><text x="774.398" y="118.441" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="774.398" dy="0">405</tspan></text><rect x="818.712" y="154.488" width="80.63" height="240.512" rx="3" fill="#087f8c"/><text x="859.027" y="148.488" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.027" dy="0">161</tspan></text><text x="816.712" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">Proceso con siete módulos</tspan></text><rect x="10" y="464" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="488.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hilo, proceso y proceso con dependencias difieren en dos o tres órdenes de magnitud, y la parte que más pesa no es el</tspan></text><text x="470" y="505.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aislamiento sino lo que se inicializa dentro. No se midió ninguna máquina virtual ni contenedor: estas barras son la cota</tspan></text><text x="470" y="522.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">inferior de cualquier unidad que arranque un intérprete.</tspan></text><text x="470" y="569.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tiempos medidos en un equipo de 8 hilos lógicos con otros procesos activos; cambian de una ejecución a otra, léanse como órdenes de magnitud.</tspan></text></svg>
