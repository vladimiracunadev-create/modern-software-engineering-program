<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 263" width="980" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Instancias de una aplicación de 150 MiB que caben en un anfitrión de 16 GiB con 2 GiB reservados</title><desc id="d">Barras: con un sobrecoste por instancia de 0, 30 y 1 024 MiB caben 95 procesos, 79 contenedores y 12 máquinas virtuales de una aplicación de 150 MiB en 14 GiB disponibles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="263" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Procesos (sin sobrecoste)</tspan></text><rect x="370" y="16" width="342" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="720" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="720" dy="0">95 instancias</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Contenedores (30 MiB supuestos)</tspan></text><rect x="370" y="60" width="284.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="662.4" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="662.4" dy="0">79 instancias</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Máquinas virtuales (1 024 MiB supuestos)</tspan></text><rect x="370" y="104" width="43.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="421.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="421.2" dy="0">12 instancias</tspan></text><rect x="10" y="152" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El sobrecoste por instancia, no el tamaño de la aplicación, decide la densidad: 1 GiB de sistema invitado cuesta casi el 87 % del</tspan></text><text x="490" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">espacio de cada instancia. Los 30 MiB y 1 024 MiB son supuestos del autor; el intérprete vacío midió 17 MiB en Windows y 13 en</tspan></text><text x="490" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Ubuntu, y 27 y 23 con siete módulos.</tspan></text><text x="490" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
