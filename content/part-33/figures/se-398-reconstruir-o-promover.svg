ext><text x="218.85" y="420" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">1 % de los builds difiere</tspan></text><rect x="387.126" y="311.267" width="72.1227" height="87.7333" rx="3" fill="#c0432f"/><text x="423.187" y="305.267" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.187" dy="0">94</tspan></text><rect x="463.249" y="390.6" width="72.1227" height="8.4" rx="3" fill="#946512"/><text x="499.31" y="384.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">9</tspan></text><rect x="539.371" y="397" width="72.1227" height="2" rx="3" fill="#087f8c"/><text x="575.433" y="391" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="575.433" dy="0">0</tspan></text><text x="499.31" y="420" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">5 % de los builds difiere</tspan></text><rect x="667.586" y="134.867" width="72.1227" height="264.133" rx="3" fill="#c0432f"/><text x="703.647" y="128.867" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="703.647" dy="0">283</tspan></text><rect x="743.709" y="367.267" width="72.1227" height="31.7333" rx="3" fill="#946512"/><text x="779.77" y="361.267" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">34</tspan></text><rect x="819.831" y="397" width="72.1227" height="2" rx="3" fill="#087f8c"/><text x="855.893" y="391" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855.893" dy="0">0</tspan></text><text x="779.77" y="420" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">15 % de los builds difiere</tspan></text><rect x="10" y="451" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="475.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El cero de la última barra es una consecuencia del modelo: lo que se promueve es idéntico por construcción. Lo que</tspan></text><text x="470" y="492.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">demuestra la figura es la dependencia con la tasa de deriva, que es un supuesto del autor (12 % de las derivas ocultan un</tspan></text><text x="470" y="509.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">defecto).</tspan></text><text x="470" y="556.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
