<rect x="689.54" y="279.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="695.04" y="274" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="695.04" dy="0">0,34</tspan></text><rect x="886.5" y="318.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="313" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,21</tspan></text><polyline points="104.16,87 301.12,87 498.08,87 695.04,87 892,237" fill="none" stroke="#6b7c86" stroke-width="2.4"/><polygon points="104.16,80.675 110.21,91.95 98.11,91.95" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><polygon points="301.12,80.675 307.17,91.95 295.07,91.95" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><polygon points="498.08,80.675 504.13,91.95 492.03,91.95" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><polygon points="695.04,80.675 701.09,91.95 688.99,91.95" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><polygon points="892,230.675 898.05,241.95 885.95,241.95" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="902" y="241.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="902" dy="0">0,50</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con 8 hilos lógicos se esperaba un valor cercano a 1,00 hasta ocho procesos y 0,50 con dieciséis. Bajó antes porque el</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">anfitrión no estaba ocioso: otras tareas compartían los núcleos, que es el problema que un límite de CPU reservado intenta</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">acotar. No se probaron cuotas ni cgroups.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tiempos medidos en un equipo de 8 hilos lógicos con otros procesos activos; cambian de una ejecución a otra, léanse como órdenes de magnitud.</tspan></text></svg>
