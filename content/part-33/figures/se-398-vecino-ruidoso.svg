 stroke="#5b7280" stroke-width="1.4"/><text x="301.12" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="301.12" dy="0">2</tspan></text><line x1="498.08" y1="87" x2="498.08" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="498.08" y1="387" x2="498.08" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="498.08" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498.08" dy="0">4</tspan></text><line x1="695.04" y1="87" x2="695.04" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="695.04" y1="387" x2="695.04" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="695.04" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="695.04" dy="0">8</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">16</tspan></text><line x1="86.16" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Trabajo por proceso (1 = uno solo)</text><text x="498.08" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="498.08" dy="0">Procesos simultáneos (k) (escala logarítmica)</tspan></text><polyline points="104.16,87 301.12,213 498.08,276 695.04,303 892,321" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="104.16" cy="87" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="104.16" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">1,00</tspan></text><circle cx="301.12" cy="213" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text 