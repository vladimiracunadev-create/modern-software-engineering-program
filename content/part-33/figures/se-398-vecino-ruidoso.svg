<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Vecino ruidoso: trabajo por proceso al correr k procesos que consumen CPU, relativo a correr uno solo</title><desc id="d">Líneas con el trabajo por proceso relativo al de uno solo según los procesos simultáneos: en Windows baja a 0,58, 0,37, 0,28 y 0,22 con 2, 4, 8 y 16 procesos; en Ubuntu a 0,86, 0,58, 0,34 y 0,21. La línea punteada es lo esperado con 8 hilos ociosos, 1,00 hasta ocho procesos y 0,50 con dieciséis; las dos medidas caen por debajo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Vecino ruidoso: trabajo por proceso al correr k procesos que consumen CPU, relativo a correr uno solo</tspan></text><circle cx="22" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows 11</tspan></text><rect x="139.4" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Ubuntu (WSL2)</tspan></text><polygon points="291.42,44.1 298.02,56.4 284.82,56.4" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="305.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="305.42" dy="0">Esperado con 8 hilos ociosos<