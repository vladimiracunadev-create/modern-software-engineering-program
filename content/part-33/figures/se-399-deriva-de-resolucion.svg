<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 569" width="940" height="569" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Construir cada día durante 60 días 25 dependencias con rango: conjuntos de versiones distintos que se resuelven</title><desc id="d">Barras agrupadas con la resolución diaria durante 60 días de 25 dependencias con rango: sin archivo de bloqueo se resuelven 37 conjuntos de versiones distintos y el conjunto cambia en 36 días; con archivo de bloqueo con huellas hay 1 conjunto y 0 cambios.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="569" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Construir cada día durante 60 días 25 dependencias con rango: conjuntos de versiones distintos que se</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">resuelven</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Conjuntos distintos en 60 días</tspan></text><rect x="290.2" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="310.2" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310.2" dy="0">Días en que el conjunto cambió (de 60)</tspan></text><line x1="71.08" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="394" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="324" x2="920" y2="324" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="324" x2="71.08" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="328.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="254" x2="920" y2="254" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="254" x2="71.08" y2="254" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="258.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="184" x2="920" y2="184" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="184" x2="71.08" y2="184" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="188.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="114" x2="71.08" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="114" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">Conjuntos o días</text><rect x="113.526" y="135" width="167.784" height="259" rx="3" fill="#c0432f"/><text x="197.418" y="129" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.418" dy="0">37</tspan></text><rect x="285.31" y="142" width="167.784" height="252" rx="3" fill="#946512"/><text x="369.202" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="369.202" dy="0">36</tspan></text><text x="283.31" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">Sin archivo de bloqueo (rangos compatibles)</tspan></text><rect x="537.986" y="387" width="167.784" height="7" rx="3" fill="#c0432f"/><text x="621.878" y="381" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="621.878" dy="0">1</tspan></text><rect x="709.77" y="392" width="167.784" height="2" rx="3" fill="#946512"/><text x="793.662" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="793.662" dy="0">0</tspan></text><text x="707.77" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">Con archivo de bloqueo con huellas</tspan></text><rect x="10" y="446" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="470.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin bloqueo, dos builds del mismo commit en días distintos no producen el mismo árbol de dependencias: no hay build</tspan></text><text x="470" y="487.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reproducible posible. En el grafo sintético de 400 paquetes, 15 dependencias directas arrastran una media de 49,4 paquetes</tspan></text><text x="470" y="504.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(3,3 veces) y un paquete transitivo vulnerable es alcanzado por 2,3 de las 15 directas.</tspan></text><text x="470" y="551.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
