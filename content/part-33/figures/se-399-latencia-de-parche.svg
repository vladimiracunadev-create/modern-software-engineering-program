<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 305" width="940" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Días hasta aplicar el parche de una vulnerabilidad según cómo se incorpora la dependencia (5 000 casos por fila)</title><desc id="d">Tabla: una dependencia gestionada con archivo de bloqueo se parchea en una mediana de 2,7 días y un percentil 95 de 5,0; una copia vendorizada sin dueño en 15,8 y 63,1; una copia con dueño y revisión periódica en 7,0 y 22,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="305" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Cómo se incorpora</tspan></text><rect x="510" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="612" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">Mediana</tspan></text><rect x="720" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Percentil 95</tspan></text><rect x="10" y="56" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Dependencia gestionada con bloqueo</tspan></text><rect x="510" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">2,7 días</tspan></text><rect x="720" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">5,0 días</tspan></text><rect x="10" y="106" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Copia vendorizada sin dueño</tspan></text><rect x="510" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">15,8 días</tspan></text><rect x="720" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">63,1 días</tspan></text><rect x="10" y="156" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Copia vendorizada con dueño y revisión periódica</tspan></text><rect x="510" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">7,0 días</tspan></text><rect x="720" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">22,9 días</tspan></text><rect x="10" y="210" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los tiempos son un modelo exponencial con medias fijadas por el autor, no una medición de equipos reales. Lo que muestra es</tspan></text><text x="470" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la forma: vendorizar mueve la responsabilidad del parche a quien copió y alarga la cola cuando nadie la ejerce.</tspan></text><text x="470" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
