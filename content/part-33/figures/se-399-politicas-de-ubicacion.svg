<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 425" width="940" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pods que no caben (de 150) en 19 nodos de 4 CPU y 16 GiB según la política y el orden de llegada</title><desc id="d">Mapa de calor con los pods sin ubicar según la política y el orden de llegada: primer ajuste y mejor ajuste dejan menos de un pod con llegada al azar, 34 si se ordenan por CPU decreciente y 27 por memoria decreciente, y ninguno por dimensión dominante; menos asignado deja 1,41, 0, 2 y 4. Ordenar de mayor a menor empeora a las dos primeras.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="425" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pods que no caben (de 150) en 19 nodos de 4 CPU y 16 GiB según la política y el orden de llegada</tspan></text><text x="598" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598" dy="0">Orden de llegada de los pods</tspan></text><text x="356.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="356.5" dy="0">Llegada al azar</tspan></text><text x="356.5" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="356.5" dy="0">(media de 200)</tspan></text><text x="517.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.5" dy="0">CPU decreciente</tspan></text><text x="678.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.5" dy="0">Memoria decreciente</tspan></text><text x="839.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">Dimensión dominante</tspan></text><text x="266" y="137.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Primer ajuste</tspan></text><text x="266" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Mejor ajuste</tspan></text><text x="266" y="225.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Menos asignado (Kubernetes)</tspan></text><rect x="277.5" y="112.5" width="158" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="356.5" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="356.5" dy="0">0,05</tspan></text><rect x="438.5" y="112.5" width="158" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="517.5" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517.5" dy="0">34</tspan></text><rect x="599.5" y="112.5" width="158" height="41" rx="4" fill="#cc6453" stroke="#102a43" stroke-width="3"/><text x="678.5" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.5" dy="0">27</tspan></text><rect x="760.5" y="112.5" width="158" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="839.5" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">0</tspan></text><rect x="277.5" y="156.5" width="158" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="356.5" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="356.5" dy="0">0,04</tspan></text><rect x="438.5" y="156.5" width="158" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="517.5" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517.5" dy="0">34</tspan></text><rect x="599.5" y="156.5" width="158" height="41" rx="4" fill="#cc6453" stroke="#102a43" stroke-width="3"/><text x="678.5" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.5" dy="0">27</tspan></text><rect x="760.5" y="156.5" width="158" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="839.5" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">0</tspan></text><rect x="277.5" y="200.5" width="158" height="41" rx="4" fill="#f9ddd7" stroke="#ffffff" stroke-width="1"/><text x="356.5" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="356.5" dy="0">1,41</tspan></text><rect x="438.5" y="200.5" width="158" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="517.5" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.5" dy="0">0</tspan></text><rect x="599.5" y="200.5" width="158" height="41" rx="4" fill="#f8dbd4" stroke="#ffffff" stroke-width="1"/><text x="678.5" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.5" dy="0">2</tspan></text><rect x="760.5" y="200.5" width="158" height="41" rx="4" fill="#f4d1c9" stroke="#ffffff" stroke-width="1"/><text x="839.5" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">4</tspan></text><text x="20" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 177)">Política</text><text x="276" y="269" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="276" dy="0">0</tspan></text><rect x="291.54" y="257" width="30.5" height="14" fill="#fbe4de"/><rect x="321.54" y="257" width="30.5" height="14" fill="#f3cdc5"/><rect x="351.54" y="257" width="30.5" height="14" fill="#eab6ac"/><rect x="381.54" y="257" width="30.5" height="14" fill="#e29f93"/><rect x="411.54" y="257" width="30.5" height="14" fill="#d9887a"/><rect x="441.54" y="257" width="30.5" height="14" fill="#d17161"/><rect x="471.54" y="257" width="30.5" height="14" fill="#c85a48"/><rect x="501.54" y="257" width="30.5" height="14" fill="#c0432f"/><text x="539.54" y="269" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="539.54" dy="0">34</tspan></text><text x="562.62" y="269" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="562.62" dy="0">más oscuro = mayor (pods sin ubicar)</tspan></text><rect x="10" y="285" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ordenar de mayor a menor mejora el empaquetado de una sola dimensión y lo empeora en dos: los pods grandes en CPU llenan</tspan></text><text x="470" y="326.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">los nodos y dejan memoria sin usar. Ninguna política gana siempre. El conjunto es sintético (69 250 m de CPU y 228 864 MiB</tspan></text><text x="470" y="343.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">pedidos) y el orden por dimensión dominante es una elección del autor; el peor caso con llegada al azar (4, 3 y 5 pods)</tspan></text><text x="470" y="359.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">está en la tabla.</tspan></text><text x="470" y="407.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
