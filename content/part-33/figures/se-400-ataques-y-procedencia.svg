<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 355" width="940" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué ataques detecta la verificación de los campos de una procedencia y cuáles pasan</title><desc id="d">Diagrama de lo que detecta la verificación de los campos de una procedencia: detecta cinco ataques, el artefacto sustituido, la procedencia de otro repositorio, el runner no confiable, la rama no esperada y los parámetros alterados; no detecta tres, la procedencia fabricada por quien controla el constructor, el commit malicioso aprobado y la dependencia comprometida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="355" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué ataques detecta la verificación de los campos de una procedencia y cuáles pasan</tspan></text><rect x="14" y="98.28" width="250" height="86.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="120.24" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Verificar los campos de la</tspan></text><text x="139" y="136.88" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">procedencia</tspan></text><text x="139" y="153.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">huella del sujeto, repositorio,</tspan></text><text x="139" y="170.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">constructor, rama y parámetros</tspan></text><rect x="334" y="49" width="592" height="86.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Detecta cinco ataques</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">artefacto sustituido tras el build (huella del sujeto) · procedencia de otro</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">repositorio · build en un runner no confiable · commit en una rama no esperada</tspan></text><text x="630" y="120.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">· parámetros de construcción alterados</tspan></text><polyline points="264,141.56 299,141.56 299,92.28 334,92.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="147.56" width="592" height="86.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="630" y="169.52" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">No detecta tres ataques</tspan></text><text x="630" y="186.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">procedencia fabricada por quien controla el constructor · commit malicioso</tspan></text><text x="630" y="202.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">aprobado en la rama protegida · dependencia comprometida descargada durante el</tspan></text><text x="630" y="219.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">build</tspan></text><polyline points="264,141.56 299,141.56 299,190.84 334,190.84" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="248.12" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="273.08" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Es un análisis lógico de qué campo contradice qué ataque, no una medición. Una procedencia dice quién construyó qué a</tspan></text><text x="470" y="289.72" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">partir de qué; no dice que la fuente fuese benigna ni que el constructor fuera honesto.</tspan></text><text x="470" y="337.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis del autor, sin datos medidos.</tspan></text></svg>
