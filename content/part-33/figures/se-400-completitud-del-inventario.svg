<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 307" width="940" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mediana del porcentaje de componentes reales que cada método de inventario ve (100 proyectos sintéticos de 60 componentes)</title><desc id="d">Barras: la mediana de componentes inventariados es 63,3 por ciento con solo el manifiesto, 86,7 con manifiesto y archivo de bloqueo, 93,3 si además se escanean las copias y 98,3 al escanear el artefacto final; los descargados en tiempo de ejecución no los ve ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="307" fill="#ffffff"/><text x="250" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Solo manifiesto</tspan></text><rect x="260" y="16" width="506.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="774.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="774.4" dy="0">63,3 %</tspan></text><text x="250" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Manifiesto + bloqueo</tspan></text><rect x="260" y="60" width="693.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="961.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="961.6" dy="0">86,7 %</tspan></text><text x="250" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Bloqueo + escaneo de copias</tspan></text><rect x="260" y="104" width="746.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="1014.4" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1014.4" dy="0">93,3 %</tspan></text><text x="250" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Escaneo del artefacto final</tspan></text><rect x="260" y="148" width="786.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1054.4" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1054.4" dy="0">98,3 %</tspan></text><rect x="10" y="196" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El peor proyecto con solo el manifiesto ve el 46,7 % y con el escaneo del artefacto el 91,7 %. La composición (62 %</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">declaradas, 24 % transitivas, 7 % copiadas, 4 % estáticas, 3 % descargadas) es un supuesto del autor; lo que se sostiene es</tspan></text><text x="470" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que cada método ve una capa.</tspan></text><text x="470" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
