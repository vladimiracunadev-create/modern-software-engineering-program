<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 351" width="960" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Efectos repetidos de 976 reentregas (20 000 eventos, el 5 % reentregado a los 30 s en promedio)</title><desc id="d">Barras: sin deduplicar, las 976 reentregas repiten su efecto; con una ventana de 10 segundos repiten 681, con 60 segundos repiten 121, y con 300 segundos o sin caducidad ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="351" fill="#ffffff"/><text x="190" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">Sin deduplicar</tspan></text><rect x="200" y="16" width="331.84" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="539.84" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="539.84" dy="0">976 efectos repetidos</tspan></text><text x="190" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">Ventana de 10 s</tspan></text><rect x="200" y="60" width="231.54" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="439.54" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="439.54" dy="0">681</tspan></text><text x="190" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">Ventana de 60 s</tspan></text><rect x="200" y="104" width="41.14" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="249.14" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="249.14" dy="0">121</tspan></text><text x="190" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">Ventana de 300 s</tspan></text><rect x="200" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="212" dy="0">0</tspan></text><text x="190" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">Sin caducidad</tspan></text><rect x="200" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="212" dy="0">0 (pero la tabla crece sin fin)</tspan></text><rect x="10" y="240" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Deduplicar con una ventana más corta que el retardo de la reentrega elimina solo una parte de los duplicados. Con un retardo</tspan></text><text x="480" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">exponencial de media 30 s, una de cada ocho reentregas llega después de 60 s, el doble de la media, y por eso pasan 121 de</tspan></text><text x="480" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">976. Los 20 000 eventos, el 5 % de reentrega y la media de 30 s son supuestos del autor.</tspan></text><text x="480" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
