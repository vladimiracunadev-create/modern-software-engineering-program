<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 635" width="860" height="635" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador de forma de SBOM frente a 240 mutaciones (12 operadores sobre 20 SBOM de 30 componentes)</title><desc id="d">Tabla: un validador que exige versión, purl coherente, huellas y ausencia de duplicados detecta 20 de 20 mutaciones que quitan o rompen un campo y ninguna de las que mantienen la forma, como borrar un componente, cambiar versión y purl a la vez, cambiar la huella por otra válida o añadir un componente fantasma; en total 120 de 240.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="860" height="635" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Mutación del SBOM</tspan></text><rect x="650" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="76.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Quitar la versión de un componente</tspan></text><rect x="650" y="56" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">20 de 20</tspan></text><rect x="10" y="96" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="116.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Quitar el purl</tspan></text><rect x="650" y="96" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="116.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">20 de 20</tspan></text><rect x="10" y="136" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="156.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Quitar las huellas</tspan></text><rect x="650" y="136" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="156.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">20 de 20</tspan></text><rect x="10" y="176" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Duplicar un componente</tspan></text><rect x="650" y="176" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">20 de 20</tspan></text><rect x="10" y="216" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="236.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Cambiar solo la versión del purl</tspan></text><rect x="650" y="216" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">20 de 20</tspan></text><rect x="10" y="256" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="276.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Vaciar la lista de componentes</tspan></text><rect x="650" y="256" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="276.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">20 de 20</tspan></text><rect x="10" y="296" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="316.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Borrar un componente</tspan></text><rect x="650" y="296" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="316.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 20</tspan></text><rect x="10" y="336" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="356.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Cambiar versión y purl a la vez</tspan></text><rect x="650" y="336" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="356.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 20</tspan></text><rect x="10" y="376" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="396.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Cambiar la huella por otra válida</tspan></text><rect x="650" y="376" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="396.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 20</tspan></text><rect x="10" y="416" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="436.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Añadir un componente fantasma</tspan></text><rect x="650" y="416" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="436.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 20</tspan></text><rect x="10" y="456" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="476.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Cambiar la licencia</tspan></text><rect x="650" y="456" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="476.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 20</tspan></text><rect x="10" y="496" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="516.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Cambiar nombre y purl a la vez</tspan></text><rect x="650" y="496" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="516.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 20</tspan></text><rect x="10" y="540" width="840" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="430" y="564.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Detecta el 50 % de las mutaciones y todas las que ve son de forma. Un SBOM bien formado y falso parece medido.</tspan></text><text x="430" y="581.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Que valide no dice que el inventario sea el del artefacto: para eso hay que compararlo con el contenido real.</tspan></text><text x="430" y="621.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
