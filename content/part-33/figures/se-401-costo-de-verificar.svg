<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de hashear 64 MiB y de verificar una firma, medido en dos sistemas (una lectura, cambia entre ejecuciones)</title><desc id="d">Tabla: hashear 64 mebibytes con SHA-256 tarda 168,5 milisegundos en Windows y 153,3 en Ubuntu; SHA-512 151,0 y 102,1; BLAKE2b 261,3 y 106,9; SHA3-256 245,7 y 184,7; verificar una firma Ed25519 con un proceso openssl tarda 33,1 y 5,7 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Operación</tspan></text><rect x="430" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Windows 11</tspan></text><rect x="680" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Ubuntu WSL2</tspan></text><rect x="10" y="56" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">SHA-256</tspan></text><rect x="430" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">168,5 ms · 380 MiB/s</tspan></text><rect x="680" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">153,3 ms · 417 MiB/s</tspan></text><rect x="10" y="106" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">SHA-512</tspan></text><rect x="430" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">151,0 ms · 424 MiB/s</tspan></text><rect x="680" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">102,1 ms · 627 MiB/s</tspan></text><rect x="10" y="156" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">BLAKE2b</tspan></text><rect x="430" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">261,3 ms · 245 MiB/s</tspan></text><rect x="680" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">106,9 ms · 599 MiB/s</tspan></text><rect x="10" y="206" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">SHA3-256</tspan></text><rect x="430" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">245,7 ms · 261 MiB/s</tspan></text><rect x="680" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">184,7 ms · 347 MiB/s</tspan></text><rect x="10" y="256" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Verificar una firma Ed25519 con un proceso openssl</tspan></text><rect x="430" y="256" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">33,1 ms (OpenSSL 3.5.7)</tspan></text><rect x="680" y="256" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">5,7 ms (OpenSSL 3.0.13)</tspan></text><rect x="10" y="310" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El costo es de milisegundos frente a minutos de build: la verificación no se omite por rendimiento. Las cifras son una</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lectura de un equipo con un solo intento y cambian en cada ejecución; el 33 frente a 5,7 ms mide sobre todo el arranque del</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">proceso openssl en cada sistema.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Mediciones de reloj: una lectura por celda, no reproducibles al milisegundo.</tspan></text></svg>
