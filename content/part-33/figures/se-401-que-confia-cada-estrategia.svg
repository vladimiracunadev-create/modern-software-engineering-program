<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 503" width="940" height="503" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué da por bueno cada estrategia de verificación y qué no cubre</title><desc id="d">Tabla: un checksum en la misma página confía en que la página no se alteró y no cubre manipulación; uno por otro canal depende de la independencia del canal; una firma con clave de la misma página confía en quien publica la clave; una clave fijada cubre eso pero no el rollback; el manifiesto con secuencia cubre el rollback pero no la clave robada; la revocación cubre la clave robada tras detectarla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="503" fill="#ffffff"/><rect x="10" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="147" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="147" dy="0">Estrategia</tspan></text><rect x="290" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Confía en que</tspan></text><rect x="630" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">No cubre</tspan></text><rect x="10" y="56" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Checksum en la misma página</tspan></text><rect x="290" y="56" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Que la página no haya sido alterada</tspan></text><rect x="630" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Detecta corrupción, no manipulación</tspan></text><rect x="10" y="114" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Checksum por otro canal</tspan></text><rect x="290" y="114" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="135.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Que el segundo canal sea independiente y</tspan></text><text x="457" y="151.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">anterior</tspan></text><rect x="630" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="135.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">No distingue un release malicioso</tspan></text><text x="777" y="151.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">legítimo</tspan></text><rect x="10" y="172" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Firma con clave de la misma página</tspan></text><rect x="290" y="172" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Que el atacante no controle la página</tspan></text><rect x="630" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Firma y clave del atacante pasan</tspan></text><rect x="10" y="230" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Firma con clave fijada</tspan></text><rect x="290" y="230" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Que la clave fijada sea la correcta</tspan></text><rect x="630" y="230" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Rollback y confusión entre productos</tspan></text><rect x="10" y="288" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Manifiesto firmado con secuencia</tspan></text><rect x="290" y="288" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="309.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Que el verificador recuerde la última</tspan></text><text x="457" y="325.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">secuencia</tspan></text><rect x="630" y="288" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Clave robada y CI comprometido</tspan></text><rect x="10" y="346" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="375.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Con revocación</tspan></text><rect x="290" y="346" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Que la lista de revocación llegue a tiempo</tspan></text><rect x="630" y="346" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">El hueco entre el robo y la revocación</tspan></text><rect x="10" y="408" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada fila añade una confianza y cierra un ataque: se trata de mover la confianza a un lugar más pequeño y más fácil de</tspan></text><text x="470" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">proteger, no de eliminarla. La clave fijada es una raíz de confianza que hay que distribuir, rotar y proteger.</tspan></text><text x="470" y="489.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis del autor a partir de la matriz medida.</tspan></text></svg>
