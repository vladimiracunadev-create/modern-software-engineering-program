h="424" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="316.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Hacer opcional un parámetro obligatorio</tspan></text><rect x="440" y="296" width="134" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">menor</tspan></text><rect x="580" y="296" width="134" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">mayor</tspan></text><rect x="720" y="296" width="154" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Sobrestima</tspan></text><rect x="10" y="336" width="424" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="356.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Quitar un método de una clase</tspan></text><rect x="440" y="336" width="134" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">mayor</tspan></text><rect x="580" y="336" width="134" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">mayor</tspan></text><rect x="720" y="336" width="154" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Acierta</tspan></text><rect x="10" y="376" width