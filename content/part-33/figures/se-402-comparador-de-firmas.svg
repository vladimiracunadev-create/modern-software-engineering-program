 x="10" y="456" width="424" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="476.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Lanzar una excepción nueva ante entrada inválida</tspan></text><rect x="440" y="456" width="134" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="476.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">mayor</tspan></text><rect x="580" y="456" width="134" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="476.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">parche</tspan></text><rect x="720" y="456" width="154" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="476.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Subestima</tspan></text><rect x="10" y="496" width="424" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="516.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Corregir un error sin cambiar la firma</tspan></text><rect x="440" y="496" width="134" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="516.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">parche</tspan></text><rect x="580" y="496" width="134" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="516.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">parche</tspan></text><rect x="720" y="496" width="154" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="516.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Acierta</tspan></text><rect x="10" y="540" width="870" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="445" y="564.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Acierta 10 de 14 (se omiten dos filas de acierto por espacio: añadir un método a una clase y cambiar un interno</tspan></text><text x="445" y="581.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">privado). Los tres errores graves son los cambios de comportamiento: la firma es idéntica y el significado cambió, y</tspan></text><text x="445" y="598.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">ninguna herramienta que lea solo firmas puede verlos.</tspan></text><text x="445" y="637.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
