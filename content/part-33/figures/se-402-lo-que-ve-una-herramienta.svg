<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 445" width="940" height="445" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los catorce cambios de la API agrupados por lo que una herramienta de firmas puede ver</title><desc id="d">Tabla: de 14 cambios, 5 rompen y la firma lo delata, 3 rompen sin cambiar la firma, 1 es compatible pero provoca una alarma, 3 añaden capacidad sin romper y 2 no cambian nada visible.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="445" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Grupo</tspan></text><rect x="320" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">Cambios</tspan></text><rect x="420" y="12" width="504" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Ejemplos</tspan></text><rect x="10" y="56" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Rompe y la firma lo dice</tspan></text><rect x="320" y="56" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">5</tspan></text><rect x="420" y="56" width="504" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="77.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Quitar, renombrar, añadir obligatorio, cambiar el valor por</tspan></text><text x="672" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">defecto, quitar método</tspan></text><rect x="10" y="114" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Rompe y la firma no lo dice</tspan></text><rect x="320" y="114" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">3</tspan></text><rect x="420" y="114" width="504" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Escala de la nota, orden del listado, excepción nueva</tspan></text><rect x="10" y="172" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">No rompe y la herramienta alarma</tspan></text><rect x="320" y="172" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">1</tspan></text><rect x="420" y="172" width="504" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Hacer opcional un parámetro obligatorio</tspan></text><rect x="10" y="230" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Añade capacidad sin romper</tspan></text><rect x="320" y="230" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">3</tspan></text><rect x="420" y="230" width="504" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Función nueva, parámetro opcional, método nuevo</tspan></text><rect x="10" y="288" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">No cambia nada visible</tspan></text><rect x="320" y="288" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">2</tspan></text><rect x="420" y="288" width="504" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Interno privado, corrección sin cambio de firma</tspan></text><rect x="10" y="350" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los 3 cambios que rompen sin cambiar la firma son el 37,5 % de los 8 incompatibles: ese es el hueco de la automatización y</tspan></text><text x="470" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el motivo de las pruebas de contrato y del changelog revisado por una persona.</tspan></text><text x="470" y="431.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Catorce cambios construidos por el autor sobre una API de cuatro elementos públicos.</tspan></text></svg>
