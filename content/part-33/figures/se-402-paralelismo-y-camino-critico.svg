<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 351" width="960" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de aplicar un grafo de 60 recursos y 86 dependencias según cuántos se crean a la vez</title><desc id="d">Barras: aplicar el grafo de 60 recursos tarda 2 832 segundos de uno en uno, 1 423 con dos en paralelo, 798 con cuatro y 577 con diez o con sesenta, que es el camino crítico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="351" fill="#ffffff"/><text x="210" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">Un recurso a la vez</tspan></text><rect x="220" y="16" width="481.44" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="709.44" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="709.44" dy="0">2 832 s</tspan></text><text x="210" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">2 en paralelo</tspan></text><rect x="220" y="60" width="241.91" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="469.91" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="469.91" dy="0">1 423 s</tspan></text><text x="210" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">4 en paralelo</tspan></text><rect x="220" y="104" width="135.66" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="363.66" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363.66" dy="0">798 s</tspan></text><text x="210" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">10 en paralelo</tspan></text><rect x="220" y="148" width="98.09" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="326.09" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="326.09" dy="0">577 s (= camino crítico)</tspan></text><text x="210" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="210" dy="0">60 en paralelo</tspan></text><rect x="220" y="192" width="98.09" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="326.09" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="326.09" dy="0">577 s</tspan></text><rect x="10" y="240" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El paralelismo ayuda hasta el camino crítico, la cadena más larga de dependencias, y después no sirve: pasar de 10 a 60</tspan></text><text x="480" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">trabajos no ahorra un segundo. Las duraciones (5–120 s) y la forma del grafo son sintéticas; con un límite de tasa del</tspan></text><text x="480" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">proveedor el tope práctico sería menor. Una arista de más que cierre un ciclo hace imposible el orden.</tspan></text><text x="480" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
