<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Semanas con divergencia entre preproducción y producción en 52 semanas, según las ediciones manuales por semana</title><desc id="d">Líneas con las semanas con divergencia de 52 según las ediciones manuales por semana (0,1, 0,3 y 0,6): sin promoción son 38,0, 48,3 y 50,5; con una promoción que copia la configuración cada 4 semanas son 5,0, 13,7 y 24,1. Sin promoción, además, quedan 3,34, 9,32 y 17,39 claves distintas al final; con ella, 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Semanas con divergencia entre preproducción y producción en 52 semanas, según las ediciones manuales por</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">semana</tspan></text><circle cx="22" cy="70" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin promoción</tspan></text><rect x="162.02" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="182.02" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Con promoción cada 4 semanas</tspan></text><line x1="71.08" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="406" 