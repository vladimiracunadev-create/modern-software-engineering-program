0" fill="#142231"><tspan x="410.248" dy="0">0,3</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0,6</tspan></text><line x1="71.08" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Semanas con divergencia (de 52)</text><text x="490.54" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Ediciones manuales por semana</tspan></text><line x1="71.08" y1="106" x2="910" y2="106" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="77.08" y="100" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="77.08" dy="0">52 semanas: todo el año</tspan></text><polyline points="89.08,186.769 410.248,127.346 892,114.654" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="89.08" cy="186.769" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="175.769" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">38,0</tspan></text><circle cx="410.248" cy="127.346" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="410.248" y="116.346" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="410.248" dy="0">48,3</tspan></text><circle cx="892" cy="114.654" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="103.654" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">50,5</tspan></text><polyline points="89.08,377.154 410.248,326.962 892,266.962" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="371.654" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="89.08" y="366.154" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">5,0</tspan></text><rect x="404.748" y="321.462" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="410.248" y="315.962" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="410.248" dy="0">13,7</tspan></text><rect x="886.5" y="261.462" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="255.962" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">24,1</tspan></text><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La promoción no impide la divergencia, la acota en el tiempo: dura hasta la siguiente copia. Sin ella las diferencias se</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">acumulan, la probabilidad de la edición manual es un supuesto del autor, y la experiencia de «en preproducción funcionaba»</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">deja de significar nada tras unas semanas.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
