<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 573" width="940" height="573" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo hasta detectar un defecto que sube el error de 0,5 % a 1,5 % según la fracción de tráfico que recibe el canario</title><desc id="d">Líneas en escalas logarítmicas con el tiempo hasta detectar un defecto que sube el error de 0,5 a 1,5 por ciento según la fracción de tráfico del canario: la mediana baja de 58 s con el 1 por ciento a 8 s con el 50 y el percentil 95 de 268 s a 17 s; se detecta en 40 de 40 semillas en todos los casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="573" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tiempo hasta detectar un defecto que sube el error de 0,5 % a 1,5 % según la fracción de tráfico que recibe</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">el canario</tspan></text><circle cx="22" cy="70" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Percentil 95</tspan></text><rect x="154.48" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="174.48" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Mediana</tspan></text><line x1="93.7" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="406" x2="93.7" y2="406" 