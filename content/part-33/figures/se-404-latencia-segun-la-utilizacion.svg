<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una cola de un servidor: tiempo en el sistema según la utilización, en unidades del tiempo de servicio</title><desc id="d">Líneas con el tiempo medio y el percentil 99 en el sistema, en unidades del tiempo de servicio, según la utilización del 50, 70, 80, 90 y 95 por ciento: la media simulada va de 2,00 a 20,7 y el percentil 99 de 9,3 a 103; las curvas teóricas (2 a 20 y 9,2 a 92) casi las cubren. El tiempo se dispara pasado el 80 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una cola de un servidor: tiempo en el sistema según la utilización, en unidades del tiempo de servicio</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Media simulada</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Media teórica</tspan></text><polygon points="321.58,44.1 328.18,56.4 314.98,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="335.58" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="335.58" dy="0">Percentil 99 simulado</tsp