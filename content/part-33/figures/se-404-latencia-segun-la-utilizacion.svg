e="#946512" stroke-width="2"/><polygon points="450.122,343.165 456.997,350.04 450.122,356.915 443.247,350.04" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="626.873,324.925 633.748,331.8 626.873,338.675 619.998,331.8" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="803.624,269.485 810.499,276.36 803.624,283.235 796.749,276.36" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="892,159.325 898.875,166.2 892,173.075 885.125,166.2" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">De 80 a 95 % de utilización el tiempo medio se cuadruplica: ese es el codo que el escalado debe evitar. La simulación de</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">200 000 clientes de Poisson con servicio exponencial coincide con la fórmula 1 ÷ (μ − λ); no representa colas con ráfagas,</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">prioridades ni varios servidores.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
