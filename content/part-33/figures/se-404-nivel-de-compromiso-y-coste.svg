<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" width="960" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste de siete días de demanda según cuántas instancias se compromete (precio comprometido 0,6; bajo demanda 1,0)</title><desc id="d">Barras: pagar todo bajo demanda cuesta 1 124 unidades; comprometer 4 instancias baja a 862, 7 (la mediana de lo necesario) a 854, el mínimo; 9 sube a 943, 14 a 1 426 y 30, el máximo, a 3 024.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="395" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Todo bajo demanda</tspan></text><rect x="300" y="16" width="224.8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="532.8" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="532.8" dy="0">1 124 (0 comprometidas)</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Compromiso de 4</tspan></text><rect x="300" y="60" width="172.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480.4" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="480.4" dy="0">862</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Compromiso de 7 (mediana)</tspan></text><rect x="300" y="104" width="170.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="478.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="478.8" dy="0">854 (el mínimo)</tspan></text><text x="290" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Compromiso de 9</tspan></text><rect x="300" y="148" width="188.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="496.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="496.6" dy="0">943</tspan></text><text x="290" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Compromiso de 14</tspan></text><rect x="300" y="192" width="285.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="593.2" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="593.2" dy="0">1 426</tspan></text><text x="290" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Compromiso de 30 (el máximo)</tspan></text><rect x="300" y="236" width="604.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="912.8" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="912.8" dy="0">3 024</tspan></text><rect x="10" y="284" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El compromiso óptimo está en torno a la mediana de la demanda, no en el promedio ni en el máximo: comprometer de más cuesta</tspan></text><text x="480" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">más que no comprometer. Los precios son unidades inventadas con una rebaja del 40 %; no son tarifas de ningún proveedor, y el</tspan></text><text x="480" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">óptimo depende de que el patrón se repita durante la duración del compromiso.</tspan></text><text x="480" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
