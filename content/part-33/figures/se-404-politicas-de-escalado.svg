<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="940" height="590" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete días de tráfico con picos: demanda sin atender frente a instancias-hora, según la política</title><desc id="d">Dispersión con seis políticas de escalado, con las instancias-hora en el eje horizontal y el porcentaje de demanda sin atender en el vertical: 12 instancias fijas, 2 016 y 1,64; 30 fijas, 5 040 y 0; reactivo inmediato, 1 910 y 0; reactivo con arranque de 2 y 5 minutos, 1 866 y 0,34 y 1 813 y 0,84; programado, 1 762 y 1,85. Reservar para el pico cuesta 2,6 veces más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="590" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Siete días de tráfico con picos: demanda sin atender frente a instancias-hora, según la política</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Fijo</tspan></text><rect x="94.16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="114.16" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="114.16" dy="0">Reactivo</tspan></text><polygon points="208.48,44.1 215.08,56.4 201.88,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="222.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="222.48" dy="0">Programado</tspan></text><line x1="78.62" y1="407" x2="910" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="407" x2="78.62" y2="407" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,5</tspan></text><line x1="78.62" y1="247" x2="910" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="247" x2="78.62" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="167" x2="910" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="167" x2="78.62" y2="167" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="171.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1,5</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">2</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="407" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="407" x2="96.62" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1 500</tspan></text><line x1="295.465" y1="87" x2="295.465" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="295.465" y1="407" x2="295.465" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="295.465" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295.465" dy="0">2 500</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="407" x2="494.31" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">3 500</tspan></text><line x1="693.155" y1="87" x2="693.155" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="693.155" y1="407" x2="693.155" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="693.155" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.155" dy="0">4 500</tspan></text><line x1="892" y1="87" x2="892" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="407" x2="892" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">5 500</tspan></text><line x1="78.62" y1="407" x2="910" y2="407" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 247)">Demanda sin atender (%)</text><text x="494.31" y="453" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Instancias-hora en siete días</tspan></text><circle cx="199.224" cy="144.6" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="209.224" y="149.1" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="209.224" dy="0">12 fijas</tspan></text><circle cx="800.531" cy="407" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="800.531" y="396" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="800.531" dy="0">30 fijas</tspan></text><rect x="172.646" y="401.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="188.146" y="411.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="188.146" dy="0">Inmediato</tspan></text><rect x="163.897" y="347.1" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="159.397" y="357.1" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="159.397" dy="0">2 min</tspan></text><rect x="153.358" y="267.1" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="148.858" y="277.1" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="148.858" dy="0">5 min</tspan></text><polygon points="148.717,104.675 154.767,115.95 142.667,115.95" fill="#946512" stroke="#946512" stroke-width="2"/><text x="148.717" y="100" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="148.717" dy="0">Programado</tspan></text><rect x="10" y="467" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El arranque tarda y eso se paga en demanda perdida: cada minuto de retardo añade unos 0,17 puntos porcentuales de demanda</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">perdida en este tráfico. Reservar para el peor pico cuesta 2,6 veces más que escalar con reacción. Capacidad de 20</tspan></text><text x="470" y="525.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solicitudes por segundo por instancia, objetivo del 60 % y picos de 2,5 a 4 veces son supuestos del autor.</tspan></text><text x="470" y="572.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
