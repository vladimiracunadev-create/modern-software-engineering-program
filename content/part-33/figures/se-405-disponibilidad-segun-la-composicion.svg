<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Minutos de caída al año al combinar dos proveedores que fallan de forma independiente</title><desc id="d">Barras horizontales en escala logarítmica con los minutos de caída al año: un proveedor de 99,95 por ciento pierde 262,8; dos con conmutación perfecta, 0,1; dos con conmutación que acierta el 90 por ciento, 26,4; dos con un DNS compartido de 99,95 por ciento, 262,9; dos exigiendo ambos a la vez, 525,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Minutos de caída al año al combinar dos proveedores que fallan de forma independiente</tspan></text><line x1="354" y1="49" x2="354" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="239" x2="354" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0,1</tspan></text><line x1="484.425" y1="49" x2="484.425" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="484.425" y1="239" x2="484.425" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="484.425" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="484.425" dy="0">1</tspan></text><line x1="614.85" y1="49" x2="614.85" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="614.85" y1="239" x2="614.85" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="614.85" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="614.85" dy="0">10</tspan></text><line x1="745.275" y1="49" x2="745.275" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="745.275" y1="239" x2="745.275" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="745.275" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="745.275" dy="0">100</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="239" x2="875.7" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="354" y1="239" x2="875.7" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Un proveedor (99,95 %)</tspan></text><text x="344" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Dos, conmutación perfecta (99,99998 %)</tspan></text><text x="344" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Dos, conmutación acierta el 90 % (99,995 %)</tspan></text><text x="344" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Dos con un DNS compartido (99,95 %)</tspan></text><text x="344" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Dos, exigiendo ambos a la vez (99,90 %)</tspan></text><rect x="354" y="55" width="446.005" height="26" rx="3" fill="#c0432f"/><text x="807.005" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="807.005" dy="0">262,8</tspan></text><rect x="354" y="93" width="2" height="26" rx="3" fill="#c0432f"/><text x="363" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0,1</tspan></text><rect x="354" y="131" width="315.838" height="26" rx="3" fill="#c0432f"/><text x="676.838" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="676.838" dy="0">26,4</tspan></text><rect x="354" y="169" width="446.026" height="26" rx="3" fill="#c0432f"/><text x="807.026" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="807.026" dy="0">262,9</tspan></text><rect x="354" y="207" width="485.256" height="26" rx="3" fill="#c0432f"/><text x="846.256" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="846.256" dy="0">525,5</tspan></text><text x="614.85" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Minutos de caída al año (escala logarítmica)</tspan></text><rect x="10" y="297" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Redundancia en paralelo ayuda mucho solo si la conmutación funciona y nada se comparte; una dependencia en serie con el</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">mismo 99,95 % anula el beneficio, y exigir ambos lo empeora al doble. El cálculo se verificó con 35 millones de horas</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">simuladas. La independencia de fallos y los 99,95 % son supuestos del autor, no medidas de un proveedor.</tspan></text><text x="470" y="402.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
