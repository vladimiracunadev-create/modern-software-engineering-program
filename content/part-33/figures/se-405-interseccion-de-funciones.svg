<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Funciones que ofrecen a la vez tres proveedores ficticios, frente a las que ofrece cada uno (media de 2 000 sorteos)</title><desc id="d">Mancuernas con las funciones que ofrece cada proveedor y las que ofrecen los tres a la vez: de 20 básicas, 18 y 14,6; de 20 avanzadas, 12 y 4,3; de las 40, 30 y 18,8. La intersección pierde más en las avanzadas, donde cae de 12 a 4,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Funciones que ofrecen a la vez tres proveedores ficticios, frente a las que ofrece cada uno (media de 2 000</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">sorteos)</tspan></text><circle cx="22" cy="70" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cada proveedor ofrece</tspan></text><circle cx="228.34" cy="70" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="242.34" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Los tres a la vez</tspan></text><line x1="294.24" y1="96" x2="294.24" y2="216" stroke="#d5dde1" stroke-width="1"/><line x1="294.24" y1="216" x2="294.24" y2="221" stroke="#5b7280" stroke-width="1.4"/><text x="294.24" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294.24" dy="0">0</tspan></text><line x1="484.747" y1="96" x2="484.747" y2="216" stroke="#d5dde1" stroke-width="1"/><line x1="484.747" y1="216" x2="484.747" y2="221" stroke="#5b7280" stroke-width="1.4"/><text x="484.747" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="484.747" dy="0">10</tspan></text><line x1="675.253" y1="96" x2="675.253" y2="216" stroke="#d5dde1" stroke-width="1"/><line x1="675.253" y1="216" x2="675.253" y2="221" stroke="#5b7280" stroke-width="1.4"/><text x="675.253" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675.253" dy="0">20</tspan></text><line x1="865.76" y1="96" x2="865.76" y2="216" stroke="#d5dde1" stroke-width="1"/><line x1="865.76" y1="216" x2="865.76" y2="221" stroke="#5b7280" stroke-width="1.4"/><text x="865.76" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="865.76" dy="0">30</tspan></text><line x1="294.24" y1="216" x2="865.76" y2="216" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">20 funciones básicas</tspan></text><text x="234" y="160.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">20 funciones avanzadas</tspan></text><text x="234" y="200.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">Las 40 funciones</tspan></text><line x1="637.152" y1="116" x2="572.38" y2="116" stroke="#c0432f" stroke-width="4"/><circle cx="637.152" cy="116" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="572.38" cy="116" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="649.152" y="120.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="649.152" dy="0">18</tspan></text><text x="560.38" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="560.38" dy="0">14,6</tspan></text><line x1="522.848" y1="156" x2="376.158" y2="156" stroke="#c0432f" stroke-width="4"/><circle cx="522.848" cy="156" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="376.158" cy="156" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="534.848" y="160.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="534.848" dy="0">12</tspan></text><text x="364.158" y="160.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="364.158" dy="0">4,3</tspan></text><line x1="865.76" y1="196" x2="652.393" y2="196" stroke="#c0432f" stroke-width="4"/><circle cx="865.76" cy="196" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="652.393" cy="196" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="877.76" y="200.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="877.76" dy="0">30</tspan></text><text x="640.393" y="200.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="640.393" dy="0">18,8</tspan></text><text x="580" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="580" dy="0">Funciones (de 20 o de 40)</tspan></text><rect x="10" y="274" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="298.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El mínimo común denominador se lleva más de la mitad de las funciones: 21 de 40 quedan fuera por no estar en alguno.</tspan></text><text x="470" y="315.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Portabilidad total sale a costa de no usar lo que justificó elegir el proveedor. Probar las 40 en cada uno son 120 casos</tspan></text><text x="470" y="332.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">frente a 56 si se limita a lo común. Los proveedores son ficticios y las probabilidades supuestos del autor; no se comparó</tspan></text><text x="470" y="348.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ninguna oferta real.</tspan></text><text x="470" y="396.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
