<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sesgo de versiones en 20 000 clientes con un lanzamiento cada 14 días: versiones de retraso</title><desc id="d">Barras apiladas con las versiones de retraso de 20 000 clientes con un lanzamiento cada 14 días: a los 30 días el 78,0 por ciento está al día y el 22,0 lleva 2 o 3 de retraso; a los 90 días el 78,0 está al día, el 10,8 lleva 2 o 3 y el 11,2 lleva 4 o más; a los 180 días el 88,8 está al día y el 11,2 lleva 4 o más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sesgo de versiones en 20 000 clientes con un lanzamiento cada 14 días: versiones de retraso</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Al día</tspan></text><rect x="109.24" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">1 de retraso</tspan></text><rect x="247.72" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="267.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="267.72" dy="0">2–3 de retraso</tspan></text><rect x="401.28" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="421.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="421.28" dy="0">4 o más</tspan></text><line x1="244" y1="77" x2="244" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="244" y1="197" x2="244" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="244" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">0</tspan></text><line x1="370.34" y1="77" x2="370.34" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="370.34" y1="197" x2="370.34" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="370.34" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="370.34" dy="0">20</tspan></text><line x1="496.68" y1="77" x2="496.68" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="496.68" y1="197" x2="496.68" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="496.68" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="496.68" dy="0">40</tspan></text><line x1="623.02" y1="77" x2="623.02" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="623.02" y1="197" x2="623.02" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="623.02" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="623.02" dy="0">60</tspan></text><line x1="749.36" y1="77" x2="749.36" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="749.36" y1="197" x2="749.36" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="749.36" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.36" dy="0">80</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="197" x2="875.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="244" y1="197" x2="875.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Día 30 (versión actual 2)</tspan></text><text x="234" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Día 90 (versión actual 6)</tspan></text><text x="234" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Día 180 (versión actual 12)</tspan></text><rect x="244" y="84" width="492.726" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="490.363" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="490.363" dy="0">78,0</tspan></text><rect x="736.726" y="84" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><rect x="736.726" y="84" width="138.974" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="806.213" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="806.213" dy="0">22,0</tspan></text><rect x="875.7" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="244" y="124" width="492.726" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="490.363" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="490.363" dy="0">78,0</tspan></text><rect x="736.726" y="124" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><rect x="736.726" y="124" width="68.2236" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="770.838" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="770.838" dy="0">10,8</tspan></text><rect x="804.95" y="124" width="70.7504" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="840.325" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840.325" dy="0">11,2</tspan></text><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="244" y="164" width="560.95" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="524.475" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="524.475" dy="0">88,8</tspan></text><rect x="804.95" y="164" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><rect x="804.95" y="164" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="804.95" y="164" width="70.7504" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="840.325" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840.325" dy="0">11,2</tspan></text><text x="882.7" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><text x="559.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="559.85" dy="0">% de los clientes</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los clientes abren la aplicación cada 1, 2, 3, 7, 14, 30, 60 o 120 días (distribución supuesta). Se observaron 22 caminos</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de actualización distintos y 8 712 de 182 568 actualizaciones saltaron 3 versiones o más: cada camino tiene que haberse</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">probado.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
