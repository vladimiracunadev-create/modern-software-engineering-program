<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 422" width="940" height="422" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alcance de un paso comprometido según la configuración del workflow</title><desc id="d">Diagrama de lo que alcanza un paso comprometido según la configuración del workflow: con permisos de escritura por defecto y secretos como variables alcanza código, etiquetas, releases, secretos del job y caché; con solo lectura alcanza la lectura del código; con permisos mínimos por job solo lo que ese job necesita; con pull_request_target sobre un fork, los secretos del repositorio base.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="422" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Alcance de un paso comprometido según la configuración del workflow</tspan></text><rect x="14" y="131.72" width="250" height="86.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="153.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Un paso del workflow queda</tspan></text><text x="139" y="170.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">comprometido</tspan></text><text x="139" y="186.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">qué alcanza depende de la</tspan></text><text x="139" y="203.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">configuración</tspan></text><rect x="334" y="49" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Permisos de escritura por defecto y secretos como variables del job</tspan></text><text x="630" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">código, etiquetas, releases, secretos del job y caché</tspan></text><polyline points="264,175 299,175 299,76 334,76" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="115" width="592" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="137.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">permissions: contents: read, sin secretos</tspan></text><text x="630" y="153.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">lectura del código; el artefacto puede alterarse dentro del job</tspan></text><polyline points="264,175 299,175 299,142 334,142" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="181" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">permissions: {} arriba y permisos mínimos por job</tspan></text><text x="630" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">solo lo que ese job necesita; id-token solo en el job de publicación</tspan></text><polyline points="264,175 299,175 299,208 334,208" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="247" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="269.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">pull_request_target ejecutando código de un fork</tspan></text><text x="630" y="285.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">contexto privilegiado con código no confiable: secretos del repositorio base</tspan></text><polyline points="264,175 299,175 299,274 334,274" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="315" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="339.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Es un modelo de alcance a partir de la documentación de GitHub Actions, sin medir ningún ataque. Reducir permisos no evita</tspan></text><text x="470" y="356.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el compromiso; reduce lo que se pierde cuando ocurre.</tspan></text><text x="470" y="404.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis del autor a partir de la documentación oficial.</tspan></text></svg>
