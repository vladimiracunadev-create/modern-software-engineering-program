<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 499" width="940" height="499" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Crear un primer servicio listo para producción: horas hasta terminar, mediana y percentil 90 (20 000 ensayos por fila)</title><desc id="d">Intervalos con la mediana y el percentil 90 de las horas hasta crear el servicio: a mano con 23 pasos y 2 por ciento de error por paso, 5,5 y 6,8 horas y el 62,6 por ciento sin retrabajo; camino dorado de 5 pasos con 2 por ciento, 0,28 y 0,50 horas y 90,5 por ciento; con 1 por ciento, 0,28 y 0,40 horas y 95,0 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="499" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Crear un primer servicio listo para producción: horas hasta terminar, mediana y percentil 90 (20 000 ensayos</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">por fila)</tspan></text><rect x="16" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mediana</tspan></text><polygon points="122.78,63.1 129.38,75.4 116.18,75.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Percentil 90</tspan></text><line x1="374" y1="96" x2="374" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="374" y1="318" x2="374" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="374" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374" dy="0">0</tspan></text><line x1="503" y1="96" x2="503" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="503" y1="318" x2="503" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="503" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="503" dy="0">2</tspan></text><line x1="632" y1="96" x2="632" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="632" y1="318" x2="632" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="632" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">4</tspan></text><line x1="761" y1="96" x2="761" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="761" y1="318" x2="761" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="761" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="761" dy="0">6</tspan></text><line x1="890" y1="96" x2="890" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="318" x2="890" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">8</tspan></text><line x1="374" y1="318" x2="890" y2="318" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">A mano, 23 pasos, error 2 % (62,6 % sin</tspan></text><text x="344" y="146" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">retrabajo)</tspan></text><text x="344" y="211.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Camino dorado, 5 pasos, error 2 % (90,5 %)</tspan></text><text x="344" y="285.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Camino dorado, 5 pasos, error 1 % (95,0 %)</tspan></text><line x1="728.75" y1="133" x2="812.6" y2="133" stroke="#8a9aa3" stroke-width="5"/><rect x="721.75" y="126" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="728.75" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="728.75" dy="0">5,5</tspan></text><polygon points="812.6,124.95 820.3,139.3 804.9,139.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="812.6" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="812.6" dy="0">6,8</tspan></text><line x1="392.06" y1="207" x2="406.25" y2="207" stroke="#8a9aa3" stroke-width="5"/><rect x="385.06" y="200" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="392.06" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="392.06" dy="0">0,28</tspan></text><polygon points="406.25,198.95 413.95,213.3 398.55,213.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="406.25" y="236" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="406.25" dy="0">0,5</tspan></text><line x1="392.06" y1="281" x2="399.8" y2="281" stroke="#8a9aa3" stroke-width="5"/><rect x="385.06" y="274" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="392.06" y="265" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="392.06" dy="0">0,28</tspan></text><polygon points="399.8,272.95 407.5,287.3 392.1,287.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="399.8" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="399.8" dy="0">0,4</tspan></text><text x="632" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="632" dy="0">Horas hasta tener el servicio listo</tspan></text><rect x="10" y="376" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="400.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El camino dorado gana porque tiene menos pasos que equivocarse, no porque las personas acierten más: lo que se elimina es</tspan></text><text x="470" y="417.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">la oportunidad de error. El porcentaje entre paréntesis es el éxito sin ningún error (62,8 % teórico para el manual). Los</tspan></text><text x="470" y="434.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">23 y 5 pasos, el 2 % y los tiempos son supuestos del autor, no medidas de personas ni de un equipo real.</tspan></text><text x="470" y="481.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
