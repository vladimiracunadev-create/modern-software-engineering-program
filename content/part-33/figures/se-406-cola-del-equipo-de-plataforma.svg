<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Equipo de plataforma de 4 personas y 100 servicios: espera por soporte según cuántos usan el camino dorado</title><desc id="d">Líneas con la espera media y el percentil 90 de la espera por soporte, en días hábiles, según el porcentaje de servicios que usan el camino dorado: con 20 por ciento, 0,50 y 1,40; con 50, 0,06 y 0,23; con 80, 0,01 y 0,00; con 95, 0,00 y 0,00. El equipo pasa de trabajar al 83 por ciento a hacerlo al 19.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Equipo de plataforma de 4 personas y 100 servicios: espera por soporte según cuántos usan el camino dorado</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Espera media</tspan></text><rect x="154.48" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Percentil 90</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,5</tspan></text><line x1="78.62" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="187" x2="78.62" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1,5</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">20</tspan></text><line x1="414.772" y1="87" x2="414.772" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="414.772" y1="387" x2="414.772" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="414.772" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="414.772" dy="0">50</tspan></text><line x1="732.924" y1="87" x2="732.924" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="732.924" y1="387" x2="732.924" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="732.924" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732.924" dy="0">80</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">95</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Espera por soporte (días hábiles)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Servicios que usan el camino dorado (%)</tspan></text><polyline points="96.62,287 414.772,375 732.924,385 892,387" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="287" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">0,50</tspan></text><circle cx="414.772" cy="375" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="414.772" y="364" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="414.772" dy="0">0,06</tspan></text><circle cx="732.924" cy="385" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="732.924" y="374" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="732.924" dy="0">0,01</tspan></text><circle cx="892" cy="387" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,00</tspan></text><polyline points="96.62,107 414.772,341 732.924,387 892,387" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="101.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">1,40</tspan></text><rect x="409.272" y="335.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="414.772" y="330" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="414.772" dy="0">0,23</tspan></text><rect x="727.424" y="381.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="886.5" y="381.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="126.62" y="115" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="126.62" dy="0">Con 20 %: 166 solicitudes</tspan></text><text x="126.62" y="132" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="126.62" dy="0">al mes y el equipo al 83 %</tspan></text><line x1="98.38" y1="107.24" x2="118.62" y2="110" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La espera no baja de forma lineal: de 20 a 50 % se divide por ocho y de 50 a 95 % ya es casi cero, porque el equipo sale de</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la zona de saturación (de 83 % a 58, 32 y 19 % de uso). Las 0,3 y 2,0 solicitudes por servicio al mes y el 0,4 días por</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solicitud son supuestos del autor.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
