height="24.5" rx="3" fill="#6b7c86"/><text x="906.88" y="547.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">15</tspan></text><rect x="294" y="558.5" width="605.88" height="24.5" rx="3" fill="#087f8c"/><text x="906.88" y="575.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">15</tspan></text><rect x="294" y="595" width="605.88" height="24.5" rx="3" fill="#6b7c86"/><text x="906.88" y="611.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">15</tspan></text><rect x="294" y="622.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="639.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="659" width="605.88" height="24.5" rx="3" fill="#6b7c86"/><text x="906.88" y="675.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">15</tspan></text><rect x="294" y="686.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="703.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="723" width="605.88" height="24.5" rx="3" fill="#6b7c86"/><text x="906.88" y="739.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">15</tspan></text><rect x="294" y="750.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="767.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><text x="596.94" y="825" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="596.94" dy="0">Mutaciones</tspan></text><rect x="10" y="839" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="863.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Detecta 110 de 155 (71,0 %). Las 45 que se escapan son todas formalmente correctas: están fijadas, con permisos mínimos, y</tspan></text><text x="470" y="880.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cambian de qué se fía el workflow. Las mutaciones que no cambiaron el texto (permisos ya vacíos) se descartaron.</tspan></text><text x="470" y="928.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
