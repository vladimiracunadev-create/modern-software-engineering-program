<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 946" width="940" height="946" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un escáner de reglas frente a 155 mutaciones de los workflows reales (11 operadores)</title><desc id="d">Barras horizontales con las mutaciones inyectadas y detectadas por un escáner de reglas en los workflows reales: detecta todas las que desfijan una acción, quitan permissions o los ponen en write-all, añaden pull_request_target, interpolan el título del PR o un secreto, añaden curl a bash o quitan persist-credentials, y ninguna de las tres que mantienen la forma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="946" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un escáner de reglas frente a 155 mutaciones de los workflows reales (11 operadores)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Inyectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Detectadas</tspan></text><line x1="294" y1="77" x2="294" y2="781" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="781" x2="294" y2="786" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="802" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="495.96" y1="77" x2="495.96" y2="781" stroke="#d5dde1" stroke-width="1"/><line x1="495.96" y1="781" x2="495.96" y2="786" stroke="#5b7280" stroke-width="1.4"/><text x="495.96" y="802" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.96" dy="0">5</tspan></text><line x1="697.92" y1="77" x2="697.92" y2="781" stroke="#d5dde1" stroke-width="1"/><line x1="697.92" y1="781" x2="697.92" y2="786" stroke="#5b7280" stroke-width="1.4"/><text x="697.92" y="802" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697.92" dy="0">10</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="781" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="781" x2="899.88" y2="786" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="802" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">15</tspan></text><line x1="294" y1="781" x2="899.88" y2="781" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Desfijar una acción (de SHA a v4)</tspan></text><text x="284" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Quitar permissions de nivel superior</tspan></text><text x="284" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Poner permissions en write-all</tspan></text><text x="284" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Añadir pull_request_target</tspan></text><text x="284" y="361" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Interpolar el título del PR en un</tspan></text><text x="284" y="378" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">comando</tspan></text><text x="284" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Añadir curl | bash</tspan></text><text x="284" y="497.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Quitar persist-credentials: false</tspan></text><text x="284" y="561.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Interpolar un secreto en un comando</tspan></text><text x="284" y="617" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Fijar a SHA un repositorio de otro</tspan></text><text x="284" y="634" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">dueño</tspan></text><text x="284" y="689.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Fijar a un SHA válido pero malicioso</tspan></text><text x="284" y="753.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Añadir un paso con salida de red</tspan></text><rect x="294" y="83" width="605.88" height="24.5" rx="3" fill="#6b7c86"/><text x="906.88" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">15</tspan></text><rect x="294" y="110.5" width="605.88" height="24.5" rx="3" fill="#087f8c"/><text x="906.88" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">15</tspan></text><rect x="294" y="147" width="403.92" height="24.5" rx="3" fill="#6b7c86"/><text x="704.92" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="704.92" dy="0">10</tspan></text><rect x="294" y="174.5" width="403.92" height="24.5" rx="3" fill="#087f8c"/><text x="704.92" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="704.92" dy="0">10</tspan></text><rect x="294" y="211" width="403.92" height="24.5" rx="3" fill="#6b7c86"/><text x="704.92" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#14223