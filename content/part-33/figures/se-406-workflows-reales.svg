<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 321" width="940" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escaneo real de los tres workflows de este repositorio con siete reglas</title><desc id="d">Tabla: los tres workflows del repositorio, de 83, 90 y 258 líneas, usan 5, 5 y 10 acciones, todas fijadas a un SHA de 40 caracteres, y las siete reglas del escáner no producen ningún hallazgo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="321" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Workflow</tspan></text><rect x="260" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="322" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322" dy="0">Líneas</tspan></text><rect x="390" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">Acciones usadas</tspan></text><rect x="600" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Fijadas a SHA</tspan></text><rect x="790" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">Hallazgos</tspan></text><rect x="10" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">pages.yml</tspan></text><rect x="260" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">83</tspan></text><rect x="390" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">5</tspan></text><rect x="600" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">5</tspan></text><rect x="790" y="56" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">0</tspan></text><rect x="10" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">security.yml</tspan></text><rect x="260" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">90</tspan></text><rect x="390" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">5</tspan></text><rect x="600" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">5</tspan></text><rect x="790" y="106" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">0</tspan></text><rect x="10" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">validate.yml</tspan></text><rect x="260" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">258</tspan></text><rect x="390" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">10</tspan></text><rect x="600" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">10</tspan></text><rect x="790" y="156" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">0</tspan></text><rect x="10" y="210" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un escaneo sin hallazgos dice que no hay lo que las reglas buscan, no que el CI sea seguro: el escáner solo lee el texto.</tspan></text><text x="470" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El resultado es el mismo en Windows y en Ubuntu porque lee los mismos archivos; es una medición de este repositorio en esta</tspan></text><text x="470" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fecha, no una garantía.</tspan></text><text x="470" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
