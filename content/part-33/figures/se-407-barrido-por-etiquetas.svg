<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 407" width="940" height="407" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Barrido por etiqueta de 12 recursos por entorno (2 000 entornos): entornos que quedan limpios</title><desc id="d">Barras apiladas horizontales al 100 por ciento con los entornos limpios y los que dejan algún resto según el porcentaje de recursos etiquetados: con 100 por ciento, todos limpios; con 95 por ciento, 54,0 limpios y 46,0 con restos; con 80 por ciento, 7,3 y 92,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="407" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Barrido por etiqueta de 12 recursos por entorno (2 000 entornos): entornos que quedan limpios</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Entornos sin restos</tspan></text><rect x="207.26" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Entornos con algún resto</tspan></text><line x1="254" y1="77" x2="254" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="209" x2="254" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="409.425" y1="77" x2="409.425" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="409.425" y1="209" x2="409.425" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="409.425" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409.425" dy="0">25</tspan></text><line x1="564.85" y1="77" x2="564.85" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="564.85" y1="209" x2="564.85" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="564.85" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="564.85" dy="0">50</tspan></text><line x1="720.275" y1="77" x2="720.275" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="720.275" y1="209" x2="720.275" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="720.275" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="720.275" dy="0">75</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="209" x2="875.7" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="254" y1="209" x2="875.7" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">100 % de los recursos</tspan></text><text x="244" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">etiquetados</tspan></text><text x="244" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">95 % etiquetados</tspan></text><text x="244" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">80 % etiquetados</tspan></text><rect x="254" y="84" width="621.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="564.85" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="564.85" dy="0">100 %</tspan></text><rect x="875.7" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="254" y="128" width="335.718" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="421.859" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="421.859" dy="0">54 %</tspan></text><rect x="589.718" y="128" width="285.982" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="732.709" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="732.709" dy="0">46 %</tspan></text><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="254" y="172" width="45.3841" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="276.692" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="276.692" dy="0">7 %</tspan></text><rect x="299.384" y="172" width="576.316" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="587.542" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587.542" dy="0">93 %</tspan></text><text x="882.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="564.85" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">% del total</tspan></text><rect x="10" y="267" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un barrido por etiqueta solo limpia lo que se dejó etiquetar: con un 95 % de cobertura casi la mitad de los entornos deja</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">algo. Quedan 0, 0,61 y 2,42 restos por entorno, y 100 entornos cuestan 0, 915 y 3 630 unidades en 30 días (tabla). Al medio</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">por día por resto, el coste de un resto olvidado es pequeño y el de un resto con datos o con una credencial no se mide en</tspan></text><text x="470" y="341.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">unidades. La cobertura y el coste son supuestos del autor.</tspan></text><text x="470" y="389.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
