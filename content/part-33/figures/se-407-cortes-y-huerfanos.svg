<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 425" width="940" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una creación de 12 recursos interrumpida en cada paso: restos sin rastro y conflictos al reintentar</title><desc id="d">Mapa de calor con restos sin rastro y conflictos al reintentar según la estrategia de estado y el punto del corte: si el estado se guarda solo al final, 66 y 66 con corte antes de crear y 78 y 78 con corte tras crear y antes de anotar; si se guarda tras cada recurso, 0 y 0 y 12 y 12; con intención previa, 0 y 0, y 0 restos (12 sospechosos) y 12 conflictos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="425" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una creación de 12 recursos interrumpida en cada paso: restos sin rastro y conflictos al reintentar</tspan></text><text x="598" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598" dy="0">Punto del corte y qué se cuenta</tspan></text><text x="356.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="356.5" dy="0">Antes de crear:</tspan></text><text x="356.5" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="356.5" dy="0">restos</tspan></text><text x="517.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.5" dy="0">Antes de crear:</tspan></text><text x="517.5" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.5" dy="0">conflictos</tspan></text><text x="678.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.5" dy="0">Tras crear: restos</tspan></text><text x="839.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">Tras crear:</tspan></text><text x="839.5" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">conflictos</tspan></text><text x="266" y="137.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Estado solo al final</tspan></text><text x="266" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Estado tras cada recurso</tspan></text><text x="266" y="217" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Intención antes, confirmación</tspan></text><text x="266" y="234" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">después</tspan></text><rect x="277.5" y="112.5" width="158" height="41" rx="4" fill="#c95c4a" stroke="#ffffff" stroke-width="1"/><text x="356.5" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="356.5" dy="0">66</tspan></text><rect x="438.5" y="112.5" width="158" height="41" rx="4" fill="#c95c4a" stroke="#ffffff" stroke-width="1"/><text x="517.5" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517.5" dy="0">66</tspan></text><rect x="599.5" y="112.5" width="158" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="678.5" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="678.5" dy="0">78</tspan></text><rect x="760.5" y="112.5" width="158" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="839.5" y="137.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="839.5" dy="0">78</tspan></text><rect x="277.5" y="156.5" width="158" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="356.5" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="356.5" dy="0">0</tspan></text><rect x="438.5" y="156.5" width="158" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="517.5" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.5" dy="0">0</tspan></text><rect x="599.5" y="156.5" width="158" height="41" rx="4" fill="#f2cbc3" stroke="#ffffff" stroke-width="1"/><text x="678.5" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.5" dy="0">12</tspan></text><rect x="760.5" y="156.5" width="158" height="41" rx="4" fill="#f2cbc3" stroke="#ffffff" stroke-width="1"/><text x="839.5" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">12</tspan></text><rect x="277.5" y="200.5" width="158" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="356.5" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="356.5" dy="0">0</tspan></text><rect x="438.5" y="200.5" width="158" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="517.5" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.5" dy="0">0</tspan></text><rect x="599.5" y="200.5" width="158" height="41" rx="4" fill="#fbe4de" stroke="#102a43" stroke-width="3"/><text x="678.5" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.5" dy="0">0</tspan></text><rect x="760.5" y="200.5" width="158" height="41" rx="4" fill="#f2cbc3" stroke="#ffffff" stroke-width="1"/><text x="839.5" y="225.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">12</tspan></text><text x="20" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 177)">Estrategia</text><text x="276" y="269" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="276" dy="0">0</tspan></text><rect x="291.54" y="257" width="30.5" height="14" fill="#fbe4de"/><rect x="321.54" y="257" width="30.5" height="14" fill="#f3cdc5"/><rect x="351.54" y="257" width="30.5" height="14" fill="#eab6ac"/><rect x="381.54" y="257" width="30.5" height="14" fill="#e29f93"/><rect x="411.54" y="257" width="30.5" height="14" fill="#d9887a"/><rect x="441.54" y="257" width="30.5" height="14" fill="#d17161"/><rect x="471.54" y="257" width="30.5" height="14" fill="#c85a48"/><rect x="501.54" y="257" width="30.5" height="14" fill="#c0432f"/><text x="539.54" y="269" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="539.54" dy="0">78</tspan></text><text x="562.62" y="269" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="562.62" dy="0">más oscuro = mayor (restos o conflictos)</tspan></text><rect x="10" y="285" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Guardar el estado tras cada recurso elimina el caso fácil y deja el difícil: el recurso creado cuyo registro no llegó.</tspan></text><text x="470" y="326.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Anotar la intención antes de crear lo vuelve un sospechoso que se puede reconciliar (el recuadro marca los 0 restos, pero</tspan></text><text x="470" y="343.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">con 12 sospechosos), aunque el reintento sigue chocando con él hasta que se reconcilia. Los recursos son carpetas locales,</tspan></text><text x="470" y="359.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">no recursos de una nube.</tspan></text><text x="470" y="407.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
