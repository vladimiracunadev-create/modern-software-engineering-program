<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 853" width="940" height="853" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce manipulaciones de un release firmado y la comprobación que rechaza cada una (verificador de 12 comprobaciones)</title><desc id="d">Diagrama de diez de las doce manipulaciones de un release firmado y la comprobación del verificador que rechaza cada una, desde el artefacto cambiado con el manifiesto intacto hasta el componente retirado del SBOM y re-firmado; el verificador de 12 comprobaciones rechaza las doce.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="853" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Doce manipulaciones de un release firmado y la comprobación que rechaza cada una (verificador de 12</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">comprobaciones)</tspan></text><rect x="14" y="68" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="90.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Artefacto cambiado, manifiesto intacto</tspan></text><text x="310" y="106.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">rechaza: huella del artefacto</tspan></text><polyline points="606,95 641,95 641,392 676,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="134" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="156.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">SBOM alterado</tspan></text><text x="310" y="172.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">rechaza: huella del SBOM</tspan></text><polyline points="606,161 641,161 641,392 676,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="200" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="222.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Procedencia alterada</tspan></text><text x="310" y="238.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">rechaza: huella de la procedencia</tspan></text><polyline points="606,227 641,227 641,392 676,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="266" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="288.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Firma inválida o de otra clave</tspan></text><text x="310" y="304.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">rechaza: firma del manifiesto</tspan></text><polyline points="606,293 641,293 641,392 676,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="332" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="354.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Retroceso a una secuencia menor</tspan></text><text x="310" y="370.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">rechaza: secuencia</tspan></text><polyline points="606,359 641,359 641,392 676,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="398" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="420.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Manifiesto de otro producto</tspan></text><text x="310" y="436.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">rechaza: nombre</tspan></text><polyline points="606,425 641,425 641,392 676,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="464" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="486.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Constructor o repositorio distinto</tspan></text><text x="310" y="502.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">rechaza: constructor o repositorio esperado</tspan></text><polyline points="606,491 641,491 641,392 676,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="530" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="552.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Artefacto cambiado y manifiesto re-firmado</tspan></text><text x="310" y="568.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">rechaza: sujeto de la procedencia ≠ artefacto</tspan></text><polyline points="606,557 641,557 641,392 676,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="596" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="618.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Bloqueo declarado distinto del usado</tspan></text><text x="310" y="634.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">rechaza: bloqueo ≠ materiales; SBOM ≠ bloqueo</tspan></text><polyline points="606,623 641,623 641,392 676,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="662" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="684.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Componente retirado del SBOM y re-firmado</tspan></text><text x="310" y="700.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">rechaza: SBOM ≠ bloqueo</tspan></text><polyline points="606,689 641,689 641,392 676,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="676" y="357" width="250" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="801" y="379" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="801" dy="0">Verificador de 12</tspan></text><text x="801" y="395.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="801" dy="0">comprobaciones</tspan></text><text x="801" y="412.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="801" dy="0">rechaza las doce manipulaciones</tspan></text><rect x="10" y="730" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="754.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Doce de doce, con firmas Ed25519 reales de openssl, idéntico en Windows y Ubuntu. Las cajas agrupan 12 casos en 10 por</tspan></text><text x="470" y="771.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">espacio. Que el verificador las rechace sirve para las manipulaciones que el autor imaginó; no demuestra que haya cubierto</tspan></text><text x="470" y="788.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las que no imaginó.</tspan></text><text x="470" y="835.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
