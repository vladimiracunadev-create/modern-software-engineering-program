<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 631" width="940" height="631" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce manipulaciones de un release firmado y la comprobación que rechaza cada una (verificador de 12 comprobaciones)</title><desc id="d">Tabla: el verificador rechaza las doce manipulaciones, desde un artefacto cambiado o un SBOM alterado hasta un manifiesto re-firmado con un artefacto distinto o un componente retirado del SBOM, y en cada caso la comprobación que falla es distinta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="631" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Manipulación</tspan></text><rect x="460" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Comprobación que la rechaza</tspan></text><rect x="10" y="56" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Artefacto cambiado, manifiesto intacto</tspan></text><rect x="460" y="56" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Huella del artefacto</tspan></text><rect x="10" y="102" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">SBOM alterado</tspan></text><rect x="460" y="102" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Huella del SBOM</tspan></text><rect x="10" y="148" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Procedencia alterada</tspan></text><rect x="460" y="148" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Huella de la procedencia</tspan></text><rect x="10" y="194" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Firma inválida o de otra clave</tspan></text><rect x="460" y="194" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Firma del manifiesto</tspan></text><rect x="10" y="240" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Retroceso a una secuencia menor</tspan></text><rect x="460" y="240" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Secuencia</tspan></text><rect x="10" y="286" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Manifiesto de otro producto</tspan></text><rect x="460" y="286" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Nombre</tspan></text><rect x="10" y="332" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="355.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Constructor o repositorio distinto</tspan></text><rect x="460" y="332" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Constructor / repositorio esperado</tspan></text><rect x="10" y="378" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="401.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Artefacto cambiado y manifiesto re-firmado</tspan></text><rect x="460" y="378" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Sujeto de la procedencia ≠ artefacto</tspan></text><rect x="10" y="424" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="447.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Bloqueo declarado distinto del usado</tspan></text><rect x="460" y="424" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="447.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Bloqueo ≠ materiales; SBOM ≠ bloqueo</tspan></text><rect x="10" y="470" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="493.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Componente retirado del SBOM y re-firmado</tspan></text><rect x="460" y="470" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="493.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">SBOM ≠ bloqueo</tspan></text><rect x="10" y="520" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="544.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Doce de doce, con firmas Ed25519 reales de openssl, idéntico en Windows y Ubuntu. Las filas agrupan 12 casos en 10 líneas</tspan></text><text x="470" y="561.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por espacio. Que el verificador las rechace sirve para las manipulaciones que el autor imaginó; no demuestra que haya</tspan></text><text x="470" y="578.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cubierto las que no imaginó.</tspan></text><text x="470" y="617.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
