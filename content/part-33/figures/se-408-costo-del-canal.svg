<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 345" width="930" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo medido de los pasos del canal sintético de release (una lectura por celda)</title><desc id="d">Tabla: construir, generar SBOM y procedencia y firmar toma 42,7 milisegundos en Windows y 7,3 en Ubuntu; republicar el contenido anterior con una nueva secuencia, 45,4 y 7,1; reconstruir y comparar, 0,7 y 0,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="345" fill="#ffffff"/><rect x="10" y="12" width="504" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="262" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="262" dy="0">Paso</tspan></text><rect x="520" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">Windows 11</tspan></text><rect x="720" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Ubuntu WSL2</tspan></text><rect x="10" y="56" width="504" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="262" dy="0">Construir, generar SBOM y procedencia y firmar 1.4.0</tspan></text><rect x="520" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">42,7 ms</tspan></text><rect x="720" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">7,3 ms</tspan></text><rect x="10" y="114" width="504" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="262" dy="0">Republicar el contenido de 1.4.0 como 1.4.2</tspan></text><rect x="520" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">45,4 ms</tspan></text><rect x="720" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">7,1 ms</tspan></text><rect x="10" y="172" width="504" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="262" dy="0">Reconstruir 1.4.0 desde la fuente y comparar</tspan></text><rect x="520" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">0,7 ms</tspan></text><rect x="720" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0,8 ms</tspan></text><rect x="10" y="234" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">El árbol sintético tiene 42 archivos de unos cientos de bytes; el costo de un proyecto real lo dominan la compilación y la</tspan></text><text x="465" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">descarga de dependencias, no la firma. Las cifras cambian en cada ejecución y entre equipos; las diferencias entre</tspan></text><text x="465" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">sistemas reflejan sobre todo el arranque de procesos de openssl.</tspan></text><text x="465" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Mediciones de reloj: una lectura por celda, no reproducibles al milisegundo.</tspan></text></svg>
