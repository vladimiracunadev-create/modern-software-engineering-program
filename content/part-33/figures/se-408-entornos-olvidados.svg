<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Gasto de un mes con entornos de laboratorio de 5 unidades por día y un 15 % que se olvida (500 meses)</title><desc id="d">Barras horizontales agrupadas con el gasto mediano y el percentil 90 del mes: sin plazo, 340 y 570 unidades; con plazo de 24 horas y barrido diario, 110 y 110, el mínimo sin olvidos; con el mismo plazo pero un barrido que falla el 20 por ciento de los días, 110 y 120.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Gasto de un mes con entornos de laboratorio de 5 unidades por día y un 15 % que se olvida (500 meses)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Gasto mediano del mes</tspan></text><rect x="222.34" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Percentil 90</tspan></text><line x1="294" y1="77" x2="294" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="269" x2="294" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="493.273" y1="77" x2="493.273" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="493.273" y1="269" x2="493.273" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="493.273" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="493.273" dy="0">200</tspan></text><line x1="692.547" y1="77" x2="692.547" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="692.547" y1="269" x2="692.547" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="692.547" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692.547" dy="0">400</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="269" x2="891.82" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">600</tspan></text><line x1="294" y1="269" x2="891.82" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">A mano, sin plazo</tspan></text><text x="284" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Plazo de 24 h con barrido diario</tspan></text><text x="284" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Plazo de 24 h, el barrido falla el 20</tspan></text><text x="284" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">% de los días</tspan></text><rect x="294" y="83" width="338.765" height="24.5" rx="3" fill="#087f8c"/><text x="639.765" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="639.765" dy="0">340</tspan></text><rect x="294" y="110.5" width="567.929" height="24.5" rx="3" fill="#c0432f"/><text x="868.929" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="868.929" dy="0">570</tspan></text><rect x="294" y="147" width="109.6" height="24.5" rx="3" fill="#087f8c"/><text x="410.6" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="410.6" dy="0">110</tspan></text><rect x="294" y="174.5" width="109.6" height="24.5" rx="3" fill="#c0432f"/><text x="410.6" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="410.6" dy="0">110</tspan></text><rect x="294" y="211" width="109.6" height="24.5" rx="3" fill="#087f8c"/><text x="410.6" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="410.6" dy="0">110</tspan></text><rect x="294" y="238.5" width="119.564" height="24.5" rx="3" fill="#c0432f"/><text x="420.564" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="420.564" dy="0">120</tspan></text><text x="592.91" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592.91" dy="0">Unidades de gasto en un mes</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El plazo convierte un coste abierto en uno acotado: el olvido pasa de costar hasta 30 días a costar uno o dos. Los 110 son</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">22 días hábiles por 5 unidades. El precio, la tasa de olvido del 15 % y el fallo del barrido son supuestos del autor, no</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">medidas de un equipo.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
