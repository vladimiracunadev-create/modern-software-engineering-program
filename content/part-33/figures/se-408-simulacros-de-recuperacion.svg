<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 451" width="940" height="451" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro simulacros de recuperación del canal de release y su resultado</title><desc id="d">Tabla: reinstalar un bundle antiguo firmado es rechazado por la secuencia y se resuelve republicando el mismo contenido como 1.4.2 con secuencia 16; perder el repositorio se resuelve reconstruyendo con la misma huella; rotar la clave funciona si la declaración se firmó con la clave vigente; perder la clave sin rotación previa deja a los clientes rechazando todo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="451" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Simulacro</tspan></text><rect x="340" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Resultado observado</tspan></text><rect x="640" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Cómo se recupera</tspan></text><rect x="10" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="83.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Reinstalar el bundle firmado de 1.4.0 tras</tspan></text><text x="172" y="99.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">publicar 1.4.1</tspan></text><rect x="340" y="56" width="294" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Rechazado: secuencia (retroceso)</tspan></text><rect x="640" y="56" width="284" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Republicar como 1.4.2 con secuencia 16</tspan></text><rect x="10" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Perder el repositorio de releases</tspan></text><rect x="340" y="126" width="294" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Reconstrucción idéntica a la publicada</tspan></text><rect x="640" y="126" width="284" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="153.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Reconstruir desde la fuente y comparar</tspan></text><text x="782" y="169.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">huellas</tspan></text><rect x="10" y="196" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Rotar la clave de firma</tspan></text><rect x="340" y="196" width="294" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="223.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Declaración firmada con la clave</tspan></text><text x="487" y="239.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">vigente; 1.5.0 verifica con la nueva</tspan></text><rect x="640" y="196" width="284" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="223.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Declarar la rotación antes de</tspan></text><text x="782" y="239.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">necesitarla</tspan></text><rect x="10" y="266" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="301.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Perder la clave privada sin rotación previa</tspan></text><rect x="340" y="266" width="294" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="293.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Toda versión nueva rechazada por los</tspan></text><text x="487" y="309.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">clientes</tspan></text><rect x="640" y="266" width="284" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="293.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Acción humana por un canal de confianza</tspan></text><text x="782" y="309.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">anterior</tspan></text><rect x="10" y="340" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los tres primeros se resuelven con lo que el canal ya tiene; el cuarto es el que no se recupera con automatización: la</tspan></text><text x="470" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">recuperación de una clave perdida depende de un canal que los clientes ya hayan aceptado. Es un simulacro con un solo</tspan></text><text x="470" y="398.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">proceso y no la operación de un repositorio real.</tspan></text><text x="470" y="437.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
