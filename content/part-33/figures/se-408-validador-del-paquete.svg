<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 363" width="940" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador de paquetes frente a 208 mutaciones: las que detecta y las que no</title><desc id="d">Barras apiladas horizontales con las mutaciones detectadas y no detectadas: de las 128 de ocho familias estructurales (sección faltante, módulo duplicado, hash alterado, secreto literal y otras) detecta las 128; de las 80 de cinco familias que exigen interpretar el contenido, como una prueba de destrucción caducada o un gasto muy superior al tope, no detecta ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="363" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un validador de paquetes frente a 208 mutaciones: las que detecta y las que no</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="294" y1="77" x2="294" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="165" x2="294" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="487.9" y1="77" x2="487.9" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="487.9" y1="165" x2="487.9" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="487.9" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487.9" dy="0">50</tspan></text><line x1="681.8" y1="77" x2="681.8" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="681.8" y1="165" x2="681.8" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="681.8" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="681.8" dy="0">100</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">150</tspan></text><line x1="294" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Ocho familias estructurales (16</tspan></text><text x="284" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">mutaciones cada una)</tspan></text><text x="284" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Cinco familias de contenido (16 cada</tspan></text><text x="284" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">una)</tspan></text><rect x="294" y="84" width="496.384" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="542.192" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542.192" dy="0">128</tspan></text><rect x="790.384" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="797.384" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="797.384" dy="0">128</tspan></text><rect x="294" y="128" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="128" width="310.24" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="449.12" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="449.12" dy="0">80</tspan></text><text x="611.24" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="611.24" dy="0">80</tspan></text><text x="584.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Mutaciones sembradas</tspan></text><rect x="10" y="223" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El validador ve la forma y las coincidencias exactas; no ve la verdad de lo que el paquete afirma. Que apruebe un paquete</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">solo significa que está completo y coherente en forma. Cada familia detectó 16 de 16 o 0 de 16, y la tabla las nombra una</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">por una. Las mutaciones y las reglas las escribí yo, así que 16 de 16 describe estas reglas contra estos defectos, no una</tspan></text><text x="470" y="297.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cobertura general.</tspan></text><text x="470" y="345.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
