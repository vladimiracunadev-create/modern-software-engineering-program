<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 287" width="940" height="287" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Releases cruzados: cada sistema verifica el release que construyó el otro</title><desc id="d">Tabla: el release construido y firmado en Windows se verifica sin fallos en Windows y en Ubuntu, el construido en Ubuntu se verifica sin fallos en ambos, y los dos tienen la misma huella de artefacto 802052279bf24eb8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="287" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Origen</tspan></text><rect x="360" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Verificado en Windows</tspan></text><rect x="550" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Verificado en Ubuntu</tspan></text><rect x="740" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Huella del artefacto</tspan></text><rect x="10" y="56" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Construido y firmado en Windows (OpenSSL 3.5.7)</tspan></text><rect x="360" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Sin fallos</tspan></text><rect x="550" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">Sin fallos</tspan></text><rect x="740" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">802052279bf24eb8</tspan></text><rect x="10" y="114" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Construido y firmado en Ubuntu (OpenSSL 3.0.13)</tspan></text><rect x="360" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Sin fallos</tspan></text><rect x="550" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">Sin fallos</tspan></text><rect x="740" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">802052279bf24eb8</tspan></text><rect x="10" y="176" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las claves son distintas en cada origen y las firmas también; lo idéntico es el artefacto, porque el build es reproducible</tspan></text><text x="470" y="217.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entre sistemas. Verificar una firma con otra versión de openssl es una prueba modesta de interoperabilidad, no de</tspan></text><text x="470" y="234.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">portabilidad de todo el canal.</tspan></text><text x="470" y="273.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
