<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 353" width="960" height="353" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El bucle de un producto SaaS: cada vuelta de la entrega depende de la facturación y de la operación</title><desc id="d">Diagrama de dos filas con ocho cajas: venta, alta, uso y medición en la primera; factura, cobro, renovación y mejora entregada en la segunda; una nota dice que si un eslabón falla el ingreso se interrumpe aunque el producto siga arriba.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="353" fill="#ffffff"/><rect x="10" y="14" width="202" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Venta</tspan></text><text x="111" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Un plan, un precio y un</tspan></text><text x="111" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">contrato</tspan></text><rect x="256" y="14" width="202" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Alta</tspan></text><text x="357" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Inquilino creado y</tspan></text><text x="357" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">configurado</tspan></text><polyline points="212,62 256,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="603" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">Uso</tspan></text><text x="603" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">Cada acción deja un</tspan></text><text x="603" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">evento</tspan></text><polyline points="458,62 502,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="849" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">Medición</tspan></text><text x="849" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">Eventos únicos por</tspan></text><text x="849" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">periodo</tspan></text><polyline points="704,62 748,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="150" width="202" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="111" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="111" dy="0">Factura</tspan></text><text x="111" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="111" dy="0">Importe a partir de</tspan></text><text x="111" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="111" dy="0">medición y plan</tspan></text><rect x="256" y="150" width="202" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="357" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="357" dy="0">Cobro</tspan></text><text x="357" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="357" dy="0">Con clave de</tspan></text><text x="357" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="357" dy="0">idempotencia</tspan></text><polyline points="212,198 256,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="150" width="202" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="603" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="603" dy="0">Renovación</tspan></text><text x="603" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="603" dy="0">O baja, con su motivo</tspan></text><polyline points="458,198 502,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="150" width="202" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="849" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">Mejora entregada</tspan></text><text x="849" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">Sin ventana de</tspan></text><text x="849" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">instalación</tspan></text><polyline points="704,198 748,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="849,110 849,130 111,130 111,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="260" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La diferencia con el software que se vende una vez: aquí la fila de abajo se repite cada ciclo y es parte del producto. Una</tspan></text><text x="480" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">factura mal medida o un cobro duplicado es un defecto del producto, no un problema de contabilidad.</tspan></text><text x="480" y="343.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
