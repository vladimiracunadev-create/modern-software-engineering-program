<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién paga cada categoría de costo por cliente: licencia instalada frente a SaaS en dos momentos</title><desc id="d">Barras apiladas con tres categorías de costo por cliente, en unidades inventadas: licencia instalada 100 en total con 60 de desarrollo, 0 de operación y 40 de adquisición; SaaS en el mes 1, 145 con 25, 40 y 80; SaaS en el mes 36, 65 con 25, 40 y 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién paga cada categoría de costo por cliente: licencia instalada frente a SaaS en dos momentos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Desarrollo y soporte repartidos</tspan></text><rect x="297.74" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="317.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="317.74" dy="0">Operación de la infraestructura</tspan></text><rect x="579.48" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="599.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="599.48" dy="0">Adquisición del cliente</tspan></text><line x1="254" y1="77" x2="254" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="197" x2="254" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="461.233" y1="77" x2="461.233" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="461.233" y1="197" x2="461.233" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="461.233" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.233" dy="0">50</tspan></text><line x1="668.467" y1="77" x2="668.467" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="668.467" y1="197" x2="668.467" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="668.467" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="668.467" dy="0">100</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="197" x2="875.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">150</tspan></text><line x1="254" y1="197" x2="875.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Licencia instalada (una vez)</tspan></text><text x="244" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">SaaS en el mes 1</tspan></text><text x="244" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">SaaS en el mes 36</tspan></text><rect x="254" y="84" width="248.68" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="378.34" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="378.34" dy="0">60</tspan></text><rect x="502.68" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="502.68" y="84" width="165.787" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="585.573" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="585.573" dy="0">40</tspan></text><text x="675.467" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="675.467" dy="0">100</tspan></text><rect x="254" y="124" width="103.617" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="305.808" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="305.808" dy="0">25</tspan></text><rect x="357.617" y="124" width="165.787" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="440.51" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="440.51" dy="0">40</tspan></text><rect x="523.403" y="124" width="331.573" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="689.19" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="689.19" dy="0">80</tspan></text><text x="861.977" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="861.977" dy="0">145</tspan></text><rect x="254" y="164" width="103.617" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="305.808" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="305.808" dy="0">25</tspan></text><rect x="357.617" y="164" width="165.787" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="440.51" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="440.51" dy="0">40</tspan></text><rect x="523.403" y="164" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="530.403" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="530.403" dy="0">65</tspan></text><text x="564.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">Unidades inventadas por cliente y mes</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En SaaS el proveedor asume la operación y adelanta la adquisición: el mes 1 es más caro que una venta de licencia y el mes</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">36 es más barato por cliente. El negocio depende de que el cliente se quede el tiempo suficiente para amortizar lo</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">adelantado; por eso la retención es parte del diseño.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
