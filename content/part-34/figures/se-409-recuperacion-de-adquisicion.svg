<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Caja acumulada por un cliente que costó 300 adquirir: el mismo precio con tres tasas de baja mensual</title><desc id="d">Línea con la caja acumulada de un cliente de 49 al mes con 80 por ciento de margen y 300 de costo de adquisición, a 3 por ciento, 8 por ciento y 15 por ciento de baja mensual, cada seis meses hasta el mes 36; con 3 por ciento recupera la inversión en el mes 9, con 8 por ciento en el mes 12 y con 15 por ciento nunca llega a cero en 36 meses.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Caja acumulada por un cliente que costó 300 adquirir: el mismo precio con tres tasas de baja mensual</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Baja mensual 3 %</tspan></text><rect x="184.64" y="45" width="12" height="12" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Baja mensual 8 %</tspan></text><polygon points="359.28,44.1 365.88,56.4 352.68,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="373.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="373.28" dy="0">Baja m