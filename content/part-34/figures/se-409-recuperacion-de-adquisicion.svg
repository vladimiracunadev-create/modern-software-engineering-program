dth="2"/><rect x="229.967" y="293.6" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="361.273" y="258.5" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="492.58" y="237.2" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="623.887" y="224.3" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="755.193" y="216.5" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="886.5" y="211.7" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="206.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">166</tspan></text><polyline points="104.16,357 235.467,308.1 366.773,289.8 498.08,282.9 629.387,280.2 760.693,279.3 892,278.7" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="104.16,350.675 110.21,361.95 98.11,361.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="235.467,301.775 241.517,313.05 229.417,313.05" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="366.773,283.475 372.823,294.75 360.723,294.75" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="498.08,276.575 504.13,287.85 492.03,287.85" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="629.387,273.875 635.437,285.15 623.337,285.15" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="760.693,272.975 766.743,284.25 754.643,284.25" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="892,272.375 898.05,283.65 885.95,283.65" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="267.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">−39</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Con el mismo precio y la misma adquisición, pasar de 3 % a 15 % de baja mensual convierte un cliente que recupera lo</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">gastado en 9 meses en uno que no lo recupera nunca (la suma de sus márgenes se acerca a 261 y la adquisición cuesta 300).</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El supuesto de 80 % de margen y 49 de precio es del autor.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
