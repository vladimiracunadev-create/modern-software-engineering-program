<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 371" width="960" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro claves de caché en 600 construcciones (la dependencia cambia en el 10 % de ellas)</title><desc id="d">Tabla: la clave con el hash del lockfile acierta el 89 por ciento de las veces y tarda 26,6 segundos de instalación media; con respaldo por prefijo baja a 12,2 segundos con 11 por ciento de restauraciones parciales; la clave con el SHA del commit acierta el 17,5 por ciento y tarda 149,9 segundos; una clave fija siempre acierta pero el 97 por ciento de las construcciones usa dependencias obsoletas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="371" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Clave de la caché</tspan></text><rect x="270" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">Aciertos</tspan></text><rect x="400" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Parciales</tspan></text><rect x="540" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Instalación media</tspan></text><rect x="760" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Entorno obsoleto</tspan></text><rect x="10" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">hash del lockfile</tspan></text><rect x="270" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">89 %</tspan></text><rect x="400" y="56" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">0 %</tspan></text><rect x="540" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">26,6 s</tspan></text><rect x="760" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0 %</tspan></text><rect x="10" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">hash + respaldo</tspan></text><rect x="270" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">89 %</tspan></text><rect x="400" y="106" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">11 %</tspan></text><rect x="540" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">12,2 s</tspan></text><rect x="760" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0 %</tspan></text><rect x="10" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">SHA del commit</tspan></text><rect x="270" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">18 %</tspan></text><rect x="400" y="156" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">0 %</tspan></text><rect x="540" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">149,9 s</tspan></text><rect x="760" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0 %</tspan></text><rect x="10" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">clave fija</tspan></text><rect x="270" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">100 %</tspan></text><rect x="400" y="206" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">0 %</tspan></text><rect x="540" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">8,0 s</tspan></text><rect x="760" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">97 %</tspan></text><rect x="10" y="260" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Una clave fija da el mejor tiempo (8 s) y el peor resultado: el 97 % de las construcciones corre con dependencias que ya no</tspan></text><text x="480" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">coinciden con el lockfile. El tiempo ahorrado no compensa un resultado que no es reproducible. Los tiempos de 180, 45 y 8</tspan></text><text x="480" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">segundos son supuestos del autor.</tspan></text><text x="480" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
