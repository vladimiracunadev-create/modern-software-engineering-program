<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo mensual por cliente según el modelo de aislamiento y el número de clientes</title><desc id="d">Línea con tres series en escala logarítmica para 10, 100 y 1000 clientes: base de datos y cómputo dedicados 90 en los tres; esquema propio con cómputo compartido 58, 22 y 18,4; todo compartido 62, 8 y 2,6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo mensual por cliente según el modelo de aislamiento y el número de clientes</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Dedicado por cliente</tspan></text><rect x="214.8" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Puente: esquema propio y cómputo compartido</tspan></text><polygon points="593.02,44.1 599.62,56.4 586.42,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="607.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="607.02" dy="0">Todo compartido</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="237" x2="78.62" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">10</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">10</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="387" x2="494.31" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">100</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1000</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Costo mensual por cliente (unidades inventadas) (escala logarítmica)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Clientes (escala logarítmica)</tspan></text><polyline points="96.62,93.8636 494.31,93.8636 892,93.8636" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="93.8636" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="82.8636" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">90,0</tspan></text><circle cx="494.31" cy="93.8636" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="494.31" y="82.8636" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">90,0</tspan></text><circle cx="892" cy="93.8636" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="82.8636" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">90,0</tspan></text><polyline points="96.62,122.486 494.31,185.637 892,197.277" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="116.986" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="96.62" y="111.486" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">58,0</tspan></text><rect x="488.81" y="180.137" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="494.31" y="174.637" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">22,0</tspan></text><rect x="886.5" y="191.777" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="186.277" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">18,4</tspan></text><polyline points="96.62,118.141 494.31,251.537 892,324.754" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="96.62,111.816 102.67,123.091 90.57,123.091" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="107.141" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">62,0</tspan></text><polygon points="494.31,245.212 500.36,256.487 488.26,256.487" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="494.31" y="240.537" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">8,0</tspan></text><polygon points="892,318.429 898.05,329.704 885.95,329.704" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="313.754" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">2,6</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Con pocos clientes el costo fijo compartido pesa más que el aislamiento y las tres opciones se parecen; a 1000 clientes lo</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">compartido cuesta unas 35 veces menos que lo dedicado. El costo del modelo puente se mueve poco porque cada esquema tiene</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">un costo propio. Parámetros del autor.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
