<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 247" width="960" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde se fija el inquilino en una petición: cuatro puntos y el que falla si el anterior se omite</title><desc id="d">Diagrama de una fila con cuatro cajas: la credencial que trae el identificador del inquilino, la capa de aplicación que lo copia al contexto, el acceso a datos que lo añade a cada consulta y la base de datos con una regla de filas que lo exige; una nota dice que cada punto cubre el olvido del anterior.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="247" fill="#ffffff"/><rect x="10" y="14" width="202" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111" y="47.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Credencial</tspan></text><text x="111" y="64.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">El inquilino viaja</tspan></text><text x="111" y="80.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">firmado, no en un</tspan></text><text x="111" y="97.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">parámetro</tspan></text><rect x="256" y="14" width="202" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Contexto</tspan></text><text x="357" y="72.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Se copia una vez al</tspan></text><text x="357" y="89.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">entrar a la petición</tspan></text><polyline points="212,69 256,69" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="603" y="56" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">Acceso a datos</tspan></text><text x="603" y="72.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">Todo filtro lleva el</tspan></text><text x="603" y="89.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">inquilino</tspan></text><polyline points="458,69 502,69" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="110" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="849" y="56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">Base de datos</tspan></text><text x="849" y="72.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">Una política de filas lo</tspan></text><text x="849" y="89.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">exige aunque falte</tspan></text><polyline points="704,69 748,69" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="162.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Con una sola barrera, un olvido en una consulta nueva muestra datos de otro cliente. Con las cuatro, el olvido en la</tspan></text><text x="480" y="179.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">aplicación lo detiene la base de datos. Ninguna barrera sustituye una prueba que pida datos del cliente A con la credencial</tspan></text><text x="480" y="196.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">del cliente B.</tspan></text><text x="480" y="237.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
