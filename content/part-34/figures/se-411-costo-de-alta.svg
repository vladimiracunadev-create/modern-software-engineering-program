<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 306" width="940" height="306" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de dar de alta un cliente: una fila de inquilino frente a un esquema propio de 12 tablas</title><desc id="d">Barras horizontales en escala logarítmica con el tiempo medio por alta en milisegundos, medido con sqlite3 en memoria sobre 200 altas: una fila de inquilino 0,0069 y un esquema propio con 12 tablas 0,6864, unas 99 veces más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="306" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tiempo de dar de alta un cliente: una fila de inquilino frente a un esquema propio de 12 tablas</tspan></text><line x1="274" y1="49" x2="274" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="125" x2="274" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0,001</tspan></text><line x1="471.88" y1="49" x2="471.88" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="471.88" y1="125" x2="471.88" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="471.88" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="471.88" dy="0">0,01</tspan></text><line x1="669.76" y1="49" x2="669.76" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="669.76" y1="125" x2="669.76" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="669.76" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="669.76" dy="0">0,1</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="125" x2="867.64" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">1</tspan></text><line x1="274" y1="125" x2="867.64" y2="125" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Una fila de inquilino</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Un esquema propio de 12 tablas</tspan></text><rect x="274" y="55" width="165.991" height="26" rx="3" fill="#087f8c"/><text x="446.991" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="446.991" dy="0">0,0069</tspan></text><rect x="274" y="93" width="561.302" height="26" rx="3" fill="#087f8c"/><text x="842.302" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="842.302" dy="0">0,6864</tspan></text><text x="570.82" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="570.82" dy="0">Milisegundos por alta (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="183" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="207.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Unas 99 veces más caro en esta ejecución (otra dio unas 155) en una base en memoria, sin red, sin disco y sin migraciones;</tspan></text><text x="470" y="224.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en una base real el esquema propio también multiplica el número de objetos que cada migración debe recorrer. La comparación</tspan></text><text x="470" y="241.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mide el mecanismo, no el tiempo que tardaría un proveedor.</tspan></text><text x="470" y="288.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y sqlite3; los recuentos se repiten con la semilla 34 y los tiempos varían entre ejecuciones y equipos.</tspan></text></svg>
