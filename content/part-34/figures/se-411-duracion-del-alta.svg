<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 442" width="940" height="442" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un alta con cinco actores: cuáles pasos corren a la vez y cuál marca la duración total</title><desc id="d">Diagrama de Gantt con cinco carriles en segundos de un alta ejemplo: el plano de control crea durante 2 segundos, los datos y la identidad corren en paralelo de 2 a 6 y de 2 a 4, la facturación espera a los datos y corre de 6 a 8, y el correo sale de 8 a 9; la ruta más larga suma 9 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="442" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un alta con cinco actores: cuáles pasos corren a la vez y cuál marca la duración total</tspan></text><line x1="214" y1="51" x2="214" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="261" x2="214" y2="266" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="282" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="353.6" y1="51" x2="353.6" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="353.6" y1="261" x2="353.6" y2="266" stroke="#5b7280" stroke-width="1.4"/><text x="353.6" y="282" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="353.6" dy="0">2</tspan></text><line x1="493.2" y1="51" x2="493.2" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="493.2" y1="261" x2="493.2" y2="266" stroke="#5b7280" stroke-width="1.4"/><text x="493.2" y="282" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="493.2" dy="0">4</tspan></text><line x1="632.8" y1="51" x2="632.8" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="632.8" y1="261" x2="632.8" y2="266" stroke="#5b7280" stroke-width="1.4"/><text x="632.8" y="282" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632.8" dy="0">6</tspan></text><line x1="772.4" y1="51" x2="772.4" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="772.4" y1="261" x2="772.4" y2="266" stroke="#5b7280" stroke-width="1.4"/><text x="772.4" y="282" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772.4" dy="0">8</tspan></text><line x1="912" y1="51" x2="912" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="261" x2="912" y2="266" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="282" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">10</tspan></text><line x1="214" y1="261" x2="912" y2="261" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="76.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Plano de control</tspan></text><text x="204" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Datos</tspan></text><text x="204" y="160.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Identidad</tspan></text><text x="204" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Facturación</tspan></text><text x="204" y="244.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Correo de bienvenida</tspan></text><rect x="214" y="60" width="139.6" height="24" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="283.8" y="76.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="283.8" dy="0">Crear</tspan></text><rect x="353.6" y="60" width="139.6" height="24" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="423.4" y="76.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.4" dy="0">Esperar</tspan></text><rect x="493.2" y="60" width="69.8" height="24" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="528.1" y="76.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="528.1" dy="0">Activar</tspan></text><line x1="14" y1="93" x2="912" y2="93" stroke="#d5dde1" stroke-width="1"/><rect x="353.6" y="102" width="279.2" height="24" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="493.2" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="493.2" dy="0">Esquema y semilla</tspan></text><line x1="14" y1="135" x2="912" y2="135" stroke="#d5dde1" stroke-width="1"/><rect x="353.6" y="144" width="139.6" height="24" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="423.4" y="160.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.4" dy="0">Admin</tspan></text><line x1="14" y1="177" x2="912" y2="177" stroke="#d5dde1" stroke-width="1"/><rect x="632.8" y="186" width="139.6" height="24" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="702.6" y="202.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702.6" dy="0">Cliente y plan</tspan></text><line x1="14" y1="219" x2="912" y2="219" stroke="#d5dde1" stroke-width="1"/><rect x="772.4" y="228" width="69.8" height="24" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="807.3" y="244.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807.3" dy="0">Envío</tspan></text><text x="563" y="305" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="563" dy="0">Segundos desde la solicitud (valores del autor)</tspan></text><rect x="10" y="319" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="343.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los datos y la identidad corren en paralelo, así que acelerar la identidad no cambia la duración total; la facturación</tspan></text><text x="470" y="360.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">depende de los datos y marca el camino largo. Duraciones inventadas para mostrar el razonamiento: se miden en cada producto</tspan></text><text x="470" y="377.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">antes de decidir.</tspan></text><text x="470" y="424.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
