<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 333" width="1090" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reglas de texto sobre 160 workflows con 8 clases de defecto sembrado y 6 señuelos</title><desc id="d">Tabla: sobre 209 defectos sembrados, las reglas ingenuas encuentran todos pero producen 180 falsas alarmas (precisión 54 por ciento); las afinadas reducen las falsas alarmas a 45 y pierden 5 defectos (precisión 82 por ciento y exhaustividad 98 por ciento).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1090" height="333" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Conjunto de reglas</tspan></text><rect x="340" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Aciertos</tspan></text><rect x="460" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Falsos positivos</tspan></text><rect x="630" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="712" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712" dy="0">Defectos no vistos</tspan></text><rect x="800" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Precisión</tspan></text><rect x="930" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="1002" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="1002" dy="0">Exhaustividad</tspan></text><rect x="10" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Reglas ingenua</tspan></text><rect x="340" y="56" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">209</tspan></text><rect x="460" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">180</tspan></text><rect x="630" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">0</tspan></text><rect x="800" y="56" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">54 %</tspan></text><rect x="930" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="1002" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="1002" dy="0">100 %</tspan></text><rect x="10" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Reglas afinada</tspan></text><rect x="340" y="110" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">204</tspan></text><rect x="460" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">45</tspan></text><rect x="630" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">5</tspan></text><rect x="800" y="110" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">82 %</tspan></text><rect x="930" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="1002" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="1002" dy="0">98 %</tspan></text><rect x="10" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Falsos positivos de la ingenua por regla</tspan></text><rect x="340" y="164" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">inyección 100</tspan></text><rect x="460" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">target 44</tspan></text><rect x="630" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">curl 36</tspan></text><rect x="800" y="164" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">—</tspan></text><rect x="930" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="1002" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="1002" dy="0">—</tspan></text><rect x="10" y="222" width="1070" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="545" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">Las reglas ingenuas ven todo y avisan de demasiado: por eso un equipo las desactiva. Las afinadas ignoran comentarios y acciones locales, pero</tspan></text><text x="545" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">se equivocan donde el defecto cambia de forma (un bloque de varias líneas) y donde el valor es seguro (el número del PR). Se afinaron con los</tspan></text><text x="545" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">mismos señuelos que las evalúan: son una frontera, no una tasa.</tspan></text><text x="545" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="545" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
