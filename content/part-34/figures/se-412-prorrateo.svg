<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cobro o crédito inmediato por cambiar de plan a mitad de un mes de 30 días, según el día del cambio</title><desc id="d">Línea con dos series: pasar del plan de 49 al de 99 genera un cargo que baja de 50,00 el día 1 a 1,67 el día 30; pasar del de 99 al de 49 genera un crédito de la misma magnitud con signo negativo, de menos 50,00 a menos 1,67; el día 11 son 33,33.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="560" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cobro o crédito inmediato por cambiar de plan a mitad de un mes de 30 días, según el día del cambio</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Subida de 49 a 99</tspan></text><rect x="192.18" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Bajada de 99 a 49</tspan></text><line x1="78.62" y1="377" x2="910" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="377" x2="78.62" y2="377" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">−60</tspan></text><line x1="78.62" y1="328.667" x2="910" y2="328.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="328.667" x2="78.62" y2="328.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="333.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">−40</tspan></text><line x1="78.62" y1="280.333" x2="910" y2="280.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="280.333" x2="78.62" y2="280.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="284.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">−20</tspan></text><line x1="78.62" y1="232" x2="910" y2="232" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="232" x2="78.62" y2="232" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="236.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="183.667" x2="910" y2="183.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="183.667" x2="78.62" y2="183.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="188.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="135.333" x2="910" y2="135.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="135.333" x2="78.62" y2="135.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="139.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="377" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="377" x