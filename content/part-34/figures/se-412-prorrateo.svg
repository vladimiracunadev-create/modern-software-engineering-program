>30</tspan></text><line x1="78.62" y1="377" x2="910" y2="377" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="232" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 232)">Importe neto del prorrateo (unidades de moneda)</text><text x="494.31" y="423" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Día del mes en que cambia el plan</tspan></text><line x1="78.62" y1="232" x2="910" y2="232" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="84.62" y="226" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="84.62" dy="0">Sin diferencia</tspan></text><polyline points="96.62,111.167 233.754,131.297 370.889,151.453 508.023,171.583 645.158,191.714 782.292,211.869 892,227.964" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="111.167" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="233.754" cy="131.297" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="370.889" cy="151.453" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="508.023" cy="171.583" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="645.158" cy="191.714" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="782.292" cy="211.869" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="892" cy="227.964" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polyline points="96.62,352.833 233.754,332.702 370.889,312.548 508.023,292.417 645.158,272.286 782.292,252.131 892,236.036" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="347.333" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="228.254" y="327.202" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="365.389" y="307.048" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="502.523" y="286.917" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="639.658" y="266.786" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="776.792" y="246.631" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="886.5" y="230.536" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="10" y="437" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El prorrateo es una resta de importes por los días que quedan: el día 11 de 30 restan 20 días y un cambio de 50 vale 33,33.</tspan></text><text x="470" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Redondear en centavos en cada paso puede dejar una diferencia de un centavo entre lo cobrado y lo facturado; la regla de</tspan></text><text x="470" y="495.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">redondeo se escribe y se prueba.</tspan></text><text x="470" y="542.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
