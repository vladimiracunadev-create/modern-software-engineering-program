<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 458" width="940" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De 69 cobros fallidos de 1000 renovaciones: cuántos recupera cada reintento y cuántos quedan</title><desc id="d">Barras apiladas horizontales por etapa de reintento, con semilla 34: fallos iniciales 69; el día 1 recupera 21 y quedan 48; el día 3 recupera 14 y quedan 34; el día 7 recupera 4 y quedan 30; el día 14 recupera 3 y quedan 27.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="458" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De 69 cobros fallidos de 1000 renovaciones: cuántos recupera cada reintento y cuántos quedan</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Recuperados hasta ahora</tspan></text><rect x="237.42" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Siguen sin pagar</tspan></text><line x1="194" y1="77" x2="194" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="277" x2="194" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">0</tspan></text><line x1="364.425" y1="77" x2="364.425" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="364.425" y1="277" x2="364.425" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="364.425" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364.425" dy="0">20</tspan></text><line x1="534.85" y1="77" x2="534.85" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="534.85" y1="277" x2="534.85" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="534.85" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534.85" dy="0">40</tspan></text><line x1="705.275" y1="77" x2="705.275" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="705.275" y1="277" x2="705.275" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="705.275" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.275" dy="0">60</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="277" x2="875.7" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">80</tspan></text><line x1="194" y1="277" x2="875.7" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Fallos iniciales</tspan></text><text x="184" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Tras el día 1</tspan></text><text x="184" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Tras el día 3</tspan></text><text x="184" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Tras el día 7</tspan></text><text x="184" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Tras el día 14</tspan></text><rect x="194" y="84" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="194" y="84" width="587.966" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="487.983" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487.983" dy="0">69</tspan></text><text x="788.966" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788.966" dy="0">69</tspan></text><rect x="194" y="124" width="178.946" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="283.473" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="283.473" dy="0">21</tspan></text><rect x="372.946" y="124" width="409.02" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="577.456" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577.456" dy="0">48</tspan></text><text x="788.966" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788.966" dy="0">69</tspan></text><rect x="194" y="164" width="298.244" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="343.122" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="343.122" dy="0">35</tspan></text><rect x="492.244" y="164" width="289.723" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="637.105" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637.105" dy="0">34</tspan></text><text x="788.966" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788.966" dy="0">69</tspan></text><rect x="194" y="204" width="332.329" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="360.164" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="360.164" dy="0">39</tspan></text><rect x="526.329" y="204" width="255.638" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="654.148" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="654.148" dy="0">30</tspan></text><text x="788.966" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788.966" dy="0">69</tspan></text><rect x="194" y="244" width="357.893" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="372.946" y="261.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372.946" dy="0">42</tspan></text><rect x="551.893" y="244" width="230.074" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="666.929" y="261.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="666.929" dy="0">27</tspan></text><text x="788.966" y="261.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788.966" dy="0">69</tspan></text><text x="534.85" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="534.85" dy="0">Renovaciones fallidas</tspan></text><rect x="10" y="335" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los dos primeros reintentos recuperan 35 de 42 y los dos últimos, 7. El calendario de reintentos decide cuánto se recupera,</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pero también cuánto tiempo un cliente que sí quería pagar queda sin acceso. Probabilidades de recuperación del autor, no de</tspan></text><text x="470" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un procesador real.</tspan></text><text x="470" y="440.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
