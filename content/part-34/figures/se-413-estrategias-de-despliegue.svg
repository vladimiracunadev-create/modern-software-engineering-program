<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 333" width="960" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una versión con 4 puntos de error adicional a 100 solicitudes por segundo: solicitudes fallidas hasta el retroceso (600 repeticiones)</title><desc id="d">Tabla: si la versión mala se despliega de una vez fallan 240 solicitudes de media y 268 en el percentil 95; con cuatro tandas, 59 y 72; con un canario del 1 por ciento al 100 por ciento, 6 y 9; las tres estrategias la detectan el 100 por ciento de las veces y provocan retrocesos falsos entre el 0,5 y el 2,3 por ciento de las versiones buenas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="333" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Estrategia</tspan></text><rect x="360" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">Fallos medios</tspan></text><rect x="500" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Fallos p95</tspan></text><rect x="630" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="712" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712" dy="0">Detección media</tspan></text><rect x="800" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Retrocesos falsos</tspan></text><rect x="10" y="56" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">todo de una vez</tspan></text><rect x="360" y="56" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">240</tspan></text><rect x="500" y="56" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">268</tspan></text><rect x="630" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">1,0 min</tspan></text><rect x="800" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0,5 %</tspan></text><rect x="10" y="110" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">gradual en 4 tandas</tspan></text><rect x="360" y="110" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">59</tspan></text><rect x="500" y="110" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">72</tspan></text><rect x="630" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">1,0 min</tspan></text><rect x="800" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">2,3 %</tspan></text><rect x="10" y="164" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">canario 1 % → 5 % → 25 % → 100 %</tspan></text><rect x="360" y="164" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">6</tspan></text><rect x="500" y="164" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">9</tspan></text><rect x="630" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">2,4 min</tspan></text><rect x="800" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">1,8 %</tspan></text><rect x="10" y="222" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El canario reduce el daño en un 98 % no porque detecte antes (2,4 min frente a 1) sino porque solo lo ve una fracción del</tspan></text><text x="480" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">tráfico. La detección es estadística: con 1 % del tráfico y umbral estricto hay que esperar. Un retroceso falso cuesta una</tspan></text><text x="480" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">versión buena perdida. Poisson y normal aproximan al binomial; error base 0,5 %.</tspan></text><text x="480" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
