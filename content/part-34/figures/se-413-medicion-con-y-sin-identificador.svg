<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" width="940" height="512" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Unidades de uso del mismo mes: la verdad, la suma sin identificador de evento y la suma con identificador</title><desc id="d">Barras con tres valores de un experimento con 30000 eventos y 6 por ciento de entregas duplicadas: unidades reales 90157, suma sin identificador 95394 y suma con identificador único 90157; la diferencia sin identificador es 5237 unidades y afecta a 63 de 80 pares de cliente y periodo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="512" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Unidades de uso del mismo mes: la verdad, la suma sin identificador de evento y la suma con identificador</tspan></text><line x1="108.78" y1="337" x2="920" y2="337" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="337" x2="108.78" y2="337" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">0</tspan></text><line x1="108.78" y1="283" x2="920" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="283" x2="108.78" y2="283" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="287.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">20 000</tspan></text><line x1="108.78" y1="229" x2="920" y2="229" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="229" x2="108.78" y2="229" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="233.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">40 000</tspan></text><line x1="108.78" y1="175" x2="920" y2="175" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="175" x2="108.78" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="179.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">60 000</tspan></text><line x1="108.78" y1="121" x2="920" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="121" x2="108.78" y2="121" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="125.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">80 000</tspan></text><line x1="108.78" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="67" x2="108.78" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100 000</tspan></text><line x1="108.78" y1="67" x2="108.78" y2="337" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 202)">Unidades de uso</text><rect x="135.821" y="93.5761" width="216.325" height="243.424" rx="3" fill="#087f8c"/><text x="243.983" y="87.5761" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="243.983" dy="0">90 157</tspan></text><text x="243.983" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="243.983" dy="0">Unidades reales</tspan></text><rect x="406.227" y="79.4362" width="216.325" height="257.564" rx="3" fill="#087f8c"/><text x="514.39" y="73.4362" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="514.39" dy="0">95 394</tspan></text><text x="514.39" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.39" dy="0">Sin identificador de evento</tspan></text><rect x="676.634" y="93.5761" width="216.325" height="243.424" rx="3" fill="#087f8c"/><text x="784.797" y="87.5761" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784.797" dy="0">90 157</tspan></text><text x="784.797" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.797" dy="0">Con identificador único</tspan></text><line x1="108.78" y1="93.5761" x2="920" y2="93.5761" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="87.5761" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">Verdad</tspan></text><rect x="10" y="389" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="413.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con entrega «al menos una vez» (lo normal en colas y reintentos) 31 744 entregas llegan por 30 000 eventos: sumar sin más</tspan></text><text x="470" y="430.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">factura 5,8 % de más y errores en 63 de 80 facturas. Con una clave única por evento y una inserción que ignora repetidos la</tspan></text><text x="470" y="447.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">suma coincide con la verdad.</tspan></text><text x="470" y="494.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y sqlite3; los recuentos se repiten con la semilla 34 y los tiempos varían entre ejecuciones y equipos.</tspan></text></svg>
