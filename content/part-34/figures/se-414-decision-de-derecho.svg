<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 231" width="960" height="231" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El orden de preguntas de un motor de derechos: de la cuenta al consumo</title><desc id="d">Diagrama de una fila con cuatro cajas: estado de la cuenta, excepción vigente del cliente, límite del plan y consumo acumulado; una nota enumera las razones de rechazo: cuenta suspendida, límite alcanzado y funcionalidad no incluida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="231" fill="#ffffff"/><rect x="10" y="14" width="202" height="110" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="111" y="56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="111" dy="0">Cuenta</tspan></text><text x="111" y="72.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="111" dy="0">Activa, suspendida o</tspan></text><text x="111" y="89.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="111" dy="0">desconocida</tspan></text><rect x="256" y="14" width="202" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357" y="56" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Excepción</tspan></text><text x="357" y="72.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Vigente a la fecha de</tspan></text><text x="357" y="89.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">hoy y con vencimiento</tspan></text><polyline points="212,69 256,69" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603" y="56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Plan</tspan></text><text x="603" y="72.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Límite o funcionalidad</tspan></text><text x="603" y="89.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">incluida</tspan></text><polyline points="458,69 502,69" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849" y="56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">Consumo</tspan></text><text x="849" y="72.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">Usado más lo pedido</tspan></text><text x="849" y="89.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">frente al límite</tspan></text><polyline points="704,69 748,69" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="162.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El resultado trae siempre una razón legible: «cuenta suspendida», «límite 25, usado 25» o «no incluido en el plan». Un simple</tspan></text><text x="480" y="179.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">«prohibido» obliga al soporte a reconstruir lo ocurrido; con la razón, la pantalla puede ofrecer el cambio de plan correcto.</tspan></text><text x="480" y="221.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y sqlite3; los recuentos se repiten con la semilla 34 y los tiempos varían entre ejecuciones y equipos.</tspan></text></svg>
