<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 544" width="940" height="544" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Límites de tres planes de ejemplo en tres recursos, en escala logarítmica</title><desc id="d">Barras agrupadas en escala logarítmica con tres planes y tres recursos: usuarios 3, 25 y 1000; proyectos 2, 50 y 5000; llamadas de API por mes 1000, 100000 y 5000000 para los planes gratis, equipo y empresa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="544" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Límites de tres planes de ejemplo en tres recursos, en escala logarítmica</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Gratis</tspan></text><rect x="109.24" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">Equipo</tspan></text><rect x="202.48" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="222.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="222.48" dy="0">Empresa</tspan></text><line x1="131.4" y1="385" x2="920" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="385" x2="131.4" y2="385" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="389.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">1</tspan></text><line x1="131.4" y1="343.571" x2="920" y2="343.571" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="343.571" x2="131.4" y2="343.571" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="348.071" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">10</tspan></text><line x1="131.4" y1="302.143" x2="920" y2="302.143" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="302.143" x2="131.4" y2="302.143" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="306.643" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">100</tspan></text><line x1="131.4" y1="260.714" x2="920" y2="260.714" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="260.714" x2="131.4" y2="260.714" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="265.214" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">1 000</tspan></text><line x1="131.4" y1="219.286" x2="920" y2="219.286" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="219.286" x2="131.4" y2="219.286" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="223.786" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">10 000</tspan></text><line x1="131.4" y1="177.857" x2="920" y2="177.857" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="177.857" x2="131.4" y2="177.857" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="182.357" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">100 000</tspan></text><line x1="131.4" y1="136.429" x2="920" y2="136.429" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="136.429" x2="131.4" y2="136.429" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="140.929" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">1 000 000</tspan></text><line x1="131.4" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="95" x2="131.4" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">10 000 000</tspan></text><line x1="131.4" y1="95" x2="131.4" y2="385" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="240" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 240)">Límite del plan (escala logarítmica) (escala logarítmica)</text><rect x="157.687" y="365.234" width="67.4311" height="19.7665" rx="3" fill="#6b7c86"/><text x="191.402" y="359.234" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="191.402" dy="0">3</tspan></text><rect x="229.118" y="327.085" width="67.4311" height="57.9147" rx="3" fill="#087f8c"/><text x="262.833" y="321.085" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="262.833" dy="0">25</tspan></text><rect x="300.549" y="260.714" width="67.4311" height="124.286" rx="3" fill="#102a43"/><text x="334.264" y="254.714" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="334.264" dy="0">1 000</tspan></text><text x="262.833" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="262.833" dy="0">Usuarios</tspan></text><rect x="420.553" y="372.529" width="67.4311" height="12.4712" rx="3" fill="#6b7c86"/><text x="454.269" y="366.529" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="454.269" dy="0">2</tspan></text><rect x="491.984" y="314.614" width="67.4311" height="70.3859" rx="3" fill="#087f8c"/><text x="525.7" y="308.614" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="525.7" dy="0">50</tspan></text><rect x="563.416" y="231.757" width="67.4311" height="153.243" rx="3" fill="#102a43"/><text x="597.131" y="225.757" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597.131" dy="0">5 000</tspan></text><text x="525.7" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="525.7" dy="0">Proyectos</tspan></text><rect x="683.42" y="260.714" width="67.4311" height="124.286" rx="3" fill="#6b7c86"/><text x="717.136" y="254.714" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="717.136" dy="0">1 000</tspan></text><rect x="754.851" y="177.857" width="67.4311" height="207.143" rx="3" fill="#087f8c"/><text x="788.567" y="171.857" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="788.567" dy="0">100 000</tspan></text><rect x="826.282" y="107.471" width="67.4311" height="277.529" rx="3" fill="#102a43"/><text x="859.998" y="101.471" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.998" dy="0">5 000 000</tspan></text><text x="788.567" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="788.567" dy="0">Llamadas de API por mes</tspan></text><rect x="10" y="437" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los límites crecen por órdenes de magnitud, no de a poco: cada plan es otro tipo de cliente. Un límite sin consumo medido</tspan></text><text x="470" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(SE-413) no se puede hacer cumplir, y un consumo sin límite no cambia nada. Los números son de un plan inventado.</tspan></text><text x="470" y="526.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
