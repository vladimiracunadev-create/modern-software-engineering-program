<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 287" width="960" height="287" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un controlador de GitOps y un escalador automático que se disputan el número de réplicas (24 h, 1 440 minutos)</title><desc id="d">Tabla: si el repositorio fija tres réplicas el sistema pasa 361 minutos con menos capacidad que carga, el escalador actúa 854 veces y el reconciliador revierte 425; si el repositorio omite el campo hay 0 minutos de capacidad insuficiente con 640 acciones del escalador y ninguna reversión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="287" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Configuración</tspan></text><rect x="370" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Minutos sin capacidad</tspan></text><rect x="560" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Acciones del escalador</tspan></text><rect x="750" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Reversiones del</tspan></text><text x="847" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">reconciliador</tspan></text><rect x="10" y="56" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">El repositorio fija «réplicas: 3»</tspan></text><rect x="370" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">361</tspan></text><rect x="560" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">854</tspan></text><rect x="750" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">425</tspan></text><rect x="10" y="114" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">El repositorio omite el campo de réplicas</tspan></text><rect x="370" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">0</tspan></text><rect x="560" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">640</tspan></text><rect x="750" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0</tspan></text><rect x="10" y="176" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Dos bucles de control que gobiernan el mismo campo no convergen: cada uno deshace al otro y el servicio paga 361 minutos de</tspan></text><text x="480" y="217.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">capacidad insuficiente. La solución es que el repositorio deje de declarar lo que otro actor decide (ignorar el campo), no</tspan></text><text x="480" y="234.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">subir la frecuencia de reconciliación. Carga sinusoidal con ruido; capacidad de 100 solicitudes por réplica: supuestos.</tspan></text><text x="480" y="273.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
