" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="129.084" dy="0">63,9</tspan></text><circle cx="161.549" cy="237.79" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="161.549" y="226.79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="161.549" dy="0">44,9</tspan></text><circle cx="242.71" cy="305.07" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="242.71" y="294.07" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="242.71" dy="0">21,7</tspan></text><circle cx="486.194" cy="354.37" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="486.194" y="343.37" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="486.194" dy="0">4,7</tspan></text><circle cx="892" cy="367.13" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="356.13" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,3</tspan></text><rect x="10" y="428" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un tope de 5 puestos deja a 45 de cada 100 clientes por encima del plan; uno de 25, a menos de 5 de cada 100. El límite no</tspan></text><text x="470" y="469.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es neutral: elige quién paga más y quién se va. La población simulada es del autor (mediana de 5 puestos, cola larga), no</tspan></text><text x="470" y="486.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un mercado.</tspan></text><text x="470" y="533.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto, un mercado ni un proveedor reales.</tspan></text></svg>
