<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué porcentaje de 1000 clientes simulados supera cada límite de puestos: lo que cada tope deja dentro y lo que empuja a pagar más</title><desc id="d">Línea con el porcentaje de clientes simulados cuyo número de puestos supera el límite: 1 puesto 85,7; 3 puestos 63,9; 5 puestos 44,9; 10 puestos 21,7; 25 puestos 4,7; 50 puestos 0,3; la mediana de la población es 5 puestos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué porcentaje de 1000 clientes simulados supera cada límite de puestos: lo que cada tope deja dentro y lo</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">que empuja a pagar más</tspan></text><line x1="78.62" y1="368" x2="910" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="368" x2="78.62" y2="368" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="372.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="310" x2="910" y2="310" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="310" x2="78.62" y2="310" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="314.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="252" x2="910" y2="252" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="252" x2="78.62" y2="252" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="256.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="194" x2="910" y2="194" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="194" x2="78.62" y2="194" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="198.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="136" x2="910" y2="136" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="136" x2="78.62" y2="136" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="140.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="78" x2="910" y2="78" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="78" x2="78.62" y2="78" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="82.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="78" x2="78.62" y2="368" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="78" x2="96.62" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="368" x2="96.62" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="129.084" y1="78" x2="129.084" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="129.084" y1="368" x2="129.084" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="129.084" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="129.084" dy="0">3</tspan></text><line x1="161.549" y1="78" x2="161.549" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="161.549" y1="368" x2="161.549" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x=