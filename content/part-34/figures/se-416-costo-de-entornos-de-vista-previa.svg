<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 333" width="960" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Entornos de vista previa de 480 PR en 60 días (8 por día, 15 % abandonados): horas de entorno según la política</title><desc id="d">Tabla: destruir el entorno solo al cerrar el PR suma 74 357 horas de entorno y deja 64 huérfanos al final; un TTL de 72 horas desde la creación suma 33 383 horas (45 por ciento) con 186 recreaciones; un TTL de 24 horas renovado con cada push suma 30 460 horas (41 por ciento) con 293 recreaciones y ningún huérfano.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="333" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Política</tspan></text><rect x="340" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="417" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417" dy="0">Horas de entorno</tspan></text><rect x="500" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Frente a «al</tspan></text><text x="582" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">cerrar»</tspan></text><rect x="670" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Recreaciones</tspan></text><rect x="820" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">Huérfanos</tspan></text><rect x="10" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">solo se destruye al cerrar el PR</tspan></text><rect x="340" y="56" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">74 357</tspan></text><rect x="500" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">100 %</tspan></text><rect x="670" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">0</tspan></text><rect x="820" y="56" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">64</tspan></text><rect x="10" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">TTL de 72 h desde la creación</tspan></text><rect x="340" y="110" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">33 383</tspan></text><rect x="500" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">45 %</tspan></text><rect x="670" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">186</tspan></text><rect x="820" y="110" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0</tspan></text><rect x="10" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">TTL de 24 h renovado con cada push</tspan></text><rect x="340" y="164" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">30 460</tspan></text><rect x="500" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">41 %</tspan></text><rect x="670" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">293</tspan></text><rect x="820" y="164" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0</tspan></text><rect x="10" y="222" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Los PR abandonados dominan el costo: el 15 % que nadie cierra consume más de la mitad de las horas. El TTL lo corta a cambio</tspan></text><text x="480" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">de recrear el entorno cuando alguien vuelve (186 o 293 veces). La actividad del PR (un push cada 14 h) y el abandono son</tspan></text><text x="480" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">supuestos; las horas se leen como razones, no como dinero.</tspan></text><text x="480" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
