<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 532" width="940" height="532" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué porcentaje de compradores encuentra al menos una oferta que le sirve, según el número de vendedores</title><desc id="d">Línea en escala logarítmica horizontal: con 5 vendedores encuentra oferta 18,4 por ciento de los compradores, con 20 vendedores 57,0, con 80 vendedores 95,6 y con 320 vendedores 100; cada vendedor sirve a un comprador cualquiera con probabilidad de 4 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="532" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué porcentaje de compradores encuentra al menos una oferta que le sirve, según el número de vendedores</tspan></text><line x1="78.62" y1="349" x2="910" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="349" x2="78.62" y2="349" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="353.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="291" x2="910" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="291" x2="78.62" y2="291" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="233" x2="910" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="233" x2="78.62" y2="233" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="237.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="175" x2="910" y2="175" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="175" x2="78.62" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="179.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="117" x2="910" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="117" x2="78.62" y2="117" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="121.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="349" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="349" x2="96.62" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="370" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">5</tspan></text><line x1="361.747" y1="59" x2="361.747" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="361.747" y1="349" x2="361.747" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="361.747" y="370" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="361.747" dy="0">20</tspan></text><line x1="626.873" y1="59" x2="626.873" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="626.873" y1="349" x2="626.873" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="626.873" y="370" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.873" dy="0">80</tspan></text><line x1="892" y1="59" x2="892" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="349" x2="892" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="370" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">320</tspan></text><line x1="78.62" y1="349" x2="910" y2="349" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 204)">Compradores que encuentran oferta (%)</text><text x="494.31" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Vendedores activos (escala logarítmica)</tspan></text><polyline points="96.62,295.64 361.747,183.7 626.873,71.76 892,59" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="295.64" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="284.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">18,4</tspan></text><circle cx="361.747" cy="183.7" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="361.747" y="172.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="361.747" dy="0">57,0</tspan></text><circle cx="626.873" cy="71.76" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="626.873" y="60.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="626.873" dy="0">95,6</tspan></text><circle cx="892" cy="59" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">100,0</tspan></text><rect x="10" y="409" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El valor para un lado depende de cuántos hay del otro: con pocos vendedores, 4 de cada 5 compradores se van sin oferta y no</tspan></text><text x="470" y="450.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">vuelven; la plataforma arranca por el lado más difícil de atraer. El 4 % de coincidencia por vendedor es un supuesto del</tspan></text><text x="470" y="467.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">autor, y el modelo no incluye precio ni calidad.</tspan></text><text x="470" y="514.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto, un mercado ni un proveedor reales.</tspan></text></svg>
