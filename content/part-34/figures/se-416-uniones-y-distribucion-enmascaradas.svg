<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 481" width="970" height="481" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Enmascarar datos para una prueba: uniones que sobreviven y distribución de las notas (3 000 estudiantes, 15 000 entregas)</title><desc id="d">Tabla: el enmascarado aleatorio por tabla conserva el 0 por ciento de las uniones entre estudiantes y entregas, el determinista con HMAC conserva el 100 por ciento; las notas con ruido mantienen la media 5,20 pero suben la desviación de 1,11 a 1,52; la permutación conserva la distribución y destruye la correlación con el original.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="481" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Técnica</tspan></text><rect x="280" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357" dy="0">Uniones que</tspan></text><text x="357" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357" dy="0">sobreviven</tspan></text><rect x="440" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Distribución de las notas</tspan></text><rect x="690" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Consecuencia</tspan></text><rect x="10" y="56" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Identificador sin enmascarar</tspan></text><rect x="280" y="56" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">100 %</tspan></text><rect x="440" y="56" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">sin cambio</tspan></text><rect x="690" y="56" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">identifica a la persona</tspan></text><rect x="10" y="118" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Aleatorio por tabla</tspan></text><rect x="280" y="118" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">0 %</tspan></text><rect x="440" y="118" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">—</tspan></text><rect x="690" y="118" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">rompe las pruebas que unen tablas</tspan></text><rect x="10" y="180" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Determinista con HMAC y sal</tspan></text><rect x="280" y="180" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">100 %</tspan></text><rect x="440" y="180" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">—</tspan></text><rect x="690" y="180" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="203.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">conserva las uniones; la sal es un</tspan></text><text x="822" y="219.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">secreto</tspan></text><rect x="10" y="242" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Notas con ruido gaussiano (σ = 1)</tspan></text><rect x="280" y="242" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">—</tspan></text><rect x="440" y="242" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">media 5,20, σ 1,52, r 0,74</tspan></text><rect x="690" y="242" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">la desviación crece de 1,11 a 1,52</tspan></text><rect x="10" y="304" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="335.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Notas permutadas</tspan></text><rect x="280" y="304" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">—</tspan></text><rect x="440" y="304" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">media 5,21, σ 1,11, r -0,006</tspan></text><rect x="690" y="304" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="327.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">conserva la distribución, borra la</tspan></text><text x="822" y="343.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">relación</tspan></text><rect x="10" y="370" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="394.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Cada técnica protege algo y rompe otra cosa: el aleatorio protege la identidad y anula la prueba de integridad; el determinista</tspan></text><text x="485" y="411.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">conserva las uniones y permite vincular registros si se filtra la sal. No existe un enmascarado que conserve utilidad y</tspan></text><text x="485" y="428.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">privacidad sin decisión: hay que elegir qué se prueba con ese dato.</tspan></text><text x="485" y="467.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
