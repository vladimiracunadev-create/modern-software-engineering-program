<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Aprovisionar por ticket con dos personas de plataforma (3 horas por solicitud): espera antes de empezar</title><desc id="d">Líneas con la espera media y el percentil 90 según la demanda: con 0,2 solicitudes por hora la utilización es del 30 por ciento y la espera media 0,3 horas; con 0,4 la utilización es del 60 por ciento y la espera media 1,7 horas con 5,7 en el percentil 90; con 0,55 la utilización es del 83 por ciento y 6,4 horas con 16,6 en el percentil 90.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Aprovisionar por ticket con dos personas de plataforma (3 horas por solicitud): espera antes de empezar</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Espera media</tspan></text><rect x="154.48" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Espera p90</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="387" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="312" x2="71.08" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="237" x2="71.08" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="162" x2="71.08" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="87" x2="71.08" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="87" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="87" x2="89.08" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="387" x2="89.08" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">0,20</tspan></text><line x1="547.891" y1="87" x2="547.891" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="547.891" y1="387" x2="547.891" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="547.891" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.891" dy="0">0,40</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0,55</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Horas de espera</text><text x="490.54" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Demanda (solicitudes por hora)</tspan></text><polyline points="89.08,382.557 547.891,361.658 892,290.746" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="89.08" cy="382.557" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="99.08" y="387.057" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="99.08" dy="0">0,3 h</tspan></text><circle cx="547.891" cy="361.658" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="547.891" y="385.658" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="547.891" dy="0">1,7 h</tspan></text><circle cx="892" cy="290.746" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="314.746" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">6,4 h</tspan></text><polyline points="89.08,377.314 547.891,300.974 892,138.036" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="371.814" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="366.314" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">0,6 h</tspan></text><rect x="542.391" y="295.474" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="547.891" y="289.974" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="547.891" dy="0">5,7 h</tspan></text><rect x="886.5" y="132.536" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="127.036" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">16,6 h</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Utilización de las dos personas: 30 %, 60 % y 83 %. La espera no crece proporcionalmente: al subir la demanda 2,75 veces</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(de 0,2 a 0,55), la espera media se multiplica por 22. Es la misma curva de saturación de la cola de SE-376 aplicada a un</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">equipo humano. El autoservicio saca el tiempo de espera de la cola, a cambio de construir y mantener la automatización.</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Servicio exponencial de 3 h: supuesto.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
