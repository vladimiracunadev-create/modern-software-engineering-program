<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una métrica se vuelve meta: el mismo trabajo y los mismos defectos en 26 semanas</title><desc id="d">Tabla: sin incentivo hay 4 despliegues por semana, 24 por ciento de fallos y plazo mediano de 32 horas; con despliegues vacíos, 16 por semana, 6 por ciento y 0,1 horas; partiendo los cambios en tres, 30 por semana, 3,2 por ciento y 8 horas; en los tres casos hay 0,96 defectos por semana y 10 cambios de valor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Caso</tspan></text><rect x="330" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">Despliegues</tspan></text><text x="387" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">por semana</tspan></text><rect x="450" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">Tasa de</tspan></text><text x="507" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">fallos</tspan></text><rect x="570" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="627" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">Plazo</tspan></text><text x="627" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">mediano</tspan></text><rect x="690" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Defectos por</tspan></text><text x="752" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">semana</tspan></text><rect x="820" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Cambios de</tspan></text><text x="872" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">valor</tspan></text><rect x="10" y="56" width="314" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">sin incentivo</tspan></text><rect x="330" y="56" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">4</tspan></text><rect x="450" y="56" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">24,0 %</tspan></text><rect x="570" y="56" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">32,4 h</tspan></text><rect x="690" y="56" width="124" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">0,96</tspan></text><rect x="820" y="56" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">10</tspan></text><rect x="10" y="122" width="314" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">incentivo en frecuencia: despliegues vacíos</tspan></text><rect x="330" y="122" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">16</tspan></text><rect x="450" y="122" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">6,0 %</tspan></text><rect x="570" y="122" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">0,1 h</tspan></text><rect x="690" y="122" width="124" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">0,96</tspan></text><rect x="820" y="122" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">10</tspan></text><rect x="10" y="188" width="314" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">incentivo en frecuencia: cambios partidos</tspan></text><rect x="330" y="188" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">30</tspan></text><rect x="450" y="188" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">3,2 %</tspan></text><rect x="570" y="188" width="114" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">8,2 h</tspan></text><rect x="690" y="188" width="124" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">0,96</tspan></text><rect x="820" y="188" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">10</tspan></text><rect x="10" y="258" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las tres métricas mejoraron (más frecuencia, menos fallos, menos plazo) y el trabajo entregado (10 cambios) y los defectos</tspan></text><text x="470" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(0,96 por semana) son idénticos. Partir cambios puede ser una buena práctica real, pero medido por el ratio sale lo mismo</tspan></text><text x="470" y="316.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">que el truco de los despliegues vacíos. La defensa es mirar las métricas juntas con una medida de valor y desconfiar de la</tspan></text><text x="470" y="332.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">que mejora sola.</tspan></text><text x="470" y="372.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
