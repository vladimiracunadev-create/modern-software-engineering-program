<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 357" width="960" height="357" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ruido de la tasa de fallos mensual (verdadera 12 %): dos equipos idénticos y una mejora real de 12 % a 8 %</title><desc id="d">Tabla: con 8 despliegues al mes el intervalo del 95 por ciento mide ±22,5 puntos, dos equipos idénticos difieren en 5 puntos o más el 69 por ciento de los meses y una mejora real del 12 al 8 por ciento se ve en el 42 por ciento; con 30, ±11,6 puntos, 55 y 61 por ciento; con 100, ±6,4 puntos, 29 y 80 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="357" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Volumen</tspan></text><rect x="270" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">Semiancho del intervalo</tspan></text><rect x="470" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Equipos idénticos que difieren ≥ 5</tspan></text><text x="607" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">puntos</tspan></text><rect x="750" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Mejora real que se ve</tspan></text><rect x="10" y="56" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">8 despliegues al mes</tspan></text><rect x="270" y="56" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">22,5 puntos</tspan></text><rect x="470" y="56" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">69 %</tspan></text><rect x="750" y="56" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">42 %</tspan></text><rect x="10" y="118" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">30 despliegues al mes</tspan></text><rect x="270" y="118" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">11,6 puntos</tspan></text><rect x="470" y="118" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">55 %</tspan></text><rect x="750" y="118" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">61 %</tspan></text><rect x="10" y="180" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">100 despliegues al mes</tspan></text><rect x="270" y="180" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">6,4 puntos</tspan></text><rect x="470" y="180" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">29 %</tspan></text><rect x="750" y="180" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">80 %</tspan></text><rect x="10" y="246" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Con el volumen de un equipo pequeño, comparar la tasa mensual de dos equipos es comparar ruido: casi siete de cada diez meses</tspan></text><text x="480" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">difieren cinco puntos sin que nada haya cambiado. La tendencia sobre muchos meses o un intervalo declarado dicen más que un</tspan></text><text x="480" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">ranking mensual. Simulación binomial con semilla fija; el intervalo es el de Wald.</tspan></text><text x="480" y="343.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
