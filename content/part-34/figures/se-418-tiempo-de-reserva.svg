troke-width="1.4"/><text x="150.544" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150.544" dy="0">5</tspan></text><line x1="285.354" y1="87" x2="285.354" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="285.354" y1="377" x2="285.354" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="285.354" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="285.354" dy="0">15</tspan></text><line x1="487.569" y1="87" x2="487.569" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="487.569" y1="377" x2="487.569" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="487.569" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487.569" dy="0">30</tspan></text><line x1="892" y1="87" x2="892" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="377" x2="892" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">60</tspan></text><line x1="78.62" y1="377" x2="910" y2="377" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="232" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 232)">Unidades o compradores</text><text x="494.31" y="423" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Duración de la reserva sin pagar (minutos)</tspan></text><polyline points="96.62,319 150.544,319 285.354,322.48 487.569,329.44 892,346.84" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="319" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="308" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">50</tspan></text><circle cx="150.544" cy="319" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="150.544" y="308" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="150.544" dy="0">50</tspan></text><circle cx="285.354" cy="322.48" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="285.354" y="311.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="285.354" dy="0">47</tspan></text><circle cx="487.569" cy="329.44" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="487.569" y="318.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="487.569" dy="0">41</tspan></text><circle cx="892" cy="346.84" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="335.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">26</tspan></text><polyline points="96.62,375.84 150.544,319 285.354,196.04 487.569,169.36 892,126.44" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="370.34" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="364.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">1</tspan></text><rect x="145.044" y="313.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="150.544" y="308" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="150.544" dy="0">50</tspan></text><rect x="279.854" y="190.54" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="285.354" y="185.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="285.354" dy="0">156</tspan></text><rect x="482.069" y="163.86" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="487.569" y="158.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="487.569" dy="0">179</tspan></text><rect x="886.5" y="120.94" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="115.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">216</tspan></text><rect x="10" y="437" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una reserva larga protege al comprador que está pagando pero retiene unidades de quienes abandonan: con 60 minutos solo se</tspan></text><text x="470" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">venden 26 de 50 unidades y 216 compradores se van viendo «agotado» cuando había stock retenido. Con 1 minuto el pago real,</tspan></text><text x="470" y="495.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">de unos 4 minutos, se vuelve difícil; el valor se mide.</tspan></text><text x="470" y="542.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto, un mercado ni un proveedor reales.</tspan></text></svg>
