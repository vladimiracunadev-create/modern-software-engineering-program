<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ventas y compradores rechazados con stock retenido según el tiempo que dura una reserva sin pagar</title><desc id="d">Línea con dos series para 50 unidades y 300 compradores que llegan en dos horas, con semilla 34: las ventas valen 50, 50, 47, 41 y 26 con reservas de 1, 5, 15, 30 y 60 minutos; los compradores rechazados con stock retenido valen 1, 50, 156, 179 y 216.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="560" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ventas y compradores rechazados con stock retenido según el tiempo que dura una reserva sin pagar</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Unidades vendidas</tspan></text><rect x="192.18" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Compradores rechazados con stock retenido</tspan></text><line x1="78.62" y1="377" x2="910" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="377" x2="78.62" y2="377" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><lin