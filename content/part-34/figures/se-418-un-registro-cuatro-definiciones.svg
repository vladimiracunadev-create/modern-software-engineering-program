<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro métricas de entrega (de las cinco de DORA) calculadas del mismo registro de 1 094 despliegues de 6 servicios en 52 semanas</title><desc id="d">Tabla: la frecuencia de despliegue es 3,5 por servicio y semana o 21 del conjunto; el plazo de entrega mediano es 32 horas desde el primer commit, 29 desde el PR y 4,6 desde la fusión; la tasa de fallos es 11,4 por ciento con incidente o 6,3 por ciento solo con retroceso; la restauración tiene mediana de 0,64 horas y media de 1,01.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><rect x="10" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="117" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="117" dy="0">Métrica</tspan></text><rect x="230" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357" dy="0">Definición A</tspan></text><rect x="490" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Definición B</tspan></text><rect x="730" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Definición C</tspan></text><rect x="10" y="56" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Frecuencia de despliegue</tspan></text><rect x="230" y="56" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">3,5 por servicio y semana</tspan></text><rect x="490" y="56" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">21,0 del conjunto</tspan></text><rect x="730" y="56" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">12,6 solo dos servicios</tspan></text><rect x="10" y="118" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Plazo de entrega (mediana)</tspan></text><rect x="230" y="118" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">32,4 h desde el primer commit</tspan></text><rect x="490" y="118" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">29,1 h desde el PR</tspan></text><rect x="730" y="118" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">4,6 h desde la fusión</tspan></text><rect x="10" y="180" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Tasa de fallos</tspan></text><rect x="230" y="180" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">11,4 % con incidente</tspan></text><rect x="490" y="180" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">6,3 % solo revertidos</tspan></text><rect x="730" y="180" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">—</tspan></text><rect x="10" y="242" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="265.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Recuperación tras un</tspan></text><text x="117" y="281.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">despliegue fallido</tspan></text><rect x="230" y="242" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">0,64 h mediana</tspan></text><rect x="490" y="242" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">1,01 h media</tspan></text><rect x="730" y="242" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">—</tspan></text><rect x="10" y="308" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un mismo registro produce plazos de 4,6 a 32 horas y tasas de fallos de 6,3 % a 11,4 % según dónde empiece y qué cuente la</tspan></text><text x="470" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">definición. Comparar un número entre equipos que definen distinto no compara equipos. La media y la mediana de la</tspan></text><text x="470" y="366.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">restauración difieren un 57 % porque pocos incidentes son largos. Registro sintético.</tspan></text><text x="470" y="405.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
