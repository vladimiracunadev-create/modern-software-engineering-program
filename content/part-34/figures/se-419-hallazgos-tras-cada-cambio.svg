<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 603" width="890" height="603" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Endurecer un workflow vulnerable paso a paso: hallazgos del verificador tras cada cambio</title><desc id="d">Tabla: el workflow original tiene 8 hallazgos; cada uno de los 8 cambios elimina exactamente uno (fijar la acción a un SHA, permisos mínimos, pull_request en lugar de pull_request_target, título por variable de entorno, script versionado, no escribir el secreto, que el trabajo falle cuando falla, sin credencial en el texto) y el final tiene 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="603" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Cambio aplicado</tspan></text><rect x="650" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="762" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">Hallazgos restantes</tspan></text><rect x="10" y="56" width="634" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="80.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">0. original</tspan></text><rect x="650" y="56" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="80.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">8</tspan></text><rect x="10" y="104" width="634" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="128.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">1. fijar la acción a un SHA</tspan></text><rect x="650" y="104" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="128.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">7</tspan></text><rect x="10" y="152" width="634" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="176.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">2. permisos mínimos</tspan></text><rect x="650" y="152" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="176.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">6</tspan></text><rect x="10" y="200" width="634" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="224.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">3. pull_request en lugar de pull_request_target</tspan></text><rect x="650" y="200" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="224.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">5</tspan></text><rect x="10" y="248" width="634" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="272.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">4. título por variable de entorno</tspan></text><rect x="650" y="248" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="272.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">4</tspan></text><rect x="10" y="296" width="634" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="320.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">5. ejecutar un script versionado, no uno descargado</tspan></text><rect x="650" y="296" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="320.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">3</tspan></text><rect x="10" y="344" width="634" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="368.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">6. no escribir el secreto en el registro</tspan></text><rect x="650" y="344" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="368.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">2</tspan></text><rect x="10" y="392" width="634" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="416.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">7. el trabajo falla cuando falla</tspan></text><rect x="650" y="392" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="416.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">1</tspan></text><rect x="10" y="440" width="634" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="464.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">8. sin credencial en el texto</tspan></text><rect x="650" y="440" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="464.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">0</tspan></text><rect x="10" y="492" width="870" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="445" y="516.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">Cada cambio es pequeño y elimina un hallazgo concreto: no se reescribe la canalización. Que el verificador llegue a</tspan></text><text x="445" y="533.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">0 no prueba que el workflow sea seguro, solo que no contiene las ocho formas que sabe buscar. La credencial del</tspan></text><text x="445" y="550.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">texto, además, sigue en el historial: borrarla del archivo no la revoca.</tspan></text><text x="445" y="589.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
