<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 471" width="910" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Insertar un título en un programa antes de ejecutarlo o pasarlo como dato (6 títulos, ejecución real)</title><desc id="d">Tabla: expandir el título dentro del texto del programa ejecuta 4 de los 6 títulos como código, incluidos los que imprimen INYECTADO y evalúan una operación; pasar el título por una variable de entorno deja los 6 como datos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="471" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Título de entrada</tspan></text><rect x="410" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Expandido en el programa</tspan></text><rect x="680" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Por variable de entorno</tspan></text><rect x="10" y="56" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">x&quot;); print(&quot;INYECTADO</tspan></text><rect x="410" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">se ejecuta como código</tspan></text><rect x="680" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">inerte</tspan></text><rect x="10" y="106" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">x&quot;); import os; print(&quot;INYECTADO&quot;, os.name)#</tspan></text><rect x="410" y="106" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">se ejecuta como código</tspan></text><rect x="680" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">inerte</tspan></text><rect x="10" y="156" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">x\&quot;); print(&#x27;INYECTADO</tspan></text><rect x="410" y="156" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">se ejecuta como código</tspan></text><rect x="680" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">inerte</tspan></text><rect x="10" y="206" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">a&quot; + str(7*7) + &quot;b</tspan></text><rect x="410" y="206" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">se ejecuta como código</tspan></text><rect x="680" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">inerte</tspan></text><rect x="10" y="256" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">ok</tspan></text><rect x="410" y="256" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">inerte</tspan></text><rect x="680" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">inerte</tspan></text><rect x="10" y="306" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">título normal con «tildes» y comillas &#x27;simp…</tspan></text><rect x="410" y="306" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">inerte</tspan></text><rect x="680" y="306" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">inerte</tspan></text><rect x="10" y="360" width="890" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">El mecanismo es el de una expresión de workflow dentro de un script: el texto se sustituye antes de que el intérprete</tspan></text><text x="455" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">lo lea, así que una comilla y un paréntesis lo convierten en código. Aquí el intérprete es Python y la carga es</tspan></text><text x="455" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">inofensiva; el principio no cambia con el intérprete. Se ejecuta de verdad en cada máquina.</tspan></text><text x="455" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
