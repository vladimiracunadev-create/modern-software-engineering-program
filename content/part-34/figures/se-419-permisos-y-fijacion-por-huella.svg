<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 543" width="930" height="543" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ámbitos con escritura del token por job con «write-all» frente al mínimo, y la etiqueta que se mueve</title><desc id="d">Tabla: con permisos de escritura generales cada job de la canalización recibe escritura en 16 ámbitos; con el mínimo, lint y pruebas reciben 0, la construcción 1, la publicación 3 y el despliegue 2; si alguien mueve la etiqueta de una acción, su contenido deja de coincidir con la huella que se había fijado, mientras que la referencia por SHA no cambia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="543" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Job o situación</tspan></text><rect x="370" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Con permisos amplios</tspan></text><rect x="700" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Con el mínimo (escrituras)</tspan></text><rect x="10" y="56" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">lint</tspan></text><rect x="370" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">16 de 16</tspan></text><rect x="700" y="56" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0</tspan></text><rect x="10" y="118" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">test</tspan></text><rect x="370" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">16 de 16</tspan></text><rect x="700" y="118" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0</tspan></text><rect x="10" y="180" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">build</tspan></text><rect x="370" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">16 de 16</tspan></text><rect x="700" y="180" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">1</tspan></text><rect x="10" y="242" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">publicar</tspan></text><rect x="370" y="242" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">16 de 16</tspan></text><rect x="700" y="242" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">3</tspan></text><rect x="10" y="304" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="335.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">desplegar</tspan></text><rect x="370" y="304" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">16 de 16</tspan></text><rect x="700" y="304" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">2</tspan></text><rect x="10" y="366" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="397.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Etiqueta de una acción de terceros movida</tspan></text><rect x="370" y="366" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="389.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">el contenido cambia (no coincide con la</tspan></text><text x="532" y="405.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">huella fijada)</tspan></text><rect x="700" y="366" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="389.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">la referencia por SHA no</tspan></text><text x="807" y="405.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">cambia</tspan></text><rect x="10" y="432" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="456.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Un job de lint con escritura en 16 ámbitos es una superficie de ataque sin función; el mínimo reduce el daño que hace una</tspan></text><text x="465" y="473.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">acción comprometida. La etiqueta es un puntero mutable; el SHA identifica contenido. La lista de 16 ámbitos con escritura</tspan></text><text x="465" y="490.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">sale de la página de sintaxis consultada el 15 de noviembre de 2026 y puede cambiar.</tspan></text><text x="465" y="529.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
