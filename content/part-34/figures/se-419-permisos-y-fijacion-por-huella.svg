<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 612" width="940" height="612" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ámbitos con escritura del token por job con «write-all» frente al mínimo, y la etiqueta que se mueve</title><desc id="d">Barras horizontales con los ámbitos con escritura del token por job: con permisos amplios cada job recibe 16; con el mínimo, lint y pruebas 0, la construcción 1, la publicación 3 y el despliegue 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="612" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ámbitos con escritura del token por job con «write-all» frente al mínimo, y la etiqueta que se mueve</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Con permisos amplios (write-all)</tspan></text><rect x="305.28" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="325.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="325.28" dy="0">Con el mínimo</tspan></text><line x1="184" y1="77" x2="184" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="184" y1="397" x2="184" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="184" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="184" dy="0">0</tspan></text><line x1="362.97" y1="77" x2="362.97" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="362.97" y1="397" x2="362.97" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="362.97" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362.97" dy="0">5</tspan></text><line x1="541.94" y1="77" x2="541.94" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="541.94" y1="397" x2="541.94" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="541.94" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="541.94" dy="0">10</tspan></text><line x1="720.91" y1="77" x2="720.91" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="720.91" y1="397" x2="720.91" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="720.91" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="720.91" dy="0">15</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="397" x2="899.88" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">20</tspan></text><line x1="184" y1="397" x2="899.88" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="174" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">lint</tspan></text><text x="174" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">test</tspan></text><text x="174" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">build</tspan></text><text x="174" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">publicar</tspan></text><text x="174" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">desplegar</tspan></text><rect x="184" y="83" width="572.704" height="24.5" rx="3" fill="#c0432f"/><text x="763.704" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="763.704" dy="0">16</tspan></text><rect x="184" y="110.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="193" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="193" dy="0">0</tspan></text><rect x="184" y="147" width="572.704" height="24.5" rx="3" fill="#c0432f"/><text x="763.704" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="763.704" dy="0">16</tspan></text><rect x="184" y="174.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="193" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="193" dy="0">0</tspan></text><rect x="184" y="211" width="572.704" height="24.5" rx="3" fill="#c0432f"/><text x="763.704" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="763.704" dy="0">16</tspan></text><rect x="184" y="238.5" width="35.794" height="24.5" rx="3" fill="#087f8c"/><text x="226.794" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="226.794" dy="0">1</tspan></text><rect x="184" y="275" width="572.704" height="24.5" rx="3" fill="#c0432f"/><text x="763.704" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="763.704" dy="0">16</tspan></text><rect x="184" y="302.5" width="107.382" height="24.5" rx="3" fill="#087f8c"/><text x="298.382" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="298.382" dy="0">3</tspan></text><rect x="184" y="339" width="572.704" height="24.5" rx="3" fill="#c0432f"/><text x="763.704" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="763.704" dy="0">16</tspan></text><rect x="184" y="366.5" width="71.588" height="24.5" rx="3" fill="#087f8c"/><text x="262.588" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="262.588" dy="0">2</tspan></text><text x="541.94" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="541.94" dy="0">Ámbitos con escritura (de 16)</tspan></text><rect x="10" y="455" width="920" height="109.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Si alguien mueve la etiqueta de una acción de terceros, el contenido cambia y deja de coincidir con la huella fijada,</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mientras que la referencia por SHA no cambia. Un job de lint con escritura en 16 ámbitos es una superficie de ataque sin</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">función; el mínimo reduce el daño que hace una acción comprometida. La etiqueta es un puntero mutable; el SHA identifica</tspan></text><text x="470" y="529.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">contenido. La lista de 16 ámbitos con escritura sale de la página de sintaxis consultada el 15 de noviembre de 2026 y puede</tspan></text><text x="470" y="546.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cambiar.</tspan></text><text x="470" y="594.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
