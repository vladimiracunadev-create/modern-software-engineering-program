<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis defectos que el taller siembra y la prueba que cada uno debe hacer fallar</title><desc id="d">Mapa de calor de seis defectos por seis comprobaciones: la consulta sin filtro la ve la prueba de aislamiento; el evento duplicado y el cobro repetido la prueba de idempotencia y la conciliación; la sobreventa la prueba de concurrencia; el límite ignorado la prueba de derechos; el asiento descuadrado el balance y la conciliación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="494" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis defectos que el taller siembra y la prueba que cada uno debe hacer fallar</tspan></text><text x="364.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="364.5" dy="0">Prueba de</tspan></text><text x="364.5" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="364.5" dy="0">aislamiento</tspan></text><text x="465.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="465.5" dy="0">Prueba de</tspan></text><text x="465.5" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="465.5" dy="0">idempotencia</tspan></text><text x="566.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.5" dy="0">Prueba de</tspan></text><text x="566.5" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.5" dy="0">concurrencia</tspan></text><text x="667.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="667.5" dy="0">Prueba de</tspan></text><text x="667.5" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="667.5" dy="0">derechos</tspan></text><text x="768.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="768.5" dy="0">Asiento</tspan></text><text x="768.5" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="768.5" dy="0">balanceado</tspan></text><text x="869.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="869.5" dy="0">Conciliación</tspan></text><text x="304" y="113.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D1 Consulta sin filtro de inquilino</tspan></text><text x="304" y="153.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D2 Evento de uso duplicado</tspan></text><text x="304" y="193.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D3 Cobro repetido sin clave</tspan></text><text x="304" y="233.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D4 Sobreventa concurrente</tspan></text><text x="304" y="273.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D5 Límite del plan ignorado</tspan></text><text x="304" y="313.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">D6 Asiento que no cuadra</tspan></text><rect x="315.5" y="90.5" width="98" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="364.5" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="364.5" dy="0">falla</tspan></text><rect x="416.5" y="90.5" width="98" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="465.5" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="465.5" dy="0">—</tspan></text><rect x="517.5" y="90.5" width="98" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="566.5" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.5" dy="0">—</tspan></text><rect x="618.5" y="90.5" width="98" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="667.5" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="667.5" dy="0">—</tspan></text><rect x="719.5" y="90.5" width="98" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="768.5" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="768.5" dy="0">—</tspan></text><rect x="820.5" y="90.5" width="98" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="869.5" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="869.5" dy="0">—</tspan></text><rect x="315.5" y="130.5" width="98" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="364.5" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="364.5" dy="0">—</tspan></text><rect x="416.5" y="130.5" width="98" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="465.5" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465.5" dy="0">falla</tspan></text><rect x="517.5" y="130.5" width="98" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="566.5" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.5" dy="0">—</tspan></text><rect x="618.5" y="130.5" width="98" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width=