42231"><tspan x="817" dy="0">229</tspan></text><rect x="10" y="380" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="407.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">canario con métricas</tspan></text><rect x="390" y="380" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="407.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">3</tspan></text><rect x="580" y="380" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="407.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">0</tspan></text><rect x="740" y="380" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="407.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">439</tspan></text><rect x="10" y="434" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="461.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">alerta en producción</tspan></text><rect x="390" y="434" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="461.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">0</tspan></text><rect x="580" y="434" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="461.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">1</tspan></text><rect x="740" y="434" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="461.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">414</tspan></text><rect x="10" y="492" width="890" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="516.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">Las compuertas baratas retrasan poco, las únicas para una clase de fallo hacen escapar: el escaneo es la única que ve</tspan></text><text x="455" y="533.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">un secreto o una dependencia vulnerable. La matriz de qué compuerta ve qué fallo es juicio del autor, y los costos (1 a</tspan></text><text x="455" y="550.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">100) son relativos; el ejercicio es construir la propia y ver qué fallos solo tienen un guardián.</tspan></text><text x="455" y="589.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
