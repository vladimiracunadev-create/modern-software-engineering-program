<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 501" width="930" height="501" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador del paquete de evidencia frente a 120 mutaciones (12 operadores × 10 paquetes)</title><desc id="d">Tabla: un validador de forma detecta 30 de las 120 mutaciones, uno que cruza campos detecta 70 y uno con reglas de verosimilitud 100; las 20 mutaciones de juicio, como un ensayo copiado de otra versión o un aprobador sin permisos reales, no las ve ninguno; los 10 paquetes sin mutar pasan en los tres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="501" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Tipo de mutación</tspan></text><rect x="450" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Solo forma</tspan></text><rect x="600" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">+ cruce de campos</tspan></text><rect x="770" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">+ verosimilitud</tspan></text><rect x="10" y="56" width="434" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Forma (campo ausente, commit o digest mal escritos)</tspan></text><rect x="450" y="56" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">30 de 30</tspan></text><rect x="600" y="56" width="164" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">30 de 30</tspan></text><rect x="770" y="56" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">30 de 30</tspan></text><rect x="10" y="122" width="434" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="147.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Cruce entre campos (digest o commit distinto, autoaprobación,</tspan></text><text x="227" y="163.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">ensayo caducado)</tspan></text><rect x="450" y="122" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">0 de 40</tspan></text><rect x="600" y="122" width="164" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">40 de 40</tspan></text><rect x="770" y="122" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">40 de 40</tspan></text><rect x="10" y="188" width="434" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="213.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Verosimilitud (0 segundos, entorno ajeno, canario sin</tspan></text><text x="227" y="229.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">tráfico)</tspan></text><rect x="450" y="188" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">0 de 30</tspan></text><rect x="600" y="188" width="164" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0 de 30</tspan></text><rect x="770" y="188" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">30 de 30</tspan></text><rect x="10" y="254" width="434" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Juicio (ensayo copiado, aprobador sin permisos reales)</tspan></text><rect x="450" y="254" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">0 de 20</tspan></text><rect x="600" y="254" width="164" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0 de 20</tspan></text><rect x="770" y="254" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0 de 20</tspan></text><rect x="10" y="320" width="434" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="353.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Todas las mutaciones</tspan></text><rect x="450" y="320" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">30 de 120</tspan></text><rect x="600" y="320" width="164" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">70 de 120</tspan></text><rect x="770" y="320" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">100 de 120</tspan></text><rect x="10" y="390" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Cada capa de validación añade lo que la anterior no podía ver y todas dejan pasar la mutación que parece correcta: un</tspan></text><text x="465" y="431.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">ensayo copiado de otra versión tiene forma, cruces y duración verosímiles. Eso solo lo detecta una persona que conozca el</tspan></text><text x="465" y="448.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">sistema o una comprobación contra el sistema real. Mutaciones y reglas escritas por el mismo autor.</tspan></text><text x="465" y="487.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
