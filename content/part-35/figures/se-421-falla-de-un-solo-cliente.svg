<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" width="940" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una falla total que afecta a un solo cliente: qué señal la detecta en una hora</title><desc id="d">Tabla: si falla por completo un cliente que aporta 23,4 por ciento del tráfico, el umbral global de 1 por ciento en 5 minutos lo detecta siempre; si aporta 2,3, también; si aporta 0,58, lo detecta en 8,7 por ciento de los intentos. Una sonda fija en el cliente grande solo ve al cliente grande; una sonda que rota por los 40 clientes detecta a todos en 40 minutos como máximo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="345" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Cliente afectado</tspan></text><rect x="320" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="392" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">Cuota de</tspan></text><text x="392" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">tráfico</tspan></text><rect x="470" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Tasa global &gt; 1 %</tspan></text><rect x="640" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">Sonda fija</tspan></text><rect x="780" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Sonda rotativa</tspan></text><rect x="10" y="56" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">cliente grande (puesto 1)</tspan></text><rect x="320" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">23,37 %</tspan></text><rect x="470" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">100 %</tspan></text><rect x="640" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">100 %</tspan></text><rect x="780" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 %</tspan></text><rect x="10" y="114" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">cliente mediano (puesto 10)</tspan></text><rect x="320" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">2,34 %</tspan></text><rect x="470" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">100 %</tspan></text><rect x="640" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">0 %</tspan></text><rect x="780" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 %</tspan></text><rect x="10" y="172" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">cliente pequeño (puesto 40)</tspan></text><rect x="320" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">0,58 %</tspan></text><rect x="470" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">9 %</tspan></text><rect x="640" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">0 %</tspan></text><rect x="780" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 %</tspan></text><rect x="10" y="234" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El cliente de la cola larga está 100 % caído y la tasa global apenas se mueve: aporta 0,58 % de las peticiones y el umbral</tspan></text><text x="470" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">exige 1 %. La sonda rotativa lo encuentra, pero tarda hasta 40 minutos. Cuarenta clientes con reparto 1/k son un supuesto</tspan></text><text x="470" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del autor; la forma del reparto real cambia el resultado.</tspan></text><text x="470" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
