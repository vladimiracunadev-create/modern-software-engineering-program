<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Localizar el componente lento en una cadena de cuatro servicios con cuatro conjuntos de señales</title><desc id="d">Tabla: en 200 incidentes sintéticos con un servicio lento, mirar solo el borde acierta 49, el percentil 99 absoluto acierta 50, el aumento relativo del percentil 99 frente a la línea base acierta 196, y el mismo método sin ver uno de los cuatro servicios acierta 150.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Señales disponibles</tspan></text><rect x="440" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Localizaciones</tspan></text><text x="532" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">correctas</tspan></text><rect x="630" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Lectura</tspan></text><rect x="10" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Solo la latencia del borde (adivinar entre cuatro)</tspan></text><rect x="440" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">49 de 200</tspan></text><rect x="630" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Dice que algo va lento, no dónde</tspan></text><rect x="10" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">p99 absoluto de la duración que ve cada servicio</tspan></text><rect x="440" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">50 de 200</tspan></text><rect x="630" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="135.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Gana siempre la pasarela, que incluye</tspan></text><text x="777" y="151.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">a todos</tspan></text><rect x="10" y="172" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Aumento relativo del p99 frente a su línea base</tspan></text><rect x="440" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">196 de 200</tspan></text><rect x="630" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Funciona porque hay línea base y</tspan></text><text x="777" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">todos miden</tspan></text><rect x="10" y="230" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Lo mismo con un servicio sin instrumentar</tspan></text><rect x="440" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">150 de 200</tspan></text><rect x="630" y="230" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Culpa al vecino que sí se ve</tspan></text><rect x="10" y="292" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada servicio informa su duración inclusiva (la suya más la de lo que llama). La línea base de 400 peticiones sanas y los</tspan></text><text x="470" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">factores de lentitud de 3 a 8 son supuestos del autor. Un punto ciego no apaga la alarma: la desplaza al servicio vecino, y</tspan></text><text x="470" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">por eso un hueco de instrumentación se parece a una conclusión.</tspan></text><text x="470" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
