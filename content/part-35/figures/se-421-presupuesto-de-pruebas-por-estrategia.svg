<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 351" width="980" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pérdida esperada residual con 40 horas de pruebas repartidas de cinco maneras</title><desc id="d">Barras con la pérdida esperada que queda como porcentaje de la pérdida sin pruebas: 100 por ciento sin pruebas, 50,5 con reparto uniforme, 57,8 proporcional al tamaño, 43,6 proporcional a probabilidad por impacto y 42,7 con el reparto marginal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="351" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Sin pruebas</tspan></text><rect x="370" y="16" width="500" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="878" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="878" dy="0">100 % (16,00)</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Reparto uniforme (4 h por componente)</tspan></text><rect x="370" y="60" width="252.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="630.5" dy="0">50,5 % (8,08)</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Proporcional al tamaño del código</tspan></text><rect x="370" y="104" width="289" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="667" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="667" dy="0">57,8 % (9,24)</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Proporcional a probabilidad × impacto</tspan></text><rect x="370" y="148" width="218" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="596" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="596" dy="0">43,6 % (6,98)</tspan></text><text x="360" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Marginal (óptimo del modelo)</tspan></text><rect x="370" y="192" width="213.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="591.5" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="591.5" dy="0">42,7 % (6,83)</tspan></text><rect x="10" y="240" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Repartir por tamaño es peor que repartir por igual (57,8 % frente a 50,5 %) porque el código más grande no es el más arriesgado.</tspan></text><text x="490" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El reparto marginal pone 9,2 h en plazos y zonas horarias y 0,7 h en autenticación, cuyo impacto es 10: el modelo minimiza la</tspan></text><text x="490" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">pérdida esperada, no garantiza que lo catastrófico quede cubierto.</tspan></text><text x="490" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
