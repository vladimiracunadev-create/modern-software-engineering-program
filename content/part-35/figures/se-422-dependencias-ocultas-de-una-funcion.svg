<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Las dependencias ocultas de cerrar_y_avisar antes y después de separar cálculo, hora y efectos</title><desc id="d">Diagrama de dos mitades: antes, la función cerrar_y_avisar llama directamente a la base, al reloj y al servidor de correo reales; después, calcular_nota y horas_tarde son funciones puras y cerrar recibe la hora, el guardado y el aviso como argumentos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Las dependencias ocultas de cerrar_y_avisar antes y después de separar cálculo, hora y efectos</tspan></text><rect x="10" y="49" width="440" height="262" rx="16" fill="#fbe4de" fill-opacity="0.45" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="71" font-size="14" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="24" dy="0">Antes: tres nombres libres</tspan></text><rect x="28" y="149" width="150" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="103" y="187.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="103" dy="0">cerrar_y_avisar</tspan></text><rect x="238" y="93" width="198" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="337" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="337" dy="0">DB.execute: base real</tspan></text><polyline points="178,184 238,121" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="238" y="163" width="198" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="337" y="186.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="337" dy="0">dt.datetime.now: reloj</tspan></text><text x="337" y="202.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="337" dy="0">real</tspan></text><polyline points="178,184 238,191" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="238" y="233" width="198" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="337" y="256.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="337" dy="0">smtplib.SMTP().sendmail:</tspan></text><text x="337" y="272.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="337" dy="0">correo real</tspan></text><polyline points="178,184 238,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="470" y="49" width="460" height="262" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="484" y="71" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="484" dy="0">Después: costuras en los argumentos</tspan></text><rect x="486" y="99" width="170" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="571" y="120.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="571" dy="0">calcular_nota:</tspan></text><text x="571" y="136.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="571" dy="0">función pura</tspan></text><rect x="486" y="163" width="170" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="571" y="184.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="571" dy="0">horas_tarde: recibe</tspan></text><text x="571" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="571" dy="0">el reloj</tspan></text><rect x="716" y="119" width="200" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="816" y="144.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="816" dy="0">cerrar(ahora, guardar,</tspan></text><text x="816" y="160.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="816" dy="0">avisar)</tspan></text><polyline points="656,125 716,139" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="656,189 716,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="486" y="245" width="137" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="554.5" y="263.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="554.5" dy="0">ahora</tspan></text><text x="554.5" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="554.5" dy="0">(argumento)</tspan></text><polyline points="554,245 816,179" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="629" y="245" width="137" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="697.5" y="263.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="697.5" dy="0">guardar</tspan></text><text x="697.5" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="697.5" dy="0">(argumento)</tspan></text><polyline points="697,245 816,179" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="772" y="245" width="137" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="840.5" y="263.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="840.5" dy="0">avisar</tspan></text><text x="840.5" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="840.5" dy="0">(argumento)</tspan></text><polyline points="840,245 816,179" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="317" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="341.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cada nombre libre es una costura que una prueba debe reemplazar o soportar. La función original no se puede ejecutar sin</tspan></text><text x="470" y="358.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">una base, un reloj y un servidor de correo; la versión refactorizada se prueba con valores. La medida cuenta dependencias</tspan></text><text x="470" y="375.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">en el código, no la calidad del diseño.</tspan></text><text x="470" y="422.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
