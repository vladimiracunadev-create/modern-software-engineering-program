<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Correlación: cadenas completas según la propagación del identificador y líneas huérfanas atribuibles solo por el reloj</title><desc id="d">Tabla: en una cadena de cinco servicios con cuatro saltos, conservar el identificador con probabilidad 0,99 por salto deja 95,9 por ciento de las peticiones completas, 0,95 deja 81,4, 0,90 deja 66,3 y 0,80 deja 40,8. Una línea huérfana solo se puede atribuir por tiempo en 58,6 por ciento de los casos a una petición por segundo y en 0 por ciento desde 20.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="585" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Condición</tspan></text><rect x="480" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">Resultado</tspan></text><rect x="620" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Contraste</tspan></text><rect x="10" y="56" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Cada salto conserva el identificador con probabilidad 0,99</tspan></text><rect x="480" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">95,9 %</tspan></text><rect x="620" y="56" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Fórmula p⁴ = 96,1 %</tspan></text><rect x="10" y="102" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Cada salto conserva el identificador con probabilidad 0,95</tspan></text><rect x="480" y="102" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">81,4 %</tspan></text><rect x="620" y="102" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Fórmula p⁴ = 81,5 %</tspan></text><rect x="10" y="148" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Cada salto conserva el identificador con probabilidad 0,90</tspan></text><rect x="480" y="148" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">66,2 %</tspan></text><rect x="620" y="148" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Fórmula p⁴ = 65,6 %</tspan></text><rect x="10" y="194" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Cada salto conserva el identificador con probabilidad 0,80</tspan></text><rect x="480" y="194" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">40,8 %</tspan></text><rect x="620" y="194" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Fórmula p⁴ = 41,0 %</tspan></text><rect x="10" y="240" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Línea sin identificador a 1 peticiones por segundo</tspan></text><rect x="480" y="240" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">58,6 %</tspan></text><rect x="620" y="240" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Atribuible solo por tiempo</tspan></text><rect x="10" y="286" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Línea sin identificador a 2 peticiones por segundo</tspan></text><rect x="480" y="286" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">36,3 %</tspan></text><rect x="620" y="286" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Atribuible solo por tiempo</tspan></text><rect x="10" y="332" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Línea sin identificador a 5 peticiones por segundo</tspan></text><rect x="480" y="332" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">7,4 %</tspan></text><rect x="620" y="332" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Atribuible solo por tiempo</tspan></text><rect x="10" y="378" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="401.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Línea sin identificador a 20 peticiones por segundo</tspan></text><rect x="480" y="378" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">0,0 %</tspan></text><rect x="620" y="378" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Atribuible solo por tiempo</tspan></text><rect x="10" y="424" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="447.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Línea sin identificador a 100 peticiones por segundo</tspan></text><rect x="480" y="424" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">0,0 %</tspan></text><rect x="620" y="424" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Atribuible solo por tiempo</tspan></text><rect x="10" y="474" width="880" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="498.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">La propagación falla de forma multiplicativa: cuatro saltos al 95 % dejan 81 % y la cola de peticiones incompletas es</tspan></text><text x="450" y="515.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">justo la de las colas y los hilos. Sin identificador, el tiempo solo desambigua con tráfico muy bajo; con una petición</tspan></text><text x="450" y="532.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">durando hasta 250 ms (supuesto del autor), a 20 por segundo siempre hay varias candidatas.</tspan></text><text x="450" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
