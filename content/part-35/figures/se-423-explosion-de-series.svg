<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El número de series de una sola métrica según las dimensiones que se le añaden</title><desc id="d">Barras horizontales en escala logarítmica con las series de una métrica: con endpoint, estado y región hay 45; añadir curso lleva a 1 350, añadir cliente a 54 000 y añadir el identificador de una persona a 1 080 millones de series.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El número de series de una sola métrica según las dimensiones que se le añaden</tspan></text><line x1="354" y1="49" x2="354" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="225" x2="354" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">10</tspan></text><line x1="468.305" y1="49" x2="468.305" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="468.305" y1="225" x2="468.305" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="468.305" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="468.305" dy="0">1 000</tspan></text><line x1="582.61" y1="49" x2="582.61" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="582.61" y1="225" x2="582.61" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="582.61" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582.61" dy="0">100 000</tspan></text><line x1="696.915" y1="49" x2="696.915" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="696.915" y1="225" x2="696.915" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="696.915" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696.915" dy="0">10 000 000</tspan></text><line x1="811.22" y1="49" x2="811.22" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="811.22" y1="225" x2="811.22" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="811.22" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="811.22" dy="0">1 000 000 000</tspan></text><line x1="354" y1="225" x2="811.22" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">endpoint × estado × región (5 × 3 × 3) · 19</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">KB</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">+ curso (30) · 579 KB</tspan></text><text x="344" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">+ cliente (40) · 23,2 MB</tspan></text><text x="344" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">+ identificador de persona (20 000) · 463 GB</tspan></text><rect x="354" y="55" width="37.3327" height="32" rx="3" fill="#c0432f"/><text x="398.333" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="398.333" dy="0">45</tspan></text><rect x="354" y="99" width="121.754" height="32" rx="3" fill="#c0432f"/><text x="482.754" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="482.754" dy="0">1 350</tspan></text><rect x="354" y="143" width="213.316" height="32" rx="3" fill="#c0432f"/><text x="574.316" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="574.316" dy="0">54 000</tspan></text><rect x="354" y="187" width="459.13" height="32" rx="3" fill="#c0432f"/><text x="820.13" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820.13" dy="0">1 080 000 000</tspan></text><text x="582.61" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="582.61" dy="0">Series de la métrica (escala logarítmica)</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El número de series es el producto de las cardinalidades, no la suma, y cada serie nueva cuesta memoria e índice aunque</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">nadie la consulte. Los 429 bytes por serie son una medición de CPython en este equipo con un diccionario de claves de</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">texto; un almacén real tiene otra constante, y la forma del crecimiento es la misma.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); el valor de memoria depende de la versión del intérprete.</tspan></text></svg>
