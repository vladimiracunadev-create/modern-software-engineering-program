<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El número de series de una sola métrica según las dimensiones que se le añaden</title><desc id="d">Tabla: una métrica con las dimensiones endpoint, estado y región tiene 45 series; añadir curso la lleva a 1 350, añadir cliente a 54 000 y añadir el identificador de una persona a 1 080 millones de series, unos 463 gigabytes con 429 bytes por serie.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Dimensiones</tspan></text><rect x="370" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Series</tspan></text><rect x="550" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">Memoria estimada</tspan></text><rect x="720" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Veredicto</tspan></text><rect x="10" y="56" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">endpoint × estado × región (5 × 3 × 3)</tspan></text><rect x="370" y="56" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">45</tspan></text><rect x="550" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">19 KB</tspan></text><rect x="720" y="56" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Cabe</tspan></text><rect x="10" y="114" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">+ curso (30)</tspan></text><rect x="370" y="114" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">1 350</tspan></text><rect x="550" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">579 KB</tspan></text><rect x="720" y="114" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Cabe</tspan></text><rect x="10" y="172" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">+ cliente (40)</tspan></text><rect x="370" y="172" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">54 000</tspan></text><rect x="550" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">23,2 MB</tspan></text><rect x="720" y="172" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Cabe</tspan></text><rect x="10" y="230" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">+ identificador de persona (20 000)</tspan></text><rect x="370" y="230" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">1 080 000 000</tspan></text><rect x="550" y="230" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">463 GB</tspan></text><rect x="720" y="230" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="251.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">No cabe en ningún almacén</tspan></text><text x="822" y="267.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">de métricas</tspan></text><rect x="10" y="292" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El número de series es el producto de las cardinalidades, no la suma, y cada serie nueva cuesta memoria e índice aunque</tspan></text><text x="470" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">nadie la consulte. Los 429 bytes por serie son una medición de CPython en este equipo con un diccionario de claves de</tspan></text><text x="470" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">texto; un almacén real tiene otra constante, y la forma del crecimiento es la misma.</tspan></text><text x="470" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); el valor de memoria depende de la versión del intérprete.</tspan></text></svg>
