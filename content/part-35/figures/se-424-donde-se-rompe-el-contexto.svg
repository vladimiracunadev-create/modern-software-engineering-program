<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 519" width="940" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Propagación del contexto en una petición de seis saltos: dónde se rompe la traza y qué fracción queda completa</title><desc id="d">Tabla: en una petición con seis saltos, el salto HTTP pierde el contexto 1 por ciento de las veces, la cola de mensajes 15, el grupo de hilos 20 y el reintento automático 10; solo 59,4 por ciento de las peticiones queda en una única traza y el promedio es 1,48 trozos por petición con un máximo de cuatro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="519" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Frontera</tspan></text><rect x="340" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">Mecanismo</tspan></text><rect x="650" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Efecto</tspan></text><rect x="10" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Salto HTTP síncrono (pierde el contexto 1 %)</tspan></text><rect x="340" y="56" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">Cabecera copiada por la biblioteca</tspan></text><rect x="650" y="56" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Casi nunca fragmenta</tspan></text><rect x="10" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cola de mensajes (15 %)</tspan></text><rect x="340" y="114" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="135.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">Hay que copiar el contexto a las</tspan></text><text x="492" y="151.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">propiedades del mensaje</tspan></text><rect x="650" y="114" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">La traza se parte en el productor</tspan></text><rect x="10" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Grupo de hilos o tarea asíncrona (20 %)</tspan></text><rect x="340" y="172" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">El contexto vive en la variable del hilo</tspan></text><rect x="650" y="172" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El trabajo posterior queda huérfano</tspan></text><rect x="10" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Reintento automático (10 %)</tspan></text><rect x="340" y="230" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">Se crea una petición nueva</tspan></text><rect x="650" y="230" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El intento nuevo abre otra traza</tspan></text><rect x="10" y="288" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Peticiones con una sola traza completa</tspan></text><rect x="340" y="288" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">59,4 %</tspan></text><rect x="650" y="288" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1,48 trozos por petición, hasta 4</tspan></text><rect x="10" y="346" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="375.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cabeceras traceparent inválidas rechazadas</tspan></text><rect x="340" y="346" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">9 de 9</tspan></text><rect x="650" y="346" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Válidas aceptadas: 2 de 2</tspan></text><rect x="10" y="408" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las probabilidades por frontera son supuestos del autor, pero el patrón es de diseño: el contexto se pierde donde cambia el</tspan></text><text x="470" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">medio de transporte o la unidad de ejecución. El formato W3C traceparent (versión, identificador de traza de 32 hex,</tspan></text><text x="470" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">identificador de span de 16 hex, banderas) se valida con una expresión regular estricta en minúsculas.</tspan></text><text x="470" y="505.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
