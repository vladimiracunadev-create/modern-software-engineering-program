<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Porcentaje de ejecuciones limpias de un recorrido según su cantidad de pasos y la inestabilidad de cada paso</title><desc id="d">Cuatro líneas descendentes, una por inestabilidad por paso: con 0,1 por ciento el recorrido de 30 pasos pasa limpio 97,0 por ciento de las veces; con 2 por ciento pasa solo 55,3 por ciento, y la caída se acelera con la longitud.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Porcentaje de ejecuciones limpias de un recorrido según su cantidad de pasos y la inestabilidad de cada paso</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">0,1 % por paso</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">0,5 % por paso</tspan></text><polygon points="329.12,44.1 335.72,56.4 322.52,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="343.12" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="343.12" dy="0">1 % por paso</tspan></text><polygon points="467.6,43.5 475.1,51 467.6,58.5 460.1,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="481.6" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="481.6" dy="0">2 % por paso</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">70</tspan></text><line x1="78.62" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">90</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">3</tspan></text><line x1="243.913" y1="87" x2="243.913" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="243.913" y1="387" x2="243.913" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="243.913" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="243.913" dy="0">8</tspan></text><line x1="450.122" y1="87" x2="450.122" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="450.122" y1="387" x2="450.122" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="450.122" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="450.122" dy="0">15</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">30</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Ejecuciones limpias (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Pasos del recorrido</tspan></text><polyline points="96.62,88.8 243.913,91.2 450.122,96.6 892,105" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="88.8" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="243.913" cy="91.2" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="450.122" cy="96.6" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="892" cy="105" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="94" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">97,0</tspan></text><polyline points="96.62,96 243.913,110.4 450.122,132 892,172.8" fill="none" stroke="#102a43" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="90.5" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="238.413" y="104.9" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="444.622" y="126.5" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="886.5" y="167.3" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="161.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">85,7</tspan></text><polyline points="96.62,106.8 243.913,133.2 450.122,170.4 892,246" fill="none" stroke="#946512" stroke-width="2.4"/><polygon points="96.62,100.475 102.67,111.75 90.57,111.75" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="243.913,126.875 249.963,138.15 237.863,138.15" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="450.122,164.075 456.172,175.35 444.072,175.35" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="892,239.675 898.05,250.95 885.95,250.95" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="235" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">73,5</tspan></text><polyline points="96.62,121.8 243.913,175.2 450.122,244.2 892,355.2" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="96.62,114.925 103.495,121.8 96.62,128.675 89.745,121.8" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="243.913,168.325 250.788,175.2 243.913,182.075 237.038,175.2" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="450.122,237.325 456.997,244.2 450.122,251.075 443.247,244.2" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="892,348.325 898.875,355.2 892,362.075 885.125,355.2" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="344.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">55,3</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El resultado sigue (1 − q)^k: un paso inestable no se nota y treinta sí. Una suite de 20 recorridos de 15 pasos con 0,5 %</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">por paso (simulación: 22,45 %; teoría: 22,2 %) pasa limpia una de cada cuatro veces. Los porcentajes son de una simulación</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">con semilla fija, no de un sistema.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
