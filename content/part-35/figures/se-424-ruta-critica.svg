<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 345" width="920" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reducir a la mitad un span: ahorro medio de latencia según cómo se elige el span a optimizar</title><desc id="d">Tabla: en 600 árboles de spans sintéticos con latencia media de 412 milisegundos, reducir a la mitad un span al azar ahorra 5,6 milisegundos y no ahorra nada en 57 por ciento de los árboles; el span con más tiempo propio ahorra 40,2 y no ahorra nada en 21 por ciento; el de la ruta crítica ahorra 45,7 y siempre ahorra algo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="345" fill="#ffffff"/><rect x="10" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="267" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="267" dy="0">Qué span se optimiza</tspan></text><rect x="530" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Ahorro medio</tspan></text><rect x="720" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Árboles sin ahorro</tspan></text><rect x="10" y="56" width="514" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Un span al azar</tspan></text><rect x="530" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">5,6 ms</tspan></text><rect x="720" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">57,3 %</tspan></text><rect x="10" y="114" width="514" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">El span con más tiempo propio</tspan></text><rect x="530" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">40,2 ms</tspan></text><rect x="720" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">20,7 %</tspan></text><rect x="10" y="172" width="514" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">El span de la ruta crítica con más tiempo propio</tspan></text><rect x="530" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">45,7 ms</tspan></text><rect x="720" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0,0 %</tspan></text><rect x="10" y="234" width="900" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">Un span fuera de la ruta crítica (hijos paralelos que no son el más lento) no cambia la latencia de la petición aunque</tspan></text><text x="460" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">se acelere. Los árboles (3 a 5 hijos en la raíz, hasta 3 niveles, la mitad de los nodos con hijos en paralelo) son un</tspan></text><text x="460" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">generador del autor, no trazas observadas.</tspan></text><text x="460" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
