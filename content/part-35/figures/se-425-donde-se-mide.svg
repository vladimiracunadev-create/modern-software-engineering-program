<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma disponibilidad medida en el servidor, en el cliente y tras reintentos: fallos que se ven</title><desc id="d">Barras horizontales en escala logarítmica con el porcentaje de fallos de 200 000 solicitudes sintéticas: 0,073 si se mide en el servidor, 2,039 en el cliente con un intento, 0,0005 con tres intentos si todos los fallos fueran independientes y unas cien veces más con tres intentos cuando el fallo va pegado a la petición.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La misma disponibilidad medida en el servidor, en el cliente y tras reintentos: fallos que se ven</tspan></text><line x1="334" y1="49" x2="334" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="334" y1="225" x2="334" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="334" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334" dy="0">0,0001</tspan></text><line x1="440.728" y1="49" x2="440.728" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="440.728" y1="225" x2="440.728" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="440.728" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="440.728" dy="0">0,001</tspan></text><line x1="547.456" y1="49" x2="547.456" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="547.456" y1="225" x2="547.456" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="547.456" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.456" dy="0">0,01</tspan></text><line x1="654.184" y1="49" x2="654.184" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="654.184" y1="225" x2="654.184" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="654.184" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="654.184" dy="0">0,1</tspan></text><line x1="760.912" y1="49" x2="760.912" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="760.912" y1="225" x2="760.912" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="760.912" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="760.912" dy="0">1</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="225" x2="867.64" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">10</tspan></text><line x1="334" y1="225" x2="867.64" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="324" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Servidor</tspan></text><text x="324" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Cliente, un intento</tspan></text><text x="324" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Tres intentos si los fallos fueran</tspan></text><text x="324" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">independientes</tspan></text><text x="324" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Tres intentos con fallos pegados a la</tspan></text><text x="324" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">petición</tspan></text><rect x="334" y="55" width="305.597" height="32" rx="3" fill="#c0432f"/><text x="646.597" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="646.597" dy="0">0,073</tspan></text><rect x="334" y="99" width="459.935" height="32" rx="3" fill="#c0432f"/><text x="800.935" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="800.935" dy="0">2,039</tspan></text><rect x="334" y="143" width="74.5997" height="32" rx="3" fill="#c0432f"/><text x="415.6" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="415.6" dy="0">0,0005</tspan></text><rect x="334" y="187" width="263.599" height="32" rx="3" fill="#c0432f"/><text x="604.599" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="604.599" dy="0">0,0295</tspan></text><text x="600.82" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="600.82" dy="0">Fallos (% = 100 − éxito) (escala logarítmica)</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El servidor no cuenta lo que no llegó (2 % de fallos de red del cliente, supuesto del autor) y el reintento solo ayuda con</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">fallos independientes: 0,03 % de peticiones que fallan siempre aparece como 0,03 % de fallos aunque se intente tres veces.</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un objetivo debe nombrar el punto de medición.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
