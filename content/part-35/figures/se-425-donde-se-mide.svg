<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma disponibilidad medida en el servidor, en el cliente y tras reintentos</title><desc id="d">Tabla: con 200 000 solicitudes sintéticas, el servidor mide 99,927 por ciento de éxito, el cliente con un solo intento mide 97,961, tres intentos independientes darían 99,9995 y tres intentos con un 0,03 por ciento de fallos pegados a la petición dan 99,9705.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Dónde y cómo se mide</tspan></text><rect x="480" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">Éxito</tspan></text><rect x="620" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Lectura</tspan></text><rect x="10" y="56" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Éxito medido en el servidor</tspan></text><rect x="480" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">99,927 %</tspan></text><rect x="620" y="56" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">No ve a quien no llegó</tspan></text><rect x="10" y="114" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Éxito medido en el cliente, un intento</tspan></text><rect x="480" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">97,961 %</tspan></text><rect x="620" y="114" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Incluye la red del usuario</tspan></text><rect x="10" y="172" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Tres intentos si todos los fallos fueran independientes</tspan></text><rect x="480" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">99,9995 %</tspan></text><rect x="620" y="172" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">El cálculo que promete el reintento</tspan></text><rect x="10" y="230" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Tres intentos con fallos pegados a la petición</tspan></text><rect x="480" y="230" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">99,9705 %</tspan></text><rect x="620" y="230" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="251.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Cien veces más fallos que la cifra</tspan></text><text x="772" y="267.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">anterior</tspan></text><rect x="10" y="292" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El servidor no cuenta lo que no llegó (2 % de fallos de red del cliente, supuesto del autor) y el reintento solo ayuda con</tspan></text><text x="470" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">fallos independientes: 0,03 % de peticiones que fallan siempre aparece como 0,03 % de fallos aunque se intente tres veces.</tspan></text><text x="470" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un objetivo debe nombrar el punto de medición.</tspan></text><text x="470" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
