<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 351" width="940" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fracción de secuencias aleatorias que descubren el defecto de la cola, según su longitud (5 000 por barra)</title><desc id="d">Barras: ninguna secuencia de hasta 8 operaciones descubre el defecto de la cola frente al modelo; con longitud 12 lo descubre 24,7 por ciento, y con 20 o 40 cerca de 55 por ciento; cuatro secuencias manuales no lo detectan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="351" fill="#ffffff"/><text x="280" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Longitud 3, 5 u 8</tspan></text><rect x="290" y="16" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="302" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="302" dy="0">0 %</tspan></text><text x="280" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Longitud 12</tspan></text><rect x="290" y="60" width="160.55" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="458.55" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="458.55" dy="0">24,7 %</tspan></text><text x="280" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Longitud 20</tspan></text><rect x="290" y="104" width="355.55" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="653.55" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="653.55" dy="0">54,7 %</tspan></text><text x="280" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Longitud 40</tspan></text><rect x="290" y="148" width="356.2" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="654.2" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="654.2" dy="0">54,8 %</tspan></text><text x="280" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Cuatro secuencias manuales</tspan></text><rect x="290" y="192" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="302" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="302" dy="0">0 de 4</tspan></text><rect x="10" y="240" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La cola real pierde un elemento al compactar tras sacar tres, solo si quedan más de cuatro. Hace falta una secuencia de al</tspan></text><text x="470" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">menos 9 operaciones, y el 55 % de techo viene de que muchas secuencias largas cambian el estado antes de alcanzar la</tspan></text><text x="470" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">condición. Las pruebas por ejemplo de 2 a 6 operaciones nunca llegan.</tspan></text><text x="470" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
