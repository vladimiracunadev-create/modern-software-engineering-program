<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 618" width="940" height="618" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro defectos escondidos en un analizador: semillas (de 20) que los hallan con 20 000 entradas</title><desc id="d">Barras horizontales: los bytes aleatorios no hallan ninguno de los cuatro defectos; el generador estructurado con valores límite los halla en las 20 semillas con medianas de 31 a 101 entradas; el guiado por cobertura los halla en 15 a 20 semillas con medianas de 210 a 6 826 entradas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="618" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro defectos escondidos en un analizador: semillas (de 20) que los hallan con 20 000 entradas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Bytes aleatorios</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Estructurado con valores límite</tspan></text><rect x="466.38" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="486.38" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="486.38" dy="0">Guiado por cobertura</tspan></text><line x1="294" y1="77" x2="294" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="437" x2="294" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="445.47" y1="77" x2="445.47" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="445.47" y1="437" x2="445.47" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="445.47" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="445.47" dy="0">5</tspan></text><line x1="596.94" y1="77" x2="596.94" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="596.94" y1="437" x2="596.94" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="596.94" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="596.94" dy="0">10</tspan></text><line x1="748.41" y1="77" x2="748.41" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="748.41" y1="437" x2="748.41" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="748.41" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.41" dy="0">15</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="437" x2="899.88" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">20</tspan></text><line x1="294" y1="437" x2="899.88" y2="437" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Nombre de más de 30 caracteres</tspan></text><text x="284" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Nombre vacío con nota 7,0</tspan></text><text x="284" y="298" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Identificador &gt; 99 999 y estado</tspan></text><text x="284" y="315" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">anulada</tspan></text><text x="284" y="396.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Nota «nan» o «inf»</tspan></text><rect x="294" y="83" width="2" height="24" rx="3" fill="#c0432f"/><text x="303" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="110" width="605.88" height="24" rx="3" fill="#087f8c"/><text x="906.88" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><rect x="294" y="137" width="605.88" height="24" rx="3" fill="#946512"/><text x="906.88" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><rect x="294" y="173" width="2" height="24" rx="3" fill="#c0432f"/><text x="303" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="200" width="605.88" height="24" rx="3" fill="#087f8c"/><text x="906.88" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><rect x="294" y="227" width="454.41" height="24" rx="3" fill="#946512"/><text x="755.41" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="755.41" dy="0">15</tspan></text><rect x="294" y="263" width="2" height="24" rx="3" fill="#c0432f"/><text x="303" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="290" width="605.88" height="24" rx="3" fill="#087f8c"/><text x="906.88" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><rect x="294" y="317" width="484.704" height="24" rx="3" fill="#946512"/><text x="785.704" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="785.704" dy="0">16</tspan></text><rect x="294" y="353" width="2" height="24" rx="3" fill="#c0432f"/><text x="303" y="369.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="380" width="605.88" height="24" rx="3" fill="#087f8c"/><text x="906.88" y="396.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><rect x="294" y="407" width="605.88" height="24" rx="3" fill="#946512"/><text x="906.88" y="423.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><text x="596.94" y="481" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="596.94" dy="0">semillas (de 20) que hallan el defecto</tspan></text><rect x="10" y="495" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="519.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las cadenas aleatorias casi nunca forman cuatro campos con un identificador numérico, así que nunca llegan al código que</tspan></text><text x="470" y="536.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">falla. El generador estructurado conoce los valores límite del formato, y ese conocimiento es del autor: el resultado</tspan></text><text x="470" y="553.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">muestra el mecanismo y no la tasa de hallazgo de una herramienta real. Las medianas de entradas están en la tabla.</tspan></text><text x="470" y="600.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
