1"><tspan x="582" dy="0">1 de 12</tspan></text><rect x="660" y="194" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">1 min</tspan></text><rect x="800" y="194" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="240" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Consumo 6× (6 h y 30 min)</tspan></text><rect x="300" y="240" width="94" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">28</tspan></text><rect x="400" y="240" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">10 de 14</tspan></text><rect x="510" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">8 de 12</tspan></text><rect x="660" y="240" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">25 min</tspan></text><rect x="800" y="240" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="286" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Consumo 14,4× o 6×</tspan></text><rect x="300" y="286" width="94" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">31</tspan></text><rect x="400" y="286" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">13 de 14</tspan></text><rect x="510" y="286" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">8 de 12</tspan></text><rect x="660" y="286" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">8 min</tspan></text><rect x="800" y="286" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="336" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ninguna regla detecta las 12 degradaciones sin pagar páginas falsas: la regla de 1 % en 5 minutos las ve todas porque de</tspan></text><text x="470" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">noche, con 30 peticiones por minuto, dos errores bastan. Una página que no pide acción es coste puro. Tasa de error base de</tspan></text><text x="470" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">0,1 %, tráfico entre 30 y 300 por minuto e incidentes inyectados son supuestos del autor.</tspan></text><text x="470" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
