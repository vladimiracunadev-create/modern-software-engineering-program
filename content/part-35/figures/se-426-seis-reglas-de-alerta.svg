<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 447" width="940" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis reglas de alerta sobre 180 días de tráfico diurno y nocturno con 14 caídas y 12 degradaciones lentas</title><desc id="d">Tabla: el umbral de 0,5 por ciento en un minuto genera 12 622 páginas, 11 748 sin incidente; el umbral de 1 por ciento en 5 minutos genera 609 páginas, 396 sin incidente; el de 1 por ciento en 30 minutos genera 27 páginas sin ninguna falsa y detecta 13 caídas y 6 degradaciones; la regla de consumo 14,4 veces detecta 13 caídas y 1 degradación con 13 páginas; la combinación de consumo 14,4 y 6 veces detecta 13 caídas y 8 degradaciones con 31 páginas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="447" fill="#ffffff"/><rect x="10" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152" dy="0">Regla</tspan></text><rect x="300" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="347" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">Páginas</tspan></text><rect x="400" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Caídas</tspan></text><rect x="510" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Degradaciones</tspan></text><rect x="660" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Retraso mediano</tspan></text><rect x="800" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Sin incidente</tspan></text><rect x="10" y="56" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Umbral 0,5 % en 1 min</tspan></text><rect x="300" y="56" width="94" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">12 622</tspan></text><rect x="400" y="56" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">13 de 14</tspan></text><rect x="510" y="56" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">12 de 12</tspan></text><rect x="660" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0 min</tspan></text><rect x="800" y="56" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x=