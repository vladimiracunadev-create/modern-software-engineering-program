<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Umbral de 1 % de errores con ventanas de 1 a 60 minutos: falsos positivos al día y minutos hasta alertar</title><desc id="d">Tabla: con 100 peticiones por minuto, una ventana de un minuto produce 6,85 falsos positivos al día; una de 5 minutos, 0,02; las de 15 y 60 minutos, ninguno; con un 2 por ciento de errores la mediana hasta alertar es 1 minuto, 3, 8 y 28 minutos para las ventanas de 1, 5, 15 y 60 minutos, y con una caída total es 1 minuto en todas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><rect x="10" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="77" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="77" dy="0">Ventana</tspan></text><rect x="150" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Falsos positivos por día</tspan></text><rect x="370" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Con 2 % de errores</tspan></text><rect x="560" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Con 10 % de errores</tspan></text><rect x="750" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Con caída total</tspan></text><rect x="10" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">1 min</tspan></text><rect x="150" y="56" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">6,85</tspan></text><rect x="370" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">1 min</tspan></text><rect x="560" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">1 min</tspan></text><rect x="750" y="56" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">1 min</tspan></text><rect x="10" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">5 min</tspan></text><rect x="150" y="114" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">0,02</tspan></text><rect x="370" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">3 min</tspan></text><rect x="560" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">1 min</tspan></text><rect x="750" y="114" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">1 min</tspan></text><rect x="10" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">15 min</tspan></text><rect x="150" y="172" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">0,00</tspan></text><rect x="370" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">8 min</tspan></text><rect x="560" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">2 min</tspan></text><rect x="750" y="172" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">1 min</tspan></text><rect x="10" y="230" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">60 min</tspan></text><rect x="150" y="230" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">0,00</tspan></text><rect x="370" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">28 min</tspan></text><rect x="560" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">6 min</tspan></text><rect x="750" y="230" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">1 min</tspan></text><rect x="10" y="292" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una ventana larga suprime el ruido y retrasa lo moderado, y a una caída total no la retrasa casi nada: por eso se combinan</tspan></text><text x="470" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ventanas largas para lo lento y cortas para lo grave. La ventana incluye la historia sana previa al incidente; 120 días de</tspan></text><text x="470" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ruido con 100 peticiones por minuto es un supuesto del autor.</tspan></text><text x="470" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
