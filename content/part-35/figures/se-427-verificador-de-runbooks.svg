<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 631" width="940" height="631" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un verificador de runbooks frente a 240 mutaciones de ocho runbooks base (diez operadores)</title><desc id="d">Tabla: un verificador de campos, fechas, referencias a alertas y reversiones detecta 144 de 240 mutaciones de runbooks; detecta 24 de 24 al quitar un campo, vaciar la salida esperada, quitar la reversión de un paso destructivo, envejecer la verificación, escribir mal la alerta o dejar el escalamiento en TBD, y 0 de 24 al intercambiar el contenido de dos pasos, apuntar al entorno equivocado, cambiar el comando por otro plausible o nombrar un propietario inexistente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="631" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Mutación</tspan></text><rect x="480" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Detectadas</tspan></text><rect x="610" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Por qué</tspan></text><rect x="10" y="56" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Quita un campo obligatorio</tspan></text><rect x="480" y="56" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">24 de 24</tspan></text><rect x="610" y="56" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Lo ve la forma</tspan></text><rect x="10" y="102" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Vacía la salida esperada</tspan></text><rect x="480" y="102" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">24 de 24</tspan></text><rect x="610" y="102" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Lo ve la forma</tspan></text><rect x="10" y="148" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Quita la reversión de un paso destructivo</tspan></text><rect x="480" y="148" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">24 de 24</tspan></text><rect x="610" y="148" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Lo ve la forma</tspan></text><rect x="10" y="194" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Envejece la verificación</tspan></text><rect x="480" y="194" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">24 de 24</tspan></text><rect x="610" y="194" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Lo ve la forma</tspan></text><rect x="10" y="240" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Alerta con errata</tspan></text><rect x="480" y="240" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">24 de 24</tspan></text><rect x="610" y="240" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Lo ve la forma</tspan></text><rect x="10" y="286" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Escalamiento «tbd»</tspan></text><rect x="480" y="286" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">24 de 24</tspan></text><rect x="610" y="286" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Lo ve la forma</tspan></text><rect x="10" y="332" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Intercambia el contenido de dos pasos</tspan></text><rect x="480" y="332" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0 de 24</tspan></text><rect x="610" y="332" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Solo lo ve quien ejecuta el runbook</tspan></text><rect x="10" y="378" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="401.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Apunta al entorno equivocado</tspan></text><rect x="480" y="378" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0 de 24</tspan></text><rect x="610" y="378" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Solo lo ve quien ejecuta el runbook</tspan></text><rect x="10" y="424" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="447.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Cambia el comando por otro plausible</tspan></text><rect x="480" y="424" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0 de 24</tspan></text><rect x="610" y="424" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Solo lo ve quien ejecuta el runbook</tspan></text><rect x="10" y="470" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="493.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Propietario inexistente</tspan></text><rect x="480" y="470" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="493.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0 de 24</tspan></text><rect x="610" y="470" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="493.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Solo lo ve quien ejecuta el runbook</tspan></text><rect x="10" y="520" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="544.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Detecta 144 de 240 (60 %): todo lo que ve es forma y ninguna de las 96 que se escapan la viola. Un runbook bien formado y</tspan></text><text x="470" y="561.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">erróneo es peor que uno ausente porque se ejecuta con confianza; solo un ejercicio real lo descubre. Las ocho bases y los</tspan></text><text x="470" y="578.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">operadores son construcciones del autor.</tspan></text><text x="470" y="617.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
