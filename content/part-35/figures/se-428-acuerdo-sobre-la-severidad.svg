<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres personas clasifican 400 incidentes en cuatro niveles de severidad con tres tipos de criterio</title><desc id="d">Barras horizontales con el acuerdo con la severidad verdadera y el error de dos o más niveles según el criterio: con criterios vagos el kappa de Cohen es 0,29 y se coincide con la verdad 57,8 por ciento de las veces; con umbrales numéricos de impacto el kappa sube a 0,61 y el acuerdo a 80,1; con umbrales y un ejemplo por nivel, a 0,83 y 91,8, y el error de dos o más niveles baja de 2,2 a 0 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres personas clasifican 400 incidentes en cuatro niveles de severidad con tres tipos de criterio</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Acuerdo con la verdad</tspan></text><rect x="222.34" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Error de 2 o más niveles</tspan></text><line x1="354" y1="77" x2="354" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="269" x2="354" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="459.952" y1="77" x2="459.952" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="459.952" y1="269" x2="459.952" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="459.952" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="459.952" dy="0">20</tspan></text><line x1="565.904" y1="77" x2="565.904" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="565.904" y1="269" x2="565.904" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="565.904" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="565.904" dy="0">40</tspan></text><line x1="671.856" y1="77" x2="671.856" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="671.856" y1="269" x2="671.856" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="671.856" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="671.856" dy="0">60</tspan></text><line x1="777.808" y1="77" x2="777.808" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="777.808" y1="269" x2="777.808" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="777.808" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777.808" dy="0">80</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="269" x2="883.76" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="354" y1="269" x2="883.76" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">criterios vagos («grave», «moderado») (kappa</tspan></text><text x="344" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">0,29)</tspan></text><text x="344" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">umbrales numéricos de impacto (kappa 0,61)</tspan></text><text x="344" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">umbrales y un ejemplo por nivel (kappa 0,83)</tspan></text><rect x="354" y="83" width="306.201" height="24.5" rx="3" fill="#087f8c"/><text x="667.201" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="667.201" dy="0">57,8</tspan></text><rect x="354" y="110.5" width="11.6547" height="24.5" rx="3" fill="#c0432f"/><text x="372.655" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="372.655" dy="0">2,2</tspan></text><rect x="354" y="147" width="424.338" height="24.5" rx="3" fill="#087f8c"/><text x="785.338" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="785.338" dy="0">80,1</tspan></text><rect x="354" y="174.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0,0</tspan></text><rect x="354" y="211" width="486.32" height="24.5" rx="3" fill="#087f8c"/><text x="847.32" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="847.32" dy="0">91,8</tspan></text><rect x="354" y="238.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0,0</tspan></text><text x="618.88" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="618.88" dy="0">Incidentes (%)</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La severidad que se declara en minutos de tensión depende de cómo se perciba el impacto: el ruido de percepción (0,9, 0,35</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y 0,15 en escala logarítmica) es un supuesto del autor. Lo que importa es la dirección: un criterio medible convierte una</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">opinión en una decisión que otra persona reproduce.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
