<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" width="940" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres personas clasifican 400 incidentes en cuatro niveles de severidad con tres tipos de criterio</title><desc id="d">Tabla: con criterios vagos el acuerdo entre personas medido con kappa de Cohen es 0,29 y se coincide con la severidad verdadera 57,8 por ciento de las veces; con umbrales numéricos de impacto sube a 0,61 y 80,1 por ciento; con umbrales y un ejemplo por nivel sube a 0,83 y 91,8 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="345" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Criterio</tspan></text><rect x="440" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Kappa medio</tspan></text><rect x="570" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Acuerdo con la</tspan></text><text x="662" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">verdad</tspan></text><rect x="760" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Error de 2 o más</tspan></text><text x="842" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">niveles</tspan></text><rect x="10" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">criterios vagos («grave», «moderado»)</tspan></text><rect x="440" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0,29</tspan></text><rect x="570" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">57,8 %</tspan></text><rect x="760" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">2,2 %</tspan></text><rect x="10" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">umbrales numéricos de impacto</tspan></text><rect x="440" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0,61</tspan></text><rect x="570" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">80,1 %</tspan></text><rect x="760" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0,0 %</tspan></text><rect x="10" y="172" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">umbrales y un ejemplo por nivel</tspan></text><rect x="440" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0,83</tspan></text><rect x="570" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">91,8 %</tspan></text><rect x="760" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0,0 %</tspan></text><rect x="10" y="234" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La severidad que se declara en minutos de tensión depende de cómo se perciba el impacto: el ruido de percepción (0,9, 0,35</tspan></text><text x="470" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y 0,15 en escala logarítmica) es un supuesto del autor. Lo que importa es la dirección: un criterio medible convierte una</tspan></text><text x="470" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">opinión en una decisión que otra persona reproduce.</tspan></text><text x="470" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
