<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 298" width="940" height="298" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos mil incidentes sintéticos: de qué se compone la media del tiempo hasta resolver</title><desc id="d">Barra apilada con la media del tiempo hasta resolver, 73,5 minutos, por tramo: detección 8,8, reconocimiento 3,4, diagnóstico 40,6, mitigación 15,4 y verificación 5,4; la media de un trimestre de 30 incidentes va de 59,9 a 91,1 minutos con la misma práctica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="298" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos mil incidentes sintéticos: de qué se compone la media del tiempo hasta resolver</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detección</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Reconocimiento</tspan></text><rect x="285.42" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="305.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="305.42" dy="0">Diagnóstico</tspan></text><rect x="416.36" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="436.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="436.36" dy="0">Mitigación</tspan></text><rect x="539.76" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="559.76" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="559.76" dy="0">Verificación</tspan></text><line x1="254" y1="77" x2="254" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="117" x2="254" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="409.425" y1="77" x2="409.425" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="409.425" y1="117" x2="409.425" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="409.425" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409.425" dy="0">20</tspan></text><line x1="564.85" y1="77" x2="564.85" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="564.85" y1="117" x2="564.85" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="564.85" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="564.85" dy="0">40</tspan></text><line x1="720.275" y1="77" x2="720.275" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="720.275" y1="117" x2="720.275" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="720.275" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="720.275" dy="0">60</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="117" x2="875.7" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">80</tspan></text><line x1="254" y1="117" x2="875.7" y2="117" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Media del tiempo hasta resolver</tspan></text><rect x="254" y="84" width="68.387" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="288.193" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="288.193" dy="0">8,8</tspan></text><rect x="322.387" y="84" width="26.4223" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><rect x="348.809" y="84" width="315.513" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="506.566" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="506.566" dy="0">40,6</tspan></text><rect x="664.322" y="84" width="119.677" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="724.161" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="724.161" dy="0">15,4</tspan></text><rect x="783.999" y="84" width="41.9648" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="804.982" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="804.982" dy="0">5,4</tspan></text><text x="832.964" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="832.964" dy="0">73,6</tspan></text><text x="564.85" y="161" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">Minutos</tspan></text><rect x="10" y="175" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Comparar la media de dos trimestres con 30 incidentes cada uno confunde azar y mejora: la diferencia entre p5 y p95 (31</tspan></text><text x="470" y="216.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">minutos) es mayor que la mejora que produce adelantar la detección. Las medianas y dispersiones de cada tramo son supuestos</tspan></text><text x="470" y="233.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del autor, no mediciones.</tspan></text><text x="470" y="280.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
