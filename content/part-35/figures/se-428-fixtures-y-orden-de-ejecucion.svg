<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce pruebas en 500 órdenes aleatorios según cómo se prepara la base</title><desc id="d">Barras horizontales con las órdenes que tienen algún fallo de 500: con la base compartida fallan 490 órdenes; con una base nueva por prueba (72 sentencias de preparación) o con una transacción con retroceso (24 sentencias) no falla ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Doce pruebas en 500 órdenes aleatorios según cómo se prepara la base</tspan></text><line x1="354" y1="49" x2="354" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="163" x2="354" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="461.564" y1="49" x2="461.564" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="461.564" y1="163" x2="461.564" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="461.564" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.564" dy="0">100</tspan></text><line x1="569.128" y1="49" x2="569.128" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="569.128" y1="163" x2="569.128" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="569.128" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="569.128" dy="0">200</tspan></text><line x1="676.692" y1="49" x2="676.692" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="676.692" y1="163" x2="676.692" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="676.692" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="676.692" dy="0">300</tspan></text><line x1="784.256" y1="49" x2="784.256" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="784.256" y1="163" x2="784.256" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="784.256" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.256" dy="0">400</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="163" x2="891.82" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">500</tspan></text><line x1="354" y1="163" x2="891.82" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Estado compartido (0 sentencias)</tspan></text><text x="344" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Base nueva por prueba (72 sentencias)</tspan></text><text x="344" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Transacción con retroceso (24 sentencias)</tspan></text><rect x="354" y="55" width="527.064" height="26" rx="3" fill="#c0432f"/><text x="888.064" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="888.064" dy="0">490</tspan></text><rect x="354" y="93" width="2" height="26" rx="3" fill="#c0432f"/><text x="363" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="131" width="2" height="26" rx="3" fill="#c0432f"/><text x="363" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><text x="622.91" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="622.91" dy="0">órdenes con algún fallo (de 500)</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las doce pruebas incluyen cinco que cambian o cuentan filas compartidas, a propósito. El orden en que se definieron tampoco</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">pasa con la base compartida (234 resultados distintos). La transacción cuesta un tercio de recrear la base, pero solo aísla</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">lo que ocurre dentro de ella: no cubre cambios que hagan commit por su cuenta ni estado fuera de la base.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
