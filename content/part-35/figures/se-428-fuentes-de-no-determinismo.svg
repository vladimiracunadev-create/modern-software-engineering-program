<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 439" width="980" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Salidas distintas de un mismo generador de informe en 30 procesos, según la fuente de no determinismo activada</title><desc id="d">Barras: el reloj, el identificador aleatorio y el número aleatorio producen 30 salidas distintas en 30 procesos; el orden de un conjunto produce entre 15 y 18; la suma de flotantes en orden mezclado entre 1 y 3; la identidad de un objeto 2; los datos fijos ordenados y el listado de un directorio de tres archivos 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="439" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Reloj (hora actual)</tspan></text><rect x="410" y="16" width="330" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="748" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="748" dy="0">30 de 30 distintas</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Identificador aleatorio (uuid4)</tspan></text><rect x="410" y="60" width="330" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="748" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="748" dy="0">30 de 30</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Número aleatorio sin semilla</tspan></text><rect x="410" y="104" width="330" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="748" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="748" dy="0">30 de 30</tspan></text><text x="400" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Orden de un conjunto de cadenas</tspan></text><rect x="410" y="148" width="198" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="616" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="616" dy="0">15 a 18 según la ejecución</tspan></text><text x="400" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Suma de flotantes en orden mezclado</tspan></text><rect x="410" y="192" width="33" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="451" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="451" dy="0">1 a 3 de 30</tspan></text><text x="400" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Identidad de un objeto (id)</tspan></text><rect x="410" y="236" width="22" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="440" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="440" dy="0">2 de 30</tspan></text><text x="400" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Datos fijos ordenados · listado de un directorio</tspan></text><rect x="410" y="280" width="11" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="429" dy="0">1 (ambos sistemas)</tspan></text><rect x="10" y="328" width="960" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Las fuentes se inyectan o se fijan una por una: el reloj y el azar se reciben como parámetros, los conjuntos se ordenan, las</tspan></text><text x="490" y="369.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">sumas de flotantes se hacen en orden fijo. Un listado de directorio dio una sola salida en ambos sistemas con tres archivos</tspan></text><text x="490" y="386.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">pequeños, pero su orden no está garantizado por el sistema de archivos.</tspan></text><text x="490" y="425.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
