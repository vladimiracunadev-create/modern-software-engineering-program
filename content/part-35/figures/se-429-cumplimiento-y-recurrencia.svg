<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Incidentes por año tras tres años según el porcentaje de acciones correctivas que se completan</title><desc id="d">Líneas con los incidentes por año a lo largo de tres años según el porcentaje de acciones correctivas completadas: con 12 causas y unos 40 incidentes el primer año, completar 30 por ciento deja 16,7 incidentes el segundo año y 11,2 el tercero; completar 60 por ciento deja 9,7 y 5,9; cuanto más se completa, más rápido bajan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Incidentes por año tras tres años según el porcentaje de acciones correctivas que se completan</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">30 % de las acciones completadas</tspan></text><rect x="305.28" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="325.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="325.28" dy="0">60 % de las acciones completadas</tspan></text><polygon points="600.56,44.1 607.16,56.4 593.96,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="614.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="614.56" dy="0">90 