<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 585" width="940" height="585" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un verificador de postmortems frente a 180 mutaciones (nueve operadores sobre veinte documentos cada uno)</title><desc id="d">Tabla: un verificador de lenguaje de culpa explícito, cifras de impacto, horas en la línea de tiempo, dos factores como mínimo y propietario y verificación de cada acción detecta 100 de 180 mutaciones; detecta 20 de 20 de la culpa explícita, la acción sin propietario, el impacto sin cifras, la línea sin hora y la causa única, y 0 de 20 de la culpa implícita, la acción vaga con verificación débil, la hora inventada y la acción desproporcionada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="585" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Mutación</tspan></text><rect x="510" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Detectadas</tspan></text><rect x="640" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Resultado</tspan></text><rect x="10" y="56" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Culpa explícita</tspan></text><rect x="510" y="56" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">20 de 20</tspan></text><rect x="640" y="56" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Lo ve la forma</tspan></text><rect x="10" y="102" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Culpa implícita</tspan></text><rect x="510" y="102" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0 de 20</tspan></text><rect x="640" y="102" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Pasa el verificador</tspan></text><rect x="10" y="148" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Acción vaga con verificación débil</tspan></text><rect x="510" y="148" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0 de 20</tspan></text><rect x="640" y="148" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Pasa el verificador</tspan></text><rect x="10" y="194" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Acción sin propietario</tspan></text><rect x="510" y="194" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">20 de 20</tspan></text><rect x="640" y="194" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Lo ve la forma</tspan></text><rect x="10" y="240" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Impacto sin cifras</tspan></text><rect x="510" y="240" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">20 de 20</tspan></text><rect x="640" y="240" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Lo ve la forma</tspan></text><rect x="10" y="286" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Línea de tiempo sin hora</tspan></text><rect x="510" y="286" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">20 de 20</tspan></text><rect x="640" y="286" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Lo ve la forma</tspan></text><rect x="10" y="332" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Una sola causa («error humano»)</tspan></text><rect x="510" y="332" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">20 de 20</tspan></text><rect x="640" y="332" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Lo ve la forma</tspan></text><rect x="10" y="378" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="401.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Hora inventada fuera de orden</tspan></text><rect x="510" y="378" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0 de 20</tspan></text><rect x="640" y="378" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Pasa el verificador</tspan></text><rect x="10" y="424" width="494" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="447.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Acción desproporcionada con propietario genérico</tspan></text><rect x="510" y="424" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0 de 20</tspan></text><rect x="640" y="424" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Pasa el verificador</tspan></text><rect x="10" y="474" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="498.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Detecta 100 de 180 (56 %). Un documento que pasa el verificador puede culpar sin nombrar a nadie («como siempre, el turno</tspan></text><text x="470" y="515.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de noche…») y proponer acciones que nadie podrá comprobar. Medir la forma de un postmortem es medir su limpieza, no su</tspan></text><text x="470" y="532.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">calidad.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
