<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 654" width="940" height="654" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un verificador de postmortems frente a 180 mutaciones (nueve operadores sobre veinte documentos cada uno)</title><desc id="d">Barras apiladas con las mutaciones detectadas y no detectadas por tipo: el verificador de lenguaje de culpa explícito, cifras de impacto, horas en la línea de tiempo, dos factores como mínimo y propietario y verificación de cada acción detecta 100 de 180; las que cambian el sentido sin tocar la forma pasan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="654" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un verificador de postmortems frente a 180 mutaciones (nueve operadores sobre veinte documentos cada uno)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="354" y1="77" x2="354" y2="473" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="473" x2="354" y2="478" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="494" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="484.425" y1="77" x2="484.425" y2="473" stroke="#d5dde1" stroke-width="1"/><line x1="484.425" y1="473" x2="484.425" y2="478" stroke="#5b7280" stroke-width="1.4"/><text x="484.425" y="494" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="484.425" dy="0">5</tspan></text><line x1="614.85" y1="77" x2="614.85" y2="473" stroke="#d5dde1" stroke-width="1"/><line x1="614.85" y1="473" x2="614.85" y2="478" stroke="#5b7280" stroke-width="1.4"/><text x="614.85" y="494" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="614.85" dy="0">10</tspan></text><line x1="745.275" y1="77" x2="745.275" y2="473" stroke="#d5dde1" stroke-width="1"/><line x1="745.275" y1="473" x2="745.275" y2="478" stroke="#5b7280" stroke-width="1.4"/><text x="745.275" y="494" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="745.275" dy="0">15</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="473" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="473" x2="875.7" y2="478" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="494" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">20</tspan></text><line x1="354" y1="473" x2="875.7" y2="473" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Culpa explícita</tspan></text><text x="344" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Culpa implícita</tspan></text><text x="344" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Acción vaga con verificación débil</tspan></text><text x="344" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Acción sin propietario</tspan></text><text x="344" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Impacto sin cifras</tspan></text><text x="344" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Línea de tiempo sin hora</tspan></text><text x="344" y="367.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Una sola causa («error humano»)</tspan></text><text x="344" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Hora inventada fuera de orden</tspan></text><text x="344" y="447" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Acción desproporcionada con propietario</tspan></text><text x="344" y="464" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">genérico</tspan></text><rect x="354" y="84" width="521.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">20</tspan></text><rect x="875.7" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="354" y="128" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="128" width="521.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">20</tspan></text><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="354" y="172" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="172" width="521.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">20</tspan></text><text x="882.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="354" y="216" width="521.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">20</tspan></text><rect x="875.7" y="216" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="354" y="260" width="521.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="279.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">20</tspan></text><rect x="875.7" y="260" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="354" y="304" width="521.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="323.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">20</tspan></text><rect x="875.7" y="304" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="323.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="354" y="348" width="521.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="367.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">20</tspan></text><rect x="875.7" y="348" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="367.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="354" y="392" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="392" width="521.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="411.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">20</tspan></text><text x="882.7" y="411.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="354" y="436" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="436" width="521.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="455.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">20</tspan></text><text x="882.7" y="455.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><text x="614.85" y="517" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Mutaciones</tspan></text><rect x="10" y="531" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="555.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Detecta 100 de 180 (56 %). Un documento que pasa el verificador puede culpar sin nombrar a nadie («como siempre, el turno</tspan></text><text x="470" y="572.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de noche…») y proponer acciones que nadie podrá comprobar. Medir la forma de un postmortem es medir su limpieza, no su</tspan></text><text x="470" y="589.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">calidad.</tspan></text><text x="470" y="636.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
