1.6"/><text x="672" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">4</tspan></text><rect x="780" y="256" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">495</tspan></text><rect x="10" y="306" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">6</tspan></text><rect x="170" y="306" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="262" dy="0">7,50</tspan></text><rect x="360" y="306" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">5,78</tspan></text><rect x="570" y="306" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">5</tspan></text><rect x="780" y="306" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">924</tspan></text><rect x="10" y="360" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La matriz de firmas (qué señal se desvía con cada falla) es del autor y trata cada señal como binaria; sirve para contar</tspan></text><text x="470" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ambigüedades, no para estimar probabilidades. Lo que falta importa más que cuántas faltan: la combinación de señales</tspan></text><text x="470" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ausentes decide qué fallas se confunden.</tspan></text><text x="470" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
