<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 842" width="980" height="842" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Catorce pruebas sobre el mismo módulo: mutantes que matan (de 18) según su veredicto</title><desc id="d">Barras apiladas horizontales con los mutantes que mata cada una de catorce pruebas: la de bordes mata 13, tres pruebas sin aserciones útiles matan 6 cada una solo por excepción, dos pruebas (texto del error y orden de las claves) son frágiles ante refactorizaciones benignas y t09 no mata ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="842" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Catorce pruebas sobre el mismo módulo: mutantes que matan (de 18) según su veredicto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Útil o la más fuerte</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Mata solo por excepción</tspan></text><rect x="436.22" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="456.22" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="456.22" dy="0">Frágil ante un refactor benigno</tspan></text><rect x="16" y="69" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Débil o pasa por la razón equivocada</tspan></text><line x1="274" y1="101" x2="274" y2="661" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="661" x2="274" y2="666" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="682" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="487.9" y1="101" x2="487.9" y2="661" stroke="#d5dde1" stroke-width="1"/><line x1="487.9" y1="661" x2="487.9" y2="666" stroke="#5b7280" stroke-width="1.4"/><text x="487.9" y="682" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487.9" dy="0">5</tspan></text><line x1="701.8" y1="101" x2="701.8" y2="661" stroke="#d5dde1" stroke-width="1"/><line x1="701.8" y1="661" x2="701.8" y2="666" stroke="#5b7280" stroke-width="1.4"/><text x="701.8" y="682" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701.8" dy="0">10</tspan></text><line x1="915.7" y1="101" x2="915.7" y2="661" stroke="#d5dde1" stroke-width="1"/><line x1="915.7" y1="661" x2="915.7" y2="666" stroke="#5b7280" stroke-width="1.4"/><text x="915.7" y="682" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="915.7" dy="0">15</tspan></text><line x1="274" y1="661" x2="915.7" y2="661" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="125.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">t01 resultado completo</tspan></text><text x="264" y="165.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">t02 solo ejecuta</tspan></text><text x="264" y="205.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">t03 «no es None»</tspan></text><text x="264" y="245.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">t04 compara algo consigo mismo</tspan></text><text x="264" y="285.5" fon