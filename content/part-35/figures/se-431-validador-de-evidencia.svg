<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 437" width="940" height="437" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">200 mutaciones de un paquete de evidencia: cuántas detecta el validador al sumar cada nivel</title><desc id="d">Barras horizontales acumuladas: el nivel de estructura detecta 77 de 200 mutaciones; con referencias, 139; con re-ejecución de las pruebas contra el defecto, 153; con refactorizaciones benignas, 173; con reglas sobre las aserciones, 200.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="437" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">200 mutaciones de un paquete de evidencia: cuántas detecta el validador al sumar cada nivel</tspan></text><line x1="224" y1="49" x2="224" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="239" x2="224" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="390.955" y1="49" x2="390.955" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="390.955" y1="239" x2="390.955" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="390.955" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="390.955" dy="0">50</tspan></text><line x1="557.91" y1="49" x2="557.91" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="557.91" y1="239" x2="557.91" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="557.91" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557.91" dy="0">100</tspan></text><line x1="724.865" y1="49" x2="724.865" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="724.865" y1="239" x2="724.865" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="724.865" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="724.865" dy="0">150</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="239" x2="891.82" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">200</tspan></text><line x1="224" y1="239" x2="891.82" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Estructura</tspan></text><text x="214" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">+ Referencias</tspan></text><text x="214" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">+ Re-ejecución</tspan></text><text x="214" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">+ Refactor benigno</tspan></text><text x="214" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">+ Reglas de aserción</tspan></text><rect x="224" y="55" width="257.111" height="26" rx="3" fill="#087f8c"/><text x="488.111" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="488.111" dy="0">77</tspan></text><rect x="224" y="93" width="464.135" height="26" rx="3" fill="#087f8c"/><text x="695.135" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="695.135" dy="0">139</tspan></text><rect x="224" y="131" width="510.882" height="26" rx="3" fill="#087f8c"/><text x="741.882" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="741.882" dy="0">153</tspan></text><rect x="224" y="169" width="577.664" height="26" rx="3" fill="#087f8c"/><text x="808.664" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="808.664" dy="0">173</tspan></text><rect x="224" y="207" width="667.82" height="26" rx="3" fill="#087f8c"/><text x="898.82" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">200</tspan></text><text x="557.91" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="557.91" dy="0">mutaciones detectadas de 200</tspan></text><rect x="10" y="297" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada nivel atrapa lo que el anterior dejó pasar: faltaban campos y afirmaciones negativas (estructura), pruebas y defectos</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">inventados (referencias), pruebas que no detectan el defecto (re-ejecución), pruebas frágiles (refactor) y pruebas sin</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aserciones o tautológicas (reglas de aserción). El 100 % final es engañoso: las reglas se diseñaron con las nueve</tspan></text><text x="470" y="371.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mutaciones que se evalúan. Un paquete con una trampa nueva podría pasar los cinco niveles.</tspan></text><text x="470" y="419.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
