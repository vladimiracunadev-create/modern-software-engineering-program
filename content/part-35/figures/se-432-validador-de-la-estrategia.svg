<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 298" width="940" height="298" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador del paquete de estrategia: en qué nivel se detecta cada una de las 200 mutaciones</title><desc id="d">Una barra apilada de 200 mutaciones: 60 las detecta la estructura, 64 la coherencia de riesgo, 29 el presupuesto y 33 la trazabilidad, 186 en total; las 14 restantes son 13 cambios de redacción inocuos y una mutación de nivel equivalente, que no deben detectarse.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="298" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Validador del paquete de estrategia: en qué nivel se detecta cada una de las 200 mutaciones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Estructura (60)</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Coherencia (64)</tspan></text><rect x="338.2" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="358.2" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="358.2" dy="0">Presupuesto (29)</tspan></text><rect x="506.84" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="526.84" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="526.84" dy="0">Trazabilidad (33)</tspan></text><rect x="683.02" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="703.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="703.02" dy="0">No detectadas (14)</tspan></text><line x1="214" y1="77" x2="214" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="117" x2="214" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="379.425" y1="77" x2="379.425" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="379.425" y1="117" x2="379.425" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="379.425" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="379.425" dy="0">50</tspan></text><line x1="544.85" y1="77" x2="544.85" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="544.85" y1="117" x2="544.85" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="544.85" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.85" dy="0">100</tspan></text><line x1="710.275" y1="77" x2="710.275" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="710.275" y1="117" x2="710.275" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="710.275" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="710.275" dy="0">150</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="117" x2="875.7" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">200</tspan></text><line x1="214" y1="117" x2="875.7" y2="117" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">200 mutaciones del paquete</tspan></text><rect x="214" y="84" width="198.51" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="313.255" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="313.255" dy="0">60</tspan></text><rect x="412.51" y="84" width="211.744" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="518.382" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="518.382" dy="0">64</tspan></text><rect x="624.254" y="84" width="95.9465" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="672.227" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672.227" dy="0">29</tspan></text><rect x="720.201" y="84" width="109.181" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="774.791" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="774.791" dy="0">33</tspan></text><rect x="829.381" y="84" width="46.319" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="852.541" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852.541" dy="0">14</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">200</tspan></text><text x="544.85" y="161" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.85" dy="0">mutaciones</tspan></text><rect x="10" y="175" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">De 187 mutaciones que cambian el contenido se detectan 186: la que falta es un cambio de nivel que cae en otro nivel</tspan></text><text x="470" y="216.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">igualmente válido, es decir, no cambia nada. Las 13 mutaciones inocuas de redacción no deben detectarse. Las reglas se</tspan></text><text x="470" y="233.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ajustaron con los mismos tipos que se miden; un paquete incorrecto de un tipo no contemplado puede pasar.</tspan></text><text x="470" y="280.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
