<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un equipo de 100 unidades al mes: el trabajo correctivo se come lo demás si no hay reserva preventiva</title><desc id="d">Líneas con el trabajo correctivo mensual de un equipo de 100 unidades en los meses 1, 12 y 24: sin reserva sube de 19,7 a 33,0 y 59,7 unidades y desplaza al perfectivo, y la deuda pasa de 40,9 a 184,0 y 401,2; con una reserva del 20 por ciento para trabajo preventivo baja de 19,7 a 12,6 y 14,0 y la deuda a cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un equipo de 100 unidades al mes: el trabajo correctivo se come lo demás si no hay reserva preventiva</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin reserva</tspan></text><rect x="146.94" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Reserva del 20 %</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="387" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="312" x2="71.08" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="237" x2="71.08" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="162" x2="71.08" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="87" x2="71.08" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="87" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="87" x2="89.08" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="387" x2="89.08" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">1</tspan></text><line x1="473.085" y1="87" x2="473.085" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="473.085" y1="387" x2="473.085" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="473.085" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="473.085" dy="0">12</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">24</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Trabajo correctivo (unidades al mes)</text><text x="490.54" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Mes</tspan></text><polyline points="89.08,313.125 473.085,263.25 892,163.125" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="89.08" cy="313.125" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="302.125" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">19,7</tspan></text><circle cx="473.085" cy="263.25" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="473.085" y="252.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="473.085" dy="0">33,0</tspan></text><circle cx="892" cy="163.125" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="152.125" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">59,7</tspan></text><polyline points="89.08,313.125 473.085,339.75 892,334.5" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="307.625" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="89.08" y="302.125" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">19,7</tspan></text><rect x="467.585" y="334.25" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="473.085" y="328.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="473.085" dy="0">12,6</tspan></text><rect x="886.5" y="329" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="323.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">14,0</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Sin reserva, la carga correctiva pasa de 19,7 a 59,7 unidades y desplaza al perfectivo (de 30,0 a 25,3), y la deuda llega a</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">401,2; con el 20 % reservado, el correctivo baja a 14,0, se entrega todo lo pedido y la deuda es 0. Los coeficientes de</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">realimentación entre deuda e incidencias son del autor: demuestran un mecanismo, no una magnitud.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
