<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 333" width="960" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un equipo de 100 unidades al mes: lo correctivo se come lo demás si no hay reserva preventiva</title><desc id="d">Tabla con la capacidad mensual de un equipo en los meses 1, 12 y 24 con y sin una reserva del 20 por ciento para trabajo preventivo: sin reserva el trabajo correctivo sube de 19,7 a 59,7 unidades y la deuda de 40,9 a 401,2; con reserva el correctivo baja a 14,0 y la deuda a cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="333" fill="#ffffff"/><rect x="10" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="52" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="52" dy="0">Mes</tspan></text><rect x="100" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Sin reserva: correctivo ·</tspan></text><text x="222" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">perfectivo</tspan></text><rect x="350" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Sin reserva:</tspan></text><text x="422" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">deuda</tspan></text><rect x="500" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="637" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">Reserva del 20 %: correctivo ·</tspan></text><text x="637" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">perfectivo</tspan></text><rect x="780" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Reserva del 20 %:</tspan></text><text x="862" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">deuda</tspan></text><rect x="10" y="56" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">1</tspan></text><rect x="100" y="56" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">19,7 · 30,0</tspan></text><rect x="350" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">40,9</tspan></text><rect x="500" y="56" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">19,7 · 30,0</tspan></text><rect x="780" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">14,9</tspan></text><rect x="10" y="110" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">12</tspan></text><rect x="100" y="110" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">33,0 · 30,0</tspan></text><rect x="350" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">184,0</tspan></text><rect x="500" y="110" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">12,6 · 30,0</tspan></text><rect x="780" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0,0</tspan></text><rect x="10" y="164" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">24</tspan></text><rect x="100" y="164" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">59,7 · 25,3</tspan></text><rect x="350" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">401,2</tspan></text><rect x="500" y="164" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">14,0 · 30,0</tspan></text><rect x="780" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0,0</tspan></text><rect x="10" y="222" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Sin reserva, la carga correctiva pasa de 19,7 a 59,7 unidades y desplaza al perfectivo; con el 20 % reservado, el correctivo</tspan></text><text x="480" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">baja a 14,0 y se entrega todo lo pedido. Los coeficientes de realimentación entre deuda e incidencias son del autor:</tspan></text><text x="480" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">demuestran un mecanismo, no una magnitud.</tspan></text><text x="480" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
