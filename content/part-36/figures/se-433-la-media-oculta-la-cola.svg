<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 395" width="940" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Latencia de 20 000 peticiones sintéticas: lo que dicen la media y los percentiles</title><desc id="d">Barras: con una cola lenta del 1,5 por ciento de las peticiones, la mediana es 121 milisegundos, la media 157, el percentil 95 es 225, el percentil 99 sube a 1 929, el 99,9 a 2 908 y el máximo a 2 996.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="395" fill="#ffffff"/><text x="150" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">Mediana</tspan></text><rect x="160" y="16" width="21.78" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="189.78" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="189.78" dy="0">121 ms</tspan></text><text x="150" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">Media</tspan></text><rect x="160" y="60" width="28.26" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="196.26" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="196.26" dy="0">157 ms</tspan></text><text x="150" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">p95</tspan></text><rect x="160" y="104" width="40.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="208.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="208.5" dy="0">225 ms</tspan></text><text x="150" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">p99</tspan></text><rect x="160" y="148" width="347.22" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="515.22" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="515.22" dy="0">1 929 ms</tspan></text><text x="150" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">p99,9</tspan></text><rect x="160" y="192" width="523.44" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="691.44" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="691.44" dy="0">2 908 ms</tspan></text><text x="150" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">Máximo</tspan></text><rect x="160" y="236" width="539.28" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="707.28" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="707.28" dy="0">2 996 ms</tspan></text><rect x="10" y="284" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El 98,5 % de las peticiones sigue una distribución de mediana 120 ms y el 1,5 % restante tarda entre 1,5 y 3 s. La media se</tspan></text><text x="470" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">mueve 36 ms y no delata nada; el p95 tampoco; el p99 sí. Un requisito que nombre solo la media o el p95 deja sin proteger a</tspan></text><text x="470" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">1 de cada 73 peticiones.</tspan></text><text x="470" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
