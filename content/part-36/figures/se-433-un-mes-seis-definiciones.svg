<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un mismo mes de 60 000 peticiones medido con cuatro definiciones frente al objetivo de 300 ms</title><desc id="d">Barras horizontales con el valor que cada definición compara con el objetivo de 300 milisegundos: la media de las medias diarias da 161, el percentil 95 del mes 227, el percentil 99 del mes 2 057 y el percentil 95 del día 17 con tres horas lentas 2 294; solo las dos primeras quedan bajo la línea del objetivo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un mismo mes de 60 000 peticiones medido con cuatro definiciones frente al objetivo de 300 ms</tspan></text><line x1="324" y1="49" x2="324" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="225" x2="324" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="49" x2="434.34" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="225" x2="434.34" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="434.34" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.34" dy="0">500</tspan></text><line x1="544.68" y1="49" x2="544.68" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="544.68" y1="225" x2="544.68" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="544.68" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.68" dy="0">1 000</tspan></text><line x1="655.02" y1="49" x2="655.02" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="655.02" y1="225" x2="655.02" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="655.02" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.02" dy="0">1 500</tspan></text><line x1="765.36" y1="49" x2="765.36" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="765.36" y1="225" x2="765.36" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="765.36" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.36" dy="0">2 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="225" x2="875.7" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2 500</tspan></text><line x1="324" y1="225" x2="875.7" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Media de las medias diarias</tspan></text><text x="314" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">p95 de todas las peticiones del mes</tspan></text><text x="314" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">p99 del mes</tspan></text><text x="314" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">p95 del día 17 (tres horas con 60 % de</tspan></text><text x="314" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">peticiones lentas)</tspan></text><rect x="324" y="55" width="35.5295" height="32" rx="3" fill="#102a43"/><text x="366.529" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="366.529" dy="0">161</tspan></text><rect x="324" y="99" width="50.0944" height="32" rx="3" fill="#102a43"/><text x="381.094" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="381.094" dy="0">227</tspan></text><rect x="324" y="143" width="453.939" height="32" rx="3" fill="#102a43"/><text x="784.939" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="784.939" dy="0">2 057</tspan></text><rect x="324" y="187" width="506.24" height="32" rx="3" fill="#102a43"/><text x="837.24" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="837.24" dy="0">2 294</tspan></text><line x1="390.204" y1="49" x2="390.204" y2="225" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="395.204" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="395.204" dy="0">Objetivo: 300 ms</tspan></text><text x="599.85" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Milisegundos (ms)</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El objetivo es el mismo número y las definiciones llegan a conclusiones opuestas. Agregar el mes entero diluye un incidente</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de tres horas porque 59 de cada 60 peticiones fueron normales; exigir el p95 en cada día falla el día 17 (29 de 30 días</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cumplen). La definición forma parte del requisito: ventana, estadístico y alcance.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
