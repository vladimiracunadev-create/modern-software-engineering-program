<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bloqueos espurios al encadenar comprobaciones que fallan solas el 2 % de las veces</title><desc id="d">Líneas con la fracción de cambios bloqueados por ruido según el número de comprobaciones encadenadas: al primer intento sube de 2,1 por ciento con una a 55,9 con cuarenta; con hasta tres intentos baja a 0,01, 0,11, 0,61, 3,52 y 17,14, pero un defecto detectado el 90 por ciento de las veces se cuela en el 27,3 por ciento de los casos en lugar del 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="560" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Bloqueos espurios al encadenar comprobaciones que fallan solas el 2 % de las veces</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Bloqueo al primer intento</tspan></text><rect x="252.5" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Bloqueo tras hasta 3 intentos</tspan></text><line x1="86.16" y1="377" x2="910" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="377" x2="86.16" y2="377" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,01</tspan></text><line x1="86.16" y1="304.5" x2="910" y2="304.5" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="304.5" x2="86.16" y2="304.5" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="309" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,1</tspan></text><line x1="86.16" y1="232" x2="910" y2="232" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="232" x2="86.16" y2="232" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="236.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1</tspan></text><line x1="86.16" y1="159.5" x2="910" y2="159.5" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="159.5" x2="86.16" y2="159.5" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="164" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">10</tspan></text><line x1="86.16" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="87" x2="86.16" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">100</tspan></text><line x1="86.16" y1="87" x2="86.16" y2="377" stroke="#5b7280" stroke-width="1.6"/><line x1="104.16" y1="87" x2="104.16" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="104.16" y1="377" x2="104.16" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="104.16" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.16" dy="0">1</tspan></text><line x1="184.964" y1="87" x2="184.964" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="184.964" y1="377" x2="184.964" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="184.964" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="184.964" dy="0">5</tspan></text><line x1="285.969" y1="87" x2="285.969" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="285.969" y1="377" x2="285.969" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="285.969" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="285.969" dy="0">10</tspan></text><line x1="487.979" y1="87" x2="487.979" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="487.979" y1="377" x2="487.979" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="487.979" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487.979" dy="0">20</tspan></text><line x1="892" y1="87" x2="892" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="377" x2="892" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">40</tspan></text><line x1="86.16" y1="377" x2="910" y2="377" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="232" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 232)">Cambios bloqueados por ruido (%) (escala logarítmica)</text><text x="498.08" y="423" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="498.08" dy="0">Comprobaciones encadenadas</tspan></text><polyline points="104.16,208.639 184.964,161.448 285.969,140.301 487.979,121.434 892,105.313" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="104.16" cy="208.639" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="104.16" y="197.639" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">2,1</tspan></text><circle cx="184.964" cy="161.448" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="184.964" y="150.448" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="184.964" dy="0">9,4</tspan></text><circle cx="285.969" cy="140.301" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="285.969" y="129.301" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="285.969" dy="0">18,4</tspan></text><circle cx="487.979" cy="121.434" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="487.979" y="110.434" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="487.979" dy="0">33,5</tspan></text><circle cx="892" cy="105.313" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="94.3126" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">55,9</tspan></text><polyline points="104.16,377 184.964,301.499 285.969,247.564 487.979,192.376 892,142.534" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="98.66" y="371.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="104.16" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">0,01</tspan></text><rect x="179.464" y="295.999" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="184.964" y="290.499" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="184.964" dy="0">0,11</tspan></text><rect x="280.469" y="242.064" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="285.969" y="236.564" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="285.969" dy="0">0,61</tspan></text><rect x="482.479" y="186.876" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="487.979" y="181.376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="487.979" dy="0">3,52</tspan></text><rect x="886.5" y="137.034" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="131.534" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">17,14</tspan></text><rect x="10" y="437" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Reintentar hasta ponerse en verde elimina el ruido y también la señal: un defecto que la comprobación detecta el 90 % de</tspan></text><text x="470" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">las veces pasa en el 27,3 % de los casos tras tres intentos, frente al 10,0 % con un intento. La corrección es hacer</tspan></text><text x="470" y="495.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">determinista la comprobación o separar «inestable» de «falla», no ampliar los intentos.</tspan></text><text x="470" y="542.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
