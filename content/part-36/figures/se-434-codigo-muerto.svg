<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 329" width="990" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos técnicas para encontrar código muerto en un módulo de 60 funciones con 20 realmente muertas</title><desc id="d">Tabla con dos técnicas de detección de código muerto sobre 60 funciones con 20 muertas: el análisis por nombre propone 45 candidatos con 25 falsas alarmas, la traza de una ejecución propone 25 con 5 falsas alarmas y la coincidencia de ambas propone exactamente las 20 muertas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="329" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Técnica</tspan></text><rect x="310" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Candidatos</tspan></text><rect x="460" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Muertas halladas</tspan></text><rect x="660" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Falsas alarmas</tspan></text><rect x="10" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Análisis por nombre (ast)</tspan></text><rect x="310" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">45</tspan></text><rect x="460" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">20</tspan></text><rect x="660" y="56" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">25: 15 por cadena y 10 registradas</tspan></text><rect x="10" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Traza de una ejecución</tspan></text><rect x="310" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">25</tspan></text><rect x="460" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">20</tspan></text><rect x="660" y="114" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">5: rama poco frecuente</tspan></text><rect x="10" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Coinciden las dos</tspan></text><rect x="310" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">20</tspan></text><rect x="460" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">20</tspan></text><rect x="660" y="172" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0</tspan></text><rect x="10" y="234" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Cada técnica se equivoca por una razón distinta. La coincidencia deja cero falsas alarmas solo porque en este módulo ningún uso</tspan></text><text x="495" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">dinámico estaba en una rama poco frecuente; una llamada por cadena en esa rama habría engañado a las dos.</tspan></text><text x="495" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
