<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 527" width="940" height="527" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres compuertas de cobertura sobre 500 cambios que se fusionan en un repositorio de 20 000 líneas al 72 %</title><desc id="d">Barras agrupadas con los dos errores de cada compuerta: la cobertura total mínima del 70 por ciento deja pasar los 117 cambios con pruebas pobres y no bloquea ninguno bueno; la cobertura total que no baje y la cobertura del cambio al 80 por ciento no dejan pasar ninguno pobre, y la segunda bloquea 1 de 193 cambios bien probados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="527" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres compuertas de cobertura sobre 500 cambios que se fusionan en un repositorio de 20 000 líneas al 72 %</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cambios pobres que pasan (de 117)</tspan></text><rect x="312.82" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="332.82" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="332.82" dy="0">Cambios bien probados que se bloquean (de 193)</tspan></text><line x1="78.62" y1="335" x2="920" y2="335" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="335" x2="78.62" y2="335" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="287" x2="920" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="239" x2="920" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="191" x2="920" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="191" x2="78.62" y2="191" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="195.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="143" x2="920" y2="143" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="143" x2="78.62" y2="143" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">125</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="335" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="215" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 215)">Cambios</text><rect x="106.666" y="110.36" width="110.184" height="224.64" rx="3" fill="#c0432f"/><text x="161.758" y="104.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">117</tspan></text><rect x="220.85" y="333" width="110.184" height="2" rx="3" fill="#946512"/><text x="275.942" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">0</tspan></text><text x="218.85" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Cobertura total ≥ 70 %</tspan></text><rect x="387.126" y="333" width="110.184" height="2" rx="3" fill="#c0432f"/><text x="442.218" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">0</tspan></text><rect x="501.31" y="333" width="110.184" height="2" rx="3" fill="#946512"/><text x="556.402" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">0</tspan></text><text x="499.31" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">La cobertura total no baja</tspan></text><rect x="667.586" y="333" width="110.184" height="2" rx="3" fill="#c0432f"/><text x="722.678" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">0</tspan></text><rect x="781.77" y="333" width="110.184" height="2" rx="3" fill="#946512"/><text x="836.862" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">1</tspan></text><text x="779.77" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Cobertura de las líneas del cambio ≥</tspan></text><text x="779.77" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">80 %</tspan></text><rect x="10" y="404" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="428.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El repositorio crece de 20 000 a 118 813 líneas y la cobertura total termina en 73,1 %: cada cambio mueve el total menos de</tspan></text><text x="470" y="445.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">0,1 punto, así que un umbral absoluto no ve a ninguno. «Pobre» significa que la calidad real de las pruebas es menor del 60</tspan></text><text x="470" y="462.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">%; la cobertura mide líneas ejecutadas, no aserciones.</tspan></text><text x="470" y="509.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
