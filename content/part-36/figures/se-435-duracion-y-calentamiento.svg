<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 538" width="940" height="538" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">p99 estimado en 30 repeticiones según la duración de la prueba y el calentamiento (60 req/s, 4 servidores)</title><desc id="d">Intervalos en escala logarítmica con el mínimo y el máximo del percentil 99 en 30 repeticiones y su media al final de cada fila: sin calentamiento el rango se estrecha de 244 a 378 milisegundos con 30 segundos a 279 a 343 con 600; con caché fría los primeros 60 segundos, incluir el arranque da una media de 1 045 y un máximo de 2 724, y descartar los 120 primeros segundos lo devuelve a 300.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="538" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">p99 estimado en 30 repeticiones según la duración de la prueba y el calentamiento (60 req/s, 4 servidores)</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mínimo de 30 repeticiones</tspan></text><circle cx="258.5" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Máximo de 30 repeticiones</tspan></text><line x1="362.3" y1="77" x2="362.3" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="362.3" y1="357" x2="362.3" y2="362" stroke="#5b7280" stroke-width="1.4"/>