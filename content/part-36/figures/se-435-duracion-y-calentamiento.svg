rcle cx="438.372" cy="97" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="475.702" cy="97" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="426.372" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="426.372" dy="0">244</tspan></text><text x="487.702" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="487.702" dy="0">378</tspan></text><text x="926" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">media 290</tspan></text><line x1="446.373" y1="137" x2="471.304" y2="137" stroke="#c0432f" stroke-width="4"/><circle cx="446.373" cy="137" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="471.304" cy="137" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="434.373" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="434.373" dy="0">268</tspan></text><text x="483.304" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="483.304" dy="0">359</tspan></text><text x="926" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">media 301</tspan></text><line x1="449.803" y1="177" x2="467.416" y2="177" stroke="#c0432f" stroke-width="4"/><circle cx="449.803" cy="177" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="467.416" cy="177" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="437.803" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="437.803" dy="0">279</tspan></text><text x="479.416" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="479.416" dy="0">343</tspan></text><text x="926" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">media 301</tspan></text><line x1="516.375" y1="217" x2="644.132" y2="217" stroke="#c0432f" stroke-width="4"/><circle cx="516.375" cy="217" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="644.132" cy="217" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="504.375" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="504.375" dy="0">609</tspan></text><text x="656.132" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="656.132" dy="0">2 724</tspan></text><text x="926" y="221.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">media 1 045</tspan></text><line x1="445.734" y1="257" x2="466.667" y2="257" stroke="#c0432f" stroke-width="4"/><circle cx="445.734" cy="257" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="466.667" cy="257" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="433.734" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="433.734" dy="0">266</tspan></text><text x="478.667" y="261.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="478.667" dy="0">340</tspan></text><text x="926" y="261.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">media 300</tspan></text><line x1="475.25" y1="297" x2="602.456" y2="297" stroke="#c0432f" stroke-width="4"/><circle cx="475.25" cy="297" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="602.456" cy="297" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="463.25" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="463.25" dy="0">376</tspan></text><text x="614.456" y="301.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="614.456" dy="0">1 671</tspan></text><text x="926" y="301.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">media 904</tspan></text><line x1="449.803" y1="337" x2="461.762" y2="337" stroke="#c0432f" stroke-width="4"/><circle cx="449.803" cy="337" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="461.762" cy="337" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="437.803" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="437.803" dy="0">279</tspan></text><text x="473.762" y="341.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="473.762" dy="0">321</tspan></text><text x="926" y="341.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">media 298</tspan></text><text x="558.67" y="401" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="558.67" dy="0">p99 en milisegundos (ms) (escala logarítmica)</tspan></text><rect x="10" y="415" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="439.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una prueba más larga estrecha el intervalo (de 134 a 64 ms de rango), pero el sesgo mayor viene de mezclar el arranque con</tspan></text><text x="470" y="456.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">el régimen estable: 1 045 frente a 300 ms de media. Descartar un tramo exige decidirlo antes de ver el resultado y publicar</tspan></text><text x="470" y="473.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cuánto se descartó.</tspan></text><text x="470" y="520.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
