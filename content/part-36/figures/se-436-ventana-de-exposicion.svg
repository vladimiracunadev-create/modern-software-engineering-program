<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Exposición a avisos de seguridad en 40 dependencias y 31 avisos durante un año, según la política</title><desc id="d">Intervalos con la exposición mediana y la del percentil 95 a avisos de seguridad según la política de actualización: continua 22 y 107 días, lote mensual 29 y 126, lote trimestral 68 y 156 y lote anual 224 y 361.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Exposición a avisos de seguridad en 40 dependencias y 31 avisos durante un año, según la política</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mediana</tspan></text><polygon points="122.78,44.1 129.38,56.4 116.18,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">p95</tspan></text><line x1="264" y1="77" x2="264" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="264" y1="373" x2="264" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="264" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="264" dy="0">0</tspan></text><line x1="420.5" y1="77" x2="420.5" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="420.5" y1="373" x2="420.5" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="420.5" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="420.5" dy="0">100</tspan></text><line x1="577" y1="77" x2="577" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="577" y1="373" x2="577" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="577" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">200</tspan></text><line x1="733.5" y1="77" x2="733.5" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="733.5" y1="373" x2="733.5" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="733.5" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="733.5" dy="0">300</tspan></text><line x1="890" y1="77" x2="890" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="373" x2="890" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">400</tspan></text><line x1="264" y1="373" x2="890" y2="373" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="110" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">Continua (7 días tras la</tspan></text><text x="234" y="127" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">corrección)</tspan></text><text x="234" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">Lote mensual</tspan></text><text x="234" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">Lote trimestral</tspan></text><text x="234" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">Lote anual</tspan></text><line x1="298.43" y1="114" x2="431.455" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="291.43" y="107" width="14" height="14"