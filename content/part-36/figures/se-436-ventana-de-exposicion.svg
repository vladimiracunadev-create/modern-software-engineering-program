x="828.965" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="828.965" dy="0">361</tspan></text><text x="577" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="577" dy="0">Días de exposición</tspan></text><rect x="10" y="431" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="455.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El lote anual deja un aviso expuesto diez veces más que la política continua. Aun la continua tiene un percentil 95 de 107</tspan></text><text x="470" y="472.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">días por el retraso del proveedor, que no depende de ti. El ritmo de avisos y el retraso (mediana 14 días) son supuestos</tspan></text><text x="470" y="489.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del autor.</tspan></text><text x="470" y="536.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
