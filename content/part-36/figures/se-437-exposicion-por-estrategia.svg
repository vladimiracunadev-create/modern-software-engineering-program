<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 333" width="930" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Migrar 40 rutas con 100 000 peticiones diarias y 10 % de rutas con regresión (2 000 historias)</title><desc id="d">Tabla con tres estrategias para migrar 40 rutas con 100 000 peticiones diarias y 10 por ciento de rutas con regresión: el corte único afecta 20 000 peticiones de mediana y 35 000 en el percentil 95 y tarda 4 semanas, el escalonado al 5 por ciento 1 000 y 1 750 en 20 semanas, y el escalonado con sombra previa 250 y 1 000 en 40 semanas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="333" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Estrategia</tspan></text><rect x="310" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Peticiones afectadas (mediana · p95)</tspan></text><rect x="640" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="712" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712" dy="0">Regresiones</tspan></text><rect x="790" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Semanas</tspan></text><rect x="10" y="56" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Corte único</tspan></text><rect x="310" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">20 000 · 35 000</tspan></text><rect x="640" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">4,0</tspan></text><rect x="790" y="56" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">4</tspan></text><rect x="10" y="110" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Escalonado al 5 %</tspan></text><rect x="310" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">1 000 · 1 750</tspan></text><rect x="640" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">4,0</tspan></text><rect x="790" y="110" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">20</tspan></text><rect x="10" y="164" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Escalonado con sombra previa</tspan></text><rect x="310" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">250 · 1 000</tspan></text><rect x="640" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">4,0</tspan></text><rect x="790" y="164" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">40</tspan></text><rect x="10" y="222" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">La regresión ocurre las mismas 4,0 veces; cambia cuántas peticiones alcanza. El escalonado reduce el daño 20 veces a</tspan></text><text x="465" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">cambio de 5 veces más duración. El 10 %, los dos días hasta decidir y el 60 % de eficacia de la sombra son supuestos del</tspan></text><text x="465" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">autor.</tspan></text><text x="465" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
