<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comparación en sombra: tamaño de muestra por tasa y frecuencia con que una ventana incluye un cierre</title><desc id="d">Tabla con el tamaño de muestra para detectar una diferencia en comparación en sombra, 299 peticiones para el uno por ciento, 2 995 para el 0,1 y 29 956 para el 0,01, y con la frecuencia con que una ventana de 1, 4, 8 o 12 semanas incluye una de las cuatro semanas de cierre del año: 7, 21, 31 y 43 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Pregunta</tspan></text><rect x="480" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">Resultado</tspan></text><rect x="10" y="56" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Detectar una diferencia del 1 % (95 %)</tspan></text><rect x="480" y="56" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">299 peticiones; 96 % de 400 corridas la ven</tspan></text><rect x="10" y="102" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Detectar el 0,1 %</tspan></text><rect x="480" y="102" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">2 995 peticiones; 94 %</tspan></text><rect x="10" y="148" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Detectar el 0,01 %</tspan></text><rect x="480" y="148" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">29 956 peticiones; 94 %</tspan></text><rect x="10" y="194" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Ventana de 1 semana incluye un cierre</tspan></text><rect x="480" y="194" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">7 % de los inicios posibles</tspan></text><rect x="10" y="240" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Ventana de 4 semanas</tspan></text><rect x="480" y="240" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">21 %</tspan></text><rect x="10" y="286" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Ventana de 8 semanas</tspan></text><rect x="480" y="286" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">31 %</tspan></text><rect x="10" y="332" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="355.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Ventana de 12 semanas</tspan></text><rect x="480" y="332" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">43 %</tspan></text><rect x="10" y="382" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="406.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El tamaño de muestra crece como 3 dividido por la tasa; pero una clase de tráfico que solo aparece en 4 de 52 semanas exige</tspan></text><text x="470" y="423.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">elegir la ventana por calendario. El calendario de cierres es un supuesto del autor.</tspan></text><text x="470" y="463.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
