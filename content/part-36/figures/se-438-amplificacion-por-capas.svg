<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres capas encadenadas con hasta tres intentos cada una: intentos que llegan a la base de datos por solicitud</title><desc id="d">Líneas con los intentos que llegan a la base de datos por solicitud del usuario según el porcentaje de fallo de la base: con la base caída, reintentar en las tres capas envía 27 intentos, solo el borde 3, el presupuesto del 10 por ciento 1,37 y sin reintentos 1; con fallos independientes del 10 por ciento todas las políticas con reintentos envían 1,11.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres capas encadenadas con hasta tres intentos cada una: intentos que llegan a la base de datos por</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">solicitud</tspan></text><circle cx="22" cy="70" r="6" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin reintentos</tspan></text><rect x="169.56" y="64" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="189.56" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Solo el borde</tspan></text><polygon points="321.58,63.1 328.18,75.4 314.98,75.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="335.58" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="335.58" dy="0">Las tres capas</tspan></text><polygon points="475.14,62.5 482.64,70 475.14,77.5 467.64,70" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="489.14" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="489.14" dy="0">Presupuesto del 10 %</tspan></text><line x1="71.08" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="406" x2="71.08" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="410.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">1</tspan></text><line x1="71.08" y1="309.098" x2="910" y2="309.098" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="309.098" x2="71.08" y2="309.098" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="313.598" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">3</tspan></text><line x1="71.08" y1="202.902" x2="910" y2="202.902" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="202.902" x2="71.08" y2="202.902" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="207.402" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="106" x2="71.08" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="106" x2="71.08" y2="406" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="106" x2="89.08" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="406" x2="89.08" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">0</tspan></text><line x1="160.769" y1="106" x2="160.769" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="160.769" y1="406" x2="160.769" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="160.769" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160.769" dy="0">10</tspan></text><line x1="447.526" y1="106" x2="447.526" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="447.526" y1="406" x2="447.526" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="447.526" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447.526" dy="0">50</tspan></text><line x1="805.973" y1="106" x2="805.973" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="805.973" y1="406" x2="805.973" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="805.973" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805.973" dy="0">100 (caída)</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0"></tspan></text><line x1="71.08" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Intentos a la base por solicitud (escala logarítmica)</text><text x="490.54" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Fallo de la base de datos (%)</tspan></text><polyline points="89.08,406 160.769,406 447.526,406 805.973,406" fill="none" stroke="#6b7c86" stroke-width="2.4"/><circle cx="89.08" cy="406" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><circle cx="160.769" cy="406" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><circle cx="447.526" cy="406" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><circle cx="805.973" cy="406" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="815.973" y="410.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="815.973" dy="0">1</tspan></text><polyline points="89.08,406 160.769,396.795 447.526,356.64 805.973,309.098" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="400.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="155.269" y="391.295" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="442.026" y="351.14" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="800.473" y="303.598" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="815.973" y="313.598" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="815.973" dy="0">3</tspan></text><polyline points="89.08,406 160.769,396.795 447.526,344.422 805.973,115.293" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="89.08,399.675 95.13,410.95 83.03,410.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="160.769,390.47 166.819,401.745 154.719,401.745" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="447.526,338.097 453.576,349.372 441.476,349.372" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="805.973,108.968 812.023,120.243 799.923,120.243" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="815.973" y="119.793" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="815.973" dy="0">27</tspan></text><polyline points="89.08,406 160.769,396.795 447.526,378.232 805.973,378.232" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="89.08,399.125 95.955,406 89.08,412.875 82.205,406" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="160.769,389.92 167.644,396.795 160.769,403.67 153.894,396.795" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="447.526,371.357 454.401,378.232 447.526,385.107 440.651,378.232" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="805.973,371.357 812.848,378.232 805.973,385.107 799.098,378.232" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="815.973" y="382.732" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="815.973" dy="0">1,37</tspan></text><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los reintentos son un buen remedio para fallos independientes y transitorios (10 %: de 90 % a 100 % de éxito con 1,11</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">intentos) y una trampa cuando la base está caída: la amplificación es 3 × 3 × 3. Con un 50 % de fallos las tres capas</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">llegan al 100 % de éxito con 2,01 intentos y el presupuesto del 10 % queda en 69 %: limita el daño y lo paga con éxito.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
