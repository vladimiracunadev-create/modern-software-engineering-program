<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 371" width="940" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro operaciones que siguen ejecutándose con otro resultado, medidas en CPython</title><desc id="d">Tabla con cuatro operaciones del módulo medidas en CPython: redondear a un decimal cambia el resultado en 50 de 1 000 centésimas, ordenar 2 000 nombres por punto de código frente a plegado de acentos difiere en 1 828 posiciones, truncar a 6 bytes en UTF-8 parte 114 de 1 000 nombres y dividir 7n entre 2 con una barra frente a dos difiere en 500 de 1 000 casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="371" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Operación</tspan></text><rect x="460" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Datos</tspan></text><rect x="650" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Resultados distintos</tspan></text><rect x="10" y="56" width="444" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Redondear a un decimal: regla antigua frente a round</tspan></text><rect x="460" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">1 000 centésimas</tspan></text><rect x="650" y="56" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">50 (5,0 %)</tspan></text><rect x="10" y="110" width="444" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Ordenar: punto de código frente a plegado de acentos</tspan></text><rect x="460" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">2 000 nombres</tspan></text><rect x="650" y="110" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1 828 posiciones (91,4 %)</tspan></text><rect x="10" y="164" width="444" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Truncar a 6 bytes en UTF-8</tspan></text><rect x="460" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">1 000 nombres</tspan></text><rect x="650" y="164" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">114 con un carácter partido</tspan></text><rect x="10" y="218" width="444" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">7n/2 frente a 7n//2</tspan></text><rect x="460" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">n de 1 a 1 000</tspan></text><rect x="650" y="218" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">500 (los impares)</tspan></text><rect x="10" y="276" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ninguna lanza una excepción. Los datos son sintéticos y las frecuencias reales serán otras; las sondas ilustran el tipo de</tspan></text><text x="470" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cambio y no son una lista completa de las diferencias de ninguna versión.</tspan></text><text x="470" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); los tiempos de reloj cambian de equipo en equipo.</tspan></text></svg>
