<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 568" width="940" height="568" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Timeout por intento y un reintento: la carga inútil frente a la cola de latencia (97 % de peticiones de ~80 ms)</title><desc id="d">Línea con el trabajo inútil por trabajo útil según el percentil 99 de la latencia, con cada punto rotulado por su timeout: con 100 milisegundos el p99 es 200 y el servidor hace 3,96 veces más trabajo inútil que útil; con 1 segundo, 1 088 y 1,67; con 10 segundos el p99 llega a 3 976 y el cociente baja a 0,46.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="568" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Timeout por intento y un reintento: la carga inútil frente a la cola de latencia (97 % de peticiones de ~80</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">ms)</tspan></text><line x1="63.54" y1="368" x2="910" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="368" x2="63.54" y2="368" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="372.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="295.5" x2="910" y2="295.5" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="295.5" x2="63.54" y2="295.5" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="300" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="223" x2="910" y2="223" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="223" x2="63.54" y2="223" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="227.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="150.5" x2="910" y2="150.5" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="150.5" x2="63.54" y2="150.5" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="78" x2="910" y2="78" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="78" x2="63.54" y2="78" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="82.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="78" x2="63.54" y2="368" stroke="#5b7280" stroke-width="1.6"/><line x1="81.54" y1="78" x2="81.54" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="81.54" y1="368" x2="81.54" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="81.54" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81.54" dy="0">200</tspan></text><line x1="329.432" y1="78" x2="329.432" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="329.432" y1="368" x2="329.432" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="329.432" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="329.432" dy="0">500</tspan></text><line x1="516.954" y1="78" x2="516.954" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="516.954" y1="368" x2="516.954" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="516.954" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="516.954" dy="0">1 000</tspan></text><line x1="704.477" y1="78" x2="704.477" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="704.477" y1="368" x2="704.477" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="704.477" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.477" dy="0">2 000</tspan></text><line x1="892" y1="78" x2="892" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="368" x2="892" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">4 000</tspan></text><line x1="63.54" y1="368" x2="910" y2="368" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="223" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 223)">Trabajo tras el abandono por trabajo útil</text><text x="486.77" y="414" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="486.77" dy="0">Latencia p99 (ms) (escala logarítmica)</tspan></text><polyline points="81.54,80.9 200.105,231.7 376.038,239.675 539.772,246.925 819.528,283.175 890.372,334.65" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="81.54" cy="80.9" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="81.54" y="69.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="81.54" dy="0">100 ms</tspan></text><circle cx="200.105" cy="231.7" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="200.105" y="220.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="200.105" dy="0">200 ms</tspan></text><circle cx="376.038" cy="239.675" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="376.038" y="228.675" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="376.038" dy="0">500 ms</tspan></text><circle cx="539.772" cy="246.925" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="539.772" y="235.925" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="539.772" dy="0">1 s</tspan></text><circle cx="819.528" cy="283.175" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="819.528" y="272.175" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="819.528" dy="0">3 s</tspan></text><circle cx="890.372" cy="334.65" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="890.372" y="323.65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="890.372" dy="0">10 s</tspan></text><rect x="10" y="428" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">No existe un timeout correcto en abstracto: uno demasiado corto crea carga (3,96) y uno demasiado largo retiene recursos y</tspan></text><text x="470" y="469.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">alarga la cola (p99 de 3 976 ms). El éxito con un reintento sube de 90,36 % con 100 ms a 99,83 % con 200 ms y 100 % con 10</tspan></text><text x="470" y="486.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">s. El cociente baja con timeouts largos porque lo inútil se limita a 30 s en el modelo. Un plazo para varias llamadas en</tspan></text><text x="470" y="502.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">serie debe repartirse: tres de 1 s con un reintento suman hasta 6 s.</tspan></text><text x="470" y="550.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
