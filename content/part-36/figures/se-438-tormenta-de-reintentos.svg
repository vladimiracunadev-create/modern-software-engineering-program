<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 412" width="940" height="412" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Trabajo del servidor hecho para clientes que ya se fueron, tras un brownout de 10 s y tras una oleada de 400 clientes</title><desc id="d">Mapa de calor con el porcentaje de trabajo inútil por política: en el brownout sube de 15 por ciento sin reintentos a 94 con reintento inmediato, exponencial o jitter completo, y un presupuesto del 10 por ciento lo deja en 19; en la oleada sincronizada va de 0 a 2, 1 y 67 por ciento con jitter; las celdas con borde son las que colapsan en las diez semillas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="412" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Trabajo del servidor hecho para clientes que ya se fueron, tras un brownout de 10 s y tras una oleada de 400</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">clientes</tspan></text><text x="266.6" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="266.6" dy="0">Sin reintentos</tspan></text><text x="411.8" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.8" dy="0">Reintento</tspan></text><text x="411.8" y="96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.8" dy="0">inmediato</tspan></text><text x="557" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="557" dy="0">Retardo</tspan></text><text x="557" y="96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="557" dy="0">exponencial</tspan></text><text x="702.2" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.2" dy="0">Exponencial con</tspan></text><text x="702.2" y="96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.2" dy="0">jitter completo</tspan></text><text x="847.4" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="847.4" dy="0">Jitter y</tspan></text><text x="847.4" y="96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="847.4" dy="0">presupuesto del 10</tspan></text><text x="847.4" y="113" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="847.4" dy="0">%</tspan></text><text x="184" y="151.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Brownout de 10 s</tspan></text><text x="184" y="195.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Oleada de 400 clientes</tspan></text><rect x="195.5" y="126.5" width="142.2" height="41" rx="4" fill="#f2ccc4" stroke="#ffffff" stroke-width="1"/><text x="266.6" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="266.6" dy="0">15 %</tspan></text><rect x="340.7" y="126.5" width="142.2" height="41" rx="4" fill="#c44d3a" stroke="#102a43" stroke-width="3"/><text x="411.8" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="411.8" dy="0">94 %</tspan></text><rect x="485.9" y="126.5" width="142.2" height="41" rx="4" fill="#c44d3a" stroke="#102a43" stroke-width="3"/><text x="557" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">94 %</tspan></text><rect x="631.1" y="126.5" width="142.2" height="41" rx="4" fill="#c44d3a" stroke="#102a43" stroke-width="3"/><text x="702.2" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702.2" dy="0">94 %</tspan></text><rect x="776.3" y="126.5" width="142.2" height="41" rx="4" fill="#f0c5bd" stroke="#ffffff" stroke-width="1"/><text x="847.4" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="847.4" dy="0">19 %</tspan></text><rect x="195.5" y="170.5" width="142.2" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="266.6" y="195.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="266.6" dy="0">0 %</tspan></text><rect x="340.7" y="170.5" width="142.2" height="41" rx="4" fill="#fae1da" stroke="#ffffff" stroke-width="1"/><text x="411.8" y="195.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.8" dy="0">2 %</tspan></text><rect x="485.9" y="170.5" width="142.2" height="41" rx="4" fill="#fae2dc" stroke="#ffffff" stroke-width="1"/><text x="557" y="195.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="557" dy="0">1 %</tspan></text><rect x="631.1" y="170.5" width="142.2" height="41" rx="4" fill="#d37869" stroke="#102a43" stroke-width="3"/><text x="702.2" y="195.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.2" dy="0">67 %</tspan></text><rect x="776.3" y="170.5" width="142.2" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="847.4" y="195.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="847.4" dy="0">—</tspan></text><text x="194" y="239" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="194" dy="0">0 %</tspan></text><rect x="224.62" y="227" width="30.5" height="14" fill="#fbe4de"/><rect x="254.62" y="227" width="30.5" height="14" fill="#f3cdc5"/><rect x="284.62" y="227" width="30.5" height="14" fill="#eab6ac"/><rect x="314.62" y="227" width="30.5" height="14" fill="#e29f93"/><rect x="344.62" y="227" width="30.5" height="14" fill="#d9887a"/><rect x="374.62" y="227" width="30.5" height="14" fill="#d17161"/><rect x="404.62" y="227" width="30.5" height="14" fill="#c85a48"/><rect x="434.62" y="227" width="30.5" height="14" fill="#c0432f"/><text x="472.62" y="239" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="472.62" dy="0">100 %</tspan></text><text x="518.32" y="239" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="518.32" dy="0">más oscuro = mayor (% del trabajo del servidor que es inútil)</tspan></text><rect x="10" y="255" width="920" height="109.2" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tres políticas de espera distintas dan el mismo colapso en el brownout (10 de 10 semillas, pico de 70 a unos 234 req/s,</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">3,38 intentos por solicitud) porque el problema es la cantidad de trabajo, no su sincronización; lo evita el presupuesto.</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">En la oleada el jitter aplana el pico de 332 a 143 reintentos por 100 ms pero reparte los reintentos de modo que muchos</tspan></text><text x="470" y="329.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">terminan justo después del timeout. Es un resultado de este modelo (el servidor solo descarta tras 1 s de espera), no una</tspan></text><text x="470" y="346.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">regla general.</tspan></text><text x="470" y="394.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
