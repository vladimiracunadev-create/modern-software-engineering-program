<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 586" width="940" height="586" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una dependencia que se cuelga 60 s a 100 req/s: llamadas que llegan a ella y solicitudes rechazadas según el interruptor</title><desc id="d">Barras agrupadas en escala logarítmica con las llamadas a la dependencia caída y las solicitudes rechazadas por pool agotado: sin interruptor 4 430 y 1 637; con un interruptor de cinco fallos seguidos o del 50 por ciento de 20 llamadas, entre 152 y 165 llamadas y 59 rechazos con cualquier tiempo de apertura.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="586" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una dependencia que se cuelga 60 s a 100 req/s: llamadas que llegan a ella y solicitudes rechazadas según el</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">interruptor</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Llamadas a la dependencia</tspan></text><rect x="252.5" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="272.5" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Rechazadas por pool agotado</tspan></text><line x1="101.24" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="394" x2="101.24" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="300.667" x2="920" y2="300.667" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="300.667" x2="101.24" y2="300.667" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="305.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="207.333" x2="920" y2="207.333" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="207.333" x2="101.24" y2="207.333" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="211.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="114" x2="101.24" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="114" x2="101.24" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">Solicitudes (escala logarítmica)</text><rect x="117.615" y="147.002" width="63.5008" height="246.998" rx="3" fill="#c0432f"/><text x="149.366" y="141.002" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149.366" dy="0">4 430</tspan></text><rect x="185.116" y="187.355" width="63.5008" height="206.645" rx="3" fill="#946512"/><text x="216.866" y="181.355" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="216.866" dy="0">1 637</tspan></text><text x="183.116" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.116" dy="0">Sin interruptor</tspan></text><rect x="281.367" y="280.368" width="63.5008" height="113.632" rx="3" fill="#c0432f"/><text x="313.118" y="274.368" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="313.118" dy="0">165</tspan></text><rect x="348.868" y="322.054" width="63.5008" height="71.9462" rx="3" fill="#946512"/><text x="380.618" y="316.054" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="380.618" dy="0">59</tspan></text><text x="346.868" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="346.868" dy="0">5 fallos seguidos,</tspan></text><text x="346.868" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="346.868" dy="0">abierto 2 s</tspan></text><rect x="445.119" y="282.902" width="63.5008" height="111.098" rx="3" fill="#c0432f"/><text x="476.87" y="276.902" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="476.87" dy="0">155</tspan></text><rect x="512.62" y="322.054" width="63.5008" height="71.9462" rx="3" fill="#946512"/><text x="544.37" y="316.054" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="544.37" dy="0">59</tspan></text><text x="510.62" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">5 fallos seguidos,</tspan></text><text x="510.62" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">abierto 10 s</tspan></text><rect x="608.871" y="283.695" width="63.5008" height="110.305" rx="3" fill="#c0432f"/><text x="640.622" y="277.695" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="640.622" dy="0">152</tspan></text><rect x="676.372" y="322.054" width="63.5008" height="71.9462" rx="3" fill="#946512"/><text x="708.122" y="316.054" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="708.122" dy="0">59</tspan></text><text x="674.372" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="674.372" dy="0">5 fallos seguidos,</tspan></text><text x="674.372" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="674.372" dy="0">abierto 30 s</tspan></text><rect x="772.623" y="281.615" width="63.5008" height="112.385" rx="3" fill="#c0432f"/><text x="804.374" y="275.615" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="804.374" dy="0">160</tspan></text><rect x="840.124" y="322.054" width="63.5008" height="71.9462" rx="3" fill="#946512"/><text x="871.874" y="316.054" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="871.874" dy="0">59</tspan></text><text x="838.124" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="838.124" dy="0">50 % de 20 llamadas,</tspan></text><text x="838.124" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="838.124" dy="0">abierto 10 s</tspan></text><rect x="10" y="463" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="487.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Abrir cuesta 59 rechazos igualmente: detectar cinco fallos de 2 s lleva 2 s y en ese tiempo entran 200 solicitudes a un</tspan></text><text x="470" y="504.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pool de 150. El p99 del usuario baja de 2 000 a 50 ms. Abierto más tiempo protege más y tarda más en volver: la</tspan></text><text x="470" y="521.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">recuperación media va de 2,2 s con 2 s de apertura a 11,6 s con 30 s (máximo 31,8 s).</tspan></text><text x="470" y="568.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
