<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 317" width="950" height="317" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ciclos y filas leídas hasta detectar divergencias entre 100 000 filas (media de 300 corridas)</title><desc id="d">Tabla con ciclos y filas leídas hasta detectar divergencias entre 100 000 filas: con una divergencia el muestreo del 1 por ciento tarda 108,5 ciclos y lee 108 490 filas, el del 10 por ciento 10,5 ciclos y 105 400 filas, y las sumas por rangos un ciclo y 1 100 filas; con cien divergencias el muestreo del 1 por ciento lee 1 583 filas y las sumas por rangos 63 483.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="317" fill="#ffffff"/><rect x="10" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="87" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="87" dy="0">Divergentes</tspan></text><rect x="170" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="297" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="297" dy="0">Muestra del 1 %</tspan></text><rect x="430" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Muestra del 10 %</tspan></text><rect x="690" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Sumas por rangos</tspan></text><rect x="10" y="56" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">1</tspan></text><rect x="170" y="56" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">108,5 ciclos · 108 490</tspan></text><rect x="430" y="56" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">10,5 ciclos · 105 400</tspan></text><rect x="690" y="56" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">1,0 ciclo · 1 100</tspan></text><rect x="10" y="110" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">10</tspan></text><rect x="170" y="110" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">10,9 ciclos · 10 947</tspan></text><rect x="430" y="110" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">1,5 ciclos · 14 867</tspan></text><rect x="690" y="110" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">1,0 ciclo · 9 667</tspan></text><rect x="10" y="164" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">100</tspan></text><rect x="170" y="164" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">1,6 ciclos · 1 583</tspan></text><rect x="430" y="164" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">1,0 ciclo · 10 000</tspan></text><rect x="690" y="164" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">1,0 ciclo · 63 483</tspan></text><rect x="10" y="222" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Con una divergencia las sumas por rangos ganan; con cien, el muestreo del 1 % lee menos. Las divergencias se reparten al</tspan></text><text x="475" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">azar y de forma uniforme, cosa que rara vez ocurre: suelen agruparse.</tspan></text><text x="475" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
