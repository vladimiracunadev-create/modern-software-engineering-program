<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 317" width="940" height="317" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Claves distintas entre dos almacenes tras 100 000 escrituras sobre 20 000 claves, según la tasa de fallo del segundo</title><desc id="d">Tabla con las claves distintas entre dos almacenes tras 100 000 escrituras sobre 20 000 claves: el mejor esfuerzo deja 110, 292 y 1 069 con fallos del 0,1, 1 y 5 por ciento, tres intentos dejan 88, 84 y 76 por el desorden de las escrituras y una bandeja de salida con número de secuencia deja 0 en los tres casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="317" fill="#ffffff"/><rect x="10" y="12" width="384" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="202" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="202" dy="0">Estrategia</tspan></text><rect x="400" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">p = 0,1 %</tspan></text><rect x="570" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">p = 1 %</tspan></text><rect x="740" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">p = 5 %</tspan></text><rect x="10" y="56" width="384" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="202" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="202" dy="0">Mejor esfuerzo (sin reintento)</tspan></text><rect x="400" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">110</tspan></text><rect x="570" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">292</tspan></text><rect x="740" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">1 069</tspan></text><rect x="10" y="110" width="384" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="202" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="202" dy="0">Hasta tres intentos</tspan></text><rect x="400" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">88</tspan></text><rect x="570" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">84</tspan></text><rect x="740" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">76</tspan></text><rect x="10" y="164" width="384" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="202" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="202" dy="0">Bandeja de salida con secuencia</tspan></text><rect x="400" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">0</tspan></text><rect x="570" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">0</tspan></text><rect x="740" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0</tspan></text><rect x="10" y="222" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los reintentos arreglan los fallos pero no el desorden (0,5 % de escrituras cruzadas); la bandeja con número de secuencia</tspan></text><text x="470" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">arregla ambos. Las tasas y el desorden son supuestos del autor y la bandeja reintenta sin límite.</tspan></text><text x="470" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
