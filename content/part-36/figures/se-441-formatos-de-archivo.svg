<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 329" width="940" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">100 000 filas archivadas en tres formatos y leídas de vuelta</title><desc id="d">Tabla con tres formatos para archivar 100 000 filas: CSV pesa 2,68 megabytes y ninguna fila vuelve idéntica porque cambian los tipos, 10 080 códigos pierden ceros y 19 851 textos vacíos se vuelven nulos; líneas JSON pesa 3,42 y SQLite 3,31, y en ambos todas las filas vuelven idénticas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="329" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Formato</tspan></text><rect x="310" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Tamaño</tspan></text><rect x="460" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Filas que no vuelven idénticas</tspan></text><rect x="10" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">CSV (tipos inferidos al leer)</tspan></text><rect x="310" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">2,68 MB</tspan></text><rect x="460" y="56" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">100 000 (10 080 pierden ceros; 19 851 vacíos pasan a nulos)</tspan></text><rect x="10" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Líneas JSON</tspan></text><rect x="310" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">3,42 MB</tspan></text><rect x="460" y="114" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">0</tspan></text><rect x="10" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">SQLite</tspan></text><rect x="310" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">3,31 MB</tspan></text><rect x="460" y="172" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">0</tspan></text><rect x="10" y="234" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El CSV solo guarda texto: sin un esquema que declare los tipos, los pierde. Un bit cambiado en un dígito del JSON deja un</tspan></text><text x="470" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">archivo válido que el lector acepta; solo la suma SHA-256 lo delata. Los datos son sintéticos.</tspan></text><text x="470" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
