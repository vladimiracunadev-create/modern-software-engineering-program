<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 555" width="940" height="555" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contraste WCAG medido con la fórmula de luminancia sobre los colores del propio repositorio</title><desc id="d">Barras horizontales con la razón de contraste de siete combinaciones frente a los umbrales de 3 a 1 para componentes gráficos y de 4,5 a 1 para texto: el texto de las figuras (9,91 como mínimo), el pie, el texto atenuado y los enlaces cumplen; el borde dorado, 3,98, cumple 3; la etiqueta superior del portal, 3,51, y el borde gris, 2,90, no cumplen su umbral.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="555" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Contraste WCAG medido con la fórmula de luminancia sobre los colores del propio repositorio</tspan></text><line x1="354" y1="49" x2="354" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="357" x2="354" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="458.34" y1="49" x2="458.34" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="458.34" y1="357" x2="458.34" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="458.34" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.34" dy="0">3</tspan></text><line x1="510.51" y1="49" x2="510.51" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="510.51" y1="357" x2="510.51" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="510.51" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.51" dy="0">4,5</tspan></text><line x1="562.68" y1="49" x2="562.68" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="562.68" y1="357" x2="562.68" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="562.68" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.68" dy="0">6</tspan></text><line x1="667.02" y1="49" x2="667.02" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="667.02" y1="357" x2="667.02" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="667.02" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.02" dy="0">9</tspan></text><line x1="771.36" y1="49" x2="771.36" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="771.36" y1="357" x2="771.36" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="771.36" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.36" dy="0">12</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="357" x2="875.7" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">15</tspan></text><line x1="354" y1="357" x2="875.7" y2="357" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Borde gris de las figuras (gráfico) sobre</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">blanco</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Etiqueta superior del portal (texto): coral</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">sobre el papel</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Borde dorado de las figuras (gráfico) sobre</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">blanco</tspan></text><text x="344" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Texto atenuado del portal sobre el papel</tspan></text><text x="344" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Enlaces del portal sobre el papel</tspan></text><text x="344" y="287" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Texto de figura sobre su relleno (el peor de</tspan></text><text x="344" y="304" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">seis tipos)</tspan></text><text x="344" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Pie de las figuras sobre blanco</tspan></text><rect x="354" y="55" width="100.862" height="32" rx="3" fill="#102a43"/><text x="461.862" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="461.862" dy="0">2,90</tspan></text><rect x="354" y="99" width="122.078" height="32" rx="3" fill="#102a43"/><text x="483.078" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="483.078" dy="0">3,51</tspan></text><rect x="354" y="143" width="138.424" height="32" rx="3" fill="#102a43"/><text x="499.424" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="499.424" dy="0">3,98</tspan></text><rect x="354" y="187" width="182.247" height="32" rx="3" fill="#102a43"/><text x="543.247" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="543.247" dy="0">5,24</tspan></text><rect x="354" y="231" width="194.768" height="32" rx="3" fill="#102a43"/><text x="555.768" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="555.768" dy="0">5,60</tspan></text><rect x="354" y="275" width="344.67" height="32" rx="3" fill="#102a43"/><text x="705.67" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="705.67" dy="0">9,91</tspan></text><rect x="354" y="319" width="439.619" height="32" rx="3" fill="#102a43"/><text x="800.619" y="339.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="800.619" dy="0">12,64</tspan></text><line x1="458.34" y1="49" x2="458.34" y2="357" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="463.34" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="463.34" dy="0">3:1</tspan></text><line x1="510.51" y1="49" x2="510.51" y2="357" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="515.51" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="515.51" dy="0">4,5:1</tspan></text><text x="614.85" y="401" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Razón de contraste (a 1)</tspan></text><rect x="10" y="415" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="439.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Texto pequeño pide 4,5:1 y un componente gráfico 3:1. Los seis tipos de recuadro llegan hasta 16,12:1. La medida es exacta</tspan></text><text x="470" y="456.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y encuentra algo concreto: una etiqueta del portal por debajo del umbral. No prueba que la experiencia sea accesible:</tspan></text><text x="470" y="473.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ninguna fórmula de contraste ve el orden de lectura, el foco ni el texto alternativo. En las figuras el borde nunca es la</tspan></text><text x="470" y="489.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">única señal, porque cada recuadro lleva texto.</tspan></text><text x="470" y="537.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
