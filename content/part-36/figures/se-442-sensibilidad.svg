<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 585" width="940" height="585" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sensibilidad: diferencia de costo entre reescribir y evolucionar al mover un parámetro (positiva: reescribir cuesta más)</title><desc id="d">Puntos unidos con la diferencia de costo entre reescribir y evolucionar con el valor bajo y alto de cada parámetro: el costo de construir tiene el mayor recorrido, de +0,9 a +13,4, 12,5; el costo anual del sistema nuevo 4,3, la duración 4,2, la deriva del alcance 3,2, el abandono 2,4, el crecimiento tras evolucionar 1,6 y el del legado 1,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="585" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sensibilidad: diferencia de costo entre reescribir y evolucionar al mover un parámetro (positiva: reescribir</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">cuesta más)</tspan></text><circle cx="22" cy="70" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Valor bajo del parámetro</tspan></text><circle cx="250.96" cy="70" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="264.96" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Valor alto</tspan></text><line x1="374.24" y1="96" x2="374.24" y2="404" stroke="#d5dde1" stroke-width="1"/><line x1="374.24" y1="404" x2="374.24" y2="409" stroke="#5b7280" stroke-width="1.4"/><text x="374.24" y="425" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374.24" dy="0">0</tspan></text><line x1="495.8" y1="96" x2="495.8" y2="404" stroke="#d5dde1" stroke-width="1"/><line x1="495.8" y1="404" x2="495.8" y2="409" stroke="#5b7280" stroke-width="1.4"/><text x="495.8" y="425" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.8" dy="0">5</tspan></text><line x1="617.36" y1="96" x2="617.36" y2="404" stroke="#d5dde1" stroke-width="1"/><line x1="617.36" y1="404" x2="617.36" y2="409" stroke="#5b7280" stroke-width="1.4"/><text x="617.36" y="425" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617.36" dy="0">10</tspan></text><line x1="738.92" y1="96" x2="738.92" y2="404" stroke="#d5dde1" stroke-width="1"/><line x1="738.92" y1="404" x2="738.92" y2="409" stroke="#5b7280" stroke-width="1.4"/><text x="738.92" y="425" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="738.92" dy="0">15</tspan></text><line x1="374.24" y1="404" x2="738.92" y2="404" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="122.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Costo de construir (3,0 → 12,0)</tspan></text><text x="314" y="166.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Costo anual del sistema nuevo (0,4 → 0,9)</tspan></text><text x="314" y="210.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Duración en años (1,5 → 4,0)</tspan></text><text x="314" y="254.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Deriva del alcance por año (0,05 → 0,25)</tspan></text><text x="314" y="298.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Probabilidad de abandono (0 → 0,4)</tspan></text><text x="314" y="342.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Crecimiento tras evolucionar (0,1 → 0,6)</tspan></text><text x="314" y="378" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Crecimiento del costo del legado (3 % →</tspan></text><text x="314" y="395" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">15 %)</tspan></text><line x1="396.121" y1="118" x2="700.021" y2="118" stroke="#c0432f" stroke-width="4"/><circle cx="396.121" cy="118" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="700.021" cy="118" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="384.121" y="122.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="384.121" dy="0">0,9</tspan></text><text x="712.021" y="122.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="712.021" dy="0">13,4</tspan></text><text x="926" y="122.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">recorrido 12,5</tspan></text><line x1="452.038" y1="162" x2="556.58" y2="162" stroke="#c0432f" stroke-width="4"/><circle cx="452.038" cy="162" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="556.58" cy="162" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="440.038" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="440.038" dy="0">3,2</tspan></text><text x="568.58" y="166.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="568.58" dy="0">7,5</tspan></text><text x="926" y="166.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">recorrido 4,3</tspan></text><line x1="466.626" y1="206" x2="568.736" y2="206" stroke="#c0432f" stroke-width="4"/><circle cx="466.626" cy="206" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="568.736" cy="206" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="454.626" y="210.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="454.626" dy="0">3,8</tspan></text><text x="580.736" y="210.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="580.736" dy="0">8,0</tspan></text><text x="926" y="210.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">recorrido 4,2</tspan></text><line x1="471.488" y1="250" x2="549.286" y2="250" stroke="#c0432f" stroke-width="4"/><circle cx="471.488" cy="250" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="549.286" cy="250" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="459.488" y="254.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="459.488" dy="0">4,0</tspan></text><text x="561.286" y="254.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="561.286" dy="0">7,2</tspan></text><text x="926" y="254.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">recorrido 3,2</tspan></text><line x1="481.213" y1="294" x2="541.993" y2="294" stroke="#c0432f" stroke-width="4"/><circle cx="481.213" cy="294" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="541.993" cy="294" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="469.213" y="298.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="469.213" dy="0">4,4</tspan></text><text x="553.993" y="298.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="553.993" dy="0">6,9</tspan></text><text x="926" y="298.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">recorrido 2,4</tspan></text><line x1="524.974" y1="338" x2="486.075" y2="338" stroke="#087f8c" stroke-width="4"/><circle cx="524.974" cy="338" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="486.075" cy="338" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="536.974" y="342.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="536.974" dy="0">6,2</tspan></text><text x="474.075" y="342.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="474.075" dy="0">4,6</tspan></text><text x="926" y="342.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">recorrido 1,6</tspan></text><line x1="517.681" y1="382" x2="493.369" y2="382" stroke="#087f8c" stroke-width="4"/><circle cx="517.681" cy="382" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="493.369" cy="382" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="529.681" y="386.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="529.681" dy="0">5,9</tspan></text><text x="481.369" y="386.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="481.369" dy="0">4,9</tspan></text><text x="926" y="386.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">recorrido 1,0</tspan></text><text x="556.58" y="448" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="556.58" dy="0">Reescribir − evolucionar (unidades de costo)</tspan></text><rect x="10" y="462" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="486.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El costo de construir domina; el crecimiento del costo del legado, el argumento más citado, es el de menor efecto. Con el</tspan></text><text x="470" y="503.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">valor bajo reescribir gana en el 37 % de los escenarios en el costo de construir y con el alto en 0 %. El análisis mueve un</tspan></text><text x="470" y="520.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">parámetro cada vez y no capta interacciones.</tspan></text><text x="470" y="567.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
