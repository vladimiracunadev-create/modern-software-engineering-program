<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos construcciones del mismo código con fechas de modificación distintas: ¿mismo artefacto?</title><desc id="d">Tabla con cinco configuraciones de construcción del mismo código fuente con fechas de modificación distintas: el bytecode por marca de tiempo da artefactos distintos, por hash comprobado idénticos; el archivo comprimido con fechas del archivo da distintos, con fechas fijas idénticos y con fechas fijas y nombres ordenados idénticos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><rect x="10" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Artefacto</tspan></text><rect x="240" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Configuración</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Resultado</tspan></text><rect x="10" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Bytecode</tspan></text><rect x="240" y="56" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Invalidación por marca de tiempo</tspan></text><rect x="710" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Distintas</tspan></text><rect x="10" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Bytecode</tspan></text><rect x="240" y="106" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Invalidación por hash comprobado</tspan></text><rect x="710" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Idénticas</tspan></text><rect x="10" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Archivo comprimido</tspan></text><rect x="240" y="156" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Fechas de los archivos, orden del sistema</tspan></text><rect x="710" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Distintas</tspan></text><rect x="10" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Archivo comprimido</tspan></text><rect x="240" y="206" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Fechas fijas, orden del sistema</tspan></text><rect x="710" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Idénticas</tspan></text><rect x="10" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Archivo comprimido</tspan></text><rect x="240" y="256" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Fechas fijas, nombres ordenados</tspan></text><rect x="710" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Idénticas</tspan></text><rect x="10" y="310" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Fijar las fechas y el modo de invalidación basta aquí. Que el orden del sistema fuera estable en estas dos máquinas no está</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">garantizado en general. Son treinta módulos de dos líneas: el experimento muestra el mecanismo, no la reproducibilidad de</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una cadena real.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
