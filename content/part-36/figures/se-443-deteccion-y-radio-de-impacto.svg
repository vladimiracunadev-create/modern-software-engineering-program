<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Error inyectado frente a fracción del tráfico afectado: probabilidad de detección (60 s a 40 req/s)</title><desc id="d">Mapa de calor con la probabilidad de detectar el fallo según el error inyectado y la fracción del tráfico afectada: un error del 20 por ciento se detecta el 97 por ciento de las veces con el 1 por ciento del tráfico; uno del 5 por ciento, el 33; uno del 2 por ciento solo el 9, y solo llega a 100 por ciento exponiendo todo el tráfico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Error inyectado frente a fracción del tráfico afectado: probabilidad de detección (60 s a 40 req/s)</tspan></text><text x="302.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="302.25" dy="0">1 % del tráfico</tspan></text><text x="478.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="478.75" dy="0">5 %</tspan></text><text x="655.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="655.25" dy="0">10 %</tspan></text><text x="831.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="831.75" dy="0">100 %</tspan></text><text x="204" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Error inyectado del 2 %</tspan></text><text x="204" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Error inyectado del 5 %</tspan></text><text x="204" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Error inyectado del 20 %</tspan></text><rect x="215.5" y="73.5" width="173.5" height="41" rx="4" fill="#cce7e5" stroke="#ffffff" stroke-width="1"/><text x="302.25" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="302.25" dy="0">9 %</tspan></text><rect x="392" y="73.5" width="173.5" height="41" rx="4" fill="#83c0c4" stroke="#ffffff" stroke-width="1"/><text x="478.75" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="478.75" dy="0">43 %</tspan></text><rect x="568.5" y="73.5" width="173.5" height="41" rx="4" fill="#48a1a9" stroke="#ffffff" stroke-width="1"/><text x="655.25" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="655.25" dy="0">70 %</tspan></text><rect x="745" y="73.5" width="173.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="831.75" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="831.75" dy="0">100 %</tspan></text><rect x="215.5" y="117.5" width="173.5" height="41" rx="4" fill="#98cbce" stroke="#ffffff" stroke-width="1"/><text x="302.25" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="302.25" dy="0">33 %</tspan></text><rect x="392" y="117.5" width="173.5" height="41" rx="4" fill="#158692" stroke="#ffffff" stroke-width="1"/><text x="478.75" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="478.75" dy="0">94 %</tspan></text><rect x="568.5" y="117.5" width="173.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="655.25" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="655.25" dy="0">100 %</tspan></text><rect x="745" y="117.5" width="173.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="831.75" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="831.75" dy="0">100 %</tspan></text><rect x="215.5" y="161.5" width="173.5" height="41" rx="4" fill="#0e828f" stroke="#ffffff" stroke-width="1"/><text x="302.25" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="302.25" dy="0">97 %</tspan></text><rect x="392" y="161.5" width="173.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="478.75" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="478.75" dy="0">100 %</tspan></text><rect x="568.5" y="161.5" width="173.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="655.25" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="655.25" dy="0">100 %</tspan></text><rect x="745" y="161.5" width="173.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="831.75" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="831.75" dy="0">100 %</tspan></text><text x="214" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="214" dy="0">0 %</tspan></text><rect x="244.62" y="218" width="30.5" height="14" fill="#dff1ee"/><rect x="274.62" y="218" width="30.5" height="14" fill="#c0e1e0"/><rect x="304.62" y="218" width="30.5" height="14" fill="#a2d0d2"/><rect x="334.62" y="218" width="30.5" height="14" fill="#83c0c4"/><rect x="364.62" y="218" width="30.5" height="14" fill="#64b0b6"/><rect x="394.62" y="218" width="30.5" height="14" fill="#45a0a8"/><rect x="424.62" y="218" width="30.5" height="14" fill="#278f9a"/><rect x="454.62" y="218" width="30.5" height="14" fill="#087f8c"/><text x="492.62" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="492.62" dy="0">100 %</tspan></text><text x="538.32" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="538.32" dy="0">más oscuro = mayor (% de ejecuciones en que se detecta)</tspan></text><rect x="10" y="246" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un fallo fuerte se descubre con un radio de impacto mínimo (5 solicitudes erróneas esperadas con el error del 20 % al 1 %);</tspan></text><text x="470" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">un fallo sutil exige exponer más usuarios o ejecutar más tiempo (48 solicitudes erróneas con el error del 2 % al 100 %), y</tspan></text><text x="470" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">eso hay que decidirlo antes. Detección: cola binomial exacta con error base de 0,3 % y nivel 1 %, estimada con 2 000</tspan></text><text x="470" y="320.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">repeticiones por celda.</tspan></text><text x="470" y="368.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
