<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 385" width="940" height="385" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intervalo del 95 % de una tasa de cambios fallidos del 15 % según los cambios observados (3 000 periodos por fila)</title><desc id="d">Tabla con el semiancho del intervalo de confianza del 95 por ciento de una tasa de cambios fallidos del 15 por ciento según los cambios observados: 19,3 puntos con 10, 15,4 con 20, 9,6 con 50, 4,9 con 200 y 2,2 con 1 000; para distinguir 15 de 10 por ciento hacen falta unos 686 cambios.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="385" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Cambios observados</tspan></text><rect x="310" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Semiancho mediano</tspan></text><rect x="640" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Contiene la tasa real</tspan></text><rect x="10" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">10</tspan></text><rect x="310" y="56" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">±19,3 puntos</tspan></text><rect x="640" y="56" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">95 %</tspan></text><rect x="10" y="102" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">20</tspan></text><rect x="310" y="102" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">±15,4 puntos</tspan></text><rect x="640" y="102" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">98 %</tspan></text><rect x="10" y="148" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">50</tspan></text><rect x="310" y="148" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">±9,6 puntos</tspan></text><rect x="640" y="148" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">96 %</tspan></text><rect x="10" y="194" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">200</tspan></text><rect x="310" y="194" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">±4,9 puntos</tspan></text><rect x="640" y="194" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">95 %</tspan></text><rect x="10" y="240" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1 000</tspan></text><rect x="310" y="240" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">±2,2 puntos</tspan></text><rect x="640" y="240" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">95 %</tspan></text><rect x="10" y="290" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 20 cambios la tasa del 15 % queda entre el 0 % y el 30 %. Para distinguir 15 % de 10 % con potencia del 80 % hacen</tspan></text><text x="470" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">falta unos 686 cambios. Se supone independencia entre cambios, algo falso cuando hay rachas.</tspan></text><text x="470" y="371.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
