<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 454" width="940" height="454" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro fallos inyectados 30 s en una API con 6 trabajadores y una base de datos: errores de la configuración ingenua y de la endurecida</title><desc id="d">Puntos unidos con el porcentaje de errores de cada configuración: con 200 milisegundos extra en la base baja de 90,6 a 35,9 por ciento, con 20 por ciento de errores de la base de 19,7 a 0, con la base caída de 100 a 0 y con el tráfico multiplicado por cinco de 82,9 a 27,5; en la caída total responde degradada al 100 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="454" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro fallos inyectados 30 s en una API con 6 trabajadores y una base de datos: errores de la configuración</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">ingenua y de la endurecida</tspan></text><circle cx="22" cy="70" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Configuración ingenua</tspan></text><circle cx="228.34" cy="70" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="242.34" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Configuración endurecida</tspan></text><line x1="312.3" y1="96" x2="312.3" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="312.3" y1="256" x2="312.3" y2="261" stroke="#5b7280" stroke-width="1.4"/><text x="312.3" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312.3" dy="0">0</tspan></text><line x1="391.176" y1="96" x2="391.176" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="391.176" y1="256" x2="391.176" y2="261" stroke="#5b7280" stroke-width="1.4"/><text x="391.176" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="391.176" dy="0">20</tspan></text><line x1="470.052" y1="96" x2="470.052" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="470.052" y1="256" x2="470.052" y2="261" stroke="#5b7280" stroke-width="1.4"/><text x="470.052" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470.052" dy="0">40</tspan></text><line x1="548.928" y1="96" x2="548.928" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="548.928" y1="256" x2="548.928" y2="261" stroke="#5b7280" stroke-width="1.4"/><text x="548.928" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="548.928" dy="0">60</tspan></text><line x1="627.804" y1="96" x2="627.804" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="627.804" y1="256" x2="627.804" y2="261" stroke="#5b7280" stroke-width="1.4"/><text x="627.804" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627.804" dy="0">80</tspan></text><line x1="706.68" y1="96" x2="706.68" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="706.68" y1="256" x2="706.68" y2="261" stroke="#5b7280" stroke-width="1.4"/><text x="706.68" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="706.68" dy="0">100</tspan></text><line x1="312.3" y1="256" x2="706.68" y2="256" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">+200 ms en la base de datos</tspan></text><text x="244" y="160.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">20 % de errores de la base</tspan></text><text x="244" y="200.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Caída total de la base</tspan></text><text x="244" y="240.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Tráfico × 5</tspan></text><line x1="669.608" y1="116" x2="453.882" y2="116" stroke="#087f8c" stroke-width="4"/><circle cx="669.608" cy="116" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="453.882" cy="116" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="681.608" y="120.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="681.608" dy="0">90,6</tspan></text><text x="441.882" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="441.882" dy="0">35,9</tspan></text><text x="926" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0"></tspan></text><line x1="389.993" y1="156" x2="312.3" y2="156" stroke="#087f8c" stroke-width="4"/><circle cx="389.993" cy="156" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="312.3" cy="156" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="401.993" y="160.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="401.993" dy="0">19,7</tspan></text><text x="300.3" y="160.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300.3" dy="0">0,0</tspan></text><text x="926" y="160.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">19,7 % degradadas</tspan></text><line x1="706.68" y1="196" x2="312.3" y2="196" stroke="#087f8c" stroke-width="4"/><circle cx="706.68" cy="196" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="312.3" cy="196" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="718.68" y="200.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="718.68" dy="0">100,0</tspan></text><text x="300.3" y="200.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300.3" dy="0">0,0</tspan></text><text x="926" y="200.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">100 % degradadas</tspan></text><line x1="639.241" y1="236" x2="420.755" y2="236" stroke="#087f8c" stroke-width="4"/><circle cx="639.241" cy="236" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="420.755" cy="236" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="651.241" y="240.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="651.241" dy="0">82,9</tspan></text><text x="408.755" y="240.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="408.755" dy="0">27,5</tspan></text><text x="926" y="240.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0"></tspan></text><text x="509.49" y="300" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="509.49" dy="0">Solicitudes con error (%)</tspan></text><rect x="10" y="314" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="338.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Endurecer cambia el tipo de fallo: de errores a respuestas degradadas, que son una decisión de producto. No sustituye a la</tspan></text><text x="470" y="355.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">capacidad: con +200 ms o con ×5 siguen los errores (35,9 % y 27,5 %) porque el sistema necesita más trabajadores. Sin fallo</tspan></text><text x="470" y="372.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ambas dan 0,0 % de errores y p99 de 70 ms. El modelo (6 trabajadores, 40 req/s, base de 30 ms) es una construcción del</tspan></text><text x="470" y="388.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">autor.</tspan></text><text x="470" y="436.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
