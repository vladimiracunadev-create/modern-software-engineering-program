<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 562" width="940" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">5 000 commits por configuración: falsos rojos y defectos intermitentes (30 %) que salen verdes</title><desc id="d">Dispersión de cinco configuraciones de pruebas inestables y reintentos: con 20 inestables y sin reintentos el 64,3 por ciento de los commits sanos sale rojo y el 24,7 de los que tienen un defecto intermitente sale verde; con 20 y dos reintentos 26,5 y 58,2; con 5 y ninguno 23,2 y 53,8; con 5 y dos reintentos 1,4 y 90,3; sin inestables 0,0 y 70,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="562" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">5 000 commits por configuración: falsos rojos y defectos intermitentes (30 %) que salen verdes</tspan></text><line x1="78.62" y1="379" x2="910" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="379" x2="78.62" y2="379" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="383.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="299" x2="78.62" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="219" x2="910" y2="219" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="219" x2="78.62" y2="219" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="223.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="139" x2="910" y2="139" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="139" x2="78.62" y2="139" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="143.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="379" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="379" x2="96.62" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0</tspan></text><line x1="295.465" y1="59" x2="295.465" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="295.465" y1="379" x2="295.465" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="295.465" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295.465" dy="0">20</tspan></text><line x1="494.31" y1="59" x2="494.31" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="379" x2="494.31" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">40</tspan></text><line x1="693.155" y1="59" x2="693.155" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="693.155" y1="379" x2="693.155" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="693.155" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.155" dy="0">60</tspan></text><line x1="892" y1="59" x2="892" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="379" x2="892" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">80</tspan></text><line x1="78.62" y1="379" x2="910" y2="379" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="219" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 219)">Commits con defecto que salen verdes (%)</text><text x="494.31" y="425" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Commits sanos que salen rojos (%)</tspan></text><circle cx="735.907" cy="299.96" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="725.907" y="304.46" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="725.907" dy="0">20 · ninguno</tspan></text><circle cx="360.09" cy="192.76" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="370.09" y="197.26" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="370.09" dy="0">20 · dos reintentos</tspan></text><circle cx="327.28" cy="206.84" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="317.28" y="211.34" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="317.28" dy="0">5 · ninguno</tspan></text><circle cx="110.539" cy="90.04" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="120.539" y="94.54" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="120.539" dy="0">5 · dos reintentos</tspan></text><circle cx="96.62" cy="152.76" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="106.62" y="157.26" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="106.62" dy="0">0 · ninguno</tspan></text><rect x="10" y="439" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Reintentar reduce los falsos rojos y esconde defectos reales: con cinco inestables y dos reintentos el 90,3 % de los</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">commits con el defecto pasan. La salida es aislar y corregir las inestables. El 5 %, el 30 % y la independencia son</tspan></text><text x="470" y="497.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">supuestos del autor.</tspan></text><text x="470" y="544.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
