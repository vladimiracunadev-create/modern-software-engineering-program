0" stroke-width="1.6"/><text x="87" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">7</tspan></text><rect x="170" y="194" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">406</tspan></text><rect x="640" y="194" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">8,1 %</tspan></text><rect x="10" y="240" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">14</tspan></text><rect x="170" y="240" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">779</tspan></text><rect x="640" y="240" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">15,6 %</tspan></text><rect x="10" y="290" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Volver atrás pasa de no costar nada a afectar casi una de cada seis filas en dos semanas. Las escrituras uniformes sobre</tspan></text><text x="470" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">claves al azar son un supuesto del autor; en un sistema real se concentran en pocas filas y en fechas de cierre.</tspan></text><text x="470" y="371.28" font-size="12" text-