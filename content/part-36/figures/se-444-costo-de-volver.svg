 y="313.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="278.907" dy="0">177 (3,5 %)</tspan></text><circle cx="501.85" cy="256.2" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="501.85" y="245.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="501.85" dy="0">406 (8,1 %)</tspan></text><circle cx="892" cy="144.3" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="882" y="148.8" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">779 (15,6 %)</tspan></text><rect x="10" y="438" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="462.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Volver atrás pasa de no costar nada a afectar casi una de cada seis filas en dos semanas. Las escrituras uniformes sobre</tspan></text><text x="470" y="479.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">claves al azar son un supuesto del autor; en un sistema real se concentran en pocas filas y en fechas de cierre.</tspan></text><text x="470" y="527.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
