<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 545" width="940" height="545" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Filas que solo existen en el esquema nuevo según los días desde que se dejó de escribir en el antiguo (60 escrituras al día)</title><desc id="d">Línea con las filas que solo existen en el esquema nuevo según los días desde que se dejó de escribir en el antiguo, con 60 escrituras diarias sobre 5 000 filas: 0 con cero días, 58 con uno, 177 con tres, 406 con siete y 779 con catorce, el 15,6 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="545" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Filas que solo existen en el esquema nuevo según los días desde que se dejó de escribir en el antiguo (60</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">escrituras al día)</tspan></text><line x1="93.7" y1="378" x2="910" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="378" x2="93.7" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="382.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="318" x2="910" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="318" x2="93.7" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="322.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">200</tspan></text><line x1="93.7" y1="258" x2="910" y2="258" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="258" x2="93.7" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">400</tspan></text><line x1="93.7" y1="198" x2="910" y2="198" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="198" x2="93.7" y2="198" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="202.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">600</tspan></text><line x1="93.7" y1="138" x2="910" y2="138" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="138" x2="93.7" y2="138" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="142.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">800</tspan></text><line x1="93.7" y1="78" x2="910" y2="78" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="78" x2="93.7" y2="78" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="82.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="78" x2="93.7" y2="378" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="78" x2="111.7" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="378" x2="111.7" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">0</tspan></text><line x1="167.436" y1="78" x2="167.436" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="167.436" y1="378" x2="167.436" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="167.436" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="167.436" dy="0">1</tspan></text><line x1="278.907" y1="78" x2="278.907" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="278.907" y1="378" x2="278.907" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="2