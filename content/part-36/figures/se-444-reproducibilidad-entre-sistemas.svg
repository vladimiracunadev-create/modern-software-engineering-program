<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 389" width="940" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho artefactos del mismo canal: cuántos son idénticos (SHA-256) entre dos ejecuciones y entre Windows y Ubuntu</title><desc id="d">Barras apiladas horizontales con los ocho artefactos clasificados: entre dos ejecuciones en el mismo sistema 6 son idénticos y 2 cambian por naturaleza, el reloj y el orden de un conjunto; entre Windows y Ubuntu solo 3 son idénticos, 2 difieren por un defecto de escritura corregible, 2 por naturaleza y 1 por diseño.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="389" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocho artefactos del mismo canal: cuántos son idénticos (SHA-256) entre dos ejecuciones y entre Windows y</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ubuntu</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Idénticos</tspan></text><rect x="131.86" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="151.86" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Difieren por defecto de escritura (modo texto sin newline ni encoding)</tspan></text><rect x="16" y="88" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="99" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Difieren por naturaleza (reloj, orden de un set)</tspan></text><rect x="425.92" y="88" width="12" height="12" rx="2" fill="#6b7c86"/><text x="445.92" y="99" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="445.92" dy="0">Difieren por diseño (nombre del sistema)</tspan></text><line x1="274" y1="120" x2="274" y2="208" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="208" x2="274" y2="213" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="229" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="424.425" y1="120" x2="424.425" y2="208" stroke="#d5dde1" stroke-width="1"/><line x1="424.425" y1="208" x2="424.425" y2="213" stroke="#5b7280" stroke-width="1.4"/><text x="424.425" y="229" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.425" dy="0">2</tspan></text><line x1="574.85" y1="120" x2="574.85" y2="208" stroke="#d5dde1" stroke-width="1"/><line x1="574.85" y1="208" x2="574.85" y2="213" stroke="#5b7280" stroke-width="1.4"/><text x="574.85" y="229" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="574.85" dy="0">4</tspan></text><line x1="725.275" y1="120" x2="725.275" y2="208" stroke="#d5dde1" stroke-width="1"/><line x1="725.275" y1="208" x2="725.275" y2="213" stroke="#5b7280" stroke-width="1.4"/><text x="725.275" y="229" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="725.275" dy="0">6</tspan></text><line x1="875.7" y1="120" x2="875.7" y2="208" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="208" x2="875.7" y2="213" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="229" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">8</tspan></text><line x1="274" y1="208" x2="875.7" y2="208" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="138" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Entre dos ejecuciones en el mismo</tspan></text><text x="264" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">sistema</tspan></text><text x="264" y="190.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Entre Windows y Ubuntu</tspan></text><rect x="274" y="127" width="451.275" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="499.638" y="146.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="499.638" dy="0">6</tspan></text><rect x="725.275" y="127" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="725.275" y="127" width="150.425" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="800.488" y="146.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800.488" dy="0">2</tspan></text><rect x="875.7" y="127" width="0" height="30" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="146.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">8</tspan></text><rect x="274" y="171" width="225.638" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="386.819" y="190.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="386.819" dy="0">3</tspan></text><rect x="499.638" y="171" width="150.425" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="574.85" y="190.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.85" dy="0">2</tspan></text><rect x="650.062" y="171" width="150.425" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="725.275" y="190.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="725.275" dy="0">2</tspan></text><rect x="800.488" y="171" width="75.2125" height="30" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="838.094" y="190.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="838.094" dy="0">1</tspan></text><text x="882.7" y="190.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">8</tspan></text><text x="574.85" y="252" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Artefactos de 8</tspan></text><rect x="10" y="266" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="290.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Reproducible no significa idéntico a nivel de bytes en todo: el reloj y el orden de un set nunca lo serán y hay que</tspan></text><text x="470" y="307.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">excluirlos del hash o declararlos. Los dos que difieren entre sistemas por escritura (ingenuo.csv e informe_ingenuo.md) son</tspan></text><text x="470" y="324.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">defectos de escritura, no del experimento, y se corrigen sin tocar los datos.</tspan></text><text x="470" y="371.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sondas reales en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); cada fila es una observación, no una norma.</tspan></text></svg>
