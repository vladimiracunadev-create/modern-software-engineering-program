<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" width="940" height="492" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad del evento tope de un árbol de fallos del Horno de curado, sin y con una causa común</title><desc id="d">Barras en escala logarítmica con la probabilidad anual del evento tope: 2,07 por diez a la menos cinco con nueve cortes mínimos de orden dos, y 3,21 por diez a la menos cuatro cuando una calibración compartida por el lazo y el limitador añade un corte de orden uno, unas 15,5 veces más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="492" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad del evento tope de un árbol de fallos del Horno de curado, sin y con una causa común</tspan></text><line x1="101.24" y1="317" x2="920" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="317" x2="101.24" y2="317" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="321.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="192" x2="920" y2="192" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="192" x2="101.24" y2="192" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,0001</tspan></text><line x1="101.24" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="67" x2="101.24" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,001</tspan></text><line x1="101.24" y1="67" x2="101.24" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 192)">Probabilidad por año (escala logarítmica)</text><rect x="142.178" y="277.504" width="327.504" height="39.4963" rx="3" fill="#102a43"/><text x="305.93" y="271.504" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="305.93" dy="0">2,07e-05</tspan></text><text x="305.93" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="305.93" dy="0">Sin causa común (9 cortes de orden 2)</tspan></text><rect x="551.558" y="128.687" width="327.504" height="188.313" rx="3" fill="#102a43"/><text x="715.31" y="122.687" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="715.31" dy="0">3,21e-04</tspan></text><text x="715.31" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="715.31" dy="0">Con una calibración común (corte de orden 1)</tspan></text><rect x="10" y="369" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La calibración común aporta el 93,5 % de la probabilidad del tope con una probabilidad propia de solo 3,0e-4, mayor que la</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del evento tope sin ella. Una simulación Monte Carlo con las probabilidades multiplicadas por 20 y 400 000 corridas</tspan></text><text x="470" y="427.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(semilla 47) dio 1,40e-2 frente a 1,38e-2 exacto. Las tasas las fijó el autor.</tspan></text><text x="470" y="474.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
