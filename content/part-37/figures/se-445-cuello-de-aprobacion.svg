<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 321" width="820" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto espera una decisión</title><desc id="d">Tabla con la espera de una decisión según cuántas aprueba una sola persona: con 5 por día la utilización es 87,5 por ciento y la espera media 9,4 horas con percentil 90 de 22,8, con 2 por día 35 por ciento, 0,8 horas y 2,7, y con 1 por día 17,5 por ciento, 0,3 horas y 0,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="321" fill="#ffffff"/><rect x="10" y="12" width="363" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="191.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="191.5" dy="0">Quién decide</tspan></text><rect x="379" y="12" width="138" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="448" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="448" dy="0">Utilización</tspan></text><rect x="523" y="12" width="147" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="596.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="596.5" dy="0">Espera media</tspan></text><rect x="676" y="12" width="128" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="740" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="740" dy="0">Espera p90</tspan></text><rect x="10" y="56" width="363" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="191.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="191.5" dy="0">Una persona aprueba todo (5 por día)</tspan></text><rect x="379" y="56" width="138" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="448" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="448" dy="0">87,5 %</tspan></text><rect x="523" y="56" width="147" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="596.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="596.5" dy="0">9,4 h</tspan></text><rect x="676" y="56" width="128" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="740" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="740" dy="0">22,8 h</tspan></text><rect x="10" y="106" width="363" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="191.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="191.5" dy="0">Aprueba el 40 % (2 por día)</tspan></text><rect x="379" y="106" width="138" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="448" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="448" dy="0">35,0 %</tspan></text><rect x="523" y="106" width="147" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="596.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="596.5" dy="0">0,8 h</tspan></text><rect x="676" y="106" width="128" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="740" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="740" dy="0">2,7 h</tspan></text><rect x="10" y="156" width="363" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="191.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="191.5" dy="0">Criterios delegados (1 por día)</tspan></text><rect x="379" y="156" width="138" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="448" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="448" dy="0">17,5 %</tspan></text><rect x="523" y="156" width="147" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="596.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="596.5" dy="0">0,3 h</tspan></text><rect x="676" y="156" width="128" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="740" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="740" dy="0">0,9 h</tspan></text><rect x="10" y="210" width="800" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="410" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">La utilización pasa de 17,5 % a 87,5 % y la espera media se multiplica por más de treinta, no por cinco: la</tspan></text><text x="410" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">espera no es proporcional a la carga. El percentil 90 muestra que una decisión de cada diez espera casi</tspan></text><text x="410" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">tres jornadas.</tspan></text><text x="410" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
