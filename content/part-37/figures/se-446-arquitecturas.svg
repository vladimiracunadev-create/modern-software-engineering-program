<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad media de fallo bajo demanda de tres arquitecturas según el intervalo entre pruebas</title><desc id="d">Barras en escala logarítmica con la PFD media: con prueba anual, 1oo1 da 8,76 por diez a la menos tres, 1oo2 5,30 por diez a la menos cuatro y 2oo3 7,15 por diez a la menos cuatro; con prueba cada dos años 1,75 por diez a la menos dos, 1,25 por diez a la menos tres y 1,98 por diez a la menos tres; con prueba cada cinco años 4,38 por diez a la menos dos, 4,50 por diez a la menos tres y 9,12 por diez a la menos tres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad media de fallo bajo demanda de tres arquitecturas según el intervalo entre pruebas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Prueba anual</tspan></text><rect x="154.48" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Cada 2 años</tspan></text><rect x="285.42" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="305.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="305.42" dy="0">Cada 5 años</tspan></text><line x1="101.24" y1="395" x2="920" y2="395" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="395" x2="101.24" y2="395" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="399.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,0001</tspan></text><line x1="101.24" y1="295" x2="920" y2="295" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="295" x2="101.24" y2="295" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="299.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,001</tspan></text><line x1="101.24" y1="195" x2="920" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="195" x2="101.24" y2="195" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="199.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,01</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,1</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="395" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 245)">PFD media (escala logarítmica)</text><rect x="128.532" y="200.75" width="70.112" height="194.25" rx="3" fill="#087f8c"/><text x="163.588" y="194.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="163.588" dy="0">8,76e-03</tspan></text><rect x="202.644" y="170.696" width="70.112" height="224.304" rx="3" fill="#946512"/><text x="237.7" y="164.696" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237.7" dy="0">1,75e-02</tspan></text><rect x="276.756" y="130.853" width="70.112" height="264.147" rx="3" fill="#c0432f"/><text x="311.812" y="124.853" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="311.812" dy="0">4,38e-02</tspan></text><text x="237.7" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">1oo1</tspan></text><rect x="401.452" y="322.572" width="70.112" height="72.4276" rx="3" fill="#087f8c"/><text x="436.508" y="316.572" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="436.508" dy="0">5,30e-04</tspan></text><rect x="475.564" y="285.309" width="70.112" height="109.691" rx="3" fill="#946512"/><text x="510.62" y="279.309" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="510.62" dy="0">1,25e-03</tspan></text><rect x="549.676" y="229.679" width="70.112" height="165.321" rx="3" fill="#c0432f"/><text x="584.732" y="223.679" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="584.732" dy="0">4,50e-03</tspan></text><text x="510.62" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">1oo2 (beta 0,05)</tspan></text><rect x="674.372" y="309.569" width="70.112" height="85.4306" rx="3" fill="#087f8c"/><text x="709.428" y="303.569" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.428" dy="0">7,15e-04</tspan></text><rect x="748.484" y="265.333" width="70.112" height="129.667" rx="3" fill="#946512"/><text x="783.54" y="259.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="783.54" dy="0">1,98e-03</tspan></text><rect x="822.596" y="199.001" width="70.112" height="195.999" rx="3" fill="#c0432f"/><text x="857.652" y="193.001" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.652" dy="0">9,12e-03</tspan></text><text x="783.54" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">2oo3 (beta 0,05)</tspan></text><line x1="101.24" y1="295" x2="920" y2="295" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="289" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">frontera 1e-3</tspan></text><line x1="101.24" y1="195" x2="920" y2="195" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="189" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">frontera 1e-2</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Fórmulas simplificadas de baja demanda con una tasa de fallo peligroso no detectado de 2e-6 por hora. Las fronteras de las</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">bandas son de 1e-2 a 1e-1 para el nivel 1, de 1e-3 a 1e-2 para el 2 y de 1e-4 a 1e-3 para el 3 en modo de baja demanda. Una</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">simulación de 400 000 vidas dio 8,62e-3 para 1oo1 frente a 8,76e-3 de la fórmula.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
