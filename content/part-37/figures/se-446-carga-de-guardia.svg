<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánta guardia recibe cada persona</title><desc id="d">Líneas con las semanas por persona y año de una guardia semanal con 1,5 avisos por semana fuera de horario: de 3 a 8 personas las semanas de guardia bajan de 18 a 7 y las semanas con tres o más avisos de 3,45 a 1,33, mientras los avisos por persona bajan de 27 a 10,5 al año.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánta guardia recibe cada persona</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Semanas de guardia al año</tspan></text><rect x="252.5" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Semanas con 3 o más avisos por persona y año</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="387" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="312" x2="71.08" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="237" x2="71.08" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="162" x2="71.08" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="87" x2="71.08" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="87" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="87" x2="89.08" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="387" x2="89.08" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">3 (27,0)</tspan></text><line x1="249.664" y1="87" x2="249.664" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="249.664" y1="387" x2="249.664" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="249.664" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="249.664" dy="0">4 (19,5)</tspan></text><line x1="570.832" y1="87" x2="570.832" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="570.832" y1="387" x2="570.832" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="570.832" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="570.832" dy="0">6 (13,5)</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">8 (10,5)</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Semanas por persona y año</text><text x="490.54" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Personas en la rotación (entre paréntesis, avisos fuera de horario por persona y año)</tspan></text><polyline points="89.08,117 249.664,192 570.832,252 892,282" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="89.08" cy="117" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="89.08" y="106" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">18</tspan></text><circle cx="249.664" cy="192" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="249.664" y="181" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="249.664" dy="0">13</tspan></text><circle cx="570.832" cy="252" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="570.832" y="241" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="570.832" dy="0">9</tspan></text><circle cx="892" cy="282" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="271" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">7</tspan></text><polyline points="89.08,335.25 249.664,349.8 570.832,361.05 892,367.05" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="329.75" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="359.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">3,45</tspan></text><rect x="244.164" y="344.3" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="249.664" y="373.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="249.664" dy="0">2,48</tspan></text><rect x="565.332" y="355.55" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="570.832" y="385.05" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="570.832" dy="0">1,73</tspan></text><rect x="886.5" y="361.55" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="391.05" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">1,33</tspan></text><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El número de avisos por persona baja en proporción al tamaño de la rotación, pero las semanas malas (tres o más avisos)</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">bajan más despacio: aunque la media baje, siempre habrá semanas duras.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
