<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 371" width="912" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas personas deben irse</title><desc id="d">Tabla con 200 repositorios sintéticos de 300 archivos y 8 personas: con un autor por archivo y reparto concentrado el factor de camión mediano es 2 y la salida de la persona más cargada deja sin conocedor al 37 por ciento de los archivos, con reparto uniforme 4 y 15,4 por ciento, con dos conocedores por archivo 5,5 y 0 por ciento y con dos conocedores y rotación 6 y 0 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="912" height="371" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Reparto del conocimiento</tspan></text><rect x="340" y="12" width="226" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="453" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="453" dy="0">Factor de camión (mediana)</tspan></text><rect x="572" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="734" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="734" dy="0">Archivos sin conocedor al irse la</tspan></text><text x="734" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="734" dy="0">persona más cargada</tspan></text><rect x="10" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Un autor por archivo, reparto concentrado</tspan></text><rect x="340" y="56" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="453" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="453" dy="0">2</tspan></text><rect x="572" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="734" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="734" dy="0">37,0 %</tspan></text><rect x="10" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Un autor por archivo, reparto uniforme</tspan></text><rect x="340" y="106" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="453" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="453" dy="0">4</tspan></text><rect x="572" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="734" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="734" dy="0">15,4 %</tspan></text><rect x="10" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Dos conocedores por archivo</tspan></text><rect x="340" y="156" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="453" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="453" dy="0">5,5</tspan></text><rect x="572" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="734" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="734" dy="0">0,0 %</tspan></text><rect x="10" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Dos conocedores y rotación</tspan></text><rect x="340" y="206" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="453" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="453" dy="0">6</tspan></text><rect x="572" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="734" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="734" dy="0">0,0 %</tspan></text><rect x="10" y="260" width="892" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="456" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="456" dy="0">Cada fila es una política de reparto; el factor dice cuántas personas habría que perder para dejar sin conocedor a la</tspan></text><text x="456" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="456" dy="0">mitad del código, y la última columna cuánto se pierde si se va solo la persona que más sabe. La diferencia entre un</tspan></text><text x="456" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="456" dy="0">autor concentrado y dos conocedores por archivo es lo que compra la revisión por un segundo conocedor.</tspan></text><text x="456" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="456" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
