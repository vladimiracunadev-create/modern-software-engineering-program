<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 255" width="820" height="255" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántos equipos cruza un cambio</title><desc id="d">Tabla con 5 000 cambios sintéticos sobre cuatro dominios y tres capas: con equipos por capa un cambio cruza 2,31 equipos de media, el 81 por ciento requiere relevo y el plazo es de 5,9 días, y con equipos por dominio cruza 1,21, el 21,1 por ciento requiere relevo y el plazo es de 2,6 días.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="255" fill="#ffffff"/><rect x="10" y="12" width="182" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="101" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="101" dy="0">Organización</tspan></text><rect x="198" y="12" width="181" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="288.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="288.5" dy="0">Equipos por cambio</tspan></text><rect x="385" y="12" width="266" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="518" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="518" dy="0">Cambios que requieren relevo</tspan></text><rect x="657" y="12" width="147" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="730.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="730.5" dy="0">Plazo estimado</tspan></text><rect x="10" y="56" width="182" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="101" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="101" dy="0">Equipos por capa</tspan></text><rect x="198" y="56" width="181" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="288.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.5" dy="0">2,31</tspan></text><rect x="385" y="56" width="266" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="518" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="518" dy="0">81,0 %</tspan></text><rect x="657" y="56" width="147" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="730.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.5" dy="0">5,9 días</tspan></text><rect x="10" y="106" width="182" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="101" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="101" dy="0">Equipos por dominio</tspan></text><rect x="198" y="106" width="181" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="288.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.5" dy="0">1,21</tspan></text><rect x="385" y="106" width="266" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="518" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="518" dy="0">21,1 %</tspan></text><rect x="657" y="106" width="147" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="730.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.5" dy="0">2,6 días</tspan></text><rect x="10" y="160" width="800" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="410" y="184.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Cada fila es una forma de cortar el mismo trabajo; el plazo baja a menos de la mitad porque los relevos</tspan></text><text x="410" y="201.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">desaparecen, no porque se trabaje más rápido.</tspan></text><text x="410" y="241.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
