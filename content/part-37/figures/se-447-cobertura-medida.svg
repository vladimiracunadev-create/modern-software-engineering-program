<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 565" width="940" height="565" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Inyección de 20 000 fallos de un bit en un cálculo de par: cobertura medida de cuatro esquemas de diagnóstico</title><desc id="d">Barras con la cobertura medida sobre 15 422 fallos peligrosos: sin diagnóstico 0 por ciento, comprobación de rango de la entrada 57,0, doble cálculo con comparación 67,3 y doble cálculo con relectura de la salida 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="565" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Inyección de 20 000 fallos de un bit en un cálculo de par: cobertura medida de cuatro esquemas de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">diagnóstico</tspan></text><line x1="78.62" y1="356" x2="920" y2="356" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="356" x2="78.62" y2="356" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="360.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="302" x2="920" y2="302" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="302" x2="78.62" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="306.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="248" x2="920" y2="248" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="248" x2="78.62" y2="248" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="252.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="194" x2="920" y2="194" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="194" x2="78.62" y2="194" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="198.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="140" x2="920" y2="140" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="140" x2="78.62" y2="140" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="144.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="86" x2="920" y2="86" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="86" x2="78.62" y2="86" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="90.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="86" x2="78.62" y2="356" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 221)">Por ciento de fallos peligrosos detectados</text><rect x="99.6545" y="354" width="168.276" height="2" rx="3" fill="#087f8c"/><text x="183.793" y="348" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="183.793" dy="0">0,0</tspan></text><text x="183.793" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">Sin diagnóstico</tspan></text><rect x="310" y="202.1" width="168.276" height="153.9" rx="3" fill="#087f8c"/><text x="394.138" y="196.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="394.138" dy="0">57,0</tspan></text><text x="394.138" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">Rango de la entrada</tspan></text><rect x="520.345" y="174.29" width="168.276" height="181.71" rx="3" fill="#087f8c"/><text x="604.483" y="168.29" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="604.483" dy="0">67,3</tspan></text><text x="604.482" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">Doble cálculo y comparación</tspan></text><rect x="730.689" y="86" width="168.276" height="270" rx="3" fill="#087f8c"/><text x="814.827" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="814.827" dy="0">100,0</tspan></text><text x="814.827" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">Doble cálculo y relectura</tspan></text><text x="814.827" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">de la salida</tspan></text><rect x="10" y="425" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="449.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El doble cálculo no ve un fallo que ocurre después de la comparación (en la salida), por eso se queda en 67,3 %; la</tspan></text><text x="470" y="466.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">relectura de la salida lo cierra. Los fallos se inyectan en la entrada, en un valor intermedio y en la salida del canal A,</tspan></text><text x="470" y="483.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">con el canal B sano; solo se prueba un fallo a la vez. El 100 % vale para este modelo de fallos, no para fallos de causa</tspan></text><text x="470" y="499.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">común.</tspan></text><text x="470" y="547.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten con la misma semilla.</tspan></text></svg>
