<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 388" width="820" height="388" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué estrategia aguanta un malentendido</title><desc id="d">Tabla con partidas sintéticas de 200 rondas con 5 por ciento de malentendidos: contra sí misma el ojo por ojo obtiene 2,29 puntos por ronda, el generoso 2,85, el que siempre coopera 2,95 y el que siempre ataca 1,15, y en promedio contra las cuatro estrategias obtienen 2,31, 2,34, 2,21 y 2,39.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="388" fill="#ffffff"/><rect x="10" y="12" width="179" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="99.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="99.5" dy="0">Estrategia</tspan></text><rect x="195" y="12" width="267" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="328.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="328.5" dy="0">Pago por ronda contra sí misma</tspan></text><rect x="468" y="12" width="336" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="636" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="636" dy="0">Pago promedio contra las cuatro</tspan></text><text x="636" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="636" dy="0">estrategias</tspan></text><rect x="10" y="56" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99.5" dy="0">Ojo por ojo</tspan></text><rect x="195" y="56" width="267" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="328.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328.5" dy="0">2,29</tspan></text><rect x="468" y="56" width="336" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="636" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="636" dy="0">2,31</tspan></text><rect x="10" y="106" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99.5" dy="0">Ojo por ojo generoso</tspan></text><rect x="195" y="106" width="267" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="328.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328.5" dy="0">2,85</tspan></text><rect x="468" y="106" width="336" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="636" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="636" dy="0">2,34</tspan></text><rect x="10" y="156" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99.5" dy="0">Siempre coopera</tspan></text><rect x="195" y="156" width="267" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="328.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328.5" dy="0">2,95</tspan></text><rect x="468" y="156" width="336" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="636" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="636" dy="0">2,21</tspan></text><rect x="10" y="206" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99.5" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99.5" dy="0">Siempre ataca</tspan></text><rect x="195" y="206" width="267" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="328.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328.5" dy="0">1,15</tspan></text><rect x="468" y="206" width="336" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="636" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="636" dy="0">2,39</tspan></text><rect x="10" y="260" width="800" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="410" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">Contra una igual, un malentendido hace caer el ojo por ojo estricto de 3 a 2,29 porque las represalias se</tspan></text><text x="410" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">alternan; la versión generosa lo recupera hasta 2,85. La segunda columna muestra el límite: contra una</tspan></text><text x="410" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">mezcla que incluye a quien siempre ataca, esa estrategia obtiene el promedio más alto y quien siempre</tspan></text><text x="410" y="334.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">coopera, el más bajo.</tspan></text><text x="410" y="374.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
