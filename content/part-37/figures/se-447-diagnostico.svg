<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 233" width="960" height="233" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagnóstico del cálculo de par: dónde se coloca cada comprobación y qué fallos no ve</title><desc id="d">Diagrama de cuatro cajas encadenadas: entrada del pedal con comprobación de rango, canal A y canal B de cálculo, comparador que ve los fallos de los canales pero no los posteriores, y salida con relectura que cierra el último tramo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="233" fill="#ffffff"/><rect x="10" y="14" width="202" height="112" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="111" y="57" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">Entrada</tspan></text><text x="111" y="73.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">Rango: ve solo valores</tspan></text><text x="111" y="90.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">imposibles</tspan></text><rect x="256" y="14" width="202" height="112" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="57" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Canales A y B</tspan></text><text x="357" y="73.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Doble cálculo: ve fallos</tspan></text><text x="357" y="90.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">de un canal</tspan></text><polyline points="212,70 256,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="112" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="603" y="57" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="603" dy="0">Comparador</tspan></text><text x="603" y="73.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="603" dy="0">No ve lo que ocurre</tspan></text><text x="603" y="90.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="603" dy="0">después de él</tspan></text><polyline points="458,70 502,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="112" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849" y="65.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">Salida y relectura</tspan></text><text x="849" y="81.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">Cierra el último tramo</tspan></text><polyline points="704,70 748,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="140" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="164.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Cada diagnóstico cubre un tramo del camino del dato. La cobertura de un esquema es la unión de los tramos que cubren sus</tspan></text><text x="480" y="181.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">comprobaciones, y los fallos de causa común (el mismo error en ambos canales) no los ve ninguno de los tres.</tspan></text><text x="480" y="223.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
