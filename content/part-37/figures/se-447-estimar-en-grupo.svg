<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 853 305" width="853" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto distorsiona hablar en orden</title><desc id="d">Tabla con 5 000 ensayos sintéticos de una estimación de grupo de siete personas sobre una cantidad real de 100 días: si escriben solas y luego se muestran el error mediano es 8,4 por ciento y el 22,9 por ciento supera el 15, si hablan en orden sin sesgo 9,8 y 30,7, y si abre una persona sénior con un valor 30 por ciento mayor 16 y 52,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="853" height="305" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Cómo se recogen las estimaciones</tspan></text><rect x="340" y="12" width="226" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="453" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="453" dy="0">Error mediano del promedio</tspan></text><rect x="572" y="12" width="265" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="704.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="704.5" dy="0">Ensayos con error mayor al 15 %</tspan></text><rect x="10" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Escriben solas y luego se muestran</tspan></text><rect x="340" y="56" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="453" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="453" dy="0">8,4 %</tspan></text><rect x="572" y="56" width="265" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">22,9 %</tspan></text><rect x="10" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Se habla en orden, sin sesgo del primero</tspan></text><rect x="340" y="106" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="453" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="453" dy="0">9,8 %</tspan></text><rect x="572" y="106" width="265" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">30,7 %</tspan></text><rect x="10" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="173.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Se habla en orden y la persona sénior</tspan></text><text x="172" y="189.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">(+30 %) abre</tspan></text><rect x="340" y="156" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="453" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="453" dy="0">16,0 %</tspan></text><rect x="572" y="156" width="265" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">52,8 %</tspan></text><rect x="10" y="210" width="833" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="426.5" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="426.5" dy="0">La primera fila es la referencia: el promedio de estimaciones independientes. Hablar en orden ya la empeora, y</tspan></text><text x="426.5" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="426.5" dy="0">un sesgo del primero la duplica; más de la mitad de las sesiones de la última fila yerra por más del 15 %.</tspan></text><text x="426.5" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="426.5" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
