<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 355" width="820" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto cuesta esperar la retroalimentación</title><desc id="d">Tabla con 4 000 personas simuladas durante 12 semanas con un hábito erróneo en el 30 por ciento de cinco cambios semanales: con retroalimentación en el mismo cambio se repite el error 3,4 veces, a los 2 días 4,3, en la revisión semanal 4,7 y en la evaluación trimestral a los 60 días 14,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="355" fill="#ffffff"/><rect x="10" y="12" width="417" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="218.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="218.5" dy="0">Cuándo llega la retroalimentación</tspan></text><rect x="433" y="12" width="371" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="618.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="618.5" dy="0">Errores repetidos en 12 semanas</tspan></text><rect x="10" y="56" width="417" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="218.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.5" dy="0">En el mismo cambio</tspan></text><rect x="433" y="56" width="371" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="618.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="618.5" dy="0">3,4</tspan></text><rect x="10" y="106" width="417" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="218.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.5" dy="0">A los 2 días</tspan></text><rect x="433" y="106" width="371" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="618.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="618.5" dy="0">4,3</tspan></text><rect x="10" y="156" width="417" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="218.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.5" dy="0">En la revisión semanal</tspan></text><rect x="433" y="156" width="371" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="618.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="618.5" dy="0">4,7</tspan></text><rect x="10" y="206" width="417" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="218.5" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.5" dy="0">En la evaluación trimestral (60 días)</tspan></text><rect x="433" y="206" width="371" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="618.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="618.5" dy="0">14,3</tspan></text><rect x="10" y="260" width="800" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="410" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Pasar de la retroalimentación inmediata a la semanal añade poco (de 3,4 a 4,7); pasar a la trimestral la</tspan></text><text x="410" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">cuadruplica. El costo no es lineal en el retraso: se pierde el aprendizaje de varias semanas de trabajo.</tspan></text><text x="410" y="341.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
