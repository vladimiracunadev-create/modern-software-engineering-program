<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 523" width="940" height="523" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto cuesta esperar la retroalimentación</title><desc id="d">Barras con los errores repetidos en 12 semanas de 4 000 personas simuladas con un hábito erróneo en el 30 por ciento de cinco cambios semanales: 3,4 con retroalimentación en el mismo cambio, 4,3 a los 2 días, 4,7 en la revisión semanal y 14,3 en la evaluación trimestral a los 60 días.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="523" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto cuesta esperar la retroalimentación</tspan></text><line x1="71.08" y1="347" x2="920" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="347" x2="71.08" y2="347" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="351.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="253.667" x2="920" y2="253.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="253.667" x2="71.08" y2="253.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="258.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="160.333" x2="920" y2="160.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="160.333" x2="71.08" y2="160.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="164.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="67" x2="71.08" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="67" x2="71.08" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 207)">errores repetidos en 12 semanas</text><rect x="92.303" y="283.533" width="169.784" height="63.4667" rx="3" fill="#c0432f"/><text x="177.195" y="277.533" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177.195" dy="0">3,4</tspan></text><text x="177.195" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">En el mismo cambio</tspan></text><rect x="304.533" y="266.733" width="169.784" height="80.2667" rx="3" fill="#c0432f"/><text x="389.425" y="260.733" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="389.425" dy="0">4,3</tspan></text><text x="389.425" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">A los 2 días</tspan></text><rect x="516.763" y="259.267" width="169.784" height="87.7333" rx="3" fill="#c0432f"/><text x="601.655" y="253.267" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.655" dy="0">4,7</tspan></text><text x="601.655" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">En la revisión semanal</tspan></text><rect x="728.993" y="80.0667" width="169.784" height="266.933" rx="3" fill="#c0432f"/><text x="813.885" y="74.0667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="813.885" dy="0">14,3</tspan></text><text x="813.885" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">En la evaluación trimestral</tspan></text><text x="813.885" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">(60 días)</tspan></text><rect x="10" y="416" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="440.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Pasar de la retroalimentación inmediata a la semanal añade poco (de 3,4 a 4,7); pasar a la trimestral la cuadruplica. El</tspan></text><text x="470" y="457.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">costo no es lineal en el retraso: se pierde el aprendizaje de varias semanas de trabajo.</tspan></text><text x="470" y="505.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
