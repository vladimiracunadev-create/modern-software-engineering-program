<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 305" width="820" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto ruido hay en una evaluación</title><desc id="d">Tabla con 300 grupos simulados de 200 personas evaluadas por una o tres evaluadoras: una evaluadora sin rúbrica alcanza una correlación de 0,73 con el desempeño verdadero y promueve al 58,7 por ciento del 20 por ciento mejor, tres evaluadoras sin rúbrica 0,89 y 74,1, y tres con rúbrica calibrada 0,97 y 85,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="305" fill="#ffffff"/><rect x="10" y="12" width="309" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="164.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="164.5" dy="0">Esquema de evaluación</tspan></text><rect x="325" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Correlación con el desempeño</tspan></text><rect x="575" y="12" width="229" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="689.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="689.5" dy="0">Del 20 % mejor, promovidas</tspan></text><rect x="10" y="56" width="309" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164.5" dy="0">Una evaluadora, sin rúbrica</tspan></text><rect x="325" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">0,73</tspan></text><rect x="575" y="56" width="229" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="689.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="689.5" dy="0">58,7 %</tspan></text><rect x="10" y="106" width="309" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164.5" dy="0">Tres evaluadoras, sin rúbrica</tspan></text><rect x="325" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">0,89</tspan></text><rect x="575" y="106" width="229" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="689.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="689.5" dy="0">74,1 %</tspan></text><rect x="10" y="156" width="309" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164.5" dy="0">Tres evaluadoras con rúbrica calibrada</tspan></text><rect x="325" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">0,97</tspan></text><rect x="575" y="156" width="229" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="689.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="689.5" dy="0">85,9 %</tspan></text><rect x="10" y="210" width="800" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="410" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">Con una sola evaluadora y sin rúbrica, cuatro de cada diez personas que merecían promoción no la reciben</tspan></text><text x="410" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">aunque el desempeño exista y se mide con ruido. Añadir evaluadoras ayuda y la rúbrica calibrada ayuda más.</tspan></text><text x="410" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
