<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 501" width="940" height="501" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El limitador con y sin el requisito del sensor sin lectura: sentencias sin ejecutar tras las pruebas de requisitos</title><desc id="d">Barras con las sentencias sin ejecutar del limitador: 3 con las pruebas de los requisitos R0 a R4 y 2 tras añadir el requisito R5 de sensor sin lectura; las 2 restantes son la rama imposible y la orden de depuración.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="501" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El limitador con y sin el requisito del sensor sin lectura: sentencias sin ejecutar tras las pruebas de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">requisitos</tspan></text><line x1="63.54" y1="326" x2="920" y2="326" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="326" x2="63.54" y2="326" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="330.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="246" x2="920" y2="246" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="246" x2="63.54" y2="246" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="250.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="166" x2="920" y2="166" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="166" x2="63.54" y2="166" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="170.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="86" x2="920" y2="86" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="86" x2="63.54" y2="86" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="90.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="86" x2="63.54" y2="326" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="206" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 206)">Sentencias sin ejecutar de 13</text><rect x="106.363" y="86" width="342.584" height="240" rx="3" fill="#c0432f"/><text x="277.655" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277.655" dy="0">3</tspan></text><text x="277.655" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">Pruebas de R0 a R4</tspan></text><rect x="534.593" y="166" width="342.584" height="160" rx="3" fill="#c0432f"/><text x="705.885" y="160" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705.885" dy="0">2</tspan></text><text x="705.885" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">Tras añadir R5 (sensor sin lectura)</tspan></text><rect x="10" y="378" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="402.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La sentencia que se cubrió al añadir R5 era una conducta defensiva (devolver el estado seguro sin lectura) que existía en</tspan></text><text x="470" y="419.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">el código sin requisito: una conducta derivada que hasta entonces nadie había escrito. Las otras dos siguen siendo</tspan></text><text x="470" y="436.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">hallazgos abiertos.</tspan></text><text x="470" y="483.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten con la misma semilla.</tspan></text></svg>
