<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 255" width="960" height="255" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del peligro al control de software en la lógica de un ciclo de vida de dispositivo médico: lo que se encadena</title><desc id="d">Diagrama de cuatro cajas: peligro y situación peligrosa, riesgo estimado, medida de control incluida en el software o fuera de él, y clase de seguridad del módulo que determina el rigor de verificación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="255" fill="#ffffff"/><rect x="10" y="14" width="202" height="118" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="111" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="111" dy="0">Peligro</tspan></text><text x="111" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="111" dy="0">Sobreinfusión por una</tspan></text><text x="111" y="93.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="111" dy="0">orden mal tecleada</tspan></text><rect x="256" y="14" width="202" height="118" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Riesgo</tspan></text><text x="357" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Gravedad y probabilidad</tspan></text><text x="357" y="93.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">estimadas con supuestos</tspan></text><polyline points="212,73 256,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603" y="51.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Control</tspan></text><text x="603" y="68.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Tope por perfil en el</tspan></text><text x="603" y="84.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">software o límite</tspan></text><text x="603" y="101.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">mecánico fuera</tspan></text><polyline points="458,73 502,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">Clase del módulo</tspan></text><text x="849" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">Según lo que el software</tspan></text><text x="849" y="93.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">contribuye al peligro</tspan></text><polyline points="704,73 748,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="146" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="170.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">La clase de seguridad del software no se elige por el tamaño del módulo sino por si su fallo puede contribuir a una situación</tspan></text><text x="480" y="187.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">peligrosa y por qué controles externos reducen ese riesgo. Un control fuera del software puede bajar la clase; solo si es</tspan></text><text x="480" y="204.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">independiente y verificado.</tspan></text><text x="480" y="245.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
