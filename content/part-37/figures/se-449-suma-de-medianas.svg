<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 866 255" width="866" height="255" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Por qué la suma de medianas no se cumple</title><desc id="d">Tabla con 20 000 proyectos simulados de doce tareas con mediana de cinco días y suma de medianas de 60 días: con tareas independientes la probabilidad de terminar en 60 días es 19,3 por ciento y los percentiles 50, 85 y 95 son 70,5, 85,7 y 96,4 días, y con un factor común de dificultad 31,9 por ciento y 68,9, 93,4 y 111,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="866" height="255" fill="#ffffff"/><rect x="10" y="12" width="268" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="144" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="144" dy="0">Supuesto</tspan></text><rect x="284" y="12" width="296" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Probabilidad de terminar en 60 días</tspan></text><rect x="586" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="628" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="628" dy="0">p50</tspan></text><rect x="676" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="718" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="718" dy="0">p85</tspan></text><rect x="766" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="808" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="808" dy="0">p95</tspan></text><rect x="10" y="56" width="268" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="144" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="144" dy="0">Tareas independientes</tspan></text><rect x="284" y="56" width="296" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">19,3 %</tspan></text><rect x="586" y="56" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="628" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="628" dy="0">70,5</tspan></text><rect x="676" y="56" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="718" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="718" dy="0">85,7</tspan></text><rect x="766" y="56" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="808" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="808" dy="0">96,4</tspan></text><rect x="10" y="106" width="268" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="144" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="144" dy="0">Con un factor común de dificultad</tspan></text><rect x="284" y="106" width="296" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">31,9 %</tspan></text><rect x="586" y="106" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="628" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="628" dy="0">68,9</tspan></text><rect x="676" y="106" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="718" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="718" dy="0">93,4</tspan></text><rect x="766" y="106" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="808" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="808" dy="0">111,7</tspan></text><rect x="10" y="160" width="846" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="433" y="184.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="433" dy="0">La suma de medianas se cumple una de cada cinco veces con tareas independientes y una de cada tres con un factor</tspan></text><text x="433" y="201.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="433" dy="0">común. El factor común no desplaza la mediana, ensancha la cola: el percentil 95 pasa de 96 a 112 días.</tspan></text><text x="433" y="241.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="433" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
