<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 511" width="940" height="511" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">20 000 órdenes de velocidad con un 2 % de deslizamientos del punto decimal: órdenes peligrosas que llegan a la bomba</title><desc id="d">Barras con las órdenes peligrosas que pasan: sin control 398, con un tope global de 100 mililitros por hora 266 y con un tope por perfil de fármaco de tres veces la velocidad habitual 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="511" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">20 000 órdenes de velocidad con un 2 % de deslizamientos del punto decimal: órdenes peligrosas que llegan a</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">la bomba</tspan></text><line x1="78.62" y1="336" x2="920" y2="336" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="336" x2="78.62" y2="336" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="340.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="273.5" x2="920" y2="273.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="273.5" x2="78.62" y2="273.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="278" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="211" x2="920" y2="211" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="211" x2="78.62" y2="211" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="215.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="148.5" x2="920" y2="148.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="148.5" x2="78.62" y2="148.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="153" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="86" x2="920" y2="86" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="86" x2="78.62" y2="86" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="90.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="86" x2="78.62" y2="336" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="211" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 211)">Órdenes de 20 000</text><rect x="106.666" y="87.25" width="224.368" height="248.75" rx="3" fill="#c0432f"/><text x="218.85" y="81.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.85" dy="0">398</tspan></text><text x="218.85" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Sin control</tspan></text><rect x="387.126" y="169.75" width="224.368" height="166.25" rx="3" fill="#c0432f"/><text x="499.31" y="163.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">266</tspan></text><text x="499.31" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Tope global de 100 ml/h</tspan></text><rect x="667.586" y="334" width="224.368" height="2" rx="3" fill="#c0432f"/><text x="779.77" y="328" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">0</tspan></text><text x="779.77" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Tope por perfil de fármaco</tspan></text><rect x="10" y="388" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="412.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un tope fijo no sabe qué se prescribió: deja pasar 266 de 398 órdenes diez veces mayores que lo prescrito. El tope por</tspan></text><text x="470" y="429.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">perfil las detiene todas en este modelo, a costa de mantener y verificar la biblioteca de perfiles, que pasa a ser un</tspan></text><text x="470" y="446.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">componente crítico. El modelo supone un solo tipo de error de tecleo.</tspan></text><text x="470" y="493.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
