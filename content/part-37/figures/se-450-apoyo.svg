<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro afirmaciones de un argumento de seguridad: evidencias que respaldan a cada una</title><desc id="d">Barras con las evidencias por afirmación del argumento: G1 con 2, G2 con 1, G3 con 3 y G4 con 1 una vez desarrollada; G2 y G4 dependen de una sola evidencia y su retirada rompe la afirmación principal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro afirmaciones de un argumento de seguridad: evidencias que respaldan a cada una</tspan></text><line x1="294" y1="49" x2="294" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="201" x2="294" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="498.647" y1="49" x2="498.647" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="498.647" y1="201" x2="498.647" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="498.647" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498.647" dy="0">1</tspan></text><line x1="703.293" y1="49" x2="703.293" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="703.293" y1="201" x2="703.293" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="703.293" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="703.293" dy="0">2</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="201" x2="907.94" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">3</tspan></text><line x1="294" y1="201" x2="907.94" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">G1 peligros identificados</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">G2 requisitos verificados</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">G3 verificación estructural</tspan></text><text x="284" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">G4 desarrollada con una evidencia</tspan></text><rect x="294" y="55" width="409.293" height="26" rx="3" fill="#102a43"/><text x="710.293" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="710.293" dy="0">2</tspan></text><rect x="294" y="93" width="204.647" height="26" rx="3" fill="#102a43"/><text x="505.647" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="505.647" dy="0">1</tspan></text><rect x="294" y="131" width="613.94" height="26" rx="3" fill="#102a43"/><text x="914.94" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="294" y="169" width="204.647" height="26" rx="3" fill="#102a43"/><text x="505.647" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="505.647" dy="0">1</tspan></text><line x1="703.293" y1="49" x2="703.293" y2="201" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="708.293" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="708.293" dy="0">2 evidencias</tspan></text><text x="600.97" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="600.97" dy="0">Evidencias por afirmación</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Al retirar una evidencia por vez, solo E3 (única de G2) y E7 (única de G4) rompen la afirmación principal G0. Antes de</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">desarrollar G4, el argumento ni siquiera cierra: una afirmación sin desarrollar no es una afirmación apoyada. Además, E7 y</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">E8 estaban en la carpeta sin que ninguna afirmación las usara.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
