<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 305" width="820" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto cuesta decidir a qué nivel</title><desc id="d">Tabla con 200 decisiones por trimestre durante 3 000 trimestres con 30 por ciento irreversibles: escalar todo cuesta 407 de mediana y 487 en el percentil 90, escalar solo lo irreversible 301,5 y 382, y no escalar nada 369,5 y 463,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="305" fill="#ffffff"/><rect x="10" y="12" width="339" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="179.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="179.5" dy="0">Política de escalamiento</tspan></text><rect x="355" y="12" width="312" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="511" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="511" dy="0">Costo trimestral (mediana)</tspan></text><rect x="673" y="12" width="131" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="738.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="738.5" dy="0">Costo p90</tspan></text><rect x="10" y="56" width="339" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="179.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="179.5" dy="0">Todo se escala</tspan></text><rect x="355" y="56" width="312" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="511" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="511" dy="0">407,0</tspan></text><rect x="673" y="56" width="131" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="738.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="738.5" dy="0">487,0</tspan></text><rect x="10" y="106" width="339" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="179.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="179.5" dy="0">Solo se escala lo irreversible</tspan></text><rect x="355" y="106" width="312" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="511" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="511" dy="0">301,5</tspan></text><rect x="673" y="106" width="131" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="738.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="738.5" dy="0">382,0</tspan></text><rect x="10" y="156" width="339" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="179.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="179.5" dy="0">Nada se escala</tspan></text><rect x="355" y="156" width="312" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="511" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="511" dy="0">369,5</tspan></text><rect x="673" y="156" width="131" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="738.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="738.5" dy="0">463,5</tspan></text><rect x="10" y="210" width="800" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="410" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">Escalar todo es la política más cara porque paga la espera de las decisiones reversibles; no escalar nada</tspan></text><text x="410" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">paga los errores de las irreversibles. La política intermedia ahorra una cuarta parte del costo de la peor.</tspan></text><text x="410" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
