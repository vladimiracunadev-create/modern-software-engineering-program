<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 305" width="820" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué fracción del riesgo cubren los cinco primeros</title><desc id="d">Tabla con 400 carteras sintéticas de 30 riesgos de los que se eligen cinco para mitigar: ordenar por valor esperado cubre el 72,2 por ciento de la pérdida esperada, una matriz de cinco por cinco cubre el 65,8 por ciento y deja fuera el mayor riesgo en el 8,5 por ciento de las carteras, y elegir al azar cubre el 16,6 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="305" fill="#ffffff"/><rect x="10" y="12" width="287" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="153.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="153.5" dy="0">Criterio para elegir los cinco</tspan></text><rect x="303" y="12" width="243" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="424.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="424.5" dy="0">Pérdida esperada cubierta</tspan></text><rect x="552" y="12" width="252" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="678" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="678" dy="0">Deja fuera el mayor riesgo</tspan></text><rect x="10" y="56" width="287" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="153.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="153.5" dy="0">Valor esperado</tspan></text><rect x="303" y="56" width="243" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="424.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.5" dy="0">72,2 %</tspan></text><rect x="552" y="56" width="252" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="678" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="678" dy="0">0 % por definición</tspan></text><rect x="10" y="106" width="287" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="153.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="153.5" dy="0">Matriz 5×5</tspan></text><rect x="303" y="106" width="243" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="424.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.5" dy="0">65,8 %</tspan></text><rect x="552" y="106" width="252" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="678" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="678" dy="0">8,5 % de las carteras</tspan></text><rect x="10" y="156" width="287" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="153.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="153.5" dy="0">Azar</tspan></text><rect x="303" y="156" width="243" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="424.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.5" dy="0">16,6 %</tspan></text><rect x="552" y="156" width="252" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="678" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="678" dy="0">—</tspan></text><rect x="10" y="210" width="800" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="410" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">La matriz es mucho mejor que el azar y algo peor que el valor esperado: pierde 6,4 puntos de cobertura. En</tspan></text><text x="410" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">una de cada doce carteras deja fuera el riesgo más caro.</tspan></text><text x="410" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
