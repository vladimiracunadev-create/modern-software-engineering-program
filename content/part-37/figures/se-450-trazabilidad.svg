<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Trazabilidad de 30 requisitos y 45 pruebas: huecos, enlaces sin destino y enlaces sospechosos tras un cambio</title><desc id="d">Barras con los huecos de trazabilidad: 9 requisitos sin ninguna prueba, 2 pruebas sin requisito y, tras cambiar el texto de 3 requisitos, 3 enlaces sospechosos que obligan a revisar 4 pruebas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Trazabilidad de 30 requisitos y 45 pruebas: huecos, enlaces sin destino y enlaces sospechosos tras un cambio</tspan></text><line x1="354" y1="49" x2="354" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="201" x2="354" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="464.788" y1="49" x2="464.788" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="464.788" y1="201" x2="464.788" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="464.788" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="464.788" dy="0">2</tspan></text><line x1="575.576" y1="49" x2="575.576" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="575.576" y1="201" x2="575.576" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="575.576" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575.576" dy="0">4</tspan></text><line x1="686.364" y1="49" x2="686.364" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="686.364" y1="201" x2="686.364" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="686.364" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686.364" dy="0">6</tspan></text><line x1="797.152" y1="49" x2="797.152" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="797.152" y1="201" x2="797.152" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="797.152" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797.152" dy="0">8</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="201" x2="907.94" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">10</tspan></text><line x1="354" y1="201" x2="907.94" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Requisitos sin prueba</tspan></text><text x="344" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Pruebas sin requisito</tspan></text><text x="344" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Enlaces sospechosos tras cambiar 3 requisitos</tspan></text><text x="344" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Pruebas que hay que revisar</tspan></text><rect x="354" y="55" width="498.546" height="26" rx="3" fill="#c0432f"/><text x="859.546" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="859.546" dy="0">9</tspan></text><rect x="354" y="93" width="110.788" height="26" rx="3" fill="#c0432f"/><text x="471.788" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="471.788" dy="0">2</tspan></text><rect x="354" y="131" width="166.182" height="26" rx="3" fill="#c0432f"/><text x="527.182" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="527.182" dy="0">3</tspan></text><rect x="354" y="169" width="221.576" height="26" rx="3" fill="#c0432f"/><text x="582.576" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="582.576" dy="0">4</tspan></text><text x="630.97" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">Elementos</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los enlaces se comparan por el resumen SHA-256 del texto del requisito: si el texto cambia después de enlazar la prueba, el</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">enlace queda marcado como sospechoso. La cobertura de enlaces mide que existe un enlace, no que la prueba compruebe el</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">requisito. Los datos son sintéticos con semilla 47.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
