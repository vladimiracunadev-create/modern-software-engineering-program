<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 559" width="940" height="559" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Respuesta máxima de cada tarea con herencia de prioridad: simulada y calculada por análisis de tiempo de respuesta</title><desc id="d">Barras con la respuesta máxima en milisegundos de las tareas H, M y L: simulada 23, 63 y 120, y calculada con bloqueo de 13 milisegundos 23, 63 y 120; sin tener en cuenta el bloqueo, el análisis daría 10, 40 y 120.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="559" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Respuesta máxima de cada tarea con herencia de prioridad: simulada y calculada por análisis de tiempo de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">respuesta</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Simulada</tspan></text><rect x="124.32" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="144.32" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Análisis con bloqueo</tspan></text><rect x="323.12" y="64" width="12" height="12" rx="2" fill="#6b7c86"/><text x="343.12" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="343.12" dy="0">Análisis sin bloqueo</tspan></text><line x1="78.62" y1="384" x2="920" y2="384" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="384" x2="78.62" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="388.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="330" x2="920" y2="330" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="330" x2="78.62" y2="330" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="334.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="276" x2="920" y2="276" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="276" x2="78.62" y2="276" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="280.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="222" x2="920" y2="222" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="222" x2="78.62" y2="222" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="226.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="168" x2="920" y2="168" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="168" x2="78.62" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="172.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="114" x2="78.62" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">125</tspan></text><line x1="78.62" y1="114" x2="78.62" y2="384" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 249)">Milisegundos</text><rect x="106.666" y="334.32" width="72.1227" height="49.68" rx="3" fill="#087f8c"/><text x="142.727" y="328.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142.727" dy="0">23</tspan></text><rect x="182.789" y="334.32" width="72.1227" height="49.68" rx="3" fill="#102a43"/><text x="218.85" y="328.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.85" dy="0">23</tspan></text><rect x="258.911" y="362.4" width="72.1227" height="21.6" rx="3" fill="#6b7c86"/><text x="294.973" y="356.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="294.973" dy="0">10</tspan></text><text x="218.85" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">H (prioridad alta)</tspan></text><rect x="387.126" y="247.92" width="72.1227" height="136.08" rx="3" fill="#087f8c"/><text x="423.187" y="241.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.187" dy="0">63</tspan></text><rect x="463.249" y="247.92" width="72.1227" height="136.08" rx="3" fill="#102a43"/><text x="499.31" y="241.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">63</tspan></text><rect x="539.371" y="297.6" width="72.1227" height="86.4" rx="3" fill="#6b7c86"/><text x="575.433" y="291.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="575.433" dy="0">40</tspan></text><text x="499.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">M (prioridad media)</tspan></text><rect x="667.586" y="124.8" width="72.1227" height="259.2" rx="3" fill="#087f8c"/><text x="703.647" y="118.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="703.647" dy="0">120</tspan></text><rect x="743.709" y="124.8" width="72.1227" height="259.2" rx="3" fill="#102a43"/><text x="779.77" y="118.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">120</tspan></text><rect x="819.831" y="124.8" width="72.1227" height="259.2" rx="3" fill="#6b7c86"/><text x="855.893" y="118.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855.893" dy="0">120</tspan></text><text x="779.77" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">L (prioridad baja)</tspan></text><rect x="10" y="436" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="460.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El análisis coincide con el simulador cuando incluye el bloqueo: 13 ms para H por la sección crítica y 13 ms para M porque</tspan></text><text x="470" y="477.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">L hereda la prioridad de H y corre por encima de M. Omitir el bloqueo subestima H en más del doble. La cota de Liu y</tspan></text><text x="470" y="494.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Layland para tres tareas es 0,780 y la utilización de este conjunto 0,829: la cota es suficiente, no necesaria.</tspan></text><text x="470" y="541.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten con la misma semilla.</tspan></text></svg>
