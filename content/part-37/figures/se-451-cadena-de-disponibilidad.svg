<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 355" width="930" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto cae una cadena de proveedores</title><desc id="d">Tabla con la disponibilidad de una cadena de proveedores cada uno al 99,9 por ciento: uno da 99,9 por ciento y 526 minutos de caída al año, tres dan 99,7 y 1 575, cinco dan 99,501 y 2 623, y cinco con el más débil duplicado 99,6 y 2 100, con simulaciones de 536, 1 572, 2 615 y 2 083 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="355" fill="#ffffff"/><rect x="10" y="12" width="239" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="129.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="129.5" dy="0">Cadena</tspan></text><rect x="255" y="12" width="133" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="321.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="321.5" dy="0">Disponibilidad</tspan></text><rect x="394" y="12" width="280" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="534" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="534" dy="0">Minutos de caída al año (cálculo)</tspan></text><rect x="680" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Minutos de caída (simulado)</tspan></text><rect x="10" y="56" width="239" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="129.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="129.5" dy="0">1 proveedor</tspan></text><rect x="255" y="56" width="133" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="321.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="321.5" dy="0">99,900 %</tspan></text><rect x="394" y="56" width="280" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="534" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">526</tspan></text><rect x="680" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">536</tspan></text><rect x="10" y="106" width="239" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="129.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="129.5" dy="0">3 proveedores</tspan></text><rect x="255" y="106" width="133" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="321.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="321.5" dy="0">99,700 %</tspan></text><rect x="394" y="106" width="280" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="534" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">1 575</tspan></text><rect x="680" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">1 572</tspan></text><rect x="10" y="156" width="239" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="129.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="129.5" dy="0">5 proveedores</tspan></text><rect x="255" y="156" width="133" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="321.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="321.5" dy="0">99,501 %</tspan></text><rect x="394" y="156" width="280" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="534" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">2 623</tspan></text><rect x="680" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">2 615</tspan></text><rect x="10" y="206" width="239" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="129.5" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="129.5" dy="0">5, con el más débil duplicado</tspan></text><rect x="255" y="206" width="133" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="321.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="321.5" dy="0">99,600 %</tspan></text><rect x="394" y="206" width="280" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="534" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">2 100</tspan></text><rect x="680" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">2 083</tspan></text><rect x="10" y="260" width="910" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Cada proveedor adicional agrega unos 525 minutos de caída esperada, y la cadena de cinco pasa de 8,8 a 43,7 horas al año.</tspan></text><text x="465" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Duplicar solo el eslabón más débil recupera la quinta parte del daño.</tspan></text><text x="465" y="341.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
