4" rx="3" fill="#946512"/><text x="300.275" y="190.696" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="300.275" dy="0">796</tspan></text><rect x="358.028" y="98.36" width="107.507" height="276.64" rx="3" fill="#c0432f"/><text x="411.782" y="92.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.782" dy="0">1 235</tspan></text><text x="300.275" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300.275" dy="0">Comprar</tspan></text><rect x="548.165" y="180.792" width="107.507" height="194.208" rx="3" fill="#087f8c"/><text x="601.918" y="174.792" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.918" dy="0">867</tspan></text><rect x="659.672" y="186.392" width="107.507" height="188.608" rx="3" fill="#946512"/><text x="713.425" y="180.392" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="713.425" dy="0">842</tspan></text><rect x="771.178" y="131.96" width="107.507" height="243.04" rx="3" fill="#c0432f"/><text x="824.932" y="125.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="824.932" dy="0">1 085</tspan></text><text x="713.425" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="713.425" dy="0">Construir</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Comprar cuesta más que construir en el 45,8 % de los casos. Las medias son casi iguales y las medianas favorecen comprar,</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">pero el percentil 90 de comprar es 150 unidades mayor: la cola de alzas y de migración forzada. La decisión depende de</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cuánta cola puede asumir el equipo.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
