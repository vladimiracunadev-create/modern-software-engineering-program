<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 332" width="940" height="332" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pasos de una ordenación de 8 elementos: mediana, máximo observado en 1000 entradas al azar y peor caso real</title><desc id="d">Intervalo con la mediana de 56 pasos, el máximo observado de 80 y el peor caso real de 84 pasos de una ordenación con intercambio y salida anticipada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="332" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pasos de una ordenación de 8 elementos: mediana, máximo observado en 1000 entradas al azar y peor caso real</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mediana</tspan></text><polygon points="122.78,44.1 129.38,56.4 116.18,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">máx. observado</tspan></text><polygon points="276.34,43.5 283.84,51 276.34,58.5 268.84,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="290.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="290.34" dy="0">peor caso</tspan></text><line x1="253.5" y1="77" x2="253.5" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="253.5" y1="151" x2="253.5" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="253.5" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="253.5" dy="0">0</tspan></text><line x1="380.8" y1="77" x2="380.8" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="380.8" y1="151" x2="380.8" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="380.8" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380.8" dy="0">20</tspan></text><line x1="508.1" y1="77" x2="508.1" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="508.1" y1="151" x2="508.1" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="508.1" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="508.1" dy="0">40</tspan></text><line x1="635.4" y1="77" x2="635.4" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="635.4" y1="151" x2="635.4" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="635.4" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.4" dy="0">60</tspan></text><line x1="762.7" y1="77" x2="762.7" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="762.7" y1="151" x2="762.7" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="762.7" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762.7" dy="0">80</tspan></text><line x1="890" y1="77" x2="890" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="151" x2="890" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">100</tspan></text><line x1="253.5" y1="151" x2="890" y2="151" stroke="#5b7280" stroke-width="1.6"/><text x="223.5" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="223.5" dy="0">Ordenación de 8 elementos</tspan></text><line x1="609.94" y1="114" x2="788.16" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="602.94" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="609.94" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="609.94" dy="0">56</tspan></text><polygon points="762.7,105.95 770.4,120.3 755,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="762.7" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="762.7" dy="0">80</tspan></text><polygon points="788.16,105.25 796.91,114 788.16,122.75 779.41,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="788.16" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="788.16" dy="0">84</tspan></text><text x="571.75" y="195" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="571.75" dy="0">Pasos de ejecución</tspan></text><rect x="10" y="209" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="233.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La marca de agua medida queda 4,8 % por debajo del peor caso, que se alcanza con la entrada en orden inverso; 1000 entradas</tspan></text><text x="470" y="250.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">al azar no lo generan. La medición da un límite inferior del WCET, no una cota; el análisis de caminos o la entrada</tspan></text><text x="470" y="267.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">construida a propósito la encuentran. Se cuentan pasos y no segundos para que el resultado no dependa del equipo.</tspan></text><text x="470" y="314.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten con la misma semilla.</tspan></text></svg>
