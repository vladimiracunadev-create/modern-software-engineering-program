<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 973 255" width="973" height="255" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué cuesta un flujo de cancelación escondido</title><desc id="d">Tabla con 12 meses simulados de dos flujos de suscripción: el honesto acumula un ingreso neto de 22 965 al mes 3, 76 403 al mes 6 y 256 658 al mes 12 con 104 reclamos y 3 620 personas suscritas, y el de cancelación escondida acumula 26 972, 89 830 y 294 799 con 956 reclamos y 4 279 suscritas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="973" height="255" fill="#ffffff"/><rect x="10" y="12" width="170" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Flujo</tspan></text><rect x="186" y="12" width="308" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="340" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="340" dy="0">Ingreso neto acumulado (mes 3 · 6 ·</tspan></text><text x="340" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="340" dy="0">12)</tspan></text><rect x="500" y="12" width="229" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="614.5" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.5" dy="0">Reclamos acumulados (mes</tspan></text><text x="614.5" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.5" dy="0">12)</tspan></text><rect x="735" y="12" width="222" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="846" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="846" dy="0">Personas suscritas (mes</tspan></text><text x="846" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="846" dy="0">12)</tspan></text><rect x="10" y="56" width="170" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="95" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="95" dy="0">Honesto</tspan></text><rect x="186" y="56" width="308" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="340" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="340" dy="0">22 965 · 76 403 · 256 658</tspan></text><rect x="500" y="56" width="229" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="614.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="614.5" dy="0">104</tspan></text><rect x="735" y="56" width="222" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="846" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="846" dy="0">3 620</tspan></text><rect x="10" y="106" width="170" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="95" y="123.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="95" dy="0">Cancelación</tspan></text><text x="95" y="139.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="95" dy="0">escondida</tspan></text><rect x="186" y="106" width="308" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="340" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="340" dy="0">26 972 · 89 830 · 294 799</tspan></text><rect x="500" y="106" width="229" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="614.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="614.5" dy="0">956</tspan></text><rect x="735" y="106" width="222" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="846" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="846" dy="0">4 279</tspan></text><rect x="10" y="160" width="953" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="486.5" y="184.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="486.5" dy="0">En esta simulación el flujo escondido gana en ingresos todo el año: 38 141 más a los doce meses. La contrapartida es nueve veces</tspan></text><text x="486.5" y="201.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="486.5" dy="0">más reclamos.</tspan></text><text x="486.5" y="241.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="486.5" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
