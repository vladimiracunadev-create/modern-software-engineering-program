<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 819 505" width="819" height="505" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué detecta una verificación de firma</title><desc id="d">Tabla con 2 000 mensajes de commit sintéticos: 1 709 con pie de firma correcto aceptados por la verificación estricta, y 83 sin firma, 54 con firma de otra persona, 44 con el pie mal escrito, 49 con el pie en medio del texto y 61 con correo roto, todos rechazados; la verificación ingenua acepta 1 873 y la estricta 1 709.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="819" height="505" fill="#ffffff"/><rect x="10" y="12" width="277" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="148.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="148.5" dy="0">Tipo de commit</tspan></text><rect x="293" y="12" width="129" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357.5" dy="0">Cantidad</tspan></text><rect x="428" y="12" width="375" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="615.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="615.5" dy="0">Aceptados por la estricta</tspan></text><rect x="10" y="56" width="277" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="148.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="148.5" dy="0">Pie correcto<