6" width="277" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="148.5" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="148.5" dy="0">Pie mal escrito</tspan></text><rect x="293" y="206" width="129" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357.5" dy="0">44</tspan></text><rect x="428" y="206" width="375" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="615.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615.5" dy="0">0</tspan></text><rect x="10" y="256" width="277" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="148.5" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="148.5" dy="0">Pie en medio del texto</tspan></text><rect x="293" y="256" width="129" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357.5" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357.5" dy="0">49</tspan></text><rect x="428" y="256" width="375" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="615.5" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615.5" dy="0">0</tspan></text><rect x="10" y="306" width="277" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="148.5" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="148.5" dy="0">Correo roto</tspan></text><rect x="293" y="306" width="129" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357.5" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357.5" dy="0">61</tspan></text><rect x="428" y="306" width="375" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="615.5" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615.5" dy="0">0</tspan></text><rect x="10" y="356" width="277" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="148.5" y="381.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="148.5" dy="0">Total aceptado</tspan></text><rect x="293" y="356" width="129" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357.5" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357.5" dy="0">2 000</tspan></text><rect x="428" y="356" width="375" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="615.5" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615.5" dy="0">ingenua: 1 873; estricta: 1 709</tspan></text><rect x="10" y="410" width="799" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="409.5" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="409.5" dy="0">La búsqueda ingenua da por firmados 164 commits que la estricta rechaza: la firma de otra persona, el pie</tspan></text><text x="409.5" y="451.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="409.5" dy="0">en medio y el correo roto. Cada uno es un tipo de defecto distinto, con causa y corrección distintas.</tspan></text><text x="409.5" y="491.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="409.5" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
