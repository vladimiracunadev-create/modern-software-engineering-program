<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 537" width="940" height="537" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis reglas comprobables por máquina sobre dos versiones de las mismas tres funciones: avisos por regla</title><desc id="d">Barras con los avisos de cada regla: la muestra con recursión, bucle sin cota, función con lógica sin aserciones, valor de retorno ignorado y excepción vacía acumula 1 aviso en cada una de cinco reglas y 0 en la de longitud; la versión corregida acumula 0 en las seis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="537" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis reglas comprobables por máquina sobre dos versiones de las mismas tres funciones: avisos por regla</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Muestra con defectos</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Versión corregida</tspan></text><line x1="78.62" y1="345" x2="920" y2="345" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="345" x2="78.62" y2="345" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="349.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="295" x2="920" y2="295" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="295" x2="78.62" y2="295" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="299.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,2</tspan></text><line x1="78.62" y1="245" x2="920" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="245" x2="78.62" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="249.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,4</tspan></text><line x1="78.62" y1="195" x2="920" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="195" x2="78.62" y2="195" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="199.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,6</tspan></text><line x1="78.62" y1="145" x2="920" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="145" x2="78.62" y2="145" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="149.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,8</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="345" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">Avisos</text><rect x="92.643" y="95" width="54.092" height="250" rx="3" fill="#c0432f"/><text x="119.689" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="119.689" dy="0">1</tspan></text><rect x="150.735" y="343" width="54.092" height="2" rx="3" fill="#087f8c"/><text x="177.781" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177.781" dy="0">0</tspan></text><text x="148.735" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="148.735" dy="0">Sin recursión</tspan></text><rect x="232.873" y="95" width="54.092" height="250" rx="3" fill="#c0432f"/><text x="259.919" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="259.919" dy="0">1</tspan></text><rect x="290.965" y="343" width="54.092" height="2" rx="3" fill="#087f8c"/><text x="318.011" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="318.011" dy="0">0</tspan></text><text x="288.965" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Bucles con cota</tspan></text><rect x="373.103" y="343" width="54.092" height="2" rx="3" fill="#c0432f"/><text x="400.149" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="400.149" dy="0">0</tspan></text><rect x="431.195" y="343" width="54.092" height="2" rx="3" fill="#087f8c"/><text x="458.241" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="458.241" dy="0">0</tspan></text><text x="429.195" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429.195" dy="0">Funciones cortas</tspan></text><rect x="513.333" y="95" width="54.092" height="250" rx="3" fill="#c0432f"/><text x="540.379" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="540.379" dy="0">1</tspan></text><rect x="571.425" y="343" width="54.092" height="2" rx="3" fill="#087f8c"/><text x="598.471" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="598.471" dy="0">0</tspan></text><text x="569.425" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="569.425" dy="0">Aserciones</tspan></text><rect x="653.563" y="95" width="54.092" height="250" rx="3" fill="#c0432f"/><text x="680.609" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="680.609" dy="0">1</tspan></text><rect x="711.655" y="343" width="54.092" height="2" rx="3" fill="#087f8c"/><text x="738.701" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="738.701" dy="0">0</tspan></text><text x="709.655" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Retorno comprobado</tspan></text><rect x="793.793" y="95" width="54.092" height="250" rx="3" fill="#c0432f"/><text x="820.839" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.839" dy="0">1</tspan></text><rect x="851.885" y="343" width="54.092" height="2" rx="3" fill="#087f8c"/><text x="878.931" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="878.931" dy="0">0</tspan></text><text x="849.885" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="849.885" dy="0">Sin excepción</tspan></text><text x="849.885" y="383" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="849.885" dy="0">vacía</tspan></text><rect x="10" y="414" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="438.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las reglas se inspiran en las diez reglas de Holzmann para código de misión crítica (NASA/JPL) y se implementan sobre el</tspan></text><text x="470" y="455.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">árbol sintáctico de Python. Una regla mecánica también da falsos positivos: la recursión acotada por la profundidad de un</tspan></text><text x="470" y="472.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">árbol dispara el aviso de recursión aunque sea segura.</tspan></text><text x="470" y="519.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten con la misma semilla.</tspan></text></svg>
