<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 371" width="820" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto cuesta esperar según el orden</title><desc id="d">Tabla con 3 000 carteras sintéticas de 12 iniciativas: el orden de llegada cuesta de media 1,8 veces el óptimo y 2,61 veces en el percentil 95, lo más corto primero 1,3 y 1,66, el mayor costo de demora primero 1,13 y 1,26, y el costo de demora dividido por la duración 1 y 1 por ser el óptimo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="371" fill="#ffffff"/><rect x="10" y="12" width="306" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="163" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="163" dy="0">Orden de ejecución</tspan></text><rect x="322" y="12" width="301" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472.5" dy="0">Costo medio frente al óptimo</tspan></text><rect x="629" y="12" width="175" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="716.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="716.5" dy="0">Peor caso (p95)</tspan></text><rect x="10" y="56" width="306" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="163" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="163" dy="0">Orden de llegada</tspan></text><rect x="322" y="56" width="301" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472.5" dy="0">1,80</tspan></text><rect x="629" y="56" width="175" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="716.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="716.5" dy="0">2,61</tspan></text><rect x="10" y="106" width="306" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="163" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="163" dy="0">Lo más corto primero</tspan></text><rect x="322" y="106" width="301" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472.5" dy="0">1,30</tspan></text><rect x="629" y="106" width="175" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="716.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="716.5" dy="0">1,66</tspan></text><rect x="10" y="156" width="306" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="163" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="163" dy="0">Mayor costo de demora primero</tspan></text><rect x="322" y="156" width="301" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472.5" dy="0">1,13</tspan></text><rect x="629" y="156" width="175" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="716.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="716.5" dy="0">1,26</tspan></text><rect x="10" y="206" width="306" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="163" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="163" dy="0">Costo de demora entre duración</tspan></text><rect x="322" y="206" width="301" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472.5" dy="0">1,00</tspan></text><rect x="629" y="206" width="175" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="716.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="716.5" dy="0">1,00</tspan></text><rect x="10" y="260" width="800" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="410" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">Esperar sin criterio cuesta un 80 % más que el óptimo de media y más del doble en una de cada veinte</tspan></text><text x="410" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">carteras; ordenar solo por valor o solo por duración recupera buena parte, pero no todo. La última fila es</tspan></text><text x="410" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">1,00 por construcción: es el orden que minimiza el costo.</tspan></text><text x="410" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
