<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 421" width="820" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Propio o nube, y cuántas personas hacen falta</title><desc id="d">Tabla con el cruce entre servidores propios y nube en el mes 33 sin descuento y el mes 39 con una tasa mensual de 0,8 por ciento, un equilibrio de 6 250 personas usuarias con márgenes de menos 86,7, 0, 30 y 63,3 por ciento para 3 000, 6 250, 10 000 y 30 000, y una probabilidad de alcanzar el equilibrio en 12 meses de 0, 52,5 y 99,3 por ciento desde 2 000, 4 000 y 6 000 personas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="421" fill="#ffffff"/><rect x="10" y="12" width="442" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="231" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="231" dy="0">Pregunta</tspan></text><rect x="458" y="12" width="346" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="631" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="631" dy="0">Resultado</tspan></text><rect x="10" y="56" width="442" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="231" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231" dy="0">Mes en que lo propio acumula menos costo (sin descontar)</tspan></text><rect x="458" y="56" width="346" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="631" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="631" dy="0">33</tspan></text><rect x="10" y="106" width="442" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="231" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231" dy="0">Mes con tasa mensual de 0,8 %</tspan></text><rect x="458" y="106" width="346" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="631" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="631" dy="0">39</tspan></text><rect x="10" y="156" width="442" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="231" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231" dy="0">Personas usuarias de equilibrio (20 000 / (4 − 0,8))</tspan></text><rect x="458" y="156" width="346" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="631" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="631" dy="0">6 250</tspan></text><rect x="10" y="206" width="442" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="231" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231" dy="0">Margen con 3 000 · 6 250 · 10 000 · 30 000 personas</tspan></text><rect x="458" y="206" width="346" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="631" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="631" dy="0">−86,7 % · 0 % · 30,0 % · 63,3 %</tspan></text><rect x="10" y="256" width="442" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="231" y="273.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231" dy="0">Probabilidad de alcanzar el equilibrio en 12 meses desde</tspan></text><text x="231" y="289.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231" dy="0">2 000 · 4 000 · 6 000</tspan></text><rect x="458" y="256" width="346" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="631" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="631" dy="0">0,0 % · 52,5 % · 99,3 %</tspan></text><rect x="10" y="310" width="800" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="410" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">Descontar retrasa seis meses el cruce, porque la inversión inicial pesa más que las cuotas futuras. El</tspan></text><text x="410" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">equilibrio de 6 250 personas separa a un servicio que pierde de uno que gana, pero alcanzarlo en un año es</tspan></text><text x="410" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">casi imposible desde 2 000 personas y casi seguro desde 6 000.</tspan></text><text x="410" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
