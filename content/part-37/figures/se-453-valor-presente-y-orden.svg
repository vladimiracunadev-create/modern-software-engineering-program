<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 954 321" width="954" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuándo un proyecto deja de ser el mejor</title><desc id="d">Tabla con tres proyectos sintéticos con inversión de 100: Automatizar el cierre suma 60, tiene valor presente de 43,2 a 5 por ciento, 29,2 a 10, 7,4 a 20 y menos 8,6 a 30, retorno de 24,3 por ciento y recuperación en el año 2; Rediseñar el módulo suma 110 con 74,3, 46,3, 6,5 y menos 19,7, retorno de 22,1 y recuperación en el año 4; Plataforma interna suma 140 con 88, 49, menos 3,5 y menos 35,4, retorno de 19,1 y recuperación en el año 5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="954" height="321" fill="#ffffff"/><rect x="10" y="12" width="179" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="99.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="99.5" dy="0">Proyecto</tspan></text><rect x="195" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="277" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="277" dy="0">Suma sin descontar</tspan></text><rect x="365" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="407" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407" dy="0">VAN 5 %</tspan></text><rect x="455" y="12" width="86" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="498" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="498" dy="0">VAN 10 %</tspan></text><rect x="547" y="12" width="86" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="590" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="590" dy="0">VAN 20 %</tspan></text><rect x="639" y="12" width="86" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">VAN 30 %</tspan></text><rect x="731" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="773" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="773" dy="0">TIR</tspan></text><rect x="821" y="12" width="117" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="879.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="879.5" dy="0">Recuperación</tspan></text><rect x="10" y="56" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99.5" dy="0">Automatizar el cierre</tspan></text><rect x="195" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">60</tspan></text><rect x="365" y="56" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">43,2</tspan></text><rect x="455" y="56" width="86" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="498" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498" dy="0">29,2</tspan></text><rect x="547" y="56" width="86" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="590" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590" dy="0">7,4</tspan></text><rect x="639" y="56" width="86" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">−8,6</tspan></text><rect x="731" y="56" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="773" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="773" dy="0">24,3 %</tspan></text><rect x="821" y="56" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="879.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="879.5" dy="0">año 2</tspan></text><rect x="10" y="106" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99.5" dy="0">Rediseñar el módulo</tspan></text><rect x="195" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">110</tspan></text><rect x="365" y="106" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">74,3</tspan></text><rect x="455" y="106" width="86" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="498" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498" dy="0">46,3</tspan></text><rect x="547" y="106" width="86" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="590" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590" dy="0">6,5</tspan></text><rect x="639" y="106" width="86" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">−19,7</tspan></text><rect x="731" y="106" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="773" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="773" dy="0">22,1 %</tspan></text><rect x="821" y="106" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="879.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="879.5" dy="0">año 4</tspan></text><rect x="10" y="156" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99.5" dy="0">Plataforma interna</tspan></text><rect x="195" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">140</tspan></text><rect x="365" y="156" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">88,0</tspan></text><rect x="455" y="156" width="86" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="498" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498" dy="0">49,0</tspan></text><rect x="547" y="156" width="86" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="590" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590" dy="0">−3,5</tspan></text><rect x="639" y="156" width="86" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">−35,4</tspan></text><rect x="731" y="156" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="773" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="773" dy="0">19,1 %</tspan></text><rect x="821" y="156" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="879.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="879.5" dy="0">año 5</tspan></text><rect x="10" y="210" width="934" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="477" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="477" dy="0">A tasas del 5 % y del 10 %, la plataforma interna es la mejor por VAN; a partir del 20 % pasa a ser la peor y el primero es</tspan></text><text x="477" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="477" dy="0">«Automatizar el cierre». La suma sin descontar y el VAN a tasa baja favorecen lo tardío; la TIR y la recuperación favorecen</tspan></text><text x="477" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="477" dy="0">lo temprano.</tspan></text><text x="477" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="477" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
