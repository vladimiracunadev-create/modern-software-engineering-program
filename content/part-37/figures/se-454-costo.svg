<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 559" width="940" height="559" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pruebas necesarias para cubrir una decisión con n condiciones: mínimo de MC/DC (n + 1) y combinaciones exhaustivas</title><desc id="d">Líneas en escala logarítmica con el número de pruebas para n de 1 a 8 condiciones: MC/DC necesita n + 1, de 2 a 9, y el recorrido exhaustivo 2 elevado a n, de 2 a 256.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="559" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pruebas necesarias para cubrir una decisión con n condiciones: mínimo de MC/DC (n + 1) y combinaciones</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">exhaustivas</tspan></text><circle cx="22" cy="70" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">MC/DC (n + 1)</tspan></text><rect x="162.02" y="64" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="182.02" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Exhaustivo (2 a la n)</tspan></text><line x1="78.62" y1="376" x2="910" y2="376" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="376" x2="78.62" y2="376" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="380.5" font-size="13" text-anchor="end" font-weight="400" fill="#142