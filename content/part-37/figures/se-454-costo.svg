oke-width="2"/><circle cx="437.497" cy="281.639" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="551.123" cy="270.95" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="664.749" cy="261.912" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="778.374" cy="254.083" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="892" cy="247.177" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polyline points="96.62,335.361 210.246,294.722 323.871,254.083 437.497,213.444 551.123,172.805 664.749,132.166 778.374,91.5267 892,50.8876" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="329.861" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="204.746" y="289.222" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="318.371" y="248.583" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="431.997" y="207.944" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="545.623" y="167.305" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="659.249" y="126.666" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="772.874" y="86.0267" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="886.5" y="45.3876" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="10" y="436" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="460.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 4 condiciones son 5 pruebas frente a 16; con 8, 9 frente a 256. El mínimo n + 1 vale cuando existen vectores que aíslan</tspan></text><text x="470" y="477.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cada condición; con condiciones acopladas (la misma variable en dos condiciones) el mínimo es mayor o imposible. La</tspan></text><text x="470" y="494.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cantidad se cuenta con la definición de independencia de causa única.</tspan></text><text x="470" y="541.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
