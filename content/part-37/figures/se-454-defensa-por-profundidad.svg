<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 868 355" width="868" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué impresión deja cada estrategia de defensa</title><desc id="d">Tabla con una persona que responde seis preguntas de profundidad creciente: con conocimiento de nivel 2 defender todo con seguridad deja una impresión de menos 4,8 y se descubre un error seguro en el 98,4 por ciento de los casos, mientras que declarar el límite deja 2,3 y 0 por ciento; con conocimiento de nivel 4 defender todo deja 0,56 y 87,1 por ciento y declarar el límite 4,3 y 0 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="868" height="355" fill="#ffffff"/><rect x="10" y="12" width="117" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="68.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="68.5" dy="0">Conocimiento</tspan></text><rect x="133" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="295" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="295" dy="0">Estrategia</tspan></text><rect x="463" y="12" width="141" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="533.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="533.5" dy="0">Impresión media</tspan></text><rect x="610" y="12" width="242" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="731" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="731" dy="0">Detectada en un error seguro</tspan></text><rect x="10" y="56" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="68.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="68.5" dy="0">Nivel 2</tspan></text><rect x="133" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="295" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295" dy="0">Defiende todo con seguridad</tspan></text><rect x="463" y="56" width="141" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="533.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="533.5" dy="0">−4,8</tspan></text><rect x="610" y="56" width="242" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="731" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="731" dy="0">98,4 %</tspan></text><rect x="10" y="106" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="68.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="68.5" dy="0">Nivel 2</tspan></text><rect x="133" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="295" y="123.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295" dy="0">Declara su límite y propone cómo</tspan></text><text x="295" y="139.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295" dy="0">comprobar</tspan></text><rect x="463" y="106" width="141" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="533.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="533.5" dy="0">2,3</tspan></text><rect x="610" y="106" width="242" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="731" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="731" dy="0">0 %</tspan></text><rect x="10" y="156" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="68.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="68.5" dy="0">Nivel 4</tspan></text><rect x="133" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="295" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295" dy="0">Defiende todo con seguridad</tspan></text><rect x="463" y="156" width="141" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="533.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="533.5" dy="0">0,56</tspan></text><rect x="610" y="156" width="242" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="731" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="731" dy="0">87,1 %</tspan></text><rect x="10" y="206" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="68.5" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="68.5" dy="0">Nivel 4</tspan></text><rect x="133" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="295" y="223.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295" dy="0">Declara su límite y propone cómo</tspan></text><text x="295" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295" dy="0">comprobar</tspan></text><rect x="463" y="206" width="141" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="533.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="533.5" dy="0">4,3</tspan></text><rect x="610" y="206" width="242" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="731" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="731" dy="0">0 %</tspan></text><rect x="10" y="260" width="848" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="434" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="434" dy="0">Con conocimiento de nivel 4, defender todo deja una impresión cercana a cero; declarar el límite, de 4,3. Con</tspan></text><text x="434" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="434" dy="0">nivel 2 la diferencia es mayor, porque hay más preguntas en que inventar.</tspan></text><text x="434" y="341.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="434" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
