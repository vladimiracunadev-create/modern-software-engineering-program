<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 499" width="940" height="499" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutantes de una decisión de cuatro condiciones que matan los conjuntos mínimos de cada criterio (17 mutantes en total)</title><desc id="d">Intervalos con el mínimo, la media y el máximo de mutantes muertos sobre 17: cobertura de decisión de 4 a 13 con media 8,3; cobertura de condiciones de 3 a 8 con media 5,6; MC/DC de 17 a 17 con media 17.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="499" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mutantes de una decisión de cuatro condiciones que matan los conjuntos mínimos de cada criterio (17 mutantes</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">en total)</tspan></text><rect x="16" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mín</tspan></text><polygon points="92.62,63.1 99.22,75.4 86.02,75.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="106.62" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="106.62" dy="0">media</tspan></text><polygon points="178.32,62.5 185.82,70 178.32,77.5 170.82,70" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="192.32" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="192.32" dy="0">máx</tspan></text><line x1="334" y1="96" x2="334" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="334" y1="318" x2="334" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="334" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334" dy="0">0</tspan></text><line x1="473" y1="96" x2="473" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="473" y1="318" x2="473" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="473" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="473" dy="0">5</tspan></text><line x1="612" y1="96" x2="612" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="612" y1="318" x2="612" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="612" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">10</tspan></text><line x1="751" y1="96" x2="751" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="751" y1="318" x2="751" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="751" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">15</tspan></text><line x1="890" y1="96" x2="890" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="318" x2="890" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">20</tspan></text><line x1="334" y1="318" x2="890" y2="318" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="137.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Decisión (2 pruebas, 39 conjuntos)</tspan></text><text x="304" y="211.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Condiciones (2 pruebas, 8 conjuntos)</tspan></text><text x="304" y="285.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">MC/DC (5 pruebas, 4 conjuntos)</tspan></text><line x1="445.2" y1="133" x2="695.4" y2="133" stroke="#8a9aa3" stroke-width="5"/><rect x="438.2" y="126" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="445.2" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="445.2" dy="0">4,0</tspan></text><polygon points="564.74,124.95 572.44,139.3 557.04,139.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="564.74" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="564.74" dy="0">8,3</tspan></text><polygon points="695.4,124.25 704.15,133 695.4,141.75 686.65,133" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="695.4" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="695.4" dy="0">13,0</tspan></text><line x1="417.4" y1="207" x2="556.4" y2="207" stroke="#8a9aa3" stroke-width="5"/><rect x="410.4" y="200" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="417.4" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.4" dy="0">3,0</tspan></text><polygon points="489.68,198.95 497.38,213.3 481.98,213.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="489.68" y="236" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="489.68" dy="0">5,6</tspan></text><polygon points="556.4,198.25 565.15,207 556.4,215.75 547.65,207" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="556.4" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.4" dy="0">8,0</tspan></text><line x1="806.6" y1="281" x2="806.6" y2="281" stroke="#8a9aa3" stroke-width="5"/><polygon points="806.6,272.25 815.35,281 806.6,289.75 797.85,281" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="806.6,272.95 814.3,287.3 798.9,287.3" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="799.6" y="274" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="806.6" y="265" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="806.6" dy="0">17,0 · mín, media, máx</tspan></text><line x1="806.6" y1="96" x2="806.6" y2="318" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="811.6" y="109" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="811.6" dy="0">17</tspan></text><text x="612" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="612" dy="0">Mutantes muertos de 17</tspan></text><rect x="10" y="376" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="400.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">De los 8 conjuntos mínimos de cobertura de condiciones, 5 nunca cambian el resultado de la decisión. Los 4 conjuntos</tspan></text><text x="470" y="417.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">mínimos de MC/DC (5 pruebas, n + 1) matan los 17 mutantes de esta decisión, igual que los 16 vectores. Los mutantes los</tspan></text><text x="470" y="434.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">escribió el autor: la ventaja se mide aquí, no se generaliza a otros programas.</tspan></text><text x="470" y="481.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten con la misma semilla.</tspan></text></svg>
