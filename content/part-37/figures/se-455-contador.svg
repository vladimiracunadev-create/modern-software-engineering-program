<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Modelo del contador de un byte: pasadas de 100 000 en las que se omite la comprobación del colimador</title><desc id="d">Barras con las pasadas sin comprobación: 390 de 100 000 si la variable se incrementa y vuelve a cero cada 256 pasadas, y 0 si se asigna un valor fijo distinto de cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Modelo del contador de un byte: pasadas de 100 000 en las que se omite la comprobación del colimador</tspan></text><line x1="78.62" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="307" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="247" x2="920" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="247" x2="78.62" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="187" x2="920" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="187" x2="78.62" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="127" x2="920" y2="127" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="127" x2="78.62" y2="127" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="131.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">Pasadas de 100 000</text><rect x="120.689" y="73" width="336.552" height="234" rx="3" fill="#c0432f"/><text x="288.965" y="67" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="288.965" dy="0">390</tspan></text><text x="288.965" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Incrementar la variable</tspan></text><rect x="541.379" y="305" width="336.552" height="2" rx="3" fill="#c0432f"/><text x="709.655" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.655" dy="0">0</tspan></text><text x="709.655" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Asignar un valor fijo</tspan></text><rect x="10" y="359" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una pasada de cada 256 es el 0,39 %: pequeño, pero la rutina se ejecuta cientos de veces por puesta a punto. Un invariante</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">enunciado («vale cero solo si todo está bien») y una prueba que ejecute más de 256 pasadas lo habrían hecho visible. La</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">probabilidad real por tratamiento no puede estimarse con los datos publicados.</tspan></text><text x="470" y="464.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
