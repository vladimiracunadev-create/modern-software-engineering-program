<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" width="940" height="566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Modelo de la carrera de edición del Therac-25: 100 000 tratamientos con 15 % de ediciones y un ajuste de 8 segundos</title><desc id="d">Barras con las configuraciones inconsistentes y las exposiciones peligrosas de tres variantes: la original 5705 y 5705, con enclavamiento de hardware 5627 y 58, y con parámetros versionados 0 y 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="566" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Modelo de la carrera de edición del Therac-25: 100 000 tratamientos con 15 % de ediciones y un ajuste de 8</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">segundos</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Configuraciones inconsistentes</tspan></text><rect x="290.2" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="310.2" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310.2" dy="0">Exposiciones peligrosas</tspan></text><line x1="93.7" y1="374" x2="920" y2="374" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="374" x2="93.7" y2="374" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="378.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="287.333" x2="920" y2="287.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="287.333" x2="93.7" y2="287.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="291.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="200.667" x2="920" y2="200.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="200.667" x2="93.7" y2="200.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="205.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">4 000</tspan></text><line x1="93.7" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="114" x2="93.7" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">6 000</tspan></text><line x1="93.7" y1="114" x2="93.7" y2="374" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 244)">Tratamientos de 100 000</text><rect x="121.243" y="126.783" width="108.173" height="247.217" rx="3" fill="#946512"/><text x="175.33" y="120.783" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.33" dy="0">5 705</tspan></text><rect x="233.417" y="126.783" width="108.173" height="247.217" rx="3" fill="#c0432f"/><text x="287.503" y="120.783" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287.503" dy="0">5 705</tspan></text><text x="231.417" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Original</tspan></text><rect x="396.677" y="130.163" width="108.173" height="243.837" rx="3" fill="#946512"/><text x="450.763" y="124.163" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.763" dy="0">5 627</tspan></text><rect x="508.85" y="371.487" width="108.173" height="2.51333" rx="3" fill="#c0432f"/><text x="562.937" y="365.487" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.937" dy="0">58</tspan></text><text x="506.85" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Con enclavamiento de hardware</tspan></text><rect x="672.11" y="372" width="108.173" height="2" rx="3" fill="#946512"/><text x="726.197" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.197" dy="0">0</tspan></text><rect x="784.283" y="372" width="108.173" height="2" rx="3" fill="#c0432f"/><text x="838.37" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.37" dy="0">0</tspan></text><text x="782.283" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Parámetros versionados</tspan></text><rect x="10" y="426" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="450.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El enclavamiento de hardware no evita la inconsistencia: reduce la exposición porque falla con una probabilidad del autor</tspan></text><text x="470" y="467.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del 1 %. Versionar los parámetros elimina la clase de defecto en este modelo. Es un modelo inspirado en los hechos</tspan></text><text x="470" y="484.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">publicados por Leveson y Turner, no la reconstrucción del código de la máquina; la probabilidad de edición y el reparto de</tspan></text><text x="470" y="500.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">tiempos son supuestos.</tspan></text><text x="470" y="548.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
