<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 529" width="940" height="529" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tras editar el texto de un requisito sin rehacer la evidencia: huecos de contenido y archivos que ya no coinciden con el manifiesto</title><desc id="d">Barras con huecos de contenido, 3 antes y 3 después de editar REQ-02, y archivos de evidencia que no coinciden con el manifiesto de resúmenes SHA-256: 0 antes y 1 después.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="529" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tras editar el texto de un requisito sin rehacer la evidencia: huecos de contenido y archivos que ya no</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">coinciden con el manifiesto</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Huecos de contenido</tspan></text><rect x="207.26" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="227.26" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Archivos que no coinciden con el manifiesto</tspan></text><line x1="63.54" y1="354" x2="920" y2="354" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="354" x2="63.54" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="358.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="274" x2="920" y2="274" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="274" x2="63.54" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="278.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="194" x2="920" y2="194" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="194" x2="63.54" y2="194" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="198.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="114" x2="63.54" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="114" x2="63.54" y2="354" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="234" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 234)">Elementos</text><rect x="106.363" y="114" width="169.292" height="240" rx="3" fill="#946512"/><text x="191.009" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="191.009" dy="0">3</tspan></text><rect x="279.655" y="352" width="169.292" height="2" rx="3" fill="#c0432f"/><text x="364.301" y="346" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="364.301" dy="0">0</tspan></text><text x="277.655" y="375" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">Antes de editar REQ-02</tspan></text><rect x="534.593" y="114" width="169.292" height="240" rx="3" fill="#946512"/><text x="619.239" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="619.239" dy="0">3</tspan></text><rect x="707.885" y="274" width="169.292" height="80" rx="3" fill="#c0432f"/><text x="792.531" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="792.531" dy="0">1</tspan></text><text x="705.885" y="375" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">Después de editar REQ-02</tspan></text><rect x="10" y="406" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="430.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las comprobaciones de contenido no ven el cambio porque todas las referencias siguen existiendo; el manifiesto sí. Dice que</tspan></text><text x="470" y="447.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la evidencia ya no es la que se revisó y no si la prueba sigue valiendo: esa decisión es de una persona. Sin manifiesto, un</tspan></text><text x="470" y="464.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">paquete puede quedar verde con evidencia de una versión anterior.</tspan></text><text x="470" y="511.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten con la misma semilla.</tspan></text></svg>
