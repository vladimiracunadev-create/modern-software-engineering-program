<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 255" width="820" height="255" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas afirmaciones se comprueban en una hora</title><desc id="d">Tabla con 5 000 revisiones simuladas de 60 minutos sobre un dossier de 30 afirmaciones: sin trazabilidad se comprueban 5,7 afirmaciones de media, entre 4 y 7 en los percentiles 10 y 90, y con una tabla de afirmación, evidencia y huella 21,7, entre 19 y 24.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="255" fill="#ffffff"/><rect x="10" y="12" width="325" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172.5" dy="0">Dossier</tspan></text><rect x="341" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="518" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="518" dy="0">Afirmaciones comprobadas en 60 minutos</tspan></text><text x="518" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="518" dy="0">(media)</tspan></text><rect x="701" y="12" width="103" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752.5" dy="0">p10 – p90</tspan></text><rect x="10" y="56" width="325" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172.5" dy="0">Sin trazabilidad</tspan></text><rect x="341" y="56" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="518" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="518" dy="0">5,7</tspan></text><rect x="701" y="56" width="103" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752.5" dy="0">4 – 7</tspan></text><rect x="10" y="106" width="325" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172.5" dy="0">Con tabla afirmación–evidencia–huella</tspan></text><rect x="341" y="106" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="518" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="518" dy="0">21,7</tspan></text><rect x="701" y="106" width="103" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752.5" dy="0">19 – 24</tspan></text><rect x="10" y="160" width="800" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="410" y="184.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">La tabla multiplica por casi cuatro lo que se puede comprobar en una hora; incluso así, no se llega a las</tspan></text><text x="410" y="201.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">treinta, por lo que el verificador automático sigue siendo necesario.</tspan></text><text x="410" y="241.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
