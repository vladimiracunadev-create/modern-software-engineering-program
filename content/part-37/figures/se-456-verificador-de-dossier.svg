<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 943 471" width="943" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué detecta el verificador</title><desc id="d">Tabla con seis variantes sintéticas de un dossier verificadas por un script: la completa no tiene defectos, la que no tiene límites se detecta por tener menos de tres, la que tiene una afirmación sin evidencia se detecta en C5, la de evidencia alterada en C2, la de evidencia borrada en C3 y la de cifra distinta se detecta por el conflicto en el costo a cinco años pero no por la guardia de cinco o seis personas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="943" height="471" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Variante</tspan></text><rect x="210" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">Defecto introducido</tspan></text><rect x="540" y="12" width="209" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="644.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="644.5" dy="0">Defectos detectados</tspan></text><rect x="755" y="12" width="172" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="841" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="841" dy="0">Cifras en conflicto</tspan></text><rect x="10" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Completo</tspan></text><rect x="210" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">ninguno</tspan></text><rect x="540" y="56" width="209" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="644.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="644.5" dy="0">ninguno</tspan></text><rect x="755" y="56" width="172" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="841" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="841" dy="0">ninguna</tspan></text><rect x="10" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Sin límites</tspan></text><rect x="210" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">LIMITES.md sin límites</tspan></text><rect x="540" y="106" width="209" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="644.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="644.5" dy="0">menos de 3 límites</tspan></text><rect x="755" y="106" width="172" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="841" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="841" dy="0">ninguna</tspan></text><rect x="10" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Afirmación sin respaldo</tspan></text><rect x="210" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">C5 sin evidencia</tspan></text><rect x="540" y="156" width="209" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="644.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="644.5" dy="0">C5 sin evidencia</tspan></text><rect x="755" y="156" width="172" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="841" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="841" dy="0">ninguna</tspan></text><rect x="10" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Evidencia alterada</tspan></text><rect x="210" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">e2.txt cambiado tras la huella</tspan></text><rect x="540" y="206" width="209" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="644.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="644.5" dy="0">C2 con evidencia alterada</tspan></text><rect x="755" y="206" width="172" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="841" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="841" dy="0">ninguna</tspan></text><rect x="10" y="256" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Evidencia faltante</tspan></text><rect x="210" y="256" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">e3.txt borrado</tspan></text><rect x="540" y="256" width="209" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="644.5" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="644.5" dy="0">C3 con evidencia ausente</tspan></text><rect x="755" y="256" width="172" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="841" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="841" dy="0">ninguna</tspan></text><rect x="10" y="306" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Cifra distinta</tspan></text><rect x="210" y="306" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="323.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">costo 1 020 frente a 1 200 y guardia 5</tspan></text><text x="372" y="339.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">frente a 6</tspan></text><rect x="540" y="306" width="209" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="644.5" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="644.5" dy="0">ninguno</tspan></text><rect x="755" y="306" width="172" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="841" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="841" dy="0">TCO_5A</tspan></text><rect x="10" y="360" width="923" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="471.5" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="471.5" dy="0">Cada variante tiene un defecto distinto y el verificador lo señala con la afirmación o el archivo exactos. La última fila</tspan></text><text x="471.5" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="471.5" dy="0">muestra el límite: se introdujeron dos incoherencias y se detectó una; la otra (personas de guardia, 5 en riesgos y 6 en el</tspan></text><text x="471.5" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="471.5" dy="0">`README`) no se vio porque la cifra del `README` no estaba etiquetada.</tspan></text><text x="471.5" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="471.5" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
