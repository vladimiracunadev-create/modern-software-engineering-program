<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">300 cambios en un año, 24 cruzan una frontera de confianza: días con la frontera sin modelar</title><desc id="d">Barras horizontales con los días que una frontera nueva queda sin modelar según la política de revisión: una sola revisión inicial 209,3 de media y 364 de máximo, trimestral 53,3 y 89, por cambio de frontera 103,0 y 364, y por cambio más trimestral 25,0 y 88.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">300 cambios en un año, 24 cruzan una frontera de confianza: días con la frontera sin modelar</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Días sin modelar, media</tspan></text><rect x="237.42" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Máximo</tspan></text><line x1="344" y1="77" x2="344" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="333" x2="344" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0</tspan></text><line x1="476.925" y1="77" x2="476.925" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="476.925" y1="333" x2="476.925" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="476.925" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="476.925" dy="0">100</tspan></text><line x1="609.85" y1="77" x2="609.85" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="609.85" y1="333" x2="609.85" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="609.85" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="609.85" dy="0">200</tspan></text><line x1="742.775" y1="77" x2="742.775" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="742.775" y1="333" x2="742.775" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="742.775" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742.775" dy="0">300</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="333" x2="875.7" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">400</tspan></text><line x1="344" y1="333" x2="875.7" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="334" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Revisar el modelo una sola vez al empezar</tspan></text><text x="334" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Revisión trimestral (días 90, 180, 270 y</tspan></text><text x="334" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">360)</tspan></text><text x="334" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Revisión al cambiar una frontera (la regla</tspan></text><text x="334" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">ve 12 de 24)</tspan></text><text x="334" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Por cambio de frontera y además trimestral</tspan></text><rect x="344" y="83" width="278.212" height="24.5" rx="3" fill="#087f8c"/><text x="629.212" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="629.212" dy="0">209,3</tspan></text><rect x="344" y="110.5" width="483.847" height="24.5" rx="3" fill="#c0432f"/><text x="834.847" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="834.847" dy="0">364</tspan></text><rect x="344" y="147" width="70.849" height="24.5" rx="3" fill="#087f8c"/><text x="421.849" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="421.849" dy="0">53,3</tspan></text><rect x="344" y="174.5" width="118.303" height="24.5" rx="3" fill="#c0432f"/><text x="469.303" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="469.303" dy="0">89</tspan></text><rect x="344" y="211" width="136.913" height="24.5" rx="3" fill="#087f8c"/><text x="487.913" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="487.913" dy="0">103,0</tspan></text><rect x="344" y="238.5" width="483.847" height="24.5" rx="3" fill="#c0432f"/><text x="834.847" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="834.847" dy="0">364</tspan></text><rect x="344" y="275" width="33.2312" height="24.5" rx="3" fill="#087f8c"/><text x="384.231" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="384.231" dy="0">25,0</tspan></text><rect x="344" y="302.5" width="116.974" height="24.5" rx="3" fill="#c0432f"/><text x="467.974" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="467.974" dy="0">88</tspan></text><text x="609.85" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="609.85" dy="0">días con la frontera sin modelar</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Ninguna política llega a cero: el disparador por cambio solo acierta donde la regla ve la frontera (12 de 24 en esta</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">simulación) y la revisión periódica acota lo que la regla no ve. La combinación es la única que cierra el peor caso por</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">debajo de los 90 días.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
