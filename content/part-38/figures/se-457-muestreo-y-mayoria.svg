iddle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">25,5</tspan></text><polyline points="96.62,380.4 402.535,312.6 586.085,304.2 892,307.8" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="96.62,374.075 102.67,385.35 90.57,385.35" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="106.62" y="384.9" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="106.62" dy="0">2,2</tspan></text><polygon points="402.535,306.275 408.585,317.55 396.485,317.55" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="402.535" y="336.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="402.535" dy="0">24,8</tspan></text><polygon points="586.085,297.875 592.135,309.15 580.035,309.15" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="586.085" y="328.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="586.085" dy="0">27,6</tspan></text><polygon points="892,301.475 898.05,312.75 885.95,312.75" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="331.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">26,4</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con temperatura baja el modelo repite con firmeza la respuesta más probable, que aquí es la incorrecta, y el voto de</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">mayoría la confirma. Generar varias muestras ayuda a encontrar una correcta solo si algo externo (una prueba) puede</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reconocerla. Los logits son un supuesto del autor, no un modelo real.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
