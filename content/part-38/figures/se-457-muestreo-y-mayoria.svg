<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco respuestas candidatas: la correcta es la segunda más probable (20 000 muestras por temperatura)</title><desc id="d">Líneas con el acierto según la temperatura: con una muestra pasa de 11,4 % a temperatura 0,2 a 27,6 % con 0,7; el voto de mayoría de cinco pasa de 2,2 % a 24,8 %; que alguna de cinco sea correcta pasa de 45,8 % a 80,4 %; con temperatura baja la mayoría confirma la respuesta equivocada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco respuestas candidatas: la correcta es la segunda más probable (20 000 muestras por temperatura)</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Alguna de 5 correcta</tspan></text><rect x="214.8" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Una muestra</tspan></text><polygon points="351.74,44.1 358.34,56.4 345.14,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="365.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="365.74" dy="0">Mayoría de 5</tspan></text><line x1="78.62" y1="387" x2="910" y2