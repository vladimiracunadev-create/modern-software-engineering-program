<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 263" width="940" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coincidencia de las cinco amenazas más graves entre tres revisores (30 amenazas, 300 repeticiones)</title><desc id="d">Barras: dos revisores que puntúan las mismas 30 amenazas con impacto por probabilidad coinciden en 46,4 por ciento de sus cinco más graves; con tres preguntas de sí o no coinciden en 54,1 por ciento; el azar daría 16,7 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="263" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Coincidencia por azar (5 de 30)</tspan></text><rect x="310" y="16" width="150.3" height="28" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="468.3" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="468.3" dy="0">16,7 %</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Impacto × probabilidad (escala 1–5)</tspan></text><rect x="310" y="60" width="417.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="735.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="735.6" dy="0">46,4 %</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Tres preguntas de sí o no</tspan></text><rect x="310" y="104" width="486.9" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="804.9" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="804.9" dy="0">54,1 %</tspan></text><rect x="10" y="152" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con ruido de un punto en cada escala, dos revisores comparten menos de la mitad de su top 5. Las preguntas de sí o no</tspan></text><text x="470" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mejoran poco (la correlación de rangos pasa de 0,41 a 0,43): el beneficio principal es que cada respuesta se puede discutir</tspan></text><text x="470" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y verificar. El ruido, 0,9 puntos, y el 10 % de respuestas invertidas son supuestos del autor.</tspan></text><text x="470" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
