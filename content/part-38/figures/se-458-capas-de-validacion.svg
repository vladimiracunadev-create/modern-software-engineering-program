<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 495" width="940" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">200 salidas sintéticas con un defecto cada una: cuántas atrapa cada capa de validación</title><desc id="d">Mapa de calor con cuántas de las 200 salidas defectuosas detecta cada capa acumulada de validación: solo el formato detecta 68, con el rango 134 y con la coherencia 167; los dos decimales indebidos no los detecta ninguna capa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="495" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">200 salidas sintéticas con un defecto cada una: cuántas atrapa cada capa de validación</tspan></text><text x="628" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="628" dy="0">Casos detectados por cada capa acumulada</tspan></text><text x="433.333" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.333" dy="0">Solo formato</tspan></text><text x="628" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="628" dy="0">+ rango</tspan></text><text x="822.667" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="822.667" dy="0">+ coherencia</tspan></text><text x="326" y="119.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="326" dy="0">Texto antes del JSON (34)</tspan></text><text x="326" y="161.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="326" dy="0">Falta una clave (34)</tspan></text><text x="326" y="203.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="326" dy="0">Nota fuera de 1–7 (33)</tspan></text><text x="326" y="245.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="326" dy="0">Estado no permitido (33)</tspan></text><text x="326" y="287.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="326" dy="0">Estado contradice la nota (33)</tspan></text><text x="326" y="329.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="326" dy="0">Dos decimales indebidos (33)</tspan></text><rect x="337.5" y="95.5" width="191.667" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="433.333" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="433.333" dy="0">34</tspan></text><rect x="532.167" y="95.5" width="191.667" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="628" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="628" dy="0">34</tspan></text><rect x="726.833" y="95.5" width="191.667" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="822.667" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822.667" dy="0">34</tspan></text><rect x="337.5" y="137.5" width="191.667" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="433.333" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="433.333" dy="0">34</tspan></text><rect x="532.167" y="137.5" width="191.667" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="628" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="628" dy="0">34</tspan></text><rect x="726.833" y="137.5" width="191.667" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="822.667" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822.667" dy="0">34</tspan></text><rect x="337.5" y="179.5" width="191.667" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="433.333" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.333" dy="0">0</tspan></text><rect x="532.167" y="179.5" width="191.667" height="39" rx="4" fill="#0e828f" stroke="#ffffff" stroke-width="1"/><text x="628" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="628" dy="0">33</tspan></text><rect x="726.833" y="179.5" width="191.667" height="39" rx="4" fill="#0e828f" stroke="#ffffff" stroke-width="1"/><text x="822.667" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822.667" dy="0">33</tspan></text><rect x="337.5" y="221.5" width="191.667" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="433.333" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.333" dy="0">0</tspan></text><rect x="532.167" y="221.5" width="191.667" height="39" rx="4" fill="#0e828f" stroke="#ffffff" stroke-width="1"/><text x="628" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="628" dy="0">33</tspan></text><rect x="726.833" y="221.5" width="191.667" height="39" rx="4" fill="#0e828f" stroke="#ffffff" stroke-width="1"/><text x="822.667" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822.667" dy="0">33</tspan></text><rect x="337.5" y="263.5" width="191.667" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="433.333" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.333" dy="0">0</tspan></text><rect x="532.167" y="263.5" width="191.667" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="628" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="628" dy="0">0</tspan></text><rect x="726.833" y="263.5" width="191.667" height="39" rx="4" fill="#0e828f" stroke="#ffffff" stroke-width="1"/><text x="822.667" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822.667" dy="0">33</tspan></text><rect x="337.5" y="305.5" width="191.667" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="433.333" y="329.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.333" dy="0">0</tspan></text><rect x="532.167" y="305.5" width="191.667" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="628" y="329.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="628" dy="0">0</tspan></text><rect x="726.833" y="305.5" width="191.667" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="822.667" y="329.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="822.667" dy="0">0</tspan></text><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">Defecto (casos)</text><text x="336" y="372" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="336" dy="0">0</tspan></text><rect x="351.54" y="360" width="30.5" height="14" fill="#dff1ee"/><rect x="381.54" y="360" width="30.5" height="14" fill="#c0e1e0"/><rect x="411.54" y="360" width="30.5" height="14" fill="#a2d0d2"/><rect x="441.54" y="360" width="30.5" height="14" fill="#83c0c4"/><rect x="471.54" y="360" width="30.5" height="14" fill="#64b0b6"/><rect x="501.54" y="360" width="30.5" height="14" fill="#45a0a8"/><rect x="531.54" y="360" width="30.5" height="14" fill="#278f9a"/><rect x="561.54" y="360" width="30.5" height="14" fill="#087f8c"/><text x="599.54" y="372" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="599.54" dy="0">34</tspan></text><text x="622.62" y="372" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="622.62" dy="0">más oscuro = mayor (detectadas)</tspan></text><rect x="10" y="388" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="412.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tres capas baratas detectan 167 de 200; los 33 restantes cumplen todas las reglas escritas y siguen mal. Lo que ninguna</tspan></text><text x="470" y="429.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">regla enuncia no se comprueba. Los seis defectos y su reparto son del autor.</tspan></text><text x="470" y="477.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
