<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 531" width="940" height="531" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Robos de credencial con acceso del atacante de más de una hora, según el diseño y el tipo de robo</title><desc id="d">Barras agrupadas con el porcentaje de 20 000 robos simulados en que el atacante conserva acceso más de una hora. Con una copia filtrada: 100 % con una llave estática que rota cada 90 días y 0 % con un token de 1 h, con uno de 15 min y con un token atado a la clave del cliente. Con el equipo comprometido: 100 %, 98,1 %, 95,8 % y 95,0 % respectivamente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="531" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Robos de credencial con acceso del atacante de más de una hora, según el diseño y el tipo de robo</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Copia filtrada de la credencial</tspan></text><rect x="297.74" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="317.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="317.74" dy="0">Equipo comprometido</tspan></text><line x1="294" y1="77" x2="294" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="333" x2="294" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="439.425" y1="77" x2="439.425" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="439.425" y1="333" x2="439.425" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="439.425" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.425" dy="0">25</tspan></text><line x1="584.85" y1="77" x2="584.85" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="584.85" y1="333" x2="584.85" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="584.85" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="584.85" dy="0">50</tspan></text><line x1="730.275" y1="77" x2="730.275" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="730.275" y1="333" x2="730.275" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="730.275" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.275" dy="0">75</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="333" x2="875.7" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="294" y1="333" x2="875.7" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">A. Llave estática (rota a los 90</tspan></text><text x="284" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">días)</tspan></text><text x="284" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">B. Token portador de 1 h sin</tspan></text><text x="284" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">revocación</tspan></text><text x="284" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">C. Token portador de 15 min que se</tspan></text><text x="284" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">revoca al renovar</tspan></text><text x="284" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">D. Token de 1 h atado a la clave del</tspan></text><text x="284" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">cliente</tspan></text><rect x="294" y="83" width="581.7" height="24.5" rx="3" fill="#946512"/><text x="882.7" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="294" y="110.5" width="581.7" height="24.5" rx="3" fill="#c0432f"/><text x="882.7" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="294" y="147" width="2" height="24.5" rx="3" fill="#946512"/><text x="303" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0,0</tspan></text><rect x="294" y="174.5" width="570.648" height="24.5" rx="3" fill="#c0432f"/><text x="871.648" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="871.648" dy="0">98,1</tspan></text><rect x="294" y="211" width="2" height="24.5" rx="3" fill="#946512"/><text x="303" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0,0</tspan></text><rect x="294" y="238.5" width="557.269" height="24.5" rx="3" fill="#c0432f"/><text x="858.269" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="858.269" dy="0">95,8</tspan></text><rect x="294" y="275" width="2" height="24.5" rx="3" fill="#946512"/><text x="303" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0,0</tspan></text><rect x="294" y="302.5" width="552.615" height="24.5" rx="3" fill="#c0432f"/><text x="853.615" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="853.615" dy="0">95,0</tspan></text><text x="584.85" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">% de robos con acceso de más de 1 h</tspan></text><rect x="10" y="391" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La vida corta y el atado a la clave anulan casi por completo el robo de una copia, pero casi no cambian el del equipo</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comprometido: el atacante pide credenciales nuevas hasta que alguien lo detecta, y el 25 % de los robos no se detecta en 30</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">días en el modelo. Lo que acota ese caso es la velocidad de detección y lo que la identidad robada puede alcanzar</tspan></text><text x="470" y="465.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(microsegmentación), no el diseño de la credencial.</tspan></text><text x="470" y="513.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija (scripts/experiments_part38_ext.py), 20 000 robos por celda; los tiempos de detección son supuestos del autor.</tspan></text></svg>
