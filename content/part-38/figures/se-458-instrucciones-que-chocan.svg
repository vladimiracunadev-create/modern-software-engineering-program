<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 405" width="950" height="405" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que un conjunto de instrucciones no tenga ningún par en conflicto</title><desc id="d">Tabla con el número de instrucciones, el de pares y la probabilidad de que ninguno choque si cada par choca con probabilidad 0,5 por ciento o 2 por ciento: con 12 instrucciones 71,8 % y 26,4 %, y con 20 instrucciones 38,6 % y 2,2 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="405" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Instrucciones</tspan></text><rect x="200" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="297" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="297" dy="0">Pares posibles</tspan></text><rect x="400" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Sin conflicto (0,5 % por par)</tspan></text><rect x="680" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Sin conflicto (2 % por par)</tspan></text><rect x="10" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">3</tspan></text><rect x="200" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">3</tspan></text><rect x="400" y="56" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">98,5 %</tspan></text><rect x="680" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">94,1 %</tspan></text><rect x="10" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">5</tspan></text><rect x="200" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">10</tspan></text><rect x="400" y="106" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">95,1 %</tspan></text><rect x="680" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">81,7 %</tspan></text><rect x="10" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">8</tspan></text><rect x="200" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">28</tspan></text><rect x="400" y="156" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">86,9 %</tspan></text><rect x="680" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">56,8 %</tspan></text><rect x="10" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">12</tspan></text><rect x="200" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">66</tspan></text><rect x="400" y="206" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">71,8 %</tspan></text><rect x="680" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">26,4 %</tspan></text><rect x="10" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">20</tspan></text><rect x="200" y="256" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297" dy="0">190</tspan></text><rect x="400" y="256" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">38,6 %</tspan></text><rect x="680" y="256" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">2,2 %</tspan></text><rect x="10" y="310" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Los pares crecen con el cuadrado de las instrucciones, así que añadir reglas «por si acaso» vuelve casi seguro algún choque.</tspan></text><text x="475" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">La probabilidad por par es un supuesto del autor y supone pares independientes.</tspan></text><text x="475" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Cálculo exacto (1 − q)^pares; no hay simulación ni modelo real.</tspan></text></svg>
