<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 307" width="980" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Permisos sobrantes por persona tras 24 meses con 5 % de cambios de rol al mes (300 personas)</title><desc id="d">Barras: si los permisos solo se acumulan, cada persona acaba con 4,8 permisos que no necesita, casi la mitad de los 9,8 que tiene; la revisión trimestral los baja a 0,2; la caducidad de 30 días y la reasignación al cambiar de rol a cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="307" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Acumular sin revisar</tspan></text><rect x="340" y="16" width="115.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="463.2" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="463.2" dy="0">4,8 sobrantes de 9,8 (49,1 %)</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Revisión trimestral (retira el 80 %)</tspan></text><rect x="340" y="60" width="4.8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352.8" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352.8" dy="0">0,2 de 5,2 (3,4 %)</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Permisos con caducidad de 30 días</tspan></text><rect x="340" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352" dy="0">0 de 5,0</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Reasignar permisos al cambiar de rol</tspan></text><rect x="340" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352" dy="0">0 de 5,0</tspan></text><rect x="10" y="196" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">La deriva no necesita un atacante: basta con que nadie retire lo que ya no hace falta. Una revisión que retira el 80 % deja</tspan></text><text x="490" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">residuo; una concesión que caduca y se renueva por necesidad no lo deja, a cambio de más solicitudes. La tasa de cambios y los 40</tspan></text><text x="490" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">permisos del catálogo son supuestos del autor.</tspan></text><text x="490" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
