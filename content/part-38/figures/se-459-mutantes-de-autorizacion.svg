<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 307" width="940" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Trece defectos de autorización plantados: cuántos detecta cada diseño de pruebas</title><desc id="d">Barras: una suite de solo ruta feliz detecta 0 de 13 defectos de autorización plantados, las negativas por rol 5, la matriz de rol por relación con el recurso 8 y la matriz que añade estado y cabecera de rol del cliente detecta los 13.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="307" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Solo ruta feliz (18 pruebas)</tspan></text><rect x="370" y="16" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="382" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="382" dy="0">0 de 13</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Negativas por rol (84)</tspan></text><rect x="370" y="60" width="200" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="578" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="578" dy="0">5 de 13</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Rol × relación con el recurso (210)</tspan></text><rect x="370" y="104" width="320" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="698" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="698" dy="0">8 de 13</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Rol × relación × estado × cabecera (1 692)</tspan></text><rect x="370" y="148" width="520" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="898" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898" dy="0">13 de 13</tspan></text><rect x="10" y="196" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cada defecto necesita una dimensión distinta para aparecer: las matrices de rol y relación no ven el rol declarado por el</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cliente, la nota no publicada, la membresía revocada, el plazo vencido ni la acción desconocida. Los defectos y el modelo</tspan></text><text x="470" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">son del autor; las cifras miden el diseño de la matriz, no la tasa de defectos de un producto.</tspan></text><text x="470" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
