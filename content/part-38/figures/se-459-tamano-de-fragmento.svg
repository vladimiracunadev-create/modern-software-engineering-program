<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 451" width="970" height="451" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">240 documentos de 900 palabras y un hecho escondido en cada uno: tamaño del fragmento (BM25 real)</title><desc id="d">Tabla con cinco medidas por tamaño de fragmento en palabras: con fragmentos de 50 palabras el fragmento correcto es el primero en 96,7 % de las consultas y se envían 150 palabras; con 900 es el primero en 100,0 % y se envían 2700.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="451" fill="#ffffff"/><rect x="10" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="87" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="87" dy="0">Palabras por</tspan></text><text x="87" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="87" dy="0">fragmento</tspan></text><rect x="170" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Fragmentos</tspan></text><rect x="320" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">Hecho completo en el 1.º</tspan></text><rect x="540" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Documento correcto en los</tspan></text><text x="652" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">3 primeros</tspan></text><rect x="770" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Palabras enviadas (3</tspan></text><text x="862" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">fragmentos)</tspan></text><rect x="10" y="56" width="154" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">50</tspan></text><rect x="170" y="56" width="144" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">5520</tspan></text><rect x="320" y="56" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">96,7 %</tspan></text><rect x="540" y="56" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">100,0 %</tspan></text><rect x="770" y="56" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">150</tspan></text><rect x="10" y="126" width="154" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">150</tspan></text><rect x="170" y="126" width="144" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">1920</tspan></text><rect x="320" y="126" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">99,2 %</tspan></text><rect x="540" y="126" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">100,0 %</tspan></text><rect x="770" y="126" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">450</tspan></text><rect x="10" y="196" width="154" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">300</tspan></text><rect x="170" y="196" width="144" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">960</tspan></text><rect x="320" y="196" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">100,0 %</tspan></text><rect x="540" y="196" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">100,0 %</tspan></text><rect x="770" y="196" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">900</tspan></text><rect x="10" y="266" width="154" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">900</tspan></text><rect x="170" y="266" width="144" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">240</tspan></text><rect x="320" y="266" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">100,0 %</tspan></text><rect x="540" y="266" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">100,0 %</tspan></text><rect x="770" y="266" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">2700</tspan></text><rect x="10" y="340" width="950" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Con una clave única la recuperación léxica acierta casi siempre en cualquier tamaño; los fragmentos pequeños parten algunos</tspan></text><text x="485" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">hechos por la frontera y los grandes cuestan 18 veces más contexto. La consulta con clave única es el caso más fácil: con</tspan></text><text x="485" y="398.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">paráfrasis o sin clave el resultado sería peor.</tspan></text><text x="485" y="437.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
