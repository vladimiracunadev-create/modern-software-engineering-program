<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">240 documentos de 900 palabras y un hecho escondido en cada uno: tamaño del fragmento (BM25 real)</title><desc id="d">Línea con la precisión frente al costo según el tamaño del fragmento: con fragmentos de 50 palabras el fragmento correcto es el primero en 96,7 % de las consultas y se envían 150 palabras; con 300 es el primero en 100,0 % y se envían 900; con 900 se envían 2700 palabras sin ganar precisión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">240 documentos de 900 palabras y un hecho escondido en cada uno: tamaño del fragmento (BM25 real)</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">95</tspan></text><line x1="78.62" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="299" x2="78.62" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">96</tspan></text><line x1="78.62" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">97</tspan></text><line x1="78.62" y1="179" x2="910" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="179" x2="78.62" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">98</tspan></text><line x1="78.62" y1="119" x2="910" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="119" x2="78.62" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">99</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="359" x2="96.62" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">100</tspan></text><line x1="353.534" y1="59" x2="353.534" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="353.534" y1="359" x2="353.534" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="353.534" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="353.534" dy="0">300</tspan></text><line x1="635.086" y1="59" x2="635.086" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="635.086" y1="359" x2="635.086" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="635.086" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.086" dy="0">1 000</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">3 000</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Hecho completo en el 1.º (%)</text><text x="494.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Palabras enviadas por consulta (3 fragmentos) (escala logarítmica)</tspan></text><polyline points="191.439,257 448.353,107 610.447,59 867.361,59" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="191.439" cy="257" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="191.439" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="191.439" dy="0">50 pal. · 96,7 %</tspan></text><circle cx="448.353" cy="107" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="448.353" y="131" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="448.353" dy="0">150 pal. · 99,2 %</tspan></text><circle cx="610.447" cy="59" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="610.447" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="610.447" dy="0">300 pal. · 100,0 %</tspan></text><circle cx="867.361" cy="59" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="867.361" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="867.361" dy="0">900 pal. · 100,0 %</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Con una clave única la recuperación léxica acierta casi siempre en cualquier tamaño; los fragmentos pequeños parten algunos</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">hechos por la frontera y los grandes cuestan 18 veces más contexto. La consulta con clave única es el caso más fácil: con</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">paráfrasis o sin clave el resultado sería peor.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
