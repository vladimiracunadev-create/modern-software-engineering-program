<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 263" width="950" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Corregir una condición en un archivo de 182 líneas: líneas de diferencia que debe revisar la persona</title><desc id="d">Tabla con dos formas de aplicar el mismo arreglo en un archivo de 182 líneas: la edición dirigida cambia 2 líneas y se detecta con probabilidad 86,4 %; regenerar el archivo cambia 124 por deriva cosmética y la probabilidad cae a 13,2 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="263" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Forma de aplicar el cambio</tspan></text><rect x="390" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Líneas distintas (difflib)</tspan></text><rect x="660" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Prob. de encontrar el cambio</tspan></text><text x="797" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">real</tspan></text><rect x="10" y="56" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Edición dirigida (una condición)</tspan></text><rect x="390" y="56" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">2</tspan></text><rect x="660" y="56" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">86,4 %</tspan></text><rect x="10" y="110" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Archivo regenerado con deriva cosmética</tspan></text><rect x="390" y="110" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">124</tspan></text><rect x="660" y="110" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">13,2 %</tspan></text><rect x="10" y="168" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="192.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Las líneas se miden con difflib sobre un archivo real generado; la probabilidad de detección usa una curva del autor que</tspan></text><text x="475" y="209.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">decae con el tamaño del diff, así que esa columna es un modelo y no una medición de personas.</tspan></text><text x="475" y="249.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
