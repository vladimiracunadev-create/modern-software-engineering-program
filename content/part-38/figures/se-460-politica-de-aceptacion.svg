<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 317" width="940" height="317" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">1 000 sugerencias sintéticas (78 % correctas): defectos que entran según cómo se acepta</title><desc id="d">Tabla con tres políticas de aceptación de 1.000 sugerencias: aceptar sin leer deja entrar 229 defectos, leer solo las largas 181 y leer siempre y ejecutar 44 a cambio de aceptar menos sugerencias.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="317" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Política</tspan></text><rect x="340" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Sugerencias aceptadas</tspan></text><rect x="540" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="637" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">Defectos aceptados</tspan></text><rect x="740" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Defectos por cada</tspan></text><text x="832" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">100 aceptadas</tspan></text><rect x="10" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Aceptar con Tab sin leer</tspan></text><rect x="340" y="56" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">1000</tspan></text><rect x="540" y="56" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">229</tspan></text><rect x="740" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">22,9 %</tspan></text><rect x="10" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Leer solo si es larga</tspan></text><rect x="340" y="110" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">950</tspan></text><rect x="540" y="110" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">181</tspan></text><rect x="740" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">19,1 %</tspan></text><rect x="10" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Leer siempre y ejecutar</tspan></text><rect x="340" y="164" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">805</tspan></text><rect x="540" y="164" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">44</tspan></text><rect x="740" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">5,5 %</tspan></text><rect x="10" y="222" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Leer y ejecutar cuesta tiempo y reduce lo aceptado, pero deja entrar una quinta parte de los defectos. La tasa de acierto</tspan></text><text x="470" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del 78 % y las tasas de detección del revisor son supuestos del autor; no miden ninguna herramienta ni persona.</tspan></text><text x="470" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
