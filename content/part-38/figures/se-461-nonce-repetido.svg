<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cifrado de flujo de juguete (HMAC-SHA256 en modo contador) con y sin nonce repetido, 200 pares de mensajes</title><desc id="d">Barras agrupadas con lo que se recupera sin la clave de 200 pares de mensajes: con el mismo nonce se recupera el 100 por ciento de los bytes y la plantilla común acierta 200 de 200; con un nonce distinto de 96 bits se acierta el 0,4 por ciento de los bytes, lo que da el azar, y la plantilla 0 de 200.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cifrado de flujo de juguete (HMAC-SHA256 en modo contador) con y sin nonce repetido, 200 pares de mensajes</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Bytes recuperados sin la clave</tspan></text><rect x="290.2" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="310.2" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310.2" dy="0">Acierto de la plantilla común (200 pares)</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">% recuperado o acertado</text><rect x="120.689" y="95" width="166.276" height="280" rx="3" fill="#c0432f"/><text x="203.827" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="203.827" dy="0">100,0</tspan></text><rect x="290.965" y="95" width="166.276" height="280" rx="3" fill="#946512"/><text x="374.103" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374.103" dy="0">100,0</tspan></text><text x="288.965" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Nonce fijo para todos los mensajes</tspan></text><rect x="541.379" y="373" width="166.276" height="2" rx="3" fill="#c0432f"/><text x="624.517" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="624.517" dy="0">0,4</tspan></text><rect x="711.655" y="373" width="166.276" height="2" rx="3" fill="#946512"/><text x="794.793" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.793" dy="0">0,0</tspan></text><text x="709.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Nonce aleatorio de 96 bits distinto en cada mensaje</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El XOR de dos textos cifrados con el mismo flujo es el XOR de los textos en claro; con uno conocido o una plantilla («Nota</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">final: …») se lee el otro. Es una construcción didáctica: en producción se usa AEAD de una biblioteca revisada y el nonce</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">nunca lo decide el llamador.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
