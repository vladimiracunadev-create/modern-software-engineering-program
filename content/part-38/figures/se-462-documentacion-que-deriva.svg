<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 263" width="950" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Documentación que dejó de ser cierta: lo que detecta doctest</title><desc id="d">Tabla con dos grupos de funciones: de 20 con ejemplo ejecutable 10 derivaron y doctest detecta 10; de 10 con descripción en prosa 4 derivaron y doctest detecta 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="263" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Tipo de documentación</tspan></text><rect x="390" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Funciones</tspan></text><rect x="540" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Con deriva</tspan></text><rect x="710" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Detectadas por doctest</tspan></text><rect x="10" y="56" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Funciones con ejemplo ejecutable</tspan></text><rect x="390" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">20</tspan></text><rect x="540" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">10</tspan></text><rect x="710" y="56" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">10</tspan></text><rect x="10" y="110" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Funciones con descripción en prosa</tspan></text><rect x="390" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">10</tspan></text><rect x="540" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">4</tspan></text><rect x="710" y="110" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0</tspan></text><rect x="10" y="168" width="930" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="192.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">La documentación que se ejecuta se vigila sola; la prosa envejece sin que nada falle. Pedir a un modelo que genere</tspan></text><text x="475" y="209.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">docstrings produce sobre todo prosa. Los grupos y las derivas son sintéticos y escritos por el autor.</tspan></text><text x="475" y="249.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
