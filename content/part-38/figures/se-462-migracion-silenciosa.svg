<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 295" width="950" height="295" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">2 000 notas guardadas como texto en SQLite: migración ingenua frente a migración con validación</title><desc id="d">Tabla con dos migraciones de 2.000 notas de texto a número: la conversión directa convierte sin error 99 valores inválidos (83 a cero y 16 a un número parcial) y la validación migra 1901 y aparta 99 en cuarentena.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="295" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Estrategia</tspan></text><rect x="340" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Filas</tspan></text><rect x="460" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="627" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">Resultado</tspan></text><rect x="800" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">En cuarentena</tspan></text><rect x="10" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Conversión directa con CAST</tspan></text><rect x="340" y="56" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">2000</tspan></text><rect x="460" y="56" width="334" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">83 a 0,0 y 16 parciales</tspan></text><rect x="800" y="56" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0</tspan></text><rect x="10" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Validación y cuarentena</tspan></text><rect x="340" y="126" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">2000</tspan></text><rect x="460" y="126" width="334" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">1901 migradas</tspan></text><rect x="800" y="126" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">99</tspan></text><rect x="10" y="200" width="930" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">La conversión directa no falla: transforma «NP», vacíos y «5,5,0» en ceros o números parciales y deja el recuento intacto.</tspan></text><text x="475" y="241.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Una migración generada sin esta verificación pasa cualquier revisión que cuente filas. La mezcla de valores es sintética.</tspan></text><text x="475" y="281.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
