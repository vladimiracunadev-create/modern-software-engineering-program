<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 279" width="950" height="279" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho mutantes de la función de nota final: lo que detecta cada estilo de prueba</title><desc id="d">Tabla con dos estilos de prueba frente a ocho mutantes de la nota final: copiar la salida actual en entradas típicas detecta 4 y derivar casos de la especificación con fronteras detecta 8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="279" fill="#ffffff"/><rect x="10" y="12" width="594" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Estilo de prueba</tspan></text><rect x="610" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Mutantes detectados</tspan></text><rect x="10" y="56" width="594" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Copiar la salida actual en entradas típicas</tspan></text><rect x="610" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">4 de 8</tspan></text><rect x="10" y="110" width="594" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Derivar casos de la especificación (fronteras)</tspan></text><rect x="610" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">8 de 8</tspan></text><rect x="10" y="168" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="192.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Una prueba que copia la salida acepta por construcción el comportamiento actual, defectuoso o no; los casos que apuntan a</tspan></text><text x="475" y="209.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">fronteras y a diferencias entre operaciones sí lo cuestionan. Los mutantes y los casos están escritos sabiendo qué se busca,</tspan></text><text x="475" y="226.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">así que 8 de 8 es una cota optimista.</tspan></text><text x="475" y="265.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
