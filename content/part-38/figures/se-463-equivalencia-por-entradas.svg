t-weight="400" fill="#142231"><tspan x="667" dy="0">18,9 %</tspan></text><rect x="720" y="218" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">65,0 %</tspan></text><rect x="820" y="218" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">100,0 %</tspan></text><rect x="10" y="276" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las diferencias frecuentes se ven con unas pocas entradas; la que ocurre en una de cien exige cientos, y una prueba con</tspan></text><text x="470" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">tres ejemplos escritos a mano casi nunca la encuentra. Que no aparezca una diferencia no demuestra equivalencia. Las</tspan></text><text x="470" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">funciones y la distribución de entradas son del autor.</tspan></text><text x="470" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
