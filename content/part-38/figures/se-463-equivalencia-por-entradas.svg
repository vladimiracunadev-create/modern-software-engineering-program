><text x="872" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0,0 %</tspan></text><rect x="10" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">pierde el orden</tspan></text><rect x="340" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">67,68 %</tspan></text><rect x="490" y="110" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">99,6 %</tspan></text><rect x="620" y="110" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">100,0 %</tspan></text><rect x="720" y="110" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">100,0 %</tspan></text><rect x="820" y="110" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">100,0 %</tspan></text><rect x="10" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">descarta la nota 0,0</tspan></text><rect x="340" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="191.64" font-size