<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 307" width="940" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce defectos plantados en un validador de subidas: cuántos mata cada diseño de pruebas</title><desc id="d">Barras: cinco ejemplos válidos matan 0 de 12 mutantes del validador de subidas; con negativos típicos 3; con valores de borde 10; y 2 000 entradas aleatorias adicionales comparadas con la referencia siguen en 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="307" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Solo ejemplos válidos (5 pruebas)</tspan></text><rect x="340" y="16" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352" dy="0">0 de 12</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Más negativos típicos (15)</tspan></text><rect x="340" y="60" width="114" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="462" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="462" dy="0">3 de 12</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Más valores de borde (30)</tspan></text><rect x="340" y="104" width="380" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="728" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="728" dy="0">10 de 12</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Más 2 000 entradas al azar (2 050)</tspan></text><rect x="340" y="148" width="380" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="728" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="728" dy="0">10 de 12</tspan></text><rect x="10" y="196" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dos mutantes sobreviven a todo: uno es equivalente (permitir separadores de ruta no cambia nada porque la lista blanca de</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">caracteres ya los rechaza, defensa en profundidad) y el otro, la doble extensión ejecutable, exige un patrón que 2 000</tspan></text><text x="470" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entradas aleatorias no generaron. El azar no sustituye al borde elegido con criterio.</tspan></text><text x="470" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
