<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 569" width="940" height="569" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho reglas de ast sobre 60 fragmentos de código (24 con defecto sencillo, 6 con defecto difícil, 30 seguros)</title><desc id="d">Barras agrupadas con lo que encuentran las reglas de ast: de 24 defectos sencillos detectan 24 y marcan 0 seguros; de 6 defectos difíciles (alias, flujo de datos, comentarios, suma de cadenas) detectan 0 y marcan en falso 2 de los 6 seguros difíciles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="569" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocho reglas de ast sobre 60 fragmentos de código (24 con defecto sencillo, 6 con defecto difícil, 30</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">seguros)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Con defecto</tspan></text><rect x="146.94" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="166.94" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Detectados</tspan></text><rect x="270.34" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="290.34" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="290.34" dy="0">Seguros marcados en falso</tspan></text><line x1="71.08" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="394" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="338" x2="920" y2="338" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="338" x2="71.08" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="342.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="282" x2="920" y2="282" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="282" x2="71.08" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="286.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="226" x2="920" y2="226" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="226" x2="71.08" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="230.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="170" x2="920" y2="170" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="170" x2="71.08" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="174.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="114" x2="71.08" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">25</tspan></text><line x1="71.08" y1="114" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">fragmentos</text><rect x="113.526" y="125.2" width="110.523" height="268.8" rx="3" fill="#6b7c86"/><text x="168.787" y="119.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="168.787" dy="0">24</tspan></text><rect x="228.049" y="125.2" width="110.523" height="268.8" rx="3" fill="#087f8c"/><text x="283.31" y="119.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="283.31" dy="0">24</tspan></text><rect x="342.571" y="392" width="110.523" height="2" rx="3" fill="#c0432f"/><text x="397.833" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="397.833" dy="0">0</tspan></text><text x="283.31" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">Sencillos (llamada directa, literal)</tspan></text><rect x="537.986" y="326.8" width="110.523" height="67.2" rx="3" fill="#6b7c86"/><text x="593.247" y="320.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="593.247" dy="0">6</tspan></text><rect x="652.509" y="392" width="110.523" height="2" rx="3" fill="#087f8c"/><text x="707.77" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.77" dy="0">0</tspan></text><rect x="767.031" y="371.6" width="110.523" height="22.4" rx="3" fill="#c0432f"/><text x="822.293" y="365.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="822.293" dy="0">2</tspan></text><text x="707.77" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">Difíciles (alias, flujo de datos, suma)</tspan></text><rect x="10" y="446" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="470.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una regla sintáctica ve la forma de la llamada, no el flujo del dato: no sigue alias (from subprocess import run as r),</tspan></text><text x="470" y="487.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">variables que valen True, yaml.FullLoader ni una contraseña armada con una suma. Las 2 falsas alarmas son lo contrario: una</tspan></text><text x="470" y="504.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">función propia llamada eval y md5 con usedforsecurity=False. Reglas y fragmentos son del autor.</tspan></text><text x="470" y="551.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
