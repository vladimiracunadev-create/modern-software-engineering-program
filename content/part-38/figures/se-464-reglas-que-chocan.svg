<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 371" width="850" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Archivos de instrucciones sintéticos con reglas «siempre/nunca» sobre 25 temas: los que se contradicen</title><desc id="d">Tabla con el porcentaje de archivos con al menos una contradicción según el número de reglas: 16,6 % con 5 reglas, 62,4 % con 10, 97,4 % con 20 y 100,0 % con 40.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="850" height="371" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Reglas en el archivo</tspan></text><rect x="390" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="612" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">Archivos con alguna contradicción</tspan></text><rect x="10" y="56" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">5</tspan></text><rect x="390" y="56" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">16,6 %</tspan></text><rect x="10" y="106" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">10</tspan></text><rect x="390" y="106" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">62,4 %</tspan></text><rect x="10" y="156" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">20</tspan></text><rect x="390" y="156" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">97,4 %</tspan></text><rect x="10" y="206" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">40</tspan></text><rect x="390" y="206" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">100,0 %</tspan></text><rect x="10" y="260" width="830" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="425" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="425" dy="0">Un detector que compara reglas del mismo tema las encuentra todas, pero solo si las reglas se escriben de forma</tspan></text><text x="425" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="425" dy="0">estructurada; en prosa libre la contradicción pasa desapercibida. Las 500 muestras por tamaño y la elección al</tspan></text><text x="425" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="425" dy="0">azar de tema y polaridad son del autor.</tspan></text><text x="425" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="425" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
