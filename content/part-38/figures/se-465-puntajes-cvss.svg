<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 719" width="940" height="719" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres analistas puntúan con CVSS v3.1 el mismo hallazgo: puntajes y banda según su lectura del vector</title><desc id="d">Rangos de tres puntajes CVSS v3.1 por hallazgo con las bandas de gravedad: la lectura de notas ajenas va de 4,3 a 7,5, el cambio de nota de 5,3 a 6,5, el XSS almacenado de 4,6 a 6,1, la inyección SQL de 7,1 a 9,8, el secreto en un registro de 2,3 a 5,5 y la denegación por expresión regular de 3,7 a 7,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="719" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres analistas puntúan con CVSS v3.1 el mismo hallazgo: puntajes y banda según su lectura del vector</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mínimo</tspan></text><polygon points="115.24,44.1 121.84,56.4 108.64,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">Intermedio</tspan></text><polygon points="238.64,43.5 246.14,51 238.64,58.5 231.14,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="252.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="252.64" dy="0">Máximo</tspan></text><line x1="374" y1="77" x2="374" y2="521" stroke="#d5dde1" stroke-width="1"/><line x1="374" y1="521" x2="374" y2="526" stroke="#5b7280" stroke-width="1.4"/><text x="374" y="542" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374" dy="0">0</tspan></text><line x1="477.2" y1="77" x2="477.2" y2="521" stroke="#d5dde1" stroke-width="1"/><line x1="477.2" y1="521" x2="477.2" y2="526" stroke="#5b7280" stroke-width="1.4"/><text x="477.2" y="542" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477.2" dy="0">2</tspan></text><line x1="580.4" y1="77" x2="580.4" y2="521" stroke="#d5dde1" stroke-width="1"/><line x1="580.4" y1="521" x2="580.4" y2="526" stroke="#5b7280" stroke-width="1.4"/><text x="580.4" y="542" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="580.4" dy="0">4</tspan></text><line x1="683.6" y1="77" x2="683.6" y2="521" stroke="#d5dde1" stroke-width="1"/><line x1="683.6" y1="521" x2="683.6" y2="526" stroke="#5b7280" stroke-width="1.4"/><text x="683.6" y="542" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="683.6" dy="0">6</tspan></text><line x1="786.8" y1="77" x2="786.8" y2="521" stroke="#d5dde1" stroke-width="1"/><line x1="786.8" y1="521" x2="786.8" y2="526" stroke="#5b7280" stroke-width="1.4"/><text x="786.8" y="542" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="786.8" dy="0">8</tspan></text><line x1="890" y1="77" x2="890" y2="521" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="521" x2="890" y2="526" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="542" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">10</tspan></text><line x1="374" y1="521" x2="890" y2="521" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Lectura de notas ajenas por identificador</tspan></text><text x="344" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Cambio de nota sin comprobar el dueño</tspan></text><text x="344" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">XSS almacenado en un comentario</tspan></text><text x="344" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Inyección SQL en la búsqueda de entregas</tspan></text><text x="344" y="414.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Secreto en un registro accesible a soporte</tspan></text><text x="344" y="488.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Denegación por expresión regular catastrófica</tspan></text><line x1="595.88" y1="114" x2="761" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="588.88" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="595.88" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="595.88" dy="0">4,3</tspan></text><polygon points="709.4,105.95 717.1,120.3 701.7,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="709.4" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.4" dy="0">6,5</tspan></text><polygon points="761,105.25 769.75,114 761,122.75 752.25,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="761" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="761" dy="0">7,5</tspan></text><line x1="647.48" y1="188" x2="709.4" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="640.48" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="647.48" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.48" dy="0">5,3</tspan></text><polygon points="652.64,179.95 660.34,194.3 644.94,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="652.64" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652.64" dy="0">5,4</tspan></text><polygon points="709.4,179.25 718.15,188 709.4,196.75 700.65,188" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="709.4" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.4" dy="0">6,5</tspan></text><line x1="611.36" y1="262" x2="688.76" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="604.36" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="611.36" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="611.36" dy="0">4,6</tspan></text><polygon points="652.64,253.95 660.34,268.3 644.94,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="652.64" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652.64" dy="0">5,4</tspan></text><polygon points="688.76,253.25 697.51,262 688.76,270.75 680.01,262" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="688.76" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="688.76" dy="0">6,1</tspan></text><line x1="740.36" y1="336" x2="879.68" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="733.36" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="740.36" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="740.36" dy="0">7,1</tspan></text><polygon points="828.08,327.95 835.78,342.3 820.38,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="828.08" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="828.08" dy="0">8,8</tspan></text><polygon points="879.68,327.25 888.43,336 879.68,344.75 870.93,336" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="879.68" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="879.68" dy="0">9,8</tspan></text><line x1="492.68" y1="410" x2="657.8" y2="410" stroke="#8a9aa3" stroke-width="5"/><rect x="485.68" y="403" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="492.68" y="394" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="492.68" dy="0">2,3</tspan></text><polygon points="626.84,401.95 634.54,416.3 619.14,416.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="626.84" y="439" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="626.84" dy="0">4,9</tspan></text><polygon points="657.8,401.25 666.55,410 657.8,418.75 649.05,410" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="657.8" y="394" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="657.8" dy="0">5,5</tspan></text><line x1="564.92" y1="484" x2="761" y2="484" stroke="#8a9aa3" stroke-width="5"/><rect x="557.92" y="477" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="564.92" y="468" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="564.92" dy="0">3,7</tspan></text><polygon points="709.4,475.95 717.1,490.3 701.7,490.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="709.4" y="513" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.4" dy="0">6,5</tspan></text><polygon points="761,475.25 769.75,484 761,492.75 752.25,484" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="761" y="468" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="761" dy="0">7,5</tspan></text><text x="632" y="565" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="632" dy="0">puntaje CVSS v3.1 (media desde 4,0, alta desde 7,0, crítica desde 9,0)</tspan></text><rect x="10" y="579" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="603.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los tres puntajes de cada fila (el intermedio es el de en medio): 6,5 · 4,3 · 7,5; 6,5 · 5,4 · 5,3; 5,4 · 4,6 · 6,1; 9,8 ·</tspan></text><text x="470" y="620.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">8,8 · 7,1; 5,5 · 4,9 · 2,3; 7,5 · 6,5 · 3,7. La fórmula es determinista (9,8 para AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, 6,1</tspan></text><text x="470" y="637.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">para el XSS reflejado clásico); lo subjetivo es elegir cada métrica del vector. Los vectores los escribió el autor para</tspan></text><text x="470" y="653.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ilustrar lecturas posibles, no son de analistas reales.</tspan></text><text x="470" y="701.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
