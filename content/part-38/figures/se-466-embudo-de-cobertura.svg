<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 395" width="980" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De 40 requisitos a evidencia vigente: lo que significa «cubierto» según la definición</title><desc id="d">Barras: de 40 requisitos, 38 tienen control documentado, 28 tienen una prueba, 27 la pasaron, 23 tienen evidencia de 90 días o menos y solo 4 de 30 días o menos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="395" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Requisitos aplicables</tspan></text><rect x="370" y="16" width="600" height="28" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="978" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="978" dy="0">40</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Con un control documentado</tspan></text><rect x="370" y="60" width="570" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="948" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="948" dy="0">38</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Con una prueba asociada</tspan></text><rect x="370" y="104" width="420" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="798" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="798" dy="0">28</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Y la prueba pasó</tspan></text><rect x="370" y="148" width="405" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="783" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="783" dy="0">27</tspan></text><text x="360" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Y la evidencia tiene 90 días o menos</tspan></text><rect x="370" y="192" width="345" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="723" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="723" dy="0">23</tspan></text><text x="360" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Y la evidencia tiene 30 días o menos</tspan></text><rect x="370" y="236" width="60" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="438" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="438" dy="0">4</tspan></text><rect x="10" y="284" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El mismo conjunto da 95 %, 70 %, 67,5 %, 57,5 % o 10 % de cobertura según se exija un documento, una prueba, un resultado o</tspan></text><text x="490" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">evidencia reciente. Una auditoría que acepta la primera definición certifica un papel. Las probabilidades de cada etapa y la edad</tspan></text><text x="490" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">de la evidencia son supuestos del autor.</tspan></text><text x="490" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
