44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Cadena aleatoria alfanumérica</tspan></text><rect x="330" y="106" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">40</tspan></text><rect x="420" y="106" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">0</tspan></text><rect x="540" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">40</tspan></text><rect x="670" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">40</tspan></text><rect x="800" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">40</tspan></text><rect x="10" y="156" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Cadena aleatoria hexadecimal</tspan></text><rect x="330" y="156" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">40</tspan></text><rect x="420" y="156" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">0</tspan></text><rect x="540" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">0</tspan></text><rect x="670" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">40</tspan></text><rect x="800" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">40</tspan></text><rect x="10" y="206" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Identificador con guion</tspan></text><rect x="330" y="206" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">40</tspan></text><rect x="420" y="206" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">40</tspan></text><rect x="540" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">0</tspan></text><rect x="670" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">0</tspan></text><rect x="800" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">40</tspan></text><rect x="10" y="256" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Texto sin datos sensibles</tspan></text><rect x="330" y="256" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">80</tspan></text><rect x="420" y="256" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">0</tspan></text><rect x="540" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">0</tspan></text><rect x="670" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">0</tspan></text><rect x="800" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="310" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada regla ve una cara; la entropía no puede marcar una cadena hexadecimal porque su entropía máxima es 4 bits, y la regla</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de contexto depende de la palabra «clave». Las cadenas se generan en tiempo de ejecución; ninguna es un dato real. Los</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mensajes son plantillas del autor.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
