<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 387" width="970" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Huellas de cinco símbolos: fragmento generado frente a un corpus con licencia</title><desc id="d">Tabla con el porcentaje de huellas de cinco símbolos de cada fragmento que aparece en el corpus, comparando símbolos literales y con identificadores normalizados: la copia literal da 100 % y 100 %, la copia con nombres cambiados baja a 24 % pero vuelve a 100 %, el idioma común da 100 % y la solución independiente 0 % y 35 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="387" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Fragmento</tspan></text><rect x="430" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">Huellas literales en el corpus</tspan></text><rect x="710" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Con identificadores</tspan></text><text x="832" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">normalizados</tspan></text><rect x="10" y="56" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">copia literal</tspan></text><rect x="430" y="56" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">100 %</tspan></text><rect x="710" y="56" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">100 %</tspan></text><rect x="10" y="110" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">copia con nombres cambiados</tspan></text><rect x="430" y="110" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">24 %</tspan></text><rect x="710" y="110" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">100 %</tspan></text><rect x="10" y="164" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">idioma común (corpus de bucles)</tspan></text><rect x="430" y="164" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">100 %</tspan></text><rect x="710" y="164" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">100 %</tspan></text><rect x="10" y="218" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">solución independiente</tspan></text><rect x="430" y="218" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">0 %</tspan></text><rect x="710" y="218" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">35 %</tspan></text><rect x="10" y="276" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Cambiar los nombres engaña a la comparación literal pero no a la normalizada; un idioma muy común coincide al 100 % sin ser</tspan></text><text x="485" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">copia de nadie. Un parecido alto es una señal para investigar y no un veredicto de infracción. El corpus de una función es</tspan></text><text x="485" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">mínimo y del autor.</tspan></text><text x="485" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
