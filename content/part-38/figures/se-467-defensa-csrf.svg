<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 474" width="940" height="474" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defensa CSRF: cinco peticiones contra tres implementaciones (la primera solo comprueba que haya token)</title><desc id="d">Mapa de calor con si tres implementaciones de CSRF aceptan cinco peticiones: solo presencia acepta un token inventado, uno con un espacio y el de otra sesión; el valor global rechaza los inventados pero acepta el de otra sesión y rechaza el token propio; ligado a la sesión con un HMAC rechaza lo ajeno y acepta lo propio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="474" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Defensa CSRF: cinco peticiones contra tres implementaciones (la primera solo comprueba que haya token)</tspan></text><text x="423.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">Solo presencia</tspan></text><text x="622" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">Valor global</tspan></text><text x="820.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">Ligado a la sesión</tspan></text><text x="314" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Sin token</tspan></text><text x="314" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Token inventado</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Token con un espacio</tspan></text><text x="314" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Token válido de la sesión de otra persona</tspan></text><text x="314" y="274.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Token propio de la sesión</tspan></text><rect x="325.5" y="73.5" width="195.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">rechaza</tspan></text><rect x="524.167" y="73.5" width="195.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="622" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">rechaza</tspan></text><rect x="722.833" y="73.5" width="195.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">rechaza</tspan></text><rect x="325.5" y="117.5" width="195.667" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="423.333" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">ACEPTA</tspan></text><rect x="524.167" y="117.5" width="195.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="622" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">rechaza</tspan></text><rect x="722.833" y="117.5" width="195.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">rechaza</tspan></text><rect x="325.5" y="161.5" width="195.667" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="423.333" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">ACEPTA</tspan></text><rect x="524.167" y="161.5" width="195.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="622" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">rechaza</tspan></text><rect x="722.833" y="161.5" width="195.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">rechaza</tspan></text><rect x="325.5" y="205.5" width="195.667" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="423.333" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">ACEPTA</tspan></text><rect x="524.167" y="205.5" width="195.667" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="622" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">ACEPTA</tspan></text><rect x="722.833" y="205.5" width="195.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">rechaza</tspan></text><rect x="325.5" y="249.5" width="195.667" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">ACEPTA</tspan></text><rect x="524.167" y="249.5" width="195.667" height="41" rx="4" fill="#fbe4de" stroke="#102a43" stroke-width="3"/><text x="622" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">rechaza</tspan></text><rect x="722.833" y="249.5" width="195.667" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">ACEPTA</tspan></text><text x="324" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="324" dy="0">rechaza</tspan></text><rect x="384.78" y="306" width="30.5" height="14" fill="#fbe4de"/><rect x="414.78" y="306" width="30.5" height="14" fill="#f3cdc5"/><rect x="444.78" y="306" width="30.5" height="14" fill="#eab6ac"/><rect x="474.78" y="306" width="30.5" height="14" fill="#e29f93"/><rect x="504.78" y="306" width="30.5" height="14" fill="#d9887a"/><rect x="534.78" y="306" width="30.5" height="14" fill="#d17161"/><rect x="564.78" y="306" width="30.5" height="14" fill="#c85a48"/><rect x="594.78" y="306" width="30.5" height="14" fill="#c0432f"/><text x="632.78" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="632.78" dy="0">ACEPTA</tspan></text><text x="686.02" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="686.02" dy="0">más oscuro = mayor (acepta la petición)</tspan></text><rect x="10" y="334" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="358.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El contorno marca el comportamiento incorrecto: aceptar lo ajeno o rechazar lo propio. Las pruebas felices (token propio,</tspan></text><text x="470" y="375.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sin token) pasan en la implementación débil: ninguna prueba que no intente falsificar detecta que el control es de</tspan></text><text x="470" y="392.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">apariencia. La implementación con valor global parece mejor y falla en la otra dirección. El token es un HMAC de la sesión,</tspan></text><text x="470" y="408.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no un secreto compartido por todos.</tspan></text><text x="470" y="456.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
