<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Detectar una diferencia real del 15 % en tiempo: diseño pareado frente a grupos distintos</title><desc id="d">Líneas con la probabilidad de detectar una diferencia real del 15 por ciento según el número de tareas: con 20 tareas el diseño pareado la detecta 83 % y el de grupos distintos 12 %; con 80 tareas 100 % y 32 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Detectar una diferencia real del 15 % en tiempo: diseño pareado frente a grupos distintos</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mismas tareas en ambos flujos</tspan></text><rect x="282.66" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Tareas distintas en cada flujo</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">10</tspan></text><line x1="361.747" y1="87" x2="361.747" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="361.747" y1="387" x2="361.747" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="361.747" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="361.747" dy="0">20</tspan></text><line x1="626.873" y1="87" x2="626.873" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="626.873" y1="387" x2="626.873" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="626.873" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.873" dy="0">40</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">80</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Probabilidad de detectar la diferencia (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Tareas por flujo (escala logarítmica)</tspan></text><polyline points="96.62,204 361.747,138 626.873,96 892,87" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="204" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="193" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">61 %</tspan></text><circle cx="361.747" cy="138" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="361.747" y="127" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="361.747" dy="0">83 %</tspan></text><circle cx="626.873" cy="96" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="626.873" y="85" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="626.873" dy="0">97 %</tspan></text><circle cx="892" cy="87" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">100 %</tspan></text><polyline points="96.62,360 361.747,351 626.873,324 892,291" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="354.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="349" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">9 %</tspan></text><rect x="356.247" y="345.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="361.747" y="340" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="361.747" dy="0">12 %</tspan></text><rect x="621.373" y="318.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="626.873" y="313" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="626.873" dy="0">21 %</tspan></text><rect x="886.5" y="285.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="280" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">32 %</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La dificultad varía mucho más entre tareas que entre flujos; si cada flujo hace tareas distintas, esa variación tapa el</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">efecto. Hacer las mismas tareas en los dos flujos (con orden alternado) lo revela con una fracción de las tareas. La</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">variación de tareas es lognormal del autor.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
