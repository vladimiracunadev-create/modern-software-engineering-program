<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" width="960" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bitácora de seis pasos encadenada por hash: qué manipulaciones detecta la verificación</title><desc id="d">Tabla con cinco manipulaciones de una bitácora de seis entradas encadenadas por hash: editar, borrar o intercambiar entradas se detecta en las entradas 3, 3 y 2; recalcular los hashes siguientes no se detecta salvo que el último hash se haya guardado fuera.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="425" fill="#ffffff"/><rect x="10" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="267" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="267" dy="0">Manipulación</tspan></text><rect x="530" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Resultado de la verificación</tspan></text><rect x="10" y="56" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Editar el texto de la entrada 3</tspan></text><rect x="530" y="56" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">entrada 3</tspan></text><rect x="10" y="110" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Borrar la entrada 3</tspan></text><rect x="530" y="110" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">entrada 3</tspan></text><rect x="10" y="164" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Intercambiar las entradas 2 y 3</tspan></text><rect x="530" y="164" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">entrada 2</tspan></text><rect x="10" y="218" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Editar la 3 y recalcular todos los hashes siguientes</tspan></text><rect x="530" y="218" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">no se detecta (verifica sin error)</tspan></text><rect x="10" y="272" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Lo mismo, con el último hash guardado fuera de la bitácora</tspan></text><rect x="530" y="272" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">el último hash no coincide: se detecta</tspan></text><rect x="10" y="330" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El encadenado detecta alteraciones torpes y no a quien tiene acceso para reescribir la cola: hace falta un ancla externa (el</tspan></text><text x="480" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">último hash en otro sistema, una firma). Es evidencia de integridad, no de que el contenido sea cierto.</tspan></text><text x="480" y="411.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
