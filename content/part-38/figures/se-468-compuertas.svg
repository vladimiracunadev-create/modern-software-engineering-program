<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cambios asistidos sintéticos (20 % con defecto): defectos que llegan a producción según las compuertas</title><desc id="d">Barras horizontales con los defectos que llegan a producción de 10 000 cambios asistidos según las compuertas: sin compuertas 2029, solo pruebas 916, pruebas y análisis 635, con revisión 362 y las cuatro compuertas 240.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cambios asistidos sintéticos (20 % con defecto): defectos que llegan a producción según las compuertas</tspan></text><line x1="274" y1="49" x2="274" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="239" x2="274" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="49" x2="394.34" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="239" x2="394.34" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">500</tspan></text><line x1="514.68" y1="49" x2="514.68" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="239" x2="514.68" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">1 000</tspan></text><line x1="635.02" y1="49" x2="635.02" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="239" x2="635.02" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">1 500</tspan></text><line x1="755.36" y1="49" x2="755.36" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="239" x2="755.36" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">2 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="239" x2="875.7" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2 500</tspan></text><line x1="274" y1="239" x2="875.7" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Sin compuertas</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Solo pruebas</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Pruebas + análisis</tspan></text><text x="264" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Pruebas + análisis + revisión</tspan></text><text x="264" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Las cuatro</tspan></text><rect x="274" y="55" width="488.34" height="26" rx="3" fill="#c0432f"/><text x="769.34" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="769.34" dy="0">2 029</tspan></text><rect x="274" y="93" width="220.463" height="26" rx="3" fill="#c0432f"/><text x="501.463" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="501.463" dy="0">916</tspan></text><rect x="274" y="131" width="152.832" height="26" rx="3" fill="#c0432f"/><text x="433.832" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="433.832" dy="0">635</tspan></text><rect x="274" y="169" width="87.1262" height="26" rx="3" fill="#c0432f"/><text x="368.126" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="368.126" dy="0">362</tspan></text><rect x="274" y="207" width="57.7632" height="26" rx="3" fill="#c0432f"/><text x="338.763" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="338.763" dy="0">240</tspan></text><text x="574.85" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Defectos que llegan a producción, de 10 000 cambios</tspan></text><rect x="10" y="297" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada compuerta quita una fracción y ninguna llega a cero; además la revisión humana pierde eficacia con el tamaño: detecta</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">39,7 % con 20 líneas y 5,9 % con 1.000. Las probabilidades de detección y su independencia son supuestos del autor.</tspan></text><text x="470" y="386.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
