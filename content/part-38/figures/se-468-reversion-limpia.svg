<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 421" width="820" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Revertir un cambio de 40 líneas (4 bloques de 10) en un archivo de 400 tras k ediciones posteriores</title><desc id="d">Tabla con la probabilidad de poder revertir el cambio sin conflicto según las ediciones posteriores: 100,0 % sin ediciones, 53,4 % con 5, 8,3 % con 20 y 0,1 % con 60.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="421" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Ediciones posteriores</tspan></text><rect x="410" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Reversión limpia</tspan></text><rect x="10" y="56" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">0</tspan></text><rect x="410" y="56" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">100,0 %</tspan></text><rect x="10" y="106" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">5</tspan></text><rect x="410" y="106" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">53,4 %</tspan></text><rect x="10" y="156" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">20</tspan></text><rect x="410" y="156" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">8,3 %</tspan></text><rect x="10" y="206" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">60</tspan></text><rect x="410" y="206" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">0,1 %</tspan></text><rect x="10" y="256" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">150</tspan></text><rect x="410" y="256" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">0,0 %</tspan></text><rect x="10" y="310" width="800" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="410" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">La ventana para deshacer un cambio sin conflictos se cierra rápido: cuanto más tarda la revisión, más</tspan></text><text x="410" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">probable es que revertir sea ya otro cambio. Las ediciones al azar sobre líneas uniformes son una</tspan></text><text x="410" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">simplificación del autor; los cambios reales se concentran.</tspan></text><text x="410" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
