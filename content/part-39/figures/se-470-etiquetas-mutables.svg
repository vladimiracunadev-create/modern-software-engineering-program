<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 247" width="900" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Despliegues por etiqueta cuyo contenido no es el que se probó (1 000 días, un despliegue por semana)</title><desc id="d">Barras: con una etiqueta que se vuelve a publicar el 2 por ciento de los días, 9 de 143 despliegues por etiqueta llevan un contenido distinto del probado; con el 10 por ciento, 41 de 143; sin repush, ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="247" fill="#ffffff"/><text x="200" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">Sin repush de etiquetas</tspan></text><rect x="210" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="222" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="222" dy="0">0 de 143</tspan></text><text x="200" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">Repush 2 % de los días</tspan></text><rect x="210" y="60" width="49.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="267.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="267.5" dy="0">9 de 143</tspan></text><text x="200" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">Repush 10 % de los días</tspan></text><rect x="210" y="104" width="225.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="443.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="443.5" dy="0">41 de 143</tspan></text><rect x="10" y="152" width="880" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Una etiqueta es un puntero que alguien puede mover; una huella es una función del contenido. Desplegar por huella hace</tspan></text><text x="450" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">nulo este riesgo y sigue permitiendo usar etiquetas legibles para las personas.</tspan></text><text x="450" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
