<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 335" width="900" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Retrocesos que obligan a reconstruir porque la versión necesaria ya se borró (10 000 retrocesos simulados)</title><desc id="d">Barras: si la limpieza conserva solo la última versión, el 30,4 por ciento de los retrocesos exige reconstruir; con dos versiones, 8,9; con tres, 2,7; con cinco, 0,2; con diez, ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="335" fill="#ffffff"/><text x="220" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Conserva 1 versión</tspan></text><rect x="230" y="16" width="364.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="602.8" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="602.8" dy="0">30,4 %</tspan></text><text x="220" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Conserva 2 versiones</tspan></text><rect x="230" y="60" width="106.8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="344.8" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="344.8" dy="0">8,9 %</tspan></text><text x="220" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Conserva 3 versiones</tspan></text><rect x="230" y="104" width="32.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="270.4" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="270.4" dy="0">2,7 %</tspan></text><text x="220" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Conserva 5 versiones</tspan></text><rect x="230" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="242" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="242" dy="0">0,2 %</tspan></text><text x="220" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Conserva 10 versiones</tspan></text><rect x="230" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="242" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="242" dy="0">0,0 %</tspan></text><rect x="10" y="240" width="880" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">La profundidad del retroceso sigue una cola geométrica supuesta (30 % de probabilidad de saltar una versión más). El</tspan></text><text x="450" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">supuesto se debe sustituir por el historial propio; la forma de la cola es lo que justifica conservar más de una.</tspan></text><text x="450" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
