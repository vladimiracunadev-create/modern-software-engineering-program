<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 371" width="940" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bucle implementar y converger con 40 criterios y 20 abiertos: pasadas según la tasa de regresión (5 000 corridas por fila)</title><desc id="d">Tabla con la simulación de un bucle de implementar y converger sobre 40 criterios con 20 abiertos y una probabilidad de corrección de 0,7 por pasada: sin regresión la mediana es de 3 pasadas y ninguna corrida topa el máximo de 10; con 2 por ciento de regresión la mediana es de 5 y topa el 9,4 por ciento; con 5 por ciento la mediana es 10 y topa el 62,4; con 10 por ciento topa el 96,3 con 4,88 criterios abiertos de media.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="371" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Regresión por pasada</tspan></text><rect x="220" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="312" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="312" dy="0">Pasadas (mediana)</tspan></text><rect x="410" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Percentil 90</tspan></text><rect x="560" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Topan el máximo de 10</tspan></text><rect x="770" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Abiertos al parar</tspan></text><text x="847" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">(media)</tspan></text><rect x="10" y="56" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">0 %</tspan></text><rect x="220" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">3</tspan></text><rect x="410" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">5</tspan></text><rect x="560" y="56" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">0,0 %</tspan></text><rect x="770" y="56" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0,00</tspan></text><rect x="10" y="110" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">2 %</tspan></text><rect x="220" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">5</tspan></text><rect x="410" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">10</tspan></text><rect x="560" y="110" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">9,4 %</tspan></text><rect x="770" y="110" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0,17</tspan></text><rect x="10" y="164" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">5 %</tspan></text><rect x="220" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">10</tspan></text><rect x="410" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">10</tspan></text><rect x="560" y="164" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">62,4 %</tspan></text><rect x="770" y="164" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1,84</tspan></text><rect x="10" y="218" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">10 %</tspan></text><rect x="220" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">10</tspan></text><rect x="410" y="218" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">10</tspan></text><rect x="560" y="218" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">96,3 %</tspan></text><rect x="770" y="218" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">4,88</tspan></text><rect x="10" y="276" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una regresión del 5 % por pasada deja sin converger al 62,4 % de las corridas: de 20 criterios cumplidos, uno se rompe en</tspan></text><text x="470" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cada pasada. La tasa de corrección de 0,7 y la independencia entre criterios son supuestos del autor.</tspan></text><text x="470" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
