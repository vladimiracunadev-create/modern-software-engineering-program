<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 365" width="940" height="365" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres conjuntos de criterios ejecutables frente a diez variantes defectuosas de la regla de avisos</title><desc id="d">Tabla con tres conjuntos de criterios ejecutables aplicados a diez variantes defectuosas de la regla de avisos: tres casos del camino feliz detectan 3 de 10, nueve casos con bordes detectan 6 de 10 y quedan vivas las que ignoran entregada, ignoran el silencio, envían todos los umbrales y eligen el más lejano, y diecisiete casos completos detectan las 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="365" fill="#ffffff"/><rect x="10" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Conjunto de criterios</tspan></text><rect x="240" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="282" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="282" dy="0">Casos</tspan></text><rect x="330" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="392" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">Detectadas</tspan></text><rect x="460" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Variantes vivas</tspan></text><rect x="10" y="56" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Camino feliz</tspan></text><rect x="240" y="56" width="84" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">3</tspan></text><rect x="330" y="56" width="124" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">3 de 10</tspan></text><rect x="460" y="56" width="464" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="83.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">ignora entregada, ignora silencio, repite, envía todos, avisa tras</tspan></text><text x="692" y="99.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">vencer, elige el más lejano, solo bloquea el idéntico</tspan></text><rect x="10" y="126" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Camino feliz y bordes</tspan></text><rect x="240" y="126" width="84" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">9</tspan></text><rect x="330" y="126" width="124" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">6 de 10</tspan></text><rect x="460" y="126" width="464" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="153.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">ignora entregada, ignora silencio, envía todos, elige el más</tspan></text><text x="692" y="169.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">lejano</tspan></text><rect x="10" y="196" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Criterios completos</tspan></text><rect x="240" y="196" width="84" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">17</tspan></text><rect x="330" y="196" width="124" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">10 de 10</tspan></text><rect x="460" y="196" width="464" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">ninguna</tspan></text><rect x="10" y="270" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las variantes que sobreviven al segundo conjunto dependen de combinaciones de estado que un caso de borde de un solo valor</tspan></text><text x="470" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no ejercita. Las diez variantes y los 17 casos son del autor: el 10 de 10 es consecuencia de haberlos escrito sabiéndolo.</tspan></text><text x="470" y="351.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
