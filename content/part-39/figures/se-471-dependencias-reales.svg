<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias reales de dos entornos de Python: la clausura transitiva depende del entorno, no del proyecto</title><desc id="d">Barras horizontales en escala logarítmica con las dependencias de dos entornos reales: Windows tiene 349 distribuciones, 188 con dependencias, mediana de 3 transitivas, clausura máxima de 88 (jupyter) y 77 raíces; Ubuntu tiene 63, 10, 2,5, 6 (twisted) y 43; la clausura depende del entorno, no del proyecto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dependencias reales de dos entornos de Python: la clausura transitiva depende del entorno, no del proyecto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows (3.12.9)</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Ubuntu WSL2 (3.12.3)</tspan></text><line x1="324" y1="77" x2="324" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="397" x2="324" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">1</tspan></text><line x1="513.273" y1="77" x2="513.273" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="513.273" y1="397" x2="513.273" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="513.273" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="513.273" dy="0">10</tspan></text><line x1="702.547" y1="77" x2="702.547" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="702.547" y1="397" x2="702.547" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="702.547" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702.547" dy="0">100</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="397" x2="891.82" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">1 000</tspan></text><line x1="324" y1="397" x2="891.82" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Distribuciones instaladas</tspan></text><text x="314" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Paquetes con al menos una dependencia</tspan></text><text x="314" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">instalada</tspan></text><text x="314" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Mediana de dependencias transitivas entre</tspan></text><text x="314" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">ellos</tspan></text><text x="314" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Mayor clausura transitiva de un paquete</tspan></text><text x="314" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Paquetes que nadie más requiere (raíces)</tspan></text><rect x="324" y="83" width="481.289" height="24.5" rx="3" fill="#c0432f"/><text x="812.289" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="812.289" dy="0">349</tspan></text><rect x="324" y="110.5" width="340.567" height="24.5" rx="3" fill="#087f8c"/><text x="671.567" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="671.567" dy="0">63</tspan></text><rect x="324" y="147" width="430.437" height="24.5" rx="3" fill="#c0432f"/><text x="761.437" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="761.437" dy="0">188</tspan></text><rect x="324" y="174.5" width="189.273" height="24.5" rx="3" fill="#087f8c"/><text x="520.273" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="520.273" dy="0">10</tspan></text><rect x="324" y="211" width="90.3063" height="24.5" rx="3" fill="#c0432f"/><text x="421.306" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="421.306" dy="0">3</tspan></text><rect x="324" y="238.5" width="75.3194" height="24.5" rx="3" fill="#087f8c"/><text x="406.319" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="406.319" dy="0">2,5</tspan></text><rect x="324" y="275" width="368.039" height="24.5" rx="3" fill="#c0432f"/><text x="699.039" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="699.039" dy="0">88</tspan></text><rect x="324" y="302.5" width="147.283" height="24.5" rx="3" fill="#087f8c"/><text x="478.283" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="478.283" dy="0">6</tspan></text><rect x="324" y="339" width="357.062" height="24.5" rx="3" fill="#c0432f"/><text x="688.062" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="688.062" dy="0">77</tspan></text><rect x="324" y="366.5" width="309.172" height="24.5" rx="3" fill="#087f8c"/><text x="640.172" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="640.172" dy="0">43</tspan></text><text x="607.91" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">Paquetes (o dependencias) (escala logarítmica)</tspan></text><rect x="10" y="455" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que se instaló no es lo que el proyecto declara: la clausura de un paquete se calcula leyendo los metadatos de lo que</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hay. Los dos entornos difieren por diseño; no representan ningún proyecto de producción y las extras opcionales se</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">excluyeron.</tspan></text><text x="470" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
