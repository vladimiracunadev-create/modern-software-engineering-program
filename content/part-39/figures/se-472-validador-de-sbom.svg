<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 670" width="940" height="670" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador de forma de SBOM frente a 240 mutaciones (12 operadores sobre 20 SBOM de 30 componentes)</title><desc id="d">Barras horizontales con las mutaciones detectadas, de 20, por un validador de forma de SBOM: detecta 20 de 20 las que quitan la versión, el purl o las huellas, duplican un componente, cambian solo la versión del purl o vacían la lista, y 0 de 20 las que mantienen la forma, como borrar un componente o cambiar la licencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="670" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un validador de forma de SBOM frente a 240 mutaciones (12 operadores sobre 20 SBOM de 30 componentes)</tspan></text><line x1="294" y1="49" x2="294" y2="505" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="505" x2="294" y2="510" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="526" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="445.47" y1="49" x2="445.47" y2="505" stroke="#d5dde1" stroke-width="1"/><line x1="445.47" y1="505" x2="445.47" y2="510" stroke="#5b7280" stroke-width="1.4"/><text x="445.47" y="526" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="445.47" dy="0">5</tspan></text><line x1="596.94" y1="49" x2="596.94" y2="505" stroke="#d5dde1" stroke-width="1"/><line x1="596.94" y1="505" x2="596.94" y2=