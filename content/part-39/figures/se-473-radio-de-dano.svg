<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 355" width="940" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sesiones de 20 acciones con un 5 % de desvíos y 12 herramientas: sesiones con algún daño según la configuración (5 000 sesiones)</title><desc id="d">Tabla con la fracción de sesiones con algún daño en 5000 sesiones de 20 acciones con un 5 por ciento de desvíos y doce herramientas: con todas las herramientas y alcance completo 41,6 por ciento y 0,53 acciones dañinas por sesión; con solo las seis de la tarea 21,3 y 0,24; con escritura confinada 3,2 y 0,03; con aprobación humana para lo destructivo 0,0 y 0,00.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="355" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Configuración</tspan></text><rect x="510" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Sesiones con algún daño</tspan></text><rect x="740" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Acciones dañinas por</tspan></text><text x="832" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">sesión</tspan></text><rect x="10" y="56" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Todas las herramientas, alcance completo</tspan></text><rect x="510" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">41,6 %</tspan></text><rect x="740" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0,53</tspan></text><rect x="10" y="106" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Solo las herramientas de la tarea (6)</tspan></text><rect x="510" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">21,3 %</tspan></text><rect x="740" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0,24</tspan></text><rect x="10" y="156" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">…y escritura confinada al espacio de trabajo</tspan></text><rect x="510" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">3,2 %</tspan></text><rect x="740" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0,03</tspan></text><rect x="10" y="206" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">…y lo destructivo exige aprobación humana</tspan></text><rect x="510" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">0,0 %</tspan></text><rect x="740" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0,00</tspan></text><rect x="10" y="260" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada restricción reduce el daño por una razón distinta y se acumulan. El cero de la última fila supone una aprobación</tspan></text><text x="470" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">humana perfecta, la suposición más débil. El 5 % de desvíos y la elección uniforme de herramienta son del autor.</tspan></text><text x="470" y="341.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
