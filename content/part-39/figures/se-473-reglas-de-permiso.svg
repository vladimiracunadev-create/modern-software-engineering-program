<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 371" width="930" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro políticas de permisos frente a 30 órdenes de shell (16 peligrosas y 14 inocuas), sin ejecutar ninguna</title><desc id="d">Tabla con cuatro políticas de permisos aplicadas a 30 órdenes de shell, 16 peligrosas y 14 inocuas: permitirlo todo deja pasar las 16 peligrosas; la lista por prefijo deja pasar 13 y frena una inocua; el análisis de segmentos deja pasar 4, todas lecturas fuera del espacio de trabajo, y frena una inocua; los segmentos con confinamiento de rutas frenan las 16 y ninguna inocua.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="371" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Política</tspan></text><rect x="370" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Peligrosas</tspan></text><text x="462" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">permitidas</tspan></text><rect x="560" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Peligrosas frenadas</tspan></text><rect x="750" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Inocuas frenadas</tspan></text><rect x="10" y="56" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Permitirlo todo</tspan></text><rect x="370" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">16 de 16</tspan></text><rect x="560" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">0 de 16</tspan></text><rect x="750" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0 de 14</tspan></text><rect x="10" y="106" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Lista por prefijo</tspan></text><rect x="370" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">13 de 16</tspan></text><rect x="560" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">3 de 16</tspan></text><rect x="750" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">1 de 14</tspan></text><rect x="10" y="156" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Lista con análisis de segmentos</tspan></text><rect x="370" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">4 de 16</tspan></text><rect x="560" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">12 de 16</tspan></text><rect x="750" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">1 de 14</tspan></text><rect x="10" y="206" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Segmentos y confinamiento de rutas</tspan></text><rect x="370" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">0 de 16</tspan></text><rect x="560" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">16 de 16</tspan></text><rect x="750" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0 de 14</tspan></text><rect x="10" y="260" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">El prefijo deja pasar las órdenes compuestas; el análisis de segmentos deja pasar cuatro lecturas fuera del espacio de</tspan></text><text x="465" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">trabajo. Las treinta órdenes se escribieron sabiendo qué reglas las evaluarían: el cero de la última fila es mérito de la</tspan></text><text x="465" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">construcción.</tspan></text><text x="465" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
