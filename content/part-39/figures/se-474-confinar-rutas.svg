<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 355" width="940" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro comprobaciones de confinamiento al directorio de trabajo sobre 22 intentos (10 legítimos y 12 de escape)</title><desc id="d">Tabla con cuatro comprobaciones de confinamiento de rutas sobre 22 intentos, 10 legítimos y 12 de escape: comparar el prefijo de texto deja pasar 3 escapes y rechaza 7 legítimos; el prefijo con separador sin normalizar deja pasar 7 y rechaza 1; normalizar deja pasar 1, el byte nulo, y no rechaza ninguno; normalizar y rechazar el byte nulo deja pasar 0 y no rechaza ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="355" fill="#ffffff"/><rect x="10" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">Comprobación</tspan></text><rect x="490" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Escapes que pasan</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Legítimos rechazados</tspan></text><rect x="10" y="56" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Comparar el prefijo de texto</tspan></text><rect x="490" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">3 de 12</tspan></text><rect x="710" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">7 de 10</tspan></text><rect x="10" y="106" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Prefijo con separador, sin normalizar</tspan></text><rect x="490" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">7 de 12</tspan></text><rect x="710" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1 de 10</tspan></text><rect x="10" y="156" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Normalizar y luego comparar</tspan></text><rect x="490" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">1 de 12</tspan></text><rect x="710" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0 de 10</tspan></text><rect x="10" y="206" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Normalizar, rechazar el byte nulo y comparar</tspan></text><rect x="490" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">0 de 12</tspan></text><rect x="710" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0 de 10</tspan></text><rect x="10" y="260" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La barra invertida cambia de significado entre sistemas: queda dentro con las reglas de POSIX y fuera con las de Windows.</tspan></text><text x="470" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los enlaces simbólicos no se probaron. Pasar esta batería no demuestra que la comprobación sea correcta.</tspan></text><text x="470" y="341.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
