<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 307" width="940" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cambios con efecto publicados con un nivel de versión inferior al real (3 000 lanzamientos simulados, 1 355 con efecto)</title><desc id="d">Barras: publicar el nivel de versión a mano sin disciplina subestima el 22,1 por ciento de los cambios con efecto; a mano con revisión, 10,3; solo con el comparador de firmas, 11,1; combinando comparador y revisión manual, 0,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="307" fill="#ffffff"/><text x="240" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">A mano sin disciplina</tspan></text><rect x="250" y="16" width="198.9" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="456.9" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="456.9" dy="0">22,1 %</tspan></text><text x="240" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">A mano con revisión</tspan></text><rect x="250" y="60" width="92.7" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="350.7" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="350.7" dy="0">10,3 %</tspan></text><text x="240" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">Solo el comparador</tspan></text><rect x="250" y="104" width="99.9" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357.9" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="357.9" dy="0">11,1 %</tspan></text><text x="240" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">Comparador y revisión</tspan></text><rect x="250" y="148" width="7.2" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="265.2" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="265.2" dy="0">0,8 %</tspan></text><rect x="10" y="196" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La combinación toma el mayor de los dos niveles y supone errores independientes entre el comparador y el autor, supuesto</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que no se midió. La tasa de error manual (22 % y 10 %) también es del autor; lo que se sostiene es que dos controles con</tspan></text><text x="470" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">errores distintos se cubren.</tspan></text><text x="470" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
