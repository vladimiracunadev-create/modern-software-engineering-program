<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 447" width="890" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un gancho de política ejecutado como proceso sobre 58 eventos (18 peligrosos): salidas y modo de fallo</title><desc id="d">Tabla con 58 eventos ejecutados como procesos reales contra un gancho de política: 40 salen con éxito, 12 con bloqueo, 4 con error y 2 con tiempo agotado; si solo el código 2 bloquea, 6 de las 18 acciones peligrosas se ejecutan; si todo lo que no sea éxito bloquea, ninguna de las 18 se ejecuta y ninguna acción inocua se bloquea.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="447" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Medida</tspan></text><rect x="650" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="762" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">Resultado</tspan></text><rect x="10" y="56" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Éxito (código 0)</tspan></text><rect x="650" y="56" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">40 eventos</tspan></text><rect x="10" y="102" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Bloqueo (código 2)</tspan></text><rect x="650" y="102" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">12 eventos</tspan></text><rect x="10" y="148" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Error (otro código)</tspan></text><rect x="650" y="148" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">4 eventos</tspan></text><rect x="10" y="194" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Tiempo agotado</tspan></text><rect x="650" y="194" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">2 eventos</tspan></text><rect x="10" y="240" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Peligrosas ejecutadas si solo el código 2 bloquea</tspan></text><rect x="650" y="240" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">6 de 18</tspan></text><rect x="10" y="286" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Peligrosas ejecutadas si todo lo que no sea éxito bloquea</tspan></text><rect x="650" y="286" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">0 de 18</tspan></text><rect x="10" y="336" width="870" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="445" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">El diseño por defecto de estos controles falla abierto: una caída o un tiempo agotado no bloquean. El gancho imita</tspan></text><text x="445" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">un contrato documentado, no es la herramienta; el arranque de un proceso cuesta decenas de milisegundos y cambia de</tspan></text><text x="445" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">equipo en equipo.</tspan></text><text x="445" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); los tiempos de reloj cambian de equipo en equipo.</tspan></text></svg>
