<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los catorce cambios de la API agrupados por lo que una herramienta de firmas puede ver</title><desc id="d">Barras horizontales con los catorce cambios de la API agrupados por lo que una herramienta de firmas puede ver: 5 rompen y la firma lo dice, 3 rompen y la firma no lo dice, 1 no rompe y la herramienta alarma, 3 añaden capacidad sin romper y 2 no cambian nada visible.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Los catorce cambios de la API agrupados por lo que una herramienta de firmas puede ver</tspan></text><line x1="294" y1="49" x2="294" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="239" x2="294" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="396.323" y1="49" x2="396.323" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="396.323" y1="239" x2="396.323" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="396.323" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="396.323" dy="0">1</tspan></text><line x1="498.647" y1="49" x2="498.647" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="498.647" y1="239" x2="498.647" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="498.647" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498.647" dy="0">2</tspan></text><line x1="600.97" y1="49" x2="600.97" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="600.97" y1="239" x2="600.97" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="600.97" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600.97" dy="0">3</tspan></text><line x1="703.293" y1="49" x2="703.293" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="703.293" y1="239" x2="703.293" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="703.293" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="703.293" dy="0">4</tspan></text><line x1="805.617" y1="49" x2="805.617" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="805.617" y1="239" x2="805.617" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="805.617" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805.617" dy="0">5</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="239" x2="907.94" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">6</tspan></text><line x1="294" y1="239" x2="907.94" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Rompe y la firma lo dice</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Rompe y la firma no lo dice</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">No rompe y la herramienta alarma</tspan></text><text x="284" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Añade capacidad sin romper</tspan></text><text x="284" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">No cambia nada visible</tspan></text><rect x="294" y="55" width="511.617" height="26" rx="3" fill="#c0432f"/><text x="812.617" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="812.617" dy="0">5</tspan></text><rect x="294" y="93" width="306.97" height="26" rx="3" fill="#c0432f"/><text x="607.97" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="607.97" dy="0">3</tspan></text><rect x="294" y="131" width="102.323" height="26" rx="3" fill="#c0432f"/><text x="403.323" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="403.323" dy="0">1</tspan></text><rect x="294" y="169" width="306.97" height="26" rx="3" fill="#c0432f"/><text x="607.97" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="607.97" dy="0">3</tspan></text><rect x="294" y="207" width="204.647" height="26" rx="3" fill="#c0432f"/><text x="505.647" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="505.647" dy="0">2</tspan></text><text x="600.97" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="600.97" dy="0">Cambios de la API (de 14)</tspan></text><rect x="10" y="297" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los 3 cambios que rompen sin cambiar la firma son el 37,5 % de los 8 incompatibles: ese es el hueco de la automatización y</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el motivo de las pruebas de contrato y del changelog revisado por una persona.</tspan></text><text x="470" y="386.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Catorce cambios construidos por el autor sobre una API de cuatro elementos públicos.</tspan></text></svg>
