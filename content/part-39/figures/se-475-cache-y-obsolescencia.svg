<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 486" width="940" height="486" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Caché de listados durante siete días con 120 consultas por hora y un cambio de catálogo cada seis horas de media</title><desc id="d">Barras horizontales en escala logarítmica con las lecturas por día según el tiempo de vida de la caché: sin caché 2853 y ninguna respuesta vieja; con 30 segundos 1436 y 0,04 por ciento viejas; con 5 minutos 262 y 0,71; con una hora 24 y 8,66; con un día 1 y 79,01 por ciento de respuestas viejas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="486" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Caché de listados durante siete días con 120 consultas por hora y un cambio de catálogo cada seis horas de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">media</tspan></text><line x1="274" y1="68" x2="274" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="288" x2="274" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0,1</tspan></text><line x1="394.34" y1="68" x2="394.34" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="288" x2="394.34" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">1</tspan></text><line x1="514.68" y1="68" x2="514.68" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="288" x2="514.68" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">10</tspan></text><line x1="635.02" y1="68" x2="635.02" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="288" x2="635.02" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">100</tspan></text><line x1="755.36" y1="68" x2="755.36" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="288" x2="755.36" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">1 000</tspan></text><line x1="875.7" y1="68" x2="875.7" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="288" x2="875.7" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10 000</tspan></text><line x1="274" y1="288" x2="875.7" y2="288" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="86" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Sin caché (0,00 % con catálogo</tspan></text><text x="264" y="103" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">viejo)</tspan></text><text x="264" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">30 segundos (0,04 %)</tspan></text><text x="264" y="182.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">5 minutos (0,71 %)</tspan></text><text x="264" y="226.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">1 hora (8,66 %)</tspan></text><text x="264" y="270.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">1 día (79,01 %)</tspan></text><rect x="274" y="74" width="536.151" height="32" rx="3" fill="#102a43"/><text x="817.151" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="817.151" dy="0">2 853</tspan></text><rect x="274" y="118" width="500.272" height="32" rx="3" fill="#102a43"/><text x="781.272" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="781.272" dy="0">1 436</tspan></text><rect x="274" y="162" width="411.358" height="32" rx="3" fill="#102a43"/><text x="692.358" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="692.358" dy="0">262</tspan></text><rect x="274" y="206" width="286.435" height="32" rx="3" fill="#102a43"/><text x="567.435" y="226.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="567.435" dy="0">24</tspan></text><rect x="274" y="250" width="120.34" height="32" rx="3" fill="#102a43"/><text x="401.34" y="270.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="401.34" dy="0">1</tspan></text><text x="574.85" y="332" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Lecturas por día (escala logarítmica)</tspan></text><rect x="10" y="346" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="370.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, las respuestas con catálogo viejo; la antigüedad máxima de un cambio no visto crece de menos de 1 minuto</tspan></text><text x="470" y="387.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con 30 s a 5 min, 58 min y 1 405 min (23 h). La elección del tiempo de vida es de riesgo, no de comodidad: una retirada</tspan></text><text x="470" y="404.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">urgente de una herramienta tarda en surtir efecto lo que dure la caché. Los cambios de catálogo son un proceso de Poisson</tspan></text><text x="470" y="420.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuesto.</tspan></text><text x="470" y="468.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
