#4a3209"><tspan x="470" dy="0">Cubrir todos los pares es barato y no cubre las interacciones de tres o más banderas ni las dependencias entre ellas (una</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">bandera que solo tiene sentido si otra está activa). Los 11 casos son un resultado de un algoritmo voraz, una cota</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">superior.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
