<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 347" width="940" height="347" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Catálogo de 20 herramientas con 4 descripciones con instrucciones: buscador de patrones y huellas fijadas</title><desc id="d">Tabla con un catálogo de 20 herramientas, 4 con instrucciones escondidas: un buscador de patrones marca 6, halla 3 de las 4 y marca 3 legítimas, y la que no usa palabras de mando pasa; una huella fijada alerta en 6 de 6 actualizaciones, 4 benignas y 2 maliciosas; el buscador marca solo 1 de las 2 actualizaciones maliciosas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="347" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Comprobación</tspan></text><rect x="390" y="12" width="534" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="657" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">Resultado</tspan></text><rect x="10" y="56" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Buscador de patrones sobre el catálogo</tspan></text><rect x="390" y="56" width="534" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="80.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">marca 6: halla 3 de 4 con instrucciones y marca 3 legítimas; la que no</tspan></text><text x="657" y="96.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">usa palabras de mando pasa</tspan></text><rect x="10" y="120" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="152.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Huella fijada tras 6 actualizaciones</tspan></text><rect x="390" y="120" width="534" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">alerta en 6 de 6 (4 benignas y 2 maliciosas)</tspan></text><rect x="10" y="184" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="216.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Buscador sobre las 2 actualizaciones maliciosas</tspan></text><rect x="390" y="184" width="534" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">marca 1 de 2</tspan></text><rect x="10" y="252" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La huella no deja pasar ningún cambio y a cambio obliga a revisar también los benignos; el buscador prioriza qué leer</tspan></text><text x="470" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">primero y falla de las dos maneras. Las descripciones y los patrones los escribió el autor.</tspan></text><text x="470" y="333.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
