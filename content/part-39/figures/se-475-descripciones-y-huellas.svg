<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Catálogo de 20 herramientas con 4 descripciones con instrucciones: buscador de patrones y huellas fijadas</title><desc id="d">Barras horizontales con los resultados de un catálogo de 20 herramientas, 4 con instrucciones escondidas: el buscador de patrones halla 3 de las 4 y marca 3 legítimas; la huella fijada alerta en 6 de 6 actualizaciones, 4 benignas y 2 maliciosas; el buscador marca solo 1 de las 2 actualizaciones maliciosas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Catálogo de 20 herramientas con 4 descripciones con instrucciones: buscador de patrones y huellas fijadas</tspan></text><line x1="354" y1="49" x2="354" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="225" x2="354" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="538.647" y1="49" x2="538.647" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="538.647" y1="225" x2="538.647" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="538.647" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="538.647" dy="0">2</tspan></text><line x1="723.293" y1="49" x2="723.293" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="723.293" y1="225" x2="723.293" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="723.293" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="723.293" dy="0">4</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="225" x2="907.94" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">6</tspan></text><line x1="354" y1="225" x2="907.94" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Buscador: descripciones con instrucciones</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">halladas (de 4)</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Buscador: herramientas legítimas marcadas</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Buscador: actualizaciones maliciosas marcadas</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(de 2)</tspan></text><text x="344" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Huella fijada: actualizaciones que alertan</tspan></text><text x="344" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(de 6)</tspan></text><rect x="354" y="55" width="276.97" height="32" rx="3" fill="#102a43"/><text x="637.97" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="637.97" dy="0">3</tspan></text><rect x="354" y="99" width="276.97" height="32" rx="3" fill="#102a43"/><text x="637.97" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="637.97" dy="0">3</tspan></text><rect x="354" y="143" width="92.3233" height="32" rx="3" fill="#102a43"/><text x="453.323" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="453.323" dy="0">1</tspan></text><rect x="354" y="187" width="553.94" height="32" rx="3" fill="#102a43"/><text x="914.94" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">6</tspan></text><text x="630.97" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">Herramientas o actualizaciones</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El buscador marca 6 herramientas; la descripción que no usa palabras de mando pasa. La huella no deja pasar ningún cambio y</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">a cambio obliga a revisar también los benignos (4 de las 6 alertas); el buscador prioriza qué leer primero y falla de las</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">dos maneras. Las descripciones y los patrones los escribió el autor.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
