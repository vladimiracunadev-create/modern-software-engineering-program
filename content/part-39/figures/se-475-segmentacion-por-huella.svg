<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Segmentación por huella de usuario: uniformidad, independencia entre banderas y consistencia al ampliar</title><desc id="d">Barras agrupadas con los usuarios expuestos a dos banderas al 10 por ciento sobre 100 000: con la misma huella y sin sal los expuestos a ambas son 9 821, los mismos para las dos, frente a 965 si fueran independientes; con la bandera como sal son 991 frente a 978.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Segmentación por huella de usuario: uniformidad, independencia entre banderas y consistencia al ampliar</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Expuestos a ambas banderas</tspan></text><rect x="260.04" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Esperados si fueran independientes</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="319" x2="101.24" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">2 000</tspan></text><line x1="101.24" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="263" x2="101.24" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">4 000</tspan></text><line x1="101.24" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="207" x2="101.24" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">6 000</tspan></text><line x1="101.24" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="151" x2="101.24" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">8 000</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Usuarios de 100 000</text><rect x="142.178" y="100.012" width="161.752" height="274.988" rx="3" fill="#c0432f"/><text x="223.054" y="94.012" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="223.054" dy="0">9 821</tspan></text><rect x="307.93" y="347.98" width="161.752" height="27.02" rx="3" fill="#087f8c"/><text x="388.806" y="341.98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="388.806" dy="0">965</tspan></text><text x="305.93" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="305.93" dy="0">Misma huella, sin sal</tspan></text><rect x="551.558" y="347.252" width="161.752" height="27.748" rx="3" fill="#c0432f"/><text x="632.434" y="341.252" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="632.434" dy="0">991</tspan></text><rect x="717.31" y="347.616" width="161.752" height="27.384" rx="3" fill="#087f8c"/><text x="798.186" y="341.616" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="798.186" dy="0">978</tspan></text><text x="715.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="715.31" dy="0">La bandera como sal</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El chi-cuadrado del reparto es 75,8 con 99 grados de libertad, compatible con uniformidad. Sin la bandera como sal, las</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">banderas no son experimentos independientes: el mismo 10 % de usuarios las recibe todas y cualquier efecto se confunde.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
