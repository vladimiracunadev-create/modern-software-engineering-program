oke-width="1.6"/><text x="472" y="569.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">5</tspan></text><rect x="530" y="542" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="569.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">5</tspan></text><rect x="690" y="542" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="569.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0</tspan></text><rect x="10" y="600" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="624.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Los 60 válidos pasan siempre. La última fila es el desajuste entre quien autoriza por cabecera y quien ejecuta el cuerpo. El</tspan></text><text x="475" y="641.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">manejador es una imitación escrita por el autor, no una implementación conforme.</tspan></text><text x="475" y="681.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
