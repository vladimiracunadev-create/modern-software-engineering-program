<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 695" width="950" height="695" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cien mensajes y tres niveles de comprobación: cuántos de cada clase se ejecutan</title><desc id="d">Tabla con 100 mensajes y tres niveles de comprobación: con solo la forma JSON-RPC se ejecutan 25 de los 40 malformados, con versión y método de la cabecera 15 y con nombre, argumentos y alcance ninguno, mientras los 60 válidos pasan siempre; los 5 mensajes con cabecera de una herramienta permitida y cuerpo de borrar historial se ejecutan en los dos primeros niveles y ninguno en el tercero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="695" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Clase de mensaje</tspan></text><rect x="340" y="12" width="74" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="377" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="377" dy="0">Cuántos</tspan></text><rect x="420" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Solo forma</tspan></text><rect x="530" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.64" font-size="13" text-an