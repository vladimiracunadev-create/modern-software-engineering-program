l="#ffffff"><tspan x="792" dy="0">Propiedad y 20 % con archivo</tspan></text><text x="792" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">común</tspan></text><rect x="10" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">2</tspan></text><rect x="180" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">36,5 %</tspan></text><rect x="410" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">0,0 %</tspan></text><rect x="660" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">0,7 %</tspan></text><rect x="10" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">3</tspan></text><rect x="180" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">75,3 %</tspan></text><rect x="410" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">0,0 %</tspan></text><rect x="660" y="106" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x=