<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 307" width="900" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reversiones innecesarias en 200 episodios de 30 minutos sin ningún defecto, según el umbral de la prueba</title><desc id="d">Barras: sin defecto alguno, un umbral z de 1,64 hace revertir el 47 por ciento de los episodios de 30 minutos; z de 2,33, el 23,5; z de 3, el 9,5; z de 4, el 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="307" fill="#ffffff"/><text x="160" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="160" dy="0">z = 1,64</tspan></text><rect x="170" y="16" width="169.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="347.2" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="347.2" dy="0">47,0 %</tspan></text><text x="160" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="160" dy="0">z = 2,33</tspan></text><rect x="170" y="60" width="84.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="262.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="262.6" dy="0">23,5 %</tspan></text><text x="160" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="160" dy="0">z = 3,00</tspan></text><rect x="170" y="104" width="34.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="212.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="212.2" dy="0">9,5 %</tspan></text><text x="160" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="160" dy="0">z = 4,00</tspan></text><rect x="170" y="148" width="7.2" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="185.2" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="185.2" dy="0">2,0 %</tspan></text><rect x="10" y="196" width="880" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Una prueba que se evalúa cada segundo durante 30 minutos recibe cientos de oportunidades de equivocarse: un umbral</tspan></text><text x="450" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">pensado para una sola decisión produce falsas alarmas. Subir el umbral baja las falsas alarmas y alarga la detección</tspan></text><text x="450" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">del defecto verdadero.</tspan></text><text x="450" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
