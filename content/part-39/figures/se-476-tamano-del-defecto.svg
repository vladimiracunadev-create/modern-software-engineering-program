<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Canario del 5 %, horizonte de 30 minutos: tamaño del defecto frente a su detección</title><desc id="d">Línea en escalas logarítmicas con la mediana de detección de un canario del 5 por ciento según el aumento del error: 868 s con 0,10 puntos, solo detectado en 22 de 40 semillas, 274 s con 0,25, 69 s con 0,5, 18 s con 1,0 y 6 s con 2,0, con 40 de 40 detecciones desde 0,25.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Canario del 5 %, horizonte de 30 minutos: tamaño del defecto frente a su detección</tspan></text><line x1="93.7" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="359" x2="93.7" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="259" x2="910" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="259" x2="93.7" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="159" x2="910" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="159" x2="93.7" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="59" x2="93.7" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="59" x2="93.7" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="59" x2="111.7" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="359" x2="111.7" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">0,10</tspan></text><line x1="305.521" y1="59" x2="305.521" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="305.521" y1="359" x2="305.521" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="305.521" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="305.521" dy="0">0,25</tspan></text><line x1="452.141" y1="59" x2="452.141" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="452.141" y1="359" x2="452.141" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="452.141" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452.141" dy="0">0,5</tspan></text><line x1="598.76" y1="59" x2="598.76" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="598.76" y1="359" x2="598.76" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="598.76" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.76" dy="0">1,0</tspan></text><line x1="745.38" y1="59" x2="745.38" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="745.38" y1="359" x2="745.38" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="745.38" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="745.38" dy="0">2,0</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0"></tspan></text><line x1="93.7" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Mediana de detección (s) (escala logarítmica)</text><text x="501.85" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">Aumento del error (puntos porcentuales) (escala logarítmica)</tspan></text><polyline points="111.7,65.148 305.521,115.225 452.141,175.115 598.76,233.473 745.38,281.185" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="111.7" cy="65.148" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="121.7" y="69.648" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="121.7" dy="0">868 s · 22 de 40</tspan></text><circle cx="305.521" cy="115.225" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="305.521" y="104.225" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="305.521" dy="0">274 s</tspan></text><circle cx="452.141" cy="175.115" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="452.141" y="164.115" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="452.141" dy="0">69 s</tspan></text><circle cx="598.76" cy="233.473" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="598.76" y="222.473" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="598.76" dy="0">18 s</tspan></text><circle cx="745.38" cy="281.185" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="745.38" y="270.185" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="745.38" dy="0">6 s</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Existe un defecto demasiado pequeño para este canario y esta ventana: la ausencia de alarma no prueba ausencia de defecto.</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En blue-green sin migración incompatible el retroceso es un cambio de ruta; con una migración destructiva que ya recibió</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escrituras nuevas, el retroceso sin perder datos fue posible en el 18,5 % de los casos simulados.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
