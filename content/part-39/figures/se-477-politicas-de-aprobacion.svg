<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 371" width="940" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro políticas de aprobación en 5 000 sesiones de 200 acciones con un 4 % irreversibles</title><desc id="d">Tabla con cuatro políticas de aprobación en 5000 sesiones de 200 acciones con 4 por ciento irreversibles: preguntar en cada acción genera 200 avisos y deja ejecutar 3,02 irreversibles por sesión, con 93,5 por ciento de sesiones afectadas; preguntar por riesgo 22,5 avisos y 1,30; aprobar un plan 11,1 y 1,18; preguntar solo lo irreversible con pausa 8,0 y 0,54, con 41,5 por ciento de sesiones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="371" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Política</tspan></text><rect x="410" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Avisos por</tspan></text><text x="477" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">sesión</tspan></text><rect x="550" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Irreversibles ejecutadas</tspan></text><text x="662" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">por sesión</tspan></text><rect x="780" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Sesiones con</tspan></text><text x="852" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">alguna</tspan></text><rect x="10" y="56" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Preguntar en cada acción</tspan></text><rect x="410" y="56" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">200,0</tspan></text><rect x="550" y="56" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">3,02</tspan></text><rect x="780" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">93,5 %</tspan></text><rect x="10" y="110" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="129.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Preguntar solo las de riesgo (clasificador del 90 %</tspan></text><text x="207" y="145.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">y 8 %)</tspan></text><rect x="410" y="110" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">22,5</tspan></text><rect x="550" y="110" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">1,30</tspan></text><rect x="780" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">73,2 %</tspan></text><rect x="10" y="164" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Aprobar el plan y preguntar las desviaciones</tspan></text><rect x="410" y="164" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">11,1</tspan></text><rect x="550" y="164" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">1,18</tspan></text><rect x="780" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">69,5 %</tspan></text><rect x="10" y="218" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Solo lo irreversible, con pausa obligatoria</tspan></text><rect x="410" y="218" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">8,0</tspan></text><rect x="550" y="218" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">0,54</tspan></text><rect x="780" y="218" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">41,5 %</tspan></text><rect x="10" y="276" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Preguntar por todo agota la atención en lo rutinario. La última política supone saber qué es irreversible. La función de</tspan></text><text x="470" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">atención, el 4 % y el clasificador son supuestos del autor: no se observó a ninguna persona.</tspan></text><text x="470" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
