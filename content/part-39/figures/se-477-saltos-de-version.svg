<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 307" width="940" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Actualizaciones realizadas según cuántas versiones se saltan (20 000 clientes, 180 días)</title><desc id="d">Barras: de 182 568 actualizaciones, 160 536 saltan una versión, 13 320 saltan dos, 6 465 saltan cuatro y 2 247 saltan ocho versiones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="307" fill="#ffffff"/><text x="220" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Salto de 1 versión</tspan></text><rect x="230" y="16" width="256.858" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="494.858" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="494.858" dy="0">160 536</tspan></text><text x="220" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Salto de 2 versiones</tspan></text><rect x="230" y="60" width="21.312" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="259.312" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="259.312" dy="0">13 320</tspan></text><text x="220" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Salto de 4 versiones</tspan></text><rect x="230" y="104" width="10.344" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="248.344" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="248.344" dy="0">6 465</tspan></text><text x="220" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Salto de 8 versiones</tspan></text><rect x="230" y="148" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="242" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="242" dy="0">2 247</tspan></text><rect x="10" y="196" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El 4,8 % de las actualizaciones de la simulación salta cuatro o más versiones (y el 12,1 % dos o más); esas son las que</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ejercitan migraciones que nadie probó en conjunto. Un actualizador que solo admite pasos de una versión obliga a encadenar</tspan></text><text x="470" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">migraciones; uno que admite saltos obliga a probarlos.</tspan></text><text x="470" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
