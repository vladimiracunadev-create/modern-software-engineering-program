0" stroke-width="1.6"/><text x="482" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">9</tspan></text><rect x="540" y="272" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">0</tspan></text><rect x="660" y="272" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">3</tspan></text><rect x="800" y="272" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="330" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En 5 000 configuraciones de 6 herramientas de un catálogo de 15, el 73,5 % reúne las tres capacidades. Las tareas y sus</tspan></text><text x="470" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">capacidades son una clasificación del autor tratada como todo o nada.</tspan></text><text x="470" y="411.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
