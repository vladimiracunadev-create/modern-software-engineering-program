t="400" fill="#142231"><tspan x="447" dy="0">60,7 %</tspan></text><rect x="560" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">89,5 %</tspan></text><rect x="750" y="256" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0,00 %</tspan></text><rect x="10" y="310" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con la misma dificultad, el acierto en un intento es del 70,1 %, en tres de tres del 44,7 %, y dos intentos de una tarea</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">discrepan en el 31,4 %. Con efectos grandes bastan veinte tareas; con seis puntos hacen falta del orden de mil.</tspan></text><text x="470" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
