<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 498" width="940" height="498" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reanudar tras una caída en una tarea de 30 pasos que envía un aviso por paso (500 caídas por variante)</title><desc id="d">Barras horizontales con los avisos duplicados de media y los pasos recalculados en 500 caídas por variante: reiniciar desde cero duplica 20,90 y deja algún duplicado en el 99 por ciento de las caídas; un punto de control tras el efecto en otra transacción duplica 0,31 en el 31 por ciento; la clave de idempotencia por paso y la transacción única no duplican ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="498" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reanudar tras una caída en una tarea de 30 pasos que envía un aviso por paso (500 caídas por variante)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Duplicados (media)</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Pasos recalculados</tspan></text><line x1="334" y1="77" x2="334" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="334" y1="333" x2="334" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="334" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334" dy="0">0</tspan></text><line x1="442.34" y1="77" x2="442.34" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="442.34" y1="333" x2="442.34" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="442.34" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442.34" dy="0">5</tspan></text><line x1="550.68" y1="77" x2="550.68" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="550.68" y1="333" x2="550.68" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="550.68" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="550.68" dy="0">10</tspan></text><line x1="659.02" y1="77" x2="659.02" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="659.02" y1="333" x2="659.02" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="659.02" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="659.02" dy="0">15</tspan></text><line x1="767.36" y1="77" x2="767.36" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="767.36" y1="333" x2="767.36" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="767.36" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767.36" dy="0">20</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="333" x2="875.7" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">25</tspan></text><line x1="334" y1="333" x2="875.7" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="324" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Sin punto de control, reiniciar (99 % de</tspan></text><text x="324" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">caídas con duplicado)</tspan></text><text x="324" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Punto de control tras el efecto, otra</tspan></text><text x="324" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">transacción (31 %)</tspan></text><text x="324" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Clave de idempotencia por paso (0 %)</tspan></text><text x="324" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Efecto y punto de control en una</tspan></text><text x="324" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">transacción (0 %)</tspan></text><rect x="334" y="83" width="452.861" height="24.5" rx="3" fill="#c0432f"/><text x="793.861" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="793.861" dy="0">20,90</tspan></text><rect x="334" y="110.5" width="452.861" height="24.5" rx="3" fill="#102a43"/><text x="793.861" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="793.861" dy="0">20,90</tspan></text><rect x="334" y="147" width="6.71708" height="24.5" rx="3" fill="#c0432f"/><text x="347.717" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="347.717" dy="0">0,31</tspan></text><rect x="334" y="174.5" width="6.5004" height="24.5" rx="3" fill="#102a43"/><text x="347.5" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="347.5" dy="0">0,30</tspan></text><rect x="334" y="211" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="343" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="343" dy="0">0,00</tspan></text><rect x="334" y="238.5" width="6.5004" height="24.5" rx="3" fill="#102a43"/><text x="347.5" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="347.5" dy="0">0,30</tspan></text><rect x="334" y="275" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="343" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="343" dy="0">0,00</tspan></text><rect x="334" y="302.5" width="6.5004" height="24.5" rx="3" fill="#102a43"/><text x="347.5" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="347.5" dy="0">0,30</tspan></text><text x="604.85" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="604.85" dy="0">Avisos duplicados o pasos recalculados</tspan></text><rect x="10" y="391" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, las caídas con algún duplicado. Lo que duplica es el instante entre el efecto y el punto de control. Los</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">efectos son filas de una base en memoria; un efecto externo necesita la clave de idempotencia en el receptor.</tspan></text><text x="470" y="480.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
