<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 405" width="960" height="405" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pasos ejecutados antes de la parada según la regla, para cinco comportamientos de agente (tope de 200)</title><desc id="d">Tabla con cuatro reglas de parada aplicadas a cinco comportamientos de agente: repetir el mismo paso se detiene en 50 pasos con el máximo, 25 con el presupuesto, 3 con el estado repetido y 9 sin avance; oscilar en 50, 25, 5 y 9; cambiar de estado sin avanzar en 50, 25, nunca y 9; avanzar 12 pasos y estancarse en 50, 25, nunca y 21; la tarea larga legítima de 60 pasos se detiene por error en 50 y 25 y no con las dos reglas de estado y avance; combinadas se detiene en 3, 5, 9, 21 y 25.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="405" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Comportamiento</tspan></text><rect x="340" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">50 pasos</tspan></text><rect x="440" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">30 000 tokens</tspan></text><rect x="570" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">Estado 3</tspan></text><text x="632" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">veces</tspan></text><rect x="700" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="762" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">Sin avance en</tspan></text><text x="762" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">8</tspan></text><rect x="830" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="887" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">Combinadas</tspan></text><rect x="10" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Repite el mismo paso</tspan></text><rect x="340" y="56" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">50</tspan></text><rect x="440" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">25</tspan></text><rect x="570" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">3</tspan></text><rect x="700" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">9</tspan></text><rect x="830" y="56" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">3</tspan></text><rect x="10" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Oscila entre dos estados</tspan></text><rect x="340" y="106" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">50</tspan></text><rect x="440" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">25</tspan></text><rect x="570" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">5</tspan></text><rect x="700" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">9</tspan></text><rect x="830" y="106" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">5</tspan></text><rect x="10" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cambia de estado sin avanzar</tspan></text><rect x="340" y="156" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">50</tspan></text><rect x="440" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">25</tspan></text><rect x="570" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">no para</tspan></text><rect x="700" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">9</tspan></text><rect x="830" y="156" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">9</tspan></text><rect x="10" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Avanza 12 pasos y se estanca</tspan></text><rect x="340" y="206" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">50</tspan></text><rect x="440" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">25</tspan></text><rect x="570" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">no para</tspan></text><rect x="700" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">21</tspan></text><rect x="830" y="206" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">21</tspan></text><rect x="10" y="256" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Tarea larga legítima (60 pasos)</tspan></text><rect x="340" y="256" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">50</tspan></text><rect x="440" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">25</tspan></text><rect x="570" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">no para</tspan></text><rect x="700" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">no para</tspan></text><rect x="830" y="256" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">25</tspan></text><rect x="10" y="310" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">La última fila no debe detenerse: el máximo y el presupuesto la cortan sin motivo y las combinadas heredan el falso paro. Los</tspan></text><text x="480" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">comportamientos son máquinas de estados del autor y los parámetros son arbitrarios.</tspan></text><text x="480" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
