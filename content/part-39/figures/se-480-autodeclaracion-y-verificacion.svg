<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 502" width="940" height="502" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis defectos inyectados en un servicio de diez requisitos: qué vía de verificación los detecta</title><desc id="d">Mapa de calor con seis defectos inyectados en un servicio de avisos de diez requisitos y cuatro vías de verificación: la autodeclaración con tres pruebas del camino feliz detecta 0 de 6, las pruebas por requisito de RF-01 a RF-08 detectan 6 de 6, las pruebas de reinicio y copia detectan 1 de 6 y la vista combinada 6 de 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="502" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis defectos inyectados en un servicio de diez requisitos: qué vía de verificación los detecta</tspan></text><text x="407.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.25" dy="0">Autodeclaración</tspan></text><text x="553.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.75" dy="0">Pruebas RF-01 a</tspan></text><text x="553.75" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.75" dy="0">RF-08</tspan></text><text x="700.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.25" dy="0">Reinicio y copia</tspan></text><text x="846.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="846.75" dy="0">Combinada</tspan></text><text x="324" y="115.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">D1 envía todos los umbrales (RF-06)</tspan></text><text x="324" y="151" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">D2 no reabre al cambiar el vencimiento</tspan></text><text x="324" y="168" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">(RF-07)</tspan></text><text x="324" y="203.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">D3 estado de envíos en memoria (RF-09)</tspan></text><text x="324" y="239" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">D4 distingue mayúsculas en el silencio</tspan></text><text x="324" y="256" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">(RF-04)</tspan></text><text x="324" y="291.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">D5 historial incompleto (RF-08)</tspan></text><text x="324" y="335.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">D6 avisa tras el vencimiento (RF-05)</tspan></text><rect x="335.5" y="90.5" width="143.5" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="407.25" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.25" dy="0">no</tspan></text><rect x="482" y="90.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="553.75" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="553.75" dy="0">sí</tspan></text><rect x="628.5" y="90.5" width="143.5" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="700.25" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.25" dy="0">no</tspan></text><rect x="775" y="90.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="846.75" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="846.75" dy="0">sí</tspan></text><rect x="335.5" y="134.5" width="143.5" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="407.25" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.25" dy="0">no</tspan></text><rect x="482" y="134.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="553.75" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="553.75" dy="0">sí</tspan></text><rect x="628.5" y="134.5" width="143.5" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="700.25" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.25" dy="0">no</tspan></text><rect x="775" y="134.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="846.75" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="846.75" dy="0">sí</tspan></text><rect x="335.5" y="178.5" width="143.5" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="407.25" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.25" dy="0">no</tspan></text><rect x="482" y="178.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="553.75" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="553.75" dy="0">sí</tspan></text><rect x="628.5" y="178.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="700.25" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="700.25" dy="0">sí</tspan></text><rect x="775" y="178.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="846.75" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="846.75" dy="0">sí</tspan></text><rect x="335.5" y="222.5" width="143.5" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="407.25" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.25" dy="0">no</tspan></text><rect x="482" y="222.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="553.75" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="553.75" dy="0">sí</tspan></text><rect x="628.5" y="222.5" width="143.5" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="700.25" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.25" dy="0">no</tspan></text><rect x="775" y="222.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="846.75" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="846.75" dy="0">sí</tspan></text><rect x="335.5" y="266.5" width="143.5" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="407.25" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.25" dy="0">no</tspan></text><rect x="482" y="266.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="553.75" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="553.75" dy="0">sí</tspan></text><rect x="628.5" y="266.5" width="143.5" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="700.25" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.25" dy="0">no</tspan></text><rect x="775" y="266.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="846.75" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="846.75" dy="0">sí</tspan></text><rect x="335.5" y="310.5" width="143.5" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="407.25" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.25" dy="0">no</tspan></text><rect x="482" y="310.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="553.75" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="553.75" dy="0">sí</tspan></text><rect x="628.5" y="310.5" width="143.5" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="700.25" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.25" dy="0">no</tspan></text><rect x="775" y="310.5" width="143.5" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="846.75" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="846.75" dy="0">sí</tspan></text><text x="334" y="379" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="334" dy="0">no</tspan></text><rect x="357.08" y="367" width="30.5" height="14" fill="#d9e2ec"/><rect x="387.08" y="367" width="30.5" height="14" fill="#bcc8d4"/><rect x="417.08" y="367" width="30.5" height="14" fill="#a0adbc"/><rect x="447.08" y="367" width="30.5" height="14" fill="#8393a4"/><rect x="477.08" y="367" width="30.5" height="14" fill="#66798b"/><rect x="507.08" y="367" width="30.5" height="14" fill="#495f73"/><rect x="537.08" y="367" width="30.5" height="14" fill="#2d445b"/><rect x="567.08" y="367" width="30.5" height="14" fill="#102a43"/><text x="605.08" y="379" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="605.08" dy="0">sí</tspan></text><text x="628.16" y="379" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="628.16" dy="0">más oscuro = mayor (Detectado)</tspan></text><rect x="10" y="395" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="419.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con los seis defectos a la vez, siete de diez requisitos tienen una prueba en rojo y los tres de la autodeclaración siguen</tspan></text><text x="470" y="436.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">en verde. Los defectos los eligió el autor: el 6 de 6 es una cota superior, no una tasa de detección.</tspan></text><text x="470" y="484.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
