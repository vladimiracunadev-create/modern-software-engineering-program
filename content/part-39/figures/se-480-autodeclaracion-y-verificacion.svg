><text x="477" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">no</tspan></text><rect x="550" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">sí</tspan></text><rect x="700" y="240" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">no</tspan></text><rect x="830" y="240" width="94" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">sí</tspan></text><rect x="10" y="286" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">D6 avisa tras el vencimiento (RF-05)</tspan></text><rect x="410" y="286" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">no</tspan></text><rect x="550" y="286" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">sí</tspan></text><rect x="700" y="286" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">no</tspan></text><rect x="830" y="286" width="94" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="309.36" font-size="12" text-anchor="mid