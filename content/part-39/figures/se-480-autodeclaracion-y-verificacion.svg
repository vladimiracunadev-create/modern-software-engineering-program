<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis defectos inyectados en un servicio de diez requisitos: qué vía de verificación los detecta</title><desc id="d">Tabla con seis defectos inyectados en un servicio de avisos de diez requisitos y tres vías de verificación: la autodeclaración con las tres pruebas del camino feliz detecta 0 de 6, las pruebas por requisito de RF-01 a RF-08 detectan 6 de 6, las pruebas de reinicio y copia detectan 1 de 6 y la vista combinada detecta 6 de 6; con los seis defectos a la vez siete de los diez requisitos tienen una prueba en rojo y los tres de la autodeclaración siguen en verde.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Defecto (requisito)</tspan></text><rect x="410" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Autodeclaración</tspan></text><rect x="550" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Pruebas RF-01 a</tspan></text><text x="622" y="42.96" font-size="13" text-ancho