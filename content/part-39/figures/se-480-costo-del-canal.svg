<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo medido de los pasos del canal sintético de release (una lectura por barra)</title><desc id="d">Barras horizontales con el tiempo de los pasos del canal sintético de release en Windows y en Ubuntu, una lectura por barra: construir, generar SBOM y procedencia y firmar toma 42,7 y 7,3 ms; republicar con nueva secuencia 45,4 y 7,1; reconstruir y comparar 0,7 y 0,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo medido de los pasos del canal sintético de release (una lectura por barra)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows 11</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Ubuntu WSL2</tspan></text><line x1="314" y1="77" x2="314" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="269" x2="314" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="427.952" y1="77" x2="427.952" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="427.952" y1="269" x2="427.952" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="427.952" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427.952" dy="0">10</tspan></text><line x1="541.904" y1="77" x2="541.904" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="541.904" y1="269" x2="541.904" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="541.904" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="541.904" dy="0">20</tspan></text><line x1="655.856" y1="77" x2="655.856" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="655.856" y1="269" x2="655.856" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="655.856" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.856" dy="0">30</tspan></text><line x1="769.808" y1="77" x2="769.808" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="769.808" y1="269" x2="769.808" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="769.808" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="769.808" dy="0">40</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="269" x2="883.76" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">50</tspan></text><line x1="314" y1="269" x2="883.76" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Construir, generar SBOM y procedencia y</tspan></text><text x="304" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">firmar 1.4.0</tspan></text><text x="304" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Republicar el contenido de 1.4.0 como</tspan></text><text x="304" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">1.4.2</tspan></text><text x="304" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Reconstruir 1.4.0 desde la fuente y</tspan></text><text x="304" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">comparar</tspan></text><rect x="314" y="83" width="486.575" height="24.5" rx="3" fill="#c0432f"/><text x="807.575" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="807.575" dy="0">42,7</tspan></text><rect x="314" y="110.5" width="83.185" height="24.5" rx="3" fill="#087f8c"/><text x="404.185" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="404.185" dy="0">7,3</tspan></text><rect x="314" y="147" width="517.342" height="24.5" rx="3" fill="#c0432f"/><text x="838.342" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="838.342" dy="0">45,4</tspan></text><rect x="314" y="174.5" width="80.9059" height="24.5" rx="3" fill="#087f8c"/><text x="401.906" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="401.906" dy="0">7,1</tspan></text><rect x="314" y="211" width="7.97664" height="24.5" rx="3" fill="#c0432f"/><text x="328.977" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="328.977" dy="0">0,7</tspan></text><rect x="314" y="238.5" width="9.11616" height="24.5" rx="3" fill="#087f8c"/><text x="330.116" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="330.116" dy="0">0,8</tspan></text><text x="598.88" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598.88" dy="0">Tiempo (ms)</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El árbol sintético tiene 42 archivos de unos cientos de bytes; el costo de un proyecto real lo dominan la compilación y la</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">descarga de dependencias, no la firma. Las cifras cambian en cada ejecución y entre equipos; las diferencias entre sistemas</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reflejan sobre todo el arranque de procesos de openssl.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Mediciones de reloj: una lectura por barra, no reproducibles al milisegundo.</tspan></text></svg>
