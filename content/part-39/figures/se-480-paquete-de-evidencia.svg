<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 631" width="970" height="631" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Paquete de evidencia de diez requisitos y doce pruebas: qué requisitos tienen una variante que su prueba detecta</title><desc id="d">Tabla con el paquete de evidencia de diez requisitos de un servicio de avisos y doce pruebas: todos están en verde con el servicio de referencia; seis requisitos, el cuatro, cinco, seis, siete, ocho y nueve, tienen una variante defectuosa que su prueba detecta; los cuatro requisitos uno, dos, tres y diez no tienen variante que demuestre que su prueba puede fallar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="631" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Requisito</tspan></text><rect x="440" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Pruebas</tspan></text><rect x="530" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Resultado</tspan></text><rect x="640" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="26.32" font-size="13" text-anc