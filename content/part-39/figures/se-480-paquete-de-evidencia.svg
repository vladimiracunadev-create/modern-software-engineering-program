le" font-weight="700" fill="#142231"><tspan x="222" dy="0">RF-02 no repetir un aviso</tspan></text><rect x="440" y="102" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">1</tspan></text><rect x="530" y="102" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">verde</tspan></text><rect x="640" y="102" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">ninguno</tspan></text><rect x="810" y="102" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">—</tspan></text><rect x="10" y="148" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">RF-03 no avisar si está entregada</tspan></text><rect x="440" y="148" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">1</tspan></text><rect x="530" y="148" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">verde</tspan></text><rect x="640" y="148" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#