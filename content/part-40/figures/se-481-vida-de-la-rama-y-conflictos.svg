<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 519" width="940" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Vida de una rama y choque de archivos con la troncal (8 personas, 400 archivos con puntos calientes)</title><desc id="d">Barras con el porcentaje de ramas que tocan algún archivo que otra persona también cambió según su vida: con medio día el 21 por ciento, con un día el 49, con dos días el 89 y con cinco días o más prácticamente todas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="519" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Vida de una rama y choque de archivos con la troncal (8 personas, 400 archivos con puntos calientes)</tspan></text><line x1="78.62" y1="327" x2="920" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="275" x2="920" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="275" x2="78.62" y2="275" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="223" x2="920" y2="223" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="223" x2="78.62" y2="223" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="227.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="171" x2="920" y2="171" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="171" x2="78.62" y2="171" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="175.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="119" x2="920" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="119" x2="78.62" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 197)">Ramas con choque (%)</text><rect x="92.643" y="272.053" width="112.184" height="54.9467" rx="3" fill="#c0432f"/><text x="148.735" y="266.053" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="148.735" dy="0">21</tspan></text><text x="148.735" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="148.735" dy="0">0,5 días</tspan></text><rect x="232.873" y="198.733" width="112.184" height="128.267" rx="3" fill="#c0432f"/><text x="288.965" y="192.733" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="288.965" dy="0">49</tspan></text><text x="288.965" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">1 día</tspan></text><rect x="373.103" y="95.6" width="112.184" height="231.4" rx="3" fill="#c0432f"/><text x="429.195" y="89.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="429.195" dy="0">89</tspan></text><text x="429.195" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429.195" dy="0">2 días</tspan></text><rect x="513.333" y="67.0867" width="112.184" height="259.913" rx="3" fill="#c0432f"/><text x="569.425" y="61.0867" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="569.425" dy="0">100</tspan></text><text x="569.425" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="569.425" dy="0">5 días</tspan></text><rect x="653.563" y="67" width="112.184" height="260" rx="3" fill="#c0432f"/><text x="709.655" y="61" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.655" dy="0">100</tspan></text><text x="709.655" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">10 días</tspan></text><rect x="793.793" y="67" width="112.184" height="260" rx="3" fill="#c0432f"/><text x="849.885" y="61" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="849.885" dy="0">100</tspan></text><text x="849.885" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="849.885" dy="0">20 días</tspan></text><rect x="10" y="379" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Archivos en choque (media) por vida de la rama: 0,2, 0,6, 1,7, 5,9, 13,9, 30,8. La probabilidad de choque no crece de forma</tspan></text><text x="470" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lineal sino saturada: pasa de 21 % a 89 % en un día y medio y después ya no puede empeorar, aunque el trabajo por resolver</tspan></text><text x="470" y="437.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sigue creciendo (de 0,2 a 31 archivos). Los puntos calientes (los archivos que todos tocan) y las tres modificaciones</tspan></text><text x="470" y="453.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">diarias por persona son supuestos del autor.</tspan></text><text x="470" y="501.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
