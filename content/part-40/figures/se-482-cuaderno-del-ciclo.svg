nt-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">4</tspan></text><rect x="100" y="194" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">quien ya entregó no recibe</tspan></text><rect x="490" y="194" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">sí</tspan></text><rect x="620" y="194" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">sí</tspan></text><rect x="770" y="194" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">9</tspan></text><rect x="10" y="240" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">5</tspan></text><rect x="100" y="240" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">una entrega vencida no avisa</tspan></text><rect x="490" y="240" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">sí</tspan></text><rect x="620" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">sí</tspan></text><rect x="770" y="240" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">9</tspan></text><rect x="10" y="286" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">6</tspan></text><rect x="100" y="286" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">tras una caída solo el más urgente</tspan></text><rect x="490" y="286" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">sí</tspan></text><rect x="620" y="286" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">sí</tspan></text><rect x="770" y="286" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">11</tspan></text><rect x="10" y="332" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="355.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">7</tspan></text><rect x="100" y="332" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">el silencio deja pasar la última hora</tspan></text><rect x="490" y="332" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">sí</tspan></text><rect x="620" y="332" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">sí</tspan></text><rect x="770" y="332" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">14</tspan></text><rect x="10" y="378" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="401.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">8</tspan></text><rect x="100" y="378" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">el silencio es por curso</tspan></text><rect x="490" y="378" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">sí</tspan></text><rect x="620" y="378" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">sí</tspan></text><rect x="770" y="378" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">15</tspan></text><rect x="10" y="428" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las ocho pruebas fallaron primero por la razón esperada y pasaron con la versión mínima; la prueba 5 no añadió ninguno</tspan></text><text x="470" y="469.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">porque protege una regla (no avisar tras el vencimiento) que ninguno de los 18 mutantes elimina. La curva depende de qué 18</tspan></text><text x="470" y="486.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mutantes escribió el autor.</tspan></text><text x="470" y="525.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Núcleo de Avisos con 20 mutantes escritos a mano (18 no equivalentes y 2 equivalentes); ejecutado en Windows 11 y Ubuntu (WSL2) con los mismos recuentos.</tspan></text></svg>
