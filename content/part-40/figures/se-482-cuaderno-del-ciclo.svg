<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 539" width="940" height="539" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho pasos rojo-verde sobre el núcleo de Avisos y mutantes muertos tras cada prueba</title><desc id="d">Tabla con ocho pasos de un ciclo rojo-verde sobre el núcleo de Avisos: cada prueba nueva falla con la versión anterior y pasa con la nueva sin romper las anteriores, y los mutantes muertos acumulados crecen de 1 tras la primera prueba a 6, 8, 9, 9, 11, 14 y 15 tras la octava de 18 posibles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="539" fill="#ffffff"/><rect x="10" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="52" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="52" dy="0">Paso</tspan></text><rect x="100" y="12" width="384" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="292" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="292" dy="0">Prueba nueva</tspan></text><rect x="490" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Roja antes</tspan></text><rect x="620" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Verde después</tspan></text><rect x="770" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Mutantes muertos</tspan></text><rect x="10" y="56" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">1</tspan></text><rect x="100" y="56" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">sin aviso lejos del vencimiento</tspan></text><rect x="490" y="56" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">sí</tspan></text><rect x="620" y="56" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">sí</tspan></text><rect x="770" y="56" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">1</tspan></text><rect x="10" y="102" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">2</tspan></text><rect x="100" y="102" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">aviso a las 72 horas</tspan></text><rect x="490" y="102" width="124" height="40" rx="10" fill=