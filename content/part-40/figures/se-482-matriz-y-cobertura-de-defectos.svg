<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Matriz 3 sistemas × 4 versiones × 3 bases (36 combinaciones): qué defectos encuentra cada estrategia</title><desc id="d">Barras agrupadas con el porcentaje de defectos de uno, dos y tres factores que encuentra cada estrategia: la matriz completa de 36 combinaciones encuentra el 100 por ciento de todos; pareja a pareja con 12 combinaciones el 100, 100 y 39; una a la vez con 8, el 100, 52 y 28; nueve al azar, el 99, 62 y 23.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Matriz 3 sistemas × 4 versiones × 3 bases (36 combinaciones): qué defectos encuentra cada estrategia</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Defecto de 1 factor</tspan></text><rect x="207.26" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">De 2 factores</tspan></text><rect x="353.28" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="373.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="373.28" dy="0">De 3 factores</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Defectos encontrados (%)</text><rect x="99.6545" y="95" width="53.4253" height="280" rx="3" fill="#087f8c"/><text x="126.367" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.367" dy="0">100</tspan></text><rect x="157.08" y="95" width="53.4253" height="280" rx="3" fill="#946512"/><text x="183.793" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="183.793" dy="0">100</tspan></text><rect x="214.505" y="95" width="53.4253" height="280" rx="3" fill="#c0432f"/><text x="241.218" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="241.218" dy="0">100</tspan></text><text x="183.793" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">completa (36)</tspan></text><rect x="310" y="95" width="53.4253" height="280" rx="3" fill="#087f8c"/><text x="336.712" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="336.712" dy="0">100</tspan></text><rect x="367.425" y="95" width="53.4253" height="280" rx="3" fill="#946512"/><text x="394.138" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="394.138" dy="0">100</tspan></text><rect x="424.85" y="267.2" width="53.4253" height="107.8" rx="3" fill="#c0432f"/><text x="451.563" y="261.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="451.563" dy="0">38</tspan></text><text x="394.138" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">pareja a pareja (12)</tspan></text><rect x="520.345" y="95" width="53.4253" height="280" rx="3" fill="#087f8c"/><text x="547.057" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.057" dy="0">100</tspan></text><rect x="577.77" y="230.8" width="53.4253" height="144.2" rx="3" fill="#946512"/><text x="604.483" y="224.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="604.483" dy="0">52</tspan></text><rect x="635.195" y="295.9" width="53.4253" height="79.1" rx="3" fill="#c0432f"/><text x="661.908" y="289.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="661.908" dy="0">28</tspan></text><text x="604.482" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">una a la vez (8)</tspan></text><rect x="730.689" y="98.5" width="53.4253" height="276.5" rx="3" fill="#087f8c"/><text x="757.402" y="92.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="757.402" dy="0">99</tspan></text><rect x="788.115" y="202.1" width="53.4253" height="172.9" rx="3" fill="#946512"/><text x="814.827" y="196.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="814.827" dy="0">62</tspan></text><rect x="845.54" y="309.9" width="53.4253" height="65.1" rx="3" fill="#c0432f"/><text x="872.253" y="303.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="872.253" dy="0">23</tspan></text><text x="814.827" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">9 al azar (9)</tspan></text><rect x="10" y="427" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, las combinaciones de cada estrategia. Cubrir todas las parejas con 12 de 36 combinaciones no deja escapar</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ningún defecto de dos factores pero sí el 61 % de los de tres. Una a la vez mira cada nivel pero no las interacciones. Cada</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">defecto es de un solo tipo y se eligió al azar entre 400 conjuntos; la distribución real de defectos de interacción es</tspan></text><text x="470" y="501.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">desconocida.</tspan></text><text x="470" y="549.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
