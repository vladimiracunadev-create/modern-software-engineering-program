<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 395" width="940" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Duración de la misma canalización de 9 jobs según el número de ejecutores</title><desc id="d">Barras: con un ejecutor la canalización tarda 46,5 minutos; con dos 26,5, con tres 23,5 y con cuatro u ocho 22 minutos, que es el camino crítico; más ejecutores no la acortan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="395" fill="#ffffff"/><text x="150" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">1 ejecutor</tspan></text><rect x="160" y="16" width="651" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="819" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="819" dy="0">46,5 min</tspan></text><text x="150" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">2 ejecutores</tspan></text><rect x="160" y="60" width="371" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="539" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="539" dy="0">26,5 min</tspan></text><text x="150" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">3 ejecutores</tspan></text><rect x="160" y="104" width="329" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="497" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="497" dy="0">23,5 min</tspan></text><text x="150" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">4 ejecutores</tspan></text><rect x="160" y="148" width="308" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="476" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="476" dy="0">22,0 min</tspan></text><text x="150" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">8 ejecutores</tspan></text><rect x="160" y="192" width="308" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="476" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="476" dy="0">22,0 min</tspan></text><text x="150" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="150" dy="0">Camino crítico</tspan></text><rect x="160" y="236" width="308" height="28" rx="3" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="476" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="476" dy="0">22,0 min</tspan></text><rect x="10" y="284" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El trabajo total son 46,5 minutos (con 0,5 min de arranque por job); el camino crítico (preparar, compilar, pruebas e2e,</tspan></text><text x="470" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">empaquetar) es de 22. Pasar de 1 a 4 ejecutores ahorra 24,5 minutos; pasar de 4 a 8 no ahorra nada pero sí cuesta. Las</tspan></text><text x="470" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">duraciones de los jobs son supuestos del autor.</tspan></text><text x="470" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
