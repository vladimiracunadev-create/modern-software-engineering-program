<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 495" width="1000" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos estilos de prueba ante cuatro refactores, un cambio de contrato y seis defectos del mismo servicio</title><desc id="d">Tabla con dos suites de pruebas sobre el mismo servicio de avisos: la clásica, con dobles con estado, pasa los cuatro refactores y falla solo el cambio de contrato del puerto, y la de Londres, con dobles simulados, falla el refactor que pide todas las entregas y filtra en el servicio y también el cambio de contrato; las dos detectan los seis defectos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="495" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Cambio</tspan></text><rect x="440" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Naturaleza</tspan></text><rect x="630" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Estilo clásico</tspan></text><rect x="810" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="897" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="897" dy="0">Estilo de Londres</tspan></text><rect x="10" y="56" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">R1 leer el reloj una vez</tspan></text><rect x="440" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">refactor</tspan></text><rect x="630" y="56" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">pasa</tspan></text><rect x="810" y="56" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">pasa</tspan></text><rect x="10" y="110" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">R2 pedir todas las entregas y filtrar en el servicio</tspan></text><rect x="440" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">refactor</tspan></text><rect x="630" y="110" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">pasa</tspan></text><rect x="810" y="110" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">FALLA</tspan></text><rect x="10" y="164" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">R3 extraer el cálculo del umbral</tspan></text><rect x="440" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">refactor</tspan></text><rect x="630" y="164" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">pasa</tspan></text><rect x="810" y="164" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">pasa</tspan></text><rect x="10" y="218" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">R4 leer lo registrado antes del reloj</tspan></text><rect x="440" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">refactor</tspan></text><rect x="630" y="218" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">pasa</tspan></text><rect x="810" y="218" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">pasa</tspan></text><rect x="10" y="272" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">R5 renombrar el puerto de registro</tspan></text><rect x="440" y="272" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">cambio de contrato</tspan></text><rect x="630" y="272" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">FALLA</tspan></text><rect x="810" y="272" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">FALLA</tspan></text><rect x="10" y="326" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="353.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">D1 a D6, seis defectos de comportamiento</tspan></text><rect x="440" y="326" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">defectos</tspan></text><rect x="630" y="326" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">detecta 6 de 6</tspan></text><rect x="810" y="326" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">detecta 6 de 6</tspan></text><rect x="10" y="384" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="408.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">La diferencia aparece donde el refactor cambia cómo el servicio consulta a un colaborador: la prueba de Londres fijó esa consulta,</tspan></text><text x="500" y="425.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">la clásica solo fijó el resultado. Ambas detectan los mismos seis defectos. Son dos suites escritas por el autor sobre un servicio</tspan></text><text x="500" y="442.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">pequeño.</tspan></text><text x="500" y="481.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
