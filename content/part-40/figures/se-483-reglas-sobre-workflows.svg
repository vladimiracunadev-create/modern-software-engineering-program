<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 547" width="940" height="547" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reglas de texto sobre 160 workflows con 8 clases de defecto sembrado y 6 señuelos</title><desc id="d">Barras agrupadas con aciertos, falsos positivos y defectos no vistos de dos conjuntos de reglas sobre 209 defectos sembrados: las ingenuas encuentran todos pero producen 180 falsas alarmas, con precisión de 54 por ciento; las afinadas reducen las falsas alarmas a 45 y pierden 5 defectos, con precisión de 82 y exhaustividad de 98.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="547" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reglas de texto sobre 160 workflows con 8 clases de defecto sembrado y 6 señuelos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aciertos</tspan></text><rect x="124.32" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Falsos positivos</tspan></text><rect x="292.96" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="312.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="312.96" dy="0">Defectos no vistos</tspan></text><line x1="78.62" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="355" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="303" x2="920" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="303" x2="78.62" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="251" x2="920" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="251" x2="78.62" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="199" x2="920" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="199" x2="78.62" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">150</tspan></text><line x1="78.62" y1="147" x2="920" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">250</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Defectos o alarmas</text><rect x="120.689" y="137.64" width="109.517" height="217.36" rx="3" fill="#087f8c"/><text x="175.448" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.448" dy="0">209</tspan></text><rect x="234.206" y="167.8" width="109.517" height="187.2" rx="3" fill="#c0432f"/><text x="288.965" y="161.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="288.965" dy="0">180</tspan></text><rect x="347.724" y="353" width="109.517" height="2" rx="3" fill="#946512"/><text x="402.482" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="402.482" dy="0">0</tspan></text><text x="288.965" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Reglas ingenuas</tspan></text><rect x="541.379" y="142.84" width="109.517" height="212.16" rx="3" fill="#087f8c"/><text x="596.138" y="136.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="596.138" dy="0">204</tspan></text><rect x="654.896" y="308.2" width="109.517" height="46.8" rx="3" fill="#c0432f"/><text x="709.655" y="302.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.655" dy="0">45</tspan></text><rect x="768.414" y="349.8" width="109.517" height="5.2" rx="3" fill="#946512"/><text x="823.172" y="343.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="823.172" dy="0">5</tspan></text><text x="709.655" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Reglas afinadas</tspan></text><rect x="10" y="407" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Precisión 54 % y exhaustividad 100 % las ingenuas; 82 % y 98 % las afinadas. Las reglas ingenuas ven todo y avisan de</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">demasiado: por eso un equipo las desactiva. Las afinadas ignoran comentarios y acciones locales, pero se equivocan donde el</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">defecto cambia de forma (un bloque de varias líneas) y donde el valor es seguro (el número del PR). Se afinaron con los</tspan></text><text x="470" y="481.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mismos señuelos que las evalúan: son una frontera, no una tasa.</tspan></text><text x="470" y="529.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
