<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 628" width="940" height="628" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reintentar pruebas: porcentaje de ejecuciones que pasan con 0, 1 o 2 reintentos</title><desc id="d">Líneas en escala logarítmica con el porcentaje de ejecuciones que pasan según los reintentos: un defecto real que aparece en el 20 por ciento de las ejecuciones pasa el 80 por ciento sin reintentos, el 96 con uno y el 99 con dos; los rojos falsos por pruebas inestables bajan de 25,9 por ciento a 0,015 con un reintento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="628" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reintentar pruebas: porcentaje de ejecuciones que pasan con 0, 1 o 2 reintentos</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Defecto en el 50 % de las ejecuciones (pasan)</tspan></text><rect x="403.3" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="423.3" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="423.3" dy="0">Defecto en el 20 % de las ejecuciones (pasan)</tspan></text><polygon points="22,68.1 28.6,80.4 15.4,80.4" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Defecto en el 5 % de las ejecuciones (pasan)</tspan></text><polygon points="401.76,67.5 409.26,75 401.76,82.5 394.26,75" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="415.76" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="415.76" dy="0">Rojo falso por pruebas inestables</tspan></text><line x1="86.16" y1="411" x2="910" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="411" x2="86.16" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="415.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,01</tspan></text><line x1="86.16" y1="336" x2="910" y2="336" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="336" x2="86.16" y2="336" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="340.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,1</tspan></text><line x1="86.16" y1="261" x2="910" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="261" x2="86.16" y2="261" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="265.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1</tspan></text><line x1="86.16" y1="186" x2="910" y2="186" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="186" x2="86.16" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="190.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">10</tspan></text><line x1="86.16" y1="111" x2="910" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="111" x2="86.16" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">100</tspan></text><line x1="86.16" y1="111" x2="86.16" y2="411" stroke="#5b7280" stroke-width="1.6"/><line x1="104.16" y1="111" x2="104.16" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="104.16" y1="411" x2="104.16" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="104.16" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.16" dy="0">0</tspan></text><line x1="498.08" y1="111" x2="498.08" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="498.08" y1="411" x2="498.08" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="498.08" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498.08" dy="0">1</tspan></text><line x1="892" y1="111" x2="892" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="411" x2="892" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">2</tspan></text><line x1="86.16" y1="411" x2="910" y2="411" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 261)">Ejecuciones (%) (escala logarítmica)</text><text x="498.08" y="457" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="498.08" dy="0">Reintentos permitidos</tspan></text><polyline points="104.16,133.752 498.08,120.529 892,115.306" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="104.16" cy="133.752" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="498.08" cy="120.529" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="892" cy="115.306" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polyline points="104.16,118.228 498.08,112.286 892,111.258" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="98.66" y="112.728" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="104.16" y="107.228" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">80,1 %</tspan></text><rect x="492.58" y="106.786" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="498.08" y="101.286" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="498.08" dy="0">96,1 %</tspan></text><rect x="886.5" y="105.758" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="100.258" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">99,2 %</tspan></text><polyline points="104.16,112.693 498.08,111.083 892,111.004" fill="none" stroke="#102a43" stroke-width="2.4"/><polygon points="104.16,106.368 110.21,117.643 98.11,117.643" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="498.08,104.758 504.13,116.033 492.03,116.033" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="892,104.679 898.05,115.954 885.95,115.954" fill="#102a43" stroke="#102a43" stroke-width="2"/><polyline points="104.16,154.973 498.08,397.796 892,411" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="104.16,148.098 111.035,154.973 104.16,161.848 97.285,154.973" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="104.16" y="143.973" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">25,9 %</tspan></text><polygon points="498.08,390.921 504.955,397.796 498.08,404.671 491.205,397.796" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="498.08" y="386.796" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="498.08" dy="0">0,015 %</tspan></text><polygon points="892,404.125 898.875,411 892,417.875 885.125,411" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="400" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,000 %</tspan></text><rect x="10" y="471" width="920" height="109.2" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="495.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las tres primeras líneas son el porcentaje de ejecuciones que pasan con un defecto real; la roja es el porcentaje de</tspan></text><text x="470" y="512.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ejecuciones en rojo por pruebas inestables (600 pruebas, 0,05 % cada una). El reintento hace desaparecer los rojos falsos</tspan></text><text x="470" y="529.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(25,9 % → 0,015 %) y también hace pasar los defectos intermitentes: uno que aparece 1 vez de 5 pasa el 99,2 % con dos</tspan></text><text x="470" y="545.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reintentos. Reintentar sin registrar qué se reintentó convierte una señal en ruido silencioso; hay que contar los</tspan></text><text x="470" y="562.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reintentos y cuarentenar la prueba.</tspan></text><text x="470" y="610.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
