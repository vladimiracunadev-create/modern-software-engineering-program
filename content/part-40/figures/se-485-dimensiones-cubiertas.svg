<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 415" width="1000" height="415" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué dimensiones del problema varía cada conjunto de ejemplos</title><desc id="d">Tabla con las dimensiones que varía cada conjunto de ejemplos: los cinco típicos eligen tres puntos sueltos del tiempo, incluyen una entrega entregada y un curso silenciado y usan un solo curso y persona; los doce de frontera cubren los límites del tiempo pero no varían entregada ni silenciado; los veinte al azar varían todo a veces; los 144 combinatorios cubren tiempo, entregada y silenciado pero no varían curso ni persona, por lo que dejan vivo M08.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="415" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Conjunto</tspan></text><rect x="200" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">Límites del tiempo</tspan></text><rect x="470" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Entregada</tspan></text><rect x="590" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Silenciado</tspan></text><rect x="740" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Varios cursos o personas</tspan></text><rect x="10" y="56" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">5 típicos</tspan></text><rect x="200" y="56" width="264" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">tres puntos sueltos</tspan></text><rect x="470" y="56" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">sí</tspan></text><rect x="590" y="56" width="144" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">una vez</tspan></text><rect x="740" y="56" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">un solo curso y persona</tspan></text><rect x="10" y="126" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">12 de frontera</tspan></text><rect x="200" y="126" width="264" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">sí: 12 valores en los límites</tspan></text><rect x="470" y="126" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">no</tspan></text><rect x="590" y="126" width="144" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">no</tspan></text><rect x="740" y="126" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">un solo curso y persona</tspan></text><rect x="10" y="196" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">20 al azar</tspan></text><rect x="200" y="196" width="264" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">valores sueltos</tspan></text><rect x="470" y="196" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">a veces</tspan></text><rect x="590" y="196" width="144" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">a veces</tspan></text><rect x="740" y="196" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">un solo curso y persona</tspan></text><rect x="10" y="266" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">144 combinatorios</tspan></text><rect x="200" y="266" width="264" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">sí</tspan></text><rect x="470" y="266" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">sí</tspan></text><rect x="590" y="266" width="144" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">sí</tspan></text><rect x="740" y="266" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">no</tspan></text><rect x="10" y="340" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">La columna de la derecha explica el único mutante que sobrevive al conjunto más grande: ningún ejemplo distingue silenciar a una</tspan></text><text x="500" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">persona de silenciar un curso. Elegir ejemplos es decidir qué dimensiones se comprueban.</tspan></text></svg>
