<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 583" width="940" height="583" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una versión con 4 puntos de error adicional a 100 solicitudes por segundo: solicitudes fallidas hasta el retroceso (600 repeticiones)</title><desc id="d">Barras agrupadas con las solicitudes fallidas hasta el retroceso: si la versión mala se despliega de una vez fallan 240 de media y 268 en el percentil 95; con cuatro tandas, 59 y 72; con un canario del 1 por ciento al 100 por ciento, 6 y 9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="583" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una versión con 4 puntos de error adicional a 100 solicitudes por segundo: solicitudes fallidas hasta el</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">retroceso (600 repeticiones)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Fallos medios</tspan></text><rect x="162.02" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="182.02" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Fallos p95</tspan></text><line x1="78.62" y1="374" x2="920" y2="374" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="374" x2="78.62" y2="374" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="378.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="287.333" x2="920" y2="287.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287.333" x2="78.62" y2="287.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="200.667" x2="920" y2="200.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="200.667" x2="78.62" y2="200.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="205.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="114" x2="78.62" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="114" x2="78.62" y2="374" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 244)">Solicitudes fallidas</text><rect x="106.666" y="165.624" width="110.184" height="208.376" rx="3" fill="#102a43"/><text x="161.758" y="159.624" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">240</tspan></text><rect x="220.85" y="141.733" width="110.184" height="232.267" rx="3" fill="#c0432f"/><text x="275.942" y="135.733" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">268</tspan></text><text x="218.85" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">todo de una vez</tspan></text><rect x="387.126" y="322.464" width="110.184" height="51.5363" rx="3" fill="#102a43"/><text x="442.218" y="316.464" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">59</tspan></text><rect x="501.31" y="312.033" width="110.184" height="61.9667" rx="3" fill="#c0432f"/><text x="556.402" y="306.033" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">72</tspan></text><text x="499.31" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">gradual en 4 tandas</tspan></text><rect x="667.586" y="368.996" width="110.184" height="5.00356" rx="3" fill="#102a43"/><text x="722.678" y="362.996" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">6</tspan></text><rect x="781.77" y="366.373" width="110.184" height="7.62667" rx="3" fill="#c0432f"/><text x="836.862" y="360.373" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">9</tspan></text><text x="779.77" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">canario 1 % → 5 % → 25 % → 100 %</tspan></text><rect x="10" y="426" width="920" height="109.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="450.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Detección media y retrocesos falsos de las versiones buenas, por estrategia: todo de una vez: 1,0 min y 0,5 % de retrocesos</tspan></text><text x="470" y="467.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">falsos; gradual en 4 tandas: 1,0 min y 2,3 % de retrocesos falsos; canario 1 % → 5 % → 25 % → 100 %: 2,4 min y 1,8 % de</tspan></text><text x="470" y="484.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">retrocesos falsos. El canario reduce el daño en un 98 % no porque detecte antes (2,4 min frente a 1) sino porque solo lo ve</tspan></text><text x="470" y="500.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una fracción del tráfico. La detección es estadística: con 1 % del tráfico y umbral estricto hay que esperar. Un retroceso</tspan></text><text x="470" y="517.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">falso cuesta una versión buena perdida. Poisson y normal aproximan al binomial; error base 0,5 %.</tspan></text><text x="470" y="565.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
