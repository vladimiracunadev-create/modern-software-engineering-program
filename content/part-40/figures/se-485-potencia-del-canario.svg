<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 369" width="940" height="369" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de detectar una subida del error en 10 minutos de canario (error base 0,5 %, umbral 0,1 %)</title><desc id="d">Mapa de calor con la probabilidad de detectar una subida del error según el tráfico del canario: con el 1 por ciento una subida de 0,5 puntos se detecta el 4 por ciento de las veces, una de 1 punto el 29, una de 2 puntos el 88 y una de 4 puntos el 99,98; con el 5 por ciento, el 60, 99,6, 100 y 100; con el 25 por ciento todas superan el 99,99.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="369" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de detectar una subida del error en 10 minutos de canario (error base 0,5 %, umbral 0,1 %)</tspan></text><text x="293.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="293.5" dy="0">+0,5 puntos</tspan></text><text x="472.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="472.5" dy="0">+1 punto</tspan></text><text x="651.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="651.5" dy="0">+2 puntos</tspan></text><text x="830.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="830.5" dy="0">+4 puntos</tspan></text><text x="194" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="194" dy="0">1 % del tráfico</tspan></text><text x="194" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="194" dy="0">5 % del tráfico</tspan></text><text x="194" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="194" dy="0">25 % del tráfico</tspan></text><rect x="205.5" y="73.5" width="176" height="41" rx="4" fill="#d0dae5" stroke="#ffffff" stroke-width="1"/><text x="293.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="293.5" dy="0">4,3</tspan></text><rect x="384.5" y="73.5" width="176" height="41" rx="4" fill="#9eacba" stroke="#ffffff" stroke-width="1"/><text x="472.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="472.5" dy="0">29,4</tspan></text><rect x="563.5" y="73.5" width="176" height="41" rx="4" fill="#284057" stroke="#ffffff" stroke-width="1"/><text x="651.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="651.5" dy="0">88,2</tspan></text><rect x="742.5" y="73.5" width="176" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="830.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830.5" dy="0">100,0</tspan></text><rect x="205.5" y="117.5" width="176" height="41" rx="4" fill="#617487" stroke="#ffffff" stroke-width="1"/><text x="293.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="293.5" dy="0">59,7</tspan></text><rect x="384.5" y="117.5" width="176" height="41" rx="4" fill="#112b44" stroke="#ffffff" stroke-width="1"/><text x="472.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472.5" dy="0">99,6</tspan></text><rect x="563.5" y="117.5" width="176" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="651.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="651.5" dy="0">100,0</tspan></text><rect x="742.5" y="117.5" width="176" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="830.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830.5" dy="0">100,0</tspan></text><rect x="205.5" y="161.5" width="176" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="293.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="293.5" dy="0">100,0</tspan></text><rect x="384.5" y="161.5" width="176" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="472.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472.5" dy="0">100,0</tspan></text><rect x="563.5" y="161.5" width="176" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="651.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="651.5" dy="0">100,0</tspan></text><rect x="742.5" y="161.5" width="176" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="830.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830.5" dy="0">100,0</tspan></text><text x="204" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204" dy="0">0,0</tspan></text><rect x="234.62" y="218" width="30.5" height="14" fill="#d9e2ec"/><rect x="264.62" y="218" width="30.5" height="14" fill="#bcc8d4"/><rect x="294.62" y="218" width="30.5" height="14" fill="#a0adbc"/><rect x="324.62" y="218" width="30.5" height="14" fill="#8393a4"/><rect x="354.62" y="218" width="30.5" height="14" fill="#66798b"/><rect x="384.62" y="218" width="30.5" height="14" fill="#495f73"/><rect x="414.62" y="218" width="30.5" height="14" fill="#2d445b"/><rect x="444.62" y="218" width="30.5" height="14" fill="#102a43"/><text x="482.62" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="482.62" dy="0">100,0</tspan></text><text x="528.32" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="528.32" dy="0">más oscuro = mayor (Probabilidad de detección (%))</tspan></text><rect x="10" y="246" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un canario del 1 % no ve una degradación sutil: 600 solicitudes en 10 minutos dan 3 errores esperados y el umbral exige 11.</tspan></text><text x="470" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La potencia depende del tráfico, no de la voluntad de mirar. Si el servicio recibe poco tráfico, el canario es un trámite.</tspan></text><text x="470" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo exacto con la cola de Poisson (normal si la media supera 50).</tspan></text><text x="470" y="351.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
