<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 287" width="990" height="287" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho entregas del contexto académico leídas por el contexto de avisos, con y sin traducción</title><desc id="d">Tabla con ocho entregas del contexto académico: con la capa de traducción, 2 quedan como entregadas y se envían 6 avisos; sin traducir, el estado como texto cuenta las 8 como entregadas porque cualquier texto no vacío es verdadero y no se envía ningún aviso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="287" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Camino</tspan></text><rect x="370" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Entregas</tspan></text><rect x="500" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="637" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">Contadas como entregadas</tspan></text><rect x="780" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="877" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">Avisos enviados</tspan></text><rect x="10" y="56" width="354" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Con la capa de traducción</tspan></text><rect x="370" y="56" width="124" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">8</tspan></text><rect x="500" y="56" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">2</tspan></text><rect x="780" y="56" width="194" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">6</tspan></text><rect x="10" y="122" width="354" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Sin traducir (el estado pasa como texto)</tspan></text><rect x="370" y="122" width="124" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">8</tspan></text><rect x="500" y="122" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">8 contadas como entregadas</tspan></text><rect x="780" y="122" width="194" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">0</tspan></text><rect x="10" y="192" width="970" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="216.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">El fallo no lanza ninguna excepción: el servicio funciona y no avisa a nadie. Un nombre compartido entre contextos sin traducción</tspan></text><text x="495" y="233.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">explícita produce errores silenciosos. Ocho entregas sintéticas; el mecanismo es general, la magnitud no.</tspan></text><text x="495" y="273.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
