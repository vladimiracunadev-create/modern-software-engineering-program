<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 351" width="1000" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Horas que vive una deriva manual hasta que una comprobación la ve (media de 5 000 derivas)</title><desc id="d">Barras: con un plan cada hora una deriva vive 0,5 horas de media; cada 6 horas, 3,0; diario, 11,9; solo al fusionar, 55,8, y con un plan semanal, 83 horas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="351" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">plan cada hora</tspan></text><rect x="300" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="312" dy="0">0,5 h</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">plan cada 6 horas</tspan></text><rect x="300" y="60" width="6.64048" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="314.64" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="314.64" dy="0">3,0 h</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">plan diario</tspan></text><rect x="300" y="104" width="26.1106" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="334.111" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="334.111" dy="0">11,9 h</tspan></text><text x="290" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">solo al fusionar (3 por semana)</tspan></text><rect x="300" y="148" width="122.734" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="430.734" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="430.734" dy="0">55,8 h</tspan></text><text x="290" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">plan semanal</tspan></text><rect x="300" y="192" width="182.598" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490.598" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="490.598" dy="0">83,0 h</tspan></text><rect x="10" y="240" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">La espera media es la mitad del intervalo entre comprobaciones; comprobar solo al fusionar depende del ritmo del equipo (3 fusiones</tspan></text><text x="500" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">por semana ⇒ 56 h) y es peor cuando el equipo para. Detectar más pronto no corrige: si la deriva es una corrección de emergencia,</tspan></text><text x="500" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">revertirla automáticamente puede provocar la caída que se quiso evitar.</tspan></text><text x="500" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
