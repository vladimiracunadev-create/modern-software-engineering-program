<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 307" width="990" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma precondición ejecutada con y sin la opción de optimización de Python</title><desc id="d">Tabla con la misma función y la misma llamada con una entrega ya vencida ejecutadas en dos procesos reales de Python: en modo normal la aserción de la precondición se evalúa y el programa informa de que el contrato se violó, y con la opción de optimización la aserción desaparece y la función devuelve menos diez.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="307" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Ejecución</tspan></text><rect x="210" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Salida observada</tspan></text><rect x="640" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Qué ocurrió</tspan></text><rect x="10" y="56" width="194" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">python (normal)</tspan></text><rect x="210" y="56" width="424" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">contrato violado: precondición: la entrega no ha</tspan></text><text x="422" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">vencido</tspan></text><rect x="640" y="56" width="334" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">la aserción se evalúa y detiene el cálculo</tspan></text><rect x="10" y="132" width="194" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="170.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">python -O</tspan></text><rect x="210" y="132" width="424" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">resultado -10</tspan></text><rect x="640" y="132" width="334" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="162.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">la aserción desaparece y el cálculo</tspan></text><text x="807" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">devuelve un valor sin sentido</tspan></text><rect x="10" y="212" width="970" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="236.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Una precondición escrita con assert no es un contrato si el despliegue puede ejecutarse con -O o PYTHONOPTIMIZE. Un contrato que</tspan></text><text x="495" y="253.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">debe valer en producción se escribe como una comprobación explícita que lanza una excepción.</tspan></text><text x="495" y="293.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Dos procesos de Python lanzados con subprocess; mismo resultado en Windows 11 (CPython 3.12.9) y Ubuntu (3.12.3).</tspan></text></svg>
