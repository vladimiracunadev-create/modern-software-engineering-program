<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Refactorizar manifiestos con poda activada: recursos borrados por cada refactorización que mueve archivos</title><desc id="d">Barras agrupadas con los recursos borrados por refactorización y los que tienen estado: sin poda no se borra nada; con poda se borran 1,97 y 0,32 tienen estado; con poda y protección de los recursos con estado se borran 1,71 y ninguno tiene estado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Refactorizar manifiestos con poda activada: recursos borrados por cada refactorización que mueve archivos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Recursos borrados por refactorización</tspan></text><rect x="342.98" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="362.98" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="362.98" dy="0">De ellos, con estado</tspan></text><line x1="78.62" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="355" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="290" x2="920" y2="290" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="290" x2="78.62" y2="290" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="294.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,5</tspan></text><line x1="78.62" y1="225" x2="920" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="225" x2="78.62" y2="225" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="229.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="160" x2="920" y2="160" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="160" x2="78.62" y2="160" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="164.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1,5</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">2</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Recursos por refactorización</text><rect x="106.666" y="353" width="110.184" height="2" rx="3" fill="#c0432f"/><text x="161.758" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">0,00</tspan></text><rect x="220.85" y="353" width="110.184" height="2" rx="3" fill="#946512"/><text x="275.942" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">0,00</tspan></text><text x="218.85" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">sin poda</tspan></text><rect x="387.126" y="99.0985" width="110.184" height="255.901" rx="3" fill="#c0432f"/><text x="442.218" y="93.0985" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">1,97</tspan></text><rect x="501.31" y="313.631" width="110.184" height="41.3695" rx="3" fill="#946512"/><text x="556.402" y="307.631" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">0,32</tspan></text><text x="499.31" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">con poda</tspan></text><rect x="667.586" y="132.256" width="110.184" height="222.744" rx="3" fill="#c0432f"/><text x="722.678" y="126.256" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">1,71</tspan></text><rect x="781.77" y="353" width="110.184" height="2" rx="3" fill="#946512"/><text x="836.862" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">0,00</tspan></text><text x="779.77" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">con poda y protección del estado</tspan></text><rect x="10" y="407" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Para el controlador, renombrar un recurso es «borrar el viejo y crear el nuevo»: con poda, una refactorización de</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">apariencia inofensiva borra casi dos recursos, y uno de cada tres de esas refactorizaciones tocaría un volumen con datos.</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La protección explícita de lo que tiene estado cuesta una anotación. 15 % de manifiestos con estado: supuesto.</tspan></text><text x="470" y="512.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
