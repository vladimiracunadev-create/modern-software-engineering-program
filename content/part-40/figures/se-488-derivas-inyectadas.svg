<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 298" width="940" height="298" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez derivas entre especificación, código y pruebas inyectadas y lo que ve un comprobador mecánico</title><desc id="d">Barra apilada de diez derivas inyectadas: el comprobador mecánico detecta ocho por completo (reglas sin código, sin prueba o inexistentes, umbrales distintos, código editado sin tocar la especificación y archivo generado editado a mano), detecta una solo de lado (el cambio de significado de una regla aparece como archivo generado desactualizado) y no detecta una (el cambio de menor o igual a menor estricto dentro del código).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="298" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diez derivas entre especificación, código y pruebas inyectadas y lo que ve un comprobador mecánico</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Detectada solo de lado</tspan></text><rect x="353.28" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="373.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="373.28" dy="0">No detectada</tspan></text><line x1="244" y1="77" x2="244" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="244" y1="117" x2="244" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="244" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">0</tspan></text><line x1="370.34" y1="77" x2="370.34" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="370.34" y1="117" x2="370.34" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="370.34" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="370.34" dy="0">2</tspan></text><line x1="496.68" y1="77" x2="496.68" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="496.68" y1="117" x2="496.68" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="496.68" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="496.68" dy="0">4</tspan></text><line x1="623.02" y1="77" x2="623.02" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="623.02" y1="117" x2="623.02" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="623.02" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="623.02" dy="0">6</tspan></text><line x1="749.36" y1="77" x2="749.36" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="749.36" y1="117" x2="749.36" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="749.36" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.36" dy="0">8</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="117" x2="875.7" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10</tspan></text><line x1="244" y1="117" x2="875.7" y2="117" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Derivas inyectadas (10)</tspan></text><rect x="244" y="84" width="505.36" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="496.68" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="496.68" dy="0">8</tspan></text><rect x="749.36" y="84" width="63.17" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="780.945" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="780.945" dy="0">1</tspan></text><rect x="812.53" y="84" width="63.17" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="844.115" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="844.115" dy="0">1</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">10</tspan></text><text x="559.85" y="161" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="559.85" dy="0">Derivas</tspan></text><rect x="10" y="175" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Detecta 9 de 10, y la décima solo de lado: avisa de que el archivo generado quedó viejo, no de que el significado cambió.</tspan></text><text x="470" y="216.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que no ve es la semántica de una expresión sin anclaje en la especificación. Las diez derivas y el comprobador son del</tspan></text><text x="470" y="233.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">autor.</tspan></text><text x="470" y="280.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
