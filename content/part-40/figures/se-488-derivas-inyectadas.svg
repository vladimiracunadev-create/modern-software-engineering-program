<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 695" width="990" height="695" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez derivas entre especificación, código y pruebas inyectadas y lo que ve un comprobador mecánico</title><desc id="d">Tabla con diez derivas inyectadas entre una especificación, el código y las pruebas: el comprobador mecánico detecta nueve, entre ellas reglas sin código, sin prueba o inexistentes, umbrales distintos, código editado sin tocar la especificación y archivo generado editado a mano, y no detecta el cambio de una comparación menor o igual por menor estricto; el cambio de significado de una regla solo aparece como archivo generado desactualizado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="695" fill="#ffffff"/><rect x="10" y="12" width="654" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="337" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337" dy="0">Deriva inyectada</tspan></text><rect x="670" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">¿La ve el comprobador?</tspan></text><rect x="10" y="56" width="654" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">D1 una regla se quita de la especificación y sigue en el código</tspan></text><rect x="670" y="56" width="304" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="110" width="654" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">D2 una regla nueva sin código</tspan></text><rect x="670" y="110" width="304" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="164" width="654" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">D3 una regla nueva sin prueba</tspan></text><rect x="670" y="164" width="304" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="218" width="654" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">D4 una prueba cita una regla inexistente</tspan></text><rect x="670" y="218" width="304" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="272" width="654" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">D5 el umbral del código se cambia a mano</tspan></text><rect x="670" y="272" width="304" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="326" width="654" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="353.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">D6 el umbral cambia en la especificación y no en el código</tspan></text><rect x="670" y="326" width="304" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="380" width="654" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="407.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">D7 se edita el código sin tocar la especificación</tspan></text><rect x="670" y="380" width="304" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="407.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="434" width="654" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="461.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">D8 se edita a mano el archivo generado</tspan></text><rect x="670" y="434" width="304" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="461.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí</tspan></text><rect x="10" y="488" width="654" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="515.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">D9 la condición cambia de &lt;= a &lt; dentro del código</tspan></text><rect x="670" y="488" width="304" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="515.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">NO</tspan></text><rect x="10" y="542" width="654" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="569.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337" dy="0">D10 una regla cambia de significado en el texto</tspan></text><rect x="670" y="542" width="304" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="569.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">sí, solo como «generado desactualizado»</tspan></text><rect x="10" y="600" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="624.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Detecta 9 de 10, y la décima solo de lado: avisa de que el archivo generado quedó viejo, no de que el significado cambió. Lo que</tspan></text><text x="495" y="641.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">no ve es la semántica de una expresión sin anclaje en la especificación. Las diez derivas y el comprobador son del autor.</tspan></text><text x="495" y="681.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
