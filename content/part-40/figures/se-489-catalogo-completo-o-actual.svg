<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un catálogo de 150 servicios: entradas que pasan según el rigor de la validación</title><desc id="d">Barras horizontales con las entradas de 150 que pasan según el rigor de la validación: comprobar solo que los campos existan aprueba 130; exigir que el dueño exista en el registro de equipos, 122; que el enlace no sea de relleno, 108; que la revisión sea de los últimos 180 días, 43; hay 107 entradas con algún problema sembrado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un catálogo de 150 servicios: entradas que pasan según el rigor de la validación</tspan></text><line x1="324" y1="49" x2="324" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="269" x2="324" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="513.273" y1="49" x2="513.273" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="513.273" y1="269" x2="513.273" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="513.273" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="513.273" dy="0">50</tspan></text><line x1="702.547" y1="49" x2="702.547" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="702.547" y1="269" x2="702.547" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="702.547" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702.547" dy="0">100</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="269" x2="891.82" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">150</tspan></text><line x1="324" y1="269" x2="891.82" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">campos presentes</tspan></text><text x="314" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">+ dueño existe en el registro de equipos</tspan></text><text x="314" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">+ enlace con forma de URL (no relleno)</tspan></text><text x="314" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">+ revisado en los últimos 180 días</tspan></text><text x="314" y="243" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Entradas con algún problema sembrado</tspan></text><text x="314" y="260" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">(dueño, enlace o revisión)</tspan></text><rect x="324" y="55" width="492.111" height="32" rx="3" fill="#102a43"/><text x="823.111" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="823.111" dy="0">130</tspan></text><rect x="324" y="99" width="461.827" height="32" rx="3" fill="#102a43"/><text x="792.827" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="792.827" dy="0">122</tspan></text><rect x="324" y="143" width="408.83" height="32" rx="3" fill="#102a43"/><text x="739.83" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="739.83" dy="0">108</tspan></text><rect x="324" y="187" width="162.775" height="32" rx="3" fill="#102a43"/><text x="493.775" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="493.775" dy="0">43</tspan></text><rect x="324" y="231" width="405.045" height="32" rx="3" fill="#102a43"/><text x="736.045" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="736.045" dy="0">107</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="269" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="896.82" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="896.82" dy="0">150 entradas</tspan></text><text x="607.91" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">Entradas de 150</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con la validación de presencia el catálogo parece completo al 87 % y en realidad solo 43 entradas (29 %) están al día.</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medir la completitud por campos lleno invita a rellenar con «TBD»; comprobar contra otra fuente (el registro de equipos, la</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">fecha de revisión) es lo que distingue completo de actual. Las proporciones de problemas son supuestos del autor.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
