<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 365" width="990" height="365" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Regresión concentrada en los casos difíciles y ruido de la misma versión</title><desc id="d">Tabla con una regresión concentrada en el 10 por ciento de casos difíciles que bajan de 0,60 a 0,20 de acierto: una muestra al azar de 100 casos deja pasar la regresión el 72,8 por ciento de las veces y rechaza la versión sana el 4,4, y un conjunto de 100 casos solo difíciles no deja pasar ninguna; la misma versión evaluada 1000 veces sobre los mismos 100 casos da una desviación de 0,037 y un rango de 0,72 a 0,95.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="365" fill="#ffffff"/><rect x="10" y="12" width="504" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="262" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="262" dy="0">Conjunto o medida</tspan></text><rect x="520" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">Pasa la regresión</tspan></text><rect x="750" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Rechaza la sana</tspan></text><rect x="10" y="56" width="504" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="262" dy="0">Muestra al azar, 100 casos (10 % difíciles)</tspan></text><rect x="520" y="56" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">72,8 %</tspan></text><rect x="750" y="56" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">4,4 %</tspan></text><rect x="10" y="126" width="504" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="262" dy="0">Solo casos difíciles, 100 casos</tspan></text><rect x="520" y="126" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">0,0 %</tspan></text><rect x="750" y="126" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0,0 %</tspan></text><rect x="10" y="196" width="504" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="262" dy="0">Misma versión, mismos 100 casos, 1000 corridas</tspan></text><rect x="520" y="196" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">desviación 0,037</tspan></text><rect x="750" y="196" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">rango 0,72 a 0,95</tspan></text><rect x="10" y="270" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Un conjunto pequeño y curado en lo difícil detecta una regresión que una muestra grande al azar no ve. Al revés, la misma versión</tspan></text><text x="495" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">puede variar 23 puntos entre corridas con 100 casos: una sola corrida no mide.</tspan></text><text x="495" y="351.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Simulación con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
