<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 403" width="990" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos historiales de Git reales evaluados contra tres reglas del flujo ODD</title><desc id="d">Tabla con dos historiales de Git reales creados en un directorio temporal y evaluados contra tres reglas: en el historial ordenado, con documento de tarea primero, un tramo rojo seguido de uno verde y un commit mayor de 13 líneas, el comprobador no halla nada; en el historial desordenado, con todo el código en un commit de 463 líneas y el documento después, incumple las tres reglas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="403" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Regla</tspan></text><rect x="440" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Historial A</tspan></text><rect x="710" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Historial B</tspan></text><rect x="10" y="56" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Documento de tarea antes del primer código</tspan></text><rect x="440" y="56" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">cumple</tspan></text><rect x="710" y="56" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">no cumple</tspan></text><rect x="10" y="118" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Ningún commit supera 400 líneas</tspan></text><rect x="440" y="118" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">cumple (el mayor, 13)</tspan></text><rect x="710" y="118" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">no cumple (463)</tspan></text><rect x="10" y="180" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Un tramo rojo seguido de uno verde</tspan></text><rect x="440" y="180" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">cumple</tspan></text><rect x="710" y="180" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">no cumple (todo verde de golpe)</tspan></text><rect x="10" y="242" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Hallazgos del comprobador</tspan></text><rect x="440" y="242" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">ninguno</tspan></text><rect x="710" y="242" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">tres</tspan></text><rect x="10" y="308" width="970" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">El comprobador ejecuta las pruebas de cada commit para saber si estaba en rojo o en verde. Mira orden, tamaño y estado de las</tspan></text><text x="495" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">pruebas; no puede saber si el documento de tarea describe la realidad ni si 400 líneas es el límite adecuado.</tspan></text><text x="495" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Historiales de Git creados de verdad en un directorio temporal y ejecutados en Windows 11 y Ubuntu (WSL2) con los mismos resultados.</tspan></text></svg>
