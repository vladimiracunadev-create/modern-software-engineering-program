<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro métricas de entrega (de las cinco de DORA) calculadas del mismo registro de 1 094 despliegues de 6 servicios en 52 semanas</title><desc id="d">Barras horizontales con el plazo de entrega mediano del mismo registro según la definición: 32 horas desde el primer commit, 29 desde que se abre el PR y 4,6 desde la fusión; la tasa de fallos es 11,4 por ciento con incidente o 6,3 solo con retroceso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="380" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro métricas de entrega (de las cinco de DORA) calculadas del mismo registro de 1 094 despliegues de 6</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">servicios en 52 semanas</tspan></text><line x1="214" y1="68" x2="214" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="182" x2="214" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="381.44" y1="68" x2="381.44" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="381.44" y1="182" x2="381.44" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="381.44" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="381.44" dy="0">10</tspan></text><line x1="548.88" y1="68" x2="548.88" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="548.88" y1="182" x2="548.88" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="548.88" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="548.88" dy="0">20</tspan></text><line x1="716.32" y1="68" x2="716.32" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="716.32" y1="182" x2="716.32" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="716.32" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="716.32" dy="0">30</tspan></text><line x1="883.76" y1="68" x2="883.76" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="182" x2="883.76" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">40</tspan></text><line x1="214" y1="182" x2="883.76" y2="182" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Desde el primer commit</tspan></text><text x="204" y="129.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Desde que se abre el PR</tspan></text><text x="204" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Desde la fusión</tspan></text><rect x="214" y="74" width="542.693" height="26" rx="3" fill="#102a43"/><text x="763.693" y="91.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="763.693" dy="0">32,4</tspan></text><rect x="214" y="112" width="487.071" height="26" rx="3" fill="#102a43"/><text x="708.071" y="129.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="708.071" dy="0">29,1</tspan></text><rect x="214" y="150" width="76.8455" height="26" rx="3" fill="#102a43"/><text x="297.845" y="167.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="297.845" dy="0">4,6</tspan></text><text x="548.88" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="548.88" dy="0">Horas</tspan></text><rect x="10" y="240" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El mismo registro da también una frecuencia de 3,5 despliegues por servicio y semana, 21,0 del conjunto o 12,6 solo en los</tspan></text><text x="470" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dos servicios mayores; una tasa de fallos de 11,4 % con incidente o 6,3 % solo revertidos; y una restauración de 0,64 h de</tspan></text><text x="470" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mediana y 1,01 h de media. Comparar un número entre equipos que definen distinto no compara equipos. La media y la mediana</tspan></text><text x="470" y="314.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de la restauración difieren un 57 % porque pocos incidentes son largos. Registro sintético.</tspan></text><text x="470" y="362.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
