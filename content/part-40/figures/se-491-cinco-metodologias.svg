<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo cambio, silenciar un curso, con cinco metodologías: siete silencios mal hechos que mata cada una</title><desc id="d">Barras horizontales con los mutantes del silencio que mata cada metodología de siete: dos pruebas de TDD con 9 líneas matan 6, tres escenarios de BDD con 15 líneas matan 6, una tabla de ejemplos de ATDD con 17 líneas mata 5, un contrato con 400 estados con 15 líneas mata 3 y un modelo ejecutable de SDD con 17 líneas mata los 7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El mismo cambio, silenciar un curso, con cinco metodologías: siete silencios mal hechos que mata cada una</tspan></text><line x1="314" y1="49" x2="314" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="239" x2="314" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="462.485" y1="49" x2="462.485" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="462.485" y1="239" x2="462.485" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="462.485" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462.485" dy="0">2</tspan></text><line x1="610.97" y1="49" x2="610.97" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="610.97" y1="239" x2="610.97" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="610.97" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.97" dy="0">4</tspan></text><line x1="759.455" y1="49" x2="759.455" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="759.455" y1="239" x2="759.455" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="759.455" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.455" dy="0">6</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="239" x2="907.94" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">8</tspan></text><line x1="314" y1="239" x2="907.94" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">TDD: dos pruebas (9 líneas)</tspan></text><text x="304" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">BDD: tres escenarios (15)</tspan></text><text x="304" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">ATDD: tabla de ejemplos (17)</tspan></text><text x="304" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Contrato con 400 estados (15)</tspan></text><text x="304" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">SDD: modelo ejecutable (17)</tspan></text><rect x="314" y="55" width="445.455" height="26" rx="3" fill="#087f8c"/><text x="766.455" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="766.455" dy="0">6</tspan></text><rect x="314" y="93" width="445.455" height="26" rx="3" fill="#087f8c"/><text x="766.455" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="766.455" dy="0">6</tspan></text><rect x="314" y="131" width="371.213" height="26" rx="3" fill="#087f8c"/><text x="692.213" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="692.213" dy="0">5</tspan></text><rect x="314" y="169" width="222.727" height="26" rx="3" fill="#087f8c"/><text x="543.727" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="543.727" dy="0">3</tspan></text><rect x="314" y="207" width="519.697" height="26" rx="3" fill="#087f8c"/><text x="840.697" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="840.697" dy="0">7</tspan></text><line x1="833.697" y1="49" x2="833.697" y2="239" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="838.697" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="838.697" dy="0">7</tspan></text><text x="610.97" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="610.97" dy="0">Mutantes del silencio que mata (de 7)</tspan></text><rect x="10" y="297" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La unión de las cinco mata los 7 mutantes del silencio, pero el único método que mata los siete solo es el modelo</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ejecutable, que es también el que exige escribir de nuevo la regla. Líneas y tiempos son del experimento; la comparación de</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">esfuerzo humano no se midió.</tspan></text><text x="470" y="402.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Núcleo de Avisos con 20 mutantes escritos a mano (18 no equivalentes y 2 equivalentes); ejecutado en Windows 11 y Ubuntu (WSL2) con los mismos recuentos.</tspan></text></svg>
