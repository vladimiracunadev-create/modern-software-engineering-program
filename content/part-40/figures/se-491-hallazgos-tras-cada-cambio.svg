<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 572" width="940" height="572" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Endurecer un workflow vulnerable paso a paso: hallazgos del verificador tras cada cambio</title><desc id="d">Barras horizontales con los hallazgos del verificador tras cada cambio: el workflow original tiene 8 y cada uno de los 8 cambios elimina exactamente uno (fijar la acción a un SHA, permisos mínimos, pull_request en lugar de pull_request_target, título por variable de entorno, script versionado, no escribir el secreto, que el trabajo falle cuando falla, sin credencial en el texto) hasta llegar a 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="572" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Endurecer un workflow vulnerable paso a paso: hallazgos del verificador tras cada cambio</tspan></text><line x1="404" y1="49" x2="404" y2="391" stroke="#d5dde1" stroke-width="1"/><line x1="404" y1="391" x2="404" y2="396" stroke="#5b7280" stroke-width="1.4"/><text x="404" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="404" dy="0">0</tspan></text><line x1="529.985" y1="49" x2="529.985" y2="391" stroke="#d5dde1" stroke-width="1"/><line x1="529.985" y1="391" x2="529.985" y2="396" stroke="#5b7280" stroke-width="1.4"/><text x="529.985" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="529.985" dy="0">2</tspan></text><line x1="655.97" y1="49" x2="655.97" y2="391" stroke="#d5dde1" stroke-width="1"/><line x1="655.97" y1="391" x2="655.97" y2="396" stroke="#5b7280" stroke-width="1.4"/><text x="655.97" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.97" dy="0">4</tspan></text><line x1="781.955" y1="49" x2="781.955" y2="391" stroke="#d5dde1" stroke-width="1"/><line x1="781.955" y1="391" x2="781.955" y2="396" stroke="#5b7280" stroke-width="1.4"/><text x="781.955" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="781.955" dy="0">6</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="391" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="391" x2="907.94" y2="396" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">8</tspan></text><line x1="404" y1="391" x2="907.94" y2="391" stroke="#5b7280" stroke-width="1.6"/><text x="394" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">0. original</tspan></text><text x="394" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">1. fijar la acción a un SHA</tspan></text><text x="394" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">2. permisos mínimos</tspan></text><text x="394" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">3. pull_request en lugar de pull_request_target</tspan></text><text x="394" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">4. título por variable de entorno</tspan></text><text x="394" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">5. ejecutar un script versionado, no uno descargado</tspan></text><text x="394" y="300.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">6. no escribir el secreto en el registro</tspan></text><text x="394" y="338.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">7. el trabajo falla cuando falla</tspan></text><text x="394" y="376.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">8. sin credencial en el texto</tspan></text><rect x="404" y="55" width="503.94" height="26" rx="3" fill="#087f8c"/><text x="914.94" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">8</tspan></text><rect x="404" y="93" width="440.947" height="26" rx="3" fill="#087f8c"/><text x="851.947" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="851.947" dy="0">7</tspan></text><rect x="404" y="131" width="377.955" height="26" rx="3" fill="#087f8c"/><text x="788.955" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788.955" dy="0">6</tspan></text><rect x="404" y="169" width="314.963" height="26" rx="3" fill="#087f8c"/><text x="725.963" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="725.963" dy="0">5</tspan></text><rect x="404" y="207" width="251.97" height="26" rx="3" fill="#087f8c"/><text x="662.97" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="662.97" dy="0">4</tspan></text><rect x="404" y="245" width="188.977" height="26" rx="3" fill="#087f8c"/><text x="599.977" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="599.977" dy="0">3</tspan></text><rect x="404" y="283" width="125.985" height="26" rx="3" fill="#087f8c"/><text x="536.985" y="300.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="536.985" dy="0">2</tspan></text><rect x="404" y="321" width="62.9925" height="26" rx="3" fill="#087f8c"/><text x="473.993" y="338.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="473.993" dy="0">1</tspan></text><rect x="404" y="359" width="2" height="26" rx="3" fill="#087f8c"/><text x="413" y="376.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="413" dy="0">0</tspan></text><text x="655.97" y="435" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="655.97" dy="0">Hallazgos restantes</tspan></text><rect x="10" y="449" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="473.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada cambio es pequeño y elimina un hallazgo concreto: no se reescribe la canalización. Que el verificador llegue a 0 no</tspan></text><text x="470" y="490.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">prueba que el workflow sea seguro, solo que no contiene las ocho formas que sabe buscar. La credencial del texto, además,</tspan></text><text x="470" y="507.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sigue en el historial: borrarla del archivo no la revoca.</tspan></text><text x="470" y="554.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
