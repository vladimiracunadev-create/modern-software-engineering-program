<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 338" width="940" height="338" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Insertar un título en un programa antes de ejecutarlo o pasarlo como dato (6 títulos, ejecución real)</title><desc id="d">Barras apiladas horizontales con el resultado de seis títulos: expandir el título dentro del texto del programa ejecuta 4 de los 6 como código; pasar el título por una variable de entorno deja los 6 como datos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="338" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Insertar un título en un programa antes de ejecutarlo o pasarlo como dato (6 títulos, ejecución real)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Se ejecuta como código</tspan></text><rect x="229.88" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="249.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">Rompe el programa</tspan></text><rect x="406.06" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="426.06" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="426.06" dy="0">Inerte</tspan></text><rect x="499.3" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="519.3" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="519.3" dy="0">Alterado</tspan></text><line x1="234" y1="77" x2="234" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="234" y1="157" x2="234" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="234" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">0</tspan></text><line x1="447.9" y1="77" x2="447.9" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="447.9" y1="157" x2="447.9" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="447.9" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447.9" dy="0">2</tspan></text><line x1="661.8" y1="77" x2="661.8" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="661.8" y1="157" x2="661.8" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="661.8" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="661.8" dy="0">4</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">6</tspan></text><line x1="234" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="224" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="224" dy="0">Expandido en el programa</tspan></text><text x="224" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="224" dy="0">Por variable de entorno</tspan></text><rect x="234" y="84" width="427.8" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="447.9" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447.9" dy="0">4</tspan></text><rect x="661.8" y="84" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="661.8" y="84" width="213.9" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="768.75" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="768.75" dy="0">2</tspan></text><rect x="875.7" y="84" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="234" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="234" y="124" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="234" y="124" width="641.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="554.85" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="554.85" dy="0">6</tspan></text><rect x="875.7" y="124" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><text x="554.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="554.85" dy="0">Títulos</tspan></text><rect x="10" y="215" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El mecanismo es el de una expresión de workflow dentro de un script: el texto se sustituye antes de que el intérprete lo</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">lea, así que una comilla y un paréntesis lo convierten en código. Aquí el intérprete es Python y la carga es inofensiva; el</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">principio no cambia con el intérprete. Se ejecuta de verdad en cada máquina.</tspan></text><text x="470" y="320.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
