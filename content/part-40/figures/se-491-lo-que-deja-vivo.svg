<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 435" width="990" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué silencios mal hechos deja vivos cada metodología y por qué</title><desc id="d">Tabla con los mutantes que deja vivos cada metodología sobre el silencio de un curso: TDD y BDD dejan vivo S4, que silencia el curso para todas las personas, porque ningún ejemplo tiene dos personas en el mismo curso; ATDD deja vivos S3 y S4 porque su tabla no varía persona ni curso; el contrato deja vivos S2, S3, S4 y S7 porque solo comprueba una propiedad general; el modelo ejecutable no deja ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="435" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Metodología</tspan></text><rect x="210" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">Mutantes vivos</tspan></text><rect x="540" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Por qué sobreviven</tspan></text><rect x="10" y="56" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">TDD y BDD</tspan></text><rect x="210" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">S4: silencia el curso para todas las</tspan></text><text x="372" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">personas</tspan></text><rect x="540" y="56" width="434" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Ningún ejemplo tiene dos personas en el mismo curso</tspan></text><rect x="10" y="126" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">ATDD</tspan></text><rect x="210" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">S3 y S4: persona y curso</tspan></text><rect x="540" y="126" width="434" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">La tabla no varía persona ni curso</tspan></text><rect x="10" y="196" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Contrato</tspan></text><rect x="210" y="196" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">S2, S3, S4 y S7</tspan></text><rect x="540" y="196" width="434" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="223.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Solo comprueba que un curso silenciado no recibe nada</tspan></text><text x="757" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">salvo la última hora</tspan></text><rect x="10" y="266" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">SDD (modelo)</tspan></text><rect x="210" y="266" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">ninguno</tspan></text><rect x="540" y="266" width="434" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="293.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Reescribe la regla por segunda vez; si ambas fallan</tspan></text><text x="757" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">igual, no se ve</tspan></text><rect x="10" y="340" width="970" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">En todos los casos la causa es una dimensión que el artefacto no varía o una regla que no repite. Añadir un ejemplo con dos</tspan></text><text x="495" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">personas y un curso común mata S4 en TDD, BDD y ATDD.</tspan></text><text x="495" y="421.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Núcleo de Avisos con 20 mutantes escritos a mano (18 no equivalentes y 2 equivalentes); ejecutado en Windows 11 y Ubuntu (WSL2) con los mismos recuentos.</tspan></text></svg>
