<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 405" width="990" height="405" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco políticas aplicadas a 300 cambios sintéticos: costo, impacto escapado e impacto evitado por hora</title><desc id="d">Tabla con cinco políticas metodológicas aplicadas a 300 cambios sintéticos con tasas de detección medidas: no hacer nada deja un impacto escapado de 1157; TDD en todo cuesta 232 horas y deja 745; todo en todo cuesta 1240 y deja 489; por riesgo cuesta 482 y deja 532; por riesgo y ambigüedad cuesta 485 y deja 499.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="405" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Política</tspan></text><rect x="340" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Costo (horas)</tspan></text><rect x="530" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="637" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">Impacto escapado</tspan></text><rect x="750" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Impacto evitado por hora</tspan></text><rect x="10" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Nada</tspan></text><rect x="340" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">0</tspan></text><rect x="530" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">1 157</tspan></text><rect x="750" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">—</tspan></text><rect x="10" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">TDD en todo</tspan></text><rect x="340" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">232</tspan></text><rect x="530" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">745</tspan></text><rect x="750" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">1,77</tspan></text><rect x="10" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Todo en todo</tspan></text><rect x="340" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">1 240</tspan></text><rect x="530" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">489</tspan></text><rect x="750" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0,54</tspan></text><rect x="10" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Por riesgo</tspan></text><rect x="340" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">482</tspan></text><rect x="530" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">532</tspan></text><rect x="750" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">1,29</tspan></text><rect x="10" y="256" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Por riesgo y ambigüedad</tspan></text><rect x="340" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">485</tspan></text><rect x="530" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">499</tspan></text><rect x="750" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">1,36</tspan></text><rect x="10" y="310" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Aplicarlo todo a todo es la política más cara y deja menos impacto, pero evita 0,54 por hora frente a 1,77 de TDD en todo. Costos,</tspan></text><text x="495" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">riesgos y fracción con reglas son supuestos del autor; solo las tasas de detección vienen del experimento de SE-481.</tspan></text><text x="495" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Simulación con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
