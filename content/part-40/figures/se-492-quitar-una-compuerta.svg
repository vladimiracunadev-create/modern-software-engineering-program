<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 787" width="940" height="787" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quitar una compuerta cada vez: 12 fallos tipo; costo relativo total sin ninguna ausencia: 214</title><desc id="d">Barras horizontales con los fallos que se detectan más tarde y los que escapan al quitar cada compuerta: quitar el escaneo de dependencias y secretos deja escapar 2 y sube el costo de 214 a 802; quitar la política del plan, 1 y 604; quitar el canario retrasa 3 fallos y sube el costo a 439; quitar lint, unitarias o integración retrasa 1 cada una.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="787" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quitar una compuerta cada vez: 12 fallos tipo; costo relativo total sin ninguna ausencia: 214</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Fallos que se detectan más tarde</tspan></text><rect x="305.28" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="325.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="325.28" dy="0">Fallos que escapan</tspan></text><line x1="354" y1="77" x2="354" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="589" x2="354" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="538.647" y1="77" x2="538.647" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="538.647" y1="589" x2="538.647" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="538.647" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="538.647" dy="0">1</tspan></text><line x1="723.293" y1="77" x2="723.293" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="723.293" y1="589" x2="723.293" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="723.293" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="723.293" dy="0">2</tspan></text><line x1="907.94" y1="77" x2="907.94" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="589" x2="907.94" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">3</tspan></text><line x1="354" y1="589" x2="907.94" y2="589" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">revisión y lint (costo 215)</tspan></text><text x="344" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">pruebas unitarias (costo 216)</tspan></text><text x="344" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">pruebas de integración (costo 220)</tspan></text><text x="344" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">escaneo de dependencias y secretos (costo</tspan></text><text x="344" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">802)</tspan></text><text x="344" y="361" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">política sobre el plan de infraestructura</tspan></text><text x="344" y="378" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(costo 604)</tspan></text><text x="344" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">humo en preproducción (costo 229)</tspan></text><text x="344" y="497.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">canario con métricas (costo 439)</tspan></text><text x="344" y="561.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">alerta en producción (costo 414)</tspan></text><rect x="354" y="83" width="184.647" height="24.5" rx="3" fill="#946512"/><text x="545.647" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="110.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="147" width="184.647" height="24.5" rx="3" fill="#946512"/><text x="545.647" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="174.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="211" width="184.647" height="24.5" rx="3" fill="#946512"/><text x="545.647" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="238.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="275" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="302.5" width="369.293" height="24.5" rx="3" fill="#c0432f"/><text x="730.293" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="730.293" dy="0">2</tspan></text><rect x="354" y="339" width="184.647" height="24.5" rx="3" fill="#946512"/><text x="545.647" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="366.5" width="184.647" height="24.5" rx="3" fill="#c0432f"/><text x="545.647" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="403" width="184.647" height="24.5" rx="3" fill="#946512"/><text x="545.647" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="430.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="467" width="553.94" height="24.5" rx="3" fill="#946512"/><text x="914.94" y="483.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="354" y="494.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="511.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="531" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="547.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="558.5" width="184.647" height="24.5" rx="3" fill="#c0432f"/><text x="545.647" y="575.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><text x="630.97" y="633" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">Fallos de 12</tspan></text><rect x="10" y="647" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="671.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, el costo relativo total al quitar esa compuerta. Las compuertas baratas retrasan poco, las únicas para</tspan></text><text x="470" y="688.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una clase de fallo hacen escapar: el escaneo es la única que ve un secreto o una dependencia vulnerable. La matriz de qué</tspan></text><text x="470" y="705.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">compuerta ve qué fallo es juicio del autor, y los costos (1 a 100) son relativos; el ejercicio es construir la propia y ver</tspan></text><text x="470" y="721.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">qué fallos solo tienen un guardián.</tspan></text><text x="470" y="769.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
