<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Correlación: cadenas completas según la probabilidad de conservar el identificador en cada salto</title><desc id="d">Líneas con el porcentaje de peticiones de una cadena de cinco servicios y cuatro saltos que llegan completas según la probabilidad de conservar el identificador en cada salto: la simulación coincide con la fórmula p elevada a cuatro y baja de 95,9 por ciento con 0,99 a 81,4 con 0,95, 66,3 con 0,90 y menos con 0,80.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Correlación: cadenas completas según la probabilidad de conservar el identificador en cada salto</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Simulada</tspan></text><rect x="124.32" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Fórmula p⁴</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="187" x2="78.62" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0,99</tspan></text><line x1="724.552" y1="87" x2="724.552" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="724.552" y1="387" x2="724.552" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="724.552" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="724.552" dy="0">0,95</tspan></text><line x1="515.241" y1="87" x2="515.241" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="515.241" y1="387" x2="515.241" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="515.241" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="515.241" dy="0">0,90</tspan></text><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0,80</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Peticiones con la cadena completa (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Probabilidad de conservar el identificador en cada salto</tspan></text><polyline points="892,107.65 724.552,179.8 515.241,255.75 96.62,383.1" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="892" cy="107.65" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="96.65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">95,9</tspan></text><circle cx="724.552" cy="179.8" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="724.552" y="168.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="724.552" dy="0">81,4</tspan></text><circle cx="515.241" cy="255.75" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="515.241" y="244.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="515.241" dy="0">66,2</tspan></text><circle cx="96.62" cy="383.1" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="372.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">40,8</tspan></text><polyline points="892,106.7 724.552,179.75 515.241,258.95 96.62,382.2" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="886.5" y="101.2" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="130.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">96,1</tspan></text><rect x="719.052" y="174.25" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="724.552" y="203.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="724.552" dy="0">81,5</tspan></text><rect x="509.741" y="253.45" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="515.241" y="282.95" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="515.241" dy="0">65,6</tspan></text><rect x="91.12" y="376.7" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="96.62" y="406.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">41,0</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La propagación falla de forma multiplicativa: cuatro saltos al 95 % dejan 81 % y la cola de peticiones incompletas es justo</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la de las colas y los hilos. Sin identificador, el tiempo solo desambigua con tráfico muy bajo; con una petición durando</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">hasta 250 ms (supuesto del autor), a 20 por segundo siempre hay varias candidatas.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
