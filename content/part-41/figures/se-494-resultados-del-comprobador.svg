<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 259" width="960" height="259" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Resultado del comprobador sobre 17 casos con 13 infracciones reales</title><desc id="d">Gráfico de barras: 9 infracciones detectadas, 4 omitidas y 1 falsa alarma sobre diecisiete casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="259" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Infracciones detectadas</tspan></text><rect x="344" y="16" width="540" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="892" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="892" dy="0">9</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Infracciones omitidas</tspan></text><rect x="344" y="62" width="240" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="592" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="592" dy="0">4</tspan></text><text x="334" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Falsas alarmas</tspan></text><rect x="344" y="108" width="60" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="412" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="412" dy="0">1</tspan></text><rect x="10" y="156" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="180.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Las omisiones son más caras que la falsa alarma: la alarma cuesta una revisión, la omisión cuesta un defecto que pasa con</tspan></text><text x="480" y="197.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">apariencia de comprobado.</tspan></text><text x="480" y="245.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
