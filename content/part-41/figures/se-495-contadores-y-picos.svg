<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contador con reinicios: incrementos que reconstruye cada forma de leer y cada intervalo de muestreo</title><desc id="d">Barras horizontales con los incrementos de un contador de 60 513 con tres reinicios: restar el último valor del primero da 14 858; con detección de reinicios da 60 198 con scrape de 15 segundos y 55 707 con scrape de 60.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Contador con reinicios: incrementos que reconstruye cada forma de leer y cada intervalo de muestreo</tspan></text><line x1="334" y1="49" x2="334" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="334" y1="225" x2="334" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="334" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334" dy="0">0</tspan></text><line x1="467.41" y1="49" x2="467.41" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="467.41" y1="225" x2="467.41" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="467.41" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467.41" dy="0">20 000</tspan></text><line x1="600.82" y1="49" x2="600.82" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="600.82" y1="225" x2="600.82" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="600.82" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600.82" dy="0">40 000</tspan></text><line x1="734.23" y1="49" x2="734.23" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="734.23" y1="225" x2="734.23" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="734.23" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="734.23" dy="0">60 000</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="225" x2="867.64" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">80 000</tspan></text><line x1="334" y1="225" x2="867.64" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="324" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Incremento real (verdad de la simulación)</tspan></text><text x="324" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Último valor menos primero, scrape cada 15</tspan></text><text x="324" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">s</tspan></text><text x="324" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Con detección de reinicios, scrape cada 15</tspan></text><text x="324" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">s</tspan></text><text x="324" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Con detección de reinicios, scrape cada 60</tspan></text><text x="324" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">s</tspan></text><rect x="334" y="55" width="403.652" height="32" rx="3" fill="#087f8c"/><text x="744.652" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="744.652" dy="0">60 513</tspan></text><rect x="334" y="99" width="99.1103" height="32" rx="3" fill="#087f8c"/><text x="440.11" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="440.11" dy="0">14 858</tspan></text><rect x="334" y="143" width="401.551" height="32" rx="3" fill="#087f8c"/><text x="742.551" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="742.551" dy="0">60 198</tspan></text><rect x="334" y="187" width="371.594" height="32" rx="3" fill="#087f8c"/><text x="712.594" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="712.594" dy="0">55 707</tspan></text><line x1="737.652" y1="49" x2="737.652" y2="225" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="742.652" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="742.652" dy="0">real</tspan></text><text x="600.82" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="600.82" dy="0">Incremento del contador en 600 s</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un contador sobrevive a un muestreo grueso porque acumula; un gauge no, porque el valor entre dos lecturas desaparece. La</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">detección de reinicios pierde el tramo anterior a cada reinicio dentro del intervalo. Tasa de 100 por segundo, reinicios en</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">137, 301 y 452 s y picos uniformes son supuestos del autor.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
