<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Percentiles estimados con histogramas de tres diseños de cubetas frente al valor exacto</title><desc id="d">Barras agrupadas con la mediana, el percentil 95 y el percentil 99 de 100 000 latencias lognormales: el valor exacto es 120,5, 381 y 608,2 milisegundos y cada diseño de cubetas lo estima con un error distinto, que se ve en la diferencia de altura frente a la barra gris.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Percentiles estimados con histogramas de tres diseños de cubetas frente al valor exacto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Valor exacto</tspan></text><rect x="154.48" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Cubetas: lineal 100 ms</tspan></text><rect x="368.36" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="388.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="388.36" dy="0">Cubetas: exponencial ×2</tspan></text><rect x="589.78" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="609.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="609.78" dy="0">Cubetas: por defecto (.005–10 s)</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="305" x2="78.62" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="235" x2="78.62" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="165" x2="78.62" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">600</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">800</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Latencia (ms)</text><rect x="106.666" y="332.825" width="53.092" height="42.175" rx="3" fill="#6b7c86"/><text x="133.212" y="326.825" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="133.212" dy="0">120,5</tspan></text><rect x="163.758" y="330.235" width="53.092" height="44.765" rx="3" fill="#946512"/><text x="190.304" y="324.235" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="190.304" dy="0">127,9</tspan></text><rect x="220.85" y="330.725" width="53.092" height="44.275" rx="3" fill="#087f8c"/><text x="247.396" y="324.725" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247.396" dy="0">126,5</tspan></text><rect x="277.942" y="328.03" width="53.092" height="46.97" rx="3" fill="#c0432f"/><text x="304.488" y="322.03" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="304.488" dy="0">134,2</tspan></text><text x="218.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">p50</tspan></text><rect x="387.126" y="241.65" width="53.092" height="133.35" rx="3" fill="#6b7c86"/><text x="413.672" y="235.65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="413.672" dy="0">381,0</tspan></text><rect x="444.218" y="239.375" width="53.092" height="135.625" rx="3" fill="#946512"/><text x="470.764" y="233.375" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470.764" dy="0">387,5</tspan></text><rect x="501.31" y="214.665" width="53.092" height="160.335" rx="3" fill="#087f8c"/><text x="527.856" y="208.665" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="527.856" dy="0">458,1</tspan></text><rect x="558.402" y="219.705" width="53.092" height="155.295" rx="3" fill="#c0432f"/><text x="584.948" y="213.705" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="584.948" dy="0">443,7</tspan></text><text x="499.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">p95</tspan></text><rect x="667.586" y="162.13" width="53.092" height="212.87" rx="3" fill="#6b7c86"/><text x="694.132" y="156.13" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="694.132" dy="0">608,2</tspan></text><rect x="724.678" y="160.59" width="53.092" height="214.41" rx="3" fill="#946512"/><text x="751.224" y="154.59" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="751.224" dy="0">612,6</tspan></text><rect x="781.77" y="153.73" width="53.092" height="221.27" rx="3" fill="#087f8c"/><text x="808.316" y="147.73" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="808.316" dy="0">632,2</tspan></text><rect x="838.862" y="103.26" width="53.092" height="271.74" rx="3" fill="#c0432f"/><text x="865.408" y="97.26" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="865.408" dy="0">776,4</tspan></text><text x="779.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">p99</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La interpolación lineal dentro de una cubeta supone datos repartidos de forma uniforme y el error nunca es menor que el</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ancho de la cubeta donde cae el percentil. Cubetas pensadas para otro rango (hasta 10 s) estiman el p99 con un 28 % de</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">error. Elegir cubetas es elegir el error permitido antes de ver el incidente.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
