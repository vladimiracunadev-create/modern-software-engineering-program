<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 387" width="960" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hechos recordables tras 120 turnos según la estrategia de contexto y el tamaño de la ventana</title><desc id="d">Tabla con cuatro tamaños de ventana de contexto: con 6 000 fichas truncar conserva 0 de 10 hechos, resumir lo declarado 6 y un archivo de notas del harness 8; con 12 000, 1, 6 y 8; con 24 000, 4, 8 y 9; con 48 000, que cabe toda la sesión, las tres estrategias conservan los 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="387" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Ventana (fichas)</tspan></text><rect x="220" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">Truncar lo antiguo</tspan></text><rect x="450" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Resumir lo declarado</tspan></text><rect x="700" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Archivo de notas del harness</tspan></text><rect x="10" y="56" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">6 000</tspan></text><rect x="220" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">0 de 10</tspan></text><rect x="450" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">6 de 10</tspan></text><rect x="700" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">8 de 10</tspan></text><rect x="10" y="114" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">12 000</tspan></text><rect x="220" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">1 de 10</tspan></text><rect x="450" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">6 de 10</tspan></text><rect x="700" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">8 de 10</tspan></text><rect x="10" y="172" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">24 000</tspan></text><rect x="220" y="172" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">4 de 10</tspan></text><rect x="450" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">8 de 10</tspan></text><rect x="700" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">9 de 10</tspan></text><rect x="10" y="230" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">48 000</tspan></text><rect x="220" y="230" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">10 de 10</tspan></text><rect x="450" y="230" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">10 de 10</tspan></text><rect x="700" y="230" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">10 de 10</tspan></text><rect x="10" y="292" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Modelo determinista de 120 turnos de 400 fichas con 10 hechos en puntos fijos. Describe el mecanismo de pérdida de cada</tspan></text><text x="480" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">estrategia con supuestos explícitos; no mide la compactación de ningún producto.</tspan></text><text x="480" y="373.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
