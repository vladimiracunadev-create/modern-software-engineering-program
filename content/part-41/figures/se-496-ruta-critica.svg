<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reducir a la mitad un span: ahorro medio de latencia según cómo se elige el span a optimizar</title><desc id="d">Barras horizontales con el ahorro medio de latencia en 600 árboles de spans sintéticos con latencia media de 412 milisegundos al reducir a la mitad un span: 5,6 milisegundos si se elige al azar, 40,2 si se elige el span más largo y 45,7 si se elige el de la ruta crítica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reducir a la mitad un span: ahorro medio de latencia según cómo se elige el span a optimizar</tspan></text><line x1="324" y1="49" x2="324" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="181" x2="324" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="435.952" y1="49" x2="435.952" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="435.952" y1="181" x2="435.952" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="435.952" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435.952" dy="0">10</tspan></text><line x1="547.904" y1="49" x2="547.904" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="547.904" y1="181" x2="547.904" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="547.904" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.904" dy="0">20</tspan></text><line x1="659.856" y1="49" x2="659.856" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="659.856" y1="181" x2="659.856" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="659.856" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="659.856" dy="0">30</tspan></text><line x1="771.808" y1="49" x2="771.808" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="771.808" y1="181" x2="771.808" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="771.808" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.808" dy="0">40</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="181" x2="883.76" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">50</tspan></text><line x1="324" y1="181" x2="883.76" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Un span al azar</tspan></text><text x="314" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">El span con más tiempo propio</tspan></text><text x="314" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">El span de la ruta crítica con más tiempo</tspan></text><text x="314" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">propio</tspan></text><rect x="324" y="55" width="62.6931" height="32" rx="3" fill="#087f8c"/><text x="393.693" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="393.693" dy="0">5,6</tspan></text><rect x="324" y="99" width="450.047" height="32" rx="3" fill="#087f8c"/><text x="781.047" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="781.047" dy="0">40,2</tspan></text><rect x="324" y="143" width="511.621" height="32" rx="3" fill="#087f8c"/><text x="842.621" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="842.621" dy="0">45,7</tspan></text><text x="603.88" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603.88" dy="0">Ahorro medio de latencia (ms)</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un span fuera de la ruta crítica (hijos paralelos que no son el más lento) no cambia la latencia de la petición aunque se</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">acelere. Los árboles (3 a 5 hijos en la raíz, hasta 3 niveles, la mitad de los nodos con hijos en paralelo) son un</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">generador del autor, no trazas observadas.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
