<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 642" width="940" height="642" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis reglas de alerta sobre 180 días de tráfico diurno y nocturno con 14 caídas y 12 degradaciones lentas</title><desc id="d">Barras horizontales con las páginas que genera cada regla y las que no corresponden a ningún incidente: el umbral de 0,5 por ciento en un minuto genera 12 622 páginas, 11 748 sin incidente, y el de 1 por ciento en 5 minutos genera 609, 396 sin incidente; las reglas por tasa de consumo del presupuesto generan entre 13 y 31 páginas y ninguna sin incidente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="642" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis reglas de alerta sobre 180 días de tráfico diurno y nocturno con 14 caídas y 12 degradaciones lentas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Páginas</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Páginas sin incidente</tspan></text><line x1="324" y1="77" x2="324" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="461" x2="324" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="505.213" y1="77" x2="505.213" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="505.213" y1="461" x2="505.213" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="505.213" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505.213" dy="0">5 000</tspan></text><line x1="686.427" y1="77" x2="686.427" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="686.427" y1="461" x2="686.427" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="686.427" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686.427" dy="0">10 000</tspan></text><line x1="867.64" y1="77" x2="867.64" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="461" x2="867.64" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">15 000</tspan></text><line x1="324" y1="461" x2="867.64" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Umbral 0,5 % en 1 min</tspan></text><text x="314" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Umbral 1 % en 5 min</tspan></text><text x="314" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Umbral 1 % en 30 min</tspan></text><text x="314" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Consumo 14,4× (1 h y 5 min)</tspan></text><text x="314" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Consumo 6× (6 h y 30 min)</tspan></text><text x="314" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Consumo 14,4× o 6×</tspan></text><rect x="324" y="83" width="457.455" height="24.5" rx="3" fill="#946512"/><text x="788.455" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788.455" dy="0">12 622</tspan></text><rect x="324" y="110.5" width="425.779" height="24.5" rx="3" fill="#c0432f"/><text x="756.779" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="756.779" dy="0">11 748</tspan></text><rect x="324" y="147" width="22.0718" height="24.5" rx="3" fill="#946512"/><text x="353.072" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353.072" dy="0">609</tspan></text><rect x="324" y="174.5" width="14.3521" height="24.5" rx="3" fill="#c0432f"/><text x="345.352" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="345.352" dy="0">396</tspan></text><rect x="324" y="211" width="2" height="24.5" rx="3" fill="#946512"/><text x="333" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">27</tspan></text><rect x="324" y="238.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="333" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="275" width="2" height="24.5" rx="3" fill="#946512"/><text x="333" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">13</tspan></text><rect x="324" y="302.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="333" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="339" width="2" height="24.5" rx="3" fill="#946512"/><text x="333" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">28</tspan></text><rect x="324" y="366.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="333" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="403" width="2" height="24.5" rx="3" fill="#946512"/><text x="333" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">31</tspan></text><rect x="324" y="430.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="333" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><text x="595.82" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="595.82" dy="0">Páginas en 180 días</tspan></text><rect x="10" y="519" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ninguna regla detecta las 12 degradaciones sin pagar páginas falsas: la regla de 1 % en 5 minutos las ve todas porque de</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">noche, con 30 peticiones por minuto, dos errores bastan. Una página que no pide acción es coste puro. Tasa de error base de</tspan></text><text x="470" y="577.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">0,1 %, tráfico entre 30 y 300 por minuto e incidentes inyectados son supuestos del autor.</tspan></text><text x="470" y="624.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
