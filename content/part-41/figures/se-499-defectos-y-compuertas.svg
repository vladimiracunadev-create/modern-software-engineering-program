<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 555" width="960" height="555" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué compuerta atrapa cada defecto de 11 y qué atrapan las pruebas por sí solas</title><desc id="d">Tabla con ocho de once cambios defectuosos: el error de sintaxis lo atrapan tres compuertas incluidas las pruebas; la importación sin usar, el secreto literal, la prueba debilitada y la prueba omitida solo las compuertas especializadas; el error de lógica que una prueba ve lo atrapan las pruebas; el error que ninguna prueba ve y la prueba que replica el error no los atrapa ninguna compuerta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="555" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Cambio defectuoso</tspan></text><rect x="390" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Compuerta que lo atrapa</tspan></text><rect x="720" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">¿Lo atrapan solo las</tspan></text><text x="832" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">pruebas?</tspan></text><rect x="10" y="56" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Error de sintaxis</tspan></text><rect x="390" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">sintaxis, estilo y pruebas</tspan></text><rect x="720" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">sí</tspan></text><rect x="10" y="106" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Importación sin usar</tspan></text><rect x="390" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">estilo</tspan></text><rect x="720" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">no</tspan></text><rect x="10" y="156" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Secreto literal</tspan></text><rect x="390" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">secretos</tspan></text><rect x="720" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">no</tspan></text><rect x="10" y="206" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Error de lógica que una prueba ve</tspan></text><rect x="390" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">pruebas</tspan></text><rect x="720" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">sí</tspan></text><rect x="10" y="256" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Prueba debilitada para ocultar el error</tspan></text><rect x="390" y="256" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">no debilitar pruebas</tspan></text><rect x="720" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">no</tspan></text><rect x="10" y="306" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Prueba omitida con un decorador</tspan></text><rect x="390" y="306" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">no debilitar pruebas</tspan></text><rect x="720" y="306" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">no</tspan></text><rect x="10" y="356" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="381.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Error que ninguna prueba ve</tspan></text><rect x="390" y="356" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">ninguna</tspan></text><rect x="720" y="356" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">no</tspan></text><rect x="10" y="406" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="431.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Prueba que replica el error</tspan></text><rect x="390" y="406" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">ninguna</tspan></text><rect x="720" y="406" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">no</tspan></text><rect x="10" y="460" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="484.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El menú completo atrapa 9 de 11 defectos; las pruebas solas, 2. Los 2 restantes (un error que ninguna prueba ejerce y una</tspan></text><text x="480" y="501.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">prueba que replica el error) no los atrapa ninguna compuerta: son el límite del gate.</tspan></text><text x="480" y="541.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
