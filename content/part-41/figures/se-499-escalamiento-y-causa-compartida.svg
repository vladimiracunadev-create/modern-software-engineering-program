<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una página con y sin escalamiento: fracción atendida</title><desc id="d">Barras horizontales con el porcentaje de páginas atendidas: con respuesta de 85 por ciento por persona y fallos independientes, una página sin escalar se atiende 84,8 por ciento de las veces y con tres niveles de cinco minutos 99,8 por ciento en 15 minutos; si 30 por ciento comparten causa, sin escalar se atiende 59,9 por ciento y con tres niveles 96,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una página con y sin escalamiento: fracción atendida</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin escalar</tspan></text><rect x="146.94" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Con tres niveles (15 min)</tspan></text><line x1="324" y1="77" x2="324" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="205" x2="324" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="435.952" y1="77" x2="435.952" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="435.952" y1="205" x2="435.952" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="435.952" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435.952" dy="0">20</tspan></text><line x1="547.904" y1="77" x2="547.904" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="547.904" y1="205" x2="547.904" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="547.904" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.904" dy="0">40</tspan></text><line x1="659.856" y1="77" x2="659.856" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="659.856" y1="205" x2="659.856" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="659.856" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="659.856" dy="0">60</tspan></text><line x1="771.808" y1="77" x2="771.808" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="771.808" y1="205" x2="771.808" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="771.808" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.808" dy="0">80</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="205" x2="883.76" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="324" y1="205" x2="883.76" y2="205" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">fallos independientes</tspan></text><text x="314" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">30 % comparten causa (misma zona sin red)</tspan></text><rect x="324" y="83" width="474.676" height="24.5" rx="3" fill="#c0432f"/><text x="805.676" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="805.676" dy="0">84,8</tspan></text><rect x="324" y="110.5" width="558.64" height="24.5" rx="3" fill="#087f8c"/><text x="889.64" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="889.64" dy="0">99,8</tspan></text><rect x="324" y="147" width="335.296" height="24.5" rx="3" fill="#c0432f"/><text x="666.296" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="666.296" dy="0">59,9</tspan></text><rect x="324" y="174.5" width="542.407" height="24.5" rx="3" fill="#087f8c"/><text x="873.407" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="873.407" dy="0">96,9</tspan></text><text x="603.88" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603.88" dy="0">Páginas atendidas (%)</tspan></text><rect x="10" y="263" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El escalamiento protege contra el olvido y el sueño; no protege contra una causa compartida entre niveles (la misma zona</tspan></text><text x="470" y="304.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sin red, el mismo canal de aviso). Las probabilidades de 85 %, 85 % y 90 % por nivel y el 30 % de causa compartida son</tspan></text><text x="470" y="321.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuestos del autor, no mediciones de ninguna herramienta de guardia.</tspan></text><text x="470" y="368.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
