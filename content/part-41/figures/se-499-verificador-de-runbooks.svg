<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 658" width="940" height="658" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un verificador de runbooks frente a 240 mutaciones de ocho runbooks base (diez operadores)</title><desc id="d">Barras apiladas con las mutaciones detectadas y no detectadas por tipo: el verificador de campos, fechas, referencias a alertas y reversiones detecta 144 de 240; detecta las seis que rompen la forma y ninguna de las cuatro que cambian el sentido sin romperla: intercambiar el contenido de dos pasos, apuntar al entorno equivocado, cambiar el comando por otro plausible y un propietario inexistente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="658" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un verificador de runbooks frente a 240 mutaciones de ocho runbooks base (diez operadores)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="354" y1="77" x2="354" y2="477" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="477" x2="354" y2="482" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="498" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="458.34" y1="77" x2="458.34" y2="477" stroke="#d5dde1" stroke-width="1"/><line x1="458.34" y1="477" x2="458.34" y2="482" stroke="#5b7280" stroke-width="1.4"/><text x="458.34" y="498" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.34" dy="0">5</tspan></text><line x1="562.68" y1="77" x2="562.68" y2="477" stroke="#d5dde1" stroke-width="1"/><line x1="562.68" y1="477" x2="562.68" y2="482" stroke="#5b7280" stroke-width="1.4"/><text x="562.68" y="498" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.68" dy="0">10</tspan></text><line x1="667.02" y1="77" x2="667.02" y2="477" stroke="#d5dde1" stroke-width="1"/><line x1="667.02" y1="477" x2="667.02" y2="482" stroke="#5b7280" stroke-width="1.4"/><text x="667.02" y="498" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.02" dy="0">15</tspan></text><line x1="771.36" y1="77" x2="771.36" y2="477" stroke="#d5dde1" stroke-width="1"/><line x1="771.36" y1="477" x2="771.36" y2="482" stroke="#5b7280" stroke-width="1.4"/><text x="771.36" y="498" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.36" dy="0">20</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="477" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="477" x2="875.7" y2="482" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="498" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">25</tspan></text><line x1="354" y1="477" x2="875.7" y2="477" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Quita un campo obligatorio</tspan></text><text x="344" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Vacía la salida esperada</tspan></text><text x="344" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Quita la reversión de un paso destructivo</tspan></text><text x="344" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Envejece la verificación</tspan></text><text x="344" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Alerta con errata</tspan></text><text x="344" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Escalamiento «TBD»</tspan></text><text x="344" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Intercambia el contenido de dos pasos</tspan></text><text x="344" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Apunta al entorno equivocado</tspan></text><text x="344" y="421.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Cambia el comando por otro plausible</tspan></text><text x="344" y="461.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Propietario inexistente</tspan></text><rect x="354" y="84" width="500.832" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="604.416" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="604.416" dy="0">24</tspan></text><rect x="854.832" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="861.832" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="861.832" dy="0">24</tspan></text><rect x="354" y="124" width="500.832" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="604.416" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="604.416" dy="0">24</tspan></text><rect x="854.832" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text 