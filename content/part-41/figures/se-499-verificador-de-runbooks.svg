"13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Mutaciones</tspan></text><rect x="10" y="535" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="559.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Detecta 144 de 240 (60 %): todo lo que ve es forma y ninguna de las 96 que se escapan la viola. Un runbook bien formado y</tspan></text><text x="470" y="576.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">erróneo es peor que uno ausente porque se ejecuta con confianza; solo un ejercicio real lo descubre. Las ocho bases y los</tspan></text><text x="470" y="593.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">operadores son construcciones del autor.</tspan></text><text x="470" y="640.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
