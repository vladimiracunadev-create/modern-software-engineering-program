<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cadencia de actualizaciones de estado: minutos de la persona al mando según la política</title><desc id="d">Barras horizontales con los minutos que gasta la persona al mando por incidente según la política de actualización: sin cadencia recibe 32,9 preguntas y gasta 98,7 minutos; actualizar cada 30 minutos baja las preguntas a 10,1 y el gasto a 42,4 minutos, el mínimo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cadencia de actualizaciones de estado: minutos de la persona al mando según la política</tspan></text><line x1="324" y1="49" x2="324" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="239" x2="324" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="49" x2="434.34" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="239" x2="434.34" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="434.34" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.34" dy="0">25</tspan></text><line x1="544.68" y1="49" x2="544.68" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="544.68" y1="239" x2="544.68" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="544.68" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.68" dy="0">50</tspan></text><line x1="655.02" y1="49" x2="655.02" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="655.02" y1="239" x2="655.02" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="655.02" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.02" dy="0">75</tspan></text><line x1="765.36" y1="49" x2="765.36" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="765.36" y1="239" x2="765.36" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="765.36" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.36" dy="0">100</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="239" x2="875.7" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">125</tspan></text><line x1="324" y1="239" x2="875.7" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Sin cadencia (32,9 preguntas)</tspan></text><text x="314" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Cada 60 min (14,8 preguntas)</tspan></text><text x="314" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Cada 30 min (10,1 preguntas)</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Cada 15 min (7,6 preguntas)</tspan></text><text x="314" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Cada 5 min (6,1 preguntas)</tspan></text><rect x="324" y="55" width="435.622" height="26" rx="3" fill="#087f8c"/><text x="766.622" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="766.622" dy="0">98,7</tspan></text><rect x="324" y="93" width="218.032" height="26" rx="3" fill="#087f8c"/><text x="549.032" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="549.032" dy="0">49,4</tspan></text><rect x="324" y="131" width="187.137" height="26" rx="3" fill="#087f8c"/><text x="518.137" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="518.137" dy="0">42,4</tspan></text><rect x="324" y="169" width="216.708" height="26" rx="3" fill="#087f8c"/><text x="547.708" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="547.708" dy="0">49,1</tspan></text><rect x="324" y="207" width="454.159" height="26" rx="3" fill="#087f8c"/><text x="785.159" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="785.159" dy="0">102,9</tspan></text><text x="599.85" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Minutos de la persona al mando por incidente</tspan></text><rect x="10" y="297" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Hay una cadencia que minimiza el coste y no es la más frecuente: cada actualización cuesta 4 minutos y cada pregunta 3. La</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">tasa de preguntas que crece con la antigüedad de la última noticia y la duración mediana de 90 minutos son supuestos del</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">autor; el óptimo real depende de a quién se informa y de cómo.</tspan></text><text x="470" y="402.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
