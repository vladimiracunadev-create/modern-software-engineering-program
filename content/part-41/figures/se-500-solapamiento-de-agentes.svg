<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 351" width="960" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que dos agentes toquen algún archivo común, con 40 archivos y 3 por tarea</title><desc id="d">Gráfico de barras con la probabilidad de algún archivo compartido: 2 agentes 21,3 por ciento, 3 agentes 53,0, 4 agentes 79,9, 6 agentes 98,4 y 8 agentes 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="351" fill="#ffffff"/><text x="254" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">2 agentes</tspan></text><rect x="264" y="16" width="159.75" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="431.75" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="431.75" dy="0">21,3 %</tspan></text><text x="254" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">3 agentes</tspan></text><rect x="264" y="62" width="397.5" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="669.5" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="669.5" dy="0">53,0 %</tspan></text><text x="254" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">4 agentes</tspan></text><rect x="264" y="108" width="599.25" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="871.25" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="871.25" dy="0">79,9 %</tspan></text><text x="254" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">6 agentes</tspan></text><rect x="264" y="154" width="738" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1010" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1010" dy="0">98,4 %</tspan></text><text x="254" y="221" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">8 agentes</tspan></text><rect x="264" y="200" width="750" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1022" y="221" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1022" dy="0">100 %</tspan></text><rect x="10" y="248" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="272.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Los canales entre pares crecen como n(n-1)/2: 1, 3, 6, 15 y 28. Con un coordinador crecen como n. Más agentes en el mismo</tspan></text><text x="480" y="289.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">árbol compran paralelismo y pagan colisión.</tspan></text><text x="480" y="337.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación con semilla fija (parámetros del autor) ejecutada en Windows 11 con CPython 3.12.9; no mide ningún modelo real.</tspan></text></svg>
