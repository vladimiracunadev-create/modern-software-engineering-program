<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 469" width="940" height="469" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo elegir la siguiente observación para aislar una falla entre diez: tres estrategias sobre 4 000 diagnósticos</title><desc id="d">Barras horizontales con las observaciones hasta aislar la falla y el coste medio: elegir en cada paso la observación que mejor reparte las hipótesis restantes aísla la falla en 3,59 observaciones y coste 4,98; mirar primero lo más barato necesita 6,09 observaciones y coste 8,49.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="469" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo elegir la siguiente observación para aislar una falla entre diez: tres estrategias sobre 4 000</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">diagnósticos</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Observaciones hasta aislar</tspan></text><rect x="260.04" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="280.04" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Coste medio</tspan></text><line x1="354" y1="96" x2="354" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="288" x2="354" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="458.34" y1="96" x2="458.34" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="458.34" y1="288" x2="458.34" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="458.34" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.34" dy="0">2,5</tspan></text><line x1="562.68" y1="96" x2="562.68" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="562.68" y1="288" x2="562.68" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="562.68" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.68" dy="0">5</tspan></text><line x1="667.02" y1="96" x2="667.02" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="667.02" y1="288" x2="667.02" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="667.02" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.02" dy="0">7,5</tspan></text><line x1="771.36" y1="96" x2="771.36" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="771.36" y1="288" x2="771.36" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="771.36" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.36" dy="0">10</tspan></text><line x1="875.7" y1="96" x2="875.7" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="288" x2="875.7" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">12,5</tspan></text><line x1="354" y1="288" x2="875.7" y2="288" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="132.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Mayor ganancia de información</tspan></text><text x="344" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">La más barata primero</tspan></text><text x="344" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Al azar</tspan></text><rect x="354" y="102" width="149.832" height="24.5" rx="3" fill="#087f8c"/><text x="510.832" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="510.832" dy="0">3,59</tspan></text><rect x="354" y="129.5" width="207.845" height="24.5" rx="3" fill="#946512"/><text x="568.845" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="568.845" dy="0">4,98</tspan></text><rect x="354" y="166" width="254.172" height="24.5" rx="3" fill="#087f8c"/><text x="615.172" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="615.172" dy="0">6,09</tspan></text><rect x="354" y="193.5" width="354.339" height="24.5" rx="3" fill="#946512"/><text x="715.339" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="715.339" dy="0">8,49</tspan></text><rect x="354" y="230" width="242.486" height="24.5" rx="3" fill="#087f8c"/><text x="603.486" y="246.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="603.486" dy="0">5,81</tspan></text><rect x="354" y="257.5" width="504.171" height="24.5" rx="3" fill="#946512"/><text x="865.171" y="274.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="865.171" dy="0">12,08</tspan></text><text x="614.85" y="332" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Observaciones o coste (unidades)</tspan></text><rect x="10" y="346" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="370.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo más barato primero no es lo más informativo: mira señales que no separan hipótesis. Los costes de 1 a 4 por observación</tspan></text><text x="470" y="387.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">y la ausencia de ruido de medida son supuestos del autor; con medidas ruidosas hay que repetir observaciones y la ventaja</tspan></text><text x="470" y="404.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">de elegir bien se reduce.</tspan></text><text x="470" y="451.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
