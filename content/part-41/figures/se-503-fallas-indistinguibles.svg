5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="356.72" cy="101.4" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="490.54" cy="118.8" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="624.36" cy="147" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="892" cy="237" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="226" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">7,50</tspan></text><polyline points="89.08,87 222.9,97.2 356.72,115.8 490.54,150 624.36,201 892,340.2" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="81.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="217.4" y="91.7" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="351.22" y="110.3" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="485.04" y="144.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="618.86" y="195.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="886.5" y="334.7" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="329.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">5,78</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La matriz de firmas (qué señal se desvía con cada falla) es del autor y trata cada señal como binaria; sirve para contar</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ambigüedades, no para estimar probabilidades. Lo que falta importa más que cuántas faltan: la combinación de señales</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ausentes decide qué fallas se confunden.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
