<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 586" width="940" height="586" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tasa de error durante un incidente leída en registros cuando el agente pierde más líneas de error que de éxito</title><desc id="d">Barras con la tasa de error real y la observada en los registros según el modelo de pérdida de líneas: con una pérdida igual para todas las líneas la observada es 12,51 por ciento frente a 12,53 reales; si se pierde 25 o 50 por ciento de las líneas de error, la tasa observada baja a 10,20 y a 6,99 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="586" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tasa de error durante un incidente leída en registros cuando el agente pierde más líneas de error que de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">éxito</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Tasa de error real</tspan></text><rect x="199.72" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="219.72" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Tasa observada en los registros</tspan></text><line x1="71.08" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="394" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="300.667" x2="920" y2="300.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="300.667" x2="71.08" y2="300.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="305.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="207.333" x2="920" y2="207.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="207.333" x2="71.08" y2="207.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="211.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="114" x2="71.08" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="114" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">Líneas que son error (%)</text><rect x="99.3773" y="160.107" width="111.189" height="233.893" rx="3" fill="#102a43"/><text x="154.972" y="154.107" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.972" dy="0">12,53</tspan></text><rect x="214.567" y="160.48" width="111.189" height="233.52" rx="3" fill="#c0432f"/><text x="270.161" y="154.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.161" dy="0">12,51</tspan></text><text x="212.567" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Pérdida igual para todas las líneas</tspan></text><rect x="382.351" y="160.107" width="111.189" height="233.893" rx="3" fill="#102a43"/><text x="437.945" y="154.107" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.945" dy="0">12,53</tspan></text><rect x="497.54" y="203.6" width="111.189" height="190.4" rx="3" fill="#c0432f"/><text x="553.135" y="197.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.135" dy="0">10,20</tspan></text><text x="495.54" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Pérdida de 25 % en las líneas de</tspan></text><text x="495.54" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">error durante el incidente</tspan></text><rect x="665.324" y="160.107" width="111.189" height="233.893" rx="3" fill="#102a43"/><text x="720.919" y="154.107" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.919" dy="0">12,53</tspan></text><rect x="780.513" y="263.52" width="111.189" height="130.48" rx="3" fill="#c0432f"/><text x="836.108" y="257.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.108" dy="0">6,99</tspan></text><text x="778.513" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Pérdida de 50 % en las líneas de</tspan></text><text x="778.513" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">error durante el incidente</tspan></text><rect x="10" y="463" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="487.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Se conserva más de 92 % de las líneas y la tasa de error se ve a la mitad: la pérdida depende de aquello que se mide. La</tspan></text><text x="470" y="504.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">telemetría falla justo cuando el sistema falla, y la ausencia de errores en los registros no prueba que no los haya habido.</tspan></text><text x="470" y="521.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los porcentajes de pérdida son supuestos del autor.</tspan></text><text x="470" y="568.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
