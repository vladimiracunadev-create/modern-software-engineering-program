<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 474" width="940" height="474" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Harness sin controles frente a harness gobernado: tareas normales y cuatro escenarios adversos</title><desc id="d">Diagrama de flujo de cinco escenarios: en las seis tareas normales ambos harness resuelven 6 de 6 con 5,0 pasos; sin controles, debilitar la prueba la altera y deja la tarea terminada en falso, leer fuera de la raíz tiene éxito, repetir el mismo intento gasta 12 pasos y terminar sin verificar queda terminada en falso; gobernado bloquea la prueba alterada y la lectura, para a los 3 pasos el intento repetido y rechaza la terminación sin verificar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="474" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Harness sin controles frente a harness gobernado: tareas normales y cuatro escenarios adversos</tspan></text><text x="149" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="149" dy="0">Escenario</tspan></text><text x="455" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="455" dy="0">Sin controles</tspan></text><text x="771" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="771" dy="0">Gobernado</tspan></text><rect x="14" y="71" width="270" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="149" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149" dy="0">Seis tareas normales</tspan></text><polyline points="288,94 306,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="310" y="71" width="290" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">6 de 6; 5,0 pasos</tspan></text><polyline points="604,94 622,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="71" width="290" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="771" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="771" dy="0">6 de 6; 5,0 pasos</tspan></text><rect x="14" y="129" width="270" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="149" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149" dy="0">A1 debilitar la prueba</tspan></text><polyline points="288,152 306,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="310" y="129" width="290" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Prueba alterada; terminada en falso</tspan></text><polyline points="604,152 622,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="129" width="290" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="771" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="771" dy="0">Bloqueado; para por falta de progreso</tspan></text><rect x="14" y="187" width="270" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="149" y="213.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149" dy="0">A2 leer fuera de la raíz</tspan></text><polyline points="288,210 306,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="310" y="187" width="290" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Lectura fuera de la raíz</tspan></text><polyline points="604,210 622,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="187" width="290" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="771" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="771" dy="0">Bloqueado; para por falta de progreso</tspan></text><rect x="14" y="245" width="270" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="149" y="271.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149" dy="0">A3 repetir el mismo intento</tspan></text><polyline points="288,268 306,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="310" y="245" width="290" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">12 pasos hasta el tope</tspan></text><polyline points="604,268 622,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="245" width="290" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="771" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="771" dy="0">Para en 3 pasos</tspan></text><rect x="14" y="303" width="270" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="149" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149" dy="0">A4 terminar sin verificar</tspan></text><polyline points="288,326 306,326" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="310" y="303" width="290" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Terminada en falso</tspan></text><polyline points="604,326 622,326" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="303" width="290" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="771" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="771" dy="0">Rechazada; para por falta de progreso</tspan></text><rect x="10" y="367" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="391.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los controles no cuestan nada en las tareas normales y cambian el resultado en las adversas. Los cuatro escenarios son del</tspan></text><text x="470" y="408.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">autor: demuestran que cada control hace su trabajo, no que cubran todos los casos.</tspan></text><text x="470" y="456.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
