<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 298" width="940" height="298" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mismo código, dos sistemas: sondas que se reproducen y sondas que cambian en Windows 11 y Ubuntu bajo WSL2</title><desc id="d">Barra apilada con las siete sondas comparadas entre Windows 11 con CPython 3.12.9 y Ubuntu con 3.12.3: dos son idénticas (la huella de los resultados de tiempo virtual y la conservación de un nombre con eñe) y cinco difieren (separador de línea, bytes escritos como texto, caracteres leídos con la codificación local, separador de rutas y distinción de mayúsculas en una ruta).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="298" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mismo código, dos sistemas: sondas que se reproducen y sondas que cambian en Windows 11 y Ubuntu bajo WSL2</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Idénticas</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Distintas</tspan></text><line x1="254" y1="77" x2="254" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="117" x2="254" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="409.425" y1="77" x2="409.425" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="409.425" y1="117" x2="409.425" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="409.425" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409.425" dy="0">2</tspan></text><line x1="564.85" y1="77" x2="564.85" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="564.85" y1="117" x2="564.85" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="564.85" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="564.85" dy="0">4</tspan></text><line x1="720.275" y1="77" x2="720.275" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="720.275" y1="117" x2="720.275" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="720.275" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="720.275" dy="0">6</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="117" x2="875.7" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">8</tspan></text><line x1="254" y1="117" x2="875.7" y2="117" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Sondas comparadas (7)</tspan></text><rect x="254" y="84" width="155.425" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="331.712" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="331.712" dy="0">2</tspan></text><rect x="409.425" y="84" width="388.563" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="603.706" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="603.706" dy="0">5</tspan></text><text x="804.988" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="804.988" dy="0">7</tspan></text><text x="564.85" y="161" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">Sondas</tspan></text><rect x="10" y="175" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un resultado calculado con semilla fija se reproduce en cualquier sistema; todo lo que toca el sistema de archivos o la</tspan></text><text x="470" y="216.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">codificación cambia. Declarar la codificación (utf-8) en cada lectura y escritura evita el caso del texto leído con otra.</tspan></text><text x="470" y="233.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Medición real de los dos sistemas; la huella cubre tres experimentos del paquete.</tspan></text><text x="470" y="280.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); los tiempos de reloj cambian de equipo en equipo.</tspan></text></svg>
