<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Refutaciones falsas: con el sistema sano, cuántas ventanas hacen «fallar» la hipótesis según la regla</title><desc id="d">Líneas con el porcentaje de ventanas de un sistema sano que una regla declara refutadas según la longitud de la ventana: «menor que la media» refuta alrededor de la mitad de las ventanas con cualquier longitud; «menor que la media menos tres desviaciones» refuta menos de 1 por ciento; «menor que el SLO de 96 por ciento» refuta 29 por ciento con 5 segundos y 0 con 120.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Refutaciones falsas: con el sistema sano, cuántas ventanas hacen «fallar» la hipótesis según la regla</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Menor que la media</tspan></text><rect x="199.72" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Menor que media − 3 desviaciones</tspan></text><polygon points="495,44.1 501.6,56.4 488.4,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="509" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="509" dy="0">Menor que el SLO de 96 %</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="387" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="287" x2="71.08" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="187" x2="71.08" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="87" x2="71.08" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="87" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="87" x2="89.08" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="387" x2="89.08" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">5</tspan></text><line x1="158.899" y1="87" x2="158.899" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="158.899" y1="387" x2="158.899" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="158.899" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158.899" dy="0">15</tspan></text><line x1="263.628" y1="87" x2="263.628" y2="387" stroke="#d5dde1" str