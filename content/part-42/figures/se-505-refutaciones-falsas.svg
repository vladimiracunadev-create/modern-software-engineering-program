order="stroke"><tspan x="263.628" dy="0">0,5</tspan></text><rect x="467.585" y="376.292" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="473.085" y="370.792" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="473.085" dy="0">1,0</tspan></text><rect x="886.5" y="381.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,0</tspan></text><polyline points="89.08,243.337 158.899,298.458 263.628,350.542 473.085,376.583 892,387" fill="none" stroke="#946512" stroke-width="2.4"/><polygon points="89.08,237.012 95.13,248.287 83.03,248.287" fill="#946512" stroke="#946512" stroke-width="2"/><text x="89.08" y="232.337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">28,7</tspan></text><polygon points="158.899,292.133 164.949,303.408 152.849,303.408" fill="#946512" stroke="#946512" stroke-width="2"/><text x="158.899" y="287.458" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="158.899" dy="0">17,7</tspan></text><polygon points="263.628,344.217 269.678,355.492 257.578,355.492" fill="#946512" stroke="#946512" stroke-width="2"/><text x="263.628" y="339.542" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="263.628" dy="0">7,3</tspan></text><polygon points="473.085,370.258 479.135,381.533 467.035,381.533" fill="#946512" stroke="#946512" stroke-width="2"/><text x="473.085" y="365.583" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="473.085" dy="0">2,1</tspan></text><polygon points="892,380.675 898.05,391.95 885.95,391.95" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,0</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una regla sin banda refuta la mitad de las veces por pura mala suerte y destruye la confianza en el experimento. Una regla</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con la banda medida casi nunca. Un umbral de SLO sirve con ventanas largas y es ruidoso con cortas, porque su distancia a</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la media es menor que el ruido. Las 24 ejecuciones de 240 s con 0,4 % de errores de fondo y cola larga son supuestos del</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">autor.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
