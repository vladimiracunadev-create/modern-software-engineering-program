<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 399" width="990" height="399" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos enrutadores sobre 2 000 solicitudes de cuatro intenciones según el ruido del texto</title><desc id="d">Tabla con dos enrutadores sobre 2 000 solicitudes de cuatro intenciones. Con texto limpio las palabras clave aciertan el 100,0 por ciento y el clasificador por trigramas el 94,8; con 30 por ciento de ruido las palabras clave bajan al 73,7 y dejan el 26,3 sin ruta y el clasificador baja al 92,8; con 60 por ciento las palabras clave aciertan el 47,9 y el clasificador el 90,5. Con un umbral de confianza el clasificador acierta el 100,0 por ciento de lo que acepta, que es el 53,9, el 47,8 y el 36,0 por ciento de las solicitudes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="399" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Ruido en el texto</tspan></text><rect x="270" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Palabras clave</tspan></text><rect x="500" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">Centroide de</tspan></text><text x="592" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">trigramas</tspan></text><rect x="690" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Centroide con umbral 0,35</tspan></text><rect x="10" y="56" width="254" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">0 % (solicitudes limpias)</tspan></text><rect x="270" y="56" width="224" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">100,0 %; 0,0 % sin ruta</tspan></text><rect x="500" y="56" width="184" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">94,8 %</tspan></text><rect x="690" y="56" width="284" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">53,9 % de cobertura; 100,0 % de</tspan></text><text x="832" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">acierto</tspan></text><rect x="10" y="132" width="254" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="162.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">30 % (erratas y palabras de</tspan></text><text x="137" y="178.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">relleno)</tspan></text><rect x="270" y="132" width="224" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">73,7 %; 26,3 % sin ruta</tspan></text><rect x="500" y="132" width="184" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">92,8 %</tspan></text><rect x="690" y="132" width="284" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="162.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">47,8 % de cobertura; 100,0 % de</tspan></text><text x="832" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">acierto</tspan></text><rect x="10" y="208" width="254" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="246.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">60 % (mucho ruido)</tspan></text><rect x="270" y="208" width="224" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="246.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">47,9 %; 52,1 % sin ruta</tspan></text><rect x="500" y="208" width="184" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="246.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">90,5 %</tspan></text><rect x="690" y="208" width="284" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">36,0 % de cobertura; 100,0 % de</tspan></text><text x="832" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">acierto</tspan></text><rect x="10" y="288" width="970" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="312.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Cómo leer la figura: el router de reglas no se equivoca, se queda sin ruta; el estadístico acierta más pero se equivoca sin avisar</tspan></text><text x="495" y="329.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">salvo que se le ponga umbral. Dónde deja de valer: cuatro intenciones y ocho ejemplos de entrenamiento escritos por el autor; con</tspan></text><text x="495" y="346.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">intenciones solapadas el acierto cae.</tspan></text><text x="495" y="385.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
