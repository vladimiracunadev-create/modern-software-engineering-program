x="473" y="310.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473" dy="0">4 %</tspan></text><rect x="524.167" y="285.5" width="96.3333" height="41" rx="4" fill="#0d828e" stroke="#ffffff" stroke-width="1"/><text x="572.333" y="310.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572.333" dy="0">97 %</tspan></text><rect x="623.5" y="285.5" width="96.3333" height="41" rx="4" fill="#46a0a8" stroke="#ffffff" stroke-width="1"/><text x="671.667" y="310.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="671.667" dy="0">71 %</tspan></text><rect x="722.833" y="285.5" width="96.3333" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="771" y="310.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771" dy="0">0 %</tspan></text><rect x="822.167" y="285.5" width="96.3333" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="870.333" y="310.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870.333" dy="0">0 %</tspan></text><text x="324" y="354" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="324" dy="0">0 %</tspan></text><rect x="354.62" y="342" width="30.5" height="14" fill="#dff1ee"/><rect x="384.62" y="342" width="30.5" height="14" fill="#c0e1e0"/><rect x="414.62" y="342" width="30.5" height="14" fill="#a2d0d2"/><rect x="444.62" y="342" width="30.5" height="14" fill="#83c0c4"/><rect x="474.62" y="342" width="30.5" height="14" fill="#64b0b6"/><rect x="504.62" y="342" width="30.5" height="14" fill="#45a0a8"/><rect x="534.62" y="342" width="30.5" height="14" fill="#278f9a"/><rect x="564.62" y="342" width="30.5" height="14" fill="#087f8c"/><text x="602.62" y="354" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="602.62" dy="0">100 %</tspan></text><text x="648.32" y="354" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="648.32" dy="0">más oscuro = mayor (Peticiones correctas (%))</tspan></text><rect x="10" y="370" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="394.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada configuración «declara» tiempo de espera y reintentos, y desde fuera todas se ven iguales. Con 3 semillas y 90</tspan></text><text x="470" y="411.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">peticiones por segundo, la superficie solo se distingue al inyectar. Las alternativas de D y E responden algo en lugar de</tspan></text><text x="470" y="428.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fallar, pero eso no es calidad completa. El servicio, los parámetros y las fallas son supuestos del autor.</tspan></text><text x="470" y="475.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
