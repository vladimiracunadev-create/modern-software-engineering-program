<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 493" width="940" height="493" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco clientes que declaran resiliencia frente a seis fallas: peticiones respondidas con calidad completa mientras dura la falla</title><desc id="d">Mapa de calor con el porcentaje de peticiones correctas y completas durante la falla para cinco configuraciones del cliente y seis fallas inyectadas: solo la latencia de red de 100 milisegundos no daña a ninguna; la configuración con reintentos sin pausa llega a 0 por ciento con la dependencia lenta y la configuración con espera corta y reintentos con azar cae a 0 con la dependencia lenta y con la caída del proceso; ninguna configuración sostiene la calidad completa con la dependencia lenta, la falta de respuesta y la caída del proceso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="493" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco clientes que declaran resiliencia frente a seis fallas: peticiones respondidas con calidad completa</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">mientras dura la falla</tspan></text><text x="373.667" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="373.667" dy="0">Red +100 ms</tspan></text><text x="473" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473" dy="0">Lenta +100</tspan></text><text x="473" y="96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473" dy="0">ms</tspan></text><text x="572.333" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="572.333" dy="0">30 % errores</tspan></text><text x="671.667" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="671.667" dy="0">Mitad hilos</tspan></text><text x="771" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771" dy="0">Sin</tspan></text><text x="771" y="96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771" dy="0">respuesta</tspan></text><text x="870.333" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870.333" dy="0">Caída 12 s</tspan></text><text x="314" y="134.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">A · solo espera de 5 s</tspan></text><text x="314" y="178.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">B · 3 reintentos sin pausa</tspan></text><text x="314" y="222.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">C · espera corta y reintentos con azar</tspan></text><text x="314" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">D · C con cortacircuitos sensible</tspan></text><text x="314" y="310.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">E · C con cortacircuitos calibrado</tspan></text><rect x="325.5" y="109.5" width="96.3333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="373.667" y="134.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="373.667" dy="0">100 %</tspan></text><rect x="424.833" y="109.5" width="96.3333" height="41" rx="4" fill="#58aab1" stroke="#ffffff" stroke-width="1"/><text x="473" y="134.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473" dy="0">63 %</tspan></text><rect x="524.167" y="109.5" width="96.3333" height="41" rx="4" fill="#48a1a9" stroke="#ffffff" stroke-width="1"/><text x="572.333" y="134.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="572.333" dy="0">70 %</tspan></text><rect x="623.5" y="109.5" width="96.3333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="671.667" y="134.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="671.667" dy="0">100 %</tspan></text><rect x="722.833" y="109.5" width="96.3333" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="771" y="134.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771" dy="0">0 %</tspan></text><rect x="822.167" y="109.5" width="96.3333" height="41" rx="4" fill="#bfe0e0" stroke="#ffffff" stroke-width="1"/><text x="870.333" y="134.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870.333" dy="0">15 %</tspan></text><rect x="325.5" y="153.5" width="96.3333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="373.667" y="178.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="373.667" dy="0">100 %</tspan></text><rect x="424.833" y="153.5" width="96.3333" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="473" y="178.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473" dy="0">0 %</tspan></text><rect x="524.167" y="153.5" width="96.3333" height="41" rx="4" fill="#0a808d" stroke="#ffffff" stroke-width="1"/><text x="572.333" y="178.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572.333" dy="0">99 %</tspan></text><rect x="623.5" y="153.5" width="96.3333" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="671.667" y="178.5" font