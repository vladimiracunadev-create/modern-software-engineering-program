<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 403" width="990" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Evaluador-optimizador sobre un aviso con cuatro restricciones: verificador programático frente a juez ruidoso</title><desc id="d">Tabla con el porcentaje de avisos que pasa el verificador y las generaciones medias por aviso según las iteraciones de revisión. Sin revisión pasa el 35,5 por ciento con evaluador programático y el 36,3 con juez ruidoso. Con tres iteraciones el programático llega al 97,9 por ciento con 1,92 generaciones y el juez ruidoso al 75,1 por ciento con 2,50 generaciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="403" fill="#ffffff"/><rect x="10" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="127" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="127" dy="0">Iteraciones de revisión</tspan></text><rect x="250" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Evaluador programático: pasa; generaciones</tspan></text><rect x="620" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Juez ruidoso: pasa; generaciones</tspan></text><rect x="10" y="56" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">0 (sin revisión)</tspan></text><rect x="250" y="56" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">35,5 %; 1,00</tspan></text><rect x="620" y="56" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">36,3 %; 1,00</tspan></text><rect x="10" y="114" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">1</tspan></text><rect x="250" y="114" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">77,3 %; 1,64</tspan></text><rect x="620" y="114" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">55,9 %; 1,74</tspan></text><rect x="10" y="172" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">2</tspan></text><rect x="250" y="172" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">92,8 %; 1,86</tspan></text><rect x="620" y="172" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">71,1 %; 2,18</tspan></text><rect x="10" y="230" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">3</tspan></text><rect x="250" y="230" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">97,9 %; 1,92</tspan></text><rect x="620" y="230" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">75,1 %; 2,50</tspan></text><rect x="10" y="292" width="970" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Cómo leer la figura: un evaluador que ve exactamente las fallas converge en tres vueltas; uno que se equivoca en el 30 % de las</tspan></text><text x="495" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">fallas y acusa falsas en el 15 % se estanca. Dónde deja de valer: cuatro restricciones, generador sintético que corrige lo</tspan></text><text x="495" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">señalado con probabilidad 0,80; un juez real puede ser mejor o peor.</tspan></text><text x="495" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
