<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 295" width="970" height="295" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de reloj de un repaso de entregas con un agente, con reparto fijo y con orquestador</title><desc id="d">Tabla con el tiempo de reloj en unidades de trabajo de un repaso de entregas. Con cursos de tamaño parecido un solo agente tarda 57,2, un reparto fijo entre tres trabajadores 23,1 y un orquestador que reparte primero lo más grande 20,8. Con cursos de tamaño de cola larga tarda 155,4, 87,1 y 68,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="295" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Carga</tspan></text><rect x="340" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Un solo agente</tspan></text><rect x="540" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Reparto fijo entre 3</tspan></text><rect x="760" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">Orquestador</tspan></text><rect x="10" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cursos de tamaño parecido</tspan></text><rect x="340" y="56" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">57,2</tspan></text><rect x="540" y="56" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">23,1</tspan></text><rect x="760" y="56" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">20,8</tspan></text><rect x="10" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cursos con tamaño de cola larga</tspan></text><rect x="340" y="118" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">155,4</tspan></text><rect x="540" y="118" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">87,1</tspan></text><rect x="760" y="118" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">68,5</tspan></text><rect x="10" y="184" width="950" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="208.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Cómo leer la figura: la ventaja del orquestador crece con el desequilibrio, de 10 % a 21 % menos que el reparto fijo; la</tspan></text><text x="485" y="225.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">coordinación añade dos llamadas que no están en la tabla. Dónde deja de valer: 500 repasos sintéticos con semilla 3 y trabajo</tspan></text><text x="485" y="242.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">medido en unidades, no en segundos.</tspan></text><text x="485" y="281.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
