<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 439" width="990" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué estrategia agéntica conviene según la estabilidad del entorno y el tipo de fallo</title><desc id="d">Tabla de decisión con cuatro situaciones: pasos y dependencias conocidos con entorno estable favorecen plan-and-execute; observaciones que cambian el siguiente paso favorecen ReAct; fallos recuperables y repetibles favorecen el plan con replanificación; y una lección útil para un segundo intento favorece la reflexión, siempre que exista una señal de fallo distinta del propio modelo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="439" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Situación</tspan></text><rect x="380" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Estrategia que conviene</tspan></text><rect x="600" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Por qué</tspan></text><rect x="10" y="56" width="364" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="86.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Los pasos y sus dependencias se conocen y el</tspan></text><text x="192" y="102.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">entorno es estable</tspan></text><rect x="380" y="56" width="214" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Plan-and-execute</tspan></text><rect x="600" y="56" width="374" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Una llamada de plan y ejecución barata, con</tspan></text><text x="787" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">registro de cada paso</tspan></text><rect x="10" y="132" width="364" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="162.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Cada observación puede cambiar el siguiente</tspan></text><text x="192" y="178.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">paso</tspan></text><rect x="380" y="132" width="214" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">ReAct</tspan></text><rect x="600" y="132" width="374" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="162.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">La decisión depende de lo que devolvió la</tspan></text><text x="787" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">herramienta</tspan></text><rect x="10" y="208" width="364" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="238.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">El plan falla de forma recuperable y se puede</tspan></text><text x="192" y="254.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">repetir</tspan></text><rect x="380" y="208" width="214" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="246.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Plan con replanificación</tspan></text><rect x="600" y="208" width="374" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Replanificar solo cuando una observación</tspan></text><text x="787" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">contradice el plan</tspan></text><rect x="10" y="284" width="364" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="314.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Un fallo deja una lección que sirve en el</tspan></text><text x="192" y="330.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">segundo intento</tspan></text><rect x="380" y="284" width="214" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="322.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Reflexión con verificador</tspan></text><rect x="600" y="284" width="374" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="314.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Solo si hay una señal de fallo que no sea el</tspan></text><text x="787" y="330.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">propio modelo</tspan></text><rect x="10" y="364" width="970" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="388.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Cómo leer la figura: es una guía de criterio y no una medida; lo medido está en la primera figura de la clase. Dónde deja de</tspan></text><text x="495" y="405.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">valer: en tareas de pocas herramientas la diferencia de costo es pequeña y pesa más la facilidad de depurar.</tspan></text></svg>
