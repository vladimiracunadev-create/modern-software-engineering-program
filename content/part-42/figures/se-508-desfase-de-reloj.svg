" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">90,0</tspan></text><polyline points="96.62,387 109.876,387 176.158,387 255.696,387 414.772,326.907 892,146.889" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="96.62,380.675 102.67,391.95 90.57,391.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="411" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">0,0</tspan></text><polygon points="109.876,380.675 115.926,391.95 103.826,391.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="109.876" y="411" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="109.876" dy="0">0,0</tspan></text><polygon points="176.158,380.675 182.208,391.95 170.108,391.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="176.158" y="411" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="176.158" dy="0">0,0</tspan></text><polygon points="255.696,380.675 261.746,391.95 249.646,391.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="255.696" y="411" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.696" dy="0">0,0</tspan></text><polygon points="414.772,320.582 420.822,331.857 408.722,331.857" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="414.772" y="350.907" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="414.772" dy="0">20,0</tspan></text><polygon points="892,140.564 898.05,151.839 885.95,151.839" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="170.889" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">80,0</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La fracción rechazada es (desfase − tolerancia) / duración del token: lineal y sin umbral de aviso, de modo que un desfase</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pequeño falla un poco y nadie lo investiga. El reloj atrasado produce el mismo número por la causa opuesta (tokens</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«emitidos en el futuro»). 100 000 tokens con edades uniformes son un supuesto del autor.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
