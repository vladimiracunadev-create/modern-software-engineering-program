<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Desfase de reloj en un validador de tokens de 300 s: peticiones rechazadas según el desfase y la tolerancia</title><desc id="d">Líneas con el porcentaje de tokens válidos que un validador adelantado rechaza según el desfase: sin tolerancia, 1,6 por ciento con 5 segundos, 10 con 30, 20 con 60 y 40 con 120; con tolerancia de 30 segundos no rechaza nada hasta 30 de desfase y 10 con 60; con 60 segundos de tolerancia no rechaza hasta 60.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Desfase de reloj en un validador de tokens de 300 s: peticiones rechazadas según el desfase y la tolerancia</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin tolerancia</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Tolerancia de 30 s</tspan></text><polygon points="359.28,44.1 365.88,56.4 352.68,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="373.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="373.28" dy="0">Tolerancia de 60 s</tspan>