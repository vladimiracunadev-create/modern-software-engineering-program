<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 569" width="940" height="569" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un disco que se detiene 2 s: el registro síncrono bloquea peticiones durante 10 s y el asíncrono pierde líneas</title><desc id="d">Barras con el porcentaje de peticiones que fallan en los 10 segundos siguientes al inicio de una parada de disco de 2 segundos y de líneas de registro que se pierden: el registro síncrono hace fallar 54 % de las peticiones y no pierde líneas; un búfer de 50 líneas no bloquea ninguna petición y pierde 72 %; con 200 o 1 000 no hay pérdida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="569" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un disco que se detiene 2 s: el registro síncrono bloquea peticiones durante 10 s y el asíncrono pierde</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">líneas</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Peticiones que fallan</tspan></text><rect x="222.34" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="242.34" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Líneas de registro perdidas</tspan></text><line x1="71.08" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="394" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="324" x2="920" y2="324" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="324" x2="71.08" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="328.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="254" x2="920" y2="254" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="254" x2="71.08" y2="254" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="258.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="184" x2="920" y2="184" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="184" x2="71.08" y2="184" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="188.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="114" x2="71.08" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="114" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">Porcentaje (%)</text><rect x="92.303" y="205.17" width="82.892" height="188.83" rx="3" fill="#c0432f"/><text x="133.749" y="199.17" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="133.749" dy="0">54</tspan></text><rect x="179.195" y="392" width="82.892" height="2" rx="3" fill="#946512"/><text x="220.641" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="220.641" dy="0">0</tspan></text><text x="177.195" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">Registro síncrono</tspan></text><rect x="304.533" y="392" width="82.892" height="2" rx="3" fill="#c0432f"/><text x="345.979" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="345.979" dy="0">0</tspan></text><rect x="391.425" y="141.222" width="82.892" height="252.778" rx="3" fill="#946512"/><text x="432.871" y="135.222" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.871" dy="0">72</tspan></text><text x="389.425" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">Búfer de 50 líneas</tspan></text><rect x="516.763" y="392" width="82.892" height="2" rx="3" fill="#c0432f"/><text x="558.209" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="558.209" dy="0">0</tspan></text><rect x="603.655" y="392" width="82.892" height="2" rx="3" fill="#946512"/><text x="645.101" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="645.101" dy="0">0</tspan></text><text x="601.655" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">Búfer de 200 líneas</tspan></text><rect x="728.993" y="392" width="82.892" height="2" rx="3" fill="#c0432f"/><text x="770.439" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="770.439" dy="0">0</tspan></text><rect x="815.885" y="392" width="82.892" height="2" rx="3" fill="#946512"/><text x="857.331" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.331" dy="0">0</tspan></text><text x="813.885" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">Búfer de 1 000 líneas</tspan></text><rect x="10" y="446" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="470.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El disco no falla igual según quién espere por él: si la ruta de la petición escribe y sincroniza, la parada del disco es</tspan></text><text x="470" y="487.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">una parada del servicio; si escribe en un búfer, es una pérdida acotada de evidencia justo cuando más se necesita. La</tspan></text><text x="470" y="504.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">elección es de diseño y se prueba inyectándola. 90 peticiones por segundo y 2 s de parada son supuestos del autor.</tspan></text><text x="470" y="551.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
