<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 381" width="990" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro estrategias en un entorno de avisos con contactos que faltan o estudiantes que se cambiaron de curso</title><desc id="d">Tabla con el éxito y las llamadas medias de cuatro estrategias según la tasa de sorpresas del entorno. Sin sorpresas ReAct resuelve el 90,6 por ciento con 10,4 llamadas y las otras tres el 100 por ciento con una llamada. Con 15 por ciento de sorpresas ReAct resuelve el 88,2, el plan solo el 54,2, el plan con replanificación el 94,9 con 1,6 llamadas y el plan con reflexión el 93,7 con 2,5 llamadas. Con 35 por ciento ReAct resuelve el 89,0, el plan solo el 21,1, la replanificación el 88,2 y la reflexión el 87,6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="381" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Tasa de sorpresas</tspan></text><rect x="260" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357" dy="0">ReAct</tspan></text><rect x="460" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Plan</tspan></text><rect x="600" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">Plan con</tspan></text><text x="697" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">replanificación</tspan></text><rect x="800" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="887" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">Plan con reflexión</tspan></text><rect x="10" y="56" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="83.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">0 % (el mundo es como se</tspan></text><text x="132" y="99.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">planeó)</tspan></text><rect x="260" y="56" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">90,6 %; 10,4 llamadas</tspan></text><rect x="460" y="56" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">100,0 %; 1,0</tspan></text><rect x="600" y="56" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">100,0 %; 1,0</tspan></text><rect x="800" y="56" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">100,0 %; 1,0</tspan></text><rect x="10" y="126" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">15 %</tspan></text><rect x="260" y="126" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">88,2 %; 11,1</tspan></text><rect x="460" y="126" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">54,2 %; 1,0</tspan></text><rect x="600" y="126" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">94,9 %; 1,6</tspan></text><rect x="800" y="126" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">93,7 %; 2,5</tspan></text><rect x="10" y="196" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">35 %</tspan></text><rect x="260" y="196" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">89,0 %; 11,7</tspan></text><rect x="460" y="196" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">21,1 %; 1,0</tspan></text><rect x="600" y="196" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">88,2 %; 2,3</tspan></text><rect x="800" y="196" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">87,6 %; 3,9</tspan></text><rect x="10" y="270" width="970" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Cómo leer la figura: cada celda dice solicitudes resueltas y llamadas medias. Dónde deja de valer: 3 000 episodios con semilla 8,</tspan></text><text x="495" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">5 % de decisiones equivocadas y 1 % de fatales por llamada para ReAct; las probabilidades de replanificar y reflexionar con éxito</tspan></text><text x="495" y="328.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">(0,90 y 0,85) son supuestos del autor.</tspan></text><text x="495" y="367.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
