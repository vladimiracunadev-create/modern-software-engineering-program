<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 535" width="940" height="535" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué señal mueve cada tipo de falla: la huella que deja en cuatro señales del cliente y del servicio</title><desc id="d">Mapa de calor con el tamaño del cambio de cuatro señales frente a la línea base para seis fallas: la latencia de red solo mueve el p99; la falta de respuesta mueve los errores, los intentos y el p99 pero no la utilización; los errores de la dependencia mueven los intentos; la pérdida de hilos y la lentitud suben utilización, intentos y errores; la caída de un proceso se parece a la lentitud en la huella.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="535" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué señal mueve cada tipo de falla: la huella que deja en cuatro señales del cliente y del servicio</tspan></text><text x="372.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="372.25" dy="0">Tasa de error</tspan></text><text x="528.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528.75" dy="0">p99 de las correctas</tspan></text><text x="685.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">Intentos por</tspan></text><text x="685.25" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">petición</tspan></text><text x="841.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.75" dy="0">Utilización del</tspan></text><text x="841.75" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.75" dy="0">servidor</tspan></text><text x="284" y="115.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">red: latencia +100 ms</tspan></text><text x="284" y="159.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">red: respuestas perdidas 100 %</tspan></text><text x="284" y="203.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">dependencia: 30 % de errores</tspan></text><text x="284" y="247.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">recursos: mitad de los hilos</tspan></text><text x="284" y="291.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">recursos: servicio lento +100 ms</tspan></text><text x="284" y="335.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">procesos: caída de 12 s</tspan></text><rect x="295.5" y="90.5" width="153.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="372.25" dy="0">no se mueve</tspan></text><rect x="452" y="90.5" width="153.5" height="41" rx="4" fill="#e7aea4" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528.75" dy="0">moderado</tspan></text><rect x="608.5" y="90.5" width="153.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="685.25" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">no se mueve</tspan></text><rect x="765" y="90.5" width="153.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="841.75" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.75" dy="0">no se mueve</tspan></text><rect x="295.5" y="134.5" width="153.5" height="41" rx="4" fill="#d47969" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="372.25" dy="0">grande</tspan></text><rect x="452" y="134.5" width="153.5" height="41" rx="4" fill="#d47969" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528.75" dy="0">grande</tspan></text><rect x="608.5" y="134.5" width="153.5" height="41" rx="4" fill="#d47969" stroke="#ffffff" stroke-width="1"/><text x="685.25" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">grande</tspan></text><rect x="765" y="134.5" width="153.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="841.75" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.75" dy="0">no se mueve</tspan></text><rect x="295.5" y="178.5" width="153.5" height="41" rx="4" fill="#e7aea4" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="372.25" dy="0">moderado</tspan></text><rect x="452" y="178.5" width="153.5" height="41" rx="4" fill="#e7aea4" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528.75" dy="0">moderado</tspan></text><rect x="608.5" y="178.5" width="153.5" height="41" rx="4" fill="#e7aea4" stroke="#ffffff" stroke-width="1"/><text x="685.25" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">moderado</tspan></text><rect x="765" y="178.5" width="153.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="841.75" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.75" dy="0">no se mueve</tspan></text><rect x="295.5" y="222.5" width="153.5" height="41" rx="4" fill="#d47969" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="372.25" dy="0">grande</tspan></text><rect x="452" y="222.5" width="153.5" height="41" rx="4" fill="#d47969" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528.75" dy="0">grande</tspan></text><rect x="608.5" y="222.5" width="153.5" height="41" rx="4" fill="#d47969" stroke="#ffffff" stroke-width="1"/><text x="685.25" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">grande</tspan></text><rect x="765" y="222.5" width="153.5" height="41" rx="4" fill="#e7aea4" stroke="#ffffff" stroke-width="1"/><text x="841.75" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.75" dy="0">moderado</tspan></text><rect x="295.5" y="266.5" width="153.5" height="41" rx="4" fill="#d47969" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="372.25" dy="0">grande</tspan></text><rect x="452" y="266.5" width="153.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="528.75" dy="0">sin datos</tspan></text><rect x="608.5" y="266.5" width="153.5" height="41" rx="4" fill="#d47969" stroke="#ffffff" stroke-width="1"/><text x="685.25" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">grande</tspan></text><rect x="765" y="266.5" width="153.5" height="41" rx="4" fill="#d47969" stroke="#ffffff" stroke-width="1"/><text x="841.75" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.75" dy="0">grande</tspan></text><rect x="295.5" y="310.5" width="153.5" height="41" rx="4" fill="#d47969" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="372.25" dy="0">grande</tspan></text><rect x="452" y="310.5" width="153.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="528.75" dy="0">sin datos</tspan></text><rect x="608.5" y="310.5" width="153.5" height="41" rx="4" fill="#d47969" stroke="#ffffff" stroke-width="1"/><text x="685.25" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">grande</tspan></text><rect x="765" y="310.5" width="153.5" height="41" rx="4" fill="#e7aea4" stroke="#ffffff" stroke-width="1"/><text x="841.75" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.75" dy="0">moderado</tspan></text><text x="294" y="379" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="294" dy="0">no se mueve</tspan></text><rect x="384.94" y="367" width="30.5" height="14" fill="#fbe4de"/><rect x="414.94" y="367" width="30.5" height="14" fill="#f3cdc5"/><rect x="444.94" y="367" width="30.5" height="14" fill="#eab6ac"/><rect x="474.94" y="367" width="30.5" height="14" fill="#e29f93"/><rect x="504.94" y="367" width="30.5" height="14" fill="#d9887a"/><rect x="534.94" y="367" width="30.5" height="14" fill="#d17161"/><rect x="564.94" y="367" width="30.5" height="14" fill="#c85a48"/><rect x="594.94" y="367" width="30.5" height="14" fill="#c0432f"/><text x="632.94" y="379" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="632.94" dy="0">sin datos</tspan></text><text x="708.8" y="379" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="708.8" dy="0">más oscuro = mayor (Cambio frente a la línea base (0 ninguno, 1 moderado, 2 grande, 3 sin datos))</tspan></text><rect x="10" y="395" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="419.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dos fallas distintas pueden dejar la misma huella: la lentitud de la dependencia y la caída de un proceso suben las mismas</tspan></text><text x="470" y="436.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">señales, y solo el reinicio o el tiempo las separa. La huella decide qué observar antes de inyectar y evita atribuir a la</tspan></text><text x="470" y="453.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">red lo que es saturación. Umbrales de 1,3 y 2,5 veces (p99), 1,2 y 2 (intentos) y 1,2 y 1,6 (utilización) son supuestos del</tspan></text><text x="470" y="469.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">autor.</tspan></text><text x="470" y="517.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
