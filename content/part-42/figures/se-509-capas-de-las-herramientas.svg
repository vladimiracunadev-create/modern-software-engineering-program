<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué capa toca cada herramienta: del cable al proceso y a la nube</title><desc id="d">Diagrama de cuatro capas de abajo arriba: proceso o instancia (Chaos Monkey termina instancias), red (Toxiproxy y NetworkChaos actúan sobre conexiones), nodo y contenedor (Chaos Mesh y LitmusChaos inyectan estrés, ficheros, tiempo y pods) y servicio de nube (AWS Fault Injection Service y Azure Chaos Studio actúan sobre recursos de la nube con condiciones de parada).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="10" y="14" width="190" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="57.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Servicio de nube</tspan></text><rect x="210" y="14" width="720" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="220" y="49.32" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="220" dy="0">Actúa sobre recursos del proveedor: AWS Fault Injection Service (acciones, objetivos,</tspan></text><text x="220" y="65.96" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="220" dy="0">condiciones de parada) y Azure Chaos Studio</tspan></text><rect x="10" y="110" width="190" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105" y="144.96" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="105" dy="0">Orquestador</tspan></text><text x="105" y="162.88" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="105" dy="0">(Kubernetes)</tspan></text><rect x="210" y="110" width="720" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="220" y="145.32" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="220" dy="0">Chaos Mesh y LitmusChaos declaran el experimento como recurso: PodChaos, NetworkChaos,</tspan></text><text x="220" y="161.96" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="220" dy="0">StressChaos, IOChaos, TimeChaos, DNSChaos</tspan></text><rect x="10" y="206" width="190" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="105" y="249.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="105" dy="0">Red y conexión</tspan></text><rect x="210" y="206" width="720" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="220" y="241.32" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="220" dy="0">Toxiproxy: proxy TCP con tóxicos (latencia, ancho de banda, timeout, reset_peer, packet_loss)</tspan></text><text x="220" y="257.96" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="220" dy="0">controlado por una API HTTP</tspan></text><rect x="10" y="302" width="190" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="105" y="345.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="105" dy="0">Instancia o proceso</tspan></text><rect x="210" y="302" width="720" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="220" y="345.64" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="220" dy="0">Chaos Monkey: termina instancias y contenedores al azar en producción; requiere Spinnaker</tspan></text><polyline points="105,396 105,382" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">De arriba abajo crece el control fino sobre un componente y cae el alcance sobre la plataforma.</tspan></text></svg>
