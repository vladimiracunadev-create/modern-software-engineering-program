<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 501" width="940" height="501" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres recuperadores sobre 835 fragmentos de las Partes 39 y 40 y 120 consultas sintéticas</title><desc id="d">Mapa de calor con el acierto de tres recuperadores sobre 835 fragmentos: con consultas exactas BM25 acierta en primer lugar el 98,3 por ciento, el vector por trigramas el 65,0 y el híbrido el 85,0; con erratas y raíces BM25 el 75,0, el vector el 59,2 y el híbrido el 77,5; en los cinco primeros 100,0, 80,0, 93,3 y 90,8, 77,5, 90,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="501" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres recuperadores sobre 835 fragmentos de las Partes 39 y 40 y 120 consultas sintéticas</tspan></text><text x="518" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="518" dy="0">Acierto en 1.º</tspan></text><text x="786" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="786" dy="0">Acierto en los 5 primeros</tspan></text><text x="374" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">BM25 · consultas exactas (MRR 0,992)</tspan></text><text x="374" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">Vector por trigramas · exactas (0,732)</tspan></text><text x="374" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">Híbrido por rango recíproco · exactas (0,893)</tspan></text><text x="374" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">BM25 · con erratas y raíces (0,817)</tspan></text><text x="374" y="274.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">Vector por trigramas · con erratas (0,685)</tspan></text><text x="374" y="318.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">Híbrido por rango recíproco · con erratas (0,829)</tspan></text><rect x="385.5" y="73.5" width="265" height="41" rx="4" fill="#0c818e" stroke="#ffffff" stroke-width="1"/><text x="518" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="518" dy="0">98,3 %</tspan></text><rect x="653.5" y="73.5" width="265" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="786" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="786" dy="0">100,0 %</tspan></text><rect x="385.5" y="117.5" width="265" height="41" rx="4" fill="#53a7ae" stroke="#ffffff" stroke-width="1"/><text x="518" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="518" dy="0">65,0 %</tspan></text><rect x="653.5" y="117.5" width="265" height="41" rx="4" fill="#3396a0" stroke="#ffffff" stroke-width="1"/><text x="786" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="786" dy="0">80,0 %</tspan></text><rect x="385.5" y="161.5" width="265" height="41" rx="4" fill="#28909b" stroke="#ffffff" stroke-width="1"/><text x="518" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="518" dy="0">85,0 %</tspan></text><rect x="653.5" y="161.5" width="265" height="41" rx="4" fill="#168793" stroke="#ffffff" stroke-width="1"/><text x="786" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="786" dy="0">93,3 %</tspan></text><rect x="385.5" y="205.5" width="265" height="41" rx="4" fill="#3e9ca4" stroke="#ffffff" stroke-width="1"/><text x="518" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="518" dy="0">75,0 %</tspan></text><rect x="653.5" y="205.5" width="265" height="41" rx="4" fill="#1c8995" stroke="#ffffff" stroke-width="1"/><text x="786" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="786" dy="0">90,8 %</tspan></text><rect x="385.5" y="249.5" width="265" height="41" rx="4" fill="#60aeb4" stroke="#ffffff" stroke-width="1"/><text x="518" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="518" dy="0">59,2 %</tspan></text><rect x="653.5" y="249.5" width="265" height="41" rx="4" fill="#3899a2" stroke="#ffffff" stroke-width="1"/><text x="786" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="786" dy="0">77,5 %</tspan></text><rect x="385.5" y="293.5" width="265" height="41" rx="4" fill="#3899a2" stroke="#ffffff" stroke-width="1"/><text x="518" y="318.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="518" dy="0">77,5 %</tspan></text><rect x="653.5" y="293.5" width="265" height="41" rx="4" fill="#1e8a96" stroke="#ffffff" stroke-width="1"/><text x="786" y="318.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="786" dy="0">90,0 %</tspan></text><text x="384" y="362" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="384" dy="0">0,0 %</tspan></text><rect x="429.7" y="350" width="30.5" height="14" fill="#dff1ee"/><rect x="459.7" y="350" width="30.5" height="14" fill="#c0e1e0"/><rect x="489.7" y="350" width="30.5" height="14" fill="#a2d0d2"/><rect x="519.7" y="350" width="30.5" height="14" fill="#83c0c4"/><rect x="549.7" y="350" width="30.5" height="14" fill="#64b0b6"/><rect x="579.7" y="350" width="30.5" height="14" fill="#45a0a8"/><rect x="609.7" y="350" width="30.5" height="14" fill="#278f9a"/><rect x="639.7" y="350" width="30.5" height="14" fill="#087f8c"/><text x="677.7" y="362" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="677.7" dy="0">100,0 %</tspan></text><text x="738.48" y="362" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="738.48" dy="0">más oscuro = mayor (% de acierto)</tspan></text><rect x="10" y="378" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="402.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, el MRR. Cómo leer la figura: el vector por trigramas no es un modelo semántico; es un sustituto que</tspan></text><text x="470" y="419.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">muestra el mecanismo denso sin descargar ningún modelo. Dónde deja de valer: las consultas salen del propio texto y</tspan></text><text x="470" y="436.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">favorecen la coincidencia léxica; con paráfrasis reales un modelo de embeddings cambiaría el orden.</tspan></text><text x="470" y="483.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código y corpus reales del repositorio; las consultas son sintéticas y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
