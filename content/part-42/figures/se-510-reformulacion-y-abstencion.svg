<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 441" width="990" height="441" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reformulación de consultas y abstención en una recuperación agéntica sobre el corpus propio</title><desc id="d">Tabla con tres decisiones de un sistema de recuperación. Reformular con términos de los tres mejores fragmentos movió el acierto en primer lugar de 68,3 por ciento a 66,7 con 39 de 120 consultas reformuladas, sin mejorar. Rechazar por umbral de puntuación descartó el 67 por ciento de seis consultas ajenas al corpus y el 10 por ciento de las válidas por construcción. Citar el fragmento que respalda la respuesta permite verificarla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="441" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Decisión</tspan></text><rect x="340" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Resultado medido</tspan></text><rect x="740" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="93.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Reformular con términos de los tres</tspan></text><text x="172" y="109.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">mejores fragmentos</tspan></text><rect x="340" y="56" width="394" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="93.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">Acierto en 1.º de 68,3 % a 66,7 %; 39 de 120</tspan></text><text x="537" y="109.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">consultas reformuladas</tspan></text><rect x="740" y="56" width="234" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="93.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Costó llamadas y no mejoró:</tspan></text><text x="857" y="109.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">había que medirlo</tspan></text><rect x="10" y="146" width="324" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="183.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Rechazar consultas por umbral de</tspan></text><text x="172" y="199.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">puntuación</tspan></text><rect x="340" y="146" width="394" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="175" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">67 % de las 6 consultas ajenas al corpus</tspan></text><text x="537" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">rechazadas; 10 % de las válidas rechazadas por</tspan></text><text x="537" y="208.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">construcción</tspan></text><rect x="740" y="146" width="234" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="183.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Abstenerse tiene un precio en</tspan></text><text x="857" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">consultas válidas</tspan></text><rect x="10" y="236" width="324" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="273.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Citar el fragmento que respalda la</tspan></text><text x="172" y="289.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">respuesta</tspan></text><rect x="340" y="236" width="394" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">Cada respuesta enlaza su origen</tspan></text><rect x="740" y="236" width="234" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="273.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Permite que otra persona</tspan></text><text x="857" y="289.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">verifique</tspan></text><rect x="10" y="330" width="970" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Cómo leer la figura: reformular o abstenerse son decisiones que se miden como cualquier otra. Dónde deja de valer: la</tspan></text><text x="495" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">reformulación es por retroalimentación de pseudorrelevancia y solo seis consultas ajenas al corpus; no se probó con un modelo que</tspan></text><text x="495" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">reescriba consultas.</tspan></text><text x="495" y="427.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Código y corpus reales del repositorio; las consultas son sintéticas y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
