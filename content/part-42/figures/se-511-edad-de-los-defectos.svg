<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 539" width="940" height="539" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Meses que un defecto latente pasa escondido antes de salir a la luz, según el programa de práctica</title><desc id="d">Barras con la edad media de un defecto cuando se descubre: 5,7 meses sin práctica, 5,0 con un día al año, 1,8 con un día por trimestre y 1,6 con experimentos automáticos mensuales y un día semestral.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="539" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Meses que un defecto latente pasa escondido antes de salir a la luz, según el programa de práctica</tspan></text><line x1="63.54" y1="347" x2="920" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="347" x2="63.54" y2="347" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="351.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="253.667" x2="920" y2="253.667" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="253.667" x2="63.54" y2="253.667" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="258.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="160.333" x2="920" y2="160.333" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="160.333" x2="63.54" y2="160.333" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="164.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="67" x2="63.54" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="67" x2="63.54" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 207)">Meses</text><rect x="84.9515" y="79.3637" width="171.292" height="267.636" rx="3" fill="#087f8c"/><text x="170.597" y="73.3637" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="170.597" dy="0">5,7</tspan></text><text x="170.597" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">Sin práctica</tspan></text><rect x="299.067" y="112.288" width="171.292" height="234.712" rx="3" fill="#087f8c"/><text x="384.713" y="106.288" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="384.713" dy="0">5,0</tspan></text><text x="384.713" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">Un día al año</tspan></text><rect x="513.182" y="265.254" width="171.292" height="81.7464" rx="3" fill="#087f8c"/><text x="598.828" y="259.254" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="598.828" dy="0">1,8</tspan></text><text x="598.828" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">Un día por trimestre</tspan></text><rect x="727.296" y="271.259" width="171.292" height="75.7407" rx="3" fill="#087f8c"/><text x="812.942" y="265.259" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="812.942" dy="0">1,6</tspan></text><text x="812.942" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">Automático mensual y día</tspan></text><text x="812.942" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">semestral</tspan></text><rect x="10" y="416" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="440.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La edad media baja casi en proporción a la frecuencia, y cada mes escondido es un mes con un defecto que un incidente real</tspan></text><text x="470" y="457.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">puede activar a la peor hora. Sin práctica, el 100 % de los defectos que se descubren los encuentra una persona usuaria.</tspan></text><text x="470" y="474.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las tasas de entrada y de hallazgo son supuestos del autor.</tspan></text><text x="470" y="521.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
