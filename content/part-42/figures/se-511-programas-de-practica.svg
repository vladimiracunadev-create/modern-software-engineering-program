<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro programas de práctica durante dos años: defectos latentes que quedan y defectos que se descubren en un incidente real</title><desc id="d">Barras con los defectos latentes que quedan tras 24 meses y los incidentes reales que los descubren: sin práctica quedan 12,6 y hay 11,5 incidentes; un día al año deja 3,0 y 8,7; un día trimestral, 1,1 y 3,9; experimentos automáticos mensuales con un día semestral, 1,0 y 3,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro programas de práctica durante dos años: defectos latentes que quedan y defectos que se descubren en</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">un incidente real</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Defectos latentes al final</tspan></text><rect x="260.04" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="280.04" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Incidentes reales que los descubren</tspan></text><line x1="324" y1="96" x2="324" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="352" x2="324" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="510.587" y1="96" x2="510.587" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="510.587" y1="352" x2="510.587" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="510.587" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.587" dy="0">5</tspan></text><line x1="697.173" y1="96" x2="697.173" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="697.173" y1="352" x2="697.173" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="697.173" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697.173" dy="0">10</tspan></text><line x1="883.76" y1="96" x2="883.76" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="352" x2="883.76" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">15</tspan></text><line x1="324" y1="352" x2="883.76" y2="352" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="132.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Sin práctica</tspan></text><text x="314" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Un día de práctica al año</tspan></text><text x="314" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Un día de práctica por trimestre</tspan></text><text x="314" y="316" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Experimentos automáticos mensuales y día</tspan></text><text x="314" y="333" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">semestral</tspan></text><rect x="324" y="102" width="471.815" height="24.5" rx="3" fill="#c0432f"/><text x="802.815" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802.815" dy="0">12,6</tspan></text><rect x="324" y="129.5" width="428.154" height="24.5" rx="3" fill="#946512"/><text x="759.154" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="759.154" dy="0">11,5</tspan></text><rect x="324" y="166" width="110.584" height="24.5" rx="3" fill="#c0432f"/><text x="441.584" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="441.584" dy="0">3,0</tspan></text><rect x="324" y="193.5" width="325.407" height="24.5" rx="3" fill="#946512"/><text x="656.407" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="656.407" dy="0">8,7</tspan></text><rect x="324" y="230" width="42.0442" height="24.5" rx="3" fill="#c0432f"/><text x="373.044" y="246.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="373.044" dy="0">1,1</tspan></text><rect x="324" y="257.5" width="146.16" height="24.5" rx="3" fill="#946512"/><text x="477.16" y="274.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="477.16" dy="0">3,9</tspan></text><rect x="324" y="294" width="36.6954" height="24.5" rx="3" fill="#c0432f"/><text x="367.695" y="310.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="367.695" dy="0">1,0</tspan></text><rect x="324" y="321.5" width="141.433" height="24.5" rx="3" fill="#946512"/><text x="472.433" y="338.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="472.433" dy="0">3,8</tspan></text><text x="603.88" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603.88" dy="0">Defectos o incidentes en 24 meses (media de 300 simulaciones)</tspan></text><rect x="10" y="410" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un día al año ataca el inventario acumulado, pero los defectos nuevos esperan hasta 12 meses; la frecuencia importa más que</tspan></text><text x="470" y="451.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">la intensidad. Pasar de trimestral a automático mensual apenas cambia lo que queda, porque los defectos de personas</tspan></text><text x="470" y="468.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">(alertas, runbooks, escalamiento) solo salen con personas. Entre 0 y 2 defectos nuevos por mes y 70 % de hallazgo por día</tspan></text><text x="470" y="484.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">de práctica son supuestos del autor.</tspan></text><text x="470" y="532.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
