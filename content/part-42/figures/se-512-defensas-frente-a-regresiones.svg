<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 437" width="940" height="437" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué regresiones dañinas detecta cada defensa: seis cambios que empeoran la resiliencia</title><desc id="d">Barras horizontales con las regresiones dañinas detectadas de seis: la lectura estática de la configuración detecta 5, una suite de un escenario 2, dos escenarios 3, cuatro escenarios 3 y la combinación de lectura estática y cuatro escenarios 5; el cortacircuitos sensible no lo detecta ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="437" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué regresiones dañinas detecta cada defensa: seis cambios que empeoran la resiliencia</tspan></text><line x1="344" y1="49" x2="344" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="239" x2="344" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0</tspan></text><line x1="531.98" y1="49" x2="531.98" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="531.98" y1="239" x2="531.98" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="531.98" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="531.98" dy="0">2</tspan></text><line x1="719.96" y1="49" x2="719.96" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="719.96" y1="239" x2="719.96" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="719.96" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="719.96" dy="0">4</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="239" x2="907.94" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">6</tspan></text><line x1="344" y1="239" x2="907.94" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="334" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Solo lectura estática de la configuración</tspan></text><text x="334" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Solo suite de 1 escenario (30 % de errores)</tspan></text><text x="334" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Solo suite de 2 escenarios</tspan></text><text x="334" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Solo suite de 4 escenarios</tspan></text><text x="334" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Lectura estática y suite de 4 escenarios</tspan></text><rect x="344" y="55" width="469.95" height="26" rx="3" fill="#087f8c"/><text x="820.95" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820.95" dy="0">5</tspan></text><rect x="344" y="93" width="187.98" height="26" rx="3" fill="#087f8c"/><text x="538.98" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="538.98" dy="0">2</tspan></text><rect x="344" y="131" width="281.97" height="26" rx="3" fill="#087f8c"/><text x="632.97" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="632.97" dy="0">3</tspan></text><rect x="344" y="169" width="281.97" height="26" rx="3" fill="#087f8c"/><text x="632.97" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="632.97" dy="0">3</tspan></text><rect x="344" y="207" width="469.95" height="26" rx="3" fill="#087f8c"/><text x="820.95" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820.95" dy="0">5</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="239" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="912.94" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="912.94" dy="0">6</tspan></text><text x="625.97" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="625.97" dy="0">Regresiones detectadas (de 6)</tspan></text><rect x="10" y="297" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las dos defensas fallan en lugares distintos: la lectura estática ve lo que está escrito (esperas, reintentos sin pausa,</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ausencia de cortacircuitos) y no juzga umbrales; la suite ve el comportamiento y solo el que sus escenarios expresan. El</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cambio R5 escapa a ambas y por eso la calidad completa debe ser parte del criterio. Cada escenario cuesta 1 minuto de</tspan></text><text x="470" y="371.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ejecución en el modelo.</tspan></text><text x="470" y="419.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
