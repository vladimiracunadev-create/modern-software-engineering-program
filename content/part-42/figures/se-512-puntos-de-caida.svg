<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 381" width="980" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Envíos reales de un aviso que debe salir una sola vez, según la estrategia y el punto de la caída</title><desc id="d">Tabla con los envíos reales de un aviso que debe salir una sola vez. Reiniciar desde el principio sin diario envía 1, 1, 2 y 2 según no haya caída, caída antes del efecto, tras el efecto antes del diario o tras el diario. El diario de pasos sin clave envía 1, 1, 2 y 1. El diario con clave de idempotencia envía una sola vez en los cuatro casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="381" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Estrategia</tspan></text><rect x="340" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="392" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">Sin caída</tspan></text><rect x="450" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Antes del</tspan></text><text x="522" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">efecto</tspan></text><rect x="600" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="712" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712" dy="0">Tras el efecto, antes del</tspan></text><text x="712" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712" dy="0">diario</tspan></text><rect x="830" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="897" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="897" dy="0">Tras el diario</tspan></text><rect x="10" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Reiniciar desde el principio, sin diario</tspan></text><rect x="340" y="56" width="104" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">1</tspan></text><rect x="450" y="56" width="144" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">1</tspan></text><rect x="600" y="56" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">2</tspan></text><rect x="830" y="56" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">2</tspan></text><rect x="10" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="153.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Diario de pasos, sin clave de</tspan></text><text x="172" y="169.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">idempotencia</tspan></text><rect x="340" y="126" width="104" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">1</tspan></text><rect x="450" y="126" width="144" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">1</tspan></text><rect x="600" y="126" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">2</tspan></text><rect x="830" y="126" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">1</tspan></text><rect x="10" y="196" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Diario de pasos con clave de idempotencia</tspan></text><rect x="340" y="196" width="104" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">1</tspan></text><rect x="450" y="196" width="144" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">1</tspan></text><rect x="600" y="196" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">1</tspan></text><rect x="830" y="196" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">1</tspan></text><rect x="10" y="270" width="960" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Cómo leer la figura: el envío duplicado aparece cuando el efecto ocurrió y el diario no lo supo; la clave lo neutraliza en el</tspan></text><text x="490" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">servicio. Dónde deja de valer: un solo paso con efecto externo, SQLite en memoria y un servicio simulado que respeta la clave; un</tspan></text><text x="490" y="328.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">servicio real puede no hacerlo.</tspan></text><text x="490" y="367.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Procesos, diario SQLite y mensajes reales en un directorio temporal; no se invocó ningún modelo de lenguaje.</tspan></text></svg>
