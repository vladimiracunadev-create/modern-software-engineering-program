<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Compuerta de decisión antes de inyectar: cinco preguntas, y cualquier «no» detiene el experimento</title><desc id="d">Diagrama de decisión con cinco preguntas en cascada: la hipótesis es falsable y está escrita; el radio es el mínimo que detecta el efecto; hay condiciones de aborto automáticas y reversión probada; el presupuesto de error cubre el costo máximo con margen; las personas afectadas o sus representantes están informadas y hay una persona responsable disponible. Si todas son sí, se ejecuta; si alguna es no, se corrige o se pospone.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="10" y="16" width="560" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="20" y="46.92" font-size="14" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="20" dy="0">1. ¿La hipótesis está escrita y puede refutarse?</tspan></text><rect x="590" y="16" width="340" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="760" y="46.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">No: se corrige o se pospone</tspan></text><polyline points="570,43 590,43" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="290,70 290,90" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="310" y="85" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310" dy="0">sí</tspan></text><rect x="10" y="90" width="560" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="120.92" font-size="14" text-anchor="start" font-weight="400" fill="#142231"><tspan x="20" dy="0">2. ¿El radio es el mínimo que detecta el efecto?</tspan></text><rect x="590" y="90" width="340" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="760" y="120.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">No: se corrige o se pospone</tspan></text><polyline points="570,117 590,117" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="290,144 290,164" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="310" y="159" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310" dy="0">sí</tspan></text><rect x="10" y="164" width="560" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="20" y="194.92" font-size="14" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="20" dy="0">3. ¿Hay aborto automático y la reversión se probó?</tspan></text><rect x="590" y="164" width="340" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="760" y="194.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">No: se corrige o se pospone</tspan></text><polyline points="570,191 590,191" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="290,218 290,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="310" y="233" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310" dy="0">sí</tspan></text><rect x="10" y="238" width="560" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="268.92" font-size="14" text-anchor="start" font-weight="400" fill="#142231"><tspan x="20" dy="0">4. ¿El presupuesto de error cubre el costo máximo?</tspan></text><rect x="590" y="238" width="340" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="760" y="268.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">No: se corrige o se pospone</tspan></text><polyline points="570,265 590,265" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="290,292 290,312" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="310" y="307" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310" dy="0">sí</tspan></text><rect x="10" y="312" width="560" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="20" y="342.92" font-size="14" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="20" dy="0">5. ¿Hay responsable disponible y se avisó a quien corresponde?</tspan></text><rect x="590" y="312" width="340" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="760" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">No: se corrige o se pospone</tspan></text><polyline points="570,339 590,339" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="386" width="560" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="290" y="407.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290" dy="0">Si todas son «sí»: se ejecuta con el aborto armado</tspan></text><polyline points="290,370 290,386" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="760" y="410" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="760" dy="0">La compuerta es un registro: se guarda con la evidencia.</tspan></text></svg>
