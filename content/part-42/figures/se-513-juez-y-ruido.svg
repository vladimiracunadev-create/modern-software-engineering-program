<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 425" width="990" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ruido de una evaluación: sesgo del juez, variación entre ejecuciones y traza reconstruida</title><desc id="d">Tabla con tres medidas del ruido de una evaluación. Un juez con sesgo de posición de 0,65 elige la primera respuesta el 65,5 por ciento de las veces y se contradice al cruzar el orden el 54,8. Treinta ejecuciones del mismo sistema sobre cien casos van del 55,0 al 74,0 por ciento con una desviación de 4,3 puntos. Una traza de tres tramos permite reconstruir 730 tokens de entrada, 95 de salida y 1 402 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="425" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Medida</tspan></text><rect x="340" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Resultado</tspan></text><rect x="720" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Consecuencia</tspan></text><rect x="10" y="56" width="324" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="93.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Juez con sesgo de posición 0,65 ante</tspan></text><text x="172" y="109.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">respuestas iguales</tspan></text><rect x="340" y="56" width="374" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="93.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">Elige la primera el 65,5 %; el veredicto se</tspan></text><text x="527" y="109.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">contradice al cruzar el orden el 54,8 %</tspan></text><rect x="720" y="56" width="254" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="93.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Evaluar en los dos órdenes y</tspan></text><text x="847" y="109.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">exigir coincidencia</tspan></text><rect x="10" y="146" width="324" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="183.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">30 ejecuciones del mismo sistema sobre</tspan></text><text x="172" y="199.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">100 casos</tspan></text><rect x="340" y="146" width="374" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">De 55,0 % a 74,0 %; desviación de 4,3 puntos</tspan></text><rect x="720" y="146" width="254" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="183.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Una sola ejecución no mide el</tspan></text><text x="847" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">sistema</tspan></text><rect x="10" y="236" width="324" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="273.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Traza JSONL de una ejecución de tres</tspan></text><text x="172" y="289.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">tramos</tspan></text><rect x="340" y="236" width="374" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">730 tokens de entrada, 95 de salida y 1 402 ms</tspan></text><rect x="720" y="236" width="254" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="273.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Sin traza no se atribuye costo</tspan></text><text x="847" y="289.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">ni falla</tspan></text><rect x="10" y="330" width="970" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Cómo leer la figura: cada fila es una fuente de ruido distinta y cada consecuencia es una práctica de evaluación. Dónde deja de</tspan></text><text x="495" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">valer: el sesgo y la variación son parámetros simulados; el de un juez real hay que medirlo con casos etiquetados.</tspan></text><text x="495" y="411.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
