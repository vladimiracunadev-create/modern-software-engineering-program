<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Meses que incumplen un objetivo de 99,9 % (43,2 minutos de presupuesto) según la política de experimentos</title><desc id="d">Barras con el porcentaje de meses que incumplen el objetivo y los minutos medios gastados en experimentos: 16,2 % sin experimentos y 0 minutos, 38,6 % con cuatro experimentos fijos al mes con radio de 50 por ciento y 24,0 minutos, y 16,2 % con compuerta de presupuesto y radio de 5 por ciento y 1,5 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Meses que incumplen un objetivo de 99,9 % (43,2 minutos de presupuesto) según la política de experimentos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Meses que incumplen el objetivo (%)</tspan></text><rect x="327.9" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="347.9" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="347.9" dy="0">Gasto medio en experimentos (min)</tspan></text><line x1="344" y1="77" x2="344" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="269" x2="344" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0</tspan></text><line x1="478.94" y1="77" x2="478.94" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="478.94" y1="269" x2="478.94" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="478.94" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478.94" dy="0">10</tspan></text><line x1="613.88" y1="77" x2="613.88" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="613.88" y1="269" x2="613.88" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="613.88" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="613.88" dy="0">20</tspan></text><line x1="748.82" y1="77" x2="748.82" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="748.82" y1="269" x2="748.82" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="748.82" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.82" dy="0">30</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="269" x2="883.76" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">40</tspan></text><line x1="344" y1="269" x2="883.76" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="334" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Sin experimentos</tspan></text><text x="334" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Calendario fijo: 4 al mes con radio de 50 %</tspan></text><text x="334" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Con compuerta de presupuesto: radio de 5 %</tspan></text><rect x="344" y="83" width="218.603" height="24.5" rx="3" fill="#c0432f"/><text x="569.603" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="569.603" dy="0">16,2</tspan></text><rect x="344" y="110.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="353" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353" dy="0">0,0</tspan></text><rect x="344" y="147" width="520.194" height="24.5" rx="3" fill="#c0432f"/><text x="871.194" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="871.194" dy="0">38,6</tspan></text><rect x="344" y="174.5" width="323.856" height="24.5" rx="3" fill="#087f8c"/><text x="674.856" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="674.856" dy="0">24,0</tspan></text><rect x="344" y="211" width="218.603" height="24.5" rx="3" fill="#c0432f"/><text x="569.603" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="569.603" dy="0">16,2</tspan></text><rect x="344" y="238.5" width="20.6397" height="24.5" rx="3" fill="#087f8c"/><text x="371.64" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="371.64" dy="0">1,5</tspan></text><text x="613.88" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="613.88" dy="0">Porcentaje de meses o minutos</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El calendario fijo gasta 24 de 43,2 minutos y más que duplica los meses que incumplen; la compuerta gasta 1,5 y omite 1,5</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">experimentos al mes cuando los incidentes ya consumieron la mitad del presupuesto. Los experimentos se pagan del mismo</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">presupuesto que las personas usuarias. 4 000 meses simulados y 1,2 incidentes por mes son supuestos del autor.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
