<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 586" width="940" height="586" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién carga con el daño: elegir peticiones al azar frente a elegir clientes enteros (24 experimentos con radio de 5 %)</title><desc id="d">Barras con la fracción máxima de las peticiones de un cliente expuestas a la falla en algún experimento y con los clientes que nunca se afectan: elegir peticiones al azar expone 5 por ciento de las de cada cliente y a todos por igual; elegir clientes enteros hace que un cliente sufra 100 por ciento de sus peticiones en un experimento, que 5 veces el mismo cliente sea el afectado y que 4 de 40 nunca lo sean.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="586" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién carga con el daño: elegir peticiones al azar frente a elegir clientes enteros (24 experimentos con</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">radio de 5 %)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Peticiones de un cliente expuestas por experimento (%)</tspan></text><rect x="471.16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="491.16" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="491.16" dy="0">Clientes nunca afectados en los 24 experimentos</tspan></text><line x1="78.62" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="394" x2="78.62" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="338" x2="920" y2="338" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="338" x2="78.62" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="342.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="282" x2="920" y2="282" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="282" x2="78.62" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="286.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="226" x2="920" y2="226" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="226" x2="78.62" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="230.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="170" x2="920" y2="170" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="170" x2="78.62" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="174.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="114" x2="78.62" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="114" x2="78.62" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">Porcentaje o número de clientes</text><rect x="120.689" y="380" width="166.276" height="14" rx="3" fill="#c0432f"/><text x="203.827" y="374" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="203.827" dy="0">5</tspan></text><rect x="290.965" y="392" width="166.276" height="2" rx="3" fill="#087f8c"/><text x="374.103" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374.103" dy="0">0</tspan></text><text x="288.965" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Peticiones al azar</tspan></text><rect x="541.379" y="114" width="166.276" height="280" rx="3" fill="#c0432f"/><text x="624.517" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="624.517" dy="0">100</tspan></text><rect x="711.655" y="382.8" width="166.276" height="11.2" rx="3" fill="#087f8c"/><text x="794.793" y="376.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.793" dy="0">4</tspan></text><text x="709.655" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Clientes enteros</tspan></text><rect x="10" y="446" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="470.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Elegir clientes enteros es más fácil de operar (un solo cliente, un solo dueño de la comunicación) y concentra el daño: el</tspan></text><text x="470" y="487.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cliente afectado pierde todo mientras otros nunca participan, y el cliente más pequeño aporta 0,6 % del tráfico y puede no</tspan></text><text x="470" y="504.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estar en la muestra. Equidad y representatividad pesan contra el costo de operación. 40 clientes con reparto 1/k son un</tspan></text><text x="470" y="520.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuesto del autor.</tspan></text><text x="470" y="568.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
