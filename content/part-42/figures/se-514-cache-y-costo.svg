<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 395" width="990" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo relativo de un bucle de N pasos con y sin caché del prefijo estable</title><desc id="d">Tabla con el costo relativo de un bucle según los pasos. Con un paso cuesta 3 750 sin caché y 4 500 con caché, 20 por ciento más. Con tres pasos 12 450 y 7 440, 40 por ciento menos. Con cinco 22 750 y 10 540, 54 por ciento menos. Con diez 55 500 y 18 990, 66 por ciento menos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="395" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Pasos del bucle</tspan></text><rect x="220" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">Sin caché</tspan></text><rect x="450" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Con caché</tspan></text><rect x="680" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Diferencia</tspan></text><rect x="10" y="56" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">1</tspan></text><rect x="220" y="56" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">3 750</tspan></text><rect x="450" y="56" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">4 500</tspan></text><rect x="680" y="56" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">cuesta 20 % más</tspan></text><rect x="10" y="112" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">3</tspan></text><rect x="220" y="112" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">12 450</tspan></text><rect x="450" y="112" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">7 440</tspan></text><rect x="680" y="112" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">40 % menos</tspan></text><rect x="10" y="168" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">5</tspan></text><rect x="220" y="168" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">22 750</tspan></text><rect x="450" y="168" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">10 540</tspan></text><rect x="680" y="168" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">54 % menos</tspan></text><rect x="10" y="224" width="204" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">10</tspan></text><rect x="220" y="224" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">55 500</tspan></text><rect x="450" y="224" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">18 990</tspan></text><rect x="680" y="224" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">66 % menos</tspan></text><rect x="10" y="284" width="970" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Cómo leer la figura: sin caché cada paso paga de nuevo todo el historial y el costo crece de forma cuadrática; con caché, el</tspan></text><text x="495" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">primer paso cuesta más y los siguientes mucho menos. Dónde deja de valer: las unidades son de la clase (salida cinco veces la</tspan></text><text x="495" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">entrada, lectura de caché 0,1 y escritura 1,25), no precios de ningún proveedor.</tspan></text><text x="495" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Modelo de costo propio con supuestos declarados; no son precios ni se invocó ningún modelo de lenguaje.</tspan></text></svg>
