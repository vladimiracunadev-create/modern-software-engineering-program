<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 586" width="940" height="586" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Treinta controles de seguridad (12 con eficacia de 97 % o menos) clasificados con 5, 20, 59 y 200 ensayos cada uno</title><desc id="d">Barras con el porcentaje de controles débiles que pasan todos los ensayos y de controles buenos que fallan algún ensayo: con 5 ensayos pasa 11 por ciento de los débiles y falla 0,4 de los buenos; con 20, 0,5 y 1,8; con 59, 0 y 6; con 200, 0 y 18.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="586" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Treinta controles de seguridad (12 con eficacia de 97 % o menos) clasificados con 5, 20, 59 y 200 ensayos</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">cada uno</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Controles débiles que pasan todos los ensayos (%)</tspan></text><rect x="433.46" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="453.46" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="453.46" dy="0">Controles buenos que fallan algún ensayo (%)</tspan></text><line x1="71.08" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="394" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="324" x2="920" y2="324" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="324" x2="71.08" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="328.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="254" x2="920" y2="254" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="254" x2="71.08" y2="254" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="258.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="184" x2="920" y2="184" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="184" x2="71.08" y2="184" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="188.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="114" x2="71.08" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="114" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">Porcentaje de controles (%)</text><rect x="92.303" y="237.083" width="82.892" height="156.917" rx="3" fill="#c0432f"/><text x="133.749" y="231.083" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="133.749" dy="0">11,2</tspan></text><rect x="179.195" y="388.167" width="82.892" height="5.83333" rx="3" fill="#946512"/><text x="220.641" y="382.167" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="220.641" dy="0">0,4</tspan></text><text x="177.195" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">5 ensayos por control</tspan></text><rect x="304.533" y="387" width="82.892" height="7" rx="3" fill="#c0432f"/><text x="345.979" y="381" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="345.979" dy="0">0,5</tspan></text><rect x="391.425" y="368.333" width="82.892" height="25.6667" rx="3" fill="#946512"/><text x="432.871" y="362.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.871" dy="0">1,8</tspan></text><text x="389.425" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">20 ensayos por control</tspan></text><rect x="516.763" y="392" width="82.892" height="2" rx="3" fill="#c0432f"/><text x="558.209" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="558.209" dy="0">0,0</tspan></text><rect x="603.655" y="310.194" width="82.892" height="83.8056" rx="3" fill="#946512"/><text x="645.101" y="304.194" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="645.101" dy="0">6,0</tspan></text><text x="601.655" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">59 ensayos por control</tspan></text><rect x="728.993" y="392" width="82.892" height="2" rx="3" fill="#c0432f"/><text x="770.439" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="770.439" dy="0">0,0</tspan></text><rect x="815.885" y="140.639" width="82.892" height="253.361" rx="3" fill="#946512"/><text x="857.331" y="134.639" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.331" dy="0">18,1</tspan></text><text x="813.885" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">200 ensayos por control</tspan></text><rect x="10" y="446" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="470.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Más ensayos eliminan los falsos aprobados y crean falsas alarmas: un control con 99,9 % de eficacia falla alguna vez en 200</tspan></text><text x="470" y="487.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ensayos con 18 % de probabilidad. La evidencia de cumplimiento necesita un criterio de aceptación con tolerancia y un</tspan></text><text x="470" y="504.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">procedimiento para repetir, no «cero fallas». Los 30 controles (18 de 99,9 %, 8 de 97 %, 4 de 80 %) son un supuesto del</tspan></text><text x="470" y="520.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">autor.</tspan></text><text x="470" y="568.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
