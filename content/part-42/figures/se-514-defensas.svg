<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 419" width="990" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ataques exitosos por inyección y envíos legítimos afectados según la defensa, en 4 000 solicitudes sintéticas</title><desc id="d">Tabla con cuatro defensas. Sin defensa el 19,23 por ciento de las solicitudes sufre un ataque exitoso y ningún envío legítimo se afecta. Con lista de destinatarios permitidos 3,02 por ciento y 0. Con confirmación humana 7,42 por ciento y el 25 por ciento de los envíos se retrasa. Sin canal de salida si hay contenido no confiable 0,00 por ciento y se bloquea el 49 por ciento de los envíos legítimos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="419" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Defensa</tspan></text><rect x="440" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Ataques exitosos</tspan></text><rect x="670" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Envíos legítimos afectados</tspan></text><rect x="10" y="56" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Ninguna</tspan></text><rect x="440" y="56" width="224" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">19,23 %</tspan></text><rect x="670" y="56" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0 %</tspan></text><rect x="10" y="118" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Lista de destinatarios permitidos</tspan></text><rect x="440" y="118" width="224" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">3,02 %</tspan></text><rect x="670" y="118" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0 %</tspan></text><rect x="10" y="180" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Confirmación humana antes de enviar</tspan></text><rect x="440" y="180" width="224" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">7,42 %</tspan></text><rect x="670" y="180" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">25 % se retrasa</tspan></text><rect x="10" y="242" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Sin canal de salida si hay contenido no confiable</tspan></text><rect x="440" y="242" width="224" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0,00 %</tspan></text><rect x="670" y="242" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">49 % bloqueado</tspan></text><rect x="10" y="308" width="970" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Cómo leer la figura: ninguna defensa es gratuita; la que elimina el ataque elimina también la capacidad que lo hace posible. Dónde</tspan></text><text x="495" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">deja de valer: el modelo obedece la instrucción inyectada con probabilidad 0,40 y la fatiga humana aprueba el 35 %; ambos son</tspan></text><text x="495" y="366.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">supuestos del autor.</tspan></text><text x="495" y="405.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
