<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 645" width="940" height="645" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Latencia en segundos de cadenas y paralelos de llamadas con cola larga sintética</title><desc id="d">Rangos de latencia en segundos de la mediana al percentil 99: una llamada 1,40, 3,50 y 5,11; tres en cadena 4,63, 7,98 y 10,16; cinco en cadena 7,90, 12,05 y 14,48; ocho en cadena 12,74, 17,97 y 21,00; cinco en paralelo, el máximo, mediana 2,36 y p95 4,76.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="645" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Latencia en segundos de cadenas y paralelos de llamadas con cola larga sintética</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mediana</tspan></text><polygon points="122.78,44.1 129.38,56.4 116.18,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">p95</tspan></text><polygon points="193.4,43.5 200.9,51 193.4,58.5 185.9,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="207.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="207.4" dy="0">p99</tspan></text><line x1="334" y1="77" x2="334" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="334" y1="447" x2="334" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="334" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334" dy="0">0</tspan></text><line x1="445.2" y1="77" x2="445.2" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="445.2" y1="447" x2="445.2" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="445.2" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="445.2" dy="0">5</tspan></text><line x1="556.4" y1="77" x2="556.4" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="556.4" y1="447" x2="556.4" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="556.4" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="556.4" dy="0">10</tspan></text><line x1="667.6" y1="77" x2="667.6" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="667.6" y1="447" x2="667.6" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="667.6" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.6" dy="0">15</tspan></text><line x1="778.8" y1="77" x2="778.8" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="778.8" y1="447" x2="778.8" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="778.8" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.8" dy="0">20</tspan></text><line x1="890" y1="77" x2="890" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="447" x2="890" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">25</tspan></text><line x1="334" y1="447" x2="890" y2="447" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">1 llamada</tspan></text><text x="304" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">3 llamadas en cadena</tspan></text><text x="304" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">5 llamadas en cadena</tspan></text><text x="304" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">8 llamadas en cadena</tspan></text><text x="304" y="414.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">5 llamadas en paralelo (el máximo)</tspan></text><line x1="365.136" y1="114" x2="447.646" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="358.136" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="365.136" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="365.136" dy="0">1,40</tspan></text><polygon points="411.84,105.95 419.54,120.3 404.14,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="411.84" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.84" dy="0">3,50</tspan></text><polygon points="447.646,105.25 456.396,114 447.646,122.75 438.896,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="447.646" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="447.646" dy="0">5,11</tspan></text><line x1="436.971" y1="188" x2="559.958" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="429.971" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="436.971" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="436.971" dy="0">4,63</tspan></text><polygon points="511.475,179.95 519.175,194.3 503.775,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="511.475" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="511.475" dy="0">7,98</tspan></text><polygon points="559.958,179.25 568.708,188 559.958,196.75 551.208,188" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="559.958" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="559.958" dy="0">10,16</tspan></text><line x1="509.696" y1="262" x2="656.035" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="502.696" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="509.696" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="509.696" dy="0">7,90</tspan></text><polygon points="601.992,253.95 609.692,268.3 594.292,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="601.992" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.992" dy="0">12,05</tspan></text><polygon points="656.035,253.25 664.785,262 656.035,270.75 647.285,262" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="656.035" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="656.035" dy="0">14,48</tspan></text><line x1="617.338" y1="336" x2="801.04" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="610.338" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="617.338" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617.338" dy="0">12,74</tspan></text><polygon points="733.653,327.95 741.353,342.3 725.953,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="733.653" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="733.653" dy="0">17,97</tspan></text><polygon points="801.04,327.25 809.79,336 801.04,344.75 792.29,336" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="801.04" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="801.04" dy="0">21,00</tspan></text><line x1="386.486" y1="410" x2="439.862" y2="410" stroke="#8a9aa3" stroke-width="5"/><rect x="379.486" y="403" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="386.486" y="394" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="386.486" dy="0">2,36</tspan></text><polygon points="439.862,401.95 447.562,416.3 432.162,416.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="439.862" y="439" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="439.862" dy="0">4,76</tspan></text><text x="612" y="491" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="612" dy="0">segundos</tspan></text><rect x="10" y="505" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="529.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El paralelo no tiene p99 medido y una llamada con copia de cobertura reduce el p99 de 4,89 a 2,61 s. Cómo leer la figura:</tspan></text><text x="470" y="546.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">el p95 de una cadena crece más despacio que la mediana por promediarse, pero el de ocho pasos ya supera 18 segundos; el</tspan></text><text x="470" y="563.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">paralelo espera a la más lenta. Dónde deja de valer: distribución log-normal sintética con mediana de 1,2 s y 0,2 s por</tspan></text><text x="470" y="579.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">herramienta; la cola de un proveedor real hay que medirla.</tspan></text><text x="470" y="627.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación propia con semilla fija; no se invocó ningún modelo de lenguaje.</tspan></text></svg>
