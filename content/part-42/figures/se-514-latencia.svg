<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 483" width="990" height="483" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Latencia en segundos de cadenas y paralelos de llamadas con cola larga sintética</title><desc id="d">Tabla con la latencia en segundos. Una llamada: mediana 1,40, p95 3,50 y p99 5,11. Tres en cadena: 4,63, 7,98 y 10,16. Cinco en cadena: 7,90, 12,05 y 14,48. Ocho en cadena: 12,74, 17,97 y 21,00. Cinco en paralelo, el máximo: mediana 2,36 y p95 4,76. Una llamada con copia de cobertura reduce el p99 de 4,89 a 2,61.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="483" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Estructura</tspan></text><rect x="410" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Mediana</tspan></text><rect x="560" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">p95</tspan></text><rect x="710" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">p99</tspan></text><rect x="10" y="56" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">1 llamada</tspan></text><rect x="410" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">1,40</tspan></text><rect x="560" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">3,50</tspan></text><rect x="710" y="56" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">5,11</tspan></text><rect x="10" y="108" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">3 llamadas en cadena</tspan></text><rect x="410" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">4,63</tspan></text><rect x="560" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">7,98</tspan></text><rect x="710" y="108" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">10,16</tspan></text><rect x="10" y="160" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">5 llamadas en cadena</tspan></text><rect x="410" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">7,90</tspan></text><rect x="560" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">12,05</tspan></text><rect x="710" y="160" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">14,48</tspan></text><rect x="10" y="212" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">8 llamadas en cadena</tspan></text><rect x="410" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">12,74</tspan></text><rect x="560" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">17,97</tspan></text><rect x="710" y="212" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">21,00</tspan></text><rect x="10" y="264" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="290.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">5 llamadas en paralelo (el máximo)</tspan></text><rect x="410" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">2,36</tspan></text><rect x="560" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">4,76</tspan></text><rect x="710" y="264" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">sin medir</tspan></text><rect x="10" y="316" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="342.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">1 llamada con copia de cobertura</tspan></text><rect x="410" y="316" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">sin medir</tspan></text><rect x="560" y="316" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">sin medir</tspan></text><rect x="710" y="316" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">2,61 frente a 4,89</tspan></text><rect x="10" y="372" width="970" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Cómo leer la figura: el p95 de una cadena crece más despacio que la mediana por promediarse, pero el de ocho pasos ya supera 18</tspan></text><text x="495" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">segundos; el paralelo espera a la más lenta. Dónde deja de valer: distribución log-normal sintética con mediana de 1,2 s y 0,2 s</tspan></text><text x="495" y="430.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">por herramienta; la cola de un proveedor real hay que medirla.</tspan></text><text x="495" y="469.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Simulación propia con semilla fija; no se invocó ningún modelo de lenguaje.</tspan></text></svg>
