<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un control que falla 1 vez de cada 20 (95 % de eficacia) pasa 59 ensayos seguidos solo un 5 % de las veces: probabilidad de que todos los ensayos salgan bien</title><desc id="d">Líneas con la probabilidad de que todos los ensayos salgan bien según el número de ensayos y la eficacia real del control: con eficacia 90 por ciento llega a 0,2 por ciento con 59 ensayos; con 95 por ciento, a 4,8; con 99, a 55,3; con 99,9, a 94,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un control que falla 1 vez de cada 20 (95 % de eficacia) pasa 59 ensayos seguidos solo un 5 % de las veces:</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">probabilidad de que todos los ensayos salgan bien</tspan></text><circle cx="22" cy="70" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Eficacia real de 90,0 %</tspan></text><rect x="237.42" y="64" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="257.42" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Eficacia real de 95,0 %</tspan></text><polygon points="464.84,63.1 471.44,75.4 458.24,75.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="478.84" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="478.84" dy="0">Eficacia real de 99,0 %</tspan></text><polygon points="686.26,62.5 693.76,70 686.26,77.5 678.76,70" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="700.26" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="700.26" dy="0">Eficacia real de 99,9 %</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="406" x2="78.62" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="410.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="331" x2="910" y2="331" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="331" x2="78.62" y2="331" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="335.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="256" x2="910" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="256" x2="78.62" y2="256" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="181" x2="910" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="181" x2="78.62" y2="181" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="185.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="106" x2="78.62" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="106" x2="78.62" y2="406" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="106" x2="96.62" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="406" x2="96.62" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">5</tspan></text><line x1="304.73" y1="106" x2="304.73" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="304.73" y1="406" x2="304.73" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="304.73" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="304.73" dy="0">20</tspan></text><line x1="467.13" y1="106" x2="467.13" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="467.13" y1="406" x2="467.13" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="467.13" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467.13" dy="0">59</tspan></text><line x1="650.392" y1="106" x2="650.392" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="650.392" y1="406" x2="650.392" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="650.392" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650.392" dy="0">200</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1000</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Todos salen bien (%)</text><text x="494.31" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Ensayos consecutivos (escala logarítmica) (escala logarítmica)</tspan></text><line x1="467.13" y1="106" x2="467.13" y2="406" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="472.13" y="119" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="472.13" dy="0">59</tspan></text><polyline points="96.62,228.853 304.73,369.527 467.13,405.401 650.392,406 892,406" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="228.853" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="304.73" cy="369.527" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="467.13" cy="405.401" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="650.392" cy="406" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="892" cy="406" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polyline points="96.62,173.866 304.73,298.454 467.13,391.452 650.392,405.989 892,406" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="168.366" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="299.23" y="292.954" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="461.63" y="385.952" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="644.892" y="400.489" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="886.5" y="400.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><polyline points="96.62,120.703 304.73,160.628 467.13,240.195 650.392,365.806 892,405.987" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="96.62,114.378 102.67,125.653 90.57,125.653" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="304.73,154.303 310.78,165.578 298.68,165.578" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="467.13,233.87 473.18,245.145 461.08,245.145" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="650.392,359.481 656.442,370.756 644.342,370.756" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="892,399.662 898.05,410.937 885.95,410.937" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polyline points="96.62,107.497 304.73,111.943 467.13,123.196 650.392,160.405 892,295.691" fill="none" stroke="#6b7c86" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="96.62,100.622 103.495,107.497 96.62,114.372 89.745,107.497" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><polygon points="304.73,105.068 311.605,111.943 304.73,118.818 297.855,111.943" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><polygon points="467.13,116.321 474.005,123.196 467.13,130.071 460.255,123.196" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><polygon points="650.392,153.53 657.267,160.405 650.392,167.28 643.517,160.405" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><polygon points="892,288.816 898.875,295.691 892,302.566 885.125,295.691" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 59 ensayos sin fallas se puede afirmar, con 95 % de confianza, que la tasa de fallas es inferior a 5 % (regla de tres:</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">3/59). Pocos ensayos no demuestran nada: con 5, un control que falla una de cada diez veces pasa en 59 % de los casos. Los</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ensayos son independientes e idénticos, un supuesto que los controles reales rara vez cumplen.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
