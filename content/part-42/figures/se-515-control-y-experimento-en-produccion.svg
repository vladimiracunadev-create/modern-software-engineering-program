<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="940" height="410" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un experimento en producción como una comparación: un 2 % de tráfico a un grupo de control y otro a un grupo experimental</title><desc id="d">Diagrama con el tráfico real entrando por un enrutador que envía la mayor parte a la flota normal y dos porciones pequeñas a un grupo de control y a un grupo experimental; la falla se aplica solo al experimental; un comparador mide ambos grupos y un interruptor automático detiene el experimento si el grupo experimental se degrada más que un límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="410" fill="#ffffff"/><rect x="10" y="150" width="150" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="189.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Tráfico real</tspan></text><rect x="210" y="150" width="150" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="285" y="189.2" font-size="15" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="285" dy="0">Enrutador</tspan></text><rect x="430" y="20" width="220" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="540" y="54.96" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="540" dy="0">Flota normal</tspan></text><text x="540" y="72.88" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="540" dy="0">96 % del tráfico</tspan></text><rect x="430" y="130" width="220" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="540" y="169.96" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="540" dy="0">Grupo de control</tspan></text><text x="540" y="187.88" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="540" dy="0">2 %, sin falla</tspan></text><rect x="430" y="250" width="220" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="540" y="289.96" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Grupo experimental</tspan></text><text x="540" y="307.88" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">2 %, con la falla</tspan></text><polyline points="160,185 210,185" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="360,170 430,60" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="360,185 430,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="360,200 430,295" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="720" y="130" width="210" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="825" y="161" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="825" dy="0">Comparador</tspan></text><text x="825" y="178.92" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="825" dy="0">control frente a</tspan></text><text x="825" y="196.84" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="825" dy="0">experimento</tspan></text><polyline points="650,175 720,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="650,295 685,295 685,215 720,215" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="720" y="270" width="210" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="825" y="300.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="825" dy="0">Interruptor: detiene si se</tspan></text><text x="825" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="825" dy="0">degrada más que el límite</tspan></text><polyline points="825,220 825,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="720,305 650,305" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="470" y="372" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Modelo propio; el esquema de control, experimento e interruptor lo describe Netflix para su plataforma ChAP.</tspan></text><text x="470" y="398" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Documentado por Netflix (2017); las proporciones del dibujo son ilustrativas.</tspan></text></svg>
