stroke="#a8761a" stroke-width="1.6"/><text x="470" y="514.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hay un umbral de concentración: con 5 % de peticiones lentas el servicio parece sano para A y B, y con 20 % B colapsa</tspan></text><text x="470" y="531.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">porque cada reintento retiene un hilo 340 ms. El cortacircuitos cambia calidad por supervivencia: responde siempre, pero</tspan></text><text x="470" y="548.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">abre antes y sirve la alternativa. Un experimento difuso confirmaría la hipótesis y no probaría nada sobre la escala. El</tspan></text><text x="470" y="564.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">servicio de 8 hilos y 40 ms es un supuesto del autor.</tspan></text><text x="470" y="612.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
